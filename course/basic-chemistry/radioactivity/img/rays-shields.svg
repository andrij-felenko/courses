<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 996 474.98" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="996" height="474.98" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три види випромінювання і перепони, які їх спиняють</text>
<circle cx="60.0" cy="130.0" r="20.0" fill="#fff" stroke="#c0392b" stroke-width="3.0"/>
<text x="60.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">•</text>
<text x="60.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">альфа</text>
<rect x="210.0" y="88.0" width="16.0" height="84.0" rx="2" fill="#e9edf2" stroke="#6b7280" stroke-width="1.5"/>
<text x="218.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">паперу</text>
<line x1="82.0" y1="130.0" x2="210.0" y2="130.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="252.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">застрягає тут</text>
<text x="60.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">два протони й два нейтрони — важкий уламок ядра</text>
<circle cx="60.0" cy="260.0" r="20.0" fill="#fff" stroke="#2457d6" stroke-width="3.0"/>
<text x="60.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">•</text>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">бета</text>
<rect x="460.0" y="218.0" width="34.0" height="84.0" rx="2" fill="#e9edf2" stroke="#6b7280" stroke-width="1.5"/>
<text x="477.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">алюмінію</text>
<line x1="82.0" y1="260.0" x2="460.0" y2="260.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="520.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">застрягає тут</text>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">швидкий електрон із розпаду нейтрона</text>
<circle cx="60.0" cy="390.0" r="20.0" fill="#fff" stroke="#27ae60" stroke-width="3.0"/>
<text x="60.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">•</text>
<text x="60.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">гама</text>
<rect x="760.0" y="348.0" width="70.0" height="84.0" rx="2" fill="#e9edf2" stroke="#6b7280" stroke-width="1.5"/>
<text x="813.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">свинцю</text>
<line x1="82.0" y1="390.0" x2="760.0" y2="390.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="830.0" y1="390.0" x2="900.0" y2="390.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="844.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">проходить далі за всіх</text>
<text x="60.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">промінь, а не частинка — зайва енергія збудженого ядра</text>
<text x="480.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">порядок назв (альфа, бета, гама — перші літери грецької абетки) повторює порядок пробивної сили:</tspan><tspan x="480.0" dy="16.9">альфа найважча й найповільніша, гама — це вже не частинка, а найпроникніше випромінювання</tspan></text>
</svg>