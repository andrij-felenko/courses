<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">та сама вода — і два протилежні напрямки</text>
<rect x="80.0" y="96.0" width="200.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#8fa8dd" stroke-width="1.5"/>
<text x="180.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЛІД</text>
<text x="180.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">молекули на місцях</text>
<text x="180.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порядок, енергії мінімум</text>
<rect x="400.0" y="96.0" width="200.0" height="140.0" rx="6" fill="#eef4fb" stroke="#9fb4c0" stroke-width="1.5"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВОДА</text>
<text x="500.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">тримаються купи,</text>
<text x="500.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">але ковзають одна повз одну</text>
<rect x="720.0" y="96.0" width="200.0" height="140.0" rx="6" fill="#fdecea" stroke="#dd9c96" stroke-width="1.5"/>
<text x="820.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПАРА</text>
<text x="820.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">розлетілися врізнобіч</text>
<text x="820.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розкиданості максимум</text>
<line x1="95.0" y1="292.0" x2="905.0" y2="292.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="500.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">нагріваємо — перемагає розкиданість</text>
<line x1="905.0" y1="344.0" x2="95.0" y2="344.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="500.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">охолоджуємо — перемагає енергія</text>
</svg>