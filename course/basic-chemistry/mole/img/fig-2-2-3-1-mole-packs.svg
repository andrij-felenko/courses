<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="470" fill="white"/>
<text x="480" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">моль — це «пачка» на 6×10²³ частинок</text>
<rect x="60" y="70" width="84" height="92" rx="6" fill="#f1f7fb" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="72" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#777">8</text>
<text x="102" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#222">O</text>
<text x="102" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">16</text>
<line x1="150" y1="116" x2="230" y2="116" stroke="#b3541e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#b3541e">число з таблиці =</text>
<text x="190" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#b3541e">грамів у пачці</text>
<rect x="240" y="62" width="190" height="110" rx="10" fill="#fdf6ec" stroke="#cfa86a" stroke-width="1.6"/>
<text x="335.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#7a5a1e">1 моль Оксигену O</text>
<text x="335.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">16 г</text>
<text x="335.0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#888">усередині 6×10²³ штук</text>
<rect x="460" y="62" width="190" height="110" rx="10" fill="#fdf6ec" stroke="#cfa86a" stroke-width="1.6"/>
<text x="555.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#7a5a1e">1 моль Гідрогену H</text>
<text x="555.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">1 г</text>
<text x="555.0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#888">усередині 6×10²³ штук</text>
<rect x="680" y="62" width="220" height="110" rx="10" fill="#fdf6ec" stroke="#cfa86a" stroke-width="1.6"/>
<text x="790.0" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#7a5a1e">1 моль води H₂O</text>
<text x="790.0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#222">1+1+16 = 18 г</text>
<text x="790.0" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#888">усередині 6×10²³ штук</text>
<text x="480" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">склянка води: від грамів до штук</text>
<rect x="80" y="260" width="170" height="84" rx="10" fill="#eef4f9" stroke="#9fb4c0"/>
<text x="165" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">склянка води</text>
<text x="165" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222">180 г</text>
<line x1="258" y1="302" x2="348" y2="302" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="303" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">÷ 18 г/моль</text>
<rect x="355" y="260" width="150" height="84" rx="10" fill="#eef4f9" stroke="#9fb4c0"/>
<text x="430" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#222">10 моль</text>
<line x1="513" y1="302" x2="603" y2="302" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="558" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">× 6×10²³</text>
<rect x="610" y="260" width="260" height="84" rx="10" fill="#eef4f9" stroke="#9fb4c0"/>
<text x="740" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#444">молекул у склянці</text>
<text x="740" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" font-weight="bold" fill="#a83c30">6×10²⁴</text>
<text x="480" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#555">якби всі люди Землі лічили по молекулі щосекунди —</text>
<text x="480" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#555">на одну склянку пішло б близько 24 мільйонів років</text>
</svg>
