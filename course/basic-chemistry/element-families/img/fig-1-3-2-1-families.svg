<text x="91.0" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#2f7d4f">лужні:</text>
<text x="91.0" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2f7d4f">легко віддають</text>
<text x="91.0" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#2f7d4f">свій 1 зовнішній</text>
<text x="411.0" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#7a4694">галогени:</text>
<text x="411.0" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7a4694">жадібно беруть —</text>
<text x="411.0" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#7a4694">бракує 1 до повної</text>
<text x="483.9" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="end" font-weight="normal" fill="#666">інертні: поличка повна,</text>
<text x="483.9" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="end" font-weight="normal" fill="#666">нічого не треба</text>
<text x="146.4" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#888">H — особливий, сам по собі</text>
<text x="300" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#2f7d4f">← що лівіше й нижче — то активніший метал (легше віддає)</text>
<text x="300" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7a4694">що правіше й вище (крім інертних) — то активніший неметал (легше бере) →</text>
<text x="745" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#222">одна сім'я — один характер</text>
<rect x="660" y="110" width="200" height="52" rx="8" fill="#e0f1e3" stroke="#9cc3a6"/>
<text x="692" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f7d4f">Li</text>
<text x="770" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">з водою — жваво</text>
<rect x="660" y="174" width="200" height="52" rx="8" fill="#e0f1e3" stroke="#9cc3a6"/>
<text x="692" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f7d4f">Na</text>
<text x="770" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">бурхливо, аж бігає</text>
<rect x="660" y="238" width="200" height="52" rx="8" fill="#e0f1e3" stroke="#9cc3a6"/>
<text x="692" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f7d4f">K</text>
<text x="770" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">спалахує</text>
<text x="760" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#555">той самий «зайвий» електрон —</text>
<text x="760" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#555">та сама поведінка, дедалі сміливіша</text>
