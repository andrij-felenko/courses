<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Читач</title>
<script>try{var d=document.documentElement;d.setAttribute('data-theme',localStorage.getItem('courses-theme')||'day');d.setAttribute('data-density',localStorage.getItem('courses-density')||'cozy')}catch(e){}</script>
<link rel="stylesheet" href="book.css?v=21">
<link rel="stylesheet" href="search.css?v=2">
<link rel="stylesheet" href="dense.css?v=1">
</head>
<body>

<button id="menu-btn" aria-label="Меню">☰</button>
<nav id="sidebar" aria-label="Навігація"></nav>
<div id="scrim"></div>
<main id="content"><div class="state"><div class="spinner"></div>Готуємо…</div></main>
<button id="back-top" aria-label="Догори" title="Догори">↑</button>

<noscript><div style="max-width:700px;margin:3rem auto;padding:0 1.5rem">Потрібен JavaScript.</div></noscript>

<!-- Універсальний читач: ?book=<subject> (предметна книга) або ?guide=<course> (курс) -->
<script src="scripts/bookbuild.js?v=9"></script>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var content = document.getElementById("content");
  var courseSlug = p.get("course");
  if (p.get("book")) {
    var jobs = [loadSubjectBook(p.get("book"))];
    if (courseSlug) jobs.push(loadGuide(courseSlug));
    Promise.all(jobs).then(function (arr) {
      var b = arr[0];
      if (!b) { content.innerHTML = '<div class="state error">Книгу не знайдено</div>'; return; }
      if (courseSlug && arr[1]) b.course = { slug: courseSlug, title: arr[1].title, modules: arr[1].modules || [] };
      window.BOOK = b;
      var s = document.createElement("script"); s.src = "book.js?v=20"; document.body.appendChild(s);
    });
  } else if (p.get("guide")) {
    var gslug = p.get("guide");
    if (/(^|[#&])ch=/.test(location.hash || "")) {
      // читання КОНКРЕТНОЇ статті-кроку курсу → вантажимо курс як книгу й бутимо рідер (як ?book=)
      loadGuide(gslug).then(function (g) {
        var b = g && adaptSubjectBook(g, "guide/");
        if (!b) { content.innerHTML = '<div class="state error">Курс не знайдено</div>'; return; }
        window.BOOK = b;
        var s = document.createElement("script"); s.src = "book.js?v=20"; document.body.appendChild(s);
      });
    } else {
      loadGuide(gslug).then(function (g) { renderGuide(g); });   // лендинг курсу (доріжка модулів/кроків)
    }
  } else {
    content.innerHTML = '<div class="state">Вкажи <code>?book=…</code> або <code>?guide=…</code></div>';
  }
})();
</script>
<script src="search.js?v=4"></script>
<script src="theme.js?v=1"></script>
<script src="density.js?v=1"></script>
</body>
</html>
