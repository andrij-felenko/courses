<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="940" height="310">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="310" fill="white"/>
<text x="120" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#555">потік частинок</text>
<rect x="60" y="60" width="60" height="200" rx="6" fill="#e8e8e8" stroke="#aaa"/>
<text x="90" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">джерело</text>
<rect x="556" y="50" width="9" height="220" fill="#e8c84a" stroke="#b89a1f"/>
<text x="560" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#8a6512">золота фольга — завтовшки лише в тисячі атомів</text>
<line x1="130" y1="90" x2="548" y2="90" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="566" y1="90" x2="880" y2="90" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="130" y1="130" x2="548" y2="130" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="566" y1="130" x2="880" y2="130" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="130" y1="250" x2="548" y2="250" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="566" y1="250" x2="880" y2="250" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="130" y1="170" x2="548" y2="170" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="566" y1="170" x2="880" y2="148" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="130" y1="210" x2="552" y2="210" stroke="#e05545" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="556" y1="210" x2="200" y2="282" stroke="#e05545" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="720" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#444">майже всі — наскрізь:</text>
<text x="720" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#444">атом переважно порожній</text>
<text x="330" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#a83c30">1 із тисяч відскакує: у центрі є щось</text>
<text x="330" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#a83c30">крихітне, щільне і з «плюсом»</text>
</svg>
