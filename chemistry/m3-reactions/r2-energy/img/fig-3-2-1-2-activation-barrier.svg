<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="420" fill="white"/>
<text x="480" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">чому дрова не спалахують самі: бар'єр активації</text>
<line x1="90" y1="360" x2="90" y2="70" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="70" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#444">енергія</text>
<line x1="90" y1="360" x2="900" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="880" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" font-weight="normal" fill="#444">хід реакції →</text>
<path d="M 130 200 C 260 200, 300 110, 420 110 C 540 110, 560 320, 760 320 L 850 320" fill="none" stroke="#b3541e" stroke-width="3"/>
<line x1="120" y1="200" x2="430" y2="200" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="135" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#555">дрова + кисень</text>
<line x1="430" y1="320" x2="860" y2="320" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="845" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="end" font-weight="normal" fill="#555">попіл + дим</text>
<line x1="420" y1="110" x2="420" y2="200" stroke="#d9533c" stroke-width="2"/>
<line x1="420" y1="200" x2="420" y2="116" stroke="#d9533c" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#d9533c">бар'єр: спершу треба</text>
<text x="450" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#d9533c">ВКЛАСТИ — чиркнути,</text>
<text x="450" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#d9533c">піднести сірник</text>
<line x1="800" y1="200" x2="800" y2="320" stroke="#2f9e54" stroke-width="2"/>
<line x1="800" y1="200" x2="800" y2="314" stroke="#2f9e54" stroke-width="2" marker-end="url(#arr)"/>
<text x="770" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="end" font-weight="normal" fill="#2f9e54">а потім скочується само —</text>
<text x="770" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="end" font-weight="normal" fill="#2f9e54">виділяє більше, ніж вклали</text>
<text x="480" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#777">дрова лежать роками: без поштовху через горб реакція не починається</text>
</svg>
