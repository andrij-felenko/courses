<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="380" fill="white"/>
<text x="480" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">енергія реакції — це бухгалтерія зв'язків</text>
<text x="230" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#d9533c">1. розірвати старі зв'язки</text>
<text x="230" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#d9533c">= ВКЛАСТИ енергію</text>
<rect x="120" y="120" width="220" height="60" rx="10" fill="#fbe9e4" stroke="#d9533c"/>
<line x1="150" y1="200" x2="150" y2="150" stroke="#d9533c" stroke-width="2" marker-end="url(#arr)"/>
<line x1="230" y1="200" x2="230" y2="150" stroke="#d9533c" stroke-width="2" marker-end="url(#arr)"/>
<line x1="310" y1="200" x2="310" y2="150" stroke="#d9533c" stroke-width="2" marker-end="url(#arr)"/>
<text x="230" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7a2d20">потрібен поштовх</text>
<text x="230" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#888">(як розчепити зчеплені руки)</text>
<text x="420" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#666">потім</text>
<line x1="395" y1="165" x2="455" y2="165" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
<text x="700" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#2f9e54">2. утворити нові зв'язки</text>
<text x="700" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#2f9e54">= ВИВІЛЬНИТИ енергію</text>
<rect x="590" y="120" width="220" height="60" rx="10" fill="#e4f4ea" stroke="#2f9e54"/>
<line x1="620" y1="150" x2="620" y2="200" stroke="#2f9e54" stroke-width="2" marker-end="url(#arr)"/>
<line x1="700" y1="150" x2="700" y2="200" stroke="#2f9e54" stroke-width="2" marker-end="url(#arr)"/>
<line x1="780" y1="150" x2="780" y2="200" stroke="#2f9e54" stroke-width="2" marker-end="url(#arr)"/>
<text x="700" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#888">(руки зчепилися — стало спокійніше)</text>
<line x1="80" y1="280" x2="880" y2="280" stroke="#ccc" stroke-width="1.4"/>
<text x="270" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2f9e54">вивільнилось БІЛЬШЕ, ніж вклали</text>
<text x="270" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">→ надлишок виходить теплом (екзо): горіння, грілка</text>
<text x="700" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f6f9e">вклали БІЛЬШЕ, ніж вивільнилось</text>
<text x="700" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">→ реакція тягне тепло ззовні (ендо): холодний пакет</text>
</svg>
