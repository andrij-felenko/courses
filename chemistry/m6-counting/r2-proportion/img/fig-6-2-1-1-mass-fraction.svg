<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360">
<rect width="940" height="360" fill="white"/>
<text x="470" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">масова частка: яку частину всієї маси становить речовина</text>
<rect x="120" y="80" width="130" height="204.0" rx="0" fill="#bfe0ef" stroke="#9fb4c0" stroke-width="1.4"/>
<rect x="120" y="284.0" width="130" height="36.0" rx="0" fill="#f0a93c" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="185.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#3b6f88">вода</text>
<text x="185.0" y="206.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#3b6f88">170 г</text>
<text x="185.0" y="307.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#7a5512">сіль 30 г</text>
<text x="185.0" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#444">увесь розчин = 200 г</text>
<rect x="330" y="110" width="540" height="180" rx="12" fill="#f7fafc" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="600" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f6f9e">ω = m(речовини) / m(розчину) · 100%</text>
<text x="360" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">m(розчину) = 30 + 170 = 200 г</text>
<text x="360" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#2f7d4f">ω(солі) = 30 / 200 · 100% = 15%</text>
<text x="360" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#888">× 100 — щоб дріб 0,15 став зручними 15%</text>
</svg>
