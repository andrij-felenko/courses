<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="960" height="340" fill="white"/>
<text x="480" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">розрахунок за рівнянням: грами → молі → молі → грами</text>
<rect x="40" y="90" width="190" height="92" rx="10" fill="#fdeee4" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="135" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">маса даного</text>
<text x="135" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">8 г H₂</text>
<rect x="290" y="90" width="190" height="92" rx="10" fill="#eef4fb" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="385" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">молі даного</text>
<text x="385" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">n = m/M = 4</text>
<rect x="540" y="90" width="190" height="92" rx="10" fill="#eef4fb" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="635" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">молі шуканого</text>
<text x="635" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">за рівнянням = 4</text>
<rect x="770" y="90" width="190" height="92" rx="10" fill="#e4f4ea" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="865" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">маса шуканого</text>
<text x="865" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">m = n·M = 72 г</text>
<line x1="230" y1="136" x2="288" y2="136" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="259" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#2f6f9e">÷ M</text>
<line x1="480" y1="136" x2="538" y2="136" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="509" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#a83c30">× відно-</text>
<text x="509" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#a83c30">шення</text>
<line x1="730" y1="136" x2="768" y2="136" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="749" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#2f7d4f">× M</text>
<text x="480" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">приклад: скільки грамів води з 8 г водню?   2H₂ + O₂ → 2H₂O</text>
<text x="480" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">M(H₂)=2, M(H₂O)=18 · n(H₂)=8/2=4 · відношення H₂:H₂O=2:2 → n(H₂O)=4</text>
<text x="480" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#2f7d4f">m(H₂O) = 4 · 18 = 72 г</text>
</svg>
