<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="300" fill="white"/>
<text x="470" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">моль — міст між тим, що зважуєш, і тим, що лічиш</text>
<rect x="60" y="110" width="220" height="86" rx="12" fill="#fdeee4" stroke="#9fb4c0" stroke-width="1.6"/>
<text x="170.0" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">маса</text>
<text x="170.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">грами (терези)</text>
<rect x="360" y="110" width="220" height="86" rx="12" fill="#eef4fb" stroke="#9fb4c0" stroke-width="1.6"/>
<text x="470.0" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">кількість речовини</text>
<text x="470.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">молі (n)</text>
<rect x="680" y="110" width="200" height="86" rx="12" fill="#e4f4ea" stroke="#9fb4c0" stroke-width="1.6"/>
<text x="780.0" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">число частинок</text>
<text x="780.0" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#666">штуки (N)</text>
<line x1="285" y1="140" x2="355" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f6f9e">÷ M</text>
<line x1="585" y1="140" x2="675" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="630" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f7d4f">× Nₐ</text>
<line x1="355" y1="172" x2="285" y2="172" stroke="#999" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="320" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#888">× M</text>
<line x1="675" y1="172" x2="585" y2="172" stroke="#999" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="630" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#888">÷ Nₐ</text>
<text x="470" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#555">Nₐ ≈ 6·10²³ (розмір «пачки»-моля) · M береш із таблиці</text>
</svg>
