<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="420" fill="white"/>
<text x="470" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#222">чому склад сталий: руки цілі, тож відношення завжди те саме</text>
<text x="250" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2f9e54">вода: 2 Гідрогени на 1 Оксиген</text>
<circle cx="250" cy="200" r="30" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="250" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="white">O</text>
<line x1="232" y1="218" x2="180" y2="264" stroke="#777" stroke-width="3" stroke-linecap="round"/>
<line x1="268" y1="218" x2="320" y2="264" stroke="#777" stroke-width="3" stroke-linecap="round"/>
<circle cx="170" cy="274" r="15" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
<text x="170" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">H</text>
<circle cx="330" cy="274" r="15" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
<text x="330" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">H</text>
<text x="155" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="normal" fill="#a83c30">2 руки</text>
<text x="250" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">обидві руки Оксигену зайняті —</text>
<text x="250" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">усі задоволені, склад замкнено</text>
<line x1="490" y1="60" x2="490" y2="360" stroke="#ddd" stroke-width="1.5"/>
<text x="710" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#d9533c">а «H₃O» не буває</text>
<circle cx="690" cy="200" r="30" fill="#e05545" stroke="#a83c30" stroke-width="1.5"/>
<text x="690" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="white">O</text>
<line x1="672" y1="218" x2="626" y2="260" stroke="#777" stroke-width="3" stroke-linecap="round"/>
<line x1="708" y1="218" x2="754" y2="260" stroke="#777" stroke-width="3" stroke-linecap="round"/>
<circle cx="616" cy="270" r="15" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
<text x="616" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">H</text>
<circle cx="764" cy="270" r="15" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
<text x="764" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">H</text>
<circle cx="690" cy="136" r="15" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
<text x="690" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">H</text>
<line x1="690" y1="154" x2="690" y2="166" stroke="#d9533c" stroke-width="2" marker-end="url(#arr)"/>
<text x="760" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#d9533c">третьому Гідрогену</text>
<text x="760" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#d9533c">нема за яку руку взятись</text>
<text x="840" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#d9533c">✕</text>
<text x="710" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">вільних рук в Оксигену більше нема —</text>
<text x="710" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#444">тож відношення намертво лишається 2 : 1</text>
<text x="470" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#555">ось чому в кожній молекулі — ціле, незмінне число атомів, і саме тому хімію можна РАХУВАТИ</text>
</svg>
