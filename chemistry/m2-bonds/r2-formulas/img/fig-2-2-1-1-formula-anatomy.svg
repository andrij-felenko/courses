<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="430" fill="white"/>
<text x="170" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="52" text-anchor="middle" font-weight="bold" fill="#222">H₂O</text>
<line x1="120" y1="95" x2="95" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="95" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b4a82">символ:</text>
<text x="95" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b4a82">ЯКІ атоми</text>
<line x1="163" y1="100" x2="163" y2="140" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="170" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f7d4f">індекс: СКІЛЬКИ</text>
<text x="170" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#2f7d4f">їх в одній молекулі</text>
<text x="330" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#888">читається:</text>
<text x="330" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#444">«2 Гідрогени + 1 Оксиген»</text>
<circle cx="330" cy="125" r="16.0" fill="#e05545" stroke="#a83c30" stroke-width="1.4"/>
<circle cx="308.0" cy="141.0" r="9.0" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<circle cx="352.0" cy="141.0" r="9.0" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<text x="170" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#222">CaCO₃</text>
<text x="420" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#444">1 Кальцій · 1 Карбон · 3 Оксигени</text>
<text x="420" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#888">це крейда, вапняк і накип у чайнику — одна речовина</text>
<text x="420" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#a83c30">формула каже СКЛАД, але не спосіб з'єднання</text>
<rect x="96" y="330" width="34" height="48" rx="8" fill="none" stroke="#2f7d4f" stroke-width="2"/>
<text x="170" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="40" text-anchor="middle" font-weight="bold" fill="#222">2H₂O</text>
<text x="113" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#2f7d4f">коефіцієнт:</text>
<text x="113" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#2f7d4f">скільки МОЛЕКУЛ</text>
<circle cx="300" cy="360" r="13.6" fill="#e05545" stroke="#a83c30" stroke-width="1.4"/>
<circle cx="281.3" cy="373.6" r="7.6499999999999995" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<circle cx="318.7" cy="373.6" r="7.6499999999999995" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<circle cx="380" cy="360" r="13.6" fill="#e05545" stroke="#a83c30" stroke-width="1.4"/>
<circle cx="361.3" cy="373.6" r="7.6499999999999995" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<circle cx="398.7" cy="373.6" r="7.6499999999999995" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/>
<text x="620" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">індекс — начинка «слова»,</text>
<text x="620" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">коефіцієнт — кількість «слів»</text>
</svg>
