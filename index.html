<!-- Реєстр книг: підключаємо manifest кожної книги й одразу фіксуємо посилання на неї.
     Щоб додати книгу — додай пару рядків (manifest + LIBRARY.push) за зразком. -->
<script>
  window.LIBRARY = [];
  // Захопити те, що задав щойно підвантажений manifest: новий формат — META+MODULES
  // (книга збереться у library.js); legacy — готовий BOOK. Глобали скидаємо, щоб не текли в наступну книгу.
  function __cap(o){ o.book = window.BOOK || null; o.meta = window.BOOK_META || null; o.modules = window.BOOK_MODULES || null;
    window.BOOK = window.BOOK_META = window.BOOK_MODULES = undefined; window.LIBRARY.push(o); }
</script>
