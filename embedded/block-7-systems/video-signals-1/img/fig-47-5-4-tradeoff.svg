<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Компроміс: роздільність × fps × якість проти ресурсів</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">що більше даних, то більше треба смуги, пам'яті, обчислень, батареї — й тим вища затримка</text>
<rect x="70" y="110" width="250" height="150" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="195" y="136" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ХОЧЕМО більше</text>
<text x="90" y="162" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ роздільність (деталі)</text>
<text x="90" y="186" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ частота кадрів (плавність)</text>
<text x="90" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ глибина біт (тони, колір)</text>
<line x1="328" y1="185" x2="388" y2="185" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="358" y="174" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<rect x="400" y="110" width="250" height="150" rx="12" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="525" y="136" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ПЛАТИМО</text>
<text x="420" y="162" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ смуга каналу / пам'ять</text>
<text x="420" y="186" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ обчислення (стиснення, ШІ)</text>
<text x="420" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">↑ затримка й розряд батареї</text>
<rect x="690" y="110" width="200" height="150" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="790" y="134" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">що обрати?</text>
<text x="706" y="158" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">FPV: низька ЗАТРИМКА</text>
<text x="706" y="173" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ плавність важливіші</text>
<text x="706" y="188" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">за мегапікселі</text>
<text x="706" y="203" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="706" y="218" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">МБ: баланс із бортовим</text>
<text x="706" y="233" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">обчислювачем (49.9)</text>
<rect x="120" y="300" width="720" height="58" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="324" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Сирого потоку ніхто не тягне — тож його СТИСКАЮТЬ, жертвуючи дрібкою якості заради в рази меншого обсягу.</text>
<text x="480" y="345" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Як саме — наступний розділ (48). А поки: кожен піксель і кадр має ціну в бітах.</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Роздільність і fps — не «що більше, то краще», а вибір під канал, обчислювач і задачу апарата.</text>
</svg>
