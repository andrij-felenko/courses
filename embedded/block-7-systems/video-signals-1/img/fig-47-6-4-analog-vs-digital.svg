<text x="602.4000000000001" y="343.0" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">аналог: плавно гасне</text>
<polyline points="140,294 561.6,298 588.8,396 820,396" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.4" stroke-linejoin="round"/>
<text x="330.4" y="308" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">цифра: чітко…</text>
<text x="629.5999999999999" y="382" font-size="10" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">…тоді ОБРИВ</text>
<text x="480.0" y="448" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Коли летиш «очима» камери, ліпше шумна, та жива картинка, ніж чиста, що зненацька замерзає. Тому гонщики довго трималися аналогу.</text>
