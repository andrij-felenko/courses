  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому аналоговий FPV досі живий: миттєвість і м'яка відмова</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">аналог майже без затримки й гасне поступово (шум, та видно); цифра чіткіша, але з лагом і «обривом»</text>
<rect x="70" y="108" width="380" height="128" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="260" y="134" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">АНАЛОГ</text>
<text x="90" y="160" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ майже НУЛЬ затримки (сигнал = картинка)</text>
<text x="90" y="182" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ гасне ПЛАВНО: шум, та щось видно завжди</text>
<text x="90" y="204" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ нижча чіткість (SD), завади видно</text>
<rect x="510" y="108" width="380" height="128" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="700" y="134" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЦИФРА (HD FPV)</text>
<text x="530" y="160" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ чітка HD-картинка</text>
<text x="530" y="182" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ ЛАГ: кодування → передача → декодування</text>
<text x="530" y="204" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ «обрив»: за порогом — фриз/квадрати/чорне</text>
<line x1="140" y1="282" x2="140" y2="404" stroke="#1a1a1a" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="140" y1="404" x2="820" y2="404" stroke="#1a1a1a" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="132" y="290" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">якість</text>
<text x="820" y="422" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">слабшає сигнал →</text>
