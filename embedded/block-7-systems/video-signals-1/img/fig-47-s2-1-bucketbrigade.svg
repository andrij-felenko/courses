<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Естафета зарядів: як CCD зчитує матрицю</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">замість підсилювача в кожному пікселі — заряд пересувають «відерце за відерцем» до одного виходу</text>
<text x="392" y="142" font-size="10.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">заряд зсувається праворуч, такт за тактом →</text>
