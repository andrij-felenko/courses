<text x="110" y="258" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">пікселі-відерця (заряд від світла)</text>
<line x1="768" y1="200" x2="776" y2="200" stroke="#1f4ed8" stroke-width="2.2" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<polygon points="776,174 776,226 824,200" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8" stroke-linejoin="round"/>
<text x="800" y="248" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ОДИН</text>
<text x="800" y="263" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">підсилювач</text>
<text x="480.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Як відра в пожежній естафеті: заряд кожного пікселя по черзі передають уздовж ряду до єдиного «читача» на краю.</text>
<text x="480.0" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Один підсилювач на всіх — звідси надзвичайна РІВНІСТЬ і мала шумність, але й повільність.</text>
