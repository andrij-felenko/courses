<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Кадри й поля: черезрядкова розгортка</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">спершу непарні рядки (поле 1), тоді парні (поле 2) — два поля = кадр; половина смуги</text>
<text x="160" y="110" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛЕ 1 (непарні)</text>
<rect x="80" y="124" width="160" height="150" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="86" y="130" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="86" y="152" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="86" y="174" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="86" y="196" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="86" y="218" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
