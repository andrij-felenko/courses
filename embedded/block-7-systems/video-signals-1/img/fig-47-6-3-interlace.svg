<rect x="86" y="262" width="148" height="8" rx="8" fill="#1f4ed8" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<text x="258" y="205" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="370" y="110" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛЕ 2 (парні)</text>
<rect x="290" y="124" width="160" height="150" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="296" y="141" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="296" y="163" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="296" y="185" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="296" y="207" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="296" y="229" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="296" y="251" width="148" height="8" rx="8" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<text x="468" y="205" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<text x="580" y="110" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КАДР (усі рядки)</text>
<rect x="500" y="124" width="160" height="150" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="506" y="130" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="141" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="152" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="163" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="174" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="185" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="196" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="207" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="218" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="229" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="240" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="251" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="506" y="262" width="148" height="8" rx="8" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="690" y="124" width="210" height="150" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="795" y="148" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">стандарти FPV</text>
<text x="708" y="174" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">NTSC: 525 рядків,</text>
<text x="708" y="192" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">~30 кадрів/с (60 полів)</text>
<text x="708" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="708" y="228" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">PAL: 625 рядків,</text>
<text x="708" y="246" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">25 кадрів/с (50 полів)</text>
<text x="480.0" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Поля міняються вдвічі частіше за кадри — тож око бачить плавно за половини смуги. Спадок ери, коли смуга була золотом.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Сучасні сенсори знімають прогресивно (увесь кадр), але стара черезрядковість і досі живе в аналоговому FPV.</text>
</svg>
