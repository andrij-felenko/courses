<text x="640" y="330" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ швидко, дешево, малий струм</text>
<text x="640" y="350" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ адресація як пам'ять</text>
<text x="640" y="370" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ камера на чипі (Фоссум)</text>
