<line x1="480" y1="110" x2="480" y2="412" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">CCD правив, поки цінували якість; CMOS переміг, коли знадобилися дешевизна, швидкість і батарея — тобто на дроні.</text>
