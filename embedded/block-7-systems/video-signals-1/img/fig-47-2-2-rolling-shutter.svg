<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Згортковий затвор: рядки знімаються не воднораз</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">CMOS читає рядок за рядком згори вниз — швидкий рух чи вібрація косять кадр («желе»)</text>
<text x="235.0" y="100" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ЗГОРТКОВИЙ (rolling)</text>
<rect x="110" y="110" width="250" height="230" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<polyline points="210.0,125.0 219.0,145.0 228.0,165.0 237.0,185.0 246.0,205.0 255.0,225.0 264.0,245.0 273.0,265.0 282.0,285.0 291.0,305.0 300.0,325.0" fill="none" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="6" stroke-linejoin="round"/>
<text x="235.0" y="358" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">пряма щогла виходить КОСОЮ</text>
<text x="368" y="118" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">рядки в</text>
<text x="368" y="130" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">різні миті ↓</text>
<text x="368" y="132.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t0</text>
<text x="368" y="172.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t1</text>
<text x="368" y="212.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t2</text>
<text x="368" y="252.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t3</text>
<text x="368" y="292.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t4</text>
<text x="368" y="332.0" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">t5</text>
<text x="685.0" y="100" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ГЛОБАЛЬНИЙ (global)</text>
<rect x="560" y="110" width="250" height="230" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="685.0" y1="125" x2="685.0" y2="325" stroke="#e5e7eb" stroke-width="6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="685.0" y="358" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">усі рядки воднораз → ПРЯМА</text>
<text x="480.0" y="430" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Вібрація рами й швидкий рух під згортковим затвором дають хвилясте «желе» й косі лінії —</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">це псує не лише вигляд, а й машинне бачення (одометрію). Для нього беруть глобальний затвор.</text>
</svg>
