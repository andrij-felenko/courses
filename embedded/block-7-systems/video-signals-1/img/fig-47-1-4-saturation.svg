<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Стеля й підлога пікселя: насичення та шум</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відерце має повну місткість (пересвіт) і дно шуму; корисний діапазон — між ними</text>
<rect x="80" y="120" width="130" height="210" rx="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="84" y="304" width="122" height="22" rx="3" fill="#6b7280" fill-opacity="0.2" stroke="none" stroke-width="1.6"/>
<rect x="84" y="301.76" width="122" height="24.24" rx="3" fill="#6b7280" fill-opacity="0.45" stroke="none" stroke-width="1.6"/>
<text x="145.0" y="110" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">замало (шум)</text>
<text x="145.0" y="350" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тоне у шумі → чорний провал</text>
<rect x="340" y="120" width="130" height="210" rx="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="344" y="304" width="122" height="22" rx="3" fill="#6b7280" fill-opacity="0.2" stroke="none" stroke-width="1.6"/>
<rect x="344" y="200.76" width="122" height="125.24" rx="3" fill="#0a8f3c" fill-opacity="0.45" stroke="none" stroke-width="1.6"/>
<text x="405.0" y="110" font-size="11.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">саме те</text>
<text x="405.0" y="350" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">корисний діапазон</text>
<rect x="600" y="120" width="130" height="210" rx="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="604" y="304" width="122" height="22" rx="3" fill="#6b7280" fill-opacity="0.2" stroke="none" stroke-width="1.6"/>
<rect x="604" y="124.0" width="122" height="202.0" rx="3" fill="#cc0000" fill-opacity="0.45" stroke="none" stroke-width="1.6"/>
<line x1="600" y1="116" x2="730" y2="116" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="618" y1="100" x2="618" y2="114" stroke="#cc0000" stroke-width="1.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="648" y1="100" x2="648" y2="114" stroke="#cc0000" stroke-width="1.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="678" y1="100" x2="678" y2="114" stroke="#cc0000" stroke-width="1.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="708" y1="100" x2="708" y2="114" stroke="#cc0000" stroke-width="1.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="665.0" y="92" font-size="11.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">пересвіт</text>
<text x="665.0" y="350" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">переповнення → суцільна білість</text>
<line x1="740" y1="124" x2="772" y2="124" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="776" y="128" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">стеля: повна місткість</text>
<line x1="740" y1="320" x2="772" y2="320" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="776" y="324" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">підлога: шум</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">І пересвіт, і чорний провал — це втрачені НАЗАВЖДИ деталі: там просто нема даних (динамічний діапазон — 47.4).</text>
</svg>
