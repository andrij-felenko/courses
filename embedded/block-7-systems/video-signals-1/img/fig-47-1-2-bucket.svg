  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Піксель — відерце для електронів</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">фотони наповнюють «відерце» вибитими електронами; рівень = яскравість, далі заряд → напруга → число</text>
<text x="205.0" y="60" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">фотони ↓</text>
