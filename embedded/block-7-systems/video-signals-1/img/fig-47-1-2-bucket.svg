<text x="205.0" y="190.8" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">рівень = яскравість</text>
<text x="205.0" y="340" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">піксель = відерце</text>
<line x1="278" y1="215" x2="352" y2="218" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="190" width="120" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="420" y="224" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">заряд</text>
<line x1="482" y1="218" x2="503" y2="218" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="505" y="190" width="120" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="565" y="224" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">напруга</text>
<line x1="627" y1="218" x2="648" y2="218" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="650" y="190" width="120" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.8"/>
<text x="710" y="224" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">АЦП</text>
<line x1="772" y1="218" x2="793" y2="218" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="795" y="190" width="120" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="855" y="224" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">число</text>
<text x="480.0" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Світло → електрони → заряд → напруга → число. Це число — яскравість цятки, той «світло-темно» Фарнсворта.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Відерце сліпе до кольору — лічить усі фотони підряд, тож міряє лише яскравість (колір — 47.3).</text>
