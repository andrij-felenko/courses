  <rect x="0" y="0" width="940" height="480" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Барометр: міряє тиск, а тиск падає з висотою</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">≈ 1 гПа на кожні 8 м біля землі (≈ 12 Па/м); MEMS-сенсор ловить ~10 см</text>
<line x1="120" y1="400" x2="120" y2="90" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="120" y1="400" x2="690" y2="400" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="110" y="94" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">висота</text>
<text x="686" y="418" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">тиск →</text>
