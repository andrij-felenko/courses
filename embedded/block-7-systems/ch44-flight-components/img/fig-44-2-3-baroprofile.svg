<circle cx="120.0" cy="400.0" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="130.0" y="404.0" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">рівень моря ≈ 1013 гПа</text>
<line x1="120" y1="360" x2="190" y2="360" stroke="#d98a00" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="200" y="364" font-size="11" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">≈ 1 гПа / 8 м  (≈ 12 Па/м)</text>
<rect x="710" y="96" width="200" height="110" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="724" y="122" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">MEMS-барометр:</text>
<text x="724" y="142" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">міряє абсолютний тиск,</text>
<text x="724" y="162" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">роздільність кілька Па</text>
<text x="724" y="182" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ ~10 см висоти.</text>
<rect x="710" y="224" width="200" height="120" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="724" y="250" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">1643 — Торрічеллі:</text>
<text x="724" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ртутний барометр.</text>
<text x="724" y="290" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">1648, Пюї-де-Дом:</text>
<text x="724" y="310" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">довели, що вище —</text>
<text x="724" y="330" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тиск нижчий.</text>
<text x="470.0" y="468" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Барометр дає не висоту, а тиск; висоту з нього РАХУЮТЬ. Тому він чудовий на коротких масштабах, але без якоря пливе.</text>
</svg>
