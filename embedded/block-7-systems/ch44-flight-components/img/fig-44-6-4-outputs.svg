<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500"
     viewBox="0 0 980 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="500" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Вихідний каскад: бажаний рух → мікшер → сигнал кожному виконавцю</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">мотори (через ESC) і серво — однакові «виходи»; узгодження = масштаб, реверс, трим</text>
<rect x="50" y="130" width="200" height="220" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="150" y="156" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Бажаний рух</text>
<text x="150" y="174" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(від керування, 43.1)</text>
<rect x="68" y="192" width="164" height="30" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="150" y="212" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">крен (roll)</text>
<rect x="68" y="230" width="164" height="30" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="150" y="250" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">тангаж (pitch)</text>
<rect x="68" y="268" width="164" height="30" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="150" y="288" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">курс (yaw)</text>
<rect x="68" y="306" width="164" height="30" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="150" y="326" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">загальна тяга</text>
<rect x="330" y="170" width="180" height="140" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="420" y="220" font-size="15" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">МІКШЕР</text>
<text x="420" y="244" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">розкладає за</text>
<text x="420" y="260" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">геометрією апарата</text>
<line x1="250" y1="240" x2="328" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="510" y1="240" x2="590" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="590" y="128" width="350" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="606" y="148" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">вихід 1 → ESC → мотор</text>
<text x="606" y="165" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">узгодження: масштаб · реверс · трим · failsafe</text>
<rect x="590" y="188" width="350" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="606" y="208" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">вихід 2 → ESC → мотор</text>
<text x="606" y="225" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">узгодження: масштаб · реверс · трим · failsafe</text>
<rect x="590" y="248" width="350" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="606" y="268" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">вихід 3 → серво (елерон)</text>
<text x="606" y="285" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">узгодження: масштаб · реверс · трим · failsafe</text>
<rect x="590" y="308" width="350" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="606" y="328" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">вихід 4 → серво (кермо)</text>
<text x="606" y="345" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">узгодження: масштаб · реверс · трим · failsafe</text>
<text x="490.0" y="484" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Приклад мікшування: у «літаючого крила» елевони = елерон + тангаж, змішані на два серво. Мотори й серво для контролера — просто «виходи».</text>
</svg>
