<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520"
     viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чуття апарата: який давач що міряє</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожен меряє ОДНУ фізичну величину — частково й неідеально</text>
<line x1="480" y1="270" x2="422" y2="212" stroke="#1a1a1a" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="422" cy="212" r="13" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="270" x2="538" y2="212" stroke="#1a1a1a" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="538" cy="212" r="13" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="270" x2="422" y2="328" stroke="#1a1a1a" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="422" cy="328" r="13" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="270" x2="538" y2="328" stroke="#1a1a1a" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="538" cy="328" r="13" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="480" cy="270" r="22" fill="#e3effb" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="480" y="274" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">апарат</text>
<line x1="160" y1="117" x2="430" y2="230" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="40" y="78" width="240" height="78" rx="11" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="160" y="110" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">IMU (гіро + акселерометр)</text>
<text x="160" y="134" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">прискорення, кутова швидкість</text>
<line x1="800" y1="117" x2="530" y2="230" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="680" y="78" width="240" height="78" rx="11" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="800" y="110" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Магнітометр</text>
<text x="800" y="134" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">поле Землі → курс (північ)</text>
<line x1="160" y1="287" x2="420" y2="270" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="40" y="248" width="240" height="78" rx="11" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="160" y="280" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Барометр</text>
<text x="160" y="304" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">тиск повітря → висота</text>
<line x1="800" y1="287" x2="540" y2="270" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="680" y="248" width="240" height="78" rx="11" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="800" y="280" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">GNSS-приймач</text>
<text x="800" y="304" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">положення, швидкість (з неба)</text>
<line x1="480" y1="477" x2="480" y2="320" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="438" width="240" height="78" rx="11" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="480" y="470" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Давач живлення</text>
<text x="480" y="494" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">напруга, струм → заряд</text>
<text x="480.0" y="506" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Жоден давач сам не дає «стану» апарата — їх зливають разом (Розділ 43). Тут — лише хто що відчуває.</text>
</svg>
