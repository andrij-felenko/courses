<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал серво: ширина імпульсу задає кут (класичний RC-стандарт)</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">період ~20 мс (≈50 Гц); 1000 µs — один край, 1500 — центр, 2000 — інший</text>
<line x1="50" y1="150" x2="270" y2="150" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="70,150 80,150 80,104 120.0,104 120.0,150 260,150" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<text x="160" y="172" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1000 µs</text>
<circle cx="160" cy="300" r="44" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="160" y1="300" x2="117.57359312880715" y2="257.57359312880715" stroke="#cc0000" stroke-width="4" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="160" y="370" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">-45°  (один край)</text>
<line x1="370" y1="150" x2="590" y2="150" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="390,150 400,150 400,104 460.0,104 460.0,150 580,150" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<text x="480" y="172" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1500 µs</text>
<circle cx="480" cy="300" r="44" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="480" y1="300" x2="480.0" y2="240.0" stroke="#cc0000" stroke-width="4" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="370" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">+0°  (центр)</text>
<line x1="690" y1="150" x2="910" y2="150" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="710,150 720,150 720,104 800.0,104 800.0,150 900,150" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<text x="800" y="172" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">2000 µs</text>
<circle cx="800" cy="300" r="44" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="800" y1="300" x2="842.4264068711929" y2="257.57359312880715" stroke="#cc0000" stroke-width="4" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="800" y="370" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">+45°  (інший край)</text>
<text x="480.0" y="434" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий 1–2 мс RC-сигнал слухає і простий ESC (44.5) — це десятиліттями спільна «мова» виконавчих механізмів моделей.</text>
</svg>
