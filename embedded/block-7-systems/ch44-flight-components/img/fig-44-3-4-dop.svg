<text x="470.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому апарат чекає не лише на «≥4 супутники», а й на ДОБРУ геометрію (низький HDOP) — інакше фікс є, та точність кепська.</text>
