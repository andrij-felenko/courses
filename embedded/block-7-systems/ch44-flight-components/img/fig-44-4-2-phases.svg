<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Три фази створюють обертове поле, за яким женеться ротор</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">обмотки A, B, C вмикають по черзі — сумарне поле «крутиться», магніти слідують</text>
