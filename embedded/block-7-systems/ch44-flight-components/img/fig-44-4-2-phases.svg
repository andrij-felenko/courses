<text x="914" y="230.0" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">час</text>
<text x="470" y="354" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">A · B · C зсунуті на 120° — їхня сума й дає поле, що рівномірно обертається</text>
<rect x="470" y="372" width="440" height="60" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="486" y="396" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«Безколекторний» = синхронний мотор: ротор крутиться</text>
<text x="486" y="414" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">точно в такт із полем, яке малює електроніка.</text>
<text x="480.0" y="498" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Скільки разів за оберт перемкнути фази — задають магнітні полюси ротора; більше полюсів → більший момент, менші оберти.</text>
