<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому барометр — відносний: погода зсуває «висоту»</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">справжня висота стала, а тиск повзе з фронтом — і барометр «бачить» рух, якого нема</text>
