<text x="245" y="477" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">МК ESC керує затворами (вмик/вимик)</text>
<text x="480.0" y="502" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Зараз показано один крок: HS фази A та LS фази B відкриті — струм тече A→мотор→B, а фаза C «вільна» (на ній і слухають зворотну ЕРС).</text>
