<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому самого IMU мало для курсу: гравітація «не бачить» yaw</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">нахил (крен/тангаж) міняє проєкцію g — поворот навколо вертикалі ні</text>
<rect x="40" y="80" width="280" height="300" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="180" y="104" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Крен / тангаж — видно ✓</text>
<g transform="rotate(20 180 230)">
<rect x="110" y="218" width="140" height="24" rx="6" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
</g>
<line x1="180" y1="160" x2="180" y2="310" stroke="#0a8f3c" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="192" y="310" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">g</text>
<text x="180" y="350" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">апарат нахилився → проєкція g змінилась</text>
<rect x="340" y="80" width="280" height="300" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="104" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Курс (yaw) — НЕ видно ✗</text>
<g transform="rotate(35 480 230)">
<rect x="420" y="208" width="120" height="44" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<polygon points="540,230 520,220 520,240" fill="#1f4ed8" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6" stroke-linejoin="round"/>
</g>
<circle cx="480" cy="230" r="13" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<circle cx="480" cy="230" r="3" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="480" y="260" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">g — у площину (⊙), не змінюється</text>
<text x="480" y="350" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">апарат повернувся → для g нічого не змінилось</text>
<rect x="640" y="80" width="280" height="300" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="780" y="104" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Курс дає магнітометр</text>
<circle cx="780" cy="230" r="64" fill="#fffdf5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="780" y="182" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Пн</text>
<line x1="780" y1="270" x2="780" y2="190" stroke="#cc0000" stroke-width="2.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="780" y="350" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">стрілка — по горизонтальному полю Землі</text>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Гравітація вертикальна, тож обертання навколо вертикалі їй «невидиме». Курс закриває магнітометр — тому в IMU-наборі він обов'язковий.</text>
</svg>
