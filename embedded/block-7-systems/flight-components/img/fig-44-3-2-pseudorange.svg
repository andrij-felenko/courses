  <rect x="0" y="0" width="940" height="480" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Псевдодальність: чому потрібен саме ЧЕТВЕРТИЙ супутник</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дешевий годинник приймача додає однакову похибку до всіх дальностей</text>
<rect x="141.9" y="103.7" width="16.2" height="12.6" rx="3" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<rect x="126.6" y="105.5" width="11.700000000000001" height="9.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
