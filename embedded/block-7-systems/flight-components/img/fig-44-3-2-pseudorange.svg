<rect x="831.7" y="145.5" width="11.700000000000001" height="9.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<line x1="820" y1="158" x2="470" y2="322" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="645.0" y="240.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">ρ4</text>
<circle cx="470" cy="330" r="9" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470" y="354" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">приймач</text>
<rect x="60" y="372" width="820" height="64" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="80" y="396" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">ρᵢ = (справжня відстань до Satᵢ)  +  c · Δt        ← той самий Δt для ВСІХ супутників</text>
<text x="80" y="420" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">4 супутники → 4 рівняння → 4 невідомі: x, y, z  і  Δt (похибка годинника приймача).</text>
<text x="470.0" y="470" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому «псевдо»-дальність: вона завищена на невідоме c·Δt. Четвертий супутник якраз і дає рівняння, щоб цей зсув знайти й відняти.</text>
