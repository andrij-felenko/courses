<line x1="610" y1="118" x2="470" y2="322" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="540.0" y="220.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">ρ3</text>
<rect x="811.9" y="143.7" width="16.2" height="12.6" rx="3" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
