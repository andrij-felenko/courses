<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Регулятор обертів (ESC): три роботи між контролером і мотором</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">приймає команду газу — і живить, комутує та регулює трифазний мотор</text>
<rect x="40" y="175" width="150" height="100" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="115" y="215" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Політний</text>
<text x="115" y="233" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">контролер</text>
<text x="115" y="258" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(газ кожному)</text>
<rect x="300" y="100" width="350" height="270" rx="13" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="475" y="128" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ESC</text>
<text x="475" y="146" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">крихітний комп'ютер (прошивка BLHeli / AM32)</text>
<rect x="318" y="162" width="314" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="332" y="186" font-size="12" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">1. Силові ключі</text>
<text x="332" y="208" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">3-фазний інвертор (6 MOSFET) — м'язи</text>
<rect x="318" y="232" width="314" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="332" y="256" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">2. Комутація</text>
<text x="332" y="278" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">коли перемикати — за зворотною ЕРС</text>
<rect x="318" y="302" width="314" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="332" y="326" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">3. Регулювання</text>
<text x="332" y="348" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ШІМ-шпаруватість за командою газу</text>
<rect x="760" y="175" width="160" height="100" rx="11" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="840" y="215" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">BLDC</text>
<text x="840" y="233" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<line x1="190" y1="225" x2="298" y2="225" stroke="#0a8f3c" stroke-width="2.2" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="244" y="214" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">команда</text>
<line x1="652" y1="210" x2="758" y2="210" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="705" y="200" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">3 фази</text>
<line x1="758" y1="248" x2="652" y2="248" stroke="#d98a00" stroke-width="1.8" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="705" y="264" font-size="9.5" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">зворотна ЕРС</text>
<text x="480.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Контролер не торкається фаз мотора — він лише каже ESC «скільки газу», а вся силова брудна робота лишається в ESC.</text>
</svg>
