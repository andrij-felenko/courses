<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Перше питання надійності: де ЄДИНІ точки відмови?</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">знайди частини, чия одна поломка валить усе, — і прибери або продублюй їх</text>
<rect x="50" y="92" width="420" height="280" rx="12" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="260" y="120" font-size="13.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Часто ЄДИНІ (SPOF)</text>
<text x="260" y="138" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">одна відмова — падає все</text>
<rect x="72" y="158" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="86" y="182" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗  Батарея (зазвичай одна)</text>
<rect x="72" y="208" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="86" y="232" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗  Політний контролер (один)</text>
<rect x="72" y="258" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="86" y="282" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗  Регулятор живлення логіки</text>
<rect x="72" y="308" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="86" y="332" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗  Головний джгут / роз'єм</text>
<rect x="490" y="92" width="420" height="280" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="120" font-size="13.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Зазвичай ДУБЛЮЮТЬ</text>
<text x="700" y="138" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відмова однієї — система живе</text>
<rect x="512" y="158" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="526" y="182" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓  IMU  ×2–3 (голосування, 43.2)</text>
<rect x="512" y="208" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="526" y="232" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓  Компас  ×2 · GNSS  ×1–2</text>
<rect x="512" y="258" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="526" y="282" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓  Мотори: 6–8 замість 4</text>
<rect x="512" y="308" width="376" height="38" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="526" y="332" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓  Топ-системи: 2 контролери / 2 живлення</text>
<text x="480.0" y="462" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Парадокс: дублювання додає й ваги, і нових деталей, що можуть зламатися. Тому дублюють не все підряд, а саме вузькі місця — під ставки місії.</text>
</svg>
