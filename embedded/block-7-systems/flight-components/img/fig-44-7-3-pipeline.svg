<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460"
     viewBox="0 0 980 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="460" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Поведінка за відмови: виявити → вирішити → деградувати</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">не можна зреагувати на відмову, якої не помітив, — тому виявлення найважливіше</text>
<rect x="40" y="96" width="250" height="280" rx="12" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="165" y="126" font-size="13.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1. ВИЯВИТИ</text>
<text x="58" y="160" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перехресна перевірка давачів</text>
<text x="58" y="184" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(не згодні між собою?)</text>
<text x="58" y="208" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">телеметрія ESC (мотор став?)</text>
<text x="58" y="232" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">watchdog (код завис?)</text>
<text x="58" y="256" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">моніторинг струму й температури</text>
<rect x="370" y="96" width="250" height="280" rx="12" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="495" y="126" font-size="13.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">2. ВИРІШИТИ</text>
<text x="388" y="160" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">який failsafe доречний:</text>
<text x="388" y="184" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• перейти на резерв</text>
<text x="388" y="208" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• повернутись додому (RTL)</text>
<text x="388" y="232" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• сісти / планувати</text>
<text x="388" y="256" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• роззброїти (на землі)</text>
<rect x="700" y="96" width="250" height="280" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="825" y="126" font-size="13.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">3. ДЕГРАДУВАТИ</text>
<text x="718" y="160" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">виконати реакцію:</text>
<text x="718" y="184" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">втратити трохи можливостей,</text>
<text x="718" y="208" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">а не впасти повністю.</text>
<text x="718" y="232" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Зашито заздалегідь (43.2),</text>
<text x="718" y="256" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">а не вигадано в аварії.</text>
<line x1="290" y1="236" x2="370" y2="236" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="620" y1="236" x2="700" y2="236" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="490.0" y="444" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Добра система не «ламається» — вона помічає негаразд, обирає наперед задану реакцію й м'яко втрачає частину можливостей.</text>
</svg>
