<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450"
     viewBox="0 0 940 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="450" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як оберт серво стає відхиленням керма: качалка й тяга</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">серво повертає важіль → тяга штовхає кермо → поверхня відхиляється</text>
<rect x="80" y="220" width="90" height="70" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="125" y="260" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">серво</text>
<circle cx="170" cy="240" r="6" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<line x1="170" y1="240" x2="178" y2="200" stroke="#1a1a1a" stroke-width="4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="150" y="200" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">качалка серво</text>
<polygon points="560,250 740,250 740,268 560,268" fill="#eef2ff" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
<text x="650" y="244" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">крило</text>
<circle cx="740" cy="259" r="4" fill="#cc0000" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="752" y="250" font-size="9" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">шарнір</text>
<polygon points="740,252 810,252 810,266 740,266" fill="#dbe6ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5" stroke-linejoin="round"/>
<text x="792" y="286" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">кермо</text>
<line x1="740" y1="259" x2="808" y2="232" stroke="#0a8f3c" stroke-width="2.0" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="740" y1="259" x2="808" y2="286" stroke="#0a8f3c" stroke-width="2.0" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="842" y="230" font-size="10" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="normal">↑ відхилення</text>
<text x="842" y="290" font-size="10" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="normal">↓ відхилення</text>
<line x1="748" y1="252" x2="754" y2="216" stroke="#1a1a1a" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="770" y="210" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">качалка керма</text>
<line x1="178" y1="200" x2="754" y2="216" stroke="#d98a00" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="466.0" y="188" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">тяга (пушрод)</text>
<rect x="80" y="330" width="780" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="98" y="354" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Довжина качалок задає «передачу»: довша качалка серво або коротша качалка керма — більший хід поверхні (throw).</text>
<text x="98" y="374" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Налаштування ходу й нейтралі (трим) — частина узгодження сигналу з механікою конкретного апарата.</text>
</svg>
