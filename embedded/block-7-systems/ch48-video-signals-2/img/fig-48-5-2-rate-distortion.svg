<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Біти за якість: крива з насиченням</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">квантування (48.2) — головна ручка: грубше → менше біт і гірше; тонше → більше біт; вище — все менший зиск</text>
<line x1="130" y1="370" x2="890" y2="370" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="130" y1="370" x2="130" y2="120" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="885" y="392" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">бітрейт (Мбіт/с) →</text>
<text x="136" y="114" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">↑ якість</text>
<polyline points="130,370 175,312 235,262 315,222 415,194 535,174 680,162 840,156" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="175" cy="312" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="192" y="314" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">мало біт: блочно, артефакти (48.2)</text>
<circle cx="315" cy="222" r="6.5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="332" y="214" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">«коліно»: розумний вибір</text>
<text x="332" y="230" font-size="9" fill="#15803d" text-anchor="start" font-weight="normal" font-style="normal">(найбільше якості за біт)</text>
<circle cx="680" cy="162" r="5" fill="#6b7280" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="680" y="140" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">багато біт: зиск дрібніє</text>
<text x="680" y="152" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(око вже не бачить різниці)</text>
<rect x="560" y="250" width="336" height="104" rx="10" fill="#f8fafc" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="728" y="274" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">CBR ↔ VBR: дві стратегії бітрейту</text>
<text x="578" y="296.0" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• CBR (сталий): біти фіксовані, якість</text>
<text x="578" y="311.5" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  гуляє — для вузького каналу/ефіру</text>
<text x="578" y="327.0" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• VBR (змінний): якість фіксована, біти</text>
<text x="578" y="342.5" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  стрибають — для запису (на каналі</text>
<text x="578" y="358.0" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  треба буфер → затримка)</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Перша половина біт дає майже всю якість; решта — лише шліфує. Тому коліно кривої — найвигідніша точка.</text>
</svg>
