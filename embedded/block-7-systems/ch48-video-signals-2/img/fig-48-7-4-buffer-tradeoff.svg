<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Глибина буфера: гладко чи миттєво</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">малий буфер — мала затримка, та смикається й губить на джитері; великий — гладко й стійко, та лаг; обирай під місію</text>
<rect x="110" y="180" width="740" height="30" rx="15" fill="#e2e8f0" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="112" y="166" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">малий буфер</text>
<text x="848" y="166" font-size="10.5" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">великий буфер</text>
<text x="150" y="234" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">← менша затримка</text>
<text x="810" y="234" font-size="9.5" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">більша гладкість →</text>
<circle cx="200" cy="195" r="8" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="200" y1="203" x2="200" y2="270" stroke="#cc0000" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="90" y="270" width="220" height="98" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="200" y="294" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Гонка / FPV</text>
<text x="200" y="318" font-size="9.8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">крихітний буфер</text>
<text x="200" y="340" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">&lt;мс лаг, ризик смикання</text>
<circle cx="480" cy="195" r="8" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="480" y1="203" x2="480" y2="270" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="370" y="270" width="220" height="98" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="480" y="294" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Перегляд / стрім</text>
<text x="480" y="318" font-size="9.8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">середній буфер</text>
<text x="480" y="340" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гладко, лаг терпимо</text>
<circle cx="760" cy="195" r="8" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="760" y1="203" x2="760" y2="270" stroke="#1f4ed8" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="650" y="270" width="220" height="98" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="760" y="294" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Хмара / запис</text>
<text x="760" y="318" font-size="9.8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">великий буфер</text>
<text x="760" y="340" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дуже гладко, лаг байдужий</text>
<text x="480.0" y="436" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це той самий компроміс, що в 48.5 — буфер просто інший бік ручки «затримка». Гонка ріже буфер до нуля; хмара його не шкодує.</text>
</svg>
