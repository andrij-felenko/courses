<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Прірва: сире відео не влазить у канал чи картку</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">потік із камери — гігабіти за секунду, а реальна труба — десятки мегабіт; розрив у сотні разів</text>
<rect x="80" y="130" width="200" height="150" rx="12" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.0"/>
<text x="180" y="160" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">СИРЕ ВІДЕО</text>
<text x="180" y="188" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">1080p · 30 fps</text>
<text x="180" y="214" font-size="16" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">≈ 1.5 Гбіт/с</text>
<text x="180" y="236" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(187 МБ щосекунди)</text>
<text x="180" y="262" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">пожежний шланг (47.5)</text>
<line x1="286" y1="205" x2="360" y2="205" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="380" y="150" width="230" height="112" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="495" y="174" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">реальна «труба»:</text>
<text x="400" y="198" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• радіо FPV: ~10–50 Мбіт/с</text>
<text x="400" y="218" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Wi-Fi / мережа: десятки–сотні</text>
<text x="400" y="238" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• SD-картка: швидка, та малий обсяг</text>
<rect x="660" y="150" width="230" height="112" rx="12" fill="#fff0d8" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.0"/>
<text x="775" y="184" font-size="14" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">РОЗРИВ</text>
<text x="775" y="216" font-size="20" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">×100–1000</text>
<text x="775" y="240" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">стільки треба «втиснути»</text>
<text x="480.0" y="420" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Сире відео в сотні разів більше за те, що можна реально передати чи зберегти.</text>
<text x="480.0" y="442" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Вихід один: СТИСНУТИ — викинути все, без чого можна обійтися. Питання лише, що саме викинути.</text>
</svg>
