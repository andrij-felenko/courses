<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">MJPEG проти H.264: дві філософії кодека</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">MJPEG — кожен кадр окремий JPEG (усі I); H.264 — I + P + B з компенсацією руху</text>
