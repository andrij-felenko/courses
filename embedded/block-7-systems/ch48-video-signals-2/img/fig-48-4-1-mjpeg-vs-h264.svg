<text x="610" y="355" font-size="10" fill="#b06b00" text-anchor="middle" font-weight="normal" font-style="normal">P/B крихітні (лише зміни) → дуже КОМПАКТНО; та складно, лаг, крихко (залежність)</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий DCT усередині — різниця в тому, чи використати ще й СХОЖІСТЬ КАДРІВ.</text>
