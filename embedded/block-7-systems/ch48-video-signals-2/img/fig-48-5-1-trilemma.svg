<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Трикутник компромісу: якість ↔ бітрейт ↔ затримка</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">три ручки тягнуть одна одну — задаси дві, третя визначиться сама; усіх трьох найкращих не буває</text>
<polygon points="300,170 120,390 480,390" fill="#eef2ff" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="300" cy="170" r="7" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<circle cx="120" cy="390" r="7" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<circle cx="480" cy="390" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="300" y="154" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЯКІСТЬ</text>
<text x="108" y="412" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БІТРЕЙТ</text>
<text x="492" y="412" font-size="13" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">ЗАТРИМКА</text>
<text x="300" y="300" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">обери 2 —</text>
<text x="300" y="317" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">третя слідом</text>
<rect x="560" y="140" width="360" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="740" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">правило трьох ручок</text>
<circle cx="584" cy="200" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="600" y="204" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Хочеш ЯКІСТЬ?</text>
<text x="600" y="221" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">плати бітрейтом або затримкою</text>
<circle cx="584" cy="254" r="6" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="600" y="258" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">Канал тисне БІТРЕЙТ?</text>
<text x="600" y="275" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ріж якість або додай буфер (лаг)</text>
<circle cx="584" cy="308" r="6" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="600" y="312" font-size="10.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Треба мала ЗАТРИМКА?</text>
<text x="600" y="329" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">стиск гірший → якість чи біти</text>
<rect x="584" y="350" width="312" height="72" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="740" y="372" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Найчастіше канал ЗАДАЄ бітрейт,</text>
<text x="740" y="390" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">і тоді ти торгуєш якість ↔ затримку:</text>
<text x="740" y="408" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тонший стиск — краще, але повільніше.</text>
<text x="480.0" y="454" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це не вада техніки, а закон: біти, краса й миттєвість не бувають найкращими разом.</text>
</svg>
