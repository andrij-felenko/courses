<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Аналогове FPV: відео просто на несучій хвилі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">композитний відеосигнал (яскравість+синхро, як у 47) модулює радіонесучу ~5.8 ГГц; приймач демодулює — й на окуляри</text>
<rect x="26" y="113.0" width="150" height="50" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="101.0" y="143.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Камера</text>
<line x1="176" y1="138" x2="190" y2="138" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="190" y="113.0" width="150" height="50" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="265.0" y="136.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Композитне</text>
<text x="265.0" y="150.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">відео</text>
<line x1="340" y1="138" x2="354" y2="138" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="354" y="113.0" width="150" height="50" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="429.0" y="136.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Модулятор</text>
<text x="429.0" y="150.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">несуча 5.8 ГГц</text>
<text x="534.0" y="126" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">)))</text>
<text x="534.0" y="137" font-size="7.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">ефір</text>
<line x1="504" y1="138" x2="564" y2="138" stroke="#1f4ed8" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="564" y="113.0" width="150" height="50" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="639.0" y="136.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Приймач</text>
<text x="639.0" y="150.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">демодулятор</text>
<line x1="714" y1="138" x2="728" y2="138" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="728" y="113.0" width="150" height="50" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="803.0" y="143.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Окуляри</text>
<rect x="60" y="190" width="330" height="70" rx="8" fill="#f8fafc" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="225" y="208" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">сигнал одного рядка: синхро + яскравість</text>
<polyline points="78,240 96,240 96,252 118,252 118,226 140,220 162,232 184,218 206,228 228,220 250,230 272,222 294,232 316,226 338,240 372,240" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="420" y="190" width="480" height="70" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="660" y="208" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">діапазон 5.8 ГГц · ~40 каналів (пілоти ділять ефір)</text>
<rect x="444" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="490" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="536" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="582" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="628" y="224" width="30" height="22" rx="3" fill="#cc0000" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="674" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="720" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="766" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="812" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<rect x="858" y="224" width="30" height="22" rx="3" fill="#cbd5e1" fill-opacity="0.9" stroke="#64748b" stroke-width="0.8"/>
<text x="643" y="238" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">твій</text>
<rect x="60" y="296" width="410" height="116" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="265" y="318" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">за що люблять</text>
<text x="80" y="340" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• майже нульова затримка (нема кодека/буфера)</text>
<text x="80" y="362" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• плавне згасання на краю дальності</text>
<text x="80" y="384" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• просто й дешево; легко ділити канали</text>
<rect x="490" y="296" width="410" height="116" rx="11" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="695" y="318" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">чим платять</text>
<text x="510" y="340" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• низька роздільність, шум, завади</text>
<text x="510" y="362" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• односторонньо, без шифрування</text>
<text x="510" y="384" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• фіксована смуга каналу (не HD)</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Аналог не стискає й не пакетує — просто кладе відеохвилю на несучу. Звідси і його миттєвість, і його грубість.</text>
</svg>
