<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Джитер і буфер: згладити нерівний прихід</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">пакети шлють рівно, та мережа доправляє їх нерівно (джитер); буфер тримає кілька — щоб відтворення йшло гладко</text>
<text x="60" y="150" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Надіслано (рівно):</text>
<rect x="250" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="320" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="390" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="460" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="530" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="600" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="670" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="740" y="138" width="16" height="24" rx="3" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="60" y="220" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Прийшло (джитер):</text>
<rect x="250" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="268" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="332" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="374" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="442" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="506" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="560" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="642" y="208" width="16" height="24" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="730" y="222" font-size="9.5" fill="#b06b00" text-anchor="start" font-weight="bold" font-style="normal">нерівно!</text>
<rect x="360" y="256" width="240" height="40" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="480" y="281" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">БУФЕР тримає кілька пакетів</text>
<line x1="480" y1="234" x2="480" y2="254" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="480" y1="298" x2="480" y2="320" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="60" y="342" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Відтворення (знов рівно):</text>
<rect x="250" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="320" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="390" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="460" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="530" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="600" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="670" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<rect x="740" y="330" width="16" height="24" rx="3" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="480.0" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Буфер всотує нерівність приходу — на виході знов рівний, гладкий потік.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ціна — кілька кадрів затримки: пакет чекає в черзі, доки надійде його мить.</text>
</svg>
