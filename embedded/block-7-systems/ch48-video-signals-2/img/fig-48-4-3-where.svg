<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Де що ставлять</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">MJPEG — де важить стійкість, проста обробка, незалежні кадри; H.264 — де дорога смуга й місце</text>
<rect x="70" y="120" width="390" height="250" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="265" y="148" font-size="13.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">MJPEG / intra-only</text>
<text x="92" y="178" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• МАШИННЕ БАЧЕННЯ (49): кожен кадр</text>
<text x="92" y="202" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  незалежний, без артефактів передбач.</text>
<text x="92" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• низьколатентний стійкий FPV</text>
<text x="92" y="250" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• прості/дешеві камери, реєстратори</text>
<text x="92" y="274" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• коли треба легко різати/гортати</text>
<text x="92" y="298" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (кожен кадр — ключовий)</text>
<rect x="500" y="120" width="390" height="250" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="695" y="148" font-size="13.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">H.264 / H.265 / AV1</text>
<text x="522" y="178" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ЗАПИС польоту (місце на картці)</text>
<text x="522" y="202" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• стрім по мережі / у хмару</text>
<text x="522" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• HD-FPV у вузькому каналі (DJI тощо)</text>
<text x="522" y="250" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• будь-де, де смуга й пам'ять дорогі,</text>
<text x="522" y="274" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  а обчислень і дрібки лагу не шкода</text>
<text x="522" y="298" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• споживче відео загалом</text>
<text x="480.0" y="436" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Машинне бачення любить MJPEG (чисті незалежні кадри); передача й запис — H.264. Часто на дроні — обидва, для різних потоків.</text>
</svg>
