<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430"
     viewBox="0 0 960 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">«Надто проста» ідея, що стиснула цифровий світ</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Насір Ахмед запропонував DCT 1972 року; грант відмовили як «надто просте» — а воно стало всюди</text>
<line x1="90" y1="200" x2="880" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="150" y1="182" x2="150" y2="194" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="150" cy="200" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="150" y="160" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">1972</text>
<text x="150" y="176" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ахмед пропонує DCT</text>
<text x="150" y="226" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">NSF: «надто просто»</text>
<line x1="340" y1="182" x2="340" y2="194" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="340" cy="200" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="340" y="160" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1974</text>
<text x="340" y="176" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">стаття з Натараджаном і Рао</text>
<text x="340" y="226" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">робочий алгоритм</text>
<line x1="570" y1="182" x2="570" y2="194" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="570" cy="200" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="570" y="160" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">1992</text>
<text x="570" y="176" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">основа JPEG</text>
<text x="570" y="226" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">далі — MPEG, H.26x</text>
<line x1="800" y1="182" x2="800" y2="194" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="800" cy="200" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="800" y="160" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">сьогодні</text>
<text x="800" y="176" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">у кожному фото й відео</text>
<text x="800" y="226" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">телефон, дрон, стрім</text>
<rect x="220" y="300" width="520" height="66" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="480" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Один рецензент відкинув ідею як «надто просту».</text>
<text x="480" y="348" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Та саме ця простота й зробила DCT найуживанішим перетворенням в історії техніки.</text>
</svg>
