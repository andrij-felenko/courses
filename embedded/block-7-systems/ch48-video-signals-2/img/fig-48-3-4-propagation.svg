<text x="464" y="256" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">помилка наростає (розмазується) →</text>
<text x="688" y="256" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">I чистить</text>
<rect x="120" y="320" width="720" height="70" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="346" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що рідші I-кадри — то менший бітрейт, але довше «гоїться» збій (артефакти тримаються до I).</text>
<text x="480" y="368" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Тому в FPV часто роблять I-кадри частими (швидше відновлення) або всі кадри I (без розмазування).</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ось чому цифрове FPV «розмазується» при завадах (47.6): ланцюг P-кадрів несе помилку, доки не прийде I.</text>
