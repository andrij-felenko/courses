<text x="205" y="342" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">→ опиши пляму, не кожну точку</text>
<text x="205" y="360" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(DCT, тема 48.2)</text>
