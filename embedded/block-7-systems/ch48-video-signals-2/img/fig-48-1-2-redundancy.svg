<text x="765" y="136" font-size="12.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЦЕПТИВНИЙ</text>
<text x="765" y="152" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(око не бачить)</text>
<circle cx="765" cy="196" r="18" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="765" cy="196" r="7" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="662" y="232" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">око слабке до:</text>
<text x="662" y="251" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• дрібного кольору (47.3)</text>
<text x="662" y="270" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• тонкої деталі/шуму (47.4)</text>
<text x="765" y="322" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">що око й не помітить —</text>
<text x="765" y="342" font-size="9.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">→ можна сміливо ВИКИНУТИ</text>
<text x="765" y="360" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(стиснення «з утратами»)</text>
<text x="480.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Стиснення — це полювання на надлишок: усе, що повторюється чи непомітне, зберігати не варто.</text>
