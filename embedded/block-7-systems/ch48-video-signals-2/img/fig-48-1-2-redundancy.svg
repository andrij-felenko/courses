<text x="430" y="268" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кадр 1</text>
<rect x="500" y="174" width="100" height="80" rx="4" fill="#dbeafe" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="548" cy="214" r="10" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="550" y="268" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кадр 2</text>
<text x="490" y="322" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сусідні кадри майже однакові</text>
<text x="490" y="342" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">→ зберігай лише те, що ЗМІНИЛОСЬ</text>
<text x="490" y="360" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(міжкадрове, тема 48.3)</text>
