<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Компроміси: за все платиться</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">MJPEG виграє простотою, затримкою, стійкістю; H.264 — стиском (а отже, смугою й місцем)</text>
<rect x="430" y="110" width="250" height="34" rx="6" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="555" y="132" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">MJPEG</text>
<rect x="690" y="110" width="250" height="34" rx="6" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="815" y="132" font-size="12" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">H.264</text>
<text x="72" y="179" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">стиск / розмір файлу</text>
<rect x="430" y="152" width="250" height="44" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="555" y="179" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">✗ слабкий (~10×)</text>
<rect x="690" y="152" width="250" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="815" y="179" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">✓ потужний (50–200×)</text>
<text x="72" y="231" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">затримка (лаг)</text>
<rect x="430" y="204" width="250" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="555" y="231" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">✓ низька (просто)</text>
<rect x="690" y="204" width="250" height="44" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="815" y="231" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">✗ вища (кодувати важче)</text>
<text x="72" y="283" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">стійкість до завад</text>
<rect x="430" y="256" width="250" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="555" y="283" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">✓ кожен кадр окремий</text>
<rect x="690" y="256" width="250" height="44" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="815" y="283" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">✗ збій «розмазується»</text>
<text x="72" y="335" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">обчислення / енергія</text>
<rect x="430" y="308" width="250" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="555" y="335" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">✓ легко (як JPEG)</text>
<rect x="690" y="308" width="250" height="44" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="815" y="335" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">✗ важко (рух, B)</text>
<text x="72" y="387" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">простота / монтаж</text>
<rect x="430" y="360" width="250" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="555" y="387" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">✓ кожен кадр — ключ</text>
<rect x="690" y="360" width="250" height="44" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="815" y="387" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">✗ декодувати ланцюг</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Нема «кращого» — є придатний під задачу: MJPEG за стійкість і простоту, H.264 за компактність.</text>
</svg>
