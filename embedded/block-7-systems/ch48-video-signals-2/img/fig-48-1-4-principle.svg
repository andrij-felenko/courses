<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Головний принцип: зберігай лише НОВЕ</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">не пиши те, що можна передбачити з уже відомого; пиши тільки несподіванку — звідси й уся вигода</text>
<rect x="80" y="130" width="200" height="112" rx="11" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="180" y="158" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕДБАЧЕННЯ</text>
<text x="110" y="182" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">з уже відомого:</text>
<text x="110" y="199" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">сусідні пікселі,</text>
<text x="110" y="216" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">попередній кадр</text>
<text x="310" y="182" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<rect x="340" y="130" width="180" height="112" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="430" y="158" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">РЕАЛЬНІСТЬ</text>
<text x="430" y="186" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">що насправді</text>
<text x="430" y="202" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">в кадрі</text>
<text x="548" y="182" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<rect x="575" y="130" width="200" height="112" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="675" y="158" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">НЕСПОДІВАНКА</text>
<text x="605" y="182" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">лише різниця —</text>
<text x="605" y="199" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мала, добре</text>
<text x="605" y="216" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">стискається</text>
<text x="805" y="182" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">→ це й</text>
<text x="805" y="197" font-size="10" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">пишемо</text>
<rect x="150" y="288" width="660" height="70" rx="10" fill="#fff0d8" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="480" y="312" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Типові стиски: фото JPEG ~10×, відео H.264 ~50–200× (бо ще й кадри схожі між собою).</text>
<text x="480" y="334" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Саме тому 1.5-гігабітний потік (47.5) ужимається до десятків мегабіт — і влазить у канал.</text>
<text x="480.0" y="426" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Передбач відоме, запиши лише несподіване — це й є душа всякого стиснення, від DCT до міжкадрового.</text>
</svg>
