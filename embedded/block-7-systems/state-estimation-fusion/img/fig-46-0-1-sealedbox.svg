  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Знати, де ти, із зачиненими очима</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">герметичний апарат без вікон і зв'язку — як визначити своє положення й курс?</text>
<rect x="365" y="195" width="230" height="110" rx="16" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="480" y="234" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ГЕРМЕТИЧНИЙ АПАРАТ</text>
<text x="480" y="255" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">субмарина · ракета · літак</text>
<text x="480" y="278" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">лише прилади всередині</text>
<line x1="175" y1="120" x2="480" y2="250" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3,4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="175" cy="120" r="34" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="175" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зорі</text>
<line x1="149" y1="94" x2="201" y2="146" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="149" y1="146" x2="201" y2="94" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="785" y1="120" x2="480" y2="250" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3,4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="785" cy="120" r="34" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="785" y="124" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">орієнтир</text>
<line x1="759" y1="94" x2="811" y2="146" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="759" y1="146" x2="811" y2="94" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="175" y1="380" x2="480" y2="250" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3,4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="175" cy="380" r="34" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="175" y="384" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">радіо / GPS</text>
<line x1="149" y1="354" x2="201" y2="406" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="149" y1="406" x2="201" y2="354" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="785" y1="380" x2="480" y2="250" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="3,4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="785" cy="380" r="34" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="785" y="384" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">карта</text>
<line x1="759" y1="354" x2="811" y2="406" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="759" y1="406" x2="811" y2="354" stroke="#cc0000" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="420" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Жодного зовнішнього орієнтира: ні зір, ні землі, ні радіо.</text>
<text x="480.0" y="442" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Відповідь — інерціальна навігація: рахувати рух за фізикою, із самих лише приладів на борту.</text>
</svg>
