<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Летиш у минулому: бачиш, де апарат БУВ</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поки кадр дійшов, апарат уже зрушив; реагуєш на старе → перекерування й розгойдування</text>
<line x1="80" y1="200" x2="880" y2="200" stroke="#e5e7eb" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="334" y1="176" x2="602" y2="176" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="470.0" y="168" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">за час затримки апарат проїхав сюди</text>
<circle cx="320" cy="200" r="12" fill="#9ca3af" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="320" y="234" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">де апарат на ЕКРАНІ</text>
<text x="320" y="250" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(кадр уже застарів)</text>
<polygon points="606,188 636,200 606,212" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round"/>
<text x="620" y="174" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">де апарат НАСПРАВДІ</text>
<rect x="120" y="300" width="720" height="82" rx="10" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="480" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Пілот керує по застарілій картинці → виправляє «навздогін» уже неактуальне →</text>
<text x="480" y="348" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перекручує, апарат проскакує, і починається РОЗГОЙДУВАННЯ (перерегулювання з 34).</text>
<text x="480" y="368" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">На швидкості 20 м/с навіть 100 мс — це два метри наосліп.</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Затримка відео — це затримка в петлі керування (хоч людиною, хоч алгоритмом): діє на минуле, не на тепер.</text>
</svg>
