<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Уся відеотехніка стоїть на цьому: двовимірний образ перетворюють на одновимірний потік, що його несе дріт чи радіо.</text>
