  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Демозаїка: кожен піксель знає лише один колір — решту вгадуємо</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">червоний піксель позичає зелене й синє в сусідів; так у кожному пікселі зрештою є повний R+G+B</text>
<rect x="110" y="130" width="47" height="47" rx="8" fill="#cc0000" fill-opacity="0.8" stroke="white" stroke-width="1"/>
