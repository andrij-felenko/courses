<text x="235.0" y="398" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">позичає G і B у сусідів</text>
<line x1="372" y1="255.0" x2="432" y2="255.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="402" y="245.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">демозаїка</text>
<rect x="448" y="198" width="150" height="114" rx="8" fill="#a855f7" fill-opacity="0.45" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="523" y="222" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">повний колір</text>
<text x="470" y="244" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">R — виміряно</text>
<text x="470" y="262" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">G — вгадано</text>
<text x="470" y="280" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">B — вгадано</text>
<text x="480.0" y="430" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">У сирій мозаїці кожна точка має лише одну складову. Демозаїка інтерполює дві відсутні з сусідів —</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">і робить повноколірний кадр, де в кожному пікселі є R, G і B. Але дві з трьох складових — це ГАДКА.</text>
