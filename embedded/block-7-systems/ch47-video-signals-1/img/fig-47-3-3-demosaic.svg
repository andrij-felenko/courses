<rect x="310" y="330" width="47" height="47" rx="8" fill="#cc0000" fill-opacity="0.8" stroke="white" stroke-width="1"/>
<text x="235.0" y="118" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">цей піксель: лише R</text>
<line x1="233.5" y1="203.5" x2="233.5" y2="253.5" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr)" stroke-opacity="0.85" stroke-linecap="round"/>
<line x1="283.5" y1="253.5" x2="233.5" y2="253.5" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr)" stroke-opacity="0.85" stroke-linecap="round"/>
<line x1="183.5" y1="203.5" x2="233.5" y2="253.5" stroke="#1f4ed8" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr)" stroke-opacity="0.85" stroke-linecap="round"/>
<line x1="283.5" y1="303.5" x2="233.5" y2="253.5" stroke="#1f4ed8" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr)" stroke-opacity="0.85" stroke-linecap="round"/>
