<text x="550" y="142" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">активне відео = яскравість уздовж рядка</text>
<text x="470.0" y="342" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">час (= положення вздовж рядка) →</text>
<text x="82" y="130" font-size="10" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">напруга</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це Фарнсвортова розгортка живцем: рядок — це напруга, що міняється в часі, а синхроімпульс розмежовує рядки.</text>
