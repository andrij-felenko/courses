<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ціна вгадування: менша кольорова роздільність і артефакти</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">колір інтерполюють, тож на тонких деталях — несправжній колір, «застібка», муар</text>
<text x="232" y="110" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">тонка деталь (край, смужки)</text>
