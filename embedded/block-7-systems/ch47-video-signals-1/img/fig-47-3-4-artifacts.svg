<text x="232" y="358" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">✗ несправжній колір / «застібка» / муар</text>
<rect x="560" y="130" width="332" height="92" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="726" y="158" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">RAW = сира мозаїка (до демозаїки)</text>
<text x="726" y="182" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">одна складова на піксель; найбільше даних,</text>
<text x="726" y="200" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">та треба «проявити» (демозаїка + обробка)</text>
<rect x="560" y="242" width="332" height="100" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="726" y="268" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">Для машинного бачення (49)</text>
<text x="580" y="292" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• артефакти збивають колірні пороги</text>
<text x="580" y="310" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (хибний колір на межах)</text>
<text x="580" y="328" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• часто беруть зелений/яскравість або RAW</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Кольорова роздільність нижча за число мегапікселів: дві з трьох складових у точці — інтерпольована гадка.</text>
