<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет затримки: що ще «летабельно»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">аналог ~десятки мс, цифрове HD ~десятки–сотня, стрім ~сотні (нелетабельно); менша затримка коштує якості</text>
<rect x="110" y="154" width="207.20000000000002" height="36" rx="5" fill="#d8f3e0" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<text x="213.60000000000002" y="178" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЛЕТАБЕЛЬНО</text>
<rect x="317.20000000000005" y="154" width="177.6" height="36" rx="5" fill="#fff0d8" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.3"/>
<text x="406.0" y="178" font-size="10" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">на межі</text>
<rect x="494.8" y="154" width="355.2" height="36" rx="5" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="672.4" y="178" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">НЕЛЕТАБЕЛЬНО (керувати неможливо)</text>
<line x1="110" y1="200" x2="850" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="850" y="224" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">затримка (мс) →</text>
<line x1="110" y1="195" x2="110" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="110" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">0</text>
<line x1="228.4" y1="195" x2="228.4" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="228.4" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">30</text>
<line x1="354.20000000000005" y1="195" x2="354.20000000000005" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="354.20000000000005" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">70</text>
<line x1="480.0" y1="195" x2="480.0" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">150</text>
<line x1="665.0" y1="195" x2="665.0" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="665.0" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">300</text>
<line x1="850.0" y1="195" x2="850.0" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="850.0" y="220" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">700</text>
<line x1="184.0" y1="200" x2="184.0" y2="236" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="184.0" cy="200" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="184.0" y="250" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">аналоговий</text>
<text x="184.0" y="265" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">FPV ~20–40</text>
<line x1="354.20000000000005" y1="200" x2="354.20000000000005" y2="236" stroke="#1f4ed8" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="354.20000000000005" cy="200" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="354.20000000000005" y="250" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">цифрове</text>
<text x="354.20000000000005" y="265" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">HD FPV ~70–130</text>
<line x1="739.0" y1="200" x2="739.0" y2="236" stroke="#cc0000" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="739.0" cy="200" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="739.0" y="250" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">телефон/стрім</text>
<text x="739.0" y="265" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">~300–700</text>
<rect x="120" y="330" width="720" height="76" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="356" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Менша затримка майже завжди коштує якості/чіткості (менше стиснення, простіший тракт).</text>
<text x="480" y="378" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">FPV обирає затримку понад роздільність. А для машинного бачення «затримка» — це час обчислень (49.9):</text>
<text x="480" y="396" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">повільний точний алгоритм у петлі гірший за швидкий простий — бо діє на застаріле.</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Поріг «летабельності» — десь до ~50–100 мс; за ним керувати дедалі важче, а за ~200 — майже неможливо.</text>
</svg>
