<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Компроміс експозиції: світло × витримка × підсилення</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">яскравість = світло сцени × час × підсилення; на летючому апараті світло дане, тож торгуєш змаз ↔ шум</text>
<rect x="230" y="92" width="500" height="48" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480" y="122" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">яскравість = світло × витримка × підсилення</text>
<text x="480" y="164" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сцену не змінити (світло дане) → граєш двома ручками, у кожної своя плата:</text>
<rect x="70" y="192" width="360" height="152" rx="12" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="250" y="220" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ШВИДКИЙ політ / тряска</text>
<text x="96" y="248" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• коротка витримка (щоб не змазати)</text>
<text x="96" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• → бракує світла → ↑ підсилення</text>
<text x="96" y="292" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• плата: ШУМ, зернистість</text>
<rect x="90" y="306" width="320" height="30" rx="7" fill="#1f4ed8" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="250" y="326" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">різко, але шумно</text>
<rect x="530" y="192" width="360" height="152" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="710" y="220" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОВІЛЬНО / стабільно</text>
<text x="556" y="248" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• довша витримка (світла досить)</text>
<text x="556" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• низьке підсилення</text>
<text x="556" y="292" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• плата: ризик змазу при русі</text>
<rect x="550" y="306" width="320" height="30" rx="7" fill="#0a8f3c" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="710" y="326" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">чисто, та чутливо до руху</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">На дроні майже завжди виграє коротка витримка: різкий, хай шумніший кадр кращий за яскравий мазок.</text>
</svg>
