<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Затримка «скло-до-скла»: сума всіх кроків</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">від фотона на сенсорі до картинки в очах кожен крок додає мілісекунди; цифра має зайві ланки</text>
<text x="80" y="116" font-size="12.5" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">АНАЛОГ</text>
<rect x="80" y="128" width="130" height="64" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="145" y="150" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">сенсор</text>
<text x="145" y="164" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">+ зчитування</text>
<text x="145" y="184" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">~10 мс</text>
<line x1="212" y1="160" x2="228" y2="160" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="230" y="128" width="130" height="64" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="295" y="150" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">передача</text>
<text x="295" y="164" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">(радіо)</text>
<text x="295" y="184" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">~1 мс</text>
<line x1="362" y1="160" x2="378" y2="160" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="380" y="128" width="130" height="64" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="445" y="150" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">екран</text>
<text x="445" y="164" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="445" y="184" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">~5 мс</text>
<text x="566" y="156" font-size="15" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">≈ 16 мс</text>
<text x="566" y="176" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(майже миттєво)</text>
<text x="80" y="250" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ЦИФРА (HD)</text>
<rect x="80" y="262" width="118" height="64" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="139" y="284" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">сенсор</text>
<text x="139" y="297" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">+ зчитування</text>
<text x="139" y="316" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~10 мс</text>
<line x1="200" y1="294" x2="214" y2="294" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="214" y="262" width="118" height="64" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="273" y="284" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кодування</text>
<text x="273" y="297" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">(стиснення)</text>
<text x="273" y="316" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~20 мс</text>
<line x1="334" y1="294" x2="348" y2="294" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="348" y="262" width="118" height="64" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="407" y="284" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">передача</text>
<text x="407" y="297" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">+ буфер</text>
<text x="407" y="316" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~15 мс</text>
<line x1="468" y1="294" x2="482" y2="294" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="482" y="262" width="118" height="64" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="541" y="284" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">декоду-</text>
<text x="541" y="297" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">вання</text>
<text x="541" y="316" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~15 мс</text>
<line x1="602" y1="294" x2="616" y2="294" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="616" y="262" width="118" height="64" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="675" y="284" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">екран</text>
<text x="675" y="297" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="675" y="316" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~10 мс</text>
<text x="480.0" y="360" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">≈ 70 мс — зайві ланки кодування/декодування додають десятки мс лагу</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">«Скло-до-скла» — повний час від світла на лінзі камери до світла на твоєму екрані. Кожен крок коштує мілісекунд.</text>
</svg>
