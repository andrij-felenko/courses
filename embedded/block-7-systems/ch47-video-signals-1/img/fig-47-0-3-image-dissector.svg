<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як працює образорозкладач: світло → електрони → струм</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">лінза кидає образ на фотокатод, той сипле електрони, а ті проходять крізь щілину — рядок за рядком</text>
<text x="120" y="120" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">образ</text>
<polygon points="150,185 150,285 170,265 170,205" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6" stroke-linejoin="round"/>
<text x="160" y="313" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">лінза</text>
<line x1="175" y1="211.0" x2="238" y2="195" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="175" y1="235.0" x2="238" y2="235" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="175" y1="259.0" x2="238" y2="275" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="240" y="175" width="16" height="120" rx="3" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="248" y="315" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">фотокатод</text>
<text x="248" y="329" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(світло→електрони)</text>
<line x1="258" y1="200" x2="466" y2="200" stroke="#1f4ed8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrB)" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="258" y1="223" x2="466" y2="223" stroke="#1f4ed8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrB)" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="258" y1="247" x2="466" y2="247" stroke="#1f4ed8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrB)" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="258" y1="270" x2="466" y2="270" stroke="#1f4ed8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrB)" stroke-opacity="0.6" stroke-linecap="round"/>
<text x="360" y="185" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">«електронний образ» дрейфує</text>
<rect x="480" y="165" width="14" height="56" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="480" y="249" width="14" height="56" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="487" y="155" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">діафрагма зі щілиною</text>
<text x="487" y="327" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">щілина</text>
<line x1="494" y1="235" x2="600" y2="235" stroke="#0a8f3c" stroke-width="2.2" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="205" width="92" height="60" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="646" y="240" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">струм</text>
<text x="722" y="233" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">= яскравість</text>
<text x="722" y="251" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">точки рядка</text>
<text x="480.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Образ «зсувають» по щілині — і крізь неї по черзі проходять електрони від кожної точки рядка.</text>
<text x="480.0" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Скільки електронів пройшло — така там яскравість. Так картина стає струмом, що міняється в часі: відеосигналом.</text>
</svg>
