<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал-шум: лік від зерна — БІЛЬШЕ СВІТЛА, а не підсилення</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">SNR росте з кореня числа фотонів; підсилення множить і сигнал, і шум — отже не рятує</text>
<text x="180" y="112" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ТЕМНО (мало фотонів)</text>
<text x="90" y="136" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">сигнал</text>
<rect x="90" y="140" width="180" height="28" rx="4" fill="#e5e7eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="90" y="140" width="54.0" height="28" rx="4" fill="#1f4ed8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="90" y="184" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">шум</text>
<rect x="90" y="188" width="180" height="16" rx="4" fill="#e5e7eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="90" y="188" width="39.6" height="16" rx="4" fill="#cc0000" fill-opacity="0.6" stroke="none" stroke-width="1.6"/>
<text x="180" y="232" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">низький SNR → зернисто</text>
<text x="500" y="112" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">СВІТЛО (багато фотонів)</text>
<text x="410" y="136" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">сигнал</text>
<rect x="410" y="140" width="180" height="28" rx="4" fill="#e5e7eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="410" y="140" width="165.6" height="28" rx="4" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="410" y="184" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">шум</text>
<rect x="410" y="188" width="180" height="16" rx="4" fill="#e5e7eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="410" y="188" width="23.400000000000002" height="16" rx="4" fill="#cc0000" fill-opacity="0.6" stroke="none" stroke-width="1.6"/>
<text x="500" y="232" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">високий SNR → чисто</text>
<rect x="680" y="132" width="220" height="92" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="790" y="164" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">SNR ∝ √(фотони)</text>
<text x="790" y="190" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">учетверо світла →</text>
<text x="790" y="206" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">удвічі чистіше</text>
<rect x="150" y="296" width="660" height="86" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="480" y="322" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">А підсилення (47.2)? Воно множить і сигнал, І шум — на ОДНЕ число.</text>
<text x="480" y="346" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Тож SNR від фотонного шуму не поліпшити: кадр яскравішає, але не чистішає. Єдиний справжній лік — більше фотонів</text>
<text x="480" y="366" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(більший піксель, ширша діафрагма, довша витримка, ясніша сцена).</text>
</svg>
