<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Витримка: скільки тримати відерце відкритим</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">довша витримка — більше світла, але рух розмивається; коротша — різко, та темно</text>
<text x="215" y="96" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КОРОТКА витримка</text>
<text x="70" y="136" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">витримка:</text>
<rect x="136" y="124" width="214" height="18" rx="4" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="136" y="124" width="64.2" height="18" rx="4" fill="#1f4ed8" fill-opacity="0.7" stroke="none" stroke-width="1.6"/>
<rect x="110" y="165" width="110" height="120" rx="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="114" y="251.4" width="102" height="33.6" rx="3" fill="#1f4ed8" fill-opacity="0.4" stroke="none" stroke-width="1.6"/>
<text x="165.0" y="303" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">мало світла</text>
<rect x="250" y="165" width="96" height="120" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="298" cy="225" r="10" fill="#e5e7eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="298" y="302" font-size="9.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">✓ різко</text>
<text x="685" y="96" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ДОВГА витримка</text>
<text x="540" y="136" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">витримка:</text>
<rect x="606" y="124" width="214" height="18" rx="4" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="606" y="124" width="181.9" height="18" rx="4" fill="#d98a00" fill-opacity="0.7" stroke="none" stroke-width="1.6"/>
<rect x="580" y="165" width="110" height="120" rx="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="584" y="189.8" width="102" height="95.2" rx="3" fill="#1f4ed8" fill-opacity="0.4" stroke="none" stroke-width="1.6"/>
<text x="635.0" y="303" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">багато світла</text>
<rect x="720" y="165" width="96" height="120" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="738" y="208" width="60" height="12" rx="6" fill="#e5e7eb" fill-opacity="0.65" stroke="none" stroke-width="1.6"/>
<text x="768" y="302" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">✗ розмито</text>
<line x1="495" y1="150" x2="495" y2="300" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="4,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">На летючому, тремкому апараті надто довга витримка = змазаний кадр, з якого мало користі.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому вдень витримку коротять (рух різкий); поночі або довшать (ризик змазу), або задирають підсилення (шум, 47.4).</text>
</svg>
