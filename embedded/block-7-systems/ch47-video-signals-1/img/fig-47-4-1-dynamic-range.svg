  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Динамічний діапазон: від найтемнішого до найсвітлішого за кадр</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сенсор ловить лише смугу яскравостей (від шуму до насичення); ширша сцена обрізається</text>
<rect x="150" y="100.0" width="80" height="21.0" rx="8" fill="rgb(255,255,255)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="120.0" width="80" height="21.0" rx="8" fill="rgb(236,236,236)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="140.0" width="80" height="21.0" rx="8" fill="rgb(216,216,216)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="160.0" width="80" height="21.0" rx="8" fill="rgb(197,197,197)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="180.0" width="80" height="21.0" rx="8" fill="rgb(177,177,177)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="200.0" width="80" height="21.0" rx="8" fill="rgb(157,157,157)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="220.0" width="80" height="21.0" rx="8" fill="rgb(138,138,138)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="240.0" width="80" height="21.0" rx="8" fill="rgb(118,118,118)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="260.0" width="80" height="21.0" rx="8" fill="rgb(99,99,99)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="280.0" width="80" height="21.0" rx="8" fill="rgb(79,79,79)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="300.0" width="80" height="21.0" rx="8" fill="rgb(59,59,59)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="320.0" width="80" height="21.0" rx="8" fill="rgb(40,40,40)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="340.0" width="80" height="21.0" rx="8" fill="rgb(20,20,20)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="360.0" width="80" height="21.0" rx="8" fill="rgb(0,0,0)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="150" y="100" width="80" height="280" rx="8" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="190.0" y="88" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">СЦЕНА</text>
<text x="140" y="112" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">☀ небо</text>
<text x="140" y="376" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">тінь</text>
<rect x="260" y="172" width="50" height="158" rx="6" fill="#eafaef" fill-opacity="0.4" stroke="#0a8f3c" stroke-width="2.0"/>
<line x1="230" y1="172" x2="260" y2="172" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="230" y1="330" x2="260" y2="330" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="322" y="243.0" font-size="11" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">ВІКНО сенсора</text>
<text x="322" y="259.0" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(шум → насичення)</text>
<text x="322" y="166" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">↑ вище → пересвіт</text>
<text x="322" y="344" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">↓ нижче → провал</text>
<text x="710" y="88" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ширину міряють у СТОПАХ</text>
<rect x="640" y="108" width="150" height="24" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="125" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">1 стоп = ×2 світла</text>
<rect x="640" y="138" width="150" height="24" rx="8" fill="#dbeafe" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="155" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">2 стоп = ×2 світла</text>
<rect x="640" y="168" width="150" height="24" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="185" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">3 стоп = ×2 світла</text>
<rect x="640" y="198" width="150" height="24" rx="8" fill="#dbeafe" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="215" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">4 стоп = ×2 світла</text>
<rect x="640" y="228" width="150" height="24" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="245" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">5 стоп = ×2 світла</text>
<rect x="640" y="258" width="150" height="24" rx="8" fill="#dbeafe" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="275" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">6 стоп = ×2 світла</text>
<rect x="640" y="288" width="150" height="24" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1"/>
<text x="648" y="305" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">7 стоп = ×2 світла</text>
<text x="715" y="334" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">у сенсора 8–12 стопів;</text>
<text x="715" y="348" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сонячна сцена буває й 20</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Якщо сцена ширша за вікно сенсора — світле «вибілюється», темне «провалюється», і деталі там гинуть (47.1).</text>
