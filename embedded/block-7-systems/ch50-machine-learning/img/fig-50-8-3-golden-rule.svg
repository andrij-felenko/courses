<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Золоте правило розподілу</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">критичне за часом і керування — НА БОРТУ (ніколи в хмарі); важке й не термінове — у хмару; обірваний зв'язок не сміє завалити апарат</text>
<rect x="360" y="116" width="240" height="58" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="480" y="140" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Критично за ЧАСОМ</text>
<text x="480" y="159" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">чи для керування?</text>
<line x1="424" y1="174" x2="304" y2="210" stroke="#0a8f3c" stroke-width="1.8" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="338" y="196" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">ТАК</text>
<rect x="106" y="214" width="300" height="96" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="256" y="238" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">→ НА БОРТУ</text>
<text x="126" y="260" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• МК — для дрібного й керування</text>
<text x="126" y="277" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• бортовий комп'ютер — для важкого зору</text>
<text x="126" y="294" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• миттєво, без мережі, автономно</text>
<line x1="536" y1="174" x2="656" y2="210" stroke="#1f4ed8" stroke-width="1.8" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="626" y="196" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">НІ</text>
<rect x="554" y="214" width="300" height="96" rx="11" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="704" y="238" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">→ МОЖНА В ХМАРУ</text>
<text x="574" y="260" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• навчання моделей (50.2)</text>
<text x="574" y="277" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• важкий аналіз, побудова карт</text>
<text x="574" y="294" font-size="9.2" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• логи, не термінове — офлайн</text>
<rect x="90" y="332" width="780" height="80" rx="11" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.9"/>
<text x="480" y="358" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">СМЕРТНИЙ ГРІХ: контур керування через хмару</text>
<text x="132" y="380" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">зник зв'язок (вийшов з покриття, завада — 48.6) — і апарат лишається БЕЗ керування й падає.</text>
<text x="132" y="398" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Усе, від чого залежить політ, мусить рахуватися НА БОРТУ й працювати навіть без мережі.</text>
</svg>
