<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як чесно виміряти: тренувальний / валідаційний / тестовий</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">на тренувальному вчаться; на валідаційному підбирають налаштування й ловлять перенавчання; тестовий чіпають РАЗ</text>
<rect x="70" y="116" width="541.2" height="44" rx="6" fill="#1f4ed8" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340.6" y="132" font-size="9.5" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">ТРЕНУВАЛЬНИЙ</text>
<text x="340.6" y="178" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">на ньому модель ВЧИТЬСЯ (50.4)</text>
<rect x="611.2" y="116" width="139.4" height="44" rx="6" fill="#d98a00" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="680.9000000000001" y="128" font-size="9.5" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">ВАЛІДА-</text>
<text x="680.9000000000001" y="140" font-size="9.5" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">ЦІЙНИЙ</text>
<text x="680.9000000000001" y="178" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тут підбирають налаштування й ловлять перенавчання</text>
<rect x="750.6" y="116" width="139.4" height="44" rx="6" fill="#0a8f3c" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="820.3000000000001" y="132" font-size="9.5" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">ТЕСТОВИЙ</text>
<text x="820.3000000000001" y="178" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">чіпають РАЗ наприкінці — чесна оцінка</text>
<rect x="70" y="196" width="820" height="30" rx="8" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<text x="480" y="216" font-size="9.6" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ЗОЛОТЕ ПРАВИЛО: НІКОЛИ не оцінюй на тих даних, на яких училася модель — інакше міряєш зубріння, а не вміння.</text>
<line x1="150" y1="410" x2="510" y2="410" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="150" y1="410" x2="150" y2="280" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="510" y="426" font-size="8.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">епохи →</text>
<text x="144" y="278" font-size="8.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">похибка</text>
<polyline points="150,288.0 183,331.28162743161033 216,357.5332614711414 249,373.4556823836727 282,383.1131188439726 315,388.97065015137116 348,392.523422479535 381,394.67828782354496 414,395.9852797222392 447,396.7780103807933 480,397.2588258301006" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.4" stroke-linejoin="round"/>
<text x="500" y="391.2588258301006" font-size="8.5" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">тренувальна ↓</text>
<polyline points="150,300.0 183,331.58318547341815 216,348.91640516614586 249,358.42907782448896 282,363.6497432697411 315,375.51490521424955 348,386.0873394286895 381,395.9503096225666 414,405.4239177065686 447,414.68383933401714 480,423.82648734763336" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.4" stroke-linejoin="round"/>
<text x="500" y="425.82648734763336" font-size="8.5" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">валідаційна</text>
<circle cx="150" cy="300.0" r="6" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.2"/>
<text x="150" y="286.0" font-size="8" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">рання зупинка</text>
<rect x="560" y="290" width="340" height="120" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="730" y="314" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що каже розрив кривих</text>
<text x="580" y="336.0" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• тренувальна похибка все падає (модель</text>
<text x="580" y="351.5" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  зубрить дедалі краще);</text>
<text x="580" y="367.0" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• валідаційна спершу падає, тоді РОСТЕ —</text>
<text x="580" y="382.5" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  ось і почалося перенавчання;</text>
<text x="580" y="398.0" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• спинись там, де валідаційна найменша.</text>
</svg>
