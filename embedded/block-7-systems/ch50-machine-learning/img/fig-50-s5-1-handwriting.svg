<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Мільйон почерків: задача, де правила безсилі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">той самий «7» можна написати тисячею способів; жодне рукотворне правило їх не охопить — зате прикладів безліч</text>
<polyline points="110,158 148,158 125.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<polyline points="230,158 268,158 255.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<line x1="249.96" y1="187.12" x2="262.12" y2="184.88" stroke="#1a1a1a" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="350,164 361.4,154 376.6,156 388,160 367.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<polyline points="470,158 508,158 499.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<polyline points="590,164 601.4,154 616.6,156 628,160 601.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<line x1="602.96" y1="187.12" x2="615.12" y2="184.88" stroke="#1a1a1a" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="710,158 748,158 732.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<line x1="728.46" y1="187.12" x2="740.62" y2="184.88" stroke="#1a1a1a" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="820,158 858,158 839.1,214" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<text x="480.0" y="252" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">усе це — той самий «7»</text>
<rect x="120" y="290" width="720" height="110" rx="11" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="480" y="314" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Правило для «сімки» не напишеш</text>
<text x="150" y="338" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• нахил, петельки, риска посередині, кривий верх — варіантів безліч, і кожен почерк інший;</text>
<text x="150" y="359" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• зате ПРИКЛАДІВ — гори: мільйони підписаних конвертів і чеків. Класична задача для машинного навчання (50.1):</text>
<text x="150" y="380" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  не формалізувати правило, а показати приклади й НАВЧИТИ модель.</text>
</svg>
