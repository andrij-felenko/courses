<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Бракована ланка: навчити згортку</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">неокогнітрон (50.5) мав форму, та не вмів добре вчитися; Лекун додав зворотне поширення (50.4) і реальні дані — і згортка ОЖИЛА</text>
<rect x="40" y="130" width="250" height="190" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="165" y="156" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">Неокогнітрон (1980)</text>
<text x="60" y="184" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ форма правильна:</text>
<text x="60" y="208" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  згортка + пулінг (50.5)</text>
<text x="60" y="232" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">− та вчити НЕ вміли</text>
<text x="60" y="256" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  як слід</text>
<text x="60" y="280" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (без зручного навчання)</text>
<text x="312" y="230" font-size="26" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="335" y="130" width="250" height="190" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="460" y="156" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Внесок Лекуна (1989)</text>
<text x="355" y="184" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ зворотне поширення</text>
<text x="355" y="208" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (50.4) тренує ядра</text>
<text x="355" y="232" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ спільні ваги (49.3)</text>
<text x="355" y="256" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ реальні дані пошти</text>
<text x="355" y="280" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (індекси з конвертів)</text>
<text x="607" y="230" font-size="26" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<rect x="630" y="130" width="290" height="190" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2"/>
<text x="775" y="156" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">Навчена згорткова мережа</text>
<text x="650" y="184" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• сама вчить ядра з прикладів</text>
<text x="650" y="204" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (не рукотворні, не випадкові);</text>
<text x="650" y="224" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• працює на СПРАВЖНІХ,</text>
<text x="650" y="244" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  неохайних почерках;</text>
<text x="650" y="264" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• перша CNN, що по-справжньому</text>
<text x="650" y="284" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  запрацювала.</text>
<text x="480.0" y="358" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Архітектуру дав Фукусіма; Лекун додав те, чого бракувало, — спосіб НАВЧАТИ її на реальних даних.</text>
<text x="480.0" y="380" font-size="9.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Так згорткова мережа вперше перетворилася з гарної ідеї на робочий інструмент.</text>
</svg>
