  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Квантування: 32-бітні ваги → 8-бітні</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">замість точного 32-бітного дробу зберігаємо вагу 8 бітами (256 рівнів): вчетверо менше, швидше, точність майже не страждає</text>
<rect x="60" y="128" width="300" height="92" rx="10" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="210" y="152" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">32-бітний float</text>
<text x="210" y="182" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">0.31428571…</text>
<text x="210" y="204" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">4 байти на число</text>
<line x1="364" y1="174" x2="420" y2="174" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="392" y="164" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">округлити</text>
<text x="392" y="188" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">до рівня</text>
<rect x="426" y="128" width="300" height="92" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="576" y="152" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">8-бітне ціле</text>
<text x="576" y="182" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">80  (з 0…255)</text>
<text x="576" y="204" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1 байт на число</text>
<text x="770" y="158" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">= вчетверо</text>
<text x="770" y="176" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">менше</text>
<text x="480.0" y="250" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">діапазон ваг ділять на 256 рівнів; кожну вагу «клацають» у найближчий:</text>
