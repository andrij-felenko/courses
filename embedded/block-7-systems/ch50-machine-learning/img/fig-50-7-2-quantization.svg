<text x="343.2" y="262" font-size="8" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">0.314…</text>
<circle cx="345.0" cy="290" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="405.0" y="310" font-size="8" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">найближчий рівень</text>
<rect x="120" y="322" width="720" height="58" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="150" y="344" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ×4 менше (8 біт замість 32) → менше пам'яті й місця на чипі;</text>
<text x="150" y="362" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• швидше: цілочисельна арифметика (МК часто й не має float-блоку), а точність падає ледь-ледь.</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Та сама ідея, що в JPEG (48.2): згрубити дрібниці, яких не помітно, заради величезного виграшу в розмірі.</text>
