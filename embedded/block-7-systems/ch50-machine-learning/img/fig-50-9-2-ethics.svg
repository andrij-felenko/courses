<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Етика: відповідальність за зрячий апарат</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">упередженість даних, приватність (дрон = стеження), безпека (упевнено-хибна модель + літальний апарат), подвійне призначення</text>
<rect x="50" y="116" width="430" height="130" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="72" y="150" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">УПЕРЕДЖЕНІСТЬ</text>
<text x="72" y="178" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перекошені дані → несправед-</text>
<text x="72" y="200" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">лива чи небезпечна модель;</text>
<text x="72" y="222" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">збирай чесно (50.6)</text>
<rect x="510" y="116" width="430" height="130" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="532" y="150" font-size="12" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ПРИВАТНІСТЬ</text>
<text x="532" y="178" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">зрячий дрон — потужне</text>
<text x="532" y="200" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">стеження; поважай право</text>
<text x="532" y="222" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">людей і закон</text>
<rect x="50" y="266" width="430" height="130" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="72" y="300" font-size="12" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">БЕЗПЕКА</text>
<text x="72" y="328" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">упевнено-хибна модель керує</text>
<text x="72" y="350" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">польотом → запобіжники,</text>
<text x="72" y="372" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">людський нагляд, фолбек</text>
<rect x="510" y="266" width="430" height="130" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="532" y="300" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">ПОДВІЙНЕ ПРИЗНАЧЕННЯ</text>
<text x="532" y="328" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">те саме — на добро (порятунок,</text>
<text x="532" y="350" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">агро, огляд) чи на зло;</text>
<text x="532" y="372" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вибір за інженером</text>
<text x="480.0" y="456" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Дати апарату очі — велика сила. Відповідальність за те, що він ними робить, лежить на тобі, а не на моделі.</text>
</svg>
