<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470"
     viewBox="0 0 980 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Автономний апарат — це замкнений контур, а не пряма лінія</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">давачі → оцінювач стану → керування → виконання → апарат → і знову давачі</text>
<rect x="36" y="179.0" width="150" height="72" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="111.0" y="211" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ДАВАЧІ</text>
<text x="111.0" y="227" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">вимірюють</text>
<rect x="222" y="179.0" width="168" height="72" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="306.0" y="211" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ОЦІНЮВАЧ</text>
<text x="306.0" y="227" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">СТАНУ</text>
<rect x="426" y="179.0" width="152" height="72" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="502.0" y="211" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">КЕРУВАННЯ</text>
<text x="502.0" y="227" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">порівняти й виправити</text>
<rect x="614" y="179.0" width="160" height="72" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="694.0" y="211" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ВИКОНАВЧІ</text>
<text x="694.0" y="227" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">МЕХАНІЗМИ</text>
<rect x="810" y="179.0" width="140" height="72" rx="10" fill="#ececef" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="880.0" y="211" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">АПАРАТ</text>
<text x="880.0" y="227" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">+ фізика</text>
<line x1="186" y1="215" x2="219" y2="215" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="204.0" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сирі виміри</text>
<line x1="390" y1="215" x2="423" y2="215" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="408.0" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">оцінка стану</text>
<line x1="578" y1="215" x2="611" y2="215" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="596.0" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">команди</text>
<line x1="774" y1="215" x2="807" y2="215" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="792.0" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сили / моменти</text>
<rect x="410" y="64" width="184" height="50" rx="9" fill="#eef6ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="502" y="84" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЗАВДАННЯ — бажаний стан</text>
<text x="502" y="99" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">(уставка)</text>
<line x1="502" y1="114" x2="502" y2="177.0" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="556" y="150" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="italic">уставка</text>
<line x1="880" y1="251.0" x2="880" y2="372" stroke="#1a1a1a" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="880" y1="372" x2="111" y2="372" stroke="#1a1a1a" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="111" y1="372" x2="111" y2="253.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="495" y="365" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">апарат рухається → давачі міряють новий стан: контур замикається</text>
<text x="490.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ключова ідея: керування спирається на ОЦІНКУ стану, а не на сирі давачі, і безперервно порівнює її з уставкою.</text>
</svg>
