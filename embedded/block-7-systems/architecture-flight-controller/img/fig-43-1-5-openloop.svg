<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380"
     viewBox="0 0 880 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" fill="white"/>
<text x="440.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому потрібен зворотний зв'язок: розімкнено проти замкнено</text>
<text x="440.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">однакове збурення; ліворуч — команда наосліп, праворуч — вимір-порівняння-корекція</text>
<rect x="60" y="86" width="360" height="220" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="240" y="80" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">РОЗІМКНЕНО — без зворотного зв'язку</text>
<line x1="80" y1="296" x2="404" y2="296" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="404" y="290" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<line x1="80" y1="190" x2="408" y2="190" stroke="#1f4ed8" stroke-width="1.3" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="84" y="184" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">уставка 0°</text>
<polyline points="84,190 140,186 185,178 228,166 270,148 312,122 350,106 398,98" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.4" stroke-linejoin="round"/>
<text x="240" y="116" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">кут утікає → апарат падає</text>
<rect x="470" y="86" width="360" height="220" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="650" y="80" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ЗАМКНЕНО — зі зворотним зв'язком</text>
<line x1="490" y1="296" x2="814" y2="296" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="814" y="290" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<line x1="490" y1="190" x2="818" y2="190" stroke="#1f4ed8" stroke-width="1.3" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="494" y="184" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">уставка 0°</text>
<polyline points="492,190 520,150 546,138 576,158 614,178 656,188 706,191 824,190" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.4" stroke-linejoin="round"/>
<text x="650" y="116" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">кут повертається до уставки</text>
<text x="440.0" y="366" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий поштовх: без зворотного зв'язку похибка накопичується, із ним — гаситься. Уся автономність тримається на цій лінії.</text>
</svg>
