<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520"
     viewBox="0 0 920 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="920" height="520" fill="white"/>
<text x="460.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому стільки назв: залізо, прошивка й наземна станція — три різні шари</text>
<text x="460.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">їх обирають майже незалежно; плутанина тягнеться ще з епохи «APM»</text>
<rect x="70" y="80" width="520" height="96" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="88" y="108" font-size="14" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">НАЗЕМНА СТАНЦІЯ (GCS)</text>
<text x="88" y="130" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">на ноутбуці/планшеті: карта, параметри, місія, логи</text>
<text x="88" y="154" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">приклади:  Mission Planner · QGroundControl</text>
<rect x="70" y="206" width="520" height="96" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="88" y="234" font-size="14" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">ПРОШИВКА — польотний стек</text>
<text x="88" y="256" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">заливається у плату; читає давачі й керує моторами</text>
<text x="88" y="280" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">приклади:  ArduPilot (GPLv3) · PX4 (BSD)</text>
<rect x="70" y="332" width="520" height="96" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="88" y="360" font-size="14" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ЗАЛІЗО — політний контролер (FMU)</text>
<text x="88" y="382" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">STM32 + IMU + барометр + роз'єми; «мозок» у залізі</text>
<text x="88" y="406" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">приклади:  Pixhawk · Cube · Matek · Holybro</text>
<line x1="620" y1="254.0" x2="620" y2="128.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="620" y1="136.0" x2="620" y2="246.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="628" y="163.0" width="222" height="56" rx="9" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="640" y="183.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">MAVLink — протокол</text>
<text x="640" y="199.0" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(Розділ 42), по радіо/USB</text>
<line x1="330.0" y1="302" x2="330.0" y2="332" stroke="#0a8f3c" stroke-width="2.2" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="342.0" y="321.0" font-size="11.5" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="italic">прошити (USB/UART)</text>
<text x="460.0" y="498" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Один FMU може нести або ArduPilot, або PX4; стара назва «APM» означала і плату, і прошивку — звідси вічна плутанина в чужих доках.</text>
</svg>
