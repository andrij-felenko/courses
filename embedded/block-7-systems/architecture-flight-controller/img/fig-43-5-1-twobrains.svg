<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Два мозки апарата: «політ» і «розум» — поділені за роллю</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">виділений контролер тримає апарат у повітрі; потужний комп'ютер думає — і може зависнути</text>
<rect x="60" y="88" width="380" height="304" rx="13" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="250" y="120" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ КОНТРОЛЕР</text>
<text x="250" y="140" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">«ПОЛІТ» — виживання</text>
<rect x="80" y="158" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.1"/>
<text x="250" y="179" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">малий МК · RTOS або голе залізо</text>
<rect x="80" y="200" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.1"/>
<text x="250" y="221" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">реальний час · детермінований</text>
<rect x="80" y="242" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.1"/>
<text x="250" y="263" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">надійний · працює завжди</text>
<rect x="80" y="300" width="340" height="70" rx="9" fill="#d8f3e0" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<text x="250" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Робота: стабілізація · оцінювач (EKF)</text>
<text x="250" y="344" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">керування · failsafe</text>
<rect x="520" y="88" width="380" height="304" rx="13" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="710" y="120" font-size="14" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ КОМП'ЮТЕР</text>
<text x="710" y="140" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">«РОЗУМ» — обчислення</text>
<rect x="540" y="158" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.1"/>
<text x="710" y="179" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Linux SBC (Raspberry Pi · Jetson)</text>
<rect x="540" y="200" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.1"/>
<text x="710" y="221" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">потужний · НЕ реального часу</text>
<rect x="540" y="242" width="340" height="32" rx="7" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.1"/>
<text x="710" y="263" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">може зависнути — політ це переживе</text>
<rect x="540" y="300" width="340" height="70" rx="9" fill="#dde6ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="710" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Робота: бачення · планування</text>
<text x="710" y="344" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">відео · ML · складна логіка</text>
<line x1="442" y1="215" x2="518" y2="215" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="518" y1="240" x2="442" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="205" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">MAVLink</text>
<text x="480" y="262" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">UART</text>
<text x="480.0" y="466" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Бортовий комп'ютер — НАД контуром керування, не в ньому: зависне «розум» — «політ» і failsafe лишаються на виділеному контролері (43.2).</text>
</svg>
