<text x="474" y="334" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">апарат рухається → давачі міряють знову</text>
<text x="490.0" y="388" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Упізнавши ці імена у вихідниках, ти одразу знаєш, яку ланку контуру читаєш.</text>
