<text x="660" y="177" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ГЕОМЕТРІЯ → кути / круглість</text>
<text x="660" y="198" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ЛІНІЇ, КОЛА → Хаф (стійко)</text>
<text x="660" y="219" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• відомий ВЗІРЕЦЬ → шаблон</text>
<text x="660" y="240" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• надійний маркер → ArUco /</text>
