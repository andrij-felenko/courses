<text x="780" y="301" font-size="9" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">надто різні об'єкти → 49.7</text>
<text x="480.0" y="456" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Класичні детектори дешеві, прозорі й без навчання — бери їх, коли ціль чітко задана кольором, формою чи взірцем.</text>
