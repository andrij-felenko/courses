<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Гірки нейромереж: від перцептрона до AlexNet</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1958 захват → 1969 «зима» → 1986 воскресіння (зворотне поширення) → 1998 згорткові → 2012 прорив</text>
<line x1="70" y1="400" x2="910" y2="400" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="908" y="422" font-size="9.5" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">час →</text>
<text x="64" y="132" font-size="9" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">↑ поступ / увага</text>
<polyline points="130,300 320,372 530,252 680,232 850,150" fill="none" fill-opacity="1.0" stroke="#94a3b8" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="130" cy="300" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="130" y="242" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">1958</text>
<text x="130" y="257" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Перцептрон</text>
<text x="130" y="271" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перша машина,</text>
<text x="130" y="282" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">що ВЧИТЬСЯ</text>
<circle cx="320" cy="372" r="6" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="320" y="314" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">1969</text>
<text x="320" y="329" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">«Зима»</text>
<text x="320" y="343" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Мінський і Паперт:</text>
<text x="320" y="354" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">XOR не взяти</text>
<circle cx="530" cy="252" r="6" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="530" y="268" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1986</text>
<text x="530" y="283" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Зворотне</text>
<text x="530" y="297" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поширення —</text>
<text x="530" y="308" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">багато шарів</text>
<circle cx="680" cy="232" r="6" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="680" y="248" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">1998</text>
<text x="680" y="263" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">LeNet</text>
<text x="680" y="277" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">згорткові мережі</text>
<text x="680" y="288" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">читають цифри</text>
<circle cx="850" cy="150" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="850" y="166" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">2012</text>
<text x="850" y="181" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">AlexNet</text>
<text x="850" y="195" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">глибока CNN</text>
<text x="850" y="206" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">виграє ImageNet</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Двічі нейромережі ховали як глухий кут — і двічі вони верталися. Утретє, 2012-го, вони перемогли остаточно.</text>
</svg>
