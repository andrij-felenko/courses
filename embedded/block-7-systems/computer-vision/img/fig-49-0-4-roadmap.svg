  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Зір виявився не задачею, а наукою</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">те, що думали зробити за літо, будують досі; а ми пройдемо його ази — від пікселя до керування</text>
<rect x="40" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<rect x="40" y="128" width="48" height="84" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="64" y="175" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">49.1</text>
<text x="98" y="164" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">піксель,</text>
<text x="98" y="182" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">канали</text>
<line x1="200" y1="170" x2="220" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="220" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<rect x="220" y="128" width="48" height="84" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="244" y="175" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">49.2</text>
<text x="278" y="164" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">яскравість,</text>
<text x="278" y="182" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">гістограма</text>
<line x1="380" y1="170" x2="400" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="400" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<rect x="400" y="128" width="48" height="84" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="424" y="175" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">49.3</text>
<text x="458" y="164" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">згортки,</text>
<text x="458" y="182" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">фільтри</text>
<line x1="560" y1="170" x2="580" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="580" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<rect x="580" y="128" width="48" height="84" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="604" y="175" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">49.4</text>
<text x="638" y="164" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">межі:</text>
<text x="638" y="182" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Собель/Канні</text>
<line x1="740" y1="170" x2="760" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="760" y="128" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<rect x="760" y="128" width="48" height="84" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="784" y="175" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">49.5</text>
<text x="818" y="164" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">пороги,</text>
<text x="818" y="182" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">морфологія</text>
<line x1="840" y1="212" x2="840" y2="288" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="760" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<rect x="760" y="290" width="48" height="84" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="784" y="337" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">49.6</text>
<text x="818" y="326" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">об'єкти:</text>
<text x="818" y="344" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">форма/Хаф</text>
<line x1="760" y1="332" x2="720" y2="332" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="540" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<rect x="540" y="290" width="48" height="84" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="564" y="337" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">49.7</text>
<text x="598" y="326" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">нейро-</text>
<text x="598" y="344" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">детектори</text>
<line x1="540" y1="332" x2="500" y2="332" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="320" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<rect x="320" y="290" width="48" height="84" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="344" y="337" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">49.8</text>
<text x="378" y="326" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">трекінг →</text>
<text x="378" y="344" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">керування</text>
<line x1="320" y1="332" x2="280" y2="332" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="100" y="290" width="160" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<rect x="100" y="290" width="48" height="84" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="124" y="337" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">49.9</text>
<text x="158" y="326" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вартість</text>
<text x="158" y="344" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">обчислень</text>
<text x="620" y="304" font-size="8.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">📜 49.7: окрема історія нейромереж</text>
<rect x="40" y="392" width="880" height="60" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="416" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дев'ять кроків від голих чисел-пікселів до того, щоб «піксель став кутом» і замкнув керування.</text>
<text x="480" y="437" font-size="9.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Те, що 1966-го гадали зробити за літо. Ми пройдемо ці ази по черзі.</text>
</svg>
