<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Собель проти Канні: коли що брати</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Собель — сирий градієнт, товсто й шумно, та дешево; Канні — тонко, чисто, зв'язано, та важче</text>
<rect x="60" y="108" width="400" height="296" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="260" y="132" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">СОБЕЛЬ (сирий градієнт)</text>
<rect x="175" y="148" width="170" height="110" rx="8" fill="#10131a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="260" cy="203" r="40" fill="none" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="6"/>
<rect x="185" y="158" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="228" y="215" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="271" y="182" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="314" y="239" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="207" y="206" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="250" y="173" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="293" y="230" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="186" y="197" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="229" y="164" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="272" y="221" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="315" y="188" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="208" y="245" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="251" y="212" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="294" y="179" width="3" height="3" rx="8" fill="#9ca3af" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="80" y="286" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ дешево, швидко (один прохід ядром)</text>
<text x="80" y="309" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ годиться для МК: лінія, прості мітки</text>
<text x="80" y="332" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">− товсті межі, шум, не зв'язані</text>
<text x="80" y="355" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">− треба поріг, щоб відсікти слабке</text>
<rect x="500" y="108" width="400" height="296" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="132" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">КАННІ (чистий конвеєр)</text>
<rect x="615" y="148" width="170" height="110" rx="8" fill="#10131a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="700" cy="203" r="40" fill="none" fill-opacity="1.0" stroke="#22c55e" stroke-width="2.2"/>
<text x="520" y="286" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ тонкі, чисті, ЗВ'ЯЗАНІ контури</text>
<text x="520" y="309" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">+ основа для форм і ліній Хафа (49.6)</text>
<text x="520" y="332" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">− важче: 4 кроки, два пороги</text>
<text x="520" y="355" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">− краще на бортовому комп'ютері (49.9)</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Сирий градієнт (Собель) — коли треба швидко й дешево; чистий контур (Канні) — коли далі форми й об'єкти (49.6, 49.8).</text>
</svg>
