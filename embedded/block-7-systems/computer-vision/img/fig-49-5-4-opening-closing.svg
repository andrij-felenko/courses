<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Відкриття і закриття: прибрати й залатати</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відкриття (ерозія→дилатація) прибирає цятки, не міняючи розміру; закриття (дилатація→ерозія) латає дірки, не міняючи розміру</text>
<rect x="40" y="100" width="430" height="224" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="255" y="124" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ВІДКРИТТЯ = ерозія → дилатація</text>
<rect x="80" y="150" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="155" cy="202" r="33" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="92" y="160" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="133" y="213" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="174" y="182" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="215" y="235" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="126" y="204" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="167" y="173" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="208" y="226" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="155" y="274" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">цятки навколо</text>
<line x1="238" y1="202" x2="276" y2="202" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="290" y="150" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="365" cy="202" r="33" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="365" y="274" font-size="8.3" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">цятки геть, розмір той самий</text>
<rect x="490" y="100" width="430" height="224" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="705" y="124" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЗАКРИТТЯ = дилатація → ерозія</text>
<rect x="530" y="150" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="605" cy="202" r="35" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="597" cy="202" r="9" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="619" cy="192" r="6" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="625" y="208" width="16" height="16" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="605" y="274" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дірки й щербини</text>
<line x1="688" y1="202" x2="726" y2="202" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="740" y="150" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="815" cy="202" r="35" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="815" y="274" font-size="8.3" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">залатано, розмір той самий</text>
<rect x="40" y="340" width="880" height="64" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<rect x="70" y="352" width="196" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="168.0" y="376" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">сіре / HSV</text>
<line x1="266" y1="372" x2="280" y2="372" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="280" y="352" width="196" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="378.0" y="376" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">поріг → маска</text>
<line x1="476" y1="372" x2="490" y2="372" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="490" y="352" width="196" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="588.0" y="376" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">морфологія</text>
<line x1="686" y1="372" x2="700" y2="372" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="700" y="352" width="196" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="798.0" y="376" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">чиста маска → 49.6</text>
<text x="480.0" y="458" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Спершу поріг ріже кадр на чорне-біле, тоді морфологія прибирає цятки й латає дірки — і маска готова для пошуку об'єктів (49.6).</text>
</svg>
