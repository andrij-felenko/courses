<text x="490" y="324" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому це сильно</text>
<text x="90" y="346" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• навіть якщо лінія РОЗІРВАНА чи в шумі — голоси справжніх точок усе одно збираються в один пік;</text>
<text x="90" y="367" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• так само ловлять КОЛА: кожна точка голосує за всі кола (центр + радіус), що крізь неї; пік у (cx, cy, r) — коло;</text>
<text x="90" y="388" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• звідси — лінія горизонту, край злітної смуги, дорожня розмітка, круглий посадковий майданчик.</text>
