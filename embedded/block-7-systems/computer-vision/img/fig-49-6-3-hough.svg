<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Перетворення Хафа: голосуванням знайти лінії (і кола)</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожна точка межі «голосує» за всі лінії, що крізь неї проходять; де голоси збігаються — там лінія (стійко до розривів)</text>
