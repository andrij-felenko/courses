<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Замикання петлі: зір як датчик керування</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кутова похибка стає сигналом для регулятора (PID): він крутить апарат / підвіс, щоб повернути ціль у центр кадру</text>
<rect x="40" y="160" width="168" height="70" rx="9" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="124.0" y="190" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Камера</text>
<text x="124.0" y="210" font-size="8.4" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">кадр</text>
<line x1="208" y1="195" x2="218" y2="195" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="218" y="160" width="168" height="70" rx="9" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="302.0" y="190" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Виявити / вести</text>
<text x="302.0" y="210" font-size="8.4" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">49.1–49.7</text>
<line x1="386" y1="195" x2="396" y2="195" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="396" y="160" width="168" height="70" rx="9" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="480.0" y="190" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Піксель → кут</text>
<text x="480.0" y="210" font-size="8.4" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">FOV / фокус</text>
<line x1="564" y1="195" x2="574" y2="195" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="574" y="160" width="168" height="70" rx="9" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="658.0" y="190" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Регулятор PID</text>
<text x="658.0" y="210" font-size="8.4" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">по кутовій похибці</text>
<line x1="742" y1="195" x2="752" y2="195" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="752" y="160" width="168" height="70" rx="9" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="836.0" y="190" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Виконавці</text>
<text x="836.0" y="210" font-size="8.4" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">рискання · підвіс</text>
<line x1="836" y1="232" x2="836" y2="300" stroke="#1a1a1a" stroke-width="1.7" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="836" y1="300" x2="124" y2="300" stroke="#1a1a1a" stroke-width="1.7" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="124" y1="300" x2="124" y2="234" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="292" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">апарат повертається → ціль вертається до центру кадру → петля замикається</text>
<rect x="150" y="330" width="660" height="84" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="354" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Зір тут — просто ще один ДАТЧИК у звичній петлі керування.</text>
<text x="190" y="374" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «помилка» = наскільки ціль НЕ в центрі (кутовий зсув);</text>
<text x="190" y="394" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• регулятор (той самий PID) крутить рискання чи підвіс, доки помилка → 0.</text>
</svg>
