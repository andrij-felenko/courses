<text x="300" y="316" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">м'яч</text>
<text x="250" y="342" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">«куб і м'яч на столі» — умить, без зусиль</text>
<rect x="530" y="110" width="360" height="250" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
