<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому здавалося легко: пастка «я ж бачу одразу»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">людині здається, що бачити — просто; та машині дано лише числа-пікселі, а не «це куб на столі»</text>
<rect x="70" y="110" width="360" height="250" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="250" y="134" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">що бачить ЛЮДИНА</text>
<rect x="110" y="278" width="280" height="14" rx="8" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
