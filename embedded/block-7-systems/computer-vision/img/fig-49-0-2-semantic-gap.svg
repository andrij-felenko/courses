<text x="710" y="342" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">лише сітка чисел-яскравостей — і ні слова про «куб»</text>
<text x="480" y="248" font-size="44" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">?</text>
<text x="480" y="392" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">семантична прірва</text>
<text x="480.0" y="440" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Машина не «бачить» куб — вона має лише числа. Перетворити числа на зміст і є вся задача машинного бачення.</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Те, що мозок робить непомітно, машині треба збудувати покроково — від пікселя до поняття.</text>
