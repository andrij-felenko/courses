<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470"
     viewBox="0 0 980 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Заземлення: чому сильний струм мотора «шумить» у давачі</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">спільна земля → струм мотора створює напругу, яку давач бачить як шум</text>
<rect x="40" y="90" width="440" height="320" rx="12" fill="#fff7f7" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="260" y="116" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">НЕПРАВИЛЬНО: спільна земля</text>
<text x="90" y="170" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">− батареї</text>
<circle cx="90" cy="185" r="5" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<line x1="90" y1="185" x2="420" y2="185" stroke="#1a1a1a" stroke-width="4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="255" y="175" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">один спільний провід землі (має опір)</text>
<rect x="180" y="220" width="90" height="44" rx="7" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="225" y="247" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<line x1="225" y1="220" x2="225" y2="185" stroke="#cc0000" stroke-width="3" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="258" y="210" font-size="9" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">великий струм</text>
<rect x="330" y="220" width="90" height="44" rx="7" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="375" y="247" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">давач</text>
<line x1="375" y1="220" x2="375" y2="185" stroke="#1f4ed8" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="255" y="320" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">струм мотора × опір проводу = напруга,</text>
<text x="255" y="338" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">яку давач «бачить» як шум (ground bounce)</text>
<rect x="500" y="90" width="440" height="320" rx="12" fill="#f4fbf6" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="720" y="116" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛЬНО: зіркова земля</text>
<circle cx="720" cy="300" r="6" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="720" y="322" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">одна спільна точка («зірка»)</text>
<rect x="560" y="180" width="90" height="44" rx="7" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="605" y="207" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<line x1="605" y1="224" x2="714" y2="298" stroke="#cc0000" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="790" y="180" width="90" height="44" rx="7" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="835" y="207" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">давач</text>
<line x1="835" y1="224" x2="726" y2="298" stroke="#1f4ed8" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="720" y="356" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">окремі шляхи сходяться в одній точці —</text>
<text x="720" y="374" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">струм мотора не тече через землю давача</text>
<text x="490.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому сильнострумову («брудну») землю моторів розводять окремо від тихої землі давачів, зводячи їх в одній точці біля батареї.</text>
</svg>
