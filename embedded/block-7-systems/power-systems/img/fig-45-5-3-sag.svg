<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Просадка під газом: ривок струму — провал напруги</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">напруга падає на I·Rвн і вертається; втомлена/холодна провалюється глибше</text>
<text x="80" y="70" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">газ / струм</text>
<rect x="90" y="78" width="770" height="88" rx="6" fill="#f8fafc" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<polyline points="90,146 240,146 240,94 410,94 410,146 560,146 560,94 650,94 650,146 860,146" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
