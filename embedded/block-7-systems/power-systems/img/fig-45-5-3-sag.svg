<text x="856" y="357.0" font-size="10" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">поріг failsafe (3.3 В/комірку)</text>
<polyline points="90,253.33333333333337 240,253.33333333333337 240,300.3333333333333 410,300.3333333333333 410,253.33333333333337 560,253.33333333333337 560,300.3333333333333 650,300.3333333333333 650,253.33333333333337 860,253.33333333333337" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.4" stroke-linejoin="round"/>
