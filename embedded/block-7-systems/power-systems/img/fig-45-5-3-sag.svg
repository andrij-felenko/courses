<polyline points="90,276.8333333333333 240,276.8333333333333 240,394.3333333333333 410,394.3333333333333 410,276.8333333333333 560,276.8333333333333 560,394.3333333333333 650,394.3333333333333 650,276.8333333333333 860,276.8333333333333" fill="none" fill-opacity="0.85" stroke="#cc0000" stroke-width="2.4" stroke-linejoin="round"/>
<text x="265" y="386.3333333333333" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">втомлена/холодна: дно нижче порога → brownout/failsafe</text>
<text x="480.0" y="468" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Дно ривка = Vспокою − I·Rвн. Що більший Rвн (старість, холод), то глибше дно — і легше проскочити поріг.</text>
