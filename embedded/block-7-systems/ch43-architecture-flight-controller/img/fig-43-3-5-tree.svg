<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500"
     viewBox="0 0 940 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Де що шукати: карта вихідників ArduPilot</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">імена з фігур вище — це реальні теки; ось куди дивитися</text>
<rect x="50" y="80" width="840" height="350" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="70" y="116" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">ardupilot/</text>
<text x="70" y="150" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">├─ ArduCopter/  ArduPlane/  Rover/  ArduSub/</text>
<text x="556" y="150" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← код апаратів: режими, головний цикл</text>
<text x="70" y="184" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">├─ libraries/</text>
<text x="70" y="218" font-size="13" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">│    ├─ AP_HAL*/</text>
<text x="556" y="218" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← HAL і бекенди (плата, SITL)</text>
<text x="70" y="252" font-size="13" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">│    ├─ AP_InertialSensor/ AP_GPS/ AP_Baro/</text>
<text x="556" y="252" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← драйвери давачів</text>
<text x="70" y="286" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">│    ├─ AP_AHRS/  AP_NavEKF3/</text>
<text x="556" y="286" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← оцінювач стану</text>
<text x="70" y="320" font-size="13" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">│    ├─ AC_AttitudeControl/ AC_PID/ AC_WPNav/</text>
<text x="556" y="320" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← керування й навігація</text>
<text x="70" y="354" font-size="13" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">│    └─ GCS_MAVLink/ AP_Logger/ AP_Param/</text>
<text x="556" y="354" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← наскрізні служби</text>
<text x="70" y="388" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">└─ Tools/</text>
<text x="556" y="388" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← SITL, autotest, скрипти</text>
<rect x="70" y="392" width="800" height="30" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="84" y="412" font-size="12" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AP_*  — спільні бібліотеки ArduPilot   ·   AC_*  — родом з ArduCopter</text>
<text x="470.0" y="486" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Відкривши незнайому гілку коду, за префіксом і текою одразу видно її роль у контурі.</text>
</svg>
