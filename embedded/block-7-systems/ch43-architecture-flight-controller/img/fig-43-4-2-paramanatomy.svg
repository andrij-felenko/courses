<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Будова параметра: ім'я кодує сенс, значення — поведінку</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сотні іменованих величин у незалежній пам'яті налаштовують апарат без перекомпіляції</text>
<rect x="150" y="96" width="96" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="198.0" y="122" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">ATC</text>
<line x1="198.0" y1="136" x2="198.0" y2="160" stroke="#1f4ed8" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="198.0" y="174" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">група: Attitude Control</text>
<rect x="252" y="96" width="80" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="292.0" y="122" font-size="15" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">RAT</text>
<line x1="292.0" y1="136" x2="292.0" y2="160" stroke="#0a8f3c" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="292.0" y="174" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">Rate — кутова швидкість</text>
<rect x="338" y="96" width="80" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="378.0" y="122" font-size="15" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">RLL</text>
<line x1="378.0" y1="136" x2="378.0" y2="160" stroke="#d98a00" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="378.0" y="174" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">Roll — вісь крену</text>
<rect x="424" y="96" width="56" height="40" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="452.0" y="122" font-size="15" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">P</text>
<line x1="452.0" y1="136" x2="452.0" y2="160" stroke="#cc0000" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="452.0" y="174" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">пропорційний коеф.</text>
<text x="492" y="122" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">= 0.135</text>
<text x="610" y="122" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">← значення</text>
<text x="150" y="212" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Зберігається в незалежній пам'яті (AP_Param) — переживає перезавантаження (Розділ 19).</text>
<text x="150" y="250" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Приклади параметрів:</text>
<rect x="150" y="268" width="300" height="30" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="162" y="288" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">BATT_LOW_VOLT = 14.0</text>
<rect x="458" y="268" width="400" height="30" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470" y="288" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">поріг низького заряду → failsafe</text>
<rect x="150" y="306" width="300" height="30" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="162" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">ANGLE_MAX = 3000</text>
<rect x="458" y="306" width="400" height="30" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470" y="326" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">макс. нахил (у сотих градуса = 30°)</text>
<rect x="150" y="344" width="300" height="30" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="162" y="364" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FENCE_ENABLE = 1</text>
<rect x="458" y="344" width="400" height="30" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470" y="364" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">увімкнути геозону</text>
<rect x="150" y="382" width="300" height="30" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="162" y="402" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">FS_THR_ENABLE = 1</text>
<rect x="458" y="382" width="400" height="30" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470" y="402" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">реакція на втрату RC-зв'язку</text>
<rect x="150" y="420" width="300" height="30" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="162" y="440" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AHRS_ORIENTATION = 0</text>
<rect x="458" y="420" width="400" height="30" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="470" y="440" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">як фізично повернуто плату</text>
<text x="480.0" y="468" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Код задає, ЩО апарат уміє; параметри — ЯК саме цей апарат це робить.</text>
</svg>
