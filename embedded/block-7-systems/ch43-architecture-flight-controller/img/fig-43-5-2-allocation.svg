<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500"
     viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що де живе: розподіл задач за роллю</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">критичне й швидке — на контролер; важке й розумне, але не миттєве — на комп'ютер</text>
<rect x="60" y="80" width="400" height="36" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="260" y="104" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ КОНТРОЛЕР (реальний час)</text>
<rect x="500" y="80" width="400" height="36" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="700" y="104" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ КОМП'ЮТЕР (не реальний час)</text>
<rect x="60" y="130" width="400" height="44" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="80" y="158" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Контур орієнтації (стабілізація)</text>
<rect x="500" y="130" width="400" height="44" rx="8" fill="#f5f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="520" y="158" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Машинне бачення, трекінг цілі</text>
<rect x="60" y="182" width="400" height="44" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="80" y="210" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Оцінювач стану (EKF, фьюжн)</text>
<rect x="500" y="182" width="400" height="44" rx="8" fill="#f5f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="520" y="210" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Візуальна одометрія / SLAM</text>
<rect x="60" y="234" width="400" height="44" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="80" y="262" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Мікшер і виходи на мотори</text>
<rect x="500" y="234" width="400" height="44" rx="8" fill="#f5f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="520" y="262" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Планування маршруту</text>
<rect x="60" y="286" width="400" height="44" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="80" y="314" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Failsafe й резервування</text>
<rect x="500" y="286" width="400" height="44" rx="8" fill="#f5f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="520" y="314" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Кодування й трансляція відео</text>
<rect x="60" y="338" width="400" height="44" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="80" y="366" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• RC-вхід, давачі польоту</text>
<rect x="500" y="338" width="400" height="44" rx="8" fill="#f5f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="520" y="366" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ML-інференс, складна логіка місії</text>
<rect x="60" y="400" width="840" height="40" rx="9" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="425" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Правило: «не впасти» — завжди ліворуч; «бути розумним» — праворуч. Перше не можна довірити тому, що буває зависає.</text>
<text x="480.0" y="486" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Багато апаратів комп'ютера не мають зовсім — і чудово літають. А ось без контролера не літає жоден.</text>
</svg>
