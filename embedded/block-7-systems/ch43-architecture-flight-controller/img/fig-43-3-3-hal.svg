<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440"
     viewBox="0 0 940 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="440" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">HAL: один політний код — десятки плат і навіть симулятор</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">AP_HAL ховає конкретне залізо, тож стек переноситься й тестується без ризику</text>
<rect x="70" y="86" width="800" height="66" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="470" y="116" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Польотний код ArduPilot</text>
<text x="470" y="138" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">єдиний, незалежний від плати (оцінювач, керування, навігація)</text>
<rect x="70" y="176" width="800" height="46" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470" y="204" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">AP_HAL — однаковий інтерфейс: UART · I2C · SPI · GPIO · RCOut · Scheduler</text>
<line x1="162" y1="222" x2="162" y2="268" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="70" y="270" width="185" height="74" rx="11" fill="#e3effb" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="162" y="298" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ChibiOS</text>
<text x="162" y="320" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">STM32: Pixhawk, Cube…</text>
<line x1="367" y1="222" x2="367" y2="268" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="275" y="270" width="185" height="74" rx="11" fill="#e3effb" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="367" y="298" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Linux</text>
<text x="367" y="320" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">одноплатники</text>
<line x1="572" y1="222" x2="572" y2="268" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="480" y="270" width="185" height="74" rx="11" fill="#e3effb" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="572" y="298" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ESP32</text>
<text x="572" y="320" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Wi-Fi МК</text>
<line x1="777" y1="222" x2="777" y2="268" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="685" y="270" width="185" height="74" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="777" y="298" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">SITL</text>
<text x="777" y="320" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">симуляція на ПК</text>
<text x="470.0" y="384" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">SITL — запусти ВЕСЬ стек на комп'ютері проти змодельованої фізики:</text>
<text x="470.0" y="404" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">«розбивай» дрон тисячу разів безкоштовно, перш ніж торкнутися заліза.</text>
</svg>
