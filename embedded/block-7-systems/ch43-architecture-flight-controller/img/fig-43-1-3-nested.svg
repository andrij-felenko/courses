<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510"
     viewBox="0 0 860 510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="510" fill="white"/>
<text x="430.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Контур у контурі: різні задачі — різні темпи</text>
<text x="430.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зовнішній контур веде апарат туди, куди треба; внутрішній не дає впасти</text>
<rect x="70" y="96" width="720" height="356" rx="12" fill="#f6f7fb" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.8"/>
<text x="86" y="116" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">НАВІГАЦІЯ / МІСІЯ — куди летіти</text>
<rect x="690" y="100" width="84" height="22" rx="6" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="732" y="115" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">~1–10 Гц</text>
<rect x="140" y="172" width="580" height="212" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="156" y="192" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">КОНТУР ПОЛОЖЕННЯ / ШВИДКОСТІ — тримати траєкторію</text>
<rect x="612" y="176" width="84" height="22" rx="6" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="654" y="191" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">~20–50 Гц</text>
<rect x="220" y="248" width="420" height="104" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="236" y="274" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">КОНТУР ОРІЄНТАЦІЇ (attitude) — не впасти</text>
<rect x="470" y="258" width="84" height="22" rx="6" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="512" y="273" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">~250–1000 Гц</text>
<text x="228" y="320" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="normal">вихід → команди на мотори та серво</text>
<text x="96" y="150" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">↓ задає уставку</text>
<text x="166" y="226" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">↓ задає уставку</text>
<text x="430.0" y="494" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Внутрішній контур — найшвидший і найкритичніший: не встигне — апарат перекинеться раніше, ніж зреагує навігація.</text>
</svg>
