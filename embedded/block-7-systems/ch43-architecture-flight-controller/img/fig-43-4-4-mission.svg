<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470"
     viewBox="0 0 940 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Місія — це послідовність точок із діями</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">станція планує точки → вантажить у FC (AP_Mission) → апарат летить сам</text>
<rect x="40" y="76" width="860" height="344" rx="12" fill="#f7faf7" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.3"/>
<polyline points="150,360 150,180 380,120 620,170 700,330" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="700" y1="330" x2="168" y2="356" stroke="#d98a00" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="440" y="406" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">RTL → повернення додому й посадка</text>
<circle cx="150" cy="360" r="15" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="172" y="347" width="150" height="26" rx="6" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="180" y="365" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ДІМ — зліт/посадка</text>
<circle cx="150" cy="180" r="15" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150" y="185" font-size="12" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="172" y="167" width="150" height="26" rx="6" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="180" y="185" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">1 · Зліт на висоту</text>
<circle cx="380" cy="120" r="15" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="380" y="125" font-size="12" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<rect x="402" y="107" width="150" height="26" rx="6" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="410" y="125" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">2 · Точка маршруту</text>
<circle cx="620" cy="170" r="15" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="620" y="175" font-size="12" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<rect x="642" y="157" width="150" height="26" rx="6" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="650" y="175" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">3 · Очікування (Loiter)</text>
<circle cx="700" cy="330" r="15" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="700" y="335" font-size="12" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<rect x="722" y="317" width="150" height="26" rx="6" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="730" y="335" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">4 · Точка маршруту</text>
<text x="470.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий контур — лише уставку тепер дає список точок, а не пілот (джерело уставки з Рис. 43.1.4).</text>
</svg>
