<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"
     viewBox="0 0 900 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="white"/>
<text x="450.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться «бажаний стан»: пілот чи місія — ядро те саме</text>
<text x="450.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ручний і автономний режими різняться лише джерелом уставки</text>
<rect x="46" y="78" width="250" height="78" rx="11" fill="#eef6ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="60" y="102" font-size="13" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ПІЛОТ — RC-стіки</text>
<text x="60" y="124" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ручна уставка просто зараз:</text>
<text x="60" y="139" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«нахили праворуч на 15°»</text>
<rect x="46" y="250" width="250" height="78" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="60" y="274" font-size="13" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">АВТОНОМНА МІСІЯ</text>
<text x="60" y="296" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">точки маршруту → навігація</text>
<text x="60" y="311" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">рахує уставку: «лети до точки B»</text>
<rect x="346" y="165" width="128" height="76" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="410" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ВИБІР</text>
<text x="410" y="212" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">РЕЖИМУ</text>
<line x1="296" y1="117" x2="344" y2="188" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="296" y1="289" x2="344" y2="218" stroke="#0a8f3c" stroke-width="2.0" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="512" y="165" width="188" height="76" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="606" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">КЕРУВАННЯ</text>
<text x="606" y="212" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">(те саме ядро)</text>
<line x1="474" y1="203" x2="510" y2="203" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="728" y="165" width="140" height="76" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="798" y="196" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ВИКОНАВЧІ</text>
<text x="798" y="212" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">МЕХАНІЗМИ</text>
<line x1="700" y1="203" x2="726" y2="203" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="450.0" y="414" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Те, що нижче «вибору режиму» (керування → виконання → апарат → давачі), однакове для ручного й автономного польоту.</text>
</svg>
