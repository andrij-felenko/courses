<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668"
     viewBox="0 0 900 668" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="668" fill="white"/>
<text x="450.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як народився ArduPilot: дві лінії, спільне залізо, розкол ліцензій</text>
<text x="450.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">згори вниз — час · ліворуч від осі лінія ArduPilot, праворуч — лінія PX4/ETH</text>
<text x="293" y="78" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ArduPilot  (хобі → Arduino)</text>
<text x="620" y="78" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">PX4 / Pixhawk  (ETH Zürich)</text>
<line x1="450" y1="92" x2="450" y2="600" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="450" y="622" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">час</text>
<rect x="150" y="97.0" width="286" height="46" rx="8" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<line x1="436" y1="120" x2="445" y2="120" stroke="#cc0000" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="120" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="462" y="124" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">2007</text>
<text x="164" y="116.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">DIY Drones — Кріс Андерсон:</text>
<text x="164" y="131.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">автопілот спершу на Lego Mindstorms</text>
<rect x="150" y="153.0" width="286" height="46" rx="8" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<line x1="436" y1="176" x2="445" y2="176" stroke="#cc0000" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="176" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="462" y="180" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">2009</text>
<text x="164" y="172.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduPilot на Arduino — Жорді Муньйос;</text>
<text x="164" y="187.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">засновано 3D Robotics (3DR)</text>
<rect x="470" y="209.0" width="300" height="46" rx="8" fill="#eff4ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<line x1="455" y1="232" x2="470" y2="232" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="232" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="438" y="236" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">2009</text>
<text x="484" y="228.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">MAVLink — протокол телеметрії</text>
<text x="484" y="243.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(Лоренц Маєр, ETH; див. Розділ 42)</text>
<rect x="150" y="265.0" width="286" height="46" rx="8" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<line x1="436" y1="288" x2="445" y2="288" stroke="#cc0000" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="288" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="462" y="292" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">2010–11</text>
<text x="164" y="284.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduPilotMega (APM): 8-біт ATmega2560 + IMU;</text>
<text x="164" y="299.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduCopter — підтримка мультироторів</text>
<line x1="150" y1="348" x2="770" y2="348" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="4,4" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="222" y="318" width="456" height="60" rx="11" fill="#dcfce7" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="240" y="339" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">2012–13 · Спільне 32-бітне залізо</text>
<text x="240" y="357" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">8-біт уперся в стелю; PX4 і AP_HAL — 2012,</text>
<text x="240" y="372" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">плата Pixhawk (STM32) — 2013; стеки → ARM + RTOS</text>
<rect x="470" y="391.0" width="300" height="46" rx="8" fill="#eff4ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<line x1="455" y1="414" x2="470" y2="414" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="414" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="438" y="418" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">2014</text>
<text x="484" y="410.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Dronecode — фундація під Linux Foundation</text>
<text x="484" y="425.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(хостить PX4, MAVLink, QGroundControl)</text>
<line x1="150" y1="476" x2="770" y2="476" stroke="#d98a00" stroke-width="1.4" stroke-dasharray="4,4" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="222" y="446" width="456" height="60" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="240" y="467" font-size="12.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">2016 · Розкол через ліцензії</text>
<text x="240" y="485" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduPilot виходить із Dronecode → незалежний (GPLv3);</text>
<text x="240" y="500" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">PX4 лишається в Dronecode (ліцензія BSD)</text>
<rect x="150" y="525.0" width="286" height="46" rx="8" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<line x1="436" y1="548" x2="445" y2="548" stroke="#cc0000" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="548" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="462" y="552" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">тепер</text>
<text x="164" y="544.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduPilot.org: RTOS ChibiOS, STM32H7;</text>
<text x="164" y="559.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Copter · Plane · Rover · Sub · Tracker</text>
<rect x="470" y="525.0" width="300" height="46" rx="8" fill="#eff4ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<line x1="455" y1="548" x2="470" y2="548" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="450" cy="548" r="5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="438" y="552" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">тепер</text>
<text x="484" y="544.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">PX4 у Dronecode; спільний інструмент —</text>
<text x="484" y="559.5" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">наземна станція QGroundControl</text>
<text x="450.0" y="652" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Хобі-лінія (Arduino) і академічна лінія (ETH) зійшлися на залізі Pixhawk, а потім розійшлися через ліцензії — звідси два великі відкриті автопілоти.</text>
</svg>
