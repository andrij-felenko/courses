<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Піксель → кут: де ціль відносно камери</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">детектор дає піксель; щоб діяти, потрібен КУТ; зсув пікселя від центру в межах поля зору (FOV) → кутовий зсув</text>
<text x="230" y="116" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кадр із детектора</text>
<rect x="90" y="130" width="280" height="175" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="230" y1="138" x2="230" y2="297" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="98" y1="217" x2="362" y2="217" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="260" y="150" font-size="8" fill="#94a3b8" text-anchor="start" font-weight="normal" font-style="normal">центр</text>
<circle cx="158" cy="217" r="13" fill="#f59e0b" fill-opacity="1.0" stroke="white" stroke-width="1.4"/>
<line x1="230" y1="217" x2="158" y2="217" stroke="#cc0000" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="196" y="206" font-size="8.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">зсув 120 px</text>
<text x="700" y="116" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">поле зору камери (згори)</text>
<polygon points="700,140 560,320 840,320" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="700" y1="140" x2="700" y2="320" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="700" y="336" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вісь камери</text>
<text x="700" y="300" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">FOV 60°</text>
<line x1="700" y1="140" x2="666.035998822975" y2="314.7296386536842" stroke="#cc0000" stroke-width="2" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="666.035998822975" cy="314.7296386536842" r="9" fill="#f59e0b" fill-opacity="1.0" stroke="white" stroke-width="1.2"/>
<text x="648.035998822975" y="318.7296386536842" font-size="8.5" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">ціль</text>
<text x="636" y="210" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">≈ 11° ліворуч</text>
<rect x="120" y="330" width="720" height="86" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кут ≈ (зсув у пікселях / півширина кадру) × (FOV / 2)</text>
<text x="480" y="378" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">точніше: кут = atan( зсув / фокусна_відстань_у_пікселях )</text>
<text x="480" y="400" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">приклад: 120 px при півширині 320 px і FOV 60° → ≈ 11° (точне число залежить від камери — її КАЛІБРУЮТЬ)</text>
</svg>
