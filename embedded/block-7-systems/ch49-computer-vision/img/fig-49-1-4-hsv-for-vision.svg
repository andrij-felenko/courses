  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому для зору беруть HSV, а не RGB</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">знайти «помаранчевий м'яч»: у RGB світло зрушує всі три числа; у HSV тон майже не міняється</text>
<rect x="60" y="110" width="400" height="250" rx="12" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="260" y="134" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">у RGB — важко</text>
<circle cx="150" cy="196" r="30" fill="rgb(250,150,40)" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150" y="240" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">яскраве світло</text>
<text x="150" y="256" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">R250 G150 B40</text>
<circle cx="360" cy="196" r="30" fill="rgb(120,70,18)" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="360" y="240" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тьмяне світло</text>
<text x="360" y="256" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">R120 G70 B18</text>
<text x="260" y="298" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">усі три числа поповзли!</text>
<text x="260" y="320" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">«помаранчевий» — рухома ціль у 3D,</text>
<text x="260" y="336" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">яку важко задати порогом</text>
<rect x="500" y="110" width="400" height="250" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="134" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">у HSV — легко</text>
<circle cx="590" cy="196" r="30" fill="rgb(250,150,40)" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="590" y="240" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">яскраве</text>
<text x="590" y="256" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">H32° S84 V98</text>
<circle cx="810" cy="196" r="30" fill="rgb(120,70,18)" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="810" y="240" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тьмяне</text>
<text x="810" y="256" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">H32° S85 V47</text>
<text x="700" y="298" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">тон H майже не змінився!</text>
<text x="700" y="320" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">«помаранчевий» = смужка тону 20–40°</text>
<text x="700" y="336" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ один поріг, стійко до світла</text>
