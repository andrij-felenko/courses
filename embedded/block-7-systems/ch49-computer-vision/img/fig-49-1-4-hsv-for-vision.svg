<text x="292" y="418" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">↑ смужка «помаранчевого» тону</text>
<text x="700" y="456" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="italic">Тому колір шукають у HSV: тон тримається попри світло. RGB→HSV, узяв смужку тону — і ось ціль (49.6).</text>
