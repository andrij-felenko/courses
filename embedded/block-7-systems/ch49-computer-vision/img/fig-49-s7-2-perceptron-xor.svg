<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Стіна XOR: чому одного шару замало</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перцептрон креслить ОДНУ пряму межу — а XOR нею не розділиш; багатошарова мережа (зі зворотним поширенням) гне межу</text>
<rect x="40" y="100" width="280" height="250" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="180" y="124" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">один нейрон (перцептрон)</text>
<circle cx="90" cy="180" r="9" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="90" cy="240" r="9" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="70" y="184" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">x₁</text>
<text x="70" y="244" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">x₂</text>
<circle cx="190" cy="210" r="18" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="190" y="214" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Σ</text>
<line x1="99" y1="182" x2="174" y2="206" stroke="#6b7280" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="99" y1="238" x2="174" y2="216" stroke="#6b7280" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="140" y="188" font-size="8" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">w₁</text>
<text x="140" y="240" font-size="8" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">w₂</text>
<line x1="208" y1="210" x2="246" y2="210" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="248" y="196" width="44" height="28" rx="5" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="270" y="214" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">поріг</text>
<text x="180" y="300" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зважена сума + поріг</text>
<text x="180" y="316" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">= ОДНА пряма межа</text>
<rect x="340" y="100" width="280" height="250" rx="12" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480" y="124" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">XOR: одна пряма НЕ ділить ✗</text>
<circle cx="410" cy="300" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="540" cy="170" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="410" cy="170" r="11" fill="#cc0000" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="540" cy="300" r="11" fill="#cc0000" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<line x1="400" y1="189.5" x2="550" y2="306.5" stroke="#cc0000" stroke-width="2.6" stroke-dasharray="6,4" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="640" y="100" width="280" height="250" rx="12" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="124" font-size="10" fill="#22c55e" text-anchor="middle" font-weight="bold" font-style="normal">кілька шарів — межа гнеться ✓</text>
<circle cx="710" cy="300" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="840" cy="170" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="710" cy="170" r="11" fill="#cc0000" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<circle cx="840" cy="300" r="11" fill="#cc0000" fill-opacity="1.0" stroke="white" stroke-width="1.5"/>
<polyline points="700,261.0 775.0,219.4 850,261.0" fill="none" fill-opacity="1.0" stroke="#22c55e" stroke-width="2.6" stroke-linejoin="round"/>
<polyline points="700,209.0 775.0,250.6 850,209.0" fill="none" fill-opacity="1.0" stroke="#22c55e" stroke-width="2.6" stroke-linejoin="round"/>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Сині й червоні точки XOR не розрізати однією прямою. Багато шарів (навчених зворотним поширенням, 1986) гнуть межу — і беруть її.</text>
</svg>
