<text x="710" y="268" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">людина: тисячі поз, одеж, ракурсів</text>
<text x="710" y="288" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">який єдиний «колір» чи «форма»? — жодних</text>
<text x="710" y="326" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">рукотворне правило тут безсиле</text>
<rect x="110" y="376" width="740" height="46" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="398" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Розв'язок: не вигадувати правило, а показати мережі МІЛЬЙОНИ прикладів —</text>
<text x="480" y="414" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">хай вона САМА виведе, як виглядає «людина». Це і є навчання.</text>
