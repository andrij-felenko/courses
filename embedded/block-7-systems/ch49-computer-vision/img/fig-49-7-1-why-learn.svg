  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому не правило, а навчання</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">рукотворне правило (49.6) ловить просту ціль, та безсиле перед «людиною» чи «авто» — надто різні; тож детектор НАВЧАЮТЬ</text>
<rect x="50" y="108" width="400" height="250" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="250" y="132" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">проста ціль → рукотворне правило ✓</text>
<circle cx="250" cy="206" r="42" fill="#f59e0b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250" y="270" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">м'яч: ОДИН колір</text>
<text x="250" y="290" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ поріг у HSV і все (49.6)</text>
<text x="250" y="328" font-size="9" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">просте, дешеве, зрозуміле</text>
