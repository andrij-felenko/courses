<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Де це працює — і чому пильнувати затримку</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">точна посадка по мітці, стеження за ціллю, політ за лінією; та зір повільний — петля має лаг, тож м'які підсилення й передбачення</text>
<rect x="50" y="102" width="270" height="104" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="185" y="126" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">точна посадка</text>
<text x="72" y="152" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мітка → кут → корекція</text>
<text x="72" y="171" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ArduPilot: LANDING_TARGET</text>
<rect x="340" y="102" width="270" height="104" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="475" y="126" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">стеження за ціллю</text>
<text x="362" y="152" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тримати ціль у центрі</text>
<text x="362" y="171" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(підвіс / рискання)</text>
<rect x="630" y="102" width="270" height="104" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="765" y="126" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">політ за лінією</text>
<text x="652" y="152" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">кут лінії → рискання</text>
<text x="652" y="171" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(лінія з Хафа, 49.6)</text>
<rect x="50" y="222" width="860" height="92" rx="11" fill="#fffbeb" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="480" y="244" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold" font-style="normal">Зір ПОВІЛЬНИЙ — петля бачить трохи минуле</text>
<text x="82" y="266" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• інференс (49.7) і затримка тракту (48.5) додають лаг → ризик розгойдування;</text>
<text x="82" y="287" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• лік: М'ЯКІ підсилення PID, ПЕРЕДБАЧЕННЯ між кадрами (Кальман, 46), і ЗАПАСНИЙ план, якщо ціль зникла.</text>
<rect x="80" y="340" width="250" height="56" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="205" y="362" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Бортовий комп'ютер</text>
<text x="205" y="380" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зір: детектор + трекінг</text>
<line x1="330" y1="368" x2="368" y2="368" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="368" y="340" width="250" height="56" rx="9" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="493" y="362" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">MAVLink</text>
<text x="493" y="380" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кут / координати цілі</text>
<line x1="618" y1="368" x2="656" y2="368" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="656" y="340" width="250" height="56" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="781" y="362" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Політний контролер</text>
<text x="781" y="380" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">замикає петлю → мотори</text>
<text x="480.0" y="458" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">На апараті зір зазвичай живе в бортовому комп'ютері, а кут цілі йде по MAVLink у політний контролер — той і замикає петлю.</text>
</svg>
