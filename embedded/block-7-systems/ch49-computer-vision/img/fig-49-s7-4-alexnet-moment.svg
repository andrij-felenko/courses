<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">AlexNet, 2012: мить, коли зір став глибоким</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">на змаганні ImageNet глибока мережа збила помилку з 26% до 15%, і відтоді машинний зір пішов у глибоке навчання</text>
<line x1="130" y1="360" x2="850" y2="360" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="122" y="132" font-size="9" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">помилка (top-5), %</text>
<line x1="130" y1="318.3333333333333" x2="800" y2="318.3333333333333" stroke="#cc0000" stroke-width="1.4" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="805" y="321.3333333333333" font-size="8.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">люди ≈ 5%</text>
<rect x="150" y="141.66666666666669" width="120" height="218.33333333333331" rx="4" fill="#d98a00" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="210.0" y="133.66666666666669" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">26.2%</text>
<text x="210.0" y="376" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">2011</text>
<text x="210.0" y="390" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">класика (не нейро)</text>
<rect x="326" y="232.5" width="120" height="127.5" rx="4" fill="#0a8f3c" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="386.0" y="224.5" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">15.3%</text>
<text x="386.0" y="376" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">2012</text>
<text x="386.0" y="390" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">AlexNet (глибока CNN)</text>
<rect x="502" y="301.6666666666667" width="120" height="58.333333333333336" rx="4" fill="#0a8f3c" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="562.0" y="293.6666666666667" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">7.0%</text>
<text x="562.0" y="376" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">2014</text>
<text x="562.0" y="390" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ще глибше</text>
<rect x="678" y="330.0" width="120" height="30.000000000000004" rx="4" fill="#0a8f3c" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="738.0" y="322.0" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">3.6%</text>
<text x="738.0" y="376" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">2015</text>
<text x="738.0" y="390" font-size="7.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">нижче людини</text>
<line x1="210.0" y1="115.66666666666669" x2="386.0" y2="206.5" stroke="#cc0000" stroke-width="1.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="298.0" y="110" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">−11% за рік!</text>
<rect x="60" y="392" width="840" height="30" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<text x="480" y="412" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">У нашому дроні — правнуки AlexNet: ті самі навчені згортки, лише компактніші, для бортового інференсу (49.7).</text>
</svg>
