<text x="135.0" y="260" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">сирий знімок</text>
<text x="135.0" y="275" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">з камери</text>
<text x="135.0" y="290" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">(vidisector)</text>
<line x1="230" y1="225.0" x2="260" y2="225.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="260" y="150" width="190" height="150" rx="10" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.0"/>
<text x="355.0" y="176" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">фігура / тло</text>
<rect x="325.0" y="196" width="60" height="40" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="341.0" y="204" width="30" height="26" rx="8" fill="none" fill-opacity="1.0" stroke="#d98a00" stroke-width="2" stroke-dasharray="3,2"/>
<text x="355.0" y="260" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">відділити</text>
<text x="355.0" y="275" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">об'єкти</text>
<text x="355.0" y="290" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">від тла</text>
<line x1="450" y1="225.0" x2="480" y2="225.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="480" y="150" width="190" height="150" rx="10" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.0"/>
<text x="575.0" y="176" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">області</text>
<rect x="545.0" y="196" width="60" height="40" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="563.0" y="202" width="26" height="28" rx="8" fill="#f59e0b" fill-opacity="1.0" stroke="white" stroke-width="1"/>
<text x="575.0" y="260" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">об'єкт ·</text>
<text x="575.0" y="275" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">тло ·</text>
<text x="575.0" y="290" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">хаос</text>
<line x1="670" y1="225.0" x2="700" y2="225.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="700" y="150" width="190" height="150" rx="10" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="795.0" y="176" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">назвати</text>
<rect x="779.0" y="198" width="32" height="34" rx="8" fill="#f59e0b" fill-opacity="1.0" stroke="white" stroke-width="1.2"/>
<text x="795.0" y="220" font-size="15" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<text x="795.0" y="260" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">куб, м'яч,</text>
<text x="795.0" y="275" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">циліндр</text>
<text x="795.0" y="290" font-size="9.5" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">(прості тіла)</text>
<rect x="40" y="330" width="880" height="72" rx="10" fill="#fff5f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<text x="480" y="354" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Кожна стрілка тут — окрема велика задача (і кожна стала окремою темою цього розділу).</text>
<text x="480" y="377" font-size="9.8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Команда думала пройти весь ланцюг за літо. Перша ж ланка — «де об'єкт, а де тло» — виявилась проваллям.</text>
</svg>
