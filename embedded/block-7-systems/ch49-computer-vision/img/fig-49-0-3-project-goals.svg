<rect x="125.0" y="216" width="9" height="9" rx="8" fill="rgb(166,158,167)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="135.0" y="216" width="9" height="9" rx="8" fill="rgb(177,167,174)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="145.0" y="216" width="9" height="9" rx="8" fill="rgb(188,176,181)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="155.0" y="216" width="9" height="9" rx="8" fill="rgb(199,185,188)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="105.0" y="226" width="9" height="9" rx="8" fill="rgb(151,145,162)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="115.0" y="226" width="9" height="9" rx="8" fill="rgb(162,154,169)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="125.0" y="226" width="9" height="9" rx="8" fill="rgb(173,163,176)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="135.0" y="226" width="9" height="9" rx="8" fill="rgb(184,172,183)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="145.0" y="226" width="9" height="9" rx="8" fill="rgb(195,181,190)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
