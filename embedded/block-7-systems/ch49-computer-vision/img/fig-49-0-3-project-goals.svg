  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що насправді замовили: від пікселів до названих тіл</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поділити кадр на області (об'єкт / тло / хаос), описати їх — і назвати прості тіла на однорідному тлі</text>
<rect x="40" y="150" width="190" height="150" rx="10" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.0"/>
<text x="135.0" y="176" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">кадр</text>
<rect x="105.0" y="196" width="9" height="9" rx="8" fill="rgb(130,130,135)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="115.0" y="196" width="9" height="9" rx="8" fill="rgb(141,139,142)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="125.0" y="196" width="9" height="9" rx="8" fill="rgb(152,148,149)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="135.0" y="196" width="9" height="9" rx="8" fill="rgb(163,157,156)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
