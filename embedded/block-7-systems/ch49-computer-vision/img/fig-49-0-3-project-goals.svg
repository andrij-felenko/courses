<rect x="125.0" y="206" width="9" height="9" rx="8" fill="rgb(159,153,158)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="135.0" y="206" width="9" height="9" rx="8" fill="rgb(170,162,165)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="145.0" y="206" width="9" height="9" rx="8" fill="rgb(181,171,172)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="155.0" y="206" width="9" height="9" rx="8" fill="rgb(192,180,179)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="105.0" y="216" width="9" height="9" rx="8" fill="rgb(144,140,153)" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
