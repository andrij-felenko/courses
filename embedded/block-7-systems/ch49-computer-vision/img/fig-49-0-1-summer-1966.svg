<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Літо 1966-го: «розв'яжемо зір за канікули»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">у MIT гадали, що навчити машину бачити — справа на одне літо; вийшов науковий напрям на десятиліття</text>
<rect x="80" y="110" width="300" height="180" rx="6" fill="#fffef7" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="80" y="110" width="300" height="32" rx="6" fill="#fff5e6" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="230" y="131" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">MIT · Project MAC · AI Group</text>
<text x="100" y="164" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">THE SUMMER VISION PROJECT</text>
<text x="100" y="183" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">Seymour Papert · 7 липня 1966</text>
<text x="100" y="208" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Мета: за літо зробити систему,</text>
<text x="100" y="225" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">що поділить кадр на об'єкти</text>
<text x="100" y="242" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">й тло — і назве прості тіла.</text>
<text x="100" y="259" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Координує Джеральд Сассмен</text>
<text x="100" y="276" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(студент) з гуртом студентів.</text>
<line x1="398" y1="200" x2="466" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="700" y="126" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">а насправді…</text>
<line x1="500" y1="200" x2="900" y2="200" stroke="#6b7280" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="520" cy="200" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="520" y="222" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">1966</text>
<text x="520" y="235" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">літо</text>
<circle cx="640" cy="200" r="5" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="640" y="222" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">1980-ті</text>
<circle cx="770" cy="200" r="5" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="770" y="222" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">2010-ті</text>
<circle cx="885" cy="200" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="885" y="222" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">досі</text>
<text x="700" y="262" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">те, що думали зробити за літо,</text>
<text x="700" y="277" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">будують і досі — це ціла наука</text>
<rect x="80" y="320" width="800" height="92" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="344" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому ця історія — на початку розділу про машинне бачення?</text>
<text x="118" y="366" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Бо це найвідоміший урок про те, що «очевидне» для людини буває страшенно важким для машини.</text>
<text x="118" y="384" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Саме з цього невдалого літа й виріс увесь напрям, ази якого ми пройдемо в цьому розділі.</text>
</svg>
