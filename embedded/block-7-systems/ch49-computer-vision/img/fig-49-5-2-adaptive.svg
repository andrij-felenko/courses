<text x="480" y="114" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ГЛОБАЛЬНИЙ поріг — хибить</text>
<rect x="350" y="128" width="260" height="150" rx="8" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
