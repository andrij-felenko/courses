<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Коли один поріг не годиться: адаптивний поріг</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">при нерівному світлі глобальний поріг скрізь хибить; локальний рахує T для кожної ділянки окремо</text>
<text x="170" y="114" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">оригінал (нерівне світло)</text>
