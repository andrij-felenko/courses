<text x="546" y="206" font-size="8.5" fill="#777" text-anchor="middle" font-weight="normal" font-style="normal">провалено</text>
<rect x="350" y="128" width="260" height="150" rx="8" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="790" y="114" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">АДАПТИВНИЙ — добре</text>
