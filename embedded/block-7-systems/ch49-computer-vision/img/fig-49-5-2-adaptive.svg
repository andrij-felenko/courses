<text x="170" y="296" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">світло спадає зліва направо →</text>
<rect x="40" y="312" width="880" height="92" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="336" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому глобальний поріг ламається</text>
<text x="70" y="358" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• одне T на весь кадр: де яскраво — усе «об'єкт», де тінь — усе «тло»; напис гине і там, і там;</text>
<text x="70" y="378" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• адаптивний рахує T для КОЖНОЇ ділянки з її ж околу → тінь і світло більше не збивають поділ.</text>
<text x="480.0" y="452" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Нерівне світло — головний ворог порога. Локальний поріг дивиться на окіл, тож тримається попри тіні й віньєтку.</text>
