<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Лінійний стабілізатор: простий і тихий, але спалює різницю в тепло</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">прохідний транзистор гасить надлишок напруги — і та потужність стає теплом</text>
<text x="110" y="250" font-size="14" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">Vвх</text>
<text x="110" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">16 В</text>
<line x1="140" y1="255" x2="360" y2="255" stroke="#1a1a1a" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="215" width="130" height="80" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="425" y="248" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">прохідний</text>
<text x="425" y="264" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">транзистор</text>
<text x="425" y="286" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">падає (Vвх−Vвих)</text>
<path d="M 395 210 q 8 -14 0 -28 q -8 -14 0 -28" fill="none" stroke="#cc0000" stroke-width="1.8"/>
<path d="M 425 210 q 8 -14 0 -28 q -8 -14 0 -28" fill="none" stroke="#cc0000" stroke-width="1.8"/>
<path d="M 455 210 q 8 -14 0 -28 q -8 -14 0 -28" fill="none" stroke="#cc0000" stroke-width="1.8"/>
<text x="425" y="150" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">(Vвх−Vвих)·I → ТЕПЛО</text>
<line x1="490" y1="255" x2="720" y2="255" stroke="#1a1a1a" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="740" y="250" font-size="14" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Vвих</text>
<text x="740" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">5 В</text>
<rect x="120" y="330" width="360" height="92" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="140" y="356" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">ККД = Vвих / Vвх</text>
<text x="140" y="384" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">16 В → 5 В:  ККД ≈ 5/16 ≈ 31%</text>
<text x="140" y="408" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">решта 69% — у тепло</text>
<rect x="520" y="330" width="340" height="92" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="540" y="356" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Коли все ж лінійний?</text>
<text x="540" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• малий перепад, малий струм</text>
<text x="540" y="398" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• потрібна ТИША (давачі, аналог)</text>
<text x="480.0" y="458" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Чим більший перепад напруги й струм, тим більше тепла лінійний просто марнує. Для батареї це розкіш.</text>
</svg>
