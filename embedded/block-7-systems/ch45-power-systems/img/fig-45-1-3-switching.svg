<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Імпульсний перетворювач: не палить різницю, а ПЕРЕНОСИТЬ енергію</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ключ ріже вхід, котушка й конденсатор запасають і згладжують — ККД 85–95%</text>
<text x="70" y="235" font-size="13" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">Vвх</text>
<line x1="100" y1="240" x2="180" y2="240" stroke="#1a1a1a" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="180" y="205" width="120" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="240" y="235" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КЛЮЧ</text>
<text x="240" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">MOSFET ріже</text>
<line x1="300" y1="240" x2="350" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="350" y="205" width="120" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="410" y="235" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">КОТУШКА</text>
<text x="410" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">запасає енергію</text>
<line x1="470" y1="240" x2="520" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="520" y="205" width="120" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="580" y="235" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ДІОД</text>
<text x="580" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">замикає струм</text>
<line x1="640" y1="240" x2="660" y2="240" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="660" y="205" width="120" height="70" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="720" y="235" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КОНД.</text>
<text x="720" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">згладжує</text>
<line x1="780" y1="240" x2="850" y2="240" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="875" y="235" font-size="13" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Vвих</text>
<rect x="300" y="310" width="360" height="56" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="480" y="344" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ККД ≈ 85–95%  (майже без тепла)</text>
<text x="480.0" y="400" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Уміє і знижувати (buck), і підвищувати (boost) напругу — на відміну від лінійного, що тільки знижує.</text>
<text x="480.0" y="466" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Як саме ці чотири деталі творять диво — розберемо в наступній темі (45.2). Тут головне: енергія не згоряє, а передається.</text>
</svg>
