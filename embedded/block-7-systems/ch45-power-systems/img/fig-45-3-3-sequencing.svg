<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Послідовність увімкнення: деяким чіпам шини треба в правильному порядку</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">не всі рейки можна вмикати разом — інколи порядок критичний</text>
<line x1="130" y1="390" x2="830" y2="390" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="830" y="408" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<text x="120" y="155" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">ядро 1.8 В</text>
<polyline points="130,180 200,180 230,138 820,138" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="215" y1="184" x2="215" y2="390" stroke="#1f4ed8" stroke-width="1.0" stroke-dasharray="3,3" stroke-opacity="0.5" stroke-linecap="round"/>
<text x="120" y="255" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">вв/в 3.3 В</text>
<polyline points="130,280 280,280 310,238 820,238" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="295" y1="284" x2="295" y2="390" stroke="#0a8f3c" stroke-width="1.0" stroke-dasharray="3,3" stroke-opacity="0.5" stroke-linecap="round"/>
<text x="120" y="355" font-size="11" fill="#d98a00" text-anchor="end" font-weight="bold" font-style="normal">периферія 5 В</text>
<polyline points="130,380 360,380 390,338 820,338" fill="none" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="375" y1="384" x2="375" y2="390" stroke="#d98a00" stroke-width="1.0" stroke-dasharray="3,3" stroke-opacity="0.5" stroke-linecap="round"/>
<text x="200" y="405" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">1-ша</text>
<text x="280" y="420" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">2-га</text>
<text x="360" y="405" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">3-тя</text>
<rect x="600" y="110" width="300" height="150" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="750" y="136" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо порядок</text>
<text x="618" y="162" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Подаси не в тому порядку —</text>
<text x="618" y="180" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">і чіп може «защемити» (latch-up),</text>
<text x="618" y="198" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перегрітись чи зависнути.</text>
<text x="618" y="216" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="618" y="234" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Тому ставлять контролер</text>
<text x="618" y="252" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">послідовності, що вмикає рейки</text>
<text x="618" y="270" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">одна за одною, з паузами.</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Те саме — і при вимкненні (часто у зворотному порядку). Для простих апаратів про це дбають готові мікросхеми живлення.</text>
</svg>
