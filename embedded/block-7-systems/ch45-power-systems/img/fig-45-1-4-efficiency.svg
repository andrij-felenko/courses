<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ККД і тепло: чому для батареї беруть імпульсний</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">лінійний втрачає тим більше, чим глибший перепад; імпульсний — майже стало</text>
<line x1="90" y1="360" x2="450" y2="360" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="90" y1="360" x2="90" y2="110" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="450" y="378" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">Vвих / Vвх →</text>
<text x="82" y="116" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">ККД</text>
<text x="82" y="364" font-size="9" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">0</text>
<text x="82" y="130" font-size="9" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">100%</text>
<line x1="90" y1="150" x2="430" y2="150" stroke="#0a8f3c" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="270" y="142" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">імпульсний ~90%</text>
<line x1="90" y1="360" x2="430" y2="132" stroke="#cc0000" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="340" y="250" font-size="11" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">лінійний = Vвих/Vвх</text>
<circle cx="195.4" cy="289.32" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="195.4" y1="360" x2="195.4" y2="366" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="195.4" y="380" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">16→5В</text>
<text x="700" y="130" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: 16 В → 5 В @ 1 А</text>
<text x="560" y="168" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">втрата в тепло:</text>
<rect x="560" y="180" width="300" height="40" rx="8" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<text x="572" y="205" font-size="12.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">лінійний:  ~11 Вт</text>
<rect x="560" y="232" width="110" height="40" rx="8" fill="#d8f3e0" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="572" y="257" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">імпульс.: ~1 Вт</text>
<text x="560" y="308" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Висновок: для глибокого перепаду й помітного струму</text>
<text x="560" y="328" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">— імпульсний; лінійний — для малих чистих шин.</text>
<text x="480.0" y="458" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тепло — ворог (Розділу 3, 44): кожен змарнований ват треба ще й відвести, а на дроні зайвого тепла й ваги нема куди дівати.</text>
</svg>
