<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому він ПЕРЕЗАРЯДЖУВАНИЙ: «крісло-гойдалка» іонів літію</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">іони Li⁺ снують між електродами, ковзаючи в шари, не руйнуючи їх (інтеркаляція)</text>
<rect x="120" y="130" width="130" height="230" rx="8" fill="#f7f9ff" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<line x1="130" y1="150" x2="240" y2="150" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="130" y1="186" x2="240" y2="186" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="130" y1="222" x2="240" y2="222" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="130" y1="258" x2="240" y2="258" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="130" y1="294" x2="240" y2="294" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="130" y1="330" x2="240" y2="330" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<text x="185" y="384" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">КАТОД</text>
<text x="185" y="402" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">LiCoO₂ (Гуденаф)</text>
<rect x="710" y="130" width="130" height="230" rx="8" fill="#f7f9ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<line x1="720" y1="150" x2="830" y2="150" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="720" y1="186" x2="830" y2="186" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="720" y1="222" x2="830" y2="222" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="720" y1="258" x2="830" y2="258" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="720" y1="294" x2="830" y2="294" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="720" y1="330" x2="830" y2="330" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
<text x="775" y="384" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">АНОД</text>
<text x="775" y="402" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">графіт (Йосіно)</text>
<rect x="260" y="130" width="440" height="230" rx="8" fill="#eef6ff" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="480" y="150" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">електроліт (провідник для іонів Li⁺)</text>
<circle cx="330" cy="250" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="330" y="254" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Li⁺</text>
<circle cx="400" cy="250" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="400" y="254" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Li⁺</text>
<circle cx="470" cy="250" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="470" y="254" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Li⁺</text>
<circle cx="540" cy="250" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="540" y="254" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Li⁺</text>
<circle cx="610" cy="250" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="610" y="254" font-size="8" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Li⁺</text>
<line x1="360" y1="215" x2="600" y2="215" stroke="#d98a00" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="206" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ЗАРЯД: Li⁺ → до анода</text>
<line x1="600" y1="290" x2="360" y2="290" stroke="#0a8f3c" stroke-width="2.4" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="308" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">РОЗРЯД: Li⁺ → до катода (живить апарат)</text>
<line x1="185" y1="130" x2="185" y2="90" stroke="#1a1a1a" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="185" y1="90" x2="775" y2="90" stroke="#1a1a1a" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="775" y1="90" x2="775" y2="130" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480" y="82" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">електрони — зовнішнім колом (струм у навантаження)</text>
<text x="480.0" y="466" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Іони лиш «ковзають» у шари електрода й назад, не руйнуючи його, — тому цикл можна повторювати сотні разів. У цьому й уся хитрість.</text>
</svg>
