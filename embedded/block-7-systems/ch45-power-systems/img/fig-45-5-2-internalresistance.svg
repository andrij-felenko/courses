<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішній опір: чому напруга провалюється під струмом</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">реальна батарея = ідеальне джерело EMF + малий послідовний опір Rвн</text>
<rect x="70" y="120" width="360" height="195" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="6,5"/>
<text x="86" y="140" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">БАТАРЕЯ (модель)</text>
<circle cx="120" cy="215.0" r="28" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="120" y="212.0" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">EMF</text>
<text x="120" y="228.0" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">16.0 В</text>
<line x1="120" y1="187.0" x2="120" y2="150" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="120" y1="150" x2="220" y2="150" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="220,150 234,139 248,161 262,139 276,161 290,139 304,161 304,150" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.4" stroke-linejoin="round"/>
<text x="262" y="128" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Rвн</text>
<line x1="304" y1="150" x2="430" y2="150" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="430" cy="150" r="4.5" fill="#cc0000" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="442" y="144" font-size="16" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">+</text>
<line x1="150" y1="150" x2="200" y2="150" stroke="#cc0000" stroke-width="2.0" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="176" y="140" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">I</text>
<rect x="395" y="172" width="70" height="70" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="430" y="202" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">мотори</text>
<text x="430" y="220" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">100 А</text>
<line x1="430" y1="150" x2="430" y2="172" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="430" y1="242" x2="430" y2="280" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="430" cy="280" r="4.5" fill="#1f4ed8" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="442" y="288" font-size="16" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">−</text>
<line x1="430" y1="280" x2="120" y2="280" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="120" y1="280" x2="120" y2="243.0" stroke="#1a1a1a" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="500" y="110" width="410" height="68" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="705" y="140" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Vклем = EMF − I × Rвн</text>
<text x="705" y="162" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">напруга на клемах = рушій − провал на опорі</text>
<rect x="500" y="194" width="198" height="96" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="599" y="218" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">у спокої  I≈0</text>
<text x="599" y="248" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Vклем = 16.0 В</text>
<text x="599" y="272" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">повна напруга</text>
<rect x="712" y="194" width="198" height="96" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="811" y="218" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">під газом  I=100 А</text>
<text x="811" y="244" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Vпр=100×0.012=1.2 В</text>
<text x="811" y="272" font-size="15" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Vклем = 14.8 В</text>
<rect x="500" y="302" width="410" height="56" rx="10" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="705" y="326" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">P = I²·Rвн = 100²×0.012 = 120 Вт</text>
<text x="705" y="346" font-size="10.5" fill="#7a1f1f" text-anchor="middle" font-weight="normal" font-style="normal">ця потужність гріє пакет ЗСЕРЕДИНИ (тому батарея тепла)</text>
<text x="480.0" y="458" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Малий Rвн (свіжий, теплий) — мала просадка й мало тепла; великий Rвн (старий, холодний) — навпаки.</text>
</svg>
