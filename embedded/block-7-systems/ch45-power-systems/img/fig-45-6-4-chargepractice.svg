<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як заряджати на практиці</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">балансирний зарядник, ≤1C, зберігання ~3.8 В, у вогнетривкому мішку</text>
<rect x="60" y="122" width="150" height="100" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="135" y="152" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">балансирний</text>
<text x="135" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">зарядник</text>
<text x="135" y="198" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">CC/CV, ≤1C</text>
<line x1="210" y1="150" x2="300" y2="150" stroke="#cc0000" stroke-width="2.2" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="255" y="142" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">силові</text>
<line x1="210" y1="192" x2="300" y2="192" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="255" y="208" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">баланс</text>
<rect x="304" y="110" width="150" height="124" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="379" y="102" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">вогнетривкий мішок</text>
<rect x="326" y="138" width="106" height="72" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="379" y="168" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">пакет</text>
<text x="379" y="188" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">4S LiPo</text>
<rect x="508" y="96" width="196" height="250" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="606" y="120" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">РОБИ</text>
<text x="524" y="148" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ струм ≤1C</text>
<text x="524" y="179" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ баланс щоразу</text>
<text x="524" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ зберігай на ~3.8 В</text>
<text x="524" y="241" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ у вогнетривкому мішку</text>
<text x="524" y="272" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ будь поряд, дивись</text>
<text x="524" y="303" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✓ дай прохолонути</text>
<rect x="724" y="96" width="196" height="250" rx="12" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="822" y="120" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">НЕ РОБИ</text>
<text x="740" y="148" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не перезаряджай</text>
<text x="740" y="179" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не заряджай здуту</text>
<text x="740" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не нижче 0 °C</text>
<text x="740" y="241" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не лишай без нагляду</text>
<text x="740" y="272" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не проколюй</text>
<text x="740" y="303" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">✗ не «в нуль» на зберігання</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Літій не пробачає недбалості при заряді: надлишок енергії при аварії виходить вогнем, що його не «придушити» — треба тривало охолоджувати водою.</text>
</svg>
