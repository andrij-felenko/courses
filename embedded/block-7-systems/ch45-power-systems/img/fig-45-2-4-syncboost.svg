<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460"
     viewBox="0 0 980 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="460" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дві важливі варіації: менше втрат і підвищення напруги</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">діод → другий MOSFET (ефективніше); інша схема → boost (вища напруга)</text>
<rect x="40" y="90" width="440" height="320" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="260" y="118" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Синхронний випрямляч</text>
<text x="64" y="152" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Діод завжди має падіння ~0.5 В —</text>
<text x="64" y="174" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">а на великому струмі це втрати й тепло.</text>
<text x="64" y="196" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="64" y="218" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Замінюємо діод другим MOSFET (низьким):</text>
<text x="64" y="240" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">у нього опір мілліоми → майже без втрат.</text>
<text x="64" y="262" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="64" y="284" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Два ключі по черзі: верхній «качає»,</text>
<text x="64" y="306" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">нижній «замикає». ККД ще вищий.</text>
<rect x="64" y="360" width="392" height="34" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="260" y="382" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">так зроблено майже всі сучасні перетворювачі дрона</text>
<rect x="500" y="90" width="440" height="320" rx="12" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="720" y="118" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Boost — підвищення напруги</text>
<text x="524" y="152" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Інша розкладка тих самих деталей.</text>
<text x="524" y="174" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Ключ накачує котушку, а коли рветься —</text>
<text x="524" y="196" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">її «брикання» (викид напруги, Розділ 8.5)</text>
<text x="524" y="218" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ДОДАЄТЬСЯ до входу.</text>
<text x="524" y="240" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="524" y="262" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Тому boost робить Vвих ВИЩУ за Vвх —</text>
<text x="524" y="284" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">чого лінійний не вміє в принципі.</text>
<rect x="524" y="360" width="392" height="34" rx="8" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="720" y="382" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">те саме «брикання» котушки, що псувало ключі, — тут на користь</text>
<text x="490.0" y="450" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Усе це — комбінації ключа, котушки, діода й конденсатора; міняється лише схема їхнього з'єднання.</text>
</svg>
