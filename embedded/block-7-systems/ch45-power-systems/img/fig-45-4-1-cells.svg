<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Напруга комірки й рахунок «S»: послідовно — більше вольтів</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">одна комірка ~3.7 В (3.0 порожня … 4.2 повна); 4 послідовно (4S) → ~14.8 В</text>
<rect x="102" y="130" width="56" height="250" rx="8" fill="#f3f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="130" y="118" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">одна комірка</text>
<line x1="102" y1="136" x2="158" y2="136" stroke="#0a8f3c" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="166" y="140" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">4.2 В — повна</text>
<line x1="102" y1="255.0" x2="158" y2="255.0" stroke="#1a1a1a" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="166" y="259.0" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">3.7 В — номінал</text>
<line x1="102" y1="374" x2="158" y2="374" stroke="#cc0000" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="166" y="378" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">3.0 В — порожня (нижче — шкода)</text>
<text x="560" y="116" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">4 комірки послідовно (4S)</text>
<rect x="490" y="140" width="140" height="44" rx="7" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="560" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">3.7 В</text>
<line x1="560" y1="184" x2="560" y2="192" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="490" y="192" width="140" height="44" rx="7" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="560" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">3.7 В</text>
<line x1="560" y1="236" x2="560" y2="244" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="490" y="244" width="140" height="44" rx="7" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="560" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">3.7 В</text>
<line x1="560" y1="288" x2="560" y2="296" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="490" y="296" width="140" height="44" rx="7" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="560" y="324" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">3.7 В</text>
<line x1="650" y1="140" x2="650" y2="340" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="710" y="240" font-size="16" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">= 14.8 В</text>
<text x="710" y="264" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(16.8 повна,</text>
<text x="710" y="280" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">12 порожня)</text>
<rect x="130" y="410" width="700" height="0" rx="8" fill="none" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Послідовно (S) додають напругу, паралельно (P) — ємність. «4S2P» = 4 в ряд × 2 паралельно: і вольти, і запас.</text>
</svg>
