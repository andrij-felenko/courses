<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460"
     viewBox="0 0 940 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="460" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому дрон — це здебільшого батарея (і чому це його слабке місце)</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">питома енергія літію зробила політ можливим — але батарея лишилась SPOF (44.7)</text>
<text x="220" y="110" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Вага типового дрона</text>
<rect x="120" y="140" width="200" height="176.4" rx="3" fill="#0a8f3c" fill-opacity="0.78" stroke="white" stroke-width="1.5"/>
<text x="220" y="232.2" font-size="11" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Батарея — 42%</text>
<rect x="120" y="316.4" width="200" height="126.0" rx="3" fill="#1f4ed8" fill-opacity="0.78" stroke="white" stroke-width="1.5"/>
<text x="220" y="383.4" font-size="11" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Рама й мотори — 30%</text>
<rect x="120" y="442.4" width="200" height="67.2" rx="3" fill="#d98a00" fill-opacity="0.78" stroke="white" stroke-width="1.5"/>
<text x="220" y="480.0" font-size="11" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Гвинти, ESC — 16%</text>
<rect x="120" y="509.59999999999997" width="200" height="50.400000000000006" rx="3" fill="#6b7280" fill-opacity="0.78" stroke="white" stroke-width="1.5"/>
<text x="220" y="538.8" font-size="11" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">Електроніка, корисне — 12%</text>
<text x="220" y="582.0" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="italic">найбільший шматок — енергія</text>
<text x="680" y="110" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Компроміс батареї</text>
<polygon points="680,150 560,330 800,330" fill="#fff7ef" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7" stroke-linejoin="round"/>
<text x="680" y="142" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">енергія (політ)</text>
<text x="545" y="350" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">потужність</text>
<text x="560" y="366" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(C-rate)</text>
<text x="815" y="350" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">безпека</text>
<text x="815" y="366" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(пожежа)</text>
<text x="680" y="260" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">не можна мати</text>
<text x="680" y="276" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">все одразу</text>
<text x="470.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Безколекторний мотор + ESC + літієва батарея — та трійця, на якій злетіла дронова епоха; і батарея в ній — водночас серце й найслабша ланка.</text>
</svg>
