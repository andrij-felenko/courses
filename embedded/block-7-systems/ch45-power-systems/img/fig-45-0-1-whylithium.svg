<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому весь портативний світ працює саме на літії</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">найлегший метал і найохочіший віддати електрон → найбільше енергії на кілограм</text>
<rect x="60" y="100" width="200" height="200" rx="14" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="160" y="140" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">3</text>
<text x="160" y="200" font-size="58" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Li</text>
<text x="160" y="240" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">літій</text>
<text x="160" y="272" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">найлегший метал</text>
<text x="60" y="330" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• 3-й елемент таблиці — дуже легкий</text>
<text x="60" y="352" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• найсильніше «тисне» віддати електрон</text>
<text x="60" y="374" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  → найвища можлива напруга й енергія</text>
<text x="60" y="396" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• плата: дуже реактивний (горить, боїться води)</text>
<text x="620" y="120" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Питома енергія (Вт·год на кг)</text>
<text x="470" y="146" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Свинцево-кислотний</text>
<rect x="470" y="150" width="50.400000000000006" height="28" rx="5" fill="#6b7280" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="470" y="150" width="360" height="28" rx="5" fill="none" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="528.4" y="170" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">~35</text>
<text x="470" y="202" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Нікель-метал-гідрид</text>
<rect x="470" y="206" width="115.2" height="28" rx="5" fill="#d98a00" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="470" y="206" width="360" height="28" rx="5" fill="none" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="593.2" y="226" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">~80</text>
<text x="470" y="258" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Літій-іонний</text>
<rect x="470" y="262" width="360.0" height="28" rx="5" fill="#0a8f3c" fill-opacity="0.75" stroke="none" stroke-width="1.6"/>
<rect x="470" y="262" width="360" height="28" rx="5" fill="none" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="838.0" y="282" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">~250</text>
<text x="470" y="322" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(для масштабу: бензин ~12 000 — але то не електрика й не заряджається назад)</text>
<text x="480.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Більше енергії на грам — це довший політ, менша вага й сама можливість портативної електроніки. Тому літій переміг.</text>
</svg>
