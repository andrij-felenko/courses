<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430"
     viewBox="0 0 960 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Передбачення: знаю стан — знаю, де буду за мить</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">модель руху продовжує стан уперед: нове положення = старе + швидкість × Δt</text>
<line x1="80" y1="195" x2="880" y2="195" stroke="#e5e7eb" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="250" y1="195" x2="620" y2="195" stroke="#0a8f3c" stroke-width="2.2" stroke-dasharray="6,5" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="435.0" y="183" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">проходить v × Δt</text>
<line x1="250" y1="161" x2="340" y2="161" stroke="#1f4ed8" stroke-width="2.4" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="295" y="153" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">v</text>
<circle cx="250" cy="195" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="250" y="229" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЗАРАЗ</text>
<text x="250" y="247" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">положення x, швидкість v</text>
<circle cx="620" cy="195" r="11" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.4"/>
<text x="620" y="229" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ЗА Δt</text>
<text x="620" y="247" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">передбачене положення</text>
<rect x="300" y="296" width="360" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480" y="330" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">x(t+Δt) = x(t) + v · Δt</text>
<text x="480.0" y="416" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це те саме числення шляху (dead reckoning): продовжуємо рух за відомою фізикою, не чекаючи виміру.</text>
</svg>
