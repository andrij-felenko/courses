<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Підсилення K: наскільки слухати вимір</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">оцінка = передбачення + K × (вимір − передбачення); K від 0 до 1 за відносною певністю</text>
<line x1="150" y1="140" x2="810" y2="140" stroke="#1a1a1a" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="150" y1="132" x2="150" y2="148" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="150" y="166" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">K = 0</text>
<line x1="480.0" y1="132" x2="480.0" y2="148" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="166" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">K = 0.5</text>
<line x1="810" y1="132" x2="810" y2="148" stroke="#1a1a1a" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="810" y="166" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">K = 1</text>
<text x="150" y="118" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">лишаюсь на передбаченні</text>
<text x="810" y="118" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">стрибаю на вимір</text>
<circle cx="546.0" cy="140" r="11" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="150" y="232" width="660" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480" y="267" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">K = σ²пер / (σ²пер + σ²вим)</text>
<rect x="150" y="312" width="320" height="96" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="310" y="338" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">вимір ШУМНИЙ (σ²вим велика)</text>
<text x="310" y="364" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">→ K → 0</text>
<text x="310" y="388" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">майже ігнорую вимір</text>
<rect x="490" y="312" width="320" height="96" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="650" y="338" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">вимір ТОЧНИЙ (σ²вим мала)</text>
<text x="650" y="364" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">→ K → 1</text>
<text x="650" y="388" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">стрибаю на вимір</text>
<text x="480.0" y="440" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">K — це й є «підсилення Калмана»: регулятор довіри, що сам перетікає за невизначеністю.</text>
</svg>
