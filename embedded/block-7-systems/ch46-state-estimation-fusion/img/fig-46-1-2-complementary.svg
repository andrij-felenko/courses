     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Слабкість одного — сила іншого</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">IMU точний миттєво, та дрейфує; GPS повільний, зате не накопичує дрейфу — разом покривають усе</text>
<text x="445.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">МИТТЄВО (зараз)</text>
<text x="755.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">НАДОВГО (без дрейфу)</text>
<text x="110" y="154" font-size="15" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">IMU</text>
<rect x="330" y="120" width="230" height="56" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="330" y="120" width="211.60000000000002" height="56" rx="8" fill="#1f4ed8" fill-opacity="0.85" stroke="none" stroke-width="1.6"/>
<text x="346" y="154" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">сильно</text>
<rect x="640" y="120" width="230" height="56" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="640" y="120" width="41.4" height="56" rx="8" fill="#1f4ed8" fill-opacity="0.85" stroke="none" stroke-width="1.6"/>
<text x="691.4" y="154" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">слабко</text>
<text x="110" y="244" font-size="15" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">GNSS / GPS</text>
<rect x="330" y="210" width="230" height="56" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="330" y="210" width="57.5" height="56" rx="8" fill="#0a8f3c" fill-opacity="0.85" stroke="none" stroke-width="1.6"/>
<text x="397.5" y="244" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">слабко</text>
<rect x="640" y="210" width="230" height="56" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<rect x="640" y="210" width="218.5" height="56" rx="8" fill="#0a8f3c" fill-opacity="0.85" stroke="none" stroke-width="1.6"/>
<text x="656" y="244" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">сильно</text>
<text x="480.0" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дзеркало: де IMU сильний — GPS слабкий, і навпаки. Саме тому їх зводять разом.</text>
<text x="480.0" y="426" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Фьюжн бере від кожного сильний бік: швидку реакцію IMU й стабільну прив'язку GPS.</text>
</svg>
