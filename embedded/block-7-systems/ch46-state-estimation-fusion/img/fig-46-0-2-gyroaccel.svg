<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Два чуття інерції: гіроскоп і акселерометр</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гіроскоп тримає напрям (оберт), акселерометр міряє прискорення → інтегруємо в рух</text>
<circle cx="195" cy="165" r="58" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="195" cy="165" r="40" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<circle cx="195" cy="165" r="7" fill="#1f4ed8" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<line x1="139" y1="165" x2="251" y2="165" stroke="#1a1a1a" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="195" y1="109" x2="195" y2="221" stroke="#1a1a1a" stroke-width="1.3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="195" y="91" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ГІРОСКОП</text>
<text x="195" y="249" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ротор тримає напрям</text>
<text x="195" y="264" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ міряє ОБЕРТ</text>
<rect x="412" y="120" width="116" height="90" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M 420 165 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 " fill="none" stroke="#6b7280" stroke-width="2.2"/>
<rect x="454" y="149" width="34" height="32" rx="4" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="471" y="171" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">m</text>
<path d="M 488 165 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 q 5.333333333333333 -9.066666666666666 10.666666666666666 0 " fill="none" stroke="#6b7280" stroke-width="2.2"/>
<text x="470" y="91" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">АКСЕЛЕРОМЕТР</text>
<text x="470" y="249" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">маса на пружинах зміщується</text>
<text x="470" y="264" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ міряє ПРИСКОРЕННЯ</text>
<rect x="700" y="120" width="210" height="92" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="805" y="150" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ІНЕРЦІАЛЬНИЙ БЛОК</text>
<text x="805" y="170" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">(IMU, 44.2)</text>
<text x="805" y="192" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гіро + акселерометр</text>
<rect x="220" y="339" width="160" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="300" y="370" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">прискорення</text>
<line x1="382" y1="365" x2="458" y2="365" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="420.0" y="353" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">∫ dt</text>
<rect x="460" y="339" width="160" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="540" y="370" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">швидкість</text>
<line x1="622" y1="365" x2="698" y2="365" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="660.0" y="353" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">∫ dt</text>
<rect x="700" y="339" width="160" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="780" y="370" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">положення</text>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Інтегруємо прискорення раз — маємо швидкість, ще раз — положення. Це «розрахунок шляху» (dead reckoning) із самої фізики.</text>
</svg>
