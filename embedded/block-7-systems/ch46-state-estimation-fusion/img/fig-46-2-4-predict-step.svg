<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420"
     viewBox="0 0 960 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Крок передбачення в циклі оцінювання</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">стан зараз + модель руху (+ відомий вхід) → стан за мить; далі його виправить вимір</text>
<rect x="60" y="140" width="170" height="100" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="145" y="178" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">СТАН зараз</text>
<text x="145" y="200" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">x, v, орієнтація</text>
<text x="145" y="218" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(+ невизначеність)</text>
<line x1="232" y1="190" x2="320" y2="190" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="322" y="140" width="180" height="100" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="412" y="174" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">МОДЕЛЬ РУХУ</text>
<text x="412" y="196" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">x += v·Δt</text>
<text x="412" y="214" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">+ відомий вхід (газ, IMU)</text>
<line x1="504" y1="190" x2="592" y2="190" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="594" y="140" width="180" height="100" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="684" y="174" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">СТАН за Δt</text>
<text x="684" y="196" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕДБАЧЕННЯ</text>
<text x="684" y="216" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(певність трохи впала)</text>
<line x1="684" y1="242" x2="684" y2="296" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="558" y="298" width="252" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="684" y="322" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">далі: ВИМІР виправить</text>
<text x="684" y="342" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(зважування — тема 46.3)</text>
<text x="230" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Цикл щомиті:</text>
<text x="230" y="332" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">передбач → виправ →</text>
<text x="230" y="348" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">передбач → …</text>
<text x="480.0" y="408" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">46.2 — це передбачення (ліва половина циклу). Корекцію виміром додамо в 46.3.</text>
</svg>
