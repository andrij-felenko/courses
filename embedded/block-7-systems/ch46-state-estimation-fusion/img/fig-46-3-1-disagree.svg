<text x="500.0" y="276" font-size="30" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">?</text>
<text x="500.0" y="306" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">де істина?</text>
<text x="480.0" y="428" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ширина «хмари» — це невпевненість. Вужча хмара = певніше джерело. Оцінку кладуть між ними, зважено.</text>
