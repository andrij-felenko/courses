<line x1="560" y1="173.4276872492477" x2="230" y2="173.4276872492477" stroke="#cc0000" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="238" y="165.4276872492477" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">оновлена швидкість</text>
<text x="480.0" y="426" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Бо в коваріації записано, що положення й швидкість пов'язані — тож вимір самого положення оновлює й швидкість.</text>
