<text x="480.0" y="420" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Несподіванка — найкорисніший показник здоров'я: малі — сенсори згодні з оцінкою; великі — хтось бреше.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Якщо несподіванка вилазить за «ворота», фільтр відхиляє той вимір — захист від поодинокого збою давача.</text>
