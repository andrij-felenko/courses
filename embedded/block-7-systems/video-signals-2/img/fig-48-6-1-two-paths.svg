<rect x="360" y="303.0" width="138" height="54" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="429.0" y="335.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Пакети</text>
<line x1="498" y1="330" x2="516" y2="330" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="516" y="303.0" width="138" height="54" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="585.0" y="335.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Радіо / IP</text>
<text x="686.0" y="316" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">)))</text>
<text x="686.0" y="327" font-size="8" fill="#d98a00" text-anchor="middle" font-weight="normal" font-style="normal">ефір</text>
<line x1="654" y1="330" x2="718" y2="330" stroke="#d98a00" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="718" y="303.0" width="138" height="54" rx="7" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="787.0" y="328.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Збір+декод</text>
<text x="787.0" y="342.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">+ екран</text>
<text x="48" y="380" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">HD, шифрування, маршрут в інтернет; та лаг (кодек+буфер) і складність</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Аналог кладе відео ПРОСТО на хвилю; цифра спершу стискає й пакетує. Звідси й усі їхні відмінності.</text>
