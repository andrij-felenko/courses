<text x="631.0" y="153.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">Демодул.</text>
<text x="631.0" y="167.0" font-size="8.8" fill="#e2e8f0" text-anchor="middle" font-weight="normal" font-style="normal">+ окуляри</text>
<text x="48" y="205" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">без стиску, без пакетів → майже нульова затримка; та грубо й односторонньо</text>
<text x="48" y="278" font-size="12.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">ЦИФРОВА МЕРЕЖА</text>
