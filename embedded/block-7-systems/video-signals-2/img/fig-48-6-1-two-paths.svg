<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Дві дороги з борту на землю</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">аналог — відео просто на радіохвилі (миттєво, грубо); цифра — стиснений потік пакетами (HD, та з лагом)</text>
<text x="48" y="103" font-size="12.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">АНАЛОГОВЕ FPV</text>
