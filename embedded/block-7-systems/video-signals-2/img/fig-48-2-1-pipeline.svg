<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Конвеєр JPEG: як стиснути один кадр</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ріжемо на блоки 8×8 → DCT (на частоти) → квантування (округлити, тут утрати) → зигзаг + пакування</text>
<rect x="70" y="160" width="150" height="110" rx="11" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="145" y="192" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">кадр</text>
<text x="145" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">ріжемо на</text>
<text x="145" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">блоки 8×8</text>
<line x1="222" y1="215" x2="238" y2="215" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="242" y="160" width="150" height="110" rx="11" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="317" y="192" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">DCT</text>
<text x="317" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">пікселі →</text>
<text x="317" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">частоти</text>
<line x1="394" y1="215" x2="410" y2="215" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="414" y="160" width="150" height="110" rx="11" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="489" y="192" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">кванту-</text>
<text x="489" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">вання</text>
<text x="489" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(утрати!)</text>
<line x1="566" y1="215" x2="582" y2="215" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="586" y="160" width="150" height="110" rx="11" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="661" y="192" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">зигзаг +</text>
<text x="661" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">паку-</text>
<text x="661" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">вання</text>
<line x1="738" y1="215" x2="754" y2="215" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="758" y="160" width="150" height="110" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="833" y="192" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">крихітний</text>
<text x="833" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">файл</text>
<text x="833" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="489" y="290" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">↑ ТУТ губимо (з утратами)</text>
<text x="661" y="290" font-size="10" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">↑ лише пакуємо (без утрат)</text>
<rect x="150" y="330" width="660" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="354" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Уся «магія» — у квантуванні: воно й викидає непомітне, і дає головний стиск.</text>
<text x="480" y="374" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Решта — чесна перепаковка (DCT нічого не втрачає, зигзаг і пакування теж).</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Кожен блок 8×8 проходить конвеєр незалежно — тому JPEG так і ділить кадр на квадратики.</text>
</svg>
