<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420"
     viewBox="0 0 960 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Та сама хвильова цеглинка — у кожному кадрі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">DCT — двигун усередині JPEG, MPEG, H.264; кожне фото й відеокадр на твоєму апараті стискає вона</text>
<rect x="390" y="158" width="180" height="92" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.2"/>
<text x="480" y="192" font-size="15" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">DCT (1972)</text>
<text x="480" y="214" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">пікселі → частоти</text>
<text x="480" y="232" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ викинути дрібне</text>
<line x1="190" y1="120" x2="388" y2="204" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="30" y="94" width="160" height="54" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="110" y="116" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">JPEG</text>
<text x="110" y="133" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(фото)</text>
<line x1="190" y1="252" x2="388" y2="204" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="30" y="226" width="160" height="54" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="110" y="248" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">MPEG / H.264</text>
<text x="110" y="265" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(відео)</text>
<line x1="730" y1="120" x2="572" y2="204" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="730" y="94" width="160" height="54" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="810" y="116" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">FPV-стрім</text>
<text x="810" y="133" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дрона</text>
<line x1="730" y1="252" x2="572" y2="204" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="730" y="226" width="160" height="54" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="810" y="248" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">записаний</text>
<text x="810" y="265" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">політ</text>
<text x="480.0" y="406" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Розклади на хвилі, відкинь ті, яких мало й яких око не бачить, — і пожежний шланг (47.5) влазить у вузьку трубу.</text>
</svg>
