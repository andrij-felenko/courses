<text x="480" y="400" font-size="10" fill="#92400e" text-anchor="middle" font-weight="bold" font-style="normal">Сучасні цифрові системи пом'якшують обрив: адаптивний бітрейт (падає якість, не зв'язок) і FEC (відновлення втрат).</text>
<text x="480" y="420" font-size="9.5" fill="#92400e" text-anchor="middle" font-weight="normal" font-style="normal">Та сам обрив нікуди не дівається — за порогом декодер просто не збере кадр. Тому в цифрі важливо знати, де «обрив».</text>
