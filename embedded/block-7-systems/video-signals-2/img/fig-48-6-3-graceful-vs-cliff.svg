<text x="150" y="126" font-size="11" fill="#b06b00" text-anchor="start" font-weight="bold" font-style="normal">ЦИФРА — з обриву</text>
<circle cx="505" cy="250" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="520" y="246" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">«обрив»: ідеально… і раптом</text>
<text x="520" y="260" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">стоп-кадр / розсип квадратів</text>
<text x="300" y="210" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">АНАЛОГ — плавно</text>
<text x="610" y="300" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">сніг росте, але видно</text>
<text x="620" y="314" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">→ є запас і попередження</text>
