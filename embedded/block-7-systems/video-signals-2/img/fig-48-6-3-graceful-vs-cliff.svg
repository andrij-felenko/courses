<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Плавно чи з обриву: як гасне картинка на краю дальності</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">аналог тьмяніє поступово (сніг, та ще летиш); цифра тримається ідеально — і раптом обривається в стоп-кадр</text>
<line x1="110" y1="350" x2="770" y2="350" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="110" y1="350" x2="110" y2="110" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="765" y="372" font-size="10" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">слабшання сигналу / відстань →</text>
<text x="116" y="106" font-size="10" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">↑ якість картинки</text>
<polyline points="110,134 330,134 450,138 485,150 505,348" fill="none" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.8" stroke-linejoin="round"/>
