<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Коли пакет зникає</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">пакети гублять зіткнення, слабкий сигнал, затори, переповнення буфера; втрата відеопакета — збій до наступного I-кадру (48.3)</text>
<rect x="70" y="116" width="180" height="34" rx="7" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="160" y="138" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">зіткнення</text>
<rect x="270" y="116" width="180" height="34" rx="7" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="360" y="138" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">слабкий сигнал</text>
<rect x="470" y="116" width="180" height="34" rx="7" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="560" y="138" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">затор у каналі</text>
<rect x="670" y="116" width="180" height="34" rx="7" fill="#fef2f2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="760" y="138" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">переповнений буфер</text>
<rect x="300" y="182" width="46" height="30" rx="5" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="323" y="202" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">#1</text>
<rect x="360" y="182" width="46" height="30" rx="5" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="383" y="202" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">#2</text>
<rect x="420" y="182" width="46" height="30" rx="5" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="443" y="204" font-size="15" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">✗</text>
<rect x="480" y="182" width="46" height="30" rx="5" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="503" y="202" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">#4</text>
<rect x="540" y="182" width="46" height="30" rx="5" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="563" y="202" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">#5</text>
<rect x="600" y="182" width="46" height="30" rx="5" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="623" y="202" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">#6</text>
<text x="443" y="228" font-size="8.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">загублено</text>
<text x="300" y="248" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">→ збій у картинці, доки не прийде I-кадр (48.3)</text>
<rect x="70" y="278" width="270" height="150" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="205" y="302" font-size="11.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">FEC — надлишок</text>
<text x="94" y="328" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">шлемо зайві пакети,</text>
<text x="94" y="352" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">приймач сам відновить</text>
<text x="94" y="376" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">загублене</text>
<text x="94" y="400" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ПЛАТА: смуга</text>
<rect x="370" y="278" width="270" height="150" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="505" y="302" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ARQ — перепит</text>
<text x="394" y="328" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">просимо надіслати</text>
<text x="394" y="352" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">пакет ще раз</text>
<text x="394" y="376" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(зворотний запит)</text>
<text x="394" y="400" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ПЛАТА: затримка</text>
<rect x="670" y="278" width="270" height="150" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="805" y="302" font-size="11.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Терпіти</text>
<text x="694" y="328" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">лишаємо збій,</text>
<text x="694" y="352" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ловимо наступний</text>
<text x="694" y="376" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">I-кадр</text>
<text x="694" y="400" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ПЛАТА: якість</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Втрату гасять смугою (FEC), затримкою (перепит) або якістю (терпіти) — задарма пакет не повернеш.</text>
</svg>
