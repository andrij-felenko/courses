<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться затримка: від скла до скла</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">захоплення → кодування → буфер → канал → буфер → декодування → екран; кожна ланка додає мілісекунди</text>
<rect x="40" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="95.0" y="175" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Сенсор</text>
<text x="95.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">захоплення</text>
<line x1="150" y1="196" x2="168" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="168" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="223.0" y="175" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Кодек</text>
<text x="223.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">рух, B-кадри,</text>
<text x="223.0" y="215" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">lookahead</text>
<line x1="278" y1="196" x2="296" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="296" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="351.0" y="175" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Буфер TX</text>
<text x="351.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">згладити</text>
<text x="351.0" y="215" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">сплески</text>
<line x1="406" y1="196" x2="424" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="424" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="479.0" y="175" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Канал</text>
<text x="479.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">радіо /</text>
<text x="479.0" y="215" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">мережа</text>
<line x1="534" y1="196" x2="552" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="552" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="607.0" y="175" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Буфер RX</text>
<text x="607.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">згладити</text>
<text x="607.0" y="215" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">джитер</text>
<line x1="662" y1="196" x2="680" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="680" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="735.0" y="175" font-size="11.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Декодер</text>
<text x="735.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">зібрати</text>
<text x="735.0" y="215" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">ланцюг</text>
<line x1="790" y1="196" x2="808" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="808" y="150" width="110" height="92" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="863.0" y="175" font-size="11.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Екран</text>
<text x="863.0" y="200" font-size="8.8" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-style="normal">показ</text>
<text x="232.0" y="268" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">↑ фіксовані ланки</text>
<text x="296.0" y="284" font-size="9.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">↑ де ховається лаг (кодек + буфери)</text>
<rect x="80" y="310" width="800" height="100" rx="11" fill="#fef9c3" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="480.0" y="332" font-size="11" fill="#92400e" text-anchor="middle" font-weight="bold" font-style="normal">Щоб зрізати затримку — жертвують стиском:</text>
<text x="150" y="354" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• B-кадри геть (не чекати «майбутніх» кадрів)</text>
<text x="150" y="372" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• intra-важко / малий GOP (менше залежностей)</text>
<text x="540" y="354" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• малий буфер (терпіти джитер, не копити лаг)</text>
<text x="540" y="372" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• проста (швидка) обробка замість «розумної»</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">B-кадри й буфери дають кращий стиск, але «думають» наперед — а це час. Менша затримка завжди коштує стиску.</text>
</svg>
