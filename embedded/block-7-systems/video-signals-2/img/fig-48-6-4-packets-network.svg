<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Цифрова мережа: відео як потік пакетів</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">стиснений потік ріжуть на пакети (номер + заголовок); втрата пакета — збій до наступного I-кадру (48.3)</text>
<text x="70" y="118" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">стиснений бітпотік (48.4):</text>
<rect x="70" y="126" width="360" height="22" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="250" y="141" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="normal" font-style="normal">…011010110100011101001…</text>
<line x1="250" y1="150" x2="250" y2="178" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="330" y="168" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">ріжемо на пакети</text>
<rect x="70" y="186" width="64" height="40" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="70" y="186" width="64" height="12" rx="8" fill="#0a8f3c" fill-opacity="0.3" stroke="none" stroke-width="1.6"/>
<text x="102" y="211" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">#1</text>
<rect x="144" y="186" width="64" height="40" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="144" y="186" width="64" height="12" rx="8" fill="#0a8f3c" fill-opacity="0.3" stroke="none" stroke-width="1.6"/>
<text x="176" y="211" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">#2</text>
<rect x="218" y="186" width="64" height="40" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<rect x="218" y="186" width="64" height="12" rx="8" fill="#cc0000" fill-opacity="0.3" stroke="none" stroke-width="1.6"/>
<text x="250" y="211" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">#3</text>
<rect x="292" y="186" width="64" height="40" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="292" y="186" width="64" height="12" rx="8" fill="#0a8f3c" fill-opacity="0.3" stroke="none" stroke-width="1.6"/>
<text x="324" y="211" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">#4</text>
<rect x="366" y="186" width="64" height="40" rx="6" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<rect x="366" y="186" width="64" height="12" rx="8" fill="#d98a00" fill-opacity="0.3" stroke="none" stroke-width="1.6"/>
<text x="398" y="211" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="250" y="242" font-size="8.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">✗ загубився</text>
<text x="398" y="242" font-size="8.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">FEC: латає</text>
<text x="70" y="262" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">кожен пакет = номер + заголовок (адреса) + шматок відео</text>
<rect x="500" y="116" width="400" height="152" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="700" y="138" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">наживо → UDP, не TCP</text>
<text x="518" y="160" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• UDP: шлемо й не перепитуємо — спізнілий</text>
<text x="518" y="177" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  кадр уже непотрібний (краще пропустити)</text>
<text x="518" y="194" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• TCP: гарантує доставку, та перепити =</text>
<text x="518" y="211" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  затримка → для відео наживо погано</text>
<text x="518" y="228" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• втрати латає FEC (надлишок) — без</text>
<text x="518" y="245" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  зворотного запиту, тож без зайвого лагу</text>
<rect x="70" y="300" width="405" height="116" rx="11" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="272" y="322" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">локальний радіолінк (точка-точка)</text>
<text x="90" y="344" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• OcuSync / HDZero / Walksnail</text>
<text x="90" y="365" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• борт ↔ пульт напряму</text>
<text x="90" y="386" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• малий лаг, та обмежена дальність</text>
<rect x="495" y="300" width="405" height="116" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="697" y="322" font-size="10.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">IP-мережа (LTE/5G → інтернет)</text>
<text x="515" y="344" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• відео в хмару й будь-куди (BVLOS)</text>
<text x="515" y="365" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• багато апаратів, далеко за обрій</text>
<text x="515" y="386" font-size="9.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• та лаг мережі й залежність від покриття</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Пакети дають HD, шифрування й маршрут хоч на інший континент — ціною затримки та «обриву» при втратах.</text>
</svg>
