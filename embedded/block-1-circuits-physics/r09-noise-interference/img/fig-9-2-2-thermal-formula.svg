<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки шуму: закон Джонсона—Найквіста</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">шумова напруга залежить лише від температури, опору і смуги — і ні від чого більше; матеріал та форма резистора не важать</text>
<rect x="270.0" y="80.0" width="400.0" height="64.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.0"/>
<text x="470.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Uш(rms) = √(4 · k · T · R · B)</text>
<text x="470.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">k = 1.38×10⁻²³ Дж/К — стала Больцмана</text>
<rect x="-5.0" y="180.0" width="190.0" height="110.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="90.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T — температура</text>
<text x="90.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">[K]</text>
<line x1="30.0" y1="270.0" x2="150.0" y2="252.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="90.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">охолоди → тихіше</text>
<rect x="225.0" y="180.0" width="190.0" height="110.0" rx="10" fill="#ffffff" stroke="#cf8b5e" stroke-width="1.8"/>
<text x="320.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#cf8b5e" text-anchor="middle" font-weight="bold" font-style="normal">R — опір</text>
<text x="320.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">[Ω]</text>
<line x1="260.0" y1="270.0" x2="380.0" y2="252.0" stroke="#cf8b5e" stroke-width="2.2" marker-end="url(#aCopper)"/>
<text x="320.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">менший R → тихіше</text>
<rect x="455.0" y="180.0" width="190.0" height="110.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="550.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B — смуга частот</text>
<text x="550.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">[Гц]</text>
<line x1="490.0" y1="270.0" x2="610.0" y2="252.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="550.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вужча смуга → тихіше</text>
<rect x="685.0" y="180.0" width="190.0" height="110.0" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="780.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">k — стала Больцмана</text>
<text x="780.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">[—]</text>
<line x1="720.0" y1="270.0" x2="840.0" y2="252.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<text x="780.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">фундамент, не крутиться</text>
<rect x="180.0" y="320.0" width="580.0" height="76.0" rx="10" fill="#fff6ee" stroke="#e08030" stroke-width="1.7"/>
<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключове: шум росте як КОРІНЬ. Учетверо ширша смуга → лише вдвічі</text>
<text x="470.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">більше шуму. Учетверо більший опір → теж лише вдвічі.</text>
<text x="470.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Тому головні важелі тиші — звузити смугу B і знизити R джерела.</text>
</svg>
