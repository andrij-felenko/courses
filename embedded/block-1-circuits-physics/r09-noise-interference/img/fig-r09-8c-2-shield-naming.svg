<text x="550.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">прибирає взаємні наводки між парами</text>
<text x="550.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(перехресні завади, crosstalk) і лишок,</text>
<text x="550.0" y="514.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">який не догасило саме звивання.</text>
<text x="500.0" y="546.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більше екранів — вища завадостійкість і ціна, товщий і твердіший кабель, складніше заземлення</text>
