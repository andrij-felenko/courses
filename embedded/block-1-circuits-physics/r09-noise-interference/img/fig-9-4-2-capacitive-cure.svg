<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як прибрати ємнісний гул: перехопити поле і знизити опір</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">заземлений екран ловить силові лінії E на себе (заряд стікає в землю); а менший опір вузла «коротить» наведений струм</text>
<text x="235.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">БЕЗ ЕКРАНА — наводиться</text>
<line x1="80.0" y1="118.0" x2="390.0" y2="118.0" stroke="#c0271e" stroke-width="4" stroke-linecap="round"/>
<text x="235.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">джерело завади</text>
<line x1="120.0" y1="124.0" x2="120.0" y2="196.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
