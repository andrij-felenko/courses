<text x="700.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">З ЕКРАНОМ — поле перехоплено</text>
