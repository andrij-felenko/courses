<text x="700.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">джерело завади</text>
<line x1="580.0" y1="124.0" x2="580.0" y2="156.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
