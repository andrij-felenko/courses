<line x1="871.5" y1="187.0" x2="878.5" y2="187.0" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"/>
<line x1="560.0" y1="210.0" x2="830.0" y2="210.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="695.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сигнал «у тіні» — гулу майже нема</text>
<line x1="620.0" y1="178.0" x2="620.0" y2="168.0" stroke="#e08030" stroke-width="1.8" marker-end="url(#aOrange)"/>
<text x="660.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">наведений заряд → у землю</text>
<rect x="150.0" y="286.0" width="640.0" height="76.0" rx="10" fill="#f4f5f7" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="470.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два важелі проти ємнісної наводки:</text>
<text x="470.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) ЗАЗЕМЛЕНИЙ ЕКРАН навколо сигналу — перехоплює E-поле (детально §1.9.7);</text>
<text x="470.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2) НИЖЧИЙ ОПІР вузла й коротший провід — наведений струм дає меншу напругу.</text>
