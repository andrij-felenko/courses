<line x1="300.0" y1="124.0" x2="300.0" y2="196.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
<line x1="360.0" y1="124.0" x2="360.0" y2="196.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
<line x1="80.0" y1="210.0" x2="390.0" y2="210.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
