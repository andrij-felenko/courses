<line x1="820.0" y1="124.0" x2="820.0" y2="156.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
<rect x="545.0" y="160.0" width="300.0" height="18.0" rx="6" fill="#dfe3e8" stroke="#9aa3ad" stroke-width="2.0"/>
<text x="695.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#9aa3ad" text-anchor="middle" font-weight="bold" font-style="normal">заземлений екран (метал)</text>
<line x1="845.0" y1="169.0" x2="875.0" y2="169.0" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"/>
<line x1="875.0" y1="169.0" x2="875.0" y2="177.0" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"/>
