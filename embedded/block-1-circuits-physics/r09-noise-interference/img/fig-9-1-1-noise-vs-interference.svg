<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">шум народжується в самій деталі (випадковий, широкосмуговий); наводка приходить ззовні (часто з впізнаваним джерелом)</text>
