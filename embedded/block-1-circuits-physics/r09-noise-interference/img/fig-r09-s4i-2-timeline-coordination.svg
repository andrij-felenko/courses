<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<rect width="1000" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fae"/></marker>
</defs>
<text x="500.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сорок років боротьби: від однопровідної лінії з гулом — до спільних правил</text>
<text x="500.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спершу судилися, потім сіли за стіл: завада кориться трьом множникам, і тиснути треба на всі три</text>
<line x1="70.0" y1="210.0" x2="930.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="930.0,210.0 916.0,204.0 916.0,216.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<text x="936.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час</text>
<circle cx="104.4" cy="210.0" r="6.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
<line x1="104.4" y1="204.0" x2="104.4" y2="170.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="18.4" y="114.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="104.4" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1880-ті</text>
<text x="104.4" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Однопровідні лінії</text>
<text x="104.4" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повернення через землю — усе чути</text>
<circle cx="246.3" cy="210.0" r="6.5" fill="#cf8b5e" stroke="#cf8b5e" stroke-width="1"/>
<line x1="246.3" y1="216.0" x2="246.3" y2="250.0" stroke="#cf8b5e" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="160.3" y="250.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#cf8b5e" stroke-width="1.5"/>
<text x="246.3" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#cf8b5e" text-anchor="middle" font-weight="bold" font-style="normal">1881</text>
<text x="246.3" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Белл: пара дротів</text>
<text x="246.3" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">металеве коло замість землі (патент)</text>
<circle cx="388.2" cy="210.0" r="6.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<line x1="388.2" y1="204.0" x2="388.2" y2="170.0" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="302.2" y="114.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="388.2" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1889-91</text>
<text x="388.2" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дж. Дж. Карті</text>
<text x="388.2" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">діагноз: винна ємність; транспозиція</text>
<circle cx="543.0" cy="210.0" r="6.5" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<line x1="543.0" y1="216.0" x2="543.0" y2="250.0" stroke="#e08030" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="457.0" y="250.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#e08030" stroke-width="1.5"/>
<text x="543.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">1890-1910</text>
<text x="543.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Трамваї та силові мережі</text>
<text x="543.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">однопровідні лінії масово гинуть</text>
<circle cx="689.2" cy="210.0" r="6.5" fill="#7a3fae" stroke="#7a3fae" stroke-width="1"/>
<line x1="689.2" y1="204.0" x2="689.2" y2="170.0" stroke="#7a3fae" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="603.2" y="114.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#7a3fae" stroke-width="1.5"/>
<text x="689.2" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a3fae" text-anchor="middle" font-weight="bold" font-style="normal">1912</text>
<text x="689.2" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Каліфорнія, наказ №52</text>
<text x="689.2" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">комісія замість суду</text>
<circle cx="861.2" cy="210.0" r="6.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<line x1="861.2" y1="216.0" x2="861.2" y2="250.0" stroke="#1f47b5" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<rect x="775.2" y="250.0" width="172.0" height="52.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="861.2" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1921+</text>
<text x="861.2" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">NELA + AT&amp;T, залізниці</text>
<text x="861.2" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">спільні комітети: координація</text>
<text x="500.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому завада взагалі є — добуток трьох множників (модель координації):</text>
<rect x="40.0" y="388.0" width="260.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#e08030" stroke-width="1.7"/>
<text x="170.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Вплив</text>
<text x="170.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(influence)</text>
<text x="170.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">як «брудно» шумить</text>
<text x="170.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">силова лінія</text>
<rect x="370.0" y="388.0" width="260.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#cf8b5e" stroke-width="1.7"/>
<text x="500.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#cf8b5e" text-anchor="middle" font-weight="bold" font-style="normal">Сприйнятливість</text>
<text x="500.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(susceptiveness)</text>
<text x="500.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">як легко телефон</text>
<text x="500.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">цей шум ловить</text>
<rect x="700.0" y="388.0" width="260.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.7"/>
<text x="830.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Зв'язок</text>
<text x="830.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(coupling)</text>
<text x="830.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">геометрія: відстань,</text>
<text x="830.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">паралельність, площа</text>
<text x="335.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="665.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="500.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Завада = Вплив × Сприйнятливість × Зв'язок — занулиш будь-який множник, і гул зникне.</text>
</svg>
