<text x="839.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">проводи раз у раз міняються місцями</text>
<text x="839.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у кабелі — звивання (Белл, 1881)</text>
<text x="839.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на стовпах — транспозиція відкритих ліній</text>
<rect x="40.0" y="376.0" width="942.0" height="96.0" rx="10" fill="#fff6ec" stroke="#e08030" stroke-width="1.6"/>
<text x="60.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">Що змусило перейти на симетрію по всій мережі — 1890-ті, а не 1881:</text>
<text x="60.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">електричні трамваї й силові мережі залили землю зворотними струмами — і однопровідні телефони з поверненням через</text>
<text x="60.0" y="439.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ґрунт затопило гулом. Саме тоді (а не в рік патенту) телефонні компанії масово перейшли на металеві контури,</text>
<text x="60.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">звиті в кабелях і транспоновані на відкритих лініях. Патент 1881 р. був про кабельну геометрію — рушій 1890-х окремий.</text>
<text x="510.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Стрілка історії: один дріт + земля (досить телеграфу)  →  два дроти (металевий контур)  →  звивання/транспозиція (симетрія в дії)</text>
<text x="510.0" y="520.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Телефон ніс слабкий неперервний голос — тому пройшов цей шлях першим; цифрові шини потім успадкували саму ідею.</text>
</svg>
