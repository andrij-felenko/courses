<text x="510.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три епохи дроту: чому телефону довелося робити те, без чого телеграф жив</text>
<text x="510.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">телеграф терпів наводку, телефон — ні; розв'язком став симетричний металевий контур, а далі — звивання й транспозиція</text>
<rect x="40.0" y="86.0" width="286.0" height="250.0" rx="10" fill="#fcfcfc" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="183.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1  Телеграф: один дріт + земля</text>
<text x="183.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">робить, бо сигнал грубий (так/ні)</text>
<rect x="368.0" y="86.0" width="286.0" height="250.0" rx="10" fill="#fcfcfc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="511.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2  Металевий контур (2 дроти)</text>
<text x="511.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Карті, кінець 1880-х · кабель Белла 1881</text>
<rect x="696.0" y="86.0" width="286.0" height="250.0" rx="10" fill="#fcfcfc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="839.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3  Звивання + транспозиція</text>
<text x="839.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">по всій мережі — до ~1900</text>
