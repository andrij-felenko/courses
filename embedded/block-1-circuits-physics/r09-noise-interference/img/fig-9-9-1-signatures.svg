<text x="785.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ тепловий/дробовий шум, ВЧ-сміття</text>
<rect x="60.0" y="310.0" width="840.0" height="150.0" rx="12" fill="#f4f5f7" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="480.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як полювати: міняй одне — дивись на екран</text>
<text x="78.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1) Замкни вхід щупа накоротко (на його ж землю) — якщо «бруд» зник, він наводився; якщо лишився, він у приладі.</text>
<text x="78.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2) Виміряй ПЕРІОД завади: 20 мс → 50 Гц мережа; 16.7 мс → 60 Гц; синхронна з ШІМ/мотором → звідти.</text>
<text x="78.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3) Поворуши/вийми кабелі по черзі, вимикай по одному споживачу (мотор, БЖ, лампу) — стеж, коли впаде амплітуда.</text>
<text x="78.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4) Стисни сигнальну петлю, скороти проводи, додай екран/витку пару — і дивись, що саме допомогло.</text>
<text x="78.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Тригер по фронту (§1.6.7) «зупиняє» повторювану заваду — так її видно стабільно, а не як розмиту пляму.</text>
</svg>
