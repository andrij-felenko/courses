<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому смуга B головна: фільтр впускає шум лише зі своєї смуги</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тепловий шум «білий» — рівний на всіх частотах; скільки смуги відкрив, стільки шумової потужності й зібрав</text>
<line x1="62.0" y1="300.0" x2="884.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="880.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">частота f</text>
<line x1="70.0" y1="308.0" x2="70.0" y2="96.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="62.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">густина шуму</text>
<line x1="70.0" y1="130.0" x2="870.0" y2="130.0" stroke="#e08030" stroke-width="2.0" stroke-dasharray="6,4" stroke-linecap="round"/>
<text x="864.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e08030" text-anchor="end" font-weight="bold" font-style="normal">білий шум: однаково на всіх f</text>
<rect x="70.0" y="130.0" width="470.0" height="170.0" rx="0" fill="#ffe6d1" stroke="#e08030" stroke-width="1.4"/>
<line x1="70.0" y1="340.0" x2="540.0" y2="340.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<line x1="540.0" y1="340.0" x2="70.0" y2="340.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<text x="305.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">широка смуга B₁ — багато шуму</text>
<rect x="70.0" y="130.0" width="120.0" height="170.0" rx="0" fill="#ffcf9e" stroke="#b35a13" stroke-width="2.0"/>
<text x="130.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b35a13" text-anchor="middle" font-weight="bold" font-style="normal">B₂</text>
<text x="198.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b35a13" text-anchor="start" font-weight="bold" font-style="normal">вузька смуга B₂ — мало шуму</text>
<rect x="300.0" y="86.0" width="360.0" height="52.0" rx="9" fill="#f4f5f7" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="440.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">площа під полицею = шумова потужність</text>
<text x="440.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Uш ∝ √B  →  вужча смуга, тихіше</text>
</svg>
