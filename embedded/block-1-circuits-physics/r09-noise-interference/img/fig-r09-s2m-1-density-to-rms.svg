<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<rect width="1000" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fae"/></marker>
</defs>
<text x="500.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Густина — це шум «на корінь з герца». Смуга вирішує решту</text>
<text x="500.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама густина 10 нВ/√Гц дає різний повний шум — бо повний шум росте з коренем смуги</text>
<rect x="60.0" y="95.0" width="300.0" height="300.0" rx="12" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="210.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шум рівномірно «розлитий» по частоті</text>
<text x="210.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(білий шум: e² на кожен Гц однакова)</text>
<line x1="96.0" y1="335.0" x2="326.0" y2="335.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polygon points="326.0,335.0 314.0,330.0 314.0,340.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<text x="330.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">f</text>
<rect x="99.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="119.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="139.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="159.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="179.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="199.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="219.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="239.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="259.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="279.0" y="309.0" width="16.0" height="26.0" rx="2" fill="#d8e6ff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="96.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">кожна цеглинка = e²·Δf однакової «потужності шуму»</text>
<text x="210.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ширша смуга = більше цеглинок = більше потужності</text>
<text x="210.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">складаємо ПОТУЖНОСТІ (квадрати), не напруги</text>
<rect x="410.0" y="95.0" width="540.0" height="300.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="680.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від густини до вольтів</text>
<rect x="434.0" y="143.0" width="492.0" height="52.0" rx="8" fill="#eef6ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="680.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Vₙ(RMS) = eₙ × √BW</text>
<text x="680.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">[нВ] = [нВ/√Гц] × [√Гц]   — одиниці сходяться</text>
<text x="434.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Та сама густина eₙ = 10 нВ/√Гц:</text>
<circle cx="442.0" cy="237.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="454.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">звукова смуга</text>
<text x="454.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">BW = 20 кГц:  eₙ·√20000 ≈ 141</text>
<text x="454.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">≈ 1410 нВ = 1.41 мкВ</text>
<circle cx="442.0" cy="293.0" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="454.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вузький фільтр</text>
<text x="454.0" y="313.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">BW = 100 Гц:  eₙ·√100 = 10</text>
<text x="454.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">≈ 100 нВ = 0.10 мкВ</text>
<line x1="434.0" y1="347.0" x2="926.0" y2="347.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="680.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">смугу звузили в 200× → шум упав лише в √200 ≈ 14×</text>
</svg>
