</defs>
<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де виділяється тепло — на великому опорі чи на малому?</text>
<text x="430.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відповідь залежить від з'єднання: що в них спільне — струм чи напруга</text>
<line x1="430.0" y1="78.0" x2="430.0" y2="330.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
