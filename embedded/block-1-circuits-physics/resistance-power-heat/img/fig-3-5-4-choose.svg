<text x="645.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P = V²/R, напруга однакова →</text>
<text x="645.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сильніше гріється МЕНШИЙ опір (R₁)</text>
<text x="430.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жодного парадоксу: дивись, що спільне. Спільний I → I²R; спільна V → V²/R.</text>
