<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Запобіжники: основні форм-фактори</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама ідея «найслабшої ланки» — у різних корпусах під різні задачі</text>
<rect x="90.0" y="114.0" width="120.0" height="32.0" rx="6" fill="#eaf3f7" stroke="#7fa8bd" stroke-width="2"/>
<rect x="80.0" y="114.0" width="11.0" height="32.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<rect x="209.0" y="114.0" width="11.0" height="32.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<polyline points="94.0,130.0 120.0,123.0 142.0,137.0 164.0,123.0 186.0,137.0 206.0,130.0" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="150.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">скляний 5×20 мм</text>
<text x="150.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">видно нитку; мала відкл. здатність</text>
<rect x="320.0" y="114.0" width="120.0" height="32.0" rx="6" fill="#efe6d6" stroke="#b59b6a" stroke-width="2"/>
<rect x="310.0" y="114.0" width="11.0" height="32.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<rect x="439.0" y="114.0" width="11.0" height="32.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="380.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a8050" text-anchor="middle" font-weight="normal" font-style="italic">пісок</text>
<text x="380.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">керамічний (з піском)</text>
<text x="380.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">велика відкл. здатність (мережа)</text>
<rect x="566.0" y="100.0" width="68.0" height="40.0" rx="5" fill="#e6b800" stroke="#a98a00" stroke-width="2"/>
<line x1="580.0" y1="140.0" x2="580.0" y2="170.0" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
<line x1="620.0" y1="140.0" x2="620.0" y2="170.0" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
<text x="600.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ATO</text>
<text x="600.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ножовий (авто)</text>
<text x="600.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">колір = номінал; 12 В</text>
<rect x="745.0" y="118.0" width="60.0" height="26.0" rx="4" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="775.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-style="normal">2A</text>
<text x="775.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SMD (на плату)</text>
<text x="775.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крихітний, для друк. плат</text>
<rect x="70.0" y="282.0" width="720.0" height="48.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="430.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корпус добирають під струм, напругу, місце монтажу — і під потрібну відключну здатність:</text>
<text x="430.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">скло показує нитку, та гасить лише мале коротке; кераміка з піском приборкує велике.</text>
</svg>
