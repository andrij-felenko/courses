<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тепловий шлях як стос деталей: від кристала до повітря</text>
<text x="410.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожна ланка має свій тепловий опір Rθ; вони стоять послідовно (§1.3.9), і кожну «купуєш» окремо</text>
<rect x="150.0" y="72.0" width="300.0" height="44.0" rx="6" fill="#fbe3df" stroke="#c0271e" stroke-width="2"/>
<text x="300.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кристал (junction)</text>
<rect x="150.0" y="140.0" width="300.0" height="40.0" rx="6" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="300.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корпус деталі (case)</text>
<rect x="150.0" y="200.0" width="300.0" height="26.0" rx="6" fill="#fff3e0" stroke="#e08030" stroke-width="2"/>
<text x="300.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Термоінтерфейс — паста чи прокладка</text>
<rect x="150.0" y="252.0" width="300.0" height="60.0" rx="6" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="300.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіатор (heat sink)</text>
<rect x="150.0" y="340.0" width="300.0" height="40.0" rx="6" fill="#eaf3f7" stroke="#5b87a6" stroke-width="2"/>
<text x="300.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Повітря (ambient)</text>
<text x="470.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Rθ jc</text>
<text x="526.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кристал→корпус</text>
<text x="526.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">з даташита деталі</text>
<text x="470.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Rθ cs</text>
<text x="526.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">корпус→радіатор</text>
<text x="526.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">визначає термоінтерфейс</text>
<text x="470.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Rθ sa</text>
<text x="526.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">радіатор→повітря</text>
<text x="526.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">з даташита радіатора; ↓ з обдувом</text>
<line x1="124.0" y1="80.0" x2="124.0" y2="372.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="110.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тепло</text>
<rect x="120.0" y="386.0" width="580.0" height="32.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="410.0" y="407.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ(заг.) = Rθjc + Rθcs + Rθsa (послідовно);  перегрів ΔT = P · Rθ(заг.)  (§1.3.9).</text>
</svg>
