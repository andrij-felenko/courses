<rect x="500.0" y="92.0" width="308.0" height="360.0" rx="8" fill="#fbfbf4" stroke="#c9c178" stroke-width="1.6"/>
<text x="654.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як вмикати й де граблі</text>
<circle cx="518.0" cy="138.0" r="3.4" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="530.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Живлення — ЧИСТА постійна напруга</text>
<text x="530.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(скажімо, з лінійного БЖ), а не PWM —</text>
<text x="530.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">інакше I²R-нагрів зростає, ефект падає.</text>
<circle cx="518.0" cy="213.0" r="3.4" fill="#d6552b" stroke="#d6552b" stroke-width="1"/>
<text x="530.0" y="217.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d6552b" text-anchor="start" font-weight="bold" font-style="normal">Гарячий бік — на радіатор з обдувом.</text>
<text x="530.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Без відводу тепла ΔT не тримається,</text>
<text x="530.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">обидва боки гріються — модуль гине.</text>
<circle cx="518.0" cy="288.0" r="3.4" fill="#3a86c8" stroke="#3a86c8" stroke-width="1"/>
<text x="530.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#3a86c8" text-anchor="start" font-weight="bold" font-style="normal">Полярність задає напрям: поміняв</text>
<text x="530.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дроти — холодний і гарячий міняються.</text>
<circle cx="518.0" cy="338.0" r="3.4" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="530.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Конденсат на холодному боці —</text>
<text x="530.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">волога з повітря; ізолюй від плати.</text>
<circle cx="518.0" cy="388.0" r="3.4" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="530.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ККД низький: качаєш Qc, а в мережу</text>
<text x="530.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">віддаєш Qc + уся спожита P = V·I.</text>
</svg>
