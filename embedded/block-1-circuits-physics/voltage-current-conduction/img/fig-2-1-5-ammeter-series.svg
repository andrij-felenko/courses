<rect x="120.0" y="320.0" width="560.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="400.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порівняйте: вольтметр вмикають ПАРАЛЕЛЬНО (між двома точками, §1.4),</text>
<text x="400.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">а амперметр — послідовно, бо міряє те, що крізь нього протікає.</text>
