<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опір R залежить від форми; питомий опір ρ — лише від матеріалу</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два шматки тієї самої міді мають різний R, але однаковий ρ</text>
<rect x="120.0" y="150.0" width="160.0" height="60.0" rx="6" fill="#cf8b5e" stroke="#9c6b48" stroke-width="2"/>
<text x="200.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#5a3a26" text-anchor="middle" font-weight="bold" font-style="normal">мідь</text>
<text x="200.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">товстий, короткий</text>
<text x="200.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">малий R</text>
<text x="200.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9c6b48" text-anchor="middle" font-weight="normal" font-style="normal">ρ = 1.7×10⁻⁸ Ом·м</text>
<rect x="420.0" y="168.0" width="300.0" height="24.0" rx="6" fill="#cf8b5e" stroke="#9c6b48" stroke-width="2"/>
<text x="570.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5a3a26" text-anchor="middle" font-weight="bold" font-style="normal">мідь</text>
<text x="570.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тонкий, довгий</text>
<text x="570.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">великий R</text>
<text x="570.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9c6b48" text-anchor="middle" font-weight="normal" font-style="normal">ρ = 1.7×10⁻⁸ Ом·м (той самий!)</text>
<rect x="120.0" y="290.0" width="580.0" height="56.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ρ — це «характер» матеріалу (як густина): однаковий для будь-якого шматка міді.</text>
<text x="410.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R — це опір конкретної деталі: залежить і від ρ, і від довжини та перерізу (R = ρ·L/A, Розд.3).</text>
</svg>
