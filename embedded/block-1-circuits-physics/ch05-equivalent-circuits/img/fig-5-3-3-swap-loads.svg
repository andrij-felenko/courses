<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо це: одне коло — будь-яке навантаження</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">маючи V_th і R_th, вихід для будь-якого R_нав — це простий дільник</text>
<line x1="64.0" y1="157.0" x2="96.0" y2="157.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="71.0" y1="173.0" x2="89.0" y2="173.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="58.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">V_th</text>
<line x1="80.0" y1="120.0" x2="80.0" y2="157.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="80.0" y1="173.0" x2="80.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="80.0" y1="120.0" x2="116.0" y2="120.0" stroke="#cf8b5e" stroke-width="2.2" stroke-linecap="round"/>
<rect x="116.0" y="111.0" width="60.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="146.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R_th</text>
<line x1="176.0" y1="120.0" x2="220.0" y2="120.0" stroke="#cf8b5e" stroke-width="2.2" stroke-linecap="round"/>
<line x1="80.0" y1="210.0" x2="220.0" y2="210.0" stroke="#cf8b5e" stroke-width="2.2" stroke-linecap="round"/>
<line x1="220.0" y1="120.0" x2="220.0" y2="138.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="220.0" y1="192.0" x2="220.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="220.0" cy="138.0" r="4.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="230.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A</text>
<circle cx="220.0" cy="192.0" r="4.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="230.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">B</text>
<text x="150.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">еквівалент</text>
<line x1="240.0" y1="165.0" x2="300.0" y2="165.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="320.0" y="110.0" width="480.0" height="120.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="560.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V_вих = V_th · R_нав/(R_нав + R_th)</text>
<text x="400.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R_нав = R_th</text>
<text x="400.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→</text>
<text x="400.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">½ V_th</text>
<text x="560.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R_нав ≫ R_th</text>
<text x="560.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→</text>
<text x="560.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ V_th</text>
<text x="720.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R_нав ≪ R_th</text>
<text x="720.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→</text>
<text x="720.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 0</text>
<text x="430.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один раз знайшов V_th, R_th — і десятки навантажень рахуєш миттєво, без усієї мережі.</text>
<text x="430.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому еквівалент Тевеніна — улюблений інструмент інженера.</text>
</svg>
