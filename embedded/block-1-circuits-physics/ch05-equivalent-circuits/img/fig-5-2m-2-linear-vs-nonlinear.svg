<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому НАПРУГИ й СТРУМИ складаються (лінійні), а ПОТУЖНІСТЬ P=I²R — ні (квадратична).</text>
