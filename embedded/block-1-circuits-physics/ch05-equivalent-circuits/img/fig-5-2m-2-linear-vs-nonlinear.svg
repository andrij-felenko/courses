  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що лінійне, а що ні — і чому потужність не складається</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лінійне = пряма ЧЕРЕЗ НУЛЬ; зі зсувом — уже не строго лінійне; крива — зовсім ні</text>
<text x="180.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лінійне: резистор I=V/R</text>
<line x1="70.0" y1="318.0" x2="290.0" y2="318.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="70.0" y1="318.0" x2="70.0" y2="104.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="180.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пряма через нуль → суперпозиція працює</text>
<line x1="70.0" y1="318.0" x2="275.0" y2="108.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="70.0" cy="318.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="470.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Афінне: джерело V=ε−I·r</text>
<line x1="360.0" y1="318.0" x2="580.0" y2="318.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="360.0" y1="318.0" x2="360.0" y2="104.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зі зсувом: f(0)≠0 → не СТРОГО лінійне</text>
<line x1="360.0" y1="136.0" x2="552.0" y2="318.0" stroke="#e08030" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="360.0" cy="136.0" r="4.0" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<text x="760.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Нелінійне: діод, потужність</text>
<line x1="650.0" y1="318.0" x2="870.0" y2="318.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="650.0" y1="318.0" x2="650.0" y2="104.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="760.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крива → суперпозиція НЕ працює</text>
