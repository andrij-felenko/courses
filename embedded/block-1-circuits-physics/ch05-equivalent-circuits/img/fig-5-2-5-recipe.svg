<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рецепт суперпозиції та її межі</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">проста процедура — але лише для лінійних кіл</text>
<circle cx="95.0" cy="101.0" r="15.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="95.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="122.0" y="86.0" width="360.0" height="48.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="138.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Лиши одне джерело</text>
<text x="138.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">решту «вимкни» (V→КЗ, I→розрив)</text>
<circle cx="95.0" cy="161.0" r="15.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="95.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<rect x="122.0" y="146.0" width="360.0" height="48.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="138.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Розв'яжи це коло</text>
<text x="138.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">знайди потрібний струм/напругу від цього джерела</text>
<circle cx="95.0" cy="221.0" r="15.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="95.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<rect x="122.0" y="206.0" width="360.0" height="48.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="138.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Повтори для кожного</text>
<text x="138.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">по черзі для всіх джерел</text>
<circle cx="95.0" cy="281.0" r="15.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="95.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<rect x="122.0" y="266.0" width="360.0" height="48.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="138.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Додай</text>
<text x="138.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">алгебрична сума часток — повний відгук</text>
<rect x="510.0" y="86.0" width="290.0" height="240.0" rx="12" fill="#fff3e8" stroke="#e08030" stroke-width="1.6"/>
<text x="655.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Межі застосування</text>
<text x="528.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• ТІЛЬКИ лінійні кола</text>
<text x="540.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(резистори, джерела;</text>
<text x="540.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">без діодів, транзисторів)</text>
<text x="528.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• потужність НЕ додається</text>
<text x="540.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(P ∝ I² — нелінійна)</text>
<text x="528.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• внутрішні опори джерел</text>
<text x="540.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">лишаються на місці</text>
<text x="528.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Зате будь-яке число джерел</text>
<text x="540.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">стає легким — по одному.</text>
</svg>
