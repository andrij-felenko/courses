<text x="320.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="italic">m</text>
<line x1="250.0" y1="120.0" x2="250.0" y2="290.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="250.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">рівновага</text>
<text x="250.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">(x = 0)</text>
<line x1="250.0" y1="150.0" x2="294.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="285.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">x</text>
<line x1="320.0" y1="195.0" x2="250.0" y2="195.0" stroke="#c0271e" stroke-width="3.2" marker-end="url(#aRed)"/>
<text x="284.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">F = −k·x</text>
<text x="180.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пружина: F = −k·x  →  a = −(k/m)·x</text>
<text x="180.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="italic">ω = √(k/m)</text>
<line x1="610.0" y1="108.0" x2="730.0" y2="108.0" stroke="#1b1b1b" stroke-width="2.0" stroke-linecap="round"/>
