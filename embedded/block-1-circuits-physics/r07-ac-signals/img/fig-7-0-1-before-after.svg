<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Замість рівняння на кожне коло — арифметика стрілок на площині. Ось чим Штейнмец полегшив життя інженерам.</text>
