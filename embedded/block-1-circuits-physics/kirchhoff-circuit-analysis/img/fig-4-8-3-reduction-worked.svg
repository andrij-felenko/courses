<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад згортанням: R₁ послідовно з (R₂∥R₃)</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">12 В, R₁=100, R₂=200, R₃=200 Ω</text>
<line x1="110.0" y1="130.0" x2="110.0" y2="300.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
