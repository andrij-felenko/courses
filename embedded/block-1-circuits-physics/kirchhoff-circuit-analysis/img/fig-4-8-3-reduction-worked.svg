<rect x="500.0" y="96.0" width="300.0" height="230.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="518.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">R₂∥R₃ = 200·200/400 = 100 Ω</text>
<text x="518.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">R_екв = R₁ + 100 = 200 Ω</text>
<text x="518.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">I = V/R_екв = 12/200 = 60 мА</text>
<text x="518.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V на R₁ = 0.06·100 = 6 В</text>
<text x="518.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V на парі = 12 − 6 = 6 В</text>
<text x="518.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">I₂ = I₃ = 6/200 = 30 мА</text>
<rect x="518.0" y="300.0" width="264.0" height="22.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="650.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">перевірка: 30+30 = 60 мА ✓</text>
</svg>
