<line x1="101.0" y1="223.0" x2="119.0" y2="223.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="86.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">12 В</text>
<line x1="110.0" y1="130.0" x2="250.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.2" stroke-linecap="round"/>
<rect x="170.0" y="121.0" width="60.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
