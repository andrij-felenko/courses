<circle cx="290.0" cy="168.0" r="18.0" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="290.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<line x1="138.0" y1="168.0" x2="170.0" y2="168.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="240.0" y1="168.0" x2="272.0" y2="168.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="170.0" y="156.0" width="70.0" height="24.0" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
<text x="205.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<text x="205.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">провідність g = 1/R</text>
<text x="200.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">додає у G чотири внески:</text>
<text x="200.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">(1,1) += g    (2,2) += g</text>
<text x="200.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">(1,2) −= g    (2,1) −= g</text>
<line x1="440.0" y1="80.0" x2="440.0" y2="372.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
