<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як SPICE будує матрицю: «штампування» елементів</text>
<text x="440.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен елемент незалежно додає свій фіксований внесок у матрицю провідностей G</text>
<text x="200.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Резистор R між вузлами 1 і 2</text>
<circle cx="120.0" cy="168.0" r="18.0" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
