<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому чип такий тендітний: ізолятор завтовшки в десятки атомів</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">підзатворний оксид сучасного транзистора — кілька нанометрів; його пробиває вже кілька вольт</text>
<text x="250.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розріз: затвор — оксид — кремній</text>
<rect x="120.0" y="110.0" width="260.0" height="34.0" rx="0" fill="#cfd6e6" stroke="#1f47b5" stroke-width="2"/>
<text x="250.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">затвор (gate)</text>
<rect x="120.0" y="144.0" width="260.0" height="12.0" rx="0" fill="#ffe3b0" stroke="#e08030" stroke-width="1.6"/>
<text x="390.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">оксид ≈ 2–10 нм</text>
<rect x="120.0" y="156.0" width="260.0" height="70.0" rx="0" fill="#e9e9e9" stroke="#1b1b1b" stroke-width="2"/>
<text x="250.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кремній (підкладка)</text>
<line x1="320.0" y1="150.0" x2="370.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="340.0" y1="150.0" x2="250.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="160.0" y="270.0" width="210.0" height="90.0" rx="8" fill="#fffaf0" stroke="#e08030" stroke-width="1.6"/>
<text x="265.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">у масштабі атомів:</text>
<circle cx="190.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="204.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="218.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="232.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="246.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="260.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="274.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="288.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<circle cx="302.0" cy="320.0" r="5.0" fill="#ffd27a" stroke="#e08030" stroke-width="1.2"/>
<text x="265.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">~ кілька десятків шарів атомів</text>
<rect x="560.0" y="100.0" width="320.0" height="270.0" rx="12" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="720.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме поле 3 кВ/мм — інша товщина</text>
<text x="584.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">повітря 1 мм</text>
<text x="856.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">≈ 3000 В</text>
<line x1="584.0" y1="176.0" x2="856.0" y2="176.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="584.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">папір 0.1 мм</text>
<text x="856.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">≈ 1000 В</text>
<line x1="584.0" y1="232.0" x2="856.0" y2="232.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="584.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">оксид 5 нм</text>
<text x="856.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">≈ кілька В!</text>
<line x1="584.0" y1="288.0" x2="856.0" y2="288.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="584.0" y="318.0" width="272.0" height="40.0" rx="8" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="720.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">5 нм пробиває вже ~5 В — а тіло несе тисячі</text>
<text x="460.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поле «вольт на товщину» однакове за фізикою — але коли товщина в нанометрах, безпечних вольтів лишаються одиниці.</text>
</svg>
