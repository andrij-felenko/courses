<line x1="660.0" y1="360.0" x2="660.0" y2="370.0" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="820.0" cy="365.0" r="26.0" fill="#fafafa" stroke="#8a8a8a" stroke-width="2"/>
<line x1="815.0" y1="365.0" x2="825.0" y2="365.0" stroke="#8a8a8a" stroke-width="2.6" stroke-linecap="round"/>
<text x="740.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ледь-ледь</text>
<text x="450.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це той самий ряд, що в §1.1.1 — тут ним користуються, щоб обрати безпечні матеріали для столу й одягу.</text>
