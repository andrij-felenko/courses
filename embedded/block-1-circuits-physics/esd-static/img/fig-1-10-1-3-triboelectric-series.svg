<rect x="250.0" y="308.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#1f47b5" stroke-width="1.6"/>
<text x="400.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">гума, поліестер</text>
<rect x="250.0" y="346.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#1f47b5" stroke-width="1.6"/>
<text x="400.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПВХ, поліетилен</text>
<rect x="250.0" y="384.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#1f47b5" stroke-width="1.6"/>
<text x="400.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">тефлон (PTFE)</text>
<text x="220.0" y="421.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">забирає e⁻ → заряджається −</text>
