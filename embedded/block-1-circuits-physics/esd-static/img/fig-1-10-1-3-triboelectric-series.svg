<rect x="250.0" y="118.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#c0271e" stroke-width="1.6"/>
<text x="400.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">скло, волосся</text>
<rect x="250.0" y="156.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#c0271e" stroke-width="1.6"/>
<text x="400.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">нейлон, вовна</text>
<rect x="250.0" y="194.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="400.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">шовк, папір</text>
<rect x="250.0" y="232.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#8a8a8a" stroke-width="1.6"/>
