<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Трибоелектричний ряд: хто стане «+», а хто «−»</text>
<text x="450.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що далі матеріали один від одного в ряду, то більший заряд дає їх контакт і розрив</text>
<text x="220.0" y="77.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">віддає e⁻ → заряджається +</text>
<rect x="250.0" y="80.0" width="300.0" height="30.0" rx="7" fill="#fcfcfc" stroke="#c0271e" stroke-width="1.6"/>
