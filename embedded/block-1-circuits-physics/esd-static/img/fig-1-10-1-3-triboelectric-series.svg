<rect x="590.0" y="270.0" width="300.0" height="150.0" rx="10" fill="#f4f6f9" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="740.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Близька пара — слабка електризація</text>
<text x="740.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бавовна × папір (поряд у ряду)</text>
<circle cx="660.0" cy="365.0" r="26.0" fill="#fafafa" stroke="#8a8a8a" stroke-width="2"/>
