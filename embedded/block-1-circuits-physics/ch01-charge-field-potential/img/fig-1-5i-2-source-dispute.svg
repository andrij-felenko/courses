<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
<rect width="820" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Суть суперечки: де народжується електрика?</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у самій тканині (Гальвані) — чи на стику двох різних металів (Вольта)?</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="370.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="205.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ГАЛЬВАНІ</text>
<circle cx="205.0" cy="220.0" r="54.0" fill="#fde8e8" stroke="#c0271e" stroke-width="2.4"/>
<path d="M188,205 l10,-14 l5,10 l9,-15 l5,12 l8,-10" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<text x="205.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тканина</text>
<text x="205.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джерело — сам м'яз</text>
<text x="205.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(«тваринна електрика»)</text>
<text x="615.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВОЛЬТА</text>
<rect x="545.0" y="175.0" width="30.0" height="90.0" rx="3" fill="#c2c8cc" stroke="#8a8f93" stroke-width="2"/>
<rect x="655.0" y="175.0" width="30.0" height="90.0" rx="3" fill="#cf8b5e" stroke="#9c6b48" stroke-width="2"/>
<rect x="575.0" y="205.0" width="80.0" height="30.0" rx="4" fill="#dfeaf0" stroke="#7aa0b5" stroke-width="1.6"/>
<text x="560.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">метал A</text>
<text x="670.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">метал B</text>
<text x="615.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#5b87a6" text-anchor="middle" font-weight="normal" font-style="normal">волога</text>
<path d="M600,250 l8,-12 l4,9 l7,-12 l4,10" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="615.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джерело — стик металів</text>
<text x="615.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">жаба лише ЧУТЛИВИЙ прилад</text>
<text x="410.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вирішальний крок Вольти: прибрати жабу зовсім — і струм лишається. Отже, джерело — метали.</text>
</svg>
