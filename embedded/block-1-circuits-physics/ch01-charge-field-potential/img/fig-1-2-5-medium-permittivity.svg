<text x="590.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">εr = ≈ 80</text>
<text x="400.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відносна проникність εr (vacuum 1 · повітря ≈ 1.0006 · скло 4–8 · вода ≈ 80):</text>
<text x="400.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що більше εr, то сильніше середовище «екранує» заряди одне від одного.</text>
<text x="400.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому в k стоїть ε₀ — проникність порожнечі: вона задає «силу» взаємодії у вакуумі.</text>
