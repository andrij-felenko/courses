<svg xmlns="http://www.w3.org/2000/svg" width="830" height="560" viewBox="0 0 830 560">
<rect width="830" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="415.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шлях Фарадея: від палітурні до основи фізики</text>
<text x="415.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">людина майже без математики дала фізиці її найматематичніше поняття</text>
<line x1="210.0" y1="96.0" x2="210.0" y2="534.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="210.0" cy="120.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1791</text>
<text x="234.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">народився в бідній родині коваля під Лондоном</text>
<circle cx="210.0" cy="186.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="191.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1805</text>
<text x="234.0" y="191.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">підмайстер палітурника — і жадібно читає книжки, які оправляє</text>
<circle cx="210.0" cy="252.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="257.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1812</text>
<text x="234.0" y="257.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потрапляє на лекції Гемфрі Деві; ретельно конспектує й оправляє нотатки</text>
<circle cx="210.0" cy="319.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1813</text>
<text x="234.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">надсилає нотатки Деві — і стає лаборантом Королівського інституту</text>
<circle cx="210.0" cy="385.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="390.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1831</text>
<text x="234.0" y="390.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відкриває електромагнітну індукцію: рух магніту народжує струм</text>
<circle cx="210.0" cy="451.7" r="9.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="3"/>
<text x="190.0" y="456.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1845</text>
<text x="234.0" y="456.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">вводить поняття «поле» й лінії сили — мовою картинок, без формул</text>
<circle cx="210.0" cy="518.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="190.0" y="523.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1860-ті</text>
<text x="234.0" y="523.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Максвелл перекладає його лінії в рівняння — народжується польова фізика</text>
