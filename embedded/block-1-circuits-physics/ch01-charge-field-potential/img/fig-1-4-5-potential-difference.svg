<line x1="300.0" y1="130.0" x2="300.0" y2="218.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="316.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ΔV = V_A − V_B</text>
