<text x="590.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0 В</text>
<text x="590.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">опорний нуль</text>
<text x="400.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зсунь «нуль» куди завгодно — V_A і V_B зміняться, але їхня РІЗНИЦЯ лишиться тією самою.</text>
