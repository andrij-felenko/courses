<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як топографічна карта: висота (V) і схил (E)</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">еквіпотенціалі — це ізолінії висоти; поле — стрілки найкрутішого спуску</text>
<circle cx="300.0" cy="250.0" r="26.0" fill="none" stroke="#8a52c0" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="300.0" cy="250.0" r="58.0" fill="none" stroke="#8a52c0" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="300.0" cy="250.0" r="100.0" fill="none" stroke="#8a52c0" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="300.0" cy="250.0" r="152.0" fill="none" stroke="#8a52c0" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="300.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="300.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">ізолінії = еквіпотенціалі (однакове V)</text>
<line x1="318.8" y1="256.8" x2="464.4" y2="309.9" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="308.5" y1="268.1" x2="374.0" y2="408.6" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="293.2" y1="268.8" x2="240.1" y2="414.4" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="281.9" y1="258.5" x2="141.4" y2="324.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="281.2" y1="243.2" x2="135.6" y2="190.1" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="291.5" y1="231.9" x2="226.0" y2="91.4" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="306.8" y1="231.2" x2="359.9" y2="85.6" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="318.1" y1="241.5" x2="458.6" y2="176.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="338.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">круто</text>
<text x="338.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(велике E)</text>
<text x="170.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лінії густі → круто → велике E</text>
<text x="170.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лінії рідкі → пологіше → мале E</text>
<rect x="560.0" y="130.0" width="240.0" height="200.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="680.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Читаємо карту</text>
<text x="576.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ізолінія = однаковий потенціал</text>
<text x="576.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• що ближчі ізолінії —</text>
<text x="588.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">то крутіший схил (більше E)</text>
<text x="576.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• стрілка спуску ⊥ ізолініям</text>
<text x="576.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• кулька котиться вниз —</text>
<text x="588.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за полем, від високого V</text>
<circle cx="312.0" cy="218.0" r="7.0" fill="#ddd" stroke="#1b1b1b" stroke-width="1.6"/>
