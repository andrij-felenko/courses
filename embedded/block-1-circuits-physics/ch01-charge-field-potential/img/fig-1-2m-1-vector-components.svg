<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
<rect width="720" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вектор: довжина + напрямок = пара координат</text>
<text x="360.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">силу-стрілку розкладають на складові Fx і Fy — і збирають назад</text>
<line x1="140.0" y1="340.0" x2="500.0" y2="340.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="140.0" y1="340.0" x2="140.0" y2="90.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="500.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="italic" font-style="normal">x</text>
<text x="124.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="italic" font-style="normal">y</text>
<line x1="390.0" y1="152.0" x2="390.0" y2="340.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="390.0" y1="152.0" x2="140.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="140.0" y1="340.0" x2="390.0" y2="340.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="265.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Fx = F·cos θ</text>
<line x1="140.0" y1="340.0" x2="140.0" y2="152.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="126.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Fy = F·sin θ</text>
<rect x="378.0" y="328.0" width="12.0" height="12.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<line x1="140.0" y1="340.0" x2="390.0" y2="152.0" stroke="#c0271e" stroke-width="3.2" marker-end="url(#aRed)"/>
<text x="249.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">F</text>
<circle cx="390.0" cy="152.0" r="3.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="182.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">θ</text>
<rect x="430.0" y="112.0" width="252.0" height="124.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="556.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зі стрілки → координати:</text>
<text x="446.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Fx = F·cos θ,   Fy = F·sin θ</text>
<text x="556.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">З координат → стрілка:</text>
<text x="446.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">|F| = √(Fx² + Fy²)</text>
<text x="446.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">θ = arctg(Fy / Fx)</text>
</svg>
