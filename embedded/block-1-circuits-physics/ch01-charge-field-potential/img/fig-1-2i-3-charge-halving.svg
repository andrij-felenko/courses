<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так дістають точні q/2, q/4, q/8 … — і підтверджують F ∝ q₁·q₂, не знаючи абсолютного заряду.</text>
