<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410">
<rect width="840" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наслідки: порожнина — одна еквіпотенціаль, а товщина не важить</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо E = 0, то V не змінюється (§1.1.6): уся порожнина й метал — на одному потенціалі</text>
<line x1="16.0" y1="130.0" x2="64.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<line x1="16.0" y1="170.0" x2="64.0" y2="170.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<line x1="16.0" y1="210.0" x2="64.0" y2="210.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<line x1="16.0" y1="250.0" x2="64.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<line x1="16.0" y1="286.0" x2="64.0" y2="286.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<rect x="70.0" y="108.0" width="250.0" height="196.0" rx="18" fill="#e9edf0" stroke="#7a8a99" stroke-width="2.4"/>
<rect x="96.0" y="134.0" width="198.0" height="144.0" rx="2" fill="#ffffff" stroke="#7a8a99" stroke-width="2.4"/>
<rect x="96.0" y="134.0" width="198.0" height="144.0" rx="6" fill="#f3eefb" stroke="#8a52c0" stroke-width="1.6"/>
<text x="195.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">V = const</text>
<text x="195.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ΔV = 0 у всій порожнині</text>
<text x="195.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зовні 10 кВ/м × 0.2 м = 2 кВ перепаду →  всередині 0 В</text>
<text x="620.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Екранує оболонка, а не товщина</text>
<rect x="470.0" y="128.0" width="118.0" height="108.0" rx="12" fill="#e9edf0" stroke="#7a8a99" stroke-width="2.4"/>
<text x="529.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">суцільний</text>
<rect x="652.0" y="128.0" width="118.0" height="108.0" rx="18" fill="#e9edf0" stroke="#7a8a99" stroke-width="2.4"/>
<rect x="663.0" y="139.0" width="96.0" height="86.0" rx="7" fill="#ffffff" stroke="#7a8a99" stroke-width="2.4"/>
<text x="711.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">порожнистий (фольга)</text>
<text x="620.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зовні й у порожнині — однаково;</text>
<text x="620.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">навіть тонка замкнута фольга екранує</text>
<rect x="70.0" y="370.0" width="700.0" height="30.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="420.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Важлива тільки ЗАМКНУТІСТЬ провідної оболонки — не її товщина й не те, суцільна вона чи порожня.</text>
</svg>
