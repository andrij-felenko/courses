<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Водяна аналогія: напруга — це «висота» (енергія на заряд)</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">висота баку задає енергію кожної краплі; ширина потоку — то вже струм (далі, Розділ 2)</text>
