<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Індуктивний зв'язок: змінне магнітне поле крізь петлю наводить напругу</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">струм у сусідньому проводі (§1.8.4) родить змінне B; воно пронизує площу нашої сигнальної петлі та наводить ЕРС ∝ площа × швидкість зміни B</text>
<line x1="90.0" y1="110.0" x2="470.0" y2="110.0" stroke="#c0271e" stroke-width="4" stroke-linecap="round"/>
<line x1="330.0" y1="110.0" x2="430.0" y2="110.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="90.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">провід-агресор: змінний струм Iзав</text>
<circle cx="280.0" cy="110.0" r="34.0" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="280.0" cy="110.0" r="58.0" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="4,3"/>
<circle cx="280.0" cy="110.0" r="84.0" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="280.0" y="14.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="italic">змінне поле B навколо проводу</text>
<rect x="150.0" y="200.0" width="330.0" height="150.0" rx="0" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="315.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="italic">площа петлі A</text>
<text x="315.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(сигнал «туди» і «назад»)</text>
<circle cx="150.0" cy="275.0" r="12.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="150.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Д</text>
<text x="150.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">давач</text>
<rect x="466.0" y="259.0" width="28.0" height="32.0" rx="4" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<text x="480.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">вхід</text>
<text x="315.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B пронизує цю площу → наводить ЕРС у петлі</text>
<rect x="560.0" y="120.0" width="320.0" height="130.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="720.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">наведена ЕРС</text>
<text x="720.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Uнав ≈ A · (dB/dt)</text>
<text x="720.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">A — площа петлі</text>
<text x="720.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">dB/dt — швидкість зміни поля</text>
<rect x="150.0" y="372.0" width="640.0" height="56.0" rx="10" fill="#fff6ee" stroke="#e08030" stroke-width="1.7"/>
<text x="470.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний важіль — ПЛОЩА петлі. Зведи площу до нуля (проводи поруч),</text>
<text x="470.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">і наводити нема куди. Звідси — вита пара (§1.9.8): площа майже зникає.</text>
</svg>
