<text x="505.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головне питання екрана: заземлити з одного кінця чи з обох?</text>
<text x="505.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відповідь залежить від частоти завади — і це той самий компроміс земляної петлі, що в §1.9.6</text>
<rect x="30.0" y="70.0" width="950.0" height="220.0" rx="12" fill="#f4faf5" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="50.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">А. Заземлити З ОДНОГО кінця (звичайно — біля джерела)</text>
