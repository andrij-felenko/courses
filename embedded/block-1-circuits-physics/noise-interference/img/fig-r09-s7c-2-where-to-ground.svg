<text x="490.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">земляної петлі немає → струм 50 Гц екраном не біжить → нема гулу</text>
<text x="490.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Найкраще для аналогу, аудіо, повільних давачів (де головна біда — гул мережі та петлі §1.9.6)</text>
