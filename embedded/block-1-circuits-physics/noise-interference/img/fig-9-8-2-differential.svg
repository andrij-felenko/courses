<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корисний сигнал іде як РІЗНИЦЯ проводів — він зберігається.</text>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наводка лягає на обидва ОДНАКОВО (синфазно) — різниця її ВИДАЛЯЄ.</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Звивання робить наводку справді однаковою на обох; різницевий вхід її відкидає.</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Так працюють USB, Ethernet, CAN, RS-485, мікрофонні лінії. (Докладно — у Модулі 6.)</text>
