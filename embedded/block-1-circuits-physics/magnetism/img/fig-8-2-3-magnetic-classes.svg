<text x="462.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="italic">μr ≈ 1.000…1</text>
<rect x="614.0" y="80.0" width="280.0" height="230.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.0"/>
