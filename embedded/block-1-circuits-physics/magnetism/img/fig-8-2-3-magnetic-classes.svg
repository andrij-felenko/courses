<text x="754.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="italic">μr трохи &lt; 1</text>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому мідь не магнітна, а залізо — так: справа не в «металі взагалі», а в тому, як шикуються спіни.</text>
