<rect x="60.0" y="256.0" width="380.0" height="150.0" rx="12" fill="#fff7e6" stroke="#e08030" stroke-width="1.8"/>
<text x="250.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">ЛАТЕНТНЕ (приховане) пошкодження</text>
<text x="250.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оксид лише ослаблений, доріжка підтоплена</text>
<text x="250.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">тест проходить ✓ — а ресурс уже з'їдено</text>
