<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві долі чипа після розряду: миттєва смерть або тиха деградація</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сильний удар убиває одразу; слабкий лишає прихований дефект, що відмовить пізніше — у полі</text>
<rect x="60.0" y="86.0" width="380.0" height="150.0" rx="12" fill="#fdecea" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">КАТАСТРОФІЧНИЙ збій</text>
<text x="250.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оксид пробитий наскрізь / провідник випарувано</text>
<text x="250.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чип мертвий ОДРАЗУ — видно на тесті</text>
