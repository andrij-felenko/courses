<text x="460.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Поріг — близько 3 кВ на кожен міліметр сухого повітря за нормальних умов (≈ 3 кВ/мм = 3 МВ/м).</text>
