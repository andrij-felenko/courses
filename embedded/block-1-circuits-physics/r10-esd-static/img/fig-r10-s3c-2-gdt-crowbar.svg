<text x="470.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому GDT — це «лом» (crowbar): спрацював — і коротить сплеск на землю</text>
