<text x="366.0" y="202.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3. напруга «складається»</text>
<text x="366.0" y="218.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(crowbar — коротке на землю)</text>
<text x="485.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">4. тримає дугу, поки тече струм</text>
<text x="760.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">5. струм згас →</text>
<text x="760.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">GDT знову відкритий</text>
<rect x="340.0" y="85.0" width="470.0" height="64.0" fill="#fff6f4" stroke="#c0271e" stroke-width="1.6" rx="8"/>
<text x="352.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Пастка: коли GDT "закоротив", за сплеском у дугу може</text>
<text x="352.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">піти струм самого джерела (follow current). У мережі його</text>
<text x="352.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">мусить обірвати запобіжник чи послідовний елемент.</text>
