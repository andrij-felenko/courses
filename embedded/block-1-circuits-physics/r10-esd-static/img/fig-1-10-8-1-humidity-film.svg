<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому волога рятує: тонка плівка води робить поверхні трохи провідними</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за високої вологості на всьому осідає мікроплівка води з іонами — заряд стікає сам, не встигаючи накопичитись</text>
<rect x="80.0" y="110.0" width="320.0" height="220.0" rx="12" fill="#fffaf0" stroke="#e08030" stroke-width="1.8"/>
<text x="240.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Сухе повітря (RH ≈ 20%)</text>
