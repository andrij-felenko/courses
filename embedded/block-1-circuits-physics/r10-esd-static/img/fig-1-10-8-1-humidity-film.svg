<line x1="660.0" y1="247.0" x2="790.0" y2="247.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="805.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">стік</text>
<text x="680.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">плівка проводить помалу —</text>
<text x="680.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">заряд розтікається й іде</text>
<text x="680.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">напруга лишається низькою</text>
<text x="460.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Волога не «нейтралізує» заряд хімічно — вона дає йому повільний шлях стекти (поверхнева провідність зростає).</text>
<text x="460.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому взимку в опаленому приміщенні (сухе повітря) статики найбільше — повертаємось до цього на графіку нижче.</text>
</svg>
