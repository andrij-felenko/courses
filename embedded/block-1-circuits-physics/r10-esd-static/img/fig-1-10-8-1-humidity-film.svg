<text x="240.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="middle" font-weight="normal" font-style="normal">стікати нема куди</text>
<text x="240.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">напруга росте до кіловольтів</text>
<rect x="520.0" y="110.0" width="320.0" height="220.0" rx="12" fill="#eef7f6" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="680.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Вологе повітря (RH ≈ 60%)</text>
<rect x="560.0" y="250.0" width="240.0" height="22.0" rx="0" fill="#e0d6c2" stroke="#1b1b1b" stroke-width="1.8"/>
<rect x="560.0" y="244.0" width="240.0" height="7.0" rx="0" fill="#bfe0ea" stroke="#1f47b5" stroke-width="1.2"/>
