<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крапка вирішує все: з'єднано чи ні</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">жирна крапка на перетині = дроти з'єднані; немає крапки = просто перетинаються</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="290.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
<text x="210.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Із крапкою — З'ЄДНАНО</text>
<line x1="110.0" y1="200.0" x2="310.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="210.0" y1="145.0" x2="210.0" y2="255.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="210.0" cy="200.0" r="6.5" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="210.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">одна спільна точка (вузол)</text>
<text x="610.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Без крапки — НЕ з'єднано</text>
<line x1="510.0" y1="200.0" x2="710.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
