<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412">
<rect width="900" height="412" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві речі з паспорта входу — і найнебезпечніша звичка</text>
<line x1="470.0" y1="50.0" x2="470.0" y2="394.0" stroke="#e4e4e4" stroke-width="2" stroke-linecap="round"/>
<text x="235.0" y="66.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«Крокодил» щупа = земля мережі</text>
<rect x="60.0" y="110.0" width="150.0" height="80.0" rx="8" fill="#eef3fb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="135.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Осцилограф</text>
<text x="135.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(живиться з розетки)</text>
<line x1="135.0" y1="190.0" x2="135.0" y2="230.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="121.0" y1="230.0" x2="149.0" y2="230.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="126.0" y1="234.0" x2="144.0" y2="234.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="131.0" y1="238.0" x2="139.0" y2="238.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="135.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">захисна земля розетки</text>
<line x1="210.0" y1="132.0" x2="300.0" y2="132.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polygon points="300.0,126.0 318.0,132.0 300.0,138.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<text x="326.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вістря → сигнал</text>
<line x1="210.0" y1="166.0" x2="300.0" y2="166.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="306.0" cy="166.0" r="5.0" fill="none" stroke="#1f8a3b" stroke-width="2"/>
<text x="326.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">«крокодил» → земля</text>
<text x="326.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">(те саме коло, що й земля розетки)</text>
<rect x="40.0" y="286.0" width="390.0" height="104.0" rx="9" fill="#fdeeee" stroke="#c0271e" stroke-width="1.5"/>
<text x="235.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Земля щупа з'єднана з корпусом — і з</text>
<text x="235.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">захисною землею розетки (§1.6.8).</text>
<text x="58.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ «крокодил» — ЛИШЕ на землю свого кола</text>
<text x="58.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ на інший вузол — коротке через мережеву</text>
<text x="72.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">землю (іскри, удар, згорілий слід)</text>
<text x="682.0" y="66.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Вхід каналу — паспорт</text>
<rect x="500.0" y="86.0" width="360.0" height="122.0" rx="9" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="518.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• 1 МОм ‖ ~15 пФ (типовий вхід)</text>
<text x="518.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• або 50 Ом — на ВЧ-осцилографах</text>
<text x="518.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• макс. вхід ~300 В CAT — не більше!</text>
<text x="518.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• смуга (BW) обмежена: круті фронти</text>
<text x="532.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.0" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">округляються (нижче)</text>
<text x="600.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ідеальний фронт</text>
<polyline points="522.0,300.0 566.0,300.0 566.0,250.0 610.0,250.0" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4,3"/>
<text x="772.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крізь смугу приладу</text>
<polyline points="680.0,300.0 716.0,300.0 724.0,286.0 734.0,268.0 748.0,256.0 770.0,251.0 800.0,250.0" fill="none" stroke="#1f47b5" stroke-width="2.6"/>
<rect x="500.0" y="330.0" width="360.0" height="60.0" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="680.0" y="351.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.0" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Міряти НЕ відносно землі (верхній ключ) —</text>
<text x="680.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.0" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">диференційний щуп чи розв'язка, не «крокодил».</text>
</svg>
