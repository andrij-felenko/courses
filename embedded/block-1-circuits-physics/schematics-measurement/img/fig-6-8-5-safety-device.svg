<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бережіть і прилад, і коло</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кілька звичок, що рятують запобіжники, прилади та нерви</text>
<circle cx="100.0" cy="114.0" r="14.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="2"/>
<text x="100.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="128.0" y="92.0" width="660.0" height="46.0" rx="10" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="146.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Не перевищуй межі приладу</text>
<text x="146.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">категорія й макс. напруга — у паспорті</text>
<circle cx="100.0" cy="170.0" r="14.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="2"/>
<text x="100.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="128.0" y="148.0" width="660.0" height="46.0" rx="10" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="146.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Конденсатори тримають заряд</text>
<text x="146.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">після вимкнення розряди їх — інакше вдарить</text>
<circle cx="100.0" cy="226.0" r="14.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="2"/>
<text x="100.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="128.0" y="204.0" width="660.0" height="46.0" rx="10" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="146.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Правильні гніздо й діапазон</text>
<text x="146.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">струм — в А-гніздо; не міряй В у струмовому</text>
<circle cx="100.0" cy="282.0" r="14.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="2"/>
<text x="100.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="128.0" y="260.0" width="660.0" height="46.0" rx="10" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="146.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Цілі щупи й режим</text>
<text x="146.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тріснута ізоляція щупа — небезпечна</text>
