</defs>
<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від справжнього ґрунту — до «опорного нуля»</text>
<text x="440.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">назва лишилась, хоч сучасна «земля» — це зазвичай просто опорний 0 В кола, а не з'єднання з ґрунтом</text>
<line x1="440.0" y1="72.0" x2="440.0" y2="352.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="225.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Тоді (1838): земля = провідник</text>
<text x="225.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">один дріт</text>
<line x1="120.0" y1="150.0" x2="330.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="120.0" y1="150.0" x2="120.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="106.0" y1="180.0" x2="134.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="111.0" y1="184.0" x2="129.0" y2="184.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="116.0" y1="188.0" x2="124.0" y2="188.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="330.0" y1="150.0" x2="330.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="316.0" y1="180.0" x2="344.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="321.0" y1="184.0" x2="339.0" y2="184.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="326.0" y1="188.0" x2="334.0" y2="188.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="225.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">струм справді тече крізь ҐРУНТ</text>
<text x="225.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">— звідси й назва «земля» / earth</text>
<text x="225.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Карл Август фон Штайнгайль,</text>
<text x="225.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Нюрнберг–Фюрт, 1838</text>
<text x="655.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Тепер: «земля» = опорний 0 В</text>
<rect x="600.0" y="128.0" width="110.0" height="64.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="655.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">коло</text>
<line x1="655.0" y1="192.0" x2="655.0" y2="212.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="641.0" y1="212.0" x2="669.0" y2="212.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="646.0" y1="216.0" x2="664.0" y2="216.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="651.0" y1="220.0" x2="659.0" y2="220.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<text x="655.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">GND — опорний 0 В</text>
<text x="655.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зазвичай НЕ з'єднаний із ґрунтом;</text>
<text x="655.0" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">це просто спільний нуль кола.</text>
<text x="655.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(справжнє заземлення лишилось —</text>
<text x="655.0" y="321.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">для безпеки мережі)</text>
</svg>
