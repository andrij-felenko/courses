<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два числа Нортона: I_n (коротке) і R_n (= R_th)</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">I_n — струм через ЗАМКНЕНІ клеми; R_n — той самий опір, що й у Тевеніна</text>
<line x1="430.0" y1="76.0" x2="430.0" y2="320.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
<text x="215.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I_n = струм короткого замикання</text>
<rect x="90.0" y="120.0" width="150.0" height="130.0" rx="10" fill="#f6f8fc" stroke="#8a8a8a" stroke-width="1.6"/>
