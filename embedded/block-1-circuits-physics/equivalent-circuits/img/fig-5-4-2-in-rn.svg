<text x="730.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ω</text>
<line x1="730.0" y1="170.0" x2="730.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="730.0" y1="210.0" x2="730.0" y2="230.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="430.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R_n = R_th — той самий опір. Різниця лише в тому, що міряємо: струм (Нортон) чи напругу (Тевенін).</text>
