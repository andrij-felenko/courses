<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Автомат на МК: два навантаження, АЦП — і еквівалент готовий</text>
<text x="440.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">мікроконтролер перемикає два відомі навантаження, читає напругу АЦП і сам рахує Vth, Rth</text>
