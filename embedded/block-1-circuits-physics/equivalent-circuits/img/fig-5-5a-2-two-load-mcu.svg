<text x="375.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ключ 1</text>
<rect x="300.0" y="204.0" width="150.0" height="56.0" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.6"/>
