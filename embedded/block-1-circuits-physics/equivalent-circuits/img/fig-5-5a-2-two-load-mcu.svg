<line x1="692.0" y1="190.0" x2="720.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="55.0" y="308.0" width="805.0" height="56.0" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="68.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Пастки МК: навантаження мусять давати ДОСИТЬ різні струми (інакше I₂−I₁ тоне в шумі); зачекай на</text>
<text x="68.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">встановлення перед читанням; усереднюй АЦП; не коротуй (грітимеш/садитимеш джерело); Rth — знімок (заряд, t°).</text>
</svg>
