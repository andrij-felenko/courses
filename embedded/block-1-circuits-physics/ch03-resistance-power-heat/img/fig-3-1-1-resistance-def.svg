<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390">
<rect width="820" height="390" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опір: скільки напруги треба на одиницю струму</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R = V/I — наскільки сильно елемент опирається струмові; одиниця — ом (Ом = В/А)</text>
<line x1="120.0" y1="150.0" x2="250.0" y2="150.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<rect x="250.0" y="136.0" width="90.0" height="28.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="295.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R</text>
<line x1="340.0" y1="150.0" x2="470.0" y2="150.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="160.0" y1="150.0" x2="200.0" y2="150.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="180.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">I</text>
<line x1="250.0" y1="110.0" x2="250.0" y2="90.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="340.0" y1="110.0" x2="340.0" y2="90.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="250.0" y1="95.0" x2="340.0" y2="95.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<text x="295.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">напруга V на ньому</text>
<rect x="520.0" y="110.0" width="240.0" height="90.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="640.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R = V / I</text>
<text x="640.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">провідність G = 1/R (сименс)</text>
<text x="230.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">великий R</text>
<line x1="120.0" y1="270.0" x2="200.0" y2="270.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<rect x="200.0" y="258.0" width="60.0" height="24.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="260.0" y1="270.0" x2="340.0" y2="270.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="150.0" y1="270.0" x2="165.0" y2="270.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="230.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">багато V → ледь-ледь I (важко пхати)</text>
<text x="600.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">малий R</text>
<line x1="490.0" y1="270.0" x2="570.0" y2="270.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<rect x="570.0" y="258.0" width="60.0" height="24.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="630.0" y1="270.0" x2="710.0" y2="270.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="500.0" y1="270.0" x2="560.0" y2="270.0" stroke="#c0271e" stroke-width="2.8" marker-end="url(#aRed)"/>
<text x="600.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мало V → великий I (легко)</text>
<text x="410.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Опір — це «жорсткість» елемента для струму: що більший R, то важче проштовхнути струм.</text>
</svg>
