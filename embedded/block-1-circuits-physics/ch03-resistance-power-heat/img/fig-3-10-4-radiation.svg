<text x="430.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Чорне анодування трохи додає (ε ближче до 1), та головні гравці — кондукція до радіатора й конвекція від нього.</text>
