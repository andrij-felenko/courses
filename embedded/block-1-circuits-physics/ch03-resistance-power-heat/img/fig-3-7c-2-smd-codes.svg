<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SMD-резистори: цифрові коди</text>
<text x="410.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На крихітних SMD немає кілець — номінал друкують числовим кодом</text>
<text x="210.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3 цифри: 2 цифри + нулі-множник</text>
<rect x="152.0" y="102.0" width="116.0" height="60.0" rx="8" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="210.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#f4f4f4" text-anchor="middle" font-weight="bold" font-style="normal">472</text>
<text x="210.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">47 × 10² (два нулі)</text>
<text x="210.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= 4700 Ω = 4.7 кΩ</text>
<text x="610.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">4 цифри (точні): 3 цифри + множник</text>
<rect x="552.0" y="102.0" width="116.0" height="60.0" rx="8" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="610.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#f4f4f4" text-anchor="middle" font-weight="bold" font-style="normal">4701</text>
<text x="610.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">470 × 10¹ (один нуль)</text>
<text x="610.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= 4700 Ω = 4.7 кΩ</text>
<text x="210.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">літера R = десяткова кома</text>
<rect x="152.0" y="258.0" width="116.0" height="60.0" rx="8" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="210.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#f4f4f4" text-anchor="middle" font-weight="bold" font-style="normal">4R7</text>
<text x="210.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4R7 → 4.7 Ω    ·    R47 → 0.47 Ω</text>
<text x="210.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">(R стоїть на місці коми)</text>
<text x="610.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нуль = перемичка</text>
<rect x="552.0" y="258.0" width="116.0" height="60.0" rx="8" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="610.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#f4f4f4" text-anchor="middle" font-weight="bold" font-style="normal">000</text>
<text x="610.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">000 або 0 → перемичка</text>
<text x="610.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= 0 Ω (просто дротик)</text>
<line x1="410.0" y1="82.0" x2="410.0" y2="378.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<rect x="70.0" y="384.0" width="680.0" height="32.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="410.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код дає НОМІНАЛ; справжнє значення — у межах допуску, а напевне скаже лише омметр (§1.6).</text>
</svg>
