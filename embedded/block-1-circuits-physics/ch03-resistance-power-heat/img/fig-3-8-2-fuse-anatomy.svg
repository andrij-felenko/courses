  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Запобіжник: навмисно найслабша ланка, що перегорає першою</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тонкий легкоплавкий дротик у корпусі: надструм його плавить — і коло рветься</text>
<text x="200.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЦІЛИЙ (проводить)</text>
<rect x="88.0" y="142.0" width="24.0" height="32.0" rx="3" fill="#cfd3d8" stroke="#888888" stroke-width="2"/>
<rect x="288.0" y="142.0" width="24.0" height="32.0" rx="3" fill="#cfd3d8" stroke="#888888" stroke-width="2"/>
<rect x="112.0" y="140.0" width="176.0" height="36.0" rx="6" fill="none" stroke="#9bbcd0" stroke-width="2"/>
<line x1="112.0" y1="158.0" x2="288.0" y2="158.0" stroke="#b06a2a" stroke-width="2.8" stroke-linecap="round"/>
<text x="200.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дротик-елемент тонкий і легкоплавкий</text>
<text x="600.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕГОРІВ (розрив)</text>
<rect x="488.0" y="142.0" width="24.0" height="32.0" rx="3" fill="#cfd3d8" stroke="#888888" stroke-width="2"/>
<rect x="688.0" y="142.0" width="24.0" height="32.0" rx="3" fill="#cfd3d8" stroke="#888888" stroke-width="2"/>
<rect x="512.0" y="140.0" width="176.0" height="36.0" rx="6" fill="none" stroke="#9bbcd0" stroke-width="2"/>
<line x1="512.0" y1="158.0" x2="588.0" y2="158.0" stroke="#7a5a3a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="636.0" y1="158.0" x2="688.0" y2="158.0" stroke="#7a5a3a" stroke-width="2.4" stroke-linecap="round"/>
<polyline points="588.0,158.0 596.0,149.0 604.0,165.0 612.0,158.0" fill="none" stroke="#e0792a" stroke-width="2"/>
<text x="600.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">розрив</text>
<text x="600.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">надструм розплавив його → коло розімкнене</text>
<rect x="60.0" y="244.0" width="700.0" height="76.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Запобіжник — найслабша, найгарячіша точка кола. За норми він холодний;</text>
<text x="410.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за надструму його I²R-тепло (§1.3.6) плавить дротик — і коло рветься, перш ніж згорить щось дорожче.</text>
<text x="410.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перегорів — міняють на новий тієї самої марки (одноразовий).</text>
</svg>
