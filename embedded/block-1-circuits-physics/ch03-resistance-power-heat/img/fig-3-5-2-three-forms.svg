<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
<rect width="820" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три обличчя однієї потужності: P = V·I = I²R = V²/R</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">підставляємо закон Ома — і дістаємо форму під ті величини, що відомі</text>
<rect x="300.0" y="78.0" width="220.0" height="56.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="410.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="25" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P = V · I</text>
<text x="410.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">загальна форма — діє завжди</text>
<line x1="338.0" y1="134.0" x2="250.0" y2="196.0" stroke="#1b1b1b" stroke-width="1.9" marker-end="url(#aInk)"/>
<text x="312.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">V = I·R</text>
<rect x="110.0" y="198.0" width="250.0" height="56.0" rx="12" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="235.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P = I² · R</text>
<text x="235.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коли відомі струм I та опір R</text>
<text x="235.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(послідовне коло, нагрів дроту)</text>
<line x1="482.0" y1="134.0" x2="570.0" y2="196.0" stroke="#1b1b1b" stroke-width="1.9" marker-end="url(#aInk)"/>
<text x="508.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I = V/R</text>
<rect x="460.0" y="198.0" width="250.0" height="56.0" rx="12" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="585.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P = V² / R</text>
<text x="585.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коли відомі напруга V та опір R</text>
<text x="585.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(на фіксованому живленні)</text>
<rect x="155.0" y="336.0" width="510.0" height="46.0" rx="10" fill="#fffdf2" stroke="#e08030" stroke-width="1.6"/>
<text x="410.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усі три дають те саме число — обирай ту, де менше рахувати.</text>
<text x="410.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Відомі V та I → перша; струм та R → друга; напруга та R → третя.</text>
</svg>
