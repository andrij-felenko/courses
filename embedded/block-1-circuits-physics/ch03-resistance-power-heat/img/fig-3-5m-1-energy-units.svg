<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430">
<rect width="840" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Арифметика енергії: джоуль, ват-година, мА·год</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">енергія = потужність × час; а мА·год — це заряд (струм×час), не енергія</text>
<text x="420.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЕНЕРГІЯ  (потужність × час)</text>
<rect x="60.0" y="112.0" width="170.0" height="66.0" rx="10" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="145.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джоуль (Дж)</text>
<text x="145.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">= Вт·с — одиниця СІ</text>
<rect x="335.0" y="112.0" width="170.0" height="66.0" rx="10" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="420.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ват-год (Вт·год)</text>
<text x="420.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">= 3600 Дж</text>
<rect x="610.0" y="112.0" width="170.0" height="66.0" rx="10" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="695.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кіловат-год</text>
<text x="695.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">= 1000 Вт·год = 3.6 МДж</text>
<line x1="232.0" y1="145.0" x2="333.0" y2="145.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="282.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×3600</text>
<line x1="507.0" y1="145.0" x2="608.0" y2="145.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="558.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×1000</text>
<rect x="60.0" y="250.0" width="196.0" height="66.0" rx="10" fill="#fbece9" stroke="#c0271e" stroke-width="2"/>
<text x="158.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">мА·год / А·год</text>
<text x="158.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">заряд = струм × час</text>
<text x="158.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЦЕ ЗАРЯД — не енергія!</text>
<line x1="258.0" y1="256.0" x2="392.0" y2="174.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="300.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b06a00" text-anchor="start" font-weight="bold" font-style="normal">× напругу V</text>
<text x="300.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">А·год × В = Вт·год</text>
<rect x="486.0" y="250.0" width="294.0" height="66.0" rx="12" fill="#f3f7f3" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="633.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Середня потужність</text>
<text x="633.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P_сер = енергія ÷ час</text>
<rect x="60.0" y="374.0" width="720.0" height="34.0" rx="10" fill="#fff8ee" stroke="#e08030" stroke-width="1.6"/>
<text x="420.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Час роботи від батареї = (її енергія, Вт·год) ÷ (середня потужність споживача, Вт).</text>
</svg>
