<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380">
<rect width="840" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="420.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ідея: навмисно найслабша ланка, що гине першою</text>
<text x="420.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тонкий запобіжний дротик розплавиться раніше, ніж постраждає цінне — апаратура чи проводка</text>
<rect x="70.0" y="170.0" width="90.0" height="60.0" rx="8" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="115.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джерело</text>
<text x="115.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">/ лінія</text>
<line x1="160.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<rect x="300.0" y="186.0" width="150.0" height="28.0" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.6"/>
<polyline points="308.0,200.0 330.0,194.0 352.0,206.0 374.0,194.0 396.0,206.0 442.0,200.0" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="375.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тонкий запобіжний дротик</text>
<text x="375.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(найслабша ланка)</text>
<line x1="450.0" y1="200.0" x2="600.0" y2="200.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<rect x="600.0" y="166.0" width="160.0" height="68.0" rx="8" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="680.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">цінне:</text>
<text x="680.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">апаратура,</text>
<text x="680.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">проводка, дім</text>
<text x="375.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">надструм / блискавка / коротке</text>
<line x1="375.0" y1="142.0" x2="375.0" y2="170.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="110.0" y="270.0" width="620.0" height="58.0" rx="10" fill="#fff8ee" stroke="#e08030" stroke-width="1.5"/>
<text x="420.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дротик плавиться й РОЗМИКАЄ коло — перш ніж жар устигне зіпсувати решту.</text>
<text x="420.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так у телеграфі рятували апаратуру від блискавки, а в освітленні — будинок від пожежі.</text>
</svg>
