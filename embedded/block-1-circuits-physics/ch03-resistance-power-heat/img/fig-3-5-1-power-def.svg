<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
<rect width="820" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Потужність — це енергія за секунду: чому P = V·I</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">формула не з повітря — вона збирається з двох означень Розділу 1</text>
<rect x="55.0" y="86.0" width="220.0" height="52.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="2"/>
<text x="165.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P = W / t</text>
<text x="165.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">потужність = енергія за час  [Вт = Дж/с]</text>
<rect x="315.0" y="86.0" width="190.0" height="52.0" rx="10" fill="#f6f8fc" stroke="#c0271e" stroke-width="2"/>
<text x="410.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">W = q · V</text>
<text x="410.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">енергія заряду в полі (Гл. 1)</text>
<rect x="550.0" y="86.0" width="190.0" height="52.0" rx="10" fill="#f6f8fc" stroke="#1f47b5" stroke-width="2"/>
<text x="645.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = q / t</text>
<text x="645.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">струм = заряд за час</text>
<line x1="410.0" y1="172.0" x2="410.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="410.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">підставляємо  W = q·V  і групуємо  q/t = I :</text>
<text x="410.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P = W/t = (q·V)/t = (q/t)·V = I·V</text>
<rect x="235.0" y="284.0" width="350.0" height="62.0" rx="14" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="410.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P = V · I</text>
<text x="410.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Одиниця — ват (Вт):  1 Вт = 1 В × 1 А = 1 Дж/с.  Назва — на честь Джеймса Уатта.</text>
</svg>
