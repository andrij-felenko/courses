<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
<rect width="720" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="360.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як дібрати резистор: п'ять кроків</text>
<text x="360.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спершу опір, потім потужність — і завжди із запасом</text>
<rect x="130.0" y="90.0" width="460.0" height="60.0" rx="12" fill="#f6f8fc" stroke="#1f47b5" stroke-width="2.2"/>
<text x="148.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">1. Що треба</text>
<text x="148.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відома напруга V і потрібний струм I</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="168.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="130.0" y="180.0" width="460.0" height="60.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="148.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. Опір</text>
<text x="148.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">R = V / I   (закон Ома, §3.2)</text>
<line x1="360.0" y1="240.0" x2="360.0" y2="258.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="130.0" y="270.0" width="460.0" height="60.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="148.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. Номінал</text>
<text x="148.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">округлити до найближчого значення ряду E</text>
<line x1="360.0" y1="330.0" x2="360.0" y2="348.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="130.0" y="360.0" width="460.0" height="60.0" rx="12" fill="#f6f8fc" stroke="#e08030" stroke-width="2.2"/>
<text x="148.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">4. Потужність</text>
<text x="148.0" y="407.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">P = I²R   (скільки тепла, §3.6)</text>
<line x1="360.0" y1="420.0" x2="360.0" y2="438.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="130.0" y="450.0" width="460.0" height="60.0" rx="12" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="148.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">5. Запас і вибір</text>
<text x="148.0" y="497.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">допустима потужність у 2–3× більша (derating)</text>
</svg>
