<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<rect width="800" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Небезпечний саме СТРУМ через тіло (~мА, AC 50 Гц)</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не «скільки вольтів», а скільки міліампер пройшло крізь людину</text>
<line x1="330.0" y1="92.0" x2="330.0" y2="410.0" stroke="#1b1b1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="323.0" y1="112.0" x2="337.0" y2="112.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">~ 1 мА</text>
<text x="348.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ледь відчутно</text>
<line x1="323.0" y1="171.6" x2="337.0" y2="171.6" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="176.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">~ 5 мА</text>
<text x="348.0" y="176.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">боляче</text>
<line x1="323.0" y1="231.2" x2="337.0" y2="231.2" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="236.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#e08030" text-anchor="end" font-weight="bold" font-style="normal">10–20 мА</text>
<text x="348.0" y="236.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">«не відпустити» — м'язи зводить</text>
<line x1="323.0" y1="290.8" x2="337.0" y2="290.8" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="295.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">30–50 мА</text>
<text x="348.0" y="295.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ускладнене дихання</text>
<line x1="323.0" y1="350.4" x2="337.0" y2="350.4" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="355.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">100–200 мА</text>
<text x="348.0" y="355.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ФІБРИЛЯЦІЯ серця — смертельно</text>
<line x1="323.0" y1="410.0" x2="337.0" y2="410.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="314.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">&gt; 1 А</text>
<text x="348.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">важкі опіки, зупинка серця</text>
<text x="314.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="italic">безпечно</text>
<text x="314.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">смертельно</text>
</svg>
