<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
<rect width="820" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Закон Ома: спершу відкинутий, згодом — наріжний камінь</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">проста залежність, яку німецька академія зустріла зневагою</text>
<rect x="80.0" y="86.0" width="300.0" height="120.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="230.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = V / R</text>
<text x="230.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">більша напруга → більший струм</text>
<text x="230.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">більший опір → менший струм</text>
<rect x="430.0" y="86.0" width="310.0" height="120.0" rx="12" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="585.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому відкинули?</text>
<text x="446.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• панувала «натурфілософія»:</text>
<text x="446.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  істину шукали в умогляді,</text>
<text x="446.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  а не в дослідах і формулах</text>
<text x="446.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• Ом утратив посаду вчителя</text>
<line x1="110.0" y1="270.0" x2="710.0" y2="270.0" stroke="#8a8a8a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="150.0" cy="270.0" r="7.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="150.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1827</text>
<text x="150.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">публікує закон —</text>
<text x="150.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">зневага</text>
<circle cx="337.0" cy="270.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="337.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1833</text>
<text x="337.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">роки забуття,</text>
<text x="337.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">бідність</text>
<circle cx="524.0" cy="270.0" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="524.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1841</text>
<text x="524.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">медаль Коплі —</text>
<text x="524.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">визнання!</text>
<circle cx="711.0" cy="270.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="711.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1881</text>
<text x="711.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одиниця «ом» (Ω)</text>
<text x="711.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">у його честь</text>
<text x="410.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Урок: дослід і математика перемогли умогляд — але часом на це йдуть десятиліття.</text>
</svg>
