<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
<rect width="820" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дослід Ерстеда, 1820: струм відхиляє стрілку компаса</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і то ПЕРПЕНДИКУЛЯРНО до дроту — електрика й магнетизм виявилися пов'язані</text>
<rect x="80.0" y="86.0" width="300.0" height="252.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="230.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">коло розімкнене</text>
<line x1="110.0" y1="168.0" x2="350.0" y2="168.0" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
<text x="230.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">струму нема</text>
<circle cx="230.0" cy="246.0" r="36.0" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="204.0" y1="246.0" x2="256.0" y2="246.0" stroke="#1b1b1b" stroke-width="3.2" marker-end="url(#aInk)"/>
<text x="230.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стрілка вздовж (на північ)</text>
<rect x="440.0" y="86.0" width="300.0" height="252.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="590.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">коло замкнене</text>
<line x1="470.0" y1="168.0" x2="710.0" y2="168.0" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
<line x1="560.0" y1="168.0" x2="660.0" y2="168.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="590.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">струм I тече</text>
<circle cx="590.0" cy="246.0" r="36.0" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="590.0" y1="272.0" x2="590.0" y2="220.0" stroke="#c0271e" stroke-width="3.2" marker-end="url(#aRed)"/>
<text x="590.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стрілка ⟂ дроту</text>
<text x="410.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уперше показано: рухомий заряд (струм) породжує магнітну дію — звідси й піде вся електродинаміка.</text>
</svg>
