<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340">
<rect width="840" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як вирішилося — і несподіваний реванш DC</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">AC переміг публічно й технічно; та сьогодні DC частково повертається</text>
<line x1="90.0" y1="160.0" x2="750.0" y2="160.0" stroke="#8a8a8a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="130.0" cy="160.0" r="7.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="130.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1882</text>
<text x="130.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Едісон: перша</text>
<text x="130.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">DC-станція</text>
<circle cx="280.0" cy="160.0" r="7.0" fill="#fff" stroke="#8a52c0" stroke-width="2.6"/>
<text x="280.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">1888</text>
<text x="280.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тесла:</text>
<text x="280.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">двигун AC</text>
<circle cx="430.0" cy="160.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="430.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">кін. 1880-х</text>
<text x="430.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">PR-війна,</text>
<text x="430.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">електричний стілець</text>
<circle cx="580.0" cy="160.0" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="580.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1893</text>
<text x="580.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Чиказька виставка —</text>
<text x="580.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сяє на AC</text>
<circle cx="730.0" cy="160.0" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="730.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1895</text>
<text x="730.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ніагара → Буффало</text>
<text x="730.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">AC на 30 км — перемога</text>
<rect x="120.0" y="270.0" width="600.0" height="50.0" rx="10" fill="#fff7ef" stroke="#c89b5a" stroke-width="1.6"/>
<text x="420.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">AC став світовим стандартом мереж. Та з сучасною силовою електронікою</text>
<text x="420.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">повертається HVDC (постійний струм) для наддовгих ліній — реванш на новому рівні.</text>
</svg>
