<text x="400.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Водяна аналогія: струм — це витрата потоку</text>
<text x="400.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">скільки води (заряду) проходить через переріз за секунду</text>
