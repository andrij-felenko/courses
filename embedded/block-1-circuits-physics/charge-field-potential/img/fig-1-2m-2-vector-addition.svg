<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
<rect width="780" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="390.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Додавання сил: «голова до хвоста» = скласти координати</text>
<text x="390.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">рівнодійна R = F₁ + F₂; на практиці окремо складають Fx і Fy</text>
<circle cx="170.0" cy="330.0" r="14.0" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.6"/>
<circle cx="170.0" cy="330.0" r="7.7" fill="none" stroke="#c0271e" stroke-width="2.5"/>
<line x1="165.8" y1="330.0" x2="174.2" y2="330.0" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="170.0" y1="325.8" x2="170.0" y2="334.2" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<text x="170.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">заряд q₀</text>
<line x1="170.0" y1="330.0" x2="320.0" y2="270.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="334.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="italic">F₁</text>
<line x1="170.0" y1="330.0" x2="260.0" y2="160.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="256.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="italic">F₂</text>
<line x1="320.0" y1="270.0" x2="410.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="260.0" y1="160.0" x2="410.0" y2="100.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="170.0" y1="330.0" x2="410.0" y2="100.0" stroke="#1f8a3b" stroke-width="3.4" marker-end="url(#aGreen)"/>
<text x="422.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">R = F₁+F₂</text>
<rect x="500.0" y="110.0" width="262.0" height="152.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="631.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У координатах — просто:</text>
<text x="516.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Rx = F₁x + F₂x</text>
<text x="516.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ry = F₁y + F₂y</text>
<text x="516.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">|R| = √(Rx² + Ry²)</text>
<text x="516.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">θ = arctg(Ry / Rx)</text>
<rect x="40.0" y="400.0" width="700.0" height="30.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="390.0" y="421.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Складати координати можна для будь-якого числа сил — і це тривіально в коді (сума масивів).</text>
</svg>
