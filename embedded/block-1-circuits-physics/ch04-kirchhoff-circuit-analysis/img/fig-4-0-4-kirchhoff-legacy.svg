<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не лише кола: Кірхгоф прочитав склад Сонця</text>
<text x="430.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">з Бунзеном вони відкрили спектроскопію — і нові елементи, і «чорне тіло»</text>
<circle cx="80.0" cy="180.0" r="16.0" fill="#fff3c0" stroke="#e08030" stroke-width="2"/>
<text x="80.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">світло</text>
<line x1="96.0" y1="180.0" x2="180.0" y2="180.0" stroke="#d9b94a" stroke-width="4" stroke-linecap="round"/>
<polygon points="180.0,150.0 180.0,210.0 245.0,195.0" fill="#dbe6f5" stroke="#1f47b5" stroke-width="1.6"/>
