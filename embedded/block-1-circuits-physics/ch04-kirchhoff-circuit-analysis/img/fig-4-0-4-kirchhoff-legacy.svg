<text x="680.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спектр із темними лініями</text>
<text x="680.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожна лінія — «відбиток» елемента</text>
<rect x="70.0" y="296.0" width="720.0" height="64.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="430.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама строгість, що дала закони кіл, прочитала по лініях склад Сонця</text>
<text x="430.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і відкрила цезій та рубідій; а закон випромінювання Кірхгофа й термін «чорне тіло» стали зерном квантової фізики.</text>
</svg>
