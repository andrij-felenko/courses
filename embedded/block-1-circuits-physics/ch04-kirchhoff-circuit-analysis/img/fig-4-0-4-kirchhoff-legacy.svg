<rect x="560.0" y="130.0" width="240.0" height="90.0" rx="0" fill="none" stroke="#1b1b1b" stroke-width="1.5"/>
<line x1="630.0" y1="130.0" x2="630.0" y2="220.0" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
