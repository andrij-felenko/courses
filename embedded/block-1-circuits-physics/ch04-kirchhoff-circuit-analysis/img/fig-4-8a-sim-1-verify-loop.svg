<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
<rect width="720" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Симулятор як «нульова ітерація»: спіймати помилку на екрані, а не на платі</text>
<line x1="439.7" y1="148.3" x2="480.3" y2="221.7" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="480.3" y1="278.3" x2="439.7" y2="351.7" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="280.3" y1="351.7" x2="239.7" y2="278.3" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="239.7" y1="221.7" x2="280.3" y2="148.3" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="276.0" y="81.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="360.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1. Намалювати</text>
<text x="360.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перенести схему</text>
<text x="360.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з §1.4.8 у вікно</text>
<rect x="476.0" y="211.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#1f47b5" stroke-width="2.4"/>
<text x="560.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2. Запустити</text>
<text x="560.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">симулятор розв'язує</text>
<text x="560.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рівняння Кірхгофа</text>
<rect x="276.0" y="341.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#e08030" stroke-width="2.4"/>
<text x="360.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">3. Зміряти</text>
<text x="360.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">клік на елемент:</text>
<text x="360.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">V, I, P миттєво</text>
<rect x="76.0" y="211.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#c0271e" stroke-width="2.4"/>
<text x="160.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">4. Звірити</text>
<text x="160.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">збігається з ручним</text>
<text x="160.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розрахунком?</text>
<text x="360.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ціна помилки</text>
<text x="360.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тут ≈ 0</text>
<text x="360.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(а на платі — час і деталі)</text>
<text x="360.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Цикл крутять, доки числа не зійдуться — і лише тоді беруться за паяльник.</text>
</svg>
