<text x="150.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">замість  R1/R2 ?= R1ц/R2ц   →   R1·R2ц ?= R2·R1ц  (без ділення)</text>
<text x="150.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Увага на переповнення: 1МΩ·1МΩ = 10¹² &gt; 2³² — рахуй у 64 бітах.</text>
<text x="150.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Складність O(N log N); таблиця ряду ≈ 300 байт у флеші.</text>
