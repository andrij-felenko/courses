<rect x="150.0" y="358.0" width="520.0" height="46.0" rx="10" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="410.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">обхід контуру:  +12 − 7 − 5 = 0   (Σпідйомів = Σспадів)</text>
<text x="410.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">потенціал однозначний — це збереження енергії</text>
