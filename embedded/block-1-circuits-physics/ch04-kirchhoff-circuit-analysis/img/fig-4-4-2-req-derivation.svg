<text x="420.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V₁ = I·R₁,   V₂ = I·R₂,   V₃ = I·R₃</text>
<text x="420.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V = V₁ + V₂ + V₃ = I·(R₁+R₂+R₃)</text>
<rect x="420.0" y="218.0" width="350.0" height="44.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
