<text x="740.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(R = ρL/A, §3.3)</text>
<rect x="120.0" y="300.0" width="620.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="430.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Послідовно ставлять, щоб обмежити струм, скласти опір чи напругу —</text>
<text x="430.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та пам'ятають: розрив у будь-якій ланці гасить усе коло.</text>
