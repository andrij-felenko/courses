<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де живе міст: датчики, що міряють опором</text>
<text x="430.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе, що змінює опір від впливу, вмикають у плече мосту — і дістають напругу-сигнал</text>
<rect x="60.0" y="110.0" width="220.0" height="120.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="170.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тензодатчик (ваги)</text>
<rect x="95.0" y="165.0" width="150.0" height="14.0" rx="3" fill="#cdd5da" stroke="#1b1b1b" stroke-width="1.6"/>
<polyline points="120.0,165.0 135.0,159.0 150.0,171.0 165.0,159.0 180.0,171.0 195.0,165.0" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<line x1="170.0" y1="150.0" x2="170.0" y2="163.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="170.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вага → деформація → ΔR</text>
<text x="170.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ напруга (load cell)</text>
<rect x="320.0" y="110.0" width="220.0" height="120.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="430.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Температура</text>
<circle cx="430.0" cy="178.0" r="22.0" fill="#fff3e8" stroke="#e08030" stroke-width="2"/>
<text x="430.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">RTD</text>
<text x="430.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тепло → ΔR (RTD/термістор,</text>
<text x="430.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">§1.3.4) → напруга</text>
<rect x="580.0" y="110.0" width="220.0" height="120.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="690.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тиск</text>
<polyline points="645.0,185.0 665.0,178.0 690.0,174.0 715.0,178.0 735.0,185.0" fill="none" stroke="#1f47b5" stroke-width="2"/>
<line x1="645.0" y1="195.0" x2="735.0" y2="195.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="690.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прогин мембрани → ΔR</text>
<text x="690.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ напруга</text>
<rect x="90.0" y="262.0" width="680.0" height="70.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="430.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чверть-, напів- і повний міст: 1, 2 чи 4 активні плеча.</text>
<text x="430.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Більше активних плечей → більший сигнал; протилежні пари ще й гасять вплив температури.</text>
<text x="430.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому міст — стандартний «передній край» майже кожного резистивного датчика.</text>
</svg>
