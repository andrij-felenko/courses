<text x="655.0" y="313.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">черга: беремо з початку, додаємо в кінець</text>
<rect x="110.0" y="336.0" width="660.0" height="30.0" rx="10" fill="#fff8ee" stroke="#e08030" stroke-width="1.4"/>
<text x="440.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На мікроконтролері — ЯВНИЙ стек/черга в пам'яті, а не рекурсія: глибокий граф переповнив би стек МК.</text>
