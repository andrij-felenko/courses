<text x="225.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">порядок: 1 → 2 → 3 → 4 (углиб, тоді назад)</text>
<text x="225.0" y="313.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стек: кладемо сусідів, беремо з вершини</text>
