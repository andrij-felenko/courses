<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перший закон Кірхгофа (KCL): струми у вузлі</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">скільки заряду втікає у вузол — стільки й витікає; він не накопичується</text>
<line x1="150.0" y1="200.0" x2="410.0" y2="200.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="410.0" y1="200.0" x2="640.0" y2="110.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="410.0" y1="200.0" x2="640.0" y2="290.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="150.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="225.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I = 6 А</text>
<line x1="440.0" y1="180.0" x2="600.0" y2="122.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="560.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I₁ = 4 А</text>
<line x1="440.0" y1="220.0" x2="600.0" y2="278.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="560.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I₂ = 2 А</text>
<circle cx="410.0" cy="200.0" r="9.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="410.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вузол</text>
<rect x="220.0" y="300.0" width="380.0" height="52.0" rx="12" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="410.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ΣI_вх = ΣI_вих :   6 А = 4 А + 2 А</text>
<text x="410.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Як трійник у водогоні: що влилося, те й розтеклося. Це — збереження заряду.</text>
</svg>
