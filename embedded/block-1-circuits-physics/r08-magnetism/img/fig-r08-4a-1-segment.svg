<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480">
<rect width="940" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Внесок одного відрізка дроту за Біо—Саваром</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">контур ріжемо на маленькі шматочки dL; кожен дає крихітне поле dB у точці P — їх потім складемо</text>
<polyline points="120.1,253.5 117.8,256.1 115.6,258.7 113.5,261.4 111.6,264.2 109.8,266.9 108.2,269.7 106.7,272.6 105.3,275.4 104.1,278.3 103.1,281.2 102.2,284.1 101.5,287.1 100.9,290.0 100.4,293.0 100.1,295.9 100.0,298.9 100.0,301.9 100.2,304.9 100.5,307.8 101.0,310.8 101.6,313.7 102.4,316.7 103.4,319.6 104.5,322.5 105.7,325.4 107.1,328.2 108.6,331.0 110.3,333.8 112.1,336.6 114.1,339.3 116.2,342.0 118.4,344.6 120.8,347.2 123.3,349.7 125.9,352.2 128.6,354.7 131.5,357.0 134.5,359.4 137.7,361.6 140.9,363.8 144.2,366.0 147.7,368.0 151.3,370.0 154.9,371.9 158.7,373.8 162.5,375.6 166.5,377.3 170.5,378.9 174.6,380.4 178.8,381.9 183.1,383.2 187.4,384.5 191.8,385.7 196.2,386.8 200.8,387.8 205.3,388.8 209.9,389.6 214.6,390.4 219.2,391.0 224.0,391.6" fill="none" stroke="#c0271e" stroke-width="2.6"/>
<text x="109.6" y="276.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">контур зі струмом I</text>
<line x1="102.2" y1="284.1" x2="100.7" y2="290.6" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="112.1" y1="336.6" x2="116.6" y2="342.5" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="166.5" y1="377.3" x2="175.4" y2="380.7" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="110.3" y1="333.8" x2="120.8" y2="347.2" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round"/>
<line x1="110.3" y1="333.8" x2="120.8" y2="347.2" stroke="#1b1b1b" stroke-width="3" marker-end="url(#aInk)"/>
<text x="109.5" y="362.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">dL</text>
<text x="109.5" y="378.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(напрям = напрям струму)</text>
<circle cx="470.0" cy="175.0" r="4.5" fill="#7a3fb0"/>
<text x="478.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7a3fb0" text-anchor="start" font-weight="bold" font-style="italic">P</text>
<text x="478.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3fb0" text-anchor="start" font-weight="normal" font-style="normal">де шукаємо B</text>
<line x1="115.5" y1="340.5" x2="470.0" y2="175.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="298.8" y="251.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="italic">r</text>
<text x="298.8" y="267.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">відстань r</text>
<circle cx="514.0" cy="145.0" r="11.0" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<circle cx="514.0" cy="145.0" r="2.6" fill="#1f8a3b"/>
<text x="530.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="italic">dB</text>
<text x="514.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">⊥ площині (dL × r)</text>
<rect x="560.0" y="92.0" width="360.0" height="150.0" rx="12" fill="#fbfbff" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="740.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Закон Біо—Савара (Biot–Savart)</text>
<text x="740.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">dB = (μ₀ / 4π) · I · (dL × r̂) / r²</text>
<text x="740.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">μ₀ = 4π·10⁻⁷  (магнітна стала)</text>
<text x="740.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">r̂ — одиничний вектор уздовж r,  r̂ = r / r</text>
<text x="740.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3fb0" text-anchor="middle" font-weight="normal" font-style="normal">× — векторний добуток (задає напрям і правило правої руки)</text>
<rect x="560.0" y="258.0" width="360.0" height="188.0" rx="12" fill="#fff8f0" stroke="#e08030" stroke-width="1.6"/>
<text x="740.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Три множники — три ідеї</text>
<text x="576.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• I · dL — «скільки струму та як довго»:</text>
<text x="594.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">довший шматок чи більший струм — більше dB</text>
<text x="576.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 1 / r² — спад із відстанню (як у §1.1.3):</text>
<text x="594.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">далекий шматок дає мізерний внесок</text>
<text x="576.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• dL × r̂ — напрям:</text>
<text x="594.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">dB ⊥ і до dL, і до r; найбільше, коли r ⊥ dL,</text>
<text x="594.0" y="433.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">нуль — коли P лежить уздовж самого dL</text>
</svg>
