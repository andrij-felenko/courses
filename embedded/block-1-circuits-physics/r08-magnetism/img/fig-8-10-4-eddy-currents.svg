<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">змінне поле наводить замкнені струми в товщі металу; за Ленцем вони гальмують рух і гріють метал</text>
