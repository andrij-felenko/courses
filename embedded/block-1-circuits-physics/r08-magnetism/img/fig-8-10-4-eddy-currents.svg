<text x="470.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Користь: гальмо без тертя (атракціони, лічильники), індукційна плита, плавка металу.</text>
<text x="470.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Шкода: марний нагрів осердя трансформатора — тому його й «шихтують» тонкими ізольованими пластинами.</text>
