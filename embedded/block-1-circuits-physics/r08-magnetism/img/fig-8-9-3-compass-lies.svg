<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому компас «бреше» біля дротів і заліза</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поле Землі слабке (~50 мкТл); поруч сильніше місцеве поле струму чи намагніченого заліза перетягує стрілку на себе</text>
<text x="180.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лише поле Землі</text>
<line x1="180.0" y1="250.0" x2="180.0" y2="150.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="180.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B Землі (слабке)</text>
<circle cx="180.0" cy="200.0" r="26.0" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="180.0" y1="222.0" x2="180.0" y2="178.0" stroke="#1f47b5" stroke-width="4" stroke-linecap="round"/>
<polygon points="180.0,178.0 174.0,182.0 186.0,182.0" fill="#c0271e" stroke="none" stroke-width="0"/>
<text x="180.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стрілка чесно на Пн</text>
<text x="660.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">поряд дріт зі струмом</text>
<line x1="560.0" y1="150.0" x2="560.0" y2="280.0" stroke="#e08030" stroke-width="4" marker-end="url(#aOrange)"/>
<text x="548.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e08030" text-anchor="end" font-weight="bold" font-style="italic">I</text>
<circle cx="560.0" cy="215.0" r="50.0" fill="none" stroke="#1f8a3b" stroke-width="1.6"/>
<line x1="610.0" y1="215.0" x2="610.0" y2="245.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#aGreen)"/>
<text x="622.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">сильне місцеве B</text>
<circle cx="660.0" cy="215.0" r="26.0" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="639.1" y1="221.8" x2="680.9" y2="208.2" stroke="#1f47b5" stroke-width="4" stroke-linecap="round"/>
<polygon points="680.9,208.2 674.9,212.2 686.9,212.2" fill="#c0271e" stroke="none" stroke-width="0"/>
<text x="660.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стрілку перетягло поперек дроту</text>
<text x="460.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси практичне правило: вимірюючи поле Землі чи користуючись компасом, тримайся далі від струмів і сталі.</text>
</svg>
