<text x="450.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спершу B росте круто (домени легко повертаються), потім крива згинається — додавати струм майже марно</text>
