  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило Ленца: наведений струм завжди ПРОТИДІЄ зміні, що його породила</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це не примха, а закон збереження енергії: інакше струм підсилював би себе сам і давав енергію з нічого</text>
<circle cx="260.0" cy="220.0" r="60.0" fill="none" stroke="#cf8b5e" stroke-width="3"/>
<text x="260.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">магніт наближається</text>
<rect x="90.0" y="200.0" width="70.0" height="40.0" rx="0" fill="#fbe3e1" stroke="#c0271e" stroke-width="2"/>
<text x="108.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<line x1="165.0" y1="220.0" x2="195.0" y2="220.0" stroke="#7a3fb0" stroke-width="3" marker-end="url(#aPurple)"/>
<text x="180.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3fb0" text-anchor="middle" font-weight="bold" font-style="normal">рух →</text>
<text x="254.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<path d="M 188.6 194.0 A 76.0 76.0 0 0 1 331.4 194.0" fill="none" stroke="#e08030" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="324.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">струм такий, щоб</text>
<text x="324.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">відштовхнути магніт</text>
<circle cx="680.0" cy="220.0" r="60.0" fill="none" stroke="#cf8b5e" stroke-width="3"/>
<text x="680.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">магніт віддаляється</text>
<rect x="480.0" y="200.0" width="70.0" height="40.0" rx="0" fill="#fbe3e1" stroke="#c0271e" stroke-width="2"/>
<text x="515.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<line x1="555.0" y1="220.0" x2="525.0" y2="220.0" stroke="#7a3fb0" stroke-width="3" marker-end="url(#aPurple)"/>
<text x="540.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3fb0" text-anchor="middle" font-weight="bold" font-style="normal">← рух</text>
<text x="674.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<path d="M 751.4 194.0 A 76.0 76.0 0 0 0 608.6 194.0" fill="none" stroke="#e08030" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="744.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">струм такий, щоб</text>
<text x="744.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">притягнути магніт назад</text>
<text x="460.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хоч так, хоч так — котушка «опирається» руху. Тому крутити генератор під навантаженням важче (звідки й береться енергія).</text>
</svg>
