<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Питання 1879 року: магніт штовхає провідник — чи самі носії в ньому?</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Максвелл у «Трактаті» (1873) писав: сила діє «на провідник, а не на струм». Холл вирішив це перевірити.</text>
