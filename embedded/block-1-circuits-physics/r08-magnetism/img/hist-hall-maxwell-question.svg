<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">У товстому бруску носіїв багато, поперечне поле мізерне; у тонкому листку той самий струм «згущено» —</text>
<text x="450.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">напруга на краях зростає й нарешті ворушить стрілку гальванометра.</text>
<text x="150.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">товстий брусок</text>
