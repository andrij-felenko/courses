<text x="250.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">середнє за вікно (ковзне)</text>
<line x1="250.0" y1="298.0" x2="250.0" y2="334.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="260.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">корінь  √⟨v²⟩</text>
<rect x="110.0" y="372.0" width="280.0" height="50.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="italic">RMS = √⟨v²⟩</text>
<text x="250.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стале «діюче» значення</text>
<rect x="540.0" y="96.0" width="360.0" height="150.0" rx="12" fill="#fbfbff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="720.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Те саме означення двома мовами</text>
<text x="560.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">неперервно (за період T):</text>
<text x="568.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Vrms = √( (1/T)·∫ v(t)² dt )</text>
<text x="560.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">у прошивці (N відліків):</text>
<text x="568.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Vrms = √( (1/N)·Σ v[n]² )</text>
<rect x="540.0" y="262.0" width="360.0" height="170.0" rx="12" fill="#fff8f0" stroke="#e08030" stroke-width="1.6"/>
<text x="720.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Чому саме «квадрат → середнє → корінь»</text>
<text x="558.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• квадрат прибирає знак: + і − гріють</text>
<text x="578.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">однаково, тож не скорочуються</text>
<text x="558.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• середнє — це «розсіяна потужність»</text>
<text x="578.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">на одиничному опорі (∝ тепло)</text>
<text x="558.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• корінь повертає у вольти, щоб</text>
<text x="578.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">число грілo R так само, як рівний DC</text>
</svg>
