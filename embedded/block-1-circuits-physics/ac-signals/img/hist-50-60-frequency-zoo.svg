<line x1="515.1" y1="141.0" x2="515.1" y2="159.0" stroke="#c0271e" stroke-width="2.6" stroke-linecap="round"/>
<text x="515.1" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">60</text>
<line x1="750.7" y1="144.0" x2="750.7" y2="156.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<text x="750.7" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">125</text>
<line x1="770.7" y1="144.0" x2="770.7" y2="156.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<text x="770.7" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">133⅓</text>
<rect x="525.6" y="78.0" width="261.5" height="50.0" rx="7" fill="#fdecea" stroke="#c0271e" stroke-width="1.4"/>
<text x="656.4" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">освітлення любить</text>
<text x="656.4" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ВИСОКУ частоту</text>
<text x="656.4" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">(менше мерехтіння)</text>
