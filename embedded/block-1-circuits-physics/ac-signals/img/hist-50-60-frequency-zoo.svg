<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зоопарк частот, що звузився до двох</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1880-ті — десятки несумісних частот; 1890-ті — інженерний компроміс лишив 50 і 60 Гц</text>
<line x1="70.0" y1="150.0" x2="830.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="830.0" y1="150.0" x2="842.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="846.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Гц</text>
<line x1="103.8" y1="144.0" x2="103.8" y2="156.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<text x="103.8" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">16⅔</text>
<line x1="234.0" y1="144.0" x2="234.0" y2="156.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<text x="234.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">25</text>
<line x1="292.5" y1="144.0" x2="292.5" y2="156.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<text x="292.5" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">30</text>
<line x1="384.9" y1="144.0" x2="384.9" y2="156.0" stroke="#e08030" stroke-width="1.8" stroke-linecap="round"/>
<text x="384.9" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#e08030" text-anchor="middle" font-weight="normal" font-style="normal">40</text>
<line x1="456.6" y1="141.0" x2="456.6" y2="159.0" stroke="#1f47b5" stroke-width="2.6" stroke-linecap="round"/>
