<rect x="90.7" y="78.0" width="413.5" height="50.0" rx="7" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="297.5" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мотор і трансформатор</text>
<text x="297.5" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">люблять НИЗЬКУ частоту</text>
<line x1="508.2" y1="116.0" x2="490.9" y2="138.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aGreen)"/>
<rect x="443.4" y="186.0" width="87.3" height="22.0" rx="6" fill="#fff7e6" stroke="#e08030" stroke-width="1.6"/>
<text x="487.1" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">вікно компромісу</text>
<line x1="456.6" y1="210.0" x2="206.0" y2="302.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<rect x="40.0" y="304.0" width="332.0" height="66.0" rx="10" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="206.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">50 Гц — AEG (1891)</text>
<text x="206.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">після мерехтіння 40 Гц у Лауффен–Франкфурті;</text>
<text x="206.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ Європа й більшість світу</text>
<line x1="515.1" y1="210.0" x2="694.0" y2="302.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="528.0" y="304.0" width="332.0" height="66.0" rx="10" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="694.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">60 Гц — Вестингауз (бл. 1890)</text>
<text x="694.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">арк-лампи йшли трохи краще на 60;</text>
<text x="694.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ Північна Америка, частина Японії</text>
<line x1="384.9" y1="164.0" x2="384.9" y2="138.0" stroke="#e08030" stroke-width="1.6" marker-end="url(#aOrange)"/>
<text x="384.9" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="normal" font-style="italic">(40 — мерехтіло)</text>
<line x1="234.0" y1="164.0" x2="300.0" y2="398.0" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aInk)"/>
<rect x="300.0" y="398.0" width="300.0" height="46.0" rx="9" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">25 Гц — Ніагара (1895)</text>
<text x="450.0" y="433.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">швидкість турбіни зафіксували заздалегідь</text>
<text x="450.0" y="462.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Жодна з частот не «правильніша» фізично — вибір лишили інерція обладнання й ринку</text>
</svg>
