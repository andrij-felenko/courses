<text x="450.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому переміг саме 511: тригер + ціна + одна коробка</text>
<text x="450.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не «перший тригер», а перший доступний і зручний — тому опинився на кожному столі</text>
<rect x="70.0" y="80.0" width="300.0" height="150.0" rx="10" fill="#fbfbff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="220.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Типовий DuMont</text>
<rect x="100.0" y="120.0" width="110.0" height="78.0" rx="5" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.4"/>
<rect x="230.0" y="120.0" width="110.0" height="78.0" rx="5" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="155.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">блок 1</text>
<text x="285.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">блок 2</text>
<text x="220.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дві коробки · ~$1800</text>
<line x1="388.0" y1="155.0" x2="470.0" y2="155.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="430.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і дешевше,</text>
<text x="430.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і простіше</text>
<rect x="490.0" y="80.0" width="330.0" height="150.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="655.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Tektronix 511 (1947)</text>
<rect x="540.0" y="120.0" width="230.0" height="78.0" rx="6" fill="#dff0e4" stroke="#1f8a3b" stroke-width="1.5"/>
<circle cx="600.0" cy="159.0" r="26.0" fill="#0d1f0d" stroke="#2a4a2a" stroke-width="2"/>
<polyline points="580.0,159.0 592.0,159.0 600.0,145.0 608.0,173.0 616.0,159.0 626.0,159.0" fill="none" stroke="#7CFC7C" stroke-width="2.2"/>
<text x="712.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тригерна</text>
<text x="712.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">розгортка</text>
<text x="655.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">одна коробка · $795</text>
<rect x="70.0" y="250.0" width="750.0" height="98.0" rx="9" fill="#fff5ea" stroke="#e08030" stroke-width="1.4"/>
<text x="445.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесна примітка: «калібратор» у 511-му був скромний — 60-герцова синусоїда</text>
<text x="445.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">з мережевого трансформатора (за спогадами інженера Дж. Аддіса), а не точний еталон.</text>
<text x="445.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Справжній калібрований часозбіг — заслуга вже пізніших моделей Tektronix,</text>
<text x="445.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що остаточно зробили осцилограф вимірювальним приладом, а не «глядачем хвиль».</text>
</svg>
