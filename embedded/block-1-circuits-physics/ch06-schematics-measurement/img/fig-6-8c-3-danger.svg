<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому дешевим мультиметром не лізуть у щиток</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">недостатня категорія + лютий транзієнт = дуга всередині приладу в тебе в руці</text>
<line x1="455.0" y1="64.0" x2="455.0" y2="276.0" stroke="#e4e4e4" stroke-width="2" stroke-linecap="round"/>
<text x="232.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Дешевий CAT II у щитку (CAT III)</text>
<rect x="147.0" y="108.0" width="170.0" height="116.0" rx="10" fill="#fbfbff" stroke="#c0271e" stroke-width="1.8"/>
<text x="232.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дешевий прилад</text>
<polyline points="192.0,150.0 216.0,176.0 201.0,181.0 228.0,208.0" fill="none" stroke="#e08030" stroke-width="3"/>
<polyline points="252.0,148.0 236.0,174.0 256.0,178.0 241.0,204.0" fill="none" stroke="#e08030" stroke-width="3"/>
<text x="232.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">транзієнт пробиває ізоляцію →</text>
<text x="232.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">дуга, спалах, опіки</text>
<text x="680.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Правильний CAT III/IV</text>
<text x="518.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• більші зазори (creepage/clearance)</text>
<text x="518.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• посилена ізоляція й вхідний захист</text>
<text x="518.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• HRC-запобіжник (піщаний), що гасить дугу</text>
<text x="530.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">— а не скляний, що бризкає</text>
<text x="518.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• щупи теж із CAT-рейтингом</text>
<rect x="540.0" y="228.0" width="116.0" height="30.0" rx="5" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="598.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">HRC + пісок</text>
<rect x="672.0" y="228.0" width="116.0" height="30.0" rx="5" fill="#fdeeee" stroke="#c0271e" stroke-width="1.4"/>
<text x="730.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">скляний ✗</text>
<rect x="90.0" y="286.0" width="720.0" height="98.0" rx="9" fill="#fff5ea" stroke="#e08030" stroke-width="1.4"/>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У щитку (CAT III) і на вводі (CAT IV) опір джерела малий — транзієнт несе величезну енергію.</text>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.1" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Прилад нижчої категорії не витримує: усередині спалахує дуга — і вибухає в руці.</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Для щитка — лише CAT III, для вводу — CAT IV від відомого бренду. Стережіться ФАЛЬШИВИХ «CAT».</text>
<text x="450.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Для плати, USB чи батарейки CAT I–II цілком досить — там лютих транзієнтів нема.</text>
</svg>
