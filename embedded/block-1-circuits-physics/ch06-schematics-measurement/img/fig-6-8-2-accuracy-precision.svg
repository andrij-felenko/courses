<circle cx="615.0" cy="122.0" r="3.2" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<circle cx="595.0" cy="180.0" r="3.2" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<circle cx="570.0" cy="125.0" r="3.2" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<circle cx="623.0" cy="162.0" r="3.2" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="590.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Розкидано</text>
<text x="590.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ні точно, ні влучно</text>
<rect x="710.0" y="96.0" width="130.0" height="150.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="775.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Роздільність</text>
<text x="775.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">5.0 В</text>
<text x="775.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">5.00 В</text>
<text x="775.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">більше цифр —</text>
<text x="775.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дрібніша поділка,</text>
<text x="775.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">та НЕ гарантія</text>
<text x="775.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">правдивості</text>
</svg>
