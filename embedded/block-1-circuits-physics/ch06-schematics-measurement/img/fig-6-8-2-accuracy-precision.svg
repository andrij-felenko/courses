<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Точність, влучність, роздільність — це різне</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">влучний ≠ точний; а роздільність — лише дрібність поділки, не правдивість</text>
<circle cx="150.0" cy="150.0" r="56.0" fill="none" stroke="#bbb" stroke-width="1.4"/>
<circle cx="150.0" cy="150.0" r="34.7" fill="none" stroke="#bbb" stroke-width="1.2"/>
<circle cx="150.0" cy="150.0" r="14.6" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="146.0" cy="153.0" r="3.2" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<circle cx="155.0" cy="148.0" r="3.2" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<circle cx="152.0" cy="156.0" r="3.2" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<circle cx="148.0" cy="146.0" r="3.2" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="150.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Точно + влучно</text>
<text x="150.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">близько до істини, купно</text>
<circle cx="370.0" cy="150.0" r="56.0" fill="none" stroke="#bbb" stroke-width="1.4"/>
<circle cx="370.0" cy="150.0" r="34.7" fill="none" stroke="#bbb" stroke-width="1.2"/>
<circle cx="370.0" cy="150.0" r="14.6" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="398.0" cy="130.0" r="3.2" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<circle cx="403.0" cy="134.0" r="3.2" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<circle cx="400.0" cy="126.0" r="3.2" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<circle cx="396.0" cy="132.0" r="3.2" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<text x="370.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Влучно, та НЕ точно</text>
<text x="370.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">купно, але збоку (зсув)</text>
<circle cx="590.0" cy="150.0" r="56.0" fill="none" stroke="#bbb" stroke-width="1.4"/>
<circle cx="590.0" cy="150.0" r="34.7" fill="none" stroke="#bbb" stroke-width="1.2"/>
<circle cx="590.0" cy="150.0" r="14.6" fill="none" stroke="#c0271e" stroke-width="1.6"/>
