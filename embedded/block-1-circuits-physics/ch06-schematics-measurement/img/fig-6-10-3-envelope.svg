<text x="410.0" y="115.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">мале R → CC</text>
<rect x="150.0" y="360.0" width="560.0" height="48.0" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="430.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перехід при R = V_зад / I_межа: більший опір — режим CV, менший — режим CC.</text>
<text x="430.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Робоча точка — перетин лінії навантаження з межею (та сама ідея, що §1.5.1).</text>
