<text x="367.1" y="138.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">межа I (CC)</text>
<text x="688.6" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">12 В</text>
<text x="102.0" y="146.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">0.5 А</text>
<line x1="110.0" y1="340.0" x2="667.1" y2="214.2" stroke="#1f47b5" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
