<text x="705.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Табло (лічильник + дисплей)</text>
<rect x="120.0" y="372.0" width="660.0" height="48.0" rx="8" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головна ідея: цифрувати прилад уміє лише НАПРУГУ.</text>
<text x="450.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Струм і опір він спершу обертає на напругу (шунтом чи джерелом струму) — і вже її злічує.</text>
