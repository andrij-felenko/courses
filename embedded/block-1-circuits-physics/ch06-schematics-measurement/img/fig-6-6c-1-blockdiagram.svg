<text x="262.5" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">малий опір, спад напруги</text>
<rect x="175.0" y="235.0" width="175.0" height="52.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
