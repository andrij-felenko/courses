<text x="495.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">еталон для порівняння</text>
<line x1="495.0" y1="130.0" x2="495.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="420.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="495.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЦП</text>
<text x="495.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруга → число</text>
<text x="495.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інтегрувальний (dual-slope)</text>
<text x="495.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">або сигма-дельта</text>
