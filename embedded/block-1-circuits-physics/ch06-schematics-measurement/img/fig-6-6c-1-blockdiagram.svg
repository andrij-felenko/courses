<text x="262.5" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вхід ≈ 10 МОм</text>
<rect x="175.0" y="165.0" width="175.0" height="52.0" rx="8" fill="#fdeeee" stroke="#c0271e" stroke-width="1.6"/>
