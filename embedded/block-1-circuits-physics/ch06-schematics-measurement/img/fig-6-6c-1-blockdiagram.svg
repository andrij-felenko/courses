<circle cx="60.0" cy="191.0" r="9.0" fill="#fff" stroke="#e08030" stroke-width="2.4"/>
<text x="76.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">10A</text>
