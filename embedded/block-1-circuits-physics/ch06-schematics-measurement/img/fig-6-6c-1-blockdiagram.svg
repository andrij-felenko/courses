</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що всередині мультиметра: будь-яку величину звести до напруги і злічити</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вхідний каскад залежить від режиму; далі тракт спільний для всіх</text>
<text x="60.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гнізда</text>
<circle cx="60.0" cy="121.0" r="9.0" fill="#fff" stroke="#c0271e" stroke-width="2.4"/>
