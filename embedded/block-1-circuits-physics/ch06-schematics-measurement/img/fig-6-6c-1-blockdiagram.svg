<text x="60.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">опорна точка</text>
<text x="262.5" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вибирає перемикач режиму</text>
<rect x="175.0" y="95.0" width="175.0" height="52.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.6"/>
