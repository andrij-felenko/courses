<text x="410.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хоч до вузла А під'єднано чотири деталі в різних місцях —</text>
<text x="410.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це ОДНА точка кола (один потенціал), бо все сполучено суцільним дротом.</text>
