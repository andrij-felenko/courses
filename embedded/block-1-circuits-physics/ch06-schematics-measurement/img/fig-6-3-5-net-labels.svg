<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Іменовані ланцюги: з'єднання без дроту</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">однакова назва (мітка) означає одне коло — навіть якщо лінії не з'єднані</text>
<rect x="120.0" y="120.0" width="60.0" height="70.0" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
