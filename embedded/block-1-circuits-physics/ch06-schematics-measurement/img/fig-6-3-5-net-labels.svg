<text x="560.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+5В</text>
<line x1="590.0" y1="175.0" x2="640.0" y2="175.0" stroke="#cf8b5e" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="590.0,175.0 580.0,166.0 538.0,166.0 538.0,184.0 580.0,184.0" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="560.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">GND</text>
<line x1="296.0" y1="140.0" x2="528.0" y2="140.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aRed)"/>
<text x="410.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">та сама назва → з'єднано</text>
<line x1="296.0" y1="175.0" x2="528.0" y2="175.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aBlue)"/>
<rect x="150.0" y="240.0" width="520.0" height="60.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так схему не захаращують довгими лініями: «+5В» тут і «+5В» там — це одне коло.</text>
<text x="410.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Особливо зручно для живлення (+5В, GND) і шин сигналів (напр. SDA, SCL).</text>
