<text x="450.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Розрядність»: counts і цифри вирішують, скільки знаків ви бачите</text>
<text x="450.0" y="46.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама напруга ≈ 4.2361 В на табло різної роздільності</text>
<rect x="60.0" y="76.0" width="240.0" height="152.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="180.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Кишеньковий</text>
<text x="180.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">2000 counts · 3½ цифри</text>
<rect x="90.0" y="134.0" width="180.0" height="50.0" rx="6" fill="#101814" stroke="#101814" stroke-width="2"/>
<text x="180.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#5dff9b" text-anchor="middle" font-weight="bold" font-style="normal">4.23</text>
<text x="180.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крок 10 мВ  (В)</text>
<rect x="330.0" y="76.0" width="240.0" height="152.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="450.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Польовий</text>
<text x="450.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">6000 counts · 3¾ цифри</text>
<rect x="360.0" y="134.0" width="180.0" height="50.0" rx="6" fill="#101814" stroke="#101814" stroke-width="2"/>
<text x="450.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#5dff9b" text-anchor="middle" font-weight="bold" font-style="normal">4.236</text>
<text x="450.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крок 1 мВ  (В)</text>
<rect x="600.0" y="76.0" width="240.0" height="152.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="720.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лабораторний</text>
<text x="720.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">6½ цифри (1 199 999)</text>
<rect x="630.0" y="134.0" width="180.0" height="50.0" rx="6" fill="#101814" stroke="#101814" stroke-width="2"/>
<text x="720.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#5dff9b" text-anchor="middle" font-weight="bold" font-style="normal">4.23612</text>
<text x="720.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крок 10 мкВ  (В)</text>
<rect x="120.0" y="252.0" width="660.0" height="112.0" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Counts — найбільше число, що влазить на табло (2000 → до 1999).</text>
<text x="450.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Більше counts / цифр = дрібніший крок = більше значущих знаків.</text>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Автодіапазон сам обирає найменший діапазон, де число влазить —</text>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">так на табло лишається найбільше корисних цифр (4.236, а не 04.23).</text>
<text x="450.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«Точність» (±%) — це інше: межа правдивості показу (§1.6.8), не його дрібність.</text>
</svg>
