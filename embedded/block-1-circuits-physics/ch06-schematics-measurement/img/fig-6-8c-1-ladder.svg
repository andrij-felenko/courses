<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Категорії CAT: що ближче до джерела, то лютіші стрибки напруги</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">CAT — не про робочу напругу, а про здатність витримати ТРАНЗІЄНТИ (імпульсні перенапруги)</text>
<text x="70.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">джерело</text>
<text x="70.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(транзієнти)</text>
<text x="835.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">навантаження</text>
<line x1="120.0" y1="99.0" x2="770.0" y2="99.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<polygon points="152.0,196.0 165.0,134.0 178.0,196.0" fill="#c0271e" stroke="none" stroke-width="0"/>
<line x1="165.0" y1="196.0" x2="165.0" y2="212.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<rect x="90.0" y="212.0" width="150.0" height="66.0" rx="9" fill="#fbfbff" stroke="#c0271e" stroke-width="1.8"/>
<text x="165.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">CAT IV</text>
<text x="165.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ввід · лічильник</text>
<text x="165.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">служба, ПЛ, ввід у дім</text>
<polygon points="332.0,196.0 345.0,152.0 358.0,196.0" fill="#e08030" stroke="none" stroke-width="0"/>
<line x1="345.0" y1="196.0" x2="345.0" y2="212.0" stroke="#e08030" stroke-width="1.4" stroke-linecap="round"/>
<rect x="270.0" y="212.0" width="150.0" height="66.0" rx="9" fill="#fbfbff" stroke="#e08030" stroke-width="1.8"/>
<text x="345.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">CAT III</text>
<text x="345.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Щиток · розподіл</text>
<text x="345.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">автомати, шини, двигуни</text>
<polygon points="512.0,196.0 525.0,168.0 538.0,196.0" fill="#1f47b5" stroke="none" stroke-width="0"/>
<line x1="525.0" y1="196.0" x2="525.0" y2="212.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<rect x="450.0" y="212.0" width="150.0" height="66.0" rx="9" fill="#fbfbff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="525.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CAT II</text>
<text x="525.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розетка · прилади</text>
<text x="525.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">штепсельні навантаження</text>
<polygon points="692.0,196.0 705.0,183.0 718.0,196.0" fill="#1f8a3b" stroke="none" stroke-width="0"/>
<line x1="705.0" y1="196.0" x2="705.0" y2="212.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="630.0" y="212.0" width="150.0" height="66.0" rx="9" fill="#fbfbff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="705.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CAT I</text>
<text x="705.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Захищена електроніка</text>
<text x="705.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не з'єднана прямо з мережею</text>
<rect x="90.0" y="300.0" width="690.0" height="96.0" rx="9" fill="#fff5ea" stroke="#e08030" stroke-width="1.4"/>
<text x="435.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що ближче до вводу (CAT IV), то БІЛЬШІ імпульсні перенапруги — і МЕНШИЙ опір джерела,</text>
<text x="435.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.1" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тобто більший струм короткого. Що далі вглиб (до CAT I), то дужче опір проводів гасить стрибки.</text>
<text x="435.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому категорія приладу має відповідати МІСЦЮ виміру: у щиток — CAT III, на ввід — CAT IV.</text>
<text x="435.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А «робочі вольти» — окреме число: CAT і напругу читають РАЗОМ (далі).</text>
</svg>
