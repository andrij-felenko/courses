<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<rect width="900" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напис на корпусі чіпа: чотири рядки — чотири різні відомості</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий лазерний штамп розкладаємо на поля — кожне про щось своє</text>
<rect x="285.0" y="92.0" width="330.0" height="150.0" rx="10" fill="#23272e" stroke="#000000" stroke-width="2"/>
<circle cx="309.0" cy="218.0" r="7.0" fill="#11141a" stroke="#555a63" stroke-width="1.5"/>
<text x="450.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#f2f2f2" text-anchor="middle" font-weight="bold" font-style="normal">ACME MCU32-A</text>
<text x="450.0" y="162.0" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#f2f2f2" text-anchor="middle" font-weight="bold" font-style="normal">F8 2438 K</text>
<text x="450.0" y="192.0" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#f2f2f2" text-anchor="middle" font-weight="bold" font-style="normal">L734QH2</text>
<text x="450.0" y="222.0" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#f2f2f2" text-anchor="middle" font-weight="bold" font-style="normal">rev C2</text>
<rect x="18.0" y="88.0" width="252.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="18.0" y="88.0" width="252.0" height="28.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="144.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Партномер (part number)</text>
<text x="30.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">що це за чіп: родина,</text>
<text x="30.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розрядність, варіант корпуса.</text>
<text x="30.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Дивимось у даташит саме за ним.</text>
<line x1="270.0" y1="136.0" x2="281.0" y2="127.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="630.0" y="88.0" width="252.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="630.0" y="88.0" width="252.0" height="28.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="756.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Дата-код (date code) F8 2438</text>
<text x="642.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">рік і робочий тиждень випуску:</text>
<text x="642.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">24 = 2024 рік, 38 = 38-й тиждень.</text>
<text x="642.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Це коли зроблено, не ревізія!</text>
<line x1="630.0" y1="136.0" x2="619.0" y2="157.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<rect x="18.0" y="300.0" width="252.0" height="96.0" rx="10" fill="#ffffff" stroke="#e08030" stroke-width="2.4"/>
<rect x="18.0" y="300.0" width="252.0" height="28.0" rx="0" fill="#e08030" stroke="#e08030" stroke-width="0"/>
<text x="144.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Код партії / місця (lot)</text>
<text x="30.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">якого заводу і прогону кристал;</text>
<text x="30.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за ним відстежують брак, але</text>
<text x="30.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">для роботи зазвичай не потрібен.</text>
<line x1="270.0" y1="348.0" x2="281.0" y2="187.0" stroke="#e08030" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="630.0" y="300.0" width="252.0" height="96.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<rect x="630.0" y="300.0" width="252.0" height="28.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="756.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Ревізія кристала (die rev / stepping)</text>
<text x="642.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">версія самого кремнію.</text>
<text x="642.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Саме до неї прив'язані errata —</text>
<text x="642.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перелік відомих хиб цього кристала.</text>
<line x1="630.0" y1="348.0" x2="619.0" y2="217.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="60.0" y="456.0" width="780.0" height="34.0" rx="8" fill="#fff7ef" stroke="#e08030" stroke-width="1.8"/>
<text x="450.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два рядки легко сплутати: дата-код каже КОЛИ зроблено, ревізія — ЯКА це версія кремнію. Errata тримаються ревізії.</text>
</svg>
