<text x="450.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зелена клітинка = сторона, що тут явно сильніша. Жодна колонка не виграє скрізь — вибір диктує конкретна задача.</text>
