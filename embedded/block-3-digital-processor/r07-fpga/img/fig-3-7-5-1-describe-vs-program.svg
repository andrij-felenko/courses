<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний злам у голові: HDL ОПИСУЄ схему, а не задає кроки</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">програма для процесора — це послідовність дій у часі; код HDL — це креслення залізяки, що існує цілком одразу</text>
<rect x="70.0" y="90.0" width="360.0" height="240.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="250.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПРОГРАМА (C для МК)</text>
<rect x="110.0" y="134.0" width="280.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="124.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">a = read();</text>
<line x1="250.0" y1="164.0" x2="250.0" y2="172.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<rect x="110.0" y="172.0" width="280.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="124.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">b = read();</text>
<line x1="250.0" y1="202.0" x2="250.0" y2="210.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<rect x="110.0" y="210.0" width="280.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="124.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">c = a + b;</text>
<line x1="250.0" y1="240.0" x2="250.0" y2="248.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<rect x="110.0" y="248.0" width="280.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="124.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">write(c);</text>
<text x="250.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">виконується ПО ЧЕРЗІ, рядок за рядком у часі</text>
<rect x="470.0" y="90.0" width="360.0" height="240.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="650.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОПИС ЗАЛІЗА (Verilog)</text>
<text x="650.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">assign c = a + b;</text>
<rect x="540.0" y="150.0" width="70.0" height="40.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="575.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">a</text>
<rect x="540.0" y="200.0" width="70.0" height="40.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="575.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">b</text>
<line x1="610.0" y1="170.0" x2="660.0" y2="188.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="610.0" y1="220.0" x2="660.0" y2="202.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<circle cx="688.0" cy="195.0" r="26.0" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="688.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="714.0" y1="195.0" x2="770.0" y2="195.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="760.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">c</text>
<text x="650.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">існує ЦІЛКОМ і ВОДНОЧАС — це фізичний суматор</text>
<text x="650.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(рядок не «виконується» — він описує дроти й вентилі)</text>
<rect x="60.0" y="348.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама на вигляд стрічка означає різне: у C це КРОК, який колись виконається; у Verilog це ОПИС постійно існуючого суматора.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">HDL (hardware description language) не програмують — ним КРЕСЛЯТЬ залізо. Усі рядки «працюють» одночасно, бо це й є схема.</text>
</svg>
