<line x1="390.0" y1="185.0" x2="470.0" y2="290.0" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
<rect x="470.0" y="270.0" width="150.0" height="40.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.7"/>
<text x="545.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">ШІМ-канали</text>
<text x="545.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">апаратні блоки: паралельно, наносекунди</text>
<text x="640.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">← кожен</text>
<text x="640.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">  робить своє</text>
<text x="640.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">  паралельно</text>
<rect x="60.0" y="366.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось навіщо softcore: рутину (меню, протоколи, конфігурацію) пише процесор, а «гарячі» потоки беруть на себе апаратні блоки.</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">М'яке ядро + власні прискорювачі на одній мікросхемі — це рішення для §3.7.8, коли потрібні і зручність коду, і швидкість заліза.</text>
</svg>
