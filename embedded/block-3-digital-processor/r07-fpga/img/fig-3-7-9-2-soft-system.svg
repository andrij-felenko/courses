<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сила softcore: процесор поряд із власною апаратною периферією</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у тій самій тканині — м'яке ядро для «повільної» логіки й окремі швидкі блоки для «гарячих» задач</text>
<rect x="80.0" y="86.0" width="740.0" height="250.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">усе це — одна FPGA</text>
<rect x="110.0" y="130.0" width="170.0" height="110.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.9"/>
<text x="195.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">м'яке ядро CPU</text>
<text x="195.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">веде меню, мережу,</text>
<text x="195.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">налаштування,</text>
<text x="195.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повільні рішення</text>
<line x1="280.0" y1="185.0" x2="360.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.5" stroke-linecap="round"/>
<text x="320.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">шина</text>
