<text x="545.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">DSP-фільтр</text>
<line x1="390.0" y1="185.0" x2="470.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
