<text x="420.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Перший байт»: як схема з комп'ютера доходить до світлодіода</text>
<rect x="25.6" y="70.0" width="178.0" height="150.0" rx="10" fill="#ffffff" stroke="#7a3ea8" stroke-width="2.4"/>
<rect x="25.6" y="70.0" width="178.0" height="30.0" rx="10" fill="#7a3ea8" stroke="#7a3ea8" stroke-width="0"/>
<text x="114.6" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1. На ПК</text>
<text x="114.6" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">набір інструментів</text>
<text x="114.6" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">робить bitstream</text>
<text x="114.6" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(HDL → схема,</text>
<text x="114.6" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">§3.7.5–§3.7.6)</text>
<rect x="229.2" y="70.0" width="178.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="229.2" y="70.0" width="178.0" height="30.0" rx="10" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="318.2" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2. USB-міст</text>
<text x="318.2" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">USB-кабель несе</text>
<text x="318.2" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">файл у плату</text>
<text x="318.2" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">через USB↔SPI</text>
<text x="318.2" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(чип-міст)</text>
<rect x="432.8" y="70.0" width="178.0" height="150.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2.4"/>
<rect x="432.8" y="70.0" width="178.0" height="30.0" rx="10" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="521.8" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3. У флеш</text>
<text x="521.8" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">bitstream лягає</text>
<text x="521.8" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у флеш: зовнішню</text>
<text x="521.8" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(iCE40) або</text>
<text x="521.8" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">внутрішню (Gowin)</text>
<rect x="636.4" y="70.0" width="178.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="636.4" y="70.0" width="178.0" height="30.0" rx="10" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="725.4" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4. FPGA встає</text>
<text x="725.4" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">при старті чип</text>
<text x="725.4" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вливає схему,</text>
<text x="725.4" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">піднімає DONE,</text>
<text x="725.4" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">виходи оживають</text>
<line x1="207.6" y1="145.0" x2="225.2" y2="145.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<line x1="411.2" y1="145.0" x2="428.8" y2="145.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<line x1="614.8" y1="145.0" x2="632.4" y2="145.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<line x1="50.0" y1="255.0" x2="790.0" y2="255.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="420.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки знати, що чип «заговорив»</text>
<rect x="70.0" y="295.0" width="340.0" height="92.0" rx="8" fill="#f4f7ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="240.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал DONE піднявся у «1»</text>
<text x="240.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= конфігурація завантажилась успішно.</text>
<text x="240.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Доти всі виходи мовчать — це норма,</text>
<text x="240.0" y="371.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а не «мертвий» чип (як у §3.7.1).</text>
<rect x="430.0" y="295.0" width="340.0" height="92.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Перша справжня перевірка — блимання</text>
<text x="600.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">світлодіода: найменша схема, що</text>
<text x="600.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ділить кварц лічильником (§3.3) і</text>
<text x="600.0" y="371.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вмикає LED. Видно — отже, все живе.</text>
</svg>
