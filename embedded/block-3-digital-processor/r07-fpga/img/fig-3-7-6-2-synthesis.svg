<rect x="60.0" y="338.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Синтез — найближче до звичної «компіляції»: текст HDL стає списком конкретних вентилів і тригерів та зв'язків між ними.</text>
<text x="450.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Він уже відкидає зайве й розпізнає, де комбінаційна логіка, а де регістр, — але ще не знає, у яку клітинку що покласти.</text>
