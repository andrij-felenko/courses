<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470">
<rect width="840" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aTeal" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a8a"/></marker>
</defs>
<text x="420.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві школи на платі хобіста: де живе схема після вимкнення</text>
<rect x="40.0" y="56.0" width="370.0" height="330.0" rx="12" fill="#fcfaf3" stroke="#caa24a" stroke-width="2.2"/>
<text x="225.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">iCE40-клас</text>
<text x="225.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">схема — у ЗОВНІШНІЙ флеші</text>
<rect x="100.0" y="136.0" width="130.0" height="90.0" rx="8" fill="#eef2ff" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="111.0" cy="147.0" r="4.5" fill="#fff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="165.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FPGA</text>
<text x="165.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">порожня при старті</text>
<rect x="260.0" y="146.0" width="110.0" height="64.0" rx="8" fill="#fff7ec" stroke="#caa24a" stroke-width="2"/>
<text x="315.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Флеш SPI</text>
<text x="315.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(окремий чип)</text>
<line x1="260.0" y1="178.0" x2="230.0" y2="181.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aAmber)"/>
<text x="245.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">при кожному</text>
<text x="245.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">вмиканні</text>
<text x="225.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">На платі — ДВА чипи поруч: FPGA + флеш.</text>
<text x="225.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Перші ~мс старту йде завантаження схеми;</text>
<text x="225.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">доти виходи мовчать, аж поки DONE → «1».</text>
<text x="225.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+ відкритий набір інструментів (§3.7.6),</text>
<text x="225.0" y="353.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">тому саме він став улюбленцем хобіста</text>
<text x="225.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(історію — у 📜 §10).</text>
<rect x="430.0" y="56.0" width="370.0" height="330.0" rx="12" fill="#f3f9f3" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="615.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Gowin-клас</text>
<text x="615.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">флеш — УСЕРЕДИНІ чипа</text>
<rect x="540.0" y="136.0" width="150.0" height="110.0" rx="10" fill="#eef7ee" stroke="#1b1b1b" stroke-width="2.4"/>
<circle cx="553.0" cy="149.0" r="5.5" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="615.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FPGA</text>
<rect x="564.0" y="188.0" width="102.0" height="40.0" rx="6" fill="#fff7ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="615.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">вбудована</text>
<text x="615.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">флеш (eFlash)</text>
<text x="615.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">На платі — ОДИН чип: флеш уже в ньому.</text>
<text x="615.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Вмикається фактично «миттєво» —</text>
<text x="615.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">схема піднімається з внутрішньої пам'яті.</text>
<text x="615.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Менше деталей, простіша плата;</text>
<text x="615.0" y="353.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інструменти — переважно фірмові</text>
<text x="615.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(той самий HDL — §3.7.5).</text>
<text x="420.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та сама ідея «схему вантажать при старті» (§3.7.1) — тільки в одного флеш зовні,</text>
<text x="420.0" y="459.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">а в іншого всередині. Звідси й різна кількість чипів на платі, і різне відчуття «миттєвості».</text>
</svg>
