<text x="250.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 тригер = 1 біт → з'їдає тисячі клітинок</text>
<text x="250.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(дорого, і логіки не лишається)</text>
<rect x="470.0" y="92.0" width="360.0" height="220.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
