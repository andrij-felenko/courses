<rect x="540.0" y="140.0" width="220.0" height="110.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">напр. 18–36 кбіт</text>
<text x="650.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">один компактний блок</text>
<text x="650.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">два порти: чит.+зап.</text>
<text x="650.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">одночасно й незалежно</text>
<line x1="520.0" y1="165.0" x2="538.0" y2="165.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="508.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="762.0" y1="225.0" x2="782.0" y2="225.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="792.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">B</text>
<text x="650.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">десятки–тисячі таких блоків розкидані стовпцями</text>
<rect x="60.0" y="348.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Робити пам'ять із тригерів логічних клітинок — розкіш: біт на клітинку. Тому FPGA має вбудовані блоки RAM (BRAM).</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це готові кілобіти з двома незалежними портами — ідеальні під буфери, черги (FIFO) й таблиці; логіку вони не з'їдають.</text>
</svg>
