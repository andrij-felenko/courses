<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540">
<rect width="920" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві колиски HDL: замовлення Пентагону й чип стартапу</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">майже одночасно, з протилежних світів — а вийшли двома половинами однієї ідеї</text>
<rect x="70.0" y="80.0" width="360.0" height="116.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="2.4"/>
<text x="250.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">VHDL</text>
<text x="250.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">мова на замовлення Пентагону</text>
<text x="90.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">програма VHSIC міністерства оборони США</text>
<text x="90.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">контракт ВПС 1983 р.: Intermetrics + TI + IBM</text>
<text x="90.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мета — ОПИСАТИ й документувати поведінку чипів</text>
<rect x="490.0" y="80.0" width="360.0" height="116.0" rx="10" fill="#fbeeec" stroke="#c0271e" stroke-width="2.4"/>
<text x="670.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Verilog</text>
<text x="670.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">мова стартапу</text>
<text x="510.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Gateway Design Automation, зима 1983/84</text>
<text x="510.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Філ Мурбі, Прабгу Ґоел, Чі-Лай Хуанг</text>
<text x="510.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мета — ПРОСИМУЛЮВАТИ схему, поки не спаяли</text>
<text x="250.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">• синтаксис — як в Ada (наказ DoD)</text>
<text x="670.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">• синтаксис — у дусі C</text>
<text x="250.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">• стандарт IEEE 1076 — 1987 р.</text>
<text x="670.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">• стандарт IEEE 1364 — 1995 р.</text>
<text x="250.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">• сувора, багатослівна, з типами</text>
<text x="670.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">• стисла, гнучка, ближча до коду</text>
<line x1="250.0" y1="320.0" x2="390.0" y2="444.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<line x1="670.0" y1="320.0" x2="530.0" y2="444.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="292.0" y="448.0" width="336.0" height="66.0" rx="10" fill="#eafaee" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="460.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОДНА ідея: описати залізо текстом,</text>
<text x="460.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а машина зі слів збере схему (синтез)</text>
</svg>
