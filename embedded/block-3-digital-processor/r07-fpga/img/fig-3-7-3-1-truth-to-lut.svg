<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Входи функції стають адресою в крихітну пам'ять; вихід — це біт, що там лежить. Логіка перетворилась на читання з пам'яті.</text>
