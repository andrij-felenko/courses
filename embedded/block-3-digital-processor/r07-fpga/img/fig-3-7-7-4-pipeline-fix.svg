<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як лікують довгий шлях: розрізати логіку регістрами (конвеєр)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вставимо тригер посередині — кожна половина коротша, такт можна підняти (ціною +1 такту затримки, §3.5.6)</text>
<text x="110.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">БУЛО: уся логіка між двома регістрами</text>
