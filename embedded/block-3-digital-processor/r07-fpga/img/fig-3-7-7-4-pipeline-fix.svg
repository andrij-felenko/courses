<polyline points="714.0,294.0 719.0,288.0 719.0,294.0" fill="none" stroke="#1f47b5" stroke-width="1.4"/>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">критичний шлях ≈ 6 нс → Fmax ≈ 166 МГц (удвічі вище!)</text>
<rect x="60.0" y="366.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конвеєризація — головний прийом таймінгу: розрізати довгий шлях регістром, і кожна частина стане коротшою, а Fmax — вищою.</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Платою є зайвий такт латентності (§3.5.6): результат з'являється на такт пізніше — але потік даних іде вдвічі швидше.</text>
