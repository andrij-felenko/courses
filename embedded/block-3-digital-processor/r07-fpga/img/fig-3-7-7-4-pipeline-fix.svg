<text x="110.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">СТАЛО: посередині додано регістр (конвеєрний щабель)</text>
