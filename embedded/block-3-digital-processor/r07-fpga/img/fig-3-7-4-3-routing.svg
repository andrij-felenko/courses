<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме перемикачі вирішують, який вихід куди йде. На великих чипах маршрутизація займає більше площі, ніж сама логіка.</text>
