<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки коштує LUT: біти ростуть як 2ⁿ, функції — як 2 у степені 2ⁿ</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен доданий вхід ПОДВОЮЄ кількість бітів пам'яті у LUT — тому реальні LUT мають лише 4–6 входів</text>
<text x="150.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">LUT</text>
<text x="330.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">бітів пам'яті</text>
<text x="560.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">скільки функцій уміщує</text>
<rect x="120.0" y="96.0" width="120.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.7"/>
<text x="180.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">LUT-2</text>
<rect x="260.0" y="96.0" width="150.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="335.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2² = 4</text>
<rect x="430.0" y="96.0" width="230.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="545.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁴ = 16</text>
<text x="690.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">дрібно</text>
<rect x="120.0" y="154.0" width="120.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="180.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">LUT-4</text>
<rect x="260.0" y="154.0" width="150.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="335.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁴ = 16</text>
<rect x="430.0" y="154.0" width="230.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="545.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2¹⁶ ≈ 65 тис.</text>
<text x="690.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">класика 1990-х</text>
<rect x="120.0" y="212.0" width="120.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="180.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">LUT-6</text>
<rect x="260.0" y="212.0" width="150.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="335.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁶ = 64</text>
<rect x="430.0" y="212.0" width="230.0" height="46.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="545.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁶⁴ ≈ 1.8·10¹⁹</text>
<text x="690.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">сучасні FPGA</text>
<rect x="120.0" y="270.0" width="120.0" height="46.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.7"/>
<text x="180.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">LUT-8</text>
<rect x="260.0" y="270.0" width="150.0" height="46.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.2"/>
<text x="335.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁸ = 256</text>
<rect x="430.0" y="270.0" width="230.0" height="46.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.2"/>
<text x="545.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2²⁵⁶ — астрономія</text>
<text x="690.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">надто дорого</text>
<rect x="60.0" y="360.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Більша LUT уміщує складнішу функцію без додаткових клітинок — але її пам'ять росте як 2ⁿ, тож вісім входів уже непідйомні.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Компроміс осів на 4–6 входах: достатньо, щоб ловити типові шматки логіки, і ще дешево. Деталі — у вставці 🧮 до §3.7.3.</text>
</svg>
