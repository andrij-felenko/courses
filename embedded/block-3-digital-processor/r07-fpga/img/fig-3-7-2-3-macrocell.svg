<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крок до пам'яті стану: макрокомірка з тригером на виході</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сама лиш матриця AND-OR дає тільки комбінаційну логіку; додамо тригер (§3.3.3) — і з'явиться стан</text>
<rect x="80.0" y="120.0" width="170.0" height="120.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="165.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">матриця</text>
<text x="165.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">AND-OR</text>
<text x="165.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(сума добутків)</text>
<text x="165.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">комбінаційна F</text>
<line x1="250.0" y1="180.0" x2="330.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="330.0" y="158.0" width="50.0" height="48.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="355.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">DFF</text>
<polyline points="334.0,200.0 339.0,194.0 339.0,200.0" fill="none" stroke="#1f47b5" stroke-width="1.4"/>
<text x="355.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<line x1="380.0" y1="180.0" x2="470.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<path d="M470,150 L510,162 L510,198 L470,210 Z" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="490.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">MUX</text>
<text x="490.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рег. чи комб.?</text>
<line x1="510.0" y1="180.0" x2="600.0" y2="180.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<text x="640.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихідний пін</text>
<polyline points="355.0,206.0 355.0,280.0 60.0,280.0 60.0,165.0 78.0,165.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="210.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зворотний зв'язок: вихід тригера повертається у матрицю → можна будувати автомати (§3.3.9)</text>
<rect x="60.0" y="322.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Макрокомірка = матриця AND-OR + тригер + мультиплексор вибору «реєстровий чи комбінаційний вихід».</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це той самий тригер із Розділу 3.3, тільки тепер його кладуть біля кожного виходу — так з'являється послідовнісна логіка.</text>
</svg>
