<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сходинки еволюції: від однієї матриці до мільйонів клітинок</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок додавав ємності й гнучкості, не змінюючи головної ідеї — «логіка, яку задають після випуску чипа»</text>
<rect x="120.0" y="360.0" width="360.0" height="50.0" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="134.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">PROM/PAL</text>
<text x="134.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">1970-ті</text>
<text x="216.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одна матриця AND-OR; десятки вентилів; пропалюється один раз</text>
<line x1="140.0" y1="360.0" x2="140.0" y2="346.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="120.0" y="296.0" width="300.0" height="50.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="134.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">GAL</text>
<text x="134.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">1980-ті</text>
<text x="216.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">те саме, але СТИРАЄТЬСЯ (EEPROM) — можна переписати</text>
<line x1="140.0" y1="296.0" x2="140.0" y2="282.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="120.0" y="232.0" width="240.0" height="50.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="134.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">CPLD</text>
<text x="134.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">кін. 1980-х</text>
<text x="216.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">багато PAL-блоків + матриця; сотні–тисячі вентилів; нелеткий</text>
<line x1="140.0" y1="232.0" x2="140.0" y2="218.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="120.0" y="168.0" width="180.0" height="50.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="134.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">FPGA</text>
<text x="134.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">1985 →</text>
<text x="216.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сітка LUT-клітинок + маршрутизація + RAM/DSP; до мільйонів LUT</text>
<text x="100.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">більше ємності й гнучкості ↑</text>
<rect x="60.0" y="392.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наскрізна ідея незмінна від 1970-х: чип, чию логіку задають ПІСЛЯ виготовлення. Змінювалися лише ємність і зручність.</text>
<text x="450.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">PAL і GAL досі живі для дрібної «клейової» логіки; CPLD — для невеликого керування; FPGA — коли треба багато й паралельно.</text>
</svg>
