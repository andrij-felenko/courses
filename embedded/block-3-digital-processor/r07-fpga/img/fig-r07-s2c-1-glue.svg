<text x="400.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Клейова логіка: дрібний конфігурований чип у проміжку між великими</text>
