<circle cx="72.0" cy="162.0" r="5.0" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="135.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">МК</text>
<text x="135.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(зайнятий, ніжок мало)</text>
<rect x="590.0" y="90.0" width="150.0" height="95.0" rx="8" fill="#f3f3ff" stroke="#1f47b5" stroke-width="2"/>
<circle cx="602.0" cy="102.0" r="5.0" fill="#fff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="665.0" y="135.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Давач</text>
<text x="665.0" y="153.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">віддає імпульси</text>
<rect x="590.0" y="270.0" width="150.0" height="95.0" rx="8" fill="#fff3f3" stroke="#c0271e" stroke-width="2"/>
<circle cx="602.0" cy="282.0" r="5.0" fill="#fff" stroke="#c0271e" stroke-width="1.4"/>
<text x="665.0" y="315.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Драйвер</text>
<text x="665.0" y="333.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">хоче ENABLE+скид</text>
<rect x="350.0" y="175.0" width="110.0" height="110.0" rx="10" fill="#fffdf2" stroke="#caa24a" stroke-width="2.4"/>
<circle cx="361.0" cy="186.0" r="4.5" fill="#fff" stroke="#caa24a" stroke-width="1.4"/>
<text x="405.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">CMIC</text>
<text x="405.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">GreenPAK-</text>
<text x="405.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">клас</text>
<text x="405.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дрібнота-«клей»</text>
<text x="405.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="italic">1 крихітний корпус замість жмені деталей</text>
<line x1="210.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="280.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">1 пін</text>
<line x1="460.0" y1="205.0" x2="590.0" y2="150.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<line x1="460.0" y1="250.0" x2="590.0" y2="305.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="490.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">лічить/ділить</text>
<text x="490.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">генерує ENABLE,</text>
<text x="490.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">скид, затримку</text>
<text x="400.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Усередині — той самий матеріал розділу: кілька LUT (§3.7.3), тригерів (§3.3),</text>
<text x="400.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лічильник-затримка, компаратор. Дрібні «склейки» між чипами, яких бракувало.</text>
<text x="400.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Роль із §3.7.2 — та сама, що колись у PAL/GAL: підігнати один чип до іншого.</text>
<text x="400.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">Лише тепер «клей» крихітний, дешевий і вміє ще й аналог.</text>
</svg>
