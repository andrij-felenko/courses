<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Мультиплексор обирає, віддати комбінаційний результат чи його зафіксовану тактом копію. З таких клітинок складено всю FPGA.</text>
