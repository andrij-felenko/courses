<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
<rect width="900" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Троє засновників — три РІЗНІ ролі (а не «один геній»)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">винахід, гроші-управління й виробнича модель — окремі внески; компанію зробила саме їхня СПІЛКА</text>
<rect x="23.0" y="84.0" width="270.0" height="286.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.2"/>
<circle cx="158.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<path d="M140.0,154 Q158.0,134 176.0,154" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<text x="158.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Росс Фріман</text>
<text x="158.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ross Freeman</text>
<rect x="96.0" y="226.0" width="124.0" height="26.0" rx="13" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="158.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ВИНАХІД</text>
<text x="41.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Придумав саму FPGA: чип, у який</text>
<text x="41.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">схему ЗАВАНТАЖУЮТЬ. Фізик,</text>
<text x="41.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мрійник; ставив на дешевшання</text>
<text x="41.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">транзисторів</text>
<rect x="315.0" y="84.0" width="270.0" height="286.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<circle cx="450.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<path d="M432.0,154 Q450.0,134 468.0,154" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джеймс Барнетт</text>
<text x="450.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">James V. Barnett II</text>
<rect x="388.0" y="226.0" width="124.0" height="26.0" rx="13" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="450.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">УПРАВЛІННЯ</text>
<text x="333.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Інженер-управлінець; підняв</text>
<text x="333.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">компанію з нуля — перший</text>
<text x="333.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">очільник, гроші, команда,</text>
<text x="333.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">продукт (перевірити)</text>
<rect x="607.0" y="84.0" width="270.0" height="286.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="742.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<path d="M724.0,154 Q742.0,134 760.0,154" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="742.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Берні Вондершмітт</text>
<text x="742.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Bernard Vonderschmitt</text>
<rect x="680.0" y="226.0" width="124.0" height="26.0" rx="13" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="742.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">МОДЕЛЬ</text>
<text x="625.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">34 роки в RCA; збудував</text>
<text x="625.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«фаблес»-модель — чип без</text>
<text x="625.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">власного заводу — і знайшов</text>
<text x="625.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">фабрику-партнера</text>
<text x="450.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Придумати» ≠ «підняти компанію» ≠ «зробити так, щоб це взагалі можна було випускати». Усі три ролі — потрібні.</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усі троє прийшли з Zilog; FPGA винайшов Фріман, але БЕЗ решти двох винахід так і лишився б ідеєю в шухляді.</text>
</svg>
