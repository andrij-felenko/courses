  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Місце FPGA у світі обчислень: гнучкість проти швидкості</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від «усе вирішує програма» до «усе зашито в кремній» — FPGA посередині</text>
<line x1="90.0" y1="150.0" x2="810.0" y2="150.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="90.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<circle cx="150.0" cy="150.0" r="8.0" fill="#fff" stroke="#1f47b5" stroke-width="3"/>
<rect x="80.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="150.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Процесор / МК</text>
<text x="150.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">будь-яка програма,</text>
<text x="150.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">але послідовно</text>
<text x="150.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">гнучкий, повільніший</text>
<circle cx="380.0" cy="150.0" r="8.0" fill="#fff" stroke="#caa24a" stroke-width="3"/>
<rect x="310.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="380.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">GPU</text>
<text x="380.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тисячі ядер,</text>
<text x="380.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дані-паралельно</text>
<circle cx="560.0" cy="150.0" r="8.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<rect x="490.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="560.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FPGA</text>
<text x="560.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">своя СХЕМА під</text>
<text x="560.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">задачу, паралельно</text>
<text x="560.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">← наш герой</text>
<circle cx="770.0" cy="150.0" r="8.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<rect x="700.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="770.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ASIC</text>
<text x="770.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">схема назавжди</text>
<text x="770.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">випалена в чип</text>
<text x="770.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найшвидший, негнучкий</text>
<line x1="110.0" y1="220.0" x2="250.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="180.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">більше ГНУЧКОСТІ</text>
<line x1="790.0" y1="220.0" x2="650.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="720.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">більше ШВИДКОСТІ й ефективності</text>
<rect x="60.0" y="318.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Процесор гнучкий, бо програмований, але послідовний; ASIC — найшвидший, та схема в ньому застигла назавжди.</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">FPGA бере найкраще від обох: справжню паралельну СХЕМУ під задачу, яку до того ж можна переписати.</text>
