<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться конфігурація: летка тканина + зовнішня флеш-пам'ять</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більшість FPGA забуває схему при вимкненні (SRAM), тож бітстрім вантажиться з флеші при кожному старті</text>
<rect x="90.0" y="130.0" width="180.0" height="90.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.9"/>
<text x="180.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">флеш-пам'ять</text>
<text x="180.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(нелетка)</text>
<text x="180.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тримає бітстрім</text>
<line x1="270.0" y1="175.0" x2="380.0" y2="175.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aAmber)"/>
<text x="325.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">при ввімкненні</text>
<text x="325.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(configuration)</text>
<rect x="380.0" y="110.0" width="220.0" height="130.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.9"/>
<text x="490.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">FPGA</text>
<text x="490.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тканина на SRAM</text>
<text x="490.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЛЕТКА — порожня</text>
<text x="490.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">після вимкнення</text>
<text x="490.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">вантажить себе з флеші</text>
<line x1="600.0" y1="175.0" x2="700.0" y2="175.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="760.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">схема готова</text>
<text x="760.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">за частки секунди</text>
<rect x="60.0" y="326.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Більшість FPGA побудована на SRAM: гнучко й безкінечно перезаписувано, але ЛЕТКО — схема зникає без живлення (§3.6.3).</text>
<text x="450.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому поряд кладуть малу флеш із бітстрімом, і чип «завантажує себе» при кожному ввімкненні. Окремий клас FPGA має флеш усередині.</text>
</svg>
