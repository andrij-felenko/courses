<svg xmlns="http://www.w3.org/2000/svg" width="900" height="446" viewBox="0 0 900 446">
<rect width="900" height="446" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Друге дітище Xilinx: «фаблес» — фірма, що проєктує чипи, але НЕ має заводу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у Вондершмітта не було грошей на фабрику — тож він винайшов модель, за якою кремній ллє ЧУЖИЙ завод на замовлення</text>
<rect x="60.0" y="96.0" width="250.0" height="250.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="185.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Xilinx (fabless)</text>
<text x="185.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тільки ПРОЄКТУЄ</text>
<text x="82.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• архітектура FPGA</text>
<text x="82.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• схема й логіка</text>
<text x="82.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ПЗ-компілятор схем</text>
<text x="82.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• продаж і підтримка</text>
<text x="185.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ані чистих кімнат,</text>
<text x="185.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ані печей, ані $$$ на завод</text>
<line x1="312.0" y1="178.0" x2="588.0" y2="178.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="450.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">креслення кристала (GDSII)</text>
<line x1="588.0" y1="250.0" x2="312.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">готові пластини з чипами</text>
<text x="450.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">↔</text>
<rect x="590.0" y="96.0" width="250.0" height="250.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="715.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Чужа фабрика</text>
<text x="715.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(партнер — напр. Seiko)</text>
<rect x="645.0" y="168.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<rect x="660.0" y="184.0" width="18.0" height="48.0" rx="3" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="690.0" y="184.0" width="18.0" height="48.0" rx="3" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="720.0" y="184.0" width="18.0" height="48.0" rx="3" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="750.0" y="184.0" width="18.0" height="48.0" rx="3" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="715.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ллє КРЕМНІЙ на замовлення,</text>
<text x="715.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дозавантажує свій дорогий завод</text>
<text x="715.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">(вигідно ОБОМ сторонам)</text>
<rect x="60.0" y="366.0" width="780.0" height="64.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Я не мав грошей побудувати фабрику» — Вондершмітт. Він домовився з давнім знайомим у Seiko, бо ЧУЖА фабрика так</text>
<text x="450.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лише виграє: завод не простоює. Цю модель «проєктуємо тут — виробляють там» сьогодні наслідує пів галузі (деталі — §3.10.8).</text>
</svg>
