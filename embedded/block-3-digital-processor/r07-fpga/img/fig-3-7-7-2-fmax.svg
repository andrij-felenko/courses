<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
<rect width="900" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від критичного шляху — до максимальної частоти Fmax</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">період такту не може бути коротшим за критичний шлях; звідси стеля частоти дизайну</text>
<rect x="120.0" y="100.0" width="660.0" height="70.0" rx="10" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="450.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T_такт  ≥  t_cq + t_logic + t_setup   =   критичний шлях</text>
<text x="450.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(інакше приймач не встигне зафіксувати правильне значення → метастабільність, §3.3.8)</text>
<line x1="450.0" y1="178.0" x2="450.0" y2="206.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="250.0" y="210.0" width="400.0" height="56.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Fmax = 1 / критичний шлях</text>
<rect x="120.0" y="286.0" width="660.0" height="56.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: критичний шлях 8 нс  →  Fmax = 1 / 8нс = 125 МГц.</text>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Скоротити шлях (менше логіки між регістрами) → вища Fmax. Подовжити → нижча.</text>
</svg>
