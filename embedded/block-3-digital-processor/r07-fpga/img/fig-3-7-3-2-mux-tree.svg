<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Входи a,b обирають шлях крізь дерево до ОДНОГО біта — змінив зміст SRAM і та сама схема рахує вже іншу функцію.</text>
