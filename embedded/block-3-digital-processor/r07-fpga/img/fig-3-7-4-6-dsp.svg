<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DSP-блоки: апаратні множники-суматори для важкої арифметики</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">множення на LUT громіздке; тому в чип вбудовано готові блоки «помножити й додати» (MAC)</text>
<rect x="280.0" y="100.0" width="340.0" height="150.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="450.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">DSP-блок (MAC)</text>
<circle cx="370.0" cy="175.0" r="26.0" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="370.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<line x1="296.0" y1="160.0" x2="344.0" y2="168.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="286.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="296.0" y1="196.0" x2="344.0" y2="184.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="286.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">B</text>
<line x1="396.0" y1="175.0" x2="444.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<circle cx="470.0" cy="175.0" r="24.0" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="470.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="470.0" y1="232.0" x2="470.0" y2="200.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="470.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">акумулятор</text>
<line x1="494.0" y1="175.0" x2="600.0" y2="175.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="640.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A×B + сума</text>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">усе це — один такт, у спеціальному блоці, а не на десятках LUT</text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сотні–тисячі DSP-блоків працюють паралельно — звідси сила FPGA у фільтрах і нейромережах</text>
<rect x="60.0" y="348.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Множення-з-накопиченням (A×B+сума) — серце обробки сигналу; складати його з LUT і дорого, і повільно.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому FPGA несе сотні готових DSP-блоків. BRAM і DSP — це «спеціалізовані острови», вкраплені в однорідну логіку.</text>
</svg>
