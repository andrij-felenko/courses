<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
<rect width="760" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як читати позначення: SN 74 HCT 04 N</text>
<text x="380.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне ім'я несе чотири різні відповіді</text>
<rect x="150.0" y="78.0" width="72.0" height="46.0" rx="6" fill="#f4ecd4" stroke="#8a8a8a" stroke-width="2.4"/>
<text x="186.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">SN</text>
<rect x="230.0" y="78.0" width="64.0" height="46.0" rx="6" fill="#dfe6f6" stroke="#1f47b5" stroke-width="2.4"/>
<text x="262.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">74</text>
<rect x="302.0" y="78.0" width="96.0" height="46.0" rx="6" fill="#f6dcd9" stroke="#c0271e" stroke-width="2.4"/>
<text x="350.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">HCT</text>
<rect x="406.0" y="78.0" width="64.0" height="46.0" rx="6" fill="#dcefe0" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="438.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">04</text>
<rect x="478.0" y="78.0" width="54.0" height="46.0" rx="6" fill="#e4e4e4" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="505.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<rect x="20.0" y="168.0" width="222.0" height="78.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="30.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Префікс виробника</text>
<text x="30.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SN — Texas Instruments, CD — колишній RCA,</text>
<text x="30.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">MC — Motorola/onsemi. Те саме «тіло» —</text>
<text x="30.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">різні літери. Для логіки несуттєвий.</text>
<line x1="186.0" y1="124.0" x2="186.0" y2="132.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="186.0" y1="132.0" x2="131.0" y2="166.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aGrey)"/>
<rect x="269.0" y="168.0" width="222.0" height="78.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="279.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Температурна серія</text>
<text x="279.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">74 — комерційна, 0…+70 °C (наш випадок).</text>
<text x="279.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">54 — військова, −55…+125 °C, той самий</text>
<text x="279.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кристал у суворішому корпусі та відборі.</text>
<line x1="262.0" y1="124.0" x2="262.0" y2="132.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<line x1="262.0" y1="132.0" x2="380.0" y2="166.0" stroke="#1f47b5" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aBlue)"/>
<rect x="518.0" y="168.0" width="222.0" height="78.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="528.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Логічне сімейство  ←  головне</text>
<text x="528.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Задає рівні, швидкість, живлення:</text>
<text x="528.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">HC — CMOS 2–6 В; HCT — HC із TTL-входом;</text>
<text x="528.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">LVC — швидке CMOS 1.65–3.6 В, вхід до 5 В.</text>
<line x1="350.0" y1="124.0" x2="350.0" y2="132.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<line x1="350.0" y1="132.0" x2="629.0" y2="166.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aRed)"/>
<rect x="20.0" y="268.0" width="222.0" height="78.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="30.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Код функції</text>
<text x="30.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Що всередині: 04 — шість інверторів,</text>
<text x="30.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">00 — чотири 2-вх. І-НЕ, 595 — зсувний</text>
<text x="30.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">регістр. Код однаковий у всіх сімействах.</text>
<rect x="269.0" y="268.0" width="222.0" height="78.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="279.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Суфікс корпусу</text>
<text x="279.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">N — DIP (під пайку в плату/панельку),</text>
<text x="279.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">D — SO, PW — TSSOP (дрібні, під SMD).</text>
<text x="279.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Лише форма; логіка та сама.</text>
<rect x="20.0" y="396.0" width="720.0" height="26.0" rx="6" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="380.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: код функції (04) однаковий скрізь — змінюй літери сімейства, щоб обрати рівні й швидкість, не змінюючи логіку.</text>
</svg>
