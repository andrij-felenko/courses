<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392">
<rect width="880" height="392" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільний корінь: доступ ПОЗА межами або в НЕ ТОЙ ЧАС</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">попри розмаїття, майже всі біди пам'яті зводяться до двох помилок — і обидві з понять цього розділу</text>
<rect x="80.0" y="92.0" width="340.0" height="150.0" rx="12" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Доступ ПОЗА дійсною пам'яттю</text>
<text x="100.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• за межі масиву (буфер)</text>
<text x="100.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• за нульовою/випадковою адресою</text>
<text x="100.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• стек дороста до купи</text>
<text x="100.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="italic" font-style="normal">корінь: плутанина «адреса/значення»</text>
<text x="100.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="italic" font-style="normal">та брак перевірки меж (§19.1)</text>
<rect x="460.0" y="92.0" width="340.0" height="150.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="630.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Вживання в НЕ ТОЙ ЧАС</text>
<text x="480.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• до ініціалізації (сміття)</text>
<text x="480.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• після звільнення (висячий)</text>
<text x="480.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• після виходу функції (локальна)</text>
<text x="480.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="italic" font-style="normal">корінь: брак дисципліни покажчиків</text>
<text x="480.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="italic" font-style="normal">та керування часом життя (§19.4)</text>
<rect x="60.0" y="264.0" width="760.0" height="114.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й уся профілактика: не виходь за межі виділеного й не чіпай пам'ять не у свій час (до ініціалізації / після звільнення).</text>
<text x="440.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві наскрізні ідеї розділу тримають усе: чітка різниця «адреса/значення» (§19.1) і дисципліна покажчиків (§19.4).</text>
<text x="440.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому пам'ять — і найпотужніше, і найнебезпечніше в системному коді: машина робить РІВНО що сказано, навіть коли це сказано хибно.</text>
<text x="440.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(згадайте §18.1: процесор дурний і слухняний — він залюбки перепише адресу повернення, якщо ви йому це звеліли)</text>
</svg>
