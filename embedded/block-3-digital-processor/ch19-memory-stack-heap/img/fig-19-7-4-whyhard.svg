<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому біди пам'яті — найважчі: тихі, далекі, несталі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вони не кричать про себе — псують щось нишком, і симптом виринає геть не там і не тоді, де причина</text>
<rect x="70.0" y="90.0" width="760.0" height="46.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.7"/>
<text x="92.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ТИХІ</text>
<text x="230.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не дають негайної помилки — псують пам'ять і виконуються далі, ніби все гаразд</text>
<rect x="70.0" y="146.0" width="760.0" height="46.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.7"/>
<text x="92.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">ДАЛЕКІ</text>
<text x="230.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">симптом виринає не там, де причина: зіпсував одне — впало зовсім інше, згодом</text>
<rect x="70.0" y="202.0" width="760.0" height="46.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.7"/>
<text x="92.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">НЕСТАЛІ</text>
<text x="230.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">залежать від таймінгу й даних: то є, то нема — важко відтворити й спіймати</text>
<rect x="70.0" y="270.0" width="380.0" height="110.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="260.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">На мікроконтролері — гірше</text>
<text x="90.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">немає захисту пам'яті:</text>
<text x="90.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніхто не ловить хибний доступ —</text>
<text x="90.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">програма просто «дуріє»</text>
<text x="90.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(а перезапустити в полі нема кому)</text>
<rect x="470.0" y="270.0" width="380.0" height="110.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="660.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">На ПК — трохи легше</text>
<text x="490.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">апаратний захист (MMU) + ОС</text>
<text x="490.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ловлять багато звернень «не туди»</text>
<text x="490.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ програма падає одразу (segfault),</text>
<text x="490.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ближче до місця помилки</text>
</svg>
