<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пам'ять-відображений ввід-вивід: керувати залізом — як писати в пам'ять</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">деякі адреси — це не комірки RAM, а РЕГІСТРИ периферії; запис у них керує залізом тими самими LD/ST (§18.8)</text>
<rect x="70.0" y="130.0" width="170.0" height="90.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="155.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<text x="155.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ST 1 → 0x4001_0004</text>
<line x1="242.0" y1="175.0" x2="360.0" y2="175.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="301.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">та сама команда</text>
<text x="301.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ЗАПИСУ, що й у RAM</text>
<rect x="360.0" y="130.0" width="220.0" height="90.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">регістр GPIO</text>
<text x="470.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">за адресою 0x4001_0004</text>
<text x="470.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(це не пам'ять — це залізо!)</text>
<line x1="582.0" y1="175.0" x2="680.0" y2="175.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<circle cx="740.0" cy="175.0" r="26.0" fill="#fff6c0" stroke="#caa24a" stroke-width="2"/>
<text x="740.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">💡</text>
<text x="740.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">світлодіод засвітився</text>
<rect x="60.0" y="252.0" width="780.0" height="100.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Геніальна простота: периферію «підвісили» на адреси, тож процесору не треба ОКРЕМИХ команд вводу-виводу —</text>
<text x="450.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">він керує залізом тими самими читанням і записом (§18.8), що й пам'яттю. Записав у потрібну адресу — увімкнув пристрій.</text>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось чому в коді для МК ви «пишете в регістр», щоб засвітити ніжку чи запустити таймер. Детально — у Розділі 20 (§20.3).</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому й карта пам'яті МК містить діапазон периферії: ті адреси ведуть не до RAM, а до органів керування чипом.</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Обережно: помилкова адреса може випадково «торкнутися» периферії — ще одна причина тримати карту пам'яті в голові.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(і причина, чому деякі змінні позначають volatile — щоб компілятор не «оптимізував» доступ до залізних регістрів; це Розділ 23)</text>
</svg>
