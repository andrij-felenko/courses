<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що ВСЕРЕДИНІ комірки: три способи зберегти один біт</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">§19.3 казало, ЯК поводяться SRAM/DRAM/Flash; тепер — З ЧОГО зроблена кожна комірка і ЧОМУ звідси її характер</text>
<rect x="60.0" y="90.0" width="260.0" height="300.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="190.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SRAM</text>
<text x="190.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">6 транзисторів</text>
<line x1="80.0" y1="156.0" x2="300.0" y2="156.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="190.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">біт тримає петля з двох</text>
<text x="190.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інверторів — той самий тригер</text>
<text x="190.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(§16), лише в кремнії</text>
<text x="190.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">летка · найшвидша · найбільша</text>
<text x="190.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">комірка</text>
<rect x="330.0" y="90.0" width="260.0" height="300.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="460.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">DRAM</text>
<text x="460.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 транзистор + 1 конденсатор</text>
<line x1="350.0" y1="156.0" x2="570.0" y2="156.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="460.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">біт — це заряд на крихітному</text>
<text x="460.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">конденсаторі; заряд стікає,</text>
<text x="460.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тож біт треба освіжати</text>
<text x="460.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">летка · щільна · дешева ·</text>
<text x="460.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">«тече»</text>
<rect x="600.0" y="90.0" width="260.0" height="300.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="730.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Flash</text>
<text x="730.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 транзистор з ПЛАВУЧИМ затвором</text>
<line x1="620.0" y1="156.0" x2="840.0" y2="156.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="730.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">біт — заряд, замкнений в</text>
<text x="730.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ізольованому затворі;</text>
<text x="730.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримається роками без живлення</text>
<text x="730.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">НЕлетка · запис повільний, зі</text>
<text x="730.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">зносом</text>
<text x="450.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе зводиться до двох ідей: тримати біт ЖИВИМ струмом (петля — SRAM, заряд-що-стікає — DRAM) або ЗАМКНУТИ його фізично (плавучий затвор — Flash).</text>
<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перші дві леткі (без живлення забувають), третя нелетка. Розберімо кожну зсередини — і побачимо, звідки беруться всі їхні звички з §19.3.</text>
</svg>
