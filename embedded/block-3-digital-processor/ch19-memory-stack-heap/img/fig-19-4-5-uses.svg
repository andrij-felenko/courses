<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо покажчики: чотири головні застосування</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">непрямість дає те, чого інакше не зробити: дешево ділитися даними, міняти чуже, обходити пам'ять, будувати структури</text>
<rect x="70.0" y="90.0" width="760.0" height="68.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.7"/>
<text x="92.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Передати без копіювання</text>
<text x="360.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">велику таблицю чи структуру передають за АДРЕСОЮ (4 байти),</text>
<text x="360.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а не копіюють цілком — швидко й економно</text>
<rect x="70.0" y="170.0" width="760.0" height="68.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="92.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Змінити чужу змінну</text>
<text x="360.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">функція, діставши адресу вашої змінної, може ЗАПИСАТИ в неї</text>
<text x="360.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(через *p) — так повертають результат «назовні»</text>
<rect x="70.0" y="250.0" width="760.0" height="68.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.7"/>
<text x="92.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Пройти масив/пам'ять</text>
<text x="360.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">покажчик, що збільшується (p+1, p+2…), КРОКУЄ по сусідніх</text>
<text x="360.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">комірках (§19.1) — природний спосіб обходу</text>
<rect x="70.0" y="330.0" width="760.0" height="68.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.7"/>
<text x="92.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Зв'язані структури</text>
<text x="360.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">комірка тримає адресу наступної → списки, дерева, графи;</text>
<text x="360.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вузли «вказують» один на одного — гнучкі форми</text>
<text x="450.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе це — наслідки однієї ідеї: тримати не саме значення, а ВКАЗІВКУ на нього. Тому покажчики всюди в системному коді.</text>
</svg>
