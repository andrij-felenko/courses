<text x="150.0" y="540.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ціна — внутрішня фрагментація (дрібний запит у великій комірці), зате час сталий і поведінка передбачувана.</text>
<line x1="60.0" y1="588.0" x2="880.0" y2="588.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="470.0" y="610.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Проблема не «free() поганий», а НЕДЕТЕРМІНІЗМ: змінний час і фрагментація, що росте. Прибери free() з робочого циклу — позбудешся обох бід.</text>
