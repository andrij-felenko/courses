<text x="670.0" y="411.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• best-fit — найтісніший (менше марнує)</text>
