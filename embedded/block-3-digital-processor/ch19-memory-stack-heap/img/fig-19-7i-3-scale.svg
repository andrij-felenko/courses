<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інтернету в сьогоднішньому розумінні ще не було; йшлося про ~60 тисяч хостів дослідницької мережі</text>
<text x="70.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Скільки заразилось (оцінка за ~добу):</text>
