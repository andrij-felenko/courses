<text x="70.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">кожна клітинка ≈ 600 хостів · червоні ≈ ~6 000 із ~60 000</text>
<rect x="70.0" y="231.0" width="360.0" height="56.0" rx="8" fill="#fff8e6" stroke="#caa24a" stroke-width="1.5"/>
<text x="82.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Навіть «10%» — це здогад, а не вимір:</text>
<text x="82.0" y="269.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">хтось припустив ~60 тис. хостів і ~10% уражених. (перевірити)</text>
<text x="500.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чому машини «лягали», хоч хробак</text>
<text x="500.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">нічого не стирав і не псував:</text>
<rect x="500.0" y="126.0" width="350.0" height="150.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="516.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Помилка в самому хроб'якові:</text>
<text x="516.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перш ніж заразити машину, він питав —</text>
<text x="516.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«я тут уже є?». Але щоб його не обманули</text>
<text x="516.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">фальшивим «так», він однаково ставив</text>
<text x="516.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ще одну копію 1 раз із 7.</text>
<text x="516.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.7" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Копії множились на одній машині лавиною.</text>
<rect x="500.0" y="288.0" width="350.0" height="96.0" rx="9" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="516.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Наслідок — не «знищення», а вичерпання:</text>
<text x="516.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">процесор і пам'ять з'їдали десятки копій,</text>
<text x="516.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">машина переставала відповідати (DoS).</text>
<text x="516.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Дані цілі — але працювати неможливо.</text>
<rect x="60.0" y="452.0" width="800.0" height="36.0" rx="8" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="460.0" y="475.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Точніше: хробак не «вимкнув» мережу, а перевантажив тисячі машин до повного гальмування за лічені години.</text>
</svg>
