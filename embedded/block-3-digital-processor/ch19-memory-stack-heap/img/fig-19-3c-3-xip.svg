<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
<rect width="900" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">XIP: код «живе» у флеші, а виконується наче з RAM — завдяки кешу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">контролер сам підкачує шматки коду з повільної флеші у швидкий кеш; ядро бачить суцільний адресний простір</text>
<rect x="130.0" y="150.0" width="150.0" height="90.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="2"/>
<text x="205.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ядро CPU</text>
<text x="205.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">просить байт коду</text>
<text x="205.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">за його адресою</text>
<rect x="380.0" y="150.0" width="150.0" height="90.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="455.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кеш</text>
<text x="455.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">швидкий, малий</text>
<text x="455.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">копія гарячого коду</text>
<rect x="640.0" y="150.0" width="180.0" height="90.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="730.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SPI-NOR-флеш</text>
<text x="730.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">уся прошивка</text>
<text x="730.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повільна, але містка</text>
<line x1="280.0" y1="180.0" x2="380.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="330.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">адреса</text>
<line x1="380.0" y1="208.0" x2="280.0" y2="208.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="330.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">є в кеші → миттєво</text>
<line x1="530.0" y1="180.0" x2="640.0" y2="180.0" stroke="#caa24a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aInk)"/>
<text x="585.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">промах →</text>
<text x="585.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">читай блок</text>
<line x1="640.0" y1="208.0" x2="530.0" y2="208.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aRed)"/>
<text x="585.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">блок коду по SPI</text>
<rect x="60.0" y="286.0" width="780.0" height="70.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="1.6"/>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Execute-In-Place (XIP): процесор виконує код прямо «на місці» — не копіюючи всю програму в RAM наперед.</text>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Потрібен байт — кеш або вже має його (миттєво), або підкачує блок із флеші по SPI (рідше, повільніше) і віддає ядру.</text>
<text x="450.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="60.0" y="366.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому саме NOR-флеш дозволяє таке читання «байт за адресою», а NAND — ні, і як влаштований XIP усередині —</text>
<text x="450.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">це тема §3.8.5. Тут досить картини: код лишається у флеші, а кеш робить його швидким на вигляд.</text>
</svg>
