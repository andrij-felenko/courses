<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Родина пам'ятей: хто летка, хто ні, і де яку вживають</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">видів пам'яті багато, та для мікроконтролера головні дві — Flash (програма) і SRAM (змінні)</text>
<rect x="60.0" y="82.0" width="110.0" height="28.0" rx="6" fill="#eef0f4" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="115.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тип</text>
<text x="280.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">летка?</text>
<text x="470.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">особливості</text>
<text x="740.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">де вживають</text>
<rect x="60.0" y="116.0" width="110.0" height="44.0" rx="6" fill="#fafafa" stroke="#1f47b5" stroke-width="1.5"/>
<text x="115.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SRAM</text>
<rect x="180.0" y="116.0" width="150.0" height="44.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.3"/>
<text x="255.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">летка</text>
<rect x="340.0" y="116.0" width="300.0" height="44.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="350.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дуже швидка; комірка ≈ тригер (§16)</text>
<rect x="650.0" y="116.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="745.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">робоча RAM МК, кеші</text>
<rect x="60.0" y="166.0" width="110.0" height="44.0" rx="6" fill="#fafafa" stroke="#1f47b5" stroke-width="1.5"/>
<text x="115.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">DRAM</text>
<rect x="180.0" y="166.0" width="150.0" height="44.0" rx="6" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.3"/>
<text x="255.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">летка</text>
<rect x="340.0" y="166.0" width="300.0" height="44.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="350.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">щільна, потребує освіження (заряд стікає)</text>
<rect x="650.0" y="166.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="745.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">головна пам'ять ПК</text>
<rect x="60.0" y="216.0" width="110.0" height="44.0" rx="6" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="115.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Flash</text>
<rect x="180.0" y="216.0" width="150.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="255.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">НЕлетка</text>
<rect x="340.0" y="216.0" width="300.0" height="44.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="350.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">читання швидке; запис блоками, знос</text>
<rect x="650.0" y="216.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="745.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">програма МК, SSD, флешки</text>
<rect x="60.0" y="266.0" width="110.0" height="44.0" rx="6" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="115.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">EEPROM</text>
<rect x="180.0" y="266.0" width="150.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="255.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">НЕлетка</text>
<rect x="340.0" y="266.0" width="300.0" height="44.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="350.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повільна, зате побайтна</text>
<rect x="650.0" y="266.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="745.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">малі налаштування на МК</text>
<rect x="60.0" y="316.0" width="110.0" height="44.0" rx="6" fill="#fafafa" stroke="#caa24a" stroke-width="1.5"/>
<text x="115.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ROM</text>
<rect x="180.0" y="316.0" width="150.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="255.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">НЕлетка</text>
<rect x="340.0" y="316.0" width="300.0" height="44.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="350.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тільки читання, вшите назавжди</text>
<rect x="650.0" y="316.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.2"/>
<text x="745.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">незмінні дані, заводський код</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для нас практично: на МК — Flash тримає прошиту програму, SRAM тримає змінні під час роботи. Решта — за потреби.</text>
</svg>
