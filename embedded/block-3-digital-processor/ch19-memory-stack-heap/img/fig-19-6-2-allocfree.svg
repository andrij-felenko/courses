<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424">
<rect width="900" height="424" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві дії з купою: взяти блок (allocate) і повернути (free)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">просиш блок потрібного розміру — дістаєш ПОКАЖЧИК на нього (§19.4); попрацював — повертаєш блок у спільний запас</text>
<rect x="70.0" y="90.0" width="360.0" height="130.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВЗЯТИ (allocate)</text>
<text x="90.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«дай мені блок на 100 байтів»</text>
<line x1="250.0" y1="150.0" x2="250.0" y2="168.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="90.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">купа знаходить вільний блок і повертає</text>
<text x="90.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ПОКАЖЧИК на нього: p = allocate(100)</text>
<rect x="470.0" y="90.0" width="360.0" height="130.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="650.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПОВЕРНУТИ (free)</text>
<text x="490.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«я закінчив із цим блоком»</text>
<line x1="650.0" y1="150.0" x2="650.0" y2="168.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="490.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">free(p): блок вертається в запас</text>
<text x="490.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">і може бути виданий комусь іншому</text>
<rect x="60.0" y="240.0" width="780.0" height="110.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На відміну від стека, купа — РУЧНА: ти сам береш і сам мусиш повернути; і в БУДЬ-ЯКОМУ порядку (не LIFO).</text>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Покажчик — твоя ЄДИНА ниточка до блоку: у купи дані не мають імені, лише адресу. Загубив покажчик — загубив блок (витік).</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(у мові C це функції malloc/free; у C++ — new/delete; суть — «взяти» і «повернути» пам'ять на льоту)</text>
<text x="450.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Хто стежить за вільними й зайнятими блоками — «розпорядник купи» (allocator): службова бухгалтерія над областю купи.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Свобода брати будь-що будь-коли — могутня, та саме вона й породжує фрагментацію (нижче) і вимагає дисципліни.</text>
</svg>
