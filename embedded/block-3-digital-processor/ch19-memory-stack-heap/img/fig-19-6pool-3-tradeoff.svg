<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580">
<rect width="940" height="580" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що пул прибирає — і чим за це платить</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зовнішньої фрагментації немає за визначенням; натомість з'являється внутрішня — і жорстка стеля розміру</text>
<rect x="60.0" y="92.0" width="410.0" height="196.0" rx="10" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="265.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Зовнішньої фрагментації НЕМАЄ</text>
<rect x="82.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.8"/>
<text x="104.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="134.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="156.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="186.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="208.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="238.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.8"/>
<text x="260.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="290.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="312.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<rect x="342.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.8"/>
<text x="364.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="394.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.8"/>
<text x="416.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="446.0" y="140.0" width="44.0" height="44.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="468.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<text x="82.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Будь-який вільний слот годиться для будь-якого запиту —</text>
<text x="82.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усі однакові. «Розкиданих уламків, що не влазять», не буває:</text>
<text x="82.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">є вільний слот → виділення вдається. Завжди.</text>
<text x="82.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(порівняй з «паркінгом із проміжками» §3.6.6 — тут проміжки</text>
<text x="82.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">однакові, тож кожен придатний)</text>
<rect x="500.0" y="92.0" width="380.0" height="196.0" rx="10" fill="#fff8ee" stroke="#caa24a" stroke-width="1.7"/>
<text x="690.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Зате з'являється ВНУТРІШНЯ</text>
<rect x="540.0" y="140.0" width="300.0" height="46.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<rect x="540.0" y="140.0" width="186.0" height="46.0" rx="0" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.6"/>
<rect x="726.0" y="140.0" width="114.0" height="46.0" rx="0" fill="#f3ead7" stroke="#caa24a" stroke-width="1.4"/>
<text x="633.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">дані 40 Б</text>
<text x="783.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">марно</text>
<text x="783.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">24 Б</text>
<text x="540.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">слот 64 Б</text>
<text x="524.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Поклав 40 Б у слот на 64 Б — 24 Б усередині слота</text>
<text x="524.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лежать без діла. Це внутрішня фрагментація:</text>
<text x="524.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">плата за те, що всі слоти однакові.</text>
<text x="524.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Лік: підбирати розмір слота близько до типового</text>
<text x="524.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">запиту (або тримати кілька пулів різних розмірів).</text>
<rect x="60.0" y="310.0" width="820.0" height="144.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Дві тверді межі, з якими треба рахуватися</text>
<text x="82.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">■</text>
<text x="100.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Запит більший за слот — відмова.</text>
<text x="100.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Слот фіксований: треба 100 Б, а слот 64 Б — виділення провалюється, хоч вільних слотів багато. Розмір</text>
<text x="100.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">слота обирають під найбільший очікуваний об'єкт.</text>
<text x="82.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">■</text>
<text x="100.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Скінчилися слоти — теж відмова.</text>
<text x="100.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Слотів рівно N (виділено на старті). Узяв усі — наступний alloc дає NULL. Тому N рахують під пік</text>
<text x="100.0" y="443.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одночасно живих об'єктів, із запасом.</text>
</svg>
