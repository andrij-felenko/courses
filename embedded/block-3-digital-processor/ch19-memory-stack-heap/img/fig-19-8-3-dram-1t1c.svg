<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486">
<rect width="900" height="486" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DRAM: біт — це заряд на одному конденсаторі (1 транзистор + 1 конденсатор)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найдрібніша можлива комірка: транзистор-ключ і малесенький конденсатор; заряджений = 1, порожній = 0</text>
<rect x="250.0" y="150.0" width="46.0" height="30.0" rx="4" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<line x1="273.0" y1="134.0" x2="273.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="262.0" y1="134.0" x2="284.0" y2="134.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="250.0" y1="180.0" x2="250.0" y2="192.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="296.0" y1="180.0" x2="296.0" y2="192.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="273.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ключ</text>
<line x1="273.0" y1="180.0" x2="273.0" y2="214.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="251.0" y1="214.0" x2="295.0" y2="214.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="251.0" y1="224.0" x2="295.0" y2="224.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="273.0" y1="224.0" x2="273.0" y2="248.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="257.0" y1="248.0" x2="289.0" y2="248.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="263.0" y1="253.0" x2="283.0" y2="253.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="269.0" y1="258.0" x2="277.0" y2="258.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="333.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">конденсатор:</text>
<text x="333.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тут «живе» біт</text>
<text x="323.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">(заряд = 1)</text>
<line x1="273.0" y1="134.0" x2="273.0" y2="134.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="220.0" y1="134.0" x2="273.0" y2="134.0" stroke="#caa24a" stroke-width="2.4" stroke-linecap="round"/>
<text x="273.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">лінія слова</text>
<line x1="250.0" y1="192.0" x2="220.0" y2="192.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="180.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">біт-лінія</text>
<rect x="470.0" y="96.0" width="370.0" height="150.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="655.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Крихітна — звідси щільність</text>
<text x="486.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• лише 2 елементи проти 6 транзисторів SRAM</text>
<text x="486.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у кілька разів дрібніша комірка</text>
<text x="486.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• → у рази більше біт на тому ж кристалі</text>
<text x="486.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• → дешевша на біт</text>
<text x="486.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Тому DRAM — головна (велика) пам'ять ПК,</text>
<text x="486.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">а SRAM лишають для малого й швидкого.</text>
<text x="150.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Підступ: заряд СТІКАЄ</text>
<polyline points="160.0,360.0 200.0,332.0 260.0,322.0 340.0,320.0 430.0,319.0" fill="none" stroke="#1f47b5" stroke-width="2.6"/>
<polyline points="160.0,360.0 200.0,380.0 260.0,392.0 340.0,397.0 430.0,399.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-dasharray="4 3"/>
<line x1="160.0" y1="320.0" x2="160.0" y2="405.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="160.0" y1="405.0" x2="440.0" y2="405.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="150.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">заряд</text>
<text x="446.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">час</text>
<text x="300.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">повний (1)</text>
<text x="300.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">поріг: нижче — біт «1» втрачено</text>
<text x="300.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">мілісекунди — і заряд протік крізь неідеальний ізолятор</text>
<rect x="470.0" y="300.0" width="370.0" height="120.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="655.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Розв'язок: ОСВІЖЕННЯ (refresh)</text>
<text x="486.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кожну комірку періодично (кожні кілька мс)</text>
<text x="486.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перечитують і записують назад — поки біт ще цілий.</text>
<text x="486.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Звідси назва ДИНАМІЧНА: стан не стоїть сам,</text>
<text x="486.0" y="399.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">його треба раз у раз відновлювати (на відміну від SRAM).</text>
<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Читання теж РУЙНІВНЕ (відкрив ключ — заряд витік на біт-лінію), тож після читання біт одразу записують назад — точно як осердя (§19.0).</text>
<text x="450.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тут лише фізика комірки; як цим керує окремий контролер (таймінги, регенерація) — це вже зовнішня пам'ять, Розділ 22 (§3.8.2).</text>
</svg>
