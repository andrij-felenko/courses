<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600">
<rect width="940" height="600" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Повернення + злиття сусідніх вільних блоків (coalescing)</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">free сам по собі лишає дрібні уламки; ліки — одразу зливати щойно звільнений блок із вільними сусідами</text>
<text x="70.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">(а) ДО free: посередині зайнятий блок, обабіч — два вільні сусіди</text>
<rect x="70.0" y="100.0" width="130.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="70.0" y="100.0" width="130.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="76.0" y="115.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 24</text>
<text x="135.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВІЛЬНО</text>
<rect x="200.0" y="100.0" width="150.0" height="62.0" rx="0" fill="#fbe6e4" stroke="#c0271e" stroke-width="2"/>
<rect x="200.0" y="100.0" width="150.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="206.0" y="115.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 32</text>
<text x="275.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">звільняємо</text>
<rect x="350.0" y="100.0" width="180.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="350.0" y="100.0" width="180.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="356.0" y="115.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 40</text>
<text x="440.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВІЛЬНО</text>
<line x1="275.0" y1="70.0" x2="275.0" y2="98.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="275.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">free(p)</text>
<text x="70.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">(б) НАЇВНО (без злиття): три окремі вільні блоки — фрагментація, великий запит не влазить</text>
<rect x="70.0" y="250.0" width="130.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="70.0" y="250.0" width="130.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="76.0" y="265.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 24</text>
<text x="135.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільний</text>
<rect x="200.0" y="250.0" width="150.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="200.0" y="250.0" width="150.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="206.0" y="265.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 32</text>
<text x="275.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільний</text>
<rect x="350.0" y="250.0" width="180.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="350.0" y="250.0" width="180.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="356.0" y="265.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 40</text>
<text x="440.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільний</text>
<text x="300.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">24 + 32 + 40 = 96 Б вільно, але порізано на 3 шматки</text>
<line x1="470.0" y1="346.0" x2="470.0" y2="376.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="482.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">злиття сусідів (coalesce)</text>
<text x="70.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">(в) ПІСЛЯ злиття: один суцільний вільний блок — і зайві заголовки зникли</text>
<rect x="70.0" y="420.0" width="460.0" height="62.0" rx="0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2"/>
<rect x="70.0" y="420.0" width="460.0" height="22.0" rx="0" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="76.0" y="435.0" font-family="Consolas, monospace" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal">size 96+</text>
<text x="300.0" y="467.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОДИН ВЕЛИКИЙ ВІЛЬНИЙ БЛОК</text>
<text x="300.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тепер великий запит знову влазить; фрагментацію відкотили</text>
<rect x="558.0" y="412.0" width="346.0" height="102.0" rx="8" fill="#fff7e8" stroke="#caa24a" stroke-width="1.4"/>
<text x="570.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Як знайти сусіда:</text>
<text x="570.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">наступний — поряд: адреса+розмір</text>
<text x="570.0" y="461.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">попередній — «граничні мітки»</text>
<text x="570.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(boundary tags, Knuth): розмір</text>
<text x="570.0" y="491.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дублюється і в кінці блоку</text>
</svg>
