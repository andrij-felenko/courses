<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому Flash не годиться для частих змін: примхи запису</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">читати з Flash легко й швидко, але ПИСАТИ — складно: лише цілими блоками, повільно й обмежену кількість разів</text>
<rect x="70.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="250.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">RAM — пише легко</text>
<text x="92.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• будь-який ОКРЕМИЙ байт — одразу</text>
<text x="92.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• швидко (за такти)</text>
<text x="92.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• скільки завгодно разів</text>
<text x="92.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ідеально для змінних, що весь час міняються</text>
<rect x="470.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="650.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Flash — пише важко</text>
<text x="492.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• лише цілими БЛОКАМИ (не байтом)</text>
<text x="492.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• спершу СТЕРТИ блок (усе → 1), тоді писати (1 → 0)</text>
<text x="492.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• повільно (мікро-мілісекунди)</text>
<text x="492.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ЗНОС: ~10 000–100 000 циклів на блок</text>
<text x="160.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">запис у Flash:</text>
<text x="300.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стерти весь блок</text>
<rect x="220.0" y="310.0" width="160.0" height="26.0" rx="4" fill="#fdecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="300.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 1 1 1 1 1 1 1</text>
<line x1="390.0" y1="323.0" x2="450.0" y2="323.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="560.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тоді записати потрібні 0</text>
<rect x="480.0" y="310.0" width="160.0" height="26.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="560.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 0 1 1 0 0 1 0</text>
<rect x="60.0" y="354.0" width="780.0" height="76.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому Flash чудова для коду (записав раз при прошивці — читай мільйони разів), та погана для даних, що весь час міняються:</text>
<text x="450.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лічильник, що пише у Flash щосекунди, «зносить» блок за лічені дні. Часті зміни — робота для RAM (а збереження налаштувань — обережно).</text>
<text x="450.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(До речі, так само влаштовані SSD й флешки — звідси їхній «знос» і потреба в рівномірному розподілі записів.)</text>
</svg>
