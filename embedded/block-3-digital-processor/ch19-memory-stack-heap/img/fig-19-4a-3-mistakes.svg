<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сім класичних помилок покажчиків (і чим вони карають на МК)</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">майже всі — або «адреса не туди», або «крок не той»; на МК без захисту пам'яті — тихо й боляче</text>
<rect x="60.0" y="86.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="78.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1. Вихід за межу (off-by-one)</text>
<text x="78.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">цикл i ≤ N замість i &lt; N → читаєш/пишеш a[N], якого нема</text>
<rect x="60.0" y="146.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="78.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">2. Плутанина байт vs елемент</text>
<text x="78.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">p + n коли треба p + n*sizeof, або навпаки memcpy на елементи</text>
<rect x="60.0" y="206.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="78.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">3. Висячий покажчик (dangling)</text>
<text x="78.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">адреса на звільнену пам'ять чи локальну поза функцією (§3.6.5)</text>
<rect x="60.0" y="266.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="78.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">4. Подвійне/забуте free</text>
<text x="78.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">free двічі або витік: на МК без MMU — фрагментація й крах купи (§3.6.6)</text>
<rect x="60.0" y="326.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="78.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">5. Непідрівняний доступ</text>
<text x="78.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(int*) на адресу не кратну 4 → HardFault на Cortex-M</text>
<rect x="60.0" y="386.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="78.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">6. Порушення strict aliasing</text>
<text x="78.0" y="429.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">читати об'єкт через чужий тип; оптимізатор переставить доступи (UB)</text>
<rect x="60.0" y="446.0" width="780.0" height="54.0" rx="9" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="78.0" y="468.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">7. Арифметика поза одним масивом</text>
<text x="78.0" y="489.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">віднімати/порівнювати покажчики з різних блоків — UB, не «просто число»</text>
</svg>
