<text x="78.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="92.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Службовий заголовок (header).</text>
<text x="92.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Кілька байтів перед кожним блоком: його розмір, прапорець «вільний?» і — у</text>
<text x="92.0" y="465.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вільних — посилання next. За них платить кожне виділення.</text>
<text x="78.0" y="488.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="92.0" y="488.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Free list — лише вільні блоки.</text>
<text x="92.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Зайняті в списку не присутні; вони «зникають», поки їх не повернуть.</text>
<text x="92.0" y="519.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Голова free_list — єдина точка входу в перебір.</text>
<text x="78.0" y="542.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="92.0" y="542.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Адреси ростуть зліва направо.</text>
<text x="92.0" y="558.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Сусідство в пам'яті ≠ сусідство у списку: вільні блоки за адресою можуть</text>
<text x="92.0" y="573.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">бути розкидані, а next зв'язує їх у будь-якому порядку.</text>
</svg>
