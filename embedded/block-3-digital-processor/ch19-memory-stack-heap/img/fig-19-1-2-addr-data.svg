<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Адреса vs дані: «де» і «що» — це РІЗНІ речі (й різні шини)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">процесор називає АДРЕСУ (куди), а пам'ять віддає чи приймає ДАНІ (що) — кожне своєю шиною (§18.2)</text>
<rect x="80.0" y="150.0" width="180.0" height="110.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="170.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<text x="170.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«дай байт за 0x20»</text>
<line x1="262.0" y1="178.0" x2="600.0" y2="178.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<text x="430.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">АДРЕСНА шина: 0x20  (ДЕ — номер комірки)</text>
<line x1="600.0" y1="232.0" x2="262.0" y2="232.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="430.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">шина ДАНИХ: 0x41  (ЩО — сам байт)</text>
<rect x="600.0" y="130.0" width="220.0" height="150.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="710.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПАМ'ЯТЬ</text>
<rect x="660.0" y="168.0" width="110.0" height="26.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="650.0" y="185.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">0x1F</text>
<text x="715.0" y="185.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x10</text>
<rect x="660.0" y="198.0" width="110.0" height="26.0" rx="4" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="650.0" y="215.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">0x20</text>
<text x="715.0" y="215.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x41</text>
<rect x="660.0" y="228.0" width="110.0" height="26.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="650.0" y="245.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">0x21</text>
<text x="715.0" y="245.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x9B</text>
<rect x="60.0" y="300.0" width="780.0" height="100.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не плутайте: 0x20 — це АДРЕСА (яка комірка), а 0x41 — це ДАНІ (що в ній). Обидва — числа, та сенс цілком різний.</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пам'ятаєте шини з §18.2? Адресна несе «де», шина даних — «що». Тут вони оживають: ось навіщо їх дві.</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Плутанина «адреса проти значення» — джерело багатьох багів; тримайте їх чітко нарізно (а далі будуть ще й покажчики, §19.4).</text>
</svg>
