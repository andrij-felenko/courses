<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">g (останній доданий) знімається ПЕРШИМ, тоді f. Вершину стека стежить покажчик стека SP (§18.2): push рухає його, pop вертає.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зверніть увагу: пам'ять виділяється й звільняється САМА — просто рухом SP. Жодного ручного керування локальними.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(у пам'яті стек росте до НИЖЧИХ адрес — §19.2; тут «вершину» намальовано вгорі для наочності)</text>
