<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416">
<rect width="900" height="416" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек — структура «останній прийшов, перший пішов» (LIFO)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як стос тарілок: кладеш зверху (push) і береш зверху (pop); останнє покладене знімається першим</text>
<rect x="150.0" y="220.0" width="200.0" height="28.0" rx="14" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="250.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">кадр g()</text>
<rect x="150.0" y="186.0" width="200.0" height="28.0" rx="14" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="250.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">кадр f()</text>
<rect x="150.0" y="152.0" width="200.0" height="28.0" rx="14" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кадр main()</text>
<text x="250.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стос (стек)</text>
<line x1="370.0" y1="130.0" x2="410.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="450.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">push: покласти зверху</text>
<line x1="410.0" y1="170.0" x2="370.0" y2="170.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="450.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">pop: зняти зверху</text>
<rect x="430.0" y="196.0" width="410.0" height="130.0" rx="10" fill="#f4f7f4" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="635.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому саме стек для викликів?</text>
<text x="450.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• останній викликаний (g) — перший</text>
<text x="450.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   повертається → знімаємо його кадр</text>
<text x="450.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тоді f, тоді main — точно LIFO!</text>
<text x="450.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вкладені виклики й рекурсія</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   лягають на стек ідеально</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порядок завершення викликів — рівно зворотний до порядку входу. Це і є LIFO, і саме тому виклики тримають у СТЕКУ.</text>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дві дії й усе: PUSH (увійшли у функцію — додали кадр) і POP (вийшли — зняли кадр). Просто й блискавично.</text>
</svg>
