<svg xmlns="http://www.w3.org/2000/svg" width="900" height="408" viewBox="0 0 900 408">
<rect width="900" height="408" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Комірка тримає просто ЧИСЛО — а що воно означає, вирішує програма</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">адреса каже лише ДЕ; самі біти сенсу не мають (§17.1) — той самий байт може бути числом, буквою, командою…</text>
<rect x="400.0" y="92.0" width="120.0" height="44.0" rx="4" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="390.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">0x20</text>
<text x="460.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x41</text>
<text x="460.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий байт 0x41 (= 0100 0001)</text>
<line x1="460.0" y1="168.0" x2="180.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#aInk)"/>
<rect x="90.0" y="200.0" width="180.0" height="70.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="180.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ціле число</text>
<text x="180.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">65</text>
<line x1="460.0" y1="168.0" x2="375.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#aInk)"/>
<rect x="285.0" y="200.0" width="180.0" height="70.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="375.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">символ</text>
<text x="375.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">'A' (код)</text>
<line x1="460.0" y1="168.0" x2="570.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#aInk)"/>
<rect x="480.0" y="200.0" width="180.0" height="70.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="570.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">частина команди</text>
<text x="570.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">opcode/операнд</text>
<line x1="460.0" y1="168.0" x2="765.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#aInk)"/>
<rect x="675.0" y="200.0" width="180.0" height="70.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="765.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">частина дробу</text>
<text x="765.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">біти float</text>
<rect x="60.0" y="292.0" width="780.0" height="100.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це наскрізна думка Розділу 17, тепер у пам'яті: байт у комірці — просто число; ЯК його прочитати, вирішує програма.</text>
<text x="450.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Адреса — це лише МІСЦЕ. Чи лежить там код, чи дані, чи число, чи буква — залежить від того, як цю комірку ВЖИВАЮТЬ.</text>
<text x="450.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси й сила фон-нейманівської машини (Розділ 18): код і дані — однакові числа в однаковій пам'яті, різні лише вживанням.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">І звідси ж клас багів: прочитати комірку «не за тією домовленістю» (дані як код, ціле як дріб) — і все ламається.</text>
</svg>
