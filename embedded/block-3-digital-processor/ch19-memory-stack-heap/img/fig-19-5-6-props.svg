<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412">
<rect width="900" height="412" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Властивості стека: швидко й само — але обмежено й недовговічно</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стек ідеальний для викликів і локальних, та має дві важливі межі, про які мусить пам'ятати програміст</text>
<rect x="70.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Переваги</text>
<text x="92.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ШВИДКО: виділення = рух SP на крок</text>
<text x="92.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• САМО: вхід у функцію виділяє,</text>
<text x="92.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   вихід звільняє (нічого не питають)</text>
<text x="92.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• локальні — «автоматичні»</text>
<text x="92.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ідеально лягає на вкладені виклики</text>
<rect x="470.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Межі (обережно!)</text>
<text x="492.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ОБМЕЖЕНИЙ розмір (регіон §19.2);</text>
<text x="492.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   надто глибоко → переповнення (§19.7)</text>
<text x="492.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• локальні ЗНИКАЮТЬ при поверненні:</text>
<text x="492.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">   не повертай покажчик на локальну!</text>
<text x="492.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (це висячий покажчик, §19.4)</text>
<rect x="60.0" y="256.0" width="780.0" height="92.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек — для тимчасового: те, що живе рівно стільки, скільки виклик. Швидко й безтурботно, поки не вийдеш за межі.</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">А для даних, які мусять ПЕРЕЖИТИ функцію (чи розмір яких заздалегідь невідомий), стек не годиться — потрібна КУПА (§19.6).</text>
<text x="450.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Глибока рекурсія — класична пастка стека: кожен виклик додає кадр, і без виходу стек швидко переповнюється.</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Стек також рятує переривання (Розділ 23): на час обробника контекст теж кладуть на стек — той самий механізм.</text>
</svg>
