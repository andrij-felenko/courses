<text x="220.0" y="520.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#6f6f6f" text-anchor="middle" font-weight="normal" font-style="italic">Фроман зробив надійною — звідси назва FAMOS)</text>
<text x="690.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЧИТАННЯ: дивимось на поріг</text>
<text x="690.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пробуємо ввімкнути транзистор —</text>
<text x="690.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відкрився чи ні, те й каже біт усередині</text>
<text x="690.0" y="506.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#6f6f6f" text-anchor="middle" font-weight="normal" font-style="italic">читання заряду НЕ чіпає → біт тримається роками,</text>
<text x="690.0" y="520.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#6f6f6f" text-anchor="middle" font-weight="normal" font-style="italic">поки його не стерти (нелетка пам'ять, §3.6.8)</text>
</svg>
