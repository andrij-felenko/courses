<text x="695.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">клас W25Q · корпус SOIC-8</text>
<rect x="590.0" y="190.0" width="210.0" height="64.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="695.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">прошивка (код + сталі)</text>
<text x="695.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">.text · .rodata · ресурси</text>
<text x="695.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нелетка: лишається після вимкнення (§3.6.3)</text>
<text x="695.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">об'єм — мегабайти, недорого</text>
<text x="695.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">як читає й пише — NOR і XIP, §3.8.5</text>
<rect x="60.0" y="392.0" width="780.0" height="60.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поділ той самий, що в §3.6.3: змінні — у швидкій леткій SRAM на кристалі; код і сталі — у місткій нелеткій флеші.</text>
<text x="450.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Лише тепер флеш — НЕ всередині мікросхеми процесора, а окремим чипом поруч, на спільній платі, через шину SPI.</text>
</svg>
