<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прошивка живе в окремому чипі — зовнішній SPI-флеші поруч із SoC</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у ESP32 ядро та RAM на кристалі, а власне програму тримає сусідній флеш-чип, з'єднаний шиною SPI</text>
<rect x="70.0" y="110.0" width="330.0" height="250.0" rx="12" fill="#f7f9fc" stroke="#1f47b5" stroke-width="2.2"/>
