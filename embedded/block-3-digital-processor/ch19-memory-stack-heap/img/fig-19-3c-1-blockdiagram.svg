<text x="159.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виконує код</text>
<rect x="246.0" y="170.0" width="130.0" height="56.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="311.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SRAM</text>
<text x="311.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">змінні (летка)</text>
<rect x="94.0" y="242.0" width="130.0" height="50.0" rx="8" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
