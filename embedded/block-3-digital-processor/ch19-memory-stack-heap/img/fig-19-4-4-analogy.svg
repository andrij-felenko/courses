<svg xmlns="http://www.w3.org/2000/svg" width="900" height="438" viewBox="0 0 900 438">
<rect width="900" height="438" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Точна аналогія: покажчик — це адреса будинку на папірці</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">папірець з адресою — це не сам будинок; він лише каже, ДЕ будинок (згадайте «вулицю» з §19.1)</text>
<rect x="90.0" y="100.0" width="150.0" height="90.0" rx="8" fill="#fffdf5" stroke="#caa24a" stroke-width="2"/>
<text x="165.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">папірець</text>
<text x="165.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вул. Пам'яті,</text>
<text x="165.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">буд. 0x20</text>
<text x="165.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= покажчик</text>
<line x1="244.0" y1="145.0" x2="320.0" y2="145.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="330.0" y="105.0" width="130.0" height="80.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="395.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">🏠 будинок</text>
<text x="395.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(самі дані: 42)</text>
<text x="395.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">= змінна x</text>
<rect x="70.0" y="240.0" width="250.0" height="34.0" rx="6" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="195.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">копіювати папірець</text>
<text x="335.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">два папірці → той самий будинок (два покажчики на ті самі дані)</text>
<rect x="70.0" y="280.0" width="250.0" height="34.0" rx="6" fill="#fafafa" stroke="#1f47b5" stroke-width="1.5"/>
<text x="195.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">дати другові</text>
<text x="335.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">він піде за адресою й навіть перефарбує будинок (функція змінить ваші дані)</text>
<rect x="70.0" y="320.0" width="250.0" height="34.0" rx="6" fill="#fafafa" stroke="#caa24a" stroke-width="1.5"/>
<text x="195.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">піти за адресою</text>
<text x="335.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дістатися будинку = розіменування (*p)</text>
<rect x="540.0" y="100.0" width="300.0" height="86.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="690.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Де аналогія ламається</text>
<text x="560.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">папірець зі СТАРОЮ чи хибною адресою</text>
<text x="560.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">веде до знесеного чи чужого будинку —</text>
<text x="560.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">це «висячий»/«дикий» покажчик (далі)</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Папірець (адреса) — повноцінна річ: його можна копіювати, передавати, загубити. Але користь з нього лише тоді, коли адреса ПРАВИЛЬНА.</text>
</svg>
