<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підступ: читання РУЙНУЄ біт — тож його одразу відновлюють</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щоб прочитати, осердя силоміць перемикають у 0 — і дивляться, чи був «клац»; якщо був, то там була 1</text>
<text x="155.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. пробуємо записати 0</text>
<circle cx="180.0" cy="150.0" r="40.0" fill="none" stroke="#c0271e" stroke-width="3.4"/>
<line x1="202.0" y1="110.0" x2="158.0" y2="110.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="180.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<line x1="228.0" y1="150.0" x2="300.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="264.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">струм</text>
<circle cx="345.0" cy="150.0" r="40.0" fill="none" stroke="#1f47b5" stroke-width="3.4"/>
<line x1="323.0" y1="110.0" x2="367.0" y2="110.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="345.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="180.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">було 1</text>
<text x="345.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стало 0</text>
<text x="262.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕМКНУЛОСЬ</text>
<text x="560.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">перемикання наводить</text>
<text x="560.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">імпульс у СЕНС-дроті:</text>
<polyline points="560.0,165.0 610.0,165.0 615.0,140.0 625.0,140.0 630.0,165.0 760.0,165.0" fill="none" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="620.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">клац!</text>
<text x="660.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ отже, там була 1</text>
<text x="560.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(якби була 0 — нічого не перемкнулось би, імпульсу нема → там 0)</text>
<rect x="60.0" y="250.0" width="780.0" height="70.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЛЕ: читання знищило значення (осердя тепер 0). Тож одразу після читання його ЗАПИСУЮТЬ НАЗАД —</text>
<text x="450.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">цикл «прочитати-відновити» (read-restore). Кожне читання непомітно перезаписує біт.</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це «руйнівне читання» — характерна риса осердь (і, до речі, сучасної DRAM теж: вона так само відновлює біти).</text>
<text x="450.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Через дроти X, Y, сенс і заборони (inhibit) крізь кожне кільце треба було протягти по 3–4 дротини — мільйони разів.</text>
<text x="450.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому пам'ять на осердях… ткали вручну — здебільшого жінки з голкою, кільце за кільцем. Праця, гідна окремої згадки.</text>
</svg>
