<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
<rect width="940" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7b3fb0"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому віконце змінило інженерію: ітерація замість «один постріл»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">до EPROM прошивку «впікали» в чип масками на фабриці — помилка означала новий чип і тижні чекання</text>
<text x="220.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Маскова ROM (до EPROM)</text>
<rect x="90.0" y="116.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="220.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">написати програму</text>
<line x1="220.0" y1="146.0" x2="220.0" y2="154.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="90.0" y="160.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="220.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">замовити маски на фабриці</text>
<line x1="220.0" y1="190.0" x2="220.0" y2="198.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="90.0" y="204.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="220.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чекати тижні, платити дорого</text>
<line x1="220.0" y1="234.0" x2="220.0" y2="242.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="90.0" y="248.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="220.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">отримати чипи з «вкарбованим» кодом</text>
<line x1="220.0" y1="278.0" x2="220.0" y2="286.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="90.0" y="292.0" width="260.0" height="30.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.4"/>
<text x="220.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">знайшли баг? усе — на смітник,</text>
<line x1="220.0" y1="322.0" x2="220.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="90.0" y="336.0" width="260.0" height="30.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.4"/>
<text x="220.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">починай спочатку</text>
<polyline points="90.0,351.0 64.0,351.0 64.0,131.0 90.0,131.0" fill="none" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,4"/>
<line x1="86.0" y1="131.0" x2="94.0" y2="131.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="60.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">новий</text>
<text x="60.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">цикл</text>
<text x="220.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">дорого й повільно помилятися</text>
<text x="720.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">EPROM (із віконцем)</text>
<rect x="590.0" y="116.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="720.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">прошити чип у себе на столі</text>
<line x1="720.0" y1="146.0" x2="720.0" y2="154.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="590.0" y="160.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="720.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спробувати в схемі</text>
<line x1="720.0" y1="190.0" x2="720.0" y2="198.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="590.0" y="204.0" width="260.0" height="30.0" rx="6" fill="#f6f6f6" stroke="#caa24a" stroke-width="1.5"/>
<text x="720.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">знайшли баг — виправити код</text>
<line x1="720.0" y1="234.0" x2="720.0" y2="242.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="590.0" y="248.0" width="260.0" height="30.0" rx="6" fill="#faf6fd" stroke="#7b3fb0" stroke-width="1.5"/>
<text x="720.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">стерти УФ за 20 хв</text>
<line x1="720.0" y1="278.0" x2="720.0" y2="286.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="590.0" y="292.0" width="260.0" height="30.0" rx="6" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="720.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">прошити той самий чип знову</text>
<polyline points="850.0,307.0 876.0,307.0 876.0,131.0 850.0,131.0" fill="none" stroke="#1f8a3b" stroke-width="2.2"/>
<line x1="854.0" y1="131.0" x2="846.0" y2="131.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="880.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">хвилини,</text>
<text x="880.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">безкоштовно</text>
<text x="720.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">дешево й швидко помилятися = швидше вчитися</text>
<line x1="364.0" y1="250.0" x2="576.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="470.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">EPROM</text>
<rect x="60.0" y="404.0" width="820.0" height="52.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="470.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">EPROM перетворила прошивку на те, що можна правити ітераціями — і саме це пришвидшило весь ранній світ мікропроцесорів.</text>
<text x="470.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Чип з віконцем став робочим інструментом інженера: «прошити → спробувати → стерти → прошити знову».</text>
</svg>
