<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стековий кадр: що саме кладе на стек один виклик</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен виклик додає «кадр» (frame) — пакет усього, що потрібно функції та для повернення з неї</text>
<rect x="180.0" y="100.0" width="260.0" height="46.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="310.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">адреса повернення</text>
<text x="460.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">куди продовжити того, хто викликав (→ у PC при return)</text>
<rect x="180.0" y="156.0" width="260.0" height="46.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="310.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">збережені регістри</text>
<text x="460.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">значення регістрів, які треба відновити після виклику</text>
<rect x="180.0" y="212.0" width="260.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="310.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">параметри</text>
<text x="460.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">аргументи, передані функції</text>
<rect x="180.0" y="268.0" width="260.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="310.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">локальні змінні</text>
<text x="460.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">власні змінні функції (живуть, поки вона працює)</text>
<line x1="150.0" y1="100.0" x2="150.0" y2="314.0" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
<text x="120.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">один</text>
<text x="120.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">кадр</text>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Увійшли у функцію — цей кадр ляг на стек (push); вийшли — кадр знявся (pop), і вся його пам'ять умить звільнилась.</text>
<text x="440.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому локальні змінні ще звуть «автоматичними»: вони самі з'являються при вході й самі зникають при виході — без турбот.</text>
<text x="440.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(точний склад кадру залежить від процесора й домовленості викликів — тут показано типову суть)</text>
</svg>
