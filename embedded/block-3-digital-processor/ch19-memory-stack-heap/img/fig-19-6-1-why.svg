<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416">
<rect width="900" height="416" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо купа: два випадки, з якими стек не впорається</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">локальні зникають при поверненні (§19.5), а їхній розмір відомий наперед — та інколи треба не так</text>
<rect x="70.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1. Дані мусять ПЕРЕЖИТИ функцію</text>
<text x="90.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">функція створила результат і завершилась —</text>
<text x="90.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">та результат потрібен далі, після неї</text>
<text x="90.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">стек: кадр знято → дані ЗНИКЛИ (§19.5)</text>
<text x="90.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">потрібна пам'ять, що живе ДОВШЕ за виклик</text>
<rect x="470.0" y="88.0" width="360.0" height="150.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="650.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">2. Розмір невідомий НАПЕРЕД</text>
<text x="490.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">скільки даних — вирішується під час роботи</text>
<text x="490.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(напр. прочитати N вимірів, N — на льоту)</text>
<text x="490.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">стек: локальний масив має фіксований розмір</text>
<text x="490.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">потрібна пам'ять, що береться на ПОТРІБНИЙ розмір</text>
<rect x="60.0" y="256.0" width="780.0" height="90.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для обох випадків є КУПА (heap): велика область, з якої можна ВЗЯТИ блок будь-якого розміру під час роботи,</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тримати його скільки треба (він переживає функції) і ПОВЕРНУТИ, коли більше не потрібен. Це й є динамічна пам'ять.</text>
<text x="450.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Динамічна» — бо розмір і час життя вирішуються на льоту (runtime), а не наперед (як у стека й глобальних).</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна гнучкості — ручне керування й нові класи проблем (фрагментація, витоки), яких у стека не було.</text>
</svg>
