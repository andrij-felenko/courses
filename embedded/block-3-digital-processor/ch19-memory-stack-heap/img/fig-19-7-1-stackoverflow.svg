<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444">
<rect width="900" height="444" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переповнення стека: стек доростає до купи</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стек росте вниз (глибокі виклики, рекурсія, великі локальні) — і якщо дороста до купи, починається лихо (§19.2)</text>
<rect x="330.0" y="92.0" width="240.0" height="50.0" rx="0" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="450.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">СТЕК</text>
<text x="450.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виклики, локальні</text>
<line x1="450.0" y1="150.0" x2="450.0" y2="235.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="464.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">росте вниз</text>
<text x="464.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(глибше й глибше)</text>
<rect x="330.0" y="200.0" width="240.0" height="44.0" rx="0" fill="#fdecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="450.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">💥 ЗІТКНЕННЯ</text>
<rect x="330.0" y="250.0" width="240.0" height="44.0" rx="0" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">КУПА</text>
<line x1="450.0" y1="244.0" x2="450.0" y2="250.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="70.0" y="100.0" width="230.0" height="150.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="185.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки переповнення</text>
<text x="86.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• рекурсія без кінця</text>
<text x="86.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• надто глибокі вкладені</text>
<text x="86.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   виклики</text>
<text x="86.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• величезні локальні</text>
<text x="86.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   масиви на стеку</text>
<rect x="600.0" y="100.0" width="230.0" height="150.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.4"/>
<text x="715.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Що буде</text>
<text x="616.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ПК: ОС спіймає й</text>
<text x="616.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   зупинить (segfault)</text>
<text x="616.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="616.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">МК: ТИХО псує сусіднє</text>
<text x="616.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">   → загадковий крах</text>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек і купа ростуть назустріч в один простір (§19.2). Якщо стек дороста до купи — вони псують дані одне одного.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На МК це особливо підступно: немає захисту пам'яті, тож ніхто не попередить — програма просто почне поводитись дивно.</text>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Запобігання: уникай нескінченної рекурсії, не клади величезні масиви на стек, лишай стеку запас.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Глибока рекурсія — найчастіша причина: кожен виклик додає кадр (§19.5), і без виходу стек швидко вичерпується.</text>
</svg>
