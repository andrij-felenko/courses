<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<rect width="900" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PSRAM: ще один чип пам'яті поряд із процесором — лише летка й по тій самій шині</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">клас пристрою: pseudo-static RAM — щільна комірка DRAM усередині, а назовні простий інтерфейс SPI, що вдає SRAM</text>
<rect x="60.0" y="96.0" width="340.0" height="300.0" rx="12" fill="#f7f9fc" stroke="#1f47b5" stroke-width="2.2"/>
<text x="230.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SoC (ESP32)</text>
<text x="230.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ядро + пам'ять на одному кристалі</text>
<rect x="82.0" y="154.0" width="134.0" height="52.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="149.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ядро CPU</text>
<text x="149.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виконує код</text>
<rect x="244.0" y="154.0" width="134.0" height="52.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="311.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вбудована SRAM</text>
<text x="311.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сотні КіБ · дуже швидка</text>
<rect x="82.0" y="222.0" width="134.0" height="50.0" rx="8" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="149.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кеш</text>
<text x="149.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає гарячі дані</text>
<rect x="244.0" y="222.0" width="134.0" height="50.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="311.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контролер</text>
<text x="311.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зовнішньої пам'яті</text>
<text x="230.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вбудованої SRAM — лічені сотні КіБ:</text>
<text x="230.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на кадр дисплея чи довгий звук не вистачає</text>
<text x="230.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">одна периферія обслуговує ОБИДВА зовнішні чипи</text>
<text x="230.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(часто на спільних лініях, різні CS)</text>
<text x="480.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">шина SPI / QSPI</text>
<line x1="400.0" y1="228.0" x2="560.0" y2="228.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="400.0" y1="244.0" x2="560.0" y2="244.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<line x1="400.0" y1="260.0" x2="560.0" y2="260.0" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<line x1="474.0" y1="244.0" x2="496.0" y2="244.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="496.0" y1="260.0" x2="474.0" y2="260.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="406.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">CS · CLK</text>
<text x="480.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1 лінія даних (SPI) або 4 (QSPI)</text>
<rect x="560.0" y="96.0" width="290.0" height="300.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.2"/>
<text x="705.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">зовнішній чип PSRAM</text>
<text x="705.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">корпус SOIC-8 · 2–16 МіБ</text>
<rect x="586.0" y="154.0" width="238.0" height="44.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="705.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">логіка інтерфейсу SPI</text>
<text x="705.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">назовні поводиться як SRAM</text>
<rect x="586.0" y="212.0" width="238.0" height="56.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="705.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">масив комірок: транзистор + конденсатор</text>
<text x="705.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щільно й дешево (як DRAM, §3.6.3)</text>
<rect x="586.0" y="282.0" width="238.0" height="50.0" rx="8" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="705.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вбудоване самооновлення</text>
<text x="705.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чип сам освіжає заряд — зовні не видно</text>
<text x="705.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">летка: при вимкненні все зникає (§3.6.3)</text>
<text x="705.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">звідси й «pseudo-SRAM»: DRAM, що вдає SRAM</text>
<rect x="60.0" y="414.0" width="780.0" height="64.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="450.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PSRAM розширює саме RAM (летку, для змінних і буферів) — на відміну від NOR-флеші поруч (§3.6.3c), що тримає код.</text>
<text x="450.0" y="460.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Плата за дешевину й місткість — доступ через повільну послідовну шину, а не напряму, як до вбудованої SRAM.</text>
</svg>
