<rect x="330.0" y="360.0" width="250.0" height="42.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.2"/>
<text x="455.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">переповнення (§19.7)</text>
<rect x="610.0" y="360.0" width="250.0" height="42.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.2"/>
<text x="735.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">фрагментація, витоки</text>
<text x="450.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коротко: стек — для тимчасового, що живе з викликом (швидко й безтурботно); купа — для довговічного чи невідомого розміру (гнучко, та обережно).</text>
