<svg xmlns="http://www.w3.org/2000/svg" width="900" height="648" viewBox="0 0 900 648">
<rect width="900" height="648" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як машини вчилися ПАМ'ЯТАТИ: довга дорога до надійної пам'яті</text>
<text x="450.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ранні пам'яті були повільні, примхливі або крихкі — аж поки магнітні осердя не дали швидку й надійну</text>
<line x1="260.0" y1="100.0" x2="260.0" y2="622.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="260.0" cy="128.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="238.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1947</text>
<text x="286.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">лінії затримки (ртутні)</text>
<text x="286.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Біт «біжить» трубкою зі ртуттю по колу — ПОСЛІДОВНО, повільно,</text>
<text x="286.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">примхливо до температури</text>
<circle cx="260.0" cy="221.2" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="238.0" y="226.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1947</text>
<text x="286.0" y="217.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">трубки Вільямса (CRT)</text>
<text x="286.0" y="237.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Біти як плямки на екрані — швидше, та ненадійно й крихко</text>
<text x="286.0" y="254.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">(гасли, плутались)</text>
<circle cx="260.0" cy="314.4" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="238.0" y="319.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">ті ж роки</text>
<text x="286.0" y="310.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">магнітні барабани</text>
<text x="286.0" y="330.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Місткі й нелеткі, але МЕХАНІЧНІ: чекай, поки потрібне місце</text>
<text x="286.0" y="347.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">доїде під голівку</text>
<circle cx="260.0" cy="407.6" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="0"/>
<circle cx="260.0" cy="407.6" r="10.0" fill="none" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="260.0" cy="407.6" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="238.0" y="412.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1953</text>
<text x="286.0" y="403.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">пам'ять на осердях (Форрестер)</text>
<text x="286.0" y="423.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Феритові кільця: ШВИДКО, НАДІЙНО, ВИПАДКОВИЙ доступ і НЕЛЕТКО.</text>
<text x="286.0" y="440.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Прорив для Whirlwind</text>
<circle cx="260.0" cy="500.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="238.0" y="505.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1955–75</text>
<text x="286.0" y="496.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">двадцять років панування</text>
<text x="286.0" y="516.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Осердя стали стандартною оперативною пам'яттю всіх комп'ютерів</text>
<text x="286.0" y="533.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">епохи</text>
<circle cx="260.0" cy="594.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="238.0" y="599.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1970-ті</text>
<text x="286.0" y="590.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">напівпровідникова RAM</text>
<text x="286.0" y="610.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Кремнієва DRAM витіснила осердя — дешевша й дрібніша, та з</text>
<text x="286.0" y="627.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">осердь зросла ціла індустрія пам'яті</text>
</svg>
