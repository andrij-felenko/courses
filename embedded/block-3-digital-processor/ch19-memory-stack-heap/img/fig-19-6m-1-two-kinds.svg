<rect x="226.6" y="166.0" width="37.8" height="40.0" rx="0" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="245.5" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">14</text>
