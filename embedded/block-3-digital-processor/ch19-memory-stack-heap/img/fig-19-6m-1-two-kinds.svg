<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві фрагментації: де ховається втрачена пам'ять</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидві «з'їдають» RAM, але в різних місцях — і лікуються по-різному</text>
<rect x="60.0" y="78.0" width="16.0" height="16.0" rx="3" fill="#dbe4f7" stroke="#1f47b5" stroke-width="1.4"/>
<text x="82.0" y="91.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зайнято (корисні дані)</text>
<rect x="280.0" y="78.0" width="16.0" height="16.0" rx="3" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="302.0" y="91.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вільно (можна видати)</text>
<rect x="500.0" y="78.0" width="16.0" height="16.0" rx="3" fill="#f7dcd9" stroke="#c0271e" stroke-width="1.4"/>
<text x="522.0" y="91.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">втрачено (марно зайнято)</text>
