<text x="70.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">купа 128 Б після багатьох alloc/free:</text>
<path d="M70.0,210.0 Q70.0,217.0 78.0,217.0 L234.8,217.0 Q242.8,217.0 242.8,221.0 Q242.8,217.0 250.8,217.0 L407.6,217.0 Q415.6,217.0 415.6,210.0" fill="none" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="242.8" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільно сумарно: 60 Б — місця ніби досить</text>
<text x="70.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">запит malloc(40):</text>
<rect x="70.0" y="276.0" width="108.0" height="30.0" rx="0" fill="none" stroke="#c0271e" stroke-width="2"/>
<text x="124.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">40 Б поспіль</text>
<text x="70.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">найбільший суцільний вільний = 18 Б</text>
<text x="70.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">40 &gt; 18  →  malloc ПОВЕРТАЄ NULL,</text>
<text x="70.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">хоча сумарно вільного більше за 40</text>
<text x="70.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Втрата = між блоками (вільне роздроблене)</text>
<rect x="524.0" y="118.0" width="400.0" height="360.0" rx="12" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="724.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ВНУТРІШНЯ (internal)</text>
<text x="540.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">просили 30 Б, allocator видав цілий блок:</text>
<rect x="540.0" y="166.0" width="58.9" height="40.0" rx="0" fill="#f7dcd9" stroke="#c0271e" stroke-width="1.3"/>
<text x="569.4" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">8</text>
<rect x="598.9" y="166.0" width="220.8" height="40.0" rx="0" fill="#dbe4f7" stroke="#1f47b5" stroke-width="1.3"/>
<text x="709.3" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">30</text>
<rect x="819.7" y="166.0" width="73.6" height="40.0" rx="0" fill="#f7dcd9" stroke="#c0271e" stroke-width="1.3"/>
<text x="856.5" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">10</text>
<text x="538.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">8 Б</text>
<text x="709.3" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">30 Б корисних</text>
<text x="856.5" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">+10 Б</text>
<path d="M540.0,230.0 Q540.0,237.0 548.0,237.0 L708.6,237.0 Q716.6,237.0 716.6,241.0 Q716.6,237.0 724.6,237.0 L885.3,237.0 Q893.3,237.0 893.3,230.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="716.6" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">реально зайнято в RAM = 48 Б</text>
<text x="540.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">заголовок:        8 Б (службова бухгалтерія)</text>
<text x="540.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">вирівнювання:  +10 Б (до кратного 16)</text>
<line x1="540.0" y1="320.0" x2="840.0" y2="320.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="540.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">марно витрачено = 18 Б на 30 корисних</text>
<text x="540.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">це 18 / 48 ≈ 38 % блоку — у нікуди</text>
<text x="540.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Втрата = всередині блоку (округлення вгору)</text>
<line x1="60.0" y1="556.0" x2="880.0" y2="556.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="470.0" y="578.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зовнішня: вільне роздроблене МІЖ блоками · Внутрішня: видали БІЛЬШЕ, ніж просили — лишок гине ВСЕРЕДИНІ</text>
</svg>
