<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424">
<rect width="880" height="424" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек і купа ростуть НАЗУСТРІЧ — щоб ділити один вільний простір</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва міняються в розмірі по ходу програми, тож їх ставлять з протилежних кінців вільної пам'яті</text>
<rect x="320.0" y="90.0" width="240.0" height="56.0" rx="0" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="440.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">СТЕК</text>
<text x="440.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виклики, локальні</text>
<line x1="440.0" y1="150.0" x2="440.0" y2="200.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="454.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">росте вниз</text>
<rect x="320.0" y="210.0" width="240.0" height="70.0" rx="0" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="440.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">вільний простір</text>
<line x1="440.0" y1="340.0" x2="440.0" y2="290.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="454.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">росте вгору</text>
<rect x="320.0" y="344.0" width="240.0" height="56.0" rx="0" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="440.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">КУПА</text>
<text x="440.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">динамічні дані</text>
<rect x="600.0" y="120.0" width="260.0" height="240.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="730.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Чому назустріч?</text>
<text x="620.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• обидва міняють розмір на льоту</text>
<text x="620.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• наперед не знати, кому скільки треба</text>
<text x="620.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• з протилежних кінців кожен бере</text>
<text x="620.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   стільки, скільки треба, з ОДНОГО</text>
<text x="620.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   спільного запасу — гнучко</text>
<text x="620.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="620.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• небезпека: якщо вони ЗІЙДУТЬСЯ —</text>
<text x="620.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">   зіткнення (переповнення, §19.7)</text>
<text x="440.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Поки між ними є вільне місце — усе гаразд. Біда, коли стек дороста до купи (або навпаки): про це §19.7.</text>
</svg>
