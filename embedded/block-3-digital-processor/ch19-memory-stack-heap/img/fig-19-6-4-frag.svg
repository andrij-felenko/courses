<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головна біда купи: фрагментація</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">після багатьох «взяти-повернути» вільне місце дробиться на дрібні розкидані шматки — і великий блок уже нікуди покласти</text>
<text x="90.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">спочатку — суцільний вільний простір:</text>
<rect x="90.0" y="104.0" width="720.0" height="28.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільно</text>
<text x="90.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">після багатьох allocate/free — «дірки» між зайнятими блоками:</text>
<rect x="90.0" y="176.0" width="120.0" height="28.0" rx="0" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="150.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">■</text>
<rect x="210.0" y="176.0" width="70.0" height="28.0" rx="0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="245.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="280.0" y="176.0" width="90.0" height="28.0" rx="0" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="325.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">■</text>
<rect x="370.0" y="176.0" width="60.0" height="28.0" rx="0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="400.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="430.0" y="176.0" width="110.0" height="28.0" rx="0" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="485.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">■</text>
<rect x="540.0" y="176.0" width="80.0" height="28.0" rx="0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="580.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<rect x="620.0" y="176.0" width="100.0" height="28.0" rx="0" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="670.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">■</text>
<rect x="720.0" y="176.0" width="90.0" height="28.0" rx="0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="765.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">·</text>
<text x="816.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<rect x="90.0" y="240.0" width="300.0" height="30.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="240.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">запит: блок на 200 байтів</text>
<text x="410.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✘ НЕ влазить!</text>
<text x="90.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вільного загалом ВИСТАЧАЄ (70+60+80+90 = 300), та немає суцільного шматка на 200 поспіль.</text>
<rect x="60.0" y="320.0" width="780.0" height="110.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це «зовнішня фрагментація»: пам'ять є, але роздроблена. Як паркінг із проміжками, у який не влазить автобус,</text>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">хоч вільних місць сумарно й багато. Виділення може зазнати невдачі попри «достатню» вільну пам'ять.</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Що довше працює програма з безладними alloc/free різних розмірів, то гірша фрагментація — поступово, непомітно.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На великих системах із цим борються (ущільнення, пули блоків); на крихітному МК це особливо небезпечно (нижче).</text>
</svg>
