<text x="470.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4610 − 514 = 4096 = 2¹²   —   додалося рівно «одне коліщатко» дванадцятого розряду</text>
<rect x="70.0" y="372.0" width="800.0" height="102.0" rx="10" fill="#fff8ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="470.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">Саме степінь двійки — головна «прикмета» одиничного бітового збою:</text>
<text x="92.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• помилка, рівна 2ᵏ (2, 4, 8 … 4096 …), означає: перекинувся РІВНО ОДИН біт у розряді k — дуже характерний слід;</text>
<text x="92.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• «людські» помилки (описка, подвійний підрахунок, зсув коми) дають інші числа, не круглі степені двійки;</text>
<text x="92.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тому експерти впевнено сказали: «перекинувся один біт». А ОСЬ ЧОМУ він перекинувся — це вже окреме питання (Рис. 3.9.1i.3).</text>
</svg>
