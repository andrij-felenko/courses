<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
<rect width="960" height="470" fill="#ffffff"/>
<defs>
  <marker id="cInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="cRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="cGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="cBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Перший байт» ECC: де інженер реально його бачить</text>
<text x="480.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ECC працює мовчки — поки росте лічильник виправлень; коли помилку вже не виправити, з'являється видима подія</text>
<rect x="40.0" y="86.0" width="281.3" height="150.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="180.7" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1 біт → тихо виправлено</text>
<line x1="54.0" y1="124.0" x2="307.3" y2="124.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="54.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Дані для програми чисті.</text>
<text x="54.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Слід лишається тільки</text>
<text x="54.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у лічильнику CE.</text>
<line x1="323.3" y1="161.0" x2="337.3" y2="161.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#cInk)"/>
<rect x="339.3" y="86.0" width="281.3" height="150.0" rx="10" fill="#faf3e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Лічильник CE росте</text>
<line x1="353.3" y1="124.0" x2="606.7" y2="124.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="353.3" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Багато виправлень з однієї</text>
<text x="353.3" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">адреси — комірка/чіп слабне.</text>
<text x="353.3" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Час замислитись, ще не біда.</text>
<line x1="622.7" y1="161.0" x2="636.7" y2="161.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#cInk)"/>
<rect x="638.7" y="86.0" width="281.3" height="150.0" rx="10" fill="#fbeceb" stroke="#c0271e" stroke-width="1.8"/>
<text x="779.3" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Uncorrectable (UE)</text>
<line x1="652.7" y1="124.0" x2="906.0" y2="124.0" stroke="#c0271e" stroke-width="1.2" stroke-linecap="round"/>
<text x="652.7" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Двох+ біт не виправити.</text>
<text x="652.7" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Прапор у статусі, запис у лог,</text>
<text x="652.7" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">machine-check / помилка читання.</text>
<text x="40.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Де подивитися на практиці:</text>
<rect x="40.0" y="276.0" width="281.3" height="120.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="52.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Сервер (RAM)</text>
<line x1="52.0" y1="308.0" x2="309.3" y2="308.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="52.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">EDAC / mcelog у Linux:</text>
<text x="52.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ce_count, ue_count на канал —</text>
<text x="52.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">скільки виправлено й скільки</text>
<text x="52.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">фатальних.</text>
<rect x="339.3" y="276.0" width="281.3" height="120.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="351.3" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SSD / eMMC</text>
<line x1="351.3" y1="308.0" x2="608.7" y2="308.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="351.3" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">SMART-атрибути накопичувача:</text>
<text x="351.3" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лічильники ECC-виправлень і</text>
<text x="351.3" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">нескоригованих секторів через</text>
<text x="351.3" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">S.M.A.R.T.</text>
<rect x="638.7" y="276.0" width="281.3" height="120.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="650.7" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">МК (вбудований Flash)</text>
<line x1="650.7" y1="308.0" x2="908.0" y2="308.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="650.7" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">status-регістр контролера флешу:</text>
<text x="650.7" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">біти на кшталт ECC-correctable та</text>
<text x="650.7" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ECC-error (двобітна) + адреса збою.</text>
</svg>
