<text x="70.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зіпсовані символи: він виправляє їх до своєї межі (для RS(255,223) — аж 16 символів на блок),</text>
