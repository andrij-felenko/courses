<rect x="40.0" y="440.0" width="840.0" height="44.0" rx="10" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="460.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ось і вся таємниця: подряпина на CD чи пляма на QR — це сплеск, що псує БАГАТО бітів, але МАЛО символів.</text>
<text x="460.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Символьний код Рід–Соломона саме на сплески й розрахований — тому носій терпить ушкодження й читається далі.</text>
</svg>
