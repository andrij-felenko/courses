<text x="460.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ось чому подряпаний диск ще грає, а заляпаний QR ще читається: сплеск псує мало СИМВОЛІВ, хай і багато бітів</text>
<text x="40.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Код, що рахує БІТАМИ (як Геммінг (7,4), §3.9.6): сплеск перевищує його стелю</text>
