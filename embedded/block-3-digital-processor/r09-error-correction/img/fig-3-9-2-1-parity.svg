<text x="150.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одиниць у даних = 4 (непарно)</text>
<text x="150.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">щоб разом стало ПАРНО, ставимо P = 0</text>
<text x="150.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">тепер одиниць = 4 — парно ✓ (even parity)</text>
<line x1="60.0" y1="338.0" x2="820.0" y2="338.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="60.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Приймач рахує одиниці в усіх 8 бітах:</text>
<text x="80.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">• сума парна  → помилки (однієї) не було</text>
<text x="80.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• сума непарна → один біт перевернувся — кадр битий!</text>
<text x="80.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Самого P досить, щоб ПОБАЧИТИ помилку, але не щоб знати ДЕ вона.</text>
