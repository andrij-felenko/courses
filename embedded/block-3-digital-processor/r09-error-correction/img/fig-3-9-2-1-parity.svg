<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Біт парності: один зайвий біт робить кількість одиниць парною</text>
<text x="440.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">парність (parity) = XOR усіх бітів даних (§3.2.4); додаємо його — і одиниць стає парне число</text>
