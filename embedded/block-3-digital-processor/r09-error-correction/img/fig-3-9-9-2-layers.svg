<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шари захисту в реальному пакеті — місток до Модуля 6 (зв'язок)</text>
<text x="440.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коди не змагаються — вони складаються в шари: кожен ловить те, що пропустив попередній</text>
<rect x="90.0" y="95.0" width="700.0" height="58.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="2"/>
<text x="108.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">байт у пам'яті / комірці</text>
<text x="108.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ловить: поодинокі біт-фліпи в RAM і Flash</text>
<rect x="570.0" y="107.0" width="200.0" height="34.0" rx="7" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="670.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ECC (Геммінг/BCH)</text>
<rect x="90.0" y="167.0" width="700.0" height="58.0" rx="8" fill="#fff" stroke="#7a3da8" stroke-width="2"/>
<text x="108.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">символи на носії / в радіоканалі</text>
<text x="108.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ловить: пакетні помилки, завмирання, подряпини</text>
<rect x="570.0" y="179.0" width="200.0" height="34.0" rx="7" fill="#fbfbfb" stroke="#7a3da8" stroke-width="1.6"/>
<text x="670.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">Рід–Соломон / FEC</text>
<rect x="90.0" y="239.0" width="700.0" height="58.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="108.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кадр на шині / у протоколі</text>
<text x="108.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ловить: усе, що проскочило крізь канал</text>
<rect x="570.0" y="251.0" width="200.0" height="34.0" rx="7" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.6"/>
<text x="670.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">CRC</text>
<rect x="90.0" y="311.0" width="700.0" height="58.0" rx="8" fill="#fff" stroke="#caa24a" stroke-width="2"/>
<text x="108.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">логічний пакет (заголовок+дані)</text>
<text x="108.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ловить: груба перевірка структури, дешево</text>
<rect x="570.0" y="323.0" width="200.0" height="34.0" rx="7" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.6"/>
<text x="670.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">checksum / парність полів</text>
<text x="440.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">У Модулі 6 ці кадри з CRC, довжиною й заголовком ми зберемо в повноцінні протоколи зв'язку. Тут — їхній фундамент.</text>
</svg>
