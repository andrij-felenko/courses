<text x="340.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">sum1 = 21</text>
<text x="540.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">sum2 = 10</text>
<line x1="60.0" y1="366.0" x2="820.0" y2="366.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="60.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Чому Флетчер ловить те, що проста сума пропускає:</text>
<text x="80.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• байт на позиції 1 додається до sum1 чотири рази (на кожному наступному кроці теж),</text>
<text x="80.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  а байт на позиції 4 — лише раз. Тож переставлені байти дають ІНШУ sum2.</text>
<text x="80.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Ціна — вдвічі ширша контрольна сума й трохи більше обчислень. Виявлення майже як у CRC, дешевше.</text>
