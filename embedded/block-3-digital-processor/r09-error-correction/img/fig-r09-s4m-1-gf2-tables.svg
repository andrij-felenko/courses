<text x="766.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">↑ поклітинно збігається з «+» ліворуч</text>
<rect x="60.0" y="300.0" width="820.0" height="100.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="470.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому віднімання не потрібне окремо</text>
<text x="90.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">У звичайних числах a − b = a + (−b), і знак мінус указує «протилежне» число. У GF(2) протилежного шукати</text>
<text x="90.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не доводиться: з таблиці «+» видно, що 1 + 1 = 0, тобто кожне число САМЕ СОБІ протилежне (−1 = 1, −0 = 0).</text>
<rect x="60.0" y="432.0" width="820.0" height="64.0" rx="12" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="458.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">a + a = 0      ⇒      −a = a      ⇒      a − b  =  a + b  =  a ⊕ b</text>
<text x="470.0" y="482.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один знак ⊕ виконує і плюс, і мінус — звідси вся простота арифметики CRC.</text>
</svg>
