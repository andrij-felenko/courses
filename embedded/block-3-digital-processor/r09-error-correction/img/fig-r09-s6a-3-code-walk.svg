<text x="60.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Кожен рядок — одна група. Одиниці в рядку = позиції, що в неї входять.</text>
<text x="60.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Стовпець читається як ДВІЙКОВА адреса позиції: тому синдром і дорівнює номеру збою.</text>
<text x="60.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Ті самі рядки — як бітові маски в коді (біт i ↔ позиція i+1):</text>
<text x="60.0" y="334.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal">M1 = 0x55   (біти позицій 1,3,5,7)</text>
<text x="60.0" y="352.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal">M2 = 0x66   (біти позицій 2,3,6,7)</text>
<text x="60.0" y="370.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal">M4 = 0x78   (біти позицій 4,5,6,7)</text>
<text x="560.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Куди ці маски йдуть у коді (30 рядків)</text>
<rect x="560.0" y="104.0" width="340.0" height="132.0" rx="10" fill="#fcfcfc" stroke="#1f8a3b" stroke-width="2"/>
<rect x="560.0" y="104.0" width="340.0" height="26.0" rx="10" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="574.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal">КОДЕР</text>
<text x="576.0" y="154.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">для кожної маски Mi:</text>
<text x="576.0" y="176.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">  pi = parity( word &amp; Mi )</text>
<text x="576.0" y="198.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">  вписати pi у свою позицію</text>
<text x="576.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">три XOR-згортки → 3 контрольні біти</text>
<rect x="560.0" y="250.0" width="340.0" height="132.0" rx="10" fill="#fcfcfc" stroke="#7a3ea8" stroke-width="2"/>
<rect x="560.0" y="250.0" width="340.0" height="26.0" rx="10" fill="#7a3ea8" stroke="#7a3ea8" stroke-width="0"/>
<text x="574.0" y="269.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal">СИНДРОМ</text>
<text x="576.0" y="300.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">для кожної маски Mi:</text>
<text x="576.0" y="322.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">  si = parity( recv &amp; Mi )</text>
<text x="576.0" y="344.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">  syndrome |= si &lt;&lt; (адреса pi)</text>
<text x="576.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7a3ea8" text-anchor="start" font-weight="normal" font-style="italic">ті самі три згортки → число-адреса</text>
<rect x="560.0" y="396.0" width="340.0" height="132.0" rx="10" fill="#fcfcfc" stroke="#c0271e" stroke-width="2"/>
<rect x="560.0" y="396.0" width="340.0" height="26.0" rx="10" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="574.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal">ВИПРАВЛЕННЯ</text>
<text x="576.0" y="446.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">if (syndrome != 0)</text>
<text x="576.0" y="468.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">  recv ^= 1 &lt;&lt; (syndrome - 1)</text>
<text x="576.0" y="490.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">дані = біти з позицій 3,5,6,7</text>
<text x="576.0" y="516.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">один XOR перевертає зламаний біт</text>
<line x1="311.0" y1="384.0" x2="546.0" y2="178.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="435.5" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ті самі 3 маски</text>
<rect x="60.0" y="630.0" width="840.0" height="52.0" rx="9" fill="#f0fff2" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="80.0" y="652.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Чому 30 рядків вистачає:</text>
<text x="80.0" y="672.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">три фази — це триразове застосування трьох масок. Жодних таблиць і циклів пошуку: синдром сам показує адресу. Розширити до SECDED (§3.9.7) — це один зайвий загальний біт парності.</text>
</svg>
