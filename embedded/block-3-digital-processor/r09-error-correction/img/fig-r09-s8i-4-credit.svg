<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чия заслуга: код, декодер, каскад і політ — чотири ланки, жодного одинокого генія</text>
<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сам код був безсилий без придатного декодера, а в космос його вивів ще й каскад — це праця кількох рук</text>
<rect x="20.0" y="86.0" width="214.0" height="268.0" rx="10" fill="#fff" stroke="#c0271e" stroke-width="2.4"/>
<rect x="20.0" y="86.0" width="214.0" height="8.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<circle cx="127.0" cy="140.0" r="15.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<path d="M103.0,180 Q127.0,152 151.0,180" fill="none" stroke="#c0271e" stroke-width="2.6"/>
<text x="127.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рід і Соломон, 1960</text>
<text x="127.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">математики, Lincoln Lab</text>
<text x="127.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">5-сторінкова стаття</text>
<text x="127.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">«Polynomial Codes over Certain</text>
<text x="127.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">Finite Fields» дала сам КОД:</text>
<text x="127.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">лічити символами, а не бітами</text>
<line x1="230.3" y1="216.0" x2="252.3" y2="216.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="248.7" y="86.0" width="214.0" height="268.0" rx="10" fill="#fff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="248.7" y="86.0" width="214.0" height="8.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<circle cx="355.7" cy="140.0" r="15.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<path d="M331.66666666666663,180 Q355.66666666666663,152 379.66666666666663,180" fill="none" stroke="#1f47b5" stroke-width="2.6"/>
<text x="355.7" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Берлекамп і Мессі, ~1969</text>
<text x="355.7" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ Пітерсон та інші</text>
<text x="355.7" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">придумали швидкий ДЕКОДЕР. Без</text>
<text x="355.7" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">нього код був гарною теорією,</text>
<text x="355.7" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">та надто важкою, щоб рахувати</text>
<text x="355.7" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">її на практиці</text>
<line x1="459.0" y1="216.0" x2="481.0" y2="216.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="477.3" y="86.0" width="214.0" height="268.0" rx="10" fill="#fff" stroke="#caa24a" stroke-width="2.4"/>
<rect x="477.3" y="86.0" width="214.0" height="8.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<rect x="558.3" y="134.0" width="22.0" height="18.0" rx="2" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<rect x="588.3" y="134.0" width="22.0" height="18.0" rx="2" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<line x1="580.3" y1="143.0" x2="586.3" y2="143.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="584.3" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Форні та теорія каскадів</text>
<text x="584.3" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея concatenated code</text>
<text x="584.3" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">показали, як скласти два коди</text>
<text x="584.3" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">шарами, щоб зовнішній замітав</text>
<text x="584.3" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">сплески за внутрішнім — основа</text>
<text x="584.3" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">схеми Вояджера</text>
<line x1="687.7" y1="216.0" x2="709.7" y2="216.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="706.0" y="86.0" width="214.0" height="268.0" rx="10" fill="#fff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="706.0" y="86.0" width="214.0" height="8.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="813.0" y1="156.0" x2="813.0" y2="132.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M793.0,156 Q813.0,118 833.0,156" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="813.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">JPL і команди NASA</text>
<text x="813.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інженери далекого космосу</text>
<text x="813.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">звели код, декодер і каскад у</text>
<text x="813.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">реальний радіозв'язок</text>
<text x="813.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">Вояджерів — і він працює досі,</text>
<text x="813.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">за межами Сонячної системи</text>
<text x="470.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Код, декодер, каскад, політ — велике в техніці майже завжди збирається з внеску багатьох, а не одного імені</text>
</svg>
