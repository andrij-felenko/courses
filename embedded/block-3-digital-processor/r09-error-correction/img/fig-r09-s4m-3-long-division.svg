<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620">
<rect width="940" height="620" fill="#ffffff"/>
<defs>
  <marker id="mInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="mRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="mGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ділення многочленів над GF(2) «стовпчиком» — це і є обчислення CRC</text>
<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на кожному кроці віднімаємо (XOR) зсунутий дільник; жодних переносів і позик — кожен стовпчик сам по собі</text>
<text x="232.0" y="110.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">G = 1011</text>
<text x="232.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(x³+x+1)</text>
<text x="250.0" y="96.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1010000</text>
<text x="440.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ділене: повідомлення 1010 + три нулі під майбутній лишок</text>
<text x="250.0" y="126.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1011000</text>
<line x1="248.0" y1="132.0" x2="329.8" y2="132.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<text x="440.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">⊕ G, підведений під старшу 1 (позиція x⁶)</text>
<text x="250.0" y="156.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">0001000</text>
<text x="440.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= проміжок (старша 1 згасла)</text>
<text x="250.0" y="186.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">0001000</text>
<text x="440.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">старший біт = 0 ⇒ G не віднімаємо, зсуваємось далі</text>
<text x="250.0" y="216.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">0001000</text>
<text x="440.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">знову 0 ⇒ пропуск</text>
<text x="250.0" y="246.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">0001011</text>
<line x1="248.0" y1="252.0" x2="329.8" y2="252.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<text x="440.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">⊕ G, підведений під наступну 1 (позиція x³)</text>
<text x="250.0" y="276.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0000011</text>
<text x="440.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">= лишок: коротший за G, ділити більше нічим</text>
<text x="250.0" y="316.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CRC-3 = 011</text>
<text x="440.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">лишок коротший за дільник — це і є контрольна сума повідомлення 1010</text>
<rect x="600.0" y="88.0" width="312.0" height="360.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="756.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що тут відбувається</text>
<text x="618.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. До повідомлення дописуємо стільки</text>
<text x="618.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   нулів, який степінь у дільника G</text>
<text x="618.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (тут 3) — це місце під майбутній CRC.</text>
<text x="618.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="618.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. Ділимо стовпчиком: де старший біт</text>
<text x="618.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   проміжку = 1 — віднімаємо (XOR) G,</text>
<text x="618.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   зсунутий під цю одиницю; де 0 —</text>
<text x="618.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   просто йдемо до наступного біта.</text>
<text x="618.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="618.0" y="331.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. Що лишилось коротше за G — і є</text>
<text x="618.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   лишок R(x). Це й є контрольна сума.</text>
<rect x="618.0" y="374.0" width="276.0" height="60.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="756.0" y="396.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Передаємо: 1010 011</text>
<text x="756.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(повідомлення + лишок замість дописаних нулів)</text>
<rect x="60.0" y="470.0" width="820.0" height="120.0" rx="12" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Ключ до всього: «віднімання» тут — це XOR біт-у-біт</text>
<text x="90.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">У звичайному стовпчику віднімання тягне позики між розрядами. Над GF(2) позик немає: кожен стовпчик —</text>
<text x="90.0" y="544.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">окреме 1−1=0, 1−0=1, 0−1=1 — тобто рівно XOR. Тому весь поділ зводиться до зсувів і XOR, і його легко</text>
<text x="90.0" y="564.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">робить як кілька вентилів у залізі, так і кілька рядків коду на МК (бітовий цикл — це буквально ці кроки).</text>
</svg>
