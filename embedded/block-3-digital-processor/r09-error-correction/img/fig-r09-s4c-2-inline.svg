<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інша оселя того ж CRC: усередині контролерів CAN і SD він живе прямо на лінії</text>
<text x="460.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тут CRC не «лічильна послуга» для процесора, а вартовий на дроті: рахується сам, на льоту, повз ядро</text>
<text x="70.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Передавання кадру</text>
