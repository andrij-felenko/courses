<text x="275.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рахує CRC заново з прийнятих байтів</text>
