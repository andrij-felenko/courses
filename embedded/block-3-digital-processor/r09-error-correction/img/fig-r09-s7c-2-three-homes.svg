<line x1="490.0" y1="188.0" x2="490.0" y2="206.0" stroke="#c0271e" stroke-width="2" marker-end="url(#cRed)"/>
<rect x="362.7" y="208.0" width="254.7" height="22.0" rx="4" fill="#fbeceb" stroke="#c0271e" stroke-width="1.4"/>
<text x="490.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перевірка в залозі</text>
<text x="362.7" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Хто рахує:</text>
<text x="362.7" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">контролер NAND-флешу</text>
<text x="362.7" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Код:</text>
<text x="362.7" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">BCH або LDPC</text>
<text x="362.7" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Зерно:</text>
<text x="362.7" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">сектор 512 Б … 4 КБ</text>
<text x="362.7" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Контроль:</text>
<text x="362.7" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">десятки–сотні біт/сектор</text>
<text x="362.7" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Уміє:</text>
<text x="362.7" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">виправити багато біт</text>
<line x1="358.7" y1="492.0" x2="621.3" y2="492.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="358.7" y="510.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">NAND зношується й сипле</text>
<text x="358.7" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">помилками — без сильного ECC</text>
<text x="358.7" y="542.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">сектор не прочитати.</text>
