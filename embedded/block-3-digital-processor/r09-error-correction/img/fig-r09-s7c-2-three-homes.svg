<text x="490.0" y="144.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контролер SSD / eMMC</text>
<rect x="362.7" y="162.0" width="157.9" height="24.0" rx="4" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
