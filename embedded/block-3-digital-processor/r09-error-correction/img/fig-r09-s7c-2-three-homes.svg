<text x="883.6" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ECC</text>
<line x1="804.7" y1="188.0" x2="804.7" y2="206.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#cGreen)"/>
<rect x="677.3" y="208.0" width="254.7" height="22.0" rx="4" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="804.7" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перевірка в залозі</text>
<text x="677.3" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Хто рахує:</text>
<text x="677.3" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">блок ECC контролера флешу</text>
<text x="677.3" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Код:</text>
<text x="677.3" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SEC-DED на слово флешу</text>
<text x="677.3" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Зерно:</text>
<text x="677.3" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">слово 64–128 біт</text>
<text x="677.3" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Контроль:</text>
<text x="677.3" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">+6…8 біт на слово</text>
<text x="677.3" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Уміє:</text>
<text x="677.3" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 виправити, 2 помітити</text>
<line x1="673.3" y1="492.0" x2="936.0" y2="492.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="673.3" y="510.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Той код, що ви писали у флеш</text>
<text x="673.3" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">МК, читається назад уже</text>
<text x="673.3" y="542.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">перевіреним.</text>
<rect x="30.0" y="560.0" width="920.0" height="28.0" rx="8" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="490.0" y="579.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільне в усіх трьох: контрольні біти рахує спеціалізований блок, а не ваш код — ECC тут «безкоштовний» для програми.</text>
