<text x="804.7" y="144.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кеш-контролер флешу</text>
