<text x="490.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три домівки ECC у вашому залізі — і хто рахує контрольні біти</text>
<text x="490.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усюди той самий рецепт: до даних кладуть контрольні біти, а перевіряє їх спеціальний блок «на льоту», не процесор</text>
<rect x="30.0" y="78.0" width="290.7" height="470.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<rect x="30.0" y="78.0" width="290.7" height="44.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="175.3" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Серверна RAM</text>
<text x="175.3" y="144.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ECC-DIMM (72 біти)</text>
<rect x="48.0" y="162.0" width="157.9" height="24.0" rx="4" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="126.9" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ДАНІ</text>
<rect x="205.9" y="162.0" width="96.8" height="24.0" rx="4" fill="#fbeceb" stroke="#c0271e" stroke-width="1.4"/>
<text x="254.3" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ECC</text>
<line x1="175.3" y1="188.0" x2="175.3" y2="206.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#cBlue)"/>
<rect x="48.0" y="208.0" width="254.7" height="22.0" rx="4" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="175.3" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перевірка в залозі</text>
<text x="48.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Хто рахує:</text>
<text x="48.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">контролер пам'яті в CPU</text>
<text x="48.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Код:</text>
<text x="48.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SECDED (Геммінг + парність)</text>
<text x="48.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Зерно:</text>
<text x="48.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">64 біти даних</text>
<text x="48.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Контроль:</text>
<text x="48.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">+8 біт (9-й чіп)</text>
<text x="48.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Уміє:</text>
<text x="48.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 виправити, 2 помітити</text>
<line x1="44.0" y1="492.0" x2="306.7" y2="492.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="44.0" y="510.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Тиха помилка в комірці DRAM не</text>
<text x="44.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">дійде до програми — її ловить</text>
<text x="44.0" y="542.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">залізо.</text>
