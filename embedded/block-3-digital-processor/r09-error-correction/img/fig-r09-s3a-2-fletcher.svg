<text x="470.0" y="556.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контрольна сума Флетчера = (sum2 &lt;&lt; 8) | sum1 — два байти за один прохід даних.</text>
