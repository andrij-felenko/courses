<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600">
<rect width="940" height="600" fill="#ffffff"/>
<defs>
  <marker id="cInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="cRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="cGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Internet checksum (RFC 1071): сума 16-бітних слів із загорнутим переносом</text>
<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перенос за межі 16 біт не викидають, а додають назад знизу — тоді порядок слів неважливий</text>
<text x="120.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">слова даних (16 біт):</text>
<rect x="120.0" y="88.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="104.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0x4500</text>
<text x="284.0" y="105.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="119.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="135.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0x003C</text>
<text x="284.0" y="136.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="150.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="166.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0x1C46</text>
<text x="284.0" y="167.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="181.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="197.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0xAC10</text>
<text x="284.0" y="198.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="212.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="228.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0x0A63</text>
<text x="284.0" y="229.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="243.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="259.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0xAC10</text>
<text x="284.0" y="260.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="274.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="290.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0x0A0C</text>
<text x="284.0" y="291.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="116.0" y1="307.0" x2="300.0" y2="307.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="120.0" y="309.0" width="150.0" height="26.0" rx="5" fill="#faf3e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="195.0" y="325.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0x1CE11</text>
<text x="288.0" y="326.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">перевищило 16 біт — є перенос</text>
<text x="120.0" y="353.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">загортаємо перенос (end-around carry):</text>
<rect x="120.0" y="361.0" width="150.0" height="26.0" rx="5" fill="#eef2fb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="195.0" y="377.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0xCE11</text>
<text x="284.0" y="378.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="120.0" y="392.0" width="150.0" height="26.0" rx="5" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="195.0" y="408.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0x0001</text>
<text x="288.0" y="409.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">↑ перенос, доданий ЗНИЗУ</text>
<line x1="116.0" y1="421.0" x2="300.0" y2="421.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="120.0" y="425.0" width="150.0" height="26.0" rx="5" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="195.0" y="441.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">0xCE12</text>
<text x="288.0" y="442.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">= згорнута сума (16 біт)</text>
<line x1="195.0" y1="455.0" x2="195.0" y2="475.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#cInk)"/>
<text x="288.0" y="473.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">інвертуємо біти (~)</text>
<rect x="120.0" y="479.0" width="150.0" height="26.0" rx="5" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="195.0" y="495.6" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0x31ED</text>
<text x="288.0" y="496.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">= КОНТРОЛЬНА СУМА (її і шлемо)</text>
<rect x="600.0" y="88.0" width="300.0" height="472.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="750.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На приймачі — той самий цикл,</text>
<text x="750.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">але вже з контрольною сумою</text>
<text x="622.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• сума всіх слів + chk</text>
<text x="622.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• → згортаємо перенос</text>
<text x="622.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• → інвертуємо</text>
<rect x="622.0" y="252.0" width="256.0" height="64.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="750.0" y="280.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">результат = 0x0000</text>
<text x="750.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">⇒ помилки не видно</text>
<text x="622.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Будь-яке ненульове значення —</text>
<text x="622.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">пакет пошкоджено.</text>
<line x1="622.0" y1="386.0" x2="878.0" y2="386.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="622.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чому загортають перенос:</text>
<text x="622.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">додавання з end-around carry</text>
<text x="622.0" y="455.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">комутативне й асоціативне —</text>
<text x="622.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сума не залежить від порядку</text>
<text x="622.0" y="497.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">слів, тож її легко рахувати</text>
<text x="622.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">хоч уперед, хоч назад по буферу.</text>
<rect x="60.0" y="568.0" width="820.0" height="26.0" rx="8" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="586.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся арифметика — у 16 бітах: складай слова, загортай перенос, наприкінці інвертуй.</text>
</svg>
