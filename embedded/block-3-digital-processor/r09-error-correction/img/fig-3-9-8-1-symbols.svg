<polygon points="304.0,92.0 426.0,92.0 436.0,172.0 294.0,172.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-dasharray="5 4"/>
<text x="365.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">подряпина / завмирання радіо</text>
<rect x="70.0" y="230.0" width="740.0" height="90.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="440.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для коду це лише 2 биті символи — байдуже, що зіпсуто всі 16 бітів усередині них.</text>
<text x="440.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">RS, що додав t контрольних символів, виправляє до t/2 битих символів — хоч де в них помилки.</text>
<text x="440.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">Бітовий код (Геммінг) тут захлинувся б: 16 помилок поспіль — це далеко за його межею.</text>
<text x="120.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">CD/DVD: подряпина — суцільний пакет помилок → RS вертає звук без чутного дефекту.</text>
<text x="120.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">QR-код: бруд чи затертий куток — теж пакет → RS читає код навіть при втраті частини.</text>
<text x="120.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Саме «символьність» робить RS королем носіїв і каналів із ПАКЕТНИМИ, а не поодинокими помилками.</text>
</svg>
