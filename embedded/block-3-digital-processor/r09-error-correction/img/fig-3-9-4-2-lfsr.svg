<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
<rect width="880" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо CRC: зсувний регістр зі зворотними XOR за одиницями полінома</text>
<text x="440.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поліном 1011 → XOR-крани там, де в ньому одиниці; біти даних «вливаються» по одному</text>
<rect x="250.0" y="150.0" width="90.0" height="56.0" rx="6" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="295.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D0</text>
<text x="295.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">біт 0</text>
<line x1="340.0" y1="178.0" x2="400.0" y2="178.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="400.0" y="150.0" width="90.0" height="56.0" rx="6" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="445.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D1</text>
<text x="445.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">біт 1</text>
<line x1="490.0" y1="178.0" x2="550.0" y2="178.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="550.0" y="150.0" width="90.0" height="56.0" rx="6" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="595.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D2</text>
<text x="595.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">біт 2</text>
<line x1="120.0" y1="178.0" x2="250.0" y2="178.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="120.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">біти даних →</text>
<line x1="640.0" y1="178.0" x2="670.0" y2="178.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="670.0" y1="178.0" x2="670.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="670.0" y1="260.0" x2="120.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="120.0" y1="260.0" x2="120.0" y2="178.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="370.0" cy="178.0" r="12.0" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="370.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">⊕</text>
<line x1="370.0" y1="260.0" x2="370.0" y2="190.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="440.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Кожен такт: зсув праворуч + XOR у «кранах». Після останнього біта в регістрі лежить готова CRC.</text>
<text x="440.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому CRC коштує апаратно майже нічого — і стоїть у CAN, Ethernet, SD, USB, у кадрах поверх UART.</text>
</svg>
