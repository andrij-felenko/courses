<text x="30.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">НА ЗЕМЛІ — знімаємо шари у зворотному порядку:</text>
