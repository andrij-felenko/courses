<text x="282.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">гасить рідкий шум</text>
<line x1="382.0" y1="326.0" x2="436.0" y2="326.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="438.0" y="300.0" width="210.0" height="52.0" rx="8" fill="#fbeeec" stroke="#c0271e" stroke-width="2.4"/>
<text x="543.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">декодер Рід–Соломона</text>
<text x="543.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">замітає СПЛЕСКИ символів</text>
<line x1="650.0" y1="326.0" x2="704.0" y2="326.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="706.0" y="300.0" width="150.0" height="52.0" rx="8" fill="#eafaee" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="781.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">чисті дані</text>
<text x="781.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">знімок без діри</text>
<rect x="30.0" y="384.0" width="880.0" height="150.0" rx="10" fill="#fff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="50.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">У чому хитрість каскаду (concatenated code):</text>
<text x="50.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Вітербі чудово витирає поодинокі похибки — але коли він таки помиляється, то зривається СЕРІЄЮ: лишає</text>
<text x="64.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не один зіпсований біт, а щільний сплеск підряд. Для побітових кодів така злита діра — найгірший випадок.</text>
<text x="50.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• Рід–Соломон рахує не біти, а СИМВОЛИ (байти). Цілий сплеск підряд псує лише кілька сусідніх символів —</text>
<text x="64.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">а виправити десяток зіпсованих символів йому однаково, лежать вони купкою чи врозсип. Сплеск його не лякає.</text>
<text x="50.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Підсумок: внутрішній код прибирає дрібний шум, зовнішній — підчищає рідкі сплески за ним. Разом — глибокий захист.</text>
</svg>
