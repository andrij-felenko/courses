<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Каскад двох кодів: один прикриває слабке місце іншого</text>
<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">так збудовано зв'язок Вояджерів — зовнішній Рід–Соломон + внутрішній згортковий код із декодером Вітербі</text>
<text x="30.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">НА БОРТУ — закутуємо дані у два шари захисту:</text>
