<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
<rect width="880" height="450" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Геометрія: дозволені слова — острівці, помилка зсуває нас від берега</text>
<text x="440.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що далі острівці один від одного (більше d), то більше помилок ми «бачимо» й «вертаємо»</text>
<line x1="270.0" y1="230.0" x2="610.0" y2="230.0" stroke="#e4e4e4" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="440.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відстань d між словами</text>
<circle cx="270.0" cy="230.0" r="70.0" fill="#eef7ef" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="610.0" cy="230.0" r="70.0" fill="#eef7ef" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="270.0" cy="230.0" r="15.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="270.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<circle cx="610.0" cy="230.0" r="15.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="610.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="270.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">куля A: радіус t</text>
<text x="610.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">куля B: радіус t</text>
<circle cx="308.0" cy="202.0" r="8.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="320.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">прийнято з помилкою</text>
<line x1="308.0" y1="202.0" x2="283.0" y2="220.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aRed)"/>
<text x="300.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">ближче до A → вертаємо в A ✓</text>
<line x1="60.0" y1="344.0" x2="820.0" y2="344.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="60.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Якщо помилок ≤ t = ⌊(d−1)/2⌋ — точка ще в «своїй» кулі → виправимо однозначно.</text>
<text x="60.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">Якщо помилок до d−1 — точка вийшла зі своєї кулі, але не дійшла чужої → бачимо, що щось не так (виявлення).</text>
<text x="60.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">Якщо помилок ≥ d — могли потрапити в ЧУЖУ кулю → приймемо хибне слово за правильне (тиха помилка).</text>
</svg>
