<text x="743.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="704.0" y="110.0" width="70.0" height="50.0" rx="7" fill="#fbeceb" stroke="#c0271e" stroke-width="1.8"/>
<text x="739.0" y="142.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="739.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">степінь 0</text>
<text x="144.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">байт:</text>
<text x="470.0" y="206.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">= 0b1101 0011 = 0xD3</text>
<rect x="60.0" y="250.0" width="820.0" height="58.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="470.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">цьому байту відповідає многочлен</text>
<text x="470.0" y="296.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">M(x) = x⁷ + x⁶ + x⁴ + x + 1</text>
<rect x="60.0" y="332.0" width="820.0" height="110.0" rx="12" fill="#faf3e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="470.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поліном-дільник (generator polynomial) CRC задають так само — рядком бітів</text>
<text x="470.0" y="386.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">приклад: CRC-8 з поліномом 0x07  →  G(x) = x⁸ + x² + x + 1</text>
<text x="470.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Степінь G(x) = 8 (старший біт x⁸ домовлено не пишуть у байті 0x07) ⇒ лишок займає 8 біт = CRC-8.</text>
<text x="470.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Саме степінь дільника задає ширину контрольної суми: степінь 16 → CRC-16, степінь 32 → CRC-32.</text>
</svg>
