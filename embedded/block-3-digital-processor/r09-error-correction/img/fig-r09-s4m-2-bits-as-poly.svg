<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">позиція біта = степінь x; одиниця означає «доданок є», нуль — «доданка немає»</text>
