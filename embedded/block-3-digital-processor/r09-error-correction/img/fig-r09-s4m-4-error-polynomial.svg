<svg xmlns="http://www.w3.org/2000/svg" width="940" height="514" viewBox="0 0 940 514">
<rect width="940" height="514" fill="#ffffff"/>
<defs>
  <marker id="mInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="mRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="mGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мова многочленів пояснює, ЯКІ помилки CRC гарантовано ловить</text>
<text x="470.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перешкода додає до кадру свій многочлен помилки E(x); CRC пропустить її лише тоді, коли G(x) ділить E(x)</text>
<rect x="70.0" y="96.0" width="250.0" height="56.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="195.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">передано T(x)</text>
<text x="195.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ділиться на G(x) націло</text>
<text x="360.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="400.0" y="96.0" width="250.0" height="56.0" rx="10" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="525.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">помилка E(x)</text>
<text x="525.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">одиниці там, де біти злетіли</text>
<text x="690.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<rect x="720.0" y="96.0" width="190.0" height="56.0" rx="10" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="815.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">прийнято R(x)</text>
<text x="815.0" y="140.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">= T(x) + E(x)</text>
<rect x="60.0" y="178.0" width="820.0" height="70.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="470.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приймач ділить R(x) на G(x). Оскільки T(x) ділиться без лишку, лишок дає сама лише E(x):</text>
<text x="470.0" y="230.0" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">R(x) mod G(x) = E(x) mod G(x)   →   помилка непомітна  ⇔  G(x) ділить E(x)</text>
<rect x="70.0" y="282.0" width="360.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="82.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Клас помилки E(x)</text>
<rect x="430.0" y="282.0" width="250.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="555.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому G(x) її не ділить</text>
<rect x="680.0" y="282.0" width="190.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="775.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гарантія</text>
<rect x="70.0" y="316.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="340.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Будь-який 1 перевернутий біт</text>
<rect x="430.0" y="316.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="340.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">E(x) = xⁱ, а дільник має ≥ 2 доданки</text>
<rect x="680.0" y="316.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="775.0" y="340.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">завжди</text>
<rect x="70.0" y="356.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="380.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Будь-які 2 перевернуті біти</text>
<rect x="430.0" y="356.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="380.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">беруть примітивний G(x) із ≥ 3 доданками</text>
<rect x="680.0" y="356.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="775.0" y="380.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">у межах кадру</text>
<rect x="70.0" y="396.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="420.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Непарне число помилок</text>
<rect x="430.0" y="396.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="420.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">беруть G(x), кратний (x + 1)</text>
<rect x="680.0" y="396.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="775.0" y="420.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">завжди</text>
<rect x="70.0" y="436.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="460.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Серія (burst) завдовжки ≤ степінь G</text>
<rect x="430.0" y="436.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="460.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коротша за G ⇒ не ділиться на G націло</text>
<rect x="680.0" y="436.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="775.0" y="460.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">завжди</text>
<text x="470.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому поліноми CRC (CRC-8/16/32) не випадкові: їх добирають так, щоб E(x) найчастіших помилок не ділилось на G(x).</text>
</svg>
