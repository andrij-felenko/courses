<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<rect width="900" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вибір CRC: ширина вирішує, скільки помилок видно; параметри вирішують сумісність</text>
<rect x="30.0" y="60.0" width="270.0" height="168.0" rx="10" fill="#fcfcfc" stroke="#1f47b5" stroke-width="2.2"/>
<rect x="30.0" y="60.0" width="270.0" height="30.0" rx="10" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="165.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">CRC-8</text>
<text x="46.0" y="112.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold">поліном 0x07</text>
<text x="46.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ширина остачі: 8 біт</text>
<line x1="44.0" y1="142.0" x2="286.0" y2="142.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="46.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">де у курсі:</text>
<text x="46.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">короткі кадри: давачі по I²C/CAN,</text>
<text x="46.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">рядки конфігурації</text>
<text x="46.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">що ловить:</text>
<text x="284.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="normal" font-style="normal">ловить усі сплески ≤ 8 біт;</text>
<text x="284.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="normal" font-style="normal">хибний пропуск ≈ 1 на 2⁸</text>
<rect x="315.0" y="60.0" width="270.0" height="168.0" rx="10" fill="#fcfcfc" stroke="#1f8a3b" stroke-width="2.2"/>
<rect x="315.0" y="60.0" width="270.0" height="30.0" rx="10" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="450.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">CRC-16</text>
<text x="331.0" y="112.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold">поліном 0x1021</text>
<text x="331.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ширина остачі: 16 біт</text>
<line x1="329.0" y1="142.0" x2="571.0" y2="142.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="331.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">де у курсі:</text>
<text x="331.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пакети поверх UART, Modbus,</text>
<text x="331.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">карти пам'яті (§3.9.4)</text>
<text x="331.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">що ловить:</text>
<text x="569.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal">усі сплески ≤ 16 біт;</text>
<text x="569.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal">хибний пропуск ≈ 1 на 2¹⁶</text>
<rect x="600.0" y="60.0" width="270.0" height="168.0" rx="10" fill="#fcfcfc" stroke="#7a3ea8" stroke-width="2.2"/>
<rect x="600.0" y="60.0" width="270.0" height="30.0" rx="10" fill="#7a3ea8" stroke="#7a3ea8" stroke-width="0"/>
<text x="735.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">CRC-32</text>
<text x="616.0" y="112.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a3ea8" text-anchor="start" font-weight="bold">поліном 0x04C11DB7</text>
<text x="616.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ширина остачі: 32 біти</text>
<line x1="614.0" y1="142.0" x2="856.0" y2="142.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="616.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">де у курсі:</text>
<text x="616.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ethernet-кадри, ZIP/PNG,</text>
<text x="616.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">великі блоки сховища</text>
<text x="616.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">що ловить:</text>
<text x="854.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3ea8" text-anchor="end" font-weight="normal" font-style="normal">усі сплески ≤ 32 біт;</text>
<text x="854.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3ea8" text-anchor="end" font-weight="normal" font-style="normal">хибний пропуск ≈ 1 на 2³²</text>
<text x="450.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ширша остача — рідший хибний пропуск і довший гарантовано спійманий сплеск, але більше байтів і такти/таблиця.</text>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому дві коректні реалізації CRC-32 дають різні числа: однакового полінома замало</text>
<rect x="30.0" y="300.0" width="270.0" height="96.0" rx="9" fill="#fff" stroke="#c0271e" stroke-width="1.8"/>
<text x="165.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">init</text>
<text x="165.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чим заряджено регістр</text>
<text x="165.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перед першим байтом</text>
<text x="165.0" y="374.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0xFFFFFFFF</text>
<text x="165.0" y="388.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">чи 0x00000000</text>
<rect x="315.0" y="300.0" width="270.0" height="96.0" rx="9" fill="#fff" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">refin / refout</text>
<text x="450.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чи перевертати порядок</text>
<text x="450.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бітів у байті й на виході</text>
<text x="450.0" y="374.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">так / ні</text>
<text x="450.0" y="388.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">(MSB- чи LSB-first)</text>
<rect x="600.0" y="300.0" width="270.0" height="96.0" rx="9" fill="#fff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="735.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">xorout</text>
<text x="735.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чим XOR-нути остачу</text>
<text x="735.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">наприкінці</text>
<text x="735.0" y="374.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0xFFFFFFFF</text>
<text x="735.0" y="388.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">чи 0x00000000</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Поміняй будь-що одне — і число зміниться, хоч поліном той самий. Звідси «CRC не сходиться» між двома боками лінії.</text>
<text x="450.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Як обрати на практиці</text>
<circle cx="90.0" cy="476.0" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="106.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Є апаратний блок CRC у МК?</text>
<line x1="380.0" y1="476.0" x2="420.0" y2="476.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="430.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">так → беремо саме його поліном і параметри (§3.9.4c)</text>
<circle cx="90.0" cy="514.0" r="5.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="106.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Говоримо з готовим протоколом?</text>
<line x1="380.0" y1="514.0" x2="420.0" y2="514.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="430.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">так → копіюємо ВСІ параметри з його специфікації (CAN, Modbus, SD…)</text>
<circle cx="90.0" cy="552.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="1"/>
<text x="106.0" y="556.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Свій формат, кадри короткі?</text>
<line x1="380.0" y1="552.0" x2="420.0" y2="552.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<text x="430.0" y="556.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">CRC-8/16 таблицею — дешево по пам'яті й тактах</text>
<circle cx="90.0" cy="590.0" r="5.0" fill="#7a3ea8" stroke="#7a3ea8" stroke-width="1"/>
<text x="106.0" y="594.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Свій формат, блоки великі/критичні?</text>
<line x1="380.0" y1="590.0" x2="420.0" y2="590.0" stroke="#7a3ea8" stroke-width="2" marker-end="url(#aViol)"/>
<text x="430.0" y="594.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7a3ea8" text-anchor="start" font-weight="normal" font-style="normal">CRC-32 — найменший хибний пропуск</text>
<line x1="60.0" y1="600.0" x2="840.0" y2="600.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="450.0" y="622.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Головне правило сумісності: CRC задають не лише поліном, а й init, refin/refout і xorout — звіряти треба всю п'ятірку.</text>
</svg>
