  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fa0"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому на висоті й у космосі біти перекидаються частіше: тоншає щит атмосфери</text>
<text x="480.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на рівні моря нас прикриває ~10 м водяного еквівалента повітря; що вище — то тонший щит і густіший потік частинок</text>
<line x1="96.0" y1="470.0" x2="96.0" y2="96.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="96.0" y1="470.0" x2="470.0" y2="470.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="36.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">висота</text>
<text x="36.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(км)</text>
<text x="464.0" y="492.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">потік нейтронів</text>
<text x="464.0" y="506.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(лог-шкала →)</text>
<line x1="92.0" y1="470.0" x2="100.0" y2="470.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="86.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">0  рівень моря</text>
<line x1="92.0" y1="438.2" x2="100.0" y2="438.2" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="86.0" y="442.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">3  гора</text>
<line x1="92.0" y1="342.9" x2="100.0" y2="342.9" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="86.0" y="346.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">12  ешелон літака</text>
<line x1="92.0" y1="279.4" x2="100.0" y2="279.4" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="86.0" y="283.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">18  максимум Пфотцера</text>
<line x1="92.0" y1="152.4" x2="100.0" y2="152.4" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="86.0" y="156.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">30  стратостат</text>
<polyline points="132.0,470.0 182.4,438.2 247.2,406.5 312.0,374.7 362.4,342.9 405.6,311.2 434.4,279.4 405.6,237.1 362.4,194.7 319.2,152.4 283.2,110.0" fill="none" stroke="#c0271e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">рівень моря</text>
<circle cx="434.4" cy="279.4" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="444.4" y="273.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">пік ~18 км:</text>
<text x="444.4" y="287.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">далі повітря замало,</text>
<text x="444.4" y="298.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">каскад згасає</text>
<rect x="102.0" y="360.7" width="150.0" height="40.0" rx="6" fill="#fff8ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="177.0" y="376.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">у нижніх шарах:</text>
<text x="177.0" y="390.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">≈ ×2 на кожні ~1.5 км</text>
<text x="276.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тонший щит → густіший потік</text>
<text x="726.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порядок темпу збоїв відносно рівня моря (×)</text>
<rect x="540.0" y="108.0" width="372.0" height="54.0" rx="9" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="556.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">рівень моря</text>
<text x="556.0" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">опорна точка (NYC, JEDEC)</text>
<text x="896.0" y="141.0" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">× 1</text>
<rect x="540.0" y="172.0" width="372.0" height="54.0" rx="9" fill="#f4f7fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="556.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">гора ~3 км</text>
<text x="556.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">порядок величини більше</text>
<text x="896.0" y="205.0" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">× ~10</text>
<rect x="540.0" y="236.0" width="372.0" height="54.0" rx="9" fill="#fff8ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="556.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">літак ~12 км</text>
<text x="556.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">сотні разів (за висотою/широтою)</text>
<text x="896.0" y="269.0" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">× ~300</text>
<rect x="540.0" y="300.0" width="372.0" height="54.0" rx="9" fill="#faf7fd" stroke="#6a3fa0" stroke-width="1.6"/>
<text x="556.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">низька орбіта (LEO)</text>
<text x="556.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">над атмосферою; додаються прямі іони</text>
<text x="896.0" y="333.0" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#6a3fa0" text-anchor="end" font-weight="bold" font-style="normal">× ~10²–10³</text>
<rect x="540.0" y="364.0" width="372.0" height="54.0" rx="9" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="556.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">далекий космос</text>
<text x="556.0" y="407.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ні атмосфери, ні магнітосфери Землі</text>
<text x="896.0" y="397.0" font-family="Cascadia Mono, Consolas, monospace" font-size="16" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">× значно більше</text>
<text x="726.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">числа — порядкові орієнтири; точний множник залежить</text>
<text x="726.0" y="447.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від висоти, широти, фази сонячного циклу й екранування (перевірити)</text>
<rect x="96.0" y="494.0" width="808.0" height="70.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="480.0" y="517.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Практичний висновок для розробника</text>
<text x="480.0" y="537.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та сама плата, що роками не збоїть на столі, в авіоніці чи аеростаті ловитиме перевернуті біти помітно частіше, а на орбіті — постійно.</text>
<text x="480.0" y="555.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому висотна й космічна техніка не сподівається на «рідкість», а закладає коди корекції (§3.9.6–3.9.7) і захист живлення від SEL як норму.</text>
</svg>
