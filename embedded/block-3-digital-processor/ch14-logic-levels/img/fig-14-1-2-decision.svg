<text x="640.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">весь шумовий розкид — вище порога</text>
<rect x="70.0" y="408.0" width="740.0" height="34.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Огрубивши до «вище/нижче порога», цифра виграє визначеність там, де аналог приречений сумніватися.</text>
