<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий шумний сигнал: аналог лишається невизначеним, цифра вирішує</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">цифровий вхід питає лише «вище порога чи нижче» — і поки шум не дістав порога, відповідь тверда</text>
<text x="230.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АНАЛОГ: читаємо саме значення</text>
