<text x="270.0" y="214.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">шум ±0.15 В</text>
<text x="230.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">а скільки НАСПРАВДІ?</text>
<text x="230.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">шум невіддільний від значення</text>
<text x="640.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЦИФРА: вирішуємо 0 / 1</text>
