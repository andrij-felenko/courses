<text x="380.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Чому дзвенить: різкий фронт + паразитна L доріжки + ємність C входу = LC-контур.</text>
<text x="380.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Rs додає втрати (R) у контур → з недемпфованого LC робить демпфований RLC → коливання гасне.</text>
<text x="380.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b5742e" text-anchor="middle" font-weight="bold" font-style="normal">Ставлять Rs ВПРИТУЛ до виходу драйвера (джерела фронту), а не біля приймача.</text>
<text x="380.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Ціна: Rs разом із C трохи сповільнює фронт (τ = Rs·C) — тому беруть найменший R, що вже не дзвенить.</text>
