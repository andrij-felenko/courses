<rect x="70.0" y="350.0" width="740.0" height="56.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Усі ці завади додаються до сигналу вже ПІСЛЯ драйвера. Якщо їхня сума більша за запас —</text>
<text x="440.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">приймач провалюється в заборонену зону, і «1» може прочитатися як «0».</text>
