<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FTL — прошарок, що вдає диск над «незручною» NAND</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зверху система бачить рівні пронумеровані сектори; знизу — реальна NAND зі сторінками, блоками й дефектами</text>
