<text x="500.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«рівний диск»: читай/пиши будь-який сектор, перезаписуй на місці</text>
