<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три незалежні множники; «×2» — це DDR: одне слово на КОЖЕН фронт такту, а не на один</text>
