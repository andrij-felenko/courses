<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два способи говорити з карткою: простий SPI чи швидкий нативний SD</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий чіп розуміє обидва; SPI — повільніший, зате його має кожен МК, нативний SD — ширша шина й вища швидкість</text>
