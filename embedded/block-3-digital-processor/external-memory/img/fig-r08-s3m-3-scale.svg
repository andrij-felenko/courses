</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий закон, інший масштаб: чому в МК горло — сама шина</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пік = такт × ширина × множник; у ПК шина широка й швидка, у МК — вузька й послідовна</text>
<line x1="360.0" y1="80.0" x2="360.0" y2="370.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<text x="360.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">20 МБ/с</text>
<line x1="466.9" y1="80.0" x2="466.9" y2="370.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<text x="466.9" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">100 МБ/с</text>
<line x1="619.8" y1="80.0" x2="619.8" y2="370.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<text x="619.8" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1 ГБ/с</text>
<line x1="772.7" y1="80.0" x2="772.7" y2="370.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<text x="772.7" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10 ГБ/с</text>
<line x1="850.0" y1="80.0" x2="850.0" y2="370.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<text x="850.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">32 ГБ/с</text>
<text x="56.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">DDR4-3200, ПК-модуль</text>
<text x="56.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">64 біт × 1600 МГц × 2 (DDR)</text>
<rect x="360.0" y="100.0" width="475.2" height="30.0" rx="5" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="843.2" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">25.6 ГБ/с</text>
<text x="56.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Паралельна SDR-SDRAM у МК</text>
<text x="56.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">16 біт × 100 МГц × 1 (SDR)</text>
<rect x="360.0" y="170.0" width="152.9" height="30.0" rx="5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="520.9" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">200 МБ/с</text>
<text x="56.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Octal-PSRAM (OPI), 8 ліній</text>
<text x="56.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">8 біт × 100 МГц × 2 (DDR)</text>
<rect x="360.0" y="240.0" width="152.9" height="30.0" rx="5" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="520.9" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">200 МБ/с</text>
<text x="56.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Quad-SPI флеш/PSRAM, 4 лінії</text>
<text x="56.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">4 біт × 80 МГц × 1 (SDR)</text>
<rect x="360.0" y="310.0" width="46.0" height="30.0" rx="5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="414.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">40 МБ/с</text>
<text x="360.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Розрив із quad-SPI — сотні разів: 64 лінії проти 4 (×16), такт 1600 проти 80 МГц (×20), та ще ×2 за DDR.</text>
<rect x="50.0" y="410.0" width="820.0" height="96.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="1.6"/>
<text x="70.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що це означає на практиці: кадр дисплея</text>
<text x="70.0" y="458.0" font-family="Consolas, monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal">кадр 320×240×2 байт = 153.6 КБ;  60 кадрів/с → 9.2 МБ/с потрібно</text>
<text x="70.0" y="480.0" font-family="Consolas, monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal">quad-SPI @ 40 МБ/с → стелі вистачає; 800×480 RGB @60 → 46 МБ/с → вже впритул</text>
<text x="850.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">горло — шина, не формула</text>
</svg>
