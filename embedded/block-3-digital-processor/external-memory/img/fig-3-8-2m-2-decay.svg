<text x="450.0" y="462.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Стандарт JEDEC: оновити кожну комірку щонайменше раз на 64 мс (за спеки понад ~85 °C — удвічі частіше, ~32 мс).</text>
