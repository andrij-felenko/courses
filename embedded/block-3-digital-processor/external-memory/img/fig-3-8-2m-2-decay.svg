<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">напруга на Cₛ спадає по експоненті зі сталою часу τ = R_leak·Cₛ; біт «втрачено», щойно вона впаде нижче порога підсилювача</text>
