<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Комірка DRAM — це конденсатор за «нещільним» вимикачем</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один транзистор (ключ) + один конденсатор Cₛ тримають біт як ЗАРЯД; закритий ключ тече, тож заряд поволі стікає</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">розрядна лінія (bit line)</text>
<rect x="220.0" y="150.0" width="60.0" height="40.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="250.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ключ</text>
<text x="250.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(1 транзистор)</text>
<line x1="130.0" y1="170.0" x2="218.0" y2="170.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="125.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">адресна лінія (word line) → відкриває ключ</text>
<line x1="250.0" y1="190.0" x2="250.0" y2="226.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="250.0" cy="226.0" r="3.2" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="262.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">вузол зберігання</text>
<text x="262.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Q = Cₛ·V</text>
<line x1="250.0" y1="226.0" x2="250.0" y2="240.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="225.0" y1="240.0" x2="275.0" y2="240.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="225.0" y1="250.0" x2="275.0" y2="250.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="250.0" y1="250.0" x2="250.0" y2="264.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="288.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Cₛ ≈ 20–30 фФ</text>
<text x="288.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(femtofarad)</text>
<line x1="250.0" y1="264.0" x2="250.0" y2="276.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="234.0" y1="276.0" x2="266.0" y2="276.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="240.0" y1="281.0" x2="260.0" y2="281.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="246.0" y1="286.0" x2="254.0" y2="286.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«1» = заряджено   ·   «0» = розряджено</text>
<text x="600.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме — як RC-коло, що розряджається:</text>
<line x1="510.0" y1="130.0" x2="690.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="600.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+V (заряд біта)</text>
<line x1="530.0" y1="130.0" x2="530.0" y2="144.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="508.0" y1="144.0" x2="552.0" y2="144.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="508.0" y1="153.0" x2="552.0" y2="153.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="530.0" y1="153.0" x2="530.0" y2="167.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="530.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Cₛ</text>
<line x1="670.0" y1="130.0" x2="670.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polyline points="670.0,140.0 679.0,146.0 661.0,153.0 679.0,160.0 661.0,167.0 679.0,174.0 661.0,181.0 670.0,188.0" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<line x1="670.0" y1="188.0" x2="670.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="684.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">R_leak</text>
<text x="684.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">≈ 10¹²–10¹³ Ом</text>
<text x="684.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(закритий ключ</text>
<text x="684.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">не ідеальний)</text>
<line x1="530.0" y1="167.0" x2="530.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="510.0" y1="200.0" x2="690.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="586.0" y1="206.0" x2="614.0" y2="206.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="591.0" y1="211.0" x2="609.0" y2="211.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="596.0" y1="216.0" x2="604.0" y2="216.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="700.0" y1="226.0" x2="700.0" y2="260.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aRed)"/>
<text x="706.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">I_leak</text>
<rect x="60.0" y="332.0" width="780.0" height="122.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Куди тече заряд: жоден ізолятор не ідеальний, тож із вузла зберігання струм сочиться трьома шляхами —</text>
<text x="110.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• підпороговий струм закритого ключа (transistor leakage) — головний винуватець</text>
<text x="110.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• струм витоку p–n-переходу вузла в підкладку (junction leakage)</text>
<text x="110.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• витік крізь тонкий діелектрик самого конденсатора (dielectric leakage)</text>
<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усі три разом — це і є той «нещільний вимикач»: великий, але СКІНЧЕННИЙ опір R_leak паралельно до Cₛ.</text>
</svg>
