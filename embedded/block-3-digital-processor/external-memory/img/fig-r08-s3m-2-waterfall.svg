<text x="726.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">спершу «відкриває» цілий рядок;</text>
<text x="726.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">це десятки нс простою.</text>
<circle cx="712.0" cy="268.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="726.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Латентність ≠ пропускна.</text>
<text x="726.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">широка труба, але з довгим</text>
<text x="726.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">стартом: перше слово йде</text>
<text x="726.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">довго, потік — лише далі.</text>
<circle cx="712.0" cy="336.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="726.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Накладні витрати.</text>
