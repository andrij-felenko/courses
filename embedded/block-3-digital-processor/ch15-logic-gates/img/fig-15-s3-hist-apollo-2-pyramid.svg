<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580">
<rect width="980" height="580" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="490.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся машина — з однієї цеглинки: NOR знизу доверху</text>
<text x="490.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">універсальність вентиля з §3.2.3, доведена не на папері, а в кремнії, що полетів</text>
<polygon points="360.0,100.0 620.0,100.0 666.0,168.0 314.0,168.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="490.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Бортовий комп'ютер «Аполлона» (AGC)</text>
<text x="490.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Block II: ≈ 2800 чипів = ≈ 5600 вентилів NOR</text>
<polygon points="314.0,180.0 666.0,180.0 712.0,248.0 268.0,248.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="490.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Регістри · суматор · АЛП · керування</text>
<text x="490.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">арифметика й пам'ять стану з тих самих вентилів</text>
<polygon points="268.0,260.0 712.0,260.0 758.0,328.0 222.0,328.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="490.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тригери й комбінаційні блоки</text>
<text x="490.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">комірки пам'яті та логіка рішень</text>
<polygon points="222.0,340.0 758.0,340.0 804.0,408.0 176.0,408.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<text x="490.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">NOT · AND · OR — зібрані з NOR</text>
<text x="490.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">будь-яка булева операція (Де Морган, §3.2.3)</text>
<polygon points="176.0,420.0 804.0,420.0 850.0,488.0 130.0,488.0" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<text x="490.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Один 3-вхідний вентиль NOR</text>
<text x="490.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Y = ‾(A + B + C) — єдина «цеглинка» всієї машини</text>
<line x1="96.0" y1="488.0" x2="96.0" y2="98.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="90.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">складається</text>
<text x="90.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">вгору</text>
<text x="868.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вузький верх ⇒</text>
<text x="868.0" y="475.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">мало типів</text>
<text x="868.0" y="492.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">деталей, легше</text>
<text x="868.0" y="509.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">все перевірити</text>
</svg>
