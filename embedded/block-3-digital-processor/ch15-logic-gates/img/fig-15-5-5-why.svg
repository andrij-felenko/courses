<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому переміг CMOS — і чому «простий» AND дорожчий за NAND</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у спокої одна мережа завжди замкнена → наскрізного струму нема → майже нуль статичної потужності</text>
<rect x="60.0" y="84.0" width="360.0" height="250.0" rx="10" fill="none" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Сила CMOS</text>
<text x="76.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у спокої Vdd і GND НЕ з'єднані</text>
<text x="76.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  наскрізь → струм ≈ 0</text>
<text x="76.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• енергія тратиться лише при</text>
<text x="76.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  ПЕРЕМИКАННІ (заряд ємностей)</text>
<text x="76.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• звідси P ≈ C·V²·f (з §14.4):</text>
<text x="76.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  менше V і f — менше тепла</text>
<text x="76.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вихід — «до шин» (≈0 / ≈Vdd):</text>
<text x="76.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  чудові рівні й запас (§14.3/14.4)</text>
<rect x="440.0" y="84.0" width="380.0" height="250.0" rx="10" fill="none" stroke="#caa24a" stroke-width="1.6"/>
<text x="630.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Чому NAND/NOR — рідні</text>
<text x="460.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">інвертор (NOT)</text>
<text x="800.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">2 тр.</text>
<line x1="460.0" y1="160.0" x2="800.0" y2="160.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="460.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">NAND / NOR</text>
<text x="800.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">4 тр.</text>
<line x1="460.0" y1="198.0" x2="800.0" y2="198.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="460.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">AND = NAND + інвертор</text>
<text x="800.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7322" text-anchor="end" font-weight="bold" font-style="normal">4+2 = 6 тр.</text>
<line x1="460.0" y1="236.0" x2="800.0" y2="236.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="460.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">OR = NOR + інвертор</text>
<text x="800.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7322" text-anchor="end" font-weight="bold" font-style="normal">4+2 = 6 тр.</text>
<line x1="460.0" y1="274.0" x2="800.0" y2="274.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="630.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тому AND/OR будують ЧЕРЕЗ NAND/NOR — замикається §15.3</text>
<text x="430.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Низька потужність + малі прості комірки — ось чому майже вся логіка сьогодні саме CMOS.</text>
</svg>
