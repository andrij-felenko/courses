<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<rect width="860" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дивна алгебра, де x · x = x: чому значень саме два</text>
<text x="430.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Буль помітив: тотожність x·x = x справджується ЛИШЕ для 0 і 1 — то нехай вони й будуть значеннями логіки</text>
<rect x="60.0" y="92.0" width="360.0" height="248.0" rx="12" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="240.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звичайна алгебра чисел</text>
<text x="84.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">x · x</text>
<text x="210.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="238.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">x²</text>
<text x="84.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">будь-яке число в квадраті</text>
<text x="84.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 + 1</text>
<text x="210.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="238.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2</text>
<text x="84.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">рахуємо кількість</text>
<text x="84.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">x</text>
<text x="210.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="238.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">будь-що</text>
<text x="84.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">нескінченно багато значень</text>
<rect x="440.0" y="92.0" width="360.0" height="248.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="620.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Алгебра Буля (логіка)</text>
<text x="464.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">x · x</text>
<text x="590.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="618.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">x</text>
<text x="464.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">«істинно І істинно» = істинно</text>
<text x="464.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 + 1</text>
<text x="590.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="618.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">1</text>
<text x="464.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">«істинно АБО істинно» = істинно</text>
<text x="464.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">x</text>
<text x="590.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="618.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0 або 1</text>
<text x="464.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">лише два значення</text>
<text x="430.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме x·x = x «відсіює» всі числа, крім 0 та 1 — і робить алгебру Буля двозначною.</text>
<text x="430.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Через 90 років ці 0/1 ляжуть на «розімкнено/замкнено», «низько/високо» — і стануть бітом.</text>
</svg>
