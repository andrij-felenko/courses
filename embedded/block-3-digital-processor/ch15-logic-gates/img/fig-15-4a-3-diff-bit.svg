<text x="706.0" y="348.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">−x = (інверсія x) + 1.</text>
<text x="706.0" y="366.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Додавання 1 «перевертає»</text>
<text x="706.0" y="384.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усі молодші нулі назад в 1,</text>
<text x="706.0" y="402.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">а молодший 1 лишає 1 —</text>
<text x="706.0" y="420.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тож AND залишає рівно його.</text>
<rect x="40.0" y="470.0" width="865.0" height="56.0" rx="12" fill="#fffaf2" stroke="#e08030" stroke-width="1.6"/>
<text x="472.0" y="493.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо це на практиці</text>
<text x="472.0" y="514.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дебаунс і зміна стану портів: A⊕B = «які піни змінилися», далі &amp;−x обходить їх по одному (O(числа змін), не O(32)).</text>
