<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
<rect width="880" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Доведення тотожності: a + a = a — лише з аксіом</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідемпотентність не приймаємо як «очевидну» — її ВИВОДИМО; праворуч від кожного кроку — аксіома, що його дозволяє</text>
<text x="150.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">a + a</text>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= (a + a) · 1</text>
<text x="600.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">[ нейтральний (·1) ]</text>
<text x="250.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= (a + a) · (a + ā)</text>
<text x="600.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">[ доповнення (a+ā=1) ]</text>
<text x="250.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= a + (a · ā)</text>
<text x="600.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">[ дистрибутивність ]</text>
<text x="250.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= a + 0</text>
<text x="600.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">[ доповнення (a·ā=0) ]</text>
<text x="250.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">= a</text>
<text x="600.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">[ нейтральний (+0) ]</text>
<line x1="234.0" y1="102.0" x2="234.0" y2="308.0" stroke="#e4e4e4" stroke-width="2" stroke-linecap="round"/>
<rect x="60.0" y="360.0" width="760.0" height="50.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">За дуальністю одразу маємо й двійника: a · a = a (міняємо + ↔ · та 0 ↔ 1 у кожному рядку).</text>
<text x="440.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так само з аксіом доводять поглинання, Де Моргана й решту «шпаргалки» §3.2.1 — нічого не беручи на віру.</text>
</svg>
