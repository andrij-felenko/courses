<text x="430.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">A·B̄   (рядок 10)</text>
<line x1="430.0" y1="274.0" x2="760.0" y2="274.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Y = Ā·B + A·B̄</text>
<text x="430.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(з'єднали «сумою» OR)</text>
<rect x="70.0" y="350.0" width="740.0" height="56.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: AND + OR + NOT — це ПОВНИЙ набір. З них будується БУДЬ-ЯКА логічна функція.</text>
<text x="440.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(ця конкретна функція — «рівно один із двох» — така корисна, що має власний вентиль: XOR, §15.4)</text>
