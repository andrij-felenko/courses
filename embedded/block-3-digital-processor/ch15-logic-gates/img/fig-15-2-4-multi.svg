<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вентилі бувають на багато входів: 2, 3, 4, 8…</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">правило те саме: AND = 1, лише коли ВСІ входи 1; OR = 1, коли ХОЧ ОДИН вхід 1</text>
<line x1="150.0" y1="160.0" x2="200.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="144.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="150.0" y1="180.0" x2="200.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="144.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">B</text>
<line x1="150.0" y1="200.0" x2="200.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="144.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">C</text>
<path d="M 200,148.0 L 228.0,148.0 A 32.0,32.0 0 0 1 228.0,212.0 L 200,212.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<line x1="260.0" y1="180.0" x2="296.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="302.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y</text>
<text x="230.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3-вхідний AND</text>
<text x="230.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Y = A · B · C</text>
<text x="230.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1 лише за A=B=C=1</text>
<line x1="550.0" y1="160.0" x2="606.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="544.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="550.0" y1="180.0" x2="606.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="544.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">B</text>
<line x1="550.0" y1="200.0" x2="606.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="544.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">C</text>
<path d="M 600,148.0 Q 636.3,148.0 666,180 Q 636.3,212.0 600,212.0 Q 618.48,180 600,148.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<line x1="666.0" y1="180.0" x2="700.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="706.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y</text>
<text x="633.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3-вхідний OR</text>
<text x="633.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Y = A + B + C</text>
<text x="633.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">0 лише за A=B=C=0</text>
<text x="430.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Більше входів — та сама ідея «всі / хоч один». Так одним вентилем перевіряють умову над багатьма сигналами.</text>
</svg>
