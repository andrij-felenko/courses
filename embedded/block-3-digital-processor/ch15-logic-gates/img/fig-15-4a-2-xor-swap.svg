<rect x="40.0" y="410.0" width="865.0" height="110.0" rx="12" fill="#fffaf2" stroke="#e08030" stroke-width="1.6"/>
<text x="472.0" y="434.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Чому виходить — і чим це небезпечне</text>
<text x="60.0" y="458.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ключ — самозворотність XOR:  x ⊕ y ⊕ y = x.  Друге присвоєння кладе в b комбінацію (a₀⊕b₀)⊕b₀ = a₀,</text>
<text x="60.0" y="476.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">третє — кладе в a комбінацію (a₀⊕b₀)⊕a₀ = b₀.  Значення помінялися, тимчасова змінна не знадобилась.</text>
<text x="60.0" y="500.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Пастка:  якщо a і b — ОДНА Й ТА САМА комірка (i == j у swap(arr[i], arr[j])), перший XOR обнулить її в нуль.</text>
