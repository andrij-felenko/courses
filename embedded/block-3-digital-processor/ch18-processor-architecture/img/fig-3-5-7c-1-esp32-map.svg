<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600">
<rect width="980" height="600" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="490.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шини й пам'яті ESP32: Гарвард, видимий неозброєним оком</text>
<text x="490.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне ядро — дві окремі дороги: зелена шина команд і синя шина даних; повільний Flash під'єднано через кеш</text>
<rect x="410.0" y="260.0" width="160.0" height="92.0" rx="8" fill="#f3f6ff" stroke="#1b1b1b" stroke-width="2"/>
<text x="490.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро CPU</text>
<text x="490.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Xtensa LX6</text>
<text x="490.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тут крутиться цикл вибірка→виконання (§3.5.3)</text>
<text x="402.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">шина КОМАНД</text>
<rect x="70.0" y="150.0" width="210.0" height="74.0" rx="8" fill="#eaf6ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="175.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">IRAM</text>
<text x="175.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">внутр. RAM під КОД</text>
<text x="175.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">швидко, детерміновано</text>
<line x1="410.0" y1="282.0" x2="280.0" y2="206.0" stroke="#1f8a3b" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
<rect x="700.0" y="150.0" width="130.0" height="74.0" rx="8" fill="#eaf6ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="765.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Кеш</text>
<text x="765.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ MMU</text>
<line x1="570.0" y1="282.0" x2="700.0" y2="206.0" stroke="#1f8a3b" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
<rect x="860.0" y="150.0" width="96.0" height="74.0" rx="8" fill="#fbf3e0" stroke="#caa24a" stroke-width="2"/>
<text x="908.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#8a6a1e" text-anchor="middle" font-weight="bold" font-style="normal">Flash</text>
<text x="908.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(зовнішня)</text>
<line x1="830.0" y1="187.0" x2="860.0" y2="187.0" stroke="#caa24a" stroke-width="3" marker-start="url(#aAmber)" marker-end="url(#aAmber)"/>
<text x="845.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6a1e" text-anchor="middle" font-weight="bold" font-style="normal">SPI</text>
<text x="845.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a6a1e" text-anchor="middle" font-weight="normal" font-style="italic">повільно, серійно</text>
<text x="578.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">шина ДАНИХ</text>
<rect x="700.0" y="360.0" width="210.0" height="74.0" rx="8" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="805.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">DRAM</text>
<text x="805.0" y="411.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">внутр. RAM під ДАНІ</text>
<text x="805.0" y="451.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="italic">змінні, стек, купа (§3.5.2)</text>
<line x1="570.0" y1="326.0" x2="700.0" y2="378.0" stroke="#1f47b5" stroke-width="3" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
<rect x="70.0" y="360.0" width="210.0" height="74.0" rx="8" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="175.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Периферія</text>
<text x="175.0" y="411.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">регістри GPIO/UART…</text>
<line x1="410.0" y1="326.0" x2="280.0" y2="378.0" stroke="#1f47b5" stroke-width="3" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
<rect x="70.0" y="500.0" width="840.0" height="74.0" rx="8" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="90.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Читай так:</text>
<text x="170.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вибірка КОМАНДИ (зелена) і доступ до ДАНИХ (синя) їдуть РІЗНИМИ шинами — отже, можуть статися ЗА ОДИН</text>
<text x="170.0" y="544.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт паралельно (§3.5.7). Це і є Гарвард. «Модифікований» він тому, що під обома шинами —</text>
<text x="170.0" y="564.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">СПІЛЬНИЙ простір адрес, а величезний КОД лежить у зовнішньому Flash і потрапляє на шину команд через кеш.</text>
</svg>
