<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Анатомія машинної команди: число, розбите на поля</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">команда — це число; його біти діляться на поля: КОД операції (що робити) і ОПЕРАНДИ (над чим). Схема, спрощено</text>
<text x="450.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">людською:  ДОДАЙ R3 ← R1 + R2   (ADD R3, R1, R2)</text>
<line x1="450.0" y1="104.0" x2="450.0" y2="132.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="150.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="225.0" y="184.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0001</text>
<text x="225.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">код операції</text>
<text x="225.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ADD = додати</text>
<rect x="300.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="375.0" y="184.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0011</text>
<text x="375.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">призначення</text>
<text x="375.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R3</text>
<rect x="450.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="525.0" y="184.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0001</text>
<text x="525.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">операнд 1</text>
<text x="525.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R1</text>
<rect x="600.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="675.0" y="184.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0010</text>
<text x="675.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">операнд 2</text>
<text x="675.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R2</text>
<text x="450.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">16 бітів = 4 поля по 4 біти (4 hex-цифри, §17.7)</text>
<text x="450.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">усе разом — одне число:</text>
<text x="450.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0001 0011 0001 0010</text>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">= 0x1312</text>
<rect x="60.0" y="366.0" width="780.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме це число лежить у пам'яті як команда. Декодер (§18.3) ріже його на поля й розуміє наказ — рівно як §17.1:</text>
<text x="450.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">біти не мають сенсу самі по собі; ISA — це домовленість, що робить із числа 0x1312 саме «ДОДАЙ R3,R1,R2».</text>
</svg>
