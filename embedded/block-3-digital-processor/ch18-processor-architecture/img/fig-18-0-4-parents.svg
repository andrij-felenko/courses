<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У «архітектури фон Неймана» багато батьків</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">задум, теорія, залізо й перший ОПИС — це РІЗНІ внески; історія стиснула колективний здобуток в одне ім'я</text>
<rect x="26.0" y="88.0" width="200.0" height="270.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<circle cx="126.0" cy="126.0" r="12.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<path d="M108.0,156 Q126.0,136 144.0,156" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<text x="126.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Алан Тюрінг</text>
<text x="126.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1936</text>
<rect x="76.0" y="230.0" width="100.0" height="24.0" rx="12" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="126.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ТЕОРІЯ</text>
<text x="42.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Універсальна машина: одна</text>
<text x="42.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">машина здатна виконати</text>
<text x="42.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">будь-яке обчислення</text>
<rect x="242.0" y="88.0" width="200.0" height="270.0" rx="12" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<circle cx="342.0" cy="126.0" r="12.0" fill="#ffffff" stroke="#caa24a" stroke-width="2.4"/>
<path d="M324.0,156 Q342.0,136 360.0,156" fill="none" stroke="#caa24a" stroke-width="2.4"/>
<text x="342.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Еккерт і Моклі</text>
<text x="342.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1943–45</text>
<rect x="292.0" y="230.0" width="100.0" height="24.0" rx="12" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="342.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ЗАЛІЗО</text>
<text x="258.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Збудували ENIAC; ідея</text>
<text x="258.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пам'яті на лінії затримки</text>
<text x="258.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— зберігати програму</text>
<rect x="458.0" y="88.0" width="200.0" height="270.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2.2"/>
<circle cx="558.0" cy="126.0" r="12.0" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<path d="M540.0,156 Q558.0,136 576.0,156" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<text x="558.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джон фон Нейман</text>
<text x="558.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1945</text>
<rect x="508.0" y="230.0" width="100.0" height="24.0" rx="12" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="558.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ОПИС</text>
<text x="474.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«First Draft»: перший</text>
<text x="474.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ясний виклад архітектури —</text>
<text x="474.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">його ім'я й закріпилось</text>
<rect x="674.0" y="88.0" width="200.0" height="270.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="774.0" cy="126.0" r="12.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<path d="M756.0,156 Q774.0,136 792.0,156" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="774.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Baby» й EDSAC</text>
<text x="774.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1948–49</text>
<rect x="724.0" y="230.0" width="100.0" height="24.0" rx="12" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="774.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">ВТІЛЕННЯ</text>
<text x="690.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Британські машини, що</text>
<text x="690.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ПЕРШИМИ реально виконали</text>
<text x="690.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">збережену програму</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Мати ідею» ≠ «довести теорему» ≠ «збудувати машину» ≠ «ясно описати». Кожен зробив СВОЄ — і всі потрібні.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А перші РОБОЧІ машини зі збереженою програмою були британські — навіть втілення дісталося не тим, чиє ім'я на архітектурі.</text>
</svg>
