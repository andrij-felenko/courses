<rect x="70.0" y="248.0" width="210.0" height="36.0" rx="5" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="82.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">0x13</text>
<text x="126.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">перейти, якщо…</text>
