<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Процесор: машина, що виконує інструкції — по одній за раз</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">він невпинно бере з пам'яті чергову команду-число й робить крихітну, точно означену дію — мільярди разів на секунду</text>
<text x="175.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПАМ'ЯТЬ (програма)</text>
