<text x="126.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">запиши</text>
<line x1="360.0" y1="182.0" x2="470.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="470.0" y="165.0" width="210.0" height="116.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="575.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<text x="575.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бере команду</text>
<text x="575.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й виконує дію</text>
<text x="575.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">далі — наступна</text>
<line x1="680.0" y1="223.0" x2="740.0" y2="223.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="740.0" y="196.0" width="120.0" height="56.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="800.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">крихітна</text>
<text x="800.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">дія: A+B</text>
<text x="440.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодної магії: процесор лише читає чергове число-команду й робить рівно те, що воно означає, — і одразу береться за наступне.</text>
<text x="440.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожен крок тривіальний (поклав число, додав, порівняв). Уся сила — в нечуваній ШВИДКОСТІ, з якою ці кроки йдуть один за одним.</text>
<text x="440.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Складові процесора — наступний підрозділ (§18.2); сам хід «вибрати→виконати» — §18.3. Тут головне відчути: процесор = виконавець інструкцій.</text>
</svg>
