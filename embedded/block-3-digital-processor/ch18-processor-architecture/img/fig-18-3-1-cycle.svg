<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серцебиття процесора: вибірка → декодування → виконання → і знову</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">процесор безкінечно повторює це коло — за кожен оберт виконує рівно одну команду; такт (§16.6) задає ритм</text>
