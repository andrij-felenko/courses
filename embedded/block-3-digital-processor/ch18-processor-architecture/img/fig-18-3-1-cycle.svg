<text x="450.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це коло крутиться, поки процесор живиться, — мільярди обертів за секунду. Кожен оберт = одна виконана інструкція.</text>
