<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<rect width="900" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому MIPS теж оманливий: однакова РОБОТА — різне число команд</text>
<text x="450.0" y="59.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">MIPS рахує мільйони команд за секунду; але «команда» в різних ISA робить різну порцію роботи</text>
<rect x="220.0" y="78.0" width="460.0" height="34.0" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="450.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одна й та сама задача: порахувати a = b + c·d (однаковий результат)</text>
<rect x="55.0" y="128.0" width="360.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="55.0" y="128.0" width="360.0" height="38.0" rx="12" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<rect x="55.0" y="154.0" width="360.0" height="12.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="235.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Машина X — «густа» ISA (CISC-стиль)</text>
<rect x="73.0" y="176.0" width="324.0" height="56.0" rx="6" fill="#f6f8fc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="85.0" y="194.0" font-family="Consolas, monospace" font-size="13.5" fill="#1b1b1b">1 команда: MAC  a, b, c, d</text>
<text x="85.0" y="216.0" font-family="Consolas, monospace" font-size="13.5" fill="#1b1b1b">(множення-додавання за раз)</text>
<text x="235.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N = 1 команда</text>
<text x="235.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">100 МГц · CPI = 5</text>
<text x="235.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">MIPS = 100/5 = 20</text>
<text x="235.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">робота: 1 задача за 5 тактів</text>
<rect x="485.0" y="128.0" width="360.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="485.0" y="128.0" width="360.0" height="38.0" rx="12" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<rect x="485.0" y="154.0" width="360.0" height="12.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="665.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Машина Y — «проста» ISA (RISC-стиль)</text>
<rect x="503.0" y="176.0" width="324.0" height="78.0" rx="6" fill="#f6f8fc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="515.0" y="194.0" font-family="Consolas, monospace" font-size="13.5" fill="#1b1b1b">MUL t, c, d</text>
<text x="515.0" y="216.0" font-family="Consolas, monospace" font-size="13.5" fill="#1b1b1b">ADD a, b, t</text>
<text x="515.0" y="238.0" font-family="Consolas, monospace" font-size="13.5" fill="#1b1b1b">(те саме — двома командами)</text>
<text x="665.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N = 2 команди</text>
<text x="665.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">100 МГц · CPI = 1</text>
<text x="665.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MIPS = 100/1 = 100</text>
<text x="665.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">робота: 1 задача за 2 такти</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<rect x="70.0" y="422.0" width="760.0" height="60.0" rx="8" fill="#fdf3f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="450.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Y показує MIPS = 100 проти 20 у X — у п'ять разів «більше»!</text>
<text x="450.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та обидві роблять ту саму роботу; Y лише дробить її на більше дрібних команд. MIPS міряє команди, а не роботу.</text>
</svg>
