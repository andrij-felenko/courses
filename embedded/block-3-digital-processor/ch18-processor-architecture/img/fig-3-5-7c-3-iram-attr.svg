<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590">
<rect width="980" height="590" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="490.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо IRAM_ATTR: код, що мусить працювати, коли кеш мовчить</text>
<text x="490.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">під час запису у Flash кеш вимикають — і будь-яка функція з Flash на цей час зникає; рятунок — покласти її в IRAM</text>
<line x1="490.0" y1="80.0" x2="490.0" y2="500.0" stroke="#e4e4e4" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
<text x="245.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звичайна функція</text>
<text x="245.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">живе у Flash, біжить через кеш</text>
<rect x="150.0" y="148.0" width="190.0" height="60.0" rx="8" fill="#fbf3e0" stroke="#caa24a" stroke-width="2"/>
<text x="245.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a6a1e" text-anchor="middle" font-weight="bold" font-style="normal">loop(), обробка…</text>
<text x="245.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">код у Flash</text>
<line x1="245.0" y1="208.0" x2="245.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="258.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">через кеш</text>
<rect x="150.0" y="250.0" width="190.0" height="52.0" rx="8" fill="#eaf6ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="245.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">виконується</text>
<rect x="120.0" y="330.0" width="250.0" height="150.0" rx="8" fill="#fff4f3" stroke="#c0271e" stroke-width="1.8"/>
<text x="245.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">А якщо саме зараз…</text>
<text x="245.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">іде запис у Flash →</text>
<text x="245.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">КЕШ ВИМКНЕНО</text>
<rect x="150.0" y="410.0" width="190.0" height="50.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="245.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">код недосяжний!</text>
<text x="245.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">переривання впаде — система зависне</text>
<text x="735.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Функція з IRAM_ATTR</text>
<text x="735.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">копія коду лежить у внутрішній IRAM</text>
<rect x="640.0" y="148.0" width="190.0" height="60.0" rx="8" fill="#eaf6ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="735.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">IRAM_ATTR isr()</text>
<text x="735.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">код у IRAM, не у Flash</text>
<line x1="735.0" y1="208.0" x2="735.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="748.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">напряму</text>
<rect x="640.0" y="250.0" width="190.0" height="52.0" rx="8" fill="#eaf6ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="735.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">виконується</text>
<rect x="610.0" y="330.0" width="250.0" height="150.0" rx="8" fill="#f1f9f3" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="735.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий момент:</text>
<text x="735.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">іде запис у Flash →</text>
<text x="735.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a6a1e" text-anchor="middle" font-weight="bold" font-style="normal">КЕШ ВИМКНЕНО</text>
<rect x="640.0" y="410.0" width="190.0" height="50.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="735.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">код усе одно поруч</text>
<text x="735.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">переривання спрацює вчасно</text>
<rect x="40.0" y="510.0" width="900.0" height="64.0" rx="8" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="60.0" y="534.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Правило:</text>
<text x="135.0" y="534.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">те, що МУСИТЬ працювати завжди — обробники переривань, код керування самим Flash — позначай</text>
<text x="135.0" y="558.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">IRAM_ATTR, щоб воно жило в IRAM і не залежало від кеша. Решта спокійно лишається у Flash.</text>
</svg>
