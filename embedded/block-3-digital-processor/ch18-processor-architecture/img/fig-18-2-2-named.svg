<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не всі регістри рівні: у кожного своя робота</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">частина регістрів має особливе призначення (лічильник команд, прапорці), решта — загальні «чернетки» для чисел</text>
<rect x="60.0" y="90.0" width="760.0" height="56.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
