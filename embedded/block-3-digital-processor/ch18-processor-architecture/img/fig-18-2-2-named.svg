<text x="790.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">приклад:</text>
<text x="790.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Z=0 C=1</text>
<text x="440.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PC і FLAGS ми вже зустрічали: PC — це лічильник (§16.7), а прапорці виставляє АЛП (§17.4). Решта регістрів — вільний простір для роботи.</text>
