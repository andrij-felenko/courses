<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372">
<rect width="880" height="372" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інструкція — це ОДИН крихітний, точно означений наказ</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не «порахуй податок» і не «намалюй кадр», а елементарний крок; процесор знає лише сталий набір таких примітивів</text>
<rect x="140.0" y="96.0" width="230.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="255.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">завантаж число</text>
<text x="400.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поклади значення в робочу комірку</text>
<rect x="140.0" y="146.0" width="230.0" height="40.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="255.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">додай / відніми</text>
<text x="400.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">склади два числа (суматор §15.6)</text>
<rect x="140.0" y="196.0" width="230.0" height="40.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="255.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">порівняй</text>
<text x="400.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">більше? менше? рівно?</text>
<rect x="140.0" y="246.0" width="230.0" height="40.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="255.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">перейди (стрибок)</text>
<text x="400.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">роби далі не наступну, а іншу команду</text>
<rect x="140.0" y="296.0" width="230.0" height="40.0" rx="8" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="255.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">запиши / прочитай</text>
<text x="400.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перенеси число між процесором і пам'яттю</text>
<text x="440.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся міць процесора — з кількох десятків таких дрібничок. Великі дії — це довгі ЛАНЦЮГИ примітивних наказів.</text>
</svg>
