<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388">
<rect width="880" height="388" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виграш конвеєра — і чому він не безмежний</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">конвеєр — головний спосіб зменшити CPI (§18.5): більше команд за такт без підняття частоти</text>
<rect x="70.0" y="90.0" width="340.0" height="130.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="240.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">В ідеалі</text>
<text x="240.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N стадій → до ~N× більше</text>
<text x="240.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">команд за секунду</text>
<text x="240.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CPI → 1 (одна команда/такт)</text>
<text x="240.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за ту саму частоту!</text>
<rect x="470.0" y="90.0" width="340.0" height="130.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="640.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Насправді</text>
<text x="640.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затори (дані, стрибки) крадуть</text>
<text x="640.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">частину виграшу</text>
<text x="640.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ трохи менше за ×N,</text>
<text x="640.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та все одно велика перемога</text>
<rect x="60.0" y="238.0" width="760.0" height="116.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конвеєр є майже в кожному сучасному процесорі — від ESP32 й ARM Cortex до настільних ПК (там стадій багато).</text>
<text x="440.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це і є відповідь на обіцянку §18.5: ось ЯК зменшують CPI — перекриваючи фази, щоб блоки не простоювали.</text>
<text x="440.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Конвеєр (один потік швидше) — не те саме, що багатоядерність (кілька потоків водночас, Розділ 20): це різні види паралелізму.</text>
<text x="440.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Разом частота, конвеєр і ядра й дають сучасну швидкодію — кожне б'є по своєму обмеженню.</text>
</svg>
