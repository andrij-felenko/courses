<text x="54.0" y="433.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ще одна, окрема мова — у цю карту 32-бітних ISA не лягає (§3.5.4).</text>
<rect x="420.0" y="392.0" width="360.0" height="58.0" rx="7" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Читати згори вниз, не навпаки:</text>
<text x="600.0" y="433.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">плата → ядро → ISA. Цільову ISA й обираєш у IDE.</text>
