<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414">
<rect width="900" height="414" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сьогодні межа розмита: CISC зовні, RISC усередині</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сучасні x86-процесори приймають складні CISC-команди, але всередині РОЗКЛАДАЮТЬ їх на прості RISC-подібні кроки</text>
<rect x="70.0" y="96.0" width="180.0" height="70.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="160.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">складна CISC-</text>
<text x="160.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">команда (x86)</text>
<line x1="252.0" y1="131.0" x2="320.0" y2="131.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="320.0" y="96.0" width="180.0" height="70.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="410.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">декодер</text>
<text x="410.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розкладає на…</text>
<line x1="502.0" y1="131.0" x2="570.0" y2="131.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="570.0" y="92.0" width="260.0" height="78.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="700.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кілька простих</text>
<text x="700.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мікро-операцій (µops)</text>
<text x="700.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">→ їх і конвеєрять (§18.6)</text>
<rect x="60.0" y="196.0" width="780.0" height="96.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тобто навіть «CISC» x86 усередині — RISC-подібне ядро. Видима ISA (§18.4) лишається CISC заради СУМІСНОСТІ зі старим софтом,</text>
<text x="450.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">а реалізація під нею — RISC-стилю. Перемогла, по суті, RISC-ідея простих швидких кроків — навіть там, де ISA складна.</text>
<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тож сьогодні «RISC vs CISC» — це радше про ФІЛОСОФІЮ видимої ISA, ніж про жорсткий поділ заліза.</text>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Згадайте §18.4: ISA — це сталий контракт (видима мова). Як його виконано всередині — окрема свобода інженера,</text>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і саме тому Intel зміг лишити стару CISC-мову зовні, а всередині перейти на швидке RISC-подібне ядро.</text>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Найважливіше: проста, однакова команда — легша для конвеєра й заліза. Ця ідея RISC проникла всюди.</text>
</svg>
