<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тепер після «розгону» конвеєра нова команда завершується КОЖНОГО такту. Чотири команди — лише 6 тактів замість 12.</text>
<text x="450.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жоден блок не простоює: кожен щотакту обробляє СВОЮ команду. Це і є конвеєр (*pipeline*).</text>
