<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416">
<rect width="900" height="416" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що дають дві шини: вибірку команди й доступ до даних — водночас</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у фон Неймана вибірка команди й читання даних б'ються за одну шину; у Гарварда йдуть паралельно</text>
<rect x="60.0" y="86.0" width="380.0" height="200.0" rx="12" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Фон Нейман: по черзі</text>
<text x="250.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">одна шина → дві потреби конфліктують</text>
<rect x="90.0" y="150.0" width="150.0" height="36.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="165.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">такт 1: вибрати команду</text>
<rect x="90.0" y="196.0" width="150.0" height="36.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="165.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">такт 2: читати дані</text>
<text x="250.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">доступ до даних ЧЕКАЄ на вибірку</text>
<text x="250.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">→ це і є «вузьке місце»</text>
<rect x="460.0" y="86.0" width="380.0" height="200.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Гарвард: водночас</text>
<text x="650.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дві шини → обидві потреби разом</text>
<rect x="490.0" y="168.0" width="150.0" height="36.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="565.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вибрати команду</text>
<rect x="660.0" y="168.0" width="150.0" height="36.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="735.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">читати дані</text>
<text x="650.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">обидва — за ОДИН такт</text>
<text x="650.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ніхто нікого не чекає</text>
<text x="650.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+ конвеєр (§18.6) тече гладкіше</text>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось чому Гарвард швидший: розділивши дороги, ми прибрали конкуренцію між кодом і даними за шину.</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це особливо цінно для конвеєра (§18.6): вибірка наступної команди не стикається з доступом до даних поточної.</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">І для обробки сигналів (DSP), де треба щотакту тягти і дані, і коефіцієнти — два потоки, дві шини.</text>
</svg>
