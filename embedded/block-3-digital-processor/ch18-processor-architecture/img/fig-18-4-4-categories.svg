<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Словник процесора: кілька родин примітивних команд</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">попри тисячі програм, набір самих команд невеликий — кілька десятків, що групуються в чотири родини</text>
<rect x="60.0" y="96.0" width="780.0" height="66.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="84.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Пересилання даних</text>
<text x="84.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">возити числа: пам'ять ↔ регістри, регістр → регістр</text>
<rect x="530.0" y="112.0" width="290.0" height="34.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="675.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LD · ST · MOV</text>
<rect x="60.0" y="178.0" width="780.0" height="66.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="84.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Арифметика й логіка</text>
<text x="84.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">рахувати в АЛП (§15, §18.2); виставляють прапорці</text>
<rect x="530.0" y="194.0" width="290.0" height="34.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="675.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ADD · SUB · AND · OR · XOR · SHIFT</text>
<rect x="60.0" y="260.0" width="780.0" height="66.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="84.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Керування плином</text>
<text x="84.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">стрибки й розгалуження: міняють PC (§18.2)</text>
<rect x="530.0" y="276.0" width="290.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.4"/>
<text x="675.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">JMP · BEQ · BNE · CALL · RET</text>
<rect x="60.0" y="342.0" width="780.0" height="66.0" rx="10" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="84.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Порівняння / тест</text>
<text x="84.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">порівняти числа й виставити прапорці Z/N/C/V (§17.4)</text>
<rect x="530.0" y="358.0" width="290.0" height="34.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.4"/>
<text x="675.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">CMP · TST</text>
<text x="450.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усі великі дії — це довгі ланцюги цих дрібних команд (§18.1). Опанувавши чотири родини, ви читатимете будь-який асемблер.</text>
</svg>
