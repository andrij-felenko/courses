<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396">
<rect width="900" height="396" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Остання розвилка: якою має бути мова процесора?</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">проєктуючи ISA (§18.4), інженер обирає філософію: мало ПРОСТИХ команд — чи багато ПОТУЖНИХ?</text>
<rect x="390.0" y="86.0" width="120.0" height="44.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="450.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">набір команд?</text>
<line x1="420.0" y1="132.0" x2="300.0" y2="172.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="480.0" y1="132.0" x2="600.0" y2="172.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="80.0" y="176.0" width="340.0" height="150.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="250.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RISC</text>
<text x="250.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Reduced Instruction Set</text>
<text x="102.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• МАЛО команд, усі прості</text>
<text x="102.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• кожна — один крихітний крок</text>
<text x="102.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• однакова довжина, ~1 такт</text>
<text x="102.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ARM · RISC-V · AVR · ESP32</text>
<rect x="480.0" y="176.0" width="340.0" height="150.0" rx="12" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="650.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CISC</text>
<text x="650.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Complex Instruction Set</text>
<text x="502.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• БАГАТО команд, є складні</text>
<text x="502.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• одна може робити багато</text>
<text x="502.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• різна довжина й тривалість</text>
<text x="502.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• x86 (ПК, ноутбуки)</text>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві протилежні відповіді на одне питання — і ціла епоха суперечок, яка з них правильна. Розберімо обидві.</text>
</svg>
