<path d="M746,128 Q788,90 110,90" fill="none" stroke="#1f47b5" stroke-width="2.2"/>
<text x="326.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стрибок: цикл повертається назад → так виходить ПОВТОР (цикл програми)</text>
<rect x="60.0" y="290.0" width="780.0" height="96.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одна команда — це кілька тактів (вибірка, декодування, виконання). Що швидший такт, то більше команд за секунду —</text>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це і є «частота» процесора (§18.5). А робити кілька фаз водночас навчимося в §18.6 (конвеєр).</text>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головне: програма не «запускається» якось чарівно — це просто цикл вибірка-декодування-виконання, що крутиться знов і знов.</text>
