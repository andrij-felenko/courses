<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три команди тут забирають 9 тактів. Дороге залізо простоює дві третини часу — це марнотратство, яке проситься на виправлення.</text>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А що, як поки одна команда виконується, наступну вже декодувати, а ще одну — вибирати? Адже це РІЗНІ блоки.</text>
