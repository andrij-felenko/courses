</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Фаза 2 — ДЕКОДУВАННЯ: зрозуміти, що означає команда</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пристрій керування читає число-команду в IR і розкладає його на «що робити» й «над чим» (як саме закодовано — §18.4)</text>
<rect x="80.0" y="150.0" width="170.0" height="64.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="165.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">IR (команда)</text>
<text x="165.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ДОДАЙ R1,R2→R3</text>
<line x1="252.0" y1="182.0" x2="330.0" y2="182.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="330.0" y="140.0" width="200.0" height="84.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="430.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пристрій</text>
<text x="430.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">керування</text>
<text x="430.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(декодер)</text>
<line x1="532.0" y1="182.0" x2="610.0" y2="182.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<rect x="610.0" y="120.0" width="220.0" height="36.0" rx="6" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="622.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">операція</text>
<text x="820.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">ДОДАТИ (+)</text>
<rect x="610.0" y="164.0" width="220.0" height="36.0" rx="6" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="622.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">операнд 1</text>
<text x="820.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">регістр R1</text>
<rect x="610.0" y="208.0" width="220.0" height="36.0" rx="6" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="622.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">операнд 2</text>
<text x="820.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">регістр R2</text>
<rect x="610.0" y="252.0" width="220.0" height="36.0" rx="6" fill="#fafafa" stroke="#c0271e" stroke-width="1.6"/>
<text x="622.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">результат →</text>
<text x="820.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">регістр R3</text>
<text x="440.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Команда-число перетворюється на набір сигналів керування: «увімкни в АЛП додавання, подай R1 і R2, поклади в R3».</text>
<text x="440.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Декодування нічого не рахує — воно лише РОЗУМІЄ наказ і готує всіх виконавців.</text>
</svg>
