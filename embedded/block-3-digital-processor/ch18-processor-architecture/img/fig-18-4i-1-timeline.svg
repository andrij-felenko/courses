<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690">
<rect width="900" height="690" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">П'ять поколінь RISC у Берклі — і вихід ISA у відкритий світ</text>
<text x="450.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«V» — це і римська П'ЯТІРКА (п'яте покоління), і Vector, і Variations (варіанти-розширення)</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="666.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="122.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1981</text>
<text x="274.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">RISC-I, RISC-II</text>
<text x="274.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Паттерсон зі студентами: прості команди — простий і швидкий кремній. Народження ідеї RISC</text>
<circle cx="250.0" cy="208.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="213.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1984</text>
<text x="274.0" y="204.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SOAR (≈ «RISC-III»)</text>
<text x="274.0" y="224.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Наступний дослідницький чип лабораторії — лінія Берклі триває</text>
<circle cx="250.0" cy="294.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="299.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1988</text>
<text x="274.0" y="290.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SPUR (≈ «RISC-IV»)</text>
<text x="274.0" y="310.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Четверте покоління; усе це — навчально-дослідні ISA, не для продажу</text>
<circle cx="250.0" cy="381.0" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="0"/>
<circle cx="250.0" cy="381.0" r="10.0" fill="none" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="381.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="228.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">2010</text>
<text x="274.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">RISC-V — старт у Par Lab</text>
<text x="274.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Асанович, Вотерман, Лі (дир. Паттерсон): чиста ISA з нуля, щоб НЕ платити за чужу мову</text>
<circle cx="250.0" cy="467.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="472.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">2011</text>
<text x="274.0" y="463.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">перший том специфікації</text>
<text x="274.0" y="483.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Опубліковано опис базового набору — RISC-V виходить за межі однієї лабораторії</text>
<circle cx="250.0" cy="553.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="558.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">2015</text>
<text x="274.0" y="549.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">RISC-V Foundation + SiFive</text>
<text x="274.0" y="569.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Стандарт віддали незалежній спільноті; трійця засновує першу RISC-V-компанію</text>
<circle cx="250.0" cy="640.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="645.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">донині</text>
<text x="274.0" y="636.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">у мільярдах чипів</text>
<text x="274.0" y="656.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Від крихітних МК (ESP32-C) до серверів — і все на ОДНІЙ відкритій, безплатній ISA</text>
</svg>
