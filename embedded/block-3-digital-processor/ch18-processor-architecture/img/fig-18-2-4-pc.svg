<text x="440.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PC — це лічильник (§16.7): після кожної команди він +1, тож програма біжить по порядку сама собою.</text>
<text x="440.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А «стрибок» — це просто запис ІНШОЇ адреси в PC; так виходять цикли й розгалуження (§18.1).</text>
