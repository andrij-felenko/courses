<text x="500.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="70.0" y="226.0" width="380.0" height="108.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
