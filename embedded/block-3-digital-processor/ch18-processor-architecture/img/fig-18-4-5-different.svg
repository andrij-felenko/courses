<text x="840.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">8-біт Arduino Uno</text>
<rect x="500.0" y="270.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.4"/>
<text x="670.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">add r1, r2</text>
<text x="500.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="60.0" y="368.0" width="780.0" height="46.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому програму КОМПІЛЮЮТЬ під конкретний процесор: код для ARM не побіжить на x86. ESP32 — це Xtensa (нові моделі — RISC-V).</text>
<text x="450.0" y="407.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ISA — це лінія розмежування світів софту: за нею починається «чужа мова», якої ваш процесор не розуміє.</text>
