<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки коштують розгалуження: ефективний CPI як функція точності передбачення</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">CPI ≈ 1 + f · (1 − a) · p   —   f — частка гілок, a — точність вгадування, p — штраф промаху (тут p = 3)</text>
