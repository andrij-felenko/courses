<text x="676.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ CPI ≈ 1.06 (втрата лише ~6%)</text>
<rect x="244.0" y="282.0" width="8.0" height="8.0" rx="0" fill="#c0271e" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="188.0" y1="256.0" x2="242.0" y2="280.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
