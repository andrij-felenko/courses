<text x="470.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві ручки тримають CPI біля 1: менше гілок (f) і краще їх угадувати (a). Сучасні передбачувачі дають a ≈ 95–98%, тож втрати малі.</text>
<text x="470.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Глибший конвеєр піднімає штраф p (більше стадій до перевірки гілки) — тому довгі конвеєри особливо бояться непередбачуваних розгалужень.</text>
<text x="470.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це і є «напівкількісний» бік §3.5.6: ідеальне ×N конвеєра з'їдають саме ці доданки.</text>
</svg>
