<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414">
<rect width="900" height="414" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підступ: одна команда — це зазвичай КІЛЬКА тактів</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">фази вибірки, декодування, виконання беруть такти; доступ у пам'ять додає простоїв — тож команда триває кілька тактів</text>
<text x="80.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">проста (ADD):</text>
<rect x="230.0" y="96.0" width="84.0" height="30.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="272.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вибірка</text>
<rect x="320.0" y="96.0" width="84.0" height="30.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="362.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">декод.</text>
<rect x="410.0" y="96.0" width="84.0" height="30.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="452.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">викон.</text>
<text x="520.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ 3 такти</text>
<text x="80.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">з пам'яттю (LOAD):</text>
<rect x="230.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.5"/>
<text x="262.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вибірка</text>
<rect x="300.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.5"/>
<text x="332.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">декод.</text>
<rect x="370.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.5"/>
<text x="402.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">адреса</text>
<rect x="440.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fff8e8" stroke="#caa24a" stroke-width="1.5"/>
<text x="472.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">чекати</text>
<rect x="510.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fff8e8" stroke="#caa24a" stroke-width="1.5"/>
<text x="542.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">чекати</text>
<rect x="580.0" y="156.0" width="64.0" height="30.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.5"/>
<text x="612.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">дані</text>
<text x="670.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ 6 тактів</text>
<text x="230.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">повільна пам'ять змушує процесор ПРОСТОЮВАТИ (вузьке місце §18-історія)</text>
<rect x="150.0" y="240.0" width="600.0" height="80.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тактів на команду (CPI) — у середньому</text>
<text x="450.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">команд за секунду  =  частота  ÷  CPI</text>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому частота — лише ПОЛОВИНА правди: реальна швидкодія залежить ще й від того, скільки тактів іде на команду в середньому.</text>
<text x="450.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Менший CPI (менше тактів на команду) — більша швидкодія за тієї самої частоти. Зменшувати CPI вчить §18.6 (конвеєр).</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зворотна величина — IPC (команд за такт): що вона більша, то ефективніший процесор.</text>
</svg>
