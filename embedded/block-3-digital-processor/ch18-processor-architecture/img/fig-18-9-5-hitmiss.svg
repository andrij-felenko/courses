<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Влучання й промах: чому кеш так разюче пришвидшує — попри промахи</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">навіть якщо лише іноді бувають промахи, висока частка влучань тягне середній час доступу майже до швидкості кешу</text>
<rect x="380.0" y="84.0" width="140.0" height="40.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="450.0" y="109.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">запит даних</text>
<line x1="420.0" y1="126.0" x2="300.0" y2="166.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<line x1="480.0" y1="126.0" x2="600.0" y2="166.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="90.0" y="170.0" width="360.0" height="96.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="270.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВЛУЧАННЯ (hit)</text>
<text x="270.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дані вже в кеші</text>
<text x="270.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ кілька тактів, ядро не чекає</text>
<text x="270.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">трапляється ЧАСТО (напр. 95%)</text>
<rect x="490.0" y="170.0" width="360.0" height="96.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="670.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОМАХ (miss)</text>
<text x="670.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у кеші нема — йти в RAM по лінію</text>
<text x="670.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ десятки–сотні тактів простою</text>
<text x="670.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">трапляється РІДКО (напр. 5%)</text>
<rect x="120.0" y="286.0" width="660.0" height="86.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">середній час  ≈  (частка влучань × час кешу)  +  (частка промахів × час пам'яті)</text>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">напр.  0.95 × 3 такти  +  0.05 × 100 тактів  ≈  2.85 + 5  =  7.85 такту</text>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">без кешу кожне звернення коштувало б ≈ 100 тактів — кеш дав ВДЕСЯТЕРО менше</text>
<text x="450.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось сила кешу: рідкісні дорогі промахи «розчиняються» серед частих дешевих влучань — середнє виходить близьким до кешу.</text>
<text x="450.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому головна мета — висока ЧАСТКА ВЛУЧАНЬ (hit rate). Навіть скромне її падіння помітно б'є по швидкодії (промах дорогий).</text>
</svg>
