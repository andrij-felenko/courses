<svg xmlns="http://www.w3.org/2000/svg" width="900" height="446" viewBox="0 0 900 446">
<rect width="900" height="446" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому кеш працює: програми звертаються до пам'яті НЕ навмання</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дані, потрібні зараз, майже завжди близькі до недавніх — у часі або в просторі; це і є локальність</text>
<rect x="60.0" y="86.0" width="380.0" height="220.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">ЧАСОВА локальність</text>
<text x="250.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що використали недавно —</text>
<text x="250.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скоро знадобиться знову</text>
<rect x="96.0" y="166.0" width="308.0" height="96.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.4"/>
<text x="112.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">for (i = 0; i &lt; N; i++)</text>
<text x="112.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">    sum = sum + a[i];</text>
<text x="250.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">sum та i чіпаються КОЖНОЇ ітерації</text>
<text x="250.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ тримай їх у кеші, і всі звернення — швидкі</text>
<rect x="460.0" y="86.0" width="380.0" height="220.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПРОСТОРОВА локальність</text>
<text x="650.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо взяли комірку —</text>
<text x="650.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скоро візьмемо СУСІДНЮ</text>
<rect x="498.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#d8efe0" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="516.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[0]</text>
<rect x="539.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#d8efe0" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="557.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[1]</text>
<rect x="580.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#d8efe0" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="598.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[2]</text>
<rect x="621.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="639.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[3]</text>
<rect x="662.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="680.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[4]</text>
<rect x="703.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="721.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[5]</text>
<rect x="744.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="762.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[6]</text>
<rect x="785.0" y="176.0" width="37.0" height="30.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="803.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a[7]</text>
<line x1="500.0" y1="222.0" x2="803.0" y2="222.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="650.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">масив обходять по порядку — сусід за сусідом</text>
<text x="650.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ принеси відразу БЛОК сусідів, не по одному</text>
<rect x="60.0" y="326.0" width="780.0" height="96.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Якби програма скакала по пам'яті геть випадково, кеш був би безсилий. На щастя, реальний код локальний — і це його рятує.</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Часова локальність каже кешу: тримай недавнє. Просторова: бери дані БЛОКАМИ, бо сусіди знадобляться слідом.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Обидві — не закон, а спостережена закономірність реальних програм; на ній і тримається весь виграш кешу.</text>
</svg>
