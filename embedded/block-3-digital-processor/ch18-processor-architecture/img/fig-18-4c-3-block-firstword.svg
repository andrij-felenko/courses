  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6b4fa0"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хобі-плата МК зсередини й «перший байт»</text>
<text x="410.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">однаковий каркас плати; ISA живе всередині ядра — і її ж обираєш як ціль</text>
<rect x="36.0" y="74.0" width="470.0" height="356.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="50.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">плата (модуль розробника)</text>
<rect x="22.0" y="224.0" width="22.0" height="44.0" rx="3" fill="#e4e4e4" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="33.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">USB</text>
<rect x="76.0" y="224.0" width="96.0" height="46.0" rx="6" fill="#dfe6f6" stroke="#1f47b5" stroke-width="1.8"/>
<text x="124.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">USB↔UART</text>
<text x="124.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(або вбуд.)</text>
<line x1="44.0" y1="246.0" x2="74.0" y2="247.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="76.0" y="110.0" width="120.0" height="42.0" rx="6" fill="#f6dcd9" stroke="#c0271e" stroke-width="1.8"/>
<text x="136.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Стабілізатор</text>
<text x="136.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">5 В → 3.3 В</text>
<rect x="232.0" y="184.0" width="230.0" height="150.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="347.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чип МК (SoC)</text>
<rect x="258.0" y="224.0" width="178.0" height="60.0" rx="8" fill="#dcefe0" stroke="#1f8a3b" stroke-width="2"/>
<text x="347.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЯДРО + ISA</text>
<text x="347.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Cortex-M / RISC-V / Xtensa</text>
<text x="347.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+ Flash, RAM, периферія на кристалі</text>
<line x1="136.0" y1="152.0" x2="347.0" y2="182.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="353.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">3.3 В</text>
<line x1="172.0" y1="247.0" x2="230.0" y2="254.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="202.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">прошивка/лог</text>
<line x1="462.0" y1="208.0" x2="496.0" y2="208.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="500.0" cy="208.0" r="3.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="462.0" y1="234.0" x2="496.0" y2="234.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="500.0" cy="234.0" r="3.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="462.0" y1="260.0" x2="496.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="500.0" cy="260.0" r="3.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="462.0" y1="286.0" x2="496.0" y2="286.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="500.0" cy="286.0" r="3.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<line x1="462.0" y1="312.0" x2="496.0" y2="312.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="500.0" cy="312.0" r="3.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="498.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">GPIO-піни</text>
<text x="50.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">рівні логіки 3.3 В (§3.1.4) — не 5 В на входи!</text>
<rect x="528.0" y="74.0" width="256.0" height="356.0" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="656.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Перший байт»:</text>
<text x="656.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як заговорити з платою</text>
<rect x="540.0" y="138.0" width="232.0" height="60.0" rx="6" fill="#dfe6f6" stroke="#1f47b5" stroke-width="1.5"/>
<text x="550.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. Дізнайся ядро плати</text>
<text x="550.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">RP2040 → ARM; ESP32-C3 → RISC-V;</text>
<text x="550.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ESP32 → Xtensa.</text>
<rect x="540.0" y="208.0" width="232.0" height="60.0" rx="6" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="550.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. Обери ту саму ISA-ціль</text>
<text x="550.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у IDE: «board / target» = саме</text>
<text x="550.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">цей чип, не «якийсь ESP».</text>
<rect x="540.0" y="278.0" width="232.0" height="60.0" rx="6" fill="#dfe6f6" stroke="#1f47b5" stroke-width="1.5"/>
<text x="550.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. Постав потрібний toolchain</text>
<text x="550.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">компілятор кодує під ISA;</text>
<text x="550.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">чужий дасть несумісний код.</text>
<rect x="540.0" y="348.0" width="232.0" height="60.0" rx="6" fill="#dcefe0" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="550.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">4. Залий і поглянь у лог</text>
<text x="550.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перший рядок по UART (115200)</text>
<text x="550.0" y="399.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= плата ожила й говорить.</text>
</svg>
