<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
<rect width="880" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три види допуску — і чому потрібні всі три</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">абсолютний рятує біля нуля, відносний — на великих числах, поріг між ними перемикає їх</text>
<rect x="48.0" y="84.0" width="252.0" height="386.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="174.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Абсолютний</text>
<rect x="60.0" y="126.0" width="228.0" height="34.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="174.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">|a − b| ≤ εабс</text>
<text x="66.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Один сталий допуск.</text>
<text x="66.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Працює БІЛЯ НУЛЯ</text>
<text x="66.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(де відносний ділить</text>
<text x="66.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на ~0 і вибухає).</text>
<text x="66.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Хибний на великих:</text>
<text x="66.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">при a=1e6 поріг 1e-6</text>
<text x="66.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">недосяжний.</text>
<circle cx="174.0" cy="444.0" r="13.0" fill="#caa24a" stroke="none" stroke-width="0"/>
<text x="174.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">±</text>
<rect x="314.0" y="84.0" width="252.0" height="386.0" rx="12" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="440.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Відносний</text>
<rect x="326.0" y="126.0" width="228.0" height="34.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.3"/>
<text x="440.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">|a−b| ≤ εвідн·max(|a|,|b|)</text>
<text x="332.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Допуск росте з числом —</text>
<text x="332.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">як і крок float вище.</text>
<text x="332.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Універсальний для</text>
<text x="332.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«звичайних» величин.</text>
<text x="332.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Ламається БІЛЯ НУЛЯ:</text>
<text x="332.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">max(|a|,|b|)→0, поріг→0,</text>
<text x="332.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">0.0 vs 1e-30 «нерівні».</text>
<circle cx="440.0" cy="444.0" r="13.0" fill="#caa24a" stroke="none" stroke-width="0"/>
<text x="440.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">±</text>
<rect x="580.0" y="84.0" width="252.0" height="386.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="706.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Комбінований</text>
<rect x="592.0" y="126.0" width="228.0" height="34.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="706.0" y="148.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal">абс. якщо малі, інакше відн.</text>
<text x="598.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Спершу абсолютна гілка</text>
<text x="598.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">для околу нуля,</text>
<text x="598.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">далі — відносна.</text>
<text x="598.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Саме так і роблять</text>
<text x="598.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на практиці — одна</text>
<text x="598.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">функція nearEqual.</text>
<text x="598.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Покриває весь діапазон.</text>
<circle cx="706.0" cy="444.0" r="13.0" fill="#1f8a3b" stroke="none" stroke-width="0"/>
<text x="706.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
</svg>
