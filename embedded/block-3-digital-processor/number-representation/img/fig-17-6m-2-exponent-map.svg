<text x="137.4" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">мантиса = 0  →  ±0</text>
<text x="137.4" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рівно нуль</text>
<text x="137.4" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(є і +0, і −0)</text>
<rect x="12.4" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="137.4" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">мантиса ≠ 0  →  денормаль</text>
<text x="137.4" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0.мантиса × 2⁻¹²⁶</text>
<text x="137.4" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(приховано 0, не 1)</text>
<rect x="365.0" y="154.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="490.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">будь-яка мантиса</text>
<text x="490.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1.мантиса × 2^(e−127)</text>
<text x="490.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">приховано провідну 1</text>
<rect x="365.0" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="490.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">це 99,99 % усіх чисел</text>
<text x="490.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">звичайна арифметика</text>
<text x="490.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(див. Рис. 3.4.6m.1)</text>
<rect x="717.6" y="154.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="842.6" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мантиса = 0  →  ±∞</text>
<text x="842.6" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">переповнення,</text>
<text x="842.6" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ділення на 0</text>
<rect x="717.6" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="842.6" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мантиса ≠ 0  →  NaN</text>
<text x="842.6" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0/0, √(−1);</text>
<text x="842.6" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заразний</text>
<text x="490.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Числова вісь біля нуля (логарифмічно за модулем): денормалі рівномірно «дотягують» до 0</text>
