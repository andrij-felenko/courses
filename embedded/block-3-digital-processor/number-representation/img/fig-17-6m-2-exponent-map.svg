  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="490.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поле порядку керує всім: ті самі 8 бітів задають чотири різні режими</text>
<text x="490.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крайні значення порядку (000…0 і 111…1) зарезервовані під особливі числа — звідси нуль, денормалі, ∞ і NaN</text>
<rect x="60.0" y="84.0" width="154.8" height="40.0" rx="6" fill="#eef2ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="137.4" y="102.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold">порядок = 0</text>
<text x="137.4" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(біти 00000000)</text>
<rect x="214.8" y="84.0" width="550.4" height="40.0" rx="6" fill="#eef9ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="490.0" y="102.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold">порядок = 1 … 254</text>
<text x="490.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(звичайний діапазон)</text>
<rect x="765.2" y="84.0" width="154.8" height="40.0" rx="6" fill="#fdeeee" stroke="#c0271e" stroke-width="1.8"/>
<text x="842.6" y="102.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold">порядок = 255</text>
<text x="842.6" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(біти 11111111)</text>
<line x1="137.4" y1="124.0" x2="137.4" y2="152.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<line x1="490.0" y1="124.0" x2="490.0" y2="152.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<line x1="842.6" y1="124.0" x2="842.6" y2="152.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
