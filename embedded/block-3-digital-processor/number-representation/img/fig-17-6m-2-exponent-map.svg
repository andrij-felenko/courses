<line x1="257.8" y1="410.0" x2="257.8" y2="422.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="294.4" y1="410.0" x2="294.4" y2="422.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="330.9" y1="410.0" x2="330.9" y2="422.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="367.4" y1="410.0" x2="367.4" y2="422.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="404.0" y1="410.0" x2="404.0" y2="422.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<text x="257.8" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">денормалі: рівний крок 2⁻¹⁴⁹</text>
<text x="257.8" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">плавне згасання до нуля</text>
<line x1="404.0" y1="408.0" x2="404.0" y2="424.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="455.6" y1="408.0" x2="455.6" y2="424.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="530.4" y1="408.0" x2="530.4" y2="424.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="638.9" y1="408.0" x2="638.9" y2="424.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="796.2" y1="408.0" x2="796.2" y2="424.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<text x="662.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нормальні: крок подвоюється щопорядку</text>
<line x1="404.0" y1="390.0" x2="404.0" y2="430.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="404.0" y="446.0" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal">2⁻¹²⁶</text>
<text x="111.6" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">2⁻¹⁴⁹ (найменше)</text>
<rect x="60.0" y="530.0" width="860.0" height="32.0" rx="8" fill="#fff6e6" stroke="#caa24a" stroke-width="1.4"/>
<text x="490.0" y="551.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Без денормалей усе між 0 і 2⁻¹²⁶ різко падало б у нуль — «діра», де віднімання близьких чисел брехало б. Денормалі її закривають.</text>
</svg>
