<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
<rect width="940" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два режими одного циклу — і єдина «плата» за псевдо-обертання</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">напрям рішення (за z чи за y) перемикає, що CORDIC обчислює; накопичене видовження Aᵢ зводять в одну сталу K</text>
<rect x="50.0" y="92.0" width="405.0" height="250.0" rx="10" fill="#eef3ff" stroke="#1f47b5" stroke-width="2.0"/>
<text x="252.5" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Режим обертання (rotation)</text>
<text x="252.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">задано кут — крутимо вектор до нього</text>
<text x="72.0" y="170.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">σ = sign(z)          // женемо z → 0</text>
<text x="72.0" y="192.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">x −= σ·(y &gt;&gt; i)</text>
<text x="72.0" y="214.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">y += σ·(x &gt;&gt; i)</text>
<text x="72.0" y="236.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">z −= σ·atan(2⁻ⁱ)</text>
<line x1="68.0" y1="254.0" x2="437.0" y2="254.0" stroke="#e4e4e4" stroke-width="1.6" stroke-linecap="round"/>
<text x="72.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">старт (x,y,z) = (1/K, 0, θ)  →</text>
<text x="72.0" y="298.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold">x → cos θ</text>
<text x="225.0" y="298.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold">y → sin θ</text>
<text x="72.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">один прохід дає синус і косинус відразу</text>
<rect x="485.0" y="92.0" width="405.0" height="250.0" rx="10" fill="#fdeceb" stroke="#c0271e" stroke-width="2.0"/>
<text x="687.5" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Режим векторизації (vectoring)</text>
<text x="687.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">задано вектор — складаємо його кут</text>
<text x="507.0" y="170.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">σ = −sign(y)         // женемо y → 0</text>
<text x="507.0" y="192.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">x −= σ·(y &gt;&gt; i)</text>
<text x="507.0" y="214.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">y += σ·(x &gt;&gt; i)</text>
<text x="507.0" y="236.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">z −= σ·atan(2⁻ⁱ)</text>
<line x1="503.0" y1="254.0" x2="872.0" y2="254.0" stroke="#e4e4e4" stroke-width="1.6" stroke-linecap="round"/>
<text x="507.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">старт (x,y,z) = (x₀, y₀, 0)  →</text>
<text x="507.0" y="298.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold">z → atan2(y₀, x₀)</text>
<text x="507.0" y="320.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold">x → K·√(x₀² + y₀²)</text>
<rect x="50.0" y="368.0" width="840.0" height="150.0" rx="10" fill="#fff6e6" stroke="#caa24a" stroke-width="2.0"/>
<text x="470.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому вектор довшає — і чому це не біда</text>
<text x="70.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Кожне псевдо-обертання множить довжину на Aᵢ = √(1 + 2⁻²ⁱ) &gt; 1. За багато кроків ці множники</text>
<text x="70.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зливаються в одну сталу — посилення K. Воно НЕ залежить від кута, тож його знають наперед:</text>
<text x="470.0" y="468.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold">K = Π √(1 + 2⁻²ⁱ)  ≈  1.64676   (для багатьох кроків)</text>
<text x="70.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Лікують двома способами: або стартують з x = 1/K ≈ 0.60725 (тоді cos/sin виходять уже масштабованими),</text>
<text x="70.0" y="512.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">або множать результат на 1/K в кінці — одне-єдине множення на весь алгоритм замість сотень.</text>
</svg>
