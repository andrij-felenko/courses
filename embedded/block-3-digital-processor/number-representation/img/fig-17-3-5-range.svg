<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">00000000 = 0   ·   01111111 = +127   ·   10000000 = −128   ·   11111111 = −1</text>
<text x="430.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Як читати: старший біт 0 → додатне (читай як завжди); 1 → від'ємне (врахуй вагу −128).</text>
<text x="430.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Від'ємних на одне більше (−128 є, а +128 нема) — бо нуль «займає місце» серед додатних.</text>
