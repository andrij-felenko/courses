<text x="440.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Пастки §17.6 нікуди не зникли — та принаймні стали однаковими й відтворюваними на будь-якій машині.</text>
