<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">XOR як керований інвертор і «детектор різниці»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо один вхід — керування: B=0 пропускає A, B=1 інвертує A; а ще XOR — основа суматора (§15.6)</text>
<line x1="120.0" y1="160.0" x2="160.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="120.0" y1="180.0" x2="160.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">B=0</text>
<path d="M 160,150.0 Q 185.3,150.0 206,170 Q 185.3,190.0 160,190.0 Q 172.88,170 160,150.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 153,150.0 Q 165.88,170 153,190.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<line x1="212.0" y1="170.0" x2="250.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="256.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y = A</text>
<text x="180.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B=0: пропускає</text>
<line x1="420.0" y1="160.0" x2="460.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="414.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="420.0" y1="180.0" x2="460.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="414.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">B=1</text>
<path d="M 460,150.0 Q 485.3,150.0 506,170 Q 485.3,190.0 460,190.0 Q 472.88,170 460,150.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 453,150.0 Q 465.88,170 453,190.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<line x1="512.0" y1="170.0" x2="550.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="556.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y = Ā</text>
<text x="480.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B=1: інвертує</text>
<rect x="680.0" y="110.0" width="170.0" height="180.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="765.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Натяк наперед:</text>
<text x="765.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">A ⊕ B = біт СУМИ</text>
<text x="765.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A · B = біт ПЕРЕНОСУ</text>
<text x="765.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">разом — це додавання</text>
<text x="765.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">двох бітів</text>
<text x="765.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(півсуматор —</text>
<text x="765.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">будуємо в §15.6)</text>
<text x="330.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">XOR «спрацьовує на різницю» — тому він і порівнює, і рахує парність, і додає.</text>
</svg>
