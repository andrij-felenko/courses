<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Закони Де Моргана: інверсія перетворює AND ↔ OR</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">‾(A·B) = Ā + B̄  і  ‾(A+B) = Ā · B̄ — тому той самий вентиль можна малювати двома способами</text>
<text x="110.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">‾(A·B) = Ā + B̄</text>
