<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два способи обчислити: простором (схема) чи в часі (процесор)</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ту саму функцію можна «відлити» в залізо назавжди — або виконувати кроками на гнучкій машині</text>
<rect x="60.0" y="90.0" width="360.0" height="250.0" rx="10" fill="none" stroke="#1b1b1b" stroke-width="1.7"/>
<text x="240.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПРОСТОРОВО: окрема схема</text>
<path d="M 140,148.0 L 158.0,148.0 A 12.0,12.0 0 0 1 158.0,172.0 L 140,172.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 210,138.0 L 228.0,138.0 A 12.0,12.0 0 0 1 228.0,162.0 L 210,162.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 180,198.0 L 198.0,198.0 A 12.0,12.0 0 0 1 198.0,222.0 L 180,222.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 260,188.0 L 278.0,188.0 A 12.0,12.0 0 0 1 278.0,212.0 L 260,212.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 150,248.0 L 168.0,248.0 A 12.0,12.0 0 0 1 168.0,272.0 L 150,272.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 240,243.0 Q 257.6,243.0 272,255 Q 257.6,267.0 240,267.0 Q 248.96,255 240,243.0 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<line x1="300.0" y1="205.0" x2="360.0" y2="205.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="310.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">відповідь</text>
<text x="240.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">швидко, але ЖОРСТКО:</text>
<text x="240.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна функція, площа росте зі складністю</text>
<rect x="440.0" y="90.0" width="360.0" height="250.0" rx="10" fill="none" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="620.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">У ЧАСІ: процесор</text>
<rect x="500.0" y="150.0" width="100.0" height="44.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2"/>
<text x="550.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЛП</text>
<rect x="640.0" y="150.0" width="100.0" height="44.0" rx="8" fill="#eef7ee" stroke="#1b1b1b" stroke-width="2"/>
<text x="690.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">регістри</text>
<path d="M 600,172 h 40" fill="none" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<path d="M 640,186 q -20,40 -70,0" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)" stroke-dasharray="4 3"/>
<text x="620.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крок 1 → крок 2 → крок 3 …</text>
<text x="620.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(такт за тактом, за програмою)</text>
<text x="620.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">гнучко й компактно, але ПОВІЛЬНІШЕ:</text>
<text x="620.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один маленький АЛП виконує що завгодно</text>
<text x="430.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Залізо» vs «програма»: той самий результат — або схемою назавжди, або кроками на процесорі.</text>
</svg>
