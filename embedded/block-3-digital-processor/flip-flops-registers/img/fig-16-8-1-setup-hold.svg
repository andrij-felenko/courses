<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Setup / hold: дані мусять «застигнути» довкола фронту такту</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">трохи ПЕРЕД фронтом (setup) і трохи ПІСЛЯ (hold) вхід D має не змінюватися — інакше тригер не «вловить» чисто</text>
<text x="98.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
