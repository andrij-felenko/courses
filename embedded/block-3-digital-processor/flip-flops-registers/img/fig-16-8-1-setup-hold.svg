<text x="250.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">D змінився ЗАВЧАСНО</text>
<text x="620.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">у вікні D стабільний → захоплено чисто ✓</text>
<text x="440.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Якщо ж D зміниться САМЕ у вікні (на фронті) — тригер може «зависнути»: це метастабільність (Рис. 16.8.2).</text>
