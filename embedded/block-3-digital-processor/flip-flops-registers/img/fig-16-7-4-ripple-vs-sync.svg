<text x="650.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">усі тригери — по СПІЛЬНОМУ такту</text>
<text x="650.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">логіка вирішує, кому перемкнутись</text>
<text x="650.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">складніше, зате швидко й без глітчів</text>
<text x="440.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюговий — для невибагливого; синхронний — там, де треба швидкість і чистота (як у процесорі).</text>
</svg>
