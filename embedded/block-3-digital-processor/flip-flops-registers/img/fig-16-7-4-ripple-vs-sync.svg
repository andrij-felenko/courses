<text x="345.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T2</text>
<path d="M 310,185 L 322,192 L 310,199" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="50.0" y1="175.0" x2="90.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="46.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">такт</text>
<text x="245.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">такт → T0 → T1 → T2</text>
<text x="245.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перенос «біжить» (як суматор §15.6)</text>
<text x="245.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">просто, та старший біт відстає</text>
<text x="245.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на суму затримок → можливі глітчі</text>
<rect x="460.0" y="90.0" width="380.0" height="250.0" rx="10" fill="none" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="650.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Синхронний</text>
