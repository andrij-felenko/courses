<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюговий проти синхронного: де перенос «біжить», а де ні</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у ланцюговому кожен тригер чекає попередній (затримка накопичується); у синхронному всі по одному такту</text>
<rect x="50.0" y="90.0" width="390.0" height="250.0" rx="10" fill="none" stroke="#caa24a" stroke-width="1.6"/>
<text x="245.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюговий (ripple)</text>
<rect x="90.0" y="150.0" width="70.0" height="50.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="125.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T0</text>
<path d="M 90,185 L 102,192 L 90,199" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
