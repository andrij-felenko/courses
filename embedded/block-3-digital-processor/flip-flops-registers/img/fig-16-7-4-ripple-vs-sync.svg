<rect x="200.0" y="150.0" width="70.0" height="50.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="235.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T1</text>
