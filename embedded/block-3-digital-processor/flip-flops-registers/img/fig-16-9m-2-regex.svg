<text x="410.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Кожен оператор виразу — це шматок графа; зірочка * стає петлею. Опис і схема — одне й те саме.</text>
