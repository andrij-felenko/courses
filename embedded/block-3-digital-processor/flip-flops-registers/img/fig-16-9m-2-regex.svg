  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8.2" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два описи однієї множини рядків: вираз і автомат</text>
<text x="60.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Алгебра подій (regex) над алфавітом Σ = {0, 1}:</text>
<text x="60.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">три цеглини — і будь-яка «регулярна» множина рядків:</text>
<rect x="60.0" y="122.0" width="220.0" height="64.0" rx="9" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="74.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">вибір</text>
<text x="74.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">a | b</text>
<text x="156.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">«або a, або b»</text>
<rect x="298.0" y="122.0" width="220.0" height="64.0" rx="9" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="312.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">склейка</text>
<text x="312.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">a · b</text>
<text x="394.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">«a, за ним b»</text>
<rect x="536.0" y="122.0" width="220.0" height="64.0" rx="9" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<text x="550.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">повтор</text>
<text x="550.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">a*</text>
<text x="632.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">«a нуль чи більше разів»</text>
<text x="410.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Наш приклад одним виразом — «десь у потоці стоїть 1 0 1»:</text>
<rect x="210.0" y="230.0" width="400.0" height="40.0" rx="9" fill="#eef7ff" stroke="#1f47b5" stroke-width="2"/>
<text x="410.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">(0 | 1)*  ·  1 · 0 · 1  ·  (0 | 1)*</text>
<text x="260.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">будь-що спереду</text>
<text x="410.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">ядро «101»</text>
<text x="560.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">будь-що позаду</text>
<line x1="410.0" y1="322.0" x2="410.0" y2="356.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<rect x="424.0" y="326.0" width="300.0" height="30.0" rx="8" fill="#eefaef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="434.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">теорема Кліні: вираз ⇄ автомат</text>
<text x="110.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Той самий опис — як машина зі станами:</text>
