<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760">
<rect width="880" height="760" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: як змусити схему ПАМ'ЯТАТИ</text>
<text x="440.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більшість фізики «забуває», скочуючись у рівновагу; пам'ять — це навмисна, стійка непокора цьому</text>
<line x1="250.0" y1="100.0" x2="250.0" y2="730.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="130.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">прадавнє</text>
<text x="276.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">питання</text>
<text x="276.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Як зробити, щоб схема ТРИМАЛА обраний стан, а не «розслаблялась»?</text>
<circle cx="250.0" cy="225.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1900-ті</text>
<text x="276.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">реле-засувка / relay latch</text>
<text x="276.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Телефонні станції: реле тримає себе власним контактом — механічна пам'ять</text>
<circle cx="250.0" cy="320.0" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="0"/>
<circle cx="250.0" cy="320.0" r="10.0" fill="none" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="320.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="228.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1918</text>
<text x="276.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Екклз і Джордан / Eccles &amp; Jordan</text>
<text x="276.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Дві перехресно-зв'язані лампи → ДВА стійкі стани: перша електронна комірка пам'яті</text>
<circle cx="250.0" cy="415.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1930-ті</text>
<text x="276.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">назва «flip-flop»</text>
<text x="276.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">За клацанням, з яким схема перекидається між станами</text>
<circle cx="250.0" cy="510.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="515.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1940-ві</text>
<text x="276.0" y="507.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ENIAC</text>
<text x="276.0" y="527.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Тисячі лампових тригерів = регістри й лічильники першого комп'ютера</text>
<circle cx="250.0" cy="605.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="610.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1947 →</text>
<text x="276.0" y="602.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">транзистор → кремній</text>
<text x="276.0" y="622.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Та сама перехресна петля, але крихітна: SRAM, регістри (→ цей розділ)</text>
<circle cx="250.0" cy="700.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="705.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">тепер</text>
<text x="276.0" y="697.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кожен біт пам'яті</text>
<text x="276.0" y="717.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Регістр, кеш, комірка SRAM — прямий нащадок схеми 1918 року</text>
</svg>
