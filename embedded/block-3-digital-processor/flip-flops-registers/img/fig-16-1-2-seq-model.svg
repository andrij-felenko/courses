<rect x="70.0" y="350.0" width="720.0" height="40.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="430.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихід = f(входи, стан) · наступний стан = g(входи, стан) — це кістяк УСІХ схем з пам'яттю</text>
