<line x1="230.0" y1="260.0" x2="280.0" y2="260.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="230.0" cy="260.0" r="2.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<path d="M 280,255 L 292,262 L 280,269" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="325.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">усі тактовані РАЗОМ</text>
<rect x="450.0" y="110.0" width="380.0" height="180.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="640.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що дає спільний такт:</text>
<text x="466.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у машині є єдиний «момент істини» —</text>
<text x="466.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  фронт такту, коли стан змінюється</text>
<text x="466.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• між фронтами все «застигло» й</text>
<text x="466.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  логіка спокійно встигає порахувати</text>
<text x="466.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• уся система передбачувана:</text>
<text x="466.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  крок — порахувати — крок — порахувати</text>
<text x="466.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• це і є СИНХРОННИЙ дизайн</text>
</svg>
