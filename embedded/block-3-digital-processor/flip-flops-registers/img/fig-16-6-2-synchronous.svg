<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Синхронність: один такт на всіх — машина крокує в ногу</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">такт — це диригент: на кожному його фронті ВСІ тригери оновлюються одночасно, крок за кроком</text>
<rect x="70.0" y="150.0" width="90.0" height="50.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="115.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ТАКТ</text>
