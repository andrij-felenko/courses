<line x1="230.0" y1="210.0" x2="280.0" y2="210.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="230.0" cy="210.0" r="2.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
