</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розведення такту: фронт мусить дійти до всіх майже водночас</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо до різних тригерів такт приходить у різний час (перекіс, skew) — синхронність ламається</text>
<rect x="60.0" y="150.0" width="80.0" height="44.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="100.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ТАКТ</text>
<line x1="140.0" y1="172.0" x2="200.0" y2="172.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<circle cx="200.0" cy="172.0" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<line x1="200.0" y1="110.0" x2="200.0" y2="250.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<line x1="200.0" y1="110.0" x2="280.0" y2="110.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<rect x="280.0" y="94.0" width="80.0" height="32.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="320.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<path d="M 280,105 L 292,112 L 280,119" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="200.0" y1="172.0" x2="280.0" y2="172.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<rect x="280.0" y="156.0" width="80.0" height="32.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="320.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<path d="M 280,167 L 292,174 L 280,181" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="200.0" y1="250.0" x2="280.0" y2="250.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<rect x="280.0" y="234.0" width="80.0" height="32.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="320.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<path d="M 280,245 L 292,252 L 280,259" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="420.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">«дерево такту»</text>
<text x="420.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(балансують довжини,</text>
<text x="420.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">щоб фронт приходив рівно)</text>
<rect x="560.0" y="110.0" width="280.0" height="160.0" rx="10" fill="#fbf6ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="700.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Перекіс (skew):</text>
<text x="580.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">якщо один тригер бачить фронт</text>
<text x="580.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пізніше за сусіда, дані можуть</text>
<text x="580.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«прослизнути» на зайвий щабель</text>
<text x="580.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">тому такт розводять акуратно,</text>
<text x="580.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">як гілки дерева однакової довжини</text>
<text x="580.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(строгі межі часу — далі §16.8)</text>
</svg>
