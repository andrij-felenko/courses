<text x="760.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">STOP</text>
<text x="760.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стоп-біт</text>
<path d="M 210.0,150.0 Q 275.0,150.0 340.0,150.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="275.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лінія впала (0)</text>
<path d="M 158.0,110.0 C 144.0,70.0 196.0,70.0 182.0,110.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="170.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лінія=1 (тиша)</text>
<path d="M 420.0,150.0 Q 485.0,150.0 550.0,150.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="485.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пів-біта минуло</text>
<path d="M 578.0,110.0 C 564.0,70.0 616.0,70.0 602.0,110.0" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="590.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лічу біти &lt; 8</text>
<path d="M 610.0,188.0 Q 659.0,254.4 740.0,270.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="720.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">8 бітів зібрано</text>
<path d="M 730.0,280.0 Q 438.5,351.2 188.0,186.0" fill="none" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="420.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стоп-біт перевірено → готово, у IDLE</text>
<rect x="60.0" y="410.0" width="780.0" height="48.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожен такт машина дивиться на вхід (рівень лінії, лічильник бітів) і вирішує: лишитись чи перейти.</text>
<text x="450.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це той самий приймач, що в §16.5 «складав» байт зсувним регістром, — тепер ним КЕРУЄ автомат.</text>
</svg>
