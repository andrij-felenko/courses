<text x="70.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">старт</text>
<circle cx="170.0" cy="150.0" r="40.0" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2.8"/>
<circle cx="170.0" cy="150.0" r="35.0" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="170.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">IDLE</text>
<text x="170.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чекає</text>
<circle cx="380.0" cy="150.0" r="40.0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="380.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">START</text>
<text x="380.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">старт-біт</text>
<circle cx="590.0" cy="150.0" r="40.0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="590.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DATA</text>
<text x="590.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">8 бітів</text>
