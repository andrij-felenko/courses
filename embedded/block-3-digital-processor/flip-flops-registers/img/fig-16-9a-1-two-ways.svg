<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="920" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один автомат — два втілення: код-розгалуження проти таблиці-даних</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">приклад: турнікет {LOCKED, OPEN}, події {COIN, PUSH}</text>
<text x="240.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">А. switch: логіка живе в КОДІ</text>
<rect x="40.0" y="96.0" width="410.0" height="326.0" rx="10" fill="#f4f7ff" stroke="#1f47b5" stroke-width="2"/>
<text x="56.0" y="118.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">switch (state) {</text>
<text x="56.0" y="144.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">  case LOCKED:</text>
<text x="56.0" y="170.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">    if (ev==COIN){ unlock();</text>
<text x="56.0" y="196.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">                   state=OPEN; }</text>
<text x="56.0" y="222.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    else /*PUSH*/  ; // нічого</text>
<text x="56.0" y="248.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    break;</text>
<text x="56.0" y="274.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">  case OPEN:</text>
<text x="56.0" y="300.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">    if (ev==PUSH){ lock();</text>
<text x="56.0" y="326.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">                   state=LOCKED; }</text>
<text x="56.0" y="352.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    else /*COIN*/  ; // ігнор</text>
<text x="56.0" y="378.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    break;</text>
<text x="56.0" y="404.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<text x="240.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="italic">кожен стан і подія — окрема гілка; додати стан = правити код</text>
<text x="705.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Б. таблиця: логіка живе в ДАНИХ</text>
<text x="618.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">стан \ подія</text>
<text x="695.0" y="108.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">COIN</text>
<text x="825.0" y="108.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PUSH</text>
<text x="618.0" y="164.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">LOCKED</text>
<rect x="630.0" y="120.0" width="130.0" height="78.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="695.0" y="150.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ OPEN</text>
<text x="695.0" y="174.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">/ unlock</text>
<rect x="760.0" y="120.0" width="130.0" height="78.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
<text x="825.0" y="150.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">→ LOCKED</text>
<text x="825.0" y="174.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">/ —</text>
<text x="618.0" y="242.0" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">OPEN</text>
<rect x="630.0" y="198.0" width="130.0" height="78.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
<text x="695.0" y="228.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">→ OPEN</text>
<text x="695.0" y="252.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">/ —</text>
<rect x="760.0" y="198.0" width="130.0" height="78.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="825.0" y="228.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ LOCKED</text>
<text x="825.0" y="252.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">/ lock</text>
<text x="705.0" y="302.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">next[state][event] = (новий стан, дія)</text>
<text x="705.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">додати стан = дописати РЯДОК, рушій той самий</text>
<text x="460.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обидва описують ТЕ САМЕ: у стані LOCKED подія COIN → unlock() і перехід в OPEN.</text>
<text x="460.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">Зліва це гілка коду, справа — клітина даних. Таблиця відділяє «що робить автомат» від «як його крутить рушій».</text>
<text x="460.0" y="540.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Рядки таблиці — це банк тригерів зі стану §3.3.1, що тримає поточний стан; рушій лише оновлює його по події.)</text>
</svg>
