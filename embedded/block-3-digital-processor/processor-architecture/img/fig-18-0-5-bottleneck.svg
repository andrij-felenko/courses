<text x="440.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">інструкції + дані — разом</text>
<rect x="60.0" y="286.0" width="760.0" height="92.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Термін увів Джон Бекус (1977): чим швидший процесор, тим частіше він простоює, чекаючи на єдину шину до пам'яті.</text>
<text x="440.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це плата за простоту й універсальність архітектури — і донині головний клопіт у гонитві за швидкодією.</text>
<text x="440.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">§18.7 покаже інший підхід — ГАРВАРДСЬКУ архітектуру (окремі канали коду й даних); до речі, AVR в Arduino — саме така.</text>
</svg>
