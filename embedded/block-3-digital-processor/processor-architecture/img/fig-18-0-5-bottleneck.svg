<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Слабке місце моделі: «вузьке місце фон Неймана»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і інструкції, і дані течуть тим самим єдиним каналом — тож процесор інколи ГОЛОДУЄ, чекаючи пам'ять</text>
<rect x="70.0" y="130.0" width="210.0" height="130.0" rx="12" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="175.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<text x="175.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">швидкий</text>
<rect x="600.0" y="130.0" width="210.0" height="130.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
