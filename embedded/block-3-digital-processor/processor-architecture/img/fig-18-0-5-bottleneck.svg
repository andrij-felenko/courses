<text x="705.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">велика</text>
<path d="M280,150 L420,184 L460,184 L600,150 L600,240 L460,206 L420,206 L280,240 Z" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
