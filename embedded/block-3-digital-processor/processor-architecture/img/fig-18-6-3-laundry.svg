<text x="100.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">п3</text>
<text x="580.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">5 інтервалів!</text>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодна окрема партія не випралася швидше — але всі три готові майже вдвічі скоріше, бо машини не простоюють.</text>
<text x="450.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Аналогія точна: різні «станції» (пралка/сушарка) = різні блоки процесора (вибірка/декодування/виконання).</text>
<text x="450.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ламається вона хіба там, де партія залежить від попередньої (треба ту саму машину двічі) — як і «затори» в процесорі (далі).</text>
