<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серцебиття процесора (§3.5.3) — рядок-у-рядок у коді емулятора</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ліворуч — три фази циклу з теми; праворуч — той самий цикл у while-петлі на C; стрілки єднають фазу з її рядком</text>
