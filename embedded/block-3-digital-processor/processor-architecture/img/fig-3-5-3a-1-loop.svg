<text x="80.1" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="end" font-weight="normal" font-style="italic">команда</text>
<text x="230.0" y="538.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«декодування» зливається з вибіркою:</text>
<text x="230.0" y="554.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розрізати байт на op та операнди (§3.5.3)</text>
<rect x="470.0" y="96.0" width="430.0" height="432.0" rx="12" fill="#0e1116" stroke="#0e1116" stroke-width="0"/>
<text x="488.0" y="122.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#7fd58f" text-anchor="start" font-weight="normal" font-style="normal">// ядро емулятора</text>
<text x="488.0" y="152.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8e8e8" text-anchor="start" font-weight="normal" font-style="normal">while (running) {</text>
<text x="488.0" y="178.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">    byte op = code[ip++];   // ВИБІРКА</text>
<text x="488.0" y="204.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">    byte a  = code[ip++];   //  +декод</text>
<text x="488.0" y="230.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">    switch (op) {           // ВИКОНАННЯ</text>
<text x="488.0" y="256.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">      case HLT: running = 0; break;</text>
<text x="488.0" y="282.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">      case LD:  r[a]=code[ip++]; break;</text>
<text x="488.0" y="308.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">      case ADD: r[a]+=r[code[ip++]];</text>
<text x="488.0" y="334.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">                break;</text>
<text x="488.0" y="360.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">      case ST:  mem[code[ip++]]=r[a];</text>
<text x="488.0" y="386.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">                break;</text>
<text x="488.0" y="412.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">      case JMP: ip = a;      break;</text>
<text x="488.0" y="438.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9aa0a6" text-anchor="start" font-weight="normal" font-style="normal">      // ... решта з 8-ми опкодів ...</text>
<text x="488.0" y="464.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8e8e8" text-anchor="start" font-weight="normal" font-style="normal">    }</text>
<text x="488.0" y="490.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e8e8e8" text-anchor="start" font-weight="normal" font-style="normal">}</text>
