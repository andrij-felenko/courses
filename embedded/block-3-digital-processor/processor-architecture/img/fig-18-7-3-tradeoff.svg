</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Компроміс: гнучкість (фон Нейман) проти швидкості (Гарвард)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">жодна не «краща» — кожна виграє своє й програє своє; вибір залежить від того, що для машини важливіше</text>
<rect x="330.0" y="84.0" width="250.0" height="30.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="455.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ФОН НЕЙМАН</text>
<rect x="610.0" y="84.0" width="250.0" height="30.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="735.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ГАРВАРД</text>
<rect x="70.0" y="122.0" width="250.0" height="48.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">шини до пам'яті</text>
<rect x="330.0" y="122.0" width="250.0" height="48.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одна на все</text>
<rect x="610.0" y="122.0" width="250.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дві окремі</text>
<rect x="70.0" y="178.0" width="250.0" height="48.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">швидкість доступу</text>
<rect x="330.0" y="178.0" width="250.0" height="48.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">впирається у вузьке місце</text>
<rect x="610.0" y="178.0" width="250.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">паралельно — швидше</text>
<rect x="70.0" y="234.0" width="250.0" height="48.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">гнучкість пам'яті</text>
<rect x="330.0" y="234.0" width="250.0" height="48.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">код і дані ділять простір вільно</text>
<rect x="610.0" y="234.0" width="250.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">роздільні простори, жорсткіше</text>
<rect x="70.0" y="290.0" width="250.0" height="48.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«код як дані»</text>
<rect x="330.0" y="290.0" width="250.0" height="48.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">легко (завантажити будь-яку програму)</text>
<rect x="610.0" y="290.0" width="250.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">важко (треба спецзасоби)</text>
<rect x="70.0" y="346.0" width="250.0" height="48.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="82.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">складність</text>
<rect x="330.0" y="346.0" width="250.0" height="48.0" rx="6" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="455.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">простіша</text>
<rect x="610.0" y="346.0" width="250.0" height="48.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">складніша (два набори всього)</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коротко: фон Нейман міняє швидкість на ПРОСТОТУ й ГНУЧКІСТЬ; Гарвард міняє гнучкість на ШВИДКІСТЬ. Класичний інженерний обмін.</text>
</svg>
