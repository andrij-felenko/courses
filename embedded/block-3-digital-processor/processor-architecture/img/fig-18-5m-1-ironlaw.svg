<text x="385.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">×</text>
<text x="425.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<text x="640.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(а робота за секунду = 1 / час)</text>
