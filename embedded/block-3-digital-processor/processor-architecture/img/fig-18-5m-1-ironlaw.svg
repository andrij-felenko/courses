<text x="450.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на одну команду (CPI)</text>
<line x1="346.0" y1="274.0" x2="554.0" y2="274.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="346.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">що задає:</text>
<text x="346.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• мікроархітектура: конвеєр</text>
<text x="346.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">  (§3.5.6), кеш (§3.5.9)</text>
<text x="346.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• склад самих команд</text>
