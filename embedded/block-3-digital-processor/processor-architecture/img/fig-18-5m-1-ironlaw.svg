<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Залізний закон» продуктивності: час програми = добуток трьох множників</text>
<text x="450.0" y="59.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розженеш один множник — час падає; та кожну «ручку» крутить свій рівень, і вони тягнуть одне одного</text>
<text x="170.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">час</text>
