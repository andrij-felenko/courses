<text x="750.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">T — Довжина такту</text>
<text x="750.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">період такту T = 1 / частота</text>
<text x="750.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(секунд на такт)</text>
<line x1="646.0" y1="274.0" x2="854.0" y2="274.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="646.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">що задає:</text>
<text x="646.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• критичний шлях (§3.1.5,</text>
<text x="646.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">  §3.3.8) → стеля частоти</text>
<text x="646.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• техпроцес, напруга, тепло</text>
<rect x="70.0" y="442.0" width="760.0" height="20.0" rx="6" fill="#f5f7fb" stroke="#1f47b5" stroke-width="0"/>
<text x="450.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жоден множник окремо не каже про швидкість: МГц — це лише 1/T, одна ручка з трьох. Важить ДОБУТОК.</text>
