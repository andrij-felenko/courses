<text x="82.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Витягли лінію (рядок) — і беремо</text>
<text x="82.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">з неї всі 4: 1 промах, 3 влучання.</text>
<rect x="560.0" y="378.0" width="224.0" height="86.0" rx="10" fill="#fbf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="572.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Кожен крок — у новій лінії.</text>
<text x="572.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Щоразу новий промах: тягнемо лінію</text>
<text x="572.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">заради 1 клітинки, решту кидаємо.</text>
<text x="470.0" y="586.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Однакові 16 звернень — але обхід рядками влучає в кеш, обхід стовпцями б'є мимо. Звідси й різниця в рази.</text>
</svg>
