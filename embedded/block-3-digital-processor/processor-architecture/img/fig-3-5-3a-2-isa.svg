<text x="262.0" y="288.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">3  r  a</text>
<text x="412.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">mem[a] ← r  (писати в пам'ять)</text>
<text x="772.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">дані</text>
