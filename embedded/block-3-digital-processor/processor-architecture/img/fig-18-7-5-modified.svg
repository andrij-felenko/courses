<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Реальність — спектр: «модифікована Гарвардська» бере від обох</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чисті форми рідкісні; більшість сучасних чипів — гібрид: швидкі роздільні шляхи вгорі, спільна пам'ять унизу</text>
<rect x="360.0" y="86.0" width="180.0" height="44.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="450.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<line x1="410.0" y1="132.0" x2="330.0" y2="168.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<line x1="490.0" y1="132.0" x2="570.0" y2="168.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<rect x="230.0" y="170.0" width="200.0" height="50.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="330.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кеш КОДУ</text>
<text x="330.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(швидкий, біля ядра)</text>
<rect x="470.0" y="170.0" width="200.0" height="50.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="570.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">кеш ДАНИХ</text>
<text x="570.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(швидкий, біля ядра)</text>
<text x="120.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Гарвард-стиль:</text>
<text x="120.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">дві окремі швидкі шини</text>
<line x1="330.0" y1="222.0" x2="410.0" y2="262.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="570.0" y1="222.0" x2="490.0" y2="262.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="300.0" y="264.0" width="300.0" height="50.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">СПІЛЬНА головна пам'ять</text>
<text x="450.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(код і дані разом — фон-нейман стиль)</text>
<text x="770.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">фон-нейман стиль:</text>
<text x="770.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">одна гнучка пам'ять</text>
<rect x="60.0" y="332.0" width="780.0" height="88.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так чип дістає і швидкість Гарварда (паралельні кеші коду/даних біля ядра), і гнучкість фон Неймана (спільна пам'ять унизу).</text>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32 — саме модифікована Гарвардська. AVR — «чистіший» Гарвард, але має спецкоманду читати Flash як дані (бо константи в коді).</text>
<text x="450.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тож «фон Нейман vs Гарвард» — не «або-або», а спектр, з якого інженер бере потрібну суміш під свою задачу.</text>
</svg>
