<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432">
<rect width="900" height="432" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стрибок думки Лавлейс: не калькулятор, а машина СИМВОЛІВ</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Беббідж бачив швидку лічбу; Лавлейс перша зрозуміла, що така машина оперує будь-якими символами за правилами</text>
<rect x="70.0" y="88.0" width="360.0" height="150.0" rx="10" fill="#f8f9fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="250.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Беббідж бачив КАЛЬКУЛЯТОР</text>
<text x="250.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">машину, що швидко й безпомилково</text>
<text x="250.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рахує ЧИСЛА — таблиці, обчислення</text>
<text x="250.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(велика, та все ж «лише» арифметика)</text>
<text x="250.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">123 + 456 = 579</text>
<rect x="470.0" y="88.0" width="360.0" height="150.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Лавлейс побачила МАШИНУ СИМВОЛІВ</text>
<text x="650.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо числа можуть позначати ноти,</text>
<text x="650.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">букви, що завгодно — машина за</text>
<text x="650.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">правилами творитиме музику, графіку…</text>
<text x="650.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">♪ ♫  ✎  ∑  → не лише лічба</text>
<rect x="70.0" y="256.0" width="760.0" height="60.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та вона ж тверезо застерегла: «Машина не претендує ПОРОДЖУВАТИ нічого нового — вона робить лише те, що ми вміємо їй наказати».</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це «заперечення Лавлейс» — найперша думка про межі машинного «розуму», з якою сперечатимуться ще століття (аж до питань про ШІ).</text>
<rect x="70.0" y="332.0" width="760.0" height="80.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесно про заслуги: Беббідж СПРОЄКТУВАВ машини й розробляв алгоритми; Лавлейс написала Нотатки, опублікувала перший</text>
<text x="450.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">алгоритм, знайшла в ньому помилку й — головне — першою осягнула, що це машина ЗАГАЛЬНОГО призначення, а не лічильник.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Обидва внески справжні й різні. Як і з фон Нейманом: велика ідея — то праця кількох, навіть коли історія любить одне ім'я.</text>
</svg>
