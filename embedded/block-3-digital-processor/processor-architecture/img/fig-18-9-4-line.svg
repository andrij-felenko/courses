<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ: кеш возить дані не по байту, а ЛІНІЯМИ (блоками сусідів) — так він наперед хапає те, що підкаже просторова локальність.</text>
<text x="450.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Запит у кеші є → ВЛУЧАННЯ (hit): дані за пару тактів. Нема → ПРОМАХ (miss): похід у повільну пам'ять по цілу лінію.</text>
<text x="450.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Принесену лінію кладуть у кеш — тож наступне звернення до сусіда (a[6], a[7]…) вже буде влучанням.</text>
