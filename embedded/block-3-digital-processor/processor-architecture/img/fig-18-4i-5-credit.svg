<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Велике в техніці майже завжди колективне — пам'ять лише зручно чіпляється за одне ім'я</text>
