<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Нотатка G Лавлейс: перший опублікований алгоритм для машини</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">таблиця операцій для обчислення чисел Бернуллі — її вважають першою «програмою» в історії (схема, спрощено)</text>
