<text x="230.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">повторити</text>
<text x="420.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">цикл по індексу</text>
<text x="620.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">(наступне Bₙ)</text>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це послідовність операцій із циклом — справжня програма, а не просто формула. Лавлейс навіть знайшла й виправила помилку</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у викладках Беббіджа. Тож «числа Бернуллі на машині» — спільна праця, але саме вона це опублікувала й осмислила як алгоритм.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й титул «першої програмістки» — він дискусійний і трохи анахронічний, та її Нотатки незаперечно вагомі й новаторські.</text>
</svg>
