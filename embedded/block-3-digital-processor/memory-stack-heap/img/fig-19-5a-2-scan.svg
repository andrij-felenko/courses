<text x="450.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Близько до нуля — стек майже переповнювався (§3.6.7): час дати задачі більший стек. Багато 0xA5 — стек завеликий, можна вкоротити.</text>
