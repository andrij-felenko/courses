<text x="92.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Усі слоти — рівно одного розміру.</text>
<text x="92.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Арену ділять на N однакових клітинок наперед. Будь-який запит дістає цілий слот; «впору чи ні»</text>
<text x="92.0" y="427.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вирішує єдине порівняння з розміром слота.</text>
<text x="78.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="92.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Заголовка на блок не треба.</text>
<text x="92.0" y="464.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Поки слот вільний, його власне тіло порожнє — туди й кладуть посилання next. Зайнятий слот</text>
<text x="92.0" y="479.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">віддає всі байти даним: службових витрат на блок нуль.</text>
<text x="78.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="92.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Free list тут — простий стек.</text>
<text x="92.0" y="516.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">free_head вказує на перший вільний слот, той — на наступний (next), і так до NULL. Порядок у</text>
<text x="92.0" y="531.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">списку не зобов'язаний збігатися з порядком адрес.</text>
</svg>
