<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки комірок можна адресувати: N бітів адреси → 2ᴺ комірок</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ширина адреси (адресної шини, §18.2) задає розмір пам'яті, яку машина взагалі здатна позначити — знову 2ᴺ (§17.1)</text>
<rect x="120.0" y="96.0" width="200.0" height="50.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="220.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">8 бітів адреси</text>
<line x1="326.0" y1="121.0" x2="386.0" y2="121.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="390.0" y="96.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="500.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2⁸ = 256</text>
<text x="660.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">≈ 256 байтів</text>
<rect x="120.0" y="160.0" width="200.0" height="50.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="220.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">16 бітів адреси</text>
<line x1="326.0" y1="185.0" x2="386.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="390.0" y="160.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="500.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2¹⁶ = 65 536</text>
<text x="660.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 64 КБ</text>
<rect x="120.0" y="224.0" width="200.0" height="50.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.8"/>
<text x="220.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">24 біти адреси</text>
<line x1="326.0" y1="249.0" x2="386.0" y2="249.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="390.0" y="224.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.4"/>
<text x="500.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2²⁴</text>
<text x="660.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">≈ 16 МБ</text>
<rect x="120.0" y="288.0" width="200.0" height="50.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="220.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">32 біти адреси</text>
<line x1="326.0" y1="313.0" x2="386.0" y2="313.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="390.0" y="288.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.4"/>
<text x="500.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2³² ≈ 4.3 млрд</text>
<text x="660.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">≈ 4 ГБ</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось чому «розрядність» процесора стосується й пам'яті: 16-бітна адреса бачить лише 64 КБ, 32-бітна — аж 4 ГБ.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це та сама вибухова формула 2ᴺ із §17.1 — тут вона міряє МІСТКІСТЬ адресного простору. Кожен біт адреси подвоює пам'ять.</text>
</svg>
