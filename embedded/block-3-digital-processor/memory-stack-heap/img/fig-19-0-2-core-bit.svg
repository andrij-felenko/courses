<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один біт — у крихітному феритовому кільці</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">напрямок намагніченості кільця кодує 0 чи 1; завдяки гістерезису він тримається й БЕЗ живлення (нелетко)</text>
<circle cx="220.0" cy="150.0" r="46.0" fill="none" stroke="#1f47b5" stroke-width="3.4"/>
<line x1="194.7" y1="104.0" x2="245.3" y2="104.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="220.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="220.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">за годинниковою = 0</text>
<circle cx="420.0" cy="150.0" r="46.0" fill="none" stroke="#c0271e" stroke-width="3.4"/>
<line x1="445.3" y1="104.0" x2="394.7" y2="104.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="420.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="420.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">проти годинникової = 1</text>
<text x="320.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий</text>
<text x="320.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">магнітик —</text>
<text x="320.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два напрямки</text>
<text x="650.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">гістерезис: «магнітна пам'ять»</text>
<line x1="560.0" y1="175.0" x2="740.0" y2="175.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<line x1="650.0" y1="230.0" x2="650.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<text x="746.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">струм</text>
<text x="654.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">намагніч.</text>
<polyline points="570.0,213.0 630.0,213.0 630.0,137.0 730.0,137.0 670.0,137.0 670.0,213.0 570.0,213.0" fill="none" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="600.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="700.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="650.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">прямокутна петля: стан «застрягає» в одному з двох —</text>
<text x="650.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і лишається там навіть коли струм зник</text>
<rect x="60.0" y="300.0" width="760.0" height="96.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На відміну від тригера (Розділ 16), що тримає біт, лише поки є живлення, осердя пам'ятає й знеструмлене —</text>
<text x="440.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">бо магнітний матеріал «застрягає» в одному з двох напрямків (гістерезис). Вимкнув машину — пам'ять ціла.</text>
<text x="440.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Кільця були крихітні (спершу ~1 мм, далі ще менші) — мільйони їх на машину, нанизані вручну на сітку дротів.</text>
</svg>
