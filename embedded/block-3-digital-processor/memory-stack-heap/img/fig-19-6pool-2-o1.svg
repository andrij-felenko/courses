<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
<rect width="940" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виділення й звільнення за O(1): зняв вершину — поклав назад</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">pool_alloc бере перший слот зі списку (без пошуку); pool_free кладе слот назад на вершину</text>
<rect x="70.0" y="86.0" width="380.0" height="200.0" rx="10" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="260.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">pool_alloc()  —  знімаємо вершину</text>
<rect x="140.0" y="132.0" width="150.0" height="30.0" rx="5" fill="#d8efdf" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="215.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">слот A</text>
<line x1="215.0" y1="164.0" x2="215.0" y2="176.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="223.0" y="175.0" font-family="Consolas, monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal">next</text>
<rect x="140.0" y="178.0" width="150.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="215.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">слот B</text>
<line x1="215.0" y1="210.0" x2="215.0" y2="222.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="223.0" y="221.0" font-family="Consolas, monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal">next</text>
<rect x="140.0" y="224.0" width="150.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="215.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">слот C</text>
<text x="84.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">free_head</text>
<line x1="132.0" y1="146.0" x2="140.0" y2="146.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#aAmber)"/>
<line x1="296.0" y1="146.0" x2="350.0" y2="146.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="354.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ повертаємо</text>
<text x="354.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">  адресу A</text>
<text x="86.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">free_head ← A.next (тепер вершина = B).  Жодного перебору — три-чотири інструкції.</text>
<rect x="490.0" y="86.0" width="380.0" height="200.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.7"/>
<text x="680.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">pool_free(p)  —  кладемо назад</text>
<rect x="600.0" y="178.0" width="150.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="675.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">слот B</text>
<line x1="675.0" y1="210.0" x2="675.0" y2="222.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<rect x="600.0" y="224.0" width="150.0" height="30.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="675.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">слот C</text>
<rect x="600.0" y="132.0" width="150.0" height="30.0" rx="5" fill="#d6e4fa" stroke="#1f47b5" stroke-width="2.4"/>
<text x="675.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">p (повертаємо)</text>
<line x1="675.0" y1="164.0" x2="675.0" y2="176.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="683.0" y="175.0" font-family="Consolas, monospace" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="normal">next</text>
<text x="534.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">free_head</text>
<line x1="592.0" y1="146.0" x2="600.0" y2="146.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#aAmber)"/>
<text x="506.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">p.next ← free_head;  free_head ← p.  Теж кілька інструкцій — і теж O(1).</text>
<rect x="60.0" y="320.0" width="820.0" height="200.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Чому це швидше за звичайний malloc</text>
<rect x="90.0" y="372.0" width="94.0" height="40.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="96.0" y="389.0" font-family="Consolas, monospace" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal">48Б</text>
<text x="137.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">free</text>
<rect x="190.0" y="372.0" width="78.0" height="40.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.6"/>
<text x="196.0" y="389.0" font-family="Consolas, monospace" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal">16Б</text>
<text x="229.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">зайн.</text>
<rect x="274.0" y="372.0" width="86.0" height="40.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="280.0" y="389.0" font-family="Consolas, monospace" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal">32Б</text>
<text x="317.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">free</text>
<rect x="366.0" y="372.0" width="118.0" height="40.0" rx="4" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="372.0" y="389.0" font-family="Consolas, monospace" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal">96Б</text>
<text x="425.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">free</text>
<rect x="490.0" y="372.0" width="82.0" height="40.0" rx="4" fill="#fbe6e4" stroke="#c0271e" stroke-width="1.6"/>
<text x="496.0" y="389.0" font-family="Consolas, monospace" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal">24Б</text>
<text x="531.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">зайн.</text>
<text x="90.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">malloc(40): перебирає список, міряє КОЖЕН блок «чи влізе 40?», ділить знайдений…</text>
<line x1="110.0" y1="428.0" x2="110.0" y2="416.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="116.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">малий?</text>
<line x1="240.0" y1="428.0" x2="240.0" y2="416.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="246.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">зайнятий?</text>
<line x1="390.0" y1="428.0" x2="390.0" y2="416.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="396.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">влазить → ділю</text>
<rect x="90.0" y="470.0" width="760.0" height="38.0" rx="8" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="493.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пул: усі слоти однакові → шукати нема чого. Вершину видно одразу — звідси O(1) і сталий, передбачуваний час.</text>
</svg>
