<text x="525.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">одне 32-бітне число</text>
<text x="525.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">0x12345678</text>
<text x="525.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">= 4 байти за адресами</text>
<text x="525.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0x10, 0x11, 0x12, 0x13</text>
<text x="525.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(порядок байтів — endianness, §17.7)</text>
<text x="280.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">адреса</text>
<rect x="60.0" y="308.0" width="780.0" height="92.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Байт — найдрібніша адресована порція (§17.1). Хочеш 16-, 32- чи 64-бітне число — воно лягає в 2, 4 чи 8 сусідніх комірок.</text>
<text x="450.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">А в якому ПОРЯДКУ ті байти розкладені (молодший першим чи старший) — це вже endianness із §17.7; тут — лише що вони сусідні.</text>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому, до речі, адреси багатобайтових значень зазвичай кратні їхньому розміру (вирівнювання) — так залізу зручніше читати.</text>
</svg>
