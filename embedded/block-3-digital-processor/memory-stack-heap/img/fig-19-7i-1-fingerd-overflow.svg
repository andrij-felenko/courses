  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як хробак пробивав fingerd: класичне «smashing the stack»</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">буфер на 512 байтів читали через gets() — а gets() не знає меж і пише стільки, скільки прийшло</text>
<text x="185.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Звичайний запит (вкладається)</text>
<rect x="60.0" y="92.0" width="250.0" height="150.0" rx="6" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.6"/>
<rect x="76.0" y="108.0" width="218.0" height="70.0" rx="4" fill="#e7f2ea" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="185.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">буфер[512]</text>
<text x="185.0" y="156.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal">"andrij\0" …</text>
<rect x="76.0" y="184.0" width="218.0" height="22.0" rx="3" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="185.0" y="199.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="normal">збережені регістри</text>
<rect x="76.0" y="208.0" width="218.0" height="22.0" rx="3" fill="#fff8e6" stroke="#caa24a" stroke-width="1.4"/>
<text x="185.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">адреса повернення →</text>
<text x="185.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">функція чесно повертається назад</text>
<text x="735.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Запит хробака: 536 байтів у 512</text>
<rect x="610.0" y="92.0" width="250.0" height="150.0" rx="6" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<rect x="626.0" y="108.0" width="218.0" height="70.0" rx="4" fill="#f7e2e2" stroke="#c0271e" stroke-width="1.4"/>
<text x="735.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">буфер[512]</text>
<text x="735.0" y="152.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal">код хробака (shell)</text>
<text x="735.0" y="169.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal">0x90 0x90 … exec()</text>
<rect x="626.0" y="184.0" width="218.0" height="22.0" rx="3" fill="#f7e2e2" stroke="#c0271e" stroke-width="1.2"/>
<text x="735.0" y="199.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal">затерто «зайвими» 24 Б</text>
<rect x="626.0" y="208.0" width="218.0" height="22.0" rx="3" fill="#ffd9d9" stroke="#c0271e" stroke-width="1.8"/>
<text x="735.0" y="223.0" font-family="Consolas, 'Courier New', monospace" font-size="10.3" fill="#c0271e" text-anchor="middle" font-weight="bold">адреса повернення = &amp;буфер</text>
<line x1="854.0" y1="219.0" x2="886.0" y2="219.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="880.0" y1="219.0" x2="880.0" y2="142.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="880.0" y1="142.0" x2="854.0" y2="142.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="735.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">«повертається» у власний код хробака</text>
<text x="460.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому 536 у 512: «зайві» 24 байти перелазять за буфер і лягають точно на адресу повернення</text>
<rect x="150.0" y="312.0" width="592.2" height="30.0" rx="0" fill="#e7f2ea" stroke="#1f8a3b" stroke-width="1.4"/>
<rect x="742.2" y="312.0" width="27.8" height="30.0" rx="0" fill="#ffd9d9" stroke="#c0271e" stroke-width="1.6"/>
<text x="446.1" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">512 байтів буфера</text>
<text x="756.1" y="361.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+24</text>
<line x1="150.0" y1="348.0" x2="150.0" y2="356.0" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
<line x1="770.0" y1="348.0" x2="770.0" y2="356.0" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="370.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal">0</text>
<text x="770.0" y="370.0" font-family="Consolas, 'Courier New', monospace" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="normal">536</text>
<rect x="60.0" y="408.0" width="800.0" height="88.0" rx="9" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="460.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь — рівно той, що в §3.6.7: запис за межі масиву + відсутність перевірки довжини.</text>
<text x="460.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">gets() приймає лише адресу буфера, але не його розмір — і фізично не може спинитись на 512-му байті.</text>
<text x="460.0" y="477.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Саме тому gets() згодом викинули зі стандарту C, а перевірка меж стала залізним правилом.</text>
</svg>
