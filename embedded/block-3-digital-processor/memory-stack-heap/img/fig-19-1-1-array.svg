<text x="450.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це та сама модель, що дали осердя (історія розділу): решітка комірок, до кожної — за її координатою/номером.</text>
