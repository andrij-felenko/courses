<text x="470.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">внутрішня втрата W = видане − запит        (завжди ≥ H, часто більше)</text>
