<text x="60.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• «незручні» розміри (17→32, 33→64) втрачають майже половину: трохи переступив клас — і платиш за весь наступний;</text>
<text x="60.0" y="552.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• частка W/видане падає для великих блоків — фіксований заголовок розчиняється; тому дрібні часті alloc найгірші.</text>
