<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">видане = округлити(запит + заголовок) до класу розміру; внутрішня втрата = видане − запит</text>
