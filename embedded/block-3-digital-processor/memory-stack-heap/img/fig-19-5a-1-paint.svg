<text x="628.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  (інші РТОС беруть 0xAA, 0x99)</text>
<rect x="60.0" y="452.0" width="780.0" height="64.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ідея проста, як сліди на свіжому снігу: засипати порожнечу відомою «фарбою», а потім дивитися, ДОКУДИ її стерли.</text>
<text x="450.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Заливку роблять лише раз — при створенні задачі (й тільки якщо ввімкнено облік стека), тож вона майже безкоштовна.</text>
