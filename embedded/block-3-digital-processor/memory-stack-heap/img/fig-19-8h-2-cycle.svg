<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
<rect width="940" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7b3fb0"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серце EPROM: записати електрикою, стерти — ультрафіолетом крізь кварцове віконце</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">записати можна окремі біти; стерти — лише ВЕСЬ чип одразу, спалахом УФ-світла, що скидає весь замкнений заряд</text>
<rect x="60.0" y="150.0" width="150.0" height="96.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="135.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Чистий чип</text>
<text x="135.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усі плавучі затвори</text>
<text x="135.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">порожні</text>
<text x="135.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">усі біти = 1</text>
<line x1="210.0" y1="198.0" x2="300.0" y2="198.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="255.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗАПИС</text>
<text x="255.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">висока</text>
<text x="255.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруга</text>
<rect x="300.0" y="150.0" width="150.0" height="96.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="2"/>
<text x="375.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Запрограмовано</text>
<text x="375.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у потрібні комірки</text>
<text x="375.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вкладено заряд</text>
<text x="375.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">є й 0, і 1 — це програма</text>
<line x1="375.0" y1="246.0" x2="375.0" y2="298.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="383.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">процесор читає код</text>
<rect x="286.0" y="306.0" width="178.0" height="40.0" rx="8" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="375.0" y="331.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримає дані роками без живлення (нелетка)</text>
<line x1="450.0" y1="198.0" x2="546.0" y2="198.0" stroke="#7b3fb0" stroke-width="2.6" marker-end="url(#aViolet)"/>
<text x="498.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">СТИРАННЯ</text>
<text x="498.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">~20 хв УФ</text>
<rect x="546.0" y="144.0" width="210.0" height="108.0" rx="10" fill="#faf6fd" stroke="#7b3fb0" stroke-width="2.2"/>
<text x="651.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">Кварцове віконце + УФ-лампа</text>
<rect x="572.0" y="190.0" width="158.0" height="40.0" rx="4" fill="#e9e2ef" stroke="#1b1b1b" stroke-width="1.8"/>
<circle cx="651.0" cy="210.0" r="13.0" fill="#ffffff" stroke="#7b3fb0" stroke-width="2"/>
<text x="651.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">кварц</text>
<line x1="590.0" y1="152.0" x2="590.0" y2="188.0" stroke="#7b3fb0" stroke-width="1.8" marker-end="url(#aViolet)"/>
<line x1="620.5" y1="152.0" x2="620.5" y2="188.0" stroke="#7b3fb0" stroke-width="1.8" marker-end="url(#aViolet)"/>
<line x1="651.0" y1="152.0" x2="651.0" y2="188.0" stroke="#7b3fb0" stroke-width="1.8" marker-end="url(#aViolet)"/>
<line x1="681.5" y1="152.0" x2="681.5" y2="188.0" stroke="#7b3fb0" stroke-width="1.8" marker-end="url(#aViolet)"/>
<line x1="712.0" y1="152.0" x2="712.0" y2="188.0" stroke="#7b3fb0" stroke-width="1.8" marker-end="url(#aViolet)"/>
<text x="651.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">ультрафіолет</text>
<text x="651.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">світло вибиває заряд — увесь чип знову чистий</text>
<line x1="651.0" y1="262.0" x2="651.0" y2="316.0" stroke="#7b3fb0" stroke-width="2" marker-end="url(#aViolet)"/>
<line x1="651.0" y1="316.0" x2="135.0" y2="316.0" stroke="#7b3fb0" stroke-width="2" marker-end="url(#aViolet)"/>
<line x1="135.0" y1="316.0" x2="135.0" y2="246.0" stroke="#7b3fb0" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="135.0" y1="252.0" x2="135.0" y2="246.0" stroke="#7b3fb0" stroke-width="2" marker-end="url(#aViolet)"/>
<text x="393.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7b3fb0" text-anchor="middle" font-weight="bold" font-style="normal">знову чисто → можна прошивати наново</text>
<rect x="60.0" y="392.0" width="820.0" height="60.0" rx="10" fill="#faf6fd" stroke="#7b3fb0" stroke-width="1.8"/>
<text x="470.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уперше пам'ять-ROM стала БАГАТОРАЗОВОЮ: помилку в програмі можна було стерти й перепрошити той самий чип.</text>
<text x="470.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Асиметрія назавжди: запис — точковий і електричний; стирання — грубе, оптичне, лише цілим чипом. Цей слід дожив до Flash.</text>
</svg>
