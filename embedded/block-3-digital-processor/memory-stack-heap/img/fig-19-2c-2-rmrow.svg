<text x="505.0" y="222.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x3FF7_FFFF</text>
<text x="737.5" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R/W · регістри</text>
<line x1="152.0" y1="166.0" x2="152.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="74.0" y="254.0" width="156.0" height="60.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="152.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">РЕГІОН</text>
<text x="152.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ім'я з RM —</text>
<text x="152.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">шукай SRAM/FLASH/тут</text>
<line x1="325.0" y1="166.0" x2="325.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="247.0" y="254.0" width="156.0" height="60.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="325.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">BASE</text>
<text x="325.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">перша адреса</text>
<text x="325.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">регіону (звідки)</text>
<line x1="505.0" y1="166.0" x2="505.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="427.0" y="254.0" width="156.0" height="60.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="505.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">END</text>
<text x="505.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">остання адреса;</text>
<text x="505.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">size = end−base+1</text>
<line x1="737.0" y1="166.0" x2="737.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="659.0" y="254.0" width="156.0" height="60.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="737.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ДОСТУП</text>
<text x="737.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R/W чи R-only;</text>
<text x="737.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">яка шина (§3.5.7)</text>
<rect x="60.0" y="332.0" width="820.0" height="58.0" rx="9" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="470.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розмір регіону рахуй сам: size = end − base + 1. Для SRAM вище: 0x3FFD_FFFF − 0x3FFB_0000 + 1 = 0x30000 = 196 608 байт ≈ 192 КБ.</text>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Стовпчик «доступ» підказує, що за §3.6.2 буде RO (код, сталі) чи RW (змінні): instr.-шина — це код-простір, data-шина — пам'ять даних.</text>
</svg>
