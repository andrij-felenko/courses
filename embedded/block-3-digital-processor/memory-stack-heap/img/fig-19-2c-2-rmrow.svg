<text x="325.0" y="188.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x4000_0000</text>
<text x="505.0" y="188.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x4005_FFFF</text>
<text x="737.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R-only · instr. bus</text>
<rect x="70.0" y="200.0" width="810.0" height="34.0" rx="0" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.4"/>
