<text x="325.0" y="151.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x3FFB_0000</text>
<text x="505.0" y="151.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold">0x3FFD_FFFF</text>
<text x="737.5" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R/W · data bus</text>
