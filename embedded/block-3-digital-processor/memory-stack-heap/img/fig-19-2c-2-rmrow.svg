<line x1="235.0" y1="92.0" x2="235.0" y2="126.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="505.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">End address</text>
<line x1="415.0" y1="92.0" x2="415.0" y2="126.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="737.5" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Доступ / шина</text>
