<text x="494.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">обране!</text>
<text x="494.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">X1+Y2</text>
<text x="494.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">повний струм</text>
<rect x="615.0" y="120.0" width="250.0" height="130.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="740.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Половинки додаються</text>
<text x="630.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">• на обраному X: пів-струму</text>
<text x="630.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• на обраному Y: пів-струму</text>
<text x="630.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• на перетині: пів+пів = повний</text>
<text x="630.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ перемикається ЛИШЕ воно</text>
<rect x="60.0" y="410.0" width="780.0" height="60.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся хитрість: решта осердь на тих лініях дістають лише ПОЛОВИНУ струму — замало, щоб перемкнутись. Спрацьовує тільки перетин.</text>
<text x="450.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому одне осердя з тисяч адресують лише двома дротами (X та Y) — не дротом до кожного. Це й зробило пам'ять практичною.</text>
</svg>
