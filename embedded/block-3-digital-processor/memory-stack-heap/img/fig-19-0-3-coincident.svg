<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Геній Форрестера: вибір одного осердя «збігом струмів» по сітці X–Y</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пів-струму по дроту X + пів-струму по дроту Y → лише осердя на ПЕРЕТИНІ дістає повний струм і перемикається</text>
