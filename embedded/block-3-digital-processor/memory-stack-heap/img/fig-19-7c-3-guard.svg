<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
<rect width="920" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому стек не затопить сусіда: глуха смуга-вартовий під ним</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">переповнення стека (§3.6.7) врізається не в чужі дані, а в регіон «жодного доступу» — і MPU миттєво зупиняє чип</text>
<text x="180.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">без MPU (§3.6.7)</text>
<rect x="70.0" y="110.0" width="220.0" height="70.0" rx="4" fill="#eaf0fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="180.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стек</text>
<text x="180.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">RW, росте вниз ↓</text>
<rect x="70.0" y="188.0" width="220.0" height="56.0" rx="4" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="180.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">спільний</text>
<text x="180.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вільний простір</text>
<rect x="70.0" y="252.0" width="220.0" height="64.0" rx="4" fill="#eafaef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="180.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">.data сусіда</text>
<text x="180.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">звичайна доступна пам'ять</text>
<line x1="180.0" y1="150.0" x2="180.0" y2="300.0" stroke="#c0271e" stroke-width="3" stroke-dasharray="2,3" marker-end="url(#aRed)"/>
<text x="180.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стек переріс і мовчки</text>
<text x="180.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">затер .data сусіда —</text>
<text x="180.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">баг тихий, далекий,</text>
<text x="180.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">несталий (§3.6.7)</text>
<text x="670.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">з MPU</text>
<rect x="560.0" y="110.0" width="220.0" height="70.0" rx="4" fill="#eaf0fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="670.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стек задачі</text>
<text x="670.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">RW, росте вниз ↓</text>
<rect x="560.0" y="188.0" width="220.0" height="56.0" rx="4" fill="#fdecec" stroke="#c0271e" stroke-width="2.4"/>
<line x1="580.0" y1="188.0" x2="580.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="600.0" y1="188.0" x2="600.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="620.0" y1="188.0" x2="620.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="640.0" y1="188.0" x2="640.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="660.0" y1="188.0" x2="660.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="680.0" y1="188.0" x2="680.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="700.0" y1="188.0" x2="700.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="720.0" y1="188.0" x2="720.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="740.0" y1="188.0" x2="740.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="760.0" y1="188.0" x2="760.0" y2="244.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="670.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">регіон-вартовий</text>
<text x="670.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЖОДНОГО доступу</text>
<rect x="560.0" y="252.0" width="220.0" height="64.0" rx="4" fill="#eafaef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="670.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">.data сусіда</text>
<text x="670.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">цілий і недоторканий</text>
<line x1="670.0" y1="150.0" x2="670.0" y2="184.0" stroke="#c0271e" stroke-width="3" stroke-dasharray="2,3" marker-end="url(#aRed)"/>
<text x="810.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">перший же запис</text>
<text x="810.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">у вартового →</text>
<text x="810.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">fault, чип спинено</text>
<text x="810.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">до псування сусіда</text>
<line x1="460.0" y1="86.0" x2="460.0" y2="332.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,4" stroke-linecap="round"/>
<rect x="60.0" y="356.0" width="800.0" height="124.0" rx="10" fill="#f7f9fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="460.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек однаково «хоче» затопити сусіда в обох випадках — різниця в тому, що під ним лежить.</text>
<text x="460.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Без MPU нижче стека — звичайна доступна пам'ять, тож перевитрата мовчки псує її, і симптом спливе геть в іншому місці.</text>
<text x="460.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">З MPU під кожен стек кладуть тонкий регіон «жодного доступу» (guard). Перший же запис у нього — порушення прав,</text>
<text x="460.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">MPU збуджує виняток, і ядро зупиняється РАНІШЕ, ніж зачепить чужу пам'ять. Стіна стоїть на самій межі стека.</text>
<text x="460.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ось точна відповідь на «чому стек не затопить сусіда»: між ними — апаратна глуха стіна, а не просто порожнеча.</text>
</svg>
