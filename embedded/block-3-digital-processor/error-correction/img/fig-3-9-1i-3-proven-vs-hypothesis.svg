<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520">
<rect width="940" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Доведений факт vs правдоподібна, але НЕдоведена причина</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">офіційний висновок був стриманим: у програмі помилки не знайшли → «імовірно, спонтанна інверсія біта». ЧИМ її спричинено — не встановлено</text>
<rect x="240.0" y="80.0" width="460.0" height="52.0" rx="10" fill="#f6f6f6" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="470.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">СПОСТЕРЕЖЕННЯ (факт):</text>
<text x="470.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у пам'яті комірка дала +4096 = перекинувся один біт (поз. 13)</text>
<line x1="410.0" y1="134.0" x2="270.0" y2="168.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<line x1="530.0" y1="134.0" x2="670.0" y2="168.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#aAmber)"/>
<rect x="60.0" y="172.0" width="380.0" height="150.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ ДОВЕДЕНО (зафіксовано в звіті)</text>
<text x="82.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у програмному коді помилки не виявили;</text>
<text x="82.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• інші кандидати при перерахунку — без змін;</text>
<text x="82.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у неї рівно −4096 = одиничний бітовий збій;</text>
<text x="82.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• офіційне формулювання: «спонтанна</text>
<text x="82.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  інверсія двійкового розряду».</text>
<rect x="500.0" y="172.0" width="380.0" height="150.0" rx="12" fill="#fff8ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="690.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">? ГІПОТЕЗА (правдоподібна, не доведена)</text>
<text x="522.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• популярне пояснення: космічна частинка</text>
<text x="522.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  (одиничний збій, SEU) перекинула біт;</text>
<text x="522.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• фізично можливо й співзвучно фактам,</text>
<text x="522.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  АЛЕ прямого доказу немає:</text>
<text x="522.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ту частинку ніхто не «упіймав».</text>
<text x="470.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому варто бути обережним: «не знайшли помилки в коді» ≠ «помилки не було».</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий слід (+4096) могли б лишити й інші причини, які теж НЕ виключені до кінця:</text>
<rect x="46.0" y="388.0" width="200.0" height="84.0" rx="9" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="146.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">збій ПАМ'ЯТІ</text>
<text x="146.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дефект комірки,</text>
<text x="146.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">наведення, перешкода</text>
<rect x="262.0" y="388.0" width="200.0" height="84.0" rx="9" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="362.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">збій ЖИВЛЕННЯ</text>
<text x="362.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">просадка/викид</text>
<text x="362.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруги в момент запису</text>
<rect x="478.0" y="388.0" width="200.0" height="84.0" rx="9" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="578.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">рідкісний БАГ</text>
<text x="578.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">помилку в коді</text>
<text x="578.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">просто не помітили</text>
<rect x="694.0" y="388.0" width="200.0" height="84.0" rx="9" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.6"/>
<text x="794.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">космічна</text>
<text x="794.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ЧАСТИНКА</text>
<text x="794.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">правдоподібно,</text>
<text x="794.0" y="460.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">але не доведено</text>
<rect x="60.0" y="484.0" width="820.0" height="30.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="470.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як подавати таке чесно: «один біт перекинувся» — ФАКТ; «винна космічна частинка» — ПРАВДОПОДІБНА, але НЕдоведена версія.</text>
</svg>
