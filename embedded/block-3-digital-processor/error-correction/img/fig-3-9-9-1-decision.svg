<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
<rect width="900" height="620" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що ставити де: від найдешевшого детектора до повного виправлення</text>
<text x="450.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три питання вибирають інструмент: чи треба ВИПРАВЛЯТИ? які помилки — поодинокі чи ПАКЕТНІ? наскільки дешево?</text>
<rect x="70.0" y="90.0" width="560.0" height="96.0" rx="9" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<text x="88.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Парність / 1 біт</text>
<text x="88.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1 біт контролю. Бачить 1 помилку, не виправляє.</text>
<text x="88.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Де: UART-кадр, простий регістр, дешеві лінії.</text>
<rect x="646.0" y="118.0" width="200.0" height="38.0" rx="8" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.6"/>
<text x="746.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">виявлення</text>
<line x1="100.0" y1="186.0" x2="108.0" y2="210.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="78.0" y="210.0" width="560.0" height="96.0" rx="9" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<text x="96.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Контрольна сума (сума / Флетчер)</text>
<text x="96.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кілька байтів. Ловить більшість помилок, дешева в коді.</text>
<text x="96.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Де: легкі протоколи, заголовки, файли — коли заліза CRC нема.</text>
<rect x="654.0" y="238.0" width="200.0" height="38.0" rx="8" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.6"/>
<text x="754.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">виявлення</text>
<line x1="108.0" y1="306.0" x2="116.0" y2="330.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="86.0" y="330.0" width="560.0" height="96.0" rx="9" fill="#fff" stroke="#c0271e" stroke-width="2.2"/>
<text x="104.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">CRC</text>
<text x="104.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потужне виявлення пакетів, апаратно майже безкоштовне.</text>
<text x="104.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Де: CAN, Ethernet, SD, USB, серйозний кадр поверх UART.</text>
<rect x="662.0" y="358.0" width="200.0" height="38.0" rx="8" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.6"/>
<text x="762.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">виявлення (сильне)</text>
<line x1="116.0" y1="426.0" x2="124.0" y2="450.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="94.0" y="450.0" width="560.0" height="96.0" rx="9" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="112.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ECC: Геммінг/SECDED, BCH</text>
<text x="112.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ВИПРАВЛЯЄ на льоту. Платимо зайвими бітами.</text>
<text x="112.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Де: RAM серверів, Flash/NAND, регістри в радіації.</text>
<rect x="670.0" y="478.0" width="200.0" height="38.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="770.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">виправлення</text>
<line x1="124.0" y1="546.0" x2="132.0" y2="570.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="102.0" y="570.0" width="560.0" height="96.0" rx="9" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="120.0" y="598.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Рід–Соломон / каскад</text>
<text x="120.0" y="620.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">виправляє ПАКЕТИ символів; стійкий до подряпин і завмирань.</text>
<text x="120.0" y="638.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Де: носії (CD/QR), супутник, далекий космос (§3.9.8 — Вояджери).</text>
<rect x="678.0" y="598.0" width="200.0" height="38.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="778.0" y="622.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">виправлення (пакети)</text>
<text x="40.0" y="606.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Стрілка вниз = «треба більше надійності й готовий платити дорожче». Більшість систем поєднує кілька рівнів одразу.</text>
</svg>
