<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<rect width="960" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fa0"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві величини, якими міряють чутливість: LET частинки і переріз σ комірки</text>
<text x="480.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">LET каже, наскільки «важко б'є» частинка; переріз σ каже, яка ймовірність, що удар спричинить збій</text>
<rect x="56.0" y="84.0" width="322.0" height="300.0" rx="10" fill="#faf7fd" stroke="#6a3fa0" stroke-width="1.6"/>
<text x="217.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6a3fa0" text-anchor="middle" font-weight="bold" font-style="normal">LET — linear energy transfer</text>
<text x="217.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(лінійна передача енергії)</text>
<text x="217.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скільки енергії частинка лишає</text>
<text x="217.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на одиницю довжини треку</text>
<rect x="86.0" y="184.0" width="262.0" height="30.0" rx="6" fill="#ffffff" stroke="#6a3fa0" stroke-width="1.4"/>
<text x="217.0" y="204.0" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#6a3fa0" text-anchor="middle" font-weight="bold" font-style="normal">[ MeV · cm² / мг ]</text>
<text x="217.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">більший LET → густіший слід заряду:</text>
<text x="217.0" y="256.0" font-family="Cascadia Mono, Consolas, monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Q  ≈  (LET / E_пари) · q · довжина</text>
<text x="217.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(E_пари ≈ 3.6 еВ на пару в кремнії)</text>
<rect x="78.0" y="288.0" width="278.0" height="78.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="217.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">критерій перевертання біта:</text>
<text x="217.0" y="334.0" font-family="Cascadia Mono, Consolas, monospace" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Q  &gt;  Q_crit</text>
<text x="217.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q_crit — найменший заряд, що перекидає вузол</text>
<line x1="384.0" y1="234.0" x2="422.0" y2="234.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="404.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тому</text>
<text x="690.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переріз σ(LET): «ефективна мішень» комірки</text>
<line x1="470.0" y1="360.0" x2="924.0" y2="360.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="470.0" y1="360.0" x2="470.0" y2="98.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="918.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LET</text>
<text x="918.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(сила удару)</text>
<text x="434.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">σ</text>
<text x="434.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">[см²/біт]</text>
<polyline points="470.0,360.0 477.3,360.0 484.7,360.0 492.0,360.0 499.3,360.0 506.7,360.0 514.0,360.0 521.3,360.0 528.7,360.0 536.0,360.0 543.3,360.0 550.7,360.0 558.0,360.0 565.3,360.0 572.7,360.0 580.0,360.0 587.3,360.0 594.7,360.0 602.0,360.0 609.3,358.1 616.7,353.6 624.0,347.0 631.3,338.6 638.7,328.9 646.0,318.1 653.3,306.6 660.7,294.7 668.0,282.6 675.3,270.6 682.7,258.9 690.0,247.7 697.3,237.0 704.7,227.0 712.0,217.8 719.3,209.4 726.7,201.8 734.0,195.0 741.3,189.0 748.7,183.7 756.0,179.2 763.3,175.2 770.7,171.9 778.0,169.0 785.3,166.6 792.7,164.7 800.0,163.0 807.3,161.7 814.7,160.6 822.0,159.7 829.3,159.0 836.7,158.5 844.0,158.1 851.3,157.7 858.7,157.5 866.0,157.3 873.3,157.1 880.7,157.0 888.0,156.9 895.3,156.8 902.7,156.8 910.0,156.7" fill="none" stroke="#c0271e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="470.0" y1="156.6" x2="910.0" y2="156.6" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="906.0" y="150.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">σ_sat — насичення (усі чутливі вузли «беруться»)</text>
<line x1="602.0" y1="360.0" x2="602.0" y2="150.6" stroke="#caa24a" stroke-width="1.6" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="602.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">LET_th</text>
<text x="602.0" y="144.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6d1f" text-anchor="middle" font-weight="bold" font-style="normal">поріг: нижче — збоїв немає</text>
<rect x="471.0" y="152.6" width="131.0" height="207.4" rx="0" fill="#eef7ee" stroke="none" stroke-width="0"/>
<text x="536.0" y="260.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тут σ≈0</text>
<text x="536.0" y="275.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">«не пробиває»</text>
<text x="742.8" y="223.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сильніший удар →</text>
<text x="742.8" y="237.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">вища ймовірність збою</text>
<rect x="56.0" y="392.0" width="322.0" height="148.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="217.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться ТЕМП збоїв (event rate)</text>
<text x="72.0" y="436.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Темп = скільки частинок прилетить × яка частка</text>
<text x="72.0" y="451.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">з них спрацює. Формально це згортка:</text>
<text x="72.0" y="467.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="72.0" y="482.8" font-family="Cascadia Mono, Consolas, monospace" font-size="9.6" fill="#6a3fa0" text-anchor="start" font-weight="bold" font-style="normal">   R  =  ∫  σ(LET) · Φ(LET) · dLET</text>
<text x="72.0" y="498.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="72.0" y="514.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Φ(LET) — потік частинок такого LET у даному</text>
<text x="72.0" y="529.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">середовищі. Тому одна й та сама комірка σ(LET)</text>
<text x="72.0" y="545.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">збоїть РІДКО на землі й ЧАСТО в космосі —</text>
<text x="72.0" y="560.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">змінюється не комірка, а спектр Φ (Рис. 3.9.1m.3).</text>
</svg>
