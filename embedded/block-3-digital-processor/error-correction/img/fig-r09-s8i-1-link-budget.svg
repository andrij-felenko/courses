<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому в далекому космосі немає права на «перепитай»</text>
<text x="460.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сигнал приходить мізерним, а луна-запит ішов би роками — отже, приймач мусить лагодити дані сам</text>
<circle cx="110.0" cy="230.0" r="26.0" fill="#eef3fb" stroke="#1f47b5" stroke-width="2.6"/>
<text x="110.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Земля</text>
<text x="110.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">велика антена</text>
<text x="110.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Deep Space Network</text>
<rect x="786.0" y="220.0" width="28.0" height="20.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="800.0" y1="220.0" x2="800.0" y2="196.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<path d="M778,196 Q800,176 822,196" fill="none" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="800.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">апарат</text>
<text x="800.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">передавач ~20 Вт</text>
<text x="800.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(як лампочка в холодильнику)</text>
<path d="M150,184 A 46 46 0 0 1 150,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="1.00"/>
<path d="M245,184 A 46 46 0 0 1 245,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.87"/>
<path d="M340,184 A 46 46 0 0 1 340,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.74"/>
<path d="M435,184 A 46 46 0 0 1 435,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.61"/>
<path d="M530,184 A 46 46 0 0 1 530,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.48"/>
<path d="M625,184 A 46 46 0 0 1 625,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.35"/>
<path d="M720,184 A 46 46 0 0 1 720,276" fill="none" stroke="#1f47b5" stroke-width="2.4" opacity="0.22"/>
<line x1="154.0" y1="230.0" x2="740.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="2 6" marker-end="url(#aGrey)"/>
<text x="460.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відстань — мільярди кілометрів</text>
<rect x="18.0" y="312.0" width="286.0" height="134.0" rx="10" fill="#fff" stroke="#c0271e" stroke-width="2.2"/>
<rect x="18.0" y="312.0" width="286.0" height="8.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="161.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал — слабший за подих</text>
<text x="32.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">До антени долітають крихти потужності:</text>
<text x="32.0" y="379.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">енергії в них менше, ніж у батарейці</text>
<text x="32.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">наручного годинника. На межі чутності</text>
<text x="32.0" y="410.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кожен зайвий перевернутий біт коштує</text>
<text x="32.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дорого.</text>
<rect x="310.0" y="312.0" width="286.0" height="134.0" rx="10" fill="#fff" stroke="#caa24a" stroke-width="2.2"/>
<rect x="310.0" y="312.0" width="286.0" height="8.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="453.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Перепитати — не варіант</text>
<text x="324.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Радіохвиля долає шлях лише в один бік</text>
<text x="324.0" y="379.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">годинами. Запит «повтори пакет» вертався</text>
<text x="324.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">б туди-назад день і довше — жоден діалог</text>
<text x="324.0" y="410.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">із підтвердженням тут не працює.</text>
<rect x="602.0" y="312.0" width="286.0" height="134.0" rx="10" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
<rect x="602.0" y="312.0" width="286.0" height="8.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="745.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Тож лагодимо на місці</text>
<text x="616.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Раз перепитати не можна, приймач мусить</text>
<text x="616.0" y="379.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ВИПРАВИТИ помилку сам, із того, що</text>
<text x="616.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">прийшло. Саме для цього в потік навмисне</text>
<text x="616.0" y="410.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">домішують надлишок — корекційний код.</text>
</svg>
