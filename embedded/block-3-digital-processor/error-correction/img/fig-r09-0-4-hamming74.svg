<text x="452.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">d4</text>
<circle cx="300.0" cy="215.0" r="17.0" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
