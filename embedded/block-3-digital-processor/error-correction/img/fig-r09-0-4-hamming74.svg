</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код Геммінга (7,4): 4 біти даних + 3 біти перевірки = 7</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три кола перевірок перекриваються так, що кожен біт даних лежить у СВОЇЙ єдиній комбінації кіл</text>
<circle cx="340.0" cy="250.0" r="118.0" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<circle cx="470.0" cy="250.0" r="118.0" fill="none" stroke="#1f47b5" stroke-width="2.2"/>
