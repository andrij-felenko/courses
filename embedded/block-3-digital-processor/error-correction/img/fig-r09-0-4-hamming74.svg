<text x="405.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">d2</text>
<circle cx="360.0" cy="312.0" r="17.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
