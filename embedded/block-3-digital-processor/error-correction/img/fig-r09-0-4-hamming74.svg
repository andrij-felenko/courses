<circle cx="512.0" cy="215.0" r="17.0" fill="#eaf0fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="512.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">p2</text>
<circle cx="405.0" cy="410.0" r="17.0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="405.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">p3</text>
<rect x="640.0" y="96.0" width="260.0" height="200.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="770.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як це працює</text>
<text x="656.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">d1…d4 —</text>
<text x="656.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">   4 біти ваших ДАНИХ</text>
<text x="656.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">p1,p2,p3 —</text>
<text x="656.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">   3 біти ПЕРЕВІРКИ (парність кола)</text>
<text x="656.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кожне коло —</text>
<text x="656.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">   тримає СВОЇ біти парними</text>
<text x="770.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">помилка в одному біті псує</text>
<text x="770.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">РІВНО ті кола, що його містять</text>
<text x="770.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ це і є його точна адреса</text>
<rect x="640.0" y="312.0" width="260.0" height="150.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="770.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Що вміє код (7,4)</text>
<text x="654.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ВИПРАВЛЯЄ будь-який 1 хибний біт</text>
<text x="654.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ВИЯВЛЯЄ (не виправляючи) 2 хибні</text>
<text x="654.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ціна: 3 зайві біти на 4 корисні</text>
<text x="654.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 7 кодових бітів на 4 даних</text>
<text x="450.0" y="492.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перекриття трьох перевірок — це і є геометрія коду: сім позицій так пов'язані, що «відбиток» помилки прямо називає винний біт.</text>
</svg>
