<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це ТА САМА думка, що зробила комп'ютер універсальним (§3.5): не перепаювати залізо, а ЗАВАНТАЖИТИ опис.</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лише тут завантажують не послідовну програму для процесора, а ПАРАЛЕЛЬНУ СХЕМУ — конфігурацію самого заліза.</text>
<text x="450.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Фріман називав це «чистою стрічкою»: чистий носій, на який інженер сам наносить потрібну логіку.</text>
