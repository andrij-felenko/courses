<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сміливий заклад Фрімана: «транзисторів буде так багато, що їх можна МАРНУВАТИ»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">FPGA свідомо «розкидається» транзисторами заради гнучкості; ставка була на те, що закон Мура зробить їх майже безплатними</text>
<line x1="110.0" y1="300.0" x2="480.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="110.0" y1="300.0" x2="110.0" y2="70.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="482.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">роки →</text>
<text x="94.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ціна 1 транзистора</text>
<text x="94.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(логарифм)</text>
<polyline points="110.0,88.0 180.0,140.0 260.0,200.0 350.0,248.0 430.0,276.0 470.0,292.0" fill="none" stroke="#1f47b5" stroke-width="3"/>
<text x="360.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">закон Мура:</text>
<text x="360.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">транзистор дешевшає</text>
<text x="360.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">удвічі що 2 роки</text>
<circle cx="180.0" cy="140.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="188.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1984: ставка зроблена тут</text>
<rect x="520.0" y="84.0" width="300.0" height="230.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="670.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чим «платить» FPGA за гнучкість</text>
<text x="536.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• більша площа кристала</text>
<text x="536.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• повільніша за «запечений» ASIC</text>
<text x="536.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• дорожча за штуку</text>
<line x1="536.0" y1="196.0" x2="804.0" y2="196.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="670.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">…але натомість:</text>
<text x="536.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• схема готова за ГОДИНИ, не місяці</text>
<text x="536.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• помилку правлять новим бітстрімом</text>
<text x="536.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• нуль витрат на маски й партію</text>
<rect x="60.0" y="336.0" width="760.0" height="100.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У 1984-му «марнувати» транзистори звучало майже єретично — кремній був дорогий. Та Фріман угадав напрям:</text>
<text x="440.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">що дешевшими ставали транзистори, то вигіднішим робився обмін «трохи зайвого кремнію → миттєва гнучкість».</text>
<text x="440.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це той самий компроміс «площа й швидкість проти гнучкості», що визначає вибір FPGA проти ASIC донині (§3.7.8).</text>
<text x="440.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Заклад на майбутнє дешевшання — рідкісний приклад, коли інженер виграв ставку на ціле десятиліття вперед.</text>
</svg>
