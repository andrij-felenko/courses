<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416">
<rect width="900" height="416" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де паралельність вирішує: типові задачі для FPGA</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спільна риса — потік даних надто швидкий або реакція потрібна надто рання для одного ядра</text>
<rect x="70.0" y="90.0" width="760.0" height="44.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Цифрова обробка сигналу</text>
<text x="360.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тисячі множень-додавань на кожен відлік потоку (фільтри, FFT)</text>
<rect x="70.0" y="142.0" width="760.0" height="44.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="90.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Відео й зображення</text>
<text x="360.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мільйони пікселів за кадр × десятки кадрів — конвеєр на льоту</text>
<rect x="70.0" y="194.0" width="760.0" height="44.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="90.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Швидкі інтерфейси</text>
<text x="360.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розбір потоку на сотні Мбіт/с біт за бітом, без запасу на код</text>
<rect x="70.0" y="246.0" width="760.0" height="44.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
<text x="90.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Точний таймінг керування</text>
<text x="360.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">багатофазний ШІМ, реакція за наносекунди, паралельні канали</text>
<rect x="70.0" y="298.0" width="760.0" height="44.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="90.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Багато однакових каналів</text>
<text x="360.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сотні лічильників/АЛП, кожен — своя апаратна копія</text>
<rect x="60.0" y="360.0" width="780.0" height="42.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усюди тут робота надто широка для послідовного ядра — її розкладають у простір: багато апаратних блоків нараз.</text>
</svg>
