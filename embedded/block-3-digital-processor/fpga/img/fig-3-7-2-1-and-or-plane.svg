<text x="770.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">F = a·b + b·c̄ + a·c</text>
<rect x="60.0" y="360.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PAL (programmable array logic): входи йдуть у матрицю AND, де користувач ПРОПАЛЮЄ потрібні добутки,</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">а ті додаються фіксованою матрицею OR. Так у дрібну мікросхему «вшивали» будь-яку логіку — замість купи 74-х корпусів.</text>
