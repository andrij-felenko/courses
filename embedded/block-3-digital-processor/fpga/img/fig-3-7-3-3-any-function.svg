<text x="245.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">= будь-яка з 2¹⁶ функцій 4 змінних</text>
<rect x="450.0" y="92.0" width="380.0" height="250.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="640.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ — відповідність ОДИН-В-ОДИН</text>
<text x="470.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• функція 4 змінних = таблиця з 2⁴ = 16 рядків</text>
<text x="470.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• кожен рядок дає 0 або 1 на виході</text>
<text x="470.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• LUT-4 зберігає рівно 16 бітів — по біту на рядок</text>
<text x="470.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• який завгодно набір 16 бітів задає LUT</text>
<text x="470.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• отже, будь-яка з 2¹⁶ = 65 536 функцій — реальна</text>
<text x="470.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="470.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">AND, OR, XOR, мажоритар, дешифратор —</text>
<text x="470.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усе це лише різні 16-бітні візерунки в тій</text>
<text x="470.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">самій LUT. Схема одна, зміст різний.</text>
<rect x="60.0" y="360.0" width="780.0" height="42.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LUT універсальна не дивом, а арифметикою: 16 рядків таблиці ↔ 16 бітів пам'яті, будь-який візерунок дозволено.</text>
