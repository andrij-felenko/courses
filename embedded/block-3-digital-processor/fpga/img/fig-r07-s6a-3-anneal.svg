<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
<rect width="880" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="440.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як nextpnr шукає гарне розміщення: імітація відпалу (simulated annealing)</text>
<rect x="60.0" y="70.0" width="300.0" height="60.0" rx="9" fill="#ffffff" stroke="#7a3ea8" stroke-width="2.2"/>
<text x="210.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7a3ea8" text-anchor="middle" font-weight="bold" font-style="normal">Поміняти місцями два вузли</text>
<text x="210.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(пробний swap у сітці)</text>
<rect x="60.0" y="150.0" width="300.0" height="60.0" rx="9" fill="#ffffff" stroke="#1f47b5" stroke-width="2.2"/>
<text x="210.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Порахувати Δвартість</text>
<text x="210.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вартість = довжина дротів + штраф</text>
<text x="210.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">за порушений таймінг</text>
<rect x="60.0" y="240.0" width="300.0" height="60.0" rx="9" fill="#ffffff" stroke="#caa24a" stroke-width="2.2"/>
<text x="210.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Стало краще (Δ &lt; 0)?</text>
<text x="210.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">так → лишити;  ні → лишити</text>
<text x="210.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">з імовірністю e^(−Δ/T)</text>
<rect x="60.0" y="340.0" width="300.0" height="60.0" rx="9" fill="#ffffff" stroke="#c0271e" stroke-width="2.2"/>
<text x="210.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Трохи остудити: T ← α·T</text>
<text x="210.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що холодніше — то рідше</text>
<text x="210.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">приймаємо погіршення</text>
<line x1="210.0" y1="130.0" x2="210.0" y2="150.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="210.0" y1="210.0" x2="210.0" y2="240.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="210.0" y1="300.0" x2="210.0" y2="340.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<polyline points="210.0,400.0 210.0,420.0 38.0,420.0 38.0,100.0 60.0,100.0" fill="none" stroke="#1f8a3b" stroke-width="2"/>
<text x="44.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">повторити</text>
<text x="210.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">…доки T не охолоне (тисячі–мільйони спроб)</text>
<rect x="470.0" y="90.0" width="360.0" height="230.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="650.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо інколи приймати гірший варіант</text>
<line x1="486.0" y1="296.0" x2="818.0" y2="296.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="486.0" y1="296.0" x2="486.0" y2="104.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="818.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">розкладка</text>
<text x="492.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вартість</text>
<polyline points="486.0,290.0 489.2,289.1 492.4,288.2 495.6,287.3 498.8,286.3 502.0,285.2 505.2,284.0 508.4,282.7 511.6,281.4 514.8,279.9 518.0,278.2 521.2,276.5 524.4,274.6 527.6,272.7 530.8,270.6 534.0,268.5 537.2,266.3 540.4,264.0 543.6,261.7 546.8,259.5 550.0,257.2 553.2,255.0 556.4,252.9 559.6,250.9 562.8,249.1 566.0,247.4 569.2,245.8 572.4,244.5 575.6,243.4 578.8,242.5 582.0,241.9 585.2,241.5 588.4,241.3 591.6,241.4 594.8,241.8 598.0,242.3 601.2,243.1 604.4,244.1 607.6,245.2 610.8,246.5 614.0,247.9 617.2,249.5 620.4,251.0 623.6,252.7 626.8,254.3 630.0,255.9 633.2,257.4 636.4,258.9 639.6,260.3 642.8,261.5 646.0,262.6 649.2,263.6 652.4,264.3 655.6,264.9 658.8,265.3 662.0,265.5 665.2,265.6 668.4,265.4 671.6,265.1 674.8,264.7 678.0,264.0 681.2,263.3 684.4,262.5 687.6,261.6 690.8,260.7 694.0,259.7 697.2,258.7 700.4,257.7 703.6,256.7 706.8,255.8 710.0,254.9 713.2,254.1 716.4,253.4 719.6,252.7 722.8,252.2 726.0,251.7 729.2,251.3 732.4,251.0 735.6,250.8 738.8,250.6 742.0,250.4 745.2,250.2 748.4,250.1 751.6,249.9 754.8,249.6 758.0,249.3 761.2,248.9 764.4,248.3 767.6,247.6 770.8,246.8 774.0,245.8 777.2,244.6 780.4,243.2 783.6,241.6 786.8,239.8 790.0,237.8 793.2,235.7 796.4,233.3 799.6,230.8 802.8,228.1 806.0,225.3" fill="none" stroke="#1b1b1b" stroke-width="2.4"/>
<circle cx="556.4" cy="252.9" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="1"/>
<text x="556.4" y="240.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">локальна яма</text>
<text x="556.4" y="252.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">(пастка)</text>
<circle cx="806.0" cy="225.3" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="810.0" y="245.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">справжній мінімум</text>
<path d="M 556.4 252.9 Q 681.2 195.4 806.0 225.3" fill="none" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,4"/>
<text x="681.2" y="189.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">інколи лізти ВГОРУ,</text>
<text x="681.2" y="201.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">щоб вибратися з пастки</text>
<rect x="470.0" y="348.0" width="360.0" height="96.0" rx="8" fill="#fff7ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="650.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Чому це не «миттєво»</text>
<text x="484.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Розміщення й трасування — NP-важкі: точного</text>
<text x="484.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  оптимуму за прийнятний час нема — лише добре</text>
<text x="484.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  наближення (відпал, евристики). Звідси й секунди–</text>
<text x="484.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  хвилини збірки навіть малого дизайну.</text>
<text x="440.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама ідея відпалу, що в металургії: гаряче — рухається вільно, холодне — застигає у вигідній формі.</text>
</svg>
