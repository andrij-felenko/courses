<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Синтез ≠ виконання: код не «біжить», його ПЕРЕТВОРЮЮТЬ на схему</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">компілятор C дає інструкції, які процесор виконає; синтезатор HDL дає СХЕМУ, яку залізо втілить</text>
<rect x="70.0" y="90.0" width="200.0" height="70.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.7"/>
<text x="170.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">код C</text>
<text x="170.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">for, if, a+b</text>
<line x1="270.0" y1="125.0" x2="360.0" y2="125.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="315.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">компілятор</text>
<rect x="360.0" y="90.0" width="200.0" height="70.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.7"/>
<text x="460.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">інструкції</text>
<text x="460.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">LD, ADD, ST</text>
<line x1="560.0" y1="125.0" x2="650.0" y2="125.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="605.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">виконує</text>
<rect x="650.0" y="90.0" width="180.0" height="70.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.7"/>
<text x="740.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">процесор</text>
<text x="740.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крок за кроком</text>
<rect x="70.0" y="220.0" width="200.0" height="70.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="170.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">код Verilog</text>
<text x="170.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">assign, always</text>
<line x1="270.0" y1="255.0" x2="360.0" y2="255.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="315.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СИНТЕЗ</text>
<rect x="360.0" y="220.0" width="200.0" height="70.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="460.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">схема (вентилі,</text>
<text x="460.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тригери, дроти)</text>
<line x1="560.0" y1="255.0" x2="650.0" y2="255.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="605.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">втілює</text>
<rect x="650.0" y="220.0" width="180.0" height="70.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="740.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тканина FPGA</text>
<text x="740.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усе нараз</text>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">однакові на вигляд мови — геть різна доля коду</text>
<rect x="60.0" y="348.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Софт: компілятор перекладає код на ІНСТРУКЦІЇ, процесор їх виконує в часі. HDL: синтезатор перекладає код на СХЕМУ.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому «оптимізація швидкості» в HDL — це не менше команд, а коротший КРИТИЧНИЙ ШЛЯХ у схемі (§3.7.7).</text>
</svg>
