<text x="440.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жоден крок не «магія»: кожен бере текстовий файл і пише наступний — усе можна відкрити й прочитати.</text>
<text x="440.0" y="518.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Те, що у фірмовому пакеті сховано в одній кнопці «Generate Bitstream», тут — чотири прозорі утиліти.</text>
<text x="440.0" y="540.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це конкретне втілення загального потоку теми §3.7.6: синтез → розміщення → трасування → бітстрім.</text>
