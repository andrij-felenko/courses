<text x="450.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">М'яке ядро — той самий процесор, але ЗІБРАНИЙ із звичайних LUT і тригерів FPGA: повільніший, зате гнучкий і додається коли треба.</text>
