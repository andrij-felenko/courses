<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
<rect width="940" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три різні внески — три різні люди (і всі необхідні)</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«придумати фундамент», «зробити перший зразок» і «зробити так, щоб це масово виготовлялося» — це три різні справи</text>
<rect x="50.0" y="86.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="2"/>
<text x="185.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Жан Ерні</text>
<text x="185.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Jean Hoerni)</text>
<rect x="105.0" y="150.0" width="160.0" height="26.0" rx="6" fill="#fff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="185.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ФУНДАМЕНТ</text>
<text x="68.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">планарний процес (1957–59):</text>
<text x="68.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">оксид лишають на пластині —</text>
<text x="68.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">він і захищає переходи,</text>
<text x="68.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">і служить ізолятором під метал.</text>
<text x="68.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">без нього монолітної ІС нема</text>
<rect x="345.0" y="86.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="2"/>
<text x="480.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Джек Кілбі</text>
<text x="480.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Jack Kilby)</text>
<rect x="400.0" y="150.0" width="160.0" height="26.0" rx="6" fill="#fff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="480.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРШИЙ ЗРАЗОК</text>
<text x="363.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перша працююча ІС (1958):</text>
<text x="363.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усі деталі в одному шматку</text>
<text x="363.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">напівпровідника. Але з'єднані</text>
<text x="363.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тонкими дротиками-«вусами» —</text>
<text x="363.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">так серійно не зробиш</text>
<rect x="640.0" y="86.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#c0271e" stroke-width="2"/>
<text x="775.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Роберт Нойс</text>
<text x="775.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Robert Noyce)</text>
<rect x="695.0" y="150.0" width="160.0" height="26.0" rx="6" fill="#fff" stroke="#c0271e" stroke-width="1.6"/>
<text x="775.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">СПОСІБ ВИРОБЛЯТИ</text>
<text x="658.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">монолітна ІС (1959): метал</text>
<text x="658.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">напиляний просто по оксиду</text>
<text x="658.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ерні замість дротиків.</text>
<text x="658.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Саме цю форму й можна</text>
<text x="658.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">друкувати тисячами</text>
<line x1="322.0" y1="236.0" x2="343.0" y2="236.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="617.0" y1="236.0" x2="638.0" y2="236.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="332.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<text x="627.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="60.0" y="404.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підручник любить одне ім'я, та насправді ІС стоїть на трьох внесках: основа (Ерні) + перший зразок (Кілбі) + придатна до серії форма (Нойс).</text>
<text x="470.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Прибери будь-який — і дива не буде: без планарного оксиду нема куди класти метал, без метала зразок не серійний, без зразка немає що серіїти.</text>
</svg>
