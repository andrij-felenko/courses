<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500">
<rect width="940" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">TSMC, 1987: чий насправді був капітал і технологія</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«фабрика однієї людини» — міф: гроші дали держава й приватні родини, а ключову технологію ліцензував Philips</text>
<path d="M250.0,250.0 L250.0,130.0 A120.0,120.0 0 0 1 262.8,369.3 Z" fill="#1f8a3b" stroke="#ffffff" stroke-width="2"/>
<path d="M250.0,250.0 L262.8,369.3 A120.0,120.0 0 0 1 130.2,243.2 Z" fill="#1f47b5" stroke="#ffffff" stroke-width="2"/>
<path d="M250.0,250.0 L130.2,243.2 A120.0,120.0 0 0 1 250.0,130.0 Z" fill="#caa24a" stroke="#ffffff" stroke-width="2"/>
<circle cx="250.0" cy="250.0" r="120.0" fill="none" stroke="#ffffff" stroke-width="0"/>
<text x="250.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Уряд Тайваню</text>
<text x="250.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#eafaef" text-anchor="middle" font-weight="normal" font-style="normal">(Фонд розвитку)</text>
<text x="250.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">48.3 %</text>
<text x="302.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Philips</text>
<text x="302.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">27.6 %</text>
<text x="186.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">приватні</text>
<text x="186.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 24 %</text>
<rect x="470.0" y="96.0" width="420.0" height="86.0" rx="9" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<rect x="470.0" y="96.0" width="9.0" height="86.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="492.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Держава (Фонд розвитку)</text>
<text x="492.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">майже половина грошей; промислову політику</text>
<text x="492.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вів прем'єр Сун Юньсюань і радник К. Т. Лі —</text>
<text x="492.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вони ж покликали Чанга очолити ITRI</text>
<rect x="470.0" y="192.0" width="420.0" height="86.0" rx="9" fill="#fafafa" stroke="#1f47b5" stroke-width="1.7"/>
<rect x="470.0" y="192.0" width="9.0" height="86.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="492.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Philips (Нідерланди)</text>
<text x="492.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">передача виробничої технології + ліцензії на</text>
<text x="492.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">патенти в обмін на частку. Без чужого процесу</text>
<text x="492.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">молода фабрика не запустилася б</text>
<rect x="470.0" y="288.0" width="420.0" height="86.0" rx="9" fill="#fafafa" stroke="#caa24a" stroke-width="1.7"/>
<rect x="470.0" y="288.0" width="9.0" height="86.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="492.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Приватні інвестори Тайваню</text>
<text x="492.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">заможні місцеві родини з промисловості —</text>
<text x="492.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">решта капіталу; держава наполягла, щоб і свій</text>
<text x="492.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">бізнес уклав гроші в ризиковану затію</text>
<rect x="470.0" y="384.0" width="420.0" height="86.0" rx="9" fill="#fafafa" stroke="#c0271e" stroke-width="1.7"/>
<rect x="470.0" y="384.0" width="9.0" height="86.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="492.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Морріс Чанг (Morris Chang)</text>
<text x="492.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не гаманець, а задум і досвід: 25 років у TI,</text>
<text x="492.0" y="443.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">де подібну ідею «фабрики на всіх» свого часу</text>
<text x="492.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відхилили. Тут її нарешті дали збудувати</text>
<rect x="60.0" y="422.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">За «дивом однієї людини» стоїть колективний пакет: гроші держави, приватний капітал і чужа технологія Philips.</text>
<text x="470.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Внесок Чанга — задум і репутація, а не капітал. Корисний урок: гучний винахід майже завжди спирається на державу, партнера й чийсь готовий процес.</text>
</svg>
