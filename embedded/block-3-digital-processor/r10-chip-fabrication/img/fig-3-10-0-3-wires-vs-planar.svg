<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480">
<rect width="940" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому зразка Кілбі було замало: дротики проти друкованого метала</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва склали схему в одному шматку — різниця в тому, ЯК з'єднані деталі, і саме вона вирішила, що піде в серію</text>
<text x="245.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Кілбі, 1958: «вуса» вручну</text>
<rect x="80.0" y="110.0" width="330.0" height="150.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<rect x="110.0" y="210.0" width="270.0" height="30.0" rx="3" fill="#e7ecf7" stroke="#1f47b5" stroke-width="1.4"/>
<text x="245.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">шматок германію</text>
<rect x="134.0" y="178.0" width="32.0" height="26.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="150.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<rect x="199.0" y="178.0" width="32.0" height="26.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="215.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<rect x="264.0" y="178.0" width="32.0" height="26.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="280.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<rect x="324.0" y="178.0" width="32.0" height="26.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="340.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<path d="M150,178 Q182.5,130 215,178" fill="none" stroke="#caa24a" stroke-width="2.2"/>
<path d="M215,178 Q247.5,130 280,178" fill="none" stroke="#caa24a" stroke-width="2.2"/>
<path d="M280,178 Q310.0,130 340,178" fill="none" stroke="#caa24a" stroke-width="2.2"/>
<text x="245.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">тонкі золоті дротики, припаяні поодинці</text>
<rect x="95.0" y="272.0" width="300.0" height="70.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="1.6"/>
<text x="245.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Граблі серії:</text>
<text x="245.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кожен «вус» садить людина під мікроскопом —</text>
<text x="245.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повільно, ламко, тисячами штук не зробиш</text>
<text x="695.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Нойс, 1959: метал по оксиду</text>
<rect x="530.0" y="110.0" width="330.0" height="150.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<rect x="560.0" y="210.0" width="270.0" height="30.0" rx="3" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="695.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кремній з переходами</text>
<rect x="560.0" y="196.0" width="270.0" height="12.0" rx="2" fill="#dff0df" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="845.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal"></text>
<text x="695.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">оксид Ерні — суцільний ізолятор зверху</text>
<polyline points="585.0,184.0 640.0,184.0 640.0,196.0" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<polyline points="700.0,184.0 760.0,184.0 760.0,196.0" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<line x1="640.0" y1="184.0" x2="700.0" y2="184.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="760.0" y1="184.0" x2="815.0" y2="184.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="585.0" y1="184.0" x2="585.0" y2="196.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="815.0" y1="184.0" x2="815.0" y2="196.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="695.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">доріжки алюмінію надруковані разом з усім чипом</text>
<rect x="545.0" y="272.0" width="300.0" height="70.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="695.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це перемогло:</text>
<text x="695.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з'єднання наносять світлом і хімією — за раз,</text>
<text x="695.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на цілу пластину; жодного ручного паяння</text>
<line x1="415.0" y1="185.0" x2="525.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="470.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама</text>
<text x="470.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея, інше</text>
<rect x="60.0" y="404.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кілбі довів, що цілу схему можна вмістити в один кристал — але з'єднав деталі навісними дротиками, і серійно це не виходило.</text>
<text x="470.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Нойс прибрав дротики: метал друкують просто по оксиду Ерні, разом з рештою чипа. Ось чому масова ІС виросла саме з планарного процесу.</text>
</svg>
