<text x="380.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два способи з'єднати кристал зі світом</text>
<text x="210.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Wire bonding (дротяні з'єднання)</text>
