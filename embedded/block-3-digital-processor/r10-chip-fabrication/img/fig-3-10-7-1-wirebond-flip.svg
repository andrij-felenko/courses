<text x="570.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кулькові виводи прямо під кристалом</text>
<text x="570.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">коротший шлях — швидше й більше з'єднань</text>
<text x="380.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дротики (bonding) дешеві й усюди; перевернутий кристал (flip-chip) дає сотні коротких з'єднань</text>
<text x="380.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одразу під кристалом — його беруть, коли виводів багато або потрібна швидкість.</text>
</svg>
