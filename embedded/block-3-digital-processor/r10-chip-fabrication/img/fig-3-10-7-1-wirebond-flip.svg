<text x="210.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дротики йдуть від верху кристала до виводів</text>
<text x="570.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Flip-chip (перевернутий кристал)</text>
<rect x="420.0" y="200.0" width="300.0" height="30.0" rx="0" fill="#2f6f3f" stroke="#163b21" stroke-width="2"/>
<rect x="500.0" y="150.0" width="140.0" height="34.0" rx="0" fill="#9fb0c8" stroke="#1b1b1b" stroke-width="2"/>
<text x="570.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кристал (лицем униз)</text>
<circle cx="512.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1b1b1b" stroke-width="1.2"/>
<circle cx="531.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1b1b1b" stroke-width="1.2"/>
