<text x="380.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жоден кристал не ідеальний однаково. Кращі тримають вищу частоту — у дорогий сорт; ті, де якийсь блок</text>
<text x="380.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">бракований, продають із вимкненим блоком як дешевшу модель. Так із одного дизайну виходить лінійка.</text>
<text x="380.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це не марнотратство, а спосіб продати майже кожен кристал — навіть із дрібним дефектом.</text>
