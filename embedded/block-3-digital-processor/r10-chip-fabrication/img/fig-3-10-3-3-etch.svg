<text x="360.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Повторюючи «додати — накрити маскою — прибрати зайве» десятки разів, нарощують увесь чіп.</text>
