<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560">
<rect width="940" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як народжується світло 13.5 нм: крапля олова під подвійним пострілом лазера</text>
<text x="470.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ні лампи, ні лазера на 13.5 нм не існує — світло «викрешують» з плазми олова десятки тисяч разів за секунду</text>
<line x1="70.0" y1="160.0" x2="870.0" y2="160.0" stroke="#e4e4e4" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
<text x="70.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Один цикл — і так ~50 000 разів за секунду:</text>
<text x="165.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1. летить крапля</text>
<circle cx="165.0" cy="160.0" r="13.0" fill="#dfe3ea" stroke="#1f47b5" stroke-width="2"/>
<text x="165.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Sn</text>
<line x1="127.0" y1="160.0" x2="147.0" y2="160.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="165.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розплавлене олово,</text>
<text x="165.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крапля ~25–30 мкм</text>
<text x="400.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2. попередній імпульс</text>
<line x1="280.0" y1="160.0" x2="374.0" y2="160.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="327.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">слабкий</text>
<path d="M378,160 Q400,151 422,160 Q400,169 378,160 Z" fill="#dfe3ea" stroke="#1f47b5" stroke-width="2"/>
<text x="400.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крапля стає пласким</text>
<text x="400.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«млинцем» — більша ціль</text>
<text x="680.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">3. головний імпульс CO₂</text>
<line x1="550.0" y1="160.0" x2="650.0" y2="160.0" stroke="#c0271e" stroke-width="3.4" marker-end="url(#aRed)"/>
<text x="600.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">потужний</text>
<circle cx="680.0" cy="160.0" r="22.0" fill="#fff3d6" stroke="#caa24a" stroke-width="0"/>
<circle cx="680.0" cy="160.0" r="16.0" fill="#ffe8a8" stroke="#caa24a" stroke-width="0"/>
<circle cx="680.0" cy="160.0" r="9.0" fill="#fff" stroke="#caa24a" stroke-width="0"/>
<line x1="702.0" y1="160.0" x2="720.0" y2="160.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="699.1" y1="171.0" x2="714.6" y2="180.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="691.0" y1="179.1" x2="700.0" y2="194.6" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="680.0" y1="182.0" x2="680.0" y2="200.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="669.0" y1="179.1" x2="660.0" y2="194.6" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="660.9" y1="171.0" x2="645.4" y2="180.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="658.0" y1="160.0" x2="640.0" y2="160.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="660.9" y1="149.0" x2="645.4" y2="140.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="669.0" y1="140.9" x2="660.0" y2="125.4" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="680.0" y1="138.0" x2="680.0" y2="120.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="691.0" y1="140.9" x2="700.0" y2="125.4" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="699.1" y1="149.0" x2="714.6" y2="140.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<text x="680.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">плазма ~ десятки тисяч °C</text>
<text x="680.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">світить на 13.5 нм (EUV)</text>
<line x1="225.0" y1="124.0" x2="340.0" y2="124.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="470.0" y1="124.0" x2="610.0" y2="124.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="70.0" y="310.0" width="800.0" height="92.0" rx="10" fill="#fbf7ee" stroke="#caa24a" stroke-width="1.6"/>
<text x="90.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чому так дивно, а не просто «увімкнути лампу»?</text>
<text x="90.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• На 13.5 нм НЕ світить жодна лампа й жоден лазер: цю довжину хвилі доводиться добувати з гарячої плазми.</text>
<text x="90.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Один CO₂-лазер мегаватного класу влучає в КОЖНУ краплю; попередній імпульс спершу розплескує її, щоб віддача світла зросла.</text>
<text x="90.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Лише ~кілька відсотків енергії лазера стає корисним EUV — решта йде в тепло. Звідси гігантські лазер і охолодження.</text>
</svg>
