<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760">
<rect width="940" height="760" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="470.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Довгий шлях EUV: від однієї ідеї 1986-го до фабрики 2019-го</text>
<text x="470.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">понад тридцять років, мільярди доларів і коаліція лабораторій та фірм — щоб надрукувати схему світлом 13.5 нм</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="736.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="122.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">сер. 1980-х</text>
<text x="276.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Кіношіта (NTT, Японія) висуває ідею</text>
<text x="276.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Хіроо Кіношіта (Hiroo Kinoshita) пропонує літографію в м'якому</text>
<text x="276.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">рентгені; 1986-го вперше фокусує EUV-зображення дзеркалами</text>
<circle cx="250.0" cy="195.5" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="200.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1980-ті</text>
<text x="276.0" y="192.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Андервуд і Барбі — перші багатошарові дзеркала</text>
<text x="276.0" y="211.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Джим Андервуд (Jim Underwood) і Трой Барбі (Troy Barbee) роблять перші</text>
<text x="276.0" y="227.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Mo/Si-дзеркала, що взагалі відбивають EUV — без них ідея мертва</text>
<circle cx="250.0" cy="269.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">сер. 1980-х</text>
<text x="276.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Bell Labs пробує плазмове джерело</text>
<text x="276.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Оберт Вуд (Obert Wood) і Білл Сілфваст (Bill Silfvast) запускають</text>
<text x="276.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">лазерну плазму як джерело EUV; Рік Фрімен пізніше вводить сам термін</text>
<text x="276.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">«EUV-літографія»</text>
<circle cx="250.0" cy="342.5" r="7.0" fill="#fff" stroke="#caa24a" stroke-width="2.6"/>
<text x="228.0" y="347.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1992–94</text>
<text x="276.0" y="339.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Intel і нацлабораторії США беруться всерйоз</text>
<text x="276.0" y="358.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Intel вкладає сотні мільйонів; Лівермор, Сандія, Берклі (Livermore,</text>
<text x="276.0" y="374.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Sandia, Berkeley) ведуть дослідження під DARPA/DOE</text>
<circle cx="250.0" cy="416.0" r="7.0" fill="#fff" stroke="#caa24a" stroke-width="2.6"/>
<text x="228.0" y="421.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1997</text>
<text x="276.0" y="413.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">консорціум EUV-LLC</text>
<text x="276.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Intel збирає коаліцію (AMD, Motorola, IBM, Micron) і фінансує</text>
<text x="276.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">нацлабораторії — переносить науку ближче до виробництва</text>
<circle cx="250.0" cy="489.5" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="228.0" y="494.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">кінець 1990-х</text>
<text x="276.0" y="486.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ASML бере EUV у роботу</text>
<text x="276.0" y="505.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Європейська ASML робить ставку на EUV як наступника DUV; партнерство з</text>
<text x="276.0" y="521.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Zeiss по оптиці й Cymer по джерелу світла</text>
<circle cx="250.0" cy="563.0" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="228.0" y="568.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2012</text>
<text x="276.0" y="560.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Zeiss віддає ASML першу штатну оптику</text>
<text x="276.0" y="579.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Карл Цайс (Zeiss) розв'язує найстрашнішу задачу — дзеркала такої</text>
<text x="276.0" y="595.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">гладкості, що оптика перестає бути головним бар'єром</text>
<circle cx="250.0" cy="636.5" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="250.0" cy="636.5" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="250.0" cy="636.5" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="228.0" y="641.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2013</text>
<text x="276.0" y="633.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ASML купує Cymer; джерело пробиває 10 Вт</text>
<text x="276.0" y="652.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Cymer додає попередній імпульс, що розплескує краплю олова, — і</text>
<text x="276.0" y="668.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">потужність нарешті росте; у травні ASML купує Cymer</text>
<circle cx="250.0" cy="710.0" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="250.0" cy="710.0" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="250.0" cy="710.0" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="228.0" y="715.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2018–2019</text>
<text x="276.0" y="707.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">EUV у серійному виробництві</text>
<text x="276.0" y="726.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Перші чіпи масово друкують на EUV (Samsung, TSMC). Понад 30 років</text>
<text x="276.0" y="742.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">роботи дають робочу машину</text>
</svg>
