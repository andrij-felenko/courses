<text x="470.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому EUV — це лише дзеркала у вакуумі, і куди дівається 98% світла</text>
<text x="470.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">EUV поглинає БУДЬ-ЩО — повітря, скло, навіть тонка плівка; тому лінз нема, а є ланцюг дзеркал, і кожне краде ~30%</text>
<rect x="40.0" y="84.0" width="300.0" height="250.0" rx="12" fill="#f5f7fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="190.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Чому НЕ лінзи (як у DUV)</text>
<text x="58.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• EUV (13.5 нм) поглинає все:</text>
<text x="58.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   повітря, скло лінзи, вода, плівка.</text>
<text x="58.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Промінь крізь лінзу просто згас би.</text>
<text x="58.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• Тому: тільки ВІДБИВАННЯ, і лише</text>
<text x="58.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   спеціальними дзеркалами Mo/Si.</text>
<text x="58.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• І весь шлях — у ВАКУУМІ, бо навіть</text>
<text x="58.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   повітря з'їло б промінь.</text>
<text x="190.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дзеркало = ~40–50 пар шарів Mo/Si</text>
