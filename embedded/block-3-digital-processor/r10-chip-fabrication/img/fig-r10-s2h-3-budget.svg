<text x="650.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет світла: 11 відбивань поспіль</text>
