<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як народилася інтегральна схема: ланцюг подій 1957–1966</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не один стрибок одного генія, а кілька внесків, що зійшлися — і довгий суд за те, чий же це винахід</text>
<line x1="80.0" y1="130.0" x2="860.0" y2="130.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="125.0" x2="110.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="110.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1957</text>
<line x1="250.0" y1="125.0" x2="250.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1958</text>
<line x1="430.0" y1="125.0" x2="430.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="430.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1959</text>
<line x1="640.0" y1="125.0" x2="640.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="640.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1961</text>
<line x1="820.0" y1="125.0" x2="820.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="820.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1966</text>
<circle cx="110.0" cy="130.0" r="8.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<line x1="110.0" y1="121.0" x2="110.0" y2="102.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="18.0" y="35.0" width="184.0" height="67.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="110.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Грудень 1957</text>
<text x="110.0" y="69.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ерні (Hoerni) занотовує</text>
<text x="110.0" y="85.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">планарну ідею: лишити</text>
<text x="110.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оксид на поверхні</text>
<circle cx="250.0" cy="130.0" r="8.0" fill="#fff" stroke="#1f47b5" stroke-width="3"/>
<line x1="250.0" y1="139.0" x2="250.0" y2="158.0" stroke="#1f47b5" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="158.0" y="158.0" width="184.0" height="67.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.7"/>
<text x="250.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Вересень 1958</text>
<text x="250.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кілбі (Kilby) у TI: перша</text>
<text x="250.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">робоча схема в одному</text>
<text x="250.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шматку — на «вусах»</text>
<circle cx="430.0" cy="130.0" r="8.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<line x1="430.0" y1="121.0" x2="430.0" y2="102.0" stroke="#c0271e" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="338.0" y="35.0" width="184.0" height="67.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.7"/>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Січень 1959</text>
<text x="430.0" y="69.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Нойс (Noyce): монолітна</text>
<text x="430.0" y="85.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ІС — плаский метал по</text>
<text x="430.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оксиду Ерні</text>
<circle cx="640.0" cy="130.0" r="8.0" fill="#fff" stroke="#caa24a" stroke-width="3"/>
<line x1="640.0" y1="139.0" x2="640.0" y2="158.0" stroke="#caa24a" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="548.0" y="158.0" width="184.0" height="67.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.7"/>
<text x="640.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">1961</text>
<text x="640.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перші ІС у продажу;</text>
<text x="640.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обидві фірми патентують</text>
<text x="640.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">своє → починається суд</text>
<circle cx="820.0" cy="130.0" r="8.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<line x1="820.0" y1="121.0" x2="820.0" y2="102.0" stroke="#1f8a3b" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="728.0" y="35.0" width="184.0" height="67.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="820.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1966</text>
<text x="820.0" y="69.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мир: TI й Fairchild</text>
<text x="820.0" y="85.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перехресно ліцензують</text>
<text x="820.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">патенти одне одному</text>
<rect x="60.0" y="420.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Червоний вузол — суть історії: монолітна ІС Нойса (січень 1959), що поклала плаский метал на оксид Ерні.</text>
<text x="470.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Але до неї вже були й планарна ідея Ерні (1957), і працююча схема Кілбі (1958). Три внески — одне диво, і довгий суд за авторство.</text>
</svg>
