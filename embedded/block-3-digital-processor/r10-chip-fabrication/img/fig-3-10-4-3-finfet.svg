<text x="360.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Коли транзистор крихітний, керувати каналом «зверху» вже мало — струм тече повз.</text>
<text x="360.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому затвор обгортають канал щільніше: 3 боки (FinFET), потім усі (GAA). Це геометрія, а не «нанометри».</text>
