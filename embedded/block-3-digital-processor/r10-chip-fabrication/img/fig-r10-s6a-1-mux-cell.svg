<text x="80.0" y="628.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тригери — це і так пам'ять стану (§3.3). Додавши перед кожним MUX, ми дістаємо ДРУГИЙ режим: перемкнути scan_en = 1 — і весь стан чіпа можна вписати ззовні та зчитати назад через дві ніжки.</text>
