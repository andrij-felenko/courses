<text x="56.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Ціна: один MUX і один дріт на кожен тригер (≈кілька % площі).</text>
