<text x="530.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тригер бере стан від логіки схеми —</text>
<text x="530.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">чіп працює як завжди (§3.3.3, §3.5).</text>
<text x="530.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">scan-вхід ігнорується.</text>
<rect x="516.0" y="226.0" width="408.0" height="96.0" rx="9" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="530.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">scan_en = 1  →  SCAN режим</text>
<text x="530.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вхід кожного тригера = вихід сусіда;</text>
<text x="530.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усі тригери = ОДИН довгий зсувний</text>
<text x="530.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">регістр (рух бітів — як у §3.3.4).</text>
<text x="490.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Scan-режим: розкидані по чіпу тригери з'єднані в одну стрічку від ніжки scan-in до ніжки scan-out</text>
