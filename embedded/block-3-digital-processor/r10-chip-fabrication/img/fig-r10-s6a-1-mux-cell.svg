<text x="490.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один тригер у двох режимах: робота — і scan (вся логіка стає одним зсувним регістром)</text>
<text x="490.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перед кожним тригером ставлять MUX. Сигнал scan_en вибирає, ЗВІДКИ тригер бере наступний стан.</text>
