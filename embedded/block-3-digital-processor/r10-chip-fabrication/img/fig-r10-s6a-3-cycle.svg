<text x="393.8" y="521.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">cap</text>
<rect x="416.0" y="502.0" width="249.6" height="30.0" rx="5" fill="#fff" stroke="#7a3ea8" stroke-width="1.8"/>
<text x="541.8" y="521.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3ea8" text-anchor="middle" font-weight="bold" font-style="normal">A:out ∥ B:in</text>
<rect x="667.6" y="502.0" width="42.4" height="30.0" rx="5" fill="#fff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="689.8" y="521.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">cap</text>
<rect x="712.0" y="502.0" width="146.0" height="30.0" rx="5" fill="#fff" stroke="#7a3ea8" stroke-width="1.8"/>
<text x="786.0" y="521.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a3ea8" text-anchor="middle" font-weight="bold" font-style="normal">B:out ∥ C:in</text>
<text x="120.0" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Час →</text>
<text x="860.0" y="550.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">довгі фази зсуву перекриваються — тестер працює майже без простою.</text>
<rect x="60.0" y="590.0" width="860.0" height="64.0" rx="10" fill="#f0fff2" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="80.0" y="614.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Перевірка одним порівнянням:</text>
<text x="80.0" y="636.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тестер заздалегідь знає, який біт-рядок мусить вийти на справному чіпі. Зчитав інше — кристал бракований. Жодного «ручного» доступу до внутрішніх вузлів не треба.</text>
