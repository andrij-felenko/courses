<text x="74.0" y="342.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">scan_en = 1</text>
<text x="74.0" y="364.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">багато тактів: вектор</text>
<text x="74.0" y="386.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">вштовхується біт за бітом</text>
<text x="74.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">довго: ~стільки тактів,</text>
<text x="74.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">скільки тригерів у ланцюзі</text>
<line x1="335.3" y1="365.0" x2="351.3" y2="365.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
