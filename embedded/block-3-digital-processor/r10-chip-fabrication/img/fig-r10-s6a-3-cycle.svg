<rect x="353.3" y="290.0" width="273.3" height="28.0" rx="10" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="367.3" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal">2. CAPTURE</text>
<text x="367.3" y="342.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">scan_en = 0</text>
<text x="367.3" y="364.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">РІВНО один робочий такт</text>
<text x="367.3" y="386.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">виходи логіки сідають у тригери</text>
<text x="367.3" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">коротко: один такт —</text>
<text x="367.3" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">реакція логіки зафіксована</text>
<line x1="628.7" y1="365.0" x2="644.7" y2="365.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
