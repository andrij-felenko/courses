<rect x="646.7" y="290.0" width="273.3" height="28.0" rx="10" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="660.7" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal">3. SHIFT-OUT</text>
<text x="660.7" y="342.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">scan_en = 1</text>
<text x="660.7" y="364.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">багато тактів: відповідь</text>
<text x="660.7" y="386.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">виштовхується назовні</text>
<text x="660.7" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="italic">довго; одночасно засуваємо</text>
<text x="660.7" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="italic">вже наступний вектор</text>
<text x="490.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому тести не повзуть: вихід одного вектора й вхід наступного зсуваються ОДНИМ рухом</text>
<line x1="120.0" y1="496.0" x2="860.0" y2="496.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
