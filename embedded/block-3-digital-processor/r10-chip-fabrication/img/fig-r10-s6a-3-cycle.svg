<text x="490.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Між двома стінками тригерів сидить комбінаційна логіка. Scan керує її входами й бачить її виходи.</text>
