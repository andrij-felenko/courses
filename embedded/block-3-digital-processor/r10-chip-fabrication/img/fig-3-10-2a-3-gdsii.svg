<text x="36.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що всередині GDSII (спрощено):</text>
<text x="42.0" y="90.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold">STRUCTURE  cpu_top</text>
