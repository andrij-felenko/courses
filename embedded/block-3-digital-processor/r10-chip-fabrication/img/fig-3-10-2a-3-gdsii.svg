<text x="42.0" y="134.0" font-family="Consolas, monospace" font-size="12.5" fill="#7a3ea8" text-anchor="start" font-weight="normal">  SREF  alu_cell   @(12,0)   ← повтор</text>
<text x="42.0" y="156.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold">  STRUCTURE  alu_cell</text>
<text x="42.0" y="178.0" font-family="Consolas, monospace" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="normal">    BOUNDARY  layer=ACTIVE  [полігон]</text>
<text x="42.0" y="200.0" font-family="Consolas, monospace" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal">    BOUNDARY  layer=POLY    [полігон]</text>
