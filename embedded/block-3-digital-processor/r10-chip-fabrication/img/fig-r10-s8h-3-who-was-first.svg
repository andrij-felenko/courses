<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510">
<rect width="940" height="510" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чим саме TSMC була «першою»: розводимо два різні твердження</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«виробляти чужі чипи» вміли й до 1987; новим було робити це як ОСНОВНУ справу — й нікому не конкурувати</text>
<text x="250.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Що вже існувало до 1987</text>
<rect x="60.0" y="110.0" width="380.0" height="250.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<rect x="76.0" y="132.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="84.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Fujitsu, IBM, NEC, TI, Toshiba</text>
<text x="84.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">гіганти-IDM іноді варили чужі чипи —</text>
<text x="84.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">але як побічну послугу, у вільний час фабрики</text>
<rect x="76.0" y="208.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="84.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ 50 «fabless»-фірм (сер. 1980-х)</text>
<text x="84.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">уже проєктували чипи без власної фабрики</text>
<text x="84.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">й шукали, де їх замовити</text>
<rect x="76.0" y="284.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="84.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Chips &amp; Technologies, 1985</text>
<text x="84.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Ґордон Кемпбелл і Дадо Банатао —</text>
<text x="84.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">часто звана першою суто fabless-фірмою</text>
<text x="250.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">проблема: побічна послуга — ненадійна, а IDM ще й конкурент</text>
<line x1="448.0" y1="235.0" x2="492.0" y2="235.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aAmber)"/>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="normal" font-style="italic">чого</text>
<text x="470.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="normal" font-style="italic">бракувало</text>
<text x="690.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Що додала TSMC (1987)</text>
<rect x="500.0" y="110.0" width="380.0" height="250.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<rect x="516.0" y="132.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="524.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Виробництво — ОСНОВНА справа</text>
<text x="524.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">не побічний підробіток фабрики, а весь</text>
<text x="524.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">сенс фірми: потужність завжди для клієнта</text>
<rect x="516.0" y="208.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="524.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Ми не конкуруємо з клієнтом»</text>
<text x="524.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">TSMC не має власних чипів-брендів —</text>
<text x="524.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тож клієнт сміливо віддає свій проєкт</text>
<rect x="516.0" y="284.0" width="348.0" height="66.0" rx="7" fill="#fff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="524.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Спільна фабрика для всіх</text>
<text x="524.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">одна дорога лінія обслуговує десятки</text>
<text x="524.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">малих фірм — кожній порізно було б не під силу</text>
<text x="690.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">результат: проєктувати чипи змогли навіть малі команди</text>
<rect x="60.0" y="432.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Точне формулювання: TSMC — не перший, хто виробляв чужі чипи, і не вона придумала fabless. Вона перша зробила виробництво на замовлення</text>
<text x="470.0" y="482.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">надійною, головною справою фірми, яка нікому не конкурує. Саме ця обіцянка довіри, а не сам факт «варимо чуже», запустила цілу fabless-індустрію.</text>
</svg>
