<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому errata тримаються ревізії кристала</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ревізія = набір фотомасок; хиба сидить у масках, тож зникає лише з новим набором</text>
<rect x="70.0" y="92.0" width="230.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2.6"/>
<rect x="70.0" y="92.0" width="230.0" height="32.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="185.0" y="114.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">rev B0  (stepping)</text>
<rect x="100.0" y="140.0" width="170.0" height="60.0" rx="4" fill="#eef2f6" stroke="#7a8590" stroke-width="1.8"/>
<line x1="134.0" y1="140.0" x2="134.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="168.0" y1="140.0" x2="168.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="202.0" y1="140.0" x2="202.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="236.0" y1="140.0" x2="236.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="185.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">⚠ X</text>
<text x="185.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">масковий набір №1</text>
<text x="185.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">баг X живе тут:</text>
<text x="185.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у самому кремнії</text>
<text x="185.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перелічений у errata</text>
<rect x="370.0" y="92.0" width="230.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2.6"/>
<rect x="370.0" y="92.0" width="230.0" height="32.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="485.0" y="114.0" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">rev C0  (stepping)</text>
<rect x="400.0" y="140.0" width="170.0" height="60.0" rx="4" fill="#eef2f6" stroke="#7a8590" stroke-width="1.8"/>
<line x1="434.0" y1="140.0" x2="434.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="468.0" y1="140.0" x2="468.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="502.0" y1="140.0" x2="502.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="536.0" y1="140.0" x2="536.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="485.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<text x="485.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">масковий набір №2</text>
<text x="485.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">маски змінено →</text>
<text x="485.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">баг X прибрано;</text>
<text x="485.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">errata X закрито</text>
<line x1="306.0" y1="175.0" x2="364.0" y2="175.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="335.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">новий</text>
<text x="335.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">набір</text>
<text x="335.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">масок</text>
<rect x="600.0" y="92.0" width="250.0" height="180.0" rx="12" fill="#f3f0f8" stroke="#5a3a8a" stroke-width="2.4"/>
<rect x="600.0" y="92.0" width="250.0" height="32.0" rx="0" fill="#5a3a8a" stroke="#5a3a8a" stroke-width="0"/>
<text x="725.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Як цим користується код</text>
<text x="614.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1. читаємо регістр ID:</text>
<text x="614.0" y="165.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   там лежить номер ревізії</text>
<text x="614.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2. дивимось errata саме</text>
<text x="614.0" y="207.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   цієї ревізії</text>
<text x="614.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3. якщо баг тут — вмикаємо</text>
<text x="614.0" y="249.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   обхід (workaround)</text>
<rect x="60.0" y="360.0" width="780.0" height="92.0" rx="10" fill="#fff7ef" stroke="#e08030" stroke-width="1.8"/>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Суть: errata — це «паспорт відомих хиб» КОНКРЕТНОЇ ревізії, а не чіпа взагалі.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та сама родина в rev B0 і rev C0 може поводитися по-різному: один список хиб закрито, інший — ще ні.</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому в errata кожен рядок має колонку «у яких ревізіях є», а драйвер обходить баг лише там, де він справді живе.</text>
</svg>
