<text x="460.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головна несиметрія NOR-флеші:  запис уміє ТІЛЬКИ опускати біти 1 → 0.</text>
<text x="460.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Підняти біт назад 0 → 1 поодинці неможливо — це робить лише стирання, і відразу для цілого блока.</text>
<rect x="60.0" y="450.0" width="800.0" height="70.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="460.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й асиметрія часу: читання — наносекунди-мікросекунди; запис сторінки — частки мілісекунди;</text>
<text x="460.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стирання блока — десятки-сотні мілісекунд. Читати дешево, стирати дорого — це визначає, як таким чипом користуються.</text>
<text x="460.0" y="512.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Точні числа — за даташитом конкретного чипа (перевірити); тут важать порядки.</text>
</svg>
