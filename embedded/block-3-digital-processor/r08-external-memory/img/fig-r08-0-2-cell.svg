<text x="240.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стовпець (bit line)</text>
<line x1="240.0" y1="140.0" x2="240.0" y2="182.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<line x1="214.0" y1="184.0" x2="240.0" y2="184.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="214.0" y1="216.0" x2="300.0" y2="216.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
