<line x1="750.0" y1="218.0" x2="750.0" y2="242.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<line x1="750.0" y1="230.0" x2="762.0" y2="230.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="756.0" y1="238.0" x2="768.0" y2="238.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="759.0" y1="242.0" x2="765.0" y2="242.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="746.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ + +</text>
<text x="746.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">заряд є = «1»</text>
<text x="660.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">заряд тримається… але НЕ вічно:</text>
<text x="660.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">конденсатор помалу «тече» крізь неідеальний</text>
<text x="660.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ізолятор — тому біт треба раз у раз ОСВІЖАТИ</text>
<text x="660.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(скільки часу до втрати — кількісно в 🧮 §3.8.2)</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порівняйте з тригером (§3.3): там біт тримає ПЕТЛЯ з кількох транзисторів, що активно живиться струмом.</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тут біт — це пасивний заряд у відерці. Дешево до краю (дві деталі), та платня — за течу: безперервна регенерація.</text>
<text x="450.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси й назва: DRAM — Dynamic RAM, «динамічна», бо вміст доводиться постійно поновлювати, інакше він зникне.</text>
</svg>
