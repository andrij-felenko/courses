<line x1="330.0" y1="218.0" x2="330.0" y2="242.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<line x1="330.0" y1="230.0" x2="342.0" y2="230.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="336.0" y1="238.0" x2="348.0" y2="238.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="339.0" y1="242.0" x2="345.0" y2="242.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="326.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ + +</text>
<text x="326.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">заряд є = «1»</text>
<text x="240.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пів-секрету DRAM: дешевизна — бо деталей лише ДВІ</text>
<rect x="480.0" y="84.0" width="360.0" height="300.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="660.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗБЕРІГАННЯ: ключ off → заряд замкнено</text>
<text x="516.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">рядок</text>
<text x="516.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(0 В)</text>
<line x1="520.0" y1="176.0" x2="612.0" y2="176.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
<line x1="634.0" y1="184.0" x2="634.0" y2="216.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<line x1="616.0" y1="200.0" x2="630.0" y2="200.0" stroke="#8a8a8a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="630.0" y1="191.0" x2="630.0" y2="209.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<text x="612.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">off</text>
<text x="660.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стовпець відключено</text>
<line x1="634.0" y1="184.0" x2="660.0" y2="184.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
<line x1="634.0" y1="216.0" x2="720.0" y2="216.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
