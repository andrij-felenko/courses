  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Комірка Деннарда: один транзистор-ключ і один конденсатор-«відерце»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">біт — це наявність чи відсутність заряду у крихітному конденсаторі; транзистор лише ВІДЧИНЯЄ доступ до нього</text>
<rect x="60.0" y="84.0" width="360.0" height="300.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗАПИС «1»: ключ ON → конденсатор заряджається</text>
<text x="96.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">рядок</text>
<text x="96.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal">(word)</text>
<line x1="100.0" y1="176.0" x2="196.0" y2="176.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<line x1="214.0" y1="184.0" x2="214.0" y2="216.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="196.0" y1="200.0" x2="210.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="210.0" y1="191.0" x2="210.0" y2="209.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
