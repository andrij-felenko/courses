<text x="335.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">компроміс: заряд на ємності</text>
<text x="335.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">затвора, окремі ключі на</text>
<text x="335.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">запис і читання;</text>
