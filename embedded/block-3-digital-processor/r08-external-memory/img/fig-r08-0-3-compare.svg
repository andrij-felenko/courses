<text x="627.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">один ключ + один</text>
<text x="627.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">конденсатор; найменша</text>
<text x="627.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">можлива комірка —</text>
<text x="627.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">найщільніша й найдешевша,</text>
<text x="627.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ціною регенерації</text>
<line x1="625.0" y1="292.0" x2="859.0" y2="292.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="742.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">переможець: уся масова ОЗП</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось чому 1T-комірка зрештою перемогла: на тій самій площі кремнію вона дає НАЙБІЛЬШЕ бітів — отже, найдешевших.</text>
<text x="450.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Платня за щільність — складніший контролер: руйнівне читання й безперервна регенерація (далі). Воно того варте.</text>
</svg>
