<text x="43.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поки є живлення;</text>
<text x="43.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ШВИДКА, не тече, не треба</text>
<text x="43.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">освіжати — але ВЕЛИКА</text>
<text x="43.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">й дорога на біт</text>
