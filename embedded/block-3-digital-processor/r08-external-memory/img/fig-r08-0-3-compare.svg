<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перегони «менше деталей на біт»: 6 → 3 → 1 транзистор</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що менше транзисторів на один біт, то більше бітів влазить на кристал — і то дешевший кожен біт</text>
<rect x="23.0" y="80.0" width="270.0" height="300.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.6"/>
