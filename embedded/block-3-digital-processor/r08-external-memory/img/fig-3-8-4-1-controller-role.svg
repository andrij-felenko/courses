<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fb5"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контролер пам'яті — перекладач між «дай байт» і протоколом DRAM</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ядро хоче просто читати й писати за адресою; контролер перетворює це на ACT/RD/CAS, таймінги й регенерацію</text>
<rect x="70.0" y="170.0" width="150.0" height="110.0" rx="8" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="145.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Ядро / шина</text>
<text x="145.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">read/write addr</text>
<text x="145.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">проста мова:</text>
<text x="145.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">«дай слово за адресою A»</text>
<rect x="360.0" y="140.0" width="280.0" height="200.0" rx="14" fill="#f1ecfa" stroke="#6a3fb5" stroke-width="2.6"/>
<text x="500.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#6a3fb5" text-anchor="middle" font-weight="bold" font-style="normal">Контролер пам'яті</text>
<line x1="380.0" y1="180.0" x2="620.0" y2="180.0" stroke="#6a3fb5" stroke-width="1.4" stroke-linecap="round"/>
<text x="378.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• розкласти адресу: банк / ряд / стовпець</text>
<text x="378.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• видати ACT → RD/WR із потрібними паузами</text>
<text x="378.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• витримати таймінги (tRCD, tRP, CAS…)</text>
<text x="378.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• періодично слати REFRESH усім рядам</text>
<text x="378.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• провести ініціалізацію при старті</text>
<rect x="770.0" y="170.0" width="160.0" height="110.0" rx="8" fill="#fdeef0" stroke="#c0271e" stroke-width="2.2"/>
<text x="850.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">DRAM-чіп</text>
<text x="850.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ACT / RD / CAS / REF</text>
<text x="850.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">складна мова:</text>
<text x="850.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">команди + жорсткі таймінги</text>
<line x1="220.0" y1="215.0" x2="360.0" y2="215.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="290.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">запит</text>
<line x1="360.0" y1="255.0" x2="220.0" y2="255.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="290.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">дані</text>
<line x1="640.0" y1="215.0" x2="770.0" y2="215.0" stroke="#6a3fb5" stroke-width="2.2" marker-end="url(#aPurple)"/>
<text x="705.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#6a3fb5" text-anchor="middle" font-weight="bold" font-style="normal">команди</text>
<line x1="770.0" y1="255.0" x2="640.0" y2="255.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="705.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">слова</text>
<text x="500.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ось чому DDR не підключиш до простих ніжок GPIO: між ядром і чіпом мусить стояти спеціальний контролер, що знає весь цей протокол.</text>
</svg>
