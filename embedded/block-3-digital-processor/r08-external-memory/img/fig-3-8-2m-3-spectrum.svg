<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
<rect width="900" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому тече саме DRAM: яка «герметичність» у трьох видів пам'яті</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">час утримання біта без оновлення тягнеться на 18+ порядків — і вирішує його якість «вимикача» на вузлі зберігання</text>
<rect x="70.0" y="92.0" width="760.0" height="96.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="92.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">DRAM (1T1C)</text>
<text x="92.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">конденсатор за нещільним ключем</text>
<text x="92.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ПОТРІБНА регенерація: заряд стікає за мілісекунди</text>
<line x1="560.0" y1="104.0" x2="560.0" y2="176.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="695.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає біт:</text>
<text x="695.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">≈ десятки мс</text>
<rect x="70.0" y="200.0" width="760.0" height="96.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="92.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">SRAM (6T)</text>
<text x="92.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">два інвертори тримають стан активно</text>
<text x="92.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">регенерація НЕ потрібна — петля сама поновлює рівень (§3.6.8)</text>
<line x1="560.0" y1="212.0" x2="560.0" y2="284.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="695.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає біт:</text>
<text x="695.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">поки є живлення</text>
<rect x="70.0" y="308.0" width="760.0" height="96.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="92.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Flash (floating gate)</text>
<text x="92.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">заряд замкнений в ізоляторі</text>
<text x="92.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">майже ідеальна ізоляція; заряд нікуди тікати (§3.6.8)</text>
<line x1="560.0" y1="320.0" x2="560.0" y2="392.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="695.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає біт:</text>
<text x="695.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ роки (10+)</text>
<text x="450.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один транзистор робить DRAM найдешевшою (мала площа на біт) — і водночас «дірявою»: за це й платимо регенерацією.</text>
</svg>
