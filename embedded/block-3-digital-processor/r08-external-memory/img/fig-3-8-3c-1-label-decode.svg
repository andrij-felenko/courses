<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Маркування модуля: що в ньому зашифровано</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий рядок із наклейки розкладаємо на три незалежні поля</text>
<rect x="70.0" y="80.0" width="740.0" height="52.0" rx="8" fill="#f3f7f3" stroke="#1f6b3a" stroke-width="2"/>
<text x="440.0" y="114.0" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PC4-25600   DDR4-3200   CL22-22-22</text>
<line x1="218.0" y1="136.0" x2="218.0" y2="158.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="218.0" y1="158.0" x2="176.0" y2="244.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="60.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="60.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="176.0" y="271.0" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">PC4-25600</text>
<text x="176.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">= пік ГБ/с × 1000</text>
<text x="74.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сімейство модуля (PC4 = DDR4)</text>
<text x="74.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">25600 МБ/с = 3200 × 8 байт</text>
<line x1="468.0" y1="136.0" x2="468.0" y2="158.0" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<line x1="468.0" y1="158.0" x2="426.0" y2="244.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<rect x="310.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="310.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="426.0" y="271.0" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">DDR4-3200</text>
<text x="426.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">тип і швидкість</text>
<text x="324.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">DDR4 — покоління (з §3.8.2)</text>
<text x="324.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3200 — переходів даних за</text>
<text x="324.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">секунду, у млн (МТ/с)</text>
<line x1="700.0" y1="136.0" x2="700.0" y2="158.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<line x1="700.0" y1="158.0" x2="676.0" y2="244.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="560.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="2.4"/>
<rect x="560.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="676.0" y="271.0" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">CL22</text>
<text x="676.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">затримка, у тактах</text>
<text x="574.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">CAS Latency — пауза від</text>
<text x="574.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">запиту до першого слова;</text>
<text x="574.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">22 такти, не наносекунд!</text>
<rect x="60.0" y="418.0" width="760.0" height="38.0" rx="8" fill="#fff7ef" stroke="#e08030" stroke-width="1.8"/>
<text x="440.0" y="443.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Швидкість (3200) і затримка (CL22) — це РІЗНІ числа: одне про потік, друге про паузу перед першим словом.</text>
</svg>
