<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<rect width="1000" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fb5"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: комплект пам'яті для реєстратора з екраном</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Один пристрій — кілька пам'ятей, кожна закриває свою потребу; так і збирають реальну специфікацію</text>
<rect x="420.0" y="210.0" width="160.0" height="90.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="500.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мікроконтролер</text>
<text x="500.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ядро + трохи SRAM</text>
<rect x="120.0" y="90.0" width="200.0" height="90.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="220.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кадри екрана 320×240</text>
<text x="220.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">зовнішня SDRAM</text>
<text x="220.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">швидко, об'ємно, летко — байдуже</text>
<line x1="320.0" y1="135.0" x2="420.0" y2="255.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<rect x="120.0" y="330.0" width="200.0" height="90.0" rx="12" fill="#f1ecfa" stroke="#6a3fb5" stroke-width="2.2"/>
<text x="220.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прошивка (код)</text>
<text x="220.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6a3fb5" text-anchor="middle" font-weight="bold" font-style="normal">внутрішня / NOR-флеш</text>
<text x="220.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">XIP, не копіюючи</text>
<line x1="320.0" y1="375.0" x2="420.0" y2="255.0" stroke="#6a3fb5" stroke-width="2" marker-end="url(#aPurple)"/>
<rect x="680.0" y="90.0" width="200.0" height="90.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="780.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Журнал вимірів (МБ)</text>
<text x="780.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">SD-картка</text>
<text x="780.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ємно, знімно, дешево</text>
<line x1="680.0" y1="135.0" x2="580.0" y2="255.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="680.0" y="330.0" width="200.0" height="90.0" rx="12" fill="#fbf4e2" stroke="#caa24a" stroke-width="2.2"/>
<text x="780.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Калібрування й лічильник</text>
<text x="780.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">FRAM / EEPROM</text>
<text x="780.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">часті дрібні записи</text>
<line x1="680.0" y1="375.0" x2="580.0" y2="255.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<text x="500.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жодна окрема пам'ять не закрила б усі чотири потреби: різні вимоги — різні чіпи, зведені в один пристрій.</text>
<text x="500.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Саме так і виглядає підсумок розділу: знаєш характер даних — знаєш, яку пам'ять ставити.</text>
</svg>
