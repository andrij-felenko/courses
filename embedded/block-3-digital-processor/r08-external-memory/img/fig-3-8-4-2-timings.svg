<text x="500.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кожен інтервал — фізика конкретного чіпа (час відкриття ряду, заряд буфера). Порушиш таймінг — дані спотворяться.</text>
<text x="500.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Тому числа таймінгів (як «CL22» на модулі) контролер мусить знати наперед — звідки й береться крок ініціалізації.</text>
