<text x="500.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FRAM сяє там, де треба часто й безпечно зберігати стан — наприклад, дописувати лічильник при кожному циклі чи рятувати дані при зникненні живлення.</text>
