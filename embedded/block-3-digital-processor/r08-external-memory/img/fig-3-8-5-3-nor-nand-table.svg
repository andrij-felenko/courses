<rect x="670.0" y="290.0" width="280.0" height="50.0" rx="0" fill="#fafafa" stroke="#e4e4e4" stroke-width="1"/>
<text x="96.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Швидкість запису/стирання</text>
<text x="540.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">повільніша</text>
<text x="810.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">швидша, блоками</text>
