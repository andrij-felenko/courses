<rect x="80.0" y="390.0" width="330.0" height="50.0" rx="0" fill="#fafafa" stroke="#e4e4e4" stroke-width="1"/>
<rect x="410.0" y="390.0" width="260.0" height="50.0" rx="0" fill="#fafafa" stroke="#e4e4e4" stroke-width="1"/>
<rect x="670.0" y="390.0" width="280.0" height="50.0" rx="0" fill="#fafafa" stroke="#e4e4e4" stroke-width="1"/>
<text x="96.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Типове застосування</text>
<text x="540.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">прошивка, код</text>
<text x="810.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">файли, медіа, SSD/SD</text>
<rect x="80.0" y="90.0" width="870.0" height="350.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="500.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Запам'ятайте різницю одним рядком: NOR — щоб ВИКОНУВАТИ, NAND — щоб ЗБЕРІГАТИ.</text>
