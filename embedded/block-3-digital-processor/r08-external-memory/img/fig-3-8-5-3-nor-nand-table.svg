<rect x="670.0" y="240.0" width="280.0" height="50.0" rx="0" fill="#ffffff" stroke="#e4e4e4" stroke-width="1"/>
<text x="96.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ємність за ту саму ціну</text>
