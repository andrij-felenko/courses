<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ініціалізація: розбудити чіп, потім вічно його регенерувати</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">До першого корисного звернення контролер веде чіп через фіксовану процедуру; далі — нескінченний фоновий refresh</text>
<rect x="50.0" y="120.0" width="138.0" height="90.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.2"/>
