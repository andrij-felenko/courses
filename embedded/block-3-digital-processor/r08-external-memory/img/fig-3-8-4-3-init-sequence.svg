<text x="500.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">…і паралельно, поки чіп живий — контролер сам шле REFRESH кожному ряду кожні ~64 мс</text>
<text x="500.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ваш код цього не бачить: для нього зовнішня DRAM виглядає просто як ще один шмат адрес.</text>
