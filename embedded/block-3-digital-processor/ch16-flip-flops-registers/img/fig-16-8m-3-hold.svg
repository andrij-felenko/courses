<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470">
<rect width="860" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="dotInk" markerWidth="7" markerHeight="7" refX="3.2" refY="3.2"><circle cx="3.2" cy="3.2" r="2.4" fill="#1b1b1b"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Hold — гонка проти ТОГО САМОГО фронту (період тут ні до чого)</text>
<line x1="360.0" y1="62.0" x2="360.0" y2="360.0" stroke="#1f8a3b" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/>
<text x="360.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">той самий фронт (FF1 і FF2 спрацьовують разом)</text>
<text x="30.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CLK</text>
<polyline points="120.0,108.0 360.0,108.0 360.0,78.0 390.0,78.0" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="360.0" y="134.0" width="60.0" height="150.0" rx="3" fill="#ffecea" stroke="#c0271e" stroke-width="1.2"/>
<text x="390.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вікно t_hold</text>
<text x="30.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">D2  ← коротка</text>
<text x="30.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">логіка (мало)</text>
<polyline points="120.0,170.0 384.0,170.0 384.0,140.0 560.0,140.0" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<line x1="390.0" y1="196.0" x2="384.0" y2="170.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="428.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">D2 змінився ВСЕРЕДИНІ вікна hold</text>
<text x="428.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">→ дані «прослизнули» на зайвий тригер: ЗБІЙ</text>
<circle cx="384.0" cy="155.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="30.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">D2  ← довша</text>
<text x="30.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">логіка (досить)</text>
<polyline points="120.0,276.0 490.0,276.0 490.0,246.0 560.0,246.0" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="500.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">D2 змінився ПІСЛЯ вікна — чисто</text>
<circle cx="490.0" cy="261.0" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<line x1="384.0" y1="298.0" x2="490.0" y2="298.0" stroke="#8a8a8a" stroke-width="1.4" marker-start="url(#aGrey)" marker-end="url(#aGrey)"/>
<text x="437.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">затримка шляху відсуває зміну праворуч</text>
<rect x="120.0" y="400.0" width="620.0" height="50.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="132.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">t_clk→q + t_logic(мін)  ≥  t_hold      (умова короткого шляху)</text>
<text x="132.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Не залежить від T: повільніший такт hold не лікує — рятують буфери на закоротких шляхах.</text>
</svg>
