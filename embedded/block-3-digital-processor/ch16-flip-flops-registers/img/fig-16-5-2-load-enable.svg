<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дозвіл запису: регістр тримає, поки не накажуть «завантажити»</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перед тригером — MUX: load=0 повертає старе значення (тримати), load=1 пропускає нові дані</text>
<text x="95.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">нові дані</text>
<line x1="100.0" y1="150.0" x2="180.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="95.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(старе Q)</text>
<line x1="100.0" y1="200.0" x2="180.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 180,135 L 215,150 L 215,200 L 180,215 Z" fill="#fbf6ec" stroke="#1b1b1b" stroke-width="2"/>
