<line x1="215.0" y1="175.0" x2="280.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<rect x="280.0" y="140.0" width="90.0" height="70.0" rx="5" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.8"/>
<path d="M 280,187 L 292,194 L 280,201" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="290.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">D</text>
<text x="360.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="325.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D-тригер</text>
<line x1="370.0" y1="162.0" x2="470.0" y2="162.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="476.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q</text>
<circle cx="430.0" cy="162.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<line x1="430.0" y1="162.0" x2="430.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="430.0" y1="290.0" x2="130.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
