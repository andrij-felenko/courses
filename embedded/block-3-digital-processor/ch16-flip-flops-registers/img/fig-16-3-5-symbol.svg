  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Умовний символ D-тригера — і чому він «робочий кінь»</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">трикутник на тактовому вході = «спрацьовує по ФРОНТУ»; один вхід D, виходи Q і Q̄</text>
<rect x="180.0" y="110.0" width="110.0" height="130.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<text x="196.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">D</text>
<text x="274.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="274.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q̄</text>
<path d="M 180,203 L 192,210 L 180,217" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="198.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">clk</text>
<line x1="120.0" y1="142.0" x2="180.0" y2="142.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">D</text>
<line x1="120.0" y1="210.0" x2="180.0" y2="210.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">clk</text>
<line x1="290.0" y1="142.0" x2="350.0" y2="142.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="356.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q</text>
<line x1="290.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="356.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q̄</text>
<text x="235.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D-тригер</text>
<text x="235.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q ← D по фронту clk</text>
<rect x="470.0" y="110.0" width="320.0" height="150.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="630.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому він усюди:</text>
<text x="486.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• один вхід, без заборонених станів</text>
<text x="486.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• запис лише в чітку мить (фронт) →</text>
<text x="486.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  уся машина крокує синхронно</text>
<text x="486.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 8 поряд = РЕГІСТР на байт (§16.5)</text>
<text x="486.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ланцюжок = ЛІЧИЛЬНИК (§16.7)</text>
<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D-тригер — основний елемент пам'яті всієї синхронної цифрової техніки.</text>
</svg>
