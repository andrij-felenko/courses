<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ділення частоти: з одного швидкого такту — будь-який повільніший</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">N-бітний лічильник на старшому біті дає такт / 2ᴺ — так роблять повільні ритми з кварцового такту</text>
<text x="150.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q0</text>
<text x="175.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="200.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">такт / 2</text>
<text x="150.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q1</text>
<text x="175.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="200.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">такт / 4</text>
<text x="150.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q2</text>
<text x="175.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="200.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">такт / 8</text>
<text x="150.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q9</text>
<text x="175.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="200.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">такт / 1024</text>
<text x="150.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q23</text>
<text x="175.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="200.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">такт / ≈16 млн</text>
<text x="150.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="italic">(що старший біт — то повільніший)</text>
<rect x="470.0" y="100.0" width="360.0" height="200.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="650.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: блимати світлодіодом 1 раз/с</text>
<text x="490.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кварц 16 МГц = 16 000 000 тактів/с</text>
<text x="490.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ділимо на 2²⁴ ≈ 16.8 млн →</text>
<text x="490.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">≈ 1 Гц на старшому біті лічильника</text>
<text x="490.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Так само роблять секунди годинника,</text>
<text x="490.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">періоди таймерів, частоти звуку.</text>
<text x="490.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">Серце апаратних таймерів (Розділ 24).</text>
<text x="430.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лічильник — це і годинник, і подільник частоти: рахуючи такти, він відмірює час.</text>
</svg>
