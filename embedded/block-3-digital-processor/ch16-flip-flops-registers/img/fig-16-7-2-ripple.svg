<text x="440.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Молодший біт Q0 ділить такт на 2, Q1 — на 4, Q2 — на 8: біт n = такт / 2ⁿ⁺¹.</text>
