<text x="782.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S=1, R=1</text>
<rect x="732.0" y="160.0" width="100.0" height="70.0" rx="8" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="782.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SR</text>
<text x="782.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">засувка</text>
<text x="782.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Q=Q̄=0 (!)</text>
<text x="782.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не комплементарні</text>
<text x="782.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ так не роблять</text>
<text x="440.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся пам'ять — у випадку «тримати»: прибрали S і R — і засувка зберігає, що в ній було.</text>
