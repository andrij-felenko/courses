<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Такт — це «ручка швидкості»: період мусить вмістити роботу логіки</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">між двома фронтами комбінаційна логіка має ВСТИГНУТИ порахувати (критичний шлях) + запас</text>
<text x="108.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
<line x1="120.0" y1="124.0" x2="820.0" y2="124.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="120.0,124.0 250.0,124.0 250.0,96.0 290.0,96.0 290.0,124.0 620.0,124.0 620.0,96.0 660.0,96.0 660.0,124.0 820.0,124.0" fill="none" stroke="#1b1b1b" stroke-width="2.3"/>
<line x1="250.0" y1="90.0" x2="250.0" y2="350.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="620.0" y1="90.0" x2="620.0" y2="350.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="250.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">▲</text>
<text x="620.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">▲</text>
<line x1="250.0" y1="150.0" x2="620.0" y2="150.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<text x="435.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">період T</text>
<text x="95.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">логіка</text>
<polyline points="250.0,215.0 270.0,215.0 340.0,185.0 520.0,185.0 620.0,185.0" fill="none" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="390.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">порахувала й «устоялась»</text>
<line x1="520.0" y1="170.0" x2="520.0" y2="200.0" stroke="#1f8a3b" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="520.0" y1="200.0" x2="620.0" y2="200.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<text x="570.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">запас</text>
<text x="310.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✔ встигла до наступного фронту</text>
<text x="95.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">надто</text>
<text x="95.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">швидко</text>
<line x1="450.0" y1="320.0" x2="450.0" y2="270.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="450.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">наступний фронт ТУТ</text>
<polyline points="250.0,320.0 270.0,320.0 430.0,285.0 470.0,285.0" fill="none" stroke="#caa24a" stroke-width="2.4"/>
<text x="360.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✘ логіка ще рахує — фронт ловить «сире» → помилка</text>
<text x="440.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому є МАКСИМАЛЬНА частота: T ≥ найдовший шлях логіки + запас. Швидше — лише спростивши логіку (§18).</text>
</svg>
