<text x="118.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q тригер</text>
<line x1="130.0" y1="360.0" x2="840.0" y2="360.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
