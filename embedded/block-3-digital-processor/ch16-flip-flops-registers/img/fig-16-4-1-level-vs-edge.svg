<text x="118.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">D</text>
<line x1="130.0" y1="205.0" x2="840.0" y2="205.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="130.0,205.0 240.0,205.0 240.0,175.0 840.0,175.0" fill="none" stroke="#1f47b5" stroke-width="2.3"/>
