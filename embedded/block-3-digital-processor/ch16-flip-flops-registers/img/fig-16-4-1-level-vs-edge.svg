<text x="440.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Між 1-м і 2-м фронтом виходи різні: латч уже 1, тригер ще 0 — бо латч прозорий, а тригер ні.</text>
