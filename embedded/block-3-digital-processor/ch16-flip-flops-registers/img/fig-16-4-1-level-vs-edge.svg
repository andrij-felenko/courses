<text x="118.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">Q латч</text>
<line x1="130.0" y1="285.0" x2="840.0" y2="285.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
