<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
<rect width="880" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серце ідеї: перехресний зв'язок робить два стійкі стани</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вихід кожного елемента живить вхід іншого — петля сама себе підтримує (як у §14.6)</text>
<path d="M 330,159.0 L 330,189.0 L 370,174 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="376.0" cy="174.0" r="6.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 330,211.0 L 330,241.0 L 370,226 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="376.0" cy="226.0" r="6.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="376.0" y1="174.0" x2="410.0" y2="174.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="376.0" y1="226.0" x2="410.0" y2="226.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="410.0" cy="174.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="410.0" cy="226.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="416.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Q=1</text>
<text x="416.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Q̄=0</text>
<line x1="410.0" y1="174.0" x2="410.0" y2="140.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="410.0" y1="140.0" x2="308.0" y2="140.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="308.0" y1="140.0" x2="308.0" y2="226.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="308.0" y1="226.0" x2="330.0" y2="226.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="410.0" y1="226.0" x2="410.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="410.0" y1="260.0" x2="294.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="294.0" y1="260.0" x2="294.0" y2="174.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="294.0" y1="174.0" x2="330.0" y2="174.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="330.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">два інвертори, з'єднані «навхрест»</text>
<rect x="560.0" y="110.0" width="270.0" height="180.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="695.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два стійкі стани:</text>
<text x="610.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">стан «1»:</text>
<text x="700.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Q=1, Q̄=0</text>
<text x="610.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">стан «0»:</text>
<text x="700.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Q=0, Q̄=1</text>
<text x="610.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">кожен сам себе тримає:</text>
<text x="610.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Q=1 змушує Q̄=0,</text>
<text x="610.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а Q̄=0 змушує Q=1 →</text>
<text x="610.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">замкнене коло, що «застрягло».</text>
<text x="440.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це й є 1 біт пам'яті: схема НЕ скочується в одну рівновагу — вона має дві й тримає обрану.</text>
<text x="440.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перекинути її з одного стану в інший — окремий «поштовх» (set/reset, далі §16.2).</text>
</svg>
