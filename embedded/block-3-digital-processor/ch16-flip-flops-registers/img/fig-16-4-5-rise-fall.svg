<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">По якому фронту — і чому фронт мусить бути ЧИСТИМ</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">буває спрацювання по наростанню (❯) і по спаду (❯ з кружком); а кволий фронт (§14.5) збиває тригер</text>
