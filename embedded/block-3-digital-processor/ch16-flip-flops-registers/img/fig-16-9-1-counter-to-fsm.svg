<text x="440.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама пам'ять стану (§16.7) + інша логіка переходу = з «лічби» виходить машина, що приймає рішення.</text>
