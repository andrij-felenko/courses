<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Узагальнення: лічильник — це автомат, у якого наступний стан завжди «+1»</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відв'яжемо перехід від жорсткого «+1» — і той самий апарат (регістр стану) почне ходити будь-яким маршрутом</text>
