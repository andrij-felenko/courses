<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Метастабільність: тригер «завис» між 0 і 1</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли D змінюється рівно на фронті, вихід може зупинитися посередині й розв'язатися через НЕПЕРЕДБАЧУВАНИЙ час</text>
<text x="98.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
<line x1="110.0" y1="123.0" x2="640.0" y2="123.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="110.0,123.0 240.0,123.0 240.0,97.0 320.0,97.0 320.0,123.0 640.0,123.0" fill="none" stroke="#1b1b1b" stroke-width="2.3"/>
<line x1="240.0" y1="98.0" x2="240.0" y2="300.0" stroke="#c0271e" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="240.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">▲ (D змінився саме тут)</text>
<text x="95.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<line x1="110.0" y1="245.0" x2="640.0" y2="245.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="110.0" y1="175.0" x2="640.0" y2="175.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="110.0,245.0 240.0,245.0 255.0,213.0 300.0,208.0 350.0,214.0 400.0,207.0 450.0,210.0 490.0,204.0 530.0,251.0 640.0,245.0" fill="none" stroke="#caa24a" stroke-width="2.6"/>
<text x="370.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«завис» — ні 0, ні 1</text>
<text x="540.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">нарешті впав</text>
<text x="390.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">час розв'язання — ВИПАДКОВИЙ</text>
<rect x="680.0" y="90.0" width="170.0" height="210.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="765.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як кулька на горбі</text>
<path d="M 700,250 Q 765,150 830,250" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="765.0" cy="145.0" r="9.0" fill="#fbf3e0" stroke="#caa24a" stroke-width="2"/>
<text x="765.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">?</text>
<text x="765.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">балансує, тоді падає</text>
<text x="765.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ліворуч чи праворуч —</text>
<text x="440.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це той самий «горб» бістабільності з §16.0: рівновага хитка, і коли саме та куди впаде — наперед не знати.</text>
</svg>
