<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370">
<rect width="880" height="370" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головне застосування: перетворення серійне ↔ паралельне</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">по одному дроту біти йдуть ПО ЧЕРЗІ; зсувний регістр збирає їх у байт (і навпаки) — основа UART, SPI</text>
<text x="75.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 дріт,</text>
<text x="75.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">біти по черзі:</text>
<line x1="80.0" y1="197.0" x2="280.0" y2="197.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="80.0,197.0 110.0,197.0 110.0,173.0 135.0,173.0 135.0,197.0 160.0,197.0 160.0,173.0 185.0,173.0 185.0,173.0 210.0,173.0 210.0,197.0 235.0,197.0 235.0,173.0 280.0,173.0" fill="none" stroke="#1f47b5" stroke-width="2.3"/>
<text x="180.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">час →</text>
<line x1="290.0" y1="185.0" x2="340.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#eef7ee" stroke="#1b1b1b" stroke-width="2"/>
<text x="415.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зсувний</text>
<text x="415.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">регістр (SIPO)</text>
<path d="M 340,193 L 352,200 L 340,207" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="490.0" y1="160.0" x2="520.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="490.0" y1="170.0" x2="520.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="490.0" y1="180.0" x2="520.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="490.0" y1="190.0" x2="520.0" y2="190.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="490.0" y1="200.0" x2="520.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="490.0" y1="210.0" x2="520.0" y2="210.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="540.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">8 бітів</text>
<text x="540.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">одразу (байт)</text>
<rect x="70.0" y="250.0" width="740.0" height="100.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так приймач послідовної лінії «складає» байт із бітів, а передавач — «розкладає» байт у біти.</text>
<text x="440.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це буквально серце UART (Розділ 35) і SPI (Розділ 37): зсувний регістр на кожному кінці.</text>
<text x="440.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Один дріт + такт несе ціле число — зсувний регістр перекладає між «по черзі» і «все разом».</text>
</svg>
