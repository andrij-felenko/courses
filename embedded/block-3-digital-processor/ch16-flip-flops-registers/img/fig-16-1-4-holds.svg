<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Пам'ятає» означає: тримає рівень у часі, доки не перекинуть</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">без зовнішнього сигналу вихід Q лежить незмінно; короткий «поштовх» перекидає його — і він знову лежить</text>
<text x="70.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<line x1="110.0" y1="120.0" x2="800.0" y2="120.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<line x1="110.0" y1="220.0" x2="800.0" y2="220.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="104.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">1</text>
<text x="104.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="end" font-weight="normal" font-style="normal">0</text>
<polyline points="110.0,220.0 300.0,220.0 300.0,120.0 560.0,120.0 560.0,220.0 800.0,220.0" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<line x1="300.0" y1="290.0" x2="300.0" y2="250.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="300.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">set →1</text>
<line x1="560.0" y1="290.0" x2="560.0" y2="250.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="560.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">reset →0</text>
<text x="205.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тримає 0</text>
<text x="430.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тримає 1 (хоч поштовх давно зник)</text>
<text x="680.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знову тримає 0</text>
<rect x="70.0" y="322.0" width="720.0" height="30.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="430.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Між поштовхами Q не змінюється сам — оце «лежить, де поклали» і є збережений біт.</text>
</svg>
