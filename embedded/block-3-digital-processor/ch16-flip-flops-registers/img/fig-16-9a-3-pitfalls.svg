<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540">
<rect width="940" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три пастки автомата на мікроконтролері — і як їх закрити</text>
<rect x="18.0" y="60.0" width="296.0" height="430.0" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
<text x="166.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1. Діри: незаданий перехід</text>
<text x="112.0" y="108.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">COIN</text>
<text x="204.0" y="108.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">PUSH</text>
<text x="58.0" y="145.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">LOCKED</text>
<rect x="66.0" y="116.0" width="92.0" height="50.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="112.0" y="145.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">OPEN</text>
<rect x="158.0" y="116.0" width="92.0" height="50.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="204.0" y="145.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">LOCKED</text>
<text x="58.0" y="195.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">OPEN</text>
<rect x="66.0" y="166.0" width="92.0" height="50.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="112.0" y="195.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">OPEN</text>
<rect x="158.0" y="166.0" width="92.0" height="50.0" rx="5" fill="#fbeeee" stroke="#c0271e" stroke-width="2"/>
<text x="204.0" y="195.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">???</text>
<text x="166.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">забута клітина → стан «упав» у NULL</text>
<rect x="34.0" y="394.0" width="264.0" height="78.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="166.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лік:</text>
<text x="166.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заповнити ВСІ клітини явно;</text>
<text x="166.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">невідому подію → лишитись на місці</text>
<text x="166.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">або піти в безпечний стан + лог</text>
<rect x="328.0" y="60.0" width="296.0" height="430.0" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
<text x="476.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2. Де викликати дію?</text>
<circle cx="398.0" cy="124.0" r="30.0" fill="#f4f7ff" stroke="#1f47b5" stroke-width="2"/>
<text x="398.0" y="122.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">OPEN</text>
<text x="398.0" y="138.0" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">/ unlock</text>
<text x="398.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Мур: дія НА ВХОДІ</text>
<text x="398.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">в стан (on_enter)</text>
<circle cx="498.0" cy="124.0" r="24.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="498.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">LCK</text>
<circle cx="596.0" cy="124.0" r="24.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="596.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">OPN</text>
<line x1="522.0" y1="124.0" x2="572.0" y2="124.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="547.0" y="108.0" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">COIN</text>
<text x="547.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Мілі: дія НА</text>
<text x="547.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ПЕРЕХОДІ (стрілці)</text>
<rect x="344.0" y="340.0" width="264.0" height="56.0" rx="8" fill="#fbeeee" stroke="#c0271e" stroke-width="2"/>
<text x="476.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Пастка:</text>
<text x="476.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дія на вході спрацює ЩЕ РАЗ,</text>
<text x="476.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо стан перейшов сам у себе</text>
<rect x="344.0" y="410.0" width="264.0" height="62.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="476.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лік: обери ОДНУ модель</text>
<text x="476.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і клич on_enter лише на</text>
<text x="476.0" y="464.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">СПРАВЖНІЙ зміні стану</text>
<rect x="638.0" y="60.0" width="296.0" height="430.0" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
<text x="786.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3. default = безпека</text>
<rect x="652.0" y="108.0" width="268.0" height="210.0" rx="8" fill="#f4f7ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="662.0" y="128.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ev = read_event();</text>
<text x="662.0" y="150.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">if (!valid(state,ev)) {</text>
<text x="662.0" y="172.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">    log("bad transition");</text>
<text x="662.0" y="194.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">    state = SAFE;   // failsafe</text>
<text x="662.0" y="216.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    return;</text>
<text x="662.0" y="238.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<text x="662.0" y="260.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">n = next[state][ev];</text>
<text x="662.0" y="282.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">if (n.act) n.act();</text>
<text x="662.0" y="304.0" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">state = n.to;</text>
<rect x="654.0" y="394.0" width="264.0" height="78.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="786.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Думка:</text>
<text x="786.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у залізі вхід буває «брудний»</text>
<text x="786.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(шум, збій, чужа подія) —</text>
<text x="786.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">автомат мусить мати куди впасти</text>
<text x="470.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Спільне правило: автомат не має «зависати» на невідомому — кожен стан і кожна подія мусять мати визначений вихід.</text>
</svg>
