<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D-тригер: два латчі (майстер + слейв) ловлять D рівно по ФРОНТУ</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">латчі тактовані ПРОТИЛЕЖНО, тож «прозорі» по черзі — і пара пропускає D лише на мить переходу</text>
<text x="95.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">D</text>
<line x1="100.0" y1="175.0" x2="170.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<rect x="170.0" y="140.0" width="130.0" height="80.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2"/>
<text x="235.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">МАЙСТЕР</text>
<text x="235.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">латч</text>
<line x1="300.0" y1="175.0" x2="370.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="335.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">внутр.</text>
<rect x="370.0" y="140.0" width="130.0" height="80.0" rx="8" fill="#eef7ee" stroke="#1b1b1b" stroke-width="2"/>
<text x="435.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">СЛЕЙВ</text>
<text x="435.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">латч</text>
<line x1="500.0" y1="175.0" x2="580.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="586.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q</text>
<text x="95.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
<line x1="100.0" y1="300.0" x2="235.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="235.0" cy="300.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<line x1="235.0" y1="300.0" x2="235.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 229,213 L 241,220 L 229,227" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="235.0" y1="300.0" x2="320.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 320,289.0 L 320,311.0 L 346,300 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="352.0" cy="300.0" r="6.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="352.0" y1="300.0" x2="435.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="435.0" y1="300.0" x2="435.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 429,213 L 441,220 L 429,227" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="300.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">майстер — по такту</text>
<text x="470.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">слейв — по інверсії такту</text>
<rect x="620.0" y="110.0" width="230.0" height="200.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="735.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як виходить «фронт»:</text>
<text x="636.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• такт=0: майстер «дивиться»</text>
<text x="636.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  на D, слейв тримає вихід</text>
<text x="636.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• такт 0→1 (ФРОНТ): майстер</text>
<text x="636.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  замикається на тому D,</text>
<text x="636.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  слейв пропускає його на Q</text>
<text x="636.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• між фронтами Q НЕ реагує</text>
<text x="636.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  на D зовсім</text>
</svg>
