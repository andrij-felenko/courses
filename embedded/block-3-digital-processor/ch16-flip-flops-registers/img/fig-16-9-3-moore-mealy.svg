<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві школи: вихід на СТАНІ (Мур) проти виходу на ПЕРЕХОДІ (Мілі)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Мур: вихід пишемо в кружку (залежить лише від стану). Мілі: вихід пишемо на стрілці (стан + вхід)</text>
<rect x="40.0" y="84.0" width="410.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="245.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Автомат МУРА: вихід = f(стан)</text>
<circle cx="150.0" cy="200.0" r="42.0" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2.8"/>
<circle cx="150.0" cy="200.0" r="37.0" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="150.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S0</text>
<text x="150.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вих=0</text>
<circle cx="340.0" cy="200.0" r="42.0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="340.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S1</text>
<text x="340.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вих=1</text>
<path d="M 192.0,200.0 Q 245.0,200.0 298.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="245.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вх=1</text>
<path d="M 298.0,222.0 Q 245.0,256.0 192.0,222.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="245.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вх=0</text>
<text x="245.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вихід «приписаний» стану, тримається весь такт</text>
<rect x="460.0" y="84.0" width="400.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="660.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Автомат МІЛІ: вихід = f(стан, вхід)</text>
<circle cx="560.0" cy="200.0" r="42.0" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2.8"/>
<circle cx="560.0" cy="200.0" r="37.0" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="560.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T0</text>
<circle cx="760.0" cy="200.0" r="42.0" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="760.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T1</text>
<path d="M 602.0,200.0 Q 660.0,200.0 718.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="660.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вх=1 / вих=1</text>
<path d="M 718.0,222.0 Q 660.0,256.0 602.0,222.0" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="660.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вх=0 / вих=0</text>
<text x="660.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вихід «висить» на переході — реагує того ж такту</text>
<rect x="60.0" y="350.0" width="780.0" height="108.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий обов'язок — різний почерк:</text>
<text x="96.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Мур:</text>
<text x="160.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вихід залежить лише від стану</text>
<text x="470.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ на такт ПІЗНІШЕ, зате стабільний і легше таймити</text>
<text x="96.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Мілі:</text>
<text x="160.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вихід залежить і від входу</text>
<text x="470.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ реагує ОДРАЗУ, та може «мигати» разом із входом</text>
</svg>
