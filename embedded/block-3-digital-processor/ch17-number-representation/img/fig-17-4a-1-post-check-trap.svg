<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому перевірку ПІСЛЯ знакового переповнення компілятор викидає</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знакове переповнення — UB, тож оптимізатор має право вважати, що його НЕ буває</text>
<rect x="60.0" y="86.0" width="360.0" height="150.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.7"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Наївно: «перевіримо потім»</text>
<text x="80.0" y="140.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">int x = ...;</text>
<text x="80.0" y="162.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">int y = x + 1;</text>
<text x="80.0" y="184.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">if (y &lt; x)        // ловимо wrap?</text>
<text x="96.0" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#c0271e" text-anchor="start" font-weight="normal">handle_overflow();</text>
<line x1="240.0" y1="240.0" x2="240.0" y2="286.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="258.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">оптимізатор «міркує»</text>
<rect x="60.0" y="290.0" width="760.0" height="70.0" rx="10" fill="#fff7e8" stroke="#caa24a" stroke-width="1.7"/>
<text x="80.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a6d1f" text-anchor="start" font-weight="bold" font-style="normal">«x + 1 — знакове, отже переповнення НЕМОЖЛИВЕ (це було б UB),</text>
<text x="80.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a6d1f" text-anchor="start" font-weight="bold" font-style="normal"> отже y завжди &gt; x, отже умова (y &lt; x) завжди ХИБНА» → гілку видалено.</text>
<rect x="440.0" y="86.0" width="380.0" height="150.0" rx="10" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="630.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Правильно: перевірка ДО дії</text>
<text x="458.0" y="140.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">if (x &gt; INT_MAX - 1)</text>
<text x="474.0" y="162.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="normal">handle_overflow();   // безпечно</text>
<text x="458.0" y="184.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">else</text>
<text x="474.0" y="206.0" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">y = x + 1;           // тут не вилізе</text>
<rect x="60.0" y="392.0" width="760.0" height="56.0" rx="10" fill="#f1f7f2" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="440.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головне: суму, що переповнить знаковий тип, НЕ МОЖНА навіть обчислювати.</text>
<text x="440.0" y="436.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перевіряй межу ДО операції — або обчислюй у ширшому/беззнаковому типі.</text>
</svg>
