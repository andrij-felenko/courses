<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760">
<rect width="720" height="760" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг відмови Ariane 5: як один виняток зруйнував ракету</text>
<text x="360.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">жодної механічної поломки — лише послідовність програмних рішень, що склалися в катастрофу</text>
<rect x="70.0" y="86.0" width="580.0" height="58.0" rx="9" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="2"/>
<text x="86.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. H0 — старт</text>
<text x="86.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ariane 5 злітає; траєкторія крутіша й швидша за Ariane 4</text>
<line x1="360.0" y1="146.0" x2="360.0" y2="164.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="166.0" width="580.0" height="58.0" rx="9" fill="#fbf4e6" stroke="#caa24a" stroke-width="2"/>
<text x="86.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">2. Зайва робота</text>
<text x="86.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Функція вирівнювання платформи (SRI) ще працює — хоча після старту вже НЕ потрібна (вимога Ariane 4)</text>
<line x1="360.0" y1="226.0" x2="360.0" y2="244.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="246.0" width="580.0" height="58.0" rx="9" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="86.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">3. Переповнення BH</text>
<text x="86.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Горизонтальний зсув BH виріс за межу int16; перетворення float64 → int16 не вклалося</text>
<line x1="360.0" y1="306.0" x2="360.0" y2="324.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="326.0" width="580.0" height="58.0" rx="9" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="86.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">4. Виняток (Ada)</text>
<text x="86.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Operand Error — і його НЕ було оброблено: обчислювач SRI зупинився як «несправний»</text>
<line x1="360.0" y1="386.0" x2="360.0" y2="404.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="406.0" width="580.0" height="58.0" rx="9" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="86.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">5. Обидва SRI впали</text>
<text x="86.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Резервний і робочий блоки — однакова програма, тож обидва впали з тієї ж причини (різниця ~72 мс)</text>
<line x1="360.0" y1="466.0" x2="360.0" y2="484.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="486.0" width="580.0" height="58.0" rx="9" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="86.0" y="510.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">6. Діагностику — за дані</text>
<text x="86.0" y="530.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Бортовий комп'ютер прийняв аварійний бітовий код SRI за справжні польотні дані</text>
<line x1="360.0" y1="546.0" x2="360.0" y2="564.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="566.0" width="580.0" height="58.0" rx="9" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="86.0" y="590.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">7. Повне відхилення сопел</text>
<text x="86.0" y="610.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">За хибними «даними» система різко вивернула сопла прискорювачів і маршового двигуна</text>
<line x1="360.0" y1="626.0" x2="360.0" y2="644.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<rect x="70.0" y="646.0" width="580.0" height="58.0" rx="9" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="86.0" y="670.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">8. Злам і самознищення</text>
<text x="86.0" y="690.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ +37 с після старту ракета втратила орієнтацію, почала руйнуватися й самознищилася</text>
</svg>
