<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
<rect width="860" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Магія: віднімання — це просто додавання доповняльного коду</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">7 − 5 = 7 + (−5): подаємо на ТОЙ САМИЙ суматор (§15.6) число й доповняльний код від'ємника</text>
<text x="150.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">7</text>
<text x="180.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 00000111</text>
<text x="150.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">+ (−5)</text>
<text x="180.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 11111011</text>
<line x1="180.0" y1="175.0" x2="470.0" y2="175.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="150.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">сума</text>
<text x="150.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(відкидаємо</text>
<text x="150.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">перенос →)</text>
<text x="180.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">1 00000010</text>
<rect x="178.0" y="190.0" width="22.0" height="22.0" rx="3" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="189.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">↑ викинути</text>
<text x="330.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">= 00000010 = 2</text>
<text x="330.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(а 7 − 5 = 2 ✓)</text>
<rect x="540.0" y="100.0" width="290.0" height="200.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="685.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це безцінно:</text>
<text x="556.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• НЕ потрібен окремий «віднімач» —</text>
<text x="556.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  той самий суматор робить і +, і −</text>
<text x="556.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• той самий додавальний ланцюг</text>
<text x="556.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  обслуговує і знакові, і беззнакові</text>
<text x="556.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• перенос за межу байта просто</text>
<text x="556.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  «викидають» (коло замкнулось)</text>
<text x="556.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тому в процесорі ОДНА команда</text>
<text x="556.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  додавання — на все</text>
</svg>
