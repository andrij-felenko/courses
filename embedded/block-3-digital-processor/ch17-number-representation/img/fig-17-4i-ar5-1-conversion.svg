<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">змінна BH (горизонтальний зсув) була надто велика для 16-бітного цілого — і сталося переповнення</text>
<rect x="110.0" y="96.0" width="700.0" height="56.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
