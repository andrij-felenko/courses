<text x="740.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">У цьому коді (Ada):</text>
<text x="740.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">виняток не оброблено →</text>
