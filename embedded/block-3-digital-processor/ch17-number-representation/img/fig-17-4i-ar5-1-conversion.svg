<text x="124.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">значення на Ariane 5 виросло в рази проти Ariane 4 — далеко за межу 16-бітного цілого</text>
<text x="796.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">≈ велике</text>
