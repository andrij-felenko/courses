<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590">
<rect width="940" height="590" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один крок CORDIC: повернути вектор на крихітний кут — без множень</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">точне обертання вимагає cos/sin; CORDIC бере «майже-обертання», де множники — це зсуви 2⁻ⁱ, а ще одне множення прибирають геть</text>
<text x="250.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Справжнє обертання на кут φ</text>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(те, що хочемо)</text>
<line x1="84.0" y1="330.0" x2="420.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="250.0" y1="496.0" x2="250.0" y2="158.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="424.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">x</text>
<text x="260.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">y</text>
<circle cx="250.0" cy="330.0" r="150.0" fill="none" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="250.0" y1="330.0" x2="391.0" y2="278.7" stroke="#1f47b5" stroke-width="3.0" marker-end="url(#aBlue)"/>
<text x="399.0" y="282.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">(x, y)</text>
<line x1="250.0" y1="330.0" x2="346.4" y2="215.1" stroke="#c0271e" stroke-width="3.0" marker-end="url(#aRed)"/>
<text x="352.4" y="209.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">(x′, y′)</text>
<path d="M300.7,311.5 A54.0,54.0 0 0 0 284.7,288.6" fill="none" stroke="#1b1b1b" stroke-width="2.0"/>
<text x="302.4" y="297.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">φ</text>
<rect x="94.0" y="510.0" width="326.0" height="64.0" rx="6" fill="#fdeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="102.0" y="532.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">x′ = x·cos φ − y·sin φ</text>
<text x="102.0" y="552.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">y′ = x·sin φ + y·cos φ</text>
<text x="250.0" y="570.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">чотири множення на кожен кут — задорого без FPU</text>
<text x="690.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крок CORDIC на kᵢ = atan(2⁻ⁱ)</text>
<text x="690.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(те, що рахуємо)</text>
<line x1="524.0" y1="330.0" x2="860.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="690.0" y1="496.0" x2="690.0" y2="158.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="864.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">x</text>
<text x="700.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">y</text>
<circle cx="690.0" cy="330.0" r="150.0" fill="none" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="690.0" y1="330.0" x2="816.1" y2="284.1" stroke="#1f47b5" stroke-width="3.0" marker-end="url(#aBlue)"/>
<text x="810.1" y="300.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">(x, y)</text>
<line x1="690.0" y1="330.0" x2="793.1" y2="221.1" stroke="#c0271e" stroke-width="3.0" marker-end="url(#aRed)"/>
<text x="799.1" y="215.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">(x′, y′)</text>
<path d="M740.7,311.5 A54.0,54.0 0 0 0 727.1,290.8" fill="none" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="748.5" y="295.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">kᵢ</text>
<line x1="793.1" y1="221.1" x2="782.2" y2="232.6" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="798.6" y="215.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вектор</text>
<text x="798.6" y="228.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ще й довшає ×Aᵢ</text>
<rect x="534.0" y="510.0" width="326.0" height="64.0" rx="6" fill="#eef9ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="542.0" y="532.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">x′ = x ∓ (y &gt;&gt; i)</text>
<text x="542.0" y="552.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">y′ = y ± (x &gt;&gt; i)</text>
<text x="690.0" y="570.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">лише зсуви й додавання — жодного множення</text>
</svg>
