  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Складання результату: явні зсуви проти «приведення вказівника»</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три байти 0xFA–0xFC треба зібрати в одне 20-бітне ціле T — порозрядно, не покладаючись на пам'ять</text>
<rect x="120.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaeefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="195.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0xFA</text>
<text x="195.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">temp_msb</text>
<text x="195.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">T[19:12]</text>
<text x="195.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">&lt;&lt; 12</text>
<line x1="195.0" y1="180.0" x2="195.0" y2="208.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="310.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaeefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="385.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0xFB</text>
<text x="385.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">temp_lsb</text>
<text x="385.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">T[11:4]</text>
<text x="385.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">&lt;&lt; 4</text>
<line x1="385.0" y1="180.0" x2="385.0" y2="208.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="500.0" y="92.0" width="150.0" height="52.0" rx="5" fill="#eaeefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="575.0" y="84.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0xFC</text>
<text x="575.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">temp_xlsb</text>
<text x="575.0" y="134.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">T[3:0]</text>
<text x="575.0" y="170.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">&gt;&gt; 4</text>
<line x1="575.0" y1="180.0" x2="575.0" y2="208.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="120.0" y="222.0" width="530.0" height="40.0" rx="6" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="385.0" y="247.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">int32_t T = (msb &lt;&lt; 12) | (lsb &lt;&lt; 4) | (xlsb &gt;&gt; 4);</text>
<text x="430.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">20-бітний «сирий» результат T (raw ADC value)</text>
<rect x="100.0" y="306.0" width="264.0" height="34.0" rx="0" fill="#eaeefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="232.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">T[19:12] ← msb</text>
<rect x="364.0" y="306.0" width="264.0" height="34.0" rx="0" fill="#fbeceb" stroke="#c0271e" stroke-width="1.6"/>
<text x="496.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T[11:4] ← lsb</text>
<rect x="628.0" y="306.0" width="132.0" height="34.0" rx="0" fill="#e8f5ec" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="694.0" y="328.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">T[3:0] ← xlsb</text>
<rect x="100.0" y="306.0" width="660.0" height="34.0" rx="0" fill="none" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="430.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ той самий результат на БУДЬ-ЯКІЙ машині — little- чи big-endian</text>
<rect x="70.0" y="392.0" width="720.0" height="56.0" rx="6" fill="#fff4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="90.0" y="414.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗  int32_t T = *(int32_t*)buf;</text>
<text x="310.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— читає байти «як лежать»: ламається на чужій ендіанності,</text>
<text x="310.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">а ще — невирівняна адреса (alignment) і суворе аліасування (strict aliasing). Не робіть так.</text>
</svg>
