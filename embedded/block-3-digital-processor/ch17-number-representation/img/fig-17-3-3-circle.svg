<rect x="60.0" y="380.0" width="700.0" height="76.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1111 = −1 (на крок «не дійшли» до 0); 1000 = −8 (найменше). Старший біт 1 = від'ємне.</text>
<text x="410.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Додавання — це крок по колу за годинниковою; −N лежить рівно там, куди впираєшся, відступивши N назад від 0.</text>
<text x="410.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому додавання й віднімання тут — одне й те саме коло.</text>
