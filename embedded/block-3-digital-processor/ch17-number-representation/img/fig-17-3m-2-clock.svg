<text x="548.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">−1 = (−1)·12 + 11</text>
<text x="548.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">−1 ≡ 11 (mod 12)</text>
<text x="540.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«дві години тому»</text>
<text x="548.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">−2 = (−1)·12 + 10</text>
