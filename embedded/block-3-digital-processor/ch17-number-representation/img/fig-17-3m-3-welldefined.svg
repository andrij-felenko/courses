<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<rect width="900" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aViolet" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3da8"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому за модулем можна спокійно рахувати: операції «не плутають» класи</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">приклад mod 8: однакова відповідь, хоч зводь спершу, хоч наприкінці</text>
<rect x="55.0" y="122.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1b1b1b" stroke-width="2"/>
<text x="130.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">13 + 14</text>
<text x="130.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сирі числа</text>
<rect x="355.0" y="122.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1b1b1b" stroke-width="2"/>
<text x="430.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">= 27</text>
<text x="430.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сума</text>
<rect x="645.0" y="122.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1f8a3b" stroke-width="2"/>
<text x="720.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">27 mod 8 = 3</text>
<text x="720.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лишок наприкінці</text>
<line x1="205.0" y1="150.0" x2="355.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="505.0" y1="150.0" x2="645.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="280.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="55.0" y="332.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1f47b5" stroke-width="2"/>
<text x="130.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">5 + 6</text>
<text x="130.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">13≡5, 14≡6</text>
<rect x="355.0" y="332.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1f47b5" stroke-width="2"/>
<text x="430.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">= 11</text>
<text x="430.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сума малих</text>
<rect x="645.0" y="332.0" width="150.0" height="56.0" rx="9" fill="#fcfcff" stroke="#1f8a3b" stroke-width="2"/>
<text x="720.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">11 mod 8 = 3</text>
<text x="720.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лишок наприкінці</text>
<line x1="205.0" y1="360.0" x2="355.0" y2="360.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<line x1="505.0" y1="360.0" x2="645.0" y2="360.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="280.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<path d="M130.0,178.0 Q60.0,255.0 130.0,332.0" fill="none" stroke="#6a3da8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aViolet)"/>
<text x="34.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6a3da8" text-anchor="middle" font-weight="bold" font-style="normal">звели</text>
<text x="34.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6a3da8" text-anchor="middle" font-weight="normal" font-style="normal">спершу</text>
<path d="M720.0,178.0 Q798.0,255.0 720.0,332.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="5,4"/>
<text x="816.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">однаково!</text>
<text x="816.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">= 3</text>
<rect x="90.0" y="452.0" width="720.0" height="64.0" rx="10" fill="#f3f8f3" stroke="#1f8a3b" stroke-width="2"/>
<text x="450.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">(a + b) mod m = ((a mod m) + (b mod m)) mod m   — і так само для «−» та «×».</text>
<text x="450.0" y="499.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому залізо вільне рахувати лише n молодшими бітами: «зайве» можна викидати будь-коли.</text>
</svg>
