<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
<rect width="880" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Формат IEEE 754 (одинарна точність, float32 = 32 біти)</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три поля: знак (1 біт), порядок (8 бітів, зі зсувом), мантиса (23 біти значущих цифр)</text>
<rect x="90.0" y="110.0" width="50.0" height="50.0" rx="5" fill="#fff3e0" stroke="#9a7322" stroke-width="2"/>
<text x="115.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<text x="115.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1</text>
<text x="115.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">знак</text>
<rect x="150.0" y="110.0" width="230.0" height="50.0" rx="5" fill="#eef4ff" stroke="#1f47b5" stroke-width="2"/>
<text x="265.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">порядок (exponent)</text>
<text x="265.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">8 бітів</text>
<text x="265.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">куди «пливе» кома</text>
<rect x="390.0" y="110.0" width="400.0" height="50.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="590.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мантиса (significand)</text>
<text x="590.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">23 біти</text>
<text x="590.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">значущі цифри (точність)</text>
<rect x="70.0" y="215.0" width="740.0" height="110.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">значення = (−1)ˢ × 1.мантиса × 2^(порядок − 127)</text>
<text x="440.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Старша одиниця мантиси «мається на увазі» (1.xxxx) — даровий зайвий біт точності.</text>
<text x="440.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">float32 ≈ 7 значущих десяткових цифр. Подвійна точність (float64): 1 + 11 + 52 = 64 біти, ≈ 16 цифр.</text>
<text x="440.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий формат — у кожному ПК, телефоні, ESP32: домовленість IEEE 754 (історія — поряд).</text>
</svg>
