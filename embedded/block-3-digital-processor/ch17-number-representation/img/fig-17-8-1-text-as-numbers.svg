<text x="440.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рядок «HI» у пам'яті — це просто два байти: 72, 73 (плюс, за традицією C, завершальний 0).</text>
<rect x="70.0" y="240.0" width="740.0" height="110.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сама по собі сітка бітів не «знає», що вона буква — це ще одна ДОМОВЛЕНІСТЬ тлумачення (як знакове чи дріб).</text>
<text x="440.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий байт 01001000 — це і число 72, і символ 'H', залежно від того, за якою таблицею його читати.</text>
<text x="440.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лишилося домовитися про САМУ таблицю: яке число якій букві. Найперша така спільна угода — ASCII.</text>
<text x="440.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Текст, отже, зводиться до чисел — а числа ми вже вміємо (увесь цей розділ).</text>
