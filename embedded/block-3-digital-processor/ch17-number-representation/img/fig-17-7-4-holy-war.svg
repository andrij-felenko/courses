<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки назва й чому це «свята війна»: Ліліпутія, Свіфт і Коен</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва порядки однаково правильні — суперечка про них така ж «принципова», як з якого кінця розбивати яйце</text>
<rect x="60.0" y="84.0" width="360.0" height="252.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Мандри Гуллівера» (Свіфт, 1726)</text>
<ellipse cx="150" cy="198" rx="34" ry="44" fill="#fffdf5" stroke="#c0271e" stroke-width="2.4"/>
<polyline points="134.0,236.0 144.0,228.0 152.0,238.0 162.0,229.0 168.0,237.0" fill="none" stroke="#c0271e" stroke-width="2"/>
<ellipse cx="330" cy="198" rx="34" ry="44" fill="#fffdf5" stroke="#1f47b5" stroke-width="2.4"/>
<polyline points="316.0,162.0 325.0,154.0 333.0,163.0 341.0,154.0 346.0,162.0" fill="none" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тупоконечники</text>
<text x="150.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(б'ють з тупого кінця)</text>
<text x="330.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">гостроконечники</text>
<text x="330.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(б'ють з гострого кінця)</text>
<text x="240.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Ліліпути воювали, з якого кінця бити яйце</text>
<rect x="440.0" y="84.0" width="400.0" height="252.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="640.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Денні Коен, 1980</text>
<text x="640.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">«On Holy Wars and a Plea for Peace»</text>
<text x="460.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Коен узяв образ Свіфта й охрестив два порядки</text>
<text x="460.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">байтів: big-endian і little-endian.</text>
<text x="460.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="460.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Його теза: жоден не «кращий» — головне</text>
<text x="460.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ДОМОВИТИСЯ, інакше машини не зрозуміють</text>
<text x="460.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одна одну. Це й була його «мольба про мир».</text>
<text x="450.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Практичний укус: на little-endian машині число 0x12345678 у hex-дампі пам'яті виглядає як «78 56 34 12».</text>
<text x="450.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Новачки лякаються «перевернутих» байтів — а це просто little-endian показує молодший байт першим.</text>
<rect x="60.0" y="410.0" width="780.0" height="48.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="431.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усередині однієї машини порядок байтів НЕВИДИМИЙ — він кусає лише на МЕЖІ: обмін по мережі, файли, давачі.</text>
<text x="450.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому й «свята війна»: суперечка пристрасна, а по суті — лише угода, якого кінця триматися.</text>
</svg>
