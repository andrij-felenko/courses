<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому float підступний: неточність і ВІДНОСНА точність</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не всі числа представні точно, а «крок» між сусідніми зростає з величиною — звідси класичні пастки</text>
<rect x="60.0" y="84.0" width="380.0" height="130.0" rx="10" fill="none" stroke="#c0271e" stroke-width="1.7"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Пастка 1: неточність</text>
<text x="80.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">0.1 + 0.2 = 0.30000000000000004 (!)</text>
<text x="80.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">бо 0.1 у двійковій — нескінченний дріб</text>
<text x="80.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(як 1/3 у десятковій), тож зберігається з</text>
<text x="80.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">крихітною похибкою округлення.</text>
<rect x="470.0" y="84.0" width="360.0" height="130.0" rx="10" fill="none" stroke="#caa24a" stroke-width="1.7"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Пастка 2: відносна точність</text>
<text x="490.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крок між числами РОСТЕ з величиною:</text>
<text x="490.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">біля 1 → крок ≈ 0.0000001</text>
<text x="490.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">біля мільйона → крок ≈ 0.06</text>
<text x="490.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">біля мільярда → крок &gt; 1 (!)</text>
<rect x="60.0" y="230.0" width="380.0" height="110.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="250.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок:</text>
<text x="80.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 000 000 000 + 1 = 1 000 000 000</text>
<text x="80.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(float32): додавання просто «зникло»,</text>
<text x="80.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">бо 1 менше за крок на цій величині.</text>
<rect x="470.0" y="230.0" width="360.0" height="110.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="650.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Результати обчислень — не порівнюй через ==</text>
<text x="490.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">погано:  if (x == 0.3)</text>
<text x="490.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">добре:   if (|x − 0.3| &lt; ε)</text>
<text x="490.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(для точних 0.0, цілих — == доречне)</text>
<text x="440.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">float чудовий для діапазону, та оманливий для точності: рівність, накопичення похибок, гроші — його слабкі місця.</text>
</svg>
