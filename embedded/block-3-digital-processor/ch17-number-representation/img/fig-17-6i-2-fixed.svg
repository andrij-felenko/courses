<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що саме стандартизував IEEE 754</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">формати, округлення, особливі значення й залізну гарантію коректного результату</text>
<rect x="70.0" y="96.0" width="720.0" height="34.0" rx="6" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Формати</text>
<text x="310.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одинарна (32) і подвійна (64) точність — однакові скрізь</text>
<rect x="70.0" y="136.0" width="720.0" height="34.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Коректне округлення</text>
<text x="310.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">результат +−×÷ і √ — це ТОЧНО округлене істинне значення</text>
<rect x="70.0" y="176.0" width="720.0" height="34.0" rx="6" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Округлення «до парного»</text>
<text x="310.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">round-to-nearest-even за замовчуванням (без систематичного зсуву)</text>
<rect x="70.0" y="216.0" width="720.0" height="34.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Особливі значення</text>
<text x="310.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">±∞, NaN, ±0 — означені однозначно</text>
<rect x="70.0" y="256.0" width="720.0" height="34.0" rx="6" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Поступове зникання</text>
<text x="310.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">денормалі: біля нуля числа «згасають» плавно, а не падають у 0</text>
<rect x="70.0" y="296.0" width="720.0" height="34.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="90.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Винятки/прапорці</text>
<text x="310.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ділення на 0, переповнення, неточність — сигналізуються</text>
<text x="430.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Найреволюційніша — «коректне округлення»: воно зробило результат float ОДНОЗНАЧНИМ, а не «приблизним як вийде».</text>
</svg>
