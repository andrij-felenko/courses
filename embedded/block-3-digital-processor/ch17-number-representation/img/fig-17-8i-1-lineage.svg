<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540">
<rect width="920" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Родовід UTF-8: ідея визрівала роками, форму дістала за вечір</text>
<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">винахід — колективний: проблему окреслив комітет, ключову вимогу додав Томпсон у дайнері</text>
<rect x="40.0" y="96.0" width="250.0" height="92.0" rx="9" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<rect x="40.0" y="96.0" width="6.0" height="92.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="56.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">1991–92 · ISO 10646 / UTF-1</text>
<text x="56.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перша спроба вкласти Unicode в байти;</text>
<text x="56.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ASCII і не-ASCII НЕ розділені чисто —</text>
<text x="56.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">байти-продовження плутаються з ASCII</text>
<line x1="294.0" y1="142.0" x2="360.0" y2="270.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="40.0" y="216.0" width="250.0" height="92.0" rx="9" fill="#fbfbfb" stroke="#caa24a" stroke-width="2"/>
<rect x="40.0" y="216.0" width="6.0" height="92.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="56.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">лип. 1992 · X/Open (XoJIG)</text>
<text x="56.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Дейв Проссер (Unix System Labs)</text>
<text x="56.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пропонує FSS-UTF: «ASCII = лише сам себе,</text>
<text x="56.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у багатобайтових — старший біт завжди 1»</text>
<line x1="294.0" y1="262.0" x2="360.0" y2="270.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="40.0" y="336.0" width="250.0" height="92.0" rx="9" fill="#fbfbfb" stroke="#caa24a" stroke-width="2"/>
<rect x="40.0" y="336.0" width="6.0" height="92.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="56.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">серп. 1992 · розсилка IBM</text>
<text x="56.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">представник IBM в X/Open розсилає</text>
<text x="56.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">чернетку FSS-UTF зацікавленим —</text>
<text x="56.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">так вона дійшла до Bell Labs</text>
<line x1="294.0" y1="382.0" x2="360.0" y2="270.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<circle cx="470.0" cy="270.0" r="58.0" fill="#fdf4f4" stroke="#c0271e" stroke-width="3"/>
<text x="470.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2 вересня</text>
<text x="470.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1992</text>
<text x="470.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дайнер,</text>
<text x="470.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Нью-Джерсі</text>
<rect x="560.0" y="150.0" width="330.0" height="250.0" rx="10" fill="#fffdf5" stroke="#caa24a" stroke-width="2"/>
<text x="725.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">паперова підкладка (placemat)</text>
<text x="580.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Кен Томпсон рахує пакування бітів:</text>
<text x="580.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">0xxxxxxx</text>
<text x="580.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">1 байт — і це РІВНО ASCII</text>
<text x="580.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">110xxxxx 10xxxxxx</text>
<text x="580.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">2 байти</text>
<text x="580.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1110xxxx 10xxxxxx 10xxxxxx</text>
<text x="580.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">3 байти</text>
<text x="580.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">11110xxx 10xx… 10xx… 10xx…</text>
<text x="580.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">4 байти</text>
<text x="580.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">Роб Пайк — поряд, «cheering him on»</text>
<text x="460.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Томпсон не вигадав усе з нуля: він узяв ідею FSS-UTF і додав те, чого їй бракувало (див. Рис. 3.4.8i.2).</text>
</svg>
