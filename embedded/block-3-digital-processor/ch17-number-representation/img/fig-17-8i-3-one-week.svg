<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один тиждень: ескіз → жива система → стандарт</text>
<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея «спрацювала», бо її одразу довели до кінця: за дні Plan 9 перейшла на UTF-8 цілком</text>
<line x1="80.0" y1="250.0" x2="840.0" y2="250.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<line x1="838.0" y1="250.0" x2="858.0" y2="250.0" stroke="#8a8a8a" stroke-width="3" marker-end="url(#aInk)"/>
<circle cx="120.0" cy="250.0" r="8.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<text x="120.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ср · 2 вер.</text>
<line x1="120.0" y1="242.0" x2="120.0" y2="170.0" stroke="#c0271e" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="45.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="120.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вечеря в дайнері</text>
<text x="120.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Томпсон на підкладці</text>
<text x="120.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рахує пакування бітів;</text>
<text x="120.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Пайк поряд</text>
<circle cx="256.0" cy="250.0" r="8.0" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
<text x="256.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ніч</text>
<line x1="256.0" y1="258.0" x2="256.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="181.0" y="290.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="256.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перший код</text>
<text x="256.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Томпсон пише пакування/</text>
<text x="256.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розпакування; Пайк береться</text>
<text x="256.0" y="351.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за C- і графічні бібліотеки</text>
<circle cx="392.0" cy="250.0" r="8.0" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
<text x="392.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">чт</text>
<line x1="392.0" y1="242.0" x2="392.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="317.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="392.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">код готовий</text>
<text x="392.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усе написано — і вони</text>
<text x="392.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">починають переганяти</text>
<text x="392.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">текстові файли системи</text>
<circle cx="528.0" cy="250.0" r="8.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="528.0" cy="250.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="528.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">пт · 11 вер.</text>
<line x1="528.0" y1="258.0" x2="528.0" y2="290.0" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="453.0" y="290.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="528.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Plan 9 — лише UTF-8</text>
<text x="528.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ціла ОС працює — і працює</text>
<text x="528.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ВИКЛЮЧНО в новому кодуванні</text>
<text x="528.0" y="351.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(не теорія, а жива система)</text>
<circle cx="664.0" cy="250.0" r="8.0" fill="#fff" stroke="#caa24a" stroke-width="3"/>
<text x="664.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">8 вер., 03:22</text>
<line x1="664.0" y1="242.0" x2="664.0" y2="170.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="589.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#caa24a" stroke-width="2"/>
<text x="664.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">лист в X/Open</text>
<text x="664.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Томпсон надсилає готову</text>
<text x="664.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пропозицію FSS-UTF комітету;</text>
<text x="664.0" y="161.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">далі — голосування «за»</text>
<circle cx="800.0" cy="250.0" r="8.0" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
<text x="800.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">січ. 1993</text>
<line x1="800.0" y1="258.0" x2="800.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="725.0" y="290.0" width="150.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="800.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">USENIX, Сан-Дієго</text>
<text x="800.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перша публічна доповідь —</text>
<text x="800.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і кодування рушає у світ</text>
<text x="800.0" y="351.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">файлів, мереж і вебу</text>
</svg>
