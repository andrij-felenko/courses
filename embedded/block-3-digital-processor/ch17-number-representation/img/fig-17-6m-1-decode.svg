<text x="226.5" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1) Знак</text>
<text x="127.5" y="230.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal">біт = 1</text>
<text x="127.5" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">1 → мінус</text>
<text x="127.5" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0 була б +</text>
<text x="127.5" y="308.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold">(−1)¹ = −1</text>
<rect x="374.0" y="178.0" width="230.0" height="150.0" rx="8" fill="#f5f8fe" stroke="#1f47b5" stroke-width="1.6"/>
<text x="489.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2) Порядок</text>
<text x="390.0" y="230.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">10000000₂ = 128</text>
<text x="390.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">віднімаємо зсув 127:</text>
<text x="390.0" y="278.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold">128 − 127 = 1</text>
<text x="390.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">степінь двійки = 2¹</text>
<rect x="649.0" y="178.0" width="240.0" height="150.0" rx="8" fill="#fdf8ee" stroke="#caa24a" stroke-width="1.6"/>
<text x="768.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3) Мантиса</text>
<text x="665.0" y="230.0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">11000…₂ → .11₂</text>
<text x="665.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">додаємо приховану 1:</text>
<text x="665.0" y="278.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#caa24a" text-anchor="start" font-weight="bold">1.11₂ = 1.75</text>
<text x="665.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(½ + ¼ після коми)</text>
<rect x="90.0" y="368.0" width="800.0" height="46.0" rx="8" fill="#eef9ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="490.0" y="390.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold">значення = (−1)ˢ × 1.мантиса × 2^(порядок−127)</text>
<text x="490.0" y="408.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold">= (−1) × 1.75 × 2¹ = −3.5</text>
<line x1="226.5" y1="328.0" x2="226.5" y2="366.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="489.0" y1="328.0" x2="489.0" y2="366.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#aBlue)"/>
<line x1="768.0" y1="328.0" x2="768.0" y2="366.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="490.0" y="584.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зворотний хід (закодувати число) — той самий ланцюг навпаки: винести 2^порядок, відкинути провідну 1, додати зсув 127.</text>
