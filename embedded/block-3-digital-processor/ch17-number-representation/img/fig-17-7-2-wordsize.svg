<text x="486.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">приклад: AVR (Arduino Uno), 8051</text>
<text x="128.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">16 біт</text>
