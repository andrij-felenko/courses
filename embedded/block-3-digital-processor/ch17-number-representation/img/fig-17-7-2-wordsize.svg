<text x="486.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">приклад: x86-64, ARM64 (ПК, телефон)</text>
<text x="150.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(кожен квадрат — байт; ширше слово = більше байтів за раз = більші числа)</text>
<rect x="60.0" y="422.0" width="780.0" height="34.0" rx="8" fill="#fff8e8" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Увага: у деяких системах (Windows API) «word» жорстко = 16 біт, dword = 32, qword = 64 — незалежно від машини.</text>
