<text x="486.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">приклад: 8086, MSP430</text>
<text x="128.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">32 біти</text>
