<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розмір слова: 8, 16, 32, 64 біти — скільки машина бере за раз</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«N-бітний процесор» — це ширина його регістрів і шини; вона ж задає, які числа влазять у слово (2ᴺ, §17.1)</text>
<text x="128.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">8 біт</text>
<rect x="150.0" y="100.0" width="36.0" height="40.0" rx="5" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
