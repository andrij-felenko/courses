<rect x="60.0" y="414.0" width="780.0" height="78.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий колір — той самий байт: у big-endian 0x12 лежить за адресою 0x00, у little-endian — за 0x03. Порядок дзеркальний.</text>
<text x="450.0" y="460.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">LITTLE-ENDIAN: x86, ARM (звичайно), ESP32, RISC-V.   BIG-ENDIAN: мережа (network byte order), Motorola 68k, PowerPC.</text>
<text x="450.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Мнемоніка: little-endian кладе «маленький кінець» (молодший байт) за найменшою адресою.</text>
