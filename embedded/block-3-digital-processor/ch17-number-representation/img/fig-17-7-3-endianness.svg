<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порядок байтів (endianness): у якій послідовності байти лежать у пам'яті</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне 32-бітне число — це чотири байти; та в якому ПОРЯДКУ покласти їх за зростанням адрес? Дві школи</text>
