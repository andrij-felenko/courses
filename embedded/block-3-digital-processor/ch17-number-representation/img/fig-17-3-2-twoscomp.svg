<text x="430.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Нуль один-єдиний: −0 = інверсія 00000000 (11111111) + 1 = 00000000 = +0. Жодного «мінус нуля».</text>
