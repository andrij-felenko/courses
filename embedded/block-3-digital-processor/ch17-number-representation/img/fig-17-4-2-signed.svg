<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Знакове переповнення: +127 + 1 = −128 (додав додатні — дістав від'ємне!)</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найпідступніше: сума двох додатних «перевалює» через верх кола й стає найбільшим ВІД'ЄМНИМ</text>
<text x="150.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">+127</text>
<text x="180.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 01111111</text>
<text x="150.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">+ 1</text>
<text x="180.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 00000001</text>
<line x1="180.0" y1="185.0" x2="470.0" y2="185.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="150.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">сума</text>
<text x="180.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">10000000</text>
<text x="330.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">= −128 (!!)</text>
<text x="180.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">старший біт став 1 → знак перевернувся</text>
<circle cx="660.0" cy="160.0" r="64.0" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="660.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+127</text>
<text x="660.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">−128</text>
<line x1="700.0" y1="110.0" x2="700.0" y2="210.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="745.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">+1 = стрибок</text>
<text x="745.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">через межу</text>
<rect x="70.0" y="290.0" width="720.0" height="50.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.6"/>
<text x="430.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Додали два додатні — отримали від'ємне. Жодного попередження: число просто «не вмістилось».</text>
<text x="430.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Правило: якщо доданки одного знаку, а сума — іншого, сталося знакове переповнення.</text>
</svg>
