<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
<rect width="720" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Латч-ап: паразитний тиристор замикає Vcc на GND</text>
<line x1="70.0" y1="72.0" x2="470.0" y2="72.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<text x="64.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Vcc</text>
<line x1="70.0" y1="340.0" x2="470.0" y2="340.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="64.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">GND</text>
<circle cx="200.0" cy="150.0" r="30.0" fill="#fdeef0" stroke="#c0271e" stroke-width="2.2"/>
<text x="200.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">PNP</text>
<circle cx="300.0" cy="250.0" r="30.0" fill="#eef0fd" stroke="#1f47b5" stroke-width="2.2"/>
<text x="300.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">NPN</text>
<line x1="200.0" y1="120.0" x2="200.0" y2="72.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="300.0" y1="280.0" x2="300.0" y2="340.0" stroke="#1f47b5" stroke-width="2.4" stroke-linecap="round"/>
<line x1="228.0" y1="162.0" x2="278.0" y2="234.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="272.0" y1="238.0" x2="222.0" y2="166.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="192.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">петля +ЗЗ</text>
<line x1="110.0" y1="150.0" x2="168.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="108.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">інжекція струму</text>
<text x="108.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">(з входу / hot-plug)</text>
<path d="M 400.0,72.0 L 400.0,200.0 L 400.0,340.0" fill="none" stroke="#c0271e" stroke-width="5"/>
<line x1="400.0" y1="78.0" x2="400.0" y2="334.0" stroke="#c0271e" stroke-width="5" marker-end="url(#aRed)"/>
<text x="412.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">коротке</text>
<text x="412.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Vcc → GND</text>
<text x="412.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">крізь кристал</text>
<rect x="500.0" y="90.0" width="200.0" height="250.0" rx="6" fill="#fff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="600.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що відбувається</text>
<text x="512.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• струм відмикає один</text>
<text x="512.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  паразитний транзистор</text>
<text x="512.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• той відмикає другий</text>
<text x="512.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• другий тримає перший</text>
<text x="512.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  → петля замкнулась</text>
<text x="512.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Тримається САМА,</text>
<text x="512.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">доки не знято живлення.</text>
<text x="512.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Скидання не рятує —</text>
<text x="512.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лише вимкнути живлення.</text>
<text x="512.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Не обмежив струм —</text>
<text x="512.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">кристал вигоряє.</text>
<text x="360.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Паразитний тиристор у підкладці спить, доки інжектований струм його не «клацне» в самопідтримний коротень.</text>
</svg>
