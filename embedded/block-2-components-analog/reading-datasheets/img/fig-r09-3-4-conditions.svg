<text x="350.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий параметр під іншими умовами (темп., напруга, струм) — інше число. Завжди звіряй умови зі своїми.</text>
