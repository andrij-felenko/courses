<text x="360.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Поки сигнал між рейками — діоди закриті. Вийшов за рейку — відмикається, і крізь ніжку рине струм.</text>
