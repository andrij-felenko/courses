<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Який край небезпечний — залежить від параметра</text>
<rect x="50.0" y="64.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Напруга зсуву, шум, струм спокою</text>
<rect x="410.0" y="64.0" width="90.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="455.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">MAX</text>
<text x="516.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">менше — добре, боїшся великого</text>
<rect x="50.0" y="112.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Підсилення, вихідний струм, смуга</text>
<rect x="410.0" y="112.0" width="90.0" height="38.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="455.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">MIN</text>
<text x="516.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">більше — добре, боїшся малого</text>
<rect x="50.0" y="160.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Dropout, вхідний струм, витік</text>
<rect x="410.0" y="160.0" width="90.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="455.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">MAX</text>
<text x="516.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">хочеш якнайменше</text>
<rect x="50.0" y="208.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Поріг увімкнення (інколи)</text>
<rect x="410.0" y="208.0" width="90.0" height="38.0" rx="6" fill="#f3f3f3" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="455.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">MIN і MAX</text>
<text x="516.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">важать обидва краї</text>
<text x="350.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дивись на той край, де ховається біда: для одних параметрів це max, для інших — min.</text>
</svg>
