<text x="350.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Recommended — це Abs Max мінус запас на все це. Жити треба в зеленому, а не «майже на межі».</text>
