  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що зазвичай стоїть у Absolute Maximum</text>
<rect x="50.0" y="64.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Напруга живлення</text>
<text x="326.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">найбільше Vcc</text>
<rect x="50.0" y="104.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Напруга на входах</text>
<text x="326.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">часто −0.3…Vcc+0.3 В (інакше — латч-ап)</text>
<rect x="50.0" y="144.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Струм через ніжку</text>
<text x="326.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">скільки витримає вивід</text>
<rect x="50.0" y="184.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Потужність / темп. кристала Tj</text>
<text x="326.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">межа нагріву (§2.7.5)</text>
<rect x="50.0" y="224.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Температура зберігання</text>
<text x="326.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ширша за робочу</text>
<rect x="50.0" y="264.0" width="260.0" height="30.0" rx="5" fill="#fdeeee" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="64.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ESD</text>
<text x="326.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стійкість до статичного розряду</text>
<text x="350.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жодну з цих меж не можна переходити навіть на мить. Особливо підступна — напруга входу проти рейок живлення.</text>
</svg>
