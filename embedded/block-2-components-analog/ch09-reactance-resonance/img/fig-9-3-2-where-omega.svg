<text x="360.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">i = I₀·sin(ωt) → амплітуда напруги = L·ω·I₀ → XL = V₀/I₀ = ω·L.</text>
<text x="360.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дзеркало конденсатора: там швидка напруга давала струм (Xc=1/ωC),</text>
<text x="360.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тут швидкий струм дає напругу (XL = ωL).</text>
