<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
<rect width="700" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Фазори: опір і реактивності під прямим кутом</text>
<line x1="190.0" y1="200.0" x2="510.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="350.0" y1="80.0" x2="350.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="350.0" y1="200.0" x2="490.0" y2="200.0" stroke="#1b1b1b" stroke-width="3" marker-end="url(#aInk)"/>
<text x="500.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">R (0°)</text>
<line x1="350.0" y1="200.0" x2="350.0" y2="90.0" stroke="#b5732e" stroke-width="3" marker-end="url(#aInk)"/>
<text x="356.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b5732e" text-anchor="start" font-weight="bold" font-style="normal">XL (+90°)</text>
<line x1="350.0" y1="200.0" x2="350.0" y2="310.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="356.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Xc (−90°)</text>
<line x1="350.0" y1="200.0" x2="460.0" y2="120.0" stroke="#1f8a3b" stroke-width="2.4" stroke-dasharray="5,4" marker-end="url(#aGreen)"/>
<text x="466.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Z = √(R²+X²)</text>
<text x="350.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">XL і Xc протилежні — можуть гаситися (резонанс).</text>
<text x="350.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R і X перпендикулярні — складаються за теоремою Піфагора (імпеданс).</text>
</svg>
