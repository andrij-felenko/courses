<text x="245.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(ближнє: дальність ~ розмір котушки)</text>
