<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Картка без батарейки: трансформатор із повітряним осердям + резонанс</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зчитувач створює змінне поле; контур картки, настроєний у резонанс, розгойдує його до робочих вольтів</text>
<rect x="70.0" y="130.0" width="110.0" height="250.0" rx="8" fill="#f3f3f3" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="125.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зчитувач</text>
