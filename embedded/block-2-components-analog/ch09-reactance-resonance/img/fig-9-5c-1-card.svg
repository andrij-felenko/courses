<text x="520.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">чип</text>
<text x="520.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">конденсатор настроювання —</text>
<text x="520.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усередині чипа</text>
<text x="700.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. наведення:</text>
<text x="700.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">мілівольти (§2.2.6)</text>
<text x="700.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. резонанс:</text>
<text x="700.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">контур ×Q → вольти</text>
<text x="700.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. випрямляч у чипі:</text>
<text x="700.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">живлення логіки</text>
<text x="420.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">числа для 13.56 МГц: кілька витків по периметру (L ≈ 1.4 мкГн) + ≈100 пФ:  f₀ = 1/(2π√(LC)) ≈ 13.6 МГц</text>
<text x="420.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сімейство 125 кГц влаштоване так само — лише більше витків і нижча частота</text>
<text x="420.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">без резонансу наведених мілівольтів не вистачило б: саме добротність контуру робить картку безбатарейною</text>
</svg>
