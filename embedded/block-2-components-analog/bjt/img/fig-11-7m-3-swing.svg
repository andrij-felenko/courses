<text x="280.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">великий розмах Vce (вихід)</text>
<rect x="520.0" y="70.0" width="280.0" height="210.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="660.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">звідки підсилення</text>
<text x="660.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вхід ворушить Ib →</text>
<text x="660.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Q бігає вздовж прямої →</text>
<text x="660.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Vce гойдається широко</text>
<text x="660.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">підсилення = ΔVce / ΔVвх</text>
<text x="660.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крутіша пряма (більший Rc)</text>
<text x="660.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ більший розмах Vce → більше Av</text>
<text x="660.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7a4e8a" text-anchor="middle" font-weight="bold" font-style="normal">вихід ПЕРЕВЕРНУТИЙ: Ib↑ → Vce↓</text>
<text x="410.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Підсилювач і живе на цій прямій: вхід жене робочу точку туди-сюди, вихід знімають як коливання Vce.</text>
