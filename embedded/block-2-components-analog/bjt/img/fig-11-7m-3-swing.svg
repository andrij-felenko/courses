<text x="410.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал рухає Q вздовж прямої — а Vce коливається сильніше</text>
