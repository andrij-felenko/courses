<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
<rect width="860" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Зрадницька вісімка» — і що з неї виросло</text>
<rect x="40.0" y="56.0" width="420.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="250.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">восьмеро, що пішли 1957-го</text>
<circle cx="66.0" cy="92.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Роберт Нойс (Noyce)</text>
<circle cx="66.0" cy="124.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Гордон Мур (Moore)</text>
<circle cx="66.0" cy="156.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Жан Орні (Hoerni) — швейцарець</text>
<circle cx="66.0" cy="188.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Джей Ласт (Last)</text>
<circle cx="66.0" cy="220.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Віктор Грінич (Grinich)</text>
<circle cx="66.0" cy="252.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Юджин Кляйнер (Kleiner) — з Австрії</text>
<circle cx="66.0" cy="284.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Шелдон Робертс (Roberts)</text>
<circle cx="66.0" cy="316.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="80.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Джуліус Бланк (Blank)</text>
<rect x="480.0" y="56.0" width="340.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="650.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Fairchildren» — спадок</text>
<text x="650.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Fairchild так добре вчила людей,</text>
<text x="650.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що вони йшли робити свої компанії:</text>
<text x="500.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">▸ Intel (Нойс + Мур, 1968)</text>
<text x="500.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">▸ AMD</text>
<text x="500.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">▸ National Semiconductor</text>
<text x="500.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">▸ Kleiner Perkins (венчурний</text>
<text x="500.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  фонд Юджина Кляйнера)</text>
<text x="500.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">▸ …десятки інших</text>
<text x="650.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">венчурний капітал — теж звідси</text>
<text x="430.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Нойс згодом співзаснував Intel і став одним з винахідників інтегральної схеми; Мур — автор «закону Мура».</text>
</svg>
