<line x1="350.0" y1="70.0" x2="350.0" y2="110.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="350.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">від джерела</text>
