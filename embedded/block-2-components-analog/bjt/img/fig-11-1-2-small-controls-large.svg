<text x="350.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Слабкий сигнал на керувальному виводі править великим струмом</text>
<rect x="290.0" y="110.0" width="120.0" height="100.0" rx="8" fill="#eef2f6" stroke="#1b1b1b" stroke-width="2"/>
