<text x="228.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">керування</text>
<text x="228.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(слабкий сигнал)</text>
<text x="350.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Три виводи: два для головного струму, третій — керувальний. Назви й нутро — у §11.2–11.3.</text>
