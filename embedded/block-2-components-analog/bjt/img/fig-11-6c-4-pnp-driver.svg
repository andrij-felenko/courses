<text x="400.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">NPN розв'язує проблему рівня: він-бо керується від землі (МК уміє), а вже він стягує високовольтну базу PNP.</text>
