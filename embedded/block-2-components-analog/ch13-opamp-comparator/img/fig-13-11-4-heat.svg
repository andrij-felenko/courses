<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330">
<rect width="700" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Лінійний» = клапан гасить надлишок у тепло</text>
<rect x="150.0" y="70.0" width="90.0" height="210.0" rx="4" fill="#eef2f7" stroke="#9bb0c2" stroke-width="1.4"/>
<rect x="150.0" y="160.0" width="90.0" height="120.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="195.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Vout</text>
<rect x="150.0" y="70.0" width="90.0" height="90.0" rx="0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="195.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Vin − Vout</text>
<text x="195.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">падає на клапані</text>
<text x="195.0" y="62.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Vin</text>
<rect x="330.0" y="96.0" width="330.0" height="70.0" rx="6" fill="#fbecec" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="495.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">втрати = (Vin − Vout) · I → тепло</text>
<text x="495.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ККД ≈ Vout / Vin — менший за більшої різниці</text>
<rect x="330.0" y="182.0" width="330.0" height="76.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="495.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«dropout» — найменша різниця Vin−Vout,</text>
<text x="495.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за якої LDO ще тримає вихід</text>
<text x="495.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(LDO = Low DropOut — мала)</text>
<text x="350.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Простий і тихий, але гарячий: усю різницю напруг помножену на струм LDO віддає теплом.</text>
</svg>
