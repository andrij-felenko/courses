<text x="340.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Віртуальне коротке: рівна напруга, але без дроту</text>
