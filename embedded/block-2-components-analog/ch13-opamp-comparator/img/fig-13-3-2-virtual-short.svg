<text x="550.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ струму між ними — 0</text>
<text x="550.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ дроту немає</text>
<text x="340.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Коротке» лише за напругою. Рівність тримає не дріт, а зворотний зв'язок.</text>
