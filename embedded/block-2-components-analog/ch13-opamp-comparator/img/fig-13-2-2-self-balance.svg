<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="340.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рівновага: ОП тримає V₋ = V₊</text>
<path d="M 220,100 L 220,200 L 340,150 Z" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="231.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="231.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="220.0" y1="124.0" x2="140.0" y2="124.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="134.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">V₋</text>
<line x1="220.0" y1="176.0" x2="140.0" y2="176.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="134.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">V₊</text>
<line x1="340.0" y1="150.0" x2="430.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="436.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вихід</text>
<text x="185.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈</text>
<text x="372.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вихід стає таким,</text>
<text x="372.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">щоб V₋ = V₊</text>
<rect x="440.0" y="172.0" width="220.0" height="82.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="550.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ОП «робить що завгодно»</text>
<text x="550.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зі своїм виходом,</text>
<text x="550.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">аби зрівняти входи</text>
<text x="340.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Велетенське A не дасть різниці входів бути помітною — тож у рівновазі вони майже рівні.</text>
</svg>
