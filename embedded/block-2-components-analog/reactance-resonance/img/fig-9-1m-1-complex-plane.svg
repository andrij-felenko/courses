<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
<rect width="820" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Комплексне число — стрілка; множення на j — поворот на 90°</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна «стрілка» тримає одразу дві величини: довжину і кут</text>
<line x1="50.0" y1="270.0" x2="370.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="210.0" y1="420.0" x2="210.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<text x="374.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дійсна вісь</text>
<text x="210.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">уявна вісь (j)</text>
<line x1="314.0" y1="270.0" x2="314.0" y2="192.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round"/>
<line x1="210.0" y1="192.0" x2="314.0" y2="192.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round"/>
<line x1="210.0" y1="270.0" x2="314.0" y2="192.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="322.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">z = a + j·b</text>
<text x="314.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a</text>
<text x="198.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">j·b</text>
<path d="M 254,270 A 44 44 0 0 0 245,244" fill="none" stroke="#1f8a3b" stroke-width="2"/>
<text x="268.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">кут φ</text>
<text x="240.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">довжина r</text>
<text x="210.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">r = √(a² + b²);  a = r·cos φ;  b = r·sin φ</text>
<line x1="450.0" y1="270.0" x2="750.0" y2="270.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="600.0" y1="420.0" x2="600.0" y2="120.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="600.0" y1="270.0" x2="710.0" y2="270.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="736.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">z</text>
<line x1="600.0" y1="270.0" x2="600.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="600.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">j·z</text>
<line x1="600.0" y1="270.0" x2="490.0" y2="270.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="464.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">j²·z = −z</text>
<path d="M 660,270 A 60 60 0 0 0 600,210" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,4"/>
<path d="M 600,210 A 60 60 0 0 0 540,270" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="600.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">j·z — той самий z, повернений на +90°;  j² = два повороти = −1</text>
</svg>
