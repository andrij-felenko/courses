<text x="350.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Xc працює як опір у законі Ома (для амплітуд)</text>
<text x="200.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">резистор</text>
<text x="200.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V = I · R</text>
<text x="200.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R — стала</text>
<line x1="360.0" y1="80.0" x2="360.0" y2="200.0" stroke="#e4e4e4" stroke-width="2" stroke-linecap="round"/>
<text x="520.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">конденсатор</text>
<text x="520.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V = I · Xc</text>
<text x="520.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Xc залежить від f</text>
<rect x="60.0" y="206.0" width="580.0" height="30.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="350.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рахуємо так само, як резистор, — лише Xc перераховуємо для кожної частоти.</text>
