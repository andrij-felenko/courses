<text x="350.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напруга (синій) велика там, де струм міняється найшвидше (крутий схил).</text>
