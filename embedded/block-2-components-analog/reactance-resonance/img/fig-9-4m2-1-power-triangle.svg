<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Трикутник потужностей: S — гіпотенуза, P і Q — катети</text>
<line x1="110.0" y1="330.0" x2="470.0" y2="330.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<line x1="470.0" y1="330.0" x2="470.0" y2="100.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<line x1="110.0" y1="330.0" x2="470.0" y2="100.0" stroke="#1b1b1b" stroke-width="3.2" marker-end="url(#aInk)"/>
<path d="M 454.0,330.0 L 454.0,314.0 L 470.0,314.0" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<path d="M 182.0,330.0 L 182.0,328.3 L 181.9,326.6 L 181.8,324.9 L 181.7,323.2 L 181.5,321.5 L 181.3,319.8 L 181.0,318.1 L 180.7,316.4 L 180.4,314.8 L 180.0,313.1 L 179.6,311.5 L 179.1,309.8 L 178.6,308.2 L 178.1,306.6 L 177.5,305.0 L 176.9,303.4 L 176.2,301.8 L 175.6,300.2 L 174.8,298.7 L 174.1,297.2 L 173.3,295.6 L 172.4,294.2 L 171.6,292.7 L 170.7,291.2" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<text x="199.1" y="315.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">φ</text>
<text x="290.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P  —  активна (W)</text>
<text x="290.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">робить роботу, гріє, крутить вал</text>
<text x="484.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Q — реактивна (VAR)</text>
<text x="484.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">гойдає поле туди-сюди,</text>
<text x="484.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">роботи не робить</text>
<text x="150.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">S — повна потужність (VA)</text>
<text x="150.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">те, що реально тягнеться</text>
<text x="150.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">з мережі (струм × напруга)</text>
<line x1="225.0" y1="193.0" x2="286.0" y2="211.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<circle cx="110.0" cy="330.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<rect x="560.0" y="248.0" width="300.0" height="150.0" rx="10" fill="#eef6ef" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="580.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">S² = P² + Q²</text>
<text x="580.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">cos φ = P / S</text>
<text x="728.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">sin φ = Q / S</text>
<line x1="580.0" y1="328.0" x2="840.0" y2="328.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="580.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">S = U·I   (RMS)</text>
<text x="580.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">P = U·I·cos φ</text>
<text x="728.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Q = U·I·sin φ</text>
</svg>
