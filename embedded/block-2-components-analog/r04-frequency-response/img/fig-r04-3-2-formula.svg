<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий трикутник — інший катет</text>
<text x="380.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ФНЧ знімав вихід із Xc, ФВЧ знімає з R; гіпотенуза спільна</text>
<line x1="160.0" y1="320.0" x2="380.0" y2="320.0" stroke="#b5732e" stroke-width="3" marker-end="url(#aInk)"/>
<text x="270.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">R  ← звідси вихід ФВЧ</text>
<line x1="380.0" y1="320.0" x2="380.0" y2="160.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="392.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Xc ← звідси був вихід ФНЧ</text>
<line x1="160.0" y1="320.0" x2="380.0" y2="160.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="250.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">√(R² + Xc²)</text>
<text x="500.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">K = R / √(R² + Xc²)</text>
<text x="500.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">після підстановки Xc = 1/(2πfC):</text>
<text x="500.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">K(f) = 1/√(1 + (f_c/f)²)</text>
<text x="500.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">f_c = 1/(2π·R·C) — ТА САМА</text>
<text x="500.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">формула ФНЧ, лише дріб f/f_c</text>
<text x="500.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">перевернувся: тепер глушаться низькі</text>
</svg>
