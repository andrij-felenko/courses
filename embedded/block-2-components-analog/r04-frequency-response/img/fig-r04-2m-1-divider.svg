<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий дільник — але плечі тепер комплексні опори</text>
<circle cx="70.0" cy="150.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="70.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">V_вх</text>
<line x1="70.0" y1="150.0" x2="120.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<rect x="120.0" y="140.0" width="60.0" height="20.0" rx="0" fill="#f3f3f3" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="150.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Z_R = R</text>
<line x1="180.0" y1="150.0" x2="250.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="250.0" cy="150.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="250.0" y1="150.0" x2="305.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="305.0" cy="150.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="305.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">V_вих</text>
<line x1="250.0" y1="150.0" x2="250.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="234.0" y1="194.0" x2="266.0" y2="194.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="234.0" y1="204.0" x2="266.0" y2="204.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<text x="276.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Z_C = 1/(jωC)</text>
<line x1="250.0" y1="204.0" x2="250.0" y2="240.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="70.0" y1="240.0" x2="305.0" y2="240.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<text x="400.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">формула дільника напруги — без змін:</text>
<text x="400.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">H(jω) = Z_C / (Z_R + Z_C)</text>
<text x="400.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">підставляємо опори:</text>
<text x="400.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">H = (1/(jωC)) / (R + 1/(jωC))</text>
<text x="400.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">множимо чисельник і знаменник на jωC:</text>
<text x="400.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">H(jω) = 1 / (1 + jωRC)</text>
<text x="410.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна формула на все коло: у ній уже сидять і АЧХ (модуль), і ФЧХ (кут) — лишилося їх прочитати</text>
</svg>
