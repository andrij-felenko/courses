  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Миля стандартного кабелю»: еталон, який слухали вухом</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якість будь-якої лінії виражали довжиною еталонного кабелю з таким самим загасанням</text>
<text x="70.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вимірювана лінія (місто A → місто B):</text>
<line x1="70.0" y1="150.0" x2="430.0" y2="150.0" stroke="#b5732e" stroke-width="3" stroke-linecap="round"/>
<circle cx="70.0" cy="150.0" r="5.0" fill="#b5732e" stroke="#b5732e" stroke-width="0"/>
<circle cx="430.0" cy="150.0" r="5.0" fill="#b5732e" stroke="#b5732e" stroke-width="0"/>
<text x="250.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">загасання — ?</text>
<text x="70.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">еталон у лабораторії: котушки «стандартного кабелю» по 1 милі:</text>
<circle cx="80.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="80.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="126.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="126.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="172.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="172.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="218.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="218.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="264.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="264.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="310.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="310.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="356.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="356.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<circle cx="402.0" cy="260.0" r="16.0" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="402.0" cy="260.0" r="7.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="458.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">… вмикаємо по одній,</text>
<text x="458.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поки гучність не зрівняється</text>
<rect x="560.0" y="116.0" width="220.0" height="68.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="670.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">вимірювальний прилад:</text>
<text x="670.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">вухо телефоніста</text>
<line x1="430.0" y1="150.0" x2="556.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<text x="420.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«ця лінія звучить як 20 миль еталона» — і всі розуміли однаково; 1 миля ≈ найменша зміна гучності,</text>
<text x="420.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">яку вухо взагалі помічає (~1 дБ сучасною мовою) — еталон ненавмисно влучив у поріг слуху</text>
</svg>
