<text x="469.3" y="87.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3. Параметр. фільтр</text>
<text x="397.3" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">база: 50 000 позицій</text>
<text x="397.3" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">↓ V, I, Tj, корпус</text>
<text x="397.3" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">↓ ціна, наявність</text>
<text x="397.3" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">↓ статус (не EOL)</text>
<text x="397.3" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 23 кандидати</text>
<line x1="557.3" y1="244.0" x2="560.0" y2="244.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
