<text x="380.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конвеєр вибору: від вимог схеми до короткого списку</text>
<rect x="28.0" y="64.0" width="168.0" height="360.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.2"/>
<rect x="28.0" y="64.0" width="168.0" height="34.0" rx="10" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="112.0" y="87.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1. Вимоги схеми</text>
<text x="40.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">робоча напруга 12 В</text>
<text x="40.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">струм навантаж. 0.8 А</text>
<text x="40.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Tамб до 70 °C</text>
<text x="40.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">корпус: ручне паяння</text>
<text x="40.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">+ запас на майбутнє</text>
<line x1="200.0" y1="244.0" x2="202.7" y2="244.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
