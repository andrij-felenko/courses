<text x="648.0" y="87.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4. Оцінка й вибір</text>
<text x="576.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">score = запас</text>
<text x="576.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">  − штраф(ціна)</text>
<text x="576.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">  − штраф(дефіцит)</text>
<text x="576.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сортуй ↓ score</text>
<text x="576.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= топ-3 у даташит</text>
<text x="112.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="italic">розмите →</text>
<text x="290.7" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="italic">число з запасом →</text>
<text x="469.3" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="italic">відсіяти неможливе →</text>
<text x="648.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">ранжувати можливе</text>
