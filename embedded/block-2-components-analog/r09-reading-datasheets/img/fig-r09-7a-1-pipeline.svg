<text x="290.7" y="87.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2. Жорсткі обмеження</text>
<text x="218.7" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V(max) ≥ 12·1.5 = 18 В</text>
<text x="218.7" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">I(max) ≥ 0.8·2 = 1.6 А</text>
<text x="218.7" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Tj(max) ≥ 70 °C +запас</text>
<text x="218.7" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">корпус ∈ {TO-220,</text>
<text x="218.7" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  DPAK, SOT-223}</text>
<line x1="378.7" y1="244.0" x2="381.3" y2="244.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
