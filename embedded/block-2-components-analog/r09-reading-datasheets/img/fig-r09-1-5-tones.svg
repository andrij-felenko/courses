<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
<rect width="720" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три голоси даташита: хто й навіщо говорить</text>
<rect x="40.0" y="60.0" width="184.0" height="196.0" rx="8" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.6"/>
<text x="132.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="normal">ВІТРИНА</text>
<text x="132.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перша сторінка</text>
<line x1="60.0" y1="120.0" x2="204.0" y2="120.0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
<text x="132.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">реклама:</text>
<text x="132.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">найкращі цифри,</text>
<text x="132.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оптимістичний тон</text>
<rect x="268.0" y="60.0" width="184.0" height="196.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="360.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЗАСТЕРЕЖЕННЯ</text>
<text x="360.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Absolute Maximum</text>
<line x1="288.0" y1="120.0" x2="432.0" y2="120.0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
<text x="360.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">юридичне «ми попередили»:</text>
<text x="360.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перейдеш — сам винен,</text>
<text x="360.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">гарантії знято</text>
<rect x="496.0" y="60.0" width="184.0" height="196.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="588.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАТИСТИКА</text>
<text x="588.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">min / typ / max</text>
<line x1="516.0" y1="120.0" x2="660.0" y2="120.0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
<text x="588.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«typ» — не обіцянка,</text>
<text x="588.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а типове; гарантують</text>
<text x="588.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише min і max</text>
<text x="360.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Даташит водночас продає прилад і захищає виробника. Тон сторінки підказує, наскільки їй вірити.</text>
</svg>
