<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350">
<rect width="700" height="350" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не читай поспіль — стрибай до потрібного</text>
<rect x="50.0" y="60.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Це той компонент?»</text>
<rect x="360.0" y="60.0" width="290.0" height="38.0" rx="5" fill="#fdf1dc" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ перша сторінка</text>
<line x1="342.0" y1="79.0" x2="358.0" y2="79.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="50.0" y="104.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Як підключити?»</text>
<rect x="360.0" y="104.0" width="290.0" height="38.0" rx="5" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ розпіновка</text>
<line x1="342.0" y1="123.0" x2="358.0" y2="123.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="50.0" y="148.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Що його не вб'є?»</text>
<rect x="360.0" y="148.0" width="290.0" height="38.0" rx="5" fill="#fbecec" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ Absolute Maximum</text>
<line x1="342.0" y1="167.0" x2="358.0" y2="167.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="50.0" y="192.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Конкретне число?»</text>
<rect x="360.0" y="192.0" width="290.0" height="38.0" rx="5" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ таблиця Electrical Char.</text>
<line x1="342.0" y1="211.0" x2="358.0" y2="211.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="50.0" y="236.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Як зміниться в спеку?»</text>
<rect x="360.0" y="236.0" width="290.0" height="38.0" rx="5" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ графіки Typical Perf.</text>
<line x1="342.0" y1="255.0" x2="358.0" y2="255.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="50.0" y="280.0" width="290.0" height="38.0" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«Як зібрати схему?»</text>
<rect x="360.0" y="280.0" width="290.0" height="38.0" rx="5" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.3"/>
<text x="374.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ Application Info</text>
<line x1="342.0" y1="299.0" x2="358.0" y2="299.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="350.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Даташит на 40 сторінок не читають від кірки до кірки — у нього заходять із конкретним питанням.</text>
</svg>
