<text x="86.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Розведеш плату по ній — і все дзеркально. Завжди бери найновішу ревізію.</text>
<text x="350.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ревізія стоїть у кутку сторінки, історія змін — наприкінці. Скачуй найсвіжішу копію з сайту виробника.</text>
