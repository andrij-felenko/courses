  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підступ дрібного шрифту: «лише typ, не гарантовано»</text>
<rect x="50.0" y="64.0" width="600.0" height="40.0" rx="6" fill="#eef2f7" stroke="#7f93a8" stroke-width="1.4"/>
<text x="70.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Параметр</text>
<text x="330.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Min</text>
<text x="430.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e0a32e" text-anchor="start" font-weight="bold" font-style="normal">Typ</text>
<text x="540.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Max</text>
<rect x="50.0" y="104.0" width="600.0" height="40.0" rx="0" fill="#fff" stroke="#c9d3dc" stroke-width="1.1"/>
<text x="70.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Зсув Vos</text>
<text x="330.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">−2</text>
<text x="430.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e0a32e" text-anchor="start" font-weight="bold" font-style="normal">0.3</text>
<text x="540.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">2</text>
<rect x="50.0" y="144.0" width="600.0" height="40.0" rx="0" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="70.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Темп. дрейф</text>
<text x="330.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">—</text>
<text x="430.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e0a32e" text-anchor="start" font-weight="bold" font-style="normal">5</text>
<text x="540.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">—</text>
<text x="620.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">← пастка</text>
<text x="350.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Другий рядок має min=max=«—»: гарантованих меж НЕМАЄ, лише typ.</text>
<text x="350.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Таке число — суто довідкове; закладати його в розрахунок надійності не можна.</text>
<text x="350.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Інколи важливий параметр дають без гарантій — лише «typ». Це треба помітити, а не взяти за обіцянку.</text>
</svg>
