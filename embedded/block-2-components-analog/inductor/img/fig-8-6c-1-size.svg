<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
<rect width="800" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама потужність — різні століття: 50 Гц проти 100 кГц</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва трансформатори передають ~30 Вт; різниця лише в частоті, на якій вони працюють</text>
<rect x="85.0" y="145.0" width="190.0" height="170.0" rx="4" fill="#9aa0a6" stroke="#7c7c82" stroke-width="2"/>
<line x1="85.0" y1="173.0" x2="275.0" y2="173.0" stroke="#7c7c82" stroke-width="1" stroke-linecap="round"/>
<line x1="85.0" y1="201.0" x2="275.0" y2="201.0" stroke="#7c7c82" stroke-width="1" stroke-linecap="round"/>
<line x1="85.0" y1="229.0" x2="275.0" y2="229.0" stroke="#7c7c82" stroke-width="1" stroke-linecap="round"/>
<line x1="85.0" y1="257.0" x2="275.0" y2="257.0" stroke="#7c7c82" stroke-width="1" stroke-linecap="round"/>
<line x1="85.0" y1="285.0" x2="275.0" y2="285.0" stroke="#7c7c82" stroke-width="1" stroke-linecap="round"/>
<rect x="142.0" y="174.0" width="76.0" height="112.0" rx="4" fill="#b5732e" stroke="#8a5a20" stroke-width="2"/>
<line x1="142.0" y1="210.0" x2="218.0" y2="210.0" stroke="#8a5a20" stroke-width="1.2" stroke-linecap="round"/>
<line x1="142.0" y1="250.0" x2="218.0" y2="250.0" stroke="#8a5a20" stroke-width="1.2" stroke-linecap="round"/>
<text x="180.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">мережевий, 50 Гц</text>
<text x="180.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">шихтоване залізо · ~1 кг</text>
<rect x="450.0" y="255.0" width="60.0" height="60.0" rx="4" fill="#6a6f76" stroke="#4a4e54" stroke-width="2"/>
<rect x="467.0" y="266.0" width="26.0" height="38.0" rx="3" fill="#b5732e" stroke="#8a5a20" stroke-width="1.6"/>
<text x="480.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">феритовий, ~100 кГц</text>
<text x="480.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">імпульсна зарядка · ~30 г</text>
<line x1="305.0" y1="230.0" x2="425.0" y2="272.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="365.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">частота ×2000 →</text>
<text x="365.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">осердя в десятки разів менше</text>
<text x="600.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">чому так:</text>
<text x="600.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">осердя мусить «проковтнути»</text>
<text x="600.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потік цілого півперіоду;</text>
<text x="600.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на 50 Гц півперіод — 10 мс,</text>
<text x="600.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на 100 кГц — лише 5 мкс:</text>
<text x="600.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">у тисячі разів менше потоку →</text>
<text x="600.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">крихітний переріз і мало витків</text>
<text x="400.0" y="436.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">межа знизу: на надто високих частотах розростаються втрати осердя (§2.2.9) — оптимум у десятках-сотнях кГц</text>
</svg>
