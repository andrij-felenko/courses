<text x="246.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">один резистор  R/n²</text>
<text x="246.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(V₁/I₁ = (V₂/n)/(n·I₂) = R/n²)</text>
<text x="560.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">n = N₂/N₁ — коефіцієнт трансформації;</text>
<text x="560.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">знижувальний (n &lt; 1) робить</text>
<text x="560.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">навантаження «важчим», підвищувальний — «легшим»</text>
</svg>
