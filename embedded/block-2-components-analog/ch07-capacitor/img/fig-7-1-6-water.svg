<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
<rect width="820" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конденсатор як пружна перетинка в трубі</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вода крізь мембрану не тече ніколи; під тиском вона вигинається й запасає</text>
<line x1="80.0" y1="150.0" x2="740.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="80.0" y1="280.0" x2="740.0" y2="280.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<rect x="80.0" y="152.0" width="344.0" height="126.0" rx="0" fill="#cfe3f3" stroke="none" stroke-width="0"/>
<rect x="460.0" y="152.0" width="278.0" height="126.0" rx="0" fill="#e6f0f8" stroke="none" stroke-width="0"/>
<path d="M 430.0,154.0 Q 476.0,215.0 430.0,276.0" fill="none" stroke="#1f8a3b" stroke-width="4"/>
<text x="434.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пружна перетинка</text>
<line x1="110.0" y1="215.0" x2="200.0" y2="215.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="158.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">тиск (напруга)</text>
<text x="150.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">= високий бік (−Q)</text>
<line x1="510.0" y1="215.0" x2="580.0" y2="215.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="580.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">воду виштовхнуто рівно стільки ж (+Q)</text>
<text x="500.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">крізь мембрану вода не тече (постійний потік блокується)</text>
<rect x="60.0" y="360.0" width="700.0" height="56.0" rx="10" fill="#fdeded" stroke="#c0271e" stroke-width="1.6"/>
<text x="86.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Де аналогія ламається:</text>
<text x="86.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">при завеликій напрузі діелектрик не «розправляється», а ПРОБИВАЄТЬСЯ наскрізь (§7.5) — мембрана рветься.</text>
</svg>
