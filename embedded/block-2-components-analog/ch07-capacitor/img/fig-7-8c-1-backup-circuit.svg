<text x="410.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R обмежує кидок струму в розряджений іоністор (порожній конденсатор — «коротке», §2.1.4);</text>
<text x="410.0" y="468.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">D1 не пускає запас назад у вимкнене джерело; D2 оминає R при розряді</text>
