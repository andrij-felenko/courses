<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
<rect width="820" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому кільце не чіпає сигнал, але душить заваду</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе вирішує напрям струмів у жилах — а отже, чи складаються їхні поля у фериті</text>
<text x="140.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">корисний сигнал і живлення: туди — назад (протифазно)</text>
<rect x="330.0" y="114.0" width="120.0" height="92.0" rx="10" fill="#6a6f76" stroke="#4a4e54" stroke-width="2"/>
<line x1="110.0" y1="146.0" x2="700.0" y2="146.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<line x1="250.0" y1="146.0" x2="300.0" y2="146.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<line x1="520.0" y1="146.0" x2="570.0" y2="146.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<line x1="110.0" y1="174.0" x2="700.0" y2="174.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<line x1="300.0" y1="174.0" x2="250.0" y2="174.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<line x1="570.0" y1="174.0" x2="520.0" y2="174.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<text x="390.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">потоки жил у фериті — НАЗУСТРІЧ:</text>
<text x="390.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">сумарне поле ≈ 0 → кільця ніби немає</text>
<text x="720.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">сигнал</text>
<text x="720.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">проходить</text>
<text x="140.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">синфазна завада: в обох жилах ОДНАКОВО (назад — через простір)</text>
<rect x="330.0" y="308.0" width="120.0" height="92.0" rx="10" fill="#6a6f76" stroke="#4a4e54" stroke-width="2"/>
<line x1="110.0" y1="340.0" x2="700.0" y2="340.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<line x1="250.0" y1="340.0" x2="300.0" y2="340.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<line x1="520.0" y1="340.0" x2="570.0" y2="340.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<line x1="110.0" y1="368.0" x2="700.0" y2="368.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<line x1="250.0" y1="368.0" x2="300.0" y2="368.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<line x1="520.0" y1="368.0" x2="570.0" y2="368.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="390.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">потоки жил — РАЗОМ:</text>
<text x="390.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">ферит бачить повний потік → опір і тепло (§2.2.9)</text>
<text x="720.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">завада</text>
<text x="720.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">гасне</text>
<text x="410.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тому кільце вдягають на ВЕСЬ кабель: для пари «туди-назад» воно невидиме,</text>
<text x="410.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">а для струму, спільного всім жилам, — повноцінна втратна бусина</text>
</svg>
