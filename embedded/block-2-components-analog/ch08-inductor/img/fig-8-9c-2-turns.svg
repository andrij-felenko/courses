<text x="380.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пропустити кабель тричі — краще, ніж начепити три кільця поряд</text>
