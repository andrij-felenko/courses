<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<rect width="800" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два світи з різним «нулем»: бар'єр ізоляції між ними</text>
<rect x="40.0" y="70.0" width="300.0" height="170.0" rx="10" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="190.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">сторона логіки</text>
<text x="190.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">МК, 3.3 В, USB у руках</text>
<rect x="90.0" y="140.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="190.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">GND логіки</text>
<text x="190.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тут безпечно торкатись</text>
<rect x="460.0" y="70.0" width="300.0" height="170.0" rx="10" fill="#fbecec" stroke="#d8a0a0" stroke-width="1.6"/>
<text x="610.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сторона мережі</text>
<text x="610.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">230 В, фаза й нейтраль</text>
<rect x="510.0" y="140.0" width="200.0" height="36.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="610.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«нуль» мережі ≠ GND</text>
<text x="610.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">торкатись — небезпечно</text>
<line x1="400.0" y1="60.0" x2="400.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
<rect x="372.0" y="130.0" width="56.0" height="50.0" rx="6" fill="#fff3b0" stroke="#e0a32e" stroke-width="1.6"/>
<text x="400.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">бар'єр</text>
<text x="400.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ізоляції</text>
<line x1="300.0" y1="115.0" x2="372.0" y2="145.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aGreen)"/>
<text x="330.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сигнал</text>
<line x1="428.0" y1="145.0" x2="500.0" y2="115.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aGreen)"/>
<text x="400.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сигнал має перетнути бар'єр (світлом, полем чи магнітом), але струм — ні. Без цього дотик до плати = дотик до мережі.</text>
</svg>
