<text x="410.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Замість різати кожну півхвилю, віддаємо одні півперіоди повністю, інші зовсім пропускаємо. Фронтів мало → завад мало; годиться там, де навантаження інерційне (нагрівач).</text>
