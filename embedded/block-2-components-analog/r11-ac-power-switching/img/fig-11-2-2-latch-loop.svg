<text x="400.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Защіпка: імпульс у затвор запускає самопідтримний цикл</text>
<circle cx="400.0" cy="73.0" r="7.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="400.0" y="41.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">імпульс у затвор</text>
<circle cx="487.5" cy="136.6" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="521.7" y="129.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Q2 трохи відкрився</text>
<circle cx="454.1" cy="239.4" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="475.2" y="272.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">струм у базу Q1</text>
<circle cx="345.9" cy="239.4" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="324.8" y="272.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Q1 відкрив Q2 ще</text>
<circle cx="312.5" cy="136.6" r="7.0" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="278.3" y="129.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обидва насичені</text>
<line x1="415.7" y1="84.4" x2="471.7" y2="125.1" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="481.5" y1="155.1" x2="460.1" y2="220.9" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="434.6" y1="239.4" x2="365.4" y2="239.4" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="339.9" y1="220.9" x2="318.5" y2="155.1" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="328.3" y1="125.1" x2="384.3" y2="84.4" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="400.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЗАМКНУТО</text>
<text x="400.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Затвор потрібен лише на старт. Далі транзистори тримають одне одного — затвор можна відпустити, прилад лишається відкритим.</text>
