<text x="360.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Паралельно = більша сумарна площа обкладок</text>
<rect x="170.0" y="130.0" width="8.0" height="60.0" rx="0" fill="#f7dada" stroke="#c0271e" stroke-width="1.4"/>
<rect x="182.0" y="130.0" width="8.0" height="60.0" rx="0" fill="#dbe3f7" stroke="#1f47b5" stroke-width="1.4"/>
<text x="180.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A₁</text>
<rect x="170.0" y="210.0" width="8.0" height="60.0" rx="0" fill="#f7dada" stroke="#c0271e" stroke-width="1.4"/>
<rect x="182.0" y="210.0" width="8.0" height="60.0" rx="0" fill="#dbe3f7" stroke="#1f47b5" stroke-width="1.4"/>
<text x="220.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A₂</text>
<text x="180.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дві пари обкладок</text>
<line x1="280.0" y1="200.0" x2="360.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="320.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">поряд</text>
<rect x="440.0" y="110.0" width="10.0" height="180.0" rx="0" fill="#f7dada" stroke="#c0271e" stroke-width="1.4"/>
<rect x="454.0" y="110.0" width="10.0" height="180.0" rx="0" fill="#dbe3f7" stroke="#1f47b5" stroke-width="1.4"/>
<text x="490.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A₁ + A₂</text>
<text x="560.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ C = C₁ + C₂</text>
<text x="360.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">C ∝ площа (§7.2), тож паралельні ємності просто додаються.</text>
