<text x="133.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лівий торець</text>
<text x="427.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">правий торець</text>
<text x="280.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кераміка — діелектрик між кожною парою електродів</text>
<text x="530.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">десятки–сотні електродів,</text>
<text x="530.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">через один — до різних торців;</text>
<text x="530.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кожна пара сусідів — конденсатор</text>
<text x="530.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">усі пари ввімкнені паралельно (§2.1.7):</text>
<text x="530.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">C = N · C однієї пари</text>
<text x="530.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шар кераміки — одиниці мікрометрів:</text>
<text x="530.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">величезне A і крихітне d</text>
<text x="530.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у корпусі від 0.4 мм завдовжки</text>
<line x1="518.0" y1="150.0" x2="390.0" y2="160.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<text x="410.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">торці металізовані під паяння; полярності немає — будь-яким боком</text>
<text x="410.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">клас 1 — стабільний параелектрик (малі номінали); клас 2 — титанат барію з εr у тисячі (великі номінали, але «пливе»)</text>
