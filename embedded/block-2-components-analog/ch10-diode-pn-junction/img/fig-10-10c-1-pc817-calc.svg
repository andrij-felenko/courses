<text x="145.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#aaaaaa" text-anchor="middle" font-weight="normal" font-style="normal">DIP-4</text>
<line x1="70.0" y1="125.0" x2="44.0" y2="125.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="40.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">1 анод</text>
<line x1="70.0" y1="175.0" x2="44.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="40.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">2 катод</text>
<line x1="220.0" y1="125.0" x2="246.0" y2="125.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">колектор 4</text>
<line x1="220.0" y1="175.0" x2="246.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">емітер 3</text>
<text x="145.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крапка/зріз = вивід 1 (анод)</text>
<rect x="300.0" y="70.0" width="250.0" height="320.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="425.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВХІД (світлодіод)</text>
<text x="425.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сигнал 3.3 В → засвітити LED</text>
<text x="425.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">U_F ≈ 1.2 В, хочемо I_F = 10 мА</text>
<text x="425.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">R1 = (3.3 − 1.2)/10мА</text>
<text x="425.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 210 Ом → беремо 220 Ом</text>
<text x="425.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(той самий обмежувач, що</text>
<text x="425.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у звичайного LED, §2.5.7)</text>
<text x="425.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">запас: реальний I_F беруть</text>
<text x="425.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">БІЛЬШИМ, ніж теоретично треба</text>
<text x="425.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">— бо CTR падає з роками</text>
<rect x="580.0" y="70.0" width="250.0" height="320.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="705.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВИХІД (фототранзистор)</text>
<text x="705.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">треба насичення (повне «вкл»)</text>
<text x="705.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">CTR_min = 80% (ранг A)</text>
<text x="705.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I_C(дост.) ≈ 0.8·10мА = 8 мА</text>
<text x="705.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R_C при вих. 5 В:</text>
<text x="705.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">R_C &gt; 5В/8мА ≈ 620 Ом</text>
<text x="705.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ беремо 1 кОм (з запасом)</text>
<text x="705.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">на R_C падає майже все →</text>
<text x="705.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">транзистор насичений → чіткий</text>
<text x="705.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">логічний 0 на виході</text>
<text x="705.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a4e8a" text-anchor="middle" font-weight="bold" font-style="normal">інверсія: LED горить → вихід 0</text>
<text x="430.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Два боки рахують ОКРЕМО (різні землі!): вхід — як LED, вихід — як ключ-транзистор у насиченні.</text>
</svg>
