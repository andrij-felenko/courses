<text x="430.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PC817 у цифровому ключі: рахуємо обидва боки в числах</text>
<rect x="70.0" y="90.0" width="150.0" height="130.0" rx="8" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="86.0" cy="106.0" r="5.0" fill="none" stroke="#aaa" stroke-width="1.4"/>
