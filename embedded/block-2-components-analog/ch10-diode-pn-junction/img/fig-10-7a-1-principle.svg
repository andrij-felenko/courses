<text x="700.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">A→B: відкритий, СВІТИТЬ</text>
<text x="700.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">B→A (антипаралельний):</text>
<text x="700.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зворотно зміщений — мовчить</text>
<text x="700.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усі LED до ніжки C:</text>
<text x="700.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">C у Hi-Z — шляху нема, темні</text>
<line x1="580.0" y1="214.0" x2="820.0" y2="214.0" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
<text x="700.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">щоб засвітити інший LED —</text>
<text x="700.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інша трійка станів ніжок</text>
<text x="700.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">одночасно світить ОДИН</text>
<text x="700.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(або один — швидка розгортка)</text>
<text x="700.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обмежувальні резистори —</text>
<text x="700.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обов'язкові (на ніжку чи в плече)</text>
<text x="700.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея — Чарлі Аллен, Maxim, ~1995</text>
