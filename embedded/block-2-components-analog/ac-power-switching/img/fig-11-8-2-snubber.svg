<text x="595.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">C приймає різкий стрибок напруги,</text>
<text x="595.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сповільнюючи dv/dt на ключі;</text>
<text x="595.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R обмежує струм розряду C</text>
<text x="595.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у момент вмикання (щоб не бити</text>
<text x="595.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ключ голкою струму);</text>
<text x="595.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">разом — обмежують і dv/dt, і di/dt.</text>
<text x="380.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Конденсатор не дає напрузі стрибнути миттєво (§2.1: U на C не змінюється стрибком), а резистор стримує струм його розряду. Це той самий RC-снабер, що й на DC-контактах (§2.2.5), лише розрахований на мережу.</text>
