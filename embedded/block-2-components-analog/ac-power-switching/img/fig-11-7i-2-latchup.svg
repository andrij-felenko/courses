<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому IGBT десять років «не виходив»: схована защіпка</text>
<rect x="70.0" y="70.0" width="300.0" height="26.0" fill="#dfe6ef" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="220.0" y="87.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затвор (MOS) — керує каналом</text>
<rect x="70.0" y="96.0" width="70.0" height="26.0" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="105.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">n+</text>
<rect x="300.0" y="96.0" width="70.0" height="26.0" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="335.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">n+</text>
<rect x="70.0" y="122.0" width="300.0" height="40.0" fill="#fbecec" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="220.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">p (тіло)</text>
<rect x="70.0" y="162.0" width="300.0" height="50.0" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="220.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">n− (дрейф, тримає напругу)</text>
<rect x="70.0" y="212.0" width="300.0" height="30.0" fill="#fbecec" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="220.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">p+ (анод) — нове проти MOSFET</text>
<rect x="70.0" y="242.0" width="300.0" height="22.0" fill="#dfe6ef" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="220.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">колектор</text>
<text x="220.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Чотири шари n+/p/n−/p+ —</text>
<text x="220.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це схований PNPN-тиристор (§2.11.2)</text>
<text x="650.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що це насправді:</text>
<rect x="490.0" y="90.0" width="110.0" height="50.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2" rx="6"/>
<text x="545.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MOSFET</text>
<text x="545.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">(керує затвор)</text>
<rect x="700.0" y="90.0" width="110.0" height="50.0" fill="#fbecec" stroke="#c0271e" stroke-width="2" rx="6"/>
<text x="755.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">PNP</text>
<text x="755.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">(корисний)</text>
<rect x="700.0" y="175.0" width="110.0" height="50.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2" rx="6"/>
<text x="755.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">NPN</text>
<text x="755.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">паразит!</text>
<line x1="600.0" y1="115.0" x2="700.0" y2="115.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="650.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">вмикає</text>
<line x1="755.0" y1="140.0" x2="755.0" y2="173.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<line x1="740.0" y1="173.0" x2="740.0" y2="142.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="820.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">взаємний</text>
<text x="820.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">підкач —</text>
<text x="820.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">защіпка</text>
<rect x="490.0" y="250.0" width="360.0" height="92.0" fill="#fbf3df" stroke="#caa24a" stroke-width="2" rx="8"/>
<text x="670.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">За великого струму NPN «прокидається»:</text>
<text x="670.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">PNP і NPN починають живити один одного,</text>
<text x="670.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">защіпка замикається — затвор уже нічим</text>
<text x="670.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не керує — прилад згоряє. Розв'язок</text>
<text x="670.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(Накаґава, 1984): не дати NPN увімкнутись.</text>
</svg>
