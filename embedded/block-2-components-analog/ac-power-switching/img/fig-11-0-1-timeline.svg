<svg xmlns="http://www.w3.org/2000/svg" width="940" height="250" viewBox="0 0 940 250">
<rect width="940" height="250" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від газового тиратрона до кремнієвого тиристора</text>
<text x="125.0" y="72.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1920-ті · тиратрон</text>
<rect x="20.0" y="80.0" width="210.0" height="104.0" rx="8" fill="#fdf1dc" stroke="#d8b46a" stroke-width="1.6"/>
<text x="125.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ртутна/газова лампа —</text>
<text x="125.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вмикається сіткою</text>
<text x="355.0" y="72.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1956 · Bell Labs</text>
<rect x="250.0" y="80.0" width="210.0" height="104.0" rx="8" fill="#fdf1dc" stroke="#d8b46a" stroke-width="1.6"/>
<text x="355.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Молл, Шоклі та ін.:</text>
<text x="355.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">теорія PNPN-структури</text>
<text x="585.0" y="72.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1957 · General Electric</text>
<rect x="480.0" y="80.0" width="210.0" height="104.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="585.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перший комерційний</text>
<text x="585.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кремнієвий SCR</text>
<text x="815.0" y="72.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1960-ті →</text>
<rect x="710.0" y="80.0" width="210.0" height="104.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="815.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">силова електроніка:</text>
<text x="815.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">приводи, світло, тепло</text>
<line x1="232.0" y1="132.0" x2="248.0" y2="132.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="462.0" y1="132.0" x2="478.0" y2="132.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="692.0" y1="132.0" x2="708.0" y2="132.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="470.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Газова лампа вміла те саме — вмикати велику потужність слабким сигналом, — але тиристор зробив це твердотільним і надійним.</text>
</svg>
