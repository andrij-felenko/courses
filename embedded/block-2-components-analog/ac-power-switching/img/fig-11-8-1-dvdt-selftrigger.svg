<text x="410.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На індуктивному навантаженні струм відстає, і коли симістор гасне, до нього миттю прикладається висока напруга. Це dv/dt проштовхує струм крізь внутрішню ємність у затвор — і прилад вмикається сам.</text>
