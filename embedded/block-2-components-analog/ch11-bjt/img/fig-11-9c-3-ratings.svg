<text x="420.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Паспортна «10 А» — це РЕЗИСТИВНЕ навантаження; для лампи, мотора чи ємності реальна межа в рази нижча.</text>
