<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350">
<rect width="760" height="350" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Іскра на контактах — і як її гасять</text>
<rect x="40.0" y="60.0" width="330.0" height="230.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="205.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">розмикання під навантаженням</text>
<line x1="120.0" y1="130.0" x2="180.0" y2="130.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<circle cx="180.0" cy="130.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/>
<line x1="230.0" y1="130.0" x2="290.0" y2="130.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<circle cx="230.0" cy="130.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/>
<path d="M 184.0,130.0 L 198.0,122.0 L 208.0,138.0 L 220.0,126.0 L 228.0,130.0" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<text x="205.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">дуга / іскра</text>
<text x="205.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розмикання струму палить контакти,</text>
<text x="205.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">точить їх і скорочує ресурс</text>
<text x="205.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">найгірше — індуктивне навантаження</text>
<text x="205.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(моторчик: власне брикання §2.2.5)</text>
<rect x="410.0" y="60.0" width="320.0" height="230.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="570.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">гасіння</text>
<text x="570.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DC-навантаження:</text>
<text x="570.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f6e33" text-anchor="middle" font-weight="normal" font-style="normal">гасний діод на навантаженні</text>
<text x="570.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">AC-навантаження:</text>
<text x="570.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f6e33" text-anchor="middle" font-weight="normal" font-style="normal">RC-снабер на контактах (§2.2.5)</text>
<text x="570.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">правильний номінал контактів:</text>
<text x="570.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">AC і DC рейтинги РІЗНІ (DC гірше —</text>
<text x="570.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дуга не гасне на переході через нуль)</text>
<text x="570.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a4e8a" text-anchor="middle" font-weight="bold" font-style="normal">велике/часте навантаження → SSR</text>
<text x="380.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Контакти — найслабша ланка реле: їх беруть із запасом за струмом і гасять дугу діодом чи снабером.</text>
</svg>
