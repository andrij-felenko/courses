<text x="410.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Налаштувати й перевірити: робоча точка + осцилограф</text>
<rect x="40.0" y="54.0" width="340.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="210.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крок 1: виставити робочу точку</text>
<text x="210.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">виміряй напругу на колекторі Vc:</text>
<rect x="90.0" y="100.0" width="240.0" height="36.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="210.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">Vc ≈ половина +9 В ≈ 4.5 В  ✓</text>
<text x="210.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">Vc ≈ 0 → насичення (R1 завеликий):</text>
<text x="210.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зменш R1 або збільш R2</text>
<text x="210.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">Vc ≈ 9 В → відсічка (R1 замалий):</text>
<text x="210.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">збільш R1 або зменш R2</text>
<text x="210.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">база Vb ≈ 1.5–2 В, емітер Ve ≈ Vb−0.7</text>
<text x="210.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(перевір мультиметром — це і є точка Q,</text>
<text x="210.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама з навантажувальної прямої §2.6.7m)</text>
<text x="210.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">усе це — БЕЗ сигналу, у спокої</text>
