<text x="626.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">мертвий час</text>
<text x="161.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">обидва прочинені →</text>
<text x="161.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">наскрізний струм (вибух)</text>
<text x="350.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">трохи більше за час вимикання</text>
<text x="539.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#e0a32e" text-anchor="middle" font-weight="normal" font-style="normal">довга пауза →</text>
<text x="539.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">body-діод гріється, спотворення</text>
<text x="350.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Правило: мертвий час трохи довший за найгірший час вимикання ключа (Qg, Rg, темп.).</text>
<text x="350.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На практиці — апаратний комплементарний ШІМ із програмованим мертвим часом, не дві ніжки вручну.</text>
