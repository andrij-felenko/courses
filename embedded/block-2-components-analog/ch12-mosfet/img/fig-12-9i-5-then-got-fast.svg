<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290">
<rect width="760" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як цікавинка перемогла все: два кроки</text>
<rect x="40.0" y="72.0" width="330.0" height="140.0" rx="10" fill="#eef2f6" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="205.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">крок 1 (кін. 1970-х)</text>
<text x="205.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дрібніша літографія +</text>
<text x="205.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кремнієвий затвор</text>
<text x="205.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ КМОН стала ще й ШВИДКОЮ</text>
<text x="205.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(Масухара, Hitachi, 1978)</text>
<rect x="400.0" y="72.0" width="330.0" height="140.0" rx="10" fill="#fff7e6" stroke="#b5732e" stroke-width="1.5"/>
<text x="565.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">крок 2 (1980-ті →)</text>
<text x="565.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мільйони вентилів →</text>
<text x="565.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вирішує СУМАРНЕ ТЕПЛО</text>
<text x="565.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ майже нульовий спокій КМОН</text>
<text x="565.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">став безальтернативним</text>
<line x1="372.0" y1="142.0" x2="398.0" y2="142.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aGrey)"/>
<text x="380.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Спершу КМОН наздогнала за швидкістю, потім теплова стіна зробила її єдиним виходом.</text>
</svg>
