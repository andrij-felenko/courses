<text x="360.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Нижче гребеня потоку нема; вище — потекло, і що вищий рівень, то рясніший потік (менший опір).</text>
