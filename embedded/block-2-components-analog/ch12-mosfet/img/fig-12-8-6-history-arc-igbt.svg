<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дуга подій і напарники</text>
<text x="120.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1947</text>
<text x="120.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">BJT — панує</text>
<line x1="190.0" y1="90.0" x2="330.0" y2="90.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="430.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1959 → 1970-ті</text>
<text x="430.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MOSFET → КМОН → бере цифру й силу</text>
<line x1="620.0" y1="90.0" x2="690.0" y2="90.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="745.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сьогодні</text>
<text x="745.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">співіснують</text>
<rect x="80.0" y="138.0" width="330.0" height="122.0" rx="8" fill="#fff7e6" stroke="#b5732e" stroke-width="1.5"/>
<text x="245.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">IGBT — гібрид</text>
<text x="245.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затвор як у MOSFET (керує напруга)</text>
<text x="245.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ вихід як у BJT (малий спад)</text>
<text x="245.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">надпотужне: е-авто, плити, зварка</text>
<rect x="450.0" y="138.0" width="290.0" height="122.0" rx="8" fill="#eef2f6" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="595.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">BiCMOS — на одному чипі</text>
<text x="595.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">MOSFET — логіка (щільно)</text>
<text x="595.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">BJT — точний аналог поряд</text>
<text x="595.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розподіл праці, не війна</text>
<text x="410.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Біполярний відступив в аналогову твердиню; для надпотужного — IGBT, що поєднав обох.</text>
