<text x="105.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">VBE1</text>
<text x="105.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">VBE2</text>
<text x="105.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">більша</text>
<text x="105.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">менша</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="325.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="360.0" y1="325.0" x2="360.0" y2="150.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="374.0" y="231.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ΔVbe = VBE1 − VBE2</text>
<rect x="374.0" y="261.5" width="360.0" height="150.0" rx="8" fill="#fbecec" stroke="#e6b9b6" stroke-width="1.4"/>
<text x="392.0" y="291.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ΔVbe = U_T · ln(N)</text>
<text x="392.0" y="317.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">U_T = kT/q ≈ 26 мВ  (за 300 К)</text>
<text x="392.0" y="341.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">N — відношення щільностей струму</text>
<text x="392.0" y="361.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">N = 8  →  ΔVbe ≈ 26·ln8 ≈ 54 мВ</text>
<text x="392.0" y="385.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">PTAT: росте прямо з T  (+слабкий нахил)</text>
<text x="380.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Один VBE — велике падіння (CTAT). Їхня РІЗНИЦЯ — мала, чиста й PTAT.</text>
</svg>
