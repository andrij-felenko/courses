<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<rect width="720" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A гуляє вдвічі — підсилення схеми майже не змінюється</text>
<text x="180.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">власне A приладу:</text>
<rect x="110.0" y="100.0" width="50.0" height="110.0" rx="0" fill="#fbeaea" stroke="#c0271e" stroke-width="1.4"/>
<text x="135.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">100k</text>
<rect x="200.0" y="90.0" width="50.0" height="120.0" rx="0" fill="#fbeaea" stroke="#c0271e" stroke-width="1.4"/>
<text x="225.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">200k</text>
<text x="180.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">(плаває)</text>
<text x="520.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">підсилення схеми:</text>
<line x1="380.0" y1="150.0" x2="660.0" y2="150.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<circle cx="420.0" cy="150.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<circle cx="520.0" cy="150.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<circle cx="620.0" cy="150.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<text x="520.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 10  (стабільне)</text>
<text x="520.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримають резистори, не A</text>
<text x="520.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">надлишок A → тугіше V₋=V₊</text>
<text x="360.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Поки A «достатньо велетенське», зворотний зв'язок ковтає всі його коливання. Резистори правлять.</text>
</svg>
