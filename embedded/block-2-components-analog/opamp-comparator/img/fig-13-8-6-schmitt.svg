<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тригер Шмітта: від нервів кальмара (Шмітт, 1934)</text>
<path d="M 110,106 L 110,194 L 210,150 Z" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<line x1="132.0" y1="158.0" x2="152.0" y2="158.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="152.0" y1="158.0" x2="152.0" y2="142.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="152.0" y1="142.0" x2="172.0" y2="142.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="110.0" y1="150.0" x2="70.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="64.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">вхід</text>
<line x1="210.0" y1="150.0" x2="250.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
