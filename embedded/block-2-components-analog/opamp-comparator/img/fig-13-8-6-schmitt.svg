<text x="160.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">символ тригера Шмітта</text>
<rect x="330.0" y="70.0" width="360.0" height="172.0" rx="8" fill="#fff7e6" stroke="#b5732e" stroke-width="1.4"/>
<text x="510.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">Отто Шмітт, 1934</text>
<text x="510.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вивчав нерв кальмара —</text>
<text x="510.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">як він «спрацьовує» все-або-нічого</text>
<text x="510.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ відтворив це електронікою</text>
<text x="510.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ заклав біоміметику</text>
<text x="510.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(запозичення ідей у природи)</text>
<text x="360.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жива клітина підказала інженерам одну з найкорисніших схем: поріг + пам'ять = чисте перемикання.</text>
