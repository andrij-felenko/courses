<text x="380.0" y="386.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Два кінці лінії складають похибки. 20 + 20 ppm = 0.004 % — тоне в бюджеті; ±1.5 % RC уже чіпає стіну.</text>
