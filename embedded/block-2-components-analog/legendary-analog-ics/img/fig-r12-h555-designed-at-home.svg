<text x="530.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">транзистори</text>
<rect x="610.0" y="308.0" width="120.0" height="64.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2" rx="8"/>
<text x="670.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">16</text>
<text x="670.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">резисторів</text>
<rect x="750.0" y="308.0" width="120.0" height="64.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2" rx="8"/>
<text x="810.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="810.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">діоди</text>
<text x="460.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">У різних джерелах склад трохи різниться (напр. 25 транзисторів / 15 резисторів) — наводимо власні цифри Камензінда.</text>
