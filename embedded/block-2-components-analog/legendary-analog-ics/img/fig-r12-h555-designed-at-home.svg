<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як один інженер спроєктував чип вручну, без комп'ютера</text>
<rect x="40.0" y="60.0" width="360.0" height="200.0" fill="#fbf3e0" stroke="#e0a32e" stroke-width="2" rx="12"/>
<text x="220.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">Угода замість звільнення (1970)</text>
<text x="62.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• половина зарплати на рік</text>
<text x="62.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• уся потрібна апаратура — у борг</text>
<text x="62.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• працює сам, як зовнішній консультант</text>
<text x="62.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ідея: зробити з генератора ФАПЧ</text>
<text x="62.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   універсальний таймер на продаж</text>
<line x1="406.0" y1="160.0" x2="470.0" y2="160.0" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#aInk)"/>
<text x="438.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рік</text>
<text x="438.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">праці</text>
<rect x="480.0" y="60.0" width="360.0" height="200.0" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2" rx="12"/>
