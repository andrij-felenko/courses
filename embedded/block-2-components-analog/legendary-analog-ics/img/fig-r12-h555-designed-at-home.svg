<rect x="506.0" y="104.0" width="150.0" height="130.0" fill="#7a1622" stroke="#54101a" stroke-width="1.5" rx="4"/>
<rect x="518.0" y="116.0" width="56.0" height="26.0" fill="#fbe8b0" stroke="#caa84e" stroke-width="1" rx="2"/>
<rect x="586.0" y="116.0" width="54.0" height="40.0" fill="#fbe8b0" stroke="#caa84e" stroke-width="1" rx="2"/>
<rect x="518.0" y="154.0" width="40.0" height="60.0" fill="#fbe8b0" stroke="#caa84e" stroke-width="1" rx="2"/>
<rect x="566.0" y="168.0" width="30.0" height="30.0" fill="#fbe8b0" stroke="#caa84e" stroke-width="1" rx="2"/>
<rect x="604.0" y="168.0" width="36.0" height="50.0" fill="#fbe8b0" stroke="#caa84e" stroke-width="1" rx="2"/>
<text x="581.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лист рубіліту (Rubylith),</text>
<text x="581.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">доріжки прорізано ножем</text>
<text x="678.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ рік на макетах:</text>
<text x="678.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">паяти, міряти,</text>
<text x="678.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">креслити схему</text>
<text x="678.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на папері,</text>
<text x="678.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">різати фотошаблон</text>
<rect x="40.0" y="290.0" width="840.0" height="100.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2" rx="12"/>
