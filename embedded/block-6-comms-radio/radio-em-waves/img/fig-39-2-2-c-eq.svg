<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зв'язок: c = λ · f (швидкість світла стала)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">оскільки c незмінна, частота й довжина хвилі — обернено пропорційні: одне росте, інше падає</text>
<text x="450.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">c = λ · f</text>
<text x="450.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(швидкість світла = довжина хвилі × частота)</text>
<line x1="270.0" y1="248.0" x2="630.0" y2="212.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<circle cx="450.0" cy="250.0" r="8.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<circle cx="300.0" cy="263.0" r="24.0" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="300.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">f↑</text>
<circle cx="600.0" cy="197.0" r="24.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="600.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">λ↓</text>
<text x="300.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вища частота</text>
<text x="600.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">коротша хвиля</text>
<text x="700.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">λ = c / f</text>
<rect x="60.0" y="290.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Знаєш частоту — одразу знаєш довжину хвилі: λ = c / f. І навпаки.</text>
</svg>
