<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний компроміс: частота міняє ВСЕ — дальність, стіни, антену, швидкість</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама хвиля; та підняв частоту — виграв швидкість і малу антену, програв дальність і проникність</text>
<line x1="110.0" y1="110.0" x2="810.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="110.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">НИЗЬКА частота (довга λ)</text>
<text x="810.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">ВИСОКА частота (коротка λ)</text>
<text x="102.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">дальність</text>
<text x="140.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">далеко</text>
<text x="800.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">близько</text>
<line x1="110.0" y1="150.0" x2="810.0" y2="150.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="102.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">крізь стіни</text>
<text x="140.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">проходить</text>
<text x="800.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">блокується</text>
<line x1="110.0" y1="200.0" x2="810.0" y2="200.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="102.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">розмір антени</text>
<text x="140.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">велика</text>
<text x="800.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">крихітна</text>
<line x1="110.0" y1="250.0" x2="810.0" y2="250.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="102.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">швидкість даних</text>
<text x="140.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">мала</text>
<text x="800.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">велика</text>
<line x1="110.0" y1="300.0" x2="810.0" y2="300.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<rect x="60.0" y="330.0" width="800.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Немає «найкращої» частоти — є компроміс: дальність і проникність ПРОТИ швидкості й розміру.</text>
<text x="460.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усі ці залежності — наслідки одного: довша хвиля краще огинає й проникає (§39.3), але потребує більшої антени (§39.2).</text>
</svg>
