<rect x="700.0" y="150.0" width="130.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="765.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">приймач</text>
<text x="765.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вловлює крихту</text>
<rect x="60.0" y="246.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">До приймача долітає лише КРИХІТНА частка енергії (більшість розходиться навсібіч — §39.6).</text>
<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та цього досить: приймач підсилює слабкий сигнал. Радіо — це передавання енергії без дроту.</text>
<text x="450.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Те саме світло Сонця гріє Землю — теж енергія, принесена хвилею.)</text>
</svg>
