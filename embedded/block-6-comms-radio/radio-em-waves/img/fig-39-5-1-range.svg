<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому логарифм: потужності радіо різняться в ТРИЛЬЙОНИ разів</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">передавач — близько вата, чутливість приймача — піковати; лінійні числа тут незручні</text>
<line x1="110.0" y1="180.0" x2="810.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="180.0" x2="110.0" y2="173.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="110.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10⁻¹³ Вт</text>
<text x="110.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">чутливість RX</text>
<line x1="325.4" y1="180.0" x2="325.4" y2="173.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="325.4" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10⁻⁹</text>
<line x1="486.9" y1="180.0" x2="486.9" y2="173.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="486.9" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10⁻⁶</text>
<text x="486.9" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 мкВт</text>
<line x1="648.5" y1="180.0" x2="648.5" y2="173.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="648.5" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10⁻³</text>
<text x="648.5" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 мВт</text>
<line x1="810.0" y1="180.0" x2="810.0" y2="173.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="810.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1 Вт</text>
<text x="810.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">передавач</text>
<text x="460.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">розмах ≈ 13 порядків (× 10 000 000 000 000)</text>
<rect x="60.0" y="256.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Записувати «0.000000000001 Вт» незручно й помилконебезпечно. Логарифм стискає це в зручні числа.</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому в радіо все міряють у ДЕЦИБЕЛАХ — логарифмічних відношеннях.</text>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Та сама логіка, що й логарифмічна шкала гучності звуку.)</text>
</svg>
