<text x="450.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Маленька «m» = «відносно 1 мВт». Передавач +20 dBm = 100 мВт; чутливий приймач ловить аж −90 dBm.</text>
