<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">із позначкою початку, довжиною й контрольною сумою — щоб знати межі й цілість.</text>
