<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Формат кадру й запис «8N1»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три параметри кадру стискають у короткий код: біти даних, парність, стоп-біти</text>
<text x="170.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">8</text>
<text x="220.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<text x="265.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<line x1="170.0" y1="124.0" x2="170.0" y2="150.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="220.0" y1="124.0" x2="220.0" y2="150.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="265.0" y1="124.0" x2="265.0" y2="150.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<text x="150.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">біт даних (5–9, типово 8)</text>
<text x="150.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">парність: N-нема / E-парна / O-непарна</text>
<text x="150.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">стоп-біти: 1 / 1.5 / 2</text>
<rect x="470.0" y="96.0" width="390.0" height="230.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="486.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">типові формати</text>
<text x="486.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">8N1</text>
<text x="540.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">8 даних, без парності, 1 стоп</text>
<text x="540.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">стандарт де-факто (10 біт/байт)</text>
<text x="486.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">7E1</text>
<text x="540.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">7 даних, парна парність, 1 стоп</text>
<text x="540.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">класичний ASCII-текст</text>
<text x="486.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">8E1</text>
<text x="540.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">8 даних, парна парність, 1 стоп</text>
<text x="540.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">коли треба контроль помилок</text>
<text x="486.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">8N2</text>
<text x="540.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">8 даних, без парності, 2 стоп</text>
<text x="540.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">трохи більший запас на синхрон</text>
<rect x="60.0" y="360.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="383.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обидві сторони мусять збігтися у ВСІХ трьох параметрах, не лише у baud.</text>
<text x="450.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«115200 8N1» — повний опис лінії: швидкість + формат кадру.</text>
