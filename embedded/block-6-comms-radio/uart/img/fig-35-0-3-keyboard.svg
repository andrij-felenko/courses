<rect x="60.0" y="456.0" width="760.0" height="48.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тут уперше не людина диктує темп, а апарат: дисципліна такту — прямий предок «тактованого» обміну.</text>
<text x="440.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Розподільник на тому кінці читав ці 5 одиниць строго у свої моменти — звідси й сувора рівномірність.</text>
