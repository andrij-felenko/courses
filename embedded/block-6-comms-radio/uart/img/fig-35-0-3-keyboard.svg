<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ліва рука — 2 клавіші, права — 3; літера = комбінація натиснень у такт «кадансу»</text>
