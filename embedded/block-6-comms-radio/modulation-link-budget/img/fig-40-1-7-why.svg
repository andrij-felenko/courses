<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320">
<rect width="920" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо модуляція: три причини в одному погляді</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе зводиться до того, що низькочастотне повідомлення саме по собі радіо не зробить</text>
<rect x="45.0" y="88.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="183.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📡</text>
<text x="183.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Реальна антена</text>
<text x="183.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Висока несуча → коротка λ →</text>
<text x="183.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">антена в сантиметри-метри, а не</text>
<text x="183.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кілометри.</text>
<rect x="335.0" y="88.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="473.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🔢</text>
<text x="473.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Спільний ефір</text>
<text x="473.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кожній станції — своя несуча;</text>
<text x="473.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">десятки сигналів уживаються, не</text>
<text x="473.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">глушачи одне одного.</text>
<rect x="625.0" y="88.0" width="277.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="763.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🎯</text>
<text x="763.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Під середовище</text>
<text x="763.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Несучу обирають під діапазон:</text>
<text x="763.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дальність, проникність, вільні</text>
<text x="763.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">смуги (§39.4).</text>
</svg>
