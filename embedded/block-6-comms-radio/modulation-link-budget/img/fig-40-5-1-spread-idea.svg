<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама потужність, але розкидана так тонко, що ледь вища за шум — зате стійка й непомітна</text>
