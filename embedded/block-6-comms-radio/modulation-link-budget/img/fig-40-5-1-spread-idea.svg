<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дивно, але корисно: ширша смуга тут — не заради швидкості, а заради надійності й скритності.</text>
