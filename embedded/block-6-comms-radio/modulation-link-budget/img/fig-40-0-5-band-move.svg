<line x1="250.0" y1="205.0" x2="250.0" y2="215.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="250.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">50 МГц</text>
