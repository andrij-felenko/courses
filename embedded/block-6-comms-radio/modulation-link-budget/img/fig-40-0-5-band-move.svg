<text x="180.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">42–50 МГц</text>
<text x="180.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тут було радіо Армстронга</text>
<rect x="560.0" y="164.0" width="240.0" height="36.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="680.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">нова FM (досі!)</text>
<text x="680.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">88–108 МГц</text>
<line x1="255.0" y1="182.0" x2="555.0" y2="182.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="405.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">примусовий зсув</text>
<text x="180.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">на колишню смугу зайшло ТБ</text>
<line x1="180.0" y1="248.0" x2="180.0" y2="218.0" stroke="#b08900" stroke-width="1.8" marker-end="url(#aAmb)"/>
<rect x="60.0" y="280.0" width="800.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="460.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок: ~півмільйона FM-приймачів і станції Армстронга стали непотребом за одну ніч.</text>
<text x="460.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це й досі причина, чому ваша FM-шкала — саме 88–108 МГц. Технічне рішення, ухвалене у війні корпорацій.</text>
