<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Удар 1945-го: FCC переносить FM-діапазон — і вбиває його</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">під тиском RCA смугу зсунули; усі наявні FM-приймачі та передавачі Армстронга — мертві за ніч</text>
<line x1="70.0" y1="210.0" x2="850.0" y2="210.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="205.0" x2="110.0" y2="215.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
