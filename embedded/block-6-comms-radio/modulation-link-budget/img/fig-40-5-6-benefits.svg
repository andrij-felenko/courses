<text x="180.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🛡️</text>
<text x="180.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Стійкість до завад</text>
<text x="180.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Вузька завада чи глушилка псує</text>
