<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
<rect width="900" height="350" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний компроміс: надійність ↔ швидкість</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що більше точок у сузір'ї, то швидше — але то сильніший потрібен сигнал</text>
<line x1="80.0" y1="250.0" x2="840.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="80.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">надійно / повільно</text>
<text x="840.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">швидко / крихко</text>
<line x1="130.0" y1="250.0" x2="130.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<circle cx="130.0" cy="160.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="130.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FSK</text>
<text x="130.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">BPSK</text>
<line x1="320.0" y1="250.0" x2="320.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<circle cx="320.0" cy="160.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="320.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">QPSK</text>
<line x1="510.0" y1="250.0" x2="510.0" y2="160.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<circle cx="510.0" cy="160.0" r="6.0" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="510.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">16-QAM</text>
<line x1="660.0" y1="250.0" x2="660.0" y2="160.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<circle cx="660.0" cy="160.0" r="6.0" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="660.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">64-QAM</text>
<line x1="800.0" y1="250.0" x2="800.0" y2="160.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<circle cx="800.0" cy="160.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="800.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">256-QAM</text>
<text x="450.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">потрібний рівень сигналу (SNR) росте зліва направо →</text>
<rect x="60.0" y="290.0" width="780.0" height="50.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сучасні лінії (Wi-Fi, LTE) міняють модуляцію НА ЛЬОТУ: близько й чисто — 256-QAM;</text>
<text x="450.0" y="331.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">далеко чи завадно — падають до QPSK/BPSK. Це адаптивна модуляція.</text>
</svg>
