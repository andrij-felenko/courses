<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому звук не можна випромінювати напряму: антена</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ефективна антена має бути порядку λ/4; для низьких частот це кілометри</text>
<rect x="40.0" y="80.0" width="410.0" height="300.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="245.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Звук напряму: 3 кГц</text>
<text x="245.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">λ = c / f = 3×10⁸ / 3×10³ = 100 км</text>
<text x="245.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">λ/4 ≈ 25 км антени</text>
<line x1="245.0" y1="360.0" x2="245.0" y2="200.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="245.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9a9aa0" text-anchor="middle" font-weight="bold" font-style="normal">▲</text>
<circle cx="330.0" cy="350.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="330.0" y1="355.0" x2="330.0" y2="368.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="355.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">людина</text>
<text x="245.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">25 км — вища за будь-яку вежу. Нереально.</text>
<rect x="470.0" y="80.0" width="410.0" height="300.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="675.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">На несучій: 100 МГц</text>
<text x="675.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">λ = 3×10⁸ / 10⁸ = 3 м</text>
<text x="675.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">λ/4 = 0.75 м — паличка</text>
<line x1="675.0" y1="360.0" x2="675.0" y2="300.0" stroke="#9a9aa0" stroke-width="3" stroke-linecap="round"/>
<text x="675.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a9aa0" text-anchor="middle" font-weight="bold" font-style="normal">▲</text>
<circle cx="720.0" cy="350.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="720.0" y1="355.0" x2="720.0" y2="368.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="745.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">людина</text>
<text x="675.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">75 см — звичайна антена. Реально!</text>
</svg>
