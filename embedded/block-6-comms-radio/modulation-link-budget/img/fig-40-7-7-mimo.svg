<text x="450.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так Wi-Fi і 5G перетворили колишнього ворога на джерело швидкості. Антени — у Розділі 41.</text>
