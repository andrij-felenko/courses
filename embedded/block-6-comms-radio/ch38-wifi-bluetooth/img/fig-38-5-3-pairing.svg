<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спарювання: встановити довіру один раз</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перш ніж обмінюватися даними, пристрої «знайомляться» — і запам'ятовують одне одного</text>
<rect x="50.0" y="110.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="147.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1. ВИЯВЛЕННЯ</text>
<text x="147.5" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">знайти пристрій</text>
<text x="147.5" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у списку поруч</text>
<line x1="245.0" y1="155.0" x2="263.0" y2="155.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="263.0" y="110.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="360.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">2. КЛЮЧ</text>
<text x="360.5" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ввести PIN (0000/1234)</text>
<text x="360.5" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чи звірити число</text>
<line x1="458.0" y1="155.0" x2="476.0" y2="155.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="476.0" y="110.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="573.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3. ДОВІРА</text>
<text x="573.5" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обмін ключами —</text>
<text x="573.5" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тепер вони «свої»</text>
<line x1="671.0" y1="155.0" x2="689.0" y2="155.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="689.0" y="110.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="786.5" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4. ПАМ'ЯТЬ</text>
<text x="786.5" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">наступного разу</text>
<text x="786.5" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з'єднаються самі</text>
<rect x="60.0" y="244.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спарювання — це безпека: лише довірені пристрої отримують доступ, і ключ зберігається.</text>
<text x="450.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому смартфон «бачить» гарнітуру одразу — вони спарені раніше й пам'ятають одне одного.</text>
</svg>
