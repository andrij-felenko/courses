<rect x="482.0" y="158.0" width="80.0" height="44.0" rx="5" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="522.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Zigbee</text>
<rect x="611.6" y="158.0" width="80.0" height="44.0" rx="5" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="651.6" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мікрохвильовка</text>
