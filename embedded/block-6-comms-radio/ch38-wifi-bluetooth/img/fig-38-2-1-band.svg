<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Смуга 2.4 ГГц: безліцензійна — тому переповнена</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ISM-смуга (промислова/наукова/медична) вільна для всіх у світі, тож сюди набилися всі підряд</text>
<rect x="90.0" y="150.0" width="720.0" height="60.0" rx="4" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="90.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">2.400 ГГц</text>
<text x="810.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">2.4835 ГГц</text>
<rect x="136.4" y="158.0" width="80.0" height="44.0" rx="5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="176.4" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Wi-Fi</text>
<rect x="323.6" y="158.0" width="80.0" height="44.0" rx="5" fill="#ffffff" stroke="#0a3d91" stroke-width="1.6"/>
