<text x="450.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">усі тиснуться в ту саму смугу</text>
<rect x="60.0" y="268.0" width="780.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Безліцензійна» означає «нічия» — користуватися можна без дозволу, але й захисту від сусідів немає.</text>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси головна біда 2.4 ГГц — теснота й завади: Wi-Fi, Bluetooth і навіть піч ділять одне небо.</text>
