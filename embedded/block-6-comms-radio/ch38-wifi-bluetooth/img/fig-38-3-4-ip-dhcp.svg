<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">IP-адреси: роутер сам роздає їх (DHCP)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">приєднавшись, кожен пристрій отримує адресу в локальній мережі — за нею його й знаходять</text>
<rect x="360.0" y="100.0" width="180.0" height="70.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="450.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">роутер (DHCP)</text>
<text x="450.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">192.168.1.1</text>
<text x="450.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">шлюз (gateway)</text>
<rect x="55.0" y="226.0" width="130.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="120.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">телефон</text>
<text x="120.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">192.168.1.10</text>
<line x1="450.0" y1="172.0" x2="120.0" y2="224.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<rect x="315.0" y="226.0" width="130.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="380.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ноутбук</text>
<text x="380.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">192.168.1.11</text>
<line x1="450.0" y1="172.0" x2="380.0" y2="224.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<rect x="575.0" y="226.0" width="130.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="640.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32</text>
<text x="640.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">192.168.1.12</text>
<line x1="450.0" y1="172.0" x2="640.0" y2="224.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="450.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">роздає адреси .10, .11, .12 …</text>
<rect x="60.0" y="296.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Локальні адреси 192.168.x.x видає роутер автоматично; .1 зазвичай він сам (шлюз у інтернет).</text>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому IP пристрою може МІНЯТИСЯ при переприєднанні — для сталості задають фіксовану адресу.</text>
</svg>
