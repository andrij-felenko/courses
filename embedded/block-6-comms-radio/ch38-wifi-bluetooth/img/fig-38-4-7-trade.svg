<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий вибір, що й у радіо — тепер у коді</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«надійно vs швидко» (§38.1) на рівні мережі стає TCP vs UDP — і обирається класом у бібліотеці</text>
<rect x="80.0" y="96.0" width="360.0" height="130.0" rx="8" fill="#1e2330" stroke="#111" stroke-width="1.6"/>
<text x="100.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// надійно (TCP)</text>
<text x="100.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">WiFiClient tcp;</text>
<text x="100.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="normal" font-style="normal">tcp.connect(ip, 1883);</text>
<text x="100.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="normal" font-style="normal">tcp.print(data);</text>
<text x="100.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// з'єднання, ACK — усе сховано</text>
<rect x="470.0" y="96.0" width="380.0" height="130.0" rx="8" fill="#1e2330" stroke="#111" stroke-width="1.6"/>
<text x="490.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// швидко (UDP)</text>
<text x="490.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffd479" text-anchor="start" font-weight="bold" font-style="normal">WiFiUDP udp;</text>
<text x="490.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#ffd479" text-anchor="start" font-weight="normal" font-style="normal">udp.beginPacket(ip, port);</text>
<text x="490.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#ffd479" text-anchor="start" font-weight="normal" font-style="normal">udp.write(data); udp.endPacket();</text>
<text x="490.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// шлеш і не чекаєш</text>
<rect x="60.0" y="246.0" width="780.0" height="76.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама дилема проходить через увесь зв'язок: ACK-надійність коштує затримки, її швидкість — втрат.</text>
<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Обирай транспорт за природою даних, а не «про всяк випадок надійно».</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Часто беруть і те, й те: команди по TCP, потік телеметрії по UDP.)</text>
</svg>
