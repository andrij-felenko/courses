  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">TCP проти UDP: два транспорти поверх IP</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це знову той самий вибір «надійно vs швидко» з §38.1 — лише на рівні мережі</text>
<rect x="100.0" y="92.0" width="700.0" height="32.0" rx="6" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="116.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ознака</text>
<text x="430.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">TCP</text>
<text x="660.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">UDP</text>
<rect x="100.0" y="124.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">з'єднання</text>
<text x="430.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">так (рукостискання)</text>
<text x="660.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">ні (просто шлеш)</text>
<rect x="100.0" y="162.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">доставка</text>
<text x="430.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">гарантована</text>
<text x="660.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">як вийде (втрати)</text>
<rect x="100.0" y="200.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">порядок</text>
<text x="430.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">по порядку</text>
<text x="660.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">може плутатись</text>
<rect x="100.0" y="238.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">швидкість/затримка</text>
<text x="430.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">повільніше, джитер</text>
<text x="660.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">швидко, мала затримка</text>
<rect x="100.0" y="276.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">накладні витрати</text>
<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">більші</text>
<text x="660.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">мінімальні</text>
<rect x="100.0" y="314.0" width="700.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="116.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">модель</text>
<text x="430.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">потік байтів</text>
<text x="660.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">окремі датаграми</text>
<rect x="60.0" y="348.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="373.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">TCP — як надійна служба доставки з підписом; UDP — як кинути листівку в скриньку: швидко й без гарантій.</text>
</svg>
