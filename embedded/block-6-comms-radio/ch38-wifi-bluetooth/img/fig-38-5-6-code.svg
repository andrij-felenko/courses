<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У коді: SerialBT майже не відрізняється від Serial</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">хто вмів працювати з UART (§35), той одразу вміє і з Bluetooth SPP</text>
<rect x="120.0" y="92.0" width="660.0" height="150.0" rx="10" fill="#1e2330" stroke="#111" stroke-width="1.6"/>
<text x="140.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">#include "BluetoothSerial.h"</text>
<text x="140.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">BluetoothSerial SerialBT;</text>
<text x="140.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SerialBT.begin("ESP32-robot");   // ім'я в списку Bluetooth</text>
<text x="140.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SerialBT.println("привіт з ESP32");  // як Serial.println</text>
<text x="140.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">if (SerialBT.available()) c = SerialBT.read();  // як Serial.read</text>
<rect x="60.0" y="260.0" width="780.0" height="48.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спар із телефона, відкрий Bluetooth-термінал — і шли/приймай байти, як по дроту.</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жодних антен і модуляції в коді — лише знайомий потік print/read.</text>
</svg>
