<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Телефонні застосунки легко читають стандартні GATT-сервіси (пульс, батарея) без жодного коду.</text>
