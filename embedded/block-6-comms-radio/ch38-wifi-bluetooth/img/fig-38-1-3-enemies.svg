<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому радіо ненадійне: що псує сигнал у дорозі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки сигнал летить від передавача до приймача, його тіснять відстань, перешкоди, завади й шум</text>
<rect x="60.0" y="150.0" width="90.0" height="60.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="105.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">TX</text>
