<line x1="300.0" y1="180.0" x2="300.0" y2="230.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="300.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стіна/перешкода</text>
<text x="300.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">поглинає</text>
<line x1="430.0" y1="180.0" x2="430.0" y2="230.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="430.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">відстань</text>
<text x="430.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">слабшає</text>
<line x1="560.0" y1="180.0" x2="560.0" y2="230.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="560.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">інше радіо</text>
<text x="560.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">завада/колізія</text>
<line x1="660.0" y1="180.0" x2="660.0" y2="230.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="660.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">відбиття</text>
<text x="660.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">багатопроменевість</text>
<text x="470.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сигнал слабшає й спотворюється</text>
<rect x="60.0" y="290.0" width="780.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жоден із цих ворогів не діє на дріт — а в повітрі вони є завжди й змінюються щомиті.</text>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Підсумок: частина бітів спотворюється, а цілі пакети просто ЗНИКАЮТЬ — це норма радіо, не аварія.</text>
</svg>
