<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розділяй: критичні команди з ACK, потік — best-effort</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне має дійти напевно (і повторюй, поки не підтвердять), інше можна й загубити</text>
<rect x="70.0" y="92.0" width="360.0" height="180.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="250.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">критичні — з ACK + ретраї</text>
<circle cx="96.0" cy="150.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«увімкнути мотори» (arm)</text>
<circle cx="96.0" cy="178.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«вимкнути» (disarm)</text>
<circle cx="96.0" cy="206.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зміна режиму</text>
<circle cx="96.0" cy="234.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ повторюй, поки не підтвердять</text>
<rect x="470.0" y="92.0" width="380.0" height="180.0" rx="12" fill="#fbf3df" stroke="#b08900" stroke-width="2"/>
<text x="660.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">потік — best-effort</text>
<circle cx="496.0" cy="150.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="510.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">телеметрія (часто оновлюється)</text>
<circle cx="496.0" cy="178.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="510.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">позиція, кут, заряд</text>
<circle cx="496.0" cy="206.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="510.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відеопотік</text>
<circle cx="496.0" cy="234.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="510.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ загубилось — байдуже, прийде свіже</text>
<rect x="60.0" y="288.0" width="780.0" height="40.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="450.0" y="313.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не плати за надійність там, де вона не потрібна, і не економ на ній там, де команда мусить дійти.</text>
</svg>
