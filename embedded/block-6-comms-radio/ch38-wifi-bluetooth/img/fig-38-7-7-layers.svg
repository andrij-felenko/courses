<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три шари надійності — і підсумок бездротового</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен шар ловить свій клас бід; разом вони дають передбачуваний пристрій на ненадійному радіо</text>
<rect x="120.0" y="96.0" width="660.0" height="46.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">стек радіо</text>
<text x="310.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ретраї ОКРЕМИХ пакетів (CRC, ACK) — сховано</text>
<rect x="120.0" y="152.0" width="660.0" height="46.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="150.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">твій протокол</text>
<text x="310.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">номери послідовності + слати СТАН, а не приріст</text>
<rect x="120.0" y="208.0" width="660.0" height="46.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="150.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">твій застосунок</text>
<text x="310.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">серцебиття, таймаут і FAILSAFE на повну втрату</text>
<line x1="450.0" y1="142.0" x2="450.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="450.0" y1="198.0" x2="450.0" y2="208.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="60.0" y="268.0" width="780.0" height="76.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіо ненадійне за визначенням — тож надійність будують ШАРАМИ, а не сподіваються на «гарний сигнал».</text>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Це підсумок усього розділу: зручні Wi-Fi/Bluetooth ховають фізику, але failsafe лишається за тобою.</text>
<text x="450.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Далі — сама фізика радіохвиль: що ж насправді летить «по повітрю».</text>
</svg>
