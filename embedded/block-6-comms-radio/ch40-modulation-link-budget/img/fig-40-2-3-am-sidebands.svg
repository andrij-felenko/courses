  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спектр AM: несуча плюс дві бічні смуги</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тон fₘ породжує лінії на fₒ та fₒ ± fₘ; уся інформація — у бічних смугах</text>
<line x1="80.0" y1="250.0" x2="820.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="820.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">частота</text>
<line x1="450.0" y1="250.0" x2="450.0" y2="100.0" stroke="#1f47b5" stroke-width="4" stroke-linecap="round"/>
<text x="450.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">несуча fₒ</text>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">fₒ</text>
<line x1="320.0" y1="250.0" x2="320.0" y2="180.0" stroke="#c0271e" stroke-width="4" stroke-linecap="round"/>
<line x1="580.0" y1="250.0" x2="580.0" y2="180.0" stroke="#c0271e" stroke-width="4" stroke-linecap="round"/>
<text x="320.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">fₒ−fₘ</text>
<text x="580.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">fₒ+fₘ</text>
<text x="320.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">бічна</text>
<text x="580.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">бічна</text>
<line x1="320.0" y1="140.0" x2="580.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="320.0" y1="145.0" x2="320.0" y2="135.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="580.0" y1="145.0" x2="580.0" y2="135.0" stroke="#1f8a3b" stroke-width="1.6" stroke-linecap="round"/>
<text x="450.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">смуга = 2·fₘ</text>
<rect x="60.0" y="306.0" width="780.0" height="70.0" rx="9" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: несуча 1000 кГц + тон 5 кГц → лінії 995, 1000, 1005 кГц; смуга = 10 кГц.</text>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Несуча — половина-дві третини потужності, але інформації в ній нуль; вона лише «тримає» бічні смуги.</text>
</svg>
