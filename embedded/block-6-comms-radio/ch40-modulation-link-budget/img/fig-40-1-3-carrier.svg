<text x="460.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знаючи перший період, ти знаєш усе наперед → 0 інформації</text>
