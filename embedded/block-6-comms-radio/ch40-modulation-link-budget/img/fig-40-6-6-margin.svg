<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Запас лінії: ніколи не проєктуй «упритул»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">над чутливістю лишають резерв на завмирання, рух, дощ — інакше зв'язок «дихатиме» й рватиметься</text>
<line x1="360.0" y1="90.0" x2="360.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="350.0" y="96.0" width="20.0" height="144.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<rect x="350.0" y="240.0" width="20.0" height="0.0" rx="0" fill="none" stroke="none" stroke-width="0"/>
<line x1="344.0" y1="96.0" x2="376.0" y2="96.0" stroke="#1f8a3b" stroke-width="2.5" stroke-linecap="round"/>
<text x="334.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">P_rx = −62 дБм</text>
<text x="386.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">прийнятий сигнал</text>
<line x1="344.0" y1="150.0" x2="376.0" y2="150.0" stroke="#b08900" stroke-width="2.5" stroke-linecap="round"/>
<text x="334.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="end" font-weight="bold" font-style="normal">запас на завмирання</text>
<text x="386.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">10–20 дБ резерву (§40.7)</text>
<line x1="344.0" y1="240.0" x2="376.0" y2="240.0" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<text x="334.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">S_rx = −95 дБм</text>
<text x="386.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">поріг: нижче — зв'язку нема</text>
<line x1="510.0" y1="96.0" x2="510.0" y2="240.0" stroke="#1f47b5" stroke-width="1.8" stroke-linecap="round"/>
<line x1="505.0" y1="96.0" x2="515.0" y2="96.0" stroke="#1f47b5" stroke-width="1.8" stroke-linecap="round"/>
<line x1="505.0" y1="240.0" x2="515.0" y2="240.0" stroke="#1f47b5" stroke-width="1.8" stroke-linecap="round"/>
<text x="520.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">повний запас 33 дБ</text>
<rect x="60.0" y="308.0" width="780.0" height="26.0" rx="7" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: тримай 10–20 дБ «зверху» на завмирання. Запас 0 дБ = зв'язок, що рветься від кожної хмари.</text>
