<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
<rect width="920" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Едвін Армстронг: геній, що подарував світу чисте радіо</text>
<text x="460.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три фундаментальні винаходи — і десятиліття патентних воєн, що його зламали</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="614.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="118.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="228.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1890</text>
<text x="276.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Народився в Нью-Йорку</text>
<text x="276.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">З дитинства одержимий радіо й горищними антенами</text>
<circle cx="250.0" cy="185.1" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="228.0" y="190.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1912</text>
<text x="276.0" y="182.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Регенеративна схема</text>
<text x="276.0" y="202.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Студент Columbia робить лампу гучною — і генератором хвиль</text>
<circle cx="250.0" cy="252.3" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="228.0" y="257.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1918</text>
<text x="276.0" y="249.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Супергетеродин</text>
<text x="276.0" y="269.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">На війні у Франції — архітектура кожного приймача й досі</text>
<circle cx="250.0" cy="319.4" r="10.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="250.0" cy="319.4" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="228.0" y="324.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1933</text>
<text x="276.0" y="316.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Широкосмугова FM</text>
<text x="276.0" y="336.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чотири патенти на радикально нову, безшумну модуляцію</text>
<circle cx="250.0" cy="386.6" r="10.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="250.0" cy="386.6" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="228.0" y="391.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1935</text>
<text x="276.0" y="383.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Демонстрація FM</text>
<text x="276.0" y="403.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Наживо: радіо без статики — слухачі не вірять вухам</text>
<rect x="242.0" y="445.7" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="228.0" y="458.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1945</text>
<text x="276.0" y="450.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">FCC переносить FM</text>
<text x="276.0" y="470.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Тиск RCA: смугу зсунуто — пів мільйона приймачів мертві за ніч</text>
<rect x="242.0" y="512.9" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="228.0" y="525.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1954</text>
<text x="276.0" y="517.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Трагічний кінець</text>
<text x="276.0" y="537.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Розорений судами, зломлений — стрибає з 13-го поверху</text>
<circle cx="250.0" cy="588.0" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="228.0" y="593.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1954–67</text>
<text x="276.0" y="585.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Посмертне виправдання</text>
<text x="276.0" y="605.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Вдова Меріон виграє ВСІ 21 позов: RCA, Motorola, Zenith</text>
</svg>
