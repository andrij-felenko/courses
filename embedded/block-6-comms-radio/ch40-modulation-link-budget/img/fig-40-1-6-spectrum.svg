<text x="460.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ширина «горба» навколо несучої — це смуга сигналу; вона зростає зі швидкістю даних (про це §40.4).</text>
