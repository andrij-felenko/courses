<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стіна Шеннона: межа можливого й неможливого</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нижче межі — є кодування, що дає зв'язок майже без помилок; вище — жодне не врятує</text>
<rect x="120.0" y="90.0" width="409.2" height="170.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="324.6" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">МОЖЛИВО</text>
<text x="324.6" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зв'язок без помилок (з кодуванням)</text>
<rect x="529.2" y="90.0" width="250.8" height="170.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="654.6" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">НЕМОЖЛИВО</text>
<text x="654.6" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за жодних хитрощів</text>
<line x1="529.2" y1="78.0" x2="529.2" y2="272.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="529.2" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C = B·log₂(1+S/N)</text>
<text x="450.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інженер може підійти до межі скільзавгодно близько — але не перетнути її.</text>
</svg>
