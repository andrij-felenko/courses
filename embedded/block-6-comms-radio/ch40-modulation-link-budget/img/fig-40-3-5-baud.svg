<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бод проти біт/с: чому це не одне й те саме</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">бод — символів за секунду; біт/с = бод × (біт/символ)</text>
<text x="450.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">бітова швидкість = символьна швидкість (бод) × log₂M</text>
<text x="450.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">приклад: символьна швидкість 1 Мбод (термін «бод» — із Розділу 35)</text>
<text x="135.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">BPSK</text>
<rect x="245.0" y="150.0" width="120.0" height="34.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="377.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 1 Мбод × 1 = 1 Мбіт/с</text>
<text x="135.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">QPSK</text>
<rect x="245.0" y="200.0" width="240.0" height="34.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="497.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 1 Мбод × 2 = 2 Мбіт/с</text>
<text x="135.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">16-QAM</text>
<rect x="245.0" y="250.0" width="480.0" height="34.0" rx="5" fill="#fbf3df" stroke="#b08900" stroke-width="1.8"/>
<text x="737.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 1 Мбод × 4 = 4 Мбіт/с</text>
<rect x="60.0" y="300.0" width="780.0" height="30.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама смуга (1 Мбод) — а біт/с різні: ось як ущільнення символів прискорює лінію.</text>
</svg>
