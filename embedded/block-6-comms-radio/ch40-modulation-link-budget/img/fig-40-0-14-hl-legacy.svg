<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що лишилось: ідея — всюди, а урок — подвійний</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">її стрибки частоти живуть у кожному радіо, а доля — застерігає від упереджень</text>
<rect x="45.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="180.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📡</text>
<text x="180.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Ідея — у кишені</text>
<text x="180.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Стрибки частоти (§40.5) —</text>
<text x="180.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">серце Bluetooth; родинні</text>
<text x="180.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">техніки — у Wi-Fi, GPS.</text>
<rect x="335.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="470.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">⚖️</text>
<text x="470.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Кредит — чесно</text>
<text x="470.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Видатна попередниця, чий</text>
<text x="470.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">внесок стерли; не «винайшла</text>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">все», але й не «ніщо».</text>
<rect x="625.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="760.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">👤</text>
<text x="760.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Урок — про упередження</text>
<text x="760.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Талант не питає про</text>
<text x="760.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зовнішність чи фах:</text>
<text x="760.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">винахідником буває й</text>
<text x="760.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кінозірка.</text>
</svg>
