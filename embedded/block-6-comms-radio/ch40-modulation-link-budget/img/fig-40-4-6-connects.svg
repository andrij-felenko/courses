<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="900" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один закон під усім розділом</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усі модуляції, що ми бачили, — це різні способи торгувати смугою й потужністю в межах Шеннона</text>
<rect x="45.0" y="90.0" width="270.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="180.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FM (Армстронг)</text>
<text x="180.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">міняє СМУГУ на запас від</text>
<text x="180.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">шуму</text>
<text x="180.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ширше → тихіше</text>
<rect x="335.0" y="90.0" width="270.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="470.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">QAM / сузір'я</text>
<text x="470.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">міняє S/N на БІТИ за</text>
<text x="470.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">символ</text>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більше SNR → щільніше</text>
<rect x="625.0" y="90.0" width="270.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="760.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Розширений спектр</text>
<text x="760.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">міняє смугу на</text>
<text x="760.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стійкість/секретність</text>
<text x="760.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">далі — §40.5</text>
<rect x="60.0" y="256.0" width="780.0" height="30.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="450.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шеннон не дає рецепту «як», але ставить стелю «скільки» — і під цією стелею живе вся радіотехніка.</text>
</svg>
