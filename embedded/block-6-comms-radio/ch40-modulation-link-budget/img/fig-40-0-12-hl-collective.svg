<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
<rect width="900" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесно: що належить їм, а що — ні (міф проти правди)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">віддати належне забутій винахідниці — і не вдатися в протилежний міф</text>
<rect x="50.0" y="84.0" width="800.0" height="98.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Їхня справжня заслуга</text>
<text x="70.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Конкретна, запатентована реалізація стрибків частоти (синхронізація піанолою, 88 частот)</text>
<text x="70.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">для незаглушуваної торпеди — сміливо й на десятиліття випереджаючи час.</text>
<rect x="50.0" y="192.0" width="800.0" height="98.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="70.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Чого вони НЕ робили</text>
<text x="70.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Стрибки частоти як ідея існували й раніше (ранні патенти, Тесла й інші).</text>
<text x="70.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Сучасний розширений спектр інженери розвинули значною мірою НЕЗАЛЕЖНО, у 1950–60-х.</text>
<rect x="50.0" y="300.0" width="800.0" height="98.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Тож міф «винайшла Wi-Fi»</text>
<text x="70.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перебільшення: прямої лінії «її патент → Wi-Fi» немає.</text>
<text x="70.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Правда тонша й чесніша — вона видатна ПОПЕРЕДНИЦЯ, чий внесок несправедливо стерли.</text>
</svg>
