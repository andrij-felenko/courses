<text x="460.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому в тебе є «налаштування на станцію»: ти обираєш, яку несучу слухати.</text>
