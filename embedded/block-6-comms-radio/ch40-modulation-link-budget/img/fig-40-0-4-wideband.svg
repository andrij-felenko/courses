<text x="462.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ширше</text>
<rect x="60.0" y="250.0" width="800.0" height="132.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ: інформація у FM — у ЧАСТОТІ. Тож приймач сміливо зрізає всі коливання амплітуди,</text>
<text x="460.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">а з ними — майже весь шум. Що ширша смуга (девіація), то глибше тоне шум.</text>
<text x="460.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Армстронг СВІДОМО «розтринькав» смугу — і виграв тишу. Це обмін: смуга ⇄ завадостійкість.</text>
<text x="460.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий обмін «смуга проти шуму» 1948-го формалізує Клод Шеннон —</text>
<text x="460.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ми торкнемося його межі у §40.4. Армстронг намацав цю істину руками, за 15 років до теорії.</text>
</svg>
