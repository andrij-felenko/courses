<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чесно про авторство: що безперечне, а що — спірне</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">винаходи рідко мають одного героя; розділімо доведене, спірне й чуже</text>
<rect x="50.0" y="86.0" width="820.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Широкосмугова FM</text>
<rect x="70.0" y="130.0" width="250.0" height="26.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="195.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Армстронг — безперечно</text>
<text x="345.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Концепція FM існувала; Карсон (1922) описав смугу, але вважав FM марною.</text>
<text x="345.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Саме Армстронг зробив її РОБОЧОЮ і довів цінність широкої смуги.</text>
<rect x="50.0" y="188.0" width="820.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="70.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Регенерація (1912)</text>
<rect x="70.0" y="232.0" width="250.0" height="26.0" rx="5" fill="#fbf3df" stroke="#b08900" stroke-width="1.4"/>
<text x="195.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">спірно — суд проти інженерів</text>
<text x="345.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Верховний суд США (1934) присудив пріоритет Лі де Форесту.</text>
<text x="345.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Більшість інженерів і досі вважають це помилкою суду; незалежно — Майснер у Німеччині.</text>
<rect x="50.0" y="290.0" width="820.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="70.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Супергетеродин</text>
<rect x="70.0" y="334.0" width="250.0" height="26.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="195.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Армстронг, але не на самоті</text>
<text x="345.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ідею перетворення частоти розробляли паралельно (зокрема Леві у Франції).</text>
<text x="345.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Армстронг дав практичну, працездатну архітектуру приймача.</text>
</svg>
