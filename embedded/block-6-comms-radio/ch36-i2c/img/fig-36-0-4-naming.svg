<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
<rect width="880" height="450" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сага імен: чому та сама шина зветься по-різному</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«I²C» — торгова марка Philips із ліцензійним збором; інші робили сумісне під своїми назвами</text>
<rect x="330.0" y="96.0" width="220.0" height="60.0" rx="10" fill="#f3f3f3" stroke="#1b1b1b" stroke-width="2"/>
<text x="440.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">та сама дворотова шина</text>
<text x="440.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">SDA + SCL, адреси, ACK</text>
<line x1="440.0" y1="156.0" x2="150.0" y2="214.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<rect x="40.0" y="216.0" width="220.0" height="110.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="150.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I²C</text>
<text x="150.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Philips / NXP</text>
<text x="150.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">оригінал; назва — торгова</text>
<text x="150.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">марка, за яку платили</text>
<line x1="440.0" y1="156.0" x2="440.0" y2="214.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<rect x="330.0" y="216.0" width="220.0" height="110.0" rx="10" fill="#fbf3df" stroke="#b08900" stroke-width="2"/>
<text x="440.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">TWI</text>
<text x="440.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Atmel (AVR)</text>
<text x="440.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«Two-Wire Interface» —</text>
<text x="440.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">щоб обійти ліцензію</text>
<line x1="440.0" y1="156.0" x2="730.0" y2="214.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<rect x="620.0" y="216.0" width="220.0" height="110.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="730.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SMBus</text>
<text x="730.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Intel (ПК)</text>
<text x="730.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">варіант I²C для керування</text>
<text x="730.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">живленням, суворіші таймінги</text>
<rect x="60.0" y="366.0" width="760.0" height="66.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому на даташиті AVR ти бачиш «TWI», а не «I²C» — це той самий протокол, лише без торгової назви.</text>
<text x="440.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сьогодні патенти згасли, плату за назву скасовано — лишився переважно логотип як марка.</text>
</svg>
