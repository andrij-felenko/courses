<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<rect width="900" height="660" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг рішень: від дротового жаху телевізора до двох ліній I2C</text>
<text x="450.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як потреба здешевити телевізор народила шину, що сьогодні скрізь — і чому в неї стільки імен</text>
<line x1="230.0" y1="96.0" x2="230.0" y2="632.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="230.0" cy="126.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">кінець 1970-х</text>
<text x="256.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Проблема в телевізорі</text>
<text x="256.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Цифрові чіпи витісняють аналог; кожному треба керування — а паралельних дротів НЕСТЕРПНО багато</text>
<circle cx="230.0" cy="221.2" r="10.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<circle cx="230.0" cy="221.2" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="208.0" y="226.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1982</text>
<text x="256.0" y="218.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Philips Labs, Ейндговен</text>
<text x="256.0" y="238.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Дві лінії на ВСІХ: SDA (дані) і SCL (такт); кожен чіп має власну адресу</text>
<circle cx="230.0" cy="316.4" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="321.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1980-ті</text>
<text x="256.0" y="313.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Торгова марка й ліцензія</text>
<text x="256.0" y="333.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Назву «I²C» зареєстровано; за право робити I²C-чіп і за адреси Philips бере плату</text>
<circle cx="230.0" cy="411.6" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="416.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1990-ті</text>
<text x="256.0" y="408.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">TWI та SMBus</text>
<text x="256.0" y="428.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Atmel зве ту саму шину «Two-Wire Interface», Intel робить варіант SMBus — щоб обійти збір</text>
<circle cx="230.0" cy="506.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="511.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2006</text>
<text x="256.0" y="503.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">NXP і згасання патентів</text>
<text x="256.0" y="523.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Philips виокремлює NXP; згодом плату за назву скасовують, патенти спливають</text>
<rect x="222.0" y="594.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="208.0" y="607.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 36</text>
<text x="256.0" y="599.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Шина I2C сьогодні</text>
<text x="256.0" y="619.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Ті самі два дроти: давачі, дисплеї, годинники реального часу — як із ними «заговорити»</text>
</svg>
