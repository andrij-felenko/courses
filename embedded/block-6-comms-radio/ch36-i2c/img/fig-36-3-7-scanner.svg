<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I2C-сканер: «гукнути» кожну адресу й глянути, хто відгукнеться</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найперший інструмент налагодження: перебрати 0x08…0x77 і записати, хто дав ACK</text>
<rect x="120.0" y="90.0" width="360.0" height="230.0" rx="10" fill="#1e2330" stroke="#111" stroke-width="2"/>
<text x="140.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7fd0ff" text-anchor="start" font-weight="bold" font-style="normal">Scanning I2C bus...</text>
<text x="140.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="normal" font-style="normal">found device at 0x3C</text>
<text x="140.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="normal" font-style="normal">found device at 0x68</text>
<text x="140.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="normal" font-style="normal">found device at 0x76</text>
<text x="140.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e8e8e8" text-anchor="start" font-weight="bold" font-style="normal">3 devices found.</text>
<text x="140.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7fd0ff" text-anchor="start" font-weight="bold" font-style="normal">_</text>
<rect x="520.0" y="90.0" width="300.0" height="230.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="670.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">як це працює</text>
<text x="540.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1. для кожної адреси —</text>
<text x="556.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">СТАРТ + адреса + W</text>
<text x="540.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">2. є ACK → пристрій є</text>
<text x="540.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">3. NACK → нікого нема</text>
<text x="540.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4. СТОП, наступна адреса</text>
<text x="540.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(нічого не пишемо в чіп —</text>
<text x="540.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic"> лише перевіряємо відгук)</text>
<rect x="60.0" y="336.0" width="760.0" height="36.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="440.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не знаєш адресу давача чи лінія «мовчить»? Запусти сканер — це перший крок налагодження I2C.</text>
</svg>
