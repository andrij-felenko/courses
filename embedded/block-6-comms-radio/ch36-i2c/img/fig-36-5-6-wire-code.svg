<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код (Arduino Wire) ↔ що діється на шині</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ключ — endTransmission(false): «false» означає повторний старт замість СТОПу</text>
<rect x="70.0" y="110.0" width="400.0" height="40.0" rx="6" fill="#1e2330" stroke="#111" stroke-width="1.4"/>
<text x="86.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">Wire.beginTransmission(0x68);</text>
<line x1="478.0" y1="130.0" x2="528.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<rect x="530.0" y="110.0" width="340.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="546.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">S + 0x68 + W</text>
<rect x="70.0" y="158.0" width="400.0" height="40.0" rx="6" fill="#1e2330" stroke="#111" stroke-width="1.4"/>
<text x="86.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">Wire.write(0x3B);</text>
<line x1="478.0" y1="178.0" x2="528.0" y2="178.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<rect x="530.0" y="158.0" width="340.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="546.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">№ рег. 0x3B + A</text>
<rect x="70.0" y="206.0" width="400.0" height="40.0" rx="6" fill="#1e2330" stroke="#111" stroke-width="1.4"/>
<text x="86.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">Wire.endTransmission(false);</text>
<line x1="478.0" y1="226.0" x2="528.0" y2="226.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
