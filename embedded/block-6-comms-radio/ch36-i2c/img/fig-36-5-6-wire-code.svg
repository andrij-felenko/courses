<text x="546.0" y="231.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">(БЕЗ СТОПу → буде Sr)</text>
<rect x="70.0" y="254.0" width="400.0" height="40.0" rx="6" fill="#1e2330" stroke="#111" stroke-width="1.4"/>
<text x="86.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">Wire.requestFrom(0x68, 2);</text>
<line x1="478.0" y1="274.0" x2="528.0" y2="274.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
