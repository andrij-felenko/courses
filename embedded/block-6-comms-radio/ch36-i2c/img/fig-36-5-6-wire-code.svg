<rect x="70.0" y="350.0" width="400.0" height="40.0" rx="6" fill="#1e2330" stroke="#111" stroke-width="1.4"/>
<text x="86.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">lo = Wire.read();</text>
