  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Універсальний рецепт «оживлення» будь-якого I2C-чіпа</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ті самі чотири кроки працюють майже для кожного давача</text>
<rect x="60.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="157.5" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1. СКАН</text>
<text x="157.5" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">знайти адресу</text>
<text x="157.5" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(§36.3)</text>
<line x1="255.0" y1="175.0" x2="285.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="285.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2.2"/>
<text x="382.5" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">2. WHO_AM_I</text>
<text x="382.5" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">звірити ID —</text>
<text x="382.5" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">це справді він?</text>
<line x1="480.0" y1="175.0" x2="510.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="510.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="607.5" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3. НАЛАШТУВАТИ</text>
<text x="607.5" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розбудити, задати</text>
<text x="607.5" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">діапазон, частоту</text>
<line x1="705.0" y1="175.0" x2="735.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="735.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="832.5" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4. ЧИТАТИ</text>
<text x="832.5" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пакетом виміри,</text>
<text x="832.5" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скласти й масштабувати</text>
<path d="M 832.5,220 C 832.5,270 910,270 910,222" fill="none" stroke="#1b1b1b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#aInk)"/>
<text x="832.5" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">повторювати в циклі</text>
<rect x="60.0" y="300.0" width="820.0" height="44.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="470.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перші три кроки — раз при старті; четвертий — у головному циклі стільки разів, скільки треба вимірів.</text>
</svg>
