<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому SPI швидкий: чотири причини разом</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожна окремо допомагає, а разом дають десятки мегагерц</text>
<rect x="55.0" y="110.0" width="205.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="157.5" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">двотактний вихід</text>
<text x="157.5" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">активно жене вгору й вниз →</text>
<text x="157.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">різкі фронти (не RC §36.2)</text>
<rect x="278.0" y="110.0" width="205.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="380.5" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">такт у дроті</text>
<text x="380.5" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не треба передискретизації</text>
<text x="380.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й ресинхрону, як у UART</text>
<rect x="501.0" y="110.0" width="205.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="603.5" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">мінімум протоколу</text>
<text x="603.5" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ні адрес, ні ACK, ні старт-стопу →</text>
<text x="603.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">8 тактів = 8 біт</text>
<rect x="724.0" y="110.0" width="205.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="826.5" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">окремі лінії</text>
<text x="826.5" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">MOSI й MISO роздільні →</text>
<text x="826.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повний дуплекс без міжлінійного перекосу</text>
<rect x="60.0" y="290.0" width="800.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="460.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підсумок: швидкі фронти + чесний такт + майже нуль накладних = найшвидша з простих шин.</text>
</svg>
