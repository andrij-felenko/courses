<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Характер SPI одним поглядом</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за що його люблять — і чим за це платять</text>
<rect x="70.0" y="90.0" width="380.0" height="200.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="260.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сильні сторони</text>
<circle cx="96.0" cy="144.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">швидко — десятки МГц</text>
<circle cx="96.0" cy="174.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повний дуплекс (туди й назад разом)</text>
<circle cx="96.0" cy="204.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">простий протокол, мала затримка</text>
<circle cx="96.0" cy="234.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="110.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">немає адрес і підтяжок</text>
<rect x="470.0" y="90.0" width="380.0" height="200.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="660.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ціна</text>
<circle cx="496.0" cy="144.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="510.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">більше дротів (3 + CS на кожного)</text>
<circle cx="496.0" cy="174.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="510.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">немає вбудованого ACK / контролю</text>
<circle cx="496.0" cy="204.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="510.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розрахований на КОРОТКІ відстані</text>
<circle cx="496.0" cy="234.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="510.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">немає стандарту на формат пакета</text>
<rect x="60.0" y="306.0" width="780.0" height="40.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="450.0" y="331.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коротко: SPI — про ШВИДКІСТЬ і простоту впритул; деталі ліній і режимів — у наступних темах.</text>
</svg>
