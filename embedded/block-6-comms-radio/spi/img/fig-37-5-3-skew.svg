<text x="460.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сигнал біжить ~15 см/нс по платі; при 50 МГц біт триває лише 20 нс.</text>
<text x="460.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Уже кілька десятків сантиметрів зсувають фронт відносно даних — і вибірка влучає в перехід.</text>
<text x="460.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому високошвидкісний SPI — це сантиметри на платі, а не метри по кабелю.</text>
