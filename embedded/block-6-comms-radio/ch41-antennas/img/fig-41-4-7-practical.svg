<rect x="60.0" y="198.0" width="360.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#b08900" stroke-width="1.5"/>
<text x="80.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">GPS, супутник</text>
<line x1="425.0" y1="220.0" x2="455.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="460.0" y="198.0" width="380.0" height="44.0" rx="8" fill="#f7f7f7" stroke="#b08900" stroke-width="1.5"/>
<text x="480.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">колова (RHCP) — орієнтація не важить</text>
<rect x="60.0" y="252.0" width="360.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.5"/>
<text x="80.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">FPV-дрон, що крутиться</text>
<line x1="425.0" y1="274.0" x2="455.0" y2="274.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="460.0" y="252.0" width="380.0" height="44.0" rx="8" fill="#f7f7f7" stroke="#c0271e" stroke-width="1.5"/>
<text x="480.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">колова — не «провалюється» в маневрі</text>
