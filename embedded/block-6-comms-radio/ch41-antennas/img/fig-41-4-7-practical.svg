<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поляризація на практиці: що коли брати</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">правило просте — нерухоме узгоджуй лінійно, рухоме й супутникове роби коловим</text>
<rect x="60.0" y="90.0" width="360.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="80.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Фіксований лінк точка-точка</text>
<line x1="425.0" y1="112.0" x2="455.0" y2="112.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="460.0" y="90.0" width="380.0" height="44.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="480.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">лінійна, узгоджена (обидві верт. або гор.)</text>
<rect x="60.0" y="144.0" width="360.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="80.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Міський/кімнатний зв'язок</text>
<line x1="425.0" y1="166.0" x2="455.0" y2="166.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="460.0" y="144.0" width="380.0" height="44.0" rx="8" fill="#f7f7f7" stroke="#1f47b5" stroke-width="1.5"/>
