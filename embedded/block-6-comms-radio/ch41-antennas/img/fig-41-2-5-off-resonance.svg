<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Неправильна довжина — антена «не резонує»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">закоротка → ємнісна, задовга → індуктивна; в обох випадках частину потужності відбито назад</text>
<rect x="60.0" y="92.0" width="250.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<line x1="185.0" y1="250.0" x2="185.0" y2="180.0" stroke="#9a9aa0" stroke-width="5" stroke-linecap="round"/>
<text x="185.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">закоротка</text>
<text x="185.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ємнісна (−jX)</text>
<text x="185.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">погано випромінює</text>
<rect x="330.0" y="92.0" width="250.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<line x1="455.0" y1="250.0" x2="455.0" y2="140.0" stroke="#9a9aa0" stroke-width="5" stroke-linecap="round"/>
<text x="455.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">саме λ/4 (λ/2)</text>
<text x="455.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">чистий R ≈ 73/36 Ом</text>
<text x="455.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">максимум випромінювання</text>
<rect x="600.0" y="92.0" width="250.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<line x1="725.0" y1="250.0" x2="725.0" y2="180.0" stroke="#9a9aa0" stroke-width="5" stroke-linecap="round"/>
<text x="725.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">задовга</text>
<text x="725.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">індуктивна (+jX)</text>
<text x="725.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">знову відбиття</text>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Відбита потужність повертається в передавач — про це й «коефіцієнт стійної хвилі» (КСХ) далі.</text>
</svg>
