<text x="250.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як рівна мотузка: хвиля вбирається без луни</text>
