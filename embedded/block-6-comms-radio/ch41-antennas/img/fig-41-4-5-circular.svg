<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">складемо дві схрещені хвилі зі зсувом 90° — і вектор E піде по спіралі (права чи ліва)</text>
