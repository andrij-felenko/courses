<text x="250.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Передавання (TX)</text>
<line x1="150.0" y1="150.0" x2="150.0" y2="250.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
