<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це принцип взаємності: антена — симетричний перетворювач, і її властивості тотожні для обох напрямів.</text>
