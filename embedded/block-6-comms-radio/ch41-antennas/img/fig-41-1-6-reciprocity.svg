<rect x="460.0" y="86.0" width="380.0" height="210.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Приймання (RX)</text>
