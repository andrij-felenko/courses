<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо колова: працює за будь-якого нахилу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">колова антена ловить лінійну під будь-яким кутом — лише −3 дБ, без глибокого провалу</text>
<rect x="45.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="180.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🧭</text>
<text x="180.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Будь-яка орієнтація</text>
<text x="180.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Колова чує лінійну хоч</text>
<text x="180.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вертикальну, хоч горизонтальну</text>
<text x="180.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— завжди ~−3 дБ, без нуля.</text>
<rect x="335.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="470.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🔄</text>
<text x="470.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Відсікає віддзеркалення</text>
<text x="470.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Відбиття перевертає «руку»</text>
<text x="470.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(RHCP↔LHCP) → антена його</text>
<text x="470.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">відкидає (плюс проти</text>
<text x="470.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">багатопроменевості).</text>
<rect x="625.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="760.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🛰️</text>
<text x="760.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">GPS і супутники</text>
<text x="760.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Супутник обертається відносно</text>
<text x="760.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тебе; колова (RHCP) знімає</text>
<text x="760.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">нулі неузгодження.</text>
