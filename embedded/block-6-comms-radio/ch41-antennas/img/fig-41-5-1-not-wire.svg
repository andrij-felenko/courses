<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На радіочастотах дріт — це не просто з'єднання</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли довжина дроту порівнянна з λ, сигнал біжить ним як ХВИЛЯ — напруга різна вздовж лінії</text>
<text x="230.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">низька частота / короткий дріт</text>
<line x1="110.0" y1="150.0" x2="350.0" y2="150.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="230.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">та сама напруга по всій довжині</text>
<text x="230.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">— просто «з'єднання»</text>
<text x="680.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВЧ / дріт ~ λ</text>
