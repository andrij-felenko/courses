<rect x="60.0" y="240.0" width="780.0" height="96.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Орієнтир: якщо довжина дроту більша за ~λ/10, його вже треба рахувати як ЛІНІЮ ПЕРЕДАЧІ,</text>
<text x="450.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а не як ідеальний провідник. На 2.4 ГГц λ/10 ≈ 1.2 см — тобто майже будь-яка доріжка!</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме тому ВЧ-частина плати проєктується зовсім інакше, ніж звичайна цифрова.</text>
