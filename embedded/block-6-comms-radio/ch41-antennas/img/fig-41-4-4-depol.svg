<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому телефон працює під будь-яким нахилом</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у приміщенні відбиття «перемішують» поляризацію — мimохіть рятуючи неузгодження</text>
<rect x="60.0" y="86.0" width="380.0" height="200.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">У приміщенні (багатопроменевість)</text>
<line x1="110.0" y1="150.0" x2="110.0" y2="200.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="110.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">AP верт.</text>
<line x1="125.0" y1="175.0" x2="250.0" y2="130.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<line x1="250.0" y1="130.0" x2="360.0" y2="190.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<line x1="125.0" y1="180.0" x2="240.0" y2="250.0" stroke="#b08900" stroke-width="1.4" stroke-linecap="round"/>
<line x1="240.0" y1="250.0" x2="360.0" y2="200.0" stroke="#b08900" stroke-width="1.4" stroke-linecap="round"/>
<line x1="370.0" y1="175.0" x2="350.0" y2="215.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="385.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">нахилений</text>
<text x="385.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">телефон — чує!</text>
<rect x="460.0" y="86.0" width="380.0" height="200.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Пряма видимість (без відбить)</text>
