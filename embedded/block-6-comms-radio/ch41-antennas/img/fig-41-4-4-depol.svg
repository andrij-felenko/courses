<text x="520.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">TX верт.</text>
<line x1="540.0" y1="175.0" x2="760.0" y2="175.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<line x1="770.0" y1="160.0" x2="810.0" y2="190.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="785.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">схрещений →</text>
<text x="785.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">великі втрати</text>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: у місті/будинку поляризація «прощається»; у прямій видимості (лінк, FPV) — узгоджуй обов'язково.</text>
