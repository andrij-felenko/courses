<rect x="60.0" y="300.0" width="800.0" height="50.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Антена — це коло, навмисне «відкрите» так, щоб електромагнітна енергія не лишалася всередині,</text>
<text x="460.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">а зривалася в простір вільною хвилею. Решта розділу — про те, як зробити це ефективно.</text>
