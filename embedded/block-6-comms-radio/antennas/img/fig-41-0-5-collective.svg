<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіо винайшли БАГАТО людей у різних країнах</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">немає одного «винахідника радіо» — кожен додав свою ланку</text>
<rect x="30.0" y="86.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="137.5" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Герц</text>
<text x="137.5" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Німеччина</text>
<text x="137.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">довів існування хвиль</text>
<text x="137.5" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(1887)</text>
<rect x="253.0" y="86.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="360.5" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Бранлі</text>
<text x="360.5" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Франція</text>
<text x="360.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">когерер — детектор хвиль</text>
<rect x="476.0" y="86.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="583.5" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Лодж</text>
<text x="583.5" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Британія</text>
<text x="583.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">настройка (syntony),</text>
<text x="583.5" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сигнали</text>
<rect x="699.0" y="86.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="806.5" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Бозе</text>
<text x="806.5" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Індія</text>
<text x="806.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">детектор; сигнали 1894 —</text>
<text x="806.5" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">НЕ патентував</text>
<rect x="30.0" y="192.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="137.5" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Попов</text>
<text x="137.5" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Росія</text>
<text x="137.5" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">приймач 1895 (реальний</text>
<text x="137.5" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">внесок)</text>
<rect x="253.0" y="192.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="360.5" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Тесла</text>
<text x="360.5" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">США/Серб.</text>
<text x="360.5" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коливальні контури,</text>
<text x="360.5" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">патенти</text>
<rect x="476.0" y="192.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="583.5" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Стоун / Braun</text>
<text x="583.5" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">США / Нім.</text>
<text x="583.5" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">настройка; далекий</text>
<text x="583.5" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зв'язок, Нобель</text>
<rect x="699.0" y="192.0" width="215.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="806.5" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Марконі</text>
<text x="806.5" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Італія</text>
<text x="806.5" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">система, антена,</text>
<text x="806.5" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дальність, бізнес</text>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Марконі — не самотній геній, а блискучий ІНЖЕНЕР-СИСТЕМНИК, що звів чужі цеглинки в робочу далеку лінію.</text>
</svg>
