<text x="170.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">9600 8N1  : 10 / 9600   ≈ 1.04 мс/байт  →  ≈ 960 байт/с</text>
<text x="170.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">115200 8N1: 10 / 115200 ≈ 86.8 мкс/байт →  ≈ 11 520 байт/с</text>
