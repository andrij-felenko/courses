  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Проста сума слабка: де вона сліпа, CRC бачить</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">XOR-сума не помічає перестановки байтів та багатьох викривлень — CRC ловить майже все</text>
<text x="220.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пакет А</text>
<rect x="110.0" y="120.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">41</text>
<rect x="180.0" y="120.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="210.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">42</text>
<rect x="250.0" y="120.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="280.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">43</text>
<text x="220.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пакет Б (1-й і 3-й переставлено)</text>
<rect x="110.0" y="240.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">43</text>
<rect x="180.0" y="240.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="210.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">42</text>
<rect x="250.0" y="240.0" width="60.0" height="38.0" rx="4" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="280.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">41</text>
<text x="360.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">XOR = 0x40</text>
<text x="360.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">XOR = 0x40  ← ТА САМА!</text>
<text x="360.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">сума не бачить перестановки</text>
<text x="620.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CRC = 0x52</text>
<text x="620.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CRC = 0x8A  ← інша!</text>
<text x="620.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="italic">CRC ловить перестановку</text>
<rect x="60.0" y="330.0" width="800.0" height="80.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="460.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Проста сума (XOR чи додавання) дешева, але сліпа до перестановок і компенсованих помилок.</text>
<text x="460.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">CRC залежить від ПОРЯДКУ й позиції бітів — тому ловить пакетні збої, перестановки, більшість викривлень.</text>
<text x="460.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">І парність (§35.2), і проста сума — лише бліді тіні CRC за силою виявлення.</text>
</svg>
