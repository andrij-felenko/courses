<rect x="60.0" y="300.0" width="800.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SYNC дає змогу САМОВІДНОВИТИСЯ: після будь-якого збою приймач просто чекає наступного SYNC.</text>
<text x="460.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому SYNC беруть рідкісним (часто двобайтовим, як 0xAA 0x55) — щоб менше плутати з даними.</text>
