<text x="450.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Більше стоп-біт = більший проміжок між знаками = трохи легше приймачеві за поганого синхрону.</text>
