<rect x="60.0" y="372.0" width="780.0" height="50.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гранична сумарна розбіжність ≈ 0.5 / 9.5 ≈ 5.3% для 8N1 — і її ДІЛЯТЬ передавач із приймачем.</text>
<text x="450.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси практичне правило: кожна сторона має триматися в межах ≈ ±2%.</text>
