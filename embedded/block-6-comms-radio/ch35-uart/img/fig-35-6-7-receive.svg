<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прийом пакета: знайти SYNC → довжина → дані → звірити CRC</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лише цілий пакет іде в роботу; побитий — тихо відкидають і чекають наступного SYNC</text>
<rect x="70.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="145.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">чекай SYNC</text>
<line x1="220.0" y1="185.0" x2="250.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="250.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="325.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">читай LEN</text>
<line x1="400.0" y1="185.0" x2="430.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="430.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="505.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">збери LEN</text>
<text x="505.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">байтів даних</text>
<line x1="580.0" y1="185.0" x2="610.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="610.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="685.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">читай CRC</text>
<line x1="760.0" y1="185.0" x2="790.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="790.0" y="150.0" width="150.0" height="70.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="865.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">CRC сходиться?</text>
<line x1="865.0" y1="220.0" x2="805.0" y2="270.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<line x1="865.0" y1="220.0" x2="925.0" y2="270.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="685.0" y="272.0" width="120.0" height="40.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="745.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ТАК → у роботу</text>
<rect x="885.0" y="272.0" width="150.0" height="40.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="960.0" y="297.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">НІ → відкинути, чекати SYNC</text>
<rect x="60.0" y="320.0" width="800.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ця послідовність — по суті скінченний автомат; як зробити його неблокуючим — наступна тема.</text>
<text x="460.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Головне: рішення «вірити / не вірити» приймають ЛИШЕ після перевірки CRC цілого пакета.</text>
</svg>
