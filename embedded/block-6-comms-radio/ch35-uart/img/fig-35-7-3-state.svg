<text x="304.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">len</text>
<text x="384.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">очікувана довжина даних</text>
<text x="304.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">idx</text>
<text x="384.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">скільки даних уже зібрано</text>
<text x="304.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">buf[ ]</text>
<text x="384.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">накопичувач даних</text>
