<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що робить автомат неблокуючим: пам'ять між викликами</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">feed() не чекає — він зберігає, де зупинився, у кількох змінних і одразу виходить</text>
<rect x="280.0" y="100.0" width="320.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="440.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стан між викликами feed()</text>
<text x="304.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">st</text>
