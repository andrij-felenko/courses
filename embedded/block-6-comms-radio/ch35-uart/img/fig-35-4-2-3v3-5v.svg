<rect x="60.0" y="356.0" width="780.0" height="44.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: 5→3.3 майже завжди потребує зсуву рівнів; 3.3→5 часто працює, але перевір VIH приймача.</text>
