<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що з чим з'єднується напряму, а що — лише через перетворювач</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перед тим як зводити TX і RX, звір рівні — інакше «нічого» або «дим»</text>
<rect x="90.0" y="92.0" width="720.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="106.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">TTL 3.3 В ↔ TTL 3.3 В</text>
<text x="410.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">напряму ✓</text>
<text x="570.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">TX↔RX навхрест, спільна земля</text>
<rect x="90.0" y="150.0" width="720.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="106.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">TTL 5 В ↔ TTL 3.3 В</text>
<text x="410.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">зсув рівнів ⚠</text>
<text x="570.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">5→3.3 обов'язково; 3.3→5 перевір VIH</text>
<rect x="90.0" y="208.0" width="720.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="106.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">TTL ↔ RS-232</text>
<text x="410.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">конвертер ⚠</text>
<text x="570.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">MAX232; прямо — спалиш вхід ±12 В</text>
<rect x="90.0" y="266.0" width="720.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="106.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">RS-232 ↔ RS-232</text>
<text x="410.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">напряму ✓</text>
<text x="570.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">та сама родина рівнів</text>
<rect x="60.0" y="332.0" width="780.0" height="76.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три класичні помилки рівнів і дротів:</text>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) TX↔TX замість навхрест   ·   2) забута спільна земля   ·   3) переплутані рівні/інверсія</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Будь-яка з них дає «лінія є, а зв'язку нема» — перевіряй їх першими.</text>
</svg>
