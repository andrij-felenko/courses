<text x="174.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">head (пише ISR)</text>
<line x1="546.0" y1="250.0" x2="515.2" y2="250.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
