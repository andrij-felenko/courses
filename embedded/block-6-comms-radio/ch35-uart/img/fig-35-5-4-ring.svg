<text x="360.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">байти</text>
<rect x="610.0" y="150.0" width="250.0" height="60.0" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="620.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">head == tail → буфер ПОРОЖНІЙ</text>
<text x="620.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">head «наздогнав» tail → ПОВНИЙ</text>
<rect x="60.0" y="388.0" width="760.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Кільце» бо після останньої клітини покажчик стрибає на першу — пам'ять використовується по колу.</text>
