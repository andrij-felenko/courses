<text x="460.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ціна — жорстка синхронність кінців. UART згодом обере інший шлях: синхронізуватися щознаку.</text>
