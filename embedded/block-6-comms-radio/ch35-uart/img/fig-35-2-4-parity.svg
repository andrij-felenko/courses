<text x="664.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">одиниць: 5 (непарно)</text>
<rect x="150.0" y="230.0" width="320.0" height="86.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="310.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">парна (even): P = 1</text>
<text x="310.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">5 + 1 = 6 одиниць — ПАРНО</text>
<text x="310.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">P = XOR усіх біт даних</text>
<rect x="500.0" y="230.0" width="320.0" height="86.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="660.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">непарна (odd): P = 0</text>
<text x="660.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">5 + 0 = 5 одиниць — НЕПАРНО</text>
<text x="660.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">P = NOT XOR усіх біт даних</text>
<rect x="60.0" y="350.0" width="780.0" height="50.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Передавач додає P за правилом; приймач рахує одиниці сам і звіряє — не збіглося, є помилка.</text>
