<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Апаратний FIFO: чергa поглинає сплеск, CPU забирає пачкою</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перший прийшов — перший вийшов; між байтами вже не треба встигати по одному</text>
<text x="110.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лінія</text>
<line x1="150.0" y1="190.0" x2="250.0" y2="190.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="200.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">байти</text>
<rect x="260.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#dfe7fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="280.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B5</text>
<rect x="300.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#dfe7fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="320.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B4</text>
<rect x="340.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#dfe7fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="360.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B3</text>
<rect x="380.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#dfe7fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="400.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B2</text>
<rect x="420.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#dfe7fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="440.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B1</text>
<rect x="460.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal"></text>
<rect x="500.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="520.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal"></text>
<rect x="540.0" y="172.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="560.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal"></text>
<text x="420.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RX FIFO (апаратний)</text>
<text x="420.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">глибина типово 16 (UART 16550) … 128 (ESP32)</text>
<line x1="588.0" y1="190.0" x2="670.0" y2="190.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<rect x="672.0" y="162.0" width="120.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="732.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">CPU</text>
<text x="732.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">читає кілька за раз</text>
<rect x="60.0" y="320.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FIFO дає CPU «фору»: можна на мить відволіктися — байти зачекають у черзі, а не зникнуть.</text>
<text x="450.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Але й він скінченний: переповнився — і далі знову втрати (overrun).</text>
</svg>
