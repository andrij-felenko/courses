<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюжок (daisy-chain): один CS на всіх, дані течуть наскрізь</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ведені з'єднані послідовно, як одне довге кільце; економить CS, але треба «прокрутити» всіх</text>
<rect x="60.0" y="150.0" width="110.0" height="90.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="115.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВЕДУЧИЙ</text>
<rect x="225.0" y="150.0" width="110.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="280.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S0</text>
<line x1="170.0" y1="175.0" x2="225.0" y2="175.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="415.0" y="150.0" width="110.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="470.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S1</text>
<line x1="335.0" y1="175.0" x2="415.0" y2="175.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="605.0" y="150.0" width="110.0" height="70.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="660.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">S2</text>
<line x1="525.0" y1="175.0" x2="605.0" y2="175.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="715.0" y1="175.0" x2="830.0" y2="175.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<line x1="830.0" y1="175.0" x2="830.0" y2="270.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="830.0" y1="270.0" x2="115.0" y2="270.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="115.0" y1="270.0" x2="115.0" y2="240.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="115.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">MOSI→</text>
<text x="470.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MISO повертається в ведучого</text>
<text x="470.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">SCK і ОДИН CS — спільні на всіх</text>
<rect x="60.0" y="296.0" width="800.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дані ведучого прошивають усі ведені поспіль — наче один довгий зсувний регістр.</text>
<text x="460.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Економить ніжки CS, та вимагає підтримки daisy-chain і надсилання даних ДЛЯ ВСІХ за раз (LED-драйвери, регістри).</text>
</svg>
