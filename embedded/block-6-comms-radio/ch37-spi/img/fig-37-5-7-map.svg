<rect x="60.0" y="348.0" width="780.0" height="44.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Практика: SPI — десятки МГц на сантиметрах плати; на кабель чи метри бери диференційну шину.</text>
