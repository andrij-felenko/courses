<text x="670.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">метри (кабель)</text>
<rect x="136.0" y="96.0" width="260.0" height="110.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
