<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ до спільної шини: необраний ведений ВІДПУСКАЄ MISO (високий імпеданс), щоб не заважати.</text>
