<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Замість адреси (як у I2C) — окрема ніжка CS на кожного веденого: просто й швидко.</text>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ціна: на N ведених треба N ліній CS — більше ніжок, ніж у I2C.</text>
