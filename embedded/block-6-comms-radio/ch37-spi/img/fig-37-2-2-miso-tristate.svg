<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільний MISO без конфлікту: необрані ведені «відключаються»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лише обраний (CS=0) жене MISO; решта тримають вихід у високому імпедансі (Z) — наче від'єднані</text>
<line x1="120.0" y1="160.0" x2="820.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<text x="70.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">MISO</text>
<text x="845.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ ведучий</text>
<rect x="175.0" y="220.0" width="150.0" height="100.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="250.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ведений A</text>
<text x="250.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CS = 0 (обраний)</text>
<text x="250.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">жене MISO</text>
<line x1="250.0" y1="220.0" x2="250.0" y2="160.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="250.0" cy="160.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<rect x="395.0" y="220.0" width="150.0" height="100.0" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="2"/>
<text x="470.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ведений B</text>
<text x="470.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">CS = 1</text>
<text x="470.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">вихід = Z (відпущено)</text>
<line x1="470.0" y1="232.0" x2="470.0" y2="220.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ Z</text>
<rect x="615.0" y="220.0" width="150.0" height="100.0" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="2"/>
<text x="690.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ведений C</text>
<text x="690.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">CS = 1</text>
<text x="690.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">вихід = Z (відпущено)</text>
<line x1="690.0" y1="232.0" x2="690.0" y2="220.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="690.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ Z</text>
<rect x="60.0" y="340.0" width="780.0" height="44.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Високий імпеданс — те, що дає багатьом веденим ділити один MISO: говорить лише обраний.</text>
