<text x="496.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">← самі дані, без обгортки</text>
<rect x="60.0" y="236.0" width="800.0" height="100.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Немає адрес (є CS), немає підтвердження кожного байта, немає старт-стопу.</text>
<text x="460.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому корисна частка майже 100%: 8 тактів = 8 біт даних, без 9-го такту ACK.</text>
<text x="460.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ціна простоти — жодного вбудованого контролю помилок (його, за потреби, додають зверху).</text>
</svg>
