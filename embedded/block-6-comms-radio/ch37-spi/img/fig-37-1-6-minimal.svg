<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мінімум церемоній: ні адрес, ні ACK, ні старт-стопу</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у I2C байт обвішаний службовими бітами; у SPI — лише CS вниз, тактуй байти, CS вгору</text>
<text x="80.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">I2C:</text>
