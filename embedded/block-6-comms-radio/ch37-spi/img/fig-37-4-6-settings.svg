<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У кожного веденого — свої налаштування й своя CS</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">різні ведені можуть хотіти різний режим і швидкість; обмін обрамляють своєю CS</text>
<rect x="110.0" y="90.0" width="700.0" height="230.0" rx="10" fill="#1e2330" stroke="#111" stroke-width="1.6"/>
<text x="130.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// дисплей: швидкий, режим 0</text>
<text x="130.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SPISettings disp(20000000, MSBFIRST, SPI_MODE0);</text>
<text x="130.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// АЦП: повільніший, режим 3</text>
<text x="130.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SPISettings adc(1000000, MSBFIRST, SPI_MODE3);</text>
<text x="130.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal"></text>
<text x="130.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">digitalWrite(CS_ADC, LOW);        // обрали АЦП</text>
<text x="130.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SPI.beginTransaction(adc);</text>
<text x="130.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">v = SPI.transfer16(0x0000);       // обмін</text>
<text x="130.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">SPI.endTransaction();</text>
<text x="130.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">digitalWrite(CS_ADC, HIGH);       // відпустили</text>
<rect x="60.0" y="334.0" width="800.0" height="36.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="460.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Патерн: опусти CS → beginTransaction(свої налаштування) → обмін → endTransaction → підніми CS.</text>
</svg>
