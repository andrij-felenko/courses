<text x="450.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обидві шини чудово вживаються: кожна робить те, у чому сильна. Це норма, а не виняток.</text>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">I2C економить ніжки на гроні давачів; SPI везе швидкий потік на дисплей і картку.</text>
