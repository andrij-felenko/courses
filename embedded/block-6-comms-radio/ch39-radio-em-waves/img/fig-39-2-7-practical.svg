<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Практика: побачив частоту — знаєш хвилю й розмір антени</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне число (частота) одразу каже й довжину хвилі, і приблизний розмір антени</text>
<rect x="80.0" y="100.0" width="200.0" height="80.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="180.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">«2.4 ГГц»</text>
<text x="180.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(частота)</text>
<line x1="282.0" y1="140.0" x2="360.0" y2="140.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="321.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">λ = c/f</text>
<rect x="370.0" y="100.0" width="200.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">λ ≈ 12.5 см</text>
<text x="470.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(довжина хвилі)</text>
<line x1="572.0" y1="140.0" x2="650.0" y2="140.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="611.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">¼λ</text>
<rect x="660.0" y="100.0" width="200.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="760.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">антена ≈ 3 см</text>
<text x="760.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(розмір)</text>
<rect x="60.0" y="210.0" width="780.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це найшвидша оцінка «на серветці»: частота → довжина хвилі → розмір антени.</text>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Побачив «868 МГц» — λ≈35 см, антена ≈9 см; «433 МГц» — λ≈70 см, антена ≈17 см.</text>
<text x="450.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому в чужому пристрої за частотою одразу впізнаєш, якого розміру антену шукати.</text>
</svg>
