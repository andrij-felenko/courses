<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обирай частоту за потребою</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спершу вирішуєш «далеко чи швидко, крізь стіни чи ні» — і частота випливає сама</text>
<rect x="110.0" y="96.0" width="680.0" height="44.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="130.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">далеко + мало даних (давач у полі)</text>
<text x="540.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">→ 433 / 868 МГц (LoRa)</text>
<rect x="110.0" y="150.0" width="680.0" height="44.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="130.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">крізь стіни в домі, помірні дані</text>
<text x="540.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ 2.4 ГГц (Wi-Fi/BT)</text>
<rect x="110.0" y="204.0" width="680.0" height="44.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="130.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">багато даних, пристрій поруч</text>
<text x="540.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">→ 5 ГГц (швидкий Wi-Fi)</text>
<rect x="110.0" y="258.0" width="680.0" height="44.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="130.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">глобальна дальність без інфраструктури</text>
<text x="540.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ HF / супутник</text>
<rect x="60.0" y="318.0" width="1.0" height="1.0" rx="0" fill="none" stroke="none" stroke-width="0"/>
