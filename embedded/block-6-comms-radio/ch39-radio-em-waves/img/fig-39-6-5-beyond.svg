  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поза порожнечею: до геометрії додаються ще втрати</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">базове розпливання неминуче; а реальний світ накладає зверху стіни, дощ, листя, тіло</text>
<rect x="130.0" y="180.0" width="110.0" height="120.0" rx="0" fill="#1f8a3b" stroke="#333" stroke-width="1.2"/>
<rect x="130.0" y="140.0" width="110.0" height="40.0" rx="0" fill="#b08900" stroke="#333" stroke-width="1.2"/>
<rect x="130.0" y="116.0" width="110.0" height="24.0" rx="0" fill="#1f47b5" stroke="#333" stroke-width="1.2"/>
<rect x="130.0" y="96.0" width="110.0" height="20.0" rx="0" fill="#c0271e" stroke="#333" stroke-width="1.2"/>
<text x="185.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сумарні втрати</text>
<rect x="360.0" y="110.0" width="16.0" height="16.0" rx="0" fill="#1f8a3b" stroke="#333" stroke-width="1"/>
<text x="384.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розпливання (1/r²) — неминуче — геометрія</text>
<rect x="360.0" y="140.0" width="16.0" height="16.0" rx="0" fill="#b08900" stroke="#333" stroke-width="1"/>
<text x="384.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стіна — −кілька…десятки дБ кожна</text>
<rect x="360.0" y="170.0" width="16.0" height="16.0" rx="0" fill="#1f47b5" stroke="#333" stroke-width="1"/>
<text x="384.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дощ / листя — поглинають, надто на 2.4+</text>
<rect x="360.0" y="200.0" width="16.0" height="16.0" rx="0" fill="#c0271e" stroke="#333" stroke-width="1"/>
<text x="384.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тіло / метал поруч — затуляють і відбивають</text>
<rect x="60.0" y="296.0" width="780.0" height="1.0" rx="0" fill="none" stroke="none" stroke-width="0"/>
</svg>
