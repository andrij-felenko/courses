<text x="460.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У темній кімнаті Герц бачив слабкі іскри в петлі — доказ, що хвиля перетнула порожній простір.</text>
<text x="460.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Передавач і приймач не з'єднані нічим — лише хвилею. Це і є народження радіо як факту.</text>
