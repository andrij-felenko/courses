<text x="670.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">висока частота</text>
<line x1="560.0" y1="250.0" x2="560.0" y2="200.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
