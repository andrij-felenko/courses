<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дальність і проникність: низька частота «бере» далі й крізь усе</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">довгі хвилі огинають і проникають (§39.3); короткі вимагають прямої видимості</text>
<text x="230.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">низька частота</text>
<line x1="120.0" y1="250.0" x2="120.0" y2="200.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<line x1="120.0" y1="200.0" x2="114.0" y2="192.0" stroke="#b08900" stroke-width="2" stroke-linecap="round"/>
<line x1="120.0" y1="200.0" x2="126.0" y2="192.0" stroke="#b08900" stroke-width="2" stroke-linecap="round"/>
<path d="M 120,210 m -10,0 a 110 80 0 1 0 220,0 a 110 80 0 1 0 -220,0" fill="#fbf3df" fill-opacity="0.5" stroke="#b08900" stroke-width="1.6"/>
