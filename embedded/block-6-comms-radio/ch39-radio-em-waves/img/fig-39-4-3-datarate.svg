<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
<rect width="900" height="350" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Швидкість даних: на вищій частоті більше «місця» під смугу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама частка спектра у відсотках дає В РАЗИ ширшу смугу на високій частоті → більше даних</text>
<rect x="120.0" y="110.0" width="300.0" height="90.0" rx="10" fill="#fbf3df" stroke="#b08900" stroke-width="2"/>
<text x="270.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">100 МГц</text>
<text x="270.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1% смуги = 1 МГц</text>
<text x="270.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">→ мало даних</text>
<text x="450.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">vs</text>
<rect x="480.0" y="110.0" width="300.0" height="90.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="630.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">5 ГГц</text>
<text x="630.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1% смуги = 50 МГц</text>
<text x="630.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ у 50 разів більше</text>
<rect x="60.0" y="226.0" width="780.0" height="100.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Більше абсолютної смуги = вища швидкість (натяк на межу Шеннона, §40).</text>
<text x="450.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ось чому відео й швидкий Wi-Fi тягнуться на ВИСОКІ частоти, а далекий IoT — на низькі.</text>
<text x="450.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Низькі частоти просто «тісні»: там фізично мало місця під широкі канали.</text>
<text x="450.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому компроміс «далеко» проти «швидко» — фундаментальний, а не випадковий.</text>
</svg>
