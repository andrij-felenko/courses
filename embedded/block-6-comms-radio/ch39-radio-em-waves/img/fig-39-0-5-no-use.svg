<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Жодної користі» — і колективний шлях до радіо</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Герц бачив лише доказ теорії; перетворити хвилю на зв'язок — заслуга інших, і досі спірна</text>
<rect x="90.0" y="92.0" width="720.0" height="70.0" rx="12" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="450.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="italic" font-style="normal">«Це не має жодної користі… просто дослід, що доводить:</text>
<text x="450.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="italic" font-style="normal">маестро Максвелл мав рацію.» — Г. Герц</text>
<text x="450.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">а далі з хвилі зробили РАДІО (різні люди, різні країни, спірний пріоритет):</text>
<rect x="130.0" y="216.0" width="120.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="190.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Марконі</text>
<rect x="260.0" y="216.0" width="120.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="320.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Попов</text>
<rect x="390.0" y="216.0" width="120.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="450.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тесла</text>
<rect x="520.0" y="216.0" width="120.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="580.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Боше</text>
<rect x="650.0" y="216.0" width="120.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="710.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лодж</text>
<rect x="60.0" y="286.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Винахід радіо — НЕ один герой: над ним працювали багато, а суд за пріоритет тривав десятиліттями.</text>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Цю окрему історію — Марконі та інші — розкриваємо в Розділі 41.)</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А одиницю частоти — герц (Гц) — назвали на честь того, хто хвилю першим упіймав.</text>
</svg>
