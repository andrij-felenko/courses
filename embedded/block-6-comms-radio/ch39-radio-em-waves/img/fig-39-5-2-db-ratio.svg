<text x="480.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ × 2 (удвічі більше)</text>
