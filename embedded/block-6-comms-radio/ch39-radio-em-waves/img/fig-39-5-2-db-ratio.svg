<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Децибел (dB) — це ВІДНОШЕННЯ в логарифмічній шкалі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">dB = 10·log₁₀(P₂/P₁); запам'ятай кілька орієнтирів — і переведеш будь-яке відношення</text>
<text x="450.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">dB = 10 · log₁₀ ( P₂ / P₁ )</text>
<rect x="200.0" y="122.0" width="500.0" height="32.0" rx="6" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.3"/>
