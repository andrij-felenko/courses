<text x="480.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що можна автоматизувати з pymavlink на борту</text>
<text x="480.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">читай телеметрію, ухвалюй рішення, шли команди — без участі землі</text>
<rect x="40.0" y="86.0" width="220.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="150.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🔋</text>
<text x="150.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Розумний failsafe</text>
<text x="150.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сів заряд → сам шле</text>
<text x="150.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">RTL</text>
<rect x="270.0" y="86.0" width="220.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="380.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🎯</text>
<text x="380.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Слідкування за ціллю</text>
<text x="380.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зір бачить об'єкт →</text>
<text x="380.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коригує курс</text>
<rect x="500.0" y="86.0" width="220.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="610.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🧱</text>
<text x="610.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Геозона</text>
<text x="610.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">наблизився до межі →</text>
<text x="610.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не пускає далі</text>
<rect x="730.0" y="86.0" width="220.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="840.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🗺️</text>
<text x="840.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Авто-картографування</text>
<text x="840.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">облітає площу й знімає</text>
<text x="840.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за планом</text>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе це — той самий цикл «читай → вирішуй → командуй» (§42.6), але на самому апараті й без людини.</text>
</svg>
