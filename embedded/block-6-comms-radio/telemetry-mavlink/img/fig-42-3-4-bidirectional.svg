<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це РОЗМОВА, а не мовлення: потік у два боки</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вниз — стан апарата; вгору — команди, параметри, завантаження місії</text>
<line x1="116.2" y1="151.8" x2="183.8" y2="188.2" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="116.2" y1="188.2" x2="183.8" y2="151.8" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<circle cx="116.2" cy="151.8" r="11.7" fill="none" stroke="#1f47b5" stroke-width="2"/>
<circle cx="183.8" cy="151.8" r="11.7" fill="none" stroke="#1f47b5" stroke-width="2"/>
<circle cx="116.2" cy="188.2" r="11.7" fill="none" stroke="#1f47b5" stroke-width="2"/>
<circle cx="183.8" cy="188.2" r="11.7" fill="none" stroke="#1f47b5" stroke-width="2"/>
<rect x="139.6" y="162.2" width="20.8" height="15.6" rx="2" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<rect x="740.0" y="120.0" width="140.0" height="110.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="810.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">станція (GCS)</text>
<line x1="720.0" y1="130.0" x2="210.0" y2="130.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#aAmb)"/>
<text x="465.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">ВНИЗ: телеметрія (висота, GPS, батарея, режим)</text>
<line x1="210.0" y1="220.0" x2="720.0" y2="220.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="465.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВГОРУ: команди, параметри, місія, RC-override</text>
<rect x="60.0" y="280.0" width="820.0" height="50.0" rx="9" fill="#fbf3df" stroke="#b08900" stroke-width="1.4"/>
<text x="470.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама лінія несе обидва боки: апарат звітує, людина (чи код) керує й налаштовує.</text>
<text x="470.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме двосторонність робить телеметрію місцем для MAVLink — мови запитів і відповідей.</text>
</svg>
