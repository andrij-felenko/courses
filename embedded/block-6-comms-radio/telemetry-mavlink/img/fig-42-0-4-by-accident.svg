<text x="460.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Урок: відкриті стандарти часто народжуються не як «продукт», а як зручний інструмент, що його підхопили всі.</text>
