<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
<rect width="960" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="480.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">pymavlink: MAVLink у Python кількома рядками</text>
<text x="480.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама бібліотека, що ми вже бачили (§42.6) — згенерована з тих самих XML (§42.5)</text>
<rect x="60.0" y="90.0" width="600.0" height="130.0" rx="9" fill="#1b1f24" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="80.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">from pymavlink import mavutil</text>
<text x="80.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">m = mavutil.mavlink_connection('udp:127.0.0.1:14550')</text>
<text x="80.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">m.wait_heartbeat()                # апарат на лінії</text>
<text x="80.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">while True:</text>
<text x="80.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">    msg = m.recv_match(blocking=True)   # читай усе підряд</text>
<text x="80.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe8cf" text-anchor="start" font-weight="normal" font-style="normal">    # …реагуй, шли команди, веди логіку…</text>
<rect x="690.0" y="90.0" width="210.0" height="130.0" rx="9" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="795.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">що дає pymavlink:</text>
<text x="706.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• з'єднання (serial/</text>
<text x="706.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  udp/tcp)</text>
<text x="706.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• розбір і пакування</text>
<text x="706.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• усі діалекти</text>
<text x="706.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• основа MAVProxy</text>
<rect x="60.0" y="240.0" width="840.0" height="60.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="480.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">pymavlink — стандартний спосіб говорити з MAVLink на Python; саме його написав Ендрю Тридджелл (історія).</text>
<text x="480.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий код працює і з ноутбука, і — головне — з бортового комп'ютера на самому апараті.</text>
</svg>
