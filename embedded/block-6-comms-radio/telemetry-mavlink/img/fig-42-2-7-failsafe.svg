<text x="476.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ RTL / посадка</text>
<text x="460.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правильний failsafe (через MAVLink/контролер) — повернення додому чи м'яка посадка, а не падіння.</text>
