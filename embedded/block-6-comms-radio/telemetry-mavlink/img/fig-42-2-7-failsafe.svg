<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що робить приймач, коли сигнал зник: failsafe</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лінія керування «священна» (§42.1): на втрату сигналу приймач має заздалегідь заданий план</text>
<text x="230.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сигнал є</text>
<line x1="120.0" y1="150.0" x2="340.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
