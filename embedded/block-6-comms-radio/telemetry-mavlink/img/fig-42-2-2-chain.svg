<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Повний ланцюг керування: від стіка до мотора</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пульт → радіолінк → приймач → польотний контролер → мотори</text>
<rect x="50.0" y="130.0" width="195.0" height="80.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="147.5" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Пульт (TX)</text>
<text x="147.5" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стіки → канали → кадр</text>
<line x1="247.0" y1="170.0" x2="259.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="253.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">ефір</text>
