<path d="M 458,170 q 6,-8 12,0" fill="none" stroke="#b08900" stroke-width="1.4"/>
<rect x="472.0" y="130.0" width="195.0" height="80.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="569.5" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Приймач (RX)</text>
<text x="569.5" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розпаковує канали</text>
<line x1="669.0" y1="170.0" x2="681.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="675.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">SBUS/CRSF</text>
<rect x="683.0" y="130.0" width="195.0" height="80.0" rx="8" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<text x="780.5" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Контролер (FC)</text>
<text x="780.5" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">змішує → мотори</text>
<rect x="60.0" y="252.0" width="800.0" height="50.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="460.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Між приймачем і контролером — окремий «протокол приймача» (PWM / PPM / SBUS / CRSF), про який нижче.</text>
<text x="460.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А пульт із приймачем пов'язує одноразова «прив'язка» (binding).</text>
