<text x="358.5" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Радіолінк</text>
<text x="358.5" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стрибки по діапазону</text>
<line x1="458.0" y1="170.0" x2="470.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
