<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек ховає ретраї — але повну втрату зв'язку маєш ловити ТИ</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чіп сам перешле загублений пакет; та якщо пристрій вийшов за межу — жодні ретраї не допоможуть</text>
<rect x="120.0" y="100.0" width="660.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="150.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">твій застосунок</text>
<text x="150.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">send() / on_receive()  +  FAILSAFE на тривалу тишу</text>
<rect x="120.0" y="168.0" width="660.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">стек радіо (Wi-Fi/BT)</text>
<text x="150.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пакети, CRC, ACK, ретраї — усе ховається тут</text>
<rect x="120.0" y="236.0" width="660.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="150.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">радіо на чіпі</text>
<text x="150.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">антена, модуляція, біти по повітрю</text>
<line x1="450.0" y1="156.0" x2="450.0" y2="168.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="450.0" y1="224.0" x2="450.0" y2="236.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="60.0" y="306.0" width="780.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Межа відповідальності: ретраї окремих пакетів — справа чіпа; реакція на ПОВНУ втрату зв'язку — твоя.</text>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому надійний бездротовий пристрій завжди має failsafe «що робити, якщо команд давно немає» (§38.7).</text>
</svg>
