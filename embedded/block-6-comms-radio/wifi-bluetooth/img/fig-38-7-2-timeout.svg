<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виявлення втрати: не «подія», а ТАЙМАУТ тиші</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стережемо час від останнього повідомлення; перевищив поріг — запускаємо failsafe</text>
<rect x="120.0" y="96.0" width="660.0" height="130.0" rx="10" fill="#1e2330" stroke="#111" stroke-width="1.6"/>
<text x="140.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7f9cc0" text-anchor="start" font-weight="normal" font-style="normal">// у головному циклі (патерн millis, §24.5)</text>
<text x="140.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9be39b" text-anchor="start" font-weight="bold" font-style="normal">if (gotMessage) lastMsg = millis();</text>
<text x="140.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffd479" text-anchor="start" font-weight="bold" font-style="normal">if (millis() - lastMsg &gt; TIMEOUT)</text>
<text x="165.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ff9b9b" text-anchor="start" font-weight="bold" font-style="normal">failsafe();   // зв'язок утрачено</text>
<rect x="60.0" y="242.0" width="780.0" height="76.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поріг TIMEOUT беруть із запасом: напр. серцебиття кожні 100 мс, дозволяємо 3 пропуски → 300 мс.</text>
<text x="450.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Замало — хибні спрацювання від випадкових втрат; забагато — пізно реагуємо на справжню втрату.</text>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це той самий watchdog-підхід (§24.7), лише для зв'язку.</text>
</svg>
