<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Під капотом SPP: чистий потік над брудним ефіром</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ти бачиш рівний UART-потік, а стек унизу б'ється з усією ненадійністю радіо (§38.1)</text>
<rect x="120.0" y="96.0" width="660.0" height="46.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="150.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">застосунок:</text>
<text x="300.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SerialBT.print() / .read() — рівний потік байтів</text>
<rect x="120.0" y="158.0" width="660.0" height="46.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">стек BT:</text>
<text x="300.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пакети, CRC, ACK, перевідправлення, стрибки частоти</text>
<rect x="120.0" y="220.0" width="660.0" height="46.0" rx="10" fill="#fbf3df" stroke="#b08900" stroke-width="2"/>
<text x="150.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">ефір:</text>
<text x="300.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">спільне 2.4 ГГц із втратами й завадами</text>
<line x1="450.0" y1="142.0" x2="450.0" y2="158.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<line x1="450.0" y1="204.0" x2="450.0" y2="220.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<rect x="60.0" y="284.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="309.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зручність SPP — у цій ілюзії дроту; та пам'ятай: при поганому зв'язку «дріт» усе одно може обірватися.</text>
