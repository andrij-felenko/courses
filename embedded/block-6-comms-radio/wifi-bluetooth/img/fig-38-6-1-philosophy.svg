<rect x="60.0" y="296.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: монетка 220 мА·год. Classic при 30 мА → ~7 годин; BLE при ~10 мкА → роки.</text>
<text x="450.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому BLE — для давачів, маячків і носимих: рідко й потроху, зате батарейка живе роками.</text>
