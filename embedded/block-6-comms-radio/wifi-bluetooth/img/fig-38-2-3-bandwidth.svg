<text x="450.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">83 МГц смуги / 20 МГц на канал → лише ~3-4 неперекривні Wi-Fi-канали на всіх.</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому в людному місці Wi-Fi-канали 1/6/11 завжди переповнені сусідами.</text>
