<rect x="60.0" y="230.0" width="780.0" height="92.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Код майже не міняється: де був Serial — тепер SerialBT, з тими ж print()/read().</text>
<text x="450.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому SPP — улюблений спосіб «перерізати дріт»: керувати роботом чи читати давач із телефона.</text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Під капотом — уся ненадійність радіо, але SPP дає ілюзію надійного дроту (ретраї сховані).</text>
</svg>
