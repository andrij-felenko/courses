<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320">
<rect width="920" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сучасний поворот: керування й телеметрія в одній лінії</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нові системи (ExpressLRS, Crossfire) шлють телеметрію назад тим самим лінком керування</text>
<rect x="60.0" y="90.0" width="380.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">класично: окремі лінки</text>
<line x1="120.0" y1="150.0" x2="380.0" y2="150.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="250.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">керування</text>
<line x1="380.0" y1="185.0" x2="120.0" y2="185.0" stroke="#b08900" stroke-width="2" marker-end="url(#aAmb)"/>
<text x="250.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">телеметрія (окремий модуль)</text>
<text x="250.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два радіо, дві антени</text>
<rect x="480.0" y="90.0" width="380.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="670.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сучасно: один лінк, два боки</text>
<line x1="540.0" y1="160.0" x2="800.0" y2="160.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="670.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">керування вгору</text>
<line x1="800.0" y1="185.0" x2="540.0" y2="185.0" stroke="#b08900" stroke-width="2" marker-end="url(#aAmb)"/>
<text x="670.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="normal" font-style="normal">телеметрія вниз — тим самим радіо</text>
<text x="670.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне радіо; MAVLink може йти й тут</text>
<text x="460.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Технології зливаються, але ДВІ РОЛІ — «віжки» й «панель» — лишаються концептуально різними.</text>
</svg>
