<circle cx="211.2" cy="133.2" r="10.8" fill="none" stroke="#1f47b5" stroke-width="2"/>
<circle cx="148.8" cy="166.8" r="10.8" fill="none" stroke="#1f47b5" stroke-width="2"/>
<circle cx="211.2" cy="166.8" r="10.8" fill="none" stroke="#1f47b5" stroke-width="2"/>
<rect x="170.4" y="142.8" width="19.2" height="14.4" rx="2" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<rect x="150.0" y="175.0" width="60.0" height="26.0" rx="3" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="180.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">камера</text>
<path d="M 230,150 L 700,120 L 700,190 L 230,175 Z" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="460.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">суцільний відеопотік (широка смуга)</text>
<rect x="710.0" y="135.0" width="130.0" height="50.0" rx="8" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="775.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">окуляри/екран</text>
<rect x="60.0" y="230.0" width="800.0" height="76.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="460.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відео не несе керування й телеметрії — лише картинку. Тому йому дають окремий діапазон,</text>
<text x="460.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">щоб широка смуга відео не «забивала» вузькі, але критичні лінії керування й телеметрії.</text>
<text x="460.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Пам'ятаєш колову поляризацію (§41.4)? Вона саме для FPV — щоб не пропадати в маневрах.</text>
</svg>
