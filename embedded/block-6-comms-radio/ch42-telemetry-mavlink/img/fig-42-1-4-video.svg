<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Третя лінія: відео (FPV)</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одностороння картинка вниз; найширша смуга, часто окремий діапазон (5.8 ГГц)</text>
<line x1="148.8" y1="133.2" x2="211.2" y2="166.8" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="148.8" y1="166.8" x2="211.2" y2="133.2" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
