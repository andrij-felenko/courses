<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Край дальності псує і затримку, і надійність</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">слабшає сигнал (§40.6) → росте втрата пакетів → більше ретраїв → лінк «гусне» й рветься</text>
<line x1="130.0" y1="250.0" x2="810.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="130.0" y1="250.0" x2="130.0" y2="80.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
