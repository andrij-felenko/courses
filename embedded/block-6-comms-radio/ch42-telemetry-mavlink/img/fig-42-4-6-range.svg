<text x="334.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">тут лінк здоровий</text>
<text x="708.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тут уже рветься</text>
<text x="470.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому запас на завмирання (§40.6) — не розкіш: він тримає і низьку затримку, і надійність далеко від межі.</text>
