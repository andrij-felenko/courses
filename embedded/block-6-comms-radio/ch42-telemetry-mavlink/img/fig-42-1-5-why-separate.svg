<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо розділяти лінії (і часто — діапазони)</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у кожної ролі — свої вимоги; окремі смуги дають їх оптимізувати й не заважати одна одній</text>
<rect x="45.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="180.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">⚡</text>
<text x="180.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Різні вимоги</text>
<text x="180.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Керуванню — затримка;</text>
<text x="180.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">телеметрії — дані; відео —</text>
<text x="180.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">смуга. Один канал усе не</text>
<text x="180.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">потягне.</text>
<rect x="335.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="470.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📻</text>
<text x="470.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Різні діапазони</text>
<text x="470.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Керування 2.4 / 900 / 433 МГц,</text>
<text x="470.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">телеметрія 433/915, відео 5.8</text>
<text x="470.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ГГц — не глушать одне одного.</text>
<rect x="625.0" y="86.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="760.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🛟</text>
<text x="760.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Безпека</text>
<text x="760.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Критичну лінію керування</text>
<text x="760.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ізолюють, щоб збій відео чи</text>
<text x="760.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">телеметрії її не зачепив.</text>
</svg>
