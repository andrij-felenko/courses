<text x="480.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це і є ті «частоти потоку» (stream rate) з §42.3 — тепер ти керуєш ними сам.</text>
