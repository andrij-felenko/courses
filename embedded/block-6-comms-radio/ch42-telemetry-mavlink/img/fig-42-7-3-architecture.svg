<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
<rect width="960" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="480.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поділ праці: політ окремо, розум окремо</text>
<text x="480.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">контролер відповідає за політ у реальному часі; комп'ютер — за «думання»; між ними MAVLink</text>
<rect x="70.0" y="90.0" width="360.0" height="190.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Політний контролер</text>
<text x="90.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• стабілізація, реальний час</text>
<text x="90.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• читання давачів, мотори</text>
<text x="90.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• надійність понад усе</text>
<text x="90.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• проста, перевірена логіка</text>
<rect x="530.0" y="90.0" width="360.0" height="190.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="710.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Бортовий комп'ютер</text>
<text x="550.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• комп'ютерний зір, ШІ</text>
<text x="550.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• складні рішення, маршрути</text>
<text x="550.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• зв'язок (LTE, мережа)</text>
<text x="550.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• важкі обчислення</text>
<line x1="430.0" y1="170.0" x2="530.0" y2="170.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#aAmb)"/>
<line x1="530.0" y1="200.0" x2="430.0" y2="200.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#aAmb)"/>
<text x="480.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">MAVLink</text>
<text x="480.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контролер — «спинний мозок» (рефлекси польоту); комп'ютер — «головний мозок» (зір і плани).</text>
</svg>
