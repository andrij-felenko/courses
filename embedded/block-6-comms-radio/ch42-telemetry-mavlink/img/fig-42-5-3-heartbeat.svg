<circle cx="310.0" cy="156.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="326.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">autopilot</text>
<text x="540.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— PX4 / ArduPilot…</text>
<circle cx="310.0" cy="186.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="326.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">base_mode + custom_mode</text>
<text x="540.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— режим польоту</text>
<circle cx="310.0" cy="216.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="326.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">system_status</text>
<text x="540.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— стан (armed?)</text>
