<text x="326.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">mavlink_version</text>
<text x="540.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— версія протоколу</text>
<rect x="60.0" y="286.0" width="840.0" height="44.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="480.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">За HEARTBEAT станція ВИЯВЛЯЄ апарат, бачить його тип і режим — і ловить ВТРАТУ лінка (§42.4).</text>
