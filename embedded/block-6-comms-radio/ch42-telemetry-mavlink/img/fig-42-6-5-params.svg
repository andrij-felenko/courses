<text x="265.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Прочитати</text>
<text x="80.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ PARAM_REQUEST_READ (ім'я)</text>
<text x="80.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ PARAM_REQUEST_LIST (усі)</text>
<text x="80.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">← PARAM_VALUE: значення</text>
<text x="80.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">  (напр. WPNAV_SPEED = 500)</text>
<rect x="490.0" y="90.0" width="410.0" height="180.0" rx="9" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="1.6"/>
