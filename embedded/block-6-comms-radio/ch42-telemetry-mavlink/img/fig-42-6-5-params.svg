<text x="510.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ PARAM_SET (ім'я, нове значення)</text>
<text x="510.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">← PARAM_VALUE: підтвердження</text>
