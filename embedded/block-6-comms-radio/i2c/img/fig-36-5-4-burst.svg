<line x1="110.0" y1="100.0" x2="820.0" y2="100.0" stroke="#b08900" stroke-width="2" marker-end="url(#aInk)"/>
<text x="470.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">покажчик авто +1</text>
<text x="450.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">один запит «читай 6 байтів від 0x3B» → усі три осі (X, Y, Z) за раз</text>
<rect x="60.0" y="290.0" width="780.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пакет економить час: замість шести окремих читань — одне з шістьма байтами.</text>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">І дані виходять узгодженими в часі — усі осі з одного моменту, а не «розмазані».</text>
<text x="450.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Майже всі давачі підтримують авто-інкремент — дивись у даташиті «burst / auto-increment».</text>
</svg>
