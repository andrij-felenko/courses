<text x="864.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">0 (низько)</text>
<text x="755.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">0 завжди «сильніший» за 1</text>
<rect x="60.0" y="372.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конфлікту нема в принципі: «тягнути вниз» завжди перемагає, «відпустити» нікому не заважає.</text>
