<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме так звертаються до регістрів давачів (детально — §36.5).</text>
