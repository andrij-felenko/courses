<text x="460.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Між ними дані міняються лише поки SCL низький (правило §36.1).</text>
