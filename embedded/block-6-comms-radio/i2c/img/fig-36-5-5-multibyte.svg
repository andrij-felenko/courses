<text x="450.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Увага на порядок байтів: одні чіпи дають старший першим, інші — молодший (дивись даташит).</text>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А ще виміри часто ЗІ ЗНАКОМ (доповняльний код) — тоді 16 біт треба трактувати як int16.</text>
