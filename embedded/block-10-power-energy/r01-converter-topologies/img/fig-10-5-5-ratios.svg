<rect x="40.0" y="156.0" width="410.0" height="180.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="245.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ Брати, коли:</text>
<text x="60.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• немає місця/бажання на котушку (мала, тиха, дешева)</text>
<text x="60.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• струм малий: мА — сотні мА</text>
<text x="60.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• зсув ЖК-дисплея, від'ємна шина для ОП,</text>
<text x="60.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• напруга програмування flash, bootstrap-затвор</text>
<rect x="470.0" y="156.0" width="410.0" height="180.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="675.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ Не брати, коли:</text>
<text x="490.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• потрібен помітний струм / потужність</text>
<text x="490.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• потрібен високий ККД на проміжній напрузі</text>
<text x="490.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• → тут виграють перетворювачі з котушкою</text>
<text x="490.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">•   (buck / boost / buck-boost із попередніх тем)</text>
<rect x="70.0" y="384.0" width="780.0" height="26.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Помпа — нішевий інструмент для малих допоміжних шин без котушки; силову роботу лишають котушковим топологіям</text>
