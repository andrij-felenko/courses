<rect x="70.0" y="350.0" width="780.0" height="54.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="460.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Обмотки зчеплені не на 100%: частина енергії сидить в індуктивності витоку. При вимиканні ключа їй нема куди подітися —</text>
<text x="460.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і вона б'є викидом напруги на стоку ключа, здатним його пробити.</text>
<text x="460.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Рятунок — снабер (RCD-ланка чи TVS), що поглинає цей викид. Без нього flyback живе недовго.</text>
