<rect x="70.0" y="364.0" width="780.0" height="40.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дротом з'єднати вихід із контролером не можна — це зруйнувало б ізоляцію. Сигнал переносить СВІТЛО в оптопарі</text>
<text x="460.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(або окрема допоміжна обмотка). Так регулювання перетинає бар'єр, а електричної з'єднаності не виникає.</text>
