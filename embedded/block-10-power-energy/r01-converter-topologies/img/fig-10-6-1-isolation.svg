<text x="460.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Навіщо: безпека (торкатися 5 В від мережі 230 В), розрив контурів землі, різні опорні рівні.</text>
