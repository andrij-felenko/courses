<text x="460.0" y="435.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тут застосуємо закон до buck (відомого з §7.4.2); boost і buck-boost відмикають наступні теми тим самим ключем</text>
