<rect x="50.0" y="126.0" width="400.0" height="46.0" rx="8" fill="#f6f9fc" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="70.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">котушка + 2 MOSFET (чи power-stage)</text>
<line x1="456.0" y1="149.0" x2="496.0" y2="149.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="126.0" width="370.0" height="46.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="520.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">СИНХРОННИЙ buck/boost (ККД)</text>
<rect x="50.0" y="182.0" width="400.0" height="46.0" rx="8" fill="#f6f9fc" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="70.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2 котушки + конденсатор між ними</text>
<line x1="456.0" y1="205.0" x2="496.0" y2="205.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="182.0" width="370.0" height="46.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="520.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">SEPIC (вгору/вниз, +вихід)</text>
<rect x="50.0" y="238.0" width="400.0" height="46.0" rx="8" fill="#f6f9fc" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="70.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">трансформатор + оптопара</text>
<line x1="456.0" y1="261.0" x2="496.0" y2="261.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="238.0" width="370.0" height="46.0" rx="8" fill="#eef8ef" stroke="#c0271e" stroke-width="1.8"/>
<text x="520.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ІЗОЛЬОВАНИЙ (flyback) — мережа/безпека</text>
<rect x="50.0" y="294.0" width="400.0" height="46.0" rx="8" fill="#f6f9fc" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="70.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">лише 2–3 однакові конденсатори, без котушки</text>
<line x1="456.0" y1="317.0" x2="496.0" y2="317.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="294.0" width="370.0" height="46.0" rx="8" fill="#eef8ef" stroke="#caa24a" stroke-width="1.8"/>
<text x="520.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">charge pump (мала допоміжна шина)</text>
<rect x="50.0" y="350.0" width="400.0" height="46.0" rx="8" fill="#f6f9fc" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="70.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">велика котушка + контролер + щільні C</text>
<line x1="456.0" y1="373.0" x2="496.0" y2="373.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="350.0" width="370.0" height="46.0" rx="8" fill="#eef8ef" stroke="#1f47b5" stroke-width="1.8"/>
<text x="520.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">силова шина — головний перетворювач</text>
<rect x="70.0" y="404.0" width="780.0" height="26.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Найгаласливіший куток (котушка + ключі + щільні конденсатори) — це вузол перемикання; його тримають компактним</text>
