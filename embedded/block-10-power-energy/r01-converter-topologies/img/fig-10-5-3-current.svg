</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Струм помпи — це заряд, перенесений пакетами</text>
<rect x="70.0" y="50.0" width="760.0" height="32.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="71.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Iвих = Q · f = Cf · ΔV · f      (заряд пакета × скільки пакетів за секунду)</text>
<text x="150.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВХІД</text>
<text x="750.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВИХІД</text>
<rect x="110.0" y="170.0" width="90.0" height="80.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="2"/>
<rect x="700.0" y="170.0" width="90.0" height="80.0" rx="8" fill="#fbe9e7" stroke="#c0271e" stroke-width="2"/>
<rect x="230.0" y="184.0" width="50.0" height="32.0" rx="6" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
