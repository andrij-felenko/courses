<line x1="212.0" y1="200.0" x2="228.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="184.0" width="50.0" height="32.0" rx="6" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="365.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Q</text>
<line x1="322.0" y1="200.0" x2="338.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="450.0" y="184.0" width="50.0" height="32.0" rx="6" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="475.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Q</text>
<line x1="432.0" y1="200.0" x2="448.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="560.0" y="184.0" width="50.0" height="32.0" rx="6" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="585.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Q</text>
<line x1="542.0" y1="200.0" x2="558.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="672.0" y1="200.0" x2="698.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="450.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кожен цикл переносить пакет Q = Cf·ΔV; за секунду таких пакетів f</text>
<rect x="70.0" y="364.0" width="760.0" height="40.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.5"/>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Звідси головне обмеження помпи: більше струму → треба більший Cf або вища частота f.</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому charge pump — для МАЛИХ струмів (міліампери–сотні мА), не для силового живлення.</text>
</svg>
