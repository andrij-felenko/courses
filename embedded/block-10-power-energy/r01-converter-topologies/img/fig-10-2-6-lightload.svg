<polyline points="646.0,200.0 667.0,166.0 688.0,200.0" fill="none" stroke="#b5763a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="688.0,200.0 709.0,166.0 730.0,200.0" fill="none" stroke="#b5763a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="828.0,200.0 849.0,166.0 870.0,200.0" fill="none" stroke="#b5763a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="870.0,200.0 891.0,166.0 912.0,200.0" fill="none" stroke="#b5763a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="646.0" y1="200.0" x2="860.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
<text x="760.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">пачка імпульсів → довгий сон</text>
<text x="760.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">майже нема перемикань → ощадно</text>
<rect x="70.0" y="394.0" width="780.0" height="40.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Синхронний ключ, на відміну від діода, пропускає струм В ОБИДВА боки — тож на легкому навантаженні в CCM струм даремно циркулює.</text>
<text x="460.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Емуляція діода прибирає цю втрату; PFM (пропуск імпульсів) додатково вимикає перемикання у сні — звідси висока ефективність у спокої.</text>
</svg>
