<polyline points="346.0,200.0 367.0,166.0 388.0,200.0 416.0,200.0 416.0,200.0 437.0,166.0 458.0,200.0 486.0,200.0 486.0,200.0 507.0,166.0 528.0,200.0 556.0,200.0" fill="none" stroke="#b5763a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="460.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вимикає нижній на нулі (як діод)</text>
<text x="460.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">немає від'ємного струму</text>
<rect x="620.0" y="56.0" width="280.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="2"/>
