<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два важелі напруги: витки й шпаруватість</text>
<rect x="60.0" y="50.0" width="780.0" height="32.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="71.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vвих = Vвх · (Ns/Np) · D/(1−D)</text>
<rect x="60.0" y="100.0" width="360.0" height="130.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="240.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Важіль 1: коефіцієнт витків Ns/Np</text>
<text x="240.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">груба шкала — задається конструкцією</text>
<text x="240.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мало витків вторинної → велике зниження</text>
<text x="240.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(325 В мережі → 5 В одним трансформатором)</text>
<rect x="480.0" y="100.0" width="360.0" height="130.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="660.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Важіль 2: шпаруватість D</text>
<text x="660.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тонке підстроювання — задається контролером</text>
<text x="660.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримає вихід сталим, поки вхід плаває</text>
<text x="660.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(той самий зворотний звʼязок, що скрізь)</text>
<rect x="120.0" y="260.0" width="660.0" height="90.0" rx="10" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: мережа 230 В ~ → випрямлено ≈ 325 В →  Ns/Np ≈ 1/16, D ≈ 0.3  →  ≈ 5 В</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Витки роблять основне зниження ×16, шпаруватість лише підправляє й стабілізує.</text>
<text x="450.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Це перевага flyback: майже будь-яке відношення напруг — підбором витків.</text>
<rect x="70.0" y="384.0" width="760.0" height="26.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Коефіцієнт витків — додатковий важіль, якого не мали buck/boost: ним беруть будь-яке відношення, навіть величезне</text>
</svg>
