<text x="470.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і ВЕСЬ ряд віддає крихти. «Половина тіні — не половина потужності»: мала тінь коштує величезної частки врожаю.</text>
