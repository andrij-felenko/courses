<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">З циклами ємність повзе вниз, а внутрішній опір — угору. Умовний «кінець життя» зазвичай беруть за падіння ємності до 80%</text>
