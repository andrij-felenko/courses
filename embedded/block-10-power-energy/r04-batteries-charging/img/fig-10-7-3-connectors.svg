<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конектори: полярність, струм, коротке</text>
<rect x="50.0" y="76.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="170.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Полярність</text>
<line x1="70.0" y1="116.0" x2="270.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="170.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ключований роз'єм —</text>
<text x="170.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не вставиш навпаки</text>
<text x="170.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">переполюсування губить</text>
<text x="170.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пристрій (тема 10.4.6)</text>
<rect x="350.0" y="76.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Струм за ПІКОМ</text>
<line x1="370.0" y1="116.0" x2="570.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="470.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тонкий роз'єм гріється</text>
<text x="470.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й просідає (10.4.2/10.3.7)</text>
<text x="470.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">добирати під пік,</text>
<text x="470.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не під середнє</text>
<rect x="650.0" y="76.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#9b59b6" stroke-width="2"/>
<text x="770.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">Не закоротити</text>
<line x1="670.0" y1="116.0" x2="870.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="770.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">голі виводи на викрутці —</text>
<text x="770.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">класична пожежа LiPo</text>
<text x="770.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ізолювати, під'єднувати</text>
<text x="770.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обережно</text>
<rect x="70.0" y="342.0" width="800.0" height="46.0" rx="9" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.4"/>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Три правила конектора: ключований (щоб не переплутати +/−), на повний ПІКОВИЙ струм (інакше гарячий вузол і просадка),</text>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і ніколи не лишати голих виводів, що можуть закоротити об метал. Коротке на батареї — це миттєвий жар і ризик займання.</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Приклад: пристрій із піком 3 А на роз'ємі, розрахованому на 2 А, з часом перегріє й сам роз'єм, і контакти.</text>
</svg>
