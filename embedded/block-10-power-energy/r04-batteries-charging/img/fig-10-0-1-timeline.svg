<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760">
<rect width="940" height="760" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="40.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">До літію: два століття перезаряджуваних батарей</text>
<text x="470.0" y="62.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">колективна історія — і одна гучна несправедливість з іменами</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="690.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="120.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="228.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1800</text>
<text x="274.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Алессандро Вольта (IT)</text>
<text x="274.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«вольтів стовп» — джерело сталого струму, але ПЕРВИННЕ: розрядилось — викинь</text>
<circle cx="250.0" cy="211.0" r="10.0" fill="#fff" stroke="#1f47b5" stroke-width="3.2"/>
<circle cx="250.0" cy="211.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="228.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1859</text>
<text x="274.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Гастон Планте (FR)</text>
<text x="274.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">свинцево-кислотний елемент — перший, що ОЖИВАВ після розряду (акумулятор)</text>
<circle cx="250.0" cy="302.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.4"/>
<text x="228.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1881</text>
<text x="274.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Каміль Фор (FR)</text>
<text x="274.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">намащені пластини — лід-кислота стає практичною й придатною до серії</text>
<circle cx="250.0" cy="393.0" r="10.0" fill="#fff" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="250.0" cy="393.0" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="228.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1899</text>
<text x="274.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Вальдемар Юнгнер (SE)</text>
<text x="274.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лужні NiCd і NiFe — міцна альтернатива свинцю; патент від 11.03.1899</text>
<circle cx="250.0" cy="484.0" r="10.0" fill="#fff" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="484.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="228.0" y="489.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">лют. 1901</text>
<text x="274.0" y="480.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Томас Едісон (US)</text>
<text x="274.0" y="499.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">патентує свій NiFe — на ДВА роки пізніше Юнгнера → судова тяганина</text>
<circle cx="250.0" cy="575.0" r="7.0" fill="#fff" stroke="#c0271e" stroke-width="2.4"/>
<text x="228.0" y="580.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1901–10</text>
<text x="274.0" y="571.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">суд і гроші</text>
<text x="274.0" y="590.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Едісон виграв позов не пріоритетом, а грошима; у світі осіла «батарея Едісона»</text>
<circle cx="250.0" cy="666.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="228.0" y="671.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">XX ст.</text>
<text x="274.0" y="662.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">спадок</text>
<text x="274.0" y="681.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">свинець — авто й UPS; NiCd → Saft (фірма Юнгнера); NiFe — нішевий «вічний»</text>
<text x="470.0" y="730.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жодна з цих хімій — не витвір однієї руки: за кожною стоять попередники, суперники й удосконалювачі.</text>
<text x="470.0" y="748.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">А «батарея Едісона» — приклад, як гучне ім'я й капітал переписують авторство справжнього винахідника (Юнгнера).</text>
</svg>
