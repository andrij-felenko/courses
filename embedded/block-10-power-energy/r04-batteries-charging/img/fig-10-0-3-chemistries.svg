<text x="470.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кожна хімія — компроміс напруги, міцності, ціни й безпеки. Саме ці осі ми порівнюватимемо й для літію в темі 10.4.1.</text>
