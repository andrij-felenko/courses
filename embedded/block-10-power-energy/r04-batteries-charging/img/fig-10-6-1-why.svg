<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Захист батареї: останній рубіж проти чотирьох загроз</text>
<rect x="390.0" y="152.0" width="160.0" height="90.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">комірка</text>
<text x="470.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ ЗАХИСТ</text>
<text x="470.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(відрубує на межі)</text>
<rect x="70.0" y="92.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="175.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Перезаряд</text>
<text x="175.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">OVP: V &gt; ~4.3 В → пожежа</text>
<rect x="660.0" y="92.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="765.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Переразряд</text>
<text x="765.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">UVP: V &lt; ~2.5 В → смерть</text>
<rect x="70.0" y="288.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="175.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Надструм</text>
<text x="175.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">OCP: забагато ампер</text>
<rect x="660.0" y="288.0" width="210.0" height="70.0" rx="10" fill="#ffffff" stroke="#9b59b6" stroke-width="1.8"/>
<text x="765.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">Коротке замикання</text>
<text x="765.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">SCP: миттєвий обрив</text>
<line x1="280.0" y1="127.0" x2="388.0" y2="176.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
