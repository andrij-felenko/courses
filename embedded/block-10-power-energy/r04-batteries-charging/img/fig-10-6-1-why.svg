<line x1="280.0" y1="323.0" x2="388.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="660.0" y1="323.0" x2="552.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Літій нещадний: перезаряд — пожежа, переразряд — смерть комірки, надструм і КЗ — перегрів. Захист стежить за межами</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й АВАРІЙНО відрубує комірку, коли щось пішло не так. Це не зарядник — це останній рубіж, що рятує, коли решта відмовила.</text>
</svg>
