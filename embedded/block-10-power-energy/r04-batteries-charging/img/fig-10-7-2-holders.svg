<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як тримати: три форм-фактори, три підходи</text>
<rect x="50.0" y="70.0" width="240.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="170.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Циліндрична</text>
<text x="170.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(18650-клас)</text>
<line x1="70.0" y1="124.0" x2="270.0" y2="124.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="72.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• пружинний тримач: просто,</text>
<text x="72.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   але контакт гірший (Rвн↑),</text>
<text x="72.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   може розхитатись</text>
<text x="72.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• приварені вивідні: надійно,</text>
<text x="72.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   та складніше в монтажі</text>
<rect x="350.0" y="70.0" width="240.0" height="250.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Пакетна (LiPo)</text>
<text x="470.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">м'яка, без корпусу</text>
<line x1="370.0" y1="124.0" x2="570.0" y2="124.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="372.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• захистити від проколу й тиску</text>
<text x="372.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не навантажувати виводи</text>
<text x="372.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   й тонкі дроти</text>
<text x="372.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• лишити МІСЦЕ на роздуття</text>
<text x="372.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (не затискати намертво)</text>
<rect x="650.0" y="70.0" width="240.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="770.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Монетна</text>
<text x="770.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(coin / button)</text>
<line x1="670.0" y1="124.0" x2="870.0" y2="124.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="672.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тримач із пружним контактом</text>
<text x="672.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• пильнувати полярність</text>
<text x="672.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• малі струми — менше турбот</text>
<text x="672.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• часто припаюють із</text>
<text x="672.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   «пелюстками» (tabs)</text>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кожен форм-фактор має свій спосіб тримання — і свою головну небезпеку: циліндр розхитується, пакет проколюється</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й надувається, монета любить переплутану полярність. Спільне: контакт надійний, а виводи — без механічного навантаження.</text>
</svg>
