<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пороги захисту: вікно, поза яким відрубує</text>
<rect x="240" y="80" width="120" height="32" fill="#fbe2db"/>
<text x="300.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">OVP: відрубити ЗАРЯД</text>
<rect x="240" y="112" width="120" height="162" fill="#dff0e1"/>
<text x="300.0" y="190.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робоче вікно</text>
<text x="300.0" y="206.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2.5–4.2 В</text>
<rect x="240" y="274" width="120" height="46" fill="#e7ecf5"/>
<text x="300.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">UVP: відрубити РОЗРЯД</text>
<rect x="240.0" y="80.0" width="120.0" height="240.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="230.0" y="105.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">OVP ≈ 4.3</text>
<text x="230.0" y="285.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">UVP ≈ 2.5</text>
<rect x="540.0" y="110.0" width="350.0" height="180.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="715.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">А ще — за струмом і теплом</text>
<text x="560.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• OCP — надструм</text>
<text x="577.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">забагато ампер довго → відрубити</text>
<text x="560.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• SCP — коротке</text>
<text x="577.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">миттєвий стрибок → відрубити вмить</text>
<text x="560.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• гістерезис</text>
<text x="577.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вмикає назад лише після відновлення</text>
<text x="560.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• OTP — перегрів</text>
<text x="577.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">є у складніших платах</text>
<rect x="70.0" y="370.0" width="800.0" height="20.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Захист має вікно за напругою (OVP/UVP) і за струмом (OCP/SCP); вийшов за межі — комірку від'єднано. Вмикає назад із гістерезисом.</text>
</svg>
