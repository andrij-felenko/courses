<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хто винайшов нікель-залізний акумулятор?</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пріоритет і авторство — це різні речі, коли в гру входять гроші</text>
<rect x="60.0" y="80.0" width="360.0" height="150.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="240.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Вальдемар Юнгнер (Швеція)</text>
<text x="80.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• патент від 11 березня 1899 р.</text>
<text x="80.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• винайшов NiFe, NiCd і Ag-Cd</text>
<text x="80.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• був ПЕРШИМ — за кілька років до Едісона</text>
<text x="240.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">малий капітал, мала фірма</text>
<rect x="520.0" y="80.0" width="360.0" height="150.0" rx="12" fill="#fbe9e7" stroke="#c0271e" stroke-width="2"/>
<text x="700.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Томас Едісон (США)</text>
<text x="540.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• патент від 5 лютого 1901 р.</text>
<text x="540.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• свій NiFe — на ~2 роки ПІЗНІШЕ</text>
<text x="540.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• потужна компанія й великий капітал</text>
<text x="700.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ім'я, що гриміло на весь світ</text>
<line x1="420.0" y1="155.0" x2="470.0" y2="155.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="520.0" y1="175.0" x2="470.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="390.0" y="270.0" width="160.0" height="50.0" rx="10" fill="#fff7e6" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">СУДОВА ТЯГАНИНА</text>
<text x="470.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(1901–1910-ті)</text>
<line x1="240.0" y1="230.0" x2="440.0" y2="270.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="700.0" y1="230.0" x2="500.0" y2="270.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<line x1="470.0" y1="320.0" x2="470.0" y2="350.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="150.0" y="350.0" width="640.0" height="70.0" rx="12" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Едісон виграв — НЕ пріоритетом, а фінансовими ресурсами.</text>
<text x="470.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">У світ пішла назва «батарея Едісона»; ім'я справжнього першовинахідника Юнгнера — стерлося.</text>
<text x="470.0" y="413.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Едісон реально вдосконалив і впровадив NiFe — та «винайшов першим» тут міф.</text>
</svg>
