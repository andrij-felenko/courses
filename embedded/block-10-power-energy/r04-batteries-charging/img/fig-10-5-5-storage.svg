<text x="470.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому пристрої «на полицю» лишають десь на 50% (3.7–3.8 В), а не повними, і не тримають у спеці.</text>
<text x="470.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(Дуже низький заряд при зберіганні теж погано — комірка може впасти нижче безпечного й померти.)</text>
