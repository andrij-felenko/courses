<text x="250.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">↓ нижче → менше ємності, довше життя</text>
<rect x="70.0" y="350.0" width="760.0" height="38.0" rx="9" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.4"/>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Заряд літію — балансування на вольтах: 4.25 В уже небезпечні, 4.20 дають повну ємність, 4.10 коштують кількох відсотків</text>
<text x="450.0" y="383.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ємності, зате подовжують життя в рази. Тому точність опорної напруги критична, а навмисний недозаряд — легальний прийом.</text>
