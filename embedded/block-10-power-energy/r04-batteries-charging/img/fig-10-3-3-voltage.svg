<text x="234.0" y="154.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">4.20 В</text>
<text x="272.0" y="150.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стандарт: повна ємність</text>
<text x="272.0" y="165.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(точність ±1%!)</text>
