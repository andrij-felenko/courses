<text x="470.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">На РОЗРЯДІ вона ж перша впирається в UVP → пакет зупиняється, хоч у сильніших ще є заряд.</text>
<text x="470.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Корисна ємність пакета = найслабша комірка. Балансування й добір однакових комірок це лікують.</text>
