<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спектр захисту: від плати за долар до повної BMS</text>
<rect x="50.0" y="80.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="170.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Захисна плата</text>
<text x="170.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1S, одна комірка</text>
<line x1="70.0" y1="140.0" x2="270.0" y2="140.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="170.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">OVP/UVP/OCP/SCP</text>
<text x="170.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чип + 2 FET ($1)</text>
<rect x="350.0" y="80.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Захист + баланс</text>
<text x="470.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кілька комірок (nS)</text>
<line x1="370.0" y1="140.0" x2="570.0" y2="140.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="470.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ балансування</text>
<text x="470.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ моніторинг комірок</text>
<rect x="650.0" y="80.0" width="240.0" height="180.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="770.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Повна BMS</text>
<text x="770.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">великі пакети</text>
<line x1="670.0" y1="140.0" x2="870.0" y2="140.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="770.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ SoC/SoH, зв'язок,</text>
<text x="770.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тепловий режим</text>
<line x1="290.0" y1="170.0" x2="348.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="590.0" y1="170.0" x2="648.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Мінімум для БУДЬ-ЯКОГО літію — захисна плата (часто вже в комірці). Кілька комірок послідовно — додається балансування.</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Великі пакети (транспорт, накопичувачі) — повноцінна BMS з моніторингом, зв'язком і тепловим керуванням. Чим більше — тим складніше.</text>
</svg>
