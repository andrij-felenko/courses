<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що пришвидшує старіння літію</text>
<rect x="40.0" y="80.0" width="215.0" height="150.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="147.5" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Спека</text>
<line x1="55.0" y1="122.0" x2="240.0" y2="122.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="147.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кожні +10°C ≈ вдвічі</text>
<text x="147.5" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">швидше (Арреніус)</text>
<rect x="270.0" y="80.0" width="215.0" height="150.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="377.5" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Зберігання на 100%</text>
<line x1="285.0" y1="122.0" x2="470.0" y2="122.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="377.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повний заряд старить</text>
<text x="377.5" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">найшвидше, надто в теплі</text>
<rect x="500.0" y="80.0" width="180.0" height="150.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="590.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Глибокий розряд</text>
<line x1="515.0" y1="122.0" x2="665.0" y2="122.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="590.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розряд «у нуль» і нижче</text>
<text x="590.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ушкоджує комірку</text>
<rect x="695.0" y="80.0" width="205.0" height="150.0" rx="12" fill="#ffffff" stroke="#9b59b6" stroke-width="2"/>
<text x="797.5" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">Струм і холодний заряд</text>
<line x1="710.0" y1="122.0" x2="885.0" y2="122.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="797.5" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">великий C-rate, заряд &lt;0°C —</text>
<text x="797.5" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стрес і осад літію</text>
<rect x="70.0" y="350.0" width="800.0" height="38.0" rx="9" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.4"/>
<text x="470.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Головний прискорювач — ТЕПЛО: воно множить швидкість усіх реакцій старіння. Найгірша пара — гаряче І повністю заряджене.</text>
<text x="470.0" y="383.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">За календарним старінням стоїть переважно ріст захисного шару SEI, що поволі з'їдає літій і піднімає опір.</text>
</svg>
