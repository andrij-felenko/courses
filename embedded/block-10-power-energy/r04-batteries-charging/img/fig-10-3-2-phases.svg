<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Фази заряду літію: від «мертвої» до повної</text>
<rect x="40.0" y="86.0" width="130.0" height="96.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="105.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">низька дуже?</text>
<text x="105.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо &lt; ~3 В —</text>
<text x="105.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обережний старт</text>
<line x1="170.0" y1="134.0" x2="225.0" y2="134.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="225.0" y="86.0" width="130.0" height="96.0" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
<text x="290.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕДЗАРЯД</text>
<text x="290.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">малий струм,</text>
<text x="290.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">поки V не підросте</text>
<line x1="355.0" y1="134.0" x2="410.0" y2="134.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="410.0" y="86.0" width="130.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="475.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CC</text>
<text x="475.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повний струм,</text>
<text x="475.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">напруга росте</text>
<line x1="540.0" y1="134.0" x2="595.0" y2="134.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="595.0" y="86.0" width="130.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="660.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CV</text>
<text x="660.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримаю 4.2 В,</text>
<text x="660.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">струм спадає</text>
<line x1="725.0" y1="134.0" x2="780.0" y2="134.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="780.0" y="86.0" width="130.0" height="96.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="845.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">СТОП</text>
<text x="845.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">I &lt; C/10 —</text>
<text x="845.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заряд завершено</text>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у нормі комірка стартує одразу з CC; передзаряд — лише для глибоко сівшої (пор. power path, 10.3.6)</text>
<rect x="70.0" y="310.0" width="800.0" height="38.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Більшість заряду входить у фазі CC; повільний «хвіст» CV доливає останні відсотки. Передзаряд рятує глибоко розряджену</text>
<text x="470.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">комірку: повний струм у майже мертвий літій небезпечний, тож спершу — крапельку, поки напруга не вийде в безпечну зону.</text>
</svg>
