<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зберігання, перевезення, утилізація</text>
<rect x="50.0" y="76.0" width="240.0" height="200.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="170.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Зберігати</text>
<line x1="70.0" y1="116.0" x2="270.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="72.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ~50% заряду, прохолодно (10.4.5)</text>
<text x="72.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• у вогнетривкій ємності</text>
<text x="72.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ПОДАЛІ від металу (монети,</text>
<text x="72.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   ключі = коротке!)</text>
<rect x="350.0" y="76.0" width="240.0" height="200.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Перевозити</text>
<line x1="370.0" y1="116.0" x2="570.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="372.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• низький заряд (часто ~30%)</text>
<text x="372.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• межі за ват-годинами</text>
<text x="372.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• авіа — суворі правила,</text>
<text x="372.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   пошкоджені — заборонені</text>
<rect x="650.0" y="76.0" width="240.0" height="200.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="770.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Утилізувати</text>
<line x1="670.0" y1="116.0" x2="870.0" y2="116.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="672.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• НІКОЛИ не в смітник</text>
<text x="672.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (пожежа у відходах)</text>
<text x="672.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• здавати в пункти прийому</text>
<text x="672.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• надуті/биті — тим паче</text>
<rect x="70.0" y="342.0" width="800.0" height="46.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Літій небезпечний і поза пристроєм: зберігати напівзарядженим, прохолодним і подалі від металу, що може закоротити виводи;</text>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перевозити з низьким зарядом і в межах правил (надто авіа); а наприкінці — здавати на утилізацію, бо в смітнику літій горить.</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Це не бюрократія, а та сама фізика: заряджений літій — це запас енергії, що за коротким чи проколом виходить теплом.</text>
</svg>
