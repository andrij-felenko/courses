<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лічба заряду в прошивці: інтеграл струму з корекціями</text>
<rect x="40.0" y="110.0" width="140.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="110.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">АЦП струму</text>
<text x="110.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(шунт)</text>
<line x1="180.0" y1="140.0" x2="258.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="220.0" y="110.0" width="140.0" height="60.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="290.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">− зсув</text>
<text x="290.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(калібр. нуля)</text>
<line x1="360.0" y1="140.0" x2="438.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="400.0" y="110.0" width="140.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="470.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">× Δt, ∫</text>
<text x="470.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інтегрувати</text>
<line x1="540.0" y1="140.0" x2="618.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="580.0" y="110.0" width="140.0" height="60.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="650.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Q += I·Δt</text>
<text x="650.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">накопичувач</text>
<line x1="720.0" y1="140.0" x2="798.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="760.0" y="110.0" width="140.0" height="60.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="830.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SoC = SoC0</text>
<text x="830.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">− Q/Ємність</text>
<rect x="120.0" y="230.0" width="320.0" height="56.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="280.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЯКОРІ (скидають дрейф)</text>
<text x="280.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повний заряд → SoC=100, Q=0;  відсічка → SoC=0</text>
<line x1="280.0" y1="230.0" x2="650.0" y2="172.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aGreen)"/>
<rect x="500.0" y="230.0" width="320.0" height="56.0" rx="10" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="660.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">НАПРУГА у спокої (фьюжн)</text>
<text x="660.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">м'яко підправляє Q проти дрейфу (10.4.4)</text>
<line x1="660.0" y1="230.0" x2="810.0" y2="172.0" stroke="#caa24a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#aInk)"/>
<rect x="70.0" y="342.0" width="800.0" height="46.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Серце — періодичне Q += I·Δt; та без двох підпорок воно бреше: ЯКОРІ на повному/порожньому скидають накопичений дрейф,</text>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а НАПРУГА у спокої м'яко тягне оцінку до істини. Окремо віднімають зсув АЦП — інакше навіть «нульовий» струм інтегрується в помилку.</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">І ділять на ВИВЧЕНУ ємність (вона тане з віком, тема 10.4.5), а не на паспортну.</text>
</svg>
