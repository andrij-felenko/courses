<text x="616.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   (низький Rвн, високий C-rate)</text>
<text x="616.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Не працюй біля «порожньо»,</text>
<text x="616.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   якщо потрібні піки</text>
<text x="616.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Великий конденсатор —</text>
<text x="616.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   для КОРОТКИХ піків (мс і менше)</text>
<text x="616.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Поріг brownout — із запасом</text>
<text x="616.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">   на найгіршу просадку</text>
<rect x="70.0" y="360.0" width="800.0" height="38.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Чесний нюанс: конденсатор рятує лише КОРОТКІ піки (мікро- й мілісекунди). Довгий пік (радіо TX на 100 мс) йому не під силу —</text>
<text x="470.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тут потрібна сама комірка з малим Rвн або більша батарея. Деталі розрахунку — у 🧮-вставці про просадку.</text>
