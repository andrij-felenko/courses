<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Надутий LiPo: попередження, яке не можна ігнорувати</text>
<rect x="90.0" y="92.0" width="150.0" height="64.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="165.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нормальний</text>
<text x="165.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">плаский</text>
<line x1="250.0" y1="124.0" x2="308.0" y2="124.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="280.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">газ</text>
<ellipse cx="400" cy="124" rx="80" ry="46" fill="#fbe2db" stroke="#c0271e" stroke-width="2"/>
<text x="400.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">НАДУТИЙ</text>
<text x="400.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(газ усередині)</text>
<text x="400.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= комірку пошкоджено</text>
<rect x="530.0" y="84.0" width="360.0" height="100.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="710.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому надувається</text>
<text x="548.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розклад електроліту → газ:</text>
<text x="562.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перезаряд, перегрів, прокол,</text>
<text x="562.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">глибокий розряд, старість (10.4.5)</text>
<text x="548.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">це знак ушкодження, не «втоми»</text>
<rect x="70.0" y="218.0" width="800.0" height="112.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="470.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Що робити з надутою коміркою</text>
<text x="110.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1. НЕГАЙНО припинити заряд і використання</text>
<text x="110.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2. Ізолювати: вогнетривка ємність / пісок / надвір, подалі від горючого</text>
<text x="110.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3. НЕ проколювати, не тиснути, не «здувати» — газ горючий, прокол = займання</text>
<text x="110.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4. Здати на утилізацію батарей; не в смітник</text>
<rect x="70.0" y="390.0" width="800.0" height="20.0" rx="8" fill="#fff7e6" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="405.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">І на майбутнє: у корпусі ЛИШАЮТЬ місце на роздуття — затиснутий намертво пакет, надуваючись, тисне на все довкола.</text>
</svg>
