<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410">
<rect width="940" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Проєктувати «під деградацію»</text>
<text x="200.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Користуватися СЕРЕДИНОЮ</text>
<rect x="140.0" y="90.0" width="120.0" height="200.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="140" y="90" width="120" height="40" fill="#fbe2db"/>
<text x="200.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">не до 100%</text>
<rect x="140" y="130" width="120" height="110" fill="#dff0e1"/>
<text x="200.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робоче вікно</text>
<text x="200.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(напр. 20–80%)</text>
<rect x="140" y="240" width="120" height="50" fill="#fbe2db"/>
<text x="200.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">не в нуль</text>
<rect x="330.0" y="76.0" width="560.0" height="230.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="610.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шість ходів довговічності</text>
<text x="348.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Бери батарею БІЛЬШУ: щоб і на 80% EoL вистачало</text>
<text x="348.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Заряджай нижче (4.1 В) — життя в рази довше</text>
<text x="348.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Циклюй серединою, не «0–100%»</text>
<text x="348.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Тримай прохолодно; уникай «спека + повна»</text>
<text x="348.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Зберігай на ~50%, не повною</text>
<text x="348.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Передбач ЗАМІНУ батареї в конструкції</text>
<rect x="70.0" y="370.0" width="800.0" height="28.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Деградація неминуча — її ПЛАНУЮТЬ: запас ємності на кінець життя, лагідний режим і можливість замінити батарею.</text>
<text x="470.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Здоров'я (SoH) тим часом стежать за двома знаками: спад ємності (паливомір) і зростання Rвн.</text>
</svg>
