<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Коли частина панелі в тіні, bypass-діоди роблять криву P-V «горбатою» — з кількома піками. Простий алгоритм MPPT легко</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«застрягає» на ЛОКАЛЬНОМУ горбі, проґавивши вищий глобальний. Як цьому раду дають — у темі про алгоритми MPPT (10.5.5).</text>
