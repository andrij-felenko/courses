<rect x="70.0" y="376.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Послідовно елементи додають НАПРУГУ (Voc і Vmp множаться на N), струм лишається як в одного. Паралельно — навпаки:</text>
<text x="470.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">додають СТРУМ (Isc, Imp ×N), напруга та сама. Крива панелі — це крива елемента, розтягнута по осях. Так із ~0.5 В будують панель.</text>
