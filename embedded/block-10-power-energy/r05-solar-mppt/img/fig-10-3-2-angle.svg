<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кут падіння: світло йде як cos θ</text>
<line x1="110.0" y1="250.0" x2="330.0" y2="250.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="220.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">панель</text>
<line x1="220.0" y1="250.0" x2="220.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="226.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">нормаль</text>
<line x1="220.0" y1="120.0" x2="220.0" y2="235.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="238.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0°  ×1.0</text>
<line x1="120.0" y1="130.0" x2="208.0" y2="238.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="108.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">30°  ×0.87</text>
<line x1="70.0" y1="205.0" x2="200.0" y2="244.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="60.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">60°  ×0.5</text>
<circle cx="150.0" cy="95.0" r="13.0" fill="#fdf3d0" stroke="#caa24a" stroke-width="2"/>
<line x1="165.6" y1="95.0" x2="172.1" y2="95.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="161.0" y1="106.0" x2="165.6" y2="110.6" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="150.0" y1="110.6" x2="150.0" y2="117.1" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="139.0" y1="106.0" x2="134.4" y2="110.6" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="134.4" y1="95.0" x2="127.9" y2="95.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="139.0" y1="84.0" x2="134.4" y2="79.4" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="150.0" y1="79.4" x2="150.0" y2="72.9" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="161.0" y1="84.0" x2="165.6" y2="79.4" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<rect x="560.0" y="90.0" width="330.0" height="200.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="725.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому cos θ</text>
<text x="578.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">та сама «жменя» променів, падаючи</text>
<text x="578.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">косо, розмазується по БІЛЬШІЙ площі →</text>
<text x="578.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на одиницю площі світла менше</text>
<text x="578.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0° — у лоб: повне</text>
<text x="578.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">60° — удвічі менше (cos 60° = 0.5)</text>
<text x="578.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а сонце ходить небом цілий день,</text>
<text x="578.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тож нерухома панель майже завжди коса</text>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Панель ловить світло пропорційно КОСИНУСУ кута між сонцем і її нормаллю: у лоб — повне, під 60° — лише половина. А сонце</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повзе небом, тож нерухома панель майже весь день «коса». Звідси — чому орієнтація й нахил важать, а ранок із вечором дають мало.</text>
</svg>
