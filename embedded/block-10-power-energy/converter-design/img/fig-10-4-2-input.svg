<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вхідний конденсатор — найбільш навантажена деталь за RMS-струмом</text>
<line x1="110.0" y1="240.0" x2="110.0" y2="80.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="110.0" y1="230.0" x2="760.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="762.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">t</text>
<text x="94.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">iвх</text>
<polyline points="110.0,230.0 110.0,110.0 170.0,110.0 170.0,230.0 310.0,230.0" fill="none" stroke="#b5763a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="310.0,230.0 310.0,110.0 370.0,110.0 370.0,230.0 510.0,230.0" fill="none" stroke="#b5763a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="510.0,230.0 510.0,110.0 570.0,110.0 570.0,230.0 710.0,230.0" fill="none" stroke="#b5763a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b5763a" text-anchor="start" font-weight="bold" font-style="normal">Iнаван (повний струм)</text>
<line x1="110.0" y1="194.0" x2="720.0" y2="194.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="6,4" stroke-linecap="round"/>
<text x="726.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Iвх сер = D·Iнаван</text>
<text x="330.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">джерело має давати лише СЕРЕДНЄ; різницю (ривки) бере на себе вхідний конденсатор</text>
<rect x="60.0" y="300.0" width="780.0" height="70.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.5"/>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Iвх(rms) ≈ Iнаван·√(D·(1−D))   — максимум при D=0.5 (≈ 0.5·Iнаван)</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Цей RMS-струм гріє кондер через його ESR — тому вхідний добирають за RMS-струмом, а не лише за ємністю</text>
</svg>
