<text x="792.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b5763a" text-anchor="start" font-weight="bold" font-style="normal">Cвих</text>
<circle cx="760.0" cy="140.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="760.0" y1="140.0" x2="690.0" y2="230.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="660.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">відбір ПРЯМО з виводів Cвих,</text>
<text x="660.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">окремою тихою доріжкою (без струму) ✓</text>
<rect x="70.0" y="360.0" width="760.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">FB-вузол чутливий (§10.2.5): беруть напругу Kelvin-доріжкою прямо з виводів вихідного конденсатора —</text>
<text x="450.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">так контролер бачить СПРАВЖНІЙ вихід, а не падіння на доріжці; землю дільника — теж із тихої точки.</text>
