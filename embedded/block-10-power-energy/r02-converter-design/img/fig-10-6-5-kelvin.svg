<line x1="760.0" y1="140.0" x2="760.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="744.0" y1="175.0" x2="776.0" y2="175.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
