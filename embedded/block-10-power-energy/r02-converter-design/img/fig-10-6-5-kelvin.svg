<text x="240.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Погано</text>
<line x1="80.0" y1="140.0" x2="360.0" y2="140.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="80.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Vвих-доріжка (тече струм)</text>
<circle cx="180.0" cy="140.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="180.0" y1="140.0" x2="180.0" y2="200.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="180.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">FB тут</text>
<text x="240.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">відбір посеред силової доріжки:</text>
<text x="240.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ловить падіння IR + шум SW ✗</text>
<rect x="470.0" y="70.0" width="380.0" height="250.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="660.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Добре (Kelvin)</text>
