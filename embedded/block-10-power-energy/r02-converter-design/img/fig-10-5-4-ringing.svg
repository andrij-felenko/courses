<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому контур дзвенить: перекорекція із запізненням</text>
<circle cx="250.0" cy="100.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="250.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихід просів</text>
<circle cx="360.0" cy="210.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="372.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">контур СИЛЬНО додає D</text>
<circle cx="250.0" cy="320.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="250.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихід ПЕРЕскочив угору</text>
<circle cx="140.0" cy="210.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="128.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">контур різко прибирає D</text>
<path d="M 280 104 A 110 110 0 0 1 356 180" fill="none" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<path d="M 356 240 A 110 110 0 0 1 280 316" fill="none" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<path d="M 220 316 A 110 110 0 0 1 144 240" fill="none" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<path d="M 144 180 A 110 110 0 0 1 220 104" fill="none" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="500.0" y="110.0" width="360.0" height="200.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="680.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Аналогія: водій на слизькому</text>
<text x="520.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">машину занесло вліво →</text>
<text x="520.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">різко крутить кермо вправо →</text>
<text x="520.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">заносить вправо →</text>
<text x="520.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крутить вліво… і так гойдається.</text>
<text x="520.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="520.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Спокійний водій (повільніший контур)</text>
<text x="520.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">не перекручує — і занос гасне без рисків.</text>
<rect x="70.0" y="350.0" width="760.0" height="22.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Контур реагує із запізненням; якщо коригує надто сильно — перестрибує, потім перестрибує назад: це і є дзвін</text>
</svg>
