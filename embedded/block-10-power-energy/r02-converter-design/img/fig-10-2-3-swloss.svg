<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки втрати: перекриття V та I на кожному перемиканні</text>
<line x1="110.0" y1="260.0" x2="110.0" y2="80.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="110.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="702.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">t</text>
<polyline points="110.0,240.0 300.0,240.0 360.0,100.0 680.0,100.0" fill="none" stroke="#c0271e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="560.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">напруга на ключі V</text>
<polyline points="110.0,100.0 300.0,100.0 360.0,240.0 680.0,240.0" fill="none" stroke="#1f47b5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
