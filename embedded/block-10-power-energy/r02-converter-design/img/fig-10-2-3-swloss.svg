<text x="420.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= енергія в тепло</text>
<line x1="415.0" y1="188.0" x2="345.0" y2="178.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="60.0" y="300.0" width="780.0" height="70.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Pперемик ≈ ½·Vвх·Iнаван·(tвкл+tвикл)·f   +   Qg·Vкер·f</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обидві складові ∝ f: що частіше перемикаєш, то більше тепла (від перекриття й перезаряду затвора, §2.7.7)</text>
<rect x="70.0" y="400.0" width="760.0" height="22.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому частоту не задирають безмежно: кожне ввімкнення-вимкнення коштує енергії, і ця ціна росте лінійно з f</text>
</svg>
