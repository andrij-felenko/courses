  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Частота і завади: гармоніки та чутливі смуги</text>
<line x1="100.0" y1="250.0" x2="820.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="100.0" y1="250.0" x2="100.0" y2="80.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="822.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">частота</text>
<text x="90.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">амплітуда</text>
<rect x="380" y="90" width="120" height="160" fill="#c0271e" fill-opacity="0.10"/>
<text x="440.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чутлива смуга</text>
<text x="440.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">(напр. радіо)</text>
<line x1="160.0" y1="250.0" x2="160.0" y2="100.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="160.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">f</text>
<line x1="250.0" y1="250.0" x2="250.0" y2="154.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="250.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">2·f</text>
<line x1="340.0" y1="250.0" x2="340.0" y2="186.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="340.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">3·f</text>
<line x1="430.0" y1="250.0" x2="430.0" y2="206.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="430.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">4·f</text>
<line x1="520.0" y1="250.0" x2="520.0" y2="220.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="520.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">5·f</text>
<text x="650.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">спред-спектрум:</text>
<text x="650.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тремтіння f розмазує</text>
<text x="650.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">піки в смугу (нижчі)</text>
<polyline points="600.0,220.0 620.0,212.0 640.0,216.0 660.0,210.0 680.0,217.0 700.0,211.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="70.0" y="380.0" width="760.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">f і її гармоніки (2f, 3f…) не повинні падати в чутливу смугу. Частоту підбирають так, щоб гармоніки минали радіо;</text>
<text x="450.0" y="411.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спред-спектрум розмазує гострі піки в ширшу смугу, знижуючи їх — корисно для проходження ЕМС-тестів.</text>
</svg>
