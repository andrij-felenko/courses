</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наскрізний вибір: конденсатори для шини 5 В / 3 А</text>
<rect x="50.0" y="66.0" width="250.0" height="42.0" rx="7" fill="#f6f9fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="66.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Вихідний: пульсація</text>
<line x1="306.0" y1="87.0" x2="336.0" y2="87.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="66.0" width="510.0" height="42.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="356.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ΔV≤50 мВ → C з ΔI/(8fC) + ESR·ΔI; кераміка низькоESR</text>
<rect x="50.0" y="120.0" width="250.0" height="42.0" rx="7" fill="#f6f9fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="66.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Вихідний: перехідний</text>
<line x1="306.0" y1="141.0" x2="336.0" y2="141.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="120.0" width="510.0" height="42.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="356.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">провал ≤150 мВ на стрибку → ще більше C (енергія §10.2.1)</text>
<rect x="50.0" y="174.0" width="250.0" height="42.0" rx="7" fill="#f6f9fc" stroke="#c0271e" stroke-width="1.8"/>
<text x="66.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Вхідний: RMS-струм</text>
<line x1="306.0" y1="195.0" x2="336.0" y2="195.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="174.0" width="510.0" height="42.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="356.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Iвх(rms)=3·√(0.3·0.7)≈1.4 А → кондер з таким RMS-рейтингом</text>
<rect x="50.0" y="228.0" width="250.0" height="42.0" rx="7" fill="#f6f9fc" stroke="#caa24a" stroke-width="1.8"/>
<text x="66.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">DC-bias запас</text>
<line x1="306.0" y1="249.0" x2="336.0" y2="249.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="228.0" width="510.0" height="42.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="356.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">номінал кераміки × ~2–3 і вища робоча напруга</text>
<rect x="50.0" y="282.0" width="250.0" height="42.0" rx="7" fill="#f6f9fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="66.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Розміщення</text>
<line x1="306.0" y1="303.0" x2="336.0" y2="303.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="282.0" width="510.0" height="42.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="356.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кераміка щільно до ключів (коротка гаряча петля §10.2.6)</text>
<rect x="70.0" y="350.0" width="760.0" height="22.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Вихідний — за пульсацією й перехідним; вхідний — за RMS-струмом; кераміку рахують з урахуванням DC-bias</text>
</svg>
