<text x="150.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет живлення</text>
<text x="150.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(§8.1.4):</text>
<text x="150.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«шина 5 В, 3 А»</text>
<line x1="264.0" y1="195.0" x2="330.0" y2="195.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="297.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розгорнути</text>
<rect x="340.0" y="70.0" width="540.0" height="320.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="610.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ТЗ перетворювача</text>
<circle cx="362.0" cy="120.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Vвх: діапазон  (min … max), не одне число</text>
<circle cx="362.0" cy="149.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Vвих: ціль + допуск  (5.0 В ± 2 %)</text>
<circle cx="362.0" cy="178.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Iвих: максимальний + піковий/перехідний</text>
<circle cx="362.0" cy="207.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Пульсація виходу:  ≤ … мВ (за навантаженням)</text>
<circle cx="362.0" cy="236.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Перехідний процес:  провал ≤ …, час ≤ …</text>
<circle cx="362.0" cy="265.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="269.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ККД:  ціль у заданих точках навантаження</text>
<circle cx="362.0" cy="294.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Тепло:  Tамб, допустиме нагрівання</text>
<circle cx="362.0" cy="323.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ЕМС / шум, розмір, ціна</text>
<circle cx="362.0" cy="352.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="376.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Захисти:  OCP / OVP / теплозахист</text>
<rect x="70.0" y="406.0" width="780.0" height="24.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="423.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Перетворювач, побудований без ТЗ, майже завжди побудований не так. Спершу — специфікація, тоді деталі</text>
</svg>
