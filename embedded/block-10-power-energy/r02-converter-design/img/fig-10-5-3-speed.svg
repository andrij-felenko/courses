<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напруга швидкості й стабільності: три реакції на стрибок</text>
<rect x="20.0" y="64.0" width="280.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="160.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Заповільний</text>
<line x1="50.0" y1="200.0" x2="280.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="50.0" y1="110.0" x2="50.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
<text x="160.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">млявий, глибокий провал</text>
<polyline points="50.0,200.0 100.0,200.0 108.0,250.0 190.0,220.0 280.0,204.0" fill="none" stroke="#c0271e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="320.0" y="64.0" width="280.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="460.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Саме так</text>
<line x1="350.0" y1="200.0" x2="580.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="350.0" y1="110.0" x2="350.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
<text x="460.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">малий провал, чисте відновлення ✓</text>
<polyline points="350.0,200.0 400.0,200.0 408.0,228.0 440.0,204.0 580.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="620.0" y="64.0" width="280.0" height="250.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="760.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Зашвидкий/агресивний</text>
<line x1="650.0" y1="200.0" x2="880.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="650.0" y1="110.0" x2="650.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
<text x="760.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">дзвенить — мала стійкість</text>
<polyline points="650.0,200.0 700.0,200.0 708.0,234.0 736.0,174.0 764.0,218.0 792.0,188.0 820.0,208.0 850.0,196.0 870.0,200.0" fill="none" stroke="#caa24a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="70.0" y="360.0" width="780.0" height="28.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.5"/>
<text x="460.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Заповільний контур дає глибокий провал; зашвидкий «перестаравшись» дзвенить чи коливається.</text>
<text x="460.0" y="391.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Мета — посередині: швидко, але без дзвону. Це баланс, який і налаштовує компенсація.</text>
</svg>
