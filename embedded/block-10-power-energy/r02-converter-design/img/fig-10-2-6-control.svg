<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Режим керування: за напругою чи за струмом (якісно)</text>
<rect x="50.0" y="70.0" width="380.0" height="250.0" rx="12" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="240.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">За напругою (voltage-mode)</text>
<text x="72.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">міряє лише вихідну напругу</text>
<text x="72.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">простіша ідея</text>
<text x="72.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">− немає вбудованого ліміту струму</text>
<text x="72.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">− повільніша реакція</text>
<text x="72.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">− складніше стабілізувати</text>
<rect x="470.0" y="70.0" width="380.0" height="250.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="660.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">За струмом (current-mode)</text>
<text x="492.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">міряє ще й струм котушки</text>
<text x="492.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ ліміт струму ПОцикловий (захист)</text>
<text x="492.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ швидша реакція на вхід</text>
<text x="492.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ простіша компенсація</text>
<text x="492.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">майже всі сучасні контролери</text>
<rect x="70.0" y="346.0" width="760.0" height="24.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">За замовчуванням беруть current-mode: вбудований поцикловий захист за струмом і легша стабільність (деталі стійкості — 10.2.5)</text>
