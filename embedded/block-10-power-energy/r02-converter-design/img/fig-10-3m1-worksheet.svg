<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розрахунок котушки покроково: buck 5 В → 3.3 В, 2 А, 500 кГц</text>
<rect x="40.0" y="56.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<circle cx="64.0" cy="76.0" r="13.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="64.0" y="81.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="96.0" y="73.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Шпаруватість</text>
<text x="96.0" y="89.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">D = Vвих/Vвх = 3.3/5 = 0.66</text>
<rect x="40.0" y="102.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="64.0" cy="122.0" r="13.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="64.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="96.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Цільова пульсація</text>
<text x="96.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ΔI = 35 %·2 А = 0.7 А</text>
<rect x="40.0" y="148.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<circle cx="64.0" cy="168.0" r="13.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="64.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="96.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Індуктивність</text>
<text x="96.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">L = (Vвх−Vвих)·D/(ΔI·f) = 1.7·0.66/(0.7·500к) ≈ 3.2 мкГ → беремо 3.3 мкГ</text>
<rect x="40.0" y="194.0" width="820.0" height="40.0" rx="6" fill="#f6f6f6" stroke="#e4e4e4" stroke-width="1"/>
<text x="96.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">(перерахунок ΔI)</text>
<text x="96.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ΔI = 1.7·0.66/(3.3мкГ·500к) ≈ 0.68 А = 34 % ✓</text>
<rect x="40.0" y="240.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<circle cx="64.0" cy="260.0" r="13.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="64.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<text x="96.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Пік → Isat</text>
<text x="96.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Iпік = 2 + 0.68/2 ≈ 2.34 А → Isat ≥ 2.34·1.3 ≈ 3.3 А</text>
<rect x="40.0" y="286.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<circle cx="64.0" cy="306.0" r="13.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="64.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="96.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Тривалий → Irms</text>
<text x="96.0" y="319.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Iнаван(rms) ≈ 2 А → Irms ≥ 2.5 А (із запасом)</text>
<rect x="40.0" y="332.0" width="820.0" height="40.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="64.0" cy="352.0" r="13.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="64.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<text x="96.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">DCR → втрати</text>
<text x="96.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">DCR 30 мОм → Pмідь = 2²·0.03 = 0.12 Вт</text>
<rect x="40.0" y="382.0" width="820.0" height="40.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="450.0" y="407.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Котушка: 3.3 мкГ · Isat ≥ 3.3 А · Irms ≥ 2.5 А · DCR ~30 мОм (екранована, з запасом за гарячим Isat)</text>
</svg>
