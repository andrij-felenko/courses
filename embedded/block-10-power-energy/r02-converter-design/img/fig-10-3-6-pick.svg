<rect x="320.0" y="258.0" width="530.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="338.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">малий: 20 мОм → Pмідь=3²·0.02=0.18 Вт</text>
