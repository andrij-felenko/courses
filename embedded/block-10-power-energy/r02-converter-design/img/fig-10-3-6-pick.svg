<text x="338.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крива ккд/нагріву в даташиті у твоїх точках</text>
<rect x="70.0" y="370.0" width="760.0" height="22.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Котушка готова, коли пройдені ВСІ шість кроків: одна пропущена межа (частіше Isat або Irms) — і вузол ненадійний</text>
