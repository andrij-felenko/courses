<text x="338.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≥ Iпік × 1.3 ≈ 4.5 А (магнітна межа)</text>
