<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vвх — це діапазон, а не число: кожен край щось диктує</text>
<line x1="110.0" y1="150.0" x2="800.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
