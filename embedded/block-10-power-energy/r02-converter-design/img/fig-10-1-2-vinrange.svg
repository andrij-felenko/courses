<text x="812.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Vвх</text>
<line x1="280.0" y1="138.0" x2="280.0" y2="162.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<line x1="620.0" y1="138.0" x2="620.0" y2="162.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
