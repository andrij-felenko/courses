  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перевертаємо роль: від sink до source</text>
<line x1="460.0" y1="60.0" x2="460.0" y2="330.0" stroke="#e4e4e4" stroke-width="1.5" stroke-dasharray="6,5" stroke-linecap="round"/>
<text x="235.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Досі: пристрій БЕРЕ (sink)</text>
<rect x="90.0" y="110.0" width="110.0" height="70.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="145.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">джерело</text>
<text x="145.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(Rp)</text>
<rect x="330.0" y="110.0" width="110.0" height="70.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="385.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">наш пристрій</text>
<text x="385.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Rd · бере</text>
<line x1="200.0" y1="145.0" x2="328.0" y2="145.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="264.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">VBUS →</text>
<text x="235.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">виставляє Rd, просить, споживає</text>
<text x="685.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Тепер: пристрій ДАЄ (source)</text>
<rect x="540.0" y="110.0" width="120.0" height="70.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">наш пристрій</text>
<text x="600.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Rp · живить</text>
<rect x="780.0" y="110.0" width="110.0" height="70.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="835.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">споживач</text>
<text x="835.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(Rd)</text>
<line x1="660.0" y1="145.0" x2="778.0" y2="145.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="719.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">VBUS →</text>
<text x="685.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">виставляє Rp, дає 5 В, у PD відповідає як джерело</text>
<rect x="70.0" y="344.0" width="780.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Щоб давати живлення, пристрій міняє роль на дзеркальну: підтяжка Rp замість Rd (тема 10.3.2), сам виставляє</text>
<text x="460.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">5 В на VBUS, а схоче PD — відповідає на чужі запити меню профілів (тема 10.3.3). Той самий роз'єм, інший бік розмови.</text>
</svg>
