<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
<rect width="920" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від «зоопарку» роз'ємів до одного USB-C</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">до 2009-го майже кожен виробник мав свій штекер — нова модель означала новий зарядний на смітник</text>
<text x="170.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">БУЛО: десятки несумісних</text>
<rect x="70.0" y="96.0" width="28.0" height="28.0" rx="4" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<rect x="80.0" y="105.0" width="12.0" height="10.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="110.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">циліндр (barrel)</text>
<line x1="300.0" y1="110.0" x2="360.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<rect x="70.0" y="151.0" width="28.0" height="28.0" rx="4" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<rect x="80.0" y="160.0" width="12.0" height="10.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="110.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">mini-USB</text>
<line x1="300.0" y1="165.0" x2="360.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<rect x="70.0" y="206.0" width="28.0" height="28.0" rx="4" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<rect x="80.0" y="215.0" width="12.0" height="10.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="110.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Nokia тонкий</text>
<line x1="300.0" y1="220.0" x2="360.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<rect x="70.0" y="261.0" width="28.0" height="28.0" rx="4" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<rect x="80.0" y="270.0" width="12.0" height="10.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="110.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">30-pin (Apple)</text>
<line x1="300.0" y1="275.0" x2="360.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<rect x="70.0" y="316.0" width="28.0" height="28.0" rx="4" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<rect x="80.0" y="325.0" width="12.0" height="10.0" rx="0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="110.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">фірмові інших</text>
<line x1="300.0" y1="330.0" x2="360.0" y2="222.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<rect x="360.0" y="150.0" width="200.0" height="150.0" rx="12" fill="#fff7e6" stroke="#caa24a" stroke-width="2"/>
<text x="460.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ТИСК НА ОДНЕ</text>
<text x="372.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• GSMA / OMTP (індустрія)</text>
<text x="372.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Меморандум + директива ЄС</text>
<text x="372.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• USB-IF (стандарт USB-C)</text>
<text x="372.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• екологія: гори e-сміття</text>
<line x1="560.0" y1="225.0" x2="640.0" y2="225.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<rect x="660.0" y="180.0" width="200.0" height="90.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="760.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАЛО: USB-C</text>
<rect x="735.0" y="230.0" width="50.0" height="18.0" rx="9" fill="none" stroke="#1f8a3b" stroke-width="2"/>
<rect x="742.0" y="235.0" width="36.0" height="8.0" rx="0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="760.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">один роз'єм на все</text>
<rect x="70.0" y="400.0" width="780.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кінцевий «один дріт» — не чийсь винахід, а результат тиску з усіх боків: індустрії, стандартизаторів,</text>
<text x="460.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">законодавців і екології. Навіть найбільший холдаут (Apple) поступився лише під обов'язковою нормою.</text>
</svg>
