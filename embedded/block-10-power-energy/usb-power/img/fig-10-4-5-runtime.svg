<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що вміє МК і не вміє тригер: міняти контракт на ходу</text>
<rect x="60.0" y="90.0" width="150.0" height="70.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="135.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">МК</text>
<text x="135.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">політика живлення</text>
<rect x="60.0" y="200.0" width="150.0" height="64.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="2"/>
<text x="135.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">PD-контролер</text>
<text x="135.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">веде CC/PD</text>
<line x1="135.0" y1="160.0" x2="135.0" y2="200.0" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<text x="150.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">I²C</text>
<text x="135.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">читає меню (capabilities),</text>
<text x="135.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">просить і ПЕРЕпросить</text>
<text x="360.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Вибір профілю за умовами в реальному часі:</text>
<rect x="360.0" y="110.0" width="250.0" height="44.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="485.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Холодно, треба швидко</text>
<line x1="610.0" y1="132.0" x2="660.0" y2="132.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="668.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ просить 20 В · максимум потужності</text>
<rect x="360.0" y="174.0" width="250.0" height="44.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="485.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Грійка / гаряче</text>
<line x1="610.0" y1="196.0" x2="660.0" y2="196.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="668.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ просить 15 В · менше тепла на перетворювачі</text>
<rect x="360.0" y="238.0" width="250.0" height="44.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="485.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Заряджаю батарею</text>
<line x1="610.0" y1="260.0" x2="660.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="668.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ APDO/PPS: веде напругу за Vбат (CC/CV, §7.4.6)</text>
<rect x="360.0" y="302.0" width="250.0" height="44.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="485.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Навантаження впало</text>
<line x1="610.0" y1="324.0" x2="660.0" y2="324.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="668.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ перепогоджує менший профіль, економить</text>
<line x1="232.0" y1="244.0" x2="352.0" y2="200.0" stroke="#1f8a3b" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aGreen)"/>
<text x="300.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">нове рішення</text>
<rect x="70.0" y="396.0" width="800.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тригер просить ОДНУ наперед задану напругу — і на цьому все. МК читає умови (тепло, заряд, режим) і ПЕРЕукладає контракт,</text>
<text x="470.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коли треба, — аж до плавної PPS, щоб живити батарею напряму. Ціна — код, PD-стек чи контролер і більше способів помилитися.</text>
</svg>
