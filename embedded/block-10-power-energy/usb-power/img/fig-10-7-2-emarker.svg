  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">e-marker: чип, що дозволяє кабелю більше</text>
<rect x="60.0" y="80.0" width="380.0" height="130.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.7"/>
<text x="250.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Кабель БЕЗ e-marker</text>
<line x1="90.0" y1="140.0" x2="410.0" y2="140.0" stroke="#b5763a" stroke-width="3" stroke-linecap="round"/>
<text x="250.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">система не знає меж кабелю</text>
<text x="250.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ припускає безпечні 3 А, EPR нема</text>
<rect x="480.0" y="80.0" width="380.0" height="130.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="670.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Кабель З e-marker</text>
<line x1="510.0" y1="140.0" x2="830.0" y2="140.0" stroke="#b5763a" stroke-width="3" stroke-linecap="round"/>
<rect x="640.0" y="124.0" width="60.0" height="28.0" rx="6" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="670.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">e-marker</text>
<line x1="670.0" y1="124.0" x2="670.0" y2="110.0" stroke="#caa24a" stroke-width="1.8" stroke-linecap="round"/>
<text x="748.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">живиться з VCONN</text>
<text x="670.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">доповідає: 5 А, швидкість, довжина</text>
<rect x="120.0" y="240.0" width="680.0" height="100.0" rx="12" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="460.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що каже e-marker системі</text>
<text x="178.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">струм</text>
<text x="178.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">3 А чи 5 А</text>
<text x="340.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">швидкість</text>
<text x="340.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">USB 2.0 / 3.x</text>
<text x="502.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">довжина</text>
<text x="502.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затримки, втрати</text>
<text x="664.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тип</text>
<text x="664.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пасивний / активний</text>
<rect x="70.0" y="360.0" width="780.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Понад 3 А й уся EPR (теми 10.3.2–4) вимагають кабелю з e-marker. Нема чипа — система перестраховується 3 амперами,</text>
<text x="460.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">хоч би що міг зарядний. Тому «той самий блок, але інший шнур» інколи заряджає геть по-різному.</text>
</svg>
