<rect x="70.0" y="340.0" width="780.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Type-C — реверсивний, тримає до 5 А і несе сучасні домовленості (CC, PD). Решта — історія:</text>
<text x="460.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Type-A ще живе як хост-роз'єм і зарядка, micro-USB доживає в дешевих пристроях, mini й Type-B — майже зникли.</text>
