<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450">
<rect width="940" height="450" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що всередині USB-C кабелю — і чому вони такі різні</text>
<rect x="70.0" y="86.0" width="28.0" height="70.0" rx="6" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<rect x="77.0" y="98.0" width="14.0" height="46.0" rx="0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<rect x="842.0" y="86.0" width="28.0" height="70.0" rx="6" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<rect x="849.0" y="98.0" width="14.0" height="46.0" rx="0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<rect x="98.0" y="86.0" width="744.0" height="70.0" rx="14" fill="#fbfbf8" stroke="#8a8a8a" stroke-width="1.4"/>
<line x1="126.0" y1="100.0" x2="814.0" y2="100.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<line x1="126.0" y1="116.0" x2="814.0" y2="116.0" stroke="#caa24a" stroke-width="3" stroke-linecap="round"/>
<line x1="126.0" y1="132.0" x2="814.0" y2="132.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="126.0" y1="148.0" x2="814.0" y2="148.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<rect x="748.0" y="92.0" width="60.0" height="28.0" rx="6" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="778.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">e-marker</text>
<line x1="120.0" y1="188.0" x2="150.0" y2="188.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<text x="158.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">VBUS / GND — живлення — товщина дроту вирішує падіння</text>
<line x1="120.0" y1="214.0" x2="150.0" y2="214.0" stroke="#caa24a" stroke-width="3" stroke-linecap="round"/>
<text x="158.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">CC — орієнтація, роль, живить e-marker (VCONN)</text>
<line x1="120.0" y1="240.0" x2="150.0" y2="240.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="158.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">D+/D− — дані USB 2.0</text>
<line x1="120.0" y1="266.0" x2="150.0" y2="266.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<text x="158.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SS-пари — швидкі дані / відео (USB 3.x), є не в усіх</text>
<rect x="70.0" y="300.0" width="200.0" height="122.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="170.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«тільки заряд»</text>
<text x="170.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише VBUS/GND (часто й CC).</text>
<text x="170.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">даних нема — пристрій не</text>
<text x="170.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">домовиться по D+/D−</text>
<rect x="370.0" y="300.0" width="200.0" height="122.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">повний, 3 А</text>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усі лінії, без e-marker.</text>
<text x="470.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">заряд і дані, але струм</text>
<text x="470.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обмежать безпечними 3 А</text>
<rect x="670.0" y="300.0" width="200.0" height="122.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="770.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">5 А / EPR</text>
<text x="770.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усі лінії + e-marker.</text>
<text x="770.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повний струм і висока</text>
<text x="770.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруга (потрібен чип)</text>
</svg>
