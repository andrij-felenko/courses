<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три типи портів за BC1.2</text>
<rect x="40.0" y="70.0" width="220.0" height="260.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SDP</text>
<text x="150.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Standard Downstream Port</text>
<text x="150.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ПК-порт «як завжди»</text>
<line x1="60.0" y1="152.0" x2="240.0" y2="152.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="64.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• дані: так (звичайні)</text>
<text x="64.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 0.5 А (USB2)</text>
<text x="64.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 0.9 А (USB3)</text>
<text x="64.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• до енумерації — 100 мА</text>
<rect x="360.0" y="70.0" width="220.0" height="260.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CDP</text>
<text x="470.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Charging Downstream Port</text>
<text x="470.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ПК-порт, що ще й заряджає</text>
<line x1="380.0" y1="152.0" x2="560.0" y2="152.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="384.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• дані: так</text>
<text x="384.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• до 1.5 А</text>
<text x="384.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• + рукостискання</text>
<text x="384.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">•   на D+/D−</text>
<rect x="680.0" y="70.0" width="220.0" height="260.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="790.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">DCP</text>
<text x="790.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Dedicated Charging Port</text>
<text x="790.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">блок у розетку, без даних</text>
<line x1="700.0" y1="152.0" x2="880.0" y2="152.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="704.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• дані: нема</text>
<text x="704.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ознака: D+↔D−</text>
<text x="704.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">•   закорочені</text>
<text x="704.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• до 1.5 А</text>
<rect x="70.0" y="374.0" width="800.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Уся легасі-зарядка тримається на одному питанні: цей порт — звичайний хост (SDP), заряджальний хост (CDP)</text>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чи тупий блок (DCP)? Стеля BC1.2 — 1.5 А × 5 В = 7.5 Вт; усе, що більше, — лише через CC (10.3.2) або PD (10.3.3).</text>
</svg>
