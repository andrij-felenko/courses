<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Поле непередбачуване: випадковий шнур, випадковий блок, бруд у роз'ємі. Надійний пристрій не вимагає ідеалу —</text>
