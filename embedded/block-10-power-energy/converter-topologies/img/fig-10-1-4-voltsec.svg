<text x="312.5" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">(1−D)·T</text>
<rect x="110.0" y="52.0" width="680.0" height="34.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сталий режим:  площа(+) = площа(−)   ⇒   Von · D·T = Voff · (1−D)·T   ⇒   середня Vл = 0</text>
