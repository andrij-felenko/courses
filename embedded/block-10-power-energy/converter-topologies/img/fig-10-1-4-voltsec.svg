<text x="260.0" y="482.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">період T</text>
<rect x="70.0" y="494.0" width="780.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="515.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Струм періодичний — за цикл повертається до себе, тобто Δi = 0. Це й означає: «+ вольт-секунди» точно гасять «−». Звідси випливає коефіцієнт перетворення будь-якої топології</text>
