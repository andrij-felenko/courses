<rect x="70.0" y="380.0" width="760.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="399.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Більший L або вища частота f → менша ΔI. У CCM пульсація не залежить від навантаження — вона лиш гойдається навколо середнього струму</text>
