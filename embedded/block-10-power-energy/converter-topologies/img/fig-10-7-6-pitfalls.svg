<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Типові пастки вибору — чого не робити</text>
<rect x="50.0" y="70.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="70.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ boost «захистить» вихід</text>
<line x1="70.0" y1="114.0" x2="440.0" y2="114.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ні — він прозорий для КЗ; додай роз'єднувач</text>
<rect x="490.0" y="70.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="510.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ charge pump на реальний струм</text>
<line x1="510.0" y1="114.0" x2="880.0" y2="114.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="510.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ні — це мА; для потужності бери котушку</text>
<rect x="50.0" y="178.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="70.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ мережа без ізоляції</text>
<line x1="70.0" y1="222.0" x2="440.0" y2="222.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">смертельно — для 230 В лише flyback/ізольовані</text>
<rect x="490.0" y="178.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="510.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ котушка boost під вихідний струм</text>
<line x1="510.0" y1="222.0" x2="880.0" y2="222.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="510.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ні — рахуй під ВХІДНИЙ (більший) струм</text>
<rect x="50.0" y="286.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="70.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ flyback без снабера</text>
<line x1="70.0" y1="330.0" x2="440.0" y2="330.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ключ згорить від викиду витоку</text>
<rect x="490.0" y="286.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="510.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ помпа на проміжну напругу</text>
<line x1="510.0" y1="330.0" x2="880.0" y2="330.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="510.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">палить, як лінійний; узгодь кратність</text>
</svg>
