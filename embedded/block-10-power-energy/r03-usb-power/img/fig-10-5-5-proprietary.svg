<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому «не заряджає»: фірмові коди на D+/D−</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">до спільного стандарту кожен виробник кодував дозволений струм по-своєму — і пристрій шукає САМЕ свій підпис</text>
<rect x="40.0" y="84.0" width="220.0" height="130.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="150.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Стандарт BC1.2</text>
<text x="150.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D+ ↔ D− закорочені</text>
<text x="150.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= «я зарядник», 1.5 А</text>
<text x="150.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">D+ / D−</text>
<rect x="360.0" y="84.0" width="220.0" height="130.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="470.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Фірмовий A</text>
<text x="470.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">фіксовані ~2.0 / 2.7 В</text>
<text x="470.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на D+/D− = 1 А / 2.1 А</text>
<text x="470.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">D+ / D−</text>
<rect x="680.0" y="84.0" width="220.0" height="130.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="790.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Фірмовий B</text>
<text x="790.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">інші рівні / комбінації</text>
<text x="790.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">свій секрет на D+/D−</text>
<text x="790.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">D+ / D−</text>
<rect x="120.0" y="244.0" width="700.0" height="96.0" rx="12" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="470.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Пристрій бачить ЧУЖИЙ підпис → не впізнає → падає в безпечні 0.5 А</text>
<text x="470.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому старий пристрій повільно заряджається від нового зарядного — і навпаки:</text>
<text x="470.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кожен чекав на свій код, а отримав незнайомий. Стандарт BC1.2 і пізніше USB-C це й лікують.</text>
<rect x="70.0" y="390.0" width="800.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Гарний сучасний зарядний навмисне підтримує кілька кодувань одразу (стандарт + найпоширеніші фірмові),</text>
<text x="470.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">щоб і старі, і нові пристрої впізнали його й узяли повний струм. Та універсальної гарантії нема — звідси несумісності.</text>
</svg>
