<text x="700.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ читає дозволений струм</text>
<rect x="70.0" y="356.0" width="760.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Vcc = Vоп · Rd/(Rp+Rd). Джерело вибирає Rp → задає напругу; пристрій її міряє й дізнається струм.</text>
<text x="450.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">А ще: Rd каже джерелу «тут пристрій», бо без нього CC висить і джерело тримає живлення вимкненим.</text>
