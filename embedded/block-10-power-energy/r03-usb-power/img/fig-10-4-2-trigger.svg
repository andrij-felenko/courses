<text x="800.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(по power-good)</text>
<rect x="70.0" y="410.0" width="780.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тригер сам робить усе рукостискання PD (тема 10.3.3) і вмикає живлення на навантаження лише тоді,</text>
<text x="460.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коли дістав контракт на потрібну напругу. Розробник лише раз обирає, що просити, — і пише нуль коду.</text>
