<text x="470.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">PD-КОНТРОЛЕР</text>
<line x1="380.0" y1="112.0" x2="560.0" y2="112.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
