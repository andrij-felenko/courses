<text x="780.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Без зайвого чипа й</text>
<text x="780.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">повний контроль?</text>
<text x="780.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">максимум волі · максимум праці</text>
<text x="780.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">зусилля ▮▮▮   гнучкість ▮▮▮</text>
<text x="780.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<rect x="70.0" y="390.0" width="800.0" height="64.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="470.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">І незалежно від шляху — два залізні правила:</text>
<text x="470.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) навантаження вмикати лише за дійсним контрактом (power-good);   2) проєктувати так, щоб пристрій пережив відкат у 5 В.</text>
<text x="470.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Найкраще — поєднати: тригер чи контролер для напруги + широкий вхід або вимкнення навантаження для безпеки.</text>
