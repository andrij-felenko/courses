<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бути добрим джерелом: чотири запобіжники</text>
<rect x="50.0" y="70.0" width="150.0" height="180.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="125.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Не бреши про струм</text>
<line x1="68.0" y1="110.0" x2="182.0" y2="110.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="125.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рекламуй (Rp/PDO) лише те,</text>
<text x="125.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що реально витягнеш</text>
<text x="125.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✔</text>
<rect x="285.0" y="70.0" width="150.0" height="180.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="360.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Обмеж струм і КЗ</text>
<line x1="303.0" y1="110.0" x2="417.0" y2="110.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="360.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">захист від перевантаження</text>
<text x="360.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й короткого на виході</text>
<text x="360.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">✔</text>
<rect x="520.0" y="70.0" width="150.0" height="180.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="595.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Стережи зворотний струм</text>
<line x1="538.0" y1="110.0" x2="652.0" y2="110.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="595.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не дай чужій вищій напрузі</text>
<text x="595.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затекти назад у батарею</text>
<text x="595.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✔</text>
<rect x="755.0" y="70.0" width="150.0" height="180.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="830.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Міняй роль безпечно</text>
<line x1="773.0" y1="110.0" x2="887.0" y2="110.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="830.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">при swap спершу зняти живлення,</text>
<text x="830.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тоді вже перемикати (DRP)</text>
<text x="830.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">✔</text>
<rect x="70.0" y="344.0" width="800.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Джерело несе відповідальність: воно вирішує, скільки дати, і мусить пережити жадібний чи несправний споживач —</text>
<text x="470.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коротке замикання, перевантаження, спробу зворотного живлення. Деталі чипів power path — у компонентній вставці розділу.</text>
</svg>
