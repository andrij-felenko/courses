<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два світи живлення в одному роз'ємі</text>
<rect x="390.0" y="150.0" width="160.0" height="130.0" rx="12" fill="#fbfbf8" stroke="#1b1b1b" stroke-width="2"/>
<text x="470.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сучасний</text>
<text x="470.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зарядний</text>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">говорить</text>
<text x="470.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОБОМА</text>
<text x="470.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">мовами</text>
<rect x="40.0" y="90.0" width="300.0" height="250.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="190.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Легасі-світ: D+/D−</text>
<text x="60.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• BC1.2: SDP / CDP / DCP</text>
<text x="60.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• фірмові коди напругою</text>
<text x="60.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• межа ~1.5 А (7.5 Вт)</text>
<text x="60.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• для старих пристроїв</text>
<text x="60.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• (і через перехідники)</text>
<line x1="345.0" y1="200.0" x2="388.0" y2="200.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="600.0" y="90.0" width="300.0" height="250.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="750.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Сучасний світ: CC</text>
<text x="620.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• резистори CC (10.3.2)</text>
<text x="620.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• 5 В, до 3 А = 15 Вт</text>
<text x="620.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• USB PD (10.3.3–4)</text>
<text x="620.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• до 240 Вт</text>
<text x="620.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• для USB-C-пристроїв</text>
<line x1="552.0" y1="200.0" x2="598.0" y2="200.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="70.0" y="374.0" width="800.0" height="44.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Старий механізм (коди на лініях даних) і новий (резистори CC та PD) не заперечують один одного — вони співіснують.</text>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Добрий зарядний відповідає на обидва запитання, тож живить і легасі-пристрій по D+/D−, і USB-C-пристрій по CC.</text>
</svg>
