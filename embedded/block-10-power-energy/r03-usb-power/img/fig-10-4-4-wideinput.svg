<text x="759.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">9, 15, 20 В → перетворювач</text>
<text x="759.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зробить рівні 12 В</text>
<text x="695.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">стійко: працює навіть від 5 В</text>
<text x="695.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(хай і меншою потужністю)</text>
<rect x="70.0" y="402.0" width="800.0" height="20.0" rx="8" fill="#fff7e6" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Ціна гнучкості — зайвий перетворювач; натомість пристрій не прив'язаний до того, чи має саме цей зарядний саме твою напругу.</text>
