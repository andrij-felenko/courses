<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому пристрій мусить «упізнавати» порт</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">USB 2.0 за замовчуванням дозволяє лише 100–500 мА, доки не домовишся з хостом — а в зарядці хоста нема</text>
<rect x="50.0" y="80.0" width="400.0" height="300.0" rx="12" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="250.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Хост-порт (ПК)</text>
<rect x="90.0" y="130.0" width="120.0" height="56.0" rx="8" fill="#fff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="150.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПК / хост</text>
<text x="150.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">є процесор</text>
<rect x="290.0" y="130.0" width="120.0" height="56.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="350.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<line x1="210.0" y1="150.0" x2="288.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="288.0" y1="170.0" x2="212.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="250.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D+/D−: енумерація (розмова)</text>
<text x="250.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ хост дозволяє 0.5 А (USB2)</text>
<text x="250.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">або 0.9 А (USB3)</text>
<text x="250.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">є з ким домовитися —</text>
<text x="250.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">струм беремо з дозволу</text>
<rect x="470.0" y="80.0" width="400.0" height="300.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="670.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Блок у розетку (зарядка)</text>
<rect x="510.0" y="130.0" width="120.0" height="56.0" rx="8" fill="#fff" stroke="#caa24a" stroke-width="1.8"/>
<text x="570.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">зарядка</text>
<text x="570.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">нема процесора</text>
<rect x="710.0" y="130.0" width="120.0" height="56.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="770.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<line x1="630.0" y1="150.0" x2="708.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="670.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">нема з ким</text>
<text x="670.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">D+/D−: нема розмови</text>
<text x="670.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">скільки можна взяти?!</text>
<text x="670.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(візьмеш забагато —</text>
<text x="670.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">просадиш або спалиш блок)</text>
<text x="670.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">BC1.2: упізнати тип порту</text>
<text x="670.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">самими лініями D+/D−</text>
<rect x="70.0" y="404.0" width="780.0" height="18.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Розв'язок — домовлений у USB-IF стандарт BC1.2: пристрій упізнає порт по лініях даних, без жодного хоста</text>
</svg>
