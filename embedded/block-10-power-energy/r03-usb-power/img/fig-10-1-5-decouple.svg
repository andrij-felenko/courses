<circle cx="370.0" cy="218.0" r="5.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<circle cx="510.0" cy="218.0" r="5.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
