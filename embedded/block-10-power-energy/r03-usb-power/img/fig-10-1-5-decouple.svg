<text x="345.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">швидкі дані, відео (3.x, DisplayPort)</text>
<rect x="70.0" y="336.0" width="740.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="440.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Живлення домовляється по лінії CC окремо від даних — тому той самий роз'єм возить і 5 мА мишки,</text>
<text x="440.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і 240 Вт ноутбука, і відео на монітор. Дані й потужність не заважають одне одному.</text>
