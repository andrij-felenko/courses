<circle cx="370.0" cy="130.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<circle cx="510.0" cy="130.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
