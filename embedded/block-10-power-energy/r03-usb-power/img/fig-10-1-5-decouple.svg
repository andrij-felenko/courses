<circle cx="370.0" cy="174.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<circle cx="510.0" cy="174.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
