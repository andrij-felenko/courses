<text x="440.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Та вмикається лише тоді, коли EPR підтримують УСІ троє: джерело, пристрій і кабель (з e-marker).</text>
<text x="440.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Бракує когось одного — лишаються звичні SPR-щаблі до 100 Вт.</text>
