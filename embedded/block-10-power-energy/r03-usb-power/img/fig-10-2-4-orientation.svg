<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два піни CC: який з'єднано — той і каже орієнтацію</text>
<rect x="360.0" y="80.0" width="180.0" height="70.0" rx="12" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="450.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">роз'єм Type-C</text>
<circle cx="400.0" cy="115.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="400.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="1" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="400.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">CC1</text>
<circle cx="500.0" cy="115.0" r="6.0" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="500.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">CC2</text>
<line x1="400.0" y1="150.0" x2="400.0" y2="230.0" stroke="#caa24a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="376.0" y="230.0" width="48.0" height="40.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="400.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Rd</text>
<text x="400.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">З'ЄДНАНО → це активна CC</text>
<text x="400.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(пристрій бачить Rp джерела тут)</text>
<line x1="500.0" y1="150.0" x2="500.0" y2="230.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
<rect x="470.0" y="230.0" width="60.0" height="40.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.6"/>
<text x="500.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">VCONN</text>
<text x="500.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не з'єднано напряму →</text>
<text x="500.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стає живленням для кабелю</text>
<rect x="70.0" y="336.0" width="760.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Роз'єм реверсивний, тож пінів CC два. Через кабель з'єднується ЛИШЕ один — і саме він несе Rp/Rd.</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">За тим, який з двох ожив, система й розуміє, яким боком устромлено штекер — і куди вести дані.</text>
</svg>
