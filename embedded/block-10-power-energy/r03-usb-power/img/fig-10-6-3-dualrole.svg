<text x="240.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DRP: чергує Rp ↔ Rd (тема 10.3.2)</text>
<rect x="95.0" y="120.0" width="110.0" height="40.0" rx="8" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="150.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Rp (даю)</text>
<text x="240.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">↔</text>
<rect x="275.0" y="120.0" width="110.0" height="40.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="330.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Rd (беру)</text>
<text x="240.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">поки не вирішать, хто кому джерело</text>
<rect x="520.0" y="70.0" width="360.0" height="150.0" rx="12" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="700.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">PD power-role swap</text>
<text x="700.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ролі міняються БЕЗ перетикання</text>
<rect x="545.0" y="135.0" width="130.0" height="50.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="610.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">був sink</text>
<text x="610.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(брав)</text>
<line x1="680.0" y1="160.0" x2="723.0" y2="160.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
