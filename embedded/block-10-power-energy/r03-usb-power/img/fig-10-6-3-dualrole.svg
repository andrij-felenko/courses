<text x="790.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">став source</text>
<text x="790.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(дає)</text>
<rect x="120.0" y="250.0" width="700.0" height="90.0" rx="12" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="470.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: ноутбук</text>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спершу САМ заряджається від доку (sink) →</text>
<text x="470.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тоді тим самим кабелем живить телефон (source): роль помінялась по PD, дріт не чіпали</text>
<rect x="70.0" y="386.0" width="800.0" height="22.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дворольовий порт корисний скрізь, де пристрій то бере, то віддає — ноутбук, павербанк, телефон із периферією</text>
</svg>
