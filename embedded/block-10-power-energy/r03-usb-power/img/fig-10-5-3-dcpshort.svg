<line x1="140.0" y1="160.0" x2="200.0" y2="160.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="140.0" y1="230.0" x2="200.0" y2="230.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="200.0" y1="160.0" x2="200.0" y2="230.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="176.0" y="178.0" width="48.0" height="34.0" rx="4" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="200.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">≤200 Ω</text>
<text x="225.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лінії даних просто замкнені</text>
<text x="225.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(через малий опір)</text>
<line x1="145.0" y1="160.0" x2="540.0" y2="160.0" stroke="#b5763a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="145.0" y1="230.0" x2="540.0" y2="230.0" stroke="#b5763a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="540.0" y="80.0" width="330.0" height="250.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="705.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій детектує</text>
<circle cx="582.0" cy="160.0" r="7.0" fill="none" stroke="#c0271e" stroke-width="2.5"/>
<line x1="578.1" y1="160.0" x2="585.9" y2="160.0" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="582.0" y1="156.2" x2="582.0" y2="163.8" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<text x="582.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">проба</text>
<text x="620.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">подаю напругу на D+</text>
<text x="620.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дивлюсь, чи з'явилась</text>
<text x="620.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вона на D−</text>
<text x="620.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">з'явилась → замкнено</text>
<text x="620.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">→ зарядник, можна 1.5 А</text>
<rect x="70.0" y="370.0" width="780.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="460.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">DCP не вміє говорити — тож його впізнають за простою ознакою: D+ і D− замкнені наскрізь. Пристрій подає пробну</text>
<text x="460.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">напругу на одну лінію й перевіряє, чи з'явиться вона на другій. Замкнено — отже, перед нами заряджальний блок.</text>
</svg>
