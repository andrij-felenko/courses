<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Павербанк: підняти батарею до 5 В (OTG-boost)</text>
<rect x="70.0" y="120.0" width="150.0" height="90.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="145.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">батарея 1S</text>
<text x="145.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3.0–4.2 В</text>
<text x="145.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">(нижче за 5 В!)</text>
<line x1="220.0" y1="165.0" x2="298.0" y2="165.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="300.0" y="118.0" width="150.0" height="94.0" rx="10" fill="#fff7e6" stroke="#caa24a" stroke-width="2"/>
<text x="375.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">BOOST ↑</text>
<text x="375.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">підвищувач</text>
<text x="375.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(тема 10.1.3)</text>
<line x1="450.0" y1="165.0" x2="528.0" y2="165.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="530.0" y="120.0" width="130.0" height="90.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="595.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">VBUS</text>
<text x="595.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">5 В</text>
<line x1="660.0" y1="165.0" x2="718.0" y2="165.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="720.0" y="120.0" width="110.0" height="90.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="775.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">чужий</text>
<text x="775.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<text x="775.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(заряджаємо)</text>
<text x="450.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Одна літієва комірка дає лише 3.0–4.2 В — менше за потрібні 5 В на VBUS.</text>
<text x="450.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому джерело-з-батареї ОБОВ'ЯЗКОВО має підвищувач, що тягне напругу комірки вгору до 5 В.</text>
<rect x="70.0" y="334.0" width="760.0" height="34.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Історично цей режим звали OTG (On-The-Go) — коли пристрій із хоста-споживача стає тим, хто сам живить периферію.</text>
<text x="450.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Суть та сама: щоб віддавати 5 В від однокоміркової батареї, потрібен boost із ~3.7 В до 5 В.</text>
</svg>
