<line x1="185.0" y1="150.0" x2="152.0" y2="150.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="150.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ні</text>
<rect x="30.0" y="128.0" width="150.0" height="46.0" rx="8" fill="#fff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="105.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контакт / цілість</text>
<text x="105.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кабелю, роз'єм</text>
<line x1="300.0" y1="185.0" x2="300.0" y2="210.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="314.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">так, але мляво</text>
<rect x="170.0" y="210.0" width="260.0" height="44.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="2"/>
<text x="300.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ВИМІРЯЙ VBUS на пристрої</text>
<text x="300.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">під навантаженням (§1.6)</text>
<line x1="300.0" y1="254.0" x2="300.0" y2="280.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polygon points="300.0,280.0 420.0,318.0 300.0,356.0 180.0,318.0 300.0,280.0" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="300.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">VBUS просідає?</text>
<line x1="420.0" y1="318.0" x2="700.0" y2="318.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="560.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">так</text>
<rect x="700.0" y="294.0" width="200.0" height="50.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="2"/>
<text x="800.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">падіння на кабелі</text>
<text x="800.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ товщий/коротший шнур</text>
<line x1="300.0" y1="356.0" x2="300.0" y2="382.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="314.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ні (тримає, та струм малий)</text>
<polygon points="300.0,383.0 420.0,422.0 300.0,461.0 180.0,422.0 300.0,383.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="300.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Переговори вдались?</text>
<text x="300.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">CC / PD / BC1.2</text>
<line x1="420.0" y1="422.0" x2="700.0" y2="422.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="560.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ні</text>
<rect x="700.0" y="398.0" width="200.0" height="50.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="800.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кабель без ліній / e-marker</text>
<text x="800.0" y="434.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чи джерело без профілю</text>
<line x1="300.0" y1="461.0" x2="300.0" y2="484.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="314.0" y="478.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">так</text>
<rect x="170.0" y="484.0" width="260.0" height="44.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="300.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">усе гаразд — це стеля</text>
<text x="300.0" y="520.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">цього блока/кабелю</text>
<rect x="70.0" y="534.0" width="780.0" height="18.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="547.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Не «магія», а чотири перевірки по черзі: контакт → виміряй VBUS → просідання (кабель) → переговори (лінії/профіль)</text>
</svg>
