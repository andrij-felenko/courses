<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="920" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Діагностика «не заряджає» як інженерна задача</text>
<rect x="170.0" y="56.0" width="260.0" height="38.0" rx="8" fill="#fbe9e7" stroke="#c0271e" stroke-width="2"/>
<text x="300.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Скарга: не заряджає / повільно</text>
<line x1="300.0" y1="94.0" x2="300.0" y2="116.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polygon points="300.0,115.0 415.0,150.0 300.0,185.0 185.0,150.0 300.0,115.0" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
