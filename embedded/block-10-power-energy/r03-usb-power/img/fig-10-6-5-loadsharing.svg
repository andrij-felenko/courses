<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розподіл струму: система в пріоритеті, батарея — із залишку</text>
<rect x="60.0" y="70.0" width="380.0" height="150.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="250.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Звичайно: вистачає на все</text>
<text x="250.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Iвх  =  Iсист  +  Iбат(заряд)</text>
<rect x="90.0" y="140.0" width="320.0" height="30.0" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
<rect x="90.0" y="140.0" width="180.0" height="30.0" rx="6" fill="#cfe8d6" stroke="#1f8a3b" stroke-width="0"/>
<text x="180.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">система</text>
<rect x="270.0" y="140.0" width="140.0" height="30.0" rx="6" fill="#dfeefb" stroke="#1f47b5" stroke-width="0"/>
<text x="340.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заряд батареї</text>
<text x="250.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вхідний ліміт ділиться: систему годуємо першою</text>
<rect x="480.0" y="70.0" width="380.0" height="150.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.6"/>
<text x="670.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Пік: системі треба більше за вхід</text>
<text x="670.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Iсист  =  Iвх  +  Iбат(розряд)</text>
<rect x="510.0" y="140.0" width="320.0" height="30.0" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.4"/>
<rect x="510.0" y="140.0" width="200.0" height="30.0" rx="6" fill="#dfeefb" stroke="#1f47b5" stroke-width="0"/>
<text x="610.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">із входу</text>
<rect x="710.0" y="140.0" width="120.0" height="30.0" rx="6" fill="#f6e0c8" stroke="#caa24a" stroke-width="0"/>
<text x="770.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ батарея</text>
<text x="670.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">батарея ДОПОМАГАЄ входу — тримає просадку (§7.4.5)</text>
<rect x="70.0" y="250.0" width="780.0" height="84.0" rx="12" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="460.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Вхідний струм обмежений тим, що дозволив порт (BC1.2 чи PD, теми 10.3.3–5).</text>
<text x="460.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Розумний вузол стежить за цим лімітом: не дає сумарному споживанню просадити VBUS, а коли системі замало —</text>
<text x="460.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тимчасово підмішує струм із батареї. Це і є динамічне керування power path.</text>
</svg>
