<svg xmlns="http://www.w3.org/2000/svg" width="940" height="880" viewBox="0 0 940 880">
<rect width="940" height="880" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="40.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один дріт замість зоопарку: колективна історія стандартизації</text>
<text x="470.0" y="62.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">індустрія, консорціуми й регулятори — а не один герой — дотиснули світ до спільного роз'єму</text>
<line x1="248.0" y1="96.0" x2="248.0" y2="820.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="248.0" cy="120.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="226.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2007</text>
<text x="274.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">USB Battery Charging 1.0</text>
<text x="274.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Дозволено брати з USB більше за 500 мА → можлива швидша зарядка</text>
<circle cx="248.0" cy="216.6" r="8.5" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<text x="226.0" y="221.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2009</text>
<text x="274.0" y="212.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">GSMA UCS · OMTP</text>
<text x="274.0" y="231.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Індустрія узгоджує спільний зарядний на microUSB (Universal Charging Solution)</text>
<circle cx="248.0" cy="313.1" r="8.5" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<text x="226.0" y="318.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">черв. 2009</text>
<text x="274.0" y="309.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Меморандум ЄС (MoU)</text>
<text x="274.0" y="328.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">14 виробників (Apple, Nokia, Samsung, LG…) ДОБРОВІЛЬНО на micro-USB-B; під тиском Єврокомісії</text>
<circle cx="248.0" cy="409.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="226.0" y="414.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2010–11</text>
<text x="274.0" y="405.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">IEC 62684</text>
<text x="274.0" y="424.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Спільний зарядний стає міжнародним стандартом (IEC + USB-IF)</text>
<circle cx="248.0" cy="506.3" r="8.5" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<text x="226.0" y="511.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2014</text>
<text x="274.0" y="502.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">USB-IF: USB-C</text>
<text x="274.0" y="521.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Один симетричний роз'єм на все: дані, відео, живлення — і реверсивний</text>
<circle cx="248.0" cy="602.9" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="248.0" cy="602.9" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="226.0" y="607.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2022</text>
<text x="274.0" y="598.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Директива ЄС 2022/2380</text>
<text x="274.0" y="617.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">USB-C тепер ОБОВ'ЯЗКОВИЙ, не добровільний (поправка до RED 2014/53)</text>
<circle cx="248.0" cy="699.4" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="248.0" cy="699.4" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="226.0" y="704.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2023</text>
<text x="274.0" y="695.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Apple → USB-C (iPhone 15)</text>
<text x="274.0" y="714.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Останнього холдаута дотиснули законом; представники Apple визнали: «комплаєнс»</text>
<circle cx="248.0" cy="796.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="226.0" y="801.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2024 · 2026</text>
<text x="274.0" y="792.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Дедлайни ЄС</text>
<text x="274.0" y="811.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Телефони/планшети — груд. 2024; ноутбуки — квіт. 2026 (PD до 240 Вт)</text>
<circle cx="98.0" cy="842.0" r="8.5" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<text x="114.0" y="846.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крок індустрії/консорціуму</text>
<circle cx="358.0" cy="842.0" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="358.0" cy="842.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="376.0" y="846.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">коли довелося ПРИМУСИТИ законом</text>
<text x="470.0" y="864.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">Жодного «винахідника спільної зарядки» — це 15-річна спільна робота консорціумів, стандартизаторів і регуляторів</text>
</svg>
