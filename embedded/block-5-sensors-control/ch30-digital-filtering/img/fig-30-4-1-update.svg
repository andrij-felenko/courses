<svg xmlns="http://www.w3.org/2000/svg" width="660" height="230" viewBox="0 0 660 230">
<rect width="660" height="230" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="330.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один крок EMA: оцінку підштовхують на частку α до відліку</text>
<line x1="80.0" y1="130.0" x2="600.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="180.0" cy="130.0" r="7.0" fill="#1f8a3b"/>
<text x="180.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">оцінка y</text>
<circle cx="520.0" cy="130.0" r="7.0" fill="#1f47b5"/>
<text x="520.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">відлік x</text>
<line x1="180.0" y1="148.0" x2="520.0" y2="148.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<text x="350.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">проміжок (x − y)</text>
<line x1="180.0" y1="130.0" x2="282.0" y2="130.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<circle cx="282.0" cy="130.0" r="6.0" fill="#c0271e"/>
<text x="282.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">нова y</text>
<text x="231.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">крок = α·(x−y)</text>
<text x="330.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">y ← y + α·(x − y)     одне множення, одна змінна — без буфера</text>
</svg>
