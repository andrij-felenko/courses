<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="380.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дерево рішення: спершу діагноз, тоді фільтр</text>
<rect x="24.0" y="168.0" width="150.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="99.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">сирий потік:</text>
<text x="99.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">який характер?</text>
<line x1="174.0" y1="200.0" x2="250.0" y2="68.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="252.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">повзе?</text>
<rect x="250.0" y="44.0" width="220.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.8"/>
<text x="360.0" y="65.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ДРЕЙФ → калібрування</text>
<text x="360.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не фільтр! (§28.6)</text>
<line x1="174.0" y1="200.0" x2="250.0" y2="194.0" stroke="#9a4ea8" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="252.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">голки?</text>
<rect x="250.0" y="170.0" width="220.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#9a4ea8" stroke-width="1.8"/>
<text x="360.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a4ea8" text-anchor="middle" font-weight="bold" font-style="normal">ВИКИДИ → медіана</text>
<text x="360.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вибиває голки (§30.3)</text>
<line x1="174.0" y1="200.0" x2="250.0" y2="318.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="252.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">тремтить?</text>
<rect x="250.0" y="294.0" width="220.0" height="48.0" rx="8" fill="#fbfbfb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="360.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ШУМ → усереднення</text>
<text x="360.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">EMA / ковзне (§30.2,4)</text>
<line x1="470.0" y1="318.0" x2="540.0" y2="284.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<rect x="540.0" y="262.0" width="210.0" height="44.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="645.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">EMA</text>
<text x="645.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ресурси тиснуть · багато каналів</text>
<line x1="470.0" y1="318.0" x2="540.0" y2="352.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<rect x="540.0" y="330.0" width="210.0" height="44.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="645.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ковзне середнє</text>
<text x="645.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лінійна фаза · нуль 50 Гц</text>
<text x="380.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">діагноз економить більше часу, ніж будь-який вибір алгоритму</text>
</svg>
