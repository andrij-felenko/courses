<rect x="390.0" y="96.0" width="300.0" height="108.0" rx="8" fill="#f6f4ec" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="540.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">P дає вплив ТІЛЬКИ з помилки:</text>
<text x="540.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">u = Kp · e</text>
<text x="540.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">щоб u = u₀  →  e_ss = u₀ / Kp ≠ 0</text>
<text x="540.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">помилку не прибрати, лише зменшити</text>
