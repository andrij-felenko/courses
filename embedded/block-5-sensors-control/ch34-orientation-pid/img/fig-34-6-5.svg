<text x="200.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">об'єкт</text>
<line x1="200.0" y1="174.0" x2="200.0" y2="228.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
