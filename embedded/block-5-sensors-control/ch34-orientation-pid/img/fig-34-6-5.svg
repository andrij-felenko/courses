<text x="208.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(вага, тертя)</text>
<line x1="200.0" y1="126.0" x2="200.0" y2="72.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="208.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">вплив u₀</text>
<text x="208.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(щоб утримати)</text>
