<text x="360.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">короткі поштовхи згладжуються; тривале прискорення фільтр від нахилу не відрізнить · рискання теж не видно</text>
