<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ви вже знаєте обидва (Розділ 30)</text>
<rect x="50.0" y="70.0" width="290.0" height="110.0" rx="10" fill="#eef7ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="195.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ковзне середнє (§30.2)</text>
<text x="195.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">= найпростіший КІХ</text>
<text x="195.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">рівні відводи · скінченна пам'ять</text>
<text x="195.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лінійна фаза · завжди стійкий</text>
<rect x="380.0" y="70.0" width="290.0" height="110.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="2"/>
<text x="525.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">EMA (§30.4)</text>
<text x="525.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">= найпростіший БІХ</text>
<text x="525.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зворотний зв'язок · нескінченний хвіст</text>
<text x="525.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один коефіцієнт α · гранична ефективність</text>
<text x="360.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">те, що ви робили на інтуїції, — окремі випадки двох великих сімейств</text>
