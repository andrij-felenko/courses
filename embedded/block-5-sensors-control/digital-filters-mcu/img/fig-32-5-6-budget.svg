<text x="168.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">фільтр</text>
<text x="445.2" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">запас на решту</text>
<text x="360.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усі MAC-и фільтра + інше мусять укластися в T; не влізли — нижчий fs або легший фільтр</text>
