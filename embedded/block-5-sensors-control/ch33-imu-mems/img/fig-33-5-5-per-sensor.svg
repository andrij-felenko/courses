<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
<rect width="720" height="250" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожному давачу — своя головна біда</text>
<text x="60.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Акселерометр</text>
<text x="250.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ шум + плутає рух із g</text>
<text x="250.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ абсолютний нахил (не дрейфує)</text>
<line x1="50.0" y1="112.0" x2="690.0" y2="112.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="60.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Гіроскоп</text>
<text x="250.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ ДРЕЙФ (інтеграл зсуву)</text>
<text x="250.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ точний накоротко</text>
<line x1="50.0" y1="164.0" x2="690.0" y2="164.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="60.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a4ea8" text-anchor="start" font-weight="bold" font-style="normal">Магнітометр</text>
<text x="250.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">✗ завади (залізо, струм)</text>
<text x="250.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">✓ абсолютний курс</text>
<line x1="50.0" y1="216.0" x2="690.0" y2="216.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="360.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">у кожного — своя слабкість і своя сила; тому й рятує лише поєднання</text>
