<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 5.1.9i.2. Від Кельвіна (1856) до gauge factor: фізичне зерно GF ≈ 2</text>
<rect x="80.0" y="74.0" width="210.0" height="20.0" rx="4" fill="#f2e8d8" stroke="#9a7050" stroke-width="1.5"/>
<text x="185.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a7050" text-anchor="middle">дріт (Fe або Cu)</text>
<line x1="50.0" y1="84.0" x2="76.0" y2="84.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="320.0" y1="84.0" x2="294.0" y2="84.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="34.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">F</text>
<text x="336.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">F</text>
<text x="185.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кельвін, 1856: розтяг змінює опір — і не лише від геометрії</text>
<text x="185.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Δρ/ρ ≠ 0: залізо і мідь реагують по-різному</text>
<rect x="360.0" y="46.0" width="310.0" height="110.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="515.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Міст Вітстона (§5.1.2)</text>
<line x1="515.0" y1="68.0" x2="439.0" y2="104.0" stroke="#6b7280" stroke-width="2.0"/><text x="485.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">R</text>
<line x1="515.0" y1="68.0" x2="591.0" y2="104.0" stroke="#6b7280" stroke-width="2.0"/><text x="561.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">R</text>
<line x1="439.0" y1="104.0" x2="515.0" y2="140.0" stroke="#6b7280" stroke-width="2.0"/><text x="485.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">R</text>
<line x1="591.0" y1="104.0" x2="515.0" y2="140.0" stroke="#27ae60" stroke-width="2.0"/><text x="561.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">R+ΔR</text>
<circle cx="515.0" cy="68.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="515.0" cy="140.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="439.0" cy="104.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="591.0" cy="104.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="439.0" y1="104.0" x2="501.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="591.0" y1="104.0" x2="529.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="515.0" cy="104.0" r="13.0" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="515.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">V</text>
<text x="515.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">той самий міст — від 1856-го</text>
<line x1="40.0" y1="176.0" x2="680.0" y2="176.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="360.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зерно gauge factor: що побачив Кельвін</text>
<rect x="40.0" y="206.0" width="640.0" height="36.0" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.8"/><text x="360.0" y="228.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">GF = (ΔR/R) / ε  =  (1 + 2ν) · ε / ε  +  (Δρ/ρ) / ε</tspan></text>
<rect x="50.0" y="238.2" width="260.0" height="55.6" rx="6" fill="#fefaf4" stroke="#c0a060" stroke-width="1.4"/><text x="180.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">геометричний член:</tspan><tspan x="180.0" dy="14.3">(1 + 2ν)  ≈  1 + 2·0.3  =  1.6</tspan><tspan x="180.0" dy="14.3">(ν — коефіцієнт Пуассона)</tspan></text>
<text x="180.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">те, що видно геометрично</text>
<rect x="410.0" y="238.2" width="260.0" height="55.6" rx="6" fill="#fef4f4" stroke="#c0392b" stroke-width="1.4"/><text x="540.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">п'єзорезистивний член:</tspan><tspan x="540.0" dy="14.3">Δρ/ρ  ≠ 0 — те «зайве», що</tspan><tspan x="540.0" dy="14.3">побачив Кельвін</tspan></text>
<text x="540.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">матеріалозалежний внесок</text>
<line x1="180.0" y1="242.0" x2="180.0" y2="237.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="540.0" y1="242.0" x2="540.0" y2="237.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="360.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">→  Для металу (Fe, Cu, NiCr): GF ≈ 1.6 + мал. = 2.0…2.1</text>
<text x="360.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Конкретний тип (напр. BLH AB-1): GF ≈ 2.07 — саме цей рядок у даташиті SR-4</text>
<line x1="40.0" y1="356.0" x2="680.0" y2="356.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,3"/>
<rect x="40.0" y="368.0" width="310.0" height="58.0" rx="6" fill="#f4f8f4" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="393.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Метал (SR-4, NiCr-дріт):</tspan><tspan x="195.0" dy="14.3">GF ≈ 2.0–2.1  |  лінійний  |  стабільний</tspan></text>
<rect x="370.0" y="368.0" width="310.0" height="58.0" rx="6" fill="#fef4f4" stroke="#c0392b" stroke-width="1.5"/><text x="525.0" y="393.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Напівпровідник (Si):</tspan><tspan x="525.0" dy="14.3">GF ≈ 100–200  |  нелінійний  |  термозалежний</tspan></text>
</svg>