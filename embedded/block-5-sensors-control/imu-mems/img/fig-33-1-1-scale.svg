<text x="200.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">MEMS</text>
<text x="470.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">для масштабу:</text>
