<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
<rect width="720" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Час чи частота: яка область під яке питання</text>
<rect x="40.0" y="52.0" width="300.0" height="40.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="190.0" y="77.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ЧАС — «коли»</text>
<rect x="380.0" y="52.0" width="300.0" height="40.0" rx="8" fill="#eef7ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="530.0" y="77.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЧАСТОТА — «що за тон»</text>
<text x="60.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• коли сталася подія</text>
<text x="400.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• які тони всередині</text>
<text x="60.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• різкий фронт, транзієнт</text>
<text x="400.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• який період / оберти</text>
<text x="60.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• таймінг, синхронізація</text>
<text x="400.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• де гул-завада</text>
<text x="60.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• просте згладжування</text>
<text x="400.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• розділити перекриті</text>
<rect x="40.0" y="256.0" width="640.0" height="34.0" rx="8" fill="#fdf6f5" stroke="#c0271e" stroke-width="1.4"/>
<text x="360.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">засторога: ШПФ потребує буфера на N відліків → затримка + такти (дрібне згладжування дешевше часовим фільтром)</text>
</svg>
