<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як синхронізують: розумна панель по TE, LTDC сам</text>
<text x="200.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">РОЗУМНА панель (GRAM, SPI)</text>
