<text x="135.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">МК</text>
<rect x="300.0" y="100.0" width="120.0" height="56.0" rx="6" fill="#eaf3ff" stroke="#9bbdd6" stroke-width="1.6"/>
<text x="360.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#5d7e93" text-anchor="middle" font-weight="bold" font-style="normal">панель</text>
<text x="360.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+ GRAM</text>
<line x1="190.0" y1="122.0" x2="300.0" y2="122.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
