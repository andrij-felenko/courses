<text x="250.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">МК чекає сигналу TE, тоді шле кадр —</text>
<text x="250.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">потрапляє в паузу між освіженнями</text>
<text x="620.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RGB-панель + LTDC</text>
<rect x="500.0" y="100.0" width="150.0" height="70.0" rx="6" fill="#eef2f5" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="575.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LTDC у МК</text>
<text x="575.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">перед + задній</text>
<text x="575.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">сам гортає на vsync</text>
<line x1="650.0" y1="135.0" x2="740.0" y2="135.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="740.0" y="110.0" width="60.0" height="50.0" rx="4" fill="#eaf3ff" stroke="#9bbdd6" stroke-width="1.4"/>
<text x="770.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#5d7e93" text-anchor="middle" font-weight="normal" font-style="normal">скло</text>
<text x="620.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">контролер сам тримає два буфери</text>
<text x="620.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">й міняє їх у vblank — без участи коду</text>
<text x="410.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Розумна панель дає ніжку TE — момент, коли писати безпечно; вбудований LTDC робить подвійний буфер і vsync сам.</text>
