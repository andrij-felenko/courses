<text x="380.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інакше деякі сполуки виглядають розхристано. У дрібних embedded-шрифтах кернінг часто пропускають.</text>
