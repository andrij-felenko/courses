<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Подвійна буферизація: малюй у тіньовий, показуй готовий</text>
<rect x="90.0" y="110.0" width="170.0" height="110.0" rx="6" fill="#fff8e8" stroke="#b07d18" stroke-width="1.8"/>
<text x="175.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a7d2e" text-anchor="middle" font-weight="bold" font-style="normal">ЗАДНІЙ буфер</text>
<text x="175.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">малюємо тут</text>
<text x="175.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(глядач не бачить)</text>
<rect x="560.0" y="110.0" width="170.0" height="110.0" rx="6" fill="#e7f5ea" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="645.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕДНІЙ буфер</text>
<text x="645.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">показуємо на екран</text>
<text x="645.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(панель читає)</text>
<rect x="360.0" y="116.0" width="100.0" height="60.0" rx="4" fill="#eaf3ff" stroke="#9bbdd6" stroke-width="1.4"/>
