<line x1="262.0" y1="250.0" x2="558.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="410.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">коли задній готовий — МІНЯЄМО буфери місцями (swap)</text>
<text x="410.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Глядач завжди бачить лише завершений кадр. Ціна — ДВА кадрові буфери в пам'яті замість одного.</text>
