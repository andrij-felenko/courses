<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
<rect width="820" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому картинка рветься: запис під час читання панелі</text>
<text x="160.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">панель сканує згори вниз</text>
<rect x="90.0" y="90.0" width="150.0" height="160.0" rx="0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<rect x="90.0" y="90.0" width="150.0" height="72.0" rx="0" fill="#eaf3ff" stroke="none" stroke-width="0"/>
<circle cx="140.0" cy="126.0" r="16.0" fill="#cf4040" stroke="#1b1b1b" stroke-width="1.5"/>
<circle cx="190.0" cy="212.0" r="16.0" fill="#cf4040" stroke="#1b1b1b" stroke-width="1.5"/>
<line x1="90.0" y1="162.0" x2="240.0" y2="162.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="5 3" stroke-linecap="round"/>
<text x="248.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">лінія розриву</text>
<line x1="76.0" y1="96.0" x2="76.0" y2="244.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<text x="165.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">верх — новий кадр, низ — старий</text>
<text x="165.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">об'єкт «розколовся»</text>
<text x="470.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ми пишемо кадр у ту саму пам'ять,</text>
<text x="470.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">звідки панель 60 разів/с її читає.</text>
<text x="470.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Якщо запис застав читання на пів-</text>
<text x="470.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дорозі — показаний кадр виходить</text>
<text x="470.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">склеєним зі старого й нового.</text>
<text x="470.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Один спільний буфер на малювання</text>
<text x="470.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">й показ — і розриви неминучі.</text>
</svg>
