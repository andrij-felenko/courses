<text x="400.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зберігаючи піксель не одним бітом, а кількома (тут 4 — 16 рівнів сірого), краї роблять плавними. Ціна — більше байтів на гліф.</text>
