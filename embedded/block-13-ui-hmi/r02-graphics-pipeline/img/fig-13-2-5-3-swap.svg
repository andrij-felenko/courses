<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
<rect width="820" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обмін буферів: перекинути вказівник чи скопіювати</text>
<text x="200.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВКАЗІВНИК (миттєво)</text>
<rect x="80.0" y="96.0" width="90.0" height="50.0" rx="4" fill="#fff8e8" stroke="#b07d18" stroke-width="1.4"/>
<text x="125.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">буфер A</text>
<rect x="80.0" y="166.0" width="90.0" height="50.0" rx="4" fill="#e7f5ea" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="125.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">буфер B</text>
<rect x="250.0" y="130.0" width="60.0" height="52.0" rx="5" fill="#eef2f5" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="280.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">панель</text>
<text x="280.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">читає →</text>
<line x1="250.0" y1="150.0" x2="172.0" y2="121.0" stroke="#1b1b1b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<line x1="250.0" y1="162.0" x2="172.0" y2="191.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="200.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">панель просто читає інший буфер —</text>
<text x="200.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нуль копіювання (треба підтримка контролера)</text>
<text x="620.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">КОПІЯ (працює завжди)</text>
<rect x="470.0" y="110.0" width="90.0" height="50.0" rx="4" fill="#fff8e8" stroke="#b07d18" stroke-width="1.4"/>
<text x="515.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">задній</text>
<line x1="565.0" y1="135.0" x2="645.0" y2="135.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="605.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">копіювати</text>
<rect x="650.0" y="110.0" width="90.0" height="50.0" rx="4" fill="#e7f5ea" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="695.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">передній</text>
<text x="620.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">блітимо весь задній у передній —</text>
<text x="620.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b07d18" text-anchor="middle" font-weight="bold" font-style="normal">просто, та коштує копії на кожен кадр</text>
</svg>
