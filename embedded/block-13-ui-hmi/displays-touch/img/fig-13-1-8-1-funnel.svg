<rect x="60.0" y="70.0" width="700.0" height="60.0" rx="8" fill="#eef4f8" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="410.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">СЦЕНАРІЙ</text>
<text x="410.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">хто? де? що показує? як часто? скільки живе? почім? у якому корпусі?</text>
<rect x="140.0" y="158.0" width="540.0" height="60.0" rx="8" fill="#fff8e0" stroke="#1b1b1b" stroke-width="1.6"/>
