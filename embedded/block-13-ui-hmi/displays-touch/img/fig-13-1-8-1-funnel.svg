<text x="410.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Спершу обмеження викидають більшість варіантів — і лише потім порівнюємо те, що лишилось.</text>
