<rect x="450.0" y="90.0" width="230.0" height="100.0" rx="0" fill="#fff8e8" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="565.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b07d18" text-anchor="middle" font-weight="bold" font-style="normal">OLED (темний UI)</text>
