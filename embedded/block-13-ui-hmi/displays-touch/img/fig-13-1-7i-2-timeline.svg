<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
<rect width="880" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Електронний папір: від ідеї до Kindle</text>
<text x="440.0" y="57.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея електрофорезу — з 1970-х; до приладу в кожних руках — понад 35 років</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="470.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="116.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1970</text>
<text x="276.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ота / Ota · Matsushita</text>
<text x="276.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Електрофорез: рухати заряджені частинки полем — але вони ЗЛИПАЮТЬСЯ</text>
<circle cx="250.0" cy="182.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="187.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1974</text>
<text x="276.0" y="179.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Шерідон / Sheridon · Xerox PARC</text>
<text x="276.0" y="198.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Gyricon: двоколірні кульки крутяться полем — перший «електронний папір»</text>
<circle cx="250.0" cy="249.6" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="254.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1980-ті</text>
<text x="276.0" y="246.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Xerox кладе Gyricon на полицю</text>
<text x="276.0" y="265.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Ідея є, продукту нема — знайома історія, як з LCD у RCA</text>
<circle cx="250.0" cy="316.4" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="321.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1995</text>
<text x="276.0" y="313.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Джейкобсон / Jacobson · MIT</text>
<text x="276.0" y="332.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Мрія про «останню книгу»: сторінки, що міняються; бере двох студентів</text>
<circle cx="250.0" cy="383.2" r="10.5" fill="#c0271e" stroke="#c0271e" stroke-width="3"/>
<circle cx="250.0" cy="383.2" r="5.0" fill="#fff" stroke="#fff" stroke-width="0"/>
<text x="228.0" y="388.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1997</text>
<text x="276.0" y="380.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Коміскі + Альберт / Comiskey + Albert</text>
<text x="276.0" y="399.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">МІКРОКАПСУЛА розвʼязує злипання — робочий прототип; засновано E Ink</text>
<circle cx="250.0" cy="450.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="455.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2007</text>
<text x="276.0" y="447.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Amazon Kindle</text>
<text x="276.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Електронний папір у кожних руках — мрія стала товаром</text>
<text x="440.0" y="494.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ідею мали в Японії, перший папір зробили в Xerox, а спрацювати все змусила мікрокапсула з MIT.</text>
</svg>
