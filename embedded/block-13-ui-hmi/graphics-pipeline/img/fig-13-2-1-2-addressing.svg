<text x="410.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Рядки інколи доповнюють до межі — тоді в формулі замість W беруть «крок рядка» (stride).</text>
