  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Малювання — це послідовність записів у масив</text>
<rect x="70.0" y="90.0" width="150.0" height="70.0" rx="6" fill="#eef2f5" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="145.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">set_pixel(x,y,c)</text>
<text x="145.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«постав піксель»</text>
<line x1="220.0" y1="125.0" x2="280.0" y2="125.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="280.0" y="90.0" width="160.0" height="70.0" rx="6" fill="#eef4f8" stroke="#1b1b1b" stroke-width="1.6"/>
