<text x="646.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">записати колір у комірку</text>
<text x="410.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Лінія, текст, картинка — усе зводиться до багатьох таких записів. Кадровий буфер дає **довільний доступ**:</text>
<text x="410.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">торкайся будь-якого пікселя будь-коли, склади все в памʼяті — і виштовхни готовий кадр на екран.</text>
<text x="410.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме заради цієї свободи компонувати в памʼяті й тримають кадровий буфер.</text>
</svg>
