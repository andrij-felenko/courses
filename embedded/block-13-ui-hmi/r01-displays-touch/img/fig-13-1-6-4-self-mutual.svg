<text x="610.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кожен перетин окремо → справжній мультитач</text>
<text x="410.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому сучасні екрани — mutual: сітка рядків і стовпців дає повну 2D-карту дотиків, а не одну пляму.</text>
