<path d="M 194 122 Q 194 138 194 150" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 210 122 Q 210 138 210 150" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="3 3"/>
<path d="M 226 122 Q 226 138 226 150" fill="none" stroke="#1f8a3b" stroke-width="1.4" stroke-dasharray="3 3"/>
