<text x="210.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b07d18" text-anchor="middle" font-weight="bold" font-style="normal">просто, але два пальці → «привиди»</text>
<text x="610.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">MUTUAL — ємність рядок↔стовпець</text>
