<text x="410.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Після оновлення панель присипляють (deep sleep), щоб не лишати її під напругою — інакше псується.</text>
