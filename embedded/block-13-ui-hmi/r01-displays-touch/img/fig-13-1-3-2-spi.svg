<text x="400.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тож по SPI ганяють лише ЗМІНИ — це й рятує вузьку шину на дрібних екранах.</text>
