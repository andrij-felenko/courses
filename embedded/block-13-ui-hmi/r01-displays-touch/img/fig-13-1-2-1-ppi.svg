<text x="410.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">PPI = (пікселів по діагоналі) ÷ (діагональ панелі, дюйми)</text>
<text x="410.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кутовий розмір пікселя:  α = крок пікселя ÷ d</text>
<text x="410.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">око розрізняє ≈ 1′ = 1/60°</text>
