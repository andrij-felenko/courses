<text x="380.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Часткове оновлення: вікно адрес у GRAM</text>
<rect x="250.0" y="116.0" width="300.0" height="190.0" rx="0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
