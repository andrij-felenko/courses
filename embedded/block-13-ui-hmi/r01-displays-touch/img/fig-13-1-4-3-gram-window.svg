<text x="380.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Оновлюється лише прямокутник, а не весь екран — головний трюк економії шини на розумних панелях.</text>
