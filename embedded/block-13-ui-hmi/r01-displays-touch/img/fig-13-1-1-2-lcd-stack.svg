<text x="390.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Чорний» — це закрита заслінка, та трохи світла все одно протікає: чорний виходить сіруватим.</text>
