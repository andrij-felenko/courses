<rect x="116.0" y="102.0" width="78.0" height="28.0" rx="3" fill="none" stroke="#1f8a3b" stroke-width="2"/>
<text x="155.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">оновлюємо лише вікно</text>
<line x1="246.0" y1="145.0" x2="300.0" y2="145.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
