<text x="391.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">12:47</text>
<text x="356.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#dcdcdc" text-anchor="middle" font-weight="bold" font-style="normal">12:</text>
<text x="380.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#dcdcdc" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="391.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b07d18" text-anchor="middle" font-weight="normal" font-style="normal">привиди старих цифр</text>
<text x="560.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Пропускаємо спалах-скидання → оновлення</text>
<text x="560.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за десятки мс, без блимання, лише в вікні.</text>
<text x="560.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b07d18" text-anchor="start" font-weight="normal" font-style="normal">Але частинки не сідають до кінця, і сліди</text>
<text x="560.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b07d18" text-anchor="start" font-weight="normal" font-style="normal">старого копичаться — час від часу треба</text>
<text x="560.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b07d18" text-anchor="start" font-weight="normal" font-style="normal">повне оновлення, щоб стерти привид.</text>
