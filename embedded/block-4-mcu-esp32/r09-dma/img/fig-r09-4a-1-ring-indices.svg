<text x="280.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">← зайнятий (tail → head) →</text>
<rect x="281.4" y="359.2" width="63.9" height="31.0" rx="6" fill="#fff3cd" stroke="#b7861b" stroke-width="1.5"/><text x="313.4" y="378.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7861b" text-anchor="middle"><tspan x="313.4" dy="0.0">N−1 → 0</tspan></text>
<text x="510.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Обернення індексу:</text>
<rect x="470" y="130" width="210" height="86" rx="6" fill="#f4f6f8" stroke="#aaa" stroke-width="1.2"/><text x="475.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">head = (head + 1) % N</text><text x="475.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">     // загальний дільник</text><text x="475.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">head = (head + 1) &amp; (N−1)</text><text x="475.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">     // N — степінь двійки</text>
<text x="510.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">&amp; (N−1) — один такт:</text>
<text x="510.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">% N — ділення (~30 тактів)</text>
<text x="510.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тому N беруть степенем 2.</text>
<text x="350.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рис. 4.9.4a.1. Кільцевий буфер: масив із N комірок, замкнений у коло.</text>
<text x="350.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">head — куди писати, tail — звідки читати. За N−1 іде 0 (обернення).</text>
</svg>