<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один кадр 240×320 RGB565 на SPI 40 МГц: де минає час</text>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вузьке місце — не панель і не шина, а ядро, прикуте до регістра SPI</text>
<line x1="80.0" y1="80.0" x2="760.0" y2="80.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="80.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 мс</text>
<text x="760.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">≈30.7 мс</text>
<text x="70.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">SPI-шина</text>
<rect x="80.0" y="100.0" width="680.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="193.7" y="100.5" width="452.6" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">150 КіБ пікселів (RGB565) → 1228800 біт / 40 МГц ≈ 30.7 мс «на дроті»</tspan></text>
<text x="774.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">240×320 = 76 800 пікс.</text>
<text x="774.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">× 2 байти/пікс. = 150 КіБ</text>
<text x="774.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">× 8 біт / 40 МГц ≈ 30.7 мс</text>
<text x="70.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">Ядро (без DMA)</text>
<rect x="80.0" y="190.0" width="680.0" height="32.0" rx="4" fill="#fde8e8" stroke="#c0392b" stroke-width="1.8"/>
<rect x="168.6" y="190.5" width="502.8" height="31.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="420.0" dy="0.0">безперервно: прочитати байт з RAM → записати в SPI DR → чекати TX-empty → ...</tspan></text>
<rect x="760.0" y="190.0" width="160.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<rect x="787.2" y="184.5" width="105.5" height="43.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="840.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="840.0" dy="0.0">наступний кадр:</tspan><tspan x="840.0" dy="13.0">нема часу</tspan></text>
<line x1="760.0" y1="96.0" x2="760.0" y2="62.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,2"/>
<rect x="628.7" y="37.0" width="122.6" height="30.0" rx="6" fill="#fff8e8" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="55.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="690.0" dy="0.0">стеля ≈ 32 кадри/с</tspan></text>
<rect x="80.0" y="248.0" width="680.0" height="60.0" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.4"/>
<rect x="218.5" y="254.2" width="403.0" height="47.6" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="420.0" dy="0.0">Вузьке місце — не шина і не панель:</tspan><tspan x="420.0" dy="15.6">ядро 30+ мс не робить нічого, крім «байт → регістр SPI».</tspan></text>
</svg>