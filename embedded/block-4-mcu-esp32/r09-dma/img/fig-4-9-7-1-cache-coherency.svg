<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.9.7.1 — Пастка когерентності кешу (обидва напрями)</text>
<rect x="35.0" y="76.2" width="130.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="100.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Ядро + Кеш</tspan><tspan x="100.0" dy="15.6">(Xtensa)</tspan></text>
<rect x="291.9" y="76.2" width="136.3" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="360.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">SRAM</tspan><tspan x="360.0" dy="15.6">(фізична пам'ять)</tspan></text>
<rect x="515.0" y="84.0" width="130.0" height="32.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="580.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">DMA-контролер</tspan></text>
<text x="100.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Читання (DMA → RAM → Ядро):</text>
<line x1="580.0" y1="200.0" x2="425.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="431.8" y="184.5" width="76.4" height="31.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">нові дані</tspan></text>
<rect x="55.5" y="177.3" width="89.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">стара копія</tspan><tspan x="100.0" dy="14.3">(stale)</tspan></text>
<line x1="165" y1="200" x2="295" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="60.1" y="224.5" width="339.8" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ядро бачить СТАЛЕ → треба INVALIDATE перед читанням</tspan></text>
<text x="100.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Запис (Ядро → кеш → RAM, DMA читає):</text>
<rect x="61.8" y="287.4" width="76.4" height="45.3" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="100.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">нові дані</tspan><tspan x="100.0" dy="14.3">(в кеші)</tspan></text>
<rect x="312.4" y="287.4" width="95.2" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">RAM ще стара</tspan><tspan x="360.0" dy="14.3">(не скинуто)</tspan></text>
<line x1="425.0" y1="310.0" x2="515.0" y2="310.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="434.9" y="287.4" width="70.2" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">DMA бере</tspan><tspan x="470.0" dy="14.3">СТАРЕ!</tspan></text>
<rect x="206.4" y="344.0" width="307.3" height="32.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="2.0"/><text x="360.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">треба WRITE-BACK / FLUSH перед стартом DMA</tspan></text>
<rect x="79.8" y="396.0" width="560.4" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">DMA обходить кеш — мінімум два виклики: flush (до DMA) + invalidate (після DMA)</tspan></text>
</svg>