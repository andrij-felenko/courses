<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.9.6.1 — DMA виливає блок із RAM у швидку послідовну шину</text>
<rect x="50.0" y="116.6" width="160.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="130.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Буфер у SRAM</tspan><tspan x="130.0" dy="16.9">(кадр / аудіоблок)</tspan><tspan x="130.0" dy="16.9">320×240×2 = 150 кБ</tspan></text>
<rect x="285.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="360.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">DMA-канал</tspan><tspan x="360.0" dy="16.9">(передача блоку)</tspan></text>
<line x1="212.0" y1="150.0" x2="283.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="515.0" y="116.6" width="110.0" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="570.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Послідовна</tspan><tspan x="570.0" dy="16.9">шина</tspan><tspan x="570.0" dy="16.9">(швидка)</tspan></text>
<line x1="437.0" y1="150.0" x2="513.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="401.7" y="177.3" width="126.6" height="45.3" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="1.5"/><text x="465.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">DMA-запит</tspan><tspan x="465.0" dy="14.3">(готово до слова)</tspan></text>
<line x1="515.0" y1="175.0" x2="485.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="185.8" y="242.0" width="348.3" height="32.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ядро вільне — рахує наступний кадр / інші задачі</tspan></text>
<line x1="360" y1="178.0" x2="360" y2="242" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="360.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Шина автоматично смикає DMA-запит на кожне готове слово — ядро не бере участь</text>
</svg>