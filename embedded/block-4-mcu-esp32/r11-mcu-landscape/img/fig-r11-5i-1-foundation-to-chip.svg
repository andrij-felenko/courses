<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від освітньої місії до власного кремнію</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожен щабель випливає з мети «навчити дітей кодувати», а не з ринкової гонки</text>
<rect x="44.0" y="72.0" width="185.0" height="150.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="136.5" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="136.5" dy="0.0">Raspberry Pi</tspan><tspan x="136.5" dy="15.6">Foundation</tspan></text>
<text x="136.5" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2008–2009</text>
<text x="136.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Освітня благодійна</text>
<text x="136.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">організація.</text>
<text x="136.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мета: вчити дітей</text>
<text x="136.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кодувати.</text>
<line x1="229.0" y1="147.0" x2="248.0" y2="147.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="253.0" y="72.0" width="185.0" height="150.0" rx="8" fill="#e8f4f8" stroke="#2457d6" stroke-width="2.0"/><text x="345.5" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.5" dy="0.0">Одноплатний Pi</tspan><tspan x="345.5" dy="15.6">+ Trading Ltd</tspan></text>
<text x="345.5" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2012</text>
<text x="345.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перший RPi-комп'ютер.</text>
<text x="345.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Комерційна «дочка»</text>
<text x="345.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">направляє прибуток</text>
<text x="345.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на доброчинність.</text>
<line x1="438.0" y1="147.0" x2="457.0" y2="147.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="462.0" y="72.0" width="185.0" height="150.0" rx="8" fill="#eef6ee" stroke="#27ae60" stroke-width="2.0"/><text x="554.5" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="554.5" dy="0.0">Рішення: ВЛАСНИЙ</tspan><tspan x="554.5" dy="15.6">чип (RP2040)</tspan></text>
<text x="554.5" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2019–2020</text>
<text x="554.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ліцензія Cortex-M0+</text>
<text x="554.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">через Arm Flexible Access.</text>
<text x="554.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Проєктування в Кембриджі.</text>
<text x="554.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Fab: TSMC 40 нм.</text>
<line x1="647.0" y1="147.0" x2="666.0" y2="147.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="671.0" y="72.0" width="185.0" height="150.0" rx="8" fill="#fff8e6" stroke="#c0392b" stroke-width="2.0"/><text x="763.5" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="763.5" dy="0.0">RP2040 + Pico</tspan><tspan x="763.5" dy="15.6">(у дефіцит чипів!)</tspan></text>
<text x="763.5" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">21.01.2021</text>
<text x="763.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чип ~$1 у партії.</text>
<text x="763.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Plate Pico = $4.</text>
<text x="763.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чип відкрито</text>
<text x="763.5" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">продають конкурентам.</text>
<line x1="44.0" y1="354.0" x2="856.0" y2="354.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="8 4"/>
<rect x="176.5" y="357.5" width="546.9" height="25.0" rx="6" fill="#f0faf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="450.0" dy="0.0">наскрізна нитка: освітня мета визначає кожне рішення — від назви до відсутнього флешу</tspan></text>
</svg>