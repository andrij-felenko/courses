<text x="18.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">← RX</text>
<rect x="20.0" y="378.0" width="820.0" height="36.0" rx="6" fill="#f0f4ff" stroke="#3a6bd4" stroke-width="1.5"/><text x="430.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Один автомат перетворює потік байтів із FIFO на точну послідовність станів ніжок — ядро не бере участі</tspan></text>
