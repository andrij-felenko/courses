<rect x="552.9" y="336.2" width="184.2" height="47.6" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">WROOM-модуль</tspan><tspan x="645.0" dy="15.6">(чип назавжди припаяний)</tspan></text>
