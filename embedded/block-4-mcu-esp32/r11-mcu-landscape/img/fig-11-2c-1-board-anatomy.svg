<rect x="133.2" y="261.2" width="163.6" height="47.6" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Лінійний стабілізатор</tspan><tspan x="215.0" dy="15.6">(5 В або 3.3 В)</tspan></text>
