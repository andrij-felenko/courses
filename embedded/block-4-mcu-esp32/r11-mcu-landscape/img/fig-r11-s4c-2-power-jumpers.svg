<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.11.4c.2  Звідки живиться чип: джемпери живлення</text>
<rect x="20.0" y="42.0" width="375.0" height="350.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="207.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Nucleo — джемпери живлення</text>
<rect x="69.2" y="82.3" width="101.5" height="45.3" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.5"/><text x="120.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">USB → ST-Link</tspan><tspan x="120.0" dy="14.3">(штатно)</tspan></text>
<rect x="72.4" y="137.3" width="95.2" height="45.3" rx="6" fill="#fef9f0" stroke="#d68910" stroke-width="1.5"/><text x="120.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Зовнішнє 5 В</tspan><tspan x="120.0" dy="14.3">(VIN)</tspan></text>
<rect x="66.1" y="192.3" width="107.8" height="45.3" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/><text x="120.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Зовнішнє 3.3 В</tspan><tspan x="120.0" dy="14.3">(3V3)</tspan></text>
<rect x="195.0" y="85.0" width="44.0" height="160.0" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="217.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">JP</text>
<line x1="162.0" y1="105.0" x2="196.0" y2="165.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="162.0" y1="160.0" x2="196.0" y2="165.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="162.0" y1="215.0" x2="196.0" y2="165.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="239.0" y1="165.0" x2="285.0" y2="165.0" stroke="#1e8449" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="294.5" y="135.2" width="60.9" height="59.6" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.0"/><text x="325.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">STM32</tspan><tspan x="325.0" dy="14.3">(ціль)</tspan><tspan x="325.0" dy="14.3">3.3 В</tspan></text>
<line x1="20.0" y1="265.0" x2="395.0" y2="265.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="207.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Також: JP → живлення зовнішньої цілі від бортового ST-Link</text>
<text x="207.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(після відламу верхньої частини, §4.2.8c)</text>
<rect x="35.0" y="315.0" width="350.0" height="60.0" rx="5" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
<text x="210.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle" font-weight="700">⚠  Перевернутий джемпер = «плата мертва»</text>
<text x="210.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">або «прошивається, але не стартує»</text>
<rect x="415.0" y="42.0" width="385.0" height="350.0" rx="10" fill="#fef9f0" stroke="#d68910" stroke-width="2.0"/>
<text x="607.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d68910" text-anchor="middle" font-weight="700">Blue Pill — входи живлення</text>
<rect x="462.4" y="104.5" width="95.2" height="31.0" rx="6" fill="#fef5e7" stroke="#d68910" stroke-width="1.5"/><text x="510.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">USB / 5V-пін</tspan></text>
<line x1="568.0" y1="120.0" x2="620.0" y2="120.0" stroke="#d68910" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="631.8" y="97.3" width="76.4" height="45.3" rx="6" fill="#fef5e7" stroke="#d68910" stroke-width="1.5"/><text x="670.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">LDO</tspan><tspan x="670.0" dy="14.3">регулятор</tspan></text>
<line x1="720.0" y1="140.0" x2="720.0" y2="185.0" stroke="#1e8449" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="459.2" y="167.3" width="101.5" height="45.3" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/><text x="510.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">3V3-пін</tspan><tspan x="510.0" dy="14.3">(в обхід LDO)</tspan></text>
<line x1="572.0" y1="190.0" x2="620.0" y2="190.0" stroke="#1e8449" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="645.8" y="161.6" width="68.4" height="66.8" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.0"/><text x="680.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">STM32</tspan><tspan x="680.0" dy="16.9">(ціль)</tspan><tspan x="680.0" dy="16.9">3.3 В</tspan></text>
<rect x="430.0" y="250.0" width="355.0" height="70.0" rx="7" fill="#fdecea" stroke="#e74c3c" stroke-width="2.0"/>
<text x="607.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle" font-weight="700">✖  Не подавати USB + зовнішнє одночасно!</text>
<text x="607.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">Конфлікт джерел → пошкодження LDO або чипа.</text>
<rect x="430.0" y="335.0" width="355.0" height="45.0" rx="5" fill="#fff8e7" stroke="#d68910" stroke-width="1.5"/>
<text x="607.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">Усі рівні 3.3 В. Ніжки STM32 — не всі 5V tolerant.</text>
<text x="607.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Деталі — у даташиті розділу (§8).</text>
<text x="410.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Nucleo: джемпер вибирає одне з трьох джерел. Blue Pill: два входи, але НЕ одночасно. Скрізь 3.3-вольтова логіка.</text>
</svg>