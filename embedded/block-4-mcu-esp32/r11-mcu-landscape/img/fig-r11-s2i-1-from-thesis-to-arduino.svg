<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від студентського задуму в Тронгеймі до серця Arduino</text>
<text x="430.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен щабель наближає ідею «такт-у-такт, дружній до C» до масового чипа</text>
<rect x="48.0" y="80.0" width="170.0" height="140.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="133.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="133.0" dy="0.0">NTH, Тронгейм</tspan></text>
<text x="133.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">~1994–1996</text>
<text x="133.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Боген + Воллан</text>
<text x="133.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Студентський задум:</text>
<text x="133.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«8-біт ядро під C</text>
<text x="133.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">та 1 такт = 1 інструкція»</text>
<line x1="218.0" y1="150.0" x2="240.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="246.0" y="80.0" width="170.0" height="140.0" rx="8" fill="#e8f4f8" stroke="#2457d6" stroke-width="2.0"/><text x="331.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="331.0" dy="0.0">Nordic VLSI</tspan></text>
<text x="331.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">~1996–1997</text>
<text x="331.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">µRISC — перший</text>
<text x="331.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">робочий кремній.</text>
<text x="331.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Задум стає</text>
<text x="331.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">реальним чипом.</text>
<line x1="416.0" y1="150.0" x2="438.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="444.0" y="80.0" width="170.0" height="140.0" rx="8" fill="#eef6ee" stroke="#27ae60" stroke-width="2.0"/><text x="529.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="529.0" dy="0.0">Atmel Norway</tspan></text>
<text x="529.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кін. 1990-х</text>
<text x="529.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">AVR + Flash.</text>
<text x="529.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">АТ90S-серія:</text>
<text x="529.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ISP-прошивка</text>
<text x="529.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">без програматора.</text>
<line x1="614.0" y1="150.0" x2="636.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="642.0" y="80.0" width="170.0" height="140.0" rx="8" fill="#fff8e6" stroke="#c0392b" stroke-width="2.0"/><text x="727.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="727.0" dy="0.0">Arduino</tspan><tspan x="727.0" dy="16.9">(ATmega168/328)</tspan></text>
<text x="727.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2005+</text>
<text x="727.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Масове поширення.</text>
<text x="727.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ціле покоління</text>
<text x="727.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перших прошивок</text>
<text x="727.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">на AVR.</text>
<line x1="48.0" y1="386.0" x2="812.0" y2="386.0" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="8 4"/>
<rect x="214.4" y="391.0" width="431.2" height="26.0" rx="6" fill="#f0faf0" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="430.0" dy="0.0">наскрізна нитка: 1 такт = 1 інструкція, ядро під компілятор C</tspan></text>
</svg>