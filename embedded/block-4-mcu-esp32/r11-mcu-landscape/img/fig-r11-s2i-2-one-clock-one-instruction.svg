<text x="200.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">12 тактів кварцу</text>
<text x="200.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">= 1 машинна операція</text>
<text x="200.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Робочі регістри: 4–8 шт.</text>
<text x="200.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Операнди часто через RAM</text>
<rect x="119.9" y="224.3" width="160.2" height="41.3" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.2"/><text x="200.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="200.0" dy="0.0">≈ 1 МГц → ~83 000 оп./с</tspan><tspan x="200.0" dy="14.3">(12 МГц, ориг. 8051)</tspan></text>
