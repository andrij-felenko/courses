<line x1="595.0" y1="148.0" x2="603.0" y2="148.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="605.0" y="125.0" width="90.0" height="46.0" rx="5" fill="#d0f0e8" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Виконання</tspan><tspan x="650.0" dy="14.3">(Execute)</tspan></text>
<text x="600.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">двоступеневий конвеєр</text>
<text x="600.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">~1 такт = 1 інструкція (більшість команд)</text>
<text x="600.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">32 регістри загального призначення</text>
<text x="600.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">більшість операцій — регістр←→регістр</text>
<rect x="504.2" y="246.3" width="191.6" height="41.3" rx="6" fill="#eaf4ff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="600.0" dy="0.0">≈ 1 MIPS / МГц</tspan><tspan x="600.0" dy="14.3">такти можна рахувати олівцем</tspan></text>
<rect x="109.9" y="360.5" width="580.3" height="27.0" rx="6" fill="#f0faf0" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="377.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="400.0" dy="0.0">Саме це рішення з 1990-х дозволяє в §4.11.2 рахувати затримки bit-bang і нопи «на пальцях»</tspan></text>
