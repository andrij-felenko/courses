<text x="410.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Nucleo: USB → ST-Link → SWD → ціль. Відламав верхню частину → маєш програматор для Blue Pill.  Blue Pill: голий чип, SWD виведено назовні.</text>
