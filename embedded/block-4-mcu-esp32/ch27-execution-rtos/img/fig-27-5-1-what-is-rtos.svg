<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RTOS — невелике ядро, що дає готові «цеглинки» багатозадачності</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«реального часу» означає ПЕРЕДБАЧУВАНО вчасно, а не обов'язково швидко</text>
<rect x="120.0" y="90.0" width="720.0" height="180.0" rx="14" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="480.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Ядро RTOS</text>
<rect x="200.0" y="140.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="285.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Задачі</text>
<text x="285.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кілька програм</text>
<rect x="390.0" y="140.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="475.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Планувальник</text>
<text x="475.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">хто й коли (§27.4)</text>
<rect x="590.0" y="140.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="675.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Час</text>
<text x="675.0" y="183.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тіки, паузи</text>
<rect x="230.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="315.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7a4fb0" text-anchor="middle" font-weight="bold" font-style="normal">Обмін</text>
<text x="315.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">черги, семафори (§27.6)</text>
<rect x="520.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#2aa198" stroke-width="1.6"/>
<text x="605.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#2aa198" text-anchor="middle" font-weight="bold" font-style="normal">Пам'ять</text>
<text x="605.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стеки задач (§27.7)</text>
<rect x="150.0" y="296.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RTOS — не велика «настільна» ОС: ні файлів, ні вікон. Це крихітний набір засобів,</text>
<text x="480.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що перетворює голий чип на багатозадачну систему з передбачуваним часом.</text>
</svg>
