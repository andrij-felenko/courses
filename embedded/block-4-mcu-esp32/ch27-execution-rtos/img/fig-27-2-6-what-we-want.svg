<text x="210.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">з власними «чекай»</text>
<rect x="360.0" y="90.0" width="200.0" height="120.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
