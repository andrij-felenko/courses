<text x="710.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чекай</text>
<text x="710.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">проста, послідовна,</text>
<text x="710.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">з власними «чекай»</text>
<rect x="230.0" y="280.0" width="500.0" height="44.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ПЛАНУВАЛЬНИК перемикає між задачами</text>
<text x="480.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кожна гадає, що володіє процесором сама</text>
