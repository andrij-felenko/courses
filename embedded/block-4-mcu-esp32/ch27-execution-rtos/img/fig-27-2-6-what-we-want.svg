<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Це і є поділ часу з історії розділу — лише на одному чипі. Так працюють ЗАДАЧІ (далі).</text>
