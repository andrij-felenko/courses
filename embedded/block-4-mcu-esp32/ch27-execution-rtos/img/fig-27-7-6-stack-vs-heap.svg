<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стек і купа: два різні види пам'яті</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стек — у кожної задачі свій і фіксований; купа — спільний пул для динамічного</text>
<rect x="80.0" y="90.0" width="380.0" height="180.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="270.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТЕК (кожної задачі свій)</text>
<text x="100.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• локальні змінні, виклики</text>
<text x="100.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• розмір фіксований при створенні</text>
<text x="100.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• окремий у кожної задачі</text>
<text x="100.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• переповнення = крах</text>
<text x="100.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">на ESP32 розмір задають у БАЙТАХ</text>
<rect x="480.0" y="90.0" width="380.0" height="180.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="670.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">КУПА (heap, спільна)</text>
<text x="500.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• динамічне виділення (malloc/new)</text>
<text x="500.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• звідси й самі об'єкти RTOS:</text>
<text x="515.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">задачі, черги, семафори</text>
<text x="500.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• спільна на всю систему</text>
<text x="500.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• скінчиться — виділення впаде</text>
<rect x="150.0" y="300.0" width="660.0" height="0.0" rx="0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стеки задач + купа + глобальні живуть в одній RAM (§21); разом вони й складають бюджет пам'яті.</text>
</svg>
