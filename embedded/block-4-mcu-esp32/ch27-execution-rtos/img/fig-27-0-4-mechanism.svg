<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один процесор по черзі віддає крихітні «кванти» задачам, зберігаючи й відновлюючи їхній стан</text>
