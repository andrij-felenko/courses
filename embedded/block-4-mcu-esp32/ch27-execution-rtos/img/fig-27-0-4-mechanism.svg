<rect x="780.0" y="110.0" width="96.0" height="40.0" rx="3" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="828.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<line x1="778.0" y1="104.0" x2="778.0" y2="156.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
