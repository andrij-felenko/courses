<text x="886.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">...</text>
<text x="480.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">червоні риски — «тік» таймера: мить перемкнутися (квант ≈ мілісекунди)</text>
<rect x="120.0" y="200.0" width="320.0" height="150.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="280.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Перемикання контексту</text>
<text x="140.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1. зберегти стан задачі A</text>
<text x="155.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(регістри, лічильник команд, стек)</text>
<text x="140.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2. вибрати наступну (планувальник)</text>
<text x="140.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3. відновити стан задачі B → бігти</text>
<rect x="540.0" y="200.0" width="340.0" height="150.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="710.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Звідки «тік»?</text>
<text x="560.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Таймер (Розділ 24) цокає через рівні</text>
<text x="560.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">проміжки й перериванням (Розділ 23)</text>
<text x="560.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">змушує процесор перемкнутися.</text>
<text x="560.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Це і є витіснення (preemption):</text>
<text x="560.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">задачу спиняють, не питаючи її згоди.</text>
