<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Замало стека → переповнення: задача псує сусідню пам'ять</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">задача використала більше, ніж їй відвели, — і «вилізла» за межу у чужу пам'ять</text>
<text x="230.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Стек задачі A</text>
<rect x="120.0" y="110.0" width="220.0" height="110.0" rx="0" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<rect x="120.0" y="110.0" width="220.0" height="110.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="0"/>
<text x="230.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">відведено A</text>
<line x1="120.0" y1="220.0" x2="340.0" y2="220.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="230.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">← межа стека A</text>
<rect x="120.0" y="220.0" width="220.0" height="56.0" rx="0" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="230.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕПОВНЕННЯ</text>
<text x="230.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">вилізло за межу!</text>
<text x="560.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Сусідня пам'ять (стек B / дані)</text>
<rect x="450.0" y="220.0" width="220.0" height="56.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="560.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">← сюди вписалося сміття</text>
<text x="560.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дані B зіпсовано</text>
<line x1="340.0" y1="248.0" x2="448.0" y2="248.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="150.0" y="300.0" width="640.0" height="46.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Найгірше: збій з'являється ДАЛЕКО від причини — у задачі B, хоч винна A.</text>
<text x="470.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому переповнення стека — одна з найпідступніших помилок RTOS.</text>
</svg>
