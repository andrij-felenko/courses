  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="490.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як усе сходиться: увесь розділ вів до реального часу</text>
<text x="490.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від простого циклу без жодних гарантій — до системи, що встигає вчасно гарантовано</text>
<rect x="21.7" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="90.7" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Super-loop</text>
<text x="90.7" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.1–2</text>
<text x="90.7" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">просто, та без гарантій</text>
<line x1="161.7" y1="152.0" x2="179.4" y2="152.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="181.4" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="250.4" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Задачі</text>
<text x="250.4" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.3</text>
<text x="250.4" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кожна — проста програма</text>
<line x1="321.4" y1="152.0" x2="339.1" y2="152.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="341.1" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="410.1" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Планувальник</text>
<text x="410.1" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.4</text>
<text x="410.1" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пріоритети, витіснення</text>
<line x1="481.1" y1="152.0" x2="498.9" y2="152.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.9" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="569.9" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">FreeRTOS</text>
<text x="569.9" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.5</text>
<text x="569.9" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ядро + два ядра ESP32</text>
<line x1="640.9" y1="152.0" x2="658.6" y2="152.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="660.6" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="729.6" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7a4fb0" text-anchor="middle" font-weight="bold" font-style="normal">Обмін</text>
<text x="729.6" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.6</text>
<text x="729.6" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">черги, м'ютекси</text>
<line x1="800.6" y1="152.0" x2="818.3" y2="152.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="820.3" y="110.0" width="138.0" height="84.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2.4"/>
<text x="889.3" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Реальний час</text>
<text x="889.3" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">§27.8</text>
<text x="889.3" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ГАРАНТОВАНО вчасно</text>
<rect x="150.0" y="240.0" width="680.0" height="100.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="490.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Super-loop не міг ОБІЦЯТИ час; задачі з пріоритетним витісненням, обмеженими</text>
<text x="490.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">затримками RTOS і дбайливим дизайном — можуть. Це й є реальний час:</text>
<text x="490.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">не «якось працює», а «гарантовано встигає». Сюди вів увесь розділ — і весь Модуль 4.</text>
</svg>
