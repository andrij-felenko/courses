<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Черга: безпечна труба «перший прийшов — перший пішов»</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна задача кладе дані, інша бере; дані КОПІЮЮТЬСЯ, тож спільної змінної й гонки нема</text>
