<text x="830.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">xQueueReceive</text>
<rect x="150.0" y="240.0" width="660.0" height="102.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Черга пуста — споживач БЛОКУЄТЬСЯ (поступливо чекає), доки щось прийде;</text>
<text x="480.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">переповнена — виробник чекає, доки звільниться місце. Жодних гонок.</text>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Це найчистіший спосіб передати дані між задачами — і він їх ще й розв'язує в часі.</text>
<text x="480.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(виробник і споживач можуть бігти у власному ритмі)</text>
</svg>
