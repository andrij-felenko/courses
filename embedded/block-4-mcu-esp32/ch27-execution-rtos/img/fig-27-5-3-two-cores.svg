<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Козир ESP32: ДВА ядра (рідкість серед мікроконтролерів)</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне традиційно тягне радіо, друге — ваш застосунок; обидва — під одним FreeRTOS</text>
<rect x="120.0" y="100.0" width="720.0" height="170.0" rx="14" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="480.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">чип ESP32</text>
<rect x="160.0" y="140.0" width="300.0" height="110.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="310.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Ядро 0 (PRO_CPU)</text>
<text x="310.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«протокольне»</text>
<text x="310.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за умовчанням — Wi-Fi</text>
<text x="310.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і Bluetooth</text>
<rect x="500.0" y="140.0" width="300.0" height="110.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро 1 (APP_CPU)</text>
<text x="650.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«застосункове»</text>
<text x="650.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за умовчанням — ваш</text>
<text x="650.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">setup() і loop()</text>
<rect x="150.0" y="290.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два ядра — велика рідкість для МК. (Увага: не всі ESP32 такі — S2, C3 одноядерні, §20.7.)</text>
<text x="480.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Завдяки традиційному поділу радіо й застосунок майже не заважають одне одному.</text>
