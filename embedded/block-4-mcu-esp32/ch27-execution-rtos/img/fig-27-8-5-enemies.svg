<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вороги реального часу: що руйнує передбачуваність</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">уникай їх на критичному шляху, інакше найгірший випадок «попливе»</text>
<rect x="60.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="200.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Інверсія пріоритетів</text>
<line x1="80.0" y1="126.0" x2="320.0" y2="126.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="200.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">низька тримає замок,</text>
<text x="200.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">висока чекає (§27.6)</text>
<text x="200.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ успадкування пріор.</text>
<rect x="320.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="460.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Задовге блокування</text>
<line x1="340.0" y1="126.0" x2="580.0" y2="126.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="460.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримаєш замок/чекаєш</text>
<text x="460.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">надто довго</text>
<text x="460.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ тримай коротко</text>
<rect x="580.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="720.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Необмежені операції</text>
<line x1="600.0" y1="126.0" x2="840.0" y2="126.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="720.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">купа, довга ISR,</text>
<text x="720.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">busy-wait, рекурсія</text>
<text x="720.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ геть із критичного</text>
<rect x="150.0" y="264.0" width="660.0" height="80.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Плюс ГОЛОДУВАННЯ (§27.4): зажерлива високопріоритетна задача не дає бігти нижчим.</text>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усі ці вороги мають одне спільне: вони роблять найгірший випадок невідомим або величезним —</text>
<text x="480.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">а без відомого найгіршого випадку гарантувати реальний час неможливо.</text>
</svg>
