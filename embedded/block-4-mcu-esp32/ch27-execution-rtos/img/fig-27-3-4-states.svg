<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стани задачі: біжить, готова, заблокована</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одночасно БІЖИТЬ лише одна (на ядро); решта чекають своєї черги або події</text>
<circle cx="470.0" cy="130.0" r="52.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="470.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">БІЖИТЬ</text>
<text x="470.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(виконується)</text>
<circle cx="220.0" cy="270.0" r="52.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="220.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ГОТОВА</text>
<text x="220.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(хоче процесор)</text>
<circle cx="720.0" cy="270.0" r="52.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2.2"/>
<text x="720.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ЗАБЛОК.</text>
<text x="720.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(чекає подію)</text>
<line x1="260.0" y1="240.0" x2="426.0" y2="164.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="310.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">планувальник дав чергу</text>
<line x1="426.0" y1="170.0" x2="264.0" y2="246.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="330.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">витіснено (вийшов час)</text>
<line x1="514.0" y1="164.0" x2="680.0" y2="240.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="640.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">чекає (delay, дані, подія)</text>
<line x1="676.0" y1="300.0" x2="310.0" y2="290.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
<text x="470.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">подія настала → знову готова</text>
<text x="470.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме перехід «БІЖИТЬ → ЗАБЛОКОВАНА» (а не простій) і дає корисне «чекати».</text>
</svg>
