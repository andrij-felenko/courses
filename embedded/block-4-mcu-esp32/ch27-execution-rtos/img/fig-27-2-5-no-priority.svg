<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Немає пріоритетів: усе — строго в порядку коду</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">терміновому не пробитися вперед — воно чекає своєї черги нарівні з рутиною</text>
<rect x="120.0" y="150.0" width="180.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="210.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">оновити екран</text>
<text x="210.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рутина</text>
<line x1="300.0" y1="172.0" x2="314.0" y2="172.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="316.0" y="150.0" width="180.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="406.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">записати лог</text>
<text x="406.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рутина</text>
<line x1="496.0" y1="172.0" x2="510.0" y2="172.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="512.0" y="150.0" width="180.0" height="44.0" rx="8" fill="#fbfcff" stroke="#caa24a" stroke-width="1.4"/>
<text x="602.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">порахувати</text>
<text x="602.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рутина</text>
<line x1="692.0" y1="172.0" x2="706.0" y2="172.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="708.0" y="150.0" width="180.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="2.4"/>
<text x="798.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">АВАРІЙНИЙ СТОП</text>
<text x="798.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ТЕРМІНОВО, та в кінці!</text>
<text x="210.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перевіряються по черзі →</text>
<rect x="150.0" y="250.0" width="640.0" height="80.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Цикл перевіряє справи в тому порядку, як вони написані в коді.</text>
<text x="470.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Терміновий «аварійний стоп» мусить чекати, доки відпрацюють рутинні кроки перед ним.</text>
<text x="470.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Сказати «це важливіше, виконай першим» super-loop просто не вміє.</text>
</svg>
