<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370">
<rect width="960" height="370" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Планувальник — розпорядник процесорного часу</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">серед ГОТОВИХ задач він обирає, кому віддати процесор просто зараз</text>
<text x="160.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ГОТОВІ (хочуть процесор)</text>
<rect x="70.0" y="110.0" width="180.0" height="38.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="160.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Задача A</text>
<rect x="70.0" y="156.0" width="180.0" height="38.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="160.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Задача B</text>
<rect x="70.0" y="202.0" width="180.0" height="38.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="160.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Задача C</text>
<rect x="380.0" y="150.0" width="180.0" height="70.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="470.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ПЛАНУВАЛЬНИК</text>
<text x="470.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">обирає одного</text>
<line x1="250.0" y1="165.0" x2="380.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="690.0" y="150.0" width="180.0" height="70.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="780.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПРОЦЕСОР</text>
<text x="780.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виконує обрану</text>
<line x1="560.0" y1="185.0" x2="690.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="780.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ЗАБЛОКОВАНІ — осторонь</text>
<rect x="690.0" y="282.0" width="180.0" height="30.0" rx="6" fill="#f4f0e6" stroke="#caa24a" stroke-width="1.2"/>
<text x="780.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чекають події, не змагаються</text>
<rect x="150.0" y="326.0" width="660.0" height="36.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Планувальник дивиться лише на ГОТОВИХ; заблоковані в черзі за процесор не стоять.</text>
</svg>
