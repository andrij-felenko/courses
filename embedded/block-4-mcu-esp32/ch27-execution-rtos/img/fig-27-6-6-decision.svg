<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що коли обирати: засіб під потребу</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чотири потреби — чотири інструменти</text>
<rect x="60.0" y="92.0" width="360.0" height="50.0" rx="8" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="80.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Передати ДАНІ між задачами</text>
<line x1="425.0" y1="117.0" x2="470.0" y2="117.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="480.0" y="92.0" width="240.0" height="50.0" rx="8" fill="#f4f6fb" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Черга (queue)</text>
<text x="740.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">копіює дані, FIFO, блокує</text>
<rect x="60.0" y="154.0" width="360.0" height="50.0" rx="8" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="80.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Сигнал про ПОДІЮ (сталося!)</text>
<line x1="425.0" y1="179.0" x2="470.0" y2="179.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="480.0" y="154.0" width="240.0" height="50.0" rx="8" fill="#f4f6fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="600.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Бінарний семафор</text>
<text x="740.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дзвоник; ISR будить задачу</text>
<rect x="60.0" y="216.0" width="360.0" height="50.0" rx="8" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="80.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Порахувати вільні РЕСУРСИ</text>
<line x1="425.0" y1="241.0" x2="470.0" y2="241.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="480.0" y="216.0" width="240.0" height="50.0" rx="8" fill="#f4f6fb" stroke="#caa24a" stroke-width="1.8"/>
<text x="600.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Лічильний семафор</text>
<text x="740.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">скільки одиниць доступно</text>
<rect x="60.0" y="278.0" width="360.0" height="50.0" rx="8" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="80.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Захистити СПІЛЬНИЙ ресурс</text>
<line x1="425.0" y1="303.0" x2="470.0" y2="303.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="480.0" y="278.0" width="240.0" height="50.0" rx="8" fill="#f4f6fb" stroke="#c0271e" stroke-width="1.8"/>
<text x="600.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">М'ютекс (mutex)</text>
<text x="740.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">один за раз; власник + успадк.</text>
</svg>
