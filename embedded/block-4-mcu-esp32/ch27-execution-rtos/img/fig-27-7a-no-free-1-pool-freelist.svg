<rect x="149.6" y="298.6" width="160.8" height="82.8" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.0"/><text x="230.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle"><tspan x="230.0" dy="0.0">ALLOC — O(1)</tspan><tspan x="230.0" dy="15.6">зняти блок з голови:</tspan><tspan x="230.0" dy="15.6">p = freeList</tspan><tspan x="230.0" dy="15.6">freeList = *p</tspan></text>
<text x="230.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="700">pool_alloc()</text>
<line x1="129.8" y1="240.0" x2="147.6" y2="340.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.9" y="298.6" width="188.2" height="82.8" rx="6" fill="#ffe9e9" stroke="#c0271e" stroke-width="2.0"/><text x="640.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle"><tspan x="640.0" dy="0.0">FREE — O(1)</tspan><tspan x="640.0" dy="15.6">повернути блок у голову:</tspan><tspan x="640.0" dy="15.6">*p = freeList</tspan><tspan x="640.0" dy="15.6">freeList = p</tspan></text>
<text x="640.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="700">pool_free(p)</text>
<text x="450.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Жодного malloc/free! Уся «динаміка» — два перечеплення вказівника → O(1) і нуль фрагментації.</text>
