<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">М'ютекс: «один за раз» до спільного ресурсу</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як «паличка, що дає право говорити»: хто тримає замок — користується; решта чекають</text>
<rect x="410.0" y="230.0" width="140.0" height="60.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="480.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спільний</text>
<text x="480.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ресурс (шина)</text>
<rect x="120.0" y="110.0" width="180.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="210.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Задача A 🔒</text>
<text x="210.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">взяла замок — працює</text>
<line x1="250.0" y1="170.0" x2="430.0" y2="232.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="330.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">користується</text>
<rect x="660.0" y="110.0" width="180.0" height="60.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="750.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Задача B</text>
<text x="750.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">хоче — ЧЕКАЄ (блок)</text>
<line x1="710.0" y1="170.0" x2="540.0" y2="232.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round"/>
<text x="660.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ зайнято — чекає, доки A віддасть</text>
<rect x="150.0" y="308.0" width="660.0" height="34.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="480.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бере замок → користується спільним → віддає замок. Лише тоді B дістає доступ. Гонки нема.</text>
</svg>
