<text x="577.5" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">idle</text>
<text x="80.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="700">Ядро 1  (прикладний код)</text>
<text x="227.5" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">45% корисна робота</text>
<text x="784.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">idle = 55 % — є запас</text>
<text x="70.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Можна додати задачі або перемістити роботу з Ядра 0</text>
<rect x="89.6" y="355.0" width="780.9" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/><text x="480.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Idle-задача — датчик вільного запасу. Ядро 0 задихається — балансуй навантаження між ядрами (§4.10.5).</tspan></text>
