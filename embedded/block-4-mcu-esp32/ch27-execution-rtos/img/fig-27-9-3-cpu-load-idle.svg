<text x="759.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">idle</text>
<text x="80.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="700">Ядро 0  (радіо / Wi-Fi)</text>
<text x="409.5" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="700">97% корисна робота</text>
<text x="784.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="700">idle ≈ 0 % — на межі!</text>
<text x="70.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Ядро на межі: нова задача зірве дедлайни (§4.10.8)</text>
<rect x="70.0" y="248.0" width="700.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
