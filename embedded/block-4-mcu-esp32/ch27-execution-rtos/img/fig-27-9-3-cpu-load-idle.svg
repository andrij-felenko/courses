<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завантаженість CPU: корисна робота проти простою, поядрово</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">idle — датчик запасу; середнє по чипу бреше, дивись поядрово</text>
<rect x="70.0" y="100.0" width="700.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
