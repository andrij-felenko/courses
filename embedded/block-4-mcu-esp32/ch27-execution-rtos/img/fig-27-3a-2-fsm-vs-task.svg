<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли FSM простіший за задачу RTOS</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один критерій: одна послідовна справа → автомат; багато незалежних → задачі</text>
<rect x="60.0" y="70.0" width="320.0" height="40.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="220.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">⬤  Скінченний автомат (FSM)</tspan></text>
<rect x="65.0" y="106.0" width="310.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="220.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">✓  Одна змінна state + мітка t0</tspan></text>
<rect x="65.0" y="142.0" width="310.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="220.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">✓  Живе у звичайному loop()</tspan></text>
<rect x="65.0" y="178.0" width="310.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="220.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">✓  Жодного власного стека</tspan></text>
<rect x="65.0" y="214.0" width="310.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="220.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">✓  Немає планувальника / гонок</tspan></text>
<rect x="65.0" y="250.0" width="310.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="0.8"/><text x="220.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">✓  Одна послідовна справа</tspan></text>
<rect x="440.0" y="70.0" width="320.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">⬤  Задача RTOS (FreeRTOS)</tspan></text>
<rect x="445.0" y="106.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/><text x="600.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">＋ Власний стек (§4.10.7)</tspan></text>
<rect x="445.0" y="142.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/><text x="600.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">＋ Планувальник (§4.10.4)</tspan></text>
<rect x="445.0" y="178.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/><text x="600.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">＋ Черги / м'ютекси (§4.10.6)</tspan></text>
<rect x="445.0" y="214.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/><text x="600.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">＋ Ризик гонок між задачами</tspan></text>
<rect x="445.0" y="250.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/><text x="600.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">＋ Кілька незалежних справ</tspan></text>
<line x1="410.0" y1="80.0" x2="410.0" y2="310.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="410.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ВС</text>
<rect x="120.0" y="320.0" width="580.0" height="50.0" rx="6" fill="#fffbe8" stroke="#caa24a" stroke-width="1.8"/><text x="410.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ОДНА послідовно-подієва справа → автомат у loop();</tspan><tspan x="410.0" dy="15.6">БАГАТО незалежних / є блокувальні виклики → задачі/RTOS.</tspan></text>
<rect x="120.0" y="410.0" width="580.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="410.0" y="431.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">§4.10.2 діагностує «коли super-loop вичерпався»; ця вставка — «коли навіть до RTOS не треба».</tspan></text>
</svg>