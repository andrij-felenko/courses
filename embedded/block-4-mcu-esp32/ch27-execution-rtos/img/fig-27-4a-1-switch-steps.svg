<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1b1b1b"/></marker>
  <marker id="aBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#b87c00"/></marker>
  <marker id="aRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#c0271e"/></marker>
</defs>
<text x="500.0" y="28.0" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold">Три кроки перемикання контексту: зупинити → сховати → підмінити</text>
<text x="500.0" y="47.0" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-style="italic">SP — єдина «ручка» до збереженого стану; кожна задача відновлюється точно там, де її спинили</text>
<text x="140.0" y="70.0" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold">ЗАДАЧА A</text>
<text x="500.0" y="70.0" font-size="13" fill="#b87c00" text-anchor="middle" font-weight="bold">ПЛАНУВАЛЬНИК</text>
<text x="860.0" y="70.0" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold">ЗАДАЧА B</text>
<rect x="60.0" y="90.0" width="160.0" height="32.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="140.0" y="110.0" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold">A БІЖИТЬ (PC, регістри — в CPU)</text>
<line x1="220.0" y1="106.0" x2="396.0" y2="106.0" stroke="#b87c00" stroke-width="1.8" marker-end="url(#aAmber)"/>
<text x="320.0" y="98.0" font-size="9.5" fill="#b87c00" text-anchor="middle" font-style="italic">тік-переривання або vTaskDelay</text>
<rect x="400.0" y="90.0" width="200.0" height="32.0" rx="6" fill="#fff6e0" stroke="#b87c00" stroke-width="2"/>
<text x="500.0" y="103.0" font-size="10" fill="#b87c00" text-anchor="middle" font-weight="bold">① Привід: час перемкнутись</text>
<text x="500.0" y="116.0" font-size="8.5" fill="#b87c00" text-anchor="middle">(тік виявив — або A сама поступилась)</text>
<text x="52.0" y="140.0" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-style="italic">стек задачі A ↓</text>
<rect x="60.0" y="150.0" width="160.0" height="22.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="140.0" y="163.0" font-size="10" fill="#1f47b5" text-anchor="middle">R14..R0</text>
<rect x="60.0" y="174.0" width="160.0" height="22.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="140.0" y="187.0" font-size="10" fill="#1f47b5" text-anchor="middle">PC</text>
<rect x="60.0" y="198.0" width="160.0" height="22.0" rx="3" fill="#d8e6fb" stroke="#1f47b5" stroke-width="1.5"/>
<text x="140.0" y="211.0" font-size="10" fill="#1f47b5" text-anchor="middle">прапорці (PSW)</text>
<line x1="28.0" y1="222.0" x2="60.0" y2="222.0" stroke="#1f47b5" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="25.0" y="226.0" font-size="10" fill="#1f47b5" text-anchor="end" font-weight="bold">SP_A</text>
<line x1="400.0" y1="162.0" x2="224.0" y2="162.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="320.0" y="154.0" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-style="italic">② push: R0..Rn, PC, прапорці</text>
<rect x="400.0" y="150.0" width="200.0" height="64.0" rx="6" fill="#fff6e0" stroke="#b87c00" stroke-width="2"/>
<text x="500.0" y="164.0" font-size="10" fill="#b87c00" text-anchor="middle" font-weight="bold">② Зберегти контекст A:</text>
<text x="500.0" y="179.0" font-size="9.5" fill="#b87c00" text-anchor="middle">push R0..Rn, PC, PSW → стек A</text>
<text x="500.0" y="194.0" font-size="9.5" fill="#b87c00" text-anchor="middle" font-style="italic">TCB_A.sp ← SP_A</text>
<text x="500.0" y="208.0" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-style="italic">(SP — ручка до всього контексту)</text>
<text x="948.0" y="240.0" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-style="italic">стек задачі B ↓</text>
<rect x="780.0" y="250.0" width="160.0" height="22.0" rx="3" fill="#c8ecda" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="860.0" y="263.0" font-size="10" fill="#1f8a3b" text-anchor="middle">прапорці (PSW)</text>
<rect x="780.0" y="274.0" width="160.0" height="22.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="860.0" y="287.0" font-size="10" fill="#1f8a3b" text-anchor="middle">PC</text>
<rect x="780.0" y="298.0" width="160.0" height="22.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="860.0" y="311.0" font-size="10" fill="#1f8a3b" text-anchor="middle">R14..R0</text>
<line x1="940.0" y1="322.0" x2="972.0" y2="322.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="975.0" y="326.0" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold">SP_B</text>
<rect x="400.0" y="250.0" width="200.0" height="64.0" rx="6" fill="#fff6e0" stroke="#b87c00" stroke-width="2"/>
<text x="500.0" y="264.0" font-size="10" fill="#b87c00" text-anchor="middle" font-weight="bold">③ Відновити контекст B:</text>
<text x="500.0" y="279.0" font-size="9.5" fill="#b87c00" text-anchor="middle" font-style="italic">SP ← TCB_B.sp</text>
<text x="500.0" y="294.0" font-size="9.5" fill="#b87c00" text-anchor="middle">pop PC, Rn..R0 зі стека B</text>
<text x="500.0" y="308.0" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-style="italic">«повернутись з переривання» → B</text>
<line x1="604.0" y1="280.0" x2="776.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="680.0" y="272.0" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-style="italic">③ pop: PC, Rn..R0 зі стека B</text>
<rect x="780.0" y="342.0" width="160.0" height="32.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="860.0" y="362.0" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold">B БІЖИТЬ (з місця, де спинили)</text>
<line x1="26.0" y1="90.0" x2="26.0" y2="374.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="26.0" y1="362.0" x2="26.0" y2="378.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="26.0" y="85.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-style="italic">час</text>
<rect x="90.0" y="394.0" width="820.0" height="40.0" rx="8" fill="#fff6e0" stroke="#b87c00" stroke-width="1.5"/>
<text x="500.0" y="410.0" font-size="10.5" fill="#1b1b1b" text-anchor="middle">SP — єдина «ручка» до контексту задачі: знаючи SP, планувальник повністю відновлює її стан зі стека.</text>
<text x="500.0" y="426.0" font-size="10" fill="#8a8a8a" text-anchor="middle" font-style="italic">Задача A «не знає», що щось сталося: її регістри жили на її стеку весь час.</text>
</svg>
