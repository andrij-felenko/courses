<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Можна «прив'язати» задачу до ядра: xTaskCreatePinnedToCore</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">указуєш номер ядра (0, 1) — або «байдуже», і планувальник сам обере вільне</text>
<rect x="70.0" y="90.0" width="470.0" height="110.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="305.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">створення з прив'язкою:</text>
<text x="86.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">xTaskCreatePinnedToCore(</text>
<text x="86.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    taskCtrl, "ctrl", 4096, NULL,</text>
<text x="86.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    2, NULL,  1 );   // ← ядро 1</text>
<text x="86.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">//  ...функ., ім'я, стек, парам., пріор., деск., ЯДРО</text>
<rect x="580.0" y="90.0" width="320.0" height="110.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="740.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">типовий поділ</text>
<text x="600.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Ядро 0: Wi-Fi / мережа</text>
<text x="600.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Ядро 1: ваша важлива робота</text>
<text x="600.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ радіо не «затинає» керування</text>
<rect x="150.0" y="230.0" width="660.0" height="116.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="480.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прив'язка корисна, коли задача мусить бігти без перешкод від іншого ядра —</text>
<text x="480.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">наприклад, точне керування мотором окремо від мережевого стека.</text>
<text x="480.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Не прив'язуєш (tskNO_AFFINITY) — задача побіжить на будь-якому вільному ядрі.</text>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Звичайний loop() за умовчанням живе на ядрі 1.</text>
</svg>
