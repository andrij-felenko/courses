<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет RAM: усі стеки + купа + глобальні мусять уміститися</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">забагато стека теж погано — завеликі стеки марнують дорогу пам'ять чипа</text>
<rect x="70.0" y="130.0" width="96.0" height="50.0" rx="0" fill="#8a8a8a" stroke="#1b1b1b" stroke-width="1"/>
<text x="118.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">глобальні</text>
<text x="118.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="166.0" y="130.0" width="96.0" height="50.0" rx="0" fill="#caa24a" stroke="#1b1b1b" stroke-width="1"/>
<text x="214.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стек loop</text>
<text x="214.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="262.0" y="130.0" width="128.0" height="50.0" rx="0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="1"/>
<text x="326.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">стек задачі 1</text>
<text x="326.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="390.0" y="130.0" width="128.0" height="50.0" rx="0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="1"/>
<text x="454.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">стек задачі 2</text>
<text x="454.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="518.0" y="130.0" width="112.0" height="50.0" rx="0" fill="#7a4fb0" stroke="#1b1b1b" stroke-width="1"/>
<text x="574.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">стек задачі 3</text>
<text x="574.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="630.0" y="130.0" width="176.0" height="50.0" rx="0" fill="#2aa198" stroke="#1b1b1b" stroke-width="1"/>
<text x="718.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">купа (heap)</text>
<text x="718.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="806.0" y="130.0" width="64.0" height="50.0" rx="0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1"/>
<text x="70.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вся RAM чипа (в ESP32 — сотні кілобайтів)</text>
<text x="870.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">→ переповнити цей рядок не можна</text>
<rect x="150.0" y="250.0" width="640.0" height="70.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожен зайвий кілобайт стека — це кілобайт, якого бракуватиме деінде.</text>
<text x="470.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому розмір стека шукають не «з запасом про всяк випадок», а виміряний —</text>
<text x="470.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">достатній із розумним запасом, але не марнотратний.</text>
</svg>
