<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємне блокування: кільце очікування, з якого нема виходу</text>
<text x="430.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-style="italic">кожна задача коректна сама по собі — смертельний лише перехресний порядок у одну мить</text>
<rect x="120.0" y="270.0" width="160.0" height="54.0" rx="10" fill="#fff6e0" stroke="#b07a10" stroke-width="2.0"/><text x="200.0" y="292.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b07a10" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">SPI Mutex</tspan><tspan x="200.0" dy="18.2">(spiMtx)</tspan></text>
<rect x="580.0" y="270.0" width="160.0" height="54.0" rx="10" fill="#fff6e0" stroke="#b07a10" stroke-width="2.0"/><text x="660.0" y="292.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b07a10" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">SD Mutex</tspan><tspan x="660.0" dy="18.2">(sdMtx)</tspan></text>
<rect x="120.0" y="130.0" width="160.0" height="54.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.0"/><text x="200.0" y="152.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Задача A</tspan><tspan x="200.0" dy="18.2">(дисплей → SD)</tspan></text>
<rect x="580.0" y="130.0" width="160.0" height="54.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.0"/><text x="660.0" y="152.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Задача B</tspan><tspan x="660.0" dy="18.2">(SD → дисплей)</tspan></text>
<line x1="200.0" y1="184.0" x2="200.0" y2="270.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="213.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">тримає</text>
<line x1="660.0" y1="184.0" x2="660.0" y2="270.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="673.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">тримає</text>
<line x1="280.0" y1="157.0" x2="580.0" y2="157.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="430.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">чекає →</text>
<line x1="580.0" y1="183.0" x2="280.0" y2="183.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="430.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="700">← чекає</text>
<circle cx="430.0" cy="168.0" r="14.0" fill="#fbeaea" stroke="#c0271e" stroke-width="2.2"/>
<text x="430.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="700">∞</text>
<rect x="229.9" y="351.4" width="400.2" height="67.2" rx="10" fill="#fbeaea" stroke="#c0271e" stroke-width="1.8"/><text x="430.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a1010" text-anchor="middle"><tspan x="430.0" dy="0.0">A тримає SPI, чекає SD  ·  B тримає SD, чекає SPI</tspan><tspan x="430.0" dy="15.6">Кільце замкнулось: ні A, ні B не зрушать НІКОЛИ.</tspan><tspan x="430.0" dy="15.6">Watchdog (§4.6.7) зрештою перезавантажить чип — мовчки.</tspan></text>
<text x="430.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-style="italic">Кожна задача окремо правильна: взяла замок, попрацювала, віддала. Фатальний лише збіг порядку + часу.</text>
</svg>