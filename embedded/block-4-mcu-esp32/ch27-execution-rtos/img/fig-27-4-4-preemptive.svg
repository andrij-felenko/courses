<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Витісняючий: планувальник забирає процесор СИЛОЮ</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на тіку чи коли прокинувся важливіший — поточну задачу спиняють, не питаючи її згоди</text>
<line x1="70.0" y1="150.0" x2="890.0" y2="150.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="70.0" y="150.0" width="250.0" height="34.0" rx="3" fill="#1f47b5" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="195.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Задача B (низький пріор.)</text>
<rect x="320.0" y="150.0" width="300.0" height="34.0" rx="3" fill="#c0271e" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="470.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">Задача A (високий) — витіснила!</text>
<rect x="620.0" y="150.0" width="270.0" height="34.0" rx="3" fill="#1f47b5" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="755.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">B біжить далі</text>
<line x1="320.0" y1="100.0" x2="320.0" y2="194.0" stroke="#c0271e" stroke-width="2.2" stroke-linecap="round"/>
<text x="320.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">A прокинулась → B спинено НЕГАЙНО</text>
<line x1="620.0" y1="150.0" x2="620.0" y2="204.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<text x="670.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">A заблокувалась → B повертається</text>
<rect x="150.0" y="250.0" width="660.0" height="92.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Задача B не давала згоди — її просто відсунули заради важливішої A.</text>
<text x="480.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодна задача не може «зажерти» процесор: планувальник завжди сильніший.</text>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Це і робить систему чуйною та придатною до реального часу (§27.8).</text>
</svg>
