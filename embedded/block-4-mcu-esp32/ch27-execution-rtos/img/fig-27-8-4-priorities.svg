<text x="90.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">керування мотором</text>
<text x="90.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">кожні 1 мс — тісно</text>
