<text x="540.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">низький</text>
<rect x="680.0" y="96.0" width="220.0" height="200.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="790.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">правило (rate-</text>
<text x="790.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">monotonic):</text>
<text x="700.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">що частіше / тісніший</text>
<text x="700.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дедлайн — то ВИЩИЙ</text>
<text x="700.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пріоритет.</text>
<text x="700.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Критична задача витісняє</text>
<text x="700.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">решту й завжди встигає</text>
<text x="700.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">до свого строку.</text>
