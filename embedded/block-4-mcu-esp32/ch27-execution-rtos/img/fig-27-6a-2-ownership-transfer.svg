</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="700">Передавання володіння буфером через чергу вказівником</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle">виробник наповнив → send(ptr) → більше НЕ торкається; споживач вжив → повернув у пул</text>
<line x1="60.0" y1="120.0" x2="900.0" y2="120.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="906.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start">час →</text>
<rect x="100.0" y="80.0" width="160.0" height="30.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="180.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700">буфер (виробник)</text>
<text x="180.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700">ВИРОБНИК</text>
<text x="180.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle">заповнює</text>
<line x1="100.0" y1="128.0" x2="100.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="260.0" y1="128.0" x2="260.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="100.0" y1="140.0" x2="260.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<text x="180.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle">володіє</text>
<line x1="280.0" y1="40.0" x2="280.0" y2="126.0" stroke="#caa24a" stroke-width="2.2" stroke-linecap="round"/>
<text x="284.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="start" font-weight="700">send(ptr)</text>
<rect x="298.0" y="46.9" width="80.0" height="42.3" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="338.0" y="65.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle"><tspan x="338.0" dy="0.0">qActuator</tspan><tspan x="338.0" dy="12.2">[ptr]</tspan></text>
<line x1="280.0" y1="75.0" x2="288.0" y2="68.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#aGold)"/>
<line x1="368.0" y1="68.0" x2="480.0" y2="100.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#aGold)"/>
<rect x="294.0" y="80.0" width="240.0" height="30.0" rx="4" fill="#fff0f0" stroke="#c0271e" stroke-width="1.6"/>
<text x="414.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="700">✗ виробник</text>
<text x="414.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle">більше НЕ чіпає</text>
<rect x="540.0" y="80.0" width="200.0" height="30.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.0"/>
<text x="640.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">буфер (споживач)</text>
<text x="640.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">СПОЖИВАЧ</text>
<text x="640.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle">вживає → повертає</text>
<line x1="540.0" y1="128.0" x2="540.0" y2="140.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<line x1="740.0" y1="128.0" x2="740.0" y2="140.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<line x1="540.0" y1="140.0" x2="740.0" y2="140.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<text x="640.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle">володіє</text>
<rect x="780.0" y="47.5" width="80.0" height="45.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="820.0" y="67.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle"><tspan x="820.0" dy="0.0">пул</tspan><tspan x="820.0" dy="13.5">буферів</tspan></text>
<line x1="740.0" y1="95.0" x2="820.0" y2="92.5" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<rect x="60.0" y="300.0" width="840.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="480.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="700">Правило «передав — забув»: після xQueueSend виробник більше не читає й не пише цей буфер.</text>
<text x="480.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle">Подвійний доступ або подвійний free — крах. Дисципліна одна: send = назавжди віддав.</text>
<text x="480.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle">Якщо потрібна відповідь — окрема черга або task notification, не зворотний send (§4.10.6).</text>
</svg>
