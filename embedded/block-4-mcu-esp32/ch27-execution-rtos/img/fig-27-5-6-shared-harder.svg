<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зворотний бік: два ядра роблять спільні дані ще небезпечнішими</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тепер дві задачі можуть торкнутися однієї змінної не «по черзі», а в ТУ САМУ мить</text>
<rect x="120.0" y="110.0" width="200.0" height="60.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="220.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Ядро 0: задача X</text>
<text x="220.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пише змінну</text>
<rect x="640.0" y="110.0" width="200.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="740.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро 1: задача Y</text>
<text x="740.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пише ту саму</text>
<rect x="420.0" y="200.0" width="120.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="480.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спільна</text>
<text x="480.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">змінна</text>
<line x1="320.0" y1="150.0" x2="430.0" y2="205.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="640.0" y1="150.0" x2="530.0" y2="205.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="480.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">одночасний доступ → зіпсоване значення (гонка)</text>
<rect x="150.0" y="312.0" width="660.0" height="34.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="480.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому в багатозадачності (а надто на двох ядрах) спільні дані треба захищати — це тема §27.6.</text>
</svg>
