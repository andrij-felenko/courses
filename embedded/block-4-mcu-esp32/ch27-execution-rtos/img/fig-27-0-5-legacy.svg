<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спадок: та сама ідея 1961 року — тепер у твоєму чипі</text>
<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поділ часу зменшився від машинного залу до RTOS на мікроконтролері</text>
<rect x="70.0" y="110.0" width="200.0" height="150.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="170.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1961: CTSS</text>
<text x="170.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">машинний зал</text>
<text x="170.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">багато людей</text>
<text x="170.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">один процесор</text>
<text x="170.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">планувальник +</text>
<text x="170.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перемикання контексту</text>
<line x1="280.0" y1="185.0" x2="400.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="340.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">та сама ідея,</text>
<text x="340.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">менший масштаб</text>
<rect x="430.0" y="110.0" width="200.0" height="150.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="530.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сьогодні: RTOS</text>
<text x="530.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чип ESP32</text>
<text x="530.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">багато задач</text>
<text x="530.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">два ядра</text>
<text x="530.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">FreeRTOS:</text>
<text x="530.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ті самі планувальник + кванти</text>
<rect x="670.0" y="110.0" width="230.0" height="150.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="785.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Що додалося:</text>
<text x="688.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">реальний час —</text>
<text x="688.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не лише «справедливо»,</text>
<text x="688.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">а й ВЧАСНО (до дедлайну).</text>
<text x="688.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пріоритети задач,</text>
<text x="688.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">передбачувані затримки.</text>
<rect x="150.0" y="300.0" width="660.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те, що колись займало цілий зал і служило людям, тепер живе в крихітному чипі</text>
<text x="480.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">й керує задачами — це і є RTOS, тема цього розділу.</text>
</svg>
