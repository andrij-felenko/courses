<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
<rect width="960" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Питання, з якого почалися ОС: як одній машині служити багатьом?</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дорогий комп'ютер один, охочих рахувати — багато; хто має чекати?</text>
<rect x="420.0" y="92.0" width="120.0" height="70.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="480.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ОДНА</text>
<text x="480.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">машина</text>
<text x="160.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Пакетно: усі чекають у черзі</text>
<rect x="60.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="82.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">№1</text>
<rect x="116.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="138.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">№2</text>
<rect x="172.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="194.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">№3</text>
<rect x="228.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="250.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">№4</text>
<text x="160.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">один рахує — троє нудяться годинами</text>
<text x="760.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Поділ часу: швидко по черзі — усім «одразу»</text>
<rect x="620.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="642.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">№1</text>
<rect x="676.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="698.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">№2</text>
<rect x="732.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="754.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">№3</text>
<rect x="788.0" y="230.0" width="44.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="810.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">№4</text>
<text x="760.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кожному — крихітний шматочок часу, дуже часто</text>
<line x1="540.0" y1="120.0" x2="620.0" y2="230.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aGreen)"/>
<line x1="420.0" y1="120.0" x2="340.0" y2="230.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<rect x="150.0" y="330.0" width="660.0" height="70.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/>
<text x="480.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розв'язок виявився хитрим: перемикатися між людьми так ШВИДКО,</text>
<text x="480.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">щоб кожному здавалося, ніби велика машина належить тільки йому.</text>
<text x="480.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Цю ілюзію й назвали поділом часу (time-sharing).</text>
</svg>
