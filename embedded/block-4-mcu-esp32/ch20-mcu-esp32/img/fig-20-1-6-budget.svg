  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет пам'яті: чи влізе програма в мікроконтролер</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на МК пам'ять рахують у кілобайтах — код в одну посудину, змінні в іншу</text>
<text x="40.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Програмна пам'ять (код)</text>
<rect x="40.0" y="112.0" width="700.0" height="44.0" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<rect x="40.0" y="112.0" width="30.8" height="44.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="78.8" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">180 КБ</text>
<text x="732.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">ємність 4 МБ = 4096 КБ</text>
<text x="732.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">4.4% зайнято</text>
<text x="40.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Пам'ять даних (змінні)</text>
<rect x="40.0" y="242.0" width="700.0" height="44.0" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<rect x="40.0" y="242.0" width="98.4" height="44.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="89.2" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">45 КБ</text>
<text x="732.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">ємність 320 КБ</text>
<text x="732.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">14.1% зайнято</text>
<rect x="40.0" y="330.0" width="700.0" height="72.0" rx="10" fill="#f7f4ea" stroke="#caa24a" stroke-width="1.6"/>
<text x="56.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Урок:</text>
<text x="56.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">обидві посудини вимірюють у КБ, а не ГБ; заповнювати «по вінця» не можна —</text>
<text x="56.0" y="393.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лишають запас на стек і непередбачене. Складніша задача — і запас тане вмить.</text>
</svg>
