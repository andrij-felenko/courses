<rect x="600.0" y="230.0" width="200.0" height="72.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="700.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контролер переривань</text>
<rect x="600.0" y="322.0" width="200.0" height="56.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="700.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порти вводу-виводу</text>
<rect x="120.0" y="392.0" width="680.0" height="40.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зелене — родзинка 8051: керувати окремими бітами так само легко, як байтами.</text>
