<rect x="360.0" y="230.0" width="200.0" height="72.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="460.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Data RAM 128 Б</text>
<text x="460.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">є бітово-адресовна зона</text>
<rect x="360.0" y="322.0" width="200.0" height="56.0" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
