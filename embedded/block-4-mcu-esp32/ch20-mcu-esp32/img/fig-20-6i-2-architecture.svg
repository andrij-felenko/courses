<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що нового було в 8051: булів процесор і банки регістрів</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">гарвардський поділ, бітові операції та швидкі банки — усе під керування, а не лічбу</text>
<rect x="60.0" y="84.0" width="800.0" height="360.0" rx="12" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="80.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Intel 8051 (1980)</text>
<rect x="120.0" y="140.0" width="200.0" height="90.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="220.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро 8-біт</text>
<text x="220.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+ БУЛІВ ПРОЦЕСОР</text>
<text x="220.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">17 бітових інструкцій</text>
<rect x="120.0" y="258.0" width="200.0" height="82.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
