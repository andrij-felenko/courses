<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від ESP8266 (2014) до ESP32 (2016): що змінилось</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">залізо стало кращим — але переможним його зробила готова екосистема</text>
<rect x="300.0" y="86.0" width="260.0" height="46.0" rx="8" fill="#eef3ff" stroke="#1f47b5" stroke-width="2"/>
<text x="430.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ESP8266 · 2014</text>
<rect x="600.0" y="86.0" width="260.0" height="46.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="730.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32 · 2016</text>
<text x="60.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ядра</text>
<rect x="300.0" y="146.0" width="260.0" height="52.0" rx="8" fill="#fbfdff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="430.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одне (~80 МГц)</text>
<rect x="600.0" y="146.0" width="260.0" height="52.0" rx="8" fill="#fbfefb" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="730.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">два (до 240 МГц)</text>
<text x="60.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Радіо</text>
<rect x="300.0" y="210.0" width="260.0" height="52.0" rx="8" fill="#fbfdff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="430.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише Wi-Fi</text>
<rect x="600.0" y="210.0" width="260.0" height="52.0" rx="8" fill="#fbfefb" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="730.0" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Wi-Fi + Bluetooth/BLE</text>
<text x="60.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Периферія, ніжки</text>
<rect x="300.0" y="274.0" width="260.0" height="52.0" rx="8" fill="#fbfdff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="430.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">небагато</text>
<rect x="600.0" y="274.0" width="260.0" height="52.0" rx="8" fill="#fbfefb" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="730.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">щедро (матриця ніжок)</text>
<text x="60.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Документація, SDK</text>
<rect x="300.0" y="338.0" width="260.0" height="52.0" rx="8" fill="#fbfdff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="430.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«зроби сам» (спільнота)</text>
<rect x="600.0" y="338.0" width="260.0" height="52.0" rx="8" fill="#fbfefb" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="730.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">офіційна: ESP-IDF + Arduino</text>
<rect x="120.0" y="420.0" width="660.0" height="34.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="441.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32 вийшов одразу з екосистемою — і став стандартом аматорського IoT.</text>
</svg>
