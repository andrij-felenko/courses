<text x="670.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усі нові сімейства</text>
<line x1="250.0" y1="272.0" x2="668.0" y2="272.0" stroke="#1b1b1b" stroke-width="3" marker-end="url(#aInk)"/>
