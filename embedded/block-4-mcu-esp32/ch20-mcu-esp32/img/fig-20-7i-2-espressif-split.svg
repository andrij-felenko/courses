<text x="460.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для коду різниця майже непомітна: IDF і GCC компілюють під обидві.</text>
<text x="460.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Змінюється ISA всередині — не спосіб, у який ви пишете програму.</text>
