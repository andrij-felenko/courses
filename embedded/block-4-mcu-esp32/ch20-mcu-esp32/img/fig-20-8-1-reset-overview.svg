<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540">
<rect width="940" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться reset і як чіп запам'ятовує причину</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кілька джерел сходяться на одну лінію скидання — а причину засувка зберігає до старту програми</text>
<rect x="56.0" y="74.0" width="250.0" height="44.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="70.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Power-on (POR)</text>
<text x="70.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перше живлення — норма</text>
<line x1="306.0" y1="96.0" x2="466.0" y2="96.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<rect x="56.0" y="132.0" width="250.0" height="44.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="70.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Кнопка / пін EN</text>
<text x="70.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">зовнішнє скидання</text>
<line x1="306.0" y1="154.0" x2="466.0" y2="154.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<rect x="56.0" y="190.0" width="250.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Brownout (BOR)</text>
<text x="70.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">напруга просіла</text>
<line x1="306.0" y1="212.0" x2="466.0" y2="212.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="56.0" y="248.0" width="250.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Watchdog</text>
<text x="70.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">програма зависла</text>
<line x1="306.0" y1="270.0" x2="466.0" y2="270.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="56.0" y="306.0" width="250.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Panic / виняток</text>
<text x="70.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">крах коду</text>
<line x1="306.0" y1="328.0" x2="466.0" y2="328.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="56.0" y="364.0" width="250.0" height="44.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">esp_restart()</text>
<text x="70.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">навмисний перезапуск</text>
<line x1="306.0" y1="386.0" x2="466.0" y2="386.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="56.0" y="422.0" width="250.0" height="44.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Вихід з deep-sleep</text>
<text x="70.0" y="459.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">прокидання зі сну</text>
<line x1="306.0" y1="444.0" x2="466.0" y2="444.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<line x1="466.0" y1="74.0" x2="466.0" y2="466.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="466.0" y="64.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лінія RESET</text>
<path d="M 462.0,250.0 472.5,250.0 466.5,262.0 475.5,262.0 457.5,286.0 463.5,266.5 453.0,266.5 Z" fill="#c0271e" stroke="none"/>
<rect x="558.0" y="150.0" width="326.0" height="92.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="721.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Ядро рестартує</text>
<text x="721.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">PC → вектор скидання</text>
<text x="721.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">регістри — у стан за умовчанням</text>
<text x="721.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виконання з початку програми</text>
<line x1="466.0" y1="178.0" x2="558.0" y2="178.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="558.0" y="300.0" width="326.0" height="96.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="721.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Регістр причини (засувка)</text>
<text x="721.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зберігає, ХТО викликав скидання</text>
<text x="721.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">переживає сам reset</text>
<text x="721.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прошивка читає esp_reset_reason()</text>
<line x1="466.0" y1="346.0" x2="558.0" y2="346.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="558.0" y="430.0" width="326.0" height="74.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="721.0" y="454.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Майже кожна причина, крім POR і</text>
<text x="721.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">навмисного перезапуску, —</text>
<text x="721.0" y="492.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">симптом, який варто залогувати.</text>
</svg>
