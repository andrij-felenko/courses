<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головна причина модуля: готова сертифікація радіо</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">будь-який радіопередавач треба сертифікувати — питання лише, хто це робить і за чиї гроші</text>
<rect x="60.0" y="88.0" width="360.0" height="280.0" rx="12" fill="#fbfdfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="240.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Береш готовий модуль</text>
<circle cx="88.0" cy="152.0" r="7.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="88.0" cy="152.0" r="7.0" fill="none" stroke="#0d5a23" stroke-width="1.2"/>
