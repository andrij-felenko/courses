<text x="240.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FCC ID на корпусі = квиток на ринок</text>
<rect x="480.0" y="88.0" width="360.0" height="280.0" rx="12" fill="#fffafa" stroke="#c0271e" stroke-width="2"/>
