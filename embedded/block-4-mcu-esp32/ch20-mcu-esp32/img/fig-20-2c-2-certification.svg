<text x="528.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ризик не пройти з першого разу</text>
<rect x="506.0" y="330.0" width="308.0" height="30.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
