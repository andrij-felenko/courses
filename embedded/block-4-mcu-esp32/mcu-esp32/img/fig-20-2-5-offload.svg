<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому периферія, а не «все програмою»</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама задача — видати рівний сигнал — двома способами</text>
<rect x="30.0" y="78.0" width="840.0" height="150.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="50.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Програмою (bit-bang)</text>
<rect x="60.0" y="120.0" width="150.0" height="80.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="135.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро</text>
<text x="135.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">зайняте 100%</text>
<text x="135.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у циклі увімк–вимк</text>
<text x="300.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">вихід — тремтить (jitter):</text>
<path d="M 300.0,188.0 H 322.0 V 150.0 H 360.0 V 188.0 H 386.0 V 150.0 H 416.0 V 188.0 H 434.0 V 150.0 H 478.0 V 188.0 H 506.0 V 150.0 H 526.0" fill="none" stroke="#c0271e" stroke-width="2.6" stroke-linejoin="miter"/>
<text x="760.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">будь-яка перерва — і збій</text>
<rect x="30.0" y="244.0" width="840.0" height="160.0" rx="12" fill="none" stroke="#eef6ef" stroke-width="2"/>
<text x="50.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Периферією (таймер)</text>
<rect x="60.0" y="286.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="135.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро</text>
<text x="135.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вільне</text>
<text x="135.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">робить інше</text>
<line x1="212.0" y1="326.0" x2="250.0" y2="326.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="252.0" y="296.0" width="120.0" height="60.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="312.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Таймер</text>
<text x="312.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(залізо)</text>
<text x="420.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">вихід — ідеально рівний:</text>
<path d="M 420.0,300.0 H 450.0 V 348.0 H 480.0 V 300.0 H 510.0 V 348.0 H 540.0 V 300.0 H 570.0 V 348.0 H 600.0 V 300.0 H 630.0 V 348.0 H 660.0" fill="none" stroke="#1f8a3b" stroke-width="2.6" stroke-linejoin="miter"/>
<text x="770.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">точно, поки ядро вільне</text>
</svg>
