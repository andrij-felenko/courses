<svg xmlns="http://www.w3.org/2000/svg" width="940" height="452" viewBox="0 0 940 452">
<rect width="940" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прокидання з deep-sleep — це теж reset, а не «продовжити»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва шляхи йдуть через вектор скидання; різниця — що пережило паузу і яку причину видно</text>
<rect x="58.0" y="78.0" width="392.0" height="296.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="2"/>
<text x="254.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Холодний старт</text>
<text x="254.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">причина: POWERON</text>
<circle cx="82.0" cy="154.0" r="11.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="102.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">живлення з нуля → POR</text>
<circle cx="82.0" cy="198.0" r="11.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="102.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вся RAM порожня — нічого не лишилось</text>
<circle cx="82.0" cy="242.0" r="11.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="102.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повна ініціалізація з нуля</text>
<circle cx="82.0" cy="286.0" r="11.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<text x="102.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">під'єднатися, відкалібрувати, прогрітися</text>
<circle cx="82.0" cy="330.0" r="11.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="102.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">показати привітання</text>
<rect x="490.0" y="78.0" width="392.0" height="296.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="2"/>
<text x="686.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Прокидання з deep-sleep</text>
<text x="686.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">причина: DEEPSLEEP</text>
<circle cx="514.0" cy="154.0" r="11.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="534.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">таймер чи пін будить RTC-домен</text>
<circle cx="514.0" cy="198.0" r="11.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="534.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SRAM теж втрачено, але RTC-память жива</text>
<circle cx="514.0" cy="242.0" r="11.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="534.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">та сама точка входу — програма з початку</text>
<circle cx="514.0" cy="286.0" r="11.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<text x="534.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">esp_reset_reason() = DEEPSLEEP</text>
<circle cx="514.0" cy="330.0" r="11.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="514.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="534.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відновити лічильник із RTC-памʼяті й працювати</text>
<rect x="58.0" y="388.0" width="824.0" height="48.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільне: обидва стартують із вектора скидання — виконання завжди з початку.</text>
<text x="470.0" y="427.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Що пережило сон — лише RTC-домен (режими сну — §4.1.4); решта RAM чиста, як після вмикання.</text>
</svg>
