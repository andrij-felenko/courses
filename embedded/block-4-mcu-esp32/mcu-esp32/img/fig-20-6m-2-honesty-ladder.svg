<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Драбина чесного порівняння ядер</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що вище — то ближче до правди про швидкість на ТВОЇХ задачах</text>
<rect x="166.0" y="96.0" width="574.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="186.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Виміряти СВОЇ задачі</text>
<text x="186.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">твій код, твоя пам'ять — найчесніше</text>
<rect x="166.0" y="166.0" width="574.0" height="56.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="186.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Профільний бенчмарк (CoreMark)</text>
<text x="186.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ближче до реальних задач, ніж Dhrystone</text>
<rect x="166.0" y="236.0" width="574.0" height="56.0" rx="10" fill="#eef0f5" stroke="#caa24a" stroke-width="2"/>
<text x="186.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">DMIPS / МГц</text>
<text x="186.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">враховує корисну роботу за такт</text>
<rect x="166.0" y="306.0" width="574.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="186.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Лише МГц</text>
<text x="186.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">оманливо: ігнорує архітектуру</text>
<line x1="126.0" y1="410.0" x2="126.0" y2="86.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="126.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">чесніше</text>
<text x="126.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">наївно</text>
<rect x="166.0" y="388.0" width="574.0" height="40.0" rx="8" fill="#e4e4e4" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="453.0" y="413.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">робота ≈ МГц × DMIPS/МГц — але жоден бенчмарк не замінить заміру власного коду</text>
</svg>
