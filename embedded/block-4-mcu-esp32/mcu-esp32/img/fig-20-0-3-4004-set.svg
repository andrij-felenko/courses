<text x="440.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">шина</text>
<rect x="335.0" y="228.0" width="190.0" height="144.0" rx="6" fill="#cfd6e6" stroke="#1b1b1b" stroke-width="2.4"/>
