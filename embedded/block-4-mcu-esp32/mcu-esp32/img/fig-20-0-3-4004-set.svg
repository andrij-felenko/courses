<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Intel MCS-4 (1971): процесор окремо, пам'ять окремо</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">4004 — перший мікропроцесор: на чипі лише ядро, решта — сусідніми чипами по зовнішній шині</text>
<line x1="430.0" y1="228.0" x2="430.0" y2="178.0" stroke="#8a8a8a" stroke-width="2.4" stroke-linecap="round"/>
