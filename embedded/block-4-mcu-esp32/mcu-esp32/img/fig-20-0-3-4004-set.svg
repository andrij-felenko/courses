<text x="430.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#d8d8d8" text-anchor="middle" font-weight="normal" font-style="normal">програма</text>
<rect x="575.0" y="272.0" width="150.0" height="56.0" rx="4" fill="#2b2b2b" stroke="#000000" stroke-width="1.4"/>
<text x="650.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4002 — ОЗП</text>
<text x="650.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#d8d8d8" text-anchor="middle" font-weight="normal" font-style="normal">дані</text>
<rect x="352.0" y="418.0" width="156.0" height="56.0" rx="4" fill="#2b2b2b" stroke="#000000" stroke-width="1.4"/>
<text x="430.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4003 — порти</text>
<text x="430.0" y="461.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#d8d8d8" text-anchor="middle" font-weight="normal" font-style="normal">ввід-вивід (I/O)</text>
<rect x="70.0" y="488.0" width="740.0" height="34.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="440.0" y="510.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мікропроцесор = «комп'ютер мінус пам'ять і периферія»: щоб ожити, 4004 потребує сусідів.</text>
