<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що означає «вихід»: активно тримати лінію до VDD або GND</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не «показати» число, а фізично приєднати й живити напругу</text>
<line x1="210.0" y1="120.0" x2="470.0" y2="120.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<text x="210.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">VDD (3.3 В)</text>
<line x1="210.0" y1="340.0" x2="470.0" y2="340.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="210.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">GND (0 В)</text>
<line x1="410.0" y1="120.0" x2="410.0" y2="188.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="410.0" y1="268.0" x2="410.0" y2="340.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="340.0" y="188.0" width="140.0" height="80.0" rx="10" fill="#fffaf0" stroke="#caa24a" stroke-width="2"/>
<text x="410.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">перемикач</text>
<text x="410.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(транзистори)</text>
<text x="410.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вгору=HIGH · вниз=LOW</text>
<circle cx="410.0" cy="228.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="480.0" y1="228.0" x2="640.0" y2="228.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="645.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ніжка</text>
<text x="500.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">↑ до VDD → HIGH</text>
<text x="500.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">↓ до GND → LOW</text>
<text x="430.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Щоб напруга БУЛА, потрібне джерело й шлях для струму (Модуль 1).</text>
