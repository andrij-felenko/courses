<text x="450.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">4 + 4 = 8 ніжок → 16 клавіш (а не 16 ніжок по одній на клавішу).</text>
