  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два пороги, три зони: як вхід ділить напругу на 0 і 1</text>
<text x="440.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нижче VIL — певний нуль; вище VIH — певна одиниця; між ними — невизначеність</text>
<rect x="250.0" y="314.0" width="120.0" height="96.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<rect x="250.0" y="186.0" width="120.0" height="128.0" rx="0" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.6"/>
<rect x="250.0" y="90.0" width="120.0" height="96.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="236.0" y1="90.0" x2="236.0" y2="410.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="232.0" y1="410.0" x2="236.0" y2="410.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="228.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">0 В</text>
<line x1="232.0" y1="313.0" x2="236.0" y2="313.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="228.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">1 В</text>
<line x1="232.0" y1="216.1" x2="236.0" y2="216.1" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="228.0" y="220.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">2 В</text>
<line x1="232.0" y1="119.1" x2="236.0" y2="119.1" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="228.0" y="123.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">3 В</text>
<text x="310.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">напруга на ніжці</text>
<line x1="250.0" y1="314.0" x2="400.0" y2="314.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="406.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">VIL ≈ 0.99 В  (≈0.3·VDD)</text>
<line x1="250.0" y1="186.0" x2="400.0" y2="186.0" stroke="#1f47b5" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="406.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">VIH ≈ 2.31 В  (≈0.7·VDD)</text>
<text x="310.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">0 (LOW)</text>
<text x="310.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">?</text>
<text x="310.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">невизначено</text>
<text x="310.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1 (HIGH)</text>
<rect x="560.0" y="250.0" width="296.0" height="168.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="708.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому аж дві межі?</text>
<text x="576.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">• нижче VIL — гарантований 0</text>
<text x="576.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">• вище VIH — гарантована 1</text>
<text x="576.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• між ними вхід «не певний» —</text>
<text x="588.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">такої напруги на виході уникають</text>
<text x="576.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Сіра смуга — це і є запас</text>
<text x="576.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">проти завад (див. далі).</text>
</svg>
