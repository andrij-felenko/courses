<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Плаваючий вхід: ніжка без джерела ловить шум</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нічого не тримає рівень → вхід «висить» у невизначеній зоні й читається випадково</text>
<text x="120.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ нічого не</text>
<text x="120.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">приєднано</text>
<circle cx="150.0" cy="210.0" r="5.0" fill="none" stroke="#c0271e" stroke-width="2"/>
<polyline points="150.0,210.0 185.0,196.0 205.0,224.0 232.0,188.0 258.0,226.0 284.0,194.0 312.0,216.0 340.0,200.0" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="245.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">наводки з ефіру / сусідніх доріжок</text>
<line x1="340.0" y1="200.0" x2="430.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="430.0" y="175.0" width="150.0" height="70.0" rx="10" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2"/>
<polygon points="455,192 455,228 505,210" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="518.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вхід</text>
<line x1="580.0" y1="210.0" x2="660.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="660.0" y="182.0" width="180.0" height="58.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="750.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0? 1? 0? 1?</text>
<text x="750.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">читається випадково</text>
<rect x="140.0" y="300.0" width="620.0" height="84.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Високоомний вхід сам рівня не має. Якщо його ніхто не тримає,</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ніжка плаває біля середини шкали — у тій самій «забороненій зоні» з §22.3,</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і дрібна наводка перекидає рішення 0↔1. Цю біду й прибирають підтяжкою.</text>
</svg>
