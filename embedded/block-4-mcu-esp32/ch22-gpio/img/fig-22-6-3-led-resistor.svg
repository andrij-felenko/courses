<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Резистор біля LED: і яскравість задає, і ніжку береже</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">опір обмежує струм у безпечну для ніжки зону — без нього струм злетів би</text>
<rect x="170.0" y="108.0" width="120.0" height="48.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="230.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ніжка</text>
<text x="230.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">HIGH = 3.3 В</text>
<line x1="230.0" y1="156.0" x2="230.0" y2="186.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="230.0" y1="186.0" x2="230.0" y2="199.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="218.0" y="199.0" width="24.0" height="36.0" rx="3" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<line x1="230.0" y1="235.0" x2="230.0" y2="248.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="246.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6a14" text-anchor="start" font-weight="bold" font-style="normal">R</text>
<line x1="230.0" y1="248.0" x2="230.0" y2="264.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polygon points="218,264 242,264 230,284" fill="#fff6e0" stroke="#1b1b1b" stroke-width="2"/>
<line x1="218.0" y1="284.0" x2="242.0" y2="284.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="230.0" y1="284.0" x2="230.0" y2="330.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="243.0" y1="268.0" x2="256.0" y2="259.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="245.0" y1="276.0" x2="258.0" y2="267.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="262.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">LED</text>
<line x1="230.0" y1="330.0" x2="230.0" y2="358.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="170.0" y1="358.0" x2="290.0" y2="358.0" stroke="#1f47b5" stroke-width="2.2" stroke-linecap="round"/>
<text x="170.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">GND</text>
<line x1="308.0" y1="168.0" x2="308.0" y2="350.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="314.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">I (однаковий усюди)</text>
<rect x="460.0" y="116.0" width="420.0" height="184.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="670.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порахуймо струм</text>
<text x="480.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">I = (VDD − Vf) / R</text>
<text x="480.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Vf(LED) ≈ 2.0 В,  VDD = 3.3 В</text>
<text x="480.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">хочемо I ≈ 10 мА:</text>
<text x="480.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">R = (3.3 − 2.0) / 0.010 = 130 Ω</text>
<text x="480.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">беремо 150–220 Ω → ще менший, безпечніший струм</text>
<rect x="460.0" y="318.0" width="420.0" height="64.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="670.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Без резистора струм обмежує лише крихітний</text>
<text x="670.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">опір LED — він злетить за межу й спалить ніжку.</text>
</svg>
