<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два бюджети: окрема ніжка й увесь чіп</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як розетка й головний автомат: тримати треба обидві межі заразом</text>
<rect x="60.0" y="84.0" width="360.0" height="190.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет ніжки («розетка»)</text>
<text x="110.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніжка 0</text>
<rect x="200.0" y="122.0" width="150.0" height="18.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="200.0" y="122.0" width="90.0" height="18.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="0"/>
<text x="360.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">≤ ~20 мА</text>
<text x="110.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніжка 1</text>
<rect x="200.0" y="152.0" width="150.0" height="18.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="200.0" y="152.0" width="90.0" height="18.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="0"/>
<text x="360.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">≤ ~20 мА</text>
<text x="110.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніжка 2</text>
<rect x="200.0" y="182.0" width="150.0" height="18.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="200.0" y="182.0" width="90.0" height="18.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="0"/>
<text x="360.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">≤ ~20 мА</text>
<text x="110.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніжка 3</text>
<rect x="200.0" y="212.0" width="150.0" height="18.0" rx="3" fill="#fff" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="200.0" y="212.0" width="90.0" height="18.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="0"/>
<text x="360.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">≤ ~20 мА</text>
<text x="240.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кожна окремо — не більш як ~20 мА (стеля 40)</text>
<rect x="480.0" y="84.0" width="360.0" height="190.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="660.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет чипа («автомат»)</text>
<text x="660.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Σ усіх ніжок</text>
<text x="660.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">≤ межа живлення чипа</text>
<text x="660.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">8 світлодіодів × 10 мА = 80 мА</text>
<text x="660.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">— це вже привід перевірити суму</text>
<text x="660.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">забагато → притишити струм або драйвер</text>
<text x="450.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мало, щоб кожна ніжка була в межах — їхня СУМА теж мусить уміститися.</text>
</svg>
