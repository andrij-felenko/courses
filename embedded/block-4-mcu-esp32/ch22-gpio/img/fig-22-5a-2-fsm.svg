<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скінченний автомат антидребезгу</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не вірити першій зміні: дочекатись, поки рівень устоїться, і лише тоді визнати подію</text>
<circle cx="170.0" cy="160.0" r="56.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="170.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАБІЛЬНИЙ</text>
<text x="170.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(рівень тримається)</text>
<circle cx="450.0" cy="160.0" r="56.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2.2"/>
<text x="450.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">ПІД ПІДОЗРОЮ</text>
<text x="450.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(чекаємо час T)</text>
<circle cx="730.0" cy="160.0" r="56.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="730.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАБІЛЬНИЙ′</text>
<text x="730.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">подія!</text>
<line x1="226.0" y1="150.0" x2="394.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="310.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зміна помічена</text>
<line x1="506.0" y1="150.0" x2="674.0" y2="150.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="590.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">T минув, рівень той самий</text>
<path d="M430,216 Q 300,270 200,216" fill="none" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
<text x="310.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">рівень повернувся — хибна тривога, назад</text>
<text x="450.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дрижання застрягає у стані «під підозрою» й не доходить до події — саме цього ми й хотіли.</text>
</svg>
