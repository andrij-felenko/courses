<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.12.1.1. Асиметрія USB: хост ініціює, пристрій лише відповідає</text>
<rect x="60.0" y="100.0" width="200.0" height="200.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">ХОС Т</text>
<text x="160.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(ПК, смартфон)</text>
<text x="160.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Ініціює ВСЕ:</tspan><tspan x="160.0" dy="15.6">• запити</tspan><tspan x="160.0" dy="15.6">• таймінг</tspan><tspan x="160.0" dy="15.6">• адреси</tspan></text>
<rect x="560.0" y="100.0" width="200.0" height="200.0" rx="10" fill="#fef9ec" stroke="#e67e22" stroke-width="2.5"/>
<text x="660.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e67e22" text-anchor="middle" font-weight="700">ПРИ СТРІЙ</text>
<text x="660.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(ESP32, флешка…)</text>
<text x="660.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Лише ВІДПОВІДАЄ:</tspan><tspan x="660.0" dy="15.6">• ніколи не першим</tspan><tspan x="660.0" dy="15.6">• реактивна логіка</tspan></text>
<line x1="265.0" y1="145.0" x2="555.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАПИТ (хост → пристрій)</text>
<line x1="555.0" y1="205.0" x2="265.0" y2="205.0" stroke="#e67e22" stroke-width="1.8" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
<text x="410.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">ВІДПОВІДЬ (лише у відповідь!)</text>
<rect x="240.0" y="320.0" width="340.0" height="62.0" rx="8" fill="#f0f9f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Контраст: I²C / SPI (§Модуль 3)</text>
<text x="410.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кілька рівноправних учасників → арбітраж шини</text>
<rect x="192.5" y="353.5" width="435.1" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="410.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Пристрій реактивний — звідси проста прошивка-device</tspan></text>
</svg>