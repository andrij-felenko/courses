<text x="124.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#9b59b6" text-anchor="middle" font-weight="700">1.5 Мбіт/с</text>
<text x="124.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Миші, клавіатури</text>
