<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.12.2.4. Три швидкості USB 2.0: LS / FS / HS</text>
<text x="112.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#9b59b6" text-anchor="end" font-weight="700">LS</text>
