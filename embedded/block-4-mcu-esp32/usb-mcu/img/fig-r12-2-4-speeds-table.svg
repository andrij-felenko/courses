<text x="390.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">SuperSpeed 5 Гбіт/с+ (USB 3.x) — інша фізика, поза обсягом цього розділу</text>
