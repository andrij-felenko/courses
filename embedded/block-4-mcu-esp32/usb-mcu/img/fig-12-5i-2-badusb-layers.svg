<line x1="228.0" y1="205.0" x2="238.0" y2="205.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="440.0" dy="0.0">Вада не у файлі й не в одній фірмі, а в архітектурі USB: пристрій сам каже, хто він, — і це нічим не перевіряється.</tspan></text>
