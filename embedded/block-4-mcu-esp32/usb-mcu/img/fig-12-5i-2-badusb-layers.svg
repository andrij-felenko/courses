<text x="390.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="390.0" dy="0.0">оголошує MSC + HID-keyboard</tspan><tspan x="390.0" dy="13.0">(композитний пристрій)</tspan></text>
<rect x="613.8" y="104.5" width="82.4" height="50.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="655.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">форматування</tspan><tspan x="655.0" dy="13.0">стирає диск,</tspan><tspan x="655.0" dy="13.0">не прошивку</tspan></text>
