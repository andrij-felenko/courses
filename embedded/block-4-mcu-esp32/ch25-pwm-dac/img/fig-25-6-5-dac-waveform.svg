<text x="480.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Послідовність чисел у часі → аналоговий сигнал. Темп відліків задає таймер, потік — DMA.</text>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ШІМ так теж уміє, але через фільтр; ЦАП малює напряму. (ESP32 має й вбудований генератор косинуса.)</text>
