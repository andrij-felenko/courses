  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ідея ШІМ: перемикай швидко — середнє і є «аналог»</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сигнал стрибає 0↔макс дуже часто; яку частку часу він «увімкнено», таке й середнє</text>
<line x1="84.0" y1="110.0" x2="880.0" y2="110.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="64.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">макс</text>
<line x1="84.0" y1="230.0" x2="880.0" y2="230.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="64.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">0</text>
<polyline points="90.0,230.0 90.0,110.0 145.0,110.0 145.0,230.0 200.0,230.0 200.0,110.0 255.0,110.0 255.0,230.0 310.0,230.0 310.0,110.0 365.0,110.0 365.0,230.0 420.0,230.0 420.0,110.0 475.0,110.0 475.0,230.0 530.0,230.0 530.0,110.0 585.0,110.0 585.0,230.0 640.0,230.0 640.0,110.0 695.0,110.0 695.0,230.0 750.0,230.0 750.0,110.0 805.0,110.0 805.0,230.0 860.0,230.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90.0" y1="170.0" x2="860.0" y2="170.0" stroke="#1f8a3b" stroke-width="2.4" stroke-dasharray="7,4" stroke-linecap="round"/>
<text x="866.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">середнє = 50%</text>
<line x1="300.0" y1="280.0" x2="300.0" y2="234.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="300.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">половину часу — увімк.</text>
<rect x="150.0" y="320.0" width="660.0" height="50.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навантаження (око, мотор, нагрівач) не встигає за швидкими стрибками — воно «бачить» СЕРЕДНЄ.</text>
<text x="480.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тож 50% часу «увімк.» = пів-яскравості, пів-швидкості. Це й є ШІМ (PWM).</text>
</svg>
