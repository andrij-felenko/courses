<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три параметри ШІМ: шпаруватість, роздільність, частота</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">шпаруватість — ЯКИЙ рівень; роздільність — на СКІЛЬКИ кроків; частота — як ШВИДКО повторюється</text>
<rect x="50.0" y="90.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="190.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Шпаруватість</text>
<line x1="70.0" y1="134.0" x2="310.0" y2="134.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="190.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">який середній рівень зараз</text>
<text x="190.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(значення, яке пишемо)</text>
<rect x="110.0" y="220.0" width="160.0" height="36.0" rx="6" fill="#f7f7f7" stroke="#1f47b5" stroke-width="1.2"/>
<text x="190.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0…макс</text>
<rect x="340.0" y="90.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="480.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Роздільність</text>
<line x1="360.0" y1="134.0" x2="600.0" y2="134.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="480.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на скільки кроків ділиться шкала</text>
<text x="480.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(число біт)</text>
<rect x="400.0" y="220.0" width="160.0" height="36.0" rx="6" fill="#f7f7f7" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="480.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">8 біт = 256 кроків</text>
<rect x="630.0" y="90.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="770.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Частота</text>
<line x1="650.0" y1="134.0" x2="890.0" y2="134.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="770.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">скільки періодів за секунду</text>
<text x="770.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(Гц)</text>
<rect x="690.0" y="220.0" width="160.0" height="36.0" rx="6" fill="#f7f7f7" stroke="#caa24a" stroke-width="1.2"/>
<text x="770.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">напр., 5 кГц</text>
<text x="480.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шпаруватість крутиш постійно; роздільність і частоту обираєш один раз — і вони ПОВ'ЯЗАНІ.</text>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Саме цей зв'язок частоти й роздільності — головний компроміс теми.</text>
</svg>
