<rect x="242.0" y="350.0" width="436.1" height="56.0" rx="8" fill="#fffbea" stroke="#c08000" stroke-width="1.2"/><text x="460.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Висновок: без жодної доданої логіки — лише змінивши напрям лічби —</tspan><tspan x="460.0" dy="13.0">лічильник перетинає поріг двічі, і два краї імпульсу стають дзеркальними.</tspan><tspan x="460.0" dy="13.0">Так з'являється «center-aligned» автоматично.</tspan></text>
