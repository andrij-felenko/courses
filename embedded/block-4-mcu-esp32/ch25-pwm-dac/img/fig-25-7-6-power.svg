<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Живлення: стрічка — це не іграшка</text>
<rect x="70.0" y="84.0" width="350.0" height="96.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="245.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Скільки їсть струму</text>
<text x="245.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">піксель на повну білизну ≈ 60 мА</text>
<text x="245.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(3 × 20 мА)</text>
<rect x="470.0" y="84.0" width="370.0" height="96.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="655.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">100 пікселів ≈ 6 А !</text>
<text x="655.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">із ніжки МК такого не взяти</text>
<text x="655.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(§4.4.6) — треба окреме живлення</text>
<text x="450.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому: окремий блок 5 В, спільна земля, зсув рівнів даних, конденсатор і резистор на даних.</text>
<text x="450.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Усі тонкощі підключення (інжекція живлення по довжині, номінали) — у 🔌-вставці про стрічку.</text>
<rect x="150.0" y="262.0" width="600.0" height="0.0" rx="0" fill="#e4e4e4" stroke="#e4e4e4" stroke-width="0"/>
</svg>
