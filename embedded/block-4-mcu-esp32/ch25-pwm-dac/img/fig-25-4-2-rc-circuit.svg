<text x="470.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий RC, що в §22.4 (підтяжка) і §22.5 (дребезг) — тут він згладжує ШІМ у напругу.</text>
