<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.9.7.2 — Вирівнювання й розміщення DMA-буфера</text>
<text x="200.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ПОГАНО</text>
<rect x="60.0" y="75.0" width="280.0" height="200.0" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="2.0"/><text x="200.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Стек задачі</tspan><tspan x="200.0" dy="15.6">(4–8 кБ)</tspan></text>
<rect x="114.8" y="152.3" width="170.5" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">uint8_t buf[1024];</tspan><tspan x="200.0" dy="14.3">(невирівняний, на стеку)</tspan></text>
<rect x="120.0" y="240.0" width="160.0" height="24.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="200.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">сусідні змінні → пошкоджені!</text>
<rect x="86.5" y="287.4" width="226.9" height="45.3" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">або: у PSRAM без flush/invalidate</tspan><tspan x="200.0" dy="14.3">→ DMA бере старе / пише повз кеш</tspan></text>
<text x="540.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ДОБРЕ</text>
<rect x="400.0" y="75.0" width="280.0" height="200.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2.0"/><text x="540.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Internal SRAM</tspan><tspan x="540.0" dy="15.6">(DMA-придатна)</tspan></text>
<rect x="451.6" y="122.3" width="176.8" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">DMA_ATTR</tspan><tspan x="540.0" dy="14.3">static uint8_t buf[1024];</tspan></text>
<rect x="454.8" y="187.3" width="170.5" height="45.3" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">вирівняно по 32/64 байти</tspan><tspan x="540.0" dy="14.3">(cache-line boundary)</tspan></text>
<text x="540.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">static: час життя = весь рантайм</text>
<rect x="439.1" y="287.4" width="201.8" height="45.3" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">flush + invalidate на місці</tspan><tspan x="540.0" dy="14.3">→ DMA завжди бачить актуальне</tspan></text>
<line x1="368.0" y1="65.0" x2="368.0" y2="380.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6 4"/>
</svg>