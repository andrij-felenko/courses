<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий кадр: без DMA і з DMA + два буфери (ping-pong)</text>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама шина, той самий такт — але ядро або прикуте, або вільне</text>
<text x="100.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">БЕЗ DMA</text>
<text x="100.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">CPU</text>
<rect x="110.0" y="70.0" width="650.0" height="36.0" rx="4" fill="#fde8e8" stroke="#c0392b" stroke-width="1.8"/>
<rect x="246.3" y="72.5" width="377.4" height="31.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="435.0" dy="0.0">байт → SPI DR → чекати → байт → ... (150 КіБ без зупинки)</tspan></text>
<text x="100.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Шина</text>
<rect x="110.0" y="110.0" width="650.0" height="36.0" rx="4" fill="#fde8e8" stroke="#c0392b" stroke-width="1.2"/>
<rect x="340.4" y="112.5" width="189.3" height="31.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="435.0" dy="0.0">SPI зайнятий (дані від CPU)</tspan></text>
<rect x="840.0" y="70.0" width="90.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<rect x="849.4" y="66.5" width="71.3" height="43.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="885.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="885.0" dy="0.0">наступний</tspan><tspan x="885.0" dy="13.0">кадр</tspan></text>
<line x1="760.0" y1="88.0" x2="840.0" y2="88.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="800.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">спізнення</text>
<line x1="50.0" y1="172.0" x2="830.0" y2="172.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,4"/>
<text x="100.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">DMA + 2 буфери</text>
<text x="100.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">CPU</text>
<rect x="110.0" y="192.0" width="325.0" height="36.0" rx="4" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="152.8" y="194.5" width="239.4" height="31.0" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="272.5" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="272.5" dy="0.0">малює буфер B (фізика, анімація...)</tspan></text>
<line x1="435.0" y1="186.0" x2="435.0" y2="278.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="435.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">обмін A↔B</text>
<rect x="435.0" y="192.0" width="325.0" height="36.0" rx="4" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="493.4" y="194.5" width="208.1" height="31.0" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="597.5" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="597.5" dy="0.0">малює буфер A (наступний кадр)</tspan></text>
<text x="100.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">DMA/Шина</text>
<rect x="110.0" y="232.0" width="325.0" height="36.0" rx="4" fill="#e8eefb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="193.5" y="234.5" width="157.9" height="31.0" rx="6" fill="#e8eefb" stroke="#2457d6" stroke-width="1.5"/><text x="272.5" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="272.5" dy="0.0">DMA жене буфер A → SPI</tspan></text>
<rect x="435.0" y="232.0" width="325.0" height="36.0" rx="4" fill="#e8eefb" stroke="#2457d6" stroke-width="1.8"/>
<rect x="518.5" y="234.5" width="157.9" height="31.0" rx="6" fill="#e8eefb" stroke="#2457d6" stroke-width="1.5"/><text x="597.5" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="597.5" dy="0.0">DMA жене буфер B → SPI</tspan></text>
<rect x="760.0" y="192.0" width="60.0" height="36.0" rx="4" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.2"/>
<rect x="769.7" y="194.0" width="40.5" height="32.0" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="790.0" dy="0.0">...</tspan></text>
<rect x="110.0" y="288.0" width="180.0" height="24.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.0"/>
<rect x="127.3" y="285.0" width="145.4" height="30.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="303.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="200.0" dy="0.0">ядро прикуте / зайняте</tspan></text>
<rect x="310.0" y="288.0" width="180.0" height="24.0" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="318.8" y="285.0" width="162.5" height="30.0" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="303.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="400.0" dy="0.0">паралельна корисна робота</tspan></text>
<rect x="510.0" y="288.0" width="140.0" height="24.0" rx="6" fill="#e8eefb" stroke="#2457d6" stroke-width="1.0"/>
<rect x="533.0" y="285.0" width="94.1" height="30.0" rx="6" fill="#e8eefb" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="303.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="580.0" dy="0.0">DMA жене шину</tspan></text>
