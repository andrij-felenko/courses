<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.12.5i.1. Анатомія атаки Rubber Ducky</text>
<rect x="22.5" y="118.0" width="155.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="100.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Виглядає</tspan><tspan x="100.0" dy="16.9">як флешка</tspan></text>
<text x="100.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="100.0" dy="0.0">корпус USB,</tspan><tspan x="100.0" dy="13.0">ніяких підозр</tspan></text>
<rect x="222.5" y="118.0" width="155.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="300.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Енумерація</tspan><tspan x="300.0" dy="16.9">HID-keyboard</tspan></text>
<text x="300.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="300.0" dy="0.0">VID/PID + дескриптор;</tspan><tspan x="300.0" dy="13.0">ОС ставить класовий</tspan><tspan x="300.0" dy="13.0">драйвер без дозволу</tspan></text>
<rect x="452.5" y="126.5" width="155.0" height="33.0" rx="6" fill="#fff3e0" stroke="#c8700a" stroke-width="2.0"/><text x="530.0" y="147.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Потік HID-звітів</tspan></text>
<text x="530.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">payload/DuckyScript;</tspan><tspan x="530.0" dy="13.0">~1000+ символів/с;</tspan><tspan x="530.0" dy="13.0">DELAY між кроками</tspan></text>
<rect x="682.5" y="118.0" width="155.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="760.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Команда</tspan><tspan x="760.0" dy="16.9">виконана</tspan></text>
<text x="760.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="760.0" dy="0.0">консоль відкрита,</tspan><tspan x="760.0" dy="13.0">сторонній код</tspan><tspan x="760.0" dy="13.0">запущено</tspan></text>
<line x1="183.0" y1="143.0" x2="218.0" y2="143.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="387.0" y1="143.0" x2="440.0" y2="143.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="622.0" y1="143.0" x2="680.0" y2="143.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="300.0" y1="121.0" x2="300.0" y2="68.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,3"/>
<rect x="224.0" y="34.3" width="151.9" height="39.3" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.6"/><text x="300.0" y="50.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Довіра без питання:</tspan><tspan x="300.0" dy="14.3">драйвер HID уже є в ОС</tspan></text>
<text x="440.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Хост не може відрізнити цей потік від живих пальців — уся атака в тому, що клавіатурі довіряють за замовчуванням.</text>
</svg>