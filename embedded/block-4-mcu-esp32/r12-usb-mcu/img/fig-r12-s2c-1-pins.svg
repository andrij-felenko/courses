<rect x="182.9" y="13.0" width="554.2" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="32.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Type-C очима прошивача: де тут дані, де виявлення, де живлення</tspan></text>
