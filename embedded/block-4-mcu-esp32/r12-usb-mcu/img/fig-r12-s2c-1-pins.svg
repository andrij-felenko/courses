<rect x="247.3" y="448.0" width="125.4" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="466.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">4 пари (USB 3.x)</tspan></text>
<line x1="380.0" y1="462.0" x2="515.0" y2="462.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="422.6" width="260.0" height="78.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="442.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ШВИДКІ ПАРИ</tspan><tspan x="660.0" dy="15.6">USB 3.x / alt-mode;</tspan><tspan x="660.0" dy="15.6">NOT our lane (ESP32</tspan><tspan x="660.0" dy="15.6">не використовує)</tspan></text>
<rect x="104.0" y="476.0" width="711.9" height="32.0" rx="6" fill="#fffbe6" stroke="#e67e22" stroke-width="1.5"/><text x="460.0" y="496.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Для USB-device на ESP32 реально потрібні:  VBUS · GND · D+ · D−  плюс Rd 5.1 кОм на CC1 і CC2</tspan></text>
