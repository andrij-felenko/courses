<line x1="380.0" y1="147.0" x2="515.0" y2="147.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="115.4" width="260.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ЖИВЛЕННЯ</tspan><tspan x="660.0" dy="15.6">симетричне — поворот</tspan><tspan x="660.0" dy="15.6">не має значення</tspan></text>
