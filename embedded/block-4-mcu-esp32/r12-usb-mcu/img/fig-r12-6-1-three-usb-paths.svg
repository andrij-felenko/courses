<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рис. 4.12.6.1. Три способи мати USB на ESP32 і що кожен дає</text>
<rect x="18.0" y="70.0" width="784.0" height="100.0" rx="10" fill="#fef9ec" stroke="#e67e22" stroke-width="2.0"/>
<text x="24.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="start" font-weight="700">1. Зовнішній UART-міст</text>
<text x="24.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Класичний ESP32
будь-який варіант</text>
<rect x="198.0" y="108.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/><text x="250.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ESP32</tspan></text>
<text x="370.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">→ UART →</text>
<rect x="438.0" y="108.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/><text x="490.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">CP210x / CH340</tspan></text>
<text x="610.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">→ USB →</text>
<rect x="678.0" y="108.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/><text x="730.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">USB-CDC</tspan></text>
<text x="796.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="end"><tspan x="796.0" dy="0.0">Просто й дешево</tspan><tspan x="796.0" dy="14.3">Але: лише Serial, не справжній USB</tspan></text>
<rect x="18.0" y="178.0" width="784.0" height="100.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="24.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">2. Нативний USB-OTG</text>
<text x="24.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ESP32-S2 / S3</text>
<rect x="198.0" y="216.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ESP32-S2/S3</tspan></text>
<text x="370.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">→ USB FS PHY →</text>
<rect x="438.0" y="216.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">USB роз'єм</tspan></text>
<text x="796.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end"><tspan x="796.0" dy="0.0">Справжній USB 2.0 FS</tspan><tspan x="796.0" dy="14.3">CDC / HID / MSC / host</tspan></text>
<rect x="18.0" y="286.0" width="784.0" height="100.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="24.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">3. USB-Serial-JTAG</text>
<text x="24.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">S3, C3, C6 (вбудований)</text>
<rect x="198.0" y="324.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ESP32-S3/C3/C6</tspan></text>
<text x="370.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">→ USB-Serial-JTAG →</text>
<rect x="438.0" y="324.0" width="104.0" height="34.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="344.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">CDC + JTAG</tspan></text>
<text x="796.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end"><tspan x="796.0" dy="0.0">З коробки: прошивка + лог</tspan><tspan x="796.0" dy="14.3">Фіксована функція</tspan></text>
<rect x="139.6" y="402.0" width="540.8" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Класичний ESP32 не має свого USB — лише через зовнішній міст (→§4.2.5)</tspan></text>
</svg>