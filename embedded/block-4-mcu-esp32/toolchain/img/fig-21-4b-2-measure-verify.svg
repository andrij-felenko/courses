<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисципліна стиснення — петля, а не один прапорець</text>
<text x="400.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">один важіль → міряй → перевір на залізі → тоді наступний</text>
<rect x="326.0" y="117.2" width="148.0" height="45.6" rx="6" fill="#fff8e6" stroke="#caa24a" stroke-width="2.0"/><text x="400.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6a14" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">увімкни</tspan><tspan x="400.0" dy="15.6">ОДИН важіль</tspan></text>
<rect x="526.0" y="257.2" width="148.0" height="45.6" rx="6" fill="#f4f6f8" stroke="#555555" stroke-width="2.0"/><text x="600.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">глянь у size/map:</tspan><tspan x="600.0" dy="15.6">скільки і де</tspan></text>
<rect x="326.0" y="381.6" width="148.0" height="76.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="400.0" y="400.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a6b30" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">залий і перевір</tspan><tspan x="400.0" dy="15.6">на залізі,</tspan><tspan x="400.0" dy="15.6">пристрій робить</tspan><tspan x="400.0" dy="15.6">те саме?</tspan></text>
<rect x="126.0" y="257.2" width="148.0" height="45.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="200.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a6b30" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">✓ наступний</tspan><tspan x="200.0" dy="15.6">важіль</tspan></text>
<line x1="464.3" y1="185.0" x2="535.7" y2="235.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="535.7" y1="325.0" x2="464.3" y2="375.0" stroke="#555555" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="335.7" y1="375.0" x2="264.3" y2="325.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="264.3" y1="235.0" x2="335.7" y2="185.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="478.0" y1="420.0" x2="568.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="595.0" y="377.9" width="110.0" height="84.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="650.0" y="395.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">зламалось!</tspan><tspan x="650.0" dy="14.3">винуватець</tspan><tspan x="650.0" dy="14.3">очевидний —</tspan><tspan x="650.0" dy="14.3">це останній</tspan><tspan x="650.0" dy="14.3">важіль</tspan></text>
<text x="400.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Мета: не найменший образ, а найменший образ, що досі ПРАЦЮЄ.</text>
</svg>