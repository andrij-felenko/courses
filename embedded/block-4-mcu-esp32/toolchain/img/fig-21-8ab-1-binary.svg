<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Текстовий друк vs бінарне логування</text>
<text x="460.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">де відбувається форматування і скільки байтів іде в дріт</text>
<text x="18.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Текстовий</text>
<text x="18.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">друк</text>
<text x="18.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Бінарний</text>
<text x="18.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">лог</text>
<line x1="100.0" y1="190.0" x2="900.0" y2="190.0" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="105.0" y="55.6" width="230.0" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="220.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ЧІП</tspan><tspan x="220.0" dy="15.6">Flash: рядок-шаблон</tspan><tspan x="220.0" dy="15.6">&quot;temp=%d mV…&quot; (25+ байтів)</tspan><tspan x="220.0" dy="15.6">→ printf форматує int→ASCII</tspan></text>
<text x="220.0" y="29.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">⚙ форматування на чипі</text>
<line x1="345.0" y1="95.0" x2="680.0" y2="95.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="512.5" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">UART</text>
<text x="512.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">~25 байтів тексту</text>
<text x="512.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(готовий рядок — повільно!)</text>
<rect x="695.0" y="55.6" width="200.0" height="78.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="795.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">ПК</tspan><tspan x="795.0" dy="15.6">Монітор:</tspan><tspan x="795.0" dy="15.6">temp=2350 mV</tspan><tspan x="795.0" dy="15.6">(текст готовий)</tspan></text>
<rect x="105.0" y="245.6" width="230.0" height="78.8" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="2.0"/><text x="220.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ЧІП</tspan><tspan x="220.0" dy="15.6">Flash: лише ID = 1</tspan><tspan x="220.0" dy="15.6">(1–2 байти замість рядка)</tspan><tspan x="220.0" dy="15.6">→ шле сирі байти арг.</tspan></text>
<text x="220.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Flash зберігає лише ID</text>
<line x1="345.0" y1="285.0" x2="680.0" y2="285.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="512.5" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">UART</text>
<text x="512.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">~6 байтів (×4 менше!)</text>
<text x="512.5" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">[0x7E · ID · arg0 · arg1]</text>
<rect x="695.0" y="245.6" width="200.0" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="795.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">ПК</tspan><tspan x="795.0" dy="15.6">Декодер + .elf:</tspan><tspan x="795.0" dy="15.6">→ знаходить шаблон за ID</tspan><tspan x="795.0" dy="15.6">→ temp=2350 mV</tspan></text>
<text x="795.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">⚙ форматування на ПК</text>
<text x="460.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Бінарний лог: форматування переїхало з чипа на ПК — чіп шле жменю байтів, а не готовий текст</text>
</svg>