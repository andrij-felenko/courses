<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Serial: розкидати «крихти» й читати їх у моніторі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найпростіше — і найуживаніше — відлагодження на МК</text>
<rect x="40.0" y="100.0" width="360.0" height="226.0" rx="10" fill="#0f1b14" stroke="#0a120d" stroke-width="1.5"/>
<text x="60.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8fcf9f" text-anchor="start" font-weight="bold" font-style="normal">ваш код</text>
<text x="58.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">void loop() {</text>
<text x="58.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">  x = read();</text>
<text x="58.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="start" font-weight="normal" font-style="normal">  Serial.println(x);</text>
<text x="58.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="start" font-weight="normal" font-style="normal">  if (err) Serial.println("err!");</text>
<text x="58.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#cfe0d6" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<line x1="404.0" y1="213.0" x2="470.0" y2="213.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="437.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дріт</text>
<rect x="480.0" y="100.0" width="380.0" height="226.0" rx="10" fill="#101418" stroke="#000000" stroke-width="1.5"/>
<text x="500.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7fa6bf" text-anchor="start" font-weight="bold" font-style="normal">монітор порту (ПК)</text>
<text x="500.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; x = 512</text>
<text x="500.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; x = 530</text>
<text x="500.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; x = 0</text>
<text x="500.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; err!</text>
<text x="500.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; x = 0</text>
<text x="500.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">&gt; err!</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Без заліза, всюди — та сповільнює й показує лише те, що ви надрукували.</text>
