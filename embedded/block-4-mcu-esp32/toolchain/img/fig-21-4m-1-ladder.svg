<svg xmlns="http://www.w3.org/2000/svg" width="920" height="396" viewBox="0 0 920 396">
<rect width="920" height="396" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Драбина контрольних сум: від байтової суми до хешу</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що довша сума — то надійніше ловить псування, але й дорожче рахувати</text>
<rect x="60.0" y="90.0" width="800.0" height="86.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="84.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Байтова сума</text>
<text x="84.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">8 біт</text>
<text x="280.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">додай усі байти mod 256</text>
<text x="280.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дешево, та слабко (дві помилки гасяться)</text>
<rect x="640.0" y="112.0" width="200.0" height="42.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.4"/>
<text x="740.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сила виявлення:</text>
<text x="740.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">~1 з 256 промах</text>
<rect x="60.0" y="190.0" width="800.0" height="86.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="84.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CRC</text>
<text x="84.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">16/32 біт</text>
<text x="280.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поліноміальний залишок</text>
<text x="280.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ловить пакетні помилки, дешево апаратно</text>
<rect x="640.0" y="212.0" width="200.0" height="42.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="740.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сила виявлення:</text>
<text x="740.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">~1 з 4 млрд (32-біт)</text>
<rect x="60.0" y="290.0" width="800.0" height="86.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="84.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Криптохеш MD5/SHA</text>
<text x="84.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">128/256 біт</text>
<text x="280.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">будь-яка зміна → інший хеш</text>
<text x="280.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перевірка образу й безпека</text>
<rect x="640.0" y="312.0" width="200.0" height="42.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="740.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сила виявлення:</text>
<text x="740.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">зіткнення майже неможливе</text>
</svg>
