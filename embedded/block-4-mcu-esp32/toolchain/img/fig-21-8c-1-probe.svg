<text x="460.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спинити ядро · крок за кроком · точки зупину · читати/писати регістри й пам'ять · прошити</text>
