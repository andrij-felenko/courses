<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Компілятор: серце перекладу — три справи заразом</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чистий текст → асемблер для цільового ядра</text>
<rect x="40.0" y="168.0" width="160.0" height="76.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="120.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8fcf9f" text-anchor="middle" font-weight="bold" font-style="normal">чистий текст</text>
<text x="120.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(від препроцесора)</text>
<rect x="280.0" y="108.0" width="300.0" height="204.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2.4"/>
<text x="430.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">Компілятор</text>
<rect x="298.0" y="158.0" width="264.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="310.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1. Розбирає</text>
<text x="310.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">граматика, типи → ПОМИЛКИ</text>
<rect x="298.0" y="208.0" width="264.0" height="42.0" rx="6" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="310.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. Породжує</text>
<text x="310.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">команди цільового ядра</text>
<rect x="298.0" y="258.0" width="264.0" height="42.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="310.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">3. Оптимізує</text>
<text x="310.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">коротше / швидше</text>
<line x1="204.0" y1="206.0" x2="278.0" y2="206.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
