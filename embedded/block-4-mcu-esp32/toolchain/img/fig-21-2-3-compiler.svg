<text x="760.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(мнемоніки)</text>
<line x1="582.0" y1="206.0" x2="656.0" y2="206.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Помилки компіляції» родяться на РОЗБОРІ — і це добре: видно ще до заливання.</text>
