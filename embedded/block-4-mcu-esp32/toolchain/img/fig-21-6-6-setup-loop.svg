<text x="450.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">main()  —  надає ФРЕЙМВОРК (прихований від вас)</text>
<rect x="150.0" y="150.0" width="180.0" height="64.0" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="240.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">приготування</text>
<text x="240.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(фреймворк)</text>
