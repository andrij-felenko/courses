<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Протокол прошивки: стерти → блоки з перевіркою → звірити</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розмова ПК із ROM-завантажувачем</text>
<rect x="70.0" y="100.0" width="230.0" height="140.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="185.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1. Стерти</text>
<line x1="90.0" y1="142.0" x2="280.0" y2="142.0" stroke="#c0271e" stroke-width="1.2" stroke-linecap="round"/>
<text x="185.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">флеш пишеться лише</text>
<text x="185.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">по чистому місцю</text>
<line x1="304.0" y1="170.0" x2="416.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="350.0" y="100.0" width="230.0" height="140.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="465.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2. Передати блоки</text>
<line x1="370.0" y1="142.0" x2="560.0" y2="142.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="465.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">порціями, до кожної —</text>
<text x="465.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">контрольна сума</text>
<line x1="584.0" y1="170.0" x2="696.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="630.0" y="100.0" width="230.0" height="140.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="745.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3. Звірити</text>
<line x1="650.0" y1="142.0" x2="840.0" y2="142.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="745.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чи лягло саме те,</text>
<text x="745.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що слали</text>
<rect x="160.0" y="296.0" width="600.0" height="58.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.4"/>
<text x="186.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">блок даних</text>
<rect x="560.0" y="308.0" width="184.0" height="36.0" rx="6" fill="#351313" stroke="#c0271e" stroke-width="1.4"/>
<text x="652.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#f0b0b0" text-anchor="middle" font-weight="bold" font-style="normal">контр. сума</text>
<text x="460.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дріт неідеальний — тому кожен блок перевіряють контрольною сумою.</text>
</svg>
