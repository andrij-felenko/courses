<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шари абстракції: ваш код → фреймворк → регістри → залізо</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен шар ховає складність нижчого</text>
<rect x="232.0" y="110.0" width="440.0" height="56.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="452.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ваш код</text>
<text x="452.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">digitalWrite(2, HIGH)</text>
<rect x="232.0" y="182.0" width="440.0" height="56.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="452.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Фреймворк (Arduino / ESP-IDF)</text>
<text x="452.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">перекладає виклик на регістри</text>
<rect x="232.0" y="254.0" width="440.0" height="56.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="452.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Регістри (§20.3)</text>
<text x="452.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">GPIO_OUT |= (1&lt;&lt;2)</text>
<rect x="232.0" y="326.0" width="440.0" height="56.0" rx="8" fill="#f0f0f0" stroke="#1b1b1b" stroke-width="2"/>
<text x="452.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залізо: ніжка</text>
<text x="452.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруга на виводі</text>
<line x1="452.0" y1="166.0" x2="452.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="452.0" y1="238.0" x2="452.0" y2="252.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="452.0" y1="310.0" x2="452.0" y2="324.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<line x1="232.0" y1="138.0" x2="150.0" y2="138.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<line x1="150.0" y1="138.0" x2="150.0" y2="282.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<line x1="150.0" y1="282.0" x2="230.0" y2="282.0" stroke="#c0271e" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<text x="108.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">голе</text>
<text x="108.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">залізо</text>
<text x="108.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(без шару)</text>
<text x="450.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Голе залізо = прибрати середній шар і писати в регістри самому.</text>
</svg>
