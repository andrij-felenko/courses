<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крт0 зблизька: три дії, кожна — передумова наступного</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поглиблення §4.2.6: не ритуал, а набір обов'язкових кроків</text>
<rect x="50.0" y="86.0" width="800.0" height="72.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">1. Копія .data Flash → RAM</text>
<text x="70.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ініціалізовані глобали фізично у Flash,</text>
<text x="70.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мінятись мусять у RAM</text>
<text x="780.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">Без цього:</text>
<text x="780.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">int baud = 115200  →  недосяжний/сміття</text>
<line x1="450.0" y1="158.0" x2="450.0" y2="174.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="50.0" y="174.0" width="800.0" height="72.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="70.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">2. Обнулення .bss</text>
<text x="70.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стандарт C: неінітований глобал = 0;</text>
<text x="70.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">крт0 виконує цю гарантію</text>
<text x="780.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">Без цього:</text>
<text x="780.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">int count;  →  непередбачуване сміття</text>
<line x1="450.0" y1="246.0" x2="450.0" y2="262.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="50.0" y="262.0" width="800.0" height="72.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="70.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">3. Ініціалізація вказівника стека</text>
<text x="70.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">без стека неможливий жоден виклик,</text>
<text x="70.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">навіть сам крт0 не може далі піти</text>
<text x="780.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">Без цього:</text>
<text x="780.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">будь-який виклик  →  валить машину</text>
<rect x="80.0" y="354.0" width="740.0" height="20.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1"/>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лише після всіх трьох кроків → main() / setup() може безпечно стартувати.</text>
</svg>
