<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення по I²C і два режими входу</text>
<text x="450.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">несиметричний (сигнал відносно GND) і диференційний (різниця двох точок — давить синфазний шум)</text>
<rect x="74.3" y="119.9" width="71.4" height="60.2" rx="6" fill="#eaf4fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">ESP32</tspan><tspan x="110.0" dy="18.2">МК</tspan></text>
<rect x="265.6" y="119.9" width="88.8" height="60.2" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="310.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">ADS1115</tspan><tspan x="310.0" dy="18.2">АЦП</tspan></text>
<line x1="145.7" y1="130.0" x2="265.6" y2="130.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="205.7" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SDA / SCL (спільна I²C шина, підтяжки 4.7 кОм)</text>
<line x1="145.7" y1="145.0" x2="145.7" y2="133.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="265.6" y1="133.0" x2="265.6" y2="145.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="110.0" y1="185.1" x2="110.0" y2="200.1" stroke="#333333" stroke-width="1.5"/>
<line x1="310.0" y1="185.1" x2="310.0" y2="200.1" stroke="#333333" stroke-width="1.5"/>
<line x1="110.0" y1="200.1" x2="310.0" y2="200.1" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">VDD / GND (2.0–5.5 В)</text>
<text x="310.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">ADDR → GND → адреса 0x48</text>
<line x1="300.0" y1="114.9" x2="300.0" y2="111.0" stroke="#c0392b" stroke-width="1.3"/>
<line x1="300.0" y1="111.0" x2="120.0" y2="111.0" stroke="#c0392b" stroke-width="1.3"/>
<line x1="120.0" y1="111.0" x2="120.0" y2="114.9" stroke="#c0392b" stroke-width="1.3"/>
<text x="210.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">ALERT/RDY → GPIO переривання МК</text>
<text x="685.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два режими входу:</text>
<rect x="540.0" y="96.0" width="290.0" height="120.0" rx="8" fill="#f0f8ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="685.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">(а) Несиметричний</text>
<text x="685.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">сигнал на A0, GND — земля</text>
<rect x="562.4" y="157.5" width="65.3" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Давач</tspan><tspan x="595.0" dy="13.0">(напруга)</tspan></text>
<line x1="633.0" y1="164.0" x2="690.0" y2="164.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="702.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">A0</text>
<text x="595.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GND</text>
<text x="685.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">як вбудований АЦП (§4.8.1)</text>
<rect x="540.0" y="228.0" width="290.0" height="140.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="685.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">(б) Диференційний</text>
<text x="685.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тензоміст / шунт між A0–A1</text>
<rect x="570.9" y="281.5" width="48.2" height="37.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Міст /</tspan><tspan x="595.0" dy="13.0">шунт</tspan></text>
<line x1="633.0" y1="292.0" x2="688.0" y2="285.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="633.0" y1="308.0" x2="688.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="702.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">A0 (+)</text>
<text x="702.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">A1 (−)</text>
<text x="685.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">РІЗНИЦЯ A0−A1, давить синфазний шум (r09)</text>
<rect x="30.0" y="358.0" width="840.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="450.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Засторога: вхід ≤ VDD; PGA ×16 (FSR ±0.256 В) — вужча лінійка за живлення; перевищиш — код насититься (§4.8.3).</text>
</svg>