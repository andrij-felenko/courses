<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="490.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хто насправді відкрив теорему дискретизації</text>
<text x="490.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не один геній, а ланцюг незалежних людей у різних країнах — кожен додав свою частину</text>
<rect x="40.0" y="74.0" width="900.0" height="30.0" rx="5" fill="#eef1f7" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="70.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ім'я</text>
<text x="300.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Хто і звідки</text>
<text x="640.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Рік</text>
<text x="720.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Внесок</text>
<rect x="40.0" y="110.0" width="900.0" height="44.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1"/>
<text x="70.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Е. Уіттекер</text>
<text x="300.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">британський математик</text>
<text x="640.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1915</text>
<text x="720.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ряд інтерполяції — математична основа</text>
<rect x="40.0" y="158.0" width="900.0" height="44.0" rx="5" fill="#f7f8fb" stroke="#e4e4e4" stroke-width="1"/>
<text x="70.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Г. Найквіст</text>
<text x="300.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">швед у США (Bell Labs)</text>
<text x="640.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1928</text>
<text x="720.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">гранична швидкість, «частота Найквіста»</text>
<rect x="40.0" y="206.0" width="900.0" height="44.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1"/>
<text x="70.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">К. Кюпфмюллер</text>
<text x="300.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">німецький інженер</text>
<text x="640.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1928</text>
<text x="720.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дискретизація в телеграфії, фільтр</text>
<rect x="40.0" y="254.0" width="900.0" height="44.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="70.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">В. Котельников ★</text>
<text x="300.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">радянський інженер (Казань)</text>
<text x="640.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1933</text>
<text x="720.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ПЕРША строга теорема; на Заході замовчана</text>
<rect x="40.0" y="302.0" width="900.0" height="44.0" rx="5" fill="#ffffff" stroke="#e4e4e4" stroke-width="1"/>
<text x="70.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Г. Раабе</text>
<text x="300.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">німецький інженер</text>
<text x="640.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1939</text>
<text x="720.0" y="329.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">доведення, «умова Раабе»</text>
<rect x="40.0" y="350.0" width="900.0" height="44.0" rx="5" fill="#f7f8fb" stroke="#e4e4e4" stroke-width="1"/>
<text x="70.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7a4fb0" text-anchor="start" font-weight="bold" font-style="normal">К. Шеннон</text>
<text x="300.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">американський математик</text>
<text x="640.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1948–49</text>
<text x="720.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">теорія інформації → світова слава</text>
<rect x="40.0" y="402.0" width="900.0" height="48.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="490.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Теорему відкривали НЕЗАЛЕЖНО — тому в неї стільки імен:</text>
<text x="490.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Найквіст–Шеннон, Уіттекер–Шеннон, Котельников… Це КОЛЕКТИВНИЙ здобуток, а не одна нація.</text>
</svg>
