<text x="480.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожен крок — окремий інструмент зі своєю вузькою роботою; разом вони і є тулчейн.</text>
<text x="480.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Стадії розберемо детально в §21.2–§21.3.</text>
