<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720">
<rect width="940" height="720" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: чи може машина програмувати сама себе?</text>
<text x="470.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від програмування числами до компілятора (сірим — зміст Розділу 21)</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="692.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1940-ві</text>
<text x="276.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Програмування числами / Mark I · ENIAC</text>
<text x="276.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Людина вручну пише стовпці машинних кодів. Чи може машина програмувати себе?</text>
<circle cx="250.0" cy="210.7" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="215.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1944</text>
<text x="276.0" y="207.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Грейс Гоппер → Mark I</text>
<text x="276.0" y="227.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Одна з перших програмісток велетня. Це МУСИТЬ бути простіше!</text>
<circle cx="250.0" cy="301.3" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="306.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1947</text>
<text x="276.0" y="298.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Метелик у реле (Mark II)</text>
<text x="276.0" y="318.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Перший буквальний «баг» → народження «дебагу»</text>
<circle cx="250.0" cy="392.0" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1951</text>
<text x="276.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Зухвала ідея</text>
<text x="276.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Хай МАШИНА перекладає людський запис у код. «Не вірю» — кажуть скептики</text>
<circle cx="250.0" cy="482.7" r="10.0" fill="#ffffff" stroke="#c0271e" stroke-width="3"/>
<circle cx="250.0" cy="482.7" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="228.0" y="487.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1952</text>
<text x="276.0" y="479.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">A-0 — перший компілятор</text>
<text x="276.0" y="499.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Машина сама збирає програму з бібліотеки. Стіну скепсису пробито</text>
<circle cx="250.0" cy="573.3" r="7.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="578.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1959</text>
<text x="276.0" y="570.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">FLOW-MATIC → COBOL</text>
<text x="276.0" y="590.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Команди англійськими словами; техніка служить людині</text>
<rect x="242.0" y="656.0" width="16.0" height="16.0" rx="3" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="228.0" y="669.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 21</text>
<text x="276.0" y="661.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Тулчейн</text>
<text x="276.0" y="681.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Як саме код стає прошивкою?</text>
</svg>
