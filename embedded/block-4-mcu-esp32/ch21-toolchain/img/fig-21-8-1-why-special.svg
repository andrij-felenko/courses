<text x="660.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сліпа коробка — треба ЗАЗИРНУТИ</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому й потрібні особливі інструменти: Serial і апаратний налагоджувач.</text>
