<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому на МК відлагоджувати сліпо</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">код біжить не на вашій машині, а на окремому чипі</text>
<rect x="40.0" y="90.0" width="360.0" height="250.0" rx="12" fill="none" stroke="#eef6ef" stroke-width="2"/>
<text x="220.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">На ПК</text>
<text x="220.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">програма біжить на вашій же машині</text>
<text x="78.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ спинити на паузу</text>
<text x="78.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ зазирнути в будь-яку змінну</text>
<text x="78.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ пройти код по рядку</text>
<text x="220.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">видно все, як на долоні</text>
<rect x="480.0" y="90.0" width="360.0" height="250.0" rx="12" fill="none" stroke="#fbecec" stroke-width="2"/>
<text x="660.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">На МК</text>
<text x="660.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">код біжить на окремому запечатаному чипі</text>
<text x="518.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ зсередини не видно</text>
