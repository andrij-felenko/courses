<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рантайм мови: невидимий фундамент під вашим кодом</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«гола» програма стоїть на трьох шарах — і без нижніх верхній не існує</text>
<rect x="280.0" y="78.0" width="340.0" height="56.0" rx="8" fill="#eef0f5" stroke="#1b1b1b" stroke-width="2"/>
<text x="450.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВАШ КОД</text>
<text x="450.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">setup() / loop() / main()</text>
<rect x="230.0" y="146.0" width="440.0" height="56.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="450.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Стандартна бібліотека (newlib/libc)</text>
<text x="450.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">printf · malloc · memcpy · math</text>
<rect x="120.0" y="214.0" width="280.0" height="56.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="260.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ОС / glibc (ПК)</text>
<text x="260.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">системні виклики — є</text>
<rect x="510.0" y="214.0" width="280.0" height="56.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="650.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Порт/фреймворк (МК)</text>
<text x="650.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">_write · _sbrk — хтось мусить</text>
<rect x="120.0" y="282.0" width="660.0" height="44.0" rx="8" fill="#e4e4e4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Залізо (процесор, Flash, RAM, UART…)</text>
<line x1="450.0" y1="134.0" x2="450.0" y2="146.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="270.0" y1="202.0" x2="270.0" y2="214.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="650.0" y1="202.0" x2="650.0" y2="214.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="270.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">ПК: ОС дає опору</text>
<text x="650.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">МК: опору дописує порт</text>
<rect x="80.0" y="338.0" width="740.0" height="32.0" rx="8" fill="#f8f8f8" stroke="#e4e4e4" stroke-width="1"/>
<text x="450.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">На МК ОС нема — «нижній шар» мусить принести порт або фреймворк. Без нього printf мовчить.</text>
</svg>
