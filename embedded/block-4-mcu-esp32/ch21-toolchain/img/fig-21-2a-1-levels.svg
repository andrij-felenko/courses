<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рівні оптимізації: той самий сенс — різний машинний код</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">компілятор може лишити код «як написано» або переписати заради швидкості чи розміру</text>
<rect x="50.0" y="90.0" width="260.0" height="290.0" rx="12" fill="#fcfcfc" stroke="#1f47b5" stroke-width="2"/>
<text x="180.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">-O0</text>
<text x="180.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«як написано»</text>
<line x1="74.0" y1="158.0" x2="286.0" y2="158.0" stroke="#1f47b5" stroke-width="1.3" stroke-linecap="round"/>
<text x="74.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вірне, без переписувань</text>
<text x="74.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• велике й повільне</text>
<text x="74.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ЗРУЧНЕ для відлагодження</text>
<text x="74.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• сюди — коли ловиш баг</text>
<rect x="340.0" y="90.0" width="260.0" height="290.0" rx="12" fill="#fcfcfc" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">-O2</text>
<text x="470.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«швидко»</text>
<line x1="364.0" y1="158.0" x2="576.0" y2="158.0" stroke="#1f8a3b" stroke-width="1.3" stroke-linecap="round"/>
<text x="364.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• переписане заради швидкості</text>
<text x="364.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• менше й швидше</text>
<text x="364.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• важче відлагоджувати</text>
<text x="364.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• реліз, де треба темп</text>
<rect x="630.0" y="90.0" width="260.0" height="290.0" rx="12" fill="#fcfcfc" stroke="#caa24a" stroke-width="2"/>
<text x="760.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">-Os</text>
<text x="760.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«компактно»</text>
<line x1="654.0" y1="158.0" x2="866.0" y2="158.0" stroke="#caa24a" stroke-width="1.3" stroke-linecap="round"/>
<text x="654.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• заради малого розміру</text>
<text x="654.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• економить Flash</text>
<text x="654.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• важче відлагоджувати</text>
<text x="654.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• МК з тісною пам'яттю</text>
</svg>
