<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="900" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один рядок → кілька машинних команд → числа</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">компілятор робить за вас усю дрібну роботу, яку колись робили вручну</text>
<rect x="300.0" y="82.0" width="300.0" height="52.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.5"/>
<text x="450.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#eaf6ee" text-anchor="middle" font-weight="bold" font-style="normal">OUT |= (1 &lt;&lt; 2);</text>
<text x="612.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← один рядок C</text>
<line x1="450.0" y1="136.0" x2="450.0" y2="166.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="250.0" y="170.0" width="400.0" height="112.0" rx="8" fill="#13202a" stroke="#0a141b" stroke-width="1.5"/>
<text x="270.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">load  r1, [OUT]</text>
<text x="456.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#6f8fa0" text-anchor="start" font-weight="normal" font-style="normal">; прочитати</text>
<text x="270.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">or    r1, r1, 0x04</text>
<text x="456.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#6f8fa0" text-anchor="start" font-weight="normal" font-style="normal">; накласти маску 1&lt;&lt;2</text>
<text x="270.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">store [OUT], r1</text>
<text x="456.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#6f8fa0" text-anchor="start" font-weight="normal" font-style="normal">; записати назад</text>
<text x="662.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← кілька</text>
<text x="662.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">  машинних команд</text>
<line x1="450.0" y1="284.0" x2="450.0" y2="312.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="300.0" y="314.0" width="300.0" height="46.0" rx="8" fill="#101418" stroke="#000000" stroke-width="1.5"/>
<text x="450.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#7fe0a0" text-anchor="middle" font-weight="bold" font-style="normal">3A 01 ..  2B 01 04  3C 01 ..</text>
<text x="612.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← лише числа</text>
<text x="450.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">І ці числа РІЗНІ для різних ядер. Оце розгортання й є, по суті, вся компіляція.</text>
</svg>
