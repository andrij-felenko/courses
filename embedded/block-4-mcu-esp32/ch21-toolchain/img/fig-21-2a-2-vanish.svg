<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
<rect width="920" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому «зник» мій код: що робить оптимізатор</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">він переписує код, зберігаючи видиму поведінку, — і дещо просто викидає</text>
<text x="310.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">як написано</text>
<text x="650.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">що згенерував оптимізатор</text>
<text x="40.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Згортання сталих</text>
<rect x="180.0" y="116.0" width="268.0" height="44.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="194.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">x = 2 + 3;</text>
<line x1="454.0" y1="138.0" x2="512.0" y2="138.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<rect x="520.0" y="116.0" width="250.0" height="44.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="534.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">x = 5;</text>
<text x="778.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">порахував наперед</text>
<text x="40.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Мертвий код</text>
<rect x="180.0" y="176.0" width="268.0" height="44.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="194.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">int t = a*b; // не вжито</text>
<line x1="454.0" y1="198.0" x2="512.0" y2="198.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="520.0" y="176.0" width="250.0" height="44.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="534.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">(зникло)</text>
<text x="778.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ось чому «зник» код</text>
<text x="40.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Інлайн функції</text>
<rect x="180.0" y="236.0" width="268.0" height="44.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1"/>
<text x="194.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">y = sq(x);</text>
<line x1="454.0" y1="258.0" x2="512.0" y2="258.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<rect x="520.0" y="236.0" width="250.0" height="44.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="534.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">y = x*x;</text>
<text x="778.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тіло вставлено</text>
<rect x="80.0" y="312.0" width="760.0" height="80.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="460.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">⚠ Коли «оптимізація» ламає: порожній цикл-затримка зникає, а читання</text>
<text x="460.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">регістра компілятор «кешує» й не перечитує. Ліки — volatile (докладно — §4.5.5):</text>
<text x="460.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">воно каже компіляторові «це може змінитися саме — не оптимізуй».</text>
</svg>
