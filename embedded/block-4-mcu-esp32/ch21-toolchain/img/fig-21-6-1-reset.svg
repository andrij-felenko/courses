<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скидання: ядро у відомий стан, старт із вектора скидання</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чіп знає лише, ЗВІДКИ почати</text>
<rect x="50.0" y="150.0" width="150.0" height="84.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="125.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Живлення / RESET</text>
<text x="125.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стартовий постріл</text>
<line x1="202.0" y1="192.0" x2="270.0" y2="192.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="280.0" y="150.0" width="200.0" height="84.0" rx="10" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2"/>
<text x="380.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ядро</text>
<text x="380.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">примусово у відомий стан</text>
<line x1="482.0" y1="192.0" x2="550.0" y2="192.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="516.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">старт із</text>
<rect x="560.0" y="150.0" width="300.0" height="100.0" rx="10" fill="#eef3ff" stroke="#1f47b5" stroke-width="2"/>
<text x="710.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">вектор скидання</text>
<text x="710.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одна фіксована адреса —</text>
<text x="710.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">там перша сходинка</text>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе подальше — ланцюжок передавання естафети від цієї точки.</text>
