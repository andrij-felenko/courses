<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Error проти warning: та сама стадія — різна ціна</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва народжує компілятор під час розбору коду, але дія — геть різна</text>
<rect x="340.0" y="80.0" width="220.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="450.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Компілятор — стадія розбору</text>
<text x="450.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(§4.2.2: перевірка граматики і типів)</text>
<rect x="50.0" y="160.0" width="330.0" height="170.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="2.2"/>
<text x="215.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ERROR — стоп-знак</text>
<text x="215.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«Не можу зрозуміти/перекласти»</text>
<text x="215.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Збірка ЗУПИНЕНА</text>
<text x="215.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Прошивки немає</text>
<text x="215.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Приклад: забута ; або {</text>
<text x="215.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">→ неможливо дістатися чипа</text>
<rect x="520.0" y="160.0" width="330.0" height="170.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2.2"/>
<text x="685.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">WARNING — жовтий знак</text>
<text x="685.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«Зрозумів і переклав, але підозріло»</text>
<text x="685.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Збірка ПРОДОВЖУЄТЬСЯ</text>
<text x="685.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Прошивка є — але з прихованим багом</text>
<text x="685.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Приклад: = замість == у if</text>
<text x="685.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">→ тихо заливається, дивно поводиться</text>
<line x1="380.0" y1="136.0" x2="270.0" y2="160.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="520.0" y1="136.0" x2="620.0" y2="160.0" stroke="#caa24a" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="60.0" y="346.0" width="780.0" height="24.0" rx="8" fill="#f9f9f9" stroke="#e4e4e4" stroke-width="1"/>
<text x="450.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ворнінг НЕ зупиняє збірку — і тому небезпечніший: баг є, але ніщо не кричить.</text>
</svg>
