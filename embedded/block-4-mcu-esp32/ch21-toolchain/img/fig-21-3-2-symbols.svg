<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Таблиця символів: що файл визначає й що потребує</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен .o — і постачальник одних імен, і прохач інших</text>
<rect x="260.0" y="96.0" width="360.0" height="214.0" rx="10" fill="#0f1b14" stroke="#0a120d" stroke-width="1.6"/>
<text x="440.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#eaf6ee" text-anchor="middle" font-weight="bold" font-style="normal">blink.o</text>
<line x1="280.0" y1="140.0" x2="600.0" y2="140.0" stroke="#2b3540" stroke-width="1" stroke-linecap="round"/>
<text x="360.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8fcf9f" text-anchor="middle" font-weight="bold" font-style="normal">визначає (дає):</text>
<rect x="310.0" y="182.0" width="100.0" height="40.0" rx="6" fill="#13351f" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="360.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#9be8b0" text-anchor="middle" font-weight="bold" font-style="normal">blink</text>
<text x="520.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e0a0a0" text-anchor="middle" font-weight="bold" font-style="normal">потребує (кличе):</text>
<rect x="456.0" y="182.0" width="124.0" height="40.0" rx="6" fill="#351313" stroke="#c0271e" stroke-width="1.4"/>
<text x="518.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#f0b0b0" text-anchor="middle" font-weight="bold" font-style="normal">digitalWrite</text>
<text x="518.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e0a0a0" text-anchor="middle" font-weight="bold" font-style="normal">↑ це «дірка»:</text>
<text x="518.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коду нема, лише виклик</text>
<text x="440.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лінкер мусить знайти, ХТО дасть кожне «потребує».</text>
</svg>
