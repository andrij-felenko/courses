<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<rect width="900" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один фрагмент крізь три стадії — у чотирьох формах</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один крок конвеєра — одне перетворення форми</text>
<text x="70.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. вихідний код (з директивою)</text>
<rect x="60.0" y="92.0" width="780.0" height="56.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">#define LED_PIN 2   ·   GPIO_OUT |= (1 &lt;&lt; LED_PIN);</text>
<line x1="450.0" y1="152.0" x2="450.0" y2="188.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="560.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">препроцесор ↓</text>
<text x="70.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. після препроцесора</text>
<rect x="60.0" y="200.0" width="780.0" height="56.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#eaf6ee" text-anchor="start" font-weight="bold" font-style="normal">GPIO_OUT |= (1 &lt;&lt; 2);     // «#» зникли, текст підставлено</text>
<line x1="450.0" y1="260.0" x2="450.0" y2="296.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="560.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">компілятор ↓</text>
<text x="70.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. після компілятора (асемблер)</text>
<rect x="60.0" y="308.0" width="780.0" height="56.0" rx="8" fill="#13202a" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">load r1,[GPIO_OUT]  ·  or r1,r1,0x04  ·  store [GPIO_OUT],r1</text>
<line x1="450.0" y1="368.0" x2="450.0" y2="404.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="560.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">асемблер ↓</text>
<text x="70.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">4. після асемблера (числа)</text>
<rect x="60.0" y="416.0" width="780.0" height="56.0" rx="8" fill="#101418" stroke="#0a120d" stroke-width="1.4"/>
<text x="78.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7fe0a0" text-anchor="start" font-weight="bold" font-style="normal">3A 01 7C    2B 01 04    3C 01 7C</text>
</svg>
