<text x="460.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ініціалізована змінна має «склад» у Flash і «дім» у RAM; нульова — лише дім.</text>
