<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Його екранують: 0xC0 → 0xDB 0xDC (а сам 0xDB → 0xDB 0xDD).</text>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Так межу кадру не сплутати з даними — простий і надійний прийом.</text>
