<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Фреймворк за замовчуванням, голе залізо — точково</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і це не «або-або» — їх змішують</text>
<rect x="40.0" y="92.0" width="500.0" height="268.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="290.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Фреймворк — за замовчуванням</text>
<text x="290.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">швидко · надійно · переносно</text>
<text x="290.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 99 % коду</text>
<rect x="110.0" y="206.0" width="360.0" height="134.0" rx="10" fill="#fdeded" stroke="#c0271e" stroke-width="2"/>
<text x="290.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Голе залізо — точково</text>
<text x="150.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• гранична швидкість (гарячий цикл)</text>
<text x="150.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тонкий контроль (нема в обгортці)</text>
<text x="150.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• мінімальний розмір</text>
<text x="150.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• зрозуміти / відлагодити</text>
<rect x="570.0" y="138.0" width="300.0" height="184.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="720.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Не «або-або»:</text>
<text x="720.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">здебільшого фреймворк,</text>
<text x="720.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а в гарячих місцях —</text>
<text x="720.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">прямий доступ до регістрів.</text>
<text x="720.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Так роблять і профі.</text>
</svg>
