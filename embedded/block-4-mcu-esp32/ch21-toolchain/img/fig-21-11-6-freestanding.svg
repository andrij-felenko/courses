<text x="450.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий C-код — два різних фундаменти. МК: усе, що між мовою й залізом, — ваша відповідальність.</text>
