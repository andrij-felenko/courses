<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Симуляція периферії: підмінити залізо мок-об'єктом</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">мок повертає сценарні відповіді — навіть ті дивні, що в реалі важко відтворити</text>
<rect x="60.0" y="170.0" width="230.0" height="96.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="175.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Код під тестом</text>
<text x="175.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">драйвер / логіка</text>
<text x="175.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">питає «дай вимір»</text>
<text x="175.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">він НЕ бачить різниці →</text>
<line x1="290.0" y1="200.0" x2="400.0" y2="160.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="290.0" y1="236.0" x2="400.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="400.0" y="124.0" width="230.0" height="72.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="515.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Справжній давач</text>
<text x="515.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">потрібен чіп і залізо</text>
<text x="515.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у реальному пристрої</text>
<rect x="400.0" y="268.0" width="440.0" height="96.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="620.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">МОК давача (у тесті)</text>
<text x="620.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сценарій: 25°C → 0°C → −999 (помилка) → таймаут</text>
<text x="620.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повертає що скажеш — і перевіряє, як код реагує на кожен</text>
</svg>
