<text x="115.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПК</text>
<text x="115.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">образ .bin</text>
<line x1="192.0" y1="185.0" x2="250.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="221.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">USB</text>
<rect x="252.0" y="140.0" width="180.0" height="90.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="342.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перетворювач</text>
<text x="342.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">USB ↔ UART</text>
<line x1="434.0" y1="185.0" x2="492.0" y2="185.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
