<rect x="494.0" y="134.0" width="210.0" height="102.0" rx="10" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2"/>
<text x="599.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мікроконтролер</text>
<rect x="510.0" y="176.0" width="178.0" height="50.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="599.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Flash (сюди ляже образ)</text>
<rect x="120.0" y="300.0" width="680.0" height="46.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Новіші чипи (S3, C3…) мають ВЛАСНИЙ USB — перетворювач зайвий,</text>
<text x="460.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і чіп під'єднується до ПК прямо.</text>
</svg>
