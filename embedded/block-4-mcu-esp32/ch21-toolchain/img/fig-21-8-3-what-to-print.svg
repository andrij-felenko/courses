<rect x="320.0" y="96.0" width="270.0" height="234.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="455.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Маркери проходження</text>
<line x1="340.0" y1="136.0" x2="570.0" y2="136.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
