<text x="455.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7fe0a0" text-anchor="middle" font-weight="bold" font-style="normal">println("тут");</text>
<text x="455.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">останній = місце зависання</text>
<rect x="600.0" y="96.0" width="270.0" height="234.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="735.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Помилки</text>
