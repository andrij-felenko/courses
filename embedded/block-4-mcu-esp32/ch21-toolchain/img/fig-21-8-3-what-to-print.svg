<text x="175.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перевірити припущення</text>
<rect x="64.0" y="178.0" width="222.0" height="38.0" rx="6" fill="#0f1b14" stroke="#0a120d" stroke-width="1.2"/>
