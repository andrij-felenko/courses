<rect x="533.3" y="262.0" width="82.0" height="110.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="574.3" y="309.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="574.3" dy="0.0">Шар 2</tspan><tspan x="574.3" dy="10.4">моки</tspan><tspan x="574.3" dy="10.4">(хост + mock-функції)</tspan></text>
<rect x="628.7" y="232.0" width="82.0" height="140.0" rx="6" fill="#fff6e0" stroke="#c0392b" stroke-width="2.5"/><text x="669.7" y="294.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="669.7" dy="0.0">Емулятор</tspan><tspan x="669.7" dy="10.4">(той самий .elf</tspan><tspan x="669.7" dy="10.4">на підробленому чипі)</tspan></text>
<rect x="724.0" y="202.0" width="82.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="765.0" y="279.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Шар 3</tspan><tspan x="765.0" dy="10.4">залізо</tspan><tspan x="765.0" dy="10.4">(реальний чіп)</tspan></text>
<text x="622.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">↕ пропущена</text>
<text x="622.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">сходинка</text>
