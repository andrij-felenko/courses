<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="215.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек емулятора</text>
<rect x="80.7" y="319.1" width="268.5" height="53.9" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="2.0"/><text x="215.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">ядро CPU</tspan><tspan x="215.0" dy="16.9">(виконує машинні інструкції .elf)</tspan></text>
<rect x="88.1" y="233.1" width="253.7" height="53.9" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="2.0"/><text x="215.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">карта пам'яті</tspan><tspan x="215.0" dy="16.9">(масив = Flash/RAM за адресами)</tspan></text>
<rect x="91.9" y="138.6" width="246.3" height="70.8" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="2.0"/><text x="215.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">модель периферії</tspan><tspan x="215.0" dy="16.9">(перехоплює записи в регістри:</tspan><tspan x="215.0" dy="16.9">UART / ADC / GPIO)</tspan></text>
<line x1="215.0" y1="308.0" x2="215.0" y2="298.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="222.0" x2="215.0" y2="212.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="88.0" x2="215.0" y2="136.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="118.1" y="60.0" width="193.8" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="215.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">той самий .elf, що й у чіп</tspan></text>
<text x="215.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">прошивка виконується на ПІДРОБЛЕНИХ регістрах — рівень нижче, ніж мок-функція</text>
<line x1="420.0" y1="18.0" x2="420.0" y2="410.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="620.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місце на піраміді тестів</text>
<text x="440.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">швидше / масштабованіше →</text>
<text x="804.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">← точніше / ближче до заліза</text>
<line x1="806.0" y1="372.0" x2="438.0" y2="372.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
