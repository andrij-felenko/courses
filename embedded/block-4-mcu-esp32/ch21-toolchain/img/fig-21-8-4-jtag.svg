<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">JTAG/SWD: зонд дотягується всередину живого чипа</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">робить чіп прозорим, як на ПК</text>
<rect x="40.0" y="158.0" width="130.0" height="84.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="105.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ПК + зонд</text>
<text x="105.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(JTAG/SWD)</text>
<line x1="172.0" y1="200.0" x2="250.0" y2="200.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="211.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відлагодж.</text>
<text x="211.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ніжки</text>
<rect x="260.0" y="108.0" width="420.0" height="204.0" rx="12" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="470.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">живий чіп — тепер прозорий</text>
<rect x="285.0" y="150.0" width="370.0" height="30.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спинити (halt)</text>
<rect x="285.0" y="187.0" width="370.0" height="30.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пройти по рядку (step)</text>
<rect x="285.0" y="224.0" width="370.0" height="30.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зазирнути в змінну / регістр</text>
<rect x="285.0" y="261.0" width="370.0" height="30.0" rx="6" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">точка зупину / сторожок на дані</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ESP32 має JTAG на борту (у S3/C3/C6 — навіть через USB).</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Сила велика, та й ціна: зайве залізо й налаштування.</text>
</svg>
