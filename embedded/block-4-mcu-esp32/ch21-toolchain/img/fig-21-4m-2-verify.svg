</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перевірка після прошивки: сума надісланого = сумі в чипі?</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">однакові суми → майже напевно той самий образ; різні → щось зіпсувалося</text>
<rect x="70.0" y="108.0" width="230.0" height="70.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="185.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Надісланий образ</text>
<text x="185.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рахуємо суму A</text>
<rect x="70.0" y="228.0" width="230.0" height="70.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="185.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Образ у Flash (читаємо)</text>
<text x="185.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рахуємо суму B</text>
<line x1="300.0" y1="143.0" x2="408.0" y2="188.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="300.0" y1="263.0" x2="408.0" y2="210.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="408.0" y="168.0" width="150.0" height="62.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="483.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A = B ?</text>
<text x="483.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">порівняти</text>
<line x1="558.0" y1="184.0" x2="648.0" y2="160.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="700.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">збіглося → цілий ✓</text>
<line x1="558.0" y1="214.0" x2="648.0" y2="244.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="700.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">різні → зіпсовано ✗</text>
<rect x="110.0" y="308.0" width="680.0" height="76.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лавина (для хешу): зміниш ОДИН біт у вході —</text>
<text x="450.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і весь хеш стане геть інший, тож навіть крихітне псування видно одразу:</text>
<text x="450.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">a4f3…91  →  b8c0…2e   (один біт різниці у вході)</text>
