<text x="566.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">↑ підтяжка</text>
<line x1="470.0" y1="262.0" x2="560.0" y2="262.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
