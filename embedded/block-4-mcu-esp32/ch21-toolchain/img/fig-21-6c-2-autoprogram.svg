<text x="566.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">↑ підтяжка</text>
<rect x="60.0" y="330.0" width="400.0" height="58.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="260.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DTR = RTS → обидва закриті → EN та IO0 вільні.</text>
<text x="260.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Відкрив порт (обидві разом) — чіп НЕ скидається випадково.</text>
<text x="700.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Послідовність прошивки (рівні ліній):</text>
<text x="556.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">крок</text>
<text x="596.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">DTR</text>
<text x="632.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">RTS</text>
<text x="740.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">наслідок</text>
<text x="556.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1</text>
<text x="596.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="632.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="672.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">EN=0 — у скиданні</text>
<text x="556.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2</text>
<text x="596.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="632.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="672.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">IO0=0, EN↑ → завантажувач</text>
<text x="556.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">3</text>
<text x="596.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="632.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="672.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">нічого — нормальний хід</text>
