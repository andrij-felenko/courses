<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Схема авто-прошивки: два транзистори на DTR/RTS</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">хитрість у перехресті — транзистор спрацьовує, лише коли DTR і RTS РІЗНІ</text>
<text x="64.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">DTR</text>
<line x1="104.0" y1="146.0" x2="300.0" y2="146.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="64.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">RTS</text>
<line x1="104.0" y1="246.0" x2="300.0" y2="246.0" stroke="#1f47b5" stroke-width="2.4" stroke-linecap="round"/>
<rect x="300.0" y="108.0" width="170.0" height="92.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="385.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Q1 → EN</text>
<text x="385.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">база ← RTS</text>
<text x="385.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">емітер ← DTR</text>
<text x="385.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вмикає, коли RTS &gt; DTR</text>
<rect x="300.0" y="218.0" width="170.0" height="92.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="385.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Q2 → IO0</text>
<text x="385.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">база ← DTR</text>
<text x="385.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">емітер ← RTS</text>
<text x="385.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вмикає, коли DTR &gt; RTS</text>
<line x1="470.0" y1="150.0" x2="560.0" y2="150.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
