<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
<rect width="920" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Піраміда тестів прошивки: багато швидких, мало повільних</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">основа — дешеві тести логіки на ПК; вершина — нечисленні дорогі тести на залізі</text>
<polygon points="460.0,94.0 366.9,194.0 553.1,194.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<polygon points="366.9,194.0 553.1,194.0 642.5,290.0 277.5,290.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<polygon points="277.5,290.0 642.5,290.0 730.0,384.0 190.0,384.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="460.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Тест на залізі</text>
<text x="460.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мало · повільно · найреальніше</text>
<text x="460.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Симуляція периферії (моки)</text>
<text x="460.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">підроблене залізо · середньо</text>
<text x="460.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Юніт-тести на хості</text>
<text x="460.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">багато · швидко (секунди) · на ПК</text>
<rect x="150.0" y="404.0" width="620.0" height="28.0" rx="8" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1"/>
<text x="460.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пиши багато дешевих тестів логіки — і лише найпотрібніше перевіряй на залізі.</text>
</svg>
