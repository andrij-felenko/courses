  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Анатомія правильного обробника</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чотири ознаки доброго ISR — короткий, у RAM, через volatile, без «важкого»</text>
<rect x="120.0" y="100.0" width="700.0" height="130.0" rx="10" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="150" y="134" font-family="Consolas, monospace" font-size="15.5" fill="#e8e8e8" font-weight="bold">volatile bool flag = false;<tspan fill="#caa24a">   // 1</tspan></text>
<text x="150" y="162" font-family="Consolas, monospace" font-size="15.5" fill="#e8e8e8" font-weight="bold">void <tspan fill="#7fb4ff">IRAM_ATTR</tspan> onEvent() {<tspan fill="#caa24a">   // 2</tspan></text>
<text x="150" y="190" font-family="Consolas, monospace" font-size="15.5" fill="#e8e8e8" font-weight="bold">  flag = true;<tspan fill="#caa24a">             // 3</tspan></text>
<text x="150" y="218" font-family="Consolas, monospace" font-size="15.5" fill="#e8e8e8" font-weight="bold">}<tspan fill="#caa24a">                          // 4</tspan></text>
<rect x="60.0" y="256.0" width="270.0" height="96.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="195.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">1 · volatile</text>
<text x="195.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">змінну міняє ISR — компілятор</text>
<text x="195.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">не має її «оптимізувати» (§23.5)</text>
<rect x="360.0" y="256.0" width="270.0" height="96.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="495.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">2 · IRAM_ATTR</text>
<text x="495.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обробник у швидкій RAM —</text>
<text x="495.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">працює навіть коли флеш зайнятий</text>
<rect x="660.0" y="256.0" width="270.0" height="96.0" rx="10" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="795.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3 · коротке тіло</text>
<text x="795.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише прапорець; жодних</text>
<text x="795.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">delay, Serial, malloc, мережі</text>
</svg>
