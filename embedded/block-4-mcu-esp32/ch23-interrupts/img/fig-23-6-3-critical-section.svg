<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Критична секція: на мить вимкнути переривання</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки переривання вимкнені, обробник не втрутиться — дія виконується цілісно</text>
<line x1="110.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="660.0" y1="200.0" x2="880.0" y2="200.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<rect x="300.0" y="170.0" width="360.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="480.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робота зі спільними даними</text>
<text x="480.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(цілісно, без втручань)</text>
<line x1="300.0" y1="156.0" x2="300.0" y2="244.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">noInterrupts()</text>
<text x="300.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">↑ вимкнути</text>
<line x1="660.0" y1="156.0" x2="660.0" y2="244.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="660.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">interrupts()</text>
<text x="660.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">↑ увімкнути назад</text>
<circle cx="480.0" cy="110.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="480.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">↯ подія прийшла тут</text>
<line x1="480.0" y1="116.0" x2="480.0" y2="170.0" stroke="#caa24a" stroke-width="1.6" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="480.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">обробник ЧЕКАЄ — поки секція не скінчиться</text>
<line x1="480.0" y1="230.0" x2="690.0" y2="230.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="720.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="start" font-weight="bold" font-style="normal">виконається тут</text>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Подія не губиться — вона лише чекає кілька тактів, поки дія завершиться неподільно.</text>
</svg>
