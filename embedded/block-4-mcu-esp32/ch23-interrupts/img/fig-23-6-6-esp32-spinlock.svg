<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
<rect width="960" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два ядра ESP32: noInterrupts мало — потрібен спінлок</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вимкнення переривань діє лише на СВОЄ ядро; інше ядро тим часом не спить</text>
<rect x="50.0" y="90.0" width="410.0" height="250.0" rx="12" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="255.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">noInterrupts() на 1 ядрі — НЕ досить</text>
<rect x="80.0" y="140.0" width="150.0" height="80.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="155.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ядро 0</text>
<text x="155.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">перерив. вимк.</text>
<rect x="280.0" y="140.0" width="150.0" height="80.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="355.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ядро 1</text>
<text x="355.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">працює собі!</text>
<rect x="150.0" y="250.0" width="210.0" height="60.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.4"/>
<text x="255.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обидва лізуть у спільні дані</text>
<text x="255.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ гонка лишилася</text>
<rect x="500.0" y="90.0" width="410.0" height="250.0" rx="12" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="705.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">portMUX-спінлок — захищає обидва</text>
<rect x="530.0" y="145.0" width="350.0" height="70.0" rx="8" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="548" y="170" font-family="Consolas, monospace" font-size="12.5" fill="#7ee0a0">portENTER_CRITICAL(&amp;mux);</text>
<text x="548" y="190" font-family="Consolas, monospace" font-size="12.5" fill="#e8e8e8">  …спільні дані…</text>
<text x="548" y="208" font-family="Consolas, monospace" font-size="12.5" fill="#7ee0a0">portEXIT_CRITICAL(&amp;mux);</text>
<text x="705.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">спінлок не пускає й друге ядро,</text>
<text x="705.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">поки секція триває</text>
<text x="705.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(в обробнику — варіант …_ISR)</text>
<text x="705.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">потрібен, коли дані ділять різні ядра</text>
<text x="480.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для звичайного коду «один loop + обробник на тім самім ядрі» досить noInterrupts().</text>
<text x="480.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Спінлок беруть, коли дані справді спільні між ядрами.</text>
</svg>
