<text x="720.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кожне джерело → свій обробник, без довгих перевірок</text>
<rect x="120.0" y="300.0" width="700.0" height="70.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="470.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так переривання стало керованим: пріоритети, маскування, кілька програм водночас.</text>
<text x="470.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Ці ідеї — маска й вектор — живуть і досі, зокрема в ESP32 (побачимо в темах розділу).</text>
</svg>
