<text x="220.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1 = переривання дозволене, 0 = замаскований (ігнорується)</text>
<text x="220.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">→ можна тимчасово «не відволікатися» на дрібниці</text>
<text x="720.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вектор: таблиця адрес обробників</text>
<rect x="540.0" y="120.0" width="200.0" height="32.0" rx="6" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="550.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">джерело 0 (таймер)</text>
<rect x="760.0" y="120.0" width="130.0" height="32.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
