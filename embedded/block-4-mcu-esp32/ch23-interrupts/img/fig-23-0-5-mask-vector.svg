<rect x="540.0" y="160.0" width="200.0" height="32.0" rx="6" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="550.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">джерело 1 (ввід)</text>
<rect x="760.0" y="160.0" width="130.0" height="32.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="770.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">→ адреса H1</text>
<rect x="540.0" y="200.0" width="200.0" height="32.0" rx="6" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="550.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">джерело 2 (помилка)</text>
<rect x="760.0" y="200.0" width="130.0" height="32.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
