<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гібрид: переривання ловить, опитування обробляє</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">найпоширеніше рішення поєднує обидва — і це той самий патерн «прапорець»</text>
<rect x="60.0" y="110.0" width="250.0" height="110.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="185.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕРИВАННЯ</text>
<text x="185.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ловить подію вмить,</text>
<text x="185.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ставить прапорець</text>
<text x="185.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(не губить, реагує миттєво)</text>
<line x1="310.0" y1="165.0" x2="420.0" y2="165.0" stroke="#caa24a" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="365.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">flag</text>
<rect x="420.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="560.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ОПИТУВАННЯ в loop()</text>
<text x="560.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у спокої перевіряє прапорець</text>
<text x="560.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і неквапом обробляє подію</text>
<text x="560.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(просто, без обмежень ISR)</text>
<rect x="730.0" y="120.0" width="160.0" height="90.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="810.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виграш:</text>
<text x="810.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">миттєвість —</text>
<text x="810.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">від переривання,</text>
<text x="810.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">простота — від loop</text>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це й є «золотий патерн» із §23.3: обробник лише відмічає, а робота діється в loop().</text>
<text x="470.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Більшість реальних проєктів — саме такі гібриди, а не «чисте» опитування чи переривання.</text>
</svg>
