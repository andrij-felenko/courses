<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що дає переривання: три виграші</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">подія сама кличе процесор — і це міняє все</text>
<rect x="60.0" y="90.0" width="240.0" height="220.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="180.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Миттєва реакція</text>
<line x1="80.0" y1="136.0" x2="280.0" y2="136.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="180.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">процесор відгукується</text>
<text x="180.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за мікросекунди після</text>
<text x="180.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">події, а не «колись потім»</text>
<rect x="340.0" y="90.0" width="240.0" height="220.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="460.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Процесор вільний</text>
<line x1="360.0" y1="136.0" x2="560.0" y2="136.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="460.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">поки події нема — ядро</text>
<text x="460.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">робить свою роботу, а не</text>
<text x="460.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">крутить порожній цикл</text>
<rect x="620.0" y="90.0" width="240.0" height="220.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="740.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Нічого не проґавиш</text>
<line x1="640.0" y1="136.0" x2="840.0" y2="136.0" stroke="#c0271e" stroke-width="1.2" stroke-linecap="round"/>
<text x="740.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">навіть коротку подію</text>
<text x="740.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">залізо зафіксує й покличе</text>
<text x="740.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обробник вчасно</text>
<text x="460.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна — складніший код: обробник треба писати обережно (про це далі в розділі).</text>
</svg>
