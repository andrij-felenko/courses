  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому кричав комп'ютер: перевантаження</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зайвий потік від радара спалив ту мить, якої бракувало, — і навантаження перейшло 100%</text>
<line x1="598.4" y1="100.0" x2="598.4" y2="176.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="598.4" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">100% часу</text>
<rect x="90.0" y="110.0" width="136.4" height="50.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="158.2" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">наведення</text>
<rect x="226.4" y="110.0" width="124.0" height="50.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="288.4" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">навігація</text>
<rect x="350.4" y="110.0" width="124.0" height="50.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="412.4" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">керування</text>
<rect x="474.4" y="110.0" width="124.0" height="50.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="536.4" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">дисплеї</text>
<rect x="598.4" y="110.0" width="111.6" height="50.0" rx="0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="654.2" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">радар (зайве!)</text>
<text x="654.2" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ за межу</text>
<rect x="150.0" y="196.0" width="600.0" height="96.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Радар зустрічі лишився в положенні, що слало AGC безперервний потік —</text>
<text x="450.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і той з'їдав ~13% часу (за переказами), якого вже й так бракувало.</text>
<text x="450.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Виконавець не міг розкласти всі задачі → аларми 1201 / 1202</text>
<text x="450.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(«немає вільних областей» / «немає наборів» — тобто переповнення).</text>
</svg>
