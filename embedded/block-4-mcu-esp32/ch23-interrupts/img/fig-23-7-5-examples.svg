<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклади на осі «опитування ↔ переривання»</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">де лягає типова задача — підказує, який інструмент брати</text>
<line x1="90.0" y1="200.0" x2="870.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="90.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ОПИТУВАННЯ</text>
<text x="870.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">ПЕРЕРИВАННЯ</text>
<circle cx="150.0" cy="200.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="150.0" y1="200.0" x2="150.0" y2="262.0" stroke="#c0271e" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="150.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">навігація меню</text>
<circle cx="300.0" cy="200.0" r="6.0" fill="#b06a1e" stroke="#b06a1e" stroke-width="0"/>
<line x1="300.0" y1="200.0" x2="300.0" y2="186.0" stroke="#b06a1e" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="300.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">читати давач раз на 100 мс</text>
<circle cx="480.0" cy="200.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<line x1="480.0" y1="200.0" x2="480.0" y2="262.0" stroke="#caa24a" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="480.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кнопка (з усуненням дребезгу)</text>
<circle cx="660.0" cy="200.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="660.0" y1="200.0" x2="660.0" y2="186.0" stroke="#1f8a3b" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="660.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лічильник швидких імпульсів</text>
<circle cx="820.0" cy="200.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="820.0" y1="200.0" x2="820.0" y2="262.0" stroke="#1f8a3b" stroke-width="1.2" stroke-dasharray="2,2" stroke-linecap="round"/>
<text x="820.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">аварійний стоп</text>
<text x="480.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Періодичне (раз на 100 мс) найкраще робити таймером — це наступний розділ.</text>
<text x="480.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Аварійний стоп — переривання: проґавити не можна й реагувати треба вмить.</text>
</svg>
