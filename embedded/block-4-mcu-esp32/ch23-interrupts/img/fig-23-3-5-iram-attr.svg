<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо IRAM_ATTR: щоб ISR працював, коли флеш зайнятий</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">код живе у флеш-пам'яті, та вона часом недоступна — і ISR звідти впав би</text>
<rect x="50.0" y="90.0" width="410.0" height="280.0" rx="12" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="255.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Без IRAM_ATTR — ризик</text>
<rect x="90.0" y="140.0" width="150.0" height="80.0" rx="10" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="165.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">флеш-пам'ять</text>
<text x="165.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(тут лежить код)</text>
<text x="165.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ISR теж тут</text>
<rect x="300.0" y="140.0" width="120.0" height="80.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="360.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">флеш ЗАЙНЯТА</text>
<text x="360.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(запис / кеш-</text>
<text x="360.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">промах)</text>
<line x1="240.0" y1="250.0" x2="360.0" y2="250.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="255.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">прийшло переривання →</text>
<text x="255.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">код ISR недосяжний →</text>
<text x="255.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЗБІЙ (краш)</text>
<rect x="480.0" y="90.0" width="410.0" height="280.0" rx="12" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="685.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">З IRAM_ATTR — надійно</text>
<rect x="540.0" y="150.0" width="140.0" height="90.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="610.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">IRAM (ОЗП)</text>
<text x="610.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обробник тут —</text>
<text x="610.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">завжди доступний</text>
<rect x="720.0" y="150.0" width="120.0" height="90.0" rx="10" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="780.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">флеш ЗАЙНЯТА</text>
<text x="780.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— байдуже:</text>
<text x="780.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ISR не звідти</text>
<text x="685.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">void IRAM_ATTR onEvent() { … }</text>
<text x="685.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">одне слово кладе обробник у швидку RAM</text>
</svg>
