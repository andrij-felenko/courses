<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому популярні виклики небезпечні в ISR — і чим їх замінити</text>
<rect x="30.0" y="30.0" width="188.0" height="34.0" rx="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="124.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Функція</text>
<rect x="220.0" y="30.0" width="278.0" height="34.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="359.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чому небезпечна в ISR</text>
<rect x="500.0" y="30.0" width="290.0" height="34.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="645.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ISR-безпечна заміна</text>
<rect x="30.0" y="71.0" width="188.0" height="50.0" rx="4" fill="#ebebeb" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="124.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">strtok</text>
<rect x="220.0" y="71.0" width="278.0" height="50.0" rx="4" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.0"/><text x="359.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="359.0" dy="0.0">Статичний буфер:</tspan><tspan x="359.0" dy="14.3">зберігає *ptr між викликами</tspan></text>
<rect x="500.0" y="71.0" width="290.0" height="50.0" rx="4" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="645.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Парсити в loop();</tspan><tspan x="645.0" dy="14.3">або strtok_r (лише в loop)</tspan></text>
<rect x="30.0" y="127.0" width="188.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="124.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">malloc / new / String</text>
<rect x="220.0" y="127.0" width="278.0" height="50.0" rx="4" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.0"/><text x="359.0" y="148.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="359.0" dy="0.0">Замок купи (heap lock):</tspan><tspan x="359.0" dy="14.3">ISR на FreeRTOS = краш</tspan></text>
<rect x="500.0" y="127.0" width="290.0" height="50.0" rx="4" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="645.0" y="148.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Буфер фікс. розміру,</tspan><tspan x="645.0" dy="14.3">виділений у setup()</tspan></text>
<rect x="30.0" y="183.0" width="188.0" height="50.0" rx="4" fill="#ebebeb" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="124.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">printf / Serial.print</text>
<rect x="220.0" y="183.0" width="278.0" height="50.0" rx="4" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.0"/><text x="359.0" y="204.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="359.0" dy="0.0">Внутр. буфер + malloc,</tspan><tspan x="359.0" dy="14.3">до того ж повільно</tspan></text>
<rect x="500.0" y="183.0" width="290.0" height="50.0" rx="4" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="645.0" y="204.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Прапорець/черга в ISR,</tspan><tspan x="645.0" dy="14.3">друк у loop()</tspan></text>
<rect x="30.0" y="239.0" width="188.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="124.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">gmtime / localtime</text>
<rect x="220.0" y="239.0" width="278.0" height="50.0" rx="4" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.0"/><text x="359.0" y="260.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="359.0" dy="0.0">Статичний буфер</tspan><tspan x="359.0" dy="14.3">(errno, результат)</tspan></text>
<rect x="500.0" y="239.0" width="290.0" height="50.0" rx="4" fill="#f3faf4" stroke="#27ae60" stroke-width="1.0"/><text x="645.0" y="260.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">localtime_r / gmtime_r</tspan><tspan x="645.0" dy="14.3">в loop(), не в ISR</tspan></text>
<rect x="132.1" y="320.0" width="555.8" height="30.0" rx="6" fill="#fff6e0" stroke="#c0a020" stroke-width="1.5"/><text x="410.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Дивись не на швидкість, а на середній стовпець: прихований стан між викликами — ось небезпека.</tspan></text>
</svg>