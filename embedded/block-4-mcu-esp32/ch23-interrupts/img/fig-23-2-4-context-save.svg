  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Збереження контексту: закладка, щоб не забути думку</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перед обробником ядро ховає на стек, «де воно було» й свої робочі значення, а потім повертає</text>
<rect x="60.0" y="110.0" width="200.0" height="200.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="160.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">регістри ядра</text>
<rect x="78.0" y="148.0" width="164.0" height="24.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="160.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">PC (де я був)</text>
<rect x="78.0" y="178.0" width="164.0" height="24.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="160.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">статус</text>
<rect x="78.0" y="208.0" width="164.0" height="24.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="160.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R0</text>
<rect x="78.0" y="238.0" width="164.0" height="24.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="160.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R1</text>
<rect x="78.0" y="268.0" width="164.0" height="24.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.2"/>
<text x="160.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">…</text>
<line x1="260.0" y1="170.0" x2="380.0" y2="170.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="320.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1) зберегти</text>
<line x1="380.0" y1="360.0" x2="260.0" y2="360.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="320.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3) відновити</text>
<rect x="400.0" y="110.0" width="160.0" height="270.0" rx="12" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="480.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">стек</text>
<rect x="416.0" y="150.0" width="128.0" height="32.0" rx="5" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">PC</text>
<rect x="416.0" y="190.0" width="128.0" height="32.0" rx="5" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">статус</text>
<rect x="416.0" y="230.0" width="128.0" height="32.0" rx="5" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R0</text>
<rect x="416.0" y="270.0" width="128.0" height="32.0" rx="5" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="291.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R1</text>
<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(росте вниз)</text>
<rect x="620.0" y="150.0" width="260.0" height="110.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="750.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2) обробник (ISR)</text>
<text x="750.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вільно користається регістрами —</text>
<text x="750.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вони ж збережені на стеку,</text>
<text x="750.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тож основний код не постраждає</text>
<text x="470.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Контекст» = лічильник команд (PC) + статус + робочі регістри. Без точного повернення — хаос.</text>
</svg>
