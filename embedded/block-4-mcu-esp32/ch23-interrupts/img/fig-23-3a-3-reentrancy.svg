<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нереентерабельність: один стан — два проходи</text>
<text x="54.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">loop()</text>
<text x="54.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ISR</text>
<line x1="90.0" y1="95.0" x2="690.0" y2="95.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="90.0" y1="215.0" x2="690.0" y2="215.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="130.0" y="81.0" width="240.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="250.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">strtok / malloc (в loop)</text>
<line x1="260.0" y1="95.0" x2="260.0" y2="201.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="260.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">↯ ISR влітає</text>
<rect x="260.0" y="201.0" width="200.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">та сама strtok / malloc</text>
<rect x="336.1" y="125.2" width="107.8" height="59.6" rx="6" fill="#fff6e0" stroke="#c0a020" stroke-width="2.0"/><text x="390.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Спільний стан:</tspan><tspan x="390.0" dy="14.3">статичний *ptr</tspan><tspan x="390.0" dy="14.3">(замок купи)</tspan></text>
<line x1="250.0" y1="109.0" x2="390.0" y2="121.2" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="360.0" y1="201.0" x2="390.0" y2="188.8" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460.0" y1="215.0" x2="690.0" y2="215.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="460.0" y1="95.0" x2="690.0" y2="95.0" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="6,5"/>
<text x="580.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стан затерто!</text>
<rect x="185.6" y="294.5" width="408.7" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="390.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Зіпсовані дані / краш: не два примірники стану, а ОДИН на двох</tspan></text>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Та сама прихована гонка, що §4.5.6, — але захована всередині чужого коду.</text>
</svg>