<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як це відбувається: пауза → обробник → повернення</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">процесор кидає основний код, виконує короткий обробник і вертається точно туди ж</text>
<text x="70.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">основний код (loop)</text>
<line x1="70.0" y1="170.0" x2="350.0" y2="170.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<circle cx="350.0" cy="170.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="350.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ подія на ніжці</text>
<line x1="350.0" y1="170.0" x2="350.0" y2="226.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="362.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пауза, зберегти контекст</text>
<rect x="290.0" y="226.0" width="320.0" height="58.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="450.0" y="251.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">обробник (ISR)</text>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коротко зробити потрібне</text>
<line x1="610.0" y1="255.0" x2="690.0" y2="255.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="690.0" y1="255.0" x2="690.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="702.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відновити контекст</text>
<line x1="690.0" y1="170.0" x2="880.0" y2="170.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<text x="800.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">далі, мов нічого не було</text>
<text x="460.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Збереження й відновлення «де я був» ESP32 робить за вас — ви пишете лише сам обробник.</text>
</svg>
