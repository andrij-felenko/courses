<text x="480.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опанувавши переривання, ви навчили мікроконтролер реагувати на світ умить — основа всього далі.</text>
