<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опитування в loop(): реакція спізнюється, подію легко проґавити</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки цикл зайнятий іншим, натиск кнопки чекає своєї черги — або зникає непоміченим</text>
<rect x="90.0" y="150.0" width="120.0" height="50.0" rx="8" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="150.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">читати</text>
<text x="150.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">давач</text>
<rect x="230.0" y="150.0" width="200.0" height="50.0" rx="8" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="330.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">оновити</text>
<text x="330.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">екран</text>
<rect x="450.0" y="150.0" width="120.0" height="50.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="510.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">перевірити</text>
<text x="510.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кнопку</text>
<rect x="590.0" y="150.0" width="170.0" height="50.0" rx="8" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="675.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">інша</text>
<text x="675.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">робота</text>
<line x1="80.0" y1="120.0" x2="770.0" y2="120.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="776.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">час</text>
<line x1="70.0" y1="175.0" x2="90.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="770.0" y1="175.0" x2="800.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="800.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">↻ знову</text>
<line x1="300.0" y1="200.0" x2="300.0" y2="260.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<circle cx="300.0" cy="200.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="300.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">натиск кнопки тут</text>
<line x1="510.0" y1="150.0" x2="510.0" y2="260.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="510.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">перевірено аж тут</text>
<line x1="300.0" y1="248.0" x2="510.0" y2="248.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="405.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">затримка реакції</text>
<rect x="120.0" y="320.0" width="700.0" height="70.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що довший цикл, то пізніша реакція. А коротку подію (швидкий імпульс)</text>
<text x="470.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">опитування може взагалі не застати — між двома перевірками вона зникне.</text>
</svg>
