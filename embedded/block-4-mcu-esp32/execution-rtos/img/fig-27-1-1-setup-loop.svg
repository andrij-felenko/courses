<text x="470.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Це модель Arduino — і найприродніший спосіб думати про мікроконтролер.</text>
