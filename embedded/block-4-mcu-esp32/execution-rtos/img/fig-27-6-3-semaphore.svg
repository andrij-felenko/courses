<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Семафор: сигнал «сталася подія» (а не самі дані)</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">класика: переривання будить задачу — короткий ISR лише сигналить, робота йде в задачі (§23.3)</text>
<rect x="70.0" y="120.0" width="170.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="155.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ISR (подія)</text>
<text x="155.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коротка!</text>
<line x1="240.0" y1="148.0" x2="360.0" y2="148.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="300.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">give (дати)</text>
<circle cx="410.0" cy="148.0" r="30.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="410.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">сем.</text>
<line x1="440.0" y1="148.0" x2="560.0" y2="148.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="500.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">take (взяти)</text>
<rect x="560.0" y="120.0" width="180.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="650.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">задача-обробник</text>
<text x="650.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">спала → прокинулась</text>
<line x1="740.0" y1="148.0" x2="850.0" y2="148.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="805.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">робить діло</text>
<rect x="150.0" y="220.0" width="660.0" height="122.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бінарний семафор — це «дзвоник»: одна сторона дає сигнал, інша на нього чекає (спить).</text>
<text x="480.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так важку роботу виносять з ISR у задачу: ISR лише дзвонить, задача — працює (§23.3).</text>
<text x="480.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Лічильний семафор схожий, але РАХУЄ: скільки одиниць ресурсу вільно</text>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(узяв — на одиницю менше; дав — на одиницю більше; нуль — чекай).</text>
<text x="480.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Семафор передає СИГНАЛ, а не дані — для даних бери чергу.</text>
</svg>
