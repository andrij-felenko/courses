<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чуйність = найдовший прохід циклу</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у найгіршому разі подію помітять аж наприкінці поточного оберту</text>
<line x1="70.0" y1="150.0" x2="890.0" y2="150.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="70.0" y="150.0" width="90.0" height="34.0" rx="4" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="115.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">крок A</text>
<rect x="166.0" y="150.0" width="380.0" height="34.0" rx="4" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="356.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">крок B (довгий)</text>
<rect x="552.0" y="150.0" width="120.0" height="34.0" rx="4" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="612.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">крок C</text>
<line x1="165.0" y1="150.0" x2="165.0" y2="100.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="165.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">кнопку натиснули тут</text>
<line x1="678.0" y1="150.0" x2="678.0" y2="100.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="678.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">помітили аж тут</text>
<path d="M 165 200 Q 421.5 236 678 200" fill="none" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,3"/>
<text x="421.5" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">затримка = майже весь прохід</text>
<rect x="150.0" y="300.0" width="660.0" height="46.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="480.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Додаєш кроки (чи довжиш їх) — росте найгірша затримка реакції.</text>
<text x="480.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Переривання рятує для термінового, та головний потік усе одно гальмує (§23).</text>
