  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Блокування: одна пауза заморожує ВЕСЬ цикл</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">будь-який виклик, що ЧЕКАЄ (delay, повільне читання, мережа), спиняє все інше</text>
<text x="70.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час процесора →</text>
<line x1="70.0" y1="140.0" x2="890.0" y2="140.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<rect x="70.0" y="140.0" width="90.0" height="34.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="115.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робота</text>
<rect x="165.0" y="140.0" width="520.0" height="34.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="425.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">delay(1000) / повільне читання — ЧЕКАЄМО</text>
<rect x="690.0" y="140.0" width="90.0" height="34.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="735.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робота</text>
<text x="425.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">проста секунда — а пристрій «мертвий»</text>
<text x="220.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ LED не блимає</text>
<text x="220.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ кнопку не помічено</text>
<text x="220.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ екран не оновлюється</text>
<text x="540.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">процесор простоює,</text>
<text x="540.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">та зайнятий очікуванням —</text>
<text x="540.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">користі нуль</text>
<rect x="150.0" y="312.0" width="660.0" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.3"/>
<text x="480.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У super-loop усе йде по черзі: поки один крок ЧЕКАЄ, решта просто не виконується.</text>
</svg>
