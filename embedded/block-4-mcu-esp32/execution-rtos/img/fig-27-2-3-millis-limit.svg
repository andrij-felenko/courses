<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Патерн millis рятує — лише якщо все можна «нарізати»</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коротку справу ділять на крихітні шматки; та багато операцій блокують ЗСЕРЕДИНИ</text>
<text x="240.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Можна нарізати ✓</text>
<rect x="70.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="104.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="138.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="172.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="206.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="240.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="274.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="308.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="342.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="376.0" y="120.0" width="28.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="240.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">блимання, лічба, опитування —</text>
<text x="240.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">легко робити по шматочку щооберту</text>
<text x="720.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Не нарізати ✗</text>
<rect x="560.0" y="120.0" width="320.0" height="28.0" rx="3" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="720.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">бібліотечний виклик, що ЧЕКАЄ всередині</text>
<text x="720.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">мережевий запит, читання SD,</text>
<text x="720.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повільний давач — суцільний блок</text>
<rect x="150.0" y="230.0" width="660.0" height="116.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Патерн millis вимагає, щоб КОЖНА справа вміла зупинятися й продовжуватися</text>
<text x="480.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крихітними кроками. Та чимало операцій так не вміють: вони блокують усередині</text>
<text x="480.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">себе, і поділити їх ви не можете — хіба що переписати з нуля.</text>
<text x="480.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">А ще один довгий шматок усе одно затримує решту — бо потік один.</text>
</svg>
