<rect x="560.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="620.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="680.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="740.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="80.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">кожен оберт крихітний — реакція майже миттєва</text>
<text x="80.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">один довгий крок (напр., delay чи довге читання):</text>
<rect x="80.0" y="236.0" width="70.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="155.0" y="236.0" width="420.0" height="28.0" rx="3" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="365.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ДОВГИЙ крок — усе інше чекає</text>
<rect x="580.0" y="236.0" width="70.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="80.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">поки тягнеться довгий крок, оберт не завершується — реакція гальмує</text>
<rect x="150.0" y="312.0" width="640.0" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.3"/>
<text x="470.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й головний клопіт super-loop: не давати жодному кроку надовго «захопити» цикл.</text>
