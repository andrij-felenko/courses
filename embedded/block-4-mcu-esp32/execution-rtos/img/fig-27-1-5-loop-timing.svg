</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Цикл крутиться так швидко, як дозволяє найповільніший крок</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">короткий loop() — мільйони обертів за секунду; один довгий крок розтягує весь оберт</text>
<text x="80.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">короткий loop(): багато швидких обертів</text>
<rect x="80.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="140.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="200.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="260.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="320.0" y="124.0" width="50.0" height="28.0" rx="3" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
