<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="412" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл оптимізації: виміряй → знайди → виправ → переміряй</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">повторюй, доки бюджети не зійдуться; не чіпай того, що й так у бюджеті</text>
<rect x="133.4" y="112.6" width="213.2" height="74.8" rx="12" fill="#1f47b522" stroke="#1f47b5" stroke-width="2.5"/><text x="240.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Виміряй</tspan><tspan x="240.0" dy="16.9">Профіль CPU + пам'яті:</tspan><tspan x="240.0" dy="16.9">завантаженість, watermark</tspan></text>
<rect x="607.1" y="112.6" width="205.8" height="74.8" rx="12" fill="#c0271e22" stroke="#c0271e" stroke-width="2.5"/><text x="710.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">2. Знайди</tspan><tspan x="710.0" dy="16.9">Одну найгарячішу точку /</tspan><tspan x="710.0" dy="16.9">найбільшу витрату</tspan></text>
<rect x="614.5" y="272.6" width="191.0" height="74.8" rx="12" fill="#1f8a3b22" stroke="#1f8a3b" stroke-width="2.5"/><text x="710.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">3. Виправ</tspan><tspan x="710.0" dy="16.9">Лише цю одну точку;</tspan><tspan x="710.0" dy="16.9">нічого більше не чіпай</tspan></text>
<rect x="155.6" y="272.6" width="168.8" height="74.8" rx="12" fill="#caa24a22" stroke="#caa24a" stroke-width="2.5"/><text x="240.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">4. Переміряй</tspan><tspan x="240.0" dy="16.9">Краще? Не зламалось</tspan><tspan x="240.0" dy="16.9">інше? → крок 1</tspan></text>
<line x1="330.0" y1="150.0" x2="620.0" y2="150.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710.0" y1="200.0" x2="710.0" y2="260.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="620.0" y1="310.0" x2="330.0" y2="310.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="240.0" y1="260.0" x2="240.0" y2="200.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="757.9" y="193.1" width="164.2" height="73.9" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.5"/><text x="840.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Не чіпай того,</tspan><tspan x="840.0" dy="14.3">що й так у бюджеті!</tspan><tspan x="840.0" dy="14.3">(передчасна оптимізація</tspan><tspan x="840.0" dy="14.3">псує код — §4.10.7)</tspan></text>
<rect x="93.3" y="375.0" width="773.4" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/><text x="480.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Профілювання — спільний «вимірювальний прилад» усього розділу: такти, байти, дедлайни стають числами.</tspan></text>
</svg>