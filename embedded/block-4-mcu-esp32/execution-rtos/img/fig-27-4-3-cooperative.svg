<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кооперативний: кожен біжить, доки САМ не поступиться</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">простіше й менше гонок — та жадібна задача здатна заморозити всіх</text>
<text x="70.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Як задумано: кожен попрацював і поступився</text>
<rect x="70.0" y="114.0" width="195.0" height="30.0" rx="3" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="167.5" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<line x1="70.0" y1="110.0" x2="70.0" y2="148.0" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
<rect x="265.0" y="114.0" width="221.0" height="30.0" rx="3" fill="#1f47b5" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="375.5" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<line x1="265.0" y1="110.0" x2="265.0" y2="148.0" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
<rect x="486.0" y="114.0" width="195.0" height="30.0" rx="3" fill="#7a4fb0" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="583.5" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<line x1="486.0" y1="110.0" x2="486.0" y2="148.0" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
<rect x="681.0" y="114.0" width="169.0" height="30.0" rx="3" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="0.8"/>
<text x="765.5" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="70.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">↑ кожна риска — задача сама сказала «годі, далі ти»</text>
<text x="70.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Біда: задача A зажерлася й не поступається</text>
<rect x="70.0" y="234.0" width="700.0" height="30.0" rx="3" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="420.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Задача A крутиться без кінця — НЕ поступається</text>
<text x="70.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ B і C не біжать узагалі — система «зависла», як старий super-loop</text>
<rect x="150.0" y="314.0" width="660.0" height="34.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.3"/>
<text x="480.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кооперативний тримається на чесності задач. Одна нечесна — і всі стоять.</text>
</svg>
