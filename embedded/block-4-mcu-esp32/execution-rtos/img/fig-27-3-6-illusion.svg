<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ілюзія: багато програм на одному ядрі</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне ядро швидко перемикається — а ззовні здається, ніби всі задачі біжать водночас</text>
<rect x="410.0" y="90.0" width="140.0" height="50.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="480.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ОДНЕ ядро</text>
<text x="480.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">робить одне за раз</text>
<rect x="100.0" y="210.0" width="160.0" height="50.0" rx="10" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="180.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Задача A</text>
<text x="180.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">наче біжить весь час</text>
<line x1="480.0" y1="142.0" x2="180.0" y2="208.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aGrey)"/>
<rect x="400.0" y="210.0" width="160.0" height="50.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="480.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Задача B</text>
<text x="480.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">наче біжить весь час</text>
<line x1="480.0" y1="142.0" x2="480.0" y2="208.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aGrey)"/>
<rect x="700.0" y="210.0" width="160.0" height="50.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="780.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7a4fb0" text-anchor="middle" font-weight="bold" font-style="normal">Задача C</text>
<text x="780.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">наче біжить весь час</text>
<line x1="480.0" y1="142.0" x2="780.0" y2="208.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#aGrey)"/>
<text x="480.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">перемикається десятки-сотні разів за секунду</text>
<rect x="150.0" y="290.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це та сама ілюзія, що й у поділі часу 1961 року (історія розділу) —</text>
<text x="480.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лише тепер «користувачі» — це задачі, а зал — один чип. (Два ядра ESP32 — §27.5.)</text>
</svg>
