<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головний винуватець: великий локальний масив</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">буфер, оголошений усередині функції, лягає на СТЕК — і легко його переповнює</text>
<rect x="70.0" y="90.0" width="420.0" height="80.0" rx="8" fill="#fbfcff" stroke="#c0271e" stroke-width="1.4"/>
<text x="280.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">погано:</text>
<text x="86.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">void task(void*) {</text>
<text x="86.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    char buf[4096];   // ← на СТЕКУ! рве його</text>
<text x="86.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    ...</text>
<text x="86.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<rect x="70.0" y="200.0" width="420.0" height="80.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="280.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">краще:</text>
<text x="86.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">void task(void*) {</text>
<text x="86.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    static char buf[4096]; // не на стеку</text>
<text x="86.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    ...                       // (або з купи)</text>
<text x="86.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">}</text>
<rect x="530.0" y="90.0" width="360.0" height="190.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="710.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">що ще їсть стек:</text>
<text x="550.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• великі локальні масиви/буфери</text>
<text x="550.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• глибока вкладеність викликів</text>
<text x="550.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• рекурсія (на МК — уникай)</text>
<text x="550.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• printf, float, складні бібліотеки</text>
<text x="550.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Великі буфери — у static чи купу,</text>
<text x="550.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">а не на стек.</text>
<rect x="150.0" y="300.0" width="660.0" height="0.0" rx="0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Найшвидший спосіб переповнити стек — оголосити в задачі великий масив. Виносьте його зі стека.</text>
</svg>
