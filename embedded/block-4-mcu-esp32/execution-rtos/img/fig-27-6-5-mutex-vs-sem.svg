<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">М'ютекс — не просто сигнал: має власника й успадкування пріоритету</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дві відмінності від бінарного семафора, що роблять його правильним для захисту ресурсу</text>
<rect x="70.0" y="86.0" width="380.0" height="90.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="260.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">1) Власник</text>
<text x="90.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">замок віддає ЛИШЕ той, хто взяв</text>
<text x="90.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(семафор може дати будь-хто)</text>
<rect x="510.0" y="86.0" width="380.0" height="90.0" rx="10" fill="#fbfcff" stroke="#c0271e" stroke-width="1.6"/>
<text x="700.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2) Успадкування пріоритету</text>
<text x="530.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">власник тимчасово отримує пріоритет</text>
<text x="530.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">того, хто на нього чекає</text>
<text x="480.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо? Проти ІНВЕРСІЇ ПРІОРИТЕТІВ:</text>
<text x="150.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">• низькопріоритетна тримає замок</text>
<text x="150.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• високопріоритетна чекає на той замок</text>
<text x="150.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">• середня витісняє низьку → висока «голодує» через середню!</text>
<text x="150.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Успадкування: низька на час замка стає «високою» → швидко віддасть і розблокує.</text>
<rect x="150.0" y="318.0" width="660.0" height="50.0" rx="9" fill="#fff6e0" stroke="#caa24a" stroke-width="1.3"/>
<text x="480.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Класичний випадок — марсіанський «Pathfinder» (1997): інверсія пріоритетів перезавантажувала</text>
<text x="480.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">апарат, аж доки віддалено не ввімкнули успадкування пріоритету на м'ютексі.</text>
</svg>
