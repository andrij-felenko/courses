<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="338.8" y="13.5" width="262.4" height="37.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="470.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Одне ядро — три обличчя</tspan></text>
<text x="470.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">один і той самий код — у різних юридичних упаковках</text>
<rect x="70.0" y="200.8" width="100.0" height="78.4" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Спільне</tspan><tspan x="120.0" dy="18.2">ядро</tspan><tspan x="120.0" dy="18.2">FreeRTOS</tspan></text>
<rect x="210.0" y="100.0" width="200.0" height="230.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<rect x="266.8" y="114.5" width="86.4" height="27.0" rx="6" fill="#eaf0fd" stroke="#eaf0fd" stroke-width="1.5"/><text x="310.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">FreeRTOS</tspan></text>
<text x="310.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GPL з винятком · $0</text>
<line x1="222.0" y1="164.0" x2="398.0" y2="164.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="310.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Твій код лишається</text>
<text x="310.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">закритим; ядро — відкрите.</text>
<text x="310.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Спільнота / студенти /</text>
<text x="310.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дешеві вироби</text>
<line x1="170.0" y1="240.0" x2="206.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="100.0" width="200.0" height="230.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="516.8" y="114.5" width="86.4" height="27.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="560.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">OpenRTOS</tspan></text>
<text x="560.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Комерційна ліцензія · платна</text>
<line x1="472.0" y1="164.0" x2="648.0" y2="164.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="560.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Без будь-яких GPL-зобов'язань.</text>
<text x="560.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Юридичні гарантії.</text>
<text x="560.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Технічна підтримка</text>
<text x="560.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(WITTENSTEIN hIS)</text>
<line x1="170.0" y1="240.0" x2="456.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="100.0" width="200.0" height="230.0" rx="10" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="2.0"/>
<rect x="756.8" y="114.5" width="86.4" height="27.0" rx="6" fill="#f5f0fb" stroke="#f5f0fb" stroke-width="1.5"/><text x="800.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">SafeRTOS</tspan></text>
<text x="800.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Функційна безпека · платна++</text>
<line x1="712.0" y1="164.0" x2="888.0" y2="164.0" stroke="#7a4fb0" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="800.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сертифікована (IEC 61508,</text>
<text x="800.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ISO 26262, DO-178C).</text>
<text x="800.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Медицина / авіа / авто;</text>
<text x="800.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ціна відмови — життя</text>
<line x1="170.0" y1="240.0" x2="696.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="362.2" width="760.0" height="51.6" rx="6" fill="#fffde7" stroke="#cca824" stroke-width="1.5"/><text x="470.0" y="384.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Безкоштовна версія розносить ядро по чипах і слугує полігоном якості;</tspan><tspan x="470.0" dy="15.6">платні OpenRTOS / SafeRTOS годують проєкт там, де ціна відмови висока.</tspan></text>
</svg>