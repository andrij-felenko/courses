<rect x="181.1" y="336.2" width="457.8" height="47.6" rx="8" fill="#fff6e0" stroke="#b07a10" stroke-width="1.6"/><text x="410.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle"><tspan x="410.0" dy="0.0">Завжди підтверджуй розміщення: xPortGetCoreID() всередині задачі</tspan><tspan x="410.0" dy="15.6">поверне 0 або 1 — саме звідки вона насправді біжить.</tspan></text>
