<rect x="430.0" y="254.0" width="220.0" height="64.0" rx="5" fill="#fbfcff" stroke="#333333" stroke-width="1.2"/><text x="540.0" y="281.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Для задач, байдужих</tspan><tspan x="540.0" dy="18.2">до конкретного ядра</tspan></text>
