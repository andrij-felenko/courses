<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбір UART-кадру: кожна перевірка ловить свою атаку/збій</text>
<rect x="80.0" y="105.0" width="60.0" height="52.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="2.0"/><text x="110.0" y="127.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">magic</tspan><tspan x="110.0" dy="14.3">2B</tspan></text>
<rect x="142.0" y="105.0" width="44.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="164.0" y="127.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">len</tspan><tspan x="164.0" dy="14.3">1B</tspan></text>
<rect x="188.0" y="105.0" width="110.0" height="52.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="243.0" y="127.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="243.0" dy="0.0">payload</tspan><tspan x="243.0" dy="14.3">…</tspan></text>
<rect x="300.0" y="105.0" width="60.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="330.0" y="127.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">CRC</tspan><tspan x="330.0" dy="14.3">2B</tspan></text>
<line x1="80.0" y1="165.0" x2="362.0" y2="165.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="221.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UART-кадр</text>
<rect x="48.9" y="14.5" width="122.3" height="37.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.8"/><text x="110.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">перевір buf != NULL</tspan><tspan x="110.0" dy="13.0">+ перевір magic</tspan></text>
<line x1="110.0" y1="51.5" x2="110.0" y2="105.0" stroke="#c07000" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="51.7" y="212.0" width="116.6" height="50.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="1.8"/><text x="110.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">крах вказівника</tspan><tspan x="110.0" dy="13.0">(NULL-buf)</tspan><tspan x="110.0" dy="13.0">чужий/шумовий кадр</tspan></text>
<line x1="110.0" y1="157.0" x2="110.0" y2="212.0" stroke="#c07000" stroke-width="1.5" marker-end="url(#arrow)"/>
