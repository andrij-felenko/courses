<line x1="330.0" y1="45.0" x2="330.0" y2="105.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="271.7" y="218.5" width="116.6" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="330.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">биті дані</tspan><tspan x="330.0" dy="13.0">(шум, пошкодження)</tspan></text>
<line x1="330.0" y1="157.0" x2="330.0" y2="218.5" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="194.0" y1="131.0" x2="264.0" y2="131.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="274.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">← НЕБЕЗПЕКА</text>
<text x="390.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Усі перевірки зелені → лише тоді читаємо payload. Кожна ловить свій клас загрози.</text>
