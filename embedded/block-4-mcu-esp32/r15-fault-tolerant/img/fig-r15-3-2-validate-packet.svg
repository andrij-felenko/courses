<line x1="243.0" y1="51.5" x2="243.0" y2="105.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="167.6" y="225.0" width="150.8" height="24.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/><text x="243.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="243.0" dy="0.0">— корисне навантаження —</tspan></text>
<line x1="243.0" y1="157.0" x2="243.0" y2="225.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
