<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де перевіряти: периметрова оборона, а не рівномірна параноя</text>
<ellipse cx="350" cy="235" rx="170" ry="160" fill="#fff8dc" stroke="#c07000" stroke-width="3" stroke-dasharray="8 4"/>
<ellipse cx="350" cy="235" rx="115" ry="107" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.5"/>
<ellipse cx="350" cy="235" rx="60" ry="55" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
