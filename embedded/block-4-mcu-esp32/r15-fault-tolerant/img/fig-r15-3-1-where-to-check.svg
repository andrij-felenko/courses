гарячий цикл</text>
<text x="350.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">межі між модулями</text>
<text x="350.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c07000" text-anchor="middle" font-weight="700">зовнішній світ: UART, мережа, давач, NVS, ввід</text>
<rect x="209.0" y="19.5" width="282.0" height="27.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="2.5"/><text x="350.0" y="36.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">ПЕРЕВІРЯЙ: діапазон, довжина, CRC, NULL</tspan></text>
<line x1="350.0" y1="51.0" x2="350.0" y2="69.0" stroke="#c07000" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="475.1" y="214.3" width="103.8" height="41.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="527.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="527.0" dy="0.0">передумови</tspan><tspan x="527.0" dy="14.3">публічного API</tspan></text>
<line x1="475.1" y1="235.0" x2="465.0" y2="235.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">не дублюй
не гальмуй</text>
<text x="350.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перевіряй НЕДОВІРЕНЕ джерело й ДОРОГУ помилку. Не дублюй перевірку вище.</text>
