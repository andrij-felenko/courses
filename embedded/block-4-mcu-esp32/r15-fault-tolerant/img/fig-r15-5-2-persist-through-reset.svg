<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що переживає reset: куди зберігати доказ збою</text>
<rect x="110.0" y="75.0" width="480.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="350.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SRAM (робочий стан)</text>
<text x="350.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">СТЕРТО при reset
уся RAM = 0</text>
<rect x="110.0" y="167.0" width="480.0" height="148.0" rx="6" fill="#fff3cd" stroke="#c07000" stroke-width="2.5"/>
<text x="350.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c07000" text-anchor="middle" font-weight="700">RTC-пам'ять (лічильник збоїв,
причина, прапорець safe mode)</text>
<text x="350.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Переживає reset і deep-sleep
НЕ переживає повне знеструмлення</text>
<rect x="110.0" y="327.0" width="480.0" height="90.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.5"/>
<text x="350.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">NVS у Flash
(конфіг, порогові значення)</text>
<text x="350.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Переживає знеструмлення
Зношується → писати ощадливо</text>
<text x="618.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c07000" text-anchor="start">лічильник,
причина reset,
boot_fail_cnt</text>
<text x="618.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">конфіг, порогові
значення (рідко)</text>
<text x="75.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Правильний порядок перед reset:</text>
<rect x="82.7" y="315.0" width="114.6" height="22.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">enter_safe_state()</tspan></text>
<line x1="197.3" y1="326.0" x2="232.7" y2="326.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="230.6" y="315.0" width="108.9" height="22.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="285.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">log_fault(reason)</tspan></text>
<line x1="339.4" y1="326.0" x2="380.6" y2="326.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="389.8" y="315.0" width="80.4" height="22.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="430.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">nvs_commit()</tspan></text>
<line x1="470.2" y1="326.0" x2="539.8" y2="326.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="532.0" y="315.0" width="86.1" height="22.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="575.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">esp_restart()</tspan></text>
</svg>