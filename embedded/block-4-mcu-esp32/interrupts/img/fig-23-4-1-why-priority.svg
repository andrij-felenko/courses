<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо пріоритети: не всі події однаково термінові</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">аварійний сигнал не може чекати, поки обробляється натиск кнопки — комусь треба «вперед»</text>
<rect x="60.0" y="120.0" width="260.0" height="56.0" rx="10" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="80.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">аварія живлення</text>
<text x="80.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ДУЖЕ терміново</text>
<line x1="320.0" y1="148.0" x2="470.0" y2="200.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="770.0" y="120.0" width="110.0" height="56.0" rx="8" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.6"/>
<text x="825.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пріоритет:</text>
<text x="825.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вищий</text>
<rect x="60.0" y="195.0" width="260.0" height="56.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="80.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">таймер реального часу</text>
<text x="80.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">важливо, точно</text>
<line x1="320.0" y1="223.0" x2="470.0" y2="200.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="770.0" y="195.0" width="110.0" height="56.0" rx="8" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="825.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пріоритет:</text>
<text x="825.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">середній</text>
<rect x="60.0" y="270.0" width="260.0" height="56.0" rx="10" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="80.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">натиск кнопки</text>
<text x="80.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">може зачекати</text>
<line x1="320.0" y1="298.0" x2="470.0" y2="200.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="770.0" y="270.0" width="110.0" height="56.0" rx="8" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="825.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пріоритет:</text>
<text x="825.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нижчий</text>
<rect x="470.0" y="150.0" width="230.0" height="110.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="585.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контролер</text>
<text x="585.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розставляє чергу</text>
<text x="585.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">за пріоритетом:</text>
<text x="585.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">важливіший — першим</text>
<line x1="700.0" y1="205.0" x2="765.0" y2="148.0" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#aInk)"/>
<text x="470.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пріоритет каже контролеру, кого пускати першим і хто кого може перебити.</text>
</svg>
