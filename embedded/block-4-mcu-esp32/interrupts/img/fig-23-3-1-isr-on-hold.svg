<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поки обробник працює — решта світу на паузі</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">довгий ISR блокує і основний код, і інші переривання: усі чекають, доки він завершиться</text>
<text x="70.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">основний код</text>
<line x1="120.0" y1="150.0" x2="320.0" y2="150.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="320.0" y1="150.0" x2="320.0" y2="154.0" stroke="#1f47b5" stroke-width="1" stroke-linecap="round"/>
<rect x="320.0" y="132.0" width="300.0" height="36.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="470.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обробник (ISR) виконується</text>
<line x1="620.0" y1="150.0" x2="860.0" y2="150.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<text x="740.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">далі</text>
<line x1="440.0" y1="220.0" x2="440.0" y2="168.0" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="440.0" cy="220.0" r="4.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="440.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">інша подія прийшла тут…</text>
<line x1="440.0" y1="210.0" x2="620.0" y2="210.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="640.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="start" font-weight="bold" font-style="normal">…а обслужать аж тут (чекала!)</text>
<line x1="620.0" y1="220.0" x2="620.0" y2="150.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<rect x="150.0" y="300.0" width="640.0" height="56.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що довший обробник, то довше «висить» уся система: спізнюються інші події,</text>
<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зростає джитер, гальмує планувальник. Звідси головне правило: ISR — якнайкоротший.</text>
</svg>
