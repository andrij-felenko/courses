<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контролер переривань: регулювальник між пристроями і ядром</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">збирає запити від багатьох джерел, відсіює заборонені, обирає важливіший — і кличе ядро</text>
<rect x="60.0" y="110.0" width="120.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="120.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">таймер</text>
<line x1="180.0" y1="132.0" x2="360.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aGrey)"/>
<rect x="60.0" y="170.0" width="120.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="120.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">GPIO</text>
<line x1="180.0" y1="192.0" x2="360.0" y2="200.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="60.0" y="230.0" width="120.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="120.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">UART</text>
<line x1="180.0" y1="252.0" x2="360.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aGrey)"/>
<rect x="60.0" y="290.0" width="120.0" height="44.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="120.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">…</text>
<line x1="180.0" y1="312.0" x2="360.0" y2="200.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#aGrey)"/>
<text x="120.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джерела подій</text>
<rect x="360.0" y="150.0" width="230.0" height="120.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="475.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контролер переривань</text>
<text x="475.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• дозволено? (маска)</text>
<text x="475.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• який пріоритет?</text>
<text x="475.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• кого пустити першим</text>
<line x1="590.0" y1="210.0" x2="720.0" y2="210.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="655.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">переривання!</text>
<rect x="720.0" y="160.0" width="160.0" height="100.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="800.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">процесор</text>
<text x="800.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(ядро)</text>
<text x="470.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Без контролера ядро потонуло б у сигналах: він — той, хто вирішує, КОГО і КОЛИ пускати.</text>
<text x="470.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тут активний GPIO (червоним); інші джерела поки мовчать.</text>
</svg>
