<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обрив: коли ISR не встигає за подіями</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що ближче f·t до 1, то менше CPU лишається main; при f·t ≥ 1 система не встигає</text>
<rect x="80.0" y="110.0" width="406.0" height="46.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="283.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ISR + main уміщаються ✓</text>
<rect x="486.0" y="110.0" width="175.0" height="46.0" rx="0" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="570.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">main голодує ⚠</text>
<rect x="661.0" y="110.0" width="119.0" height="46.0" rx="0" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="720.5" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">f·t ≥ 1</text>
<text x="720.5" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обрив</text>
<text x="80.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0%</text>
<text x="486.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">~70%</text>
<text x="661.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">100%</text>
<text x="780.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">120%</text>
<line x1="661.0" y1="104.0" x2="661.0" y2="162.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>
<rect x="120.0" y="210.0" width="660.0" height="70.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">При f·t ≥ 1 переривання наздоганяють самі себе → пропуски подій (overrun).</text>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Лік: дробити ISR (§4.5.3), знижувати частоту,</text>
<text x="450.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">або віддати потік залізу/DMA замість переривання на кожну подію (§4.5.7).</text>
</svg>
