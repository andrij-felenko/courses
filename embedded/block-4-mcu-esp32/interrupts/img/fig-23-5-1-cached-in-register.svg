<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410">
<rect width="940" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Баг без volatile: цикл дивиться в регістр, а не в пам'ять</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">компілятор «закешував» прапорець у регістрі — і цикл не бачить, що ISR змінив пам'ять</text>
<rect x="60.0" y="110.0" width="200.0" height="90.0" rx="12" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="160.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пам'ять</text>
<rect x="82.0" y="148.0" width="156.0" height="40.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="160.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">flag = true</text>
<text x="160.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(ISR щойно записав)</text>
<line x1="180.0" y1="240.0" x2="160.0" y2="200.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="230.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ISR пише сюди →</text>
<rect x="120.0" y="250.0" width="120.0" height="44.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="180.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обробник</text>
<rect x="480.0" y="110.0" width="200.0" height="90.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="580.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">регістр (кеш)</text>
<rect x="502.0" y="148.0" width="156.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="580.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">flag = false</text>
<text x="580.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">застаріле!</text>
<rect x="740.0" y="130.0" width="150.0" height="90.0" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="815.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">while(!flag){}</text>
<text x="815.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">дивиться в РЕГІСТР</text>
<text x="815.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ завжди false</text>
<line x1="740.0" y1="175.0" x2="682.0" y2="165.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<line x1="280.0" y1="160.0" x2="470.0" y2="160.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="6,5" stroke-linecap="round"/>
<text x="375.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ зв'язок розірвано</text>
<text x="375.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(цикл не перечитує пам'ять)</text>
<rect x="150.0" y="320.0" width="640.0" height="64.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="470.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Результат: ISR давно поставив flag=true в пам'яті, а цикл крутиться вічно,</text>
<text x="470.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">бо звіряється з застарілою копією в регістрі. Класичне «зависання» з перериваннями.</text>
</svg>
