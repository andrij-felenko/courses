<text x="150.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• напруга «просідає» — рівень не втримати</text>
