<text x="498.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• сумарний струм усіх ніжок теж обмежений!</text>
