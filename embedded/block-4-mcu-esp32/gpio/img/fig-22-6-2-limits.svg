<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у ESP32 ніжка тримає ~20 мА у роботі; абсолютна стеля близько 40 мА</text>
