<rect x="620.0" y="185.0" width="160.0" height="130.0" rx="10" fill="#eaf3fb" stroke="#2457d6" stroke-width="2.5"/>
<rect x="633.2" y="227.9" width="133.5" height="44.2" rx="6" fill="#eaf3fb" stroke="#eaf3fb" stroke-width="1.5"/><text x="700.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">ESP32</tspan><tspan x="700.0" dy="18.2">(навантаження)</tspan></text>
<line x1="700.0" y1="120.0" x2="700.0" y2="185.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="700.0" y1="315.0" x2="700.0" y2="380.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="215.3" y="48.4" width="129.4" height="63.2" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/><text x="280.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">RTC</tspan><tspan x="280.0" dy="15.6">(DS3231/PCF8563)</tspan><tspan x="280.0" dy="15.6">~1–2 мкА</tspan></text>
