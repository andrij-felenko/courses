<text x="635.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">EN</text>
<rect x="145.4" y="96.2" width="109.3" height="47.6" rx="6" fill="#f5eef8" stroke="#7d3c98" stroke-width="2.0"/><text x="200.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">P-MOSFET</tspan><tspan x="200.0" dy="15.6">(soft-latch)</tspan></text>
<rect x="129.2" y="187.5" width="51.6" height="25.0" rx="6" fill="#f9ecff" stroke="#7d3c98" stroke-width="1.5"/><text x="155.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Кнопка</tspan></text>
<line x1="180.0" y1="200.0" x2="146.0" y2="120.0" stroke="#7d3c98" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="625.0" y1="200.0" x2="254.0" y2="120.0" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="625.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d3c98" text-anchor="start">HOLD</text>
<text x="430.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Земля (GND) спільна для всіх трьох — керують лише плюсовою шиною.</text>
<rect x="30.0" y="381.0" width="14.0" height="14.0" rx="3" fill="#e67e22" stroke="#e67e22" stroke-width="0.0"/>
<text x="50.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="start">RTC: будить за розкладом (alarm INT → wake GPIO)</text>
<rect x="30.0" y="403.0" width="14.0" height="14.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="50.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">Load switch: відрізає живлення вузла (EN від GPIO)</text>
<rect x="30.0" y="425.0" width="14.0" height="14.0" rx="3" fill="#7d3c98" stroke="#7d3c98" stroke-width="0.0"/>
<text x="50.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="start">Soft-latch: P-MOSFET + кнопка = пристрій вимикає себе</text>
