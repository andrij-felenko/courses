<text x="482.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">INT/alarm → wake GPIO</text>
<text x="482.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«розбуди о 06:00»</text>
<rect x="447.7" y="136.2" width="64.6" height="47.6" rx="6" fill="#f0f8e8" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Load</tspan><tspan x="480.0" dy="15.6">Switch</tspan></text>
<line x1="480.0" y1="120.0" x2="480.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
