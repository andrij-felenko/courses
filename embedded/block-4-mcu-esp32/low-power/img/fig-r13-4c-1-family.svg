<circle cx="90.0" cy="214.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="90.0" y="218.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="90.0" cy="286.0" r="11.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="90.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="140.0" y1="120.0" x2="750.0" y2="120.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">+VCC</text>
<line x1="140.0" y1="380.0" x2="750.0" y2="380.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="160.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">GND (спільна)</text>
