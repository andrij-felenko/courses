<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два типи струму: чому сон працює і чому deep — глибше</text>
<rect x="25.0" y="48.0" width="300.0" height="44.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.5"/><text x="175.0" y="75.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ДИНАМІЧНИЙ</tspan></text>
<rect x="340.0" y="48.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="490.0" y="75.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">СТАТИЧНИЙ / витоки</tspan></text>
<rect x="105.4" y="101.0" width="139.1" height="28.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.0"/><text x="175.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">∝ частота × C × V²</tspan></text>
<rect x="81.5" y="139.0" width="187.0" height="28.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.0"/><text x="175.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">зникає зі спиненням такту</tspan></text>
<rect x="74.7" y="177.0" width="200.7" height="28.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.0"/><text x="175.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">гейтинг тактів → майже нуль</tspan></text>
<rect x="74.0" y="215.0" width="202.0" height="28.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.0"/><text x="175.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">LIGHT-SLEEP: такти стоять</tspan></text>
<rect x="85.2" y="253.0" width="179.7" height="28.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.0"/><text x="175.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">→ динамічний струм ≈ 0</tspan></text>
<line x1="175.0" y1="262.0" x2="175.0" y2="298.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="62.8" y="298.2" width="224.3" height="43.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="175.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Вимикається ГЕЙТИНГОМ ТАКТІВ</tspan><tspan x="175.0" dy="15.6">(light-sleep достатньо!)</tspan></text>
<rect x="389.7" y="101.0" width="200.7" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="490.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">тече завжди при наявності V</tspan></text>
<rect x="403.3" y="139.0" width="173.3" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="490.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">НЕ залежить від частоти</tspan></text>
<rect x="413.6" y="177.0" width="152.8" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="490.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">росте з температурою</tspan></text>
<rect x="363.0" y="215.0" width="254.1" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="490.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">прибрати → зняти живлення домену</tspan></text>
<rect x="415.0" y="253.0" width="149.9" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="490.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">→ лише DEEP-SLEEP!</tspan></text>
<line x1="490.0" y1="262.0" x2="490.0" y2="298.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="355.5" y="298.2" width="269.0" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="490.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Прибирається лише ЗНАТТЯМ ЖИВЛЕННЯ</tspan><tspan x="490.0" dy="15.6">(deep-sleep знеструмлює домен)</tspan></text>
<line x1="330.0" y1="48.0" x2="330.0" y2="350.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,4"/>
</svg>