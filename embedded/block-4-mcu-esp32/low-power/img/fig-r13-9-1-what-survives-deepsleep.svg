<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що переживає deep-sleep: SRAM гине, RTC-пам'ять живе</text>
<rect x="20.0" y="45.0" width="310.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="175.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ГИНЕ в deep-sleep</tspan></text>
<rect x="20.0" y="105.0" width="310.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="175.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Звичайна SRAM (512 КБ+)</tspan></text>
<rect x="20.0" y="143.0" width="310.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="175.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Регістри периферії</tspan></text>
<rect x="20.0" y="181.0" width="310.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="175.0" y="202.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стан Wi-Fi / BLE</tspan></text>
<rect x="20.0" y="219.0" width="310.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="175.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Всі глобальні змінні</tspan></text>
<rect x="20.0" y="257.0" width="310.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="175.0" y="278.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стек, heap, стан задач</tspan></text>
<rect x="20.0" y="306.0" width="310.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="175.0" y="327.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">→ після пробудження = ПЕРЕЗАПУСК із main()</tspan></text>
<line x1="360.0" y1="40.0" x2="360.0" y2="340.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="380.0" y="45.0" width="310.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/><text x="535.0" y="72.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">ЖИВЕ в deep-sleep (RTC-домен)</tspan></text>
<rect x="380.0" y="105.0" width="310.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="535.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">RTC SLOW пам'ять (~8 КБ)</tspan></text>
<rect x="380.0" y="143.0" width="310.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="535.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">RTC FAST пам'ять (~8 КБ)</tspan></text>
<rect x="380.0" y="181.0" width="310.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="535.0" y="202.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">RTC-таймер / будильник</tspan></text>
<rect x="380.0" y="219.0" width="310.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="535.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">RTC-GPIO (підмножина)</tspan></text>
<rect x="380.0" y="257.0" width="310.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="535.0" y="278.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">ULP-співпроцесор</tspan></text>
<rect x="380.0" y="306.0" width="310.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="535.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">RTC_DATA_ATTR → кладемо 'спомин' сюди</tspan></text>
</svg>