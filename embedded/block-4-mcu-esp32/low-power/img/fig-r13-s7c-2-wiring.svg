<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два режими ввімкнення профілювальника</text>
<rect x="10.0" y="55.0" width="380.0" height="330.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ampere-meter mode</text>
<text x="200.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(розрив плюсового проводу)</text>
<rect x="39.6" y="153.2" width="70.7" height="43.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="75.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="75.0" dy="0.0">Джерело</tspan><tspan x="75.0" dy="15.6">живлення</tspan></text>
<rect x="174.6" y="145.4" width="70.7" height="59.2" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Профіль-</tspan><tspan x="210.0" dy="15.6">щик</tspan><tspan x="210.0" dy="15.6">IN+→OUT+</tspan></text>
<rect x="321.7" y="153.2" width="36.5" height="43.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="340.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">DUT</tspan><tspan x="340.0" dy="15.6">VDD</tspan></text>
<line x1="118.0" y1="163.0" x2="155.0" y2="163.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="163.0" x2="305.0" y2="163.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="30.0" y1="220.0" x2="375.0" y2="220.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">спільна GND</text>
<circle cx="135.0" cy="155.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="135.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="135.0" cy="225.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="135.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Прилад — послідовно у розрив плюса.</text>
<text x="200.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Своє живлення — окремий USB до ПК.</text>
<rect x="420.0" y="55.0" width="390.0" height="330.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="615.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Source-meter mode</text>
<text x="615.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(прилад сам живить DUT)</text>
<rect x="514.1" y="145.4" width="111.8" height="59.2" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/><text x="570.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Профілювальник</tspan><tspan x="570.0" dy="15.6">3.3 В / source</tspan><tspan x="570.0" dy="15.6">+ вимір I</tspan></text>
<rect x="731.7" y="153.2" width="36.5" height="43.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="750.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">DUT</tspan><tspan x="750.0" dy="15.6">VDD</tspan></text>
<line x1="640.0" y1="163.0" x2="705.0" y2="163.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="220.0" x2="795.0" y2="220.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="615.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">спільна GND</text>
<line x1="570.0" y1="132.0" x2="570.0" y2="105.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="570.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">USB ПК (лише управління + живлення приладу)</text>
<text x="615.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Один кабель до ПК — і джерело, і вимір.</text>
<rect x="10.0" y="344.0" width="800.0" height="46.0" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="410.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">⚠ НЕ вмикати в розрив після USB-роз'єму DevKit — USB-UART міст і LDO домішують своє споживання</text>
<text x="410.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ вмикати в розрив батарейного живлення або в спеціальний jumper розриву струму</text>
</svg>