<text x="150.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">період</text>
<line x1="230.0" y1="294.0" x2="440.0" y2="294.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="335.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">= ВЕРХ × тік</text>
<text x="480.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВЕРХ (значення перезавантаження) і визначає період: менший ВЕРХ — частіше, більший — рідше.</text>
<text x="480.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Так дістають рівні події будь-якого періоду — серце «годинника» в коді.</text>
