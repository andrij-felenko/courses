<rect x="470.0" y="110.0" width="380.0" height="170.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="660.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як це працює:</text>
<text x="490.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• планую подію через Δ →</text>
<text x="508.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">кладу в слот (зараз + Δ)</text>
<text x="490.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• кожен тік — стрілка на 1 слот</text>
<text x="490.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  уперед і запускає ВЕСЬ цей слот</text>
<text x="490.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Торкаємось лише таймерів «на зараз»,</text>
<text x="490.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">а не всіх щотіку.</text>
