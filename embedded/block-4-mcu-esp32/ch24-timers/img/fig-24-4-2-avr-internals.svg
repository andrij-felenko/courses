<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як усередині AVR (Arduino Uno): переривання щомілісекунди</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">малий таймер переповнюється ~раз на мс і ISR додає 1 до лічильника мілісекунд</text>
<line x1="80.0" y1="200.0" x2="560.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<polyline points="80.0,200.0 180.0,120.0 180.0,200.0 320.0,120.0 320.0,200.0 460.0,120.0 460.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Timer0</text>
<circle cx="180.0" cy="120.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="180.0" y1="120.0" x2="180.0" y2="80.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<circle cx="320.0" cy="120.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="320.0" y1="120.0" x2="320.0" y2="80.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<circle cx="460.0" cy="120.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="460.0" y1="120.0" x2="460.0" y2="80.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="320.0" y="66.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ переповнення ~кожні 1.024 мс</text>
<rect x="600.0" y="150.0" width="300.0" height="56.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="750.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ISR переповнення:</text>
<text x="750.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ms_count++  (лічильник мс)</text>
<line x1="560.0" y1="110.0" x2="600.0" y2="160.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<rect x="250.0" y="270.0" width="460.0" height="90.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="480.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">millis() → повертає ms_count</text>
<text x="480.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">micros() → ms_count×1000 + (Timer0 × 4)</text>
<text x="480.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(на Uno micros має крок ~4 мкс — обмеження передільника)</text>
</svg>
