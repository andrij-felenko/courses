<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішній RTC ESP32 проти зовнішнього модуля</text>
<rect x="60.0" y="80.0" width="370.0" height="200.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="245.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішній RTC ESP32</text>
<text x="86.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">йде в глибокому сні ✓</text>
<text x="86.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">без батарейки → втрачає час</text>
<text x="86.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">   при повному вимкненні</text>
<text x="86.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">помітний дрейф ✗</text>
<rect x="470.0" y="80.0" width="370.0" height="200.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="655.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Зовнішній модуль (DS3231-клас)</text>
<text x="496.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">власна батарейка → час живе роками ✓</text>
<text x="496.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">термокомпенсація → малий дрейф ✓</text>
<text x="496.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">є alarm-вихід (будить за розкладом)</text>
<text x="496.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">трохи деталей і місця — ціна точності</text>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Потрібен точний, тривкий час — бери зовнішній DS3231; досить пережити сон — вистачить внутрішнього.</text>
</svg>
