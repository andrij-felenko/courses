<text x="195.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">год.</text>
<polyline points="270.0,190.0 270.0,160.0 290.0,190.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="290.0" y1="158.0" x2="290.0" y2="182.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="290.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">год.</text>
<polyline points="365.0,190.0 365.0,160.0 385.0,190.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="385.0" y1="158.0" x2="385.0" y2="182.0" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#aGreen)"/>
<text x="385.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">год.</text>
<text x="255.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лічильник не доходить до 0 → усе гаразд</text>
<rect x="500.0" y="84.0" width="410.0" height="150.0" rx="12" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="705.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Завис: годувати нікому</text>
<line x1="520.0" y1="190.0" x2="890.0" y2="190.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<polyline points="530.0,190.0 530.0,160.0 570.0,190.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="550.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">год.</text>
<polyline points="570.0,185.0 840.0,165.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="740.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">не годують…</text>
<circle cx="850.0" cy="165.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="850.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0 → СКИД</text>
<text x="705.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лічильник доходить до 0 → чип перезавантажується</text>
<rect x="150.0" y="300.0" width="660.0" height="70.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Погодувати» (feed / kick) = скинути лічильник watchdog назад до старту.</text>
<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Поки програма крутиться — вона годує; зависла — годувати нікому, і чип сам рятує себе скидом.</text>
</svg>
