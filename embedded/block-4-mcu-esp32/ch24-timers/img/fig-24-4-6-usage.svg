<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як вживати: мітка, інтервал, тайм-аут</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три типові прийоми — і скрізь час порівнюють ВІДНІМАННЯМ (стійко до переповнення)</text>
<rect x="50.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="190.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Мітка часу</text>
<line x1="70.0" y1="134.0" x2="310.0" y2="134.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<rect x="70.0" y="150.0" width="240.0" height="32.0" rx="5" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="190" y="171" font-family="Consolas, monospace" font-size="11.5" fill="#7ee0a0" text-anchor="middle">t = micros();</text>
<text x="190.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">запам'ятати мить події</text>
<rect x="340.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="480.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Інтервал</text>
<line x1="360.0" y1="134.0" x2="600.0" y2="134.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<rect x="360.0" y="150.0" width="240.0" height="32.0" rx="5" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="480" y="171" font-family="Consolas, monospace" font-size="11.5" fill="#7ee0a0" text-anchor="middle">dt = micros() − t0;</text>
<text x="480.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">скільки тривало</text>
<rect x="630.0" y="90.0" width="280.0" height="150.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="770.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Тайм-аут</text>
<line x1="650.0" y1="134.0" x2="890.0" y2="134.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<rect x="650.0" y="150.0" width="240.0" height="32.0" rx="5" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="770" y="171" font-family="Consolas, monospace" font-size="11.5" fill="#7ee0a0" text-anchor="middle">if (millis() − t0 &gt; LIMIT)</text>
<text x="770.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чи не задовго чекаємо</text>
<rect x="150.0" y="300.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усі три безпечні до переповнення, бо працюють із РІЗНИЦЕЮ часів, а не з абсолютом.</text>
<text x="480.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">millis()/micros() — дешеві: викликай скільки треба, вони лише читають лічильник.</text>
</svg>
