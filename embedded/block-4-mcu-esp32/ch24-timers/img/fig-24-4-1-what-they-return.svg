<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">millis() і micros(): скільки минуло ВІД СТАРТУ чипа</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">не «котра година», а лічильник часу, що пішов із нуля в мить увімкнення</text>
<circle cx="90.0" cy="150.0" r="8.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="90.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">увімкнення</text>
<text x="90.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(t = 0)</text>
<line x1="90.0" y1="150.0" x2="860.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="321.0" y1="145.0" x2="321.0" y2="155.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="513.5" y1="145.0" x2="513.5" y2="155.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="706.0" y1="145.0" x2="706.0" y2="155.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="820.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">час →</text>
<rect x="330.0" y="210.0" width="130.0" height="50.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="395.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">millis()</text>
<text x="395.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= мс від старту</text>
<rect x="560.0" y="210.0" width="130.0" height="50.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="625.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">micros()</text>
<text x="625.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= мкс від старту</text>
<line x1="395.0" y1="150.0" x2="395.0" y2="210.0" stroke="#1f8a3b" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="625.0" y1="150.0" x2="625.0" y2="210.0" stroke="#1f47b5" stroke-width="1.2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обидві просто читають апаратний лічильник часу й переводять його в мс або мкс.</text>
<text x="470.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Скинеться лічильник лише при перезавантаженні — тоді відлік знову з нуля.</text>
</svg>
