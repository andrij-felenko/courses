<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Проблема: прошивка зависла — і пристрій мертвий</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вічний цикл, глухий кут, очікування пристрою, що не відповідає — і програма стоїть назавжди</text>
<text x="64.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">loop()</text>
<line x1="120.0" y1="180.0" x2="320.0" y2="180.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<circle cx="330.0" cy="180.0" r="8.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="330.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тут завис</text>
<path d="M 360 180 a 40 40 0 1 1 -1 0" fill="none" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="400.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">крутиться вічно</text>
<text x="400.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(або стоїть)</text>
<rect x="560.0" y="130.0" width="320.0" height="110.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="720.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наслідки:</text>
<text x="576.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не реагує ні на що</text>
<text x="576.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• допомогти може лише перезапуск</text>
<text x="576.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• а пристрій часто НЕДОСЯЖНИЙ</text>
<rect x="150.0" y="310.0" width="640.0" height="50.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Датчик на горі, у стіні, в космосі — руками не перезавантажиш. Потрібен автоматичний рятівник.</text>
</svg>
