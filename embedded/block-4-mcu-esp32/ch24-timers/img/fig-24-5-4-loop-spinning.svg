<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">без блокувань цикл блискавичний; кожен прохід перевіряє, що «настало», й рухається далі</text>
