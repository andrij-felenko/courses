<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410">
<rect width="940" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Щоб міряти час, потрібен рівний «тік»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">годинник — це лічильник однакових поштовхів; що їх більше за секунду й що вони стабільніші, то точніший час</text>
<rect x="60.0" y="90.0" width="380.0" height="250.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Маятник (~1927 і давніше)</text>
<line x1="250.0" y1="140.0" x2="250.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="250.0" y1="140.0" x2="210.0" y2="230.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="206.0" cy="240.0" r="14.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<line x1="250.0" y1="140.0" x2="290.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<circle cx="294.0" cy="240.0" r="14.0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="250.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">≈ 1 тік на секунду</text>
<text x="250.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">залежить від тяжіння, тепла, руху</text>
<rect x="500.0" y="90.0" width="380.0" height="250.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="690.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кварц (від 1927)</text>
<polyline points="560.0,230.0 590.0,200.0 620.0,230.0 650.0,200.0 680.0,230.0 710.0,200.0 740.0,230.0 770.0,200.0 800.0,230.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="690.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тисячі-мільйони тіків на секунду</text>
<text x="690.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">майже не «пливе» — дуже стабільний</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хороший тік = частий + стабільний. Уся історія точного часу — пошук кращого тіку.</text>
<text x="470.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Кварц виявився надзвичайно хорошим — і досі тікає в кожному чипі.</text>
</svg>
