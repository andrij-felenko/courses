<text x="505.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ від'ємне число</text>
<text x="505.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стрибок у 13 грудня 1901</text>
<text x="450.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Настане це 19 січня 2038, о 03:14:07 UTC. Лік: перейти на 64-бітний time_t —</text>
<text x="450.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тоді переповнення відсувається на ~292 мільярди років.</text>
<rect x="150.0" y="246.0" width="600.0" height="38.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Найважче полагодити вбудовані й застарілі 32-бітні системи — саме такі, як у цьому курсі.</text>
