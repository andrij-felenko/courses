<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2038: годинник самих машин переповнюється</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знаковий 32-бітний відлік секунд від 1970 дійде до межі</text>
<rect x="70.0" y="90.0" width="250.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="195.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2 147 483 647</text>
<text x="195.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">макс. знакового 32-біт</text>
<line x1="320.0" y1="125.0" x2="380.0" y2="125.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="350.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">+1 с</text>
