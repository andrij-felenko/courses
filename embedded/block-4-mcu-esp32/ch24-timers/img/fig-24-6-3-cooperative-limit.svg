<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Межа кооперативності: довга задача затримує всіх</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">планувальник на millis НЕ витісняє — кожна задача має добігти сама, тож має бути короткою</text>
<line x1="90.0" y1="170.0" x2="880.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="140.0" y="154.0" width="90.0" height="32.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="185.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A коротка</text>
<rect x="250.0" y="154.0" width="320.0" height="32.0" rx="5" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="410.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">B — ДОВГА (блокує)</text>
<rect x="590.0" y="154.0" width="90.0" height="32.0" rx="5" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="635.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<circle cx="330.0" cy="250.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="330.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">C мала спрацювати тут</text>
<line x1="330.0" y1="244.0" x2="330.0" y2="186.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<line x1="330.0" y1="240.0" x2="590.0" y2="240.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="620.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a6a14" text-anchor="start" font-weight="bold" font-style="normal">…а дочекалась аж тут (B тримала час)</text>
<rect x="150.0" y="300.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодна задача нікого не перебиває — лише чемно чекає черги. Тому кожна МУСИТЬ бути</text>
<text x="480.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">короткою (як ISR §23.3): одна «жадібна» задача псує таймінг усіх інших.</text>
</svg>
