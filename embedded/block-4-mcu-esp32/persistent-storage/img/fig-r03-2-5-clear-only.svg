<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хитрість зі стирання-в-один-бік: дописувати без стирання</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки в сторінці лишаються одиниці, можна гасити нові біти — і це безкоштовно</text>
<rect x="70.0" y="100.0" width="780.0" height="140.0" rx="12" fill="#fbfdff" stroke="#1b1b1b" stroke-width="2"/>
<text x="90.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Стерта сторінка (усе 1) — пишемо записи один за одним, гасячи біти:</text>
<rect x="96.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="171.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">запис A</text>
<rect x="254.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="329.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">A — недійсний</text>
<rect x="412.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="487.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">запис B</text>
<rect x="570.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="645.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">запис C</text>
<rect x="728.0" y="150.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="808.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">вільно (усе 1)</text>
<text x="90.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">«недійсний» = погасили ще один біт-прапорець (1→0), стирати не довелося.</text>
<rect x="120.0" y="268.0" width="680.0" height="92.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="460.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">Звідси два прийоми, що ховаються в NVS і логах:</text>
<text x="460.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• новий запис — ДОПИСати в незаймане місце (а не переписувати старе);</text>
<text x="460.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• скасувати старий — погасити його прапорець; стерти лише коли сторінка повна.</text>
<text x="460.0" y="351.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Так стирання — рідкісне, а отже й знос менший (§4.3.3, §4.3.5).</text>
</svg>
