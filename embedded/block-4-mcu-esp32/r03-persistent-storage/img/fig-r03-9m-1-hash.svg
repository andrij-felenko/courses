<text x="480.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a6d1a" text-anchor="middle" font-weight="bold" font-style="normal">7A3F…  (короткий)</text>
<text x="70.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Зміна навіть на біт → геть інший відбиток:</text>
