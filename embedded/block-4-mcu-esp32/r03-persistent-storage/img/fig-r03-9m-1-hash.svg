<text x="300.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→  C19B 04E7 …  (одна крапка!)</text>
<rect x="70.0" y="264.0" width="740.0" height="34.0" rx="8" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Однобічна (з відбитка не відновити дані) і без колізій (двоє різних з тим самим відбитком — практично неможливо).</text>
