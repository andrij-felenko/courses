  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки протягне Flash: три важелі</text>
<text x="440.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">строк служби росте з ресурсом, із вирівнюванням — і падає з частотою записів</text>
<rect x="250.0" y="92.0" width="380.0" height="70.0" rx="12" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="310.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<text x="345.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="430.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">E · N</text>
<line x1="390.0" y1="132.0" x2="470.0" y2="132.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="430.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">u</text>
<text x="560.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(днів)</text>
<text x="120.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<text x="150.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— ресурс: циклів стирання на сектор (напр. 100 000)</text>
<text x="120.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<text x="150.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— вирівнювання: скільки секторів ділять знос</text>
<text x="120.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">u</text>
<text x="150.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— частота: стирань на день (більша — гірше)</text>
<text x="120.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T</text>
<text x="150.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">— строк служби, що з цього виходить</text>
<text x="440.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Побільшити E чи N — або поменшити u — і строк служби росте.</text>
</svg>
