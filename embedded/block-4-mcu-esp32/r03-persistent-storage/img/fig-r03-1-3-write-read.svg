<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому їм потрібні різні сховища: пишуть і читають по-різному</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">частота запису й читання та зростання — ось що вирішує вибір механізму</text>
<text x="70.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">рід даних</text>
<text x="360.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">як часто ПИШЕ</text>
<text x="560.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">як часто ЧИТАЄ</text>
<text x="760.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">росте?</text>
<line x1="50.0" y1="114.0" x2="850.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<rect x="50.0" y="138.0" width="800.0" height="54.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="70.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Калібрування</text>
<text x="360.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">раз (write-once)</text>
<text x="560.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">постійно</text>
<text x="760.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ні (дрібне)</text>
<rect x="50.0" y="202.0" width="800.0" height="54.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="70.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Конфігурація</text>
<text x="360.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зрідка</text>
<text x="560.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">часто</text>
<text x="760.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ні (мале)</text>
<rect x="50.0" y="266.0" width="800.0" height="54.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="70.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Логи</text>
<text x="360.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">часто (дописує)</text>
<text x="560.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зрідка</text>
<text x="760.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ТАК, весь час</text>
<rect x="120.0" y="344.0" width="660.0" height="40.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й різні сховища: дрібне «ключ–значення» — одне, журнал, що росте, — інше.</text>
</svg>
