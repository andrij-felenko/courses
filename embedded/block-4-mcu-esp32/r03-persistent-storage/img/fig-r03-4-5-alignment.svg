<text x="450.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інакше, стираючи один розділ, зачепив би сусідній. Тому межі вирівнюють на 4 КБ</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(а app-розділи — навіть на 64 КБ).</text>
