<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один прийом: пиши нове поряд → перемкни одним кроком → май запас на відкат.</text>
