<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна безпечних оновлень: місце</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два повні слоти — отже, прошивка вміщається щонайбільше у половину місця під код</text>
<text x="140.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">область під код:</text>
<rect x="140.0" y="124.0" width="300.0" height="54.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="290.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ota_0  (половина)</text>
<rect x="450.0" y="124.0" width="300.0" height="54.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="600.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ota_1  (половина)</text>
<rect x="150.0" y="210.0" width="600.0" height="64.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">За надійне оновлення платять половиною місця під код (§4.3.4).</text>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому, плануючи Flash, одразу закладайте місце під ДВА образи.</text>
