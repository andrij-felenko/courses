<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: термостат — що зберігати, а що ні</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">переживати вимкнення мусить не все — лише те, чого не відновити заново</text>
<rect x="330.0" y="92.0" width="260.0" height="70.0" rx="12" fill="#f4f7fb" stroke="#1b1b1b" stroke-width="2"/>
<text x="460.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Термостат</text>
<text x="460.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що тримати в голові?</text>
<text x="250.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ЗБЕРЕГТИ (переживає вимкнення):</text>
<circle cx="266.0" cy="222.0" r="6.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="284.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">задана t° = 22°</text>
<text x="560.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">(конфіг)</text>
<circle cx="266.0" cy="256.0" r="6.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="284.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поправка давача −0.4°</text>
<text x="560.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">(калібрування)</text>
<circle cx="266.0" cy="290.0" r="6.0" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="284.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">журнал збоїв</text>
<text x="560.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">(лог)</text>
<rect x="250.0" y="332.0" width="420.0" height="50.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="460.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">НЕ зберігати: поточна t° = 21.7° — її щоразу</text>
<text x="460.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">міряють наново, тож тримати її у Flash нема сенсу.</text>
</svg>
