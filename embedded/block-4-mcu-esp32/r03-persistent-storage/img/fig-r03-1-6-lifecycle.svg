<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коли що пишуть і читають — за все життя пристрою</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у кожного роду даних — свій момент запису, а читають їх у роботі</text>
<line x1="70.0" y1="150.0" x2="870.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="150.0" cy="150.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="150.0" y1="144.0" x2="150.0" y2="116.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="55.0" y="64.0" width="190.0" height="50.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="150.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Завод</text>
<text x="150.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">калібрування ✍</text>
<circle cx="370.0" cy="150.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<line x1="370.0" y1="144.0" x2="370.0" y2="116.0" stroke="#1f47b5" stroke-width="1.4" stroke-linecap="round"/>
<rect x="275.0" y="64.0" width="190.0" height="50.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="370.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Перший запуск</text>
<text x="370.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">конфіг ✍</text>
<circle cx="590.0" cy="150.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<line x1="590.0" y1="144.0" x2="590.0" y2="116.0" stroke="#caa24a" stroke-width="1.4" stroke-linecap="round"/>
<rect x="495.0" y="64.0" width="190.0" height="50.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="590.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Робота</text>
<text x="590.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усе читають; лог ✍</text>
<circle cx="820.0" cy="150.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="820.0" y1="144.0" x2="820.0" y2="116.0" stroke="#c0271e" stroke-width="1.4" stroke-linecap="round"/>
<rect x="725.0" y="64.0" width="190.0" height="50.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="820.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Збій / сервіс</text>
<text x="820.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лог читають</text>
<rect x="150.0" y="220.0" width="640.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="470.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Калібрування пишуть РАЗ (на заводі), конфіг — при налаштуванні,</text>
<text x="470.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лог дописують у роботі. А читають їх усі — поки пристрій живе.</text>
</svg>
