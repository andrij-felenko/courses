<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304">
<rect width="900" height="304" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як цим користуються: відкрити → читати/писати → закріпити</text>
<rect x="40.0" y="110.0" width="170.0" height="76.0" rx="10" fill="#fbfbff" stroke="#1b1b1b" stroke-width="2"/>
<text x="125.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">open("app")</text>
<text x="125.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відкрити простір</text>
<rect x="260.0" y="110.0" width="170.0" height="76.0" rx="10" fill="#fbfbff" stroke="#1b1b1b" stroke-width="2"/>
<text x="345.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">get / set</text>
<text x="345.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прочитати чи задати ключ</text>
<rect x="480.0" y="110.0" width="170.0" height="76.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
<text x="565.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">commit()</text>
<text x="565.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">записати у Flash</text>
<rect x="700.0" y="110.0" width="170.0" height="76.0" rx="10" fill="#fbfbff" stroke="#1b1b1b" stroke-width="2"/>
<text x="785.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">close()</text>
<text x="785.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відпустити сховище</text>
<line x1="210.0" y1="148.0" x2="260.0" y2="148.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="430.0" y1="148.0" x2="480.0" y2="148.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="650.0" y1="148.0" x2="700.0" y2="148.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<text x="450.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">до commit зміни живуть у RAM; саме commit робить їх постійними —</text>
<text x="450.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">забудеш його, і після перезавантаження побачиш старе значення</text>
</svg>
