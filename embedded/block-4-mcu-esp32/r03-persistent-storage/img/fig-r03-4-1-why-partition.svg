<text x="100.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.0" fill="#9a9aa0" text-anchor="middle" font-weight="bold" font-style="normal">Завантажувач</text>
<rect x="140.0" y="120.0" width="56.0" height="80.0" rx="4" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="168.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.0" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Таблиця</text>
<rect x="196.0" y="120.0" width="78.0" height="80.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
