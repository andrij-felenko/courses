<text x="387.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Додаток</text>
<rect x="500.0" y="120.0" width="196.0" height="80.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="598.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">OTA-слот</text>
<rect x="696.0" y="120.0" width="164.0" height="80.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="778.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Файлова сист.</text>
<text x="60.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0x0</text>
<text x="860.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">кінець Flash</text>
<rect x="150.0" y="228.0" width="620.0" height="84.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="460.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хто знає, де що лежить? Маленька ТАБЛИЦЯ РОЗДІЛІВ на початку Flash —</text>
<text x="460.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">карта, що каже: ось тут завантажувач, тут ваш додаток, тут NVS, тут файли.</text>
<text x="460.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Без неї чіп не знав би навіть, звідки запускати вашу програму.</text>
