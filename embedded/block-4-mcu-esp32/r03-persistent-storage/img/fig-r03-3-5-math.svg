<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порахуймо строк служби</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вирівнювання зносу множить ресурс на кількість секторів — і це величезна різниця</text>
<rect x="180.0" y="86.0" width="540.0" height="46.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">строк = endurance × сектори ÷ записів за добу</text>
<rect x="80.0" y="156.0" width="740.0" height="46.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="100.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Без вирівнювання (1 сектор)</text>
<text x="430.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">100 000 ÷ (10/добу)</text>
<text x="700.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">≈ 27 років… для 1 байта</text>
<rect x="80.0" y="212.0" width="740.0" height="46.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="100.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">…але всі записи в нього:</text>
<text x="430.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">при 10 записах/хв</text>
<text x="700.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">≈ кілька місяців — і смерть</text>
<rect x="80.0" y="268.0" width="740.0" height="46.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="100.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">З вирівнюванням (×256 секторів)</text>
<text x="430.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">100 000 × 256 ÷ записи</text>
<text x="700.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">роки навіть під шквалом</text>
<text x="450.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: частота записів вирішує все. Рідше пишеш — довше живе, хоч скільки секторів.</text>
</svg>
