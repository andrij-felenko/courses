<text x="82.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• поправка давача −0.4°</text>
<text x="94.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">(калібрування)</text>
<text x="82.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• журнал помилок</text>
<text x="94.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">(лог)</text>
<text x="460.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">⚡</text>
<text x="460.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вимк / увімк</text>
<line x1="405.0" y1="208.0" x2="515.0" y2="208.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="520.0" y="86.0" width="340.0" height="300.0" rx="12" fill="#fffafa" stroke="#c0271e" stroke-width="2"/>
