<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому без постійного сховища пристрій безпорадний</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">SRAM забуває все при вимкненні — та не все можна втрачати</text>
<rect x="60.0" y="86.0" width="340.0" height="300.0" rx="12" fill="#fbfdfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="230.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">До вимкнення (у SRAM)</text>
<text x="82.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• поточне значення 21.7°</text>
<text x="94.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">(transient)</text>
