<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="50.0" width="370.0" height="320.0" rx="10" fill="#fff8f0" stroke="#e67e22" stroke-width="2.0"/>
<text x="205.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e67e22" text-anchor="middle" font-weight="700">ДРУК (Serial.print)</text>
<circle cx="130.0" cy="185.0" r="28.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="130.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CPU</text>
<line x1="158.0" y1="185.0" x2="230.0" y2="185.0" stroke="#e67e22" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="270.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle">біжить →</text>
<line x1="205.0" y1="215.0" x2="205.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="158.7" y="255.5" width="92.5" height="33.0" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="205.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">? де ти ?</tspan></text>
<text x="205.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">відповідь — лише те,</text>
<text x="205.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">що встиг сказати</text>
<rect x="132.3" y="342.5" width="145.4" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="205.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="205.0" dy="0.0">друк змінює таймінг!</tspan></text>
<rect x="430.0" y="50.0" width="370.0" height="320.0" rx="10" fill="#f0f8ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="615.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ВІДЛАГОДЖУВАЧ (halt)</text>
<circle cx="530.0" cy="185.0" r="28.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="530.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">CPU</text>
<rect x="487.8" y="223.5" width="84.5" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">⏸ завмер</tspan></text>
<text x="650.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">читаємо:</text>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• будь-який регістр</text>
<text x="650.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• будь-яку пам'ять</text>
<text x="650.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• весь стек викликів</text>
<rect x="516.3" y="342.5" width="197.3" height="31.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/><text x="615.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">зупинено час — читаємо все</tspan></text>
<line x1="408.0" y1="60.0" x2="408.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,4"/>
<text x="410.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рис. 4.14.1.1. Друк опитує на ходу; відлагоджувач зупиняє час і оглядає нерухоме.</text>
</svg>