<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="50.0" width="280.0" height="280.0" rx="10" fill="#f0f4fc" stroke="#2457d6" stroke-width="2.0"/>
<text x="170.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">JTAG</text>
<text x="170.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">IEEE 1149.1</text>
<text x="170.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">TCK — такт</text>
<text x="170.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">TMS — вибір стану</text>
<text x="170.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle">TDI — вхід даних</text>
<text x="170.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">TDO — вихід даних</text>
<text x="170.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">(+TRST — скидання)</text>
<text x="170.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">4–5 ліній</text>
<rect x="340.0" y="50.0" width="220.0" height="280.0" rx="10" fill="#f0faf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">SWD</text>
<text x="450.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ARM Serial Wire</text>
<text x="450.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="450.0" dy="0.0">SWCLK — такт</tspan></text>
<text x="450.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="450.0" dy="0.0">SWDIO — дані</tspan><tspan x="450.0" dy="16.9">(двоспрямовані)</tspan></text>
<text x="450.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2 лінії</text>
<rect x="590.0" y="100.0" width="160.0" height="180.0" rx="10" fill="#fff8e1" stroke="#e67e22" stroke-width="2.0"/>
<text x="670.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Debug</tspan><tspan x="670.0" dy="16.9">Core</tspan><tspan x="670.0" dy="16.9">(ядро чипа)</tspan></text>
<line x1="310.0" y1="190.0" x2="590.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="210.0" x2="590.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="138.8" y="336.5" width="402.5" height="31.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/><text x="340.0" y="355.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="340.0" dy="0.0">SWD — економний транспорт для дрібних корпусів, сила та сама.</tspan></text>
