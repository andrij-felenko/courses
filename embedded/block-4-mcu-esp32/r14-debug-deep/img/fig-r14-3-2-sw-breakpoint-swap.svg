<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="80.0" width="110.0" height="50.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="95.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x2000</text>
<text x="95.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">MOV r0,#1</text>
<rect x="160.0" y="80.0" width="110.0" height="50.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="215.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x2002</text>
<text x="215.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ADD r1,r0</text>
<rect x="280.0" y="80.0" width="110.0" height="50.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="335.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x2004</text>
<text x="335.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">▶ BKPT</text>
<rect x="400.0" y="80.0" width="110.0" height="50.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="455.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x2006</text>
<text x="455.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">STR r1,[r2]</text>
<rect x="520.0" y="80.0" width="110.0" height="50.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="575.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x2008</text>
<text x="575.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">BL func</text>
<rect x="641.8" y="37.3" width="76.4" height="45.3" rx="6" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5"/><text x="680.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle"><tspan x="680.0" dy="0.0">оригінал:</tspan><tspan x="680.0" dy="14.3">BL crypto</tspan></text>
<line x1="400.0" y1="80.0" x2="650.0" y2="60.0" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="400.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Відлагоджувач підмінює інструкцію на BKPT</text>
<text x="400.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Ядро доходить → пастка спрацьовує → halt</text>
<text x="400.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">3. Відлагоджувач відновлює оригінальну інструкцію</text>
<text x="400.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">4. Продовжуємо виконання зі справжньою командою</text>
<rect x="258.3" y="255.2" width="283.3" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="400.0" dy="0.0">У Flash підмінити байт «на льоту» не можна</tspan><tspan x="400.0" dy="14.3">(треба стерти-тоді-писати — §4.3.2)</tspan><tspan x="400.0" dy="14.3">→ потрібні апаратні брейкпоінти!</tspan></text>
<rect x="252.1" y="334.5" width="295.9" height="31.0" rx="6" fill="#d5e8d4" stroke="#27ae60" stroke-width="1.2"/><text x="400.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="400.0" dy="0.0">У RAM — програмних брейків скільки завгодно.</tspan></text>
<text x="390.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рис. 4.14.3.2. Програмний брейк підміняє інструкцію на пастку; у Flash не працює.</text>
</svg>