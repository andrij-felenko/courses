<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки беруть опорну напругу: три джерела</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від дешевого й грубого до точного й дорожчого</text>
<rect x="60.0" y="92.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="200.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Живлення (VDD)</text>
<line x1="80.0" y1="134.0" x2="320.0" y2="134.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="200.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">просто беруть напругу живлення</text>
<text x="82.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ дешево, нічого не треба</text>
<text x="82.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− шумить і пливе</text>
<text x="200.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">грубо</text>
<rect x="340.0" y="92.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішнє джерело</text>
<line x1="360.0" y1="134.0" x2="600.0" y2="134.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="480.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вбудований bandgap ≈ 1.1 В</text>
<text x="362.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ стабільніше, на чипі</text>
<text x="362.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− точність помірна</text>
<text x="480.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">середньо</text>
<rect x="620.0" y="92.0" width="280.0" height="200.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="760.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Зовнішнє прецизійне</text>
<line x1="640.0" y1="134.0" x2="880.0" y2="134.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="760.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">окрема ІС (TL431, REFxx)</text>
<text x="642.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ найточніше й стабільне</text>
<text x="642.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− дорожче, ще деталь</text>
<text x="760.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">точно</text>
<line x1="70.0" y1="330.0" x2="890.0" y2="330.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="80.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дешево / грубо</text>
<text x="890.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">дорого / точно</text>
</svg>
