<text x="795.0" y="242.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">24-бітний АЦП</text>
<text x="795.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на вашій платі:</text>
<text x="795.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ADS1115, ADS1232,</text>
<text x="795.0" y="284.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ΔΣ-клас</text>
<text x="64.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1940</text>
<text x="910.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2020+</text>
<rect x="89.6" y="415.0" width="800.9" height="30.0" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Перемогла не перша ідея — перемогла та, що вдало зібрала чужі шматки (дельту Делорена + петлю Катлера + інтегратор Іносе) в один кремній.</tspan></text>
