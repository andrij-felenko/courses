<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дельта-сигма народжувалася ~36 років і в кількох країнах</text>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перемогла не перша ідея, а та архітектура, що зібрала чужі шматки в робочу систему</text>
<line x1="60.0" y1="200.0" x2="920.0" y2="200.0" stroke="#6b7280" stroke-width="2.5"/>
<line x1="918.0" y1="200.0" x2="920.0" y2="200.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="123.0" y1="194.0" x2="123.0" y2="135.0" stroke="#1f47b5" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="123.0" cy="200.0" r="7.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="2.0"/>
<rect x="75.1" y="85.3" width="95.8" height="39.3" rx="6" fill="#f0f4ff" stroke="#1f47b5" stroke-width="1.8"/><text x="123.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="123.0" dy="0.0">1946</tspan><tspan x="123.0" dy="14.3">ITT, Франція</tspan></text>
<text x="123.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Делорен, Ван Мірло,</text>
<text x="123.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Державич — патент</text>
<text x="123.0" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дельта-модуляції</text>
<text x="123.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(французьке бюро)</text>
<line x1="186.0" y1="206.0" x2="186.0" y2="265.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="186.0" cy="200.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="141.5" y="275.4" width="89.0" height="39.3" rx="6" fill="#fffbea" stroke="#27ae60" stroke-width="1.8"/><text x="186.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">1952</tspan><tspan x="186.0" dy="14.3">Philips, НЛ</tspan></text>
<text x="186.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">де Ягер:</text>
<text x="186.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">перший строгий</text>
<text x="186.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">аналіз і межі</text>
<text x="186.0" y="277.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дельта-модуляції</text>
<line x1="207.0" y1="194.0" x2="207.0" y2="135.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="207.0" cy="200.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="152.3" y="85.3" width="109.5" height="39.3" rx="6" fill="#f0f4ff" stroke="#c0392b" stroke-width="1.8"/><text x="207.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="207.0" dy="0.0">1954</tspan><tspan x="207.0" dy="14.3">Bell Labs, США</tspan></text>
<text x="207.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Катлер:</text>
<text x="207.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зворотний зв'язок</text>
<text x="207.0" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">навколо грубого</text>
<text x="207.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">квантувача</text>
<text x="207.0" y="200.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(зерно «сигми»)</text>
<line x1="291.0" y1="206.0" x2="291.0" y2="265.0" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="291.0" cy="200.0" r="7.0" fill="#e67e22" stroke="#e67e22" stroke-width="2.0"/>
<rect x="239.7" y="275.4" width="102.7" height="39.3" rx="6" fill="#fffbea" stroke="#e67e22" stroke-width="1.8"/><text x="291.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="291.0" dy="0.0">1962</tspan><tspan x="291.0" dy="14.3">Токіо, Японія</tspan></text>
<text x="291.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Іносе, Ясуда,</text>
<text x="291.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Муракамі:</text>
<text x="291.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">форвардний інтегратор</text>
<text x="291.0" y="277.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">+ назва Δ-Σ</text>
<line x1="532.5" y1="194.0" x2="532.5" y2="135.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="532.5" cy="200.0" r="7.0" fill="#8e44ad" stroke="#8e44ad" stroke-width="2.0"/>
<rect x="491.4" y="85.3" width="82.2" height="39.3" rx="6" fill="#f0f4ff" stroke="#8e44ad" stroke-width="1.8"/><text x="532.5" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="532.5" dy="0.0">~1980-ті</tspan><tspan x="532.5" dy="14.3">КМОН-хвиля</tspan></text>
<text x="532.5" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Switched-capacitor</text>
<text x="532.5" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">інтегратори — цифрова</text>
<text x="532.5" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">реінкарнація</text>
<text x="532.5" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дельта-сигми</text>
