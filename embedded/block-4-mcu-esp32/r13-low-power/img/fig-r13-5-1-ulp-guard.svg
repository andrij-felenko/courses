<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="680" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ULP як сторож порога: ядро прокидається лише на подію</text>
<rect x="213.1" y="43.0" width="253.7" height="49.9" rx="6" fill="#e8f8f7" stroke="#1a7a73" stroke-width="2.0"/><text x="340.0" y="64.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a7a73" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">RTC-таймер → ULP прокидається</tspan><tspan x="340.0" dy="16.9">(кожні X мс)</tspan></text>
<line x1="340.0" y1="100.0" x2="340.0" y2="132.0" stroke="#1a7a73" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="241.1" y="133.1" width="197.8" height="49.9" rx="6" fill="#e8f8f7" stroke="#1a7a73" stroke-width="2.0"/><text x="340.0" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a7a73" text-anchor="middle"><tspan x="340.0" dy="0.0">Читає RTC-АЦП / RTC-GPIO</tspan><tspan x="340.0" dy="16.9">(вимір у мкс)</tspan></text>
<line x1="340.0" y1="190.0" x2="340.0" y2="222.0" stroke="#1a7a73" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="255.9" y="223.1" width="168.2" height="49.9" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="2.0"/><text x="340.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#f39c12" text-anchor="middle"><tspan x="340.0" dy="0.0">Порівняти з порогом:</tspan><tspan x="340.0" dy="16.9">v ≤ поріг?</tspan></text>
<line x1="240.0" y1="248.0" x2="90.0" y2="248.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">ТАК (норма)</text>
<rect x="39.2" y="276.6" width="101.5" height="66.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="90.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="90.0" dy="0.0">Записати в</tspan><tspan x="90.0" dy="16.9">RTC-пам'ять</tspan><tspan x="90.0" dy="16.9">уйти у halt</tspan></text>
<line x1="90.0" y1="355.0" x2="90.0" y2="390.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="35.7" y="385.1" width="108.7" height="49.9" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.0"/><text x="90.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Велике ядро</tspan><tspan x="90.0" dy="16.9">СПИТЬ</tspan></text>
<text x="90.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">I ≈ мкА</text>
<line x1="440.0" y1="248.0" x2="580.0" y2="248.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">НІ (поріг!)</text>
<rect x="525.7" y="285.1" width="108.7" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="580.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ULP будить</tspan><tspan x="580.0" dy="16.9">велике ядро</tspan></text>
<line x1="580.0" y1="355.0" x2="580.0" y2="390.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="509.6" y="385.1" width="140.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="580.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Ядро активне</tspan><tspan x="580.0" dy="16.9">передає тривогу</tspan></text>
<text x="580.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I ≈ мА (коротко!)</text>
