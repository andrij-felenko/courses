  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кварцовий генератор: кристал «співає» на точній частоті</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Волтер Кади, 1921 — схема, що підтримує вібрацію кварцу на його власній частоті</text>
<text x="180.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">як камертон:</text>
<line x1="160.0" y1="130.0" x2="160.0" y2="220.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<line x1="200.0" y1="130.0" x2="200.0" y2="220.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<line x1="160.0" y1="220.0" x2="200.0" y2="220.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<line x1="180.0" y1="220.0" x2="180.0" y2="260.0" stroke="#9a9aa0" stroke-width="4" stroke-linecap="round"/>
<text x="180.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">своя точна нота</text>
<text x="180.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(стала частота)</text>
<rect x="360.0" y="150.0" width="120.0" height="70.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="420.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кварц</text>
<text x="420.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">резонатор</text>
<rect x="560.0" y="150.0" width="140.0" height="70.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="630.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">генератор</text>
<text x="630.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(підживлює вібрацію)</text>
<line x1="480.0" y1="172.0" x2="560.0" y2="172.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="560.0" y1="200.0" x2="480.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="520.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коливання</text>
<text x="520.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">поштовх</text>
<line x1="700.0" y1="185.0" x2="790.0" y2="185.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<polyline points="795.0,185.0 805.0,168.0 815.0,202.0 825.0,168.0 835.0,202.0 845.0,168.0 855.0,202.0 865.0,185.0" fill="none" stroke="#1f8a3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="845.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">рівний сигнал</text>
<text x="845.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">точної частоти</text>
<rect x="120.0" y="330.0" width="700.0" height="50.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Частота кварцу задана його розміром і огранкою — і майже не «пливе».</text>
<text x="470.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому кварцовий генератор — надійне джерело точного «тіку» для будь-якої електроніки.</text>
</svg>
