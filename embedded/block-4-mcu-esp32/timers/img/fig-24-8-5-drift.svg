<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дрейф: кожен годинник бреше потроху</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">невелика похибка ходу накопичується — і час поволі «розходиться» зі справжнім</text>
<line x1="90.0" y1="150.0" x2="810.0" y2="150.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="70.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">істина</text>
<polyline points="90.0,150.0 810.0,110.0" fill="none" stroke="#c0271e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="824.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">дрейф</text>
<text x="450.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дешевий RTC ~20 ppm ≈ 1.7 с/добу ≈ ~1 хв/місяць</text>
<text x="450.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">DS3231 ~2 ppm ≈ кілька секунд/місяць</text>
<rect x="150.0" y="244.0" width="600.0" height="36.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Похибка накопичується з часом — тому годинник час від часу треба звіряти.</text>
