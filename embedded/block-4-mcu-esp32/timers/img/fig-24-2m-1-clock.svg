<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Беззнакове віднімання — як на циферблаті</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">уся арифметика беззнакових іде за модулем 2³²: різниця «обертається» з лічильником</text>
<circle cx="250.0" cy="185.0" r="95.0" fill="none" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="250.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0 / 2³²</text>
<circle cx="220.6" cy="94.6" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="171.4" y="66.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">last ≈ MAX</text>
<circle cx="269.8" cy="92.1" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="316.0" y="62.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">now (обернувся) = 4</text>
<text x="250.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">проміжок</text>
<text x="250.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= 10 мс</text>
<rect x="440.0" y="120.0" width="410.0" height="130.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="645.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Через переповнення:</text>
<text x="460.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">last = 4 294 967 290   (близько до MAX)</text>
<text x="460.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за 10 мс now = 4   (обернувся через 0)</text>
<text x="460.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">now − last = (4 − 4 294 967 290) mod 2³²</text>
<text x="460.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">= 10  ✓  (правильний проміжок!)</text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як на 12-годинному циферблаті: «2 − 10» дає 4 години, а не −8. Лічильник теж «по колу».</text>
</svg>
