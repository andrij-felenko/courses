<text x="250.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">секунд від 1970-01-01 (UTC)</text>
<line x1="420.0" y1="136.0" x2="500.0" y2="136.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="460.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">переклад</text>
<line x1="500.0" y1="150.0" x2="420.0" y2="150.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
