<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як машина зберігає час: один великий лічильник (epoch)</text>
<rect x="90.0" y="96.0" width="320.0" height="80.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="2"/>
