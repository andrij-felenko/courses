<text x="480.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Цей «системний тік» — серце операційної системи реального часу (далі в курсі).</text>
<text x="480.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Той самий принцип, що в дільнику Маррісона: рівний тік + лічба = розклад подій.</text>
