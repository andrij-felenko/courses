<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Input capture: залізо ставить мітку часу точно на фронті</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">програма не «ловить» фронт із затримкою — лічильник фіксується апаратно, у мить фронту</text>
<text x="70.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">сигнал:</text>
<line x1="90.0" y1="130.0" x2="250.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="250.0" y1="130.0" x2="250.0" y2="98.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="250.0" y1="98.0" x2="560.0" y2="98.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="560.0" y1="98.0" x2="560.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="560.0" y1="130.0" x2="760.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="250.0" y1="156.0" x2="250.0" y2="134.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="250.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">фронт → захоплення t1</text>
<line x1="560.0" y1="156.0" x2="560.0" y2="134.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="560.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">фронт → захоплення t2</text>
<text x="70.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">лічильник:</text>
<polyline points="90.0,240.0 760.0,200.0" fill="none" stroke="#1f47b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">t1 = 1200</text>
<text x="560.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">t2 = 4800</text>
<rect x="120.0" y="256.0" width="660.0" height="50.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="450.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інтервал = t2 − t1 = 3600 тіків → переводимо в час за темпом таймера (§4.6.1).</text>
<text x="450.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Залізо знімає мітку в саму мить фронту — джитера програми тут нема.</text>
</svg>
