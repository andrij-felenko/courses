<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">delay() заморожує ВЕСЬ процесор на час очікування</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поки delay чекає, програма стоїть і не може ані прочитати кнопку, ані зробити щось інше</text>
<text x="64.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">loop()</text>
<line x1="90.0" y1="160.0" x2="250.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<rect x="250.0" y="144.0" width="440.0" height="32.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="470.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">delay(1000) — процесор СТОЇТЬ</text>
<line x1="690.0" y1="160.0" x2="850.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<circle cx="470.0" cy="250.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="470.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">натиск кнопки тут</text>
<line x1="470.0" y1="244.0" x2="470.0" y2="176.0" stroke="#caa24a" stroke-width="1.4" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ проґавлено — код не дивиться</text>
<rect x="150.0" y="320.0" width="640.0" height="46.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одна команда delay(1000) = секунда повної бездіяльності всієї програми.</text>
</svg>
