<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">RP2040: чесна атрибуція — що чуже і що своє</text>
<text x="400.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Raspberry Pi не винаходила процесор — але додала власну обв'язку й PIO</text>
<rect x="111.9" y="73.0" width="176.2" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="200.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Ліцензоване / чуже</tspan></text>
<rect x="45.0" y="128.0" width="310.0" height="44.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/><text x="200.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Ядро: ARM Cortex-M0+ (ARMv6-M)</tspan></text>
<rect x="45.0" y="182.0" width="310.0" height="44.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/><text x="200.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Базовий Cortex-M RTL від ARM</tspan></text>
<rect x="45.0" y="236.0" width="310.0" height="44.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/><text x="200.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Доступ: Arm Flexible Access</tspan></text>
<rect x="45.0" y="290.0" width="310.0" height="44.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.0"/><text x="200.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Виробництво: TSMC 40 нм</tspan></text>
<line x1="400.0" y1="70.0" x2="400.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<rect x="386.0" y="77.0" width="28.0" height="26.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="400.0" dy="0.0">vs</tspan></text>
<rect x="472.8" y="73.0" width="254.4" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="600.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Власний внесок Raspberry Pi</tspan></text>
<rect x="445.0" y="128.0" width="310.0" height="44.0" rx="6" fill="#eaf4ff" stroke="#2457d6" stroke-width="1.0"/><text x="600.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Компонування SoC (peripherals, bus)</tspan></text>
<rect x="445.0" y="182.0" width="310.0" height="44.0" rx="6" fill="#eaf4ff" stroke="#2457d6" stroke-width="1.0"/><text x="600.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">264 КБ SRAM — внутрішня</tspan></text>
<rect x="445.0" y="236.0" width="310.0" height="44.0" rx="6" fill="#eaf4ff" stroke="#2457d6" stroke-width="1.0"/><text x="600.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Зовнішній QSPI-Flash (навмисно!)</tspan></text>
<rect x="445.0" y="290.0" width="310.0" height="44.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/><text x="600.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">PIO — Programmable I/O (патент-pending)</tspan></text>
<line x1="44.0" y1="332.0" x2="756.0" y2="332.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="103.6" y="334.5" width="592.8" height="27.0" rx="6" fill="#f0faf0" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="351.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="400.0" dy="0.0">Raspberry Pi НЕ «винайшла процесор» — взяла ліцензоване ядро і додала власну обв'язку та PIO</tspan></text>
