<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бітове кодування статусу завершення wstatus</text>
<text x="410.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура 16-бітного wstatus у waitpid() (Linux x86/ARM)</text>
<rect x="60.0" y="80.0" width="340.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="230.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Старший байт (біти 15..8)</text>
<text x="230.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Код виходу exit status (0..255), якщо WIFEXITED</text>
<rect x="400.0" y="80.0" width="80.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Біт 7</text>
<text x="440.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Core Dump</text>
<rect x="480.0" y="80.0" width="280.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Молодші 7 бітів (біти 6..0)</text>
<text x="620.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Номер сигналу S, якщо WIFSIGNALED (0 = normal)</text>
<line x1="60.0" y1="160.0" x2="760.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="70.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• WIFEXITED(w): (w &amp; 0x7f) == 0</text>
<text x="70.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">• WEXITSTATUS(w): (w &gt;&gt; 8) &amp; 0xff</text>
<text x="440.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• WIFSIGNALED(w): ((w &amp; 0x7f) + 1) &gt;&gt; 1 &gt; 0</text>
<text x="440.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">• WTERMSIG(w): w &amp; 0x7f</text>
</svg>