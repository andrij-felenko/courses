<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність етапів розгортання рядка в командній оболонці</text>
<rect x="180.0" y="50.0" width="400.0" height="45.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="380.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">Сирий текстовий рядок від користувача</text>
<text x="380.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle">echo ~user/${VAR:-dir}/$(date +%Y)/*.txt</text>
<line x1="380.0" y1="95.0" x2="380.0" y2="115.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="115.0" width="500.0" height="50.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="380.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">1. Brace Expansion (Фігурні дужки)</text>
<text x="380.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle">Розгортання списків {a,b} та діапазонів {1..5} (Bash/Zsh розширення до POSIX)</text>
<line x1="380.0" y1="165.0" x2="380.0" y2="185.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="185.0" width="500.0" height="50.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="380.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">2. Tilde Expansion (Тильда)</text>
<text x="380.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle">~ розгортається у $HOME (/home/user), ~+ у $PWD, ~- у $OLDPWD</text>
<line x1="380.0" y1="235.0" x2="380.0" y2="255.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="255.0" width="500.0" height="55.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="380.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. Parameter, Command &amp; Arithmetic Expansion</text>
<text x="380.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Підстановка $VAR, $(cmd), $((expr)) зліва направо в один прохід</text>
<line x1="380.0" y1="310.0" x2="380.0" y2="330.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="330.0" width="500.0" height="55.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="380.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">4. Word Splitting (Поділ на слова)</text>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle">Розбиття незахищених подвійними лапками підстановок за роздільниками IFS</text>
<line x1="380.0" y1="385.0" x2="380.0" y2="405.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="405.0" width="500.0" height="50.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
<text x="380.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9f1239" text-anchor="middle" font-weight="700">5. Filename Expansion / Globbing</text>
<text x="380.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#881337" text-anchor="middle">Заміна масок *, ?, [...] на список реальних імен файлів з VFS</text>
<line x1="380.0" y1="455.0" x2="380.0" y2="475.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="475.0" width="500.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
<text x="380.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="700">6. Quote Removal (Видалення лапок) ──► Сформований argv[]</text>
<text x="380.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#374151" text-anchor="middle">Видалення не закерованих ', &quot;, \ та виклики execve(path, argv, envp)</text>
</svg>