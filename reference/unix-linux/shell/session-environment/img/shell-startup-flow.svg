<rect x="330.0" y="55.0" width="200.0" height="42.0" rx="6" fill="#e8f4f8" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Вхідний виклик оболонки</tspan><tspan x="430.0" dy="15.6">(SSH, Terminal, Script)</tspan></text>
