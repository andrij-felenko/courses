<text x="370.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Масив покажчиків аргументів (argv[])</text>
<text x="370.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle"><tspan x="370.0" dy="0.0">char *argv[0] ──► &quot;ls&quot;,  char *argv[1] ──► &quot;-l&quot;,  char *argv[2] ──► &quot;/tmp&quot;</tspan><tspan x="370.0" dy="14.3">Завершується покажчиком NULL (0x0)</tspan></text>
