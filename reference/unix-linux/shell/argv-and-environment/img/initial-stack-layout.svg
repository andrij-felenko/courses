<text x="370.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">Інформаційний блок (Information Block)</text>
<text x="370.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle"><tspan x="370.0" dy="0.0">Символьні рядки: &quot;PATH=/usr/bin\0&quot;, &quot;USER=alex\0&quot;, &quot;/bin/ls\0&quot;, &quot;-l\0&quot;, &quot;/tmp\0&quot;</tspan><tspan x="370.0" dy="14.3">Апаратна платформа, 16 випадкових байтів для canary, вирівнювання (16 байт)</tspan></text>
<rect x="120.0" y="150.0" width="500.0" height="90.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="370.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">Допоміжний вектор (Auxiliary Vector — auxv)</text>
<text x="370.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle"><tspan x="370.0" dy="0.0">Пари Elf64_auxv_t { a_type, a_val/a_ptr }</tspan><tspan x="370.0" dy="14.3">AT_PHDR, AT_ENTRY, AT_PAGESZ, AT_RANDOM, AT_SECURE ... завершується AT_NULL (0)</tspan></text>
<rect x="120.0" y="250.0" width="500.0" height="75.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="370.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Масив покажчиків середовища (envp[])</text>
<text x="370.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="370.0" dy="0.0">char *envp[0] ──► &quot;PATH=...&quot;,  char *envp[1] ──► &quot;USER=...&quot;</tspan><tspan x="370.0" dy="14.3">Завершується покажчиком NULL (0x0)</tspan></text>
