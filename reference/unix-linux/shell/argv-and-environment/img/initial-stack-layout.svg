<text x="340.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет верхівки стека при вході в _start (x86_64 ABI)</text>
