<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комутація файлових дескрипторів ядра для конвеєра: cmd1 | cmd2 &gt; out.txt</text>
<rect x="10.0" y="10.0" width="800.0" height="360.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="33.0" y="56.6" width="294.0" height="66.8" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/><text x="180.0" y="77.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Батьківська оболонка (PID 1000)</tspan><tspan x="180.0" dy="16.9">1. pipe(pfd) -&gt; pfd[0]=3, pfd[1]=4</tspan><tspan x="180.0" dy="16.9">2. fork() -&gt; Child 1 &amp; Child 2</tspan></text>
<rect x="64.9" y="228.4" width="310.2" height="63.2" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="220.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Дочірній 1: cmd1 (PID 1001)</tspan><tspan x="220.0" dy="15.6">dup2(pfd[1], 1)  [stdout -&gt; pipe write]</tspan><tspan x="220.0" dy="15.6">close(pfd[0]); execve(&quot;/bin/cmd1&quot;)</tspan></text>
<rect x="444.9" y="220.6" width="310.2" height="78.8" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="600.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Дочірній 2: cmd2 (PID 1002)</tspan><tspan x="600.0" dy="15.6">dup2(pfd[0], 0)  [stdin &lt;- pipe read]</tspan><tspan x="600.0" dy="15.6">fd_out=open(&quot;out.txt&quot;); dup2(fd_out, 1)</tspan><tspan x="600.0" dy="15.6">execve(&quot;/bin/cmd2&quot;)</tspan></text>
<rect x="316.4" y="148.2" width="187.1" height="43.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="410.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Kernel Pipe Buffer</tspan><tspan x="410.0" dy="15.6">(Кільцевий буфер 64 KB)</tspan></text>
<rect x="683.6" y="68.2" width="112.7" height="43.6" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="740.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Файл на диску</tspan><tspan x="740.0" dy="15.6">out.txt</tspan></text>
<line x1="180.0" y1="123.4" x2="220.0" y2="228.4" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="253.5" y1="123.4" x2="522.5" y2="220.6" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="375.1" y1="260.0" x2="316.4" y2="180.9" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="503.6" y1="180.9" x2="444.9" y2="260.0" stroke="#9333ea" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="677.5" y1="220.6" x2="740.0" y2="111.8" stroke="#9333ea" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>