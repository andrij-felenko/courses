<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік обробки локалі у системних утилітах</text>
<rect x="30.0" y="60.0" width="200.0" height="110.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="130.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">Змінні оточення</text>
<text x="130.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle"><tspan x="130.0" dy="0.0">LC_ALL=uk_UA.UTF-8</tspan><tspan x="130.0" dy="14.3">LC_COLLATE=C</tspan><tspan x="130.0" dy="14.3">LANG=en_US.UTF-8</tspan></text>
<line x1="230.0" y1="115.0" x2="270.0" y2="115.0" stroke="#333333" stroke-width="1.5"/>
<line x1="270.0" y1="115.0" x2="275.0" y2="115.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="275.0" y="60.0" width="200.0" height="110.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="375.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#075985" text-anchor="middle" font-weight="700">C-бібліотека (libc)</text>
<text x="375.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle"><tspan x="375.0" dy="0.0">setlocale(LC_ALL, &quot;&quot;)</tspan><tspan x="375.0" dy="14.3">Завантаження таблиць з</tspan><tspan x="375.0" dy="14.3">/usr/lib/locale/archive</tspan></text>
<line x1="475.0" y1="115.0" x2="515.0" y2="115.0" stroke="#333333" stroke-width="1.5"/>
<line x1="515.0" y1="115.0" x2="520.0" y2="115.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="60.0" width="170.0" height="110.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="605.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Утиліта (sort/grep)</text>
<text x="605.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="605.0" dy="0.0">Виклики strcoll()</tspan><tspan x="605.0" dy="14.3">або strcmp()</tspan><tspan x="605.0" dy="14.3">Розкриття [a-z]</tspan></text>
<rect x="30.0" y="200.0" width="660.0" height="170.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="360.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Порівняння режимів обробки під час розбору тексту</text>
<line x1="40.0" y1="238.0" x2="680.0" y2="238.0" stroke="#d1d5db" stroke-width="1.0"/>
<text x="180.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Режим LC_ALL=C</text>
<text x="520.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">Режим UTF-8 (uk_UA.UTF-8 / en_US.UTF-8)</text>
<line x1="360.0" y1="240.0" x2="360.0" y2="360.0" stroke="#d1d5db" stroke-width="1.0"/>
<text x="180.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle"><tspan x="180.0" dy="0.0">• Швидке порівняння байтів (O(1) / strcmp)</tspan><tspan x="180.0" dy="14.3">• [a-z] — тільки ASCII від 0x61 до 0x7A</tspan><tspan x="180.0" dy="14.3">• Висока швидкість sort та grep (SIMD/AVX)</tspan></text>
<text x="520.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle"><tspan x="520.0" dy="0.0">• Багаторівневе зіставлення (O(N) / strcoll)</tspan><tspan x="520.0" dy="14.3">• [a-z] — мовний порядок зіставлення (collation)</tspan><tspan x="520.0" dy="14.3">• Враховує абетку, але потребує більше CPU</tspan></text>
</svg>