<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1140.0" height="580.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="40.0" y="35.0" width="530.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="305.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">sysfs: Напрямок Kernel ──► Userspace</text>
<rect x="610.0" y="35.0" width="530.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="875.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">configfs: Напрямок Userspace ──► Kernel</text>
<rect x="50.0" y="100.0" width="510.0" height="110.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1. Драйвер або ядро виявляє пристрій</tspan><tspan x="305.0" dy="16.9">• Виклики kobject_add() / device_register()</tspan><tspan x="305.0" dy="16.9">• Створення kobject у пам'яті ядра</tspan><tspan x="305.0" dy="16.9">• Автоматичне відображення у /sys/devices/</tspan></text>
<line x1="305.0" y1="210.0" x2="305.0" y2="245.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="245.0" width="510.0" height="110.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">2. Відображення об'єкта в VFS (/sys/)</tspan><tspan x="305.0" dy="16.9">• Ядро створює каталоги та атрибути</tspan><tspan x="305.0" dy="16.9">• Простір користувача бачить готову топологію</tspan><tspan x="305.0" dy="16.9">• mkdir повернув би помилку -EPERM</tspan></text>
<line x1="305.0" y1="355.0" x2="305.0" y2="390.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="390.0" width="510.0" height="170.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">3. Доступ із простору користувача</tspan><tspan x="305.0" dy="15.6">• Читання стан: cat /sys/class/net/eth0/operstate</tspan><tspan x="305.0" dy="15.6">• Запис значень: echo 1 &gt; /sys/block/sda/device/rescan</tspan><tspan x="305.0" dy="15.6">• Обмеження: користувач НЕ може створювати нові</tspan><tspan x="305.0" dy="15.6">  екземпляри об'єктів ядра через файлові виклики</tspan></text>
<line x1="590.0" y1="35.0" x2="590.0" y2="575.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<rect x="620.0" y="100.0" width="510.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">1. Модуль реєструє підсистему configfs</tspan><tspan x="875.0" dy="16.9">• configfs_register_subsystem()</tspan><tspan x="875.0" dy="16.9">• Створюється порожній каталог у /sys/kernel/config/</tspan><tspan x="875.0" dy="16.9">• Модуль очікує дій простору користувача</tspan></text>
<line x1="875.0" y1="210.0" x2="875.0" y2="245.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="245.0" width="510.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">2. Юзерспейс виконує mkdir</tspan><tspan x="875.0" dy="16.9">• mkdir /sys/kernel/config/target/core</tspan><tspan x="875.0" dy="16.9">• VFS прехоплює vfs_mkdir() ──► configfs_mkdir()</tspan><tspan x="875.0" dy="16.9">• Викликається zmake_group() / make_item()</tspan></text>
<line x1="875.0" y1="355.0" x2="875.0" y2="390.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="390.0" width="510.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">3. Динамічне створення та знищення</tspan><tspan x="875.0" dy="15.6">• Ядро виділяє пам'ять під новий config_item</tspan><tspan x="875.0" dy="15.6">• Юзерспейс налаштовує параметри та symlink</tspan><tspan x="875.0" dy="15.6">• Виклик rmdir видаляє ядерний об'єкт:</tspan><tspan x="875.0" dy="15.6">  drop_item() ──► refcount == 0 ──► release()</tspan></text>
</svg>