<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1140.0" height="580.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="40.0" y="35.0" width="530.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="305.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Створення об'єкта: mkdir node_1</text>
<rect x="610.0" y="35.0" width="530.0" height="45.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/>
<text x="875.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Знищення об'єкта: rmdir node_1</text>
<line x1="590.0" y1="35.0" x2="590.0" y2="575.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<rect x="50.0" y="100.0" width="510.0" height="95.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1. Юзерспейс: mkdir /sys/kernel/config/.../node_1</tspan><tspan x="305.0" dy="15.6">Системний виклик sys_mkdir() звертається до VFS</tspan><tspan x="305.0" dy="15.6">і викликає inode_operations-&gt;mkdir() у configfs.</tspan></text>
<line x1="305.0" y1="195.0" x2="305.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="225.0" width="510.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">2. Виклик make_item() / make_group()</tspan><tspan x="305.0" dy="15.6">Драйвер виділяє пам'ять: kzalloc(sizeof(*my_item))</tspan><tspan x="305.0" dy="15.6">Ініціалізація: config_item_init_type_name()</tspan><tspan x="305.0" dy="15.6">Встановлюється лічильник ci_kref = 1.</tspan></text>
<line x1="305.0" y1="335.0" x2="305.0" y2="365.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="365.0" width="510.0" height="175.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="425.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">3. Зв'язування з деревом VFS</tspan><tspan x="305.0" dy="15.6">configfs створює власний configfs_dirent і dentry.</tspan><tspan x="305.0" dy="15.6">Створюються файли атрибутів (ct_attrs).</tspan><tspan x="305.0" dy="15.6">Повертається 0 (успіх) у простір користувача.</tspan><tspan x="305.0" dy="15.6">Об'єкт повністю готовий до роботи.</tspan></text>
<rect x="620.0" y="100.0" width="510.0" height="95.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="875.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">1. Юзерспейс: rmdir /sys/kernel/config/.../node_1</tspan><tspan x="875.0" dy="15.6">Системний виклик sys_rmdir() передає управління</tspan><tspan x="875.0" dy="15.6">до configfs_rmdir() у шарі VFS.</tspan></text>
<line x1="875.0" y1="195.0" x2="875.0" y2="225.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="225.0" width="510.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">2. Перевірка залежностей та drop_item()</tspan><tspan x="875.0" dy="15.6">configfs перевіряє відсутність симлінків та вкладених груп.</tspan><tspan x="875.0" dy="15.6">Викликається group_ops-&gt;drop_item().</tspan><tspan x="875.0" dy="15.6">Драйвер відключає об'єкт від активної роботи.</tspan></text>
<line x1="875.0" y1="335.0" x2="875.0" y2="365.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="365.0" width="510.0" height="175.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="425.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">3. Зменшення kref та release()</tspan><tspan x="875.0" dy="15.6">config_item_put(item) ──► refcount зменшується.</tspan><tspan x="875.0" dy="15.6">Коли ci_kref досягає 0 ──► викликається release().</tspan><tspan x="875.0" dy="15.6">Зворотний виклик release() виконує kfree(my_item).</tspan><tspan x="875.0" dy="15.6">Пам'ять ядра безпечно звільняється.</tspan></text>
</svg>