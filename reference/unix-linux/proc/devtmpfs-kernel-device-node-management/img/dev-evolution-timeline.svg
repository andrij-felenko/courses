<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="600.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">Еволюція керування вузлами пристроїв у Linux (/dev)</text>
<rect x="35.0" y="80.0" width="265.0" height="510.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="167.5" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">1. Статичний /dev</tspan><tspan x="167.5" dy="15.6">(Linux 1.x ── 2.4)</tspan><tspan x="167.5" dy="15.6"></tspan><tspan x="167.5" dy="15.6">• Файли створюються через MAKEDEV</tspan><tspan x="167.5" dy="15.6">• Тисячі статичних вузлів на дисках</tspan><tspan x="167.5" dy="15.6">• Відсутність підтримки hotplug</tspan><tspan x="167.5" dy="15.6"></tspan><tspan x="167.5" dy="15.6">Проблема: розбухання rootfs.</tspan></text>
<rect x="318.0" y="80.0" width="265.0" height="510.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="450.5" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.5" dy="0.0">2. devfs у ядрі</tspan><tspan x="450.5" dy="15.6">(Linux 2.3.46 ── 2.6.17)</tspan><tspan x="450.5" dy="15.6"></tspan><tspan x="450.5" dy="15.6">• Динамічна система всередині ядра</tspan><tspan x="450.5" dy="15.6">• Імена зашиті у код ядра</tspan><tspan x="450.5" dy="15.6">• Автоматичне створення вузлів</tspan><tspan x="450.5" dy="15.6"></tspan><tspan x="450.5" dy="15.6">Проблема: дедлоки VFS, вилучено.</tspan></text>
<rect x="601.0" y="80.0" width="265.0" height="510.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="733.5" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="733.5" dy="0.0">3. udev на tmpfs</tspan><tspan x="733.5" dy="14.3">(Linux 2.6.0 ── 2.6.31)</tspan><tspan x="733.5" dy="14.3"></tspan><tspan x="733.5" dy="14.3">• Чистий /dev як tmpfs у user-space</tspan><tspan x="733.5" dy="14.3">• udevd створює вузли за uevent</tspan><tspan x="733.5" dy="14.3">• Гнучкі правила та symlinks</tspan><tspan x="733.5" dy="14.3"></tspan><tspan x="733.5" dy="14.3">Проблема: race condition завантаження.</tspan></text>
<rect x="884.0" y="80.0" width="265.0" height="510.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1016.5" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1016.5" dy="0.0">4. devtmpfs + udevd</tspan><tspan x="1016.5" dy="15.6">(Linux 2.6.32 ── дотепер)</tspan><tspan x="1016.5" dy="15.6"></tspan><tspan x="1016.5" dy="15.6">• devtmpfs створює вузли ядром</tspan><tspan x="1016.5" dy="15.6">• Працює ще до запуску udevd</tspan><tspan x="1016.5" dy="15.6">• udevd збагачує лінками й правами</tspan><tspan x="1016.5" dy="15.6"></tspan><tspan x="1016.5" dy="15.6">Перевага: миттєве завантаження.</tspan></text>
</svg>