<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="650.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="300.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">ПРОСТІР ЯДРА (Kernel Space)</text>
<text x="920.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОСТІР КОРИСТУВАЧА (User Space)</text>
<line x1="600.0" y1="30.0" x2="600.0" y2="650.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<rect x="40.0" y="80.0" width="520.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">1. Ініціалізація та реєстрація пристрою</tspan><tspan x="300.0" dy="16.9">• Драйвер заповнює dev-&gt;devt (major, minor) і кличе device_add()</tspan><tspan x="300.0" dy="16.9">• device_add() кличе devtmpfs_create_node() ДО kobject_uevent()</tspan><tspan x="300.0" dy="16.9">• Виклик спить, доки kdevtmpfs не створить вузол</tspan></text>
<line x1="300.0" y1="200.0" x2="300.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="315.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">список requests + wait_for_completion</text>
<rect x="40.0" y="240.0" width="520.0" height="150.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">2. Потік ядра kdevtmpfs (виконавець VFS-операцій)</tspan><tspan x="300.0" dy="16.9">• Прокидається викликом wake_up_process(thread)</tspan><tspan x="300.0" dy="16.9">• Знімає struct req зі списку requests під req_lock</tspan><tspan x="300.0" dy="16.9">• Виконує VFS-операції зі спанням: vfs_mkdir() та vfs_mknod()</tspan><tspan x="300.0" dy="16.9">• Кличе complete(&amp;req-&gt;done) — драйвер іде далі</tspan></text>
<line x1="300.0" y1="390.0" x2="300.0" y2="430.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="430.0" width="520.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="479.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">3. Віртуальне дерево devtmpfs (/dev/)</tspan><tspan x="300.0" dy="16.9">• Одразу створюються стандартні вузли (/dev/sda1, /dev/null)</tspan><tspan x="300.0" dy="16.9">• Права: типово 0600 (драйвер може 0666), власник root:root</tspan><tspan x="300.0" dy="16.9">• Доступне для ядрового init та initramfs ДО запуску udevd</tspan></text>
<line x1="560.0" y1="140.0" x2="640.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">kobject_uevent()</text>
<rect x="640.0" y="80.0" width="520.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">4. Демон systemd-udevd (простір користувача)</tspan><tspan x="900.0" dy="16.9">• Слухає сокет NETLINK_KOBJECT_UEVENT</tspan><tspan x="900.0" dy="16.9">• Отримує сповіщення про створення вузла у devtmpfs</tspan><tspan x="900.0" dy="16.9">• Зчитує правила з /lib/udev/rules.d/ та /etc/udev/rules.d/</tspan></text>
<line x1="900.0" y1="220.0" x2="900.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="260.0" width="520.0" height="160.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="302.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">5. Збагачення та модифікація /dev/</tspan><tspan x="900.0" dy="16.9">• Зміна власників та прав (chmod 0660 root:disk /dev/sda1)</tspan><tspan x="900.0" dy="16.9">• Створення символічних посилань:</tspan><tspan x="900.0" dy="16.9">   /dev/disk/by-uuid/C12A-99F8 ──► ../../sda1</tspan><tspan x="900.0" dy="16.9">   /dev/snd/by-path/pci-0000:00:1f.3 ──► ../controlC0</tspan><tspan x="900.0" dy="16.9">• Застосування ACL-правил (systemd-logind / udev-acl)</tspan></text>
<line x1="900.0" y1="420.0" x2="900.0" y2="460.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="460.0" width="520.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="494.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">6. Фінальний стан файлової системи /dev</tspan><tspan x="900.0" dy="16.9">• Стабільні імена для монтажу системних дисків</tspan><tspan x="900.0" dy="16.9">• Безпечні права доступу для користувацьких груп (audio, video)</tspan><tspan x="900.0" dy="16.9">• Захист від race condition під час завантаження</tspan></text>
</svg>