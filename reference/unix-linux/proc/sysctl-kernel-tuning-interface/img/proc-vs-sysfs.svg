<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="560.0" rx="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<rect x="50.0" y="50.0" width="340.0" height="500.0" rx="8" fill="#eaf0fd" stroke="#90caf9" stroke-width="1.5"/>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle" font-weight="700">/proc/sys</text>
<text x="220.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">Глобальний тюнінг ядра</text>
<rect x="82.3" y="122.9" width="275.4" height="234.2" rx="6" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/><text x="220.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Призначення:</tspan><tspan x="220.0" dy="18.2">Динамічна зміна параметрів</tspan><tspan x="220.0" dy="18.2">роботи підсистем ядра</tspan><tspan x="220.0" dy="18.2">(мережі, пам'яті, ФС)</tspan><tspan x="220.0" dy="18.2"></tspan><tspan x="220.0" dy="18.2">Формат даних:</tspan><tspan x="220.0" dy="18.2">Простий текст/числа</tspan><tspan x="220.0" dy="18.2">(одне чи кілька чисел у рядку)</tspan><tspan x="220.0" dy="18.2"></tspan><tspan x="220.0" dy="18.2">Головні піддерева:</tspan><tspan x="220.0" dy="18.2">/proc/sys/net/, /proc/sys/vm/</tspan><tspan x="220.0" dy="18.2">/proc/sys/kernel/, /proc/sys/fs/</tspan></text>
<rect x="430.0" y="50.0" width="340.0" height="500.0" rx="8" fill="#eaf6ef" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="600.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700">/proc (procfs)</text>
<text x="600.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">Стан процесів та системи</text>
<rect x="458.3" y="122.9" width="283.3" height="234.2" rx="6" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/><text x="600.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Призначення:</tspan><tspan x="600.0" dy="18.2">Відображення стану процесів</tspan><tspan x="600.0" dy="18.2">та загальної статистики ядра</tspan><tspan x="600.0" dy="18.2">(пам'ять, CPU, переривання)</tspan><tspan x="600.0" dy="18.2"></tspan><tspan x="600.0" dy="18.2">Формат даних:</tspan><tspan x="600.0" dy="18.2">Текстові звіти,</tspan><tspan x="600.0" dy="18.2">форматовані таблиці та списки</tspan><tspan x="600.0" dy="18.2"></tspan><tspan x="600.0" dy="18.2">Головні елементи:</tspan><tspan x="600.0" dy="18.2">/proc/[pid]/status, /proc/meminfo</tspan><tspan x="600.0" dy="18.2">/proc/cpuinfo, /proc/stat</tspan></text>
<rect x="810.0" y="50.0" width="340.0" height="500.0" rx="8" fill="#fff6e5" stroke="#ffb74d" stroke-width="1.5"/>
<text x="980.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e65100" text-anchor="middle" font-weight="700">/sys (sysfs)</text>
<text x="980.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#546e7a" text-anchor="middle">Модель пристроїв та шин</text>
<rect x="858.3" y="122.9" width="243.4" height="234.2" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1.5"/><text x="980.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Призначення:</tspan><tspan x="980.0" dy="18.2">Ієрархія об'єктів kobject:</tspan><tspan x="980.0" dy="18.2">пристрої, драйвери, шини,</tspan><tspan x="980.0" dy="18.2">живлення, cgroups v2</tspan><tspan x="980.0" dy="18.2"></tspan><tspan x="980.0" dy="18.2">Формат даних:</tspan><tspan x="980.0" dy="18.2">Один атрибут — один файл</tspan><tspan x="980.0" dy="18.2">(суворий канон sysfs)</tspan><tspan x="980.0" dy="18.2"></tspan><tspan x="980.0" dy="18.2">Головні піддерева:</tspan><tspan x="980.0" dy="18.2">/sys/devices/, /sys/bus/</tspan><tspan x="980.0" dy="18.2">/sys/class/, /sys/fs/cgroup/</tspan></text>
</svg>