<text x="1040.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол /sys/fs/cgroup/parent_node</text>
<text x="1040.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">cgroup.subtree_control = &quot;+cpu +memory&quot;</text>
<text x="1040.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#388e3c" text-anchor="middle" font-style="italic">cgroup.procs = порожньо (0 процесів)</text>
