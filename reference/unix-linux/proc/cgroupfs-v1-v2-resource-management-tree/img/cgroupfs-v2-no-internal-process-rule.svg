<text x="210.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">cgroup.procs = [PID 2048]</text>
<rect x="380.0" y="265.0" width="260.0" height="80.0" rx="4" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
<text x="510.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дочірній child_B</text>
<text x="510.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">cgroup.procs = [PID 3096]</text>
<rect x="60.0" y="365.0" width="600.0" height="155.0" rx="6" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/><text x="360.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b71c1c" text-anchor="middle"><tspan x="360.0" dy="0.0">❌ Чому це заборонено:</tspan><tspan x="360.0" dy="16.9">Якщо parent_node має власні процеси у cgroup.procs І одночасно</tspan><tspan x="360.0" dy="16.9">розподіляє ресурси між child_A та child_B через subtree_control,</tspan><tspan x="360.0" dy="16.9">виникає невизначеність: як планувальник CPU чи memory-reclaim має</tspan><tspan x="360.0" dy="16.9">ділити ресурс між безпосереднім PID 1024 та цілою групою child_A?</tspan><tspan x="360.0" dy="16.9">Ядро блокує такий запис і повертає помилку EBUSY.</tspan></text>
<rect x="720.0" y="40.0" width="640.0" height="500.0" rx="6" fill="#eaf6ef" stroke="#81c784" stroke-width="1.5"/>
<text x="1040.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1b5e20" text-anchor="middle" font-weight="700">ПРАВИЛЬНА КОНФІГУРАЦІЯ (Лише листки)</text>
