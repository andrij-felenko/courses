<text x="840.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">PID 1024</text>
<rect x="960.0" y="265.0" width="180.0" height="80.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1050.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Листок child_A</text>
<text x="1050.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">PID 2048</text>
<rect x="1160.0" y="265.0" width="180.0" height="80.0" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1250.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Листок child_B</text>
<text x="1250.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">PID 3096</text>
<rect x="740.0" y="365.0" width="600.0" height="155.0" rx="6" fill="#ffffff" stroke="#388e3c" stroke-width="1.5"/><text x="1040.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b5e20" text-anchor="middle"><tspan x="1040.0" dy="0.0">✔ Чому це працює коректно:</tspan><tspan x="1040.0" dy="16.9">Всі процеси розташовані виключно у листкових вузлах (leaf nodes).</tspan><tspan x="1040.0" dy="16.9">Процес PID 1024 винесено у власну cgroup leaf_main.</tspan><tspan x="1040.0" dy="16.9">Батьківський вузол виступає виключно як контролер ієрархії.</tspan><tspan x="1040.0" dy="16.9">Арбітраж ресурсів між leaf_main, child_A та child_B виконується</tspan><tspan x="1040.0" dy="16.9">математично строго та без деградації продуктивності.</tspan></text>
