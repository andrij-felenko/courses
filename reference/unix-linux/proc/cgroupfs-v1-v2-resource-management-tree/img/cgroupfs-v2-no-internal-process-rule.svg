<text x="360.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол /sys/fs/cgroup/parent_node</text>
<text x="360.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700">cgroup.subtree_control = &quot;+cpu +memory&quot;</text>
<text x="360.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d32f2f" text-anchor="middle" font-weight="700">cgroup.procs = [PID 1024]  &lt;-- ВНУТРІШНІЙ ПРОЦЕС!</text>
