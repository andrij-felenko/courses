<rect x="60.0" y="365.0" width="610.0" height="255.0" rx="6" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5"/>
<text x="365.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#f57f17" text-anchor="middle" font-weight="700">Проблема cgroup v1: Конфлікт між контролерами</text>
<rect x="80.0" y="415.0" width="570.0" height="185.0" rx="6" fill="#ffffff" stroke="#fbc02d" stroke-width="1.5"/><text x="365.0" y="469.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#37474f" text-anchor="middle"><tspan x="365.0" dy="0.0">• Процес P1 належить Group_A у CPU та Group_B у Memory.</tspan><tspan x="365.0" dy="16.9">• При скиданні брудних сторінок пам'яті (Buffered I/O Writeback)</tspan><tspan x="365.0" dy="16.9">  ядерний kworker не знає, до якої cgroup блокового I/O</tspan><tspan x="365.0" dy="16.9">  віднести операцію дискового запису.</tspan><tspan x="365.0" dy="16.9">• Розрив між контролерами унеможливлює точний облік I/O,</tspan><tspan x="365.0" dy="16.9">  створює гонки при міграції PID та блокування у ядрі.</tspan></text>
<rect x="730.0" y="40.0" width="650.0" height="600.0" rx="6" fill="#f8f9fa" stroke="#b0bec5" stroke-width="1.5"/>
