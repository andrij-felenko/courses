<rect x="770.0" y="495.0" width="570.0" height="110.0" rx="6" fill="#ffffff" stroke="#388e3c" stroke-width="1.5"/><text x="1055.0" y="529.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b5e20" text-anchor="middle"><tspan x="1055.0" dy="0.0">✔ Перевага cgroup v2:</tspan><tspan x="1055.0" dy="16.9">  Усі контролери (CPU, Memory, I/O) бачать однакову ієрархію.</tspan><tspan x="1055.0" dy="16.9">  I/O Writeback tracking точно знає джерело сторінок пам'яті.</tspan><tspan x="1055.0" dy="16.9">  Повна узгодженість OOM-killer та обліку ресурсів.</tspan></text>
