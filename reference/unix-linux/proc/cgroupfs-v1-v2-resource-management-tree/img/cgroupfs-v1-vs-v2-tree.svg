<text x="1055.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-style="italic">cgroup.subtree_control = &quot;+cpu +memory +io&quot;</text>
