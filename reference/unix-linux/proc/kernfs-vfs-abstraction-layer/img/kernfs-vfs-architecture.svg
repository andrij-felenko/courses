<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="640.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="40.0" y="40.0" width="1120.0" height="50.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">АРХІТЕКТУРНЕ РОЗДІЛЕННЯ VFS ТА КЕРУВАННЯ ВУЗЛАМИ KERNFS</tspan></text>
<rect x="50.0" y="110.0" width="1100.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Шар VFS (Virtual Filesystem Switch)</tspan><tspan x="600.0" dy="16.9">• Об'єкти dentry (~192 B) та inode (~600 B) створюються ЛІНИВО (On-Demand) при відкритті або lookup</tspan><tspan x="600.0" dy="16.9">• Очищаються з пам'яті під тиском VFS shrinker (dcache/icache prune) без втрати структури деревоподібної ФС</tspan><tspan x="600.0" dy="16.9">• Операції: open(), read(), write(), readdir(), stat() через VFS file_operations та inode_operations</tspan></text>
<line x1="600.0" y1="250.0" x2="600.0" y2="290.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="615.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">динамічний зв'язок за вимогою (kernfs_iop_lookup / kernfs_get_inode)</text>
<rect x="50.0" y="290.0" width="1100.0" height="220.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="600.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Ядро абстракції: kernfs (struct kernfs_root / struct kernfs_node)</tspan><tspan x="600.0" dy="16.9">• Єдине джерело правди у пам'яті: компактні вузли kernfs_node (~80-128 B) живуть у RAM постійно</tspan><tspan x="600.0" dy="16.9">• Дочірні вузли впорядковано у червоно-чорне дерево (rb_node) для швидкого пошуку за O(log N)</tspan><tspan x="600.0" dy="16.9">• Активний лічильник посилань (atomic_t active) та kernfs_drain() усувають гонитви при гарячому вилученні</tspan><tspan x="600.0" dy="16.9">• Ліниве виділення метаданих: атрибути iattr (права, uid/gid, timestamps) створюються лише при chmod/chown</tspan></text>
<line x1="250.0" y1="510.0" x2="250.0" y2="550.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="510.0" x2="600.0" y2="550.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="950.0" y1="510.0" x2="950.0" y2="550.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="550.0" width="340.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="583.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Підсистема sysfs</tspan><tspan x="220.0" dy="15.6">• kobject-&gt;sd вказує на kernfs_node</tspan><tspan x="220.0" dy="15.6">• Обгортка sysfs_ops -&gt; kernfs_ops</tspan></text>
<rect x="430.0" y="550.0" width="340.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="583.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Підсистема cgroup v2</tspan><tspan x="600.0" dy="15.6">• cgroup_root будується на kernfs_root</tspan><tspan x="600.0" dy="15.6">• Єдине ієрархічне дерево керування</tspan></text>
<rect x="810.0" y="550.0" width="340.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="583.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Власні псевдо-ФС ядра</tspan><tspan x="980.0" dy="15.6">• Створення через kernfs_create_root()</tspan><tspan x="980.0" dy="15.6">• Легковаговий віртуальний інтерфейс</tspan></text>
</svg>