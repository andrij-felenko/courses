<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="580.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="40.0" y="40.0" width="1120.0" height="50.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">БЕЗПЕКА ГАРЯЧОГО ВІДКЛЮЧЕННЯ: АКТИВНИЙ ЛІЧИЛЬНИК ТА KERNFS_DRAIN()</tspan></text>
<rect x="50.0" y="110.0" width="340.0" height="460.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Нормальне виконання</tspan><tspan x="220.0" dy="16.9">(Активний стан)</tspan><tspan x="220.0" dy="16.9"></tspan><tspan x="220.0" dy="16.9">• VFS отримує запит read/write</tspan><tspan x="220.0" dy="16.9"></tspan><tspan x="220.0" dy="16.9">• Викликається kernfs_get_active(kn):</tspan><tspan x="220.0" dy="16.9">  - Перевіряється знак atomic_t active</tspan><tspan x="220.0" dy="16.9">  - Збільшується atomic_t active</tspan><tspan x="220.0" dy="16.9"></tspan><tspan x="220.0" dy="16.9">• Виконується метод драйвера:</tspan><tspan x="220.0" dy="16.9">  kernfs_ops-&gt;seq_show() / write()</tspan><tspan x="220.0" dy="16.9"></tspan><tspan x="220.0" dy="16.9">• Після завершення:</tspan><tspan x="220.0" dy="16.9">  kernfs_put_active(kn)</tspan><tspan x="220.0" dy="16.9">  (зменшує active)</tspan></text>
<line x1="390.0" y1="340.0" x2="430.0" y2="340.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="430.0" y="110.0" width="340.0" height="460.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="278.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">2. Ініціація вилучення</tspan><tspan x="600.0" dy="11.7">(kernfs_remove / drain)</tspan><tspan x="600.0" dy="11.7"></tspan><tspan x="600.0" dy="11.7">• Драйвер/пристрій відключається</tspan><tspan x="600.0" dy="11.7">  та викликає kernfs_remove(kn)</tspan><tspan x="600.0" dy="11.7"></tspan><tspan x="600.0" dy="11.7">• Викликається kernfs_drain(kn):</tspan><tspan x="600.0" dy="11.7">  - Додається від'ємне зміщення</tspan><tspan x="600.0" dy="11.7">    KN_DEACTIVATED_BIAS = INT_MIN + 1</tspan><tspan x="600.0" dy="11.7">  - Нові kernfs_get_active() повертають NULL, VFS віддає -ENODEV</tspan><tspan x="600.0" dy="11.7">  - Потік БЛОКУЄТЬСЯ (wait_event), доки</tspan><tspan x="600.0" dy="11.7">    active не впаде назад до зміщення</tspan></text>
<line x1="770.0" y1="340.0" x2="810.0" y2="340.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="810.0" y="110.0" width="340.0" height="460.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">3. Завершення та очищення</tspan><tspan x="980.0" dy="16.9">(Звільнення ресурсів)</tspan><tspan x="980.0" dy="16.9"></tspan><tspan x="980.0" dy="16.9">• Останній метод у польоті викликає</tspan><tspan x="980.0" dy="16.9">  kernfs_put_active(): active впало</tspan><tspan x="980.0" dy="16.9">  назад до KN_DEACTIVATED_BIAS</tspan><tspan x="980.0" dy="16.9"></tspan><tspan x="980.0" dy="16.9">• kernfs_drain() розблоковується</tspan><tspan x="980.0" dy="16.9">  та повертає керування драйверу</tspan><tspan x="980.0" dy="16.9"></tspan><tspan x="980.0" dy="16.9">• Драйвер БЕЗПЕЧНО виконує kfree()</tspan><tspan x="980.0" dy="16.9">  для своїх внутрішніх структур!</tspan><tspan x="980.0" dy="16.9"></tspan><tspan x="980.0" dy="16.9">• Гарантія 100%: жоден потік</tspan><tspan x="980.0" dy="16.9">  більше НЕ виконає код драйвера</tspan></text>
</svg>