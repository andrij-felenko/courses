<rect x="50.0" y="90.0" width="500.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">struct kset (наприклад: kernel_kobj)</tspan><tspan x="300.0" dy="16.9">• Містить власний kobject (створює /sys/kernel)</tspan><tspan x="300.0" dy="16.9">• Голова списку елементів list_head list</tspan><tspan x="300.0" dy="16.9">• Обробляє події uevent для всіх підпорядкованих об'єктів</tspan></text>
