<rect x="640.0" y="480.0" width="500.0" height="130.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Операції користувача в терміналі:</tspan><tspan x="890.0" dy="15.6">• cat /sys/kernel/demo_kobj/status</tspan><tspan x="890.0" dy="15.6">   └─ VFS -&gt; sysfs -&gt; ktype-&gt;sysfs_ops-&gt;show()</tspan><tspan x="890.0" dy="15.6">• echo 'val' &gt; /sys/kernel/demo_kobj/control</tspan><tspan x="890.0" dy="15.6">   └─ VFS -&gt; sysfs -&gt; ktype-&gt;sysfs_ops-&gt;store()</tspan></text>
