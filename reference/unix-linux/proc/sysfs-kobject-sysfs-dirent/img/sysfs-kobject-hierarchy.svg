<rect x="50.0" y="250.0" width="500.0" height="170.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">struct kobject (наприклад: demo_kobj)</tspan><tspan x="300.0" dy="16.9">• name: &quot;demo_kobj&quot;  (ім'я каталогу)</tspan><tspan x="300.0" dy="16.9">• kref: refcount_t (лічильник посилань)</tspan><tspan x="300.0" dy="16.9">• parent: вказівник на kset-&gt;kobj</tspan><tspan x="300.0" dy="16.9">• ktype: вказівник на kobj_type</tspan><tspan x="300.0" dy="16.9">• sd: вказівник на kernfs_node (sysfs_dirent)</tspan></text>
<line x1="180.0" y1="420.0" x2="180.0" y2="470.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">визначає поведінку</text>
<rect x="50.0" y="470.0" width="500.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="515.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">struct kobj_type &amp; sysfs_ops</tspan><tspan x="300.0" dy="16.9">• release(kobj): очищення пам'яті при kref == 0</tspan><tspan x="300.0" dy="16.9">• show(kobj, attr, buf): читання атрибута</tspan><tspan x="300.0" dy="16.9">• store(kobj, attr, buf, count): запис атрибута</tspan><tspan x="300.0" dy="16.9">• default_groups: масив атрибутів (status, control)</tspan></text>
