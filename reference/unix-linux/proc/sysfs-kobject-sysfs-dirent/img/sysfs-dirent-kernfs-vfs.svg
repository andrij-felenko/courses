<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1200.0" height="600.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="50.0" y="40.0" width="350.0" height="50.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">1. ОБ'ЄКТИ ЯДРА (Kernel)</tspan></text>
<rect x="445.0" y="40.0" width="350.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">2. ДЕРЕВО KERNFS (sysfs_dirent)</tspan></text>
<rect x="840.0" y="40.0" width="350.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1015.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1015.0" dy="0.0">3. СТРУКТУРИ VFS (On-demand)</tspan></text>
<rect x="50.0" y="120.0" width="350.0" height="160.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">struct kobject</tspan><tspan x="225.0" dy="16.9">• розмір: ~64 байти</tspan><tspan x="225.0" dy="16.9">• тримає граф пристроїв</tspan><tspan x="225.0" dy="16.9">• kref: лічильник посилань</tspan><tspan x="225.0" dy="16.9">• sd ───► вказівник на</tspan><tspan x="225.0" dy="16.9">          kernfs_node</tspan></text>
<line x1="400.0" y1="200.0" x2="445.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="445.0" y="120.0" width="350.0" height="220.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="620.0" y="183.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">struct kernfs_node</tspan><tspan x="620.0" dy="16.9">(історично sysfs_dirent)</tspan><tspan x="620.0" dy="16.9">• розмір: ВСЬОГО ~48-64 байти!</tspan><tspan x="620.0" dy="16.9">• автономне компактне дерево в RAM</tspan><tspan x="620.0" dy="16.9">• зберігає ім'я, права, тип вузла</tspan><tspan x="620.0" dy="16.9">• ПОСТІЙНО живе в пам'яті ядра</tspan><tspan x="620.0" dy="16.9">• НЕ створює об'єктів VFS до звернення!</tspan></text>
<rect x="840.0" y="120.0" width="350.0" height="220.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1015.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">Структури VFS в RAM</tspan><tspan x="1015.0" dy="16.9">• struct dentry (~192 B)</tspan><tspan x="1015.0" dy="16.9">• struct inode (~600 B)</tspan><tspan x="1015.0" dy="16.9">• Створюються ДИНАМІЧНО при lookup/open</tspan><tspan x="1015.0" dy="16.9">• Автоматично ВИДАЛЯЮТЬСЯ</tspan><tspan x="1015.0" dy="16.9">  під тиском пам'яті (VFS shrinker)!</tspan></text>
<line x1="795.0" y1="230.0" x2="840.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="817.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">open() / ls</text>
<rect x="50.0" y="380.0" width="1140.0" height="210.0" rx="8" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/>
<text x="620.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЕКОНОМІЯ ПАМ'ЯТІ НА СЕРВЕРІ З 500 000 АТРИБУТАМИ SYSFS</text>
<rect x="70.0" y="440.0" width="520.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="485.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Стара схема sysfs (до Linux 2.6.23):</tspan><tspan x="330.0" dy="15.6">500 000 атрибутів × (dentry 192 B + inode 600 B)</tspan><tspan x="330.0" dy="15.6">= ~400 МБ НЕСВАПОВАНОЇ ПАМ'ЯТІ SLAB</tspan><tspan x="330.0" dy="15.6">(виділялося постійно, навіть якщо /sys не відкривали)</tspan></text>
<rect x="630.0" y="440.0" width="540.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="485.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Сучасна схема з kernfs (починаючи з Linux 2.6.23 / 3.14):</tspan><tspan x="900.0" dy="15.6">500 000 атрибутів × kernfs_node 48 B = ~24 МБ ПАМ'ЯТІ!</tspan><tspan x="900.0" dy="15.6">VFS dentry/inode виділяються лише для відкритих файлів</tspan><tspan x="900.0" dy="15.6">Економія: понад 370 МБ RAM на порожньому місці</tspan></text>
</svg>