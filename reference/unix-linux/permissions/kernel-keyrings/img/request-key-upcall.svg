<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик назовні: ядру бракує ключа</text>
<rect x="40.0" y="84.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Ядро потребує ключ</tspan><tspan x="200.0" dy="16.9">і не знаходить його</tspan><tspan x="200.0" dy="16.9">на кільцях того, хто просить</tspan></text>
<rect x="440.0" y="84.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Створює ключ у стані</tspan><tspan x="600.0" dy="16.9">«ще не наповнений»</tspan><tspan x="600.0" dy="16.9">і чіпляє його на кільце</tspan></text>
<rect x="840.0" y="84.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">Разом із ним — ключ-повноваження</tspan><tspan x="1000.0" dy="16.9">рівно на цей один ключ</tspan></text>
<rect x="840.0" y="294.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">Запускає /sbin/request-key;</tspan><tspan x="1000.0" dy="16.9">той за /etc/request-key.conf</tspan><tspan x="1000.0" dy="16.9">обирає обробник</tspan></text>
<rect x="440.0" y="294.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Обробник у просторі користувача</tspan><tspan x="600.0" dy="16.9">добуває матеріал: Kerberos, DNS,</tspan><tspan x="600.0" dy="16.9">відображення ідентифікаторів</tspan></text>
<rect x="40.0" y="294.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">keyctl instantiate — ключ наповнено,</tspan><tspan x="200.0" dy="16.9">той, хто чекав, прокидається</tspan></text>
<line x1="360.0" y1="130.0" x2="440.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="130.0" x2="840.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="176.0" x2="1000.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="840.0" y1="340.0" x2="760.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="340.0" x2="360.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="386.0" x2="600.0" y2="434.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="440.0" width="460.0" height="76.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="465.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">не вийшло → від'ємне наповнення:</tspan><tspan x="600.0" dy="16.9">помилка кешується, і наступні запити</tspan><tspan x="600.0" dy="16.9">не плодять нових процесів</tspan></text>
</svg>