<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 634" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="634" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка між access() і open() у setuid-помічнику</text>
<text x="300.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">помічник, euid 0</text>
<text x="950.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">нападник, uid 1000</text>
<line x1="625.0" y1="80.0" x2="625.0" y2="500.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 6"/>
<text x="625.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час</text>
<line x1="625.0" y1="500.0" x2="625.0" y2="522.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="106.6" width="420.0" height="66.8" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">access(&quot;/tmp/u/out.log&quot;, W_OK)</tspan><tspan x="300.0" dy="16.9">перевірка йде за ruid 1000</tspan><tspan x="300.0" dy="16.9">файл справді ваш — «так»</tspan></text>
<rect x="740.0" y="256.6" width="420.0" height="66.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="950.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">unlink(&quot;/tmp/u/out.log&quot;)</tspan><tspan x="950.0" dy="16.9">symlink(&quot;/etc/shadow&quot;, &quot;/tmp/u/out.log&quot;)</tspan><tspan x="950.0" dy="16.9">ім'я лишилося те саме — веде вже не туди</tspan></text>
<rect x="90.0" y="406.6" width="420.0" height="66.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">open(&quot;/tmp/u/out.log&quot;, O_WRONLY)</tspan><tspan x="300.0" dy="16.9">відкриття йде за euid 0</tspan><tspan x="300.0" dy="16.9">відкрився /etc/shadow</tspan></text>
<rect x="120.0" y="570.0" width="1000.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="596.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">перевіряли ім'я, а відкрили об'єкт — і між двома викликами це вже різні речі</tspan></text>
</svg>