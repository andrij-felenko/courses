<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з успадкованого оточення знімає система, а що лишає програмі</text>
<text x="240.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">обирає той, хто запускає</text>
<rect x="45.0" y="90.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">argv, включно з argv[0] і порожнім</tspan></text>
<rect x="45.0" y="158.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">оточення: PATH, IFS, TZ, LOCPATH</tspan></text>
<rect x="45.0" y="226.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">дескриптори 0, 1, 2 і залишені відкритими</tspan></text>
<rect x="45.0" y="294.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">робочий каталог і umask</tspan></text>
<rect x="45.0" y="362.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="392.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">обмеження ресурсів, зокрема RLIMIT_FSIZE</tspan></text>
<rect x="45.0" y="430.0" width="390.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="460.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">маска й диспозиції сигналів</tspan></text>
<line x1="480.0" y1="90.0" x2="480.0" y2="500.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 6"/>
<rect x="403.3" y="535.0" width="153.4" height="49.9" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="556.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">межа: exec файлу</tspan><tspan x="480.0" dy="16.9">з бітом підвищення</tspan></text>
<rect x="530.0" y="90.0" width="650.0" height="190.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="855.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">прибирає ядро й бібліотека, бо інакше зламало б будь-яку програму</tspan><tspan x="855.0" dy="16.9">AT_SECURE = 1: LD_PRELOAD, LD_LIBRARY_PATH, LD_AUDIT ігноруються</tspan><tspan x="855.0" dy="16.9">закриті 0, 1, 2 ядро відкриває на /dev/null</tspan><tspan x="855.0" dy="16.9">дамп не пишеться, ptrace не приєднається</tspan><tspan x="855.0" dy="16.9">процес уже під трасуванням — підвищення не робиться взагалі</tspan></text>
<rect x="530.0" y="320.0" width="650.0" height="190.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="855.0" y="385.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">лишається на совісті самої програми</tspan><tspan x="855.0" dy="16.9">PATH перед запуском будь-якої дочірньої команди</tspan><tspan x="855.0" dy="16.9">IFS перед system() і popen()</tspan><tspan x="855.0" dy="16.9">зайві успадковані дескриптори й робочий каталог</tspan><tspan x="855.0" dy="16.9">довжина та вміст кожного аргументу</tspan></text>
</svg>