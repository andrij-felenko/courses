<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Домен призначають на exec, і не за проханням процесу</text>
<rect x="180.0" y="70.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">процес init</tspan><tspan x="330.0" dy="19.5">домен init_t</tspan></text>
<line x1="484.0" y1="109.0" x2="546.0" y2="109.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="552.0" y="64.0" width="380.0" height="90.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="742.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">exec /usr/sbin/httpd</tspan><tspan x="742.0" dy="19.5">мітка файлу httpd_exec_t</tspan></text>
<rect x="310.0" y="206.0" width="560.0" height="196.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="326.0" y="218.0" width="528.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">політика вирішує, ким стане процес</tspan></text>
<rect x="326.0" y="266.0" width="528.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="290.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">1 · type_transition для цієї пари</tspan></text>
<rect x="326.0" y="310.0" width="528.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">2 · джерелу дозволено перехід</tspan></text>
<rect x="326.0" y="354.0" width="528.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">3 · файл визнано входом (entrypoint)</tspan></text>
<line x1="742.0" y1="156.0" x2="640.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="460.0" width="470.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="325.0" y="507.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">усі три умови виконано —</tspan><tspan x="325.0" dy="19.5">новий процес працює в домені httpd_t</tspan></text>
<rect x="620.0" y="460.0" width="470.0" height="128.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="855.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">запустили копію того самого файлу</tspan><tspan x="855.0" dy="19.5">з іншою міткою: входу нема,</tspan><tspan x="855.0" dy="19.5">переходу нема — процес лишається в init_t</tspan></text>
<line x1="470.0" y1="404.0" x2="330.0" y2="456.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="404.0" x2="852.0" y2="456.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="626.0" width="1000.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="662.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">UID процесу в обох випадках той самий: домен призначає політика, а не той, хто запускає.</tspan></text>
</svg>