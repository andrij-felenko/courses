<line x1="362.0" y1="186.0" x2="426.0" y2="136.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="362.0" y1="214.0" x2="426.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="978.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">SELinux питає мітку</text>
<rect x="818.0" y="104.0" width="322.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="979.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="979.0" dy="0.0">обидва імені ведуть</tspan><tspan x="979.0" dy="18.2">до одного типу —</tspan><tspan x="979.0" dy="18.2">відповідь одна</tspan></text>
<text x="978.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">AppArmor питає шлях</text>
<rect x="818.0" y="256.0" width="322.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="979.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="979.0" dy="0.0">перше ім'я збігається</tspan><tspan x="979.0" dy="18.2">з правилом, друге — ні:</tspan><tspan x="979.0" dy="18.2">відповіді дві</tspan></text>
<line x1="764.0" y1="128.0" x2="814.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="764.0" y1="262.0" x2="814.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="420.0" width="1080.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="465.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Мітка є властивістю об'єкта: переживає перейменування, однакова для всіх жорстких посилань.</tspan><tspan x="600.0" dy="19.5">Шлях є властивістю запису в каталозі — а таких записів у одного об'єкта може бути скільки завгодно.</tspan></text>
