<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чим назвати сторони: міткою чи шляхом</text>
<rect x="60.0" y="120.0" width="300.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">inode 1049601</tspan><tspan x="210.0" dy="19.5"></tspan><tspan x="210.0" dy="19.5">security.selinux =</tspan><tspan x="210.0" dy="19.5">…:httpd_sys_content_t</tspan></text>
<text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">один об'єкт, два імені</text>
<rect x="430.0" y="100.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">/var/www/html/index.html</tspan></text>
