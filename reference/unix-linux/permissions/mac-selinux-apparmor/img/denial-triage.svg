<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 1064" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="1064" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від Permission denied до правила: два діагнози й одна розвилка</text>
<rect x="60.0" y="40.0" width="520.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">служба дістає Permission denied</tspan></text>
<rect x="60.0" y="130.0" width="520.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">sudo -u &lt;користувач&gt; читає той самий файл?</tspan><tspan x="320.0" dy="19.5">так → дев'ять бітів і ACL тут ні до чого</tspan></text>
<rect x="660.0" y="130.0" width="520.0" height="72.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="920.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">ні → відмова класична: біти, ACL,</tspan><tspan x="920.0" dy="19.5">монтування лише для читання</tspan></text>
<line x1="586.0" y1="166.0" x2="654.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="236.0" width="520.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">semanage permissive -a &lt;домен&gt;</tspan><tspan x="320.0" dy="19.5">повторити спробу — тепер проходить?</tspan></text>
<rect x="660.0" y="236.0" width="520.0" height="72.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="920.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">ні → винна не політика</tspan></text>
<line x1="586.0" y1="272.0" x2="654.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="342.0" width="520.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="373.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ausearch -m AVC -ts recent</tspan><tspan x="320.0" dy="19.5">чи є запис про відмову?</tspan></text>
<rect x="660.0" y="342.0" width="520.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="373.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">запису нема → semodule -DB зніме</tspan><tspan x="920.0" dy="19.5">глушники dontaudit; повторити</tspan></text>
<line x1="586.0" y1="378.0" x2="654.0" y2="378.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="448.0" width="520.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="481.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">restorecon -n -v &lt;ціль&gt;</tspan><tspan x="320.0" dy="19.5">чи пропонує іншу мітку?</tspan></text>
<rect x="660.0" y="448.0" width="520.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="481.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">так → діагноз «мітка»:</tspan><tspan x="920.0" dy="19.5">semanage fcontext -a -t … ; restorecon -Rv</tspan></text>
<line x1="586.0" y1="486.0" x2="654.0" y2="486.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="558.0" width="520.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="591.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ні → мітка вже така, як має бути</tspan><tspan x="320.0" dy="19.5">audit2why: чи закриває це якийсь булеан?</tspan></text>
<rect x="660.0" y="558.0" width="520.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="591.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">булеан є → setsebool -P … on;</tspan><tspan x="920.0" dy="19.5">власний модуль не потрібен</tspan></text>
<line x1="586.0" y1="596.0" x2="654.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="668.0" width="520.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="320.0" y="701.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">audit2allow -M &lt;ім'я&gt;</tspan><tspan x="320.0" dy="19.5">прочитати .te очима, викинути широкі правила</tspan></text>
<rect x="60.0" y="778.0" width="520.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="811.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">semodule -i &lt;ім'я&gt;.pp</tspan></text>
<rect x="60.0" y="868.0" width="520.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="901.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">semanage permissive -d &lt;домен&gt;</tspan><tspan x="320.0" dy="19.5">перевірити в Enforcing: журнал чистий</tspan></text>
<line x1="320.0" y1="96.0" x2="320.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="202.0" x2="320.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="308.0" x2="320.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="414.0" x2="320.0" y2="448.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="524.0" x2="320.0" y2="558.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="634.0" x2="320.0" y2="668.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="744.0" x2="320.0" y2="778.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="834.0" x2="320.0" y2="868.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="964.0" width="1120.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="997.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">setenforce 0 у цьому ланцюжку не потрібен жодного разу: дозвільним стає рівно один домен.</tspan></text>
</svg>