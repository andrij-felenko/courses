<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій відбору — не назва інтерфейсу, а те, чим він закінчується</text>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">різні інтерфейси — два спільні наслідки</text>
<rect x="60.0" y="70.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">прямий запис у пам'ять</tspan><tspan x="260.0" dy="16.9">/dev/mem, /dev/port</tspan></text>
<line x1="464.0" y1="108.0" x2="776.0" y2="274.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="166.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">власний код у ядрі</tspan><tspan x="260.0" dy="16.9">непідписаний модуль, kexec</tspan></text>
<line x1="464.0" y1="204.0" x2="776.0" y2="274.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="262.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">залізо як посередник</tspan><tspan x="260.0" dy="16.9">PCI BAR, порти, MSR, параметри модуля</tspan></text>
<line x1="464.0" y1="300.0" x2="776.0" y2="274.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="358.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">таблиці прошивки</tspan><tspan x="260.0" dy="16.9">ACPI custom_method, підміна таблиць</tspan></text>
<line x1="464.0" y1="396.0" x2="776.0" y2="274.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="454.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">налагодження з правом запису</tspan><tspan x="260.0" dy="16.9">kgdb, bpf у пам'ять процесу</tspan></text>
<line x1="464.0" y1="492.0" x2="776.0" y2="274.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="780.0" y="214.0" width="460.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">довільний запис</tspan><tspan x="1010.0" dy="22.1">у пам'ять ядра</tspan></text>
<rect x="780.0" y="348.0" width="460.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">рівень integrity закриває це</tspan></text>
<rect x="60.0" y="570.0" width="400.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="260.0" y="604.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">читання пам'яті ядра</tspan><tspan x="260.0" dy="16.9">/proc/kcore, perf, tracefs, bpf</tspan></text>
<line x1="464.0" y1="608.0" x2="776.0" y2="530.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="780.0" y="470.0" width="460.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="524.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">видача вмісту</tspan><tspan x="1010.0" dy="22.1">пам'яті ядра назовні</tspan></text>
<rect x="780.0" y="604.0" width="460.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="630.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">додає рівень confidentiality</tspan></text>
</svg>