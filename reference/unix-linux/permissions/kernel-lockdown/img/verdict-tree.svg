<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сам код повернення нічого не доводить: вирок складають із трьох свідчень</text>
<text x="670.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">стук у двері повернув — і що з цього випливає</text>
<rect x="50.0" y="250.0" width="250.0" height="110.0" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">виклик, у якому</tspan><tspan x="175.0" dy="19.5">стоїть перевірка</tspan></text>
<rect x="360.0" y="70.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">0 — дескриптор відкрився,</tspan><tspan x="570.0" dy="16.9">виклик пройшов</tspan></text>
<line x1="304.0" y1="305.0" x2="356.0" y2="120.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="784.0" y1="120.0" x2="836.0" y2="120.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="840.0" y="70.0" width="450.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1065.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">двері відчинені: на цьому рівні</tspan><tspan x="1065.0" dy="16.9">ця причина не закрита</tspan></text>
<rect x="360.0" y="192.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">−EPERM, і в журналі ядра</tspan><tspan x="570.0" dy="16.9">з'явився рядок «Lockdown: …»</tspan></text>
<line x1="304.0" y1="305.0" x2="356.0" y2="242.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="784.0" y1="242.0" x2="836.0" y2="242.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="840.0" y="192.0" width="450.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1065.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">зачинило блокування;</tspan><tspan x="1065.0" dy="16.9">у рядку — назва причини</tspan></text>
<rect x="360.0" y="314.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.5"/><text x="570.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">−EPERM, журнал мовчить</tspan></text>
<line x1="304.0" y1="305.0" x2="356.0" y2="364.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="784.0" y1="364.0" x2="836.0" y2="364.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="840.0" y="314.0" width="450.0" height="100.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1065.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">інша перевірка: немає CAP_SYS_RAWIO,</tspan><tspan x="1065.0" dy="16.9">SELinux, STRICT_DEVMEM, allow_writes=off</tspan></text>
<rect x="360.0" y="436.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="490.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">−ENOENT, −ENXIO, −ENODEV</tspan></text>
<line x1="304.0" y1="305.0" x2="356.0" y2="486.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="784.0" y1="486.0" x2="836.0" y2="486.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="840.0" y="436.0" width="450.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1065.0" y="482.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">дверей немає: ядро зібрано</tspan><tspan x="1065.0" dy="16.9">без цього інтерфейсу</tspan></text>
<rect x="360.0" y="552.0" width="930.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="579.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">рядок у журналі рвано-обмежений — стукати треба поволі й по одних дверях за раз</tspan></text>
</svg>