<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази управління PAM та логіка контрольних прапорців</text>
<rect x="40.0" y="48.1" width="240.0" height="83.7" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. auth</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">Перевірка токена та</tspan><tspan x="160.0" dy="16.9">встановлення UID/груп</tspan></text>
<rect x="309.1" y="48.1" width="261.8" height="83.7" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">2. account</tspan><tspan x="440.0" dy="16.9"></tspan><tspan x="440.0" dy="16.9">Перевірка терміну дії,</tspan><tspan x="440.0" dy="16.9">доступу за часом та блокування</tspan></text>
<rect x="600.0" y="48.1" width="240.0" height="83.7" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">3. session</tspan><tspan x="720.0" dy="16.9"></tspan><tspan x="720.0" dy="16.9">Монтування home, rlimit,</tspan><tspan x="720.0" dy="16.9">keyring, systemd scope</tspan></text>
<rect x="880.0" y="48.1" width="240.0" height="83.7" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">4. password</tspan><tspan x="1000.0" dy="16.9"></tspan><tspan x="1000.0" dy="16.9">Зміна пароля та перевірка</tspan><tspan x="1000.0" dy="16.9">складності (pwquality)</tspan></text>
<text x="590.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка контрольних прапорців у стеку</text>
<rect x="60.0" y="290.0" width="160.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">required</tspan></text>
<rect x="240.0" y="290.0" width="880.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Невдача фіксується у лічильнику, але стек продовжує виконання (приховує фатальний модуль).</tspan></text>
<rect x="60.0" y="344.0" width="160.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">requisite</tspan></text>
<rect x="240.0" y="344.0" width="880.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Невдача негайно перериває виконати стеку з помилкою (оптимізація без обходу решти).</tspan></text>
<rect x="60.0" y="398.0" width="160.0" height="44.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">sufficient</tspan></text>
<rect x="240.0" y="398.0" width="880.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Успіх негайно завершує стек із PAM_SUCCESS (якщо не було попередніх помилок required).</tspan></text>
<rect x="60.0" y="452.0" width="160.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="478.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">optional</tspan></text>
<rect x="240.0" y="452.0" width="880.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="478.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Результат враховується лише якщо це єдиний модуль у стеку або решта повернули PAM_IGNORE.</tspan></text>
</svg>