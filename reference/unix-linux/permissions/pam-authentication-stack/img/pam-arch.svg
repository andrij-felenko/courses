<rect x="191.7" y="415.1" width="716.5" height="49.9" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Застосунок викликає стандартизований API (pam_authenticate), libpam зчитує стеки з /etc/pam.d/</tspan><tspan x="550.0" dy="16.9">та динамічно завантажує необхідні .so модулі через dlopen()</tspan></text>
</svg>