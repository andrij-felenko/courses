<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трирівнева архітектура Pluggable Authentication Modules</text>
<rect x="80.0" y="83.9" width="240.0" height="52.2" rx="6" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Застосунки</tspan><tspan x="200.0" dy="18.2">(sshd, sudo, login, su)</tspan></text>
<rect x="420.0" y="83.9" width="260.0" height="52.2" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Бібліотека libpam.so</tspan><tspan x="550.0" dy="18.2">(PAM API &amp; SPI Двигун)</tspan></text>
<rect x="420.0" y="215.1" width="260.0" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Конфігурація /etc/pam.d/</tspan><tspan x="550.0" dy="16.9">(правила стеків та прапорці)</tspan></text>
<rect x="800.0" y="55.0" width="200.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">pam_unix.so</tspan><tspan x="900.0" dy="16.9">(shadow/passwd)</tspan></text>
<rect x="800.0" y="135.1" width="200.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">pam_faillock.so</tspan><tspan x="900.0" dy="16.9">(блокування)</tspan></text>
<rect x="800.0" y="215.1" width="200.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">pam_limits.so</tspan><tspan x="900.0" dy="16.9">(обмеження rlimit)</tspan></text>
<rect x="800.0" y="295.1" width="200.0" height="49.9" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">pam_systemd.so</tspan><tspan x="900.0" dy="16.9">(cgroups/cgroupsv2)</tspan></text>
