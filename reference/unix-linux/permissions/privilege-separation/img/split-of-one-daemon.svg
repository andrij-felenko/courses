<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий демон до поділу привілеїв і після нього</text>
<text x="320.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">один процес</text>
<text x="980.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">після поділу</text>
<rect x="85.0" y="128.4" width="470.0" height="143.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="150.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">процес із euid 0</tspan><tspan x="320.0" dy="18.2"></tspan><tspan x="320.0" dy="18.2">розбір протоколу: тисячі рядків,</tspan><tspan x="320.0" dy="18.2">кожен байт складає незнайомець</tspan><tspan x="320.0" dy="18.2"></tspan><tspan x="320.0" dy="18.2">ключ хоста, файл хешів,</tspan><tspan x="320.0" dy="18.2">псевдотермінал, база входів</tspan></text>
<line x1="320.0" y1="271.6" x2="320.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="493.9" width="400.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="515.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">помилка будь-де в розборі</tspan><tspan x="320.0" dy="18.2">коштує всієї машини</tspan></text>
<rect x="745.0" y="129.8" width="470.0" height="70.4" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">робітник: жодних прав, у клітці</tspan><tspan x="980.0" dy="18.2"></tspan><tspan x="980.0" dy="18.2">увесь розбір протоколу тут</tspan></text>
<rect x="780.0" y="303.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">канал: кілька сталих запитів</tspan></text>
<line x1="980.0" y1="200.2" x2="980.0" y2="303.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="980.0" y1="336.5" x2="980.0" y2="430.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="745.0" y="433.4" width="470.0" height="143.2" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="455.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">монітор: euid 0</tspan><tspan x="980.0" dy="18.2"></tspan><tspan x="980.0" dy="18.2">підпиши блок ключем хоста</tspan><tspan x="980.0" dy="18.2">чи правильний цей пароль</tspan><tspan x="980.0" dy="18.2">готуй сесію для того, хто увійшов</tspan><tspan x="980.0" dy="18.2">дай псевдотермінал</tspan><tspan x="980.0" dy="18.2">запиши рядок про вхід</tspan></text>
<rect x="760.0" y="633.9" width="440.0" height="52.2" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="655.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">помилка в розборі коштує процесу,</tspan><tspan x="980.0" dy="18.2">який і сам нічого не має</tspan></text>
</svg>