<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фільтр незворотний і успадковується — звідси й умова допуску</text>
<rect x="70.0" y="70.0" width="520.0" height="122.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">процес-запускач</tspan><tspan x="330.0" dy="19.5">1. виставляє no_new_privs</tspan><tspan x="330.0" dy="19.5">2. встановлює фільтр</tspan><tspan x="330.0" dy="19.5">3. робить exec</tspan></text>
<line x1="330.0" y1="192.0" x2="330.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">exec</text>
<rect x="70.0" y="250.0" width="520.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="330.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">нова програма на місці старої</tspan><tspan x="330.0" dy="19.5">образ замінено, а фільтр і прапорець лишилися</tspan></text>
<line x1="330.0" y1="354.0" x2="330.0" y2="412.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">fork</text>
<rect x="70.0" y="412.0" width="520.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="330.0" y="459.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">нащадок</tspan><tspan x="330.0" dy="18.2">успадкував і фільтр, і прапорець, зняти не може ні той, ні той</tspan></text>
<rect x="660.0" y="70.0" width="570.0" height="176.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="945.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="945.0" dy="0.0">щоб узагалі встановити фільтр, потрібне одне з двох:</tspan><tspan x="945.0" dy="19.5"></tspan><tspan x="945.0" dy="19.5">· CAP_SYS_ADMIN у своєму просторі імен користувачів</tspan><tspan x="945.0" dy="19.5">· виставлений прапорець no_new_privs</tspan></text>
<rect x="660.0" y="280.0" width="570.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="945.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">no_new_privs означає рівно одне:</tspan><tspan x="945.0" dy="18.2">exec більше ніколи не додасть повноважень —</tspan><tspan x="945.0" dy="18.2">біти setuid і setgid та файлові можливості</tspan><tspan x="945.0" dy="18.2">перестають діяти для цього процесу й усіх нащадків</tspan></text>
<rect x="660.0" y="464.0" width="570.0" height="210.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="531.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">чого це не дає статися</tspan><tspan x="945.0" dy="16.9"></tspan><tspan x="945.0" dy="16.9">без прапорця фільтр пережив би exec програми з бітом setuid</tspan><tspan x="945.0" dy="16.9">і змусив би її скидання привілеїв провалитися;</tspan><tspan x="945.0" dy="16.9">програма, яка не перевіряє код повернення,</tspan><tspan x="945.0" dy="16.9">лишилася б root, гадаючи, що вже ні</tspan></text>
<rect x="70.0" y="570.0" width="520.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="609.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">фільтр не знімається ніколи:</tspan><tspan x="330.0" dy="16.9">інтерфейсу зняття немає, бо вихід із пісочниці</tspan><tspan x="330.0" dy="16.9">коштував би один системний виклик</tspan></text>
</svg>