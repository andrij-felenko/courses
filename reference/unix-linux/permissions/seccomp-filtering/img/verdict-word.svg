<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вирок фільтра і чому суворіший завжди перемагає</text>
<text x="360.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">32-бітне слово, яке повертає програма фільтра</text>
<rect x="60.0" y="92.0" width="300.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">старші 16 бітів</tspan><tspan x="210.0" dy="19.5">ДІЯ</tspan></text>
<rect x="360.0" y="92.0" width="300.0" height="78.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="510.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">молодші 16 бітів</tspan><tspan x="510.0" dy="19.5">ДАНІ ДО ДІЇ</tspan></text>
<rect x="60.0" y="186.0" width="600.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="219.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">для ERRNO тут номер помилки (EPERM чи ENOSYS),</tspan><tspan x="360.0" dy="16.9">для TRAP і TRACE — довільне число для обробника чи наглядача</tspan></text>
<text x="1000.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">шкала дій: від найдозвільнішої до найсуворішої</text>
<rect x="700.0" y="100.0" width="210.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">ALLOW</tspan></text>
<rect x="920.0" y="100.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="132.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x7fff0000</tspan></text>
<rect x="1080.0" y="100.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">виклик виконується як завжди</tspan></text>
<rect x="700.0" y="170.0" width="210.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">LOG</tspan></text>
<rect x="920.0" y="170.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x7ffc0000</tspan></text>
<rect x="1080.0" y="170.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">виконується, але лишає запис в аудиті</tspan></text>
<rect x="700.0" y="240.0" width="210.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">TRACE</tspan></text>
<rect x="920.0" y="240.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x7ff00000</tspan></text>
<rect x="1080.0" y="240.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">рішення передано наглядачеві ptrace</tspan></text>
<rect x="700.0" y="310.0" width="210.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">USER_NOTIF</tspan></text>
<rect x="920.0" y="310.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x7fc00000</tspan></text>
<rect x="1080.0" y="310.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">рішення передано процесу-наглядачеві</tspan></text>
<rect x="700.0" y="380.0" width="210.0" height="56.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="805.0" y="413.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">ERRNO</tspan></text>
<rect x="920.0" y="380.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="412.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x00050000</tspan></text>
<rect x="1080.0" y="380.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">обробник не запускається, повертається помилка</tspan></text>
<rect x="700.0" y="450.0" width="210.0" height="56.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="805.0" y="483.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">TRAP</tspan></text>
<rect x="920.0" y="450.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="482.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x00030000</tspan></text>
<rect x="1080.0" y="450.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="481.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">потокові надсилається сигнал SIGSYS</tspan></text>
<rect x="700.0" y="520.0" width="210.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="553.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">KILL_THREAD</tspan></text>
<rect x="920.0" y="520.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="552.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x00000000</tspan></text>
<rect x="1080.0" y="520.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="551.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">гине потік, решта процесу живе</tspan></text>
<rect x="700.0" y="590.0" width="210.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="623.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">KILL_PROCESS</tspan></text>
<rect x="920.0" y="590.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="995.0" y="622.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">0x80000000</tspan></text>
<rect x="1080.0" y="590.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="621.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">гине весь процес</tspan></text>
<rect x="700.0" y="676.0" width="580.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="709.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">як ЗНАКОВІ 32-бітні числа цей стовпчик спадає:</tspan><tspan x="990.0" dy="16.9">0x80000000 — найменше від'ємне, 0x7fff0000 — найбільше додатне</tspan></text>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">три встановлені фільтри проганяються всі</text>
<rect x="60.0" y="344.0" width="170.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">фільтр 1</tspan><tspan x="145.0" dy="18.2">↓</tspan><tspan x="145.0" dy="18.2">ALLOW</tspan></text>
<line x1="145.0" y1="440.0" x2="360.0" y2="500.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260.0" y="344.0" width="170.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="345.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">фільтр 2</tspan><tspan x="345.0" dy="18.2">↓</tspan><tspan x="345.0" dy="18.2">ERRNO</tspan></text>
<line x1="345.0" y1="440.0" x2="360.0" y2="500.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="344.0" width="170.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">фільтр 3</tspan><tspan x="545.0" dy="18.2">↓</tspan><tspan x="545.0" dy="18.2">ALLOW</tspan></text>
<line x1="545.0" y1="440.0" x2="360.0" y2="500.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="500.0" width="320.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="541.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">мінімум</tspan></text>
<line x1="360.0" y1="570.0" x2="360.0" y2="616.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="616.0" width="320.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="360.0" y="657.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">ERRNO</tspan></text>
<rect x="60.0" y="716.0" width="600.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="751.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">тому доданий фільтр ніколи не розширює дозволеного:</tspan><tspan x="360.0" dy="16.9">щоб вирок став дозвільнішим, мінімум мав би зрости,</tspan><tspan x="360.0" dy="16.9">а новий доданок мінімум лише зменшує</tspan></text>
</svg>