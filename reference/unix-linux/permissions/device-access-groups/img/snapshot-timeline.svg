<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перелік груп як знімок і момент його перезбирання</text>
<rect x="60.0" y="46.0" width="700.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">що відбувається з переліком груп у часі</tspan></text>
<rect x="60.0" y="132.0" width="300.0" height="80.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">вхід у систему</tspan></text>
<rect x="380.0" y="132.0" width="380.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">login читає /etc/group і кладе перелік</tspan><tspan x="570.0" dy="16.9">у процес сеансу: [1000]</tspan></text>
<rect x="60.0" y="254.0" width="300.0" height="80.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="210.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">sudo usermod -aG dialout andrij</tspan></text>
<rect x="380.0" y="254.0" width="380.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="290.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">змінився ФАЙЛ на диску; жоден</tspan><tspan x="570.0" dy="16.9">з працюючих процесів його не перечитує</tspan></text>
<rect x="60.0" y="376.0" width="300.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">у старому терміналі</tspan></text>
<rect x="380.0" y="376.0" width="380.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">id показує [1000]</tspan><tspan x="570.0" dy="16.9">open(&quot;/dev/ttyUSB0&quot;) → EACCES</tspan></text>
<rect x="60.0" y="498.0" width="300.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="536.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">новий вхід — або newgrp dialout</tspan></text>
<rect x="380.0" y="498.0" width="380.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="536.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">перелік збирають наново: [1000, 20]</tspan></text>
<rect x="60.0" y="608.0" width="300.0" height="80.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="652.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">у новій оболонці</tspan></text>
<rect x="380.0" y="608.0" width="380.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="644.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">id показує [1000, 20]</tspan><tspan x="570.0" dy="16.9">open(&quot;/dev/ttyUSB0&quot;) → дозволено</tspan></text>
<line x1="210.0" y1="216.0" x2="210.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="338.0" x2="210.0" y2="372.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="460.0" x2="210.0" y2="494.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="570.0" x2="210.0" y2="604.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="800.0" y="132.0" width="380.0" height="190.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">чому нова вкладка термінала</tspan><tspan x="990.0" dy="16.9">зазвичай не допомагає</tspan><tspan x="990.0" dy="16.9"></tspan><tspan x="990.0" dy="16.9">вона відгалужується від процесу</tspan><tspan x="990.0" dy="16.9">графічного сеансу, а той тримає</tspan><tspan x="990.0" dy="16.9">старий знімок і копіює його</tspan><tspan x="990.0" dy="16.9">усім своїм нащадкам</tspan></text>
<rect x="800.0" y="352.0" width="380.0" height="176.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="402.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">newgrp і sg — маленькі програми</tspan><tspan x="990.0" dy="16.9">з бітом set-user-ID</tspan><tspan x="990.0" dy="16.9"></tspan><tspan x="990.0" dy="16.9">вони звіряються з базою облікових</tspan><tspan x="990.0" dy="16.9">записів самі й запускають оболонку</tspan><tspan x="990.0" dy="16.9">з наново зібраним переліком</tspan></text>
<rect x="60.0" y="700.0" width="1120.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="733.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">перелік груп ніколи не «оновлюється» — він лише створюється наново разом із процесом;</tspan><tspan x="620.0" dy="18.2">тому порада «перелогінься» стосується не звички, а єдиного каналу, яким число туди потрапляє</tspan></text>
</svg>