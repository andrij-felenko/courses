<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура struct cred та RCU оновлення у ядрі</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура struct cred у ядрі Linux та RCU-модифікація</text>
<rect x="30.0" y="100.0" width="200.0" height="140.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">task_struct</tspan><tspan x="130.0" dy="15.6">(процес / нитка)</tspan><tspan x="130.0" dy="15.6"></tspan><tspan x="130.0" dy="15.6">real_cred ──┐</tspan><tspan x="130.0" dy="15.6">cred ────────┼──►</tspan></text>
<rect x="280.0" y="100.0" width="260.0" height="140.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Стара struct cred (read-only)</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">ruid: 1000   euid: 0</tspan><tspan x="410.0" dy="15.6">suid: 0      fsuid: 0</tspan><tspan x="410.0" dy="15.6">usage counter &gt; 0</tspan></text>
<rect x="280.0" y="280.0" width="260.0" height="140.0" rx="6" fill="#eef3fd" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Нова struct cred (prepare_creds)</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">ruid: 1000   euid: 1000</tspan><tspan x="410.0" dy="15.6">suid: 1000   fsuid: 1000</tspan><tspan x="410.0" dy="15.6">(копіюється і змінюється)</tspan></text>
<rect x="590.0" y="100.0" width="330.0" height="320.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="755.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">RCU Патерн у ядрі:</tspan><tspan x="755.0" dy="13.0"></tspan><tspan x="755.0" dy="13.0">1. prepare_creds(): створюється дублікат struct cred</tspan><tspan x="755.0" dy="13.0">2. Зміна полів (наприклад, setresuid)</tspan><tspan x="755.0" dy="13.0">3. commit_creds(): атомарно task-&gt;cred = new_cred</tspan><tspan x="755.0" dy="13.0">4. Стара структура звільняється через RCU callback</tspan></text>
<line x1="230.0" y1="150.0" x2="280.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="250.0" y1="150.0" x2="250.0" y2="350.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<line x1="250.0" y1="350.0" x2="280.0" y2="350.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">commit_creds()</text>
<rect x="30.0" y="430.0" width="890.0" height="40.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="475.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Незмінність (immutability) struct cred унеможливлює race condition: інші нитки бачать старі чи нові креденшели повністю.</tspan></text>
</svg>