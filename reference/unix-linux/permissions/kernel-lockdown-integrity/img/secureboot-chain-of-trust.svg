<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безперервний ланцюжок довіри: від перевірки прошивки UEFI до захисту Lockdown у runtime</text>
<rect x="15.0" y="100.0" width="190.0" height="240.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. Прошивка UEFI</tspan><tspan x="110.0" dy="16.9"></tspan><tspan x="110.0" dy="16.9">Перевірка підпису</tspan><tspan x="110.0" dy="16.9">завантажувача</tspan><tspan x="110.0" dy="16.9">(Secure Boot DB)</tspan></text>
<line x1="210.0" y1="220.0" x2="225.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="100.0" width="190.0" height="240.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="325.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">2. Shim / GRUB</tspan><tspan x="325.0" dy="16.9"></tspan><tspan x="325.0" dy="16.9">Перевірка підпису</tspan><tspan x="325.0" dy="16.9">образу ядра Linux</tspan><tspan x="325.0" dy="16.9">(vmlinuz)</tspan></text>
<line x1="425.0" y1="220.0" x2="440.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="445.0" y="100.0" width="190.0" height="240.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="540.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">3. Ядро Linux</tspan><tspan x="540.0" dy="16.9"></tspan><tspan x="540.0" dy="16.9">Перевірка прапорця</tspan><tspan x="540.0" dy="16.9">EFI_SECURE_BOOT</tspan><tspan x="540.0" dy="16.9">під час старту</tspan></text>
<line x1="640.0" y1="220.0" x2="655.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="100.0" width="190.0" height="240.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">4. Lockdown LSM</tspan><tspan x="755.0" dy="16.9"></tspan><tspan x="755.0" dy="16.9">Автоматична активація</tspan><tspan x="755.0" dy="16.9">режиму Integrity</tspan><tspan x="755.0" dy="16.9">в пам'яті</tspan></text>
<line x1="855.0" y1="220.0" x2="870.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="875.0" y="100.0" width="190.0" height="240.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">5. Захищене ядро</tspan><tspan x="970.0" dy="16.9"></tspan><tspan x="970.0" dy="16.9">Заборона прямого</tspan><tspan x="970.0" dy="16.9">запису в пам'ять та</tspan><tspan x="970.0" dy="16.9">непідписаного коду</tspan></text>
<rect x="225.1" y="386.6" width="649.8" height="66.8" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">UEFI Secure Boot перевіряє цілісність лише ДО завантаження ядра в оперативну пам'ять.</tspan><tspan x="550.0" dy="16.9">Kernel Lockdown Mode продовжує цей захист у середовищі виконання (runtime),</tspan><tspan x="550.0" dy="16.9">закриваючи користувачеві root можливість модифікувати завантажене ядро.</tspan></text>
</svg>