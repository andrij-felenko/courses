<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Linux Kernel Lockdown Modes</text>
    
    <!-- None Mode -->
    <rect x="50" y="100" width="200" height="250" fill="#e9ecef" rx="10"/>
    <text x="150" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">None</text>
    <text x="150" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Без обмежень</text>
    <circle cx="150" cy="220" r="40" fill="#28a745" opacity="0.8"/>
    <text x="150" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Root == Kernel</text>
    <text x="150" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Дозволено модифікацію</text>
    
    <!-- Integrity Mode -->
    <rect x="300" y="100" width="200" height="250" fill="#e9ecef" rx="10"/>
    <text x="400" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Integrity</text>
    <text x="400" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Захист цілісності</text>
    <circle cx="400" cy="220" r="40" fill="#ffc107" opacity="0.8"/>
    <text x="400" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Read-Only</text>
    <text x="400" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Заборонено: /dev/mem</text>
    <text x="400" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">kexec, bpf (частково)</text>
    <text x="400" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">модифікація ядра</text>
    
    <!-- Confidentiality Mode -->
    <rect x="550" y="100" width="200" height="250" fill="#e9ecef" rx="10"/>
    <text x="650" y="130" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Confidentiality</text>
    <text x="650" y="160" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Захист конфіденційності</text>
    <circle cx="650" cy="220" r="40" fill="#dc3545" opacity="0.8"/>
    <text x="650" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">No Access</text>
    <text x="650" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Усі обмеження Integrity</text>
    <text x="650" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">+ kprobes, /proc/kcore</text>
    <text x="650" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">читання пам'яті ядра</text>
    
</svg>