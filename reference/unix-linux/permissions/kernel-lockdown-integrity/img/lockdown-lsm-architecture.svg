<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплення чутливих операцій у ядрі через LSM-хук security_locked_down()</text>
<rect x="40.0" y="100.0" width="240.0" height="120.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">User Space Process (root)</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">Системний виклик:</tspan><tspan x="160.0" dy="16.9">open(&quot;/dev/mem&quot;, O_RDWR)</tspan><tspan x="160.0" dy="16.9">чи init_module()</tspan></text>
<rect x="330.0" y="100.0" width="240.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Підсистема ядра (VFS/Driver)</tspan><tspan x="450.0" dy="16.9"></tspan><tspan x="450.0" dy="16.9">Виклик перевірки LSM:</tspan><tspan x="450.0" dy="16.9">security_locked_down(</tspan><tspan x="450.0" dy="16.9">  LOCKDOWN_DEV_MEM)</tspan></text>
<rect x="620.0" y="100.0" width="400.0" height="120.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="820.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Модуль Lockdown LSM</tspan><tspan x="820.0" dy="16.9"></tspan><tspan x="820.0" dy="16.9">Порівняння рівня:</tspan><tspan x="820.0" dy="16.9">reason_level (Integrity) &lt;= active_level?</tspan><tspan x="820.0" dy="16.9">lockdown_is_locked_down(reason)</tspan></text>
<line x1="285.0" y1="160.0" x2="325.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="575.0" y1="160.0" x2="615.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="300.0" width="240.0" height="100.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Дозволено (0)</tspan><tspan x="590.0" dy="16.9"></tspan><tspan x="590.0" dy="16.9">Виконання системного виклику</tspan><tspan x="590.0" dy="16.9">продовжується</tspan></text>
<rect x="770.0" y="300.0" width="240.0" height="100.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="890.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Заборонено (-EPERM)</tspan><tspan x="890.0" dy="15.6"></tspan><tspan x="890.0" dy="15.6">Помилка Operation not permitted</tspan><tspan x="890.0" dy="15.6">+ запис аудіту в dmesg</tspan></text>
<line x1="720.0" y1="225.0" x2="590.0" y2="295.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="820.0" y1="225.0" x2="890.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">активний &lt; причини</text>
<text x="890.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">активний &gt;= причини</text>
<rect x="171.7" y="440.1" width="716.5" height="49.9" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="461.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Кожна чутлива операція ядра звертається до security_locked_down() з відповідним кодом причини.</tspan><tspan x="530.0" dy="16.9">Якщо поточний рівень Lockdown досяг або перевищив вимогу причини, ядро повертає -EPERM.</tspan></text>
</svg>