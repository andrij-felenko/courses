<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм криптографічної верифікації SIGSTRUCT в інструкції EINIT</text>
<rect x="30.0" y="60.0" width="360.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Перевірка RSA-3072 підпису</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">Перевірка SIGNATURE за допомогою</tspan><tspan x="210.0" dy="15.6">MODULUS та EXPONENT із SIGSTRUCT</tspan></text>
<rect x="430.0" y="60.0" width="360.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2. Перевірка MRSIGNER та FLC</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">SHA-256(MODULUS) == MRSIGNER</tspan><tspan x="610.0" dy="15.6">Збіг з MSR IA32_SGXLEPUBKEYHASH</tspan></text>
<line x1="390.0" y1="110.0" x2="430.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="205.0" width="360.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">3. Зіставлення вимірювань коду</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">Обчислений при EADD/EEXTEND хеш MRENCLAVE</tspan><tspan x="210.0" dy="15.6">== SIGSTRUCT.ENCLAVEHASH</tspan></text>
<line x1="610.0" y1="160.0" x2="610.0" y2="185.0" stroke="#333333" stroke-width="1.8"/>
<line x1="610.0" y1="185.0" x2="210.0" y2="185.0" stroke="#333333" stroke-width="1.8"/>
<line x1="210.0" y1="185.0" x2="210.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="205.0" width="360.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">4. Перевірка версії та атрибутів</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">ISVSVN &gt;= мінімальний SVN обладнання</tspan><tspan x="610.0" dy="15.6">Збіг ATTRIBUTES (DEBUG / KSS прапори)</tspan></text>
<line x1="390.0" y1="260.0" x2="430.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="345.0" width="460.0" height="75.0" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ІНІЦІАЛІЗАЦІЯ ЕНКЛАВА УСПІШНА</tspan><tspan x="410.0" dy="16.9"></tspan><tspan x="410.0" dy="16.9">SECS.VALID = 1 → Активація виконання через EENTER</tspan></text>
<line x1="610.0" y1="315.0" x2="610.0" y2="330.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="610.0" y1="330.0" x2="410.0" y2="330.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="410.0" y1="330.0" x2="410.0" y2="345.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>