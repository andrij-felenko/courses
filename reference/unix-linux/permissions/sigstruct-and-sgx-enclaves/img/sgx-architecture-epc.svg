<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна межа захисту Intel SGX: MEE, EPC та EPCM</text>
<rect x="20.0" y="55.0" width="370.0" height="385.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="205.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Недовірена зона (Ring 0 / ОС / Гіпервізор)</text>
<rect x="35.0" y="105.0" width="340.0" height="75.0" rx="6" fill="#ffffff" stroke="#d9534f" stroke-width="1.5"/><text x="205.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Таблиці сторінок ОС (Page Tables)</tspan><tspan x="205.0" dy="15.6">Фізична адресація сторінок EPC у RAM</tspan></text>
<rect x="35.0" y="195.0" width="340.0" height="80.0" rx="6" fill="#f9ebe8" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Спроба прямого доступу ОС до EPC</tspan><tspan x="205.0" dy="15.6">Блокується апаратно → повертає 0xFF...FF</tspan></text>
<rect x="35.0" y="290.0" width="340.0" height="135.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Системна оперативна пам'ять DRAM</tspan><tspan x="205.0" dy="14.3"></tspan><tspan x="205.0" dy="14.3">• Звичайна пам'ять (відкрита для ОС)</tspan><tspan x="205.0" dy="14.3">• PRM (Processor Reserved Memory)</tspan><tspan x="205.0" dy="14.3">  └─ EPC (Enclave Page Cache)</tspan><tspan x="205.0" dy="14.3">     [Шифрований вміст в RAM]</tspan></text>
<rect x="430.0" y="55.0" width="370.0" height="385.0" rx="8" fill="#edf7ed" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Довірена апаратна межа CPU (Hardware TCB)</text>
<rect x="445.0" y="105.0" width="340.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Ядра CPU (Enclave Mode)</tspan><tspan x="615.0" dy="15.6">Виконання інструкцій ENCLU (EENTER/EEXIT)</tspan></text>
<rect x="445.0" y="195.0" width="340.0" height="115.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="227.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">EPCM (Enclave Page Cache Map)</tspan><tspan x="615.0" dy="14.3"></tspan><tspan x="615.0" dy="14.3">• Перевірка належності сторінки енклаву</tspan><tspan x="615.0" dy="14.3">• Збіг віртуальної адреси (ELRANGE)</tspan><tspan x="615.0" dy="14.3">• Права доступу (R, W, X) та тип (SECS/TCS/REG)</tspan></text>
<rect x="445.0" y="325.0" width="340.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">MEE (Memory Encryption Engine)</tspan><tspan x="615.0" dy="14.3"></tspan><tspan x="615.0" dy="14.3">• AES-CTR шифрування трафіку до DRAM</tspan><tspan x="615.0" dy="14.3">• Дерево Меркла для захисту цілісності</tspan><tspan x="615.0" dy="14.3">• Ключі шифрування не покидають процесор</tspan></text>
<line x1="375.0" y1="142.0" x2="445.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="445.0" y1="375.0" x2="375.0" y2="375.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,4"/>
</svg>