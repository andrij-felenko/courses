<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стеки PAM і питання, на яке відповідає кожен</text>
<rect x="70.0" y="72.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">auth</tspan></text>
<line x1="285.0" y1="90.0" x2="385.0" y2="90.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="50.0" width="620.0" height="80.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">чи це справді та людина —</tspan><tspan x="705.0" dy="16.9">і які додаткові облікові дані їй видати</tspan></text>
<rect x="70.0" y="177.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">account</tspan></text>
<line x1="285.0" y1="195.0" x2="385.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="155.0" width="620.0" height="80.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">чи вільно цим записом користуватися</tspan><tspan x="705.0" dy="16.9">зараз, звідси й саме цією службою</tspan></text>
<rect x="70.0" y="282.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">password</tspan></text>
<line x1="285.0" y1="300.0" x2="385.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="260.0" width="620.0" height="80.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">заміна самого секрету, коли він застарів</tspan><tspan x="705.0" dy="16.9">або коли зміни вимагає політика</tspan></text>
<rect x="70.0" y="387.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="410.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">session</tspan></text>
<line x1="285.0" y1="405.0" x2="385.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.0" y="365.0" width="620.0" height="80.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">що налаштувати навколо на вході</tspan><tspan x="705.0" dy="16.9">й розібрати назад на виході</tspan></text>
<rect x="261.0" y="480.1" width="598.0" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="501.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">жодна служба не зачіпає всі чотири: вхід за відкритим ключем обходить auth,</tspan><tspan x="560.0" dy="16.9">команда зміни пароля вживає лише password, а задача з cron не має auth узагалі</tspan></text>
</svg>