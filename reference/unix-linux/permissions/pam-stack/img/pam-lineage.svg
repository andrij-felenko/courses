<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 652" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="652" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія PAM: пропозиція, три реалізації й специфікація, що не стала стандартом</text>
<line x1="300.0" y1="50.0" x2="300.0" y2="600.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="5,5"/>
<text x="266.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">жовтень 1995</text>
<circle cx="300.0" cy="78.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
<rect x="330.0" y="39.0" width="690.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">SunSoft подає до OSF пропозицію RFC 86.0</tspan><tspan x="675.0" dy="18.2">«Unified Login with Pluggable Authentication Modules»</tspan></text>
<text x="266.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">березень 1996</text>
<circle cx="300.0" cy="160.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.5"/>
<rect x="330.0" y="121.0" width="690.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">доповідь про той самий задум на ACM CCS'96 —</tspan><tspan x="675.0" dy="18.2">наукова публікація, а не документ стандарту</tspan></text>
<text x="266.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">серпень 1996</text>
<circle cx="300.0" cy="242.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<rect x="330.0" y="203.0" width="690.0" height="78.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Linux-PAM — незалежна реалізація для Linux —</tspan><tspan x="675.0" dy="18.2">виходить у складі Red Hat Linux 3.0.4</tspan></text>
<text x="266.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">травень 1997</text>
<circle cx="300.0" cy="324.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<rect x="330.0" y="285.0" width="690.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="319.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Solaris 2.6 приносить рідну реалізацію Sun;</tspan><tspan x="675.0" dy="18.2">той самий каркас бере собі CDE</tspan></text>
<text x="266.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">червень 1997</text>
<circle cx="300.0" cy="420.0" r="7.0" fill="#ffffff" stroke="#b8860b" stroke-width="2.5"/>
<rect x="330.0" y="370.0" width="690.0" height="100.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="675.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Open Group видає XSSO (документ P702) —</tspan><tspan x="675.0" dy="18.2">і документ назавжди лишається ПОПЕРЕДНІМ:</tspan><tspan x="675.0" dy="18.2">стандартом він так і не став</tspan></text>
<text x="266.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">березень 2002</text>
<circle cx="300.0" cy="520.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<rect x="330.0" y="481.0" width="690.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="515.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">OpenPAM заміняє Linux-PAM у FreeBSD;</tspan><tspan x="675.0" dy="18.2">згодом його беруть NetBSD, DragonFly й macOS</tspan></text>
<rect x="330.0" y="588.0" width="690.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="614.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">спільним лишився інтерфейс для програм — розійшлися налаштування й набори модулів</tspan></text>
</svg>