<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево імен каталогу і запис облікового рахунку</text>
<text x="280.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">імена складаються зі шляху</text>
<rect x="214.1" y="61.0" width="131.7" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">dc=firma,dc=ua</tspan></text>
<rect x="104.1" y="181.0" width="91.8" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ou=people</tspan></text>
<rect x="374.1" y="181.0" width="91.8" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">ou=groups</tspan></text>
<line x1="280.0" y1="96.0" x2="152.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="96.0" x2="418.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.1" y="301.0" width="99.8" height="34.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="322.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">uid=andrij</tspan></text>
<rect x="226.1" y="301.0" width="91.8" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="272.0" y="322.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="272.0" dy="0.0">uid=marta</tspan></text>
<rect x="382.1" y="301.0" width="99.8" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="432.0" y="322.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="432.0" dy="0.0">cn=dialout</tspan></text>
<line x1="150.0" y1="216.0" x2="112.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150.0" y1="216.0" x2="270.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="216.0" x2="432.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="388.0" width="460.0" height="96.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="423.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">остання ланка — RDN, «uid=andrij»;</tspan><tspan x="280.0" dy="16.9">разом з усім, що вище, вона дає DN —</tspan><tspan x="280.0" dy="16.9">повне й єдине ім'я запису в каталозі</tspan></text>
<text x="880.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">той самий запис зсередини</text>
<rect x="560.0" y="56.0" width="640.0" height="300.0" rx="6" fill="#fbfcfe" stroke="#333333" stroke-width="1.5"/>
<text x="586.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="586.0" dy="0.0">dn: uid=andrij,ou=people,dc=firma,dc=ua</tspan><tspan x="586.0" dy="18.8">objectClass: posixAccount</tspan><tspan x="586.0" dy="18.8">objectClass: shadowAccount</tspan><tspan x="586.0" dy="18.8">uid: andrij</tspan><tspan x="586.0" dy="18.8">cn: Andrij Felenko</tspan><tspan x="586.0" dy="18.8">uidNumber: 1000</tspan><tspan x="586.0" dy="18.8">gidNumber: 1000</tspan><tspan x="586.0" dy="18.8">homeDirectory: /home/andrij</tspan><tspan x="586.0" dy="18.8">loginShell: /bin/bash</tspan><tspan x="586.0" dy="18.8">userPassword: {CRYPT}$y$j9T$sIl…</tspan></text>
<rect x="560.0" y="388.0" width="640.0" height="96.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="423.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">objectClass вирішує, які атрибути тут дозволені й обов'язкові:</tspan><tspan x="880.0" dy="16.9">сервер відмовить у записі, що не відповідає схемі.</tspan><tspan x="880.0" dy="16.9">«uid» — це логін, число живе окремо, в «uidNumber»</tspan></text>
<rect x="120.0" y="552.0" width="1000.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="589.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">жоден із цих атрибутів не є для LDAP природним: каталог нічого не знає про Unix.</tspan><tspan x="620.0" dy="16.9">posixAccount, shadowAccount і posixGroup — це схема, дописана поверх загальної моделі,</tspan><tspan x="620.0" dy="16.9">щоб рядок /etc/passwd мав куди лягти</tspan></text>
</svg>