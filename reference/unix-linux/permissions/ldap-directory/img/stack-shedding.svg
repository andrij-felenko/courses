<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три покоління доступу до каталогу</text>
<text x="200.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1988 — X.500 і DAP</text>
<text x="650.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1991–93 — шлюз</text>
<text x="1100.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1995–96 — власний сервер</text>
<rect x="50.0" y="60.0" width="300.0" height="44.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">клієнт DUA</tspan></text>
<line x1="200.0" y1="104.0" x2="200.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="128.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">DAP</tspan><tspan x="200.0" dy="16.9">прикладний рівень (ACSE, ROSE)</tspan><tspan x="200.0" dy="16.9">рівень представлення (BER)</tspan><tspan x="200.0" dy="16.9">сеансовий рівень</tspan><tspan x="200.0" dy="16.9">транспорт і мережа OSI</tspan></text>
<line x1="200.0" y1="278.0" x2="200.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="306.0" width="300.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">сервер DSA</tspan></text>
<rect x="50.0" y="388.0" width="300.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">щоб спитати одне ім'я,</tspan><tspan x="200.0" dy="16.9">машина мусить нести</tspan><tspan x="200.0" dy="16.9">весь стос — і купити</tspan><tspan x="200.0" dy="16.9">його разом із системою</tspan></text>
<rect x="500.0" y="60.0" width="300.0" height="44.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">клієнт LDAP</tspan></text>
<line x1="650.0" y1="104.0" x2="650.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="128.0" width="300.0" height="44.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">TCP, порт 389</tspan></text>
<line x1="650.0" y1="172.0" x2="650.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="196.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="222.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">шлюз ldapd</tspan></text>
<line x1="650.0" y1="240.0" x2="650.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="262.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">DAP на стосі OSI</tspan></text>
<line x1="650.0" y1="306.0" x2="650.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="328.0" width="300.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">сервер QUIPU</tspan></text>
<rect x="500.0" y="388.0" width="300.0" height="110.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">клієнт полегшав,</tspan><tspan x="650.0" dy="16.9">але OSI нікуди не зник —</tspan><tspan x="650.0" dy="16.9">він просто переїхав</tspan><tspan x="650.0" dy="16.9">за спину шлюзові</tspan></text>
<rect x="950.0" y="60.0" width="300.0" height="44.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1100.0" y="86.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">клієнт LDAP</tspan></text>
<line x1="1100.0" y1="104.0" x2="1100.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="950.0" y="128.0" width="300.0" height="44.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="1100.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">TCP, порт 389</tspan></text>
<line x1="1100.0" y1="172.0" x2="1100.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="950.0" y="306.0" width="300.0" height="44.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="1100.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">slapd із власною базою</tspan></text>
<rect x="950.0" y="388.0" width="300.0" height="110.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="1100.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">модель даних лишилася</tspan><tspan x="1100.0" dy="16.9">від X.500, стос OSI</tspan><tspan x="1100.0" dy="16.9">зник з обох кінців —</tspan><tspan x="1100.0" dy="16.9">разом із потребою в DSA</tspan></text>
