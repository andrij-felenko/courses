<rect x="150.0" y="198.0" width="90.0" height="36.0" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="195.0" y="213.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Tag Length</tspan><tspan x="195.0" dy="11.7">(4 + 2*K байт)</tspan></text>
<rect x="245.0" y="198.0" width="90.0" height="36.0" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/><text x="290.0" y="213.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Alignment</tspan><tspan x="290.0" dy="11.7">0x00 (вирівн.)</tspan></text>
<rect x="340.0" y="198.0" width="140.0" height="36.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="410.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Sensitivity Level</tspan><tspan x="410.0" dy="13.0">(0..255, 8 бітів)</tspan></text>
<rect x="485.0" y="198.0" width="350.0" height="36.0" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="660.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Array of 16-bit Category Integers [Cat#1, Cat#2, ...]</tspan><tspan x="660.0" dy="13.0">масив числових ідентифікаторів активних категорій</tspan></text>
<rect x="45.0" y="245.0" width="795.0" height="42.0" rx="4" fill="#ffffff" stroke="#8250df" stroke-width="1.2"/>
<rect x="50.0" y="248.0" width="95.0" height="36.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="97.5" y="263.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="97.5" dy="0.0">Tag Type</tspan><tspan x="97.5" dy="11.7">5 (діапазони)</tspan></text>
<rect x="150.0" y="248.0" width="90.0" height="36.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="195.0" y="263.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Tag Length</tspan><tspan x="195.0" dy="11.7">(4 + 4*R байт)</tspan></text>
<rect x="245.0" y="248.0" width="90.0" height="36.0" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="290.0" y="263.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Alignment</tspan><tspan x="290.0" dy="11.7">0x00 (вирівн.)</tspan></text>
<rect x="340.0" y="248.0" width="140.0" height="36.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="410.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Sensitivity Level</tspan><tspan x="410.0" dy="13.0">(0..255, 8 бітів)</tspan></text>
<rect x="485.0" y="248.0" width="350.0" height="36.0" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/><text x="660.0" y="263.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Pairs of 16-bit Category Ranges: [Start_1..End_1], [Start_2..End_2]</tspan><tspan x="660.0" dy="11.7">компактне кодування послідовних груп категорій</tspan></text>
<rect x="30.0" y="315.0" width="840.0" height="235.0" rx="6" fill="#fdf8f6" stroke="#bc4c00" stroke-width="1.5"/>
<text x="450.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#bc4c00" text-anchor="middle" font-weight="700">IPv6 CALIPSO: COMMON ARCHITECTURE LABEL IPv6 SECURITY OPTION (RFC 5570)</text>
<text x="450.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Розміщується в заголовку Hop-by-Hop або Destination Options (IPPROTO_HOPOPTS / DSTOPTS)</text>
<rect x="45.0" y="375.0" width="120.0" height="50.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="105.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Option Type</tspan><tspan x="105.0" dy="13.0">0x07</tspan><tspan x="105.0" dy="13.0">(CALIPSO opt)</tspan></text>
<rect x="170.0" y="375.0" width="120.0" height="50.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="230.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Opt Data Len</tspan><tspan x="230.0" dy="13.0">(довжина даних</tspan><tspan x="230.0" dy="13.0">в октетах)</tspan></text>
<rect x="295.0" y="375.0" width="260.0" height="50.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="425.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">CALIPSO DOI (32 біти / 4 байти)</tspan><tspan x="425.0" dy="13.0">Domain of Interpretation</tspan><tspan x="425.0" dy="13.0">ідентифікатор політики безпеки</tspan></text>
<rect x="560.0" y="375.0" width="285.0" height="50.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="702.5" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.5" dy="0.0">CALIPSO Sensitivity Level (8 бітів)</tspan><tspan x="702.5" dy="13.0">ієрархічний рівень MLS (0..255)</tspan><tspan x="702.5" dy="13.0">Unclassified / Secret / TopSecret</tspan></text>
<rect x="45.0" y="435.0" width="245.0" height="50.0" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/><text x="167.5" y="450.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">CALIPSO Checksum (16 бітів)</tspan><tspan x="167.5" dy="13.0">контрольна сума RFC 1071</tspan><tspan x="167.5" dy="13.0">(перевірка цілісності опції)</tspan></text>
<rect x="295.0" y="435.0" width="550.0" height="50.0" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="570.0" y="450.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Compartment Bitmap (змінна довжина, кратна 32 бітам / 4 байтам)</tspan><tspan x="570.0" dy="13.0">бітова маска неієрархічних категорій / компартментів безпеки</tspan><tspan x="570.0" dy="13.0">(пряме зіставлення з категоріями SELinux MLS c0..c1023)</tspan></text>
<rect x="45.0" y="495.0" width="800.0" height="42.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="445.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#24292f" text-anchor="middle" font-weight="700">CIPSO (IPv4) вимагає переобчислення IP Header Checksum; CALIPSO (IPv6) має власну контрольну суму</text>
</svg>