<rect x="45.0" y="95.0" width="120.0" height="40.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="105.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Option Type</tspan><tspan x="105.0" dy="14.3">0x86 (134)</tspan></text>
<rect x="170.0" y="95.0" width="120.0" height="40.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="230.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Option Length</tspan><tspan x="230.0" dy="13.0">(загальна довжина)</tspan></text>
<rect x="295.0" y="95.0" width="260.0" height="40.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="425.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">CIPSO DOI (32 біти / 4 байти)</tspan><tspan x="425.0" dy="14.3">ідентифікатор домену інтерпретації</tspan></text>
<rect x="560.0" y="95.0" width="295.0" height="40.0" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/><text x="707.5" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">Послідовність тегів CIPSO (Tag 1 / Tag 2 / Tag 5)</tspan><tspan x="707.5" dy="11.7">до заповнення загальної довжини опції</tspan></text>
<rect x="45.0" y="145.0" width="795.0" height="42.0" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
<rect x="50.0" y="148.0" width="95.0" height="36.0" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/><text x="97.5" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="97.5" dy="0.0">Tag Type</tspan><tspan x="97.5" dy="13.0">1 (бітовий)</tspan></text>
<rect x="150.0" y="148.0" width="90.0" height="36.0" rx="6" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.5"/><text x="195.0" y="163.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Tag Length</tspan><tspan x="195.0" dy="11.7">(4 + N байтів)</tspan></text>
