<rect x="340.0" y="148.0" width="140.0" height="36.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="410.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Sensitivity Level</tspan><tspan x="410.0" dy="13.0">(0..255, 8 бітів)</tspan></text>
<rect x="485.0" y="148.0" width="350.0" height="36.0" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text x="660.0" y="163.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Category Bitmap (бітова маска категорій: біт i = категорія i)</tspan><tspan x="660.0" dy="11.7">до 30 байтів (240 категорій на тег у FIPS 188)</tspan></text>
