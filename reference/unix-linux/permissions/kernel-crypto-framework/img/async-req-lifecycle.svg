<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл асинхронного криптографічного запиту</text>
<rect x="10.0" y="10.0" width="840.0" height="520.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="2.0"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#263238" text-anchor="middle" font-weight="700">Життєвий цикл асинхронного криптографічного запиту в ядрі</text>
<rect x="30.0" y="55.0" width="240.0" height="365.0" rx="6" fill="#f3f4f6" stroke="#90a4ae" stroke-width="1.5"/>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#37474f" text-anchor="middle" font-weight="700">Клієнт ядра (dm-crypt/IPsec)</text>
<rect x="300.0" y="55.0" width="260.0" height="365.0" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
<text x="430.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700">Crypto Core &amp; Driver Queue</text>
<rect x="590.0" y="55.0" width="230.0" height="365.0" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
<text x="705.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">Апаратний прискорювач (QAT)</text>
<rect x="45.0" y="95.0" width="210.0" height="45.0" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/><text x="150.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Виділення skcipher_req</tspan><tspan x="150.0" dy="14.3">Заповнення SG-list та callback</tspan></text>
<line x1="255.0" y1="118.0" x2="300.0" y2="118.0" stroke="#1976d2" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="278.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle" font-weight="700">encrypt()</text>
<rect x="300.0" y="95.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#4caf50" stroke-width="1.5"/><text x="430.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">2. Ставка в чергу DMA rings</tspan><tspan x="430.0" dy="14.3">crypto_enqueue_request()</tspan></text>
<line x1="300.0" y1="155.0" x2="255.0" y2="155.0" stroke="#d32f2f" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="278.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle" font-weight="700">-EINPROGRESS</text>
<rect x="45.0" y="145.0" width="210.0" height="45.0" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="150.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">3. Клієнт НЕ блокується</tspan><tspan x="150.0" dy="14.3">Виконує інші I/O операції</tspan></text>
<rect x="300.0" y="200.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#4caf50" stroke-width="1.5"/><text x="430.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">4. Передача фізичних сторінок</tspan><tspan x="430.0" dy="14.3">через DMA у PCIe пристрої</tspan></text>
<line x1="560.0" y1="222.0" x2="590.0" y2="222.0" stroke="#e65100" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle" font-weight="700">DMA</text>
<rect x="590.0" y="200.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#fb8c00" stroke-width="1.5"/><text x="705.0" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">5. Апаратне шифрування</tspan><tspan x="705.0" dy="14.3">в кремнії без участі ЦП</tspan></text>
<line x1="590.0" y1="280.0" x2="560.0" y2="280.0" stroke="#e65100" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle" font-weight="700">IRQ</text>
<rect x="300.0" y="265.0" width="260.0" height="50.0" rx="6" fill="#ffffff" stroke="#4caf50" stroke-width="1.5"/><text x="430.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">6. Обробник переривання ЦП</tspan><tspan x="430.0" dy="14.3">Витягує результат з DMA ring</tspan></text>
<line x1="300.0" y1="345.0" x2="255.0" y2="345.0" stroke="#388e3c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="278.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#388e3c" text-anchor="middle" font-weight="700">Callback</text>
<rect x="45.0" y="325.0" width="210.0" height="50.0" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/><text x="150.0" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">7. Виклик req-&gt;complete()</tspan><tspan x="150.0" dy="14.3">Обробка шифрованих даних</tspan></text>
<rect x="30.0" y="435.0" width="790.0" height="65.0" rx="6" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.5"/><text x="425.0" y="464.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#455a64" text-anchor="middle"><tspan x="425.0" dy="0.0">Перевага: ЦП звільняється від математичних обчислень під час обробки тисяч I/O запитів;</tspan><tspan x="425.0" dy="14.3">Пам'ять передається безкопіювально через Scatterlists без проміжних буферів.</tspan></text>
</svg>