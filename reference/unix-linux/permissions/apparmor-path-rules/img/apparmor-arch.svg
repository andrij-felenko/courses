<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect x="50" y="50" width="700" height="300" fill="#f9f9f9" stroke="#333" />
    <text x="400" y="80" font-size="20" text-anchor="middle" font-family="sans-serif">AppArmor Architecture</text>
    
    <!-- User Space -->
    <rect x="100" y="100" width="250" height="200" fill="#e6f2ff" stroke="#0066cc" />
    <text x="225" y="130" font-size="16" text-anchor="middle" font-family="sans-serif">User Space</text>
    <rect x="120" y="150" width="210" height="40" fill="#cce6ff" stroke="#0055b3" />
    <text x="225" y="175" font-size="14" text-anchor="middle" font-family="sans-serif">AppArmor Tools (aa-enforce)</text>
    <rect x="120" y="210" width="210" height="40" fill="#cce6ff" stroke="#0055b3" />
    <text x="225" y="235" font-size="14" text-anchor="middle" font-family="sans-serif">Profiles (/etc/apparmor.d/)</text>
    
    <!-- Kernel Space -->
    <rect x="450" y="100" width="250" height="200" fill="#e6ffe6" stroke="#009900" />
    <text x="575" y="130" font-size="16" text-anchor="middle" font-family="sans-serif">Kernel Space</text>
    <rect x="470" y="150" width="210" height="40" fill="#ccffcc" stroke="#008000" />
    <text x="575" y="175" font-size="14" text-anchor="middle" font-family="sans-serif">securityfs</text>
    <rect x="470" y="210" width="210" height="40" fill="#ccffcc" stroke="#008000" />
    <text x="575" y="235" font-size="14" text-anchor="middle" font-family="sans-serif">AppArmor LSM</text>
    
    <!-- Arrows -->
    <line x1="350" y1="170" x2="450" y2="170" stroke="#000" stroke-width="2" />
    <polygon points="450,170 440,165 440,175" fill="#000" />
    <text x="400" y="160" font-size="12" text-anchor="middle" font-family="sans-serif">apparmor_parser</text>
</svg>