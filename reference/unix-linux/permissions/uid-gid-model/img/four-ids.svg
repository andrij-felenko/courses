<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири ідентифікатори користувача і призначення кожного</text>
<rect x="70.0" y="53.9" width="240.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">реальний UID</tspan><tspan x="190.0" dy="18.2">(ruid)</tspan></text>
<line x1="315.0" y1="80.0" x2="405.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="42.0" width="600.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">чий це процес: кому дозволено слати йому сигнали,</tspan><tspan x="715.0" dy="16.9">чиї ліміти він витрачає і на чий рахунок іде облік</tspan></text>
<rect x="70.0" y="158.9" width="240.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">діючий UID</tspan><tspan x="190.0" dy="18.2">(euid)</tspan></text>
<line x1="315.0" y1="185.0" x2="405.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="147.0" width="600.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">від чийого імені він діє: саме це число ядро порівнює</tspan><tspan x="715.0" dy="16.9">на кожній перевірці доступу</tspan></text>
<rect x="70.0" y="263.9" width="240.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">збережений UID</tspan><tspan x="190.0" dy="18.2">(suid)</tspan></text>
<line x1="315.0" y1="290.0" x2="405.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="252.0" width="600.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">куди дозволено повернутися: копія колишнього діючого,</tspan><tspan x="715.0" dy="16.9">щоб знову підняти права після тимчасового зниження</tspan></text>
<rect x="70.0" y="368.9" width="240.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">файловий UID</tspan><tspan x="190.0" dy="18.2">(fsuid)</tspan></text>
<line x1="315.0" y1="395.0" x2="405.0" y2="395.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="357.0" width="600.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="391.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">доступ саме до файлів; у Linux тягнеться за діючим сам,</tspan><tspan x="715.0" dy="16.9">окремо його крутить хіба сервер NFS</tspan></text>
<rect x="268.1" y="455.1" width="523.9" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">той самий набір із чотирьох є й для групи (rgid, egid, sgid, fsgid),</tspan><tspan x="530.0" dy="16.9">а поверх нього — список додаткових груп</tspan></text>
</svg>