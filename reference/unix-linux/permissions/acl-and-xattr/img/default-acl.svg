<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Успадкування прав через default ACL</text>
<rect x="50.0" y="40.0" width="1080.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Каталог може нести ДВА списки: один вирішує доступ до нього самого, другий — шаблон для нащадків</tspan></text>
<rect x="360.0" y="120.0" width="460.0" height="170.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="590.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">каталог project/</tspan><tspan x="590.0" dy="16.9"></tspan><tspan x="590.0" dy="16.9">system.posix_acl_access — хто ходить сюди</tspan><tspan x="590.0" dy="16.9">system.posix_acl_default — що дістанеться</tspan><tspan x="590.0" dy="16.9">тому, що тут створять</tspan></text>
<line x1="520.0" y1="300.0" x2="330.0" y2="395.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="670.0" y1="300.0" x2="855.0" y2="395.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">створюють каталог</text>
<text x="1010.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">створюють звичайний файл</text>
<rect x="50.0" y="405.0" width="460.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="457.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">новий підкаталог</tspan><tspan x="280.0" dy="16.9"></tspan><tspan x="280.0" dy="16.9">копію шаблону кладуть ДВІЧІ:</tspan><tspan x="280.0" dy="16.9">і як власний access ACL,</tspan><tspan x="280.0" dy="16.9">і як власний default ACL —</tspan><tspan x="280.0" dy="16.9">тож правило йде вглиб деревом</tspan></text>
<rect x="670.0" y="405.0" width="460.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="457.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">новий файл</tspan><tspan x="900.0" dy="16.9"></tspan><tspan x="900.0" dy="16.9">копію шаблону кладуть ОДИН раз,</tspan><tspan x="900.0" dy="16.9">як власний access ACL;</tspan><tspan x="900.0" dy="16.9">другого списку у файлу немає,</tspan><tspan x="900.0" dy="16.9">бо всередині файлу нічого не створять</tspan></text>
<rect x="50.0" y="615.0" width="1080.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="650.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">поки шаблон є, umask мовчить: межу ставить аргумент mode виклику open чи mkdir, перетнутий із класами успадкованого списку</tspan></text>
</svg>