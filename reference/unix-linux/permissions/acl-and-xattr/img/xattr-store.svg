<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1260 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1260" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="625.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сховище розширених атрибутів при inode</text>
<rect x="50.0" y="45.0" width="1150.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Inode має сталий розмір — тому все, що змінної довжини, винесено в окреме сховище пар «ім'я → значення»</tspan></text>
<rect x="50.0" y="135.0" width="270.0" height="380.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">inode</tspan><tspan x="185.0" dy="16.9"></tspan><tspan x="185.0" dy="16.9">тип об'єкта</tspan><tspan x="185.0" dy="16.9">дванадцять бітів режиму</tspan><tspan x="185.0" dy="16.9">uid власника</tspan><tspan x="185.0" dy="16.9">gid групи</tspan><tspan x="185.0" dy="16.9">розмір</tspan><tspan x="185.0" dy="16.9">часові позначки</tspan><tspan x="185.0" dy="16.9">лічильник посилань</tspan><tspan x="185.0" dy="16.9">де лежать блоки</tspan><tspan x="185.0" dy="16.9"></tspan><tspan x="185.0" dy="16.9">сталий розмір:</tspan><tspan x="185.0" dy="16.9">нового поля не додати</tspan></text>
<line x1="335.0" y1="320.0" x2="400.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="415.0" y="135.0" width="785.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="807.5" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="807.5" dy="0.0">розширені атрибути: рядкове ім'я → байти значення, довжина довільна</tspan></text>
<rect x="415.0" y="200.0" width="300.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">system.posix_acl_access</tspan></text>
<rect x="715.0" y="200.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">список записів ACL цього об'єкта</tspan></text>
<rect x="990.0" y="200.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="224.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">лише ядро,</tspan><tspan x="1095.0" dy="15.6">через setfacl</tspan></text>
<rect x="415.0" y="262.0" width="300.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">system.posix_acl_default</tspan></text>
<rect x="715.0" y="262.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">шаблон прав для майбутніх нащадків</tspan></text>
<rect x="990.0" y="262.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">лише ядро,</tspan><tspan x="1095.0" dy="15.6">через setfacl</tspan></text>
<rect x="415.0" y="324.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="565.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">security.capability</tspan></text>
<rect x="715.0" y="324.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">можливості виконуваного файлу</tspan></text>
<rect x="990.0" y="324.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">CAP_SETFCAP</tspan></text>
<rect x="415.0" y="386.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="565.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">security.selinux</tspan></text>
<rect x="715.0" y="386.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">мітка політики обов'язкового контролю</tspan></text>
<rect x="990.0" y="386.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="410.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">рішення модуля</tspan><tspan x="1095.0" dy="15.6">безпеки</tspan></text>
<rect x="415.0" y="448.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="480.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">trusted.mydata</tspan></text>
<rect x="715.0" y="448.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="480.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">службові дані поза очима користувача</tspan></text>
<rect x="990.0" y="448.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="480.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">CAP_SYS_ADMIN</tspan></text>
<rect x="415.0" y="510.0" width="300.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="565.0" y="542.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">user.mime_type</tspan></text>
<rect x="715.0" y="510.0" width="275.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="852.5" y="542.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">будь-що від прикладної програми</tspan></text>
<rect x="990.0" y="510.0" width="210.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1095.0" y="534.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">звичайне право w</tspan><tspan x="1095.0" dy="15.6">на сам файл</tspan></text>
<rect x="50.0" y="578.0" width="1150.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="613.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">де ці байти лежать насправді — справа файлової системи: ext4 кладе дрібні в запас усередині inode,</tspan><tspan x="625.0" dy="16.9">більші — в один окремий блок, а зовсім великі (понад 2048 байтів) — у прихований inode-носій; XFS і Btrfs меж майже не мають</tspan></text>
</svg>