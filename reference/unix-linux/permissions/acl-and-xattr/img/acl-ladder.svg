<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок перевірки за списком контролю доступу</text>
<rect x="60.0" y="45.0" width="1080.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Процес просить дію: у нього fsuid, fsgid і повний список додаткових груп. Питання йдуть згори вниз</tspan></text>
<rect x="60.0" y="155.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fsuid збігається</tspan><tspan x="320.0" dy="18.2">з власником файлу?</tspan></text>
<line x1="594.0" y1="203.0" x2="636.0" y2="203.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="155.0" width="490.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="895.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">запис user:: вирішує остаточно</tspan><tspan x="895.0" dy="16.9">маска НЕ діє</tspan></text>
<rect x="60.0" y="285.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fsuid збігається</tspan><tspan x="320.0" dy="18.2">з іменованим записом</tspan><tspan x="320.0" dy="18.2">user:ім'я: ?</tspan></text>
<line x1="594.0" y1="333.0" x2="636.0" y2="333.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="285.0" width="490.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="895.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">цей запис ∩ маска</tspan><tspan x="895.0" dy="16.9">вирішує остаточно</tspan></text>
<rect x="60.0" y="415.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="449.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">хоч одна група процесу</tspan><tspan x="320.0" dy="18.2">збігається з group::</tspan><tspan x="320.0" dy="18.2">чи з group:ім'я: ?</tspan></text>
<line x1="594.0" y1="463.0" x2="636.0" y2="463.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="415.0" width="490.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="895.0" y="450.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">перебираємо ВСІ такі записи:</tspan><tspan x="895.0" dy="16.9">досить, щоб хоч один ∩ маска</tspan><tspan x="895.0" dy="16.9">містив усе потрібне</tspan></text>
<rect x="60.0" y="545.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="597.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">не збіглося нічого</tspan></text>
<line x1="594.0" y1="593.0" x2="636.0" y2="593.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="545.0" width="490.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="895.0" y="589.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">запис other:: вирішує</tspan><tspan x="895.0" dy="16.9">маска НЕ діє</tspan></text>
<line x1="320.0" y1="257.0" x2="320.0" y2="277.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="387.0" x2="320.0" y2="407.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="517.0" x2="320.0" y2="537.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="675.0" width="1080.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="711.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Клас обирається ОДИН раз. Якщо клас групи збігся, але прав не дав, до запису other:: черга не переходить —</tspan><tspan x="600.0" dy="18.2">це EACCES. Маска стосується лише середнього класу: іменованих записів і group::</tspan></text>
<rect x="60.0" y="780.0" width="1080.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="818.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">останній щабель той самий, що й без ACL: CAP_DAC_OVERRIDE або CAP_DAC_READ_SEARCH обходять усе рішення</tspan></text>
</svg>