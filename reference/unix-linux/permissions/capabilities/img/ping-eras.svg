<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1220 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1220" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="605.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три покоління ping і ціна одного привілею</text>
<rect x="50.0" y="51.9" width="300.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">setuid root</tspan><tspan x="200.0" dy="18.2">(до 2008)</tspan></text>
<rect x="50.0" y="132.0" width="300.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">біт s на файлі: exec підіймає</tspan><tspan x="200.0" dy="16.9">діючий UID до нуля</tspan></text>
<rect x="50.0" y="275.1" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">помилка в ping —</tspan><tspan x="200.0" dy="16.9">уся машина</tspan></text>
<rect x="450.0" y="51.9" width="300.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">файлова можливість</tspan><tspan x="600.0" dy="18.2">(з ядра 2.6.24)</tspan></text>
<rect x="450.0" y="132.0" width="300.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">xattr security.capability:</tspan><tspan x="600.0" dy="16.9">cap_net_raw+ep</tspan></text>
<rect x="450.0" y="275.1" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">помилка в ping —</tspan><tspan x="600.0" dy="16.9">сирі пакети, і все</tspan></text>
<rect x="850.0" y="51.9" width="300.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">сокет ICMP</tspan><tspan x="1000.0" dy="18.2">(з ядра 3.0)</tspan></text>
<rect x="850.0" y="132.0" width="300.0" height="76.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">net.ipv4.ping_group_range:</tspan><tspan x="1000.0" dy="16.9">ядро саме пускає echo</tspan></text>
<rect x="850.0" y="275.1" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">привілею немає</tspan><tspan x="1000.0" dy="16.9">взагалі</tspan></text>
<line x1="365.0" y1="170.0" x2="435.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="765.0" y1="170.0" x2="835.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="378.8" y="383.5" width="442.4" height="33.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">найдешевша можливість — та, якої програмі більше не треба</tspan></text>
</svg>