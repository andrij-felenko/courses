<rect x="110.0" y="300.0" width="900.0" height="76.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">рядок читається зліва направо; дужки стоять ПІСЛЯ модуля</tspan><tspan x="560.0" dy="16.9">й міняють дію тільки для нього, а не для всього рядка.</tspan><tspan x="560.0" dy="16.9">решта модулів лишається з типовим: success=return, три інші статуси=continue</tspan></text>
