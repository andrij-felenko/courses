<rect x="395.1" y="176.6" width="249.7" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">дужки правлять ПОПЕРЕДНІЙ</tspan><tspan x="520.0" dy="16.9">знайшов у files — не спинятись,</tspan><tspan x="520.0" dy="16.9">а злити зі списком із sss</tspan></text>
