<line x1="1040.0" y1="458.0" x2="1040.0" y2="496.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="832.0" y="496.0" width="416.0" height="86.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1040.0" y="535.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">усередині або хеш,</tspan><tspan x="1040.0" dy="16.9">або підпис під ключем із кільця .ima</tspan></text>
<line x1="1040.0" y1="582.0" x2="1040.0" y2="620.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="832.0" y="620.0" width="416.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1040.0" y="657.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">збіглося — відкриття триває;</tspan><tspan x="1040.0" dy="16.9">ні — виклик повертає EACCES,</tspan><tspan x="1040.0" dy="16.9">як звичайна відмова за правами</tspan></text>
<line x1="1040.0" y1="720.0" x2="1040.0" y2="758.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="832.0" y="758.0" width="416.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1040.0" y="782.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">вирок виносить САМА машина</tspan></text>
<rect x="60.0" y="852.0" width="1220.0" height="56.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="670.0" y="884.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">обчислення спільне; розходяться потреби — «дізнатися, що тут було» проти «не пустити чуже»</tspan></text>
