<text x="300.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">вимірювання</text>
<rect x="92.0" y="372.0" width="416.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">рядок дописано у список:</tspan><tspan x="300.0" dy="16.9">хеш запису, хеш файлу, підказка з іменем</tspan></text>
<line x1="300.0" y1="458.0" x2="300.0" y2="496.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
