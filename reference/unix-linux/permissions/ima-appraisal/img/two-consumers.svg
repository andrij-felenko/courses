<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="950" fill="#ffffff"/>
