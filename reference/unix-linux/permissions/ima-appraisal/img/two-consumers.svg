<rect x="430.0" y="60.0" width="480.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="97.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">файл іде в діло: запуск, відображення коду, читання</tspan></text>
