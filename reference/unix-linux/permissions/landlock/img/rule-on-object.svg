<rect x="60.0" y="790.0" width="700.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="825.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">правило дали, відкривши каталог proj і передавши його дескриптор</tspan></text>
<text x="1110.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">як це працює на перевірці</text>
<rect x="820.0" y="100.0" width="580.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">обхід іде від файла ВГОРУ:</tspan><tspan x="1110.0" dy="18.2">main.c — правила нема, src — нема,</tspan><tspan x="1110.0" dy="18.2">proj — є і дає READ_FILE → дозволено</tspan></text>
<rect x="820.0" y="264.0" width="580.0" height="152.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1110.0" y="308.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">правило прив'язане до самого об'єкта,</tspan><tspan x="1110.0" dy="18.2">а не до рядка «/home/user/proj»:</tspan><tspan x="1110.0" dy="18.2">інший шлях, що веде в той самий каталог —</tspan><tspan x="1110.0" dy="18.2">жорстке посилання, символьне, друге</tspan><tspan x="1110.0" dy="18.2">монтування — дає рівно ті самі права</tspan></text>
<rect x="820.0" y="450.0" width="580.0" height="178.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1110.0" y="507.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">пастка: правила бувають ЛИШЕ дозвільні</tspan><tspan x="1110.0" dy="18.2"> </tspan><tspan x="1110.0" dy="18.2">дали правило на home — і «заборонити»</tspan><tspan x="1110.0" dy="18.2">нижче .ssh уже нічим: обхід угору дійде</tspan><tspan x="1110.0" dy="18.2">до home, знайде дозвіл і на тому спиниться</tspan></text>
<rect x="820.0" y="662.0" width="580.0" height="190.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1110.0" y="725.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">звідси спосіб користування:</tspan><tspan x="1110.0" dy="18.2">перелічують те, що ДОЗВОЛЕНО,</tspan><tspan x="1110.0" dy="18.2">і перелічують якнайглибше —</tspan><tspan x="1110.0" dy="18.2">правило на proj замість правила на home,</tspan><tspan x="1110.0" dy="18.2">бо виняток із дозволу вирізати нічим</tspan></text>
