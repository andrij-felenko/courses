<text x="360.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">життя процесу</text>
<rect x="60.0" y="110.0" width="350.0" height="78.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">процес стартує</tspan></text>
