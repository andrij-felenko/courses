<rect x="430.0" y="242.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">домен = шар A</tspan></text>
<line x1="235.0" y1="320.0" x2="235.0" y2="374.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="374.0" width="350.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">fork() → нащадок</tspan></text>
<rect x="430.0" y="374.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="417.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">домен = шар A</tspan></text>
<line x1="235.0" y1="452.0" x2="235.0" y2="506.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="506.0" width="350.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="550.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">execve() → інша програма</tspan></text>
<rect x="430.0" y="506.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="549.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">домен = шар A</tspan></text>
<line x1="235.0" y1="584.0" x2="235.0" y2="638.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="638.0" width="350.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="682.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">landlock_restrict_self(B)</tspan></text>
<rect x="430.0" y="638.0" width="260.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="681.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">домен = шар A і шар B</tspan></text>
<rect x="60.0" y="770.0" width="630.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="375.0" y="803.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">жодного виклику, що знімає шар, не існує —</tspan><tspan x="375.0" dy="18.2">домен тільки росте, і росте не більше ніж до 16 шарів</tspan></text>
<text x="1060.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">як судять одну спробу</text>
<rect x="770.0" y="110.0" width="580.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">відкрити /etc/passwd на читання</tspan></text>
<line x1="1060.0" y1="188.0" x2="1060.0" y2="242.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="242.0" width="580.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1060.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">шар A: обробляє READ_FILE,</tspan><tspan x="1060.0" dy="18.2">правило на /etc дає READ_FILE → «так»</tspan></text>
<line x1="1060.0" y1="342.0" x2="1060.0" y2="396.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="396.0" width="580.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1060.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">шар B: обробляє READ_FILE,</tspan><tspan x="1060.0" dy="18.2">жодне його правило /etc не накриває → «ні»</tspan></text>
<line x1="1060.0" y1="496.0" x2="1060.0" y2="550.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="550.0" width="580.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1060.0" y="594.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">open() повертає EACCES</tspan></text>
<rect x="770.0" y="664.0" width="580.0" height="182.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1060.0" y="714.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">правило зведення шарів:</tspan><tspan x="1060.0" dy="18.2">дозволено ⟺ дозволили ВСІ шари</tspan><tspan x="1060.0" dy="18.2"> </tspan><tspan x="1060.0" dy="18.2">шар, який цього права не обробляє,</tspan><tspan x="1060.0" dy="18.2">у голосуванні не бере участі —</tspan><tspan x="1060.0" dy="18.2">він про нього нічого не оголошував</tspan></text>
