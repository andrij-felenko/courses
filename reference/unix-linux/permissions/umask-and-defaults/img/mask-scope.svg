<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де маска діє, а де її навіть не питають</text>
<rect x="50.0" y="44.0" width="570.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="72.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">проходить крізь маску</tspan><tspan x="335.0" dy="18.2">у виклику є аргумент режиму, і об'єкт народжується зараз</tspan></text>
<rect x="660.0" y="44.0" width="570.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="72.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="945.0" dy="0.0">маски не бачить</tspan><tspan x="945.0" dy="18.2">або режим ставлять окремою дією, або його диктує щось інше</tspan></text>
<rect x="50.0" y="138.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">open, openat, creat з O_CREAT — новий файл</tspan></text>
<rect x="50.0" y="212.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">O_TMPFILE — безіменний файл на справжній ФС</tspan></text>
<rect x="50.0" y="286.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">mkdir, mkdirat — каталог</tspan></text>
<rect x="50.0" y="360.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="395.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">mknod, mkfifo — файл пристрою, іменований канал</tspan></text>
<rect x="50.0" y="434.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="469.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">bind — вузол сокета домену Unix у файловій системі</tspan></text>
<rect x="50.0" y="508.0" width="570.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="543.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">mq_open, sem_open, shm_open — об'єкти POSIX IPC</tspan></text>
<rect x="660.0" y="138.0" width="570.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">chmod, fchmod — режим наявного об'єкта, маска тут ні до чого</tspan></text>
<rect x="660.0" y="234.0" width="570.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">open без O_CREAT (і з O_CREAT на наявний файл) —</tspan><tspan x="945.0" dy="16.9">аргумент режиму просто не використовують</tspan></text>
<rect x="660.0" y="330.0" width="570.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">cp -p, tar -p, install -m, mkdir -m —</tspan><tspan x="945.0" dy="16.9">створюють, а потім ставлять режим точно</tspan></text>
<rect x="660.0" y="426.0" width="570.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">каталог із типовим ACL — маску цілком ігнорують,</tspan><tspan x="945.0" dy="16.9">права беруть із успадкованого ACL</tspan></text>
<rect x="660.0" y="522.0" width="570.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="560.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">FAT, NTFS, exFAT — режим дає монтування</tspan><tspan x="945.0" dy="16.9">(umask=, fmask=, dmask=), і це інший механізм</tspan></text>
<rect x="50.0" y="640.0" width="1180.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="678.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">у справу йдуть лише молодші дев'ять бітів: ядро бере mask &amp; 0777</tspan></text>
<rect x="50.0" y="724.0" width="1180.0" height="82.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="640.0" y="760.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">тому спеціальних бітів маска не чіпає взагалі: setgid, успадкований новим підкаталогом</tspan><tspan x="640.0" dy="18.2">від батьківського каталогу, лишається на місці, хай яка маска стоїть у процесі</tspan></text>
</svg>