<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки маска приходить у процес і як спускається деревом</text>
<rect x="50.0" y="44.0" width="1180.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">маска — властивість ПРОЦЕСУ: не файлу, не каталогу й не облікового запису</tspan><tspan x="640.0" dy="19.5">копіюється дитині при fork і переживає exec — тому веде себе як частина оточення</tspan></text>
<rect x="50.0" y="148.0" width="540.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="178.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">гілка служб</tspan></text>
<rect x="690.0" y="148.0" width="540.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="178.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">гілка людини за клавіатурою</tspan></text>
<rect x="50.0" y="222.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PID 1 — systemd</tspan></text>
<rect x="304.0" y="222.0" width="286.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="447.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">власна маска 0022</tspan></text>
<line x1="165.0" y1="292.0" x2="165.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="332.0" width="230.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">юніт служби</tspan></text>
<rect x="304.0" y="332.0" width="286.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="447.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">UMask=0027 у [Service] —</tspan><tspan x="447.0" dy="16.9">стає маскою цього процесу</tspan></text>
<line x1="165.0" y1="418.0" x2="165.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="458.0" width="230.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="496.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">процес служби</tspan></text>
<rect x="304.0" y="458.0" width="286.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="447.0" y="495.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">маска 0027 → журнали виходять 0640</tspan></text>
<line x1="165.0" y1="528.0" x2="165.0" y2="564.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="568.0" width="230.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="606.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">усе, що служба запускає</tspan></text>
<rect x="304.0" y="568.0" width="286.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="447.0" y="604.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="447.0" dy="0.0">та сама 0027, поки хтось не викличе umask()</tspan></text>
<rect x="690.0" y="222.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">вхід у систему</tspan></text>
<rect x="944.0" y="222.0" width="286.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1087.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1087.0" dy="0.0">консоль, ssh, графічний сеанс</tspan></text>
<line x1="805.0" y1="292.0" x2="805.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="332.0" width="230.0" height="82.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="805.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">стек PAM</tspan></text>
<rect x="944.0" y="332.0" width="286.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1087.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1087.0" dy="0.0">pam_umask бере UMASK</tspan><tspan x="1087.0" dy="16.9">з /etc/login.defs</tspan></text>
<line x1="805.0" y1="418.0" x2="805.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="458.0" width="230.0" height="82.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="805.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">оболонка</tspan></text>
<rect x="944.0" y="458.0" width="286.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1087.0" y="495.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1087.0" dy="0.0">profile і rc можуть перевизначити:</tspan><tspan x="1087.0" dy="16.9">umask 002</tspan></text>
<line x1="805.0" y1="544.0" x2="805.0" y2="580.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="584.0" width="230.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="621.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">усе, що ви запускаєте з неї</tspan></text>
<rect x="944.0" y="584.0" width="286.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1087.0" y="621.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1087.0" dy="0.0">успадкована 002 → файли 0664</tspan></text>
<rect x="50.0" y="700.0" width="1180.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="731.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">у ядрі маска зберігається біля робочого каталогу й кореня процесу —</tspan><tspan x="640.0" dy="18.2">серед того, що процес несе з собою, а не серед того, що лежить на диску</tspan></text>
<rect x="50.0" y="788.0" width="1180.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="640.0" y="814.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">правка profile чи login.defs не діє на вже запущені процеси: демон, народжений при завантаженні,</tspan><tspan x="640.0" dy="18.2">довіку тримає маску того моменту — звідси різні права у файлів вашої оболонки й тієї самої задачі з cron</tspan></text>
</svg>