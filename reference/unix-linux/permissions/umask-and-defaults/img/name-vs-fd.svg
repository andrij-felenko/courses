<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ім'я проти дескриптора при постановці режиму</text>
<rect x="60.0" y="40.0" width="1120.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">точний режим ставлять уже після створення — питання лише, до ЧОГО його прикладають</tspan></text>
<rect x="60.0" y="116.0" width="530.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">chmod(&quot;vault/key.pem&quot;, 0600)</tspan><tspan x="325.0" dy="19.5">за ІМЕНЕМ</tspan></text>
<rect x="650.0" y="116.0" width="530.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="915.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">fchmod(fd, 0600)</tspan><tspan x="915.0" dy="19.5">за ДЕСКРИПТОРОМ</tspan></text>
<rect x="60.0" y="210.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">ядро розбирає шлях НАНОВО, у мить виклику</tspan></text>
<rect x="650.0" y="210.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="915.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">розбору шляху немає зовсім</tspan></text>
<line x1="325.0" y1="300.0" x2="325.0" y2="328.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="915.0" y1="300.0" x2="915.0" y2="328.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="334.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">а «vault/key.pem» — уже інший об'єкт:</tspan><tspan x="325.0" dy="18.2">між двома викликами ім'я підмінили посиланням</tspan></text>
<rect x="650.0" y="334.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="915.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">дескриптор тримає сам об'єкт —</tspan><tspan x="915.0" dy="18.2">той inode, який створив саме наш open</tspan></text>
<line x1="325.0" y1="424.0" x2="325.0" y2="452.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="915.0" y1="424.0" x2="915.0" y2="452.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="458.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="495.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">0600 лягло на чужий inode —</tspan><tspan x="325.0" dy="18.2">і ми щойно роздали чужому файлові свої права</tspan></text>
<rect x="650.0" y="458.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="915.0" y="504.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">0600 лягло рівно туди, куди й мало</tspan></text>
<rect x="60.0" y="596.0" width="1120.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="629.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">O_EXCL — друга половина тієї самої гарантії: він каже, що об'єкт створили саме ми,</tspan><tspan x="620.0" dy="19.5">а не відкрили чужий, який хтось підклав під це ім'я за мить до нас</tspan></text>
</svg>