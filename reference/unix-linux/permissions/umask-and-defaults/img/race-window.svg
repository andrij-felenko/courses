<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно нульової маски між двома викликами umask</text>
<rect x="60.0" y="40.0" width="1120.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">umask(0) … umask(old) — це не «прочитати маску», а вимкнути її для ВСЬОГО процесу</tspan></text>
<line x1="352.0" y1="126.0" x2="352.0" y2="452.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7,5"/>
<line x1="944.0" y1="126.0" x2="944.0" y2="452.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7,5"/>
<rect x="362.0" y="132.0" width="572.0" height="46.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="648.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="648.0" dy="0.0">вікно, у якому маска процесу = 0000</tspan></text>
<rect x="50.0" y="208.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Потік A</tspan><tspan x="170.0" dy="18.2">генерує ключ</tspan></text>
<rect x="370.0" y="208.0" width="190.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="247.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">old = umask(0)</tspan></text>
<rect x="600.0" y="208.0" width="300.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">open(&quot;key.pem&quot;,</tspan><tspan x="750.0" dy="18.2">O_CREAT, 0600)</tspan></text>
<rect x="962.0" y="208.0" width="190.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1057.0" y="247.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">umask(old)</tspan></text>
<rect x="50.0" y="320.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="356.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Потік B</tspan><tspan x="170.0" dy="18.2">скидає кеш на диск</tspan></text>
<rect x="370.0" y="320.0" width="360.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="356.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">open(&quot;cache.db&quot;,</tspan><tspan x="550.0" dy="18.2">O_CREAT|O_TRUNC, 0666)</tspan></text>
<line x1="742.0" y1="361.0" x2="954.0" y2="361.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="962.0" y="320.0" width="250.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1087.0" y="356.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1087.0" dy="0.0">вийшло 0666</tspan><tspan x="1087.0" dy="19.5">замість 0644</tspan></text>
<rect x="60.0" y="478.0" width="1120.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="504.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">маска — поле процесу, а не потоку: pthread_create клонує задачу з CLONE_FS,</tspan><tspan x="620.0" dy="18.2">тож структура з коренем, робочим каталогом і маскою в потоків спільна</tspan></text>
<rect x="60.0" y="560.0" width="1120.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="586.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">потік B не зробив нічого дивного і не має способу дізнатися,</tspan><tspan x="620.0" dy="18.2">що саме зараз його файл вийде відкритим на запис усьому світу</tspan></text>
</svg>