<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">r, w, x для файлу і для каталогу</text>
<rect x="150.0" y="60.0" width="480.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">звичайний файл — послідовність байтів</tspan></text>
<rect x="690.0" y="60.0" width="480.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="930.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">каталог — таблиця «ім'я → номер inode»</tspan></text>
<rect x="50.0" y="170.0" width="76.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="88.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="88.0" dy="0.0">r</tspan></text>
<rect x="150.0" y="156.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="209.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">прочитати байти вмісту</tspan></text>
<rect x="690.0" y="156.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">перелічити імена з таблиці —</tspan><tspan x="930.0" dy="18.2">самі імена, без метаданих</tspan></text>
<rect x="50.0" y="298.0" width="76.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="88.0" y="342.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="88.0" dy="0.0">w</tspan></text>
<rect x="150.0" y="284.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">змінити байти:</tspan><tspan x="390.0" dy="18.2">дописати, урізати, перезаписати</tspan></text>
<rect x="690.0" y="284.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="319.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">змінити таблицю:</tspan><tspan x="930.0" dy="18.2">створити, прибрати</tspan><tspan x="930.0" dy="18.2">чи перейменувати запис</tspan></text>
<rect x="50.0" y="426.0" width="76.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="88.0" y="470.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="88.0" dy="0.0">x</tspan></text>
<rect x="150.0" y="412.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="456.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">виконати як програму —</tspan><tspan x="390.0" dy="18.2">образ читає саме ядро</tspan></text>
<rect x="690.0" y="412.0" width="480.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">скористатися таблицею для пошуку:</tspan><tspan x="930.0" dy="18.2">пройти крізь цей каталог</tspan><tspan x="930.0" dy="18.2">у середині шляху</tspan></text>
<rect x="50.0" y="546.0" width="1120.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="575.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">прибрати файл — це правка таблиці КАТАЛОГУ; прав самого файлу при цьому не питають,</tspan><tspan x="610.0" dy="18.2">тому в теці, куди вам вільно писати, ви приберете й чужий файл із режимом 000</tspan></text>
<rect x="50.0" y="630.0" width="1120.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="660.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">звідси біт t на спільних теках: звідти прибирає лише власник запису, власник теки або привілейований процес</tspan></text>
</svg>