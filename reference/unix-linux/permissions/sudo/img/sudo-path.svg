<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного запуску sudo і джерело кожної відповіді</text>
<rect x="240.0" y="53.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">exec /usr/bin/sudo, біт setuid:</tspan><tspan x="520.0" dy="18.2">euid стає 0, ruid лишається вашим</tspan></text>
<rect x="820.0" y="63.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">ядро, за бітом на файлі</tspan></text>
<line x1="520.0" y1="116.0" x2="520.0" y2="149.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="168.0" width="560.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">читання /etc/sudoers, режим 0440</tspan></text>
<rect x="820.0" y="168.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">файл, доступний лише root</tspan></text>
<line x1="520.0" y1="221.0" x2="520.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="273.0" width="560.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">пошук правила: виграє останній збіг</tspan></text>
<rect x="820.0" y="273.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">звідси беруться повноваження</tspan></text>
<line x1="520.0" y1="326.0" x2="520.0" y2="359.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="368.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">автентифікація прохача через PAM</tspan><tspan x="520.0" dy="18.2">(свіжий квиток у /run/sudo/ts пропускає крок)</tspan></text>
<rect x="820.0" y="378.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">доказ присутності — від людини</tspan></text>
<line x1="520.0" y1="431.0" x2="520.0" y2="464.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="483.0" width="560.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="504.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">перебудова оточення: env_reset, secure_path</tspan></text>
<rect x="820.0" y="483.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="504.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">білий список із файлу політики</tspan></text>
<line x1="520.0" y1="536.0" x2="520.0" y2="569.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="588.0" width="560.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="609.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ruid, euid і suid стають цільовими</tspan></text>
<rect x="820.0" y="588.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="609.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">ядро, на прохання самого sudo</tspan></text>
<line x1="520.0" y1="641.0" x2="520.0" y2="674.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="693.0" width="560.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="714.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">exec цільової програми</tspan></text>
<rect x="820.0" y="693.5" width="340.0" height="33.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="714.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">далі sudo лише чекає коду виходу</tspan></text>
</svg>