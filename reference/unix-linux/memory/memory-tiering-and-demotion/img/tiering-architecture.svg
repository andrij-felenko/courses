<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева архітектура пам'яті Linux</text>
<text x="60.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Дворівнева архітектура пам'яті: Top-tier (DRAM) проти Slow-tier (CXL)</text>
<rect x="50.0" y="70.0" width="520.0" height="250.0" rx="10" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<rect x="70.0" y="85.0" width="480.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="310.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Top-Tier: Локальна пам'ять (DRAM / HBM) — Вузли 0 та 1</tspan></text>
<rect x="75.0" y="140.0" width="225.0" height="75.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.2"/><text x="187.5" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="187.5" dy="0.0">CPU Socket 0 / Node 0</tspan><tspan x="187.5" dy="15.6">• DDR5 DRAM (60-80 ns)</tspan><tspan x="187.5" dy="15.6">• Смуга: 300-800 GB/s</tspan></text>
<rect x="315.0" y="140.0" width="225.0" height="75.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.2"/><text x="427.5" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">CPU Socket 1 / Node 1</tspan><tspan x="427.5" dy="15.6">• DDR5 DRAM (60-80 ns)</tspan><tspan x="427.5" dy="15.6">• Смуга: 300-800 GB/s</tspan></text>
<rect x="75.0" y="230.0" width="465.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="307.5" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">Гарячі дані процесу (Active LRU)</tspan><tspan x="307.5" dy="15.6">Код, стек, гаряча купа, кеш індексів бази даних</tspan></text>
<rect x="630.0" y="70.0" width="520.0" height="250.0" rx="10" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<rect x="650.0" y="85.0" width="480.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="890.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Slow-Tier: Розширена пам'ять (CXL.mem / PMEM) — Вузли 2 та 3</tspan></text>
<rect x="655.0" y="140.0" width="225.0" height="75.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.2"/><text x="767.5" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">CXL Expander / Node 2</tspan><tspan x="767.5" dy="15.6">• PCIe 5.0/6.0 CXL.mem</tspan><tspan x="767.5" dy="15.6">• Затримка: 150-250 ns</tspan></text>
<rect x="895.0" y="140.0" width="225.0" height="75.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.2"/><text x="1007.5" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1007.5" dy="0.0">CXL Expander / Node 3</tspan><tspan x="1007.5" dy="15.6">• CPU-less NUMA Node</tspan><tspan x="1007.5" dy="15.6">• Смуга: 64-128 GB/s</tspan></text>
<rect x="655.0" y="230.0" width="465.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="887.5" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="887.5" dy="0.0">Холодні дані процесу (Inactive LRU)</tspan><tspan x="887.5" dy="15.6">Фонові буфери, рідко опитувані кеші, старі сесії</tspan></text>
<rect x="80.0" y="360.0" width="460.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="310.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Асинхронний спуск (Page Demotion):</tspan><tspan x="310.0" dy="15.6">kswapd виявляє дефіцит DRAM -&gt; мігрує холодні сторінки</tspan><tspan x="310.0" dy="15.6">прямо в CXL RAM (без участі диска та swap)</tspan></text>
<line x1="310.0" y1="320.0" x2="310.0" y2="360.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="440.0" x2="750.0" y2="440.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="750.0" y1="440.0" x2="750.0" y2="320.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="660.0" y="465.0" width="460.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="890.0" y="493.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Підвищення (Page Promotion):</tspan><tspan x="890.0" dy="15.6">AutoNUMA balancing виявляє часті звернення до CXL -&gt;</tspan><tspan x="890.0" dy="15.6">мігрує сторінку назад у швидку DRAM</tspan></text>
<line x1="890.0" y1="320.0" x2="890.0" y2="465.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="800.0" y1="545.0" x2="200.0" y2="545.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="200.0" y1="545.0" x2="200.0" y2="320.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="50.0" y="585.0" width="1100.0" height="85.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="75.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Традиційний Swap на NVMe / SSD (Затримка: 10-100 мкс — у 100-500 разів повільніше за CXL):</text>
<text x="75.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Memory Tiering тримає робочий набір на 100% у фізичній RAM. Скидання на диск активується лише тоді, коли переповнено і DRAM, і CXL-вузли.</text>
</svg>