<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія memory_tiers та абстрактні дистанції</text>
<text x="60.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Ієрархія memory_tiers та обчислення абстрактних дистанцій (adist)</text>
<rect x="50.0" y="80.0" width="320.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Апаратна інформація про пам'ять</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">• ACPI HMAT (Heterogeneous Memory)</tspan><tspan x="210.0" dy="15.6">• CXL CDAT (Coherent Device Attributes)</tspan><tspan x="210.0" dy="15.6">• Таблиці затримок і пропускної здатності</tspan></text>
<line x1="370.0" y1="160.0" x2="430.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="430.0" y="80.0" width="340.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Драйвери &amp; Калькулятори adist</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">• drivers/acpi/numa/hmat.c</tspan><tspan x="600.0" dy="15.6">• drivers/cxl/core/cdat.c</tspan><tspan x="600.0" dy="15.6">• mt_calc_adistance_node()</tspan><tspan x="600.0" dy="15.6">Обчислення нормалізованої дистанції</tspan></text>
<line x1="770.0" y1="160.0" x2="830.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="80.0" width="320.0" height="160.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Ядерна підсистема memory-tiers</tspan><tspan x="990.0" dy="15.6"></tspan><tspan x="990.0" dy="15.6">• mm/memory-tiers.c</tspan><tspan x="990.0" dy="15.6">• Базовий DRAM adist = 512</tspan><tspan x="990.0" dy="15.6">• Розбиття на кошики (chunk = 128)</tspan><tspan x="990.0" dy="15.6">• Створення списків demotion targets</tspan></text>
<line x1="990.0" y1="240.0" x2="990.0" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="300.0" width="1100.0" height="350.0" rx="10" fill="none" stroke="#333333" stroke-width="1.6"/>
<text x="80.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Відображення у просторі користувача: /sys/devices/system/node/memory_tiers/</text>
<rect x="80.0" y="360.0" width="490.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="325.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">memory_tier0 (Швидкий ярус, adist: 512)</tspan><tspan x="325.0" dy="15.6"></tspan><tspan x="325.0" dy="15.6">• nodes: 0-1 (Локальні вузли процесорів)</tspan><tspan x="325.0" dy="15.6">• max_tier: вказує на найвищий ярус системи</tspan><tspan x="325.0" dy="15.6">• Demotion target -&gt; memory_tier1</tspan></text>
<line x1="570.0" y1="420.0" x2="650.0" y2="420.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="610.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Demotion</text>
<rect x="650.0" y="360.0" width="470.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="885.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">memory_tier1 (Повільний ярус, adist: 640)</tspan><tspan x="885.0" dy="15.6"></tspan><tspan x="885.0" dy="15.6">• nodes: 2-3 (CXL memory expanders)</tspan><tspan x="885.0" dy="15.6">• Вузли без CPU (CPU-less memory nodes)</tspan><tspan x="885.0" dy="15.6">• Demotion target -&gt; порожній (або swap)</tspan></text>
<rect x="80.0" y="505.0" width="1040.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="600.0" y="548.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Внутрішній масив ядра: node_demotion_targets[N]</tspan><tspan x="600.0" dy="15.6">• Вузол 0 (DRAM) -&gt; ціль витіснення Вузол 2 (найближчий CXL-вузол)</tspan><tspan x="600.0" dy="15.6">• Вузол 1 (DRAM) -&gt; ціль витіснення Вузол 3 (найближчий CXL-вузол)</tspan><tspan x="600.0" dy="15.6">• Вузол 2/3 (CXL) -&gt; цілей витіснення у пам'ять немає; наступний крок — вивантаження у swap</tspan></text>
</svg>