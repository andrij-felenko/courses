<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві половини прибивання і навіщо знадобилася лише друга</text>
<rect x="60.0" y="96.0" width="350.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="235.0" y="127.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">звичайне відображення</tspan></text>
<rect x="60.0" y="180.0" width="350.0" height="88.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="235.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">нічого не робимо</tspan><tspan x="235.0" dy="16.2">заздалегідь</tspan></text>
<rect x="60.0" y="292.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="235.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">з'являються за першим</tspan><tspan x="235.0" dy="16.2">звертанням — збій і диск</tspan></text>
<rect x="60.0" y="404.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="235.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">ядро забирає їх,</tspan><tspan x="235.0" dy="16.2">коли стане тісно</tspan></text>
<rect x="60.0" y="516.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="235.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">нуль пам'яті наперед,</tspan><tspan x="235.0" dy="16.2">час відповіді непередбачний</tspan></text>
<rect x="450.0" y="96.0" width="350.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="625.0" y="127.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">mlock / mlockall</tspan></text>
<rect x="450.0" y="180.0" width="350.0" height="88.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.3"/><text x="625.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">ОБИДВІ половини:</tspan><tspan x="625.0" dy="16.2">привести й тримати</tspan></text>
<rect x="450.0" y="292.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="625.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">ядро вганяє їх у пам'ять</tspan><tspan x="625.0" dy="16.2">прямо у виклику</tspan></text>
<rect x="450.0" y="404.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="625.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">лишаються, доки</tspan><tspan x="625.0" dy="16.2">не знімеш прибивання</tspan></text>
<rect x="450.0" y="516.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="625.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">уся ділянка займає</tspan><tspan x="625.0" dy="16.2">пам'ять і межу відразу</tspan></text>
<rect x="840.0" y="96.0" width="350.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1015.0" y="127.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1015.0" dy="0.0">MLOCK_ONFAULT</tspan></text>
<rect x="840.0" y="180.0" width="350.0" height="88.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="1015.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">ЛИШЕ друга половина:</tspan><tspan x="1015.0" dy="16.2">тільки тримати</tspan></text>
<rect x="840.0" y="292.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.3"/><text x="1015.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">з'являться, як і раніше,</tspan><tspan x="1015.0" dy="16.2">за першим звертанням</tspan></text>
<rect x="840.0" y="404.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.3"/><text x="1015.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">щойно з'явилася —</tspan><tspan x="1015.0" dy="16.2">більше не піде</tspan></text>
<rect x="840.0" y="516.0" width="350.0" height="88.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.3"/><text x="1015.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">платимо тільки за те,</tspan><tspan x="1015.0" dy="16.2">чого справді торкнулися</tspan></text>
<text x="1268.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">що робить виклик</text>
<text x="1275.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">відсутні сторінки</text>
<text x="1275.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">присутні сторінки</text>
<text x="1268.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">ціна</text>
<rect x="60.0" y="40.0" width="1130.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="625.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="625.0" dy="0.0">велике розріджене відображення: сторінок мільйон, торкнеться програма тисячі</tspan></text>
<rect x="60.0" y="620.0" width="1130.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="625.0" y="647.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">MLOCK_ONFAULT — це рівно mlock без першої половини: він нічого не вганяє в пам'ять,</tspan><tspan x="625.0" dy="17.6">а лише позначає ділянку, щоб усе, що в ній з'явиться, звідти вже не пішло</tspan></text>
</svg>