<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому прибиті сторінки виносять в окремий список, а не позначають прапорцем</text>
<rect x="60.0" y="44.0" width="1180.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="650.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">збирач шукає, що звільнити, — і мусить перебирати списки сторінок</tspan></text>
<rect x="60.0" y="132.0" width="240.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="180.0" y="166.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">збирач</tspan><tspan x="180.0" dy="18.2">(vmscan)</tspan></text>
<rect x="430.0" y="132.0" width="420.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="640.0" y="175.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">активний список</tspan></text>
<text x="880.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">переглядається</text>
<rect x="430.0" y="246.0" width="420.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="640.0" y="289.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">неактивний список</tspan></text>
<text x="880.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">переглядається</text>
<rect x="430.0" y="384.0" width="420.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="640.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">список невитіснюваних</tspan></text>
<text x="880.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">не переглядається ніколи</text>
<line x1="304.0" y1="168.0" x2="424.0" y2="168.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="304.0" y1="178.0" x2="424.0" y2="282.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="304.0" y1="190.0" x2="424.0" y2="418.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="348.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2457d6" text-anchor="middle" font-weight="700">×</text>
<rect x="60.0" y="486.0" width="560.0" height="74.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="340.0" y="519.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">варіант «просто пропускати прибиті»:</tspan><tspan x="340.0" dy="16.2">списки повні, а знайти в них нічого</tspan></text>
<rect x="680.0" y="486.0" width="560.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="960.0" y="519.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">варіант «винести їх геть зі списків»:</tspan><tspan x="960.0" dy="16.2">перебирати лишається тільки корисне</tspan></text>
<rect x="60.0" y="578.0" width="1180.0" height="58.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="650.0" y="611.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">саме тому прибиття — не прапорець, який перевіряють у циклі, а перенесення сторінки в інший список</tspan></text>
</svg>