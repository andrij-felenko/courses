<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 594" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="594" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Настанова живе на ділянці — а ділянка не переживає execve</text>
<rect x="24.0" y="52.0" width="286.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="167.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.0" dy="0.0">Важіль або позначка</tspan></text>
<rect x="318.0" y="52.0" width="222.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="429.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="429.0" dy="0.0">У того, хто поставив</tspan></text>
<rect x="548.0" y="52.0" width="222.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="659.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="659.0" dy="0.0">У дитини після fork</tspan></text>
<rect x="778.0" y="52.0" width="238.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="897.0" dy="0.0">Після execve</tspan></text>
<rect x="24.0" y="124.0" width="286.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="167.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.0" dy="0.0">Прапорці mmap ділянки</tspan><tspan x="167.0" dy="18.2">(MAP_PRIVATE, MAP_NORESERVE)</tspan></text>
<rect x="318.0" y="124.0" width="222.0" height="78.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="429.0" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="429.0" dy="0.0">діють</tspan></text>
<rect x="548.0" y="124.0" width="222.0" height="78.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="659.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">ті самі —</tspan><tspan x="659.0" dy="18.2">ділянку успадковано</tspan></text>
<rect x="778.0" y="124.0" width="238.0" height="78.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="897.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">простір новий,</tspan><tspan x="897.0" dy="18.2">ділянки немає</tspan></text>
