<rect x="778.0" y="216.0" width="238.0" height="78.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="897.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">стерто разом</tspan><tspan x="897.0" dy="18.2">із простором</tspan></text>
