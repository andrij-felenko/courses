<rect x="548.0" y="400.0" width="222.0" height="78.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="659.0" y="443.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">успадковано</tspan></text>
<rect x="778.0" y="400.0" width="238.0" height="78.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="897.0" y="443.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">лишається чинним</tspan></text>
<rect x="24.0" y="492.0" width="286.0" height="78.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="167.0" y="526.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.0" dy="0.0">pagemap, біт 56</tspan><tspan x="167.0" dy="18.2">«сторінка виключна»</tspan></text>
<rect x="318.0" y="492.0" width="222.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="429.0" y="526.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="429.0" dy="0.0">1 — сторінка</tspan><tspan x="429.0" dy="18.2">належить лише мені</tspan></text>
<rect x="548.0" y="492.0" width="222.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="659.0" y="526.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">0 в обох, поки</tspan><tspan x="659.0" dy="18.2">хтось не напише</tspan></text>
<rect x="778.0" y="492.0" width="238.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="526.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">сторінки нові —</tspan><tspan x="897.0" dy="18.2">знову 1</tspan></text>
