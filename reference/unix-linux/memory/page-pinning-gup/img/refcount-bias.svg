<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як намір «сюди писатиме залізо» вміщується в наявний лічильник</text>
<rect x="120.0" y="58.0" width="1000.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">page-&gt;_refcount — одне поле на всі види володіння кадром</tspan></text>
<rect x="120.0" y="146.0" width="470.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="355.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">звичайне посилання: get_page, get_user_pages</tspan><tspan x="355.0" dy="16.9">«мені потрібен цей об'єкт сторінки»</tspan></text>
<rect x="650.0" y="146.0" width="470.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="885.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">закріплення: pin_user_pages</tspan><tspan x="885.0" dy="16.9">«у вміст цього кадру писатиме залізо»</tspan></text>
<line x1="355.0" y1="214.0" x2="355.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="885.0" y1="214.0" x2="885.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="255.0" y="250.0" width="200.0" height="54.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.8"/><text x="355.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">+ 1</tspan></text>
<rect x="785.0" y="250.0" width="200.0" height="54.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/><text x="885.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">+ 1024</tspan></text>
<text x="885.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">GUP_PIN_COUNTING_BIAS</text>
<rect x="120.0" y="350.0" width="1000.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="620.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">запит зворотного запису: лічильник ≥ 1024 → «можливо, під DMA»</tspan></text>
<rect x="120.0" y="428.0" width="470.0" height="96.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="355.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">хибне «так» можливе: 1024 звичайних</tspan><tspan x="355.0" dy="16.2">посилань виглядають як одне закріплення.</tspan><tspan x="355.0" dy="16.2">Ціна — обережніший шлях, не помилка</tspan></text>
<rect x="650.0" y="428.0" width="470.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">хибне «ні» неможливе: доки закріплення</tspan><tspan x="885.0" dy="16.2">живе, ці 1024 у лічильнику стоять.</tspan><tspan x="885.0" dy="16.2">Саме ця несиметричність робить трюк чинним</tspan></text>
<rect x="120.0" y="542.0" width="1000.0" height="56.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="620.0" y="574.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">у великої сторінки в дескрипторі є вільне місце — там лічильник закріплень тримають точно, без зсуву</tspan></text>
</svg>