<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди дівається кадр, номер якого вже віддали пристроєві</text>
<rect x="195.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="325.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Витіснення</tspan></text>
<rect x="195.0" y="122.0" width="260.0" height="92.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="325.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">рідко вживану сторінку</tspan><tspan x="325.0" dy="15.6">ядро пише у своп</tspan><tspan x="325.0" dy="15.6">і забирає кадр</tspan></text>
<rect x="195.0" y="232.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="325.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="325.0" dy="0.0">наступне звертання</tspan><tspan x="325.0" dy="15.6">поверне вміст —</tspan><tspan x="325.0" dy="15.6">можливо, в інший кадр</tspan></text>
<rect x="195.0" y="342.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.4"/><text x="325.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">старий номер кадру,</tspan><tspan x="325.0" dy="15.6">а під ним уже</tspan><tspan x="325.0" dy="15.6">чужі дані</tspan></text>
<rect x="480.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="610.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Ущільнення</tspan></text>
<rect x="480.0" y="122.0" width="260.0" height="92.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="610.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">вміст переносять</tspan><tspan x="610.0" dy="15.6">в інший кадр, щоб</tspan><tspan x="610.0" dy="15.6">зібрати суцільний блок</tspan></text>
<rect x="480.0" y="232.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="610.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">запис таблиці правлять</tspan><tspan x="610.0" dy="15.6">тієї ж миті: адреса</tspan><tspan x="610.0" dy="15.6">лишається чинною</tspan></text>
<rect x="480.0" y="342.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="610.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">старий номер кадру,</tspan><tspan x="610.0" dy="15.6">а даних там</tspan><tspan x="610.0" dy="15.6">більше немає</tspan></text>
<rect x="765.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="895.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">Копіювання при записі</tspan></text>
<rect x="765.0" y="122.0" width="260.0" height="92.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="895.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">після fork перший же</tspan><tspan x="895.0" dy="15.6">запис розщеплює</tspan><tspan x="895.0" dy="15.6">сторінку на дві</tspan></text>
<rect x="765.0" y="232.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="895.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="895.0" dy="0.0">хто пише, той дістає</tspan><tspan x="895.0" dy="15.6">свіжий кадр і жодної</tspan><tspan x="895.0" dy="15.6">різниці не бачить</tspan></text>
<rect x="765.0" y="342.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="895.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">старий кадр, який</tspan><tspan x="895.0" dy="15.6">дістався другому</tspan><tspan x="895.0" dy="15.6">процесові</tspan></text>
<rect x="1050.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="1180.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">Звільнення</tspan></text>
<rect x="1050.0" y="122.0" width="260.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="1180.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">munmap, вихід процесу,</tspan><tspan x="1180.0" dy="15.6">повернення пам'яті</tspan><tspan x="1180.0" dy="15.6">алокатором</tspan></text>
<rect x="1050.0" y="232.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1180.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1180.0" dy="0.0">програма й не збиралася</tspan><tspan x="1180.0" dy="15.6">більше туди</tspan><tspan x="1180.0" dy="15.6">дивитися</tspan></text>
<rect x="1050.0" y="342.0" width="260.0" height="92.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="1180.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">кадр із вільного пулу,</tspan><tspan x="1180.0" dy="15.6">вже виданий</tspan><tspan x="1180.0" dy="15.6">комусь іншому</tspan></text>
<text x="175.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">що робить ядро</text>
<text x="175.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">що бачить програма</text>
<text x="175.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">що бачить пристрій</text>
<rect x="30.0" y="462.0" width="1280.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="670.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">спільне в усіх чотирьох: ядро тримає чинною ВІРТУАЛЬНУ адресу, а не фізичний кадр,</tspan><tspan x="670.0" dy="17.6">і робить це мовчки — у пристрою ж є лише номер кадру, який ніхто не оновлює</tspan></text>
</svg>