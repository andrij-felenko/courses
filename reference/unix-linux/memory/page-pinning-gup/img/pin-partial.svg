<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три відповіді pin_user_pages_fast і що робити з кожною</text>
<rect x="70.0" y="42.0" width="1160.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">pinned = pin_user_pages_fast(start, nr_pages, FOLL_WRITE, pages)</tspan></text>
<line x1="230.0" y1="96.0" x2="230.0" y2="134.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="134.0" width="320.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="230.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">pinned &lt; 0</tspan></text>
<rect x="70.0" y="202.0" width="320.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="230.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">жодної сторінки</tspan><tspan x="230.0" dy="16.2">не закріплено</tspan></text>
<rect x="70.0" y="302.0" width="320.0" height="92.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">повернути помилку;</tspan><tspan x="230.0" dy="16.2">відпускати нічого</tspan></text>
<line x1="650.0" y1="96.0" x2="650.0" y2="134.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490.0" y="134.0" width="320.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="650.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">0 &lt; pinned &lt; nr_pages</tspan></text>
<rect x="490.0" y="202.0" width="320.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">закріплено рівно pinned</tspan><tspan x="650.0" dy="16.2">сторінок — вони вже наші</tspan></text>
<rect x="490.0" y="302.0" width="320.0" height="92.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">ВІДПУСТИТИ ці pinned,</tspan><tspan x="650.0" dy="16.2">а тоді вже повертати</tspan><tspan x="650.0" dy="16.2">помилку</tspan></text>
<line x1="1070.0" y1="96.0" x2="1070.0" y2="134.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="910.0" y="134.0" width="320.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1070.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">pinned = nr_pages</tspan></text>
<rect x="910.0" y="202.0" width="320.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="1070.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">закріплено весь</tspan><tspan x="1070.0" dy="16.2">діапазон</tspan></text>
<rect x="910.0" y="302.0" width="320.0" height="92.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="1070.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">працювати, потім</tspan><tspan x="1070.0" dy="16.2">відпустити всі</tspan></text>
<rect x="70.0" y="424.0" width="1160.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="650.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">середня гілка — єдина, яку легко проґавити, і це витік, якого не побачить ніхто:</tspan><tspan x="650.0" dy="17.6">закріплення переживає вихід процесу, тож кадри не повернуться в пул до перезавантаження</tspan></text>
</svg>