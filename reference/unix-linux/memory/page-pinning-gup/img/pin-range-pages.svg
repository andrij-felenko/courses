<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому діапазон у байтах перетворюється на більше сторінок, ніж здається</text>
<rect x="60.0" y="36.0" width="1160.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="640.0" y="63.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">діапазон, який назвала програма, і сторінки, які через це доведеться закріпити (не в масштабі)</tspan></text>
<rect x="146.0" y="150.0" width="604.0" height="44.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="448.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">буфер програми: len байтів</text>
<line x1="146.0" y1="126.0" x2="146.0" y2="146.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="146.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">addr</text>
<line x1="750.0" y1="126.0" x2="750.0" y2="146.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="750.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">addr + len</text>
<line x1="146.0" y1="194.0" x2="146.0" y2="240.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4,4"/>
<line x1="750.0" y1="194.0" x2="750.0" y2="240.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4,4"/>
<rect x="100.0" y="240.0" width="253.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="226.5" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="226.5" dy="0.0">сторінка N</tspan><tspan x="226.5" dy="16.2">закріплено</tspan></text>
<rect x="365.0" y="240.0" width="253.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="491.5" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="491.5" dy="0.0">сторінка N+1</tspan><tspan x="491.5" dy="16.2">закріплено</tspan></text>
<rect x="630.0" y="240.0" width="253.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="756.5" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="756.5" dy="0.0">сторінка N+2</tspan><tspan x="756.5" dy="16.2">закріплено</tspan></text>
<rect x="895.0" y="240.0" width="253.0" height="82.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.6"/><text x="1021.5" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1021.5" dy="0.0">сторінка N+3</tspan><tspan x="1021.5" dy="16.2">не чіпаємо</tspan></text>
<line x1="100.0" y1="322.0" x2="100.0" y2="368.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4,4"/>
<line x1="146.0" y1="322.0" x2="146.0" y2="368.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4,4"/>
<line x1="100.0" y1="368.0" x2="146.0" y2="368.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">зміщення в першій сторінці</text>
<rect x="60.0" y="400.0" width="1160.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="640.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">закріплюють ЦІЛІ сторінки: краї діапазону їдуть разом із чужими байтами-сусідами,</tspan><tspan x="640.0" dy="17.6">а два байти, що припали на межу, коштують двох закріплень</tspan></text>
<rect x="60.0" y="486.0" width="1160.0" height="56.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="640.0" y="518.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">nr_pages = ⌈((addr &amp; 4095) + len) / 4096⌉ — рахувати від початку сторінки, а не від addr</tspan></text>
</svg>