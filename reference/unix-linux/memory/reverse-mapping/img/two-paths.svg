<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від сторінки до всіх її записів: два входи, одна дорога</text>
<rect x="70.0" y="64.0" width="480.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="310.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Сторінка з файловою підкладкою</tspan></text>
<rect x="70.0" y="132.0" width="480.0" height="62.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="310.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">mapping → опис відображуваного</tspan><tspan x="310.0" dy="16.2">вмісту інода (address_space)</tspan></text>
<rect x="70.0" y="206.0" width="480.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="310.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">index = зміщення в ФАЙЛІ,</tspan><tspan x="310.0" dy="16.2">у сторінках</tspan></text>
<line x1="310.0" y1="274.0" x2="310.0" y2="302.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="310.0" width="480.0" height="62.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.4"/><text x="310.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">дерево інтервалів усіх ділянок,</tspan><tspan x="310.0" dy="16.2">що відображають цей файл</tspan></text>
<rect x="70.0" y="384.0" width="480.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="310.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">запит: які ділянки накривають</tspan><tspan x="310.0" dy="16.2">зміщення index</tspan></text>
<line x1="310.0" y1="446.0" x2="310.0" y2="486.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="64.0" width="480.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="870.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Анонімна сторінка</tspan></text>
<rect x="630.0" y="132.0" width="480.0" height="62.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="870.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">mapping → anon_vma</tspan><tspan x="870.0" dy="16.2">(молодший біт вказівника = 1)</tspan></text>
<rect x="630.0" y="206.0" width="480.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="870.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">index = зміщення в ДІЛЯНЦІ,</tspan><tspan x="870.0" dy="16.2">зафіксоване при першому збої</tspan></text>
<line x1="870.0" y1="274.0" x2="870.0" y2="302.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="310.0" width="480.0" height="62.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="870.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">дерево ребер «ділянка ↔ об'єкт»,</tspan><tspan x="870.0" dy="16.2">заведених при кожному fork</tspan></text>
<rect x="630.0" y="384.0" width="480.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="870.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">запит: які ділянки приписані</tspan><tspan x="870.0" dy="16.2">до цього об'єкта</tspan></text>
<line x1="870.0" y1="446.0" x2="870.0" y2="486.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="494.0" width="1040.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="590.0" y="537.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">спільна арифметика: для кожної знайденої ділянки</tspan><tspan x="590.0" dy="19.5">address = vm_start + (index − vm_pgoff) · PAGE_SIZE</tspan></text>
<line x1="590.0" y1="596.0" x2="590.0" y2="630.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="638.0" width="1040.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="590.0" y="672.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">один спуск таблицями цього процесу до ОДНІЄЇ адреси — і потрібний запис у руках</tspan></text>
<rect x="70.0" y="714.0" width="1040.0" height="56.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="746.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">інваріант, без якого формули не існує: сусідні сторінки об'єкта видно за сусідніми адресами</tspan></text>
</svg>