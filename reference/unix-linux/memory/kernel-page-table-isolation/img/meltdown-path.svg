<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг витоку і єдина ланка, яку можна розірвати програмно</text>
<rect x="140.0" y="70.0" width="560.0" height="95.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="112.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1 · читання за адресою ядра —</tspan><tspan x="420.0" dy="20.8">переклад у чинній таблиці є</tspan></text>
<rect x="140.0" y="195.0" width="560.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2 · значення вже роздане залежним інструкціям,</tspan><tspan x="420.0" dy="20.8">поки триває перевірка прав</tspan></text>
<rect x="140.0" y="320.0" width="560.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="362.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">3 · залежна інструкція чіпає рядок кешу</tspan><tspan x="420.0" dy="20.8">за номером секретного байта</tspan></text>
<rect x="140.0" y="445.0" width="560.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="487.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">4 · усе скасовано: регістри чисті,</tspan><tspan x="420.0" dy="20.8">виняток оголошено</tspan></text>
<rect x="140.0" y="570.0" width="560.0" height="95.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="612.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">5 · рядок кешу лишився теплим —</tspan><tspan x="420.0" dy="20.8">байт відновлюють вимірюванням часу</tspan></text>
<line x1="420.0" y1="168.0" x2="420.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="293.0" x2="420.0" y2="317.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="418.0" x2="420.0" y2="442.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="543.0" x2="420.0" y2="567.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="72.0" width="330.0" height="92.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">KPTI розтинає ланцюг тут:</tspan><tspan x="955.0" dy="18.2">у користувацькій копії перекладу</tspan><tspan x="955.0" dy="18.2">немає — братися нема звідки</tspan></text>
<line x1="786.0" y1="118.0" x2="706.0" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="447.0" width="330.0" height="92.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="479.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">кеш до архітектурного стану</tspan><tspan x="955.0" dy="18.2">не належить — його ніхто</tspan><tspan x="955.0" dy="18.2">не відкочує</tspan></text>
<line x1="786.0" y1="493.0" x2="706.0" y2="493.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>