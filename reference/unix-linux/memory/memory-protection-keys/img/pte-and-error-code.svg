<text x="710.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Ядро перекладає цей біт у si_code = SEGV_PKUERR, а номер ключа зі запису таблиці кладе в si_pkey.</text>
