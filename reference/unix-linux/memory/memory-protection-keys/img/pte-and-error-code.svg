<text x="710.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два бітових поля, якими механізм заявляє про себе апаратно</text>
