<text x="455.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ключ = (запис &gt;&gt; 59) &amp; 0xF   ·   правиться лише через pkey_mprotect</text>
