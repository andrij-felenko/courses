<text x="1090.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">і ядро ОС чекає, поки кожне з них підтвердить скидання</text>
