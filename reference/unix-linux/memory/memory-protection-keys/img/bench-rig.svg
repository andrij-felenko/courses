<text x="490.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start">нікуди не виходить: ані ядро ОС, ані сусідні ядра про це не знають</text>
