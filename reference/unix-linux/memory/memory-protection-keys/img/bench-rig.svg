<rect x="60.0" y="458.0" width="600.0" height="150.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="518.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ЗМІНЮЄМО тільки дві речі</tspan><tspan x="360.0" dy="19.5">розмір ділянки:  1 сторінка  ↔  1024 сторінки</tspan><tspan x="360.0" dy="19.5">сусіди на інших ядрах:  0  ↔  8</tspan></text>
<rect x="700.0" y="458.0" width="600.0" height="150.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="518.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">УСЕ решта однакове</tspan><tspan x="1000.0" dy="19.5">той самий один запис у пам'ять між «відчинити» й «зачинити»</tspan><tspan x="1000.0" dy="19.5">той самий цикл, та сама машина, той самий прогін</tspan></text>
