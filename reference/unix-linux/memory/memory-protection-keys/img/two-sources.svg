<rect x="205.9" y="543.0" width="98.1" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="566.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">MMU бачить</tspan><tspan x="255.0" dy="16.9">WD = 1</tspan></text>
<rect x="483.7" y="534.6" width="142.6" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">збій сторінки,</tspan><tspan x="555.0" dy="16.9">у коді помилки</tspan><tspan x="555.0" dy="16.9">виставлено біт 5</tspan></text>
<line x1="360.0" y1="570.0" x2="437.0" y2="570.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="780.0" y="534.6" width="150.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">ядро бачить біт 5</tspan><tspan x="855.0" dy="16.9">і не шукає</tspan><tspan x="855.0" dy="16.9">сторінку далі</tspan></text>
<line x1="660.0" y1="570.0" x2="737.0" y2="570.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
