<line x1="960.0" y1="570.0" x2="1027.0" y2="570.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="662.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">ключ лише ЗВУЖУЄ те, що дозволив запис таблиці: скинути WD і дописати в сторінку без R/W не вийде</text>
