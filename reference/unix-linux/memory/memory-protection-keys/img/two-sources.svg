<rect x="455.0" y="122.0" width="120.0" height="58.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">R/W = 1</tspan><tspan x="515.0" dy="15.6">дозволено</tspan><tspan x="515.0" dy="15.6">писати</tspan></text>
