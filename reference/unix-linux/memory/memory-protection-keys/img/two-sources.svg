<text x="650.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожне звернення до пам'яті звіряють ДВІЧІ</text>
<rect x="70.5" y="98.8" width="199.0" height="62.5" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">звернення до пам'яті</tspan><tspan x="170.0" dy="19.5">за адресою 0x7f…c000</tspan></text>
<rect x="430.0" y="78.0" width="470.0" height="122.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
