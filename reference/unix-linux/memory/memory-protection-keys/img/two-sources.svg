<rect x="735.0" y="122.0" width="140.0" height="58.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">ключ = 3</tspan><tspan x="805.0" dy="15.6">біти 62…59</tspan></text>
