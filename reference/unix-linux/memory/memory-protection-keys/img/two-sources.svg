<rect x="455.0" y="306.0" width="190.0" height="58.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">для ключа 3:  AD = 0</tspan><tspan x="550.0" dy="15.6">доступ дозволено</tspan></text>
<rect x="665.0" y="306.0" width="210.0" height="58.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">для ключа 3:  WD = 1</tspan><tspan x="770.0" dy="15.6">запис ЗАБОРОНЕНО</tspan></text>
