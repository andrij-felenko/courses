<text x="684.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">на кожен ключ — два біти: WD (заборонити запис) і AD (заборонити доступ)</text>
<rect x="234.1" y="260.8" width="131.7" height="78.4" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ключ 0</tspan><tspan x="300.0" dy="18.2">дефолтний: 00</tspan><tspan x="300.0" dy="18.2">усе дозволено</tspan></text>
<rect x="602.2" y="260.8" width="195.6" height="78.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ключ 2 → 10</tspan><tspan x="700.0" dy="18.2">WD = 1: читати можна,</tspan><tspan x="700.0" dy="18.2">писати не можна</tspan></text>
<rect x="1020.2" y="260.8" width="179.6" height="78.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1110.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">ключі 1 і 3…15 → 01</tspan><tspan x="1110.0" dy="18.2">AD = 1: сторінка</tspan><tspan x="1110.0" dy="18.2">недоторканна</tspan></text>
<text x="690.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Уся мапа прав процесу вміщується в один регістр — тому її заміна коштує одну команду.</text>
<text x="690.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Номер ключа лежить не тут, а в записі таблиці сторінок: регістр каже «що можна групі», таблиця — «до якої групи належить сторінка».</text>
</svg>