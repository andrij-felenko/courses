<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Копія відображень і спільні таблиці вимагають різних місць вклинення</text>
<rect x="70.0" y="44.0" width="560.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="75.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">має ВЛАСНУ копію відображень</tspan></text>
<rect x="70.0" y="116.0" width="560.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="350.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">гість віртуальної машини,</tspan><tspan x="350.0" dy="16.2">графічний прискорювач</tspan></text>
<rect x="70.0" y="202.0" width="560.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="350.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">своя табличка адрес</tspan><tspan x="350.0" dy="16.2">і свій кеш перекладів</tspan></text>
<rect x="70.0" y="288.0" width="560.0" height="88.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="320.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">розібрати свої записи</tspan><tspan x="350.0" dy="16.2">й не пускати нових,</tspan><tspan x="350.0" dy="16.2">доки триває зміна</tspan></text>
<rect x="70.0" y="396.0" width="560.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="427.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">пара invalidate_range_start</tspan><tspan x="350.0" dy="16.2">/ invalidate_range_end</tspan></text>
<rect x="70.0" y="486.0" width="560.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="350.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">однієї точки замало: між</tspan><tspan x="350.0" dy="16.2">читанням таблиць і записом</tspan><tspan x="350.0" dy="16.2">у свою табличку встигає</tspan><tspan x="350.0" dy="16.2">вклинитися перенесення</tspan></text>
<rect x="710.0" y="44.0" width="560.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="990.0" y="75.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">ходить у ТІ САМІ таблиці, що й процесор</tspan></text>
<rect x="710.0" y="116.0" width="560.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="990.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">IOMMU зі спільною</tspan><tspan x="990.0" dy="16.2">віртуальною адресацією</tspan></text>
<rect x="710.0" y="202.0" width="560.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="990.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">таблиць своїх немає,</tspan><tspan x="990.0" dy="16.2">є лише кеш перекладів</tspan></text>
<rect x="710.0" y="288.0" width="560.0" height="88.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="320.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">скинути кеш перекладів</tspan><tspan x="990.0" dy="16.2">рівно там, де ядро скидає</tspan><tspan x="990.0" dy="16.2">TLB процесора</tspan></text>
<rect x="710.0" y="396.0" width="560.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="990.0" y="427.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">arch_invalidate_secondary_tlbs</tspan><tspan x="990.0" dy="16.2">(до ядра 6.6 — invalidate_range)</tspan></text>
<rect x="710.0" y="486.0" width="560.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="990.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">start зарано: запис ще</tspan><tspan x="990.0" dy="16.2">чинний і його перечитають;</tspan><tspan x="990.0" dy="16.2">end запізно: сторінку вже</tspan><tspan x="990.0" dy="16.2">віддано іншому</tspan></text>
<text x="660.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">хто це</text>
<text x="660.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що має</text>
<text x="660.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що робить</text>
<text x="660.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">який виклик</text>
<text x="660.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">чому не інший</text>
<rect x="70.0" y="610.0" width="1200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="670.0" y="644.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">плутанина між цими двома шляхами й була джерелом тихих псувань пам'яті — саме тому виклик перейменували</tspan></text>
</svg>