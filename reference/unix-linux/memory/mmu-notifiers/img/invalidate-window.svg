<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому скасування має бути проміжком, а не миттю</text>
<text x="38.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">час</text>
<line x1="38.0" y1="150.0" x2="38.0" y2="500.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="672.0" y1="40.0" x2="672.0" y2="610.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>
<rect x="70.0" y="40.0" width="560.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="70.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">одне повідомлення в мить зміни</tspan></text>
<rect x="70.0" y="104.0" width="270.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="205.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="205.0" dy="0.0">ядро</tspan></text>
<rect x="360.0" y="104.0" width="270.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="495.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="495.0" dy="0.0">драйвер</tspan></text>
<rect x="70.0" y="158.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="205.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">ущільнення вирішує</tspan><tspan x="205.0" dy="15.6">перенести сторінку</tspan></text>
<rect x="360.0" y="158.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="495.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">збій пристрою: читає</tspan><tspan x="495.0" dy="15.6">таблиці, бачить кадр K</tspan></text>
<rect x="70.0" y="248.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="205.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">править запис таблиці,</tspan><tspan x="205.0" dy="15.6">скидає TLB</tspan></text>
<rect x="70.0" y="338.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="205.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">кличе зворотний виклик</tspan><tspan x="205.0" dy="15.6">«кадру K тут немає»</tspan></text>
<rect x="360.0" y="338.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="495.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">витирає кадр K,</tspan><tspan x="495.0" dy="15.6">якого ще не записав</tspan></text>
<rect x="70.0" y="428.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="205.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">кадр K уже виданий</tspan><tspan x="205.0" dy="15.6">комусь іншому</tspan></text>
<rect x="360.0" y="428.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="495.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">дописує кадр K</tspan><tspan x="495.0" dy="15.6">зі свого прочитаного</tspan></text>
<rect x="70.0" y="520.0" width="560.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">пристрій пише за старим номером кадру —</tspan><tspan x="350.0" dy="17.6">у пам'ять, яка вже належить іншому</tspan></text>
<rect x="714.0" y="40.0" width="560.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="994.0" y="70.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="994.0" dy="0.0">пара start / end огороджує весь час зміни</tspan></text>
<rect x="714.0" y="104.0" width="270.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="849.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="849.0" dy="0.0">ядро</tspan></text>
<rect x="1004.0" y="104.0" width="270.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="1139.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1139.0" dy="0.0">драйвер</tspan></text>
<rect x="714.0" y="158.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="849.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="849.0" dy="0.0">invalidate_range_start:</tspan><tspan x="849.0" dy="15.6">сторінки ще на місці</tspan></text>
<rect x="1004.0" y="158.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="1139.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1139.0" dy="0.0">знімає свої записи</tspan><tspan x="1139.0" dy="15.6">й закриває вхід</tspan></text>
<rect x="714.0" y="248.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="849.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="849.0" dy="0.0">править записи, скидає</tspan><tspan x="849.0" dy="15.6">TLB, звільняє кадри</tspan></text>
<rect x="1004.0" y="248.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="1139.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1139.0" dy="0.0">збій пристрою тут</tspan><tspan x="1139.0" dy="15.6">відступає й чекає</tspan></text>
<rect x="714.0" y="338.0" width="270.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="849.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="849.0" dy="0.0">invalidate_range_end</tspan></text>
<rect x="1004.0" y="338.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="1139.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1139.0" dy="0.0">вхід у діапазон</tspan><tspan x="1139.0" dy="15.6">знову відкрито</tspan></text>
<rect x="1004.0" y="428.0" width="270.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="1139.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1139.0" dy="0.0">перечитує таблиці</tspan><tspan x="1139.0" dy="15.6">й будує за новим</tspan></text>
<rect x="714.0" y="520.0" width="560.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="994.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="994.0" dy="0.0">усередині вікна жодне прочитане з таблиць значення</tspan><tspan x="994.0" dy="17.6">не має шансу осісти в табличці пристрою</tspan></text>
</svg>