<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як обробник збою драйвера узгоджується зі скасуваннями</text>
<rect x="70.0" y="40.0" width="540.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">обробник збою пристрою</tspan></text>
<rect x="730.0" y="40.0" width="540.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1000.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">зворотний виклик скасування</tspan></text>
<rect x="70.0" y="110.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="340.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">seq = mmu_interval_read_begin()</tspan><tspan x="340.0" dy="16.2">чекає, якщо зміна саме триває</tspan></text>
<rect x="730.0" y="110.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="1000.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ядро змінює відображення</tspan><tspan x="1000.0" dy="16.2">в зареєстрованому проміжку</tspan></text>
<rect x="70.0" y="194.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="340.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">читає таблиці процесу,</tspan><tspan x="340.0" dy="16.2">знаходить кадри</tspan></text>
<rect x="730.0" y="194.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="1000.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">бере ТОЙ САМИЙ</tspan><tspan x="1000.0" dy="16.2">замок драйвера</tspan></text>
<rect x="70.0" y="278.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="340.0" y="318.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">бере ЗАМОК ДРАЙВЕРА</tspan></text>
<rect x="730.0" y="278.0" width="540.0" height="72.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/><text x="1000.0" y="318.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">mmu_interval_set_seq(cur_seq)</tspan></text>
<rect x="70.0" y="362.0" width="540.0" height="72.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">mmu_interval_read_retry(seq)?</tspan><tspan x="340.0" dy="16.2">так → усе спочатку</tspan></text>
<rect x="730.0" y="362.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="1000.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">знімає свої записи</tspan><tspan x="1000.0" dy="16.2">для цього діапазону</tspan></text>
<rect x="70.0" y="446.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="340.0" y="478.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">ставить записи в табличку</tspan><tspan x="340.0" dy="16.2">пристрою, віддає замок</tspan></text>
<rect x="730.0" y="446.0" width="540.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="1000.0" y="486.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">віддає замок</tspan></text>
<line x1="340.0" y1="182.0" x2="340.0" y2="194.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="182.0" x2="1000.0" y2="194.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="340.0" y1="266.0" x2="340.0" y2="278.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="266.0" x2="1000.0" y2="278.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="340.0" y1="350.0" x2="340.0" y2="362.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="350.0" x2="1000.0" y2="362.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="340.0" y1="434.0" x2="340.0" y2="446.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="434.0" x2="1000.0" y2="446.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="70.0" y="542.0" width="1200.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="670.0" y="576.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">число змінюють під тим самим замком, під яким його звіряють</tspan></text>
<rect x="70.0" y="618.0" width="1200.0" height="60.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="670.0" y="652.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">тому між звіркою і встановленням записів скасування не встигає вклинитися, а сутичка коштує лише повтору</tspan></text>
</svg>