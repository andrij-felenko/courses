<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поріг mmap — єдине число, яке алокатор веде сам</text>
<line x1="110.0" y1="232.0" x2="1040.0" y2="232.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1056.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">розмір</text>
<line x1="110.0" y1="224.0" x2="110.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<text x="110.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
<line x1="300.0" y1="224.0" x2="300.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<text x="300.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">128 КіБ</text>
<line x1="860.0" y1="224.0" x2="860.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<text x="860.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">32 МіБ</text>
<text x="300.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">умовчання порогу</text>
<text x="860.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">стеля підняття</text>
<rect x="234.0" y="156.0" width="132.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">поріг</tspan></text>
<line x1="372.0" y1="176.0" x2="848.0" y2="176.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="610.0" dy="0.0">щоразу, коли звільнено блок, виданий через mmap,</tspan><tspan x="610.0" dy="16.9">поріг стає рівним розмірові цього блоку</tspan></text>
<rect x="110.0" y="314.0" width="340.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">менше за поріг</tspan><tspan x="280.0" dy="17.6">з купи, brk рухає межу</tspan></text>
<rect x="510.0" y="314.0" width="480.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">не менше за поріг</tspan><tspan x="750.0" dy="17.6">окремий mmap, а на free() — munmap</tspan></text>
<text x="590.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">Явно задати mmap_threshold, trim_threshold, top_pad або mmap_max —</tspan><tspan x="590.0" dy="17.6">хоч mallopt, хоч змінною середовища, хоч тюнаблом — і підняття вимикається назавжди:</tspan><tspan x="590.0" dy="17.6">поріг застигає там, де його поставили.</tspan></text>
</svg>