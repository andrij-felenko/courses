<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="160.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Купа — одна ділянка, одна межа</text>
<text x="760.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення — багато незалежних ділянок</text>
<line x1="560.0" y1="50.0" x2="560.0" y2="500.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<rect x="60.0" y="100.0" width="170.0" height="48.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">вільно</tspan></text>
<rect x="60.0" y="148.0" width="170.0" height="57.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">зайнято</tspan></text>
<rect x="60.0" y="205.0" width="170.0" height="53.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">вільно</tspan></text>
<rect x="60.0" y="258.0" width="170.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">зайнято</tspan></text>
<rect x="60.0" y="320.0" width="170.0" height="45.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">вільно</tspan></text>
<rect x="60.0" y="365.0" width="170.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">зайнято</tspan></text>
<line x1="42.0" y1="100.0" x2="244.0" y2="100.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="36.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">брейк</text>
<line x1="264.0" y1="100.0" x2="264.0" y2="66.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="264.0" y1="116.0" x2="264.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="288.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="288.0" dy="0.0">brk рухає тільки цю</tspan><tspan x="288.0" dy="16.2">межу — вгору легко,</tspan><tspan x="288.0" dy="16.2">вниз лише коли хвіст</tspan><tspan x="288.0" dy="16.2">вільний</tspan></text>
<line x1="298.0" y1="232.0" x2="246.0" y2="232.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="306.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start"><tspan x="306.0" dy="0.0">ця дірка ядру не</tspan><tspan x="306.0" dy="16.2">повертається: нижче</tspan><tspan x="306.0" dy="16.2">за брейк не опустиш</tspan></text>
<rect x="620.0" y="100.0" width="230.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">mmap 1 МіБ</tspan><tspan x="735.0" dy="16.9">жива ділянка</tspan></text>
<rect x="620.0" y="214.0" width="230.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">mmap 4 МіБ</tspan><tspan x="735.0" dy="16.9">munmap → віддано</tspan></text>
<rect x="620.0" y="328.0" width="230.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">mmap 512 КіБ</tspan><tspan x="735.0" dy="16.9">жива ділянка</tspan></text>
<text x="735.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вільні адреси</text>
<text x="735.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вільні адреси</text>
<line x1="926.0" y1="251.0" x2="864.0" y2="251.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="934.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="934.0" dy="0.0">кожна ділянка</tspan><tspan x="934.0" dy="16.2">звільняється сама,</tspan><tspan x="934.0" dy="16.2">не питаючи сусідів</tspan></text>
<text x="570.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа одна — тому купа віддається лише з хвоста; ділянок багато — тому кожна віддається окремо</text>
</svg>