<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари, що склалися незалежно один від одного</text>
<rect x="34.0" y="74.0" width="208.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="138.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">Межа даних</tspan><tspan x="138.0" dy="18.9">у ядрі</tspan></text>
<rect x="260.0" y="74.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="413.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">1971 · break</tspan><tspan x="413.0" dy="16.2">1-ша редакція Unix</tspan><tspan x="413.0" dy="16.2">межа для свопера:</tspan><tspan x="413.0" dy="16.2">вище неї нічого не зберігати</tspan></text>
<rect x="582.0" y="74.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">1973 · brk / sbrk</tspan><tspan x="735.0" dy="16.2">межа даних процесу;</tspan><tspan x="735.0" dy="16.2">помилка, якщо треба більше</tspan><tspan x="735.0" dy="16.2">ніж 8 сегментних регістрів</tspan></text>
<rect x="904.0" y="74.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1057.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">SUSv2 · LEGACY</tspan><tspan x="1057.0" dy="16.2">прибрано з POSIX.1-2001,</tspan><tspan x="1057.0" dy="16.2">але в Linux лишається</tspan><tspan x="1057.0" dy="16.2">назавжди</tspan></text>
<rect x="34.0" y="230.0" width="208.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="138.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">Відображення</tspan><tspan x="138.0" dy="18.9">у простір адрес</tspan></text>
<rect x="260.0" y="230.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="413.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">1983 · 4.2BSD</tspan><tspan x="413.0" dy="16.2">mmap описано в System Manual,</tspan><tspan x="413.0" dy="16.2">але «реалізовано лише</tspan><tspan x="413.0" dy="16.2">sbrk і getpagesize»</tspan></text>
<rect x="582.0" y="230.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">1988 · SunOS 4.0</tspan><tspan x="735.0" dy="16.2">перша широка реалізація;</tspan><tspan x="735.0" dy="16.2">віддати код Берклі</tspan><tspan x="735.0" dy="16.2">Sun відмовилася</tspan></text>
<rect x="904.0" y="230.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1057.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">1990 · 4.3BSD-Reno</tspan><tspan x="1057.0" dy="16.2">своя реалізація на віртуальній</tspan><tspan x="1057.0" dy="16.2">пам'яті Mach; звідти —</tspan><tspan x="1057.0" dy="16.2">у вільні Unix і Linux</tspan></text>
<rect x="34.0" y="386.0" width="208.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="138.0" y="446.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">Алокатор</tspan><tspan x="138.0" dy="18.9">у бібліотеці C</tspan></text>
<rect x="260.0" y="386.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="413.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">1987 · dlmalloc</tspan><tspan x="413.0" dy="16.2">Даґ Лі пише алокатор</tspan><tspan x="413.0" dy="16.2">для власних програм на C++</tspan><tspan x="413.0" dy="16.2">і для libg++</tspan></text>
<rect x="582.0" y="386.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">1990-ті · ptmalloc</tspan><tspan x="735.0" dy="16.2">Вольфрам Ґлоґер додає</tspan><tspan x="735.0" dy="16.2">арени й замки,</tspan><tspan x="735.0" dy="16.2">щоб потоки не шикувалися</tspan></text>
<rect x="904.0" y="386.0" width="306.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1057.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">2002 · ptmalloc2</tspan><tspan x="1057.0" dy="16.2">переписано з dlmalloc 2.7.0;</tspan><tspan x="1057.0" dy="16.2">того ж року входить</tspan><tspan x="1057.0" dy="16.2">у glibc 2.3</tspan></text>
<text x="620.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">brk народився як межа для свопера, mmap — як спосіб покласти файл у простір адрес, алокатор — як приватна оптимізація однієї людини</text>
</svg>