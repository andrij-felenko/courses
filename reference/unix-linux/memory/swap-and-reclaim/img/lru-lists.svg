<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карусель черг: старіння, друга нагода і слід від викинутої сторінки</text>
<rect x="400.0" y="74.0" width="360.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="580.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">АКТИВНІ</tspan><tspan x="580.0" dy="18.2">до них зверталися недавно</tspan></text>
<rect x="400.0" y="250.0" width="360.0" height="82.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.9"/><text x="580.0" y="286.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">НЕАКТИВНІ</tspan><tspan x="580.0" dy="18.2">випробувальна смуга</tspan></text>
<rect x="400.0" y="424.0" width="360.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="580.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ЗАБРАНО</tspan><tspan x="580.0" dy="18.2">фрейм вільний</tspan></text>
<line x1="490.0" y1="160.0" x2="490.0" y2="246.0" stroke="#6b7280" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="670.0" y1="246.0" x2="670.0" y2="160.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="580.0" y1="336.0" x2="580.0" y2="420.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="40.0" y="96.0" width="320.0" height="100.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="200.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">старіння: сканування зсуває</tspan><tspan x="200.0" dy="15.6">хвіст активних у неактивні</tspan><tspan x="200.0" dy="15.6">й гасить біт звернення</tspan></text>
<rect x="800.0" y="96.0" width="320.0" height="100.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.3"/><text x="960.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">друга нагода: звернулися,</tspan><tspan x="960.0" dy="15.6">поки лежала внизу, —</tspan><tspan x="960.0" dy="15.6">і вона повертається нагору</tspan></text>
<rect x="800.0" y="400.0" width="320.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="960.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">тінь: на місці викинутої</tspan><tspan x="960.0" dy="15.6">сторінки в кеші лишається</tspan><tspan x="960.0" dy="15.6">позначка з номером</tspan><tspan x="960.0" dy="15.6">покоління витіснення</tspan></text>
<line x1="770.0" y1="466.0" x2="796.0" y2="466.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="570.0" width="1080.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="611.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">повернулася скоро після витіснення — черга була замала: сторінку одразу в АКТИВНІ,</tspan><tspan x="580.0" dy="16.9">а межу між чергами зсувають на її користь; це й є те, що лічильники звуть refault</tspan></text>
<line x1="370.0" y1="614.0" x2="370.0" y2="116.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="6 6"/>
<line x1="370.0" y1="116.0" x2="396.0" y2="116.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">таких пар дві — окремо для файлових сторінок і окремо для анонімних</text>
</svg>