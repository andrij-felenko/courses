<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий запис у таблиці сторінок: до витіснення і після</text>
<text x="60.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">сторінка в пам'яті</text>
<rect x="60.0" y="100.0" width="520.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="320.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">номер фрейму (PFN)</tspan></text>
<rect x="596.0" y="100.0" width="100.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="646.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="646.0" dy="0.0">A</tspan></text>
<rect x="712.0" y="100.0" width="100.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="762.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">D</tspan></text>
<rect x="828.0" y="100.0" width="130.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="893.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="893.0" dy="0.0">права</tspan></text>
<rect x="974.0" y="100.0" width="86.0" height="56.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="2.0"/><text x="1017.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1017.0" dy="0.0">P=1</tspan></text>
<text x="646.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">біт звернення</text>
<text x="762.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">біт запису</text>
<line x1="300.0" y1="210.0" x2="300.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="224.0" width="420.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="540.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">витіснення: вміст переписано у слот свопу,</tspan><tspan x="540.0" dy="15.6">а в сам запис ядро кладе адресу цього слота</tspan></text>
<line x1="880.0" y1="330.0" x2="880.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="790.0" y="224.0" width="300.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="940.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">великий збій: слот прочитано</tspan><tspan x="940.0" dy="15.6">у новий фрейм, запис відновлено</tspan></text>
<text x="60.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">сторінки в пам'яті немає</text>
<rect x="60.0" y="372.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">тип області свопу</tspan></text>
<rect x="376.0" y="372.0" width="584.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="668.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="668.0" dy="0.0">номер слота в цій області</tspan></text>
<rect x="974.0" y="372.0" width="86.0" height="56.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2.0"/><text x="1017.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1017.0" dy="0.0">P=0</tspan></text>
<rect x="60.0" y="466.0" width="1000.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="560.0" y="505.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">апаратура дивиться лише на P; коли він нуль, решта бітів для неї — сміття</tspan><tspan x="560.0" dy="16.9">ядро зберігає там те, що потрібне саме йому: адресу слота, позначку міграції чи збійної пам'яті</tspan></text>
</svg>