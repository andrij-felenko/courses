<text x="580.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">як давно до сторінки востаннє зверталися</text>
<rect x="150.0" y="400.0" width="880.0" height="118.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">сторінка вижила б  ⟺  D ≤ L        D — відстань повернення, L — довжина черг</tspan><tspan x="590.0" dy="16.9">за час відсутности сталося D = v·τ витіснень        v — темп витіснень, τ — інтервал повторного звертання</tspan><tspan x="590.0" dy="16.9">звідси  L ≥ v·τ,  тобто черга рятує лише те, до чого повертаються частіше, ніж кожні L / v секунд</tspan></text>
<text x="580.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">L = 4 ГіБ і v = 50 000 сторінок/с дають вікно у 21 секунду: менша черга й більший темп ріжуть його добутком</text>
