<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка беззбитковости стиснення в пам'яті</text>
<rect x="60.0" y="74.0" width="480.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="300.0" y="119.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">справжній своп</tspan><tspan x="300.0" dy="16.9"></tspan><tspan x="300.0" dy="16.9">щоб вивільнити ΔM — викинути рівно ΔM</tspan><tspan x="300.0" dy="16.9">ціна повернення сторінки — t_dev</tspan><tspan x="300.0" dy="16.9">втрата ∝ θ · (ΔM / W) · t_dev</tspan></text>
<rect x="620.0" y="74.0" width="480.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="860.0" y="119.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">zram</tspan><tspan x="860.0" dy="16.9"></tspan><tspan x="860.0" dy="16.9">щоб вивільнити ΔM — стиснути ΔM · c/(c−1)</tspan><tspan x="860.0" dy="16.9">ціна повернення сторінки — t_dec</tspan><tspan x="860.0" dy="16.9">втрата ∝ θ · (ΔM / W) · c/(c−1) · t_dec</tspan></text>
<rect x="160.0" y="252.0" width="840.0" height="78.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/><text x="580.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">zram дешевший  ⟺  t_dec / t_dev  &lt;  (c − 1) / c</tspan></text>
<text x="580.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">скільки стиснути, щоб вивільнити один мегабайт: коефіцієнт c/(c−1)</text>
