<text x="580.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">при c → 1 множник c/(c−1) росте без міри: стиснення програє не тоді, коли повільне, а тоді, коли даних більше не стискає</text>
