<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1205 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1205" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="602.5" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що можна зробити зі сторінкою, коли треба звільнити фрейм</text>
<rect x="85.0" y="62.0" width="225.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="197.5" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="197.5" dy="0.0">Чиста файлова</tspan></text>
<rect x="85.0" y="124.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="197.5" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">вміст є у файлі</tspan><tspan x="197.5" dy="15.6">на диску, і копія</tspan><tspan x="197.5" dy="15.6">свіжа</tspan></text>
<rect x="85.0" y="224.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="197.5" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">відв'язати від</tspan><tspan x="197.5" dy="15.6">таблиць сторінок —</tspan><tspan x="197.5" dy="15.6">і фрейм вільний</tspan></text>
<rect x="85.0" y="336.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.4"/><text x="197.5" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="197.5" dy="0.0">нічого</tspan></text>
<rect x="85.0" y="396.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="197.5" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="197.5" dy="0.0">читання з файлу</tspan></text>
<rect x="370.0" y="62.0" width="225.0" height="44.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.8"/><text x="482.5" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="482.5" dy="0.0">Брудна файлова</tspan></text>
<rect x="370.0" y="124.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="482.5" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="482.5" dy="0.0">вміст є у файлі,</tspan><tspan x="482.5" dy="15.6">але копія на диску</tspan><tspan x="482.5" dy="15.6">відстала</tspan></text>
<rect x="370.0" y="224.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.5"/><text x="482.5" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="482.5" dy="0.0">спершу скинути</tspan><tspan x="482.5" dy="15.6">на диск, тоді</tspan><tspan x="482.5" dy="15.6">звільняти</tspan></text>
<rect x="370.0" y="336.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4"/><text x="482.5" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="482.5" dy="0.0">один запис</tspan></text>
<rect x="370.0" y="396.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="482.5" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="482.5" dy="0.0">читання з файлу</tspan></text>
<rect x="655.0" y="62.0" width="225.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="767.5" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="767.5" dy="0.0">Анонімна</tspan></text>
<rect x="655.0" y="124.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="767.5" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">вмісту немає</tspan><tspan x="767.5" dy="15.6">ніде, крім самої</tspan><tspan x="767.5" dy="15.6">пам'яті</tspan></text>
<rect x="655.0" y="224.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/><text x="767.5" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">записати у своп —</tspan><tspan x="767.5" dy="15.6">інакше забрати</tspan><tspan x="767.5" dy="15.6">не можна взагалі</tspan></text>
<rect x="655.0" y="336.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="767.5" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="767.5" dy="0.0">один запис</tspan></text>
<rect x="655.0" y="396.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="767.5" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="767.5" dy="0.0">читання зі свопу</tspan></text>
<rect x="940.0" y="62.0" width="225.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="1052.5" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1052.5" dy="0.0">Незабирана</tspan></text>
<rect x="940.0" y="124.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1052.5" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1052.5" dy="0.0">mlock, буфери DMA,</tspan><tspan x="1052.5" dy="15.6">таблиці сторінок,</tspan><tspan x="1052.5" dy="15.6">стеки ядра</tspan></text>
<rect x="940.0" y="224.0" width="225.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="1052.5" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1052.5" dy="0.0">нічого: фрейм</tspan><tspan x="1052.5" dy="15.6">лишається за</tspan><tspan x="1052.5" dy="15.6">власником</tspan></text>
<rect x="940.0" y="336.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="1052.5" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1052.5" dy="0.0">—</tspan></text>
<rect x="940.0" y="396.0" width="225.0" height="44.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1052.5" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1052.5" dy="0.0">—</tspan></text>
<text x="79.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">де копія</text>
<text x="79.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">ціна зараз</text>
<text x="79.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">ціна потім</text>
<rect x="85.0" y="470.0" width="1080.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="625.0" y="511.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">правило одне: сторінку можна забрати лише тоді, коли її вміст можна відтворити на вимогу</tspan><tspan x="625.0" dy="16.9">своп — це і є дім, який будують анонімній сторінці, щоб її взагалі стало можна забрати</tspan></text>
<text x="602.5" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">без свопу третя колонка стає четвертою: анонімна пам'ять перестає бути забиральною</text>
</svg>