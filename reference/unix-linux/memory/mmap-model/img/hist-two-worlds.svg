<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буферний кеш і пам'ять процесу: до злиття й після</text>
<rect x="30.0" y="26.0" width="490.0" height="466.0" rx="6" fill="#fcfcfd" stroke="#c0392b" stroke-width="2.0"/>
<text x="275.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Ранній Unix: дві незалежні системи обліку</text>
<rect x="560.0" y="26.0" width="490.0" height="466.0" rx="6" fill="#fcfcfd" stroke="#27ae60" stroke-width="2.0"/>
<text x="805.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">SunOS 4.0: одна система, два способи назвати сторінку</text>
<rect x="60.0" y="76.0" width="430.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="275.0" y="103.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">пам'ять процесу</tspan><tspan x="275.0" dy="16.9">адреси, які перекладає таблиця сторінок</tspan></text>
<line x1="230.0" y1="138.0" x2="230.0" y2="208.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="208.0" x2="320.0" y2="138.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">копія</text>
<rect x="60.0" y="208.0" width="430.0" height="62.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.6"/><text x="275.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">буферний кеш ядра</tspan><tspan x="275.0" dy="16.9">блоки з ключем «пристрій + номер блока»</tspan></text>
<rect x="60.0" y="300.0" width="430.0" height="168.0" rx="6" fill="#ffffff" stroke="#c8ccd2" stroke-width="1.4"/><text x="275.0" y="346.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">У кеші немає поняття «сторінка процесу»,</tspan><tspan x="275.0" dy="16.9">у пам'яті процесу немає поняття «файл».</tspan><tspan x="275.0" dy="16.9">Спільної речі, на яку вказали б обидві</tspan><tspan x="275.0" dy="16.9">системи, просто не існує — тож єдиний</tspan><tspan x="275.0" dy="16.9">спосіб дістати байт файлу в програму</tspan><tspan x="275.0" dy="16.9">лишається один: скопіювати його.</tspan></text>
<rect x="590.0" y="76.0" width="430.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="805.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">ділянка адресного простору (seg_vn)</tspan><tspan x="805.0" dy="16.9">правило: звідки брати сторінки</tspan></text>
<line x1="805.0" y1="134.0" x2="805.0" y2="182.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="182.0" width="430.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="805.0" y="207.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">сторінки, що належать vnode</tspan><tspan x="805.0" dy="16.9">вони ж — увесь кеш цього файлу</tspan></text>
<line x1="805.0" y1="240.0" x2="805.0" y2="288.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="288.0" width="430.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#8a8f98" stroke-width="1.6"/><text x="805.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">vnode: файл будь-якої файлової системи</tspan></text>
<rect x="590.0" y="364.0" width="430.0" height="104.0" rx="6" fill="#ffffff" stroke="#c8ccd2" stroke-width="1.4"/><text x="805.0" y="403.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Кеш файлу — це і є сторінки віртуальної</tspan><tspan x="805.0" dy="16.9">пам'яті. Ділянка процесу лише вказує</tspan><tspan x="805.0" dy="16.9">на них, тож копіювати нема чого.</tspan></text>
<text x="540.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">mmap не додали до системи — систему перебудували так, що виклик став очевидним наслідком</text>
</svg>