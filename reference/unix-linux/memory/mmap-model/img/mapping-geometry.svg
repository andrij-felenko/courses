<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення довжиною 16384 байти на файл із 9000 байтів</text>
<rect x="48.0" y="106.0" width="544.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="320.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">у файлі є 9000 байтів</text>
<rect x="592.0" y="106.0" width="440.0" height="42.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="812.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">далі у файлі немає нічого</text>
<rect x="48.0" y="176.0" width="240.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="168.0" y="220.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="168.0" dy="0.0">сторінка 0</tspan><tspan x="168.0" dy="16.9">0…4095</tspan></text>
<rect x="296.0" y="176.0" width="240.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="416.0" y="220.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="416.0" dy="0.0">сторінка 1</tspan><tspan x="416.0" dy="16.9">4096…8191</tspan></text>
<rect x="544.0" y="176.0" width="48.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="592.0" y="176.0" width="192.0" height="96.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.8"/>
<text x="688.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">сторінка 2</tspan><tspan x="688.0" dy="16.9">8192…12287</tspan></text>
<rect x="792.0" y="176.0" width="240.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="912.0" y="220.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="912.0" dy="0.0">сторінка 3</tspan><tspan x="912.0" dy="16.9">12288…16383</tspan></text>
<rect x="48.0" y="290.0" width="488.0" height="86.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="292.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="292.0" dy="0.0">вміст цілком береться з файлу</tspan></text>
<rect x="544.0" y="290.0" width="240.0" height="86.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.4"/><text x="664.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="664.0" dy="0.0">хвіст за кінцем файлу ядро</tspan><tspan x="664.0" dy="14.3">занулює; те, що туди запишуть,</tspan><tspan x="664.0" dy="14.3">у файл не потрапить</tspan></text>
<rect x="792.0" y="290.0" width="240.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="912.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="912.0" dy="0.0">цілком за кінцем файлу:</tspan><tspan x="912.0" dy="14.3">звертання дає сигнал SIGBUS,</tspan><tspan x="912.0" dy="14.3">а не нулі й не помилку</tspan></text>
<text x="540.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">відображення міряють сторінками, а файл — байтами; уся різниця між цими двома мірками лишається на совісті програми</text>
</svg>