<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хроніка появи mmap: 1983–1993</text>
<text x="540.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик, описаний 1983 року, і його перша працююча реалізація</text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зелене — там, де реалізація справді запрацювала; червоне — там, де був лише опис</text>
<line x1="250.0" y1="86.0" x2="250.0" y2="696.0" stroke="#c8ccd2" stroke-width="2.5"/>
<text x="224.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">серпень 1983</text>
<circle cx="250.0" cy="119.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<rect x="286.0" y="92.0" width="764.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="302.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4.2BSD</text>
<text x="302.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">інтерфейс mmap описано в документі архітектури; система вийшла без нього — сили пішли на мережу</text>
<text x="224.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">червень 1986</text>
<circle cx="250.0" cy="187.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
<rect x="286.0" y="160.0" width="764.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="302.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">S. Kleiman, «Vnodes» (USENIX Summer)</text>
<text x="302.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">файл будь-якої файлової системи дістає в ядрі єдиний опис — vnode (уперше в SunOS 2.0, 1985)</text>
<text x="224.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">червень 1986</text>
<circle cx="250.0" cy="255.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<rect x="286.0" y="228.0" width="764.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="302.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4.3BSD</text>
<text x="302.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">архітектуру переглянуто за участі понад 40 компаній і груп; реалізації знову немає</text>
<text x="224.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">червень 1987</text>
<circle cx="250.0" cy="323.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
<rect x="286.0" y="296.0" width="764.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="302.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">R. Gingell, J. Moran, W. Shannon (USENIX Summer)</text>
<text x="302.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«Virtual Memory Architecture in SunOS» — опис єдиної системи пам'яті, де сторінки належать vnode</text>
<text x="224.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">грудень 1988</text>
<circle cx="250.0" cy="391.0" r="7.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<rect x="286.0" y="364.0" width="764.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="302.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">SunOS 4.0</text>
<text x="302.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перша широко доступна працююча реалізація: сегментні драйвери (seg_vn) і кеш файлу як сторінки VM</text>
<text x="224.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">початок 1990</text>
<circle cx="250.0" cy="459.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
<rect x="286.0" y="432.0" width="764.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="302.0" y="453.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4.3BSD-Reno</text>
<text x="302.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Берклі бере систему пам'яті з Mach; за переказом, не задокументованим, — не діставши реалізації Sun</text>
<text x="224.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">грудень 1992</text>
<circle cx="250.0" cy="527.0" r="7.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<rect x="286.0" y="500.0" width="764.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="302.0" y="521.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Linux 0.99</text>
<text x="302.0" y="541.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">у дереві ядра з'являється mm/mmap.c — Linux будує пам'ять навколо кешу сторінок від початку</text>
<text x="224.0" y="599.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">1993</text>
<circle cx="250.0" cy="595.0" r="7.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.5"/>
<rect x="286.0" y="568.0" width="764.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="302.0" y="589.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">POSIX.1b (IEEE 1003.1b-1993)</text>
<text x="302.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">mmap входить у стандарт як опція «відображувані файли» — не обов'язкова частина POSIX</text>
<text x="224.0" y="667.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">червень 1993</text>
<circle cx="250.0" cy="663.0" r="7.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<rect x="286.0" y="636.0" width="764.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="302.0" y="657.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4.4BSD</text>
<text x="302.0" y="677.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">у BSD виклик нарешті повноцінний — через десять років після опису (вільний 4.4BSD-Lite — 1994)</text>
<text x="540.0" y="708.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дати релізів і публікацій перевірені за документацією систем; порядок подій — не порядок заслуг</text>
</svg>