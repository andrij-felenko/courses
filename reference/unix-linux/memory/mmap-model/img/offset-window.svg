<text x="462.9" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">delta = 9000 − 8192 = 808</text>
<rect x="60.0" y="348.0" width="960.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="540.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">mmap повертає адресу початку сторінки 2 — адреса потрібного байта це base + delta</tspan><tspan x="540.0" dy="15.6">а в munmap треба передати саме base з повною довжиною, а не виправлений вказівник</tspan></text>
<text x="540.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зсув округлюють униз до межі сторінки, а різницю додають до довжини й потім до вказівника</text>
