<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири осі, які задає один виклик mmap</text>
<rect x="36.0" y="64.0" width="214.0" height="98.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="143.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="143.0" dy="0.0">джерело вмісту</tspan><tspan x="143.0" dy="16.9">(оберіть одне)</tspan></text>
<rect x="272.0" y="64.0" width="448.0" height="98.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="496.0" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">файл: fd і offset</tspan><tspan x="496.0" dy="14.3">сторінки беруть із кешу цього файлу</tspan></text>
<rect x="736.0" y="64.0" width="448.0" height="98.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="960.0" y="109.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">MAP_ANONYMOUS</tspan><tspan x="960.0" dy="14.3">сторінки видають чистими, з нулів</tspan></text>
<rect x="36.0" y="184.0" width="214.0" height="98.0" rx="6" fill="#f3edfb" stroke="#7a4fb0" stroke-width="1.8"/><text x="143.0" y="220.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="143.0" dy="0.0">видимість запису</tspan><tspan x="143.0" dy="16.9">(рівно одне: це поле,</tspan><tspan x="143.0" dy="16.9">а не окремі біти)</tspan></text>
<rect x="272.0" y="184.0" width="293.3" height="98.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.5"/><text x="418.7" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="418.7" dy="0.0">MAP_SHARED</tspan><tspan x="418.7" dy="14.3">запис змінює сам файл</tspan></text>
<rect x="581.3" y="184.0" width="293.3" height="98.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.5"/><text x="728.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="728.0" dy="0.0">MAP_SHARED_VALIDATE</tspan><tspan x="728.0" dy="14.3">те саме + перевірка прапорців</tspan></text>
<rect x="890.7" y="184.0" width="293.3" height="98.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.5"/><text x="1037.3" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1037.3" dy="0.0">MAP_PRIVATE</tspan><tspan x="1037.3" dy="14.3">запис породжує власну копію</tspan></text>
<rect x="36.0" y="304.0" width="214.0" height="98.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.8"/><text x="143.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="143.0" dy="0.0">розміщення</tspan><tspan x="143.0" dy="16.9">(оберіть одне)</tspan></text>
<rect x="272.0" y="304.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.5"/><text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">addr як підказка</tspan><tspan x="380.0" dy="13.0">ядро вільне взяти сусідню адресу</tspan></text>
<rect x="504.0" y="304.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.5"/><text x="612.0" y="349.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">MAP_FIXED</tspan><tspan x="612.0" dy="14.3">мовчки затирає те, що там було</tspan></text>
<rect x="736.0" y="304.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.5"/><text x="844.0" y="349.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="844.0" dy="0.0">MAP_FIXED_NOREPLACE</tspan><tspan x="844.0" dy="14.3">зіткнення дає EEXIST</tspan></text>
<rect x="968.0" y="304.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.5"/><text x="1076.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1076.0" dy="0.0">MAP_32BIT</tspan><tspan x="1076.0" dy="13.0">перші два гігабайти, лише x86-64</tspan></text>
<rect x="36.0" y="424.0" width="214.0" height="98.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="143.0" y="469.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="143.0" dy="0.0">заповнення й резидентність</tspan><tspan x="143.0" dy="15.6">(комбінуються вільно)</tspan></text>
<rect x="272.0" y="424.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">MAP_POPULATE</tspan><tspan x="380.0" dy="14.3">таблиці заповнити одразу</tspan></text>
<rect x="504.0" y="424.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="612.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">MAP_LOCKED</tspan><tspan x="612.0" dy="14.3">тримати в пам'яті, без свопу</tspan></text>
<rect x="736.0" y="424.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="844.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="844.0" dy="0.0">MAP_NORESERVE</tspan><tspan x="844.0" dy="14.3">місця під своп не резервувати</tspan></text>
<rect x="968.0" y="424.0" width="216.0" height="98.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="1076.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1076.0" dy="0.0">MAP_HUGETLB</tspan><tspan x="1076.0" dy="14.3">сторінки на 2 МіБ або 1 ГіБ</tspan></text>
<rect x="36.0" y="550.0" width="1148.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="610.0" y="578.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">права PROT_READ | PROT_WRITE | PROT_EXEC — це окремий аргумент prot, а не прапорець</tspan><tspan x="610.0" dy="15.6">PROT_NONE дорівнює нулю, тож додавати його через «або» сенсу немає: це відсутність прав</tspan></text>
<text x="610.0" y="624.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">перші три осі — це вибір одного варіанта, четверта — набір незалежних побажань до ядра</text>
</svg>