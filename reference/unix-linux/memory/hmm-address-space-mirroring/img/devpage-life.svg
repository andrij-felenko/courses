<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1590 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1590" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="790.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр пам'яті пристрою живе за тими самими лічильниками, що й звичайний</text>
<rect x="40.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/><text x="170.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">у вільному пулі</tspan></text>
<rect x="40.0" y="122.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="170.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">описувач існує від самої реєстрації</tspan><tspan x="170.0" dy="15.6">діапазону, але не належить нікому;</tspan><tspan x="170.0" dy="15.6">наступний вільний кадр драйвер</tspan><tspan x="170.0" dy="15.6">знаходить через zone_device_data</tspan></text>
<rect x="40.0" y="292.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="170.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">лічильник: 0</tspan></text>
<line x1="306.0" y1="197.0" x2="344.0" y2="197.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="480.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">zone_device_page_init()</tspan></text>
<rect x="350.0" y="122.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.3"/><text x="480.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">драйвер бере кадр під переселення:</tspan><tspan x="480.0" dy="15.6">лічильник стає одиницею,</tspan><tspan x="480.0" dy="15.6">сторінка замикається,</tspan><tspan x="480.0" dy="15.6">а pagemap дістає посилання</tspan></text>
<rect x="350.0" y="292.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="480.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">лічильник: 1 · сторінка замкнена</tspan></text>
<line x1="616.0" y1="197.0" x2="654.0" y2="197.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.7"/><text x="790.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">у таблиці процесу</tspan></text>
<rect x="660.0" y="122.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.3"/><text x="790.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">такт другий вписав відсутній запис,</tspan><tspan x="790.0" dy="15.6">що вказує на цей описувач;</tspan><tspan x="790.0" dy="15.6">такт третій розімкнув сторінку</tspan><tspan x="790.0" dy="15.6">й лишив її жити в таблиці</tspan></text>
<rect x="660.0" y="292.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="790.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">лічильник: 1 · тримає запис таблиці</tspan></text>
<line x1="926.0" y1="197.0" x2="964.0" y2="197.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="970.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="1100.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1100.0" dy="0.0">migrate_to_ram()</tspan></text>
<rect x="970.0" y="122.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="1100.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">процесор торкнувся адреси:</tspan><tspan x="1100.0" dy="15.6">драйвер копіює вміст</tspan><tspan x="1100.0" dy="15.6">у системний кадр, а ядро знімає</tspan><tspan x="1100.0" dy="15.6">відсутній запис із таблиці</tspan></text>
<rect x="970.0" y="292.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="1100.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1100.0" dy="0.0">лічильник: 1 → 0</tspan></text>
<line x1="1236.0" y1="197.0" x2="1274.0" y2="197.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1280.0" y="58.0" width="260.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="1410.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1410.0" dy="0.0">page_free()</tspan></text>
<rect x="1280.0" y="122.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="1410.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1410.0" dy="0.0">посилань не лишилося —</tspan><tspan x="1410.0" dy="15.6">ядро само кличе зворотний виклик</tspan><tspan x="1410.0" dy="15.6">драйвера; це і є free()</tspan><tspan x="1410.0" dy="15.6">розподільника пам'яті плати</tspan></text>
<rect x="1280.0" y="292.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="1410.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1410.0" dy="0.0">кадр знову в пулі, лічильник: 0</tspan></text>
<line x1="1410.0" y1="372.0" x2="1410.0" y2="412.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="1410.0" y1="412.0" x2="170.0" y2="412.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="170.0" y1="412.0" x2="170.0" y2="374.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="444.0" width="1500.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.7"/><text x="790.0" y="478.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">лічильник кадру ZONE_DEVICE не рахує, скільки пам'яті виділено — він означає рівно одне:</tspan><tspan x="790.0" dy="16.9">чи належить цей кадр комусь просто зараз</tspan></text>
<rect x="40.0" y="544.0" width="1500.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="790.0" y="579.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">звідси обидві типові біди: __free_page() для кадру плати не існує взагалі,</tspan><tspan x="790.0" dy="16.9">а зайвий put_page() віддає в пул кадр, який ще стоїть у таблиці процесу —</tspan><tspan x="790.0" dy="16.9">наступне переселення видасть його вдруге, і два адресні простори поділять одні байти</tspan></text>
</svg>