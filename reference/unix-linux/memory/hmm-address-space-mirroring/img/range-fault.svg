<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик не шукає готове відображення, а будує його — як зробив би збій процесора</text>
<rect x="40.0" y="60.0" width="330.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">що подає драйвер</tspan></text>
<rect x="40.0" y="122.0" width="330.0" height="78.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="205.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">діапазон віртуальних адрес</tspan><tspan x="205.0" dy="16.2">простору процесу</tspan></text>
<rect x="40.0" y="216.0" width="330.0" height="96.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="205.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">політика на весь діапазон:</tspan><tspan x="205.0" dy="16.2">чи будувати сторінку,</tspan><tspan x="205.0" dy="16.2">чи потрібен запис</tspan></text>
<rect x="40.0" y="328.0" width="330.0" height="78.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="205.0" y="363.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">маска, якою окремій сторінці</tspan><tspan x="205.0" dy="16.2">дозволено мати свою вимогу</tspan></text>
<line x1="382.0" y1="300.0" x2="442.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="456.0" y="60.0" width="430.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="671.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="671.0" dy="0.0">ядро йде шляхом звичайного збою</tspan></text>
<rect x="456.0" y="122.0" width="430.0" height="78.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="671.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="671.0" dy="0.0">анонімна сторінка, якої ще немає —</tspan><tspan x="671.0" dy="16.2">виділити кадр і занулити</tspan></text>
<rect x="456.0" y="216.0" width="430.0" height="78.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="671.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="671.0" dy="0.0">сторінка файлу — прочитати</tspan><tspan x="671.0" dy="16.2">з носія й покласти в кеш</tspan></text>
<rect x="456.0" y="310.0" width="430.0" height="78.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="671.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="671.0" dy="0.0">потрібен запис у спільну сторінку —</tspan><tspan x="671.0" dy="16.2">розщепити копіюванням при записі</tspan></text>
<rect x="456.0" y="404.0" width="430.0" height="78.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="671.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="671.0" dy="0.0">адреси немає в жодній ділянці —</tspan><tspan x="671.0" dy="16.2">помилка, а не сигнал програмі</tspan></text>
<line x1="898.0" y1="300.0" x2="958.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="972.0" y="60.0" width="408.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1176.0" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1176.0" dy="0.0">масив відповідей, по одній на сторінку</tspan></text>
<rect x="972.0" y="122.0" width="408.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="1176.0" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1176.0" dy="0.0">кадр 0x1a2b · чинний · можна писати</tspan></text>
<rect x="972.0" y="216.0" width="408.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="1176.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1176.0" dy="0.0">кадр 0x1a2c · чинний · лише читання</tspan></text>
<rect x="972.0" y="310.0" width="408.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="1176.0" y="353.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1176.0" dy="0.0">кадр 0x4f10 · чинний · пам'ять пристрою</tspan></text>
<rect x="972.0" y="404.0" width="408.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="1176.0" y="447.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1176.0" dy="0.0">помилка: за цією адресою нічого немає</tspan></text>
<rect x="40.0" y="512.0" width="1340.0" height="84.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/><text x="710.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">жодного посилання на кадр узято не було: відповідь — не власність,</tspan><tspan x="710.0" dy="17.6">а лише твердження про стан таблиць у мить читання</tspan></text>
<rect x="40.0" y="612.0" width="1340.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="710.0" y="642.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="710.0" dy="0.0">тому чинність цієї відповіді тримає не лічильник посилань,</tspan><tspan x="710.0" dy="16.9">а послідовне число сповіщувача — і будь-яке скасування її знецінює</tspan></text>
</svg>