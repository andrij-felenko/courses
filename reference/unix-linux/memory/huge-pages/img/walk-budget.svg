<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">з чого складається час одного випадкового звернення</text>
<line x1="300.0" y1="72.0" x2="300.0" y2="84.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="300.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">0 нс</text>
<line x1="492.9" y1="72.0" x2="492.9" y2="84.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="492.9" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">50 нс</text>
<line x1="685.7" y1="72.0" x2="685.7" y2="84.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="685.7" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">100 нс</text>
<line x1="878.6" y1="72.0" x2="878.6" y2="84.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="878.6" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">150 нс</text>
<line x1="1071.4" y1="72.0" x2="1071.4" y2="84.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="1071.4" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">200 нс</text>
<text x="278.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">дрібні 4 КіБ</text>
<rect x="300.0" y="104.0" width="356.4" height="54.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="656.4" y="104.0" width="399.6" height="54.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="1072.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">196.0 нс</text>
<text x="300.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">таблиця останнього рівня — 32 МіБ; у кеш вона не вміщається, тож останнє читання обходу йде в DRAM</text>
<text x="278.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2 МіБ — THP або HugeTLB</text>
<rect x="300.0" y="222.0" width="356.4" height="54.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="656.4" y="222.0" width="76.8" height="54.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="749.2" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">112.3 нс</text>
<text x="300.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кінцевих записів лише 8192, це 64 КіБ; вони живуть у кеші другого рівня</text>
<text x="278.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1 ГіБ — HugeTLB</text>
<rect x="300.0" y="340.0" width="356.4" height="54.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="656.4" y="340.0" width="1.9" height="54.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="674.3" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">92.9 нс</text>
<text x="300.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">шістнадцять перекладів на весь буфер просто лежать у TLB — обходу немає</text>
<rect x="300.0" y="452.0" width="26.0" height="20.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="336.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">звернення до самих даних</text>
<rect x="600.0" y="452.0" width="26.0" height="20.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="636.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">переклад адреси</text>
<text x="630.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">синя частина однакова в усіх трьох рядках — це та сама пам'ять і те саме залізо; різниця вся в червоній</text>
</svg>