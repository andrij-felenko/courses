<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">два способи дістати суцільний блок на 2 МіБ</text>
<rect x="320.0" y="56.0" width="470.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">HugeTLB — пул, відрізаний наперед</tspan></text>
<rect x="812.0" y="56.0" width="470.0" height="62.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1047.0" dy="0.0">THP — прозорі сторінки на льоту</tspan></text>
<rect x="30.0" y="142.0" width="268.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="164.0" y="177.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">звідки береться</tspan><tspan x="164.0" dy="16.9">пам'ять</tspan></text>
<rect x="320.0" y="142.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="177.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">кадри вилучені з обігу</tspan><tspan x="555.0" dy="16.9">й недоступні нікому іншому</tspan></text>
<rect x="812.0" y="142.0" width="470.0" height="78.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="177.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">звичайна пам'ять,</tspan><tspan x="1047.0" dy="16.9">блок збирається в роботі</tspan></text>
<rect x="30.0" y="234.0" width="268.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="164.0" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">хто платить</tspan><tspan x="164.0" dy="16.9">за суцільність</tspan></text>
<rect x="320.0" y="234.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">адміністратор, до запуску,</tspan><tspan x="555.0" dy="16.9">один раз</tspan></text>
<rect x="812.0" y="234.0" width="470.0" height="78.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">процес, посеред збою,</tspan><tspan x="1047.0" dy="16.9">щоразу заново</tspan></text>
<rect x="30.0" y="326.0" width="268.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="164.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">що буде,</tspan><tspan x="164.0" dy="16.9">якщо не вдалося</tspan></text>
<rect x="320.0" y="326.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">SIGBUS у процесі</tspan><tspan x="555.0" dy="16.9">або відмова стартувати</tspan></text>
<rect x="812.0" y="326.0" width="470.0" height="78.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">мовчки беруться</tspan><tspan x="1047.0" dy="16.9">дрібні сторінки</tspan></text>
<rect x="30.0" y="418.0" width="268.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="164.0" y="453.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">чи можна</tspan><tspan x="164.0" dy="16.9">забрати назад</tspan></text>
<rect x="320.0" y="418.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="453.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">ні: не витісняється,</tspan><tspan x="555.0" dy="16.9">не розбивається</tspan></text>
<rect x="812.0" y="418.0" width="470.0" height="78.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="453.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">так: розбивається</tspan><tspan x="1047.0" dy="16.9">й витісняється</tspan></text>
<rect x="30.0" y="510.0" width="268.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="164.0" y="553.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="164.0" dy="0.0">хто вирішує</tspan></text>
<rect x="320.0" y="510.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">програма просить явно</tspan><tspan x="555.0" dy="16.9">(hugetlbfs, MAP_HUGETLB)</tspan></text>
<rect x="812.0" y="510.0" width="470.0" height="78.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">ядро вирішує саме,</tspan><tspan x="1047.0" dy="16.9">програма може порадити</tspan></text>
<text x="660.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">кінцевий запис у таблиці в обох випадках однаковий — різниця тільки в ціні та в тому, хто її платить</text>
</svg>