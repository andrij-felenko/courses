<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1170" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="585.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи заплатити за 1 ГіБ анонімної пам'яті</text>
<text x="446.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">у момент запиту</text>
<text x="756.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">потім, під час роботи</text>
<text x="1031.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">найгірший один дотик</text>
<text x="276.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="276.0" dy="0.0">звичайний mmap</tspan><tspan x="276.0" dy="16.9">(лінива обіцянка)</tspan></text>
<rect x="296.0" y="106.0" width="300.0" height="68.0" rx="6" fill="#f1f2f4" stroke="#6b7280" stroke-width="1.7"/><text x="446.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="446.0" dy="0.0">0.011 мс</tspan><tspan x="446.0" dy="16.9">нічого не зроблено</tspan></text>
<rect x="616.0" y="106.0" width="280.0" height="68.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.7"/><text x="756.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="756.0" dy="0.0">196 мс, розсипані</tspan><tspan x="756.0" dy="16.9">по 262144 збоях</tspan></text>
<rect x="916.0" y="106.0" width="230.0" height="68.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.7"/><text x="1031.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1031.0" dy="0.0">1832 мкс</tspan></text>
<text x="276.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="276.0" dy="0.0">mmap + MAP_POPULATE</tspan><tspan x="276.0" dy="16.9">або MADV_POPULATE_WRITE</tspan></text>
<rect x="296.0" y="186.0" width="300.0" height="68.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.7"/><text x="446.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="446.0" dy="0.0">191 мс одним шматком</tspan><tspan x="446.0" dy="16.9">у самому виклику</tspan></text>
<rect x="616.0" y="186.0" width="280.0" height="68.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.7"/><text x="756.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="756.0" dy="0.0">0 збоїв —</tspan><tspan x="756.0" dy="16.9">аж поки не витіснить</tspan></text>
<rect x="916.0" y="186.0" width="230.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="1031.0" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1031.0" dy="0.0">0.9 мкс</tspan></text>
<text x="276.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="276.0" dy="0.0">mlockall(MCL_CURRENT|MCL_FUTURE)</tspan><tspan x="276.0" dy="16.9">+ прохід записом на старті</tspan></text>
<rect x="296.0" y="266.0" width="300.0" height="68.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.7"/><text x="446.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="446.0" dy="0.0">193 мс одним шматком</tspan><tspan x="446.0" dy="16.9">на старті програми</tspan></text>
<rect x="616.0" y="266.0" width="280.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="756.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="756.0" dy="0.0">0 збоїв гарантовано:</tspan><tspan x="756.0" dy="16.9">сторінки прибиті</tspan></text>
<rect x="916.0" y="266.0" width="230.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="1031.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1031.0" dy="0.0">11 мкс — і це вже</tspan><tspan x="1031.0" dy="16.9">не збій, а планувальник</tspan></text>
<text x="585.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Сумарний час майже той самий у всіх трьох рядках — різниться лише те, коли його платять і чи можна на це покластися.</text>
<text x="585.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Найгірший один дотик» — максимум із 16384 замірів по одній сторінці.</text>
</svg>