<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="44.0" y="78.0" width="300.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="194.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="194.0" dy="0.0">у мить створення</tspan><tspan x="194.0" dy="19.5">відображення — mmap(2)</tspan></text>
<rect x="372.0" y="78.0" width="704.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="724.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">MAP_POPULATE — заповнити таблиці одразу</tspan><tspan x="724.0" dy="19.5">MAP_LOCKED — прибити, але без гарантії</tspan><tspan x="724.0" dy="19.5">MAP_NORESERVE — не резервувати своп</tspan><tspan x="724.0" dy="19.5">MAP_HUGETLB — сторінки по 2 МіБ</tspan></text>
<rect x="44.0" y="204.0" width="300.0" height="108.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="194.0" y="253.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="194.0" dy="0.0">будь-коли потім,</tspan><tspan x="194.0" dy="19.5">на готовій ділянці — madvise(2)</tspan></text>
<rect x="372.0" y="204.0" width="704.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="724.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">MADV_WILLNEED — тягнути в кеш сторінок наперед</tspan><tspan x="724.0" dy="19.5">MADV_POPULATE_READ / _WRITE — заповнити таблиці зараз</tspan><tspan x="724.0" dy="19.5">MADV_SEQUENTIAL / _RANDOM — режим випереджання</tspan><tspan x="724.0" dy="19.5">MADV_DONTNEED — навпаки, скинути (збої повернуться)</tspan></text>
<rect x="44.0" y="330.0" width="300.0" height="108.0" rx="6" fill="#f2f6fd" stroke="#6b7280" stroke-width="1.8"/><text x="194.0" y="379.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="194.0" dy="0.0">назавжди, поки процес</tspan><tspan x="194.0" dy="19.5">живий — mlock(2)</tspan></text>
<rect x="372.0" y="330.0" width="704.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="724.0" y="369.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">mlock / mlock2(…, MLOCK_ONFAULT)</tspan><tspan x="724.0" dy="19.5">mlockall(MCL_CURRENT | MCL_FUTURE | MCL_ONFAULT)</tspan><tspan x="724.0" dy="19.5">стеля — RLIMIT_MEMLOCK, обхід — CAP_IPC_LOCK</tspan></text>
<rect x="44.0" y="456.0" width="300.0" height="108.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="194.0" y="505.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="194.0" dy="0.0">на всю машину,</tspan><tspan x="194.0" dy="19.5">повз процес — sysfs і sysctl</tspan></text>
<rect x="372.0" y="456.0" width="704.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="724.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">/sys/kernel/debug/fault_around_bytes — 65536</tspan><tspan x="724.0" dy="19.5">/sys/kernel/mm/transparent_hugepage/enabled</tspan><tspan x="724.0" dy="19.5">/sys/block/&lt;dev&gt;/queue/read_ahead_kb — 128</tspan><tspan x="724.0" dy="19.5">vm.max_map_count · vm.mmap_min_addr · vm.swappiness</tspan></text>
<text x="560.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">важелі впорядковані не за викликом, а за миттю, коли вони діють</text>
<text x="560.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Чим нижче рядок, тим ширше коло впливу: від однієї ділянки до всіх процесів машини.</text>
</svg>