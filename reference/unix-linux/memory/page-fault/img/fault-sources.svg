<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="64.0" width="230.0" height="78.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="145.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">анонімна пам'ять,</tspan><tspan x="145.0" dy="19.5">ще не займана</tspan></text>
<line x1="145.0" y1="142.0" x2="145.0" y2="172.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="172.0" width="230.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="145.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">читання — спільна нульова</tspan><tspan x="145.0" dy="16.9">сторінка на всіх;</tspan><tspan x="145.0" dy="16.9">запис — чиста сторінка</tspan><tspan x="145.0" dy="16.9">з обнуленого запасу</tspan></text>
<line x1="145.0" y1="290.0" x2="145.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="320.0" width="230.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="145.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">дрібний збій</tspan></text>
<text x="145.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">≈1 мкс</text>
<rect x="282.0" y="64.0" width="230.0" height="78.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="397.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">файл, сторінка вже</tspan><tspan x="397.0" dy="19.5">в кеші сторінок</tspan></text>
<line x1="397.0" y1="142.0" x2="397.0" y2="172.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="282.0" y="172.0" width="230.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="397.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">дані в пам'яті є;</tspan><tspan x="397.0" dy="16.9">лишилося вписати</tspan><tspan x="397.0" dy="16.9">їх у таблицю сторінок</tspan></text>
<line x1="397.0" y1="290.0" x2="397.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="282.0" y="320.0" width="230.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="397.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="397.0" dy="0.0">дрібний збій</tspan></text>
<text x="397.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">≈1 мкс</text>
<rect x="534.0" y="64.0" width="230.0" height="78.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="649.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="649.0" dy="0.0">сторінка є, але</tspan><tspan x="649.0" dy="19.5">запис заборонено</tspan></text>
<line x1="649.0" y1="142.0" x2="649.0" y2="172.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="534.0" y="172.0" width="230.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="649.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="649.0" dy="0.0">спільну сторінку копіюють</tspan><tspan x="649.0" dy="16.9">для того, хто пише</tspan><tspan x="649.0" dy="16.9">(копіювання при записі)</tspan></text>
<line x1="649.0" y1="290.0" x2="649.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="534.0" y="320.0" width="230.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="649.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="649.0" dy="0.0">дрібний збій</tspan></text>
<text x="649.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">≈1–3 мкс</text>
<rect x="786.0" y="64.0" width="230.0" height="78.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="901.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">файл, у кеші</tspan><tspan x="901.0" dy="19.5">сторінок нема</tspan></text>
<line x1="901.0" y1="142.0" x2="901.0" y2="172.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="786.0" y="172.0" width="230.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="901.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="901.0" dy="0.0">читання з носія;</tspan><tspan x="901.0" dy="16.9">задача спить,</tspan><tspan x="901.0" dy="16.9">поки дані не прийдуть</tspan></text>
<line x1="901.0" y1="290.0" x2="901.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="786.0" y="320.0" width="230.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="901.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="901.0" dy="0.0">великий збій</tspan></text>
<text x="901.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">десятки мкс — мс</text>
<rect x="1038.0" y="64.0" width="230.0" height="78.0" rx="6" fill="#f2f6fd" stroke="#2457d6" stroke-width="1.8"/><text x="1153.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1153.0" dy="0.0">сторінку витіснено</tspan><tspan x="1153.0" dy="19.5">у своп</tspan></text>
<line x1="1153.0" y1="142.0" x2="1153.0" y2="172.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1038.0" y="172.0" width="230.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="1153.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1153.0" dy="0.0">читання зі свопу;</tspan><tspan x="1153.0" dy="16.9">задача спить,</tspan><tspan x="1153.0" dy="16.9">поки дані не прийдуть</tspan></text>
<line x1="1153.0" y1="290.0" x2="1153.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1038.0" y="320.0" width="230.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="1153.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1153.0" dy="0.0">великий збій</tspan></text>
<text x="1153.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">десятки мкс — мс</text>
<text x="650.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">звернення до сторінки, якої в таблиці нема (або нема потрібного права)</text>
<text x="650.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">межа проходить рівно там, де починається чекання на носій</text>
</svg>