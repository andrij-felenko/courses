<text x="50.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">1  діапазон адрес — 16-кова без «0x», кінець НЕ входить у ділянку</text>
<text x="50.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">2  права: r w x, четвертий символ — p (приватна) або s (спільна); брак права — «-»</text>
<text x="50.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">3  зсув у підпертому файлі, у байтах, 16-кова; для анонімної ділянки — нулі</text>
<text x="50.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">4  пристрій major:minor, 16-кова; анонімна ділянка дає 00:00</text>
<text x="50.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">5  inode — ДЕСЯТКОВА; нуль означає «файлу під ділянкою немає»</text>
<text x="50.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">6  шлях, псевдоім'я в дужках або порожньо; вилучений файл дістає « (deleted)»</text>
<text x="50.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">два числа в 16-ковій, одне в десятковій — розбір рядка це мусить враховувати</text>
</svg>