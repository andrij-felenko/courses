<rect x="230.0" y="322.0" width="210.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="335.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">викинута у своп</tspan><tspan x="335.0" dy="16.9">Swap += 4 КіБ</tspan></text>
