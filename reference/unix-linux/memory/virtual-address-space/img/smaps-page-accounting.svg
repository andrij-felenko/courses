<line x1="444.0" y1="353.0" x2="494.0" y2="353.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="60.0" width="190.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="87.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">брудна → *_Dirty</tspan><tspan x="885.0" dy="16.9">чиста → *_Clean</tspan></text>
<rect x="790.0" y="182.0" width="190.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">брудна → *_Dirty</tspan><tspan x="885.0" dy="16.9">чиста → *_Clean</tspan></text>
<line x1="734.0" y1="91.0" x2="784.0" y2="91.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="734.0" y1="213.0" x2="784.0" y2="213.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="505.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rss = Shared_Clean + Shared_Dirty + Private_Clean + Private_Dirty</text>
<text x="505.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Swap і SwapPss живуть поза Rss: цих сторінок у пам'яті немає</text>
