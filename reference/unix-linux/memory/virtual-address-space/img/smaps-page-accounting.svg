<rect x="500.0" y="182.0" width="230.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">mapcount = 1 → Private_*</tspan><tspan x="615.0" dy="16.9">Pss += 4 КіБ</tspan></text>
<line x1="444.0" y1="142.0" x2="494.0" y2="92.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
