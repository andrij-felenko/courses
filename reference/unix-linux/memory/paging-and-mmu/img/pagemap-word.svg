<rect x="60.0" y="280.0" width="260.0" height="68.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">біт 62 = 1</tspan><tspan x="190.0" dy="16.9">вміст у підкачці</tspan></text>
