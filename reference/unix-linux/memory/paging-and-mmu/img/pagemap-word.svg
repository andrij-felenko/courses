<rect x="980.0" y="280.0" width="300.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">тип пристрою — біти 4…0</tspan></text>
<rect x="60.0" y="364.0" width="260.0" height="68.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="394.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">обидва = 0</tspan><tspan x="190.0" dy="16.9">кадру немає</tspan></text>
<rect x="340.0" y="364.0" width="940.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="402.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">усе слово нульове — сторінки ще не торкалися</tspan></text>
<line x1="60.0" y1="442.0" x2="1280.0" y2="442.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="60.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">63 P — сторінка присутня, кадр існує</text>
<text x="60.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">62 Sw — вміст витіснено в підкачку</text>
<text x="60.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">61 F — файлова або спільна анонімна</text>
<text x="60.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">60…59 — зарезервовано, завжди нулі</text>
<text x="690.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">58 — сторожова ділянка (з ядра 6.15)</text>
<text x="690.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">57 wp — запис перехоплює userfaultfd (з 5.13)</text>
<text x="690.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">56 ex — на кадр дивиться лише це відображення (з 4.2)</text>
<text x="690.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">55 sd — сторінку чіпали після скидання лічильника</text>
<text x="670.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміщення потрібного слова у файлі = (адреса / розмір сторінки) · 8</text>
