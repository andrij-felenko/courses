<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">обхват TLB і три смуги робочої множини (сторінки 4 КіБ)</text>
<rect x="90.0" y="120.0" width="144.8" height="72.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="162.4" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="162.4" dy="0.0">усе в TLB</tspan></text>
<rect x="234.8" y="120.0" width="639.2" height="72.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="554.4" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="554.4" dy="0.0">обхід читає таблиці з кешу</tspan></text>
<rect x="874.0" y="120.0" width="336.0" height="72.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1042.0" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1042.0" dy="0.0">обхід іде в DRAM</tspan></text>
<line x1="90.0" y1="192.0" x2="90.0" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="90.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1 МіБ</text>
<line x1="234.8" y1="192.0" x2="234.8" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="234.8" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">6 МіБ</text>
<line x1="426.0" y1="192.0" x2="426.0" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="426.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">64 МіБ</text>
<line x1="650.0" y1="192.0" x2="650.0" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="650.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1 ГіБ</text>
<line x1="874.0" y1="192.0" x2="874.0" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="874.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">16 ГіБ</text>
<line x1="1210.0" y1="192.0" x2="1210.0" y2="204.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="1210.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1 ТіБ</text>
<text x="650.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">робоча множина процесу, логарифмічна шкала</text>
<rect x="90.0" y="296.0" width="42.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="152.0" y="296.0" width="1058.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="681.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">множина ≤ 6 МіБ — це рівно обхват: 1536 записів × 4 КіБ.</tspan><tspan x="681.0" dy="18.2">промахи поодинокі, переклад не коштує майже нічого</tspan></text>
<rect x="90.0" y="372.0" width="42.0" height="58.0" rx="6" fill="#fff5e0" stroke="#b8860b" stroke-width="1.6"/>
<rect x="152.0" y="372.0" width="1058.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="681.0" y="396.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">6 МіБ &lt; множина ≤ 512 · L3 ≈ 16 ГіБ — промах майже на кожному зверненні,</tspan><tspan x="681.0" dy="18.2">але таблиці листя (множина / 512) ще вміщаються в L3: обхід коштує 20–30 тактів</tspan></text>
<rect x="90.0" y="448.0" width="42.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<rect x="152.0" y="448.0" width="1058.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="681.0" y="472.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">множина &gt; 512 · L3 — таблиці листя більші за L3, обхід сам іде в DRAM:</tspan><tspan x="681.0" dy="18.2">переклад коштує стільки ж, скільки саме звернення до даних</tspan></text>
<text x="650.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">сторінки на 2 МіБ зсувають обидва пороги: обхват 3 ГіБ, друга межа ≈ 8 ТіБ</text>
</svg>