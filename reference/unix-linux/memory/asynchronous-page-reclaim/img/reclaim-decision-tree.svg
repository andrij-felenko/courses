<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень аллокатора сторінок та ескалація reclaim</text>
<text x="60.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Шлях виділення пам'яті (Page Allocation Path) та ескалація reclaim</text>
<rect x="620.0" y="90.0" width="360.0" height="54.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.8"/><text x="800.0" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Запит на виділення сторінки</tspan><tspan x="800.0" dy="16.9">alloc_pages(gfp_mask)</tspan></text>
