<line x1="620.0" y1="230.0" x2="620.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="310.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="840.0" y="333.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Перевірка Watermarks зони</tspan><tspan x="840.0" dy="15.6">Чи Вільна Пам'ять &gt; WMARK_LOW?</tspan></text>
