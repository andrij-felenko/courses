<line x1="620.0" y1="560.0" x2="620.0" y2="615.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="620.0" y="645.0" width="480.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="860.0" y="668.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">out_of_memory() — OOM Killer</tspan><tspan x="860.0" dy="15.6">Вибір та знищення процесу (SIGKILL) для звільнення RAM</tspan></text>
</svg>