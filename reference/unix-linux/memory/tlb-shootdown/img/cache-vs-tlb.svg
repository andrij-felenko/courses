<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому когерентність рятує кеш даних і не рятує TLB</text>
<rect x="30.0" y="70.0" width="210.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">рядок даних</tspan><tspan x="135.0" dy="19.5">у кеші</tspan></text>
<rect x="270.0" y="70.0" width="240.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ядро 0 пише</tspan><tspan x="390.0" dy="18.2">в комірку</tspan></text>
<line x1="520.0" y1="118.0" x2="560.0" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="70.0" width="200.0" height="96.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">протокол</tspan><tspan x="670.0" dy="18.2">когерентності</tspan></text>
<line x1="780.0" y1="118.0" x2="820.0" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="70.0" width="260.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">копія в кеші ядра 1</tspan><tspan x="960.0" dy="18.2">стає недійсною</tspan></text>
<text x="680.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">залізо стежить саме — жоден рядок коду цього не робить</text>
<rect x="30.0" y="280.0" width="210.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="323.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">переклад</tspan><tspan x="135.0" dy="19.5">у TLB</tspan></text>
<rect x="270.0" y="280.0" width="240.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="323.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ядро 0 стирає PTE —</tspan><tspan x="390.0" dy="18.2">це теж комірка</tspan></text>
<line x1="520.0" y1="328.0" x2="560.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="280.0" width="200.0" height="96.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="323.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">протокол</tspan><tspan x="670.0" dy="18.2">когерентності</tspan></text>
<line x1="780.0" y1="328.0" x2="820.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="280.0" width="260.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="323.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">рядок із PTE в кеші</tspan><tspan x="960.0" dy="18.2">ядра 1 недійсний</tspan></text>
<line x1="960.0" y1="384.0" x2="960.0" y2="428.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,5"/>
<text x="938.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end">зв'язку немає</text>
<rect x="830.0" y="436.0" width="260.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="960.0" y="479.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">а переклад у TLB</tspan><tspan x="960.0" dy="18.2">ядра 1 — чинний</tspan></text>
<text x="640.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">переклад зібрано з чотирьох читань дерева таблиць — у ньому не лишилося сліду, звідки він узятий,</text>
<text x="640.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">а шукають його за віртуальним номером, тож за фізичною адресою PTE його й не знайти</text>
</svg>