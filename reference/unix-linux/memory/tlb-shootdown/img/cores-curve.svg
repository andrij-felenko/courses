<text x="980.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">змінилася лише</text>
<text x="980.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">кількість цілей</text>
<text x="600.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">типова ціна росте помалу, а хвіст — різко: чим більше цілей, тим важче, щоб ЖОДНА не забарилася</text>
<text x="600.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">саме тому середнє тут бреше — воно змішує обидві криві в одне число</text>
