<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 758" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="758" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">де на шляху розсилання спрацьовує який лічильник</text>
<text x="40.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ЯДРО-ІНІЦІАТОР — те, що править таблицю сторінок</text>
<rect x="40.0" y="74.0" width="360.0" height="116.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">керує стеля</tspan><tspan x="220.0" dy="16.9">tlb_single_page_flush_ceiling</tspan><tspan x="220.0" dy="16.9">сторінок більше за 33 →</tspan><tspan x="220.0" dy="16.9">весь діапазон стає TLB_FLUSH_ALL</tspan></text>
<rect x="460.0" y="74.0" width="360.0" height="116.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">nr_tlb_remote_flush   +1</tspan><tspan x="640.0" dy="16.9">trace tlb_flush</tspan><tspan x="640.0" dy="16.9">reason = remote IPI send</tspan><tspan x="640.0" dy="16.9">pages = сторінок у діапазоні</tspan></text>
<rect x="880.0" y="74.0" width="360.0" height="116.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">nr_tlb_local_flush_all   +1</tspan><tspan x="1060.0" dy="16.9">або nr_tlb_local_flush_one += сторінки</tspan><tspan x="1060.0" dy="16.9">trace tlb_flush</tspan><tspan x="1060.0" dy="16.9">reason = local (MM) shootdown</tspan></text>
<rect x="40.0" y="208.0" width="360.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">get_flush_tlb_info()</tspan><tspan x="220.0" dy="18.2">збирає опис скидання</tspan></text>
<rect x="460.0" y="208.0" width="360.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">native_flush_tlb_multi()</tspan><tspan x="640.0" dy="18.2">шле IPI по масці простору</tspan></text>
<rect x="880.0" y="208.0" width="360.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">flush_tlb_func(local = true)</tspan><tspan x="1060.0" dy="18.2">скидає свій власний TLB</tspan></text>
<line x1="408.0" y1="254.0" x2="452.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="828.0" y1="254.0" x2="872.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ЯДРО-ЦІЛЬ — те, що отримало переривання</text>
<rect x="460.0" y="416.0" width="360.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="457.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">flush_tlb_func(local = false)</tspan><tspan x="640.0" dy="18.2">цей простір і тут завантажений</tspan></text>
<rect x="880.0" y="416.0" width="360.0" height="92.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="1060.0" y="457.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">flush_tlb_func(local = false)</tspan><tspan x="1060.0" dy="18.2">тут завантажений уже інший</tspan></text>
<rect x="460.0" y="524.0" width="360.0" height="116.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="561.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">рядок TLB у /proc/interrupts   +1</tspan><tspan x="640.0" dy="16.9">рядок CAL там само   +1</tspan><tspan x="640.0" dy="16.9">nr_tlb_remote_flush_received   +1</tspan><tspan x="640.0" dy="16.9">trace tlb_flush: remote shootdown</tspan></text>
<rect x="880.0" y="524.0" width="360.0" height="116.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="1060.0" y="561.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">trace tlb_flush</tspan><tspan x="1060.0" dy="16.9">reason = remote wrong CPU</tspan><tspan x="1060.0" dy="16.9">ядро вибуває з маски простору</tspan><tspan x="1060.0" dy="16.9">жоден лічильник не росте</tspan></text>
<line x1="640.0" y1="306.0" x2="640.0" y2="408.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="654.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">IPI</text>
<line x1="790.0" y1="306.0" x2="1010.0" y2="408.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири лічильники nr_tlb_* є в /proc/vmstat ЛИШЕ при CONFIG_DEBUG_TLBFLUSH</text>
<text x="650.0" y="720.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">рядок TLB у /proc/interrupts і трасувальна точка tlb_flush є завжди</text>
</svg>