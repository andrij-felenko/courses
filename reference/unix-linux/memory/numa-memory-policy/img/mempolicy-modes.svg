<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="15.0" width="980.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Режими політик виділення пам'яті ядра Linux (NUMA Memory Policies)</tspan></text>
<rect x="30.0" y="65.0" width="980.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="45.0" y="75.0" width="310.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">MPOL_DEFAULT / MPOL_LOCAL</tspan></text>
<rect x="45.0" y="113.0" width="310.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Локальне виділення за замовчуванням</tspan></text>
<rect x="370.0" y="75.0" width="625.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Пам'ять виділяється на тому вузлі, де виконується потік (first-touch).</tspan><tspan x="682.5" dy="15.6">Якщо потік на CPU 0 (Node 0) торкається сторінки — вона виділяється на Node 0.</tspan><tspan x="682.5" dy="15.6">При переповненні вузла переходить до сусідніх вузлів згідно зі SLIT.</tspan></text>
<rect x="30.0" y="185.0" width="980.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="45.0" y="195.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">MPOL_BIND (суворий список вузлів)</tspan></text>
<rect x="45.0" y="233.0" width="310.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="261.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Жорстка прив'язка до множини вузлів</tspan></text>
<rect x="370.0" y="195.0" width="625.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Виділення дозволено виключно на вузлах із заданої бітової маски (nodemask).</tspan><tspan x="682.5" dy="15.6">Якщо на дозволених вузлах закінчилася пам'ять — повертається помилка -ENOMEM,</tspan><tspan x="682.5" dy="15.6">навіть якщо інші вузли системи повністю вільні.</tspan></text>
<rect x="30.0" y="305.0" width="980.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="45.0" y="315.0" width="310.0" height="32.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">MPOL_INTERLEAVE (чередування сторінок)</tspan></text>
<rect x="45.0" y="353.0" width="310.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="381.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Круг-робін розподіл сторінок між вузлами</tspan></text>
<rect x="370.0" y="315.0" width="625.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="346.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Сторінки віртуального діапазону циклічно чергуються: Page 0 → Node 0, Page 1 → Node 1...</tspan><tspan x="682.5" dy="15.6">Рівномірно розподіляє пропускну здатність пам'яті між усіма каналами.</tspan><tspan x="682.5" dy="15.6">Ідеально для спільних великих буферів і паралельних потоків.</tspan></text>
<rect x="30.0" y="425.0" width="980.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="45.0" y="435.0" width="310.0" height="32.0" rx="6" fill="#f3e8fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">MPOL_PREFERRED / PREFERRED_MANY</tspan></text>
<rect x="45.0" y="473.0" width="310.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Бажаний вузол із м'яким переходом</tspan></text>
<rect x="370.0" y="435.0" width="625.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="466.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Ядро намагається виділити пам'ять на вказаному бажаному вузлі.</tspan><tspan x="682.5" dy="15.6">Якщо на цьому вузлі пам'ять вичерпана або досягнуто водяного знаку,</tspan><tspan x="682.5" dy="15.6">ядро прозоро виділяє кадри на найближчих доступних вузлах.</tspan></text>
</svg>