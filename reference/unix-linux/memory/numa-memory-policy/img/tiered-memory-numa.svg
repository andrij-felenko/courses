<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="15.0" width="980.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Багаторівнева пам'ять (Tiered Memory): DRAM, HBM і CXL Expander</tspan></text>
<rect x="40.0" y="75.0" width="960.0" height="165.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.6"/>
<text x="520.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">TOP TIER (Верхній рівень: швидка пам'ять із низькою затримкою)</text>
<rect x="60.0" y="115.0" width="420.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="148.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Локальна пам'ять DDR5 (Node 0, Node 1)</tspan><tspan x="270.0" dy="15.6">• Затримка: ~60–80 нс</tspan><tspan x="270.0" dy="15.6">• Призначення: гарячі анонімні сторінки та кеш</tspan><tspan x="270.0" dy="15.6">• Політика за замовчуванням для нових виділень</tspan></text>
<rect x="560.0" y="115.0" width="420.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="148.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">HBM / Спеціалізована пам'ять процесора</tspan><tspan x="770.0" dy="15.6">• Висока пропускна здатність (&gt;1 ТБ/с)</tspan><tspan x="770.0" dy="15.6">• Обмежений обсяг</tspan><tspan x="770.0" dy="15.6">• Пріоритет для обчислювальних ядер</tspan></text>
<rect x="150.0" y="255.0" width="320.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/>
<text x="310.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фонове пониження (Demotion via kswapd)</text>
<line x1="310.0" y1="240.0" x2="310.0" y2="255.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="310.0" y1="300.0" x2="310.0" y2="315.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="255.0" width="320.0" height="45.0" rx="6" fill="#c0392b" stroke="#333333" stroke-width="1.4"/>
<text x="730.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Підвищення гарячих сторінок (Auto-NUMA Promotion)</text>
<line x1="730.0" y1="315.0" x2="730.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="255.0" x2="730.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="960.0" height="165.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.6"/>
<text x="520.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">SLOW TIER / CAPACITY TIER (Нижній рівень: розширена місткість)</text>
<rect x="60.0" y="370.0" width="420.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="403.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">CXL.mem пам'ять (CPU-less NUMA Node 2, 3)</tspan><tspan x="270.0" dy="15.6">• Затримка: ~180–250 нс (PCIe / CXL лінк)</tspan><tspan x="270.0" dy="15.6">• Велика місткість, спільний пул пам'яті</tspan><tspan x="270.0" dy="15.6">• Холодні сторінки без викидання на диск</tspan></text>
<rect x="560.0" y="370.0" width="420.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="403.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Енергонезалежна пам'ять (PMEM / CXL SSD)</tspan><tspan x="770.0" dy="15.6">• Стійкість до знеструмлення</tspan><tspan x="770.0" dy="15.6">• Проміжний буфер між DRAM і дисковим сховищем</tspan><tspan x="770.0" dy="15.6">• Розвантажує системний своп</tspan></text>
</svg>