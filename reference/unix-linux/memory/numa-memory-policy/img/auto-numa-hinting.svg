<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="15.0" width="980.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Механізм Auto-NUMA Balancing: сканування PTE та Hinting Faults</tspan></text>
<rect x="30.0" y="75.0" width="175.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="38.0" y="85.0" width="159.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="117.5" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="117.5" dy="0.0">1. Періодичний скан</tspan></text>
<rect x="38.0" y="130.0" width="159.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="117.5" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">Ядро скидає біт Present</tspan><tspan x="117.5" dy="13.0">у PTE сторінки</tspan><tspan x="117.5" dy="13.0">(позначає _PAGE_NUMA /</tspan><tspan x="117.5" dy="13.0">PROT_NONE)</tspan></text>
<line x1="207.0" y1="175.0" x2="229.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="231.0" y="75.0" width="175.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="239.0" y="85.0" width="159.0" height="36.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="318.5" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="318.5" dy="0.0">2. Доступ потоку</tspan></text>
<rect x="239.0" y="130.0" width="159.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="318.5" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="318.5" dy="0.0">Потік на CPU 1 (Node 1)</tspan><tspan x="318.5" dy="13.0">звертається до пам'яті →</tspan><tspan x="318.5" dy="13.0">MMU генерує</tspan><tspan x="318.5" dy="13.0">NUMA Hinting Fault</tspan></text>
<line x1="408.0" y1="175.0" x2="430.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="432.0" y="75.0" width="175.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="440.0" y="85.0" width="159.0" height="36.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="519.5" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="519.5" dy="0.0">3. do_numa_page()</tspan></text>
<rect x="440.0" y="130.0" width="159.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="519.5" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="519.5" dy="0.0">Ядро зчитує:</tspan><tspan x="519.5" dy="11.7">• page_to_nid(page) = 0</tspan><tspan x="519.5" dy="11.7">• cpu_to_node(cpu) = 1</tspan><tspan x="519.5" dy="11.7">Виявлено віддалений доступ</tspan></text>
<line x1="609.0" y1="175.0" x2="631.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="633.0" y="75.0" width="175.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="641.0" y="85.0" width="159.0" height="36.0" rx="6" fill="#f3e8fd" stroke="#333333" stroke-width="1.5"/><text x="720.5" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.5" dy="0.0">4. Аналіз локальності</tspan></text>
<rect x="641.0" y="130.0" width="159.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.5" y="179.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.5" dy="0.0">Оцінка доцільності:</tspan><tspan x="720.5" dy="14.3">чи сторінка приватна?</tspan><tspan x="720.5" dy="14.3">чи часто звертається?</tspan><tspan x="720.5" dy="14.3">захист від пінг-понгу</tspan></text>
<line x1="810.0" y1="175.0" x2="832.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="834.0" y="75.0" width="175.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="842.0" y="85.0" width="159.0" height="36.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="921.5" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="921.5" dy="0.0">5. Міграція або Afinity</tspan></text>
<rect x="842.0" y="130.0" width="159.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="921.5" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="921.5" dy="0.0">migrate_misplaced_page()</tspan><tspan x="921.5" dy="13.0">Перенесення кадру 0 → 1</tspan><tspan x="921.5" dy="13.0">АБО міграція потоку</tspan><tspan x="921.5" dy="13.0">на Node 0</tspan></text>
<rect x="30.0" y="295.0" width="475.0" height="205.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="267.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДО балансування (Віддалений доступ)</text>
<rect x="45.0" y="335.0" width="200.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Потік виконується на:</tspan><tspan x="145.0" dy="15.6">CPU 1 (NUMA Node 1)</tspan></text>
<rect x="290.0" y="335.0" width="200.0" height="60.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Фізичний кадр лежить на:</tspan><tspan x="390.0" dy="15.6">DRAM (NUMA Node 0)</tspan></text>
<line x1="245.0" y1="365.0" x2="290.0" y2="365.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<rect x="45.0" y="410.0" width="445.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="267.5" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">Трафік іде через міжпроцесорну шину.</tspan><tspan x="267.5" dy="15.6">Затримка доступу висока (~140 нс),</tspan><tspan x="267.5" dy="15.6">пропускна здатність обмежена.</tspan></text>
<rect x="535.0" y="295.0" width="475.0" height="205.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="772.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПІСЛЯ балансування (Локальний доступ)</text>
<rect x="550.0" y="335.0" width="200.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Потік виконується на:</tspan><tspan x="650.0" dy="15.6">CPU 1 (NUMA Node 1)</tspan></text>
<rect x="795.0" y="335.0" width="200.0" height="60.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Фізичний кадр перенесено:</tspan><tspan x="895.0" dy="15.6">DRAM (NUMA Node 1)</tspan></text>
<line x1="750.0" y1="365.0" x2="795.0" y2="365.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="550.0" y="410.0" width="445.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="772.5" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Прямий доступ через локальний контролер пам'яті.</tspan><tspan x="772.5" dy="15.6">Затримка мінімальна (~65 нс),</tspan><tspan x="772.5" dy="15.6">міжпроцесорний лінк розвантажено.</tspan></text>
</svg>