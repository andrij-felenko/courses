<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро тягне жереб не на об'єкт, а на базу відображення</text>
<rect x="40.0" y="56.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">жереб ядра в execve</tspan></text>
<rect x="430.0" y="56.0" width="670.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="765.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">що цей один жереб пересуває</tspan></text>
<rect x="40.0" y="122.0" width="300.0" height="74.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">база відображень</tspan><tspan x="190.0" dy="15.6">mmap_base</tspan></text>
<line x1="350.0" y1="159.0" x2="418.0" y2="159.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430.0" y="122.0" width="670.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="765.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">libc.so.6 · ld-linux.so · усі інші бібліотеки ·</tspan><tspan x="765.0" dy="15.6">великі шматки купи, узяті окремим mmap</tspan></text>
<rect x="40.0" y="208.0" width="300.0" height="74.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.8"/><text x="190.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">вершина стека</tspan></text>
<line x1="350.0" y1="245.0" x2="418.0" y2="245.0" stroke="#7a4fb0" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430.0" y="208.0" width="670.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="765.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">стек головного потоку разом з усіма</tspan><tspan x="765.0" dy="15.6">кадрами, аргументами й оточенням</tspan></text>
<rect x="40.0" y="294.0" width="300.0" height="74.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.8"/><text x="190.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">база виконуваного</tspan><tspan x="190.0" dy="15.6">файлу (лише ET_DYN)</tspan></text>
<line x1="350.0" y1="331.0" x2="418.0" y2="331.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430.0" y="294.0" width="670.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="765.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">код і дані самої програми —</tspan><tspan x="765.0" dy="15.6">тільки якщо її зібрано з -pie</tspan></text>
<rect x="40.0" y="380.0" width="300.0" height="74.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.8"/><text x="190.0" y="413.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">початок купи</tspan><tspan x="190.0" dy="15.6">brk</tspan></text>
<line x1="350.0" y1="417.0" x2="418.0" y2="417.0" stroke="#b8860b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430.0" y="380.0" width="670.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="765.0" y="413.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">класична купа, що росте зсувом межі;</tspan><tspan x="765.0" dy="15.6">рухається лише за randomize_va_space=2</tspan></text>
<rect x="40.0" y="466.0" width="300.0" height="74.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/><text x="190.0" y="507.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">місце vDSO</tspan></text>
<line x1="350.0" y1="503.0" x2="418.0" y2="503.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430.0" y="466.0" width="670.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="765.0" y="499.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">сторінка коду від ядра; адресу процес</tspan><tspan x="765.0" dy="15.6">дістає з допоміжного вектора</tspan></text>
<rect x="40.0" y="562.0" width="1060.0" height="56.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="570.0" y="594.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">усередині кожної ділянки відстані зафіксовані при лінкуванні — рухається тільки база, вміст їде за нею цілим блоком</tspan></text>
<text x="570.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">п'ять випадкових чисел визначають адресу кожного байта в процесі</text>
</svg>