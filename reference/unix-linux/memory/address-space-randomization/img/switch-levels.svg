<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 712" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="712" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять поверхів, на яких рандомізацію вмикають і вимикають</text>
<rect x="40.0" y="54.0" width="250.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">поверх</tspan></text>
<rect x="306.0" y="54.0" width="330.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="471.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">вимикач</tspan></text>
<rect x="652.0" y="54.0" width="488.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="896.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="896.0" dy="0.0">що саме він вирішує</tspan></text>
<rect x="40.0" y="128.0" width="250.0" height="82.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.9"/><text x="165.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">збірка програми</tspan></text>
<rect x="306.0" y="128.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="471.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">-pie  /  -no-pie</tspan></text>
<rect x="652.0" y="128.0" width="488.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="896.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="896.0" dy="0.0">чи має виконуваний файл право їздити взагалі;</tspan><tspan x="896.0" dy="14.3">сисктлом це вже не виправити</tspan></text>
<rect x="40.0" y="222.0" width="250.0" height="82.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.9"/><text x="165.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">збірка ядра</tspan></text>
<rect x="306.0" y="222.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.5"/><text x="471.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">CONFIG_RANDOMIZE_BASE</tspan><tspan x="471.0" dy="15.6">CONFIG_COMPAT_BRK</tspan></text>
<rect x="652.0" y="222.0" width="488.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="896.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="896.0" dy="0.0">чи є в ядрі код рандомізації образу</tspan><tspan x="896.0" dy="14.3">й чи допускається давня розкладка купи</tspan></text>
<rect x="40.0" y="316.0" width="250.0" height="82.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.9"/><text x="165.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">завантаження</tspan></text>
<rect x="306.0" y="316.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="471.0" y="361.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">nokaslr  у рядку ядра</tspan></text>
<rect x="652.0" y="316.0" width="488.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="896.0" y="353.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="896.0" dy="0.0">рандомізація образу ядра на цей запуск —</tspan><tspan x="896.0" dy="14.3">вимикають заради налагодження ядра</tspan></text>
<rect x="40.0" y="410.0" width="250.0" height="82.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.9"/><text x="165.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">уся система</tspan></text>
<rect x="306.0" y="410.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="471.0" y="447.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">kernel.randomize_va_space</tspan><tspan x="471.0" dy="15.6">vm.mmap_rnd_bits</tspan></text>
<rect x="652.0" y="410.0" width="488.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="896.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="896.0" dy="0.0">0 — нічого · 1 — відображення, стек, vDSO ·</tspan><tspan x="896.0" dy="14.3">2 — плюс купа; і скільки бітів давати</tspan></text>
<rect x="40.0" y="504.0" width="250.0" height="82.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.9"/><text x="165.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">окремий процес</tspan></text>
<rect x="306.0" y="504.0" width="330.0" height="82.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="471.0" y="541.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">personality(ADDR_NO_RANDOMIZE)</tspan><tspan x="471.0" dy="15.6">setarch --addr-no-randomize</tspan></text>
<rect x="652.0" y="504.0" width="488.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="896.0" y="541.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="896.0" dy="0.0">вимкнення для цього процесу й усіх нащадків;</tspan><tspan x="896.0" dy="14.3">саме це робить gdb перед запуском</tspan></text>
<rect x="40.0" y="610.0" width="1100.0" height="58.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.9"/><text x="590.0" y="643.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">поверхи не рівноправні: нижній не відновлює того, що вимкнув верхній — не-PIE бінарник лишиться на місці за будь-якого сисктла</tspan></text>
<text x="590.0" y="696.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">розкладку обирають в execve — тому робітник, піднятий самим fork, успадковує чужий жереб замість власного</text>
</svg>