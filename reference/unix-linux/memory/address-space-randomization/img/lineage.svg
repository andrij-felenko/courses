<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 994" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="994" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хроніка ентропії: кожна цифра має дату й привід</text>
<rect x="40.0" y="54.0" width="132.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="106.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">рік</tspan></text>
<rect x="188.0" y="54.0" width="470.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="423.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="423.0" dy="0.0">що сталося</tspan></text>
<rect x="674.0" y="54.0" width="546.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.5"/><text x="947.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="947.0" dy="0.0">що стало з бітами</tspan></text>
<rect x="40.0" y="128.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.9"/><text x="106.0" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">1997</tspan></text>
<rect x="188.0" y="128.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Форрест, Сомаяджі й Еклі показують,</tspan><tspan x="423.0" dy="14.3">що випадковий відступ ламає переповнення</tspan></text>
<rect x="674.0" y="128.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="947.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">бітів ще ніхто не рахує — є сама ідея</tspan></text>
<rect x="40.0" y="203.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.9"/><text x="106.0" y="240.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2001</tspan></text>
<rect x="188.0" y="203.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">PaX публікує проєкт і латку;</tspan><tspan x="423.0" dy="14.3">термін ASLR з'являється тут</tspan></text>
<rect x="674.0" y="203.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="947.0" y="239.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">на i386: 24 біти стек, 16 mmap, 16 образ</tspan></text>
<rect x="40.0" y="278.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.9"/><text x="106.0" y="315.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2003</tspan></text>
<rect x="188.0" y="278.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="307.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">OpenBSD 3.4 · Exec Shield Інґо Молнара</tspan><tspan x="423.0" dy="14.3">в Red Hat</tspan></text>
<rect x="674.0" y="278.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="947.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">19 бітів стеку (крок 16 Б), 8 бітів бази mmap</tspan></text>
<rect x="40.0" y="353.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.9"/><text x="106.0" y="390.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2004</tspan></text>
<rect x="188.0" y="353.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Шахам зі співавторами перебирає</tspan><tspan x="423.0" dy="14.3">Apache за 216 секунд</tspan></text>
<rect x="674.0" y="353.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="947.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">16 бітів на 32-бітній системі визнано</tspan><tspan x="947.0" dy="14.3">недостатніми — і це не полагодили, а переросли</tspan></text>
<rect x="40.0" y="428.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.9"/><text x="106.0" y="465.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2007</tspan></text>
<rect x="188.0" y="428.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="464.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Їржі Косіна рандомізує brk на i386 і x86_64</tspan></text>
<rect x="674.0" y="428.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/><text x="947.0" y="464.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">32 МіБ = 13 бітів — цифра простоїть 17 років</tspan></text>
<rect x="40.0" y="503.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.9"/><text x="106.0" y="540.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2014</tspan></text>
<rect x="188.0" y="503.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="532.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Марко-Ґісберт і Ріполь описують offset2lib;</tspan><tspan x="423.0" dy="14.3">у головну гілку входить KASLR</tspan></text>
<rect x="674.0" y="503.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="947.0" y="539.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">витік із програми = база libc; образ ядра — 9 бітів</tspan></text>
<rect x="40.0" y="578.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.9"/><text x="106.0" y="615.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2015</tspan></text>
<rect x="188.0" y="578.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="607.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">латка Кіса Кука розділяє жереби (4.1);</tspan><tspan x="423.0" dy="14.3">CVE-2015-1593 виправлено в 3.19-rc3</tspan></text>
<rect x="674.0" y="578.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="947.0" y="607.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">два незалежні жереби; стекові повернуто</tspan><tspan x="947.0" dy="14.3">два старші розряди</tspan></text>
<rect x="40.0" y="653.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.9"/><text x="106.0" y="690.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2016</tspan></text>
<rect x="188.0" y="653.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="689.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Деніел Кешмен додає сисктли (4.5)</tspan></text>
<rect x="674.0" y="653.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="947.0" y="689.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">vm.mmap_rnd_bits — типово 28 і 8</tspan></text>
<rect x="40.0" y="728.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.9"/><text x="106.0" y="765.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2022→2024</tspan></text>
<rect x="188.0" y="728.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="757.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">вирівнювання на 2 МіБ (5.18) мовчки з'їдає біти;</tspan><tspan x="423.0" dy="14.3">Дженніфер Міллер описує ASLRn't</tspan></text>
<rect x="674.0" y="728.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="947.0" y="757.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">база бібліотек: 28 → 19 бітів,</tspan><tspan x="947.0" dy="14.3">і це не атака, а оптимізація</tspan></text>
<rect x="40.0" y="803.0" width="132.0" height="66.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.9"/><text x="106.0" y="840.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="106.0" dy="0.0">2024</tspan></text>
<rect x="188.0" y="803.0" width="470.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="839.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">Кіс Кук піднімає рандомізацію brk на x86_64</tspan></text>
<rect x="674.0" y="803.0" width="546.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="947.0" y="839.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="947.0" dy="0.0">13 → 18 бітів, як уже було на arm64</tspan></text>
<rect x="40.0" y="892.0" width="1140.0" height="58.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.9"/><text x="610.0" y="925.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">жодну з цих цифр не вивели з теорії — кожну поставили після того, як хтось показав робочу атаку або втрату</tspan></text>
<text x="610.0" y="978.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">рух не однобічний: біти додає безпека, а забирає швидкодія</text>
</svg>