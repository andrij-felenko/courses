<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік адреси коштує рівно стільки, скільки коштувала вся ентропія</text>
<rect x="40.0" y="56.0" width="520.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="300.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">один покажчик назовні — і бази більше немає</tspan></text>
<rect x="40.0" y="120.0" width="300.0" height="70.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">витекла адреса printf у процесі</tspan></text>
<rect x="356.0" y="120.0" width="204.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/><text x="458.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">0x7f3c2a1b4e40</tspan></text>
<rect x="40.0" y="202.0" width="300.0" height="70.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="233.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">зсув printf у файлі libc.so.6</tspan><tspan x="190.0" dy="14.3">(читається з дистрибутива)</tspan></text>
<rect x="356.0" y="202.0" width="204.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.7"/><text x="458.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">0x00061e40</tspan></text>
<rect x="40.0" y="284.0" width="300.0" height="70.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="322.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">база libc = різниця</tspan></text>
<rect x="356.0" y="284.0" width="204.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="458.0" y="323.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">0x7f3c2a153000</tspan></text>
<rect x="40.0" y="372.0" width="520.0" height="64.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.7"/><text x="300.0" y="400.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">далі відома кожна адреса в цій бібліотеці —</tspan><tspan x="300.0" dy="15.6">стан «нападник знає половину» не існує</tspan></text>
<line x1="600.0" y1="56.0" x2="600.0" y2="500.0" stroke="#d7dbe0" stroke-width="1.4" stroke-dasharray="6 6"/>
<rect x="640.0" y="56.0" width="500.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="890.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">чи розкриває витік ще й сусіда</tspan></text>
<rect x="640.0" y="120.0" width="500.0" height="156.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="890.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">до ядра 4.1: один жереб на дві бази</tspan><tspan x="890.0" dy="15.6"></tspan><tspan x="890.0" dy="15.6">виконуваний файл лежав упритул до області</tspan><tspan x="890.0" dy="15.6">відображень, відстань між ними стала —</tspan><tspan x="890.0" dy="15.6">витік адреси програми давав базу libc</tspan></text>
<rect x="640.0" y="296.0" width="500.0" height="156.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="890.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">з ядра 4.1: два незалежні жереби</tspan><tspan x="890.0" dy="15.6"></tspan><tspan x="890.0" dy="15.6">переміщуваний виконуваний файл дістав</tspan><tspan x="890.0" dy="15.6">власне випадкове місце — витік із нього</tspan><tspan x="890.0" dy="15.6">нічого не каже про бібліотеки</tspan></text>
<text x="590.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">бібліотеки між собою досі один блок: завантажувач кладе їх поспіль, тому їхні взаємні відстані сталі</text>
</svg>