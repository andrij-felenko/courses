<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр типів пам'яті: порівняння характеристик і призначень</text>
<text x="660.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр типів пам'яті: баланс між суворою черговістю доступу та швидкістю кешування</text>
<line x1="100.0" y1="100.0" x2="1220.0" y2="100.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="100.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Максимальна суворість (MMIO)</text>
<text x="1220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">Максимальна продуктивність (RAM)</text>
<rect x="60.0" y="120.0" width="280.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="200.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">UC / Strong Uncacheable</tspan><tspan x="200.0" dy="16.9">(ARM: Device-nGnRnE)</tspan></text>
<rect x="60.0" y="185.0" width="280.0" height="380.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="74.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кеш повністю вимкнено</text>
<text x="74.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Строгий порядок інструкцій</text>
<text x="74.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Заборонено злиття записів</text>
<text x="74.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Заборонено спекулятивні зчитування</text>
<text x="74.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямі поодинокі транзакції на шині</text>
<rect x="70.0" y="370.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="200.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Призначення: Регістри керування MMIO, апаратні FIFO, скидання переривань</tspan></text>
<rect x="365.0" y="120.0" width="280.0" height="60.0" rx="6" fill="#f3e8fd" stroke="#6b7280" stroke-width="1.6"/><text x="505.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">WC / Write-Combining</tspan><tspan x="505.0" dy="16.9">(ARM: Normal Non-Cacheable)</tspan></text>
<rect x="365.0" y="185.0" width="280.0" height="380.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="379.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кеш L1/L2/L3 вимкнено</text>
<text x="379.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Слабкий порядок запису (Weak)</text>
<text x="379.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Записи зливаються в буфері (64 Б)</text>
<text x="379.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Відправлення пакетом (Burst PCIe)</text>
<text x="379.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дозволено спекулятивне читання</text>
<rect x="375.0" y="370.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="505.0" y="417.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Призначення: Відеопам'ять (Framebuffers), текстури GPU, PCIe BAR буфери</tspan></text>
<rect x="670.0" y="120.0" width="280.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="810.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">WT / Write-Through</tspan><tspan x="810.0" dy="16.9">(ARM: Normal Write-Through)</tspan></text>
<rect x="670.0" y="185.0" width="280.0" height="380.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="684.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читання кешується в L1/L2/L3</text>
<text x="684.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запис оновлює кеш І відразу шину</text>
<text x="684.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Немає брудних (Dirty) рядків</text>
<text x="684.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дані в RAM завжди актуальні</text>
<text x="684.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Нижча швидкість запису за WB</text>
<rect x="680.0" y="370.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="810.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Призначення: Спільна пам'ять із контролерами без апаратного snoop-протоколу</tspan></text>
<rect x="975.0" y="120.0" width="280.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="1115.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1115.0" dy="0.0">WB / Write-Back</tspan><tspan x="1115.0" dy="16.9">(ARM: Normal Write-Back)</tspan></text>
<rect x="975.0" y="185.0" width="280.0" height="380.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="989.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повне кешування L1/L2/L3</text>
<text x="989.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Виділення рядка на запис і читання</text>
<text x="989.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Брудні рядки скидаються при витісненні</text>
<text x="989.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Когерентність MESI / MOESI</text>
<text x="989.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Максимальна пропускна здатність</text>
<rect x="985.0" y="370.0" width="260.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="1115.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1115.0" dy="0.0">Призначення: Звичайна оперативна пам'ять процесу (стек, купа, код, ядро)</tspan></text>
<rect x="60.0" y="590.0" width="1195.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="657.5" y="613.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="657.5" dy="0.0">Ключове правило системного програміста: звичайна пам'ять (RAM) ЗАВЖДИ вимагає Write-Back,</tspan><tspan x="657.5" dy="15.6">потокові графічні буфери — Write-Combining, а регістри апаратних пристроїв (MMIO) — Uncacheable / Device.</tspan></text>
</svg>