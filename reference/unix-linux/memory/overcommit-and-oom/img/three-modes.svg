<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="310.0" y="26.0" width="500.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="560.0" y="57.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">запит: приватне записуване відображення на 8 ГіБ</tspan></text>
<line x1="560.0" y1="82.0" x2="180.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="82.0" x2="560.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="82.0" x2="940.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="10.0" y="132.0" width="340.0" height="46.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">0 — евристика (типово)</tspan></text>
<rect x="10.0" y="194.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="180.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">відмова лише тоді, коли ОДИН</tspan><tspan x="180.0" dy="17.6">запит більший за всю RAM</tspan><tspan x="180.0" dy="17.6">плюс своп. Суму обіцянок</tspan><tspan x="180.0" dy="17.6">ніхто не звіряє</tspan></text>
<line x1="180.0" y1="306.0" x2="180.0" y2="342.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="10.0" y="346.0" width="340.0" height="92.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="180.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">8 ГіБ на машині з 16 ГіБ:</tspan><tspan x="180.0" dy="17.6">дозволено, навіть якщо</tspan><tspan x="180.0" dy="17.6">роздано вже 40</tspan></text>
<rect x="10.0" y="458.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="180.0" y="487.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">Committed_AS рахується,</tspan><tspan x="180.0" dy="16.9">але нікого не стримує</tspan></text>
<rect x="390.0" y="132.0" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="560.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">1 — завжди дозволяти</tspan></text>
<rect x="390.0" y="194.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="560.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">перевірки немає взагалі:</tspan><tspan x="560.0" dy="17.6">ядро відповідає «так»</tspan><tspan x="560.0" dy="17.6">не дивлячись. Для розріджених</tspan><tspan x="560.0" dy="17.6">і свідомо ледачих карт</tspan></text>
<line x1="560.0" y1="306.0" x2="560.0" y2="342.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="346.0" width="340.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="560.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">дозволено завжди —</tspan><tspan x="560.0" dy="17.6">хоч терабайт на ноутбуці</tspan></text>
<rect x="390.0" y="458.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="487.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">malloc практично ніколи</tspan><tspan x="560.0" dy="16.9">не поверне NULL</tspan></text>
<rect x="770.0" y="132.0" width="340.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">2 — суворий облік</tspan></text>
<rect x="770.0" y="194.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="940.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">Committed_AS плюс запит мусить</tspan><tspan x="940.0" dy="17.6">влізти в CommitLimit =</tspan><tspan x="940.0" dy="17.6">(RAM − hugetlb)·ratio/100</tspan><tspan x="940.0" dy="17.6">плюс своп</tspan></text>
<line x1="940.0" y1="306.0" x2="940.0" y2="342.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="346.0" width="340.0" height="92.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="940.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">не влізло → ENOMEM,</tspan><tspan x="940.0" dy="17.6">хоча фізична пам'ять</tspan><tspan x="940.0" dy="17.6">зараз вільна</tspan></text>
<rect x="770.0" y="458.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="940.0" y="487.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="940.0" dy="0.0">єдиний режим, де malloc</tspan><tspan x="940.0" dy="16.9">чесно каже «ні»</tspan></text>
<text x="560.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">ворота стоять на роздачі адрес, а не на видачі сторінок</text>
</svg>