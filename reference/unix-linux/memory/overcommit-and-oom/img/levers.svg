<text x="570.0" y="716.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">зелене відмовляє чесно, синє міняє облік, червоне тільки обирає, кому вмерти</text>
