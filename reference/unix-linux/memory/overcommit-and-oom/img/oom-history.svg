<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">ХТО І КОЛИ МІНЯВ ВИБІР ЖЕРТВИ</text>
<line x1="168.0" y1="66.0" x2="168.0" y2="694.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,6"/>
<rect x="30.0" y="92.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="95.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">1998–2000</tspan></text>
<circle cx="168.0" cy="120.0" r="7.0" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/>
<rect x="190.0" y="66.0" width="860.0" height="108.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="620.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Рік ван Ріл (Rik van Riel) пише mm/oom_kill.c.</tspan><tspan x="620.0" dy="18.9">Евристика badness зважує провину: розмір, час роботи,</tspan><tspan x="620.0" dy="18.9">nice, привілеї, кількість дітей.</tspan></text>
<rect x="30.0" y="222.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="95.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">24.09.2004</tspan></text>
<circle cx="168.0" cy="250.0" r="7.0" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/>
<rect x="190.0" y="196.0" width="860.0" height="108.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="620.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">LKML, гілка «oom_pardon, aka don't kill my xlock».</tspan><tspan x="620.0" dy="18.9">Андріс Броуер (Andries Brouwer) відповідає притчею</tspan><tspan x="620.0" dy="18.9">про літак і механізм OOF.</tspan></text>
<rect x="30.0" y="352.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="95.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">червень 2010</tspan></text>
<circle cx="168.0" cy="380.0" r="7.0" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/>
<rect x="190.0" y="326.0" width="860.0" height="108.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="620.0" y="366.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Девід Рієнджес (David Rientjes) переписує евристику з нуля</tspan><tspan x="620.0" dy="18.9">(ядро 2.6.36): бал — частка пам'яті машини.</tspan><tspan x="620.0" dy="18.9">oom_adj змінюється на oom_score_adj у проміле.</tspan></text>
<rect x="30.0" y="482.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="95.0" y="513.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">2015 → 4.6 (2016)</tspan></text>
<circle cx="168.0" cy="510.0" r="7.0" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="190.0" y="456.0" width="860.0" height="108.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="620.0" y="496.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ідея Мела Ґормана (Mel Gorman) на LSF/MM, незалежно —</tspan><tspan x="620.0" dy="18.9">Олег Нестеров. OOM reaper Міхала Гоцка (Michal Hocko)</tspan><tspan x="620.0" dy="18.9">відбирає сторінки, не чекаючи смерті жертви.</tspan></text>
<rect x="30.0" y="612.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="95.0" y="644.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">донині</tspan></text>
<circle cx="168.0" cy="640.0" r="7.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<rect x="190.0" y="586.0" width="860.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="620.0" y="626.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Строгий режим без overcommit майже ніхто не вмикає.</tspan><tspan x="620.0" dy="18.9">Рішення про смерть виносять у простір користувача —</tspan><tspan x="620.0" dy="18.9">туди, де є знання про застосунок.</tspan></text>
</svg>