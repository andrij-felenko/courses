<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 822" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="822" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="300.0" y="26.0" width="400.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="58.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">malloc(N) — просимо адреси</tspan></text>
<line x1="500.0" y1="84.0" x2="500.0" y2="106.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="110.0" width="500.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ворота обліку: чи можна ПООБІЦЯТИ N?</tspan></text>
<line x1="460.0" y1="188.0" x2="230.0" y2="222.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="188.0" x2="600.0" y2="222.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="226.0" width="340.0" height="76.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="259.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">ні → ENOMEM,</tspan><tspan x="230.0" dy="18.2">malloc повертає NULL</tspan></text>
<rect x="440.0" y="226.0" width="360.0" height="76.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="259.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">так → VMA додано,</tspan><tspan x="620.0" dy="18.2">сторінок досі 0</tspan></text>
<line x1="620.0" y1="306.0" x2="620.0" y2="338.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="342.0" width="360.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="620.0" y="377.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">перший запис → збій сторінки</tspan></text>
<line x1="620.0" y1="406.0" x2="620.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="434.0" width="360.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="620.0" y="465.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">вільна сторінка є → віддали</tspan></text>
<line x1="620.0" y1="488.0" x2="620.0" y2="500.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="504.0" width="360.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="620.0" y="535.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">kswapd, потім прямий витіск</tspan></text>
<line x1="620.0" y1="558.0" x2="620.0" y2="570.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="574.0" width="360.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="620.0" y="605.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">своп і ущільнення, ще прохід</tspan></text>
<rect x="60.0" y="470.0" width="330.0" height="168.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="225.0" y="506.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Тут повертати нікуди.</tspan><tspan x="225.0" dy="17.6">Збій стався на звичайній</tspan><tspan x="225.0" dy="17.6">інструкції запису,</tspan><tspan x="225.0" dy="17.6">а в неї немає ані коду</tspan><tspan x="225.0" dy="17.6">повернення, ані errno.</tspan><tspan x="225.0" dy="17.6">Лишається чекати вічно,</tspan><tspan x="225.0" dy="17.6">панікувати — або вбити.</tspan></text>
<line x1="620.0" y1="628.0" x2="620.0" y2="660.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="390.0" y="664.0" width="460.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="620.0" y="699.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">жодної вільної сторінки нема</tspan></text>
<line x1="620.0" y1="728.0" x2="620.0" y2="748.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="420.0" y="752.0" width="400.0" height="50.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="620.0" y="782.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">OOM-killer обирає жертву</tspan></text>
</svg>