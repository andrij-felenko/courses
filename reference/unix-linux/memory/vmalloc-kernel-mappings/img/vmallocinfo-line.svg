<rect x="60.0" y="172.0" width="300.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="210.0" y="197.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">ПОЛЕ</tspan></text>
