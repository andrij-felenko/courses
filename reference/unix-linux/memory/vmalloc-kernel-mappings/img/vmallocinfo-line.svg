<rect x="60.0" y="228.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">0xffffc90019a00000-</tspan><tspan x="210.0" dy="16.9">0xffffc9001a201000</tspan></text>
<rect x="376.0" y="228.0" width="330.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="541.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">початок і кінець</tspan><tspan x="541.0" dy="16.9">адресного сліду</tspan></text>
<rect x="722.0" y="228.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">друкуються через %pK — при kptr_restrict замість них нулі;</tspan><tspan x="1041.0" dy="15.6">тільки на них тримається пошук вільних проміжків</tspan></text>
<rect x="60.0" y="332.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">8392704</tspan></text>
<rect x="376.0" y="332.0" width="330.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="541.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">той самий слід</tspan><tspan x="541.0" dy="16.9">у байтах</tspan></text>
<rect x="722.0" y="332.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="374.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">звичайне число, не %pK — підсумки за викликачами</tspan><tspan x="1041.0" dy="15.6">переживають затирання адрес і рахуються завжди</tspan></text>
<rect x="60.0" y="436.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="486.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">acme_ring_grow+0x8f/0x1e0</tspan></text>
<rect x="376.0" y="436.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="541.0" y="478.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">хто просив: символ,</tspan><tspan x="541.0" dy="16.9">зміщення, розмір функції</tspan></text>
<rect x="722.0" y="436.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="478.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">при групуванні зміщення прибираємо — інакше кожна точка</tspan><tspan x="1041.0" dy="15.6">виклику стане окремим власником і жоден рядок не набере ваги</tspan></text>
<rect x="60.0" y="540.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="590.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">[acme_capture]</tspan></text>
<rect x="376.0" y="540.0" width="330.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="541.0" y="582.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">модуль, з якого</tspan><tspan x="541.0" dy="16.9">викликали</tspan></text>
<rect x="722.0" y="540.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="590.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">буває не завжди; коли є — найкоротший шлях до винного</tspan></text>
<rect x="60.0" y="644.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="694.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">pages=2048</tspan></text>
<rect x="376.0" y="644.0" width="330.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="541.0" y="694.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">кадрів під даними</tspan></text>
<rect x="722.0" y="644.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="686.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">слід рівно на одну сторінку більший — за кінцем ділянки</tspan><tspan x="1041.0" dy="15.6">стоїть сторожова; у рядків ioremap цього поля немає взагалі</tspan></text>
