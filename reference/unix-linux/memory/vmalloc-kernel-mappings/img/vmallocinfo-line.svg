<rect x="376.0" y="748.0" width="330.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="541.0" y="790.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">яким шляхом</tspan><tspan x="541.0" dy="16.9">узято ділянку</tspan></text>
<rect x="722.0" y="748.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="798.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">буває ще vmap, ioremap, user, vpages, dma-coherent</tspan></text>
<rect x="60.0" y="852.0" width="300.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="902.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">N0=2048</tspan></text>
<rect x="376.0" y="852.0" width="330.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="541.0" y="894.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="541.0" dy="0.0">скільки кадрів</tspan><tspan x="541.0" dy="16.9">з якого вузла NUMA</tspan></text>
<rect x="722.0" y="852.0" width="638.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="902.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">з'являється лише на ядрах, зібраних із підтримкою NUMA</tspan></text>
<rect x="60.0" y="964.0" width="1300.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="710.0" y="996.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ще дві форми рядка викликача не мають узагалі: «vm_map_ram» — дрібні відображення</tspan><tspan x="710.0" dy="18.2">із запасу свого ядра процесора, «unpurged vm_area» — уже звільнене, ще не вичищене</tspan></text>
