<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш об'єктів, його слаби і список вільних слотів усередині слаба</text>
<rect x="60.0" y="44.0" width="1080.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">КЕШ ОБ'ЄКТІВ ОДНОГО ТИПУ — усі слоти в ньому однакового розміру</tspan></text>
<rect x="60.0" y="124.0" width="340.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="230.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">ПОВНІ СЛАБИ</tspan></text>
<rect x="60.0" y="174.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">вільних слотів немає —</tspan><tspan x="230.0" dy="15.6">роздавати з них нічого</tspan></text>
<rect x="430.0" y="124.0" width="340.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="600.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ЧАСТКОВІ СЛАБИ</tspan></text>
<rect x="430.0" y="174.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">є і зайняті, і вільні слоти —</tspan><tspan x="600.0" dy="15.6">саме звідси беруть</tspan></text>
<rect x="800.0" y="124.0" width="340.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">ПОРОЖНІ СЛАБИ</tspan></text>
<rect x="800.0" y="174.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="970.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">усі слоти вільні — сторінки</tspan><tspan x="970.0" dy="15.6">можна віддати назад</tspan></text>
<text x="600.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">один частковий слаб зблизька: суцільний блок сторінок, порізаний на слоти</text>
<rect x="100.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="150.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">зайнято</tspan></text>
<rect x="200.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="250.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">зайнято</tspan></text>
<rect x="300.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="350.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="350.0" dy="0.0">вільно</tspan></text>
<rect x="400.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="450.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">зайнято</tspan></text>
<rect x="500.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="550.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">зайнято</tspan></text>
<rect x="600.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="650.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="650.0" dy="0.0">вільно</tspan></text>
<rect x="700.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="750.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">зайнято</tspan></text>
<rect x="800.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="850.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="850.0" dy="0.0">вільно</tspan></text>
<rect x="900.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="950.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="950.0" dy="0.0">вільно</tspan></text>
<rect x="1000.0" y="290.0" width="100.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="1050.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">зайнято</tspan></text>
<line x1="350.0" y1="394.0" x2="350.0" y2="432.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="650.0" y1="394.0" x2="650.0" y2="432.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="850.0" y1="394.0" x2="850.0" y2="432.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="950.0" y1="394.0" x2="950.0" y2="432.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="350.0" y1="432.0" x2="646.0" y2="432.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="432.0" x2="846.0" y2="432.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="850.0" y1="432.0" x2="946.0" y2="432.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="410.0" width="200.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="170.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">голова списку</tspan></text>
<line x1="276.0" y1="432.0" x2="346.0" y2="432.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1010.0" y="410.0" width="130.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="1075.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1075.0" dy="0.0">кінець</tspan></text>
<line x1="950.0" y1="432.0" x2="1006.0" y2="432.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">у вільному слоті лежить не об'єкт, а адреса наступного вільного слота</text>
<rect x="60.0" y="520.0" width="1080.0" height="96.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="564.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">звідси все й береться: розмір однаковий — шукати придатний шматок не треба;</tspan><tspan x="600.0" dy="16.9">список вільних живе всередині самих вільних слотів — окремої пам'яті на облік нема</tspan></text>
<text x="600.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">виділення — це зняти голову списку; звільнення — покласти слот назад у голову</text>
</svg>