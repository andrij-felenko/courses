<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 727.92" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="727.92" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари, якими спускається виділення об'єкта в ядрі</text>
<text x="590.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">виділення шукає вільний слот згори вниз і зупиняється на першому, де його знайшло</text>
<rect x="60.0" y="96.0" width="300.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="210.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">куди звертаємось</tspan></text>
<rect x="380.0" y="96.0" width="430.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="595.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">що там лежить</tspan></text>
<rect x="830.0" y="96.0" width="290.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="975.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">ціна</tspan></text>
<rect x="60.0" y="162.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="210.0" y="212.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">власний слаб цього процесора</tspan></text>
<rect x="380.0" y="162.0" width="430.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="595.0" y="204.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">вершина списку вільних слотів,</tspan><tspan x="595.0" dy="15.6">вже прив'язана саме до цього ядра</tspan></text>
<rect x="830.0" y="162.0" width="290.0" height="92.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="975.0" y="204.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">кілька інструкцій,</tspan><tspan x="975.0" dy="15.6">без жодного замка</tspan></text>
<rect x="60.0" y="266.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="210.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">часткові слаби цього процесора</tspan></text>
<rect x="380.0" y="266.0" width="430.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="595.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">невеликий запас слабів, у яких</tspan><tspan x="595.0" dy="15.6">ще лишилися вільні слоти</tspan></text>
<rect x="830.0" y="266.0" width="290.0" height="92.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="975.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">перемкнути вказівник</tspan><tspan x="975.0" dy="15.6">на наступний слаб</tspan></text>
<rect x="60.0" y="370.0" width="300.0" height="92.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.7"/><text x="210.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">часткові слаби вузла пам'яті</tspan></text>
<rect x="380.0" y="370.0" width="430.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="595.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">спільний запас на всі ядра вузла;</tspan><tspan x="595.0" dy="15.6">тут уже треба домовлятися</tspan></text>
<rect x="830.0" y="370.0" width="290.0" height="92.0" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/><text x="975.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">замок вузла —</tspan><tspan x="975.0" dy="15.6">є за що конкурувати</tspan></text>
<rect x="60.0" y="474.0" width="300.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="210.0" y="524.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">сторінковий алокатор</tspan></text>
<rect x="380.0" y="474.0" width="430.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="595.0" y="516.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">нового слаба немає — треба взяти</tspan><tspan x="595.0" dy="15.6">суцільний блок 2ⁿ сторінок</tspan></text>
<rect x="830.0" y="474.0" width="290.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="975.0" y="516.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">найдорожче: аж до</tspan><tspan x="975.0" dy="15.6">витіснення й ущільнення</tspan></text>
<rect x="60.0" y="588.0" width="1060.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="590.0" y="624.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">звільнення йде іншим шляхом: об'єкт завжди повертається у власний слаб,</tspan><tspan x="590.0" dy="16.9">тому пам'ять не зависає в чужій черзі й видно, який слаб уже цілком вільний</tspan></text>
<text x="590.0" y="706.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">верхній рядок обслуговує переважну більшість викликів — усе інше є запасним шляхом</text>
</svg>