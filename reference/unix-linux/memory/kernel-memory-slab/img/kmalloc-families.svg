<rect x="60.0" y="254.0" width="700.0" height="58.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="410.0" y="279.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">96 і 192 — не степені двійки: щаблі додано там, де округлення коштувало б удвічі</tspan><tspan x="410.0" dy="15.6">понад 8 КіБ kmalloc іде просто в сторінковий роздавач — блок 2ⁿ сторінок, стеля 4 МіБ</tspan></text>
<text x="620.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">СІМЕЙСТВА: ті самі щаблі, різні кеші — сімейство обирає прапорець запиту</text>
