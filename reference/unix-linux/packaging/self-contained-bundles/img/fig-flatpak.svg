<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Flatpak: OSTree, Bubblewrap та Desktop Portals</text>
<rect x="50.0" y="70.0" width="1220.0" height="75.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Сховище OSTree (Flathub / Локальне сховище)</tspan><tspan x="660.0" dy="16.9">Атомарні оновлення, дедуплікація блоків даних за хешами content-addressable storage</tspan></text>
<line x1="350.0" y1="145.0" x2="350.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="145.0" x2="970.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="180.0" width="600.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Застосунок (Application Bundle /app)</tspan><tspan x="350.0" dy="16.9">Містить специфічні бінарники, конфігурації</tspan><tspan x="350.0" dy="16.9">та унікальні для програми залежності</tspan></text>
<rect x="670.0" y="180.0" width="600.0" height="95.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Спільний рантайм (Shared Runtime /usr)</tspan><tspan x="970.0" dy="16.9">Базовий стек: GNOME / KDE / Freedesktop SDK</tspan><tspan x="970.0" dy="16.9">Спільні версії glibc, Mesa, Wayland, Qt/GTK</tspan></text>
<rect x="50.0" y="310.0" width="780.0" height="260.0" rx="8" fill="#fafafa" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Пісочниця Bubblewrap (bwrap)</text>
<rect x="70.0" y="355.0" width="350.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="378.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Mount Namespace</tspan><tspan x="245.0" dy="15.6">• /usr ← змонтовано з Runtime (RO)</tspan><tspan x="245.0" dy="15.6">• /app ← змонтовано з App (RO)</tspan><tspan x="245.0" dy="15.6">• /var ← ізольовані налаштування</tspan></text>
<rect x="450.0" y="355.0" width="360.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Network &amp; PID Namespaces</tspan><tspan x="630.0" dy="15.6">Ізольований простір процесів;</tspan><tspan x="630.0" dy="15.6">доступ до мережі за правилами маніфесту</tspan></text>
<rect x="70.0" y="460.0" width="740.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="492.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Ізольований процес застосунку</tspan><tspan x="440.0" dy="16.9">Не має прямого доступу до файлів хост-системи ($HOME, /etc, /var/log),</tspan><tspan x="440.0" dy="16.9">системних пристроїв та чужих процесів</tspan></text>
<line x1="830.0" y1="480.0" x2="890.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="860.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">D-Bus</text>
<rect x="890.0" y="310.0" width="380.0" height="260.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="1080.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">XDG Desktop Portals</text>
<rect x="910.0" y="355.0" width="340.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1080.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">Безпечна взаємодія з хостом:</tspan><tspan x="1080.0" dy="15.6">• FileChooser Portal (діалог файлів)</tspan><tspan x="1080.0" dy="15.6">• Camera / Microphones Portal</tspan><tspan x="1080.0" dy="15.6">• ScreenCast / Screenshot Portal</tspan><tspan x="1080.0" dy="15.6">• OpenURI Portal (браузер)</tspan><tspan x="1080.0" dy="15.6">• Print Portal (друк)</tspan><tspan x="1080.0" dy="15.6">Запит підтвердження у користувача</tspan></text>
</svg>