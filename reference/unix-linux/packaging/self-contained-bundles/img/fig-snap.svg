<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Snap: snapd, loop-пристрої та confinement</text>
<rect x="50.0" y="70.0" width="580.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Пакунок .snap (SquashFS образ)</tspan><tspan x="340.0" dy="16.9">Стиснена бінарна файлова система з метаданими snapcraft.yaml,</tspan><tspan x="340.0" dy="16.9">підписана цифровим підписом Snap Store</tspan></text>
<line x1="630.0" y1="120.0" x2="690.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">управління</text>
<rect x="690.0" y="70.0" width="580.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Системний демон snapd (systemd service)</tspan><tspan x="980.0" dy="16.9">Перевіряє підписи, керує loop-пристроями, поверненням версій (revert)</tspan><tspan x="980.0" dy="16.9">та збіркою AppArmor/seccomp профілів</tspan></text>
<line x1="340.0" y1="170.0" x2="340.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="1220.0" height="130.0" rx="8" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/>
<text x="660.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядерне монтування через loop-пристрої (/dev/loopN)</text>
<rect x="70.0" y="255.0" width="360.0" height="70.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Base Snap (напр. core22)</tspan><tspan x="250.0" dy="15.6">Монтується в /snap/core22/rev</tspan><tspan x="250.0" dy="15.6">Містить базу Ubuntu / glibc</tspan></text>
<rect x="480.0" y="255.0" width="360.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">App Snap (напр. firefox)</tspan><tspan x="660.0" dy="15.6">Монтується в /snap/firefox/rev</tspan><tspan x="660.0" dy="15.6">Містить бінарний файл застосунку</tspan></text>
<rect x="890.0" y="255.0" width="360.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">Shared Mount points</tspan><tspan x="1070.0" dy="15.6">Монтується через bind-mounts у</tspan><tspan x="1070.0" dy="15.6">користувацьке середовище виконання</tspan></text>
<line x1="660.0" y1="340.0" x2="660.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="375.0" width="590.0" height="220.0" rx="8" fill="#fafafa" stroke="#c0392b" stroke-width="2.0"/>
<text x="345.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Обмеження безпеки (Confinement)</text>
<rect x="70.0" y="420.0" width="550.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="345.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">• AppArmor Profiles: контроль доступу до файлів, dmesg, ptrace</tspan><tspan x="345.0" dy="15.6">• Seccomp Filters: обмеження дозволених системних викликів</tspan><tspan x="345.0" dy="15.6">• Mount Namespaces: ізольоване бачення файлового дерева</tspan><tspan x="345.0" dy="15.6">• Режими: Strict (повна ізоляція), Classic (повний доступ хоста),</tspan><tspan x="345.0" dy="15.6">  Devmode (режим розробки без блокувань)</tspan></text>
<rect x="680.0" y="375.0" width="590.0" height="220.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="975.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система інтерфейсів (Plugs &amp; Slots)</text>
<rect x="700.0" y="420.0" width="550.0" height="160.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="975.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">З'єднання між застосунком (Plug) та системою/іншим Snap (Slot):</tspan><tspan x="975.0" dy="15.6">• home (доступ до тек користувача)</tspan><tspan x="975.0" dy="15.6">• network / network-bind (мережеві сокети)</tspan><tspan x="975.0" dy="15.6">• desktop / wayland (графічний вивід)</tspan><tspan x="975.0" dy="15.6">• removable-media (доступ до /media, /run/media)</tspan><tspan x="975.0" dy="15.6">Автоматичне або ручне підключення (`snap connect`)</tspan></text>
</svg>