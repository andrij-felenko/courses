<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg">
    <rect width="840" height="380" fill="#f8f9fa" rx="10" stroke="#dee2e6" stroke-width="2"/>
    <text x="420" y="35" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Анатомія бінарних пакунків: .deb та .rpm</text>
    
    <!-- DEB Block -->
    <g transform="translate(20, 55)">
        <rect width="385" height="300" fill="#ffffff" stroke="#0d6efd" stroke-width="2" rx="8"/>
        <rect width="385" height="40" fill="#0d6efd" rx="8"/>
        <rect y="20" width="385" height="20" fill="#0d6efd"/>
        <text x="192" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">DEB Container (ar archive)</text>
        
        <!-- debian-binary -->
        <rect x="15" y="55" width="355" height="50" fill="#e7f1ff" stroke="#9ec5fe" stroke-width="1.5" rx="5"/>
        <text x="30" y="77" font-family="sans-serif" font-size="14" font-weight="bold" fill="#084298">debian-binary</text>
        <text x="30" y="94" font-family="sans-serif" font-size="12" fill="#495057">Текстовий файл версії формату ("2.0
")</text>
        
        <!-- control.tar.* -->
        <rect x="15" y="118" width="355" height="80" fill="#e7f1ff" stroke="#9ec5fe" stroke-width="1.5" rx="5"/>
        <text x="30" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#084298">control.tar.xz / .gz</text>
        <text x="30" y="159" font-family="sans-serif" font-size="12" fill="#212529">Метадані та скрипти: control, md5sums,</text>
        <text x="30" y="176" font-family="sans-serif" font-size="12" fill="#212529">preinst, postinst, prerm, postrm, triggers</text>
        
        <!-- data.tar.* -->
        <rect x="15" y="211" width="355" height="75" fill="#e7f1ff" stroke="#9ec5fe" stroke-width="1.5" rx="5"/>
        <text x="30" y="233" font-family="sans-serif" font-size="14" font-weight="bold" fill="#084298">data.tar.xz / .zst</text>
        <text x="30" y="252" font-family="sans-serif" font-size="12" fill="#212529">Файлове навантаження системи (/usr, /etc...)</text>
        <text x="30" y="269" font-family="sans-serif" font-size="12" fill="#495057">Дерево каталогів для розпакування у /</text>
    </g>
    
    <!-- RPM Block -->
    <g transform="translate(435, 55)">
        <rect width="385" height="300" fill="#ffffff" stroke="#dc3545" stroke-width="2" rx="8"/>
        <rect width="385" height="40" fill="#dc3545" rx="8"/>
        <rect y="20" width="385" height="20" fill="#dc3545"/>
        <text x="192" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">RPM Structure (Binary Container)</text>
        
        <!-- RPM Lead & Signature -->
        <rect x="15" y="55" width="355" height="50" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1.5" rx="5"/>
        <text x="30" y="77" font-family="sans-serif" font-size="14" font-weight="bold" fill="#842029">Lead (96B) &amp; Signature</text>
        <text x="30" y="94" font-family="sans-serif" font-size="12" fill="#495057">Magic `ed ab ee db`, PGPSIG, SHA256 хеші</text>
        
        <!-- Header -->
        <rect x="15" y="118" width="355" height="80" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1.5" rx="5"/>
        <text x="30" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#842029">Header (Tag-based Metadata)</text>
        <text x="30" y="159" font-family="sans-serif" font-size="12" fill="#212529">Теги (Name, Version, Requires, %pre/%post),</text>
        <text x="30" y="176" font-family="sans-serif" font-size="12" fill="#212529">індекси файлів, власників та режимів доступу</text>
        
        <!-- Payload -->
        <rect x="15" y="211" width="355" height="75" fill="#f8d7da" stroke="#f5c2c7" stroke-width="1.5" rx="5"/>
        <text x="30" y="233" font-family="sans-serif" font-size="14" font-weight="bold" fill="#842029">Payload (cpio archive)</text>
        <text x="30" y="252" font-family="sans-serif" font-size="12" fill="#212529">Стиснений cpio (gz, xz, zstd)</text>
        <text x="30" y="269" font-family="sans-serif" font-size="12" fill="#495057">Бінарний потік файлових об'єктів</text>
    </g>
</svg>