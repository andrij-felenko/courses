<rect x="290.0" y="230.6" width="380.0" height="78.8" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="480.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Захист від атак (Man-in-the-Middle &amp; Downgrade)</tspan><tspan x="480.0" dy="15.6">• Valid-Until: захист від застарілих індексів</tspan><tspan x="480.0" dy="15.6">• SHA-256: захист від підміни пакунка на дзеркалі</tspan><tspan x="480.0" dy="15.6">• GPG підпис: гарантія авторства мейнтейнера</tspan></text>
