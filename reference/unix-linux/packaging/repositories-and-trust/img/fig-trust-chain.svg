<rect x="27.7" y="98.2" width="264.5" height="83.7" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Розробник / Signing Server</tspan><tspan x="160.0" dy="16.9">• Закритий ключ GPG (Private Key)</tspan><tspan x="160.0" dy="16.9">• Створення Release/InRelease</tspan><tspan x="160.0" dy="16.9">• Обчислення SHA-256 індексів</tspan></text>
