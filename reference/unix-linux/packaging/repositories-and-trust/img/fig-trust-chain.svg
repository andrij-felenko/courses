<rect x="678.9" y="98.2" width="242.3" height="83.7" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="800.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Локальна система (APT / DNF)</tspan><tspan x="800.0" dy="16.9">• /etc/apt/keyrings/docker.gpg</tspan><tspan x="800.0" dy="16.9">• Вказівка [signed-by=...]</tspan><tspan x="800.0" dy="16.9">• Перевірка підпису та хешів</tspan></text>
