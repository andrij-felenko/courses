<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація комбінованих викликів у Multiarch</text>
<rect x="40.0" y="70.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="155.0" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Компілятор / Завантажувач</tspan><tspan x="155.0" dy="11.7">gcc -m32  або  gcc -m64</tspan><tspan x="155.0" dy="11.7">ld-linux.so.2 / ld-linux-x86-64.so.2</tspan></text>
<line x1="270.0" y1="115.0" x2="340.0" y2="115.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="305.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Архітектура</text>
<rect x="340.0" y="70.0" width="160.0" height="90.0" rx="6" fill="#fff8e7" stroke="#f39c12" stroke-width="1.5"/><text x="420.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">GNU Triplet</tspan><tspan x="420.0" dy="15.6">Selector</tspan><tspan x="420.0" dy="15.6">(i386 vs x86_64</tspan><tspan x="420.0" dy="15.6">vs aarch64)</tspan></text>
<line x1="500.0" y1="95.0" x2="570.0" y2="95.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="70.0" width="230.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">i386-linux-gnu</tspan><tspan x="685.0" dy="14.3">/usr/lib/i386-linux-gnu/</tspan><tspan x="685.0" dy="14.3">/usr/include/i386-linux-gnu/</tspan></text>
<line x1="500.0" y1="135.0" x2="570.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="150.0" width="230.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="685.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">x86_64-linux-gnu</tspan><tspan x="685.0" dy="14.3">/usr/lib/x86_64-linux-gnu/</tspan><tspan x="685.0" dy="14.3">/usr/include/x86_64-linux-gnu/</tspan></text>
<line x1="420.0" y1="160.0" x2="420.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="420.0" y1="250.0" x2="570.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="225.0" width="230.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">aarch64-linux-gnu</tspan><tspan x="685.0" dy="14.3">/usr/lib/aarch64-linux-gnu/</tspan><tspan x="685.0" dy="14.3">/usr/include/aarch64-linux-gnu/</tspan></text>
<rect x="40.0" y="290.0" width="760.0" height="95.0" rx="6" fill="#f9f9f9" stroke="#6b7280" stroke-width="1.2"/><text x="420.0" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Пакетний менеджер dpkg керує метаданими за допомогою прапорців Multi-Arch:</tspan><tspan x="420.0" dy="15.0">• Multi-Arch: same — паралельне встановлення бібліотек однакової версії для різних триплетів</tspan><tspan x="420.0" dy="15.0">• Multi-Arch: foreign — нативна утиліта (наприклад python3), що задовольняє залежності чужої архітектури</tspan><tspan x="420.0" dy="15.0">• Multi-Arch: allowed — пакет може виступати в обох ролях залежно від запиту залежного пакета</tspan></text>
</svg>