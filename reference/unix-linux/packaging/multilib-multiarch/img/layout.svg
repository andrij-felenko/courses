<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; }
      .box { fill: #f0f0f0; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
      .text { font-size: 14px; }
      .code { font-family: monospace; font-size: 12px; }
    </style>
  </defs>

  <text x="200" y="30" class="title" text-anchor="middle">RPM Multilib</text>
  <text x="600" y="30" class="title" text-anchor="middle">Debian Multiarch</text>

  <!-- Multilib -->
  <rect x="50" y="60" width="300" height="300" class="box" />
  <text x="60" y="90" class="text">/usr/</text>
  <text x="80" y="115" class="code">├── lib/</text>
  <text x="110" y="140" class="text">(32-bit libraries)</text>
  <text x="110" y="165" class="code">│   └── libc.so.6</text>
  <text x="80" y="195" class="code">├── lib64/</text>
  <text x="110" y="220" class="text">(64-bit libraries)</text>
  <text x="110" y="245" class="code">│   └── libc.so.6</text>
  <text x="80" y="275" class="code">└── include/</text>
  <text x="110" y="300" class="text">(Shared headers! Conflict risk)</text>
  <text x="110" y="325" class="code">    └── stdio.h</text>

  <!-- Multiarch -->
  <rect x="450" y="60" width="300" height="300" class="box" />
  <text x="460" y="90" class="text">/usr/</text>
  <text x="480" y="115" class="code">├── lib/</text>
  <text x="510" y="140" class="code">├── i386-linux-gnu/</text>
  <text x="540" y="165" class="text">(32-bit libs)</text>
  <text x="510" y="190" class="code">└── x86_64-linux-gnu/</text>
  <text x="540" y="215" class="text">(64-bit libs)</text>
  <text x="480" y="250" class="code">├── include/</text>
  <text x="510" y="275" class="code">├── i386-linux-gnu/</text>
  <text x="510" y="300" class="code">└── x86_64-linux-gnu/</text>
  <text x="540" y="325" class="text">(Headers split! No conflicts)</text>
</svg>
