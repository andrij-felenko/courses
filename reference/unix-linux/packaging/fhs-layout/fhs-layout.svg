<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <rect width="100%" height="100%" fill="#ffffff" />
    <g font-family="sans-serif" font-size="14">
        <!-- Root -->
        <rect x="50" y="50" width="60" height="30" fill="#e0e0e0" stroke="#000" rx="5" />
        <text x="80" y="70" text-anchor="middle" font-weight="bold">/</text>

        <!-- Level 1 -->
        <!-- /usr -->
        <path d="M80 80 L80 120 L200 120 L200 150" fill="none" stroke="#000" stroke-width="2" />
        <rect x="170" y="150" width="60" height="30" fill="#cce5ff" stroke="#000" rx="5" />
        <text x="200" y="170" text-anchor="middle">/usr</text>

        <!-- /var -->
        <path d="M80 80 L80 120 L400 120 L400 150" fill="none" stroke="#000" stroke-width="2" />
        <rect x="370" y="150" width="60" height="30" fill="#ffcce5" stroke="#000" rx="5" />
        <text x="400" y="170" text-anchor="middle">/var</text>

        <!-- /etc -->
        <path d="M80 80 L80 120 L600 120 L600 150" fill="none" stroke="#000" stroke-width="2" />
        <rect x="570" y="150" width="60" height="30" fill="#e5ffcc" stroke="#000" rx="5" />
        <text x="600" y="170" text-anchor="middle">/etc</text>

        <!-- /bin (usrmerge) -->
        <path d="M80 120 L100 120 L100 250" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="5,5" />
        <rect x="70" y="250" width="60" height="30" fill="#f0f0f0" stroke="#000" rx="5" stroke-dasharray="2,2" />
        <text x="100" y="270" text-anchor="middle">/bin</text>
        <path d="M130 265 L170 265" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
        <text x="150" y="260" font-size="10" text-anchor="middle">symlink</text>
        <rect x="170" y="250" width="60" height="30" fill="#cce5ff" stroke="#000" rx="5" />
        <text x="200" y="270" text-anchor="middle">/usr/bin</text>

        <!-- usrmerge connections -->
        <path d="M200 180 L200 250" fill="none" stroke="#000" stroke-width="2" />
    </g>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
        </marker>
    </defs>
</svg>