<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">процесор</text>
<text x="40.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">GPU</text>
<rect x="160.0" y="96.0" width="220.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">будує кадр N</tspan></text>
<rect x="380.0" y="96.0" width="220.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">кадр N+1</tspan></text>
<rect x="600.0" y="96.0" width="220.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">кадр N+2</tspan></text>
<rect x="390.0" y="208.0" width="310.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">виконує кадр N</tspan></text>
<rect x="700.0" y="208.0" width="310.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="855.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">виконує кадр N+1</tspan></text>
<line x1="380.0" y1="152.0" x2="380.0" y2="202.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="380.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">подання N</text>
<line x1="600.0" y1="152.0" x2="600.0" y2="202.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="600.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">подання N+1</text>
<text x="650.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">подання N+1 приходить, поки GPU ще жує кадр N, — цю різницю завдання пересидить у планувальнику</text>
<line x1="160.0" y1="344.0" x2="1050.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1062.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">час</text>
<text x="40.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Глибина конвеєра — це і є запас, за рахунок якого GPU не простоює; платить за неї затримка кадру.</text>
