<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія бінарного блоку оверлею (DTBO) та метаданих компілятора dtc</text>
<rect x="40.0" y="80.0" width="380.0" height="540.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Вихідний текст оверлею (.dts)</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">/dts-v1/;</tspan><tspan x="230.0" dy="15.6">/plugin/;</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">/ {</tspan><tspan x="230.0" dy="15.6">    fragment@0 {</tspan><tspan x="230.0" dy="15.6">        target = &lt;&amp;i2c1&gt;;</tspan><tspan x="230.0" dy="15.6">        __overlay__ {</tspan><tspan x="230.0" dy="15.6">            #address-cells = &lt;1&gt;;</tspan><tspan x="230.0" dy="15.6">            #size-cells = &lt;0&gt;;</tspan><tspan x="230.0" dy="15.6">            sensor: temp-sensor@48 {</tspan><tspan x="230.0" dy="15.6">                compatible = &quot;ti,tmp102&quot;;</tspan><tspan x="230.0" dy="15.6">                reg = &lt;0x48&gt;;</tspan><tspan x="230.0" dy="15.6">                interrupt-parent = &lt;&amp;gpio2&gt;;</tspan><tspan x="230.0" dy="15.6">                interrupts = &lt;12 1&gt;;</tspan><tspan x="230.0" dy="15.6">            };</tspan><tspan x="230.0" dy="15.6">        };</tspan><tspan x="230.0" dy="15.6">    };</tspan><tspan x="230.0" dy="15.6">};</tspan></text>
<line x1="430.0" y1="350.0" x2="510.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.1" y="286.4" width="99.8" height="37.3" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">компілятор dtc</tspan><tspan x="470.0" dy="14.3">з прапором -@</tspan></text>
<rect x="520.0" y="80.0" width="680.0" height="540.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="540.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Бінарна структура .dtbo в пам'яті (Flattened Tree)</text>
<rect x="540.0" y="135.0" width="640.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Заголовок fdt_header (magic 0xd00dfeed, totalsize, off_dt_struct)</tspan></text>
<rect x="540.0" y="195.0" width="640.0" height="120.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Вузол fragment@0 &amp; __overlay__</tspan><tspan x="860.0" dy="15.6">  • target = &lt;0x00000000&gt; (тимчасовий phandle-заповнювач)</tspan><tspan x="860.0" dy="15.6">  • sensor: temp-sensor@48 (опис доданого пристрою)</tspan><tspan x="860.0" dy="15.6">    - interrupt-parent = &lt;0x00000000&gt; (тимчасовий phandle)</tspan></text>
<rect x="540.0" y="325.0" width="640.0" height="70.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Вузол __symbols__ (локальні мітки оверлею)</tspan><tspan x="860.0" dy="15.6">  • sensor = &quot;/fragment@0/__overlay__/temp-sensor@48&quot;</tspan></text>
<rect x="540.0" y="405.0" width="640.0" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="443.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Вузол __fixups__ (посилання на мітки базового дерева)</tspan><tspan x="860.0" dy="15.6">  • i2c1 = &quot;/fragment@0:target:0&quot;</tspan><tspan x="860.0" dy="15.6">  • gpio2 = &quot;/fragment@0/__overlay__/temp-sensor@48:interrupt-parent:0&quot;</tspan></text>
<rect x="540.0" y="515.0" width="640.0" height="85.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="553.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Вузол __local_fixups__ (внутрішні phandle в оверлеї)</tspan><tspan x="860.0" dy="15.6">  • містить зсуви локальних phandle для перерахунку при завантаженні</tspan></text>
</svg>