<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три покоління інтерфейсу налаштування термінала</text>
<line x1="140.0" y1="48.0" x2="1030.0" y2="48.0" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="245.0" cy="48.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="245.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1975—1979</text>
<circle cx="470.0" cy="48.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1981</text>
<circle cx="695.0" cy="48.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="695.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1983</text>
<circle cx="920.0" cy="48.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="920.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1988</text>
<line x1="245.0" y1="54.0" x2="245.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="140.0" y="70.0" width="210.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Sixth і Seventh</tspan><tspan x="245.0" dy="16.9">Edition Unix: sgtty</tspan></text>
<rect x="140.0" y="146.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">stty() і gtty() — окремі</tspan><tspan x="245.0" dy="15.6">системні виклики; від V7 —</tspan><tspan x="245.0" dy="15.6">ioctl(TIOCSETP, &amp;sgttyb)</tspan></text>
<rect x="140.0" y="246.0" width="210.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">три режими вводу:</tspan><tspan x="245.0" dy="15.6">cooked, cbreak, raw;</tspan><tspan x="245.0" dy="15.6">стирання «#», кілл «@»</tspan></text>
<line x1="470.0" y1="54.0" x2="470.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="365.0" y="70.0" width="210.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">System III →</tspan><tspan x="470.0" dy="16.9">System V: termio</tspan></text>
<rect x="365.0" y="146.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ioctl(TCSETA, &amp;termio):</tspan><tspan x="470.0" dy="15.6">один виклик замість</tspan><tspan x="470.0" dy="15.6">розсипу окремих команд</tspan></text>
<rect x="365.0" y="246.0" width="210.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">два режими: канонічний</tspan><tspan x="470.0" dy="15.6">і неканонічний, а замість</tspan><tspan x="470.0" dy="15.6">межі рядка — VMIN і VTIME</tspan></text>
<line x1="695.0" y1="54.0" x2="695.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="590.0" y="70.0" width="210.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">4.2BSD: новий</tspan><tspan x="695.0" dy="16.9">драйвер термінала</tspan></text>
<rect x="590.0" y="146.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="695.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">ioctl-ів більшає —</tspan><tspan x="695.0" dy="15.6">TIOCSETC, TIOCSLTC,</tspan><tspan x="695.0" dy="15.6">TIOCLSET, TIOCLBIS</tspan></text>
<rect x="590.0" y="246.0" width="210.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="695.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">керування завданнями:</tspan><tspan x="695.0" dy="15.6">Ctrl+Z, стирання слова,</tspan><tspan x="695.0" dy="15.6">повтор набраного рядка</tspan></text>
<line x1="920.0" y1="54.0" x2="920.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="815.0" y="70.0" width="210.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">POSIX.1-1988:</tspan><tspan x="920.0" dy="16.9">termios</tspan></text>
<rect x="815.0" y="146.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">tcsetattr(fd, TCSANOW, &amp;tio)</tspan><tspan x="920.0" dy="15.6">— іменована функція,</tspan><tspan x="920.0" dy="15.6">переносні типи tcflag_t</tspan></text>
<rect x="815.0" y="246.0" width="210.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">один опис термінала</tspan><tspan x="920.0" dy="15.6">на всі Unix; надбання BSD</tspan><tspan x="920.0" dy="15.6">влилися в нього пізніше</tspan></text>
<text x="122.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700"><tspan x="122.0" dy="0.0">чим</tspan><tspan x="122.0" dy="15.6">налаштовували</tspan></text>
<text x="122.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700"><tspan x="122.0" dy="0.0">що покоління</tspan><tspan x="122.0" dy="15.6">принесло</tspan></text>
<rect x="16.0" y="356.0" width="1028.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Жоден набір вимикачів не зникав: cooked став ICANON, raw — викликом cfmakeraw(),</tspan><tspan x="530.0" dy="16.9">а те, що додав BSD, повернулося в termios уже після стандарту</tspan></text>
</svg>