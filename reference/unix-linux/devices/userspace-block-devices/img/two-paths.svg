<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 1010" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="1010" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного запиту через NBD і через ublk</text>
<text x="340.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">NBD: межа — сокет</text>
<text x="1000.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ublk: межа — спільна пам'ять і кільце</text>
<line x1="670.0" y1="70.0" x2="670.0" y2="940.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>
<rect x="251.9" y="101.0" width="176.2" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">запит у черзі blk-mq</tspan><tspan x="340.0" dy="16.9">до /dev/nbd0</tspan></text>
<line x1="340.0" y1="166.9" x2="340.0" y2="182.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.2" y="190.0" width="183.6" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">драйвер nbd складає</tspan><tspan x="340.0" dy="16.9">28-байтовий заголовок</tspan></text>
<text x="340.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дані запиту копіюються в буфери сокета</text>
<line x1="340.0" y1="285.9" x2="340.0" y2="300.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="207.4" y="308.9" width="265.1" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">мережевий стек</tspan><tspan x="340.0" dy="16.9">(навіть якщо це петля 127.0.0.1)</tspan></text>
<text x="340.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сегментація, контрольні суми,</text>
<text x="340.0" y="407.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">черги передавання</text>
<line x1="340.0" y1="421.8" x2="340.0" y2="436.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="233.4" y="444.9" width="213.2" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="469.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">сервер: read() заголовка,</tspan><tspan x="340.0" dy="16.9">read() даних</tspan></text>
<text x="340.0" y="526.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">друга копія — уже в пам'ять сервера</text>
<line x1="340.0" y1="540.8" x2="340.0" y2="555.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="255.6" y="563.8" width="168.8" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="588.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">обслуговування</tspan><tspan x="340.0" dy="16.9">і write() відповіді</tspan></text>
<text x="340.0" y="645.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">щонайменше три системні виклики на запит</text>
<rect x="908.2" y="101.0" width="183.6" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">запит у черзі blk-mq</tspan><tspan x="1000.0" dy="16.9">до /dev/ublkb0, тег N</tspan></text>
<line x1="1000.0" y1="166.9" x2="1000.0" y2="182.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="900.8" y="190.0" width="198.4" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">драйвер ublk заповнює</tspan><tspan x="1000.0" dy="16.9">слот N спільної ділянки</tspan></text>
<text x="1000.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">опис не пересилається — він уже видимий серверові</text>
<line x1="1000.0" y1="285.9" x2="1000.0" y2="300.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="897.1" y="308.9" width="205.8" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">завершується заздалегідь</tspan><tspan x="1000.0" dy="16.9">подана команда FETCH</tspan></text>
<text x="1000.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сповіщення = запис у кільце завершень</text>
<line x1="1000.0" y1="404.8" x2="1000.0" y2="419.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="915.6" y="427.9" width="168.8" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">сервер читає слот N</tspan><tspan x="1000.0" dy="16.9">просто з пам'яті</tspan></text>
<text x="1000.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">жодного системного виклику на здобуття опису</text>
<line x1="1000.0" y1="523.8" x2="1000.0" y2="538.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="919.3" y="546.8" width="161.4" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="571.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">обслуговування</tspan><tspan x="1000.0" dy="16.9">і COMMIT_AND_FETCH</tspan></text>
<text x="1000.0" y="628.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна операція одразу віддає результат</text>
<text x="1000.0" y="645.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">і знову озброює слот</text>
<rect x="221.1" y="903.6" width="237.7" height="52.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="340.0" y="926.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">дані: дві копії</tspan><tspan x="340.0" dy="16.2">плюс шлях крізь мережевий стек</tspan></text>
<rect x="909.6" y="903.6" width="180.8" height="52.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1000.0" y="926.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">дані: одна копія,</tspan><tspan x="1000.0" dy="16.2">а з ядра 6.15 — жодної</tspan></text>
</svg>