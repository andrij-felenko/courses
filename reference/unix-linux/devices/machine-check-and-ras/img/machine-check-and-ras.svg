<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="270" viewBox="0 0 980 270">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- 1. Hardware -->
  <rect x="15" y="90" width="150" height="64" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="90" y="118" font-family="sans-serif" font-size="13" text-anchor="middle">Збій у CPU / пам'яті</text>
  <text x="90" y="137" font-family="sans-serif" font-size="9" text-anchor="middle">(ECC виявляє)</text>

  <path d="M167,122 L196,122" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. MCA banks -->
  <rect x="200" y="90" width="150" height="64" rx="5" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="275" y="118" font-family="sans-serif" font-size="13" text-anchor="middle">MSR-банки MCA</text>
  <text x="275" y="137" font-family="sans-serif" font-size="9" text-anchor="middle">IA32_MCi_STATUS / ADDR</text>

  <path d="M352,122 L381,122" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Kernel: #MC / CMCI -->
  <rect x="385" y="90" width="150" height="64" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="460" y="118" font-family="sans-serif" font-size="13" text-anchor="middle">Ядро: #MC / CMCI</text>
  <text x="460" y="137" font-family="sans-serif" font-size="9" text-anchor="middle">do_machine_check()</text>

  <path d="M537,122 L566,122" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. EDAC -->
  <rect x="570" y="90" width="150" height="64" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="645" y="118" font-family="sans-serif" font-size="14" text-anchor="middle">EDAC</text>
  <text x="645" y="137" font-family="sans-serif" font-size="9" text-anchor="middle">адреса в канал/DIMM/ранг</text>

  <path d="M722,122 L806,122" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="764" y="108" font-family="sans-serif" font-size="10" text-anchor="middle">ras:mc_event</text>

  <!-- 5. Userspace -->
  <rect x="810" y="90" width="150" height="64" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="885" y="118" font-family="sans-serif" font-size="14" text-anchor="middle">rasdaemon</text>
  <text x="885" y="137" font-family="sans-serif" font-size="9" text-anchor="middle">простір користувача</text>

  <!-- leader: the tracing files are a KERNEL interface on this arrow -->
  <path d="M764,124 L764,170" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
  <text x="700" y="188" font-family="sans-serif" font-size="9" text-anchor="middle">/sys/kernel/tracing — файли трасування ядра</text>

  <text x="470" y="232" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ланцюжок обробки помилок MCE</text>
</svg>
