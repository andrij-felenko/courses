<rect x="720.0" y="340.0" width="300.0" height="125.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="870.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">3. Фантомні символи</tspan><tspan x="870.0" dy="15.0"></tspan><tspan x="870.0" dy="15.0">Буфер програми й екран розійшлися.</tspan><tspan x="870.0" dy="15.0">Подальший ввід перетирає сусідній</tspan><tspan x="870.0" dy="15.0">текст або лишає графічне сміття.</tspan></text>
