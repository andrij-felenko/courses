<rect x="80.0" y="340.0" width="300.0" height="125.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="230.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Програма надсилає '\b \b'</tspan><tspan x="230.0" dy="15.0"></tspan><tspan x="230.0" dy="15.0">Програма вважає, що курсор на col 10,</tspan><tspan x="230.0" dy="15.0">і надсилає '\b \b' для затирання</tspan><tspan x="230.0" dy="15.0">однієї комірки в позиції 10.</tspan></text>
