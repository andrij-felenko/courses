<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Категорії East Asian Width стандарту UAX #11</text>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація ширини символів за стандартом Unicode UAX #11</text>
<rect x="60.0" y="75.0" width="310.0" height="180.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Wide (W)  [2 комірки]</tspan><tspan x="215.0" dy="15.6"></tspan><tspan x="215.0" dy="15.6">Ієрогліфи CJK, хірагана, катакана,</tspan><tspan x="215.0" dy="15.6">повні розділові знаки. Завжди</tspan><tspan x="215.0" dy="15.6">мають подвійну ширину на сітці.</tspan></text>
<rect x="385.0" y="75.0" width="310.0" height="180.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Fullwidth (F)  [2 комірки]</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Сумісні символи повної ширини</tspan><tspan x="540.0" dy="15.6">(U+FF01–U+FF60): латиниця, цифри</tspan><tspan x="540.0" dy="15.6">для сумісності з форматом CJK.</tspan></text>
<rect x="710.0" y="75.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Narrow (Na)  [1 комірка]</tspan><tspan x="865.0" dy="15.6"></tspan><tspan x="865.0" dy="15.6">Вузькі символи, що мають повні</tspan><tspan x="865.0" dy="15.6">аналоги в CJK (напівширинна</tspan><tspan x="865.0" dy="15.6">пунктуація). Завжди 1 колонка.</tspan></text>
<rect x="60.0" y="285.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Halfwidth (H)  [1 комірка]</tspan><tspan x="215.0" dy="15.6"></tspan><tspan x="215.0" dy="15.6">Напівширинні сумісні символи</tspan><tspan x="215.0" dy="15.6">(напівширинна катакана U+FF61,</tspan><tspan x="215.0" dy="15.6">хангиль). Завжди 1 колонка.</tspan></text>
<rect x="385.0" y="285.0" width="310.0" height="180.0" rx="6" fill="#fff8e6" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Ambiguous (A)  [1 або 2 комірки]</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Грецькі, кириличні літери,</tspan><tspan x="540.0" dy="15.6">псевдографіка, спецсимволи.</tspan><tspan x="540.0" dy="15.6">Ширина залежить від локалі.</tspan></text>
<rect x="710.0" y="285.0" width="310.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Neutral (N)  [1 або 0 комірок]</tspan><tspan x="865.0" dy="15.6"></tspan><tspan x="865.0" dy="15.6">Решта символів (латиниця, арабське</tspan><tspan x="865.0" dy="15.6">письмо тощо). Друковані — 1,</tspan><tspan x="865.0" dy="15.6">комбінаційні та керуючі — 0.</tspan></text>
<rect x="60.0" y="495.0" width="960.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="540.0" y="520.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Комбінаційні діакритичні знаки (Mn, Me) та керуючі коди (Cf, Cc) завжди мають ширину 0 комірок.</tspan></text>
</svg>