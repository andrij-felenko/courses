<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1590 970" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1590" height="970" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="790.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани цільових портів ALUA та переходи між ними</text>
<rect x="219.9" y="113.2" width="320.2" height="93.7" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="380.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Active/Optimized (00h)</tspan><tspan x="380.0" dy="16.9">Прямий оптимальний доступ</tspan><tspan x="380.0" dy="16.9">Усі SCSI-команди виконуються негайно</tspan><tspan x="380.0" dy="16.9">Пріоритет dm-multipath: 50</tspan></text>
<rect x="1039.9" y="113.2" width="320.2" height="93.7" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1200.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1200.0" dy="0.0">Active/Non-Optimized (01h)</tspan><tspan x="1200.0" dy="16.9">Неоптимальний проксі-доступ</tspan><tspan x="1200.0" dy="16.9">Усі команди виконуються із затримкою</tspan><tspan x="1200.0" dy="16.9">Пріоритет dm-multipath: 10</tspan></text>
<rect x="207.8" y="473.1" width="344.3" height="93.7" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Standby (02h)</tspan><tspan x="380.0" dy="16.9">Резервний стан контролера</tspan><tspan x="380.0" dy="16.9">I/O відхиляється: Sense 02h / 04h / 0Ah</tspan><tspan x="380.0" dy="16.9">Дозволені: INQUIRY, RTPG, TUR, STPG</tspan></text>
<rect x="609.8" y="284.7" width="360.5" height="110.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="790.0" y="310.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Transitioning (0Fh)</tspan><tspan x="790.0" dy="16.9">Тимчасова зміна стану контролера</tspan><tspan x="790.0" dy="16.9">Скидання кешу, міграція прав LUN</tspan><tspan x="790.0" dy="16.9">Sense: 02h / 04h / 0Ah (Rapid Transition)</tspan><tspan x="790.0" dy="16.9">Драйвер ядра чекає й повторює запит</tspan></text>
<rect x="991.6" y="464.7" width="416.9" height="110.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="1200.0" y="490.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1200.0" dy="0.0">Unavailable (03h)</tspan><tspan x="1200.0" dy="16.9">Порт недоступний для цього LUN</tspan><tspan x="1200.0" dy="16.9">Аварія бекенду, ізоляція порту</tspan><tspan x="1200.0" dy="16.9">Sense: 02h / 04h / 0Bh (Target Port Unavailable)</tspan><tspan x="1200.0" dy="16.9">I/O неможливе, лише INQUIRY/RTPG</tspan></text>
<line x1="540.1" y1="180.0" x2="609.8" y2="320.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="609.8" y1="300.0" x2="540.1" y2="160.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1039.9" y1="180.0" x2="970.2" y2="320.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="970.2" y1="300.0" x2="1039.9" y2="160.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="552.2" y1="500.0" x2="609.8" y2="360.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="609.8" y1="380.0" x2="552.2" y2="520.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="991.6" y1="500.0" x2="970.2" y2="360.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="970.2" y1="380.0" x2="991.6" y2="520.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.1" y1="130.0" x2="1039.9" y2="130.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="790.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Автономне перемикання сховища (Implicit transition)</text>
<rect x="412.6" y="750.1" width="754.8" height="99.7" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="779.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Механізми керування станами портів цілі:</tspan><tspan x="790.0" dy="16.9">• Неявний (Implicit): Сховище змінює стан самостійно; хост дізнається через Sense 06h / 2Ah / 06h</tspan><tspan x="790.0" dy="16.9">• Явний (Explicit): Хост надсилає команду SET TARGET PORT GROUPS (STPG) для активації групи</tspan><tspan x="790.0" dy="16.9">• Змішаний (Both): Сховище підтримує і автономні переходи, і команди примусового перемикання</tspan></text>
</svg>