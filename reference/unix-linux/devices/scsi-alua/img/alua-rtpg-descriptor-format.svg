<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1590 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1590" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="790.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат бінарних дескрипторів відповіді REPORT TARGET PORT GROUPS</text>
<text x="790.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура даних параметра команди REPORT TARGET PORT GROUPS (SPC-4)</text>
<rect x="461.7" y="111.0" width="656.7" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Заголовок даних параметра (Header, 4 байти)</tspan><tspan x="790.0" dy="16.9">Байти 0..3: Довжина даних списку дескрипторів (Data Length, uint32 big-endian)</tspan></text>
<rect x="140.0" y="240.0" width="1300.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="790.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Дескриптор цільової групи портів (Target Port Group Descriptor)</text>
<rect x="209.5" y="304.0" width="61.0" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байт 0</tspan></text>
<rect x="481.3" y="304.0" width="177.3" height="32.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Бит 7: PREF (Preferred)</tspan></text>
<rect x="840.3" y="304.0" width="519.3" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Бити 3..0: Асиметричний стан доступу (0h=AO, 1h=ANO, 2h=SB, 3h=UN, Fh=TO)</tspan></text>
<rect x="209.5" y="350.0" width="61.0" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байт 1</tspan></text>
<rect x="327.4" y="350.0" width="485.1" height="32.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Маска підтримуваних станів (AO_SUP, ANO_SUP, SB_SUP, UN_SUP, TO_SUP)</tspan></text>
<rect x="980.6" y="350.0" width="238.9" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Бітова маска можливостей сховища</tspan></text>
<rect x="195.8" y="396.0" width="88.4" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байти 2..3</tspan></text>
<rect x="334.3" y="396.0" width="471.4" height="32.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ідентифікатор цільової групи портів (Target Port Group ID, uint16)</tspan></text>
<rect x="932.7" y="396.0" width="334.6" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Унікальний номер групи (TPG ID 0x0001..0xFFFF)</tspan></text>
<rect x="209.5" y="442.0" width="61.0" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байт 4</tspan></text>
<rect x="279.6" y="442.0" width="580.9" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Код статусу групи (Status Code: 0h=Normal, 1h=Altered by STPG, 2h=Implicit change)</tspan></text>
<rect x="990.8" y="442.0" width="218.4" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Причина останньої зміни стану</tspan></text>
<rect x="209.5" y="488.0" width="61.0" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байт 5</tspan></text>
<rect x="515.5" y="488.0" width="108.9" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Зарезервовано</tspan></text>
<rect x="1014.8" y="488.0" width="170.5" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Вендор-специфічні біти</tspan></text>
<rect x="199.2" y="534.0" width="81.6" height="32.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Байт 6..7</tspan></text>
<rect x="358.2" y="534.0" width="423.6" height="32.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Кількість портів у цій групі (Target Port Count: k, uint16)</tspan></text>
<rect x="942.9" y="534.0" width="314.1" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1100.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Визначає кількість дескрипторів портів далі</tspan></text>
<rect x="140.0" y="650.0" width="1300.0" height="170.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="790.0" y="685.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Список дескрипторів цільових портів (Target Port Descriptors, k × 4 байти)</text>
<rect x="202.6" y="715.0" width="154.8" height="30.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="734.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Порт 0 (Байти 8..11)</tspan></text>
<rect x="582.9" y="715.0" width="654.1" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="734.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Байти 8..9: Зарезервовано  |  Байти 10..11: Відносний ID порту цілі (Relative Target Port ID)</tspan></text>
<rect x="199.2" y="757.0" width="161.6" height="30.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="776.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Порт 1 (Байти 12..15)</tspan></text>
<rect x="576.1" y="757.0" width="667.8" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="776.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Байти 12..13: Зарезервовано  |  Байти 14..15: Відносний ID порту цілі (Relative Target Port ID)</tspan></text>
