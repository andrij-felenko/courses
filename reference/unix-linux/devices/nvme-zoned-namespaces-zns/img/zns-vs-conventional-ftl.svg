<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="410.0" height="480.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<text x="225.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Традиційний NVMe SSD (Block Device)</text>
<rect x="40.0" y="75.0" width="370.0" height="50.0" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/><text x="225.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">ОС / Застосунок</tspan><tspan x="225.0" dy="16.9">Довільний запис LBA (0..N)</tspan></text>
<line x1="225.0" y1="125.0" x2="225.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="160.0" width="370.0" height="190.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Складний шар FTL у пристрої</tspan><tspan x="225.0" dy="15.6">• LBA-to-PBA відображення (посторінкове)</tspan><tspan x="225.0" dy="15.6">• Garbage Collection (Збірка сміття)</tspan><tspan x="225.0" dy="15.6">• Write Amplification (WAF &gt; 3.0)</tspan><tspan x="225.0" dy="15.6">• Потреба в DRAM (1 ГБ / 1 ТБ)</tspan><tspan x="225.0" dy="15.6">• Over-provisioning (~28% ємності)</tspan><tspan x="225.0" dy="15.6">• Непередбачувана затримка (Tail Latency)</tspan></text>
<line x1="225.0" y1="350.0" x2="225.0" y2="385.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="385.0" width="370.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Фізична флеш-пам'ять NAND</tspan><tspan x="225.0" dy="15.6">Хаотичне мішування активних і застарілих сторінок</tspan><tspan x="225.0" dy="15.6">Постійне внутрішнє перезаписання блоків</tspan></text>
<rect x="470.0" y="20.0" width="410.0" height="480.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зонований NVMe ZNS SSD</text>
<rect x="490.0" y="75.0" width="370.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">ОС / Zone-Aware ФС / База даних</tspan><tspan x="675.0" dy="16.9">Послідовний запис у зони (SWR / Append)</tspan></text>
<line x1="675.0" y1="125.0" x2="675.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="160.0" width="370.0" height="190.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Тонкий контролер ZNS</tspan><tspan x="675.0" dy="15.6">• Лінійне відображення зон на блоки</tspan><tspan x="675.0" dy="15.6">• Відсутня збірка сміття (WAF ≈ 1.0)</tspan><tspan x="675.0" dy="15.6">• Робота без DRAM (DRAM-less ZNS)</tspan><tspan x="675.0" dy="15.6">• Zero Over-provisioning (100% ємності)</tspan><tspan x="675.0" dy="15.6">• Лінійний вказівник запису (Write Pointer)</tspan><tspan x="675.0" dy="15.6">• Детермінована затримка (Predictable Latency)</tspan></text>
<line x1="675.0" y1="350.0" x2="675.0" y2="385.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="385.0" width="370.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Фізичні Erase Blocks NAND</tspan><tspan x="675.0" dy="15.6">Пряма відповідність зон і блоків стирання</tspan><tspan x="675.0" dy="15.6">Zone Reset = стирання фізичного блоку</tspan></text>
</svg>