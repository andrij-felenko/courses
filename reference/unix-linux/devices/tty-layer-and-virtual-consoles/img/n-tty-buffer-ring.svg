<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер read_buf у лінійній дисципліні N_TTY</text>
<rect x="40.0" y="24.0" width="960.0" height="48.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="53.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Кільцевий буфер read_buf (4096 байтів) у struct n_tty_data</tspan></text>
<rect x="80.0" y="110.0" width="880.0" height="90.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="80.0" y="110.0" width="180.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="170.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вільна пам'ять</text>
<text x="170.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(вже віддано в read)</text>
<rect x="260.0" y="110.0" width="320.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="420.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Зафіксовані рядки: «ls -la\n», «cat file\n»</text>
<text x="420.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Готові до видачі в системний виклик read()</text>
<rect x="580.0" y="110.0" width="240.0" height="90.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="700.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Поточний рядок: «grepp»</text>
<text x="700.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Забій (0x7F) зітре останнє «p»</text>
<rect x="820.0" y="110.0" width="140.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="890.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вільний буфер</text>
<line x1="260.0" y1="250.0" x2="260.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">read_tail</text>
<text x="260.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">звідси читає read()</text>
<line x1="580.0" y1="250.0" x2="580.0" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">canon_head (commit_head)</text>
<text x="580.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">межа зафіксованого '\n'</text>
<line x1="820.0" y1="250.0" x2="820.0" y2="206.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">read_head</text>
<text x="820.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сюди пише воркер ldisc</text>
<rect x="40.0" y="340.0" width="960.0" height="210.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="520.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка вхідного байта в n_tty_receive_buf()</text>
<rect x="60.0" y="390.0" width="430.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1. Перевірка сигналів (ISIG):</tspan><tspan x="275.0" dy="15.6">Якщо байт == VINTR (0x03) → kill_pgrp(SIGINT);</tspan><tspan x="275.0" dy="15.6">байт відкидається і в read_buf НЕ потрапляє</tspan></text>
<rect x="510.0" y="390.0" width="470.0" height="60.0" rx="6" fill="#fdfaf3" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">2. Редагування рядка (ICANON):</tspan><tspan x="745.0" dy="15.6">Якщо байт == ERASE (0x7F) → read_head зменшується;</tspan><tspan x="745.0" dy="15.6">Якщо байт == KILL (0x15) → read_head = canon_head</tspan></text>
<rect x="60.0" y="465.0" width="430.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="485.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">3. Фіксація рядка (EOL / EOF):</tspan><tspan x="275.0" dy="15.6">Символ '\n' зсуває canon_head до read_head;</tspan><tspan x="275.0" dy="15.6">пробуджує процеси в tty-&gt;read_wait</tspan></text>
<rect x="510.0" y="465.0" width="470.0" height="64.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="485.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">4. Дроселювання потоку (Flow Control):</tspan><tspan x="745.0" dy="15.6">Якщо вільне місце &lt; 256 байтів → tty_throttle();</tspan><tspan x="745.0" dy="15.6">драйвер опускає RTS або шле XOFF (0x13)</tspan></text>
</svg>