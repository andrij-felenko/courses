<text x="850.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">/dev/tty1..63, /dev/tty0</text>
<text x="850.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">vt.c, keyboard.c, fbcon / vgacon</text>
