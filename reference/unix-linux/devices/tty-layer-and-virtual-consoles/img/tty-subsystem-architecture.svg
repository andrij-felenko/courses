<line x1="520.0" y1="488.0" x2="520.0" y2="524.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="840.0" y1="488.0" x2="840.0" y2="524.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="528.0" width="300.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="190.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовні порти (UART)</text>
<text x="190.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">/dev/ttyS*, /dev/ttyUSB*</text>
<text x="190.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">8250, serial_core, USB CDC-ACM</text>
