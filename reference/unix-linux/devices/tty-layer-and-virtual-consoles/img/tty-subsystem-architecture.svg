<rect x="40.0" y="430.0" width="960.0" height="58.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="520.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Кільцевий буфер tty_buffer (Flip Buffers) і робоча черга flush_to_ldisc</text>
<text x="520.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Асинхронний міст: драйвер/переривання кладе байти в atomic-контексті → воркер передає їх у ldisc</text>
