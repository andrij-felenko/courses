<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кооперативний протокол перемикання VT між ядром і графічним сервером</text>
<rect x="30.0" y="24.0" width="200.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="130.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Користувач / Ввід</tspan><tspan x="130.0" dy="15.6">(Ctrl+Alt+F3)</tspan></text>
<line x1="130.0" y1="76.0" x2="130.0" y2="620.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="290.0" y="24.0" width="200.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="390.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Ядро Linux</tspan><tspan x="390.0" dy="15.6">(підсистема vt.c)</tspan></text>
<line x1="390.0" y1="76.0" x2="390.0" y2="620.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="550.0" y="24.0" width="200.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Графічний сервер</tspan><tspan x="650.0" dy="15.6">(Wayland / Xorg на VT2)</tspan></text>
<line x1="650.0" y1="76.0" x2="650.0" y2="620.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="810.0" y="24.0" width="200.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="910.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Відеоадаптер / DRM</tspan><tspan x="910.0" dy="15.6">(KMS / Direct Rendering)</tspan></text>
<line x1="910.0" y1="76.0" x2="910.0" y2="620.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="130.0" y1="110.0" x2="390.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Натиск Ctrl+Alt+F3</text>
<rect x="290.0" y="130.0" width="200.0" height="36.0" rx="6" fill="#fdfaf3" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">VT2 у режимі VT_PROCESS</text>
<line x1="390.0" y1="185.0" x2="650.0" y2="185.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Сигнал relsig (SIGUSR1)</text>
<rect x="550.0" y="205.0" width="200.0" height="42.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Зупиняє рендеринг,</text>
<text x="650.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">блокує пристрої вводу</text>
<line x1="650.0" y1="265.0" x2="910.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="780.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. drmDropMaster()</text>
<line x1="650.0" y1="310.0" x2="390.0" y2="310.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4. ioctl(VT_RELDISP, 1)</text>
<rect x="290.0" y="335.0" width="200.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="390.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Перемикання на VT3,</text>
<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">відновлення fbcon / тексту</text>
<line x1="390.0" y1="400.0" x2="910.0" y2="400.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Відновлення текстового кадрового буфера</text>
<line x1="130.0" y1="440.0" x2="390.0" y2="440.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">6. Натиск Alt+F2 (повернення)</text>
<rect x="290.0" y="460.0" width="200.0" height="36.0" rx="6" fill="#fdfaf3" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ядро активує VT2</text>
<line x1="390.0" y1="515.0" x2="650.0" y2="515.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">7. Сигнал acqsig (SIGUSR2)</text>
<line x1="650.0" y1="545.0" x2="910.0" y2="545.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="780.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">8. drmSetMaster()</text>
<line x1="650.0" y1="580.0" x2="390.0" y2="580.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">9. ioctl(VT_RELDISP, VT_ACKACQ)</text>
<rect x="550.0" y="595.0" width="200.0" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Відновлення графічного екрана</text>
</svg>