<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читання через verity: пересилання, робоча черга, підйом деревом</text>
<line x1="690.0" y1="90.0" x2="690.0" y2="830.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="350.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">шлях запиту</text>
<text x="1010.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">підйом деревом для одного блока</text>
<rect x="247.1" y="146.1" width="205.8" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">bio від файлової системи</tspan><tspan x="350.0" dy="16.9">читання блока 700 000</tspan></text>
<rect x="224.9" y="296.1" width="250.3" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ціль verity забирає запит собі</tspan><tspan x="350.0" dy="16.9">і пересилає його на /dev/sda1</tspan></text>
<rect x="210.0" y="446.1" width="279.9" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">дані прийшли — але у верхніх шарах</tspan><tspan x="350.0" dy="16.9">їх ще ніхто не бачив</tspan></text>
<rect x="198.9" y="596.0" width="302.2" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="621.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">робоча черга: гешування може заснути,</tspan><tspan x="350.0" dy="16.9">тож у перериванні його не роблять</tspan></text>
<rect x="210.0" y="751.0" width="279.9" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="776.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">збіглося: сторінки віддано вгору</tspan><tspan x="350.0" dy="16.9">не збіглося: EIO і рядок у журналі</tspan></text>
<line x1="350.0" y1="203.9" x2="350.0" y2="296.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="353.9" x2="350.0" y2="446.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="503.9" x2="350.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="654.0" x2="350.0" y2="751.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">запис сюди не доходить ніколи: DM_MAPIO_KILL, одразу EIO</text>
<rect x="866.3" y="154.5" width="287.3" height="41.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">очікуваний геш := корінь із таблиці</tspan></text>
<rect x="866.3" y="296.1" width="287.3" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">блок рівня 2: звірити з очікуваним,</tspan><tspan x="1010.0" dy="16.9">узяти з нього геш потрібного сусіда</tspan></text>
<rect x="896.0" y="446.1" width="228.1" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">блок рівня 1: звірити,</tspan><tspan x="1010.0" dy="16.9">узяти геш потрібного сусіда</tspan></text>
<rect x="892.3" y="596.0" width="235.5" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="621.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">блок рівня 0: звірити,</tspan><tspan x="1010.0" dy="16.9">узяти геш самого блока даних</tspan></text>
<rect x="910.8" y="751.0" width="198.4" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="776.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">геш прочитаних 4 КіБ</tspan><tspan x="1010.0" dy="16.9">проти взятого з рівня 0</tspan></text>
<line x1="1010.0" y1="195.5" x2="1010.0" y2="296.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="353.9" x2="1010.0" y2="446.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="503.9" x2="1010.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="654.0" x2="1010.0" y2="751.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="625.0" x2="810.0" y2="400.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="1330.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">блоки</text>
<text x="1330.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">рівнів 2 і 1</text>
<text x="1330.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">майже завжди</text>
<text x="1330.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">вже в кеші</text>
</svg>