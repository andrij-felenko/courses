<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг довіри до кореневого гешу</text>
<rect x="140.0" y="79.5" width="520.0" height="41.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ключ, випалений у кристалі</tspan></text>
<rect x="140.0" y="209.5" width="520.0" height="41.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">прошивка перевіряє завантажувач</tspan></text>
<rect x="140.0" y="331.1" width="520.0" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">завантажувач перевіряє ядро</tspan><tspan x="400.0" dy="16.9">разом із його командним рядком</tspan></text>
<rect x="140.0" y="461.1" width="520.0" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="486.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">у командному рядку — корінь дерева:</tspan><tspan x="400.0" dy="16.9">32 байти, які ядро кладе в таблицю</tspan></text>
<rect x="140.0" y="591.0" width="520.0" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="616.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ціль verity звіряє з ним кожен</tspan><tspan x="400.0" dy="16.9">прочитаний блок розділу</tspan></text>
<line x1="400.0" y1="120.5" x2="400.0" y2="209.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="250.5" x2="400.0" y2="331.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="388.9" x2="400.0" y2="461.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="519.0" x2="400.0" y2="591.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="930.5" y="267.9" width="199.0" height="184.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1030.0" y="296.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">під підозрою цілком:</tspan><tspan x="1030.0" dy="16.9"></tspan><tspan x="1030.0" dy="16.9">розділ із даними</tspan><tspan x="1030.0" dy="16.9">розділ гешів</tspan><tspan x="1030.0" dy="16.9">суперблок на ньому</tspan><tspan x="1030.0" dy="16.9"></tspan><tspan x="1030.0" dy="16.9">ядро не читає звідти</tspan><tspan x="1030.0" dy="16.9">жодного параметра —</tspan><tspan x="1030.0" dy="16.9">усі приходять таблицею</tspan></text>
<line x1="700.0" y1="490.0" x2="900.0" y2="400.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="6 5"/>
<rect x="140.0" y="707.6" width="520.0" height="74.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="400.0" y="732.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">якщо ланцюг завантаження сюди не дістає:</tspan><tspan x="400.0" dy="16.9">корінь приходить із підписом PKCS#7,</tspan><tspan x="400.0" dy="16.9">а його перевіряє кільце ключів ядра</tspan></text>
<line x1="400.0" y1="657.0" x2="400.0" y2="699.6" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="6 5"/>
</svg>