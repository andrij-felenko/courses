<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два розділи, три рівні гешів і корінь поза носієм</text>
<rect x="160.0" y="74.0" width="620.0" height="61.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">розділ із даними   /dev/sda1</tspan><tspan x="470.0" dy="16.9">4 ГіБ   =   1 048 576 блоків по 4 КіБ</tspan></text>
<rect x="1013.3" y="79.2" width="133.4" height="51.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="101.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">це те, що бачить</tspan><tspan x="1080.0" dy="15.6">файлова система</tspan></text>
<line x1="810.0" y1="105.0" x2="970.0" y2="105.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="160.0" y="234.0" width="620.0" height="61.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">рівень 0   —   геші блоків даних</tspan><tspan x="470.0" dy="16.9">1 048 576 · 32 Б   =   8192 блоки   (32 МіБ)</tspan></text>
<rect x="996.2" y="239.2" width="167.6" height="51.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">у блок 4 КіБ входить</tspan><tspan x="1080.0" dy="15.6">4096 / 32 = 128 гешів</tspan></text>
<line x1="810.0" y1="265.0" x2="970.0" y2="265.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="160.0" y="369.1" width="620.0" height="61.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">рівень 1   —   геші блоків рівня 0</tspan><tspan x="470.0" dy="16.9">8192 · 32 Б   =   64 блоки   (256 КіБ)</tspan></text>
<rect x="999.6" y="374.2" width="160.8" height="51.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">кожен рівень</tspan><tspan x="1080.0" dy="15.6">коротший у 128 разів</tspan></text>
<line x1="810.0" y1="400.0" x2="970.0" y2="400.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="160.0" y="499.1" width="620.0" height="61.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">рівень 2   —   верхній, один блок</tspan><tspan x="470.0" dy="16.9">64 · 32 Б   =   2048 Б</tspan></text>
<rect x="1013.3" y="504.2" width="133.4" height="51.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="526.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">далі скорочувати</tspan><tspan x="1080.0" dy="15.6">нема чого</tspan></text>
<line x1="810.0" y1="530.0" x2="970.0" y2="530.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="160.0" y="649.0" width="620.0" height="61.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="470.0" y="676.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">кореневий геш   —   32 байти</tspan><tspan x="470.0" dy="16.9">у таблиці device mapper, а НЕ на носії</tspan></text>
<rect x="1006.4" y="654.2" width="147.1" height="51.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="676.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">єдине число, якому</tspan><tspan x="1080.0" dy="15.6">довіряють ззовні</tspan></text>
<line x1="810.0" y1="680.0" x2="970.0" y2="680.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="470.0" y1="136.0" x2="470.0" y2="234.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="295.9" x2="470.0" y2="369.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="430.9" x2="470.0" y2="499.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="561.0" x2="470.0" y2="649.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="120.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">гешуємо</text>
<text x="120.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">гешуємо</text>
<text x="120.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">гешуємо</text>
<text x="120.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">гешуємо</text>
<text x="80.0" y="748.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">порядок на розділі гешів /dev/sda2 — від верхнього рівня до нижнього:</text>
<rect x="80.0" y="790.0" width="250.0" height="60.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.4"/><text x="205.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">суперблок 512 Б</tspan></text>
<rect x="344.0" y="790.0" width="250.0" height="60.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="469.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="469.0" dy="0.0">рівень 2 — 1 блок</tspan></text>
<rect x="608.0" y="790.0" width="270.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="743.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="743.0" dy="0.0">рівень 1 — 64 блоки</tspan></text>
<rect x="892.0" y="790.0" width="300.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="1042.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1042.0" dy="0.0">рівень 0 — 8192 блоки</tspan></text>
</svg>