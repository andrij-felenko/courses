<rect x="971.2" y="415.4" width="217.5" height="69.2" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1080.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">блоки дерева кешує dm-bufio,</tspan><tspan x="1080.0" dy="15.6">блоки даних — ні:</tspan><tspan x="1080.0" dy="15.6">перевірка щоразу</tspan></text>
