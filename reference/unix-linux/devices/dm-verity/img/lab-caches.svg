<rect x="978.1" y="265.4" width="203.8" height="69.2" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1080.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">кеш сторінок файлу:</tspan><tspan x="1080.0" dy="15.6">прочитане лежить у пам'яті</tspan><tspan x="1080.0" dy="15.6">→ echo 3 &gt; drop_caches</tspan></text>
