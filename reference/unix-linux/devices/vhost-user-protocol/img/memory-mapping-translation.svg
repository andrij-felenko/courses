<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Трансляція адрес: від Guest Physical Address до Backend HVA</text>
<rect x="40.0" y="60.0" width="220.0" height="380.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Гостьовий простір (VM)</text>
<text x="150.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-style="italic">Guest Physical Address (GPA)</text>
<rect x="55.0" y="120.0" width="190.0" height="50.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="150.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle"><tspan x="150.0" dy="0.0">RAM Регіон 0 (Low Mem)</tspan><tspan x="150.0" dy="13.0">GPA: 0x0000_0000 - 0x7FFF_FFFF</tspan></text>
<rect x="55.0" y="185.0" width="190.0" height="40.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="150.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">PCI / MMIO Hole (немає RAM)</text>
<rect x="55.0" y="240.0" width="190.0" height="85.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">RAM Регіон 1 (High Mem)</tspan><tspan x="150.0" dy="13.0">GPA: 0x1_0000_0000...</tspan><tspan x="150.0" dy="13.0">Дескриптор virtio: GPA = X</tspan></text>
<rect x="65.0" y="290.0" width="170.0" height="25.0" rx="3" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.0"/>
<text x="150.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700">Буфер пакета: GPA = X</text>
<rect x="55.0" y="340.0" width="190.0" height="80.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="150.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle"><tspan x="150.0" dy="0.0">RAM Регіон 2</tspan><tspan x="150.0" dy="13.0">GPA: 0x2_0000_0000...</tspan></text>
<rect x="290.0" y="60.0" width="220.0" height="380.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="400.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Розділюваний файл (Хост)</text>
<text x="400.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-style="italic">memfd_create() / hugetlbfs fd</text>
<rect x="305.0" y="120.0" width="190.0" height="60.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="400.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="400.0" dy="0.0">Файловий дескриптор: fd_0</tspan><tspan x="400.0" dy="13.0">Зміщення у файлі: offset = 0</tspan><tspan x="400.0" dy="13.0">Розмір: size_0</tspan></text>
<rect x="305.0" y="210.0" width="190.0" height="120.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="400.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Файловий дескриптор: fd_1</tspan><tspan x="400.0" dy="13.0">mmap_offset = 0</tspan><tspan x="400.0" dy="13.0">Розмір = size_1</tspan></text>
<rect x="315.0" y="275.0" width="170.0" height="40.0" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.0"/>
<text x="400.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Дані буфера за зміщенням:</tspan><tspan x="400.0" dy="13.0">File_Offset = GPA - Base_GPA</tspan></text>
<rect x="305.0" y="350.0" width="190.0" height="70.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="400.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="400.0" dy="0.0">Файловий дескриптор: fd_2</tspan><tspan x="400.0" dy="13.0">mmap_offset = 0</tspan></text>
<rect x="540.0" y="60.0" width="220.0" height="380.0" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Простір бекенда (Backend)</text>
<text x="650.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-style="italic">Backend Host Virtual Addr (HVA)</text>
<rect x="555.0" y="120.0" width="190.0" height="60.0" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="650.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle"><tspan x="650.0" dy="0.0">mmap(fd_0) -&gt; HVA_Base_0</tspan><tspan x="650.0" dy="13.0">Відображення Регіону 0</tspan></text>
<rect x="555.0" y="210.0" width="190.0" height="120.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="650.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">mmap(fd_1) -&gt; HVA_Base_1</tspan><tspan x="650.0" dy="13.0">Відображення Регіону 1</tspan></text>
<rect x="565.0" y="275.0" width="170.0" height="40.0" rx="3" fill="#e9d5ff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="650.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4c1d95" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Покажчик у бекенді:</tspan><tspan x="650.0" dy="11.7">HVA = HVA_Base_1 + (GPA - GPA_1)</tspan></text>
<rect x="555.0" y="350.0" width="190.0" height="70.0" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="650.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle"><tspan x="650.0" dy="0.0">mmap(fd_2) -&gt; HVA_Base_2</tspan><tspan x="650.0" dy="13.0">Відображення Регіону 2</tspan></text>
<line x1="245.0" y1="280.0" x2="305.0" y2="280.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="495.0" y1="280.0" x2="555.0" y2="280.0" stroke="#9333ea" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="87.0" y="456.0" width="626.1" height="28.0" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="400.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Формула адресації: Backend_HVA = mmap_addr + (GPA - guest_phys_addr) + mmap_offset</tspan></text>
</svg>