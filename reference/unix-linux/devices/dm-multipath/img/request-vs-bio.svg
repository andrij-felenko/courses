<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1530 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1530" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="760.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де саме обирається дорога — до склеювання чи після</text>
<line x1="760.0" y1="100.0" x2="760.0" y2="800.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="390.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">queue_mode bio</text>
<text x="1130.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">запитоорієнтований режим</text>
<rect x="235.2" y="154.5" width="309.6" height="41.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">три сусідні bio: сектори 100, 108, 116</tspan></text>
<rect x="261.1" y="294.5" width="257.7" height="41.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">дорогу обирають для КОЖНОГО bio</tspan></text>
<rect x="294.5" y="426.1" width="191.0" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">сусідні bio розійшлися</tspan><tspan x="390.0" dy="16.9">по двох різних чергах</tspan></text>
<rect x="257.4" y="566.0" width="265.1" height="57.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="591.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">склеювати нема з чим:</tspan><tspan x="390.0" dy="16.9">три дрібні запити замість одного</tspan></text>
<rect x="235.2" y="701.0" width="309.6" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="726.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">виграє там, де склеювання не потрібне:</tspan><tspan x="390.0" dy="16.9">NVMe з десятками черг</tspan></text>
<line x1="390.0" y1="195.5" x2="390.0" y2="294.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="335.5" x2="390.0" y2="426.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="483.9" x2="390.0" y2="566.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="624.0" x2="390.0" y2="701.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="975.2" y="154.5" width="309.6" height="41.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">три сусідні bio: сектори 100, 108, 116</tspan></text>
<rect x="1034.5" y="286.1" width="191.0" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">власна черга multipath</tspan><tspan x="1130.0" dy="16.9">склеює їх в один запит</tspan></text>
<rect x="1019.7" y="426.1" width="220.7" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">дорогу обирають один раз —</tspan><tspan x="1130.0" dy="16.9">для готового запиту</tspan></text>
<rect x="1004.9" y="566.0" width="250.3" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="591.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">клон запиту йде в чергу дороги</tspan><tspan x="1130.0" dy="16.9">цілим шматком</tspan></text>
<rect x="1004.9" y="701.0" width="250.3" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="726.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">помилка → той самий запит,</tspan><tspan x="1130.0" dy="16.9">інша дорога, жодного дроблення</tspan></text>
<line x1="1130.0" y1="195.5" x2="1130.0" y2="286.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1130.0" y1="343.9" x2="1130.0" y2="426.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1130.0" y1="483.9" x2="1130.0" y2="566.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1130.0" y1="624.0" x2="1130.0" y2="701.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="840.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">затримка менша, склеювання немає</text>
<text x="1130.0" y="840.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">склеювання є, ціна — зайвий поверх черги</text>
