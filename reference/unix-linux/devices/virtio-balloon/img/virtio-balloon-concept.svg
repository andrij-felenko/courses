<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція та цикл надування/здування virtio-balloon</text>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕХАНІЗМ РОЗДУВАННЯ ТА ЗДУВАННЯ VIRTIO-BALLOON</text>
<text x="700.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Подолання семантичного розриву: виділення сторінок у гості та повернення фізичної RAM господарю</text>
<text x="360.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1. НАДУВАННЯ (INFLATE: ГОСПОДАР ЗАБИРАЄ RAM)</text>
<rect x="70.0" y="146.4" width="580.0" height="67.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">1. Запит гіпервізора на надування:</tspan><tspan x="360.0" dy="15.6">QEMU оновлює num_pages у конфігурації virtio</tspan><tspan x="360.0" dy="15.6">і надсилає переривання гостю</tspan></text>
<line x1="360.0" y1="215.0" x2="360.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="276.4" width="580.0" height="67.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Захоплення сторінок у ядрі гостя:</tspan><tspan x="360.0" dy="15.6">Драйвер virtio_balloon кличе alloc_pages()</tspan><tspan x="360.0" dy="15.6">і вилучає кадри з пулу buddy allocator</tspan></text>
<line x1="360.0" y1="345.0" x2="360.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="406.4" width="580.0" height="67.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">3. Передача номерів PFN через virtqueue:</tspan><tspan x="360.0" dy="15.6">Масив номерів 4 КБ сторінок записується в inflateq;</tspan><tspan x="360.0" dy="15.6">драйвер сповіщає гіпервізор (kick)</tspan></text>
<line x1="360.0" y1="475.0" x2="360.0" y2="515.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="536.6" width="580.0" height="86.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="560.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">4. Вивільнення фізичної пам'яті хоста:</tspan><tspan x="360.0" dy="15.6">QEMU транслює GPA → HVA та викликає</tspan><tspan x="360.0" dy="15.6">madvise(hva, len, MADV_DONTNEED);</tspan><tspan x="360.0" dy="15.6">ядро хоста скидає EPT-мапінг і звільняє RAM!</tspan></text>
<text x="1040.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2. ЗДУВАННЯ (DEFLATE: ПОВЕРНЕННЯ RAM ГОСТЮ)</text>
<rect x="750.0" y="146.4" width="580.0" height="67.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">1. Зменшення цільового розміру балона:</tspan><tspan x="1040.0" dy="15.6">Гіпервізор зменшує ціль num_pages або</tspan><tspan x="1040.0" dy="15.6">гість відчуває брак RAM (тиск пам'яті)</tspan></text>
<line x1="1040.0" y1="215.0" x2="1040.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="750.0" y="276.4" width="580.0" height="67.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">2. Вилучення сторінок зі списку балона:</tspan><tspan x="1040.0" dy="15.6">Драйвер бере збережені кадри зі списку pages</tspan><tspan x="1040.0" dy="15.6">та формує пакет номерів PFN для повернення</tspan></text>
<line x1="1040.0" y1="345.0" x2="1040.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="750.0" y="406.4" width="580.0" height="67.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">3. Сповіщення хоста через deflateq:</tspan><tspan x="1040.0" dy="15.6">Драйвер надсилає PFN у чергу deflateq;</tspan><tspan x="1040.0" dy="15.6">хост підтверджує можливість повторного звернення</tspan></text>
<line x1="1040.0" y1="475.0" x2="1040.0" y2="515.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="750.0" y="536.6" width="580.0" height="86.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1040.0" y="560.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">4. Повернення сторінок гостьовому алокатору:</tspan><tspan x="1040.0" dy="15.6">Драйвер гостя кличе free_pages(); кадри знову</tspan><tspan x="1040.0" dy="15.6">доступні процесам гостя (хост виділить фізичну</tspan><tspan x="1040.0" dy="15.6">пам'ять на льоту при першому EPT page fault)</tspan></text>
<rect x="70.0" y="718.5" width="1260.0" height="73.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="743.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">СЕМАНТИЧНИЙ РОЗРИВ РОЗВ'ЯЗАНО:</tspan><tspan x="700.0" dy="16.2">Гіпервізор не знає внутрішньої структури процесів гостя, але драйвер усередині ядра гостя</tspan><tspan x="700.0" dy="16.2">діє як легальний споживач пам'яті, блокуючи сторінки від імені хоста.</tspan></text>
</svg>