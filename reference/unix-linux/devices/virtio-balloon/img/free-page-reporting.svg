<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні відмінності між класичним балонінгом та Free Page Reporting</text>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЕВОЛЮЦІЯ: ТРАДИЦІЙНИЙ PFN-БАЛОНІНГ ПРОТИ FREE PAGE REPORTING</text>
<text x="710.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Перехід від поштучного захоплення 4 КБ сторінок до пакетного репортингу блоків buddy allocator</text>
<text x="360.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">КЛАСИЧНИЙ VIRTIO-BALLOON (PFN ARRAY)</text>
<rect x="70.0" y="156.4" width="580.0" height="67.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">1. Посторінковий цикл alloc_pages(order=0):</tspan><tspan x="360.0" dy="15.6">Драйвер циклічно виділяє мільйони 4 КБ кадрів,</tspan><tspan x="360.0" dy="15.6">розбиваючи суцільні великі блоки buddy allocator.</tspan></text>
<line x1="360.0" y1="230.0" x2="360.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="286.4" width="580.0" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="360.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Передача масивів 32-біт PFN:</tspan><tspan x="360.0" dy="15.6">Буфери по 256 PFN (1 МБ) женуться через virtqueue.</tspan><tspan x="360.0" dy="15.6">Для 32 ГБ потрібно 8 388 608 PFN і тисячі VM-exit!</tspan></text>
<line x1="360.0" y1="365.0" x2="360.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="423.6" width="580.0" height="82.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">3. Наслідки класичного підходу:</tspan><tspan x="360.0" dy="15.6">• Високе навантаження на vCPU під час надування;</tspan><tspan x="360.0" dy="15.6">• Фрагментація пам'яті гостя (руйнування HugePages);</tspan><tspan x="360.0" dy="15.6">• Обмеження 32-біт PFN межею 16 ТБ RAM гостя.</tspan></text>
<text x="1060.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">FREE PAGE REPORTING (VIRTIO_BALLOON_F_REPORTING)</text>
<rect x="770.0" y="156.4" width="580.0" height="67.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">1. Інтеграція з ядром mm (Linux 5.7+):</tspan><tspan x="1060.0" dy="15.6">page_reporting_register() підключає хук до buddy allocator.</tspan><tspan x="1060.0" dy="15.6">Сторінки НЕ вилучаються з пулу вільних!</tspan></text>
<line x1="1060.0" y1="230.0" x2="1060.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="286.4" width="580.0" height="67.2" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1060.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">2. Репортинг великими блоками (MAX_ORDER - 1):</tspan><tspan x="1060.0" dy="15.6">Ядро повідомляє про цілі діапазони (наприклад, 2 МБ/4 МБ)</tspan><tspan x="1060.0" dy="15.6">через список scatter-gather без розбиття на 4 КБ.</tspan></text>
<line x1="1060.0" y1="365.0" x2="1060.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="423.6" width="580.0" height="82.8" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/><text x="1060.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">3. Переваги Free Page Reporting:</tspan><tspan x="1060.0" dy="15.6">• Нульове навантаження на процесор у стані спокою;</tspan><tspan x="1060.0" dy="15.6">• Збереження прозорих HugePages (THP) у хості;</tspan><tspan x="1060.0" dy="15.6">• Миттєве повернення RAM гостю без запитів deflate.</tspan></text>
<rect x="70.0" y="621.0" width="1280.0" height="118.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="645.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ПОРІВНЯННЯ ПРОДУКТИВНОСТІ ДВОХ ПІДХОДІВ ПРИ ОЧИЩЕННІ 32 ГБ RAM:</tspan><tspan x="710.0" dy="15.6">Параметр                      Класичний балон (PFN)          Free Page Reporting (5.7+)</tspan><tspan x="710.0" dy="15.6">Одиниця передачі              4 КБ (32-біт PFN)              Блок 2–4 МБ (scatter-gather)</tspan><tspan x="710.0" dy="15.6">Кількість дескрипторів        8 388 608 елементів            8 192 діапазони</tspan><tspan x="710.0" dy="15.6">Час вивільнення 32 ГБ         ~1200–2500 мс (високий CPU)     ~15–40 мс (майже непомітно)</tspan><tspan x="710.0" dy="15.6">Вплив на HugeTLB хоста        Руйнує 2 МБ сторінки хоста     Зберігає 2 МБ сторінки неушкодженими</tspan></text>
</svg>