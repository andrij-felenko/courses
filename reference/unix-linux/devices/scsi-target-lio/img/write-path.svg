<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="140.0" y="30.0" width="720.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="57.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">iscsi_target_mod розбирає PDU:</tspan><tspan x="500.0" dy="19.5">з нього виймається CDB — WRITE(10), LBA, довжина</tspan></text>
<line x1="500.0" y1="94.0" x2="500.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="126.0" width="720.0" height="64.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">чий це сеанс і який mapped LUN</tspan><tspan x="500.0" dy="19.5">команда до LUN, не вписаного в ACL, далі не йде</tspan></text>
<line x1="500.0" y1="190.0" x2="500.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="222.0" width="720.0" height="64.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">таблиця емуляції: INQUIRY ядро відповіло б саме,</tspan><tspan x="500.0" dy="19.5">а WRITE передає вниз — але спершу потрібні дані</tspan></text>
<line x1="500.0" y1="286.0" x2="500.0" y2="314.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="318.0" width="720.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">write_pending: фабрика просить дані</tspan><tspan x="500.0" dy="19.5">в iSCSI це R2T, за ним — пакети data-out</tspan></text>
<line x1="500.0" y1="382.0" x2="500.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="414.0" width="720.0" height="64.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="500.0" y="441.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">iblock складає сторінки в bio</tspan><tspan x="500.0" dy="19.5">і кладе його в чергу блокового пристрою</tspan></text>
<line x1="500.0" y1="478.0" x2="500.0" y2="506.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="510.0" width="720.0" height="64.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="500.0" y="537.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">bio завершився — колбек будить команду</tspan><tspan x="500.0" dy="19.5">і повідомляє, чи все записалось</tspan></text>
<line x1="500.0" y1="574.0" x2="500.0" y2="602.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="606.0" width="720.0" height="64.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="633.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">статус: GOOD або CHECK CONDITION</tspan><tspan x="500.0" dy="19.5">із сенс-кодом, який пояснює, що не так</tspan></text>
<line x1="500.0" y1="670.0" x2="500.0" y2="698.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="702.0" width="720.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="729.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">queue_status: відповідь пакується назад у PDU</tspan><tspan x="500.0" dy="19.5">і йде тим самим сокетом</tspan></text>
<rect x="140.0" y="818.0" width="220.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="849.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">фабрика</tspan></text>
<rect x="390.0" y="818.0" width="220.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="849.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ядро цілі</tspan></text>
<rect x="640.0" y="818.0" width="220.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="750.0" y="849.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">backstore</tspan></text>
</svg>