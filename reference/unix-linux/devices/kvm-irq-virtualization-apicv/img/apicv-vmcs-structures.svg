<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратні структури керування APICv у VMCS та пам'яті хоста</text>
<rect x="30.0" y="50.0" width="265.0" height="405.0" rx="8" fill="#f4f6f8" stroke="#34495e" stroke-width="1.5"/>
<text x="162.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">VMCS Execution Controls</text>
<rect x="53.4" y="107.5" width="217.2" height="35.0" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/><text x="162.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.0" dy="0.0">Pin-Based Controls:</tspan><tspan x="162.0" dy="13.0">• Process Posted Interrupts (bit 14)</tspan></text>
<rect x="84.8" y="171.0" width="154.5" height="48.0" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/><text x="162.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.0" dy="0.0">Primary Exec Controls:</tspan><tspan x="162.0" dy="13.0">• Use TPR shadow (bit 21)</tspan><tspan x="162.0" dy="13.0">• TPR threshold register</tspan></text>
<rect x="47.7" y="253.0" width="228.6" height="74.0" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/><text x="162.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.0" dy="0.0">Secondary Exec Controls:</tspan><tspan x="162.0" dy="13.0">• Virtualize APIC-accesses (bit 0)</tspan><tspan x="162.0" dy="13.0">• Virtual-interrupt delivery (bit 9)</tspan><tspan x="162.0" dy="13.0">• APIC-register virtualization (bit 8)</tspan><tspan x="162.0" dy="13.0">• Virtualize x2APIC mode (bit 18)</tspan></text>
<rect x="64.8" y="374.0" width="194.4" height="48.0" rx="6" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/><text x="162.0" y="388.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.0" dy="0.0">Guest Interrupt Status:</tspan><tspan x="162.0" dy="13.0">• RVI: Requesting Virtual Vector</tspan><tspan x="162.0" dy="13.0">• SVI: Servicing Virtual Vector</tspan></text>
<rect x="325.0" y="50.0" width="265.0" height="405.0" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
<text x="457.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b4f72" text-anchor="middle" font-weight="700">APIC-Access &amp; Вказівники</text>
<rect x="365.5" y="106.0" width="183.0" height="48.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="457.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.0" dy="0.0">APIC-Access Address (HPA):</tspan><tspan x="457.0" dy="13.0">Вказує на 4 КБ сторінку хоста,</tspan><tspan x="457.0" dy="13.0">що мапується на GPA 0xFEE00000</tspan></text>
<rect x="374.1" y="206.0" width="165.9" height="48.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="457.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.0" dy="0.0">Virtual-APIC Address (HPA):</tspan><tspan x="457.0" dy="13.0">Фізична сторінка хоста</tspan><tspan x="457.0" dy="13.0">з регістрами Virtual APIC</tspan></text>
<rect x="374.1" y="311.0" width="165.9" height="48.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="457.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.0" dy="0.0">Posted-Interrupt Desc Addr:</tspan><tspan x="457.0" dy="13.0">Вказівник HPA на 64-байтний</tspan><tspan x="457.0" dy="13.0">дескриптор PIR у пам'яті</tspan></text>
<rect x="620.0" y="50.0" width="270.0" height="405.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="755.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#145a32" text-anchor="middle" font-weight="700">Фізичні структури в RAM</text>
<rect x="655.0" y="103.0" width="200.1" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Virtual-APIC Page (4 KB):</tspan><tspan x="755.0" dy="13.0">• 0x080: Virtual TPR (vTPR)</tspan><tspan x="755.0" dy="13.0">• 0x0B0: Virtual EOI (vEOI)</tspan><tspan x="755.0" dy="13.0">• 0x100-0x170: Virtual ISR (vISR)</tspan><tspan x="755.0" dy="13.0">• 0x200-0x270: Virtual IRR (vIRR)</tspan></text>
<rect x="637.9" y="276.5" width="234.3" height="87.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Posted-Interrupt Descriptor (64 B):</tspan><tspan x="755.0" dy="13.0">• PIR[255:0]: 256-бітний бітмап</tspan><tspan x="755.0" dy="13.0">• Bit 256: ON (Outstanding Notif)</tspan><tspan x="755.0" dy="13.0">• Bit 257: SN (Suppress Notif)</tspan><tspan x="755.0" dy="13.0">• Bits 271:264: NV (Notif Vector)</tspan><tspan x="755.0" dy="13.0">• Bits 319:288: NDST (Host CPU APIC ID)</tspan></text>
<line x1="295.0" y1="290.0" x2="345.0" y2="130.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="295.0" y1="290.0" x2="345.0" y2="230.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="295.0" y1="125.0" x2="345.0" y2="335.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="230.0" x2="635.0" y2="140.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="335.0" x2="635.0" y2="320.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>