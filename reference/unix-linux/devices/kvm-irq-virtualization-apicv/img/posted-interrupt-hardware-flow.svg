<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний конвеєр прямої доставки переривань VT-d Posted Interrupts</text>
<rect x="28.0" y="89.0" width="204.1" height="52.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="130.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. PCIe Пристрій (VFIO)</tspan><tspan x="130.0" dy="13.0">Генерує MSI-X транзакцію:</tspan><tspan x="130.0" dy="13.0">Addr = 0xFEE00000 | Data = Vector</tspan></text>
<rect x="376.5" y="89.0" width="187.0" height="52.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="470.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Intel VT-d IOMMU</tspan><tspan x="470.0" dy="13.0">Пошук в IRTE (Posted Format):</tspan><tspan x="470.0" dy="13.0">Витягує HPA PIR, NV=0xf2, NDST</tspan></text>
<rect x="702.2" y="89.0" width="215.5" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">3. Атомарний запис у RAM</tspan><tspan x="810.0" dy="13.0">IOMMU ставить біт у PIR[vector]</tspan><tspan x="810.0" dy="13.0">та встановлює ON = 1 (Lock Cmpxchg)</tspan></text>
<rect x="705.1" y="249.0" width="209.8" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">4. Апаратний Physical IPI</tspan><tspan x="810.0" dy="13.0">IOMMU відправляє IPI (Vector 0xf2)</tspan><tspan x="810.0" dy="13.0">на фізичний APIC хоста (NDST)</tspan></text>
<rect x="382.2" y="242.5" width="175.6" height="65.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="470.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">5. Апаратне перехоплення ЦП</tspan><tspan x="470.0" dy="13.0">Фізичний CPU у режимі гостя:</tspan><tspan x="470.0" dy="13.0">Переносить PIR[255:0] → vIRR</tspan><tspan x="470.0" dy="13.0">Скидає ON = 0 (0 VM-Exit!)</tspan></text>
<rect x="28.0" y="242.5" width="204.1" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">6. Виконання в гостьовій ОС</tspan><tspan x="130.0" dy="13.0">ЦП порівнює RVI &gt; PPR</tspan><tspan x="130.0" dy="13.0">та викликає гостьовий IDT handler</tspan><tspan x="130.0" dy="13.0">із затримкою &lt; 100 нс</tspan></text>
<rect x="259.6" y="414.0" width="420.7" height="52.0" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/><text x="470.0" y="430.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Альтернативна гілка: vCPU спить / заблокований (HLT)</tspan><tspan x="470.0" dy="13.0">KVM виставляє NV = 0xf1 (Wakeup Vector) → Host CPU приймає IPI →</tspan><tspan x="470.0" dy="13.0">Викликає pi_wakeup_handler() → Пробуджує потік vCPU в планувальнику CFS</tspan></text>
<line x1="237.1" y1="115.0" x2="371.5" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="568.5" y1="115.0" x2="697.2" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="810.0" y1="160.0" x2="810.0" y2="230.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="700.1" y1="275.0" x2="562.8" y2="275.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="377.2" y1="275.0" x2="237.1" y2="275.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="350.0" y1="115.0" x2="300.0" y2="115.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="300.0" y1="115.0" x2="300.0" y2="400.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="300.0" y1="400.0" x2="300.0" y2="415.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>