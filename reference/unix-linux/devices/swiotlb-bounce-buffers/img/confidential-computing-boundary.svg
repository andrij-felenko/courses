<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підмінні буфери як межа безпеки в Confidential VM (AMD SEV / Intel TDX)</text>
<rect x="40.0" y="65.0" width="550.0" height="390.0" rx="6" fill="#fdfefe" stroke="#2457d6" stroke-width="2.0"/>
<text x="315.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Конфіденційна гостьова система (Guest VM)</text>
<rect x="60.0" y="115.0" width="510.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="315.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Приватна пам'ять гостя (Encrypted Memory / C-bit=1)</text>
<rect x="80.0" y="155.0" width="470.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Оперативна пам'ять ядра, програми, стек, файлові буфери</tspan><tspan x="315.0" dy="15.6">Зашифрована апаратним ключем процесора (AES-128/256)</tspan></text>
<rect x="80.0" y="214.0" width="470.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="315.0" y="234.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="315.0" dy="0.0">Гіпервізор бачить тут лише зашифрований шум</tspan><tspan x="315.0" dy="14.3">Прямий доступ зовнішніх пристроїв сюди заборонений залізом</tspan></text>
<rect x="60.0" y="290.0" width="510.0" height="145.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="315.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Спільна відкрита пам'ять (Decrypted Shared Memory / C-bit=0)</text>
<rect x="80.0" y="328.0" width="470.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="315.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Пул SWIOTLB у гостьовій системі (swiotlb=force)</tspan><tspan x="315.0" dy="15.6">Сторінки навмисно розшифровано через set_memory_decrypted()</tspan></text>
<rect x="80.0" y="388.0" width="470.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="315.0" y="411.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Тільки тут лежать підмінні буфери введення-виведення</tspan></text>
<rect x="680.0" y="65.0" width="340.0" height="390.0" rx="6" fill="#fbfcfc" stroke="#c0392b" stroke-width="2.0"/>
<text x="850.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Недовірений хост / Гіпервізор</text>
<rect x="700.0" y="125.0" width="300.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">KVM / QEMU / Емульовані пристрої</tspan><tspan x="850.0" dy="16.9">(VirtIO-net, VirtIO-blk, VFIO)</tspan></text>
<rect x="700.0" y="220.0" width="300.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Апаратна шина PCIe хоста</tspan><tspan x="850.0" dy="16.9">та фізичні мережеві карти / NVMe</tspan></text>
<line x1="700.0" y1="160.0" x2="590.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 4"/>
<rect x="595.0" y="148.0" width="80.0" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="156.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">Блоковано</tspan></text>
<line x1="700.0" y1="355.0" x2="590.0" y2="355.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="595.0" y="328.0" width="80.0" height="24.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">DMA</tspan></text>
<line x1="315.0" y1="275.0" x2="315.0" y2="290.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="530.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">SWIOTLB ізолює конфіденційну пам'ять гостя від недовіреного гіпервізора та пристроїв хоста</text>
</svg>