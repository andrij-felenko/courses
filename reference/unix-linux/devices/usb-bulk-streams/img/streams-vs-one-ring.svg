<rect x="60.0" y="560.0" width="1300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="605.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Дзвінок тепер називає й номер стриму: «на цій точці в цьому кільці є робота».</tspan><tspan x="710.0" dy="18.2">Подія про завершення теж несе номер — інакше драйвер не знав би, до якого зі своїх кілець прив'язати відповідь.</tspan></text>
