<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння механізмів переривань INTx та MSI/MSI-X</text>
<rect x="85.7" y="66.0" width="388.6" height="38.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">1. Legacy INTx (In-Band Message Emulation)</tspan></text>
<rect x="185.9" y="154.2" width="188.2" height="51.6" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">PCIe Endpoint</tspan><tspan x="280.0" dy="15.6">Генерує TLP: Assert_INTA</tspan></text>
<rect x="79.9" y="266.4" width="400.2" height="67.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">PCI Bridge / Host Controller</tspan><tspan x="280.0" dy="15.6">Перетворює TLP на фізичну IRQ-лінію (наприклад, IRQ 16)</tspan><tspan x="280.0" dy="15.6">Спільне використання лінії (Interrupt Sharing!)</tspan></text>
<line x1="280.0" y1="207.8" x2="280.0" y2="264.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="114.1" y="406.4" width="331.8" height="67.2" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">CPU Core</tspan><tspan x="280.0" dy="15.6">Викликає ВСІ обробники, підключені до IRQ 16</tspan><tspan x="280.0" dy="15.6">Повільно, вимагає опитання регістрів пристрою</tspan></text>
<line x1="280.0" y1="335.6" x2="280.0" y2="404.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="617.0" y="66.0" width="405.9" height="38.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">2. MSI / MSI-X (Message Signaled Interrupts)</tspan></text>
<rect x="630.2" y="146.4" width="379.7" height="67.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">PCIe Endpoint (NVMe / NIC)</tspan><tspan x="820.0" dy="15.6">Вибирає вектор переривання N з MSI-X таблиці (в BAR)</tspan><tspan x="820.0" dy="15.6">Генерує PCIe Memory Write TLP</tspan></text>
<rect x="619.9" y="266.4" width="400.2" height="67.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Local APIC Message Address (0xFEE00000 + CPU_ID)</tspan><tspan x="820.0" dy="15.6">Прямий запис у пам'ять системного контролера переривань</tspan><tspan x="820.0" dy="15.6">Немає розділення ліній (No Sharing), унікальний вектор!</tspan></text>
<line x1="820.0" y1="215.6" x2="820.0" y2="264.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="637.0" y="406.4" width="366.0" height="67.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Прив'язане ядро CPU (CPU Affinity)</tspan><tspan x="820.0" dy="15.6">Викликає ТІЛЬКИ конкретний обробник черги DMA</tspan><tspan x="820.0" dy="15.6">Максимальна паралельність та відсутність блокувань</tspan></text>
<line x1="820.0" y1="335.6" x2="820.0" y2="404.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>