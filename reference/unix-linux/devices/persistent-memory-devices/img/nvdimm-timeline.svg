<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 1029" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="1029" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">три різні речі, які легко сплутати в одну: залізо, папір, код</text>
<rect x="70.0" y="72.0" width="390.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="265.0" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">залізо на ринку</tspan></text>
<rect x="475.0" y="72.0" width="390.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="670.0" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">стандарт на папері</tspan></text>
<rect x="880.0" y="72.0" width="390.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1075.0" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1075.0" dy="0.0">код у ядрі Linux</tspan></text>
<rect x="70.0" y="148.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">2008-2014</tspan></text>
<rect x="290.0" y="148.0" width="960.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">планки з DRAM, флешем і суперконденсатором: NVvault, AGIGARAM, ArxCis-NV</tspan><tspan x="770.0" dy="16.2">у кожного виробника своя утиліта й свій спосіб описати себе системі</tspan></text>
<rect x="70.0" y="219.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">квітень 2015</tspan></text>
<rect x="290.0" y="219.0" width="960.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ACPI 6.0 вносить таблицю NFIT: прошивка нарешті вміє сказати ядру,</tspan><tspan x="770.0" dy="16.2">які діапазони адрес постійні та з яких планок складені</tspan></text>
<rect x="70.0" y="290.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">квітень 2015</tspan></text>
<rect x="290.0" y="290.0" width="960.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">NVDIMM Namespace Specification 1.0 фіксує формат міток —</tspan><tspan x="770.0" dy="16.2">як поділ місткості зберігає своє ім'я на самій планці</tspan></text>
<rect x="70.0" y="361.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">травень 2015</tspan></text>
<rect x="290.0" y="361.0" width="960.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">JEDEC JC-45 ухвалює перші стандарти гібридних модулів DDR4:</tspan><tspan x="770.0" dy="16.2">NVDIMM-N і NVDIMM-F; NVDIMM-P як протокол виходить аж 2020-2021</tspan></text>
<rect x="70.0" y="432.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="467.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">червень 2015</tspan></text>
<rect x="290.0" y="432.0" width="960.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро 4.1: драйвер pmem віддає блоковим пристроєм діапазон,</tspan><tspan x="770.0" dy="16.2">який людина сама вирізала з карти пам'яті параметром memmap=</tspan></text>
<rect x="70.0" y="503.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="538.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">серпень 2015</tspan></text>
<rect x="290.0" y="503.0" width="960.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="530.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро 4.2: підсистема libnvdimm (серія Dan Williams, Intel) —</tspan><tspan x="770.0" dy="16.2">планки, області, мітки й простори імен як дерево пристроїв</tspan></text>
<rect x="70.0" y="574.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="609.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">липень 2016</tspan></text>
<rect x="290.0" y="574.0" width="960.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="601.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро 4.7: device-dax — той самий діапазон віддається не файловою</tspan><tspan x="770.0" dy="16.2">системою, а окремим символьним пристроєм без блокового шару</tspan></text>
<rect x="70.0" y="645.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="680.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">травень 2017</tspan></text>
<rect x="290.0" y="645.0" width="960.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="672.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">UEFI 2.7 забирає протокол міток до себе: формат стає спільним</tspan><tspan x="770.0" dy="16.2">для прошивки й операційної системи, а не приватним для Linux</tspan></text>
<rect x="70.0" y="716.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="751.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">травень 2019</tspan></text>
<rect x="290.0" y="716.0" width="960.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="743.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро 5.1: dax_kmem віддає діапазон розподільникові сторінок —</tspan><tspan x="770.0" dy="16.2">місткість стає вузлом NUMA, у якого є пам'ять і немає процесора</tspan></text>
<rect x="70.0" y="787.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="822.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">травень 2022</tspan></text>
<rect x="290.0" y="787.0" width="960.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="814.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро 5.18: гілку BLK з блоковими вікнами викидають —</tspan><tspan x="770.0" dy="16.2">сім років коду під залізо, яке так і не вийшло на ринок</tspan></text>
<rect x="70.0" y="858.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="893.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">2022-2023</tspan></text>
<rect x="290.0" y="858.0" width="960.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="885.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Intel згортає Optane, а серію 300 скасовує з 31 січня 2023 —</tspan><tspan x="770.0" dy="16.2">масових планок постійної пам'яті на ринку більше немає</tspan></text>
<rect x="70.0" y="947.0" width="1180.0" height="62.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.8"/><text x="660.0" y="974.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">папір випереджав залізо, а ядро йшло за папером —</tspan><tspan x="660.0" dy="16.9">тому в ньому роками жив драйвер, для якого не існувало жодної планки</tspan></text>
</svg>