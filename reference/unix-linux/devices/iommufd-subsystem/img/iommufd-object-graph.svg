<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф об'єктів підсистеми IOMMUFD у ядрі Linux</text>
<rect x="222.5" y="50.0" width="414.9" height="49.9" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/><text x="430.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">iommufd_ctx (Дескриптор файлу /dev/iommufd)</tspan><tspan x="430.0" dy="16.9">Кореневий простір імен для всіх дескрипторів uAPI</tspan></text>
<rect x="75.1" y="146.8" width="229.8" height="76.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">IOAS (I/O Address Space)</tspan><tspan x="190.0" dy="15.0">• Логічний контейнер IOVA -&gt; HVA</tspan><tspan x="190.0" dy="15.0">• Таблиця сторінок IOPT</tspan><tspan x="190.0" dy="15.0">• Спільний облік pin_user_pages</tspan></text>
<rect x="388.7" y="146.8" width="262.5" height="76.4" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="520.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">HWPT (Hardware Page Table)</tspan><tspan x="520.0" dy="15.0">• Фізичний домен IOMMU</tspan><tspan x="520.0" dy="15.0">• Stage 1 (Guest) або Stage 2 (Host)</tspan><tspan x="520.0" dy="15.0">• Автоматичний або вкладений (Nested)</tspan></text>
<rect x="654.2" y="150.1" width="191.6" height="69.9" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Fault Queue</tspan><tspan x="750.0" dy="14.3">• Черга сторінкових помилок</tspan><tspan x="750.0" dy="14.3">• Доставка PRI у userspace</tspan><tspan x="750.0" dy="14.3">• Обробка сторінок на вимогу</tspan></text>
<rect x="224.2" y="298.8" width="271.6" height="42.5" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="360.0" y="316.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">iommufd_device (DevID #1)</tspan><tspan x="360.0" dy="15.0">Прив'язка фізичного PCIe пристрою (GPU)</tspan></text>
<rect x="544.2" y="298.8" width="271.6" height="42.5" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="680.0" y="316.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">iommufd_device (DevID #2)</tspan><tspan x="680.0" dy="15.0">Прив'язка фізичного PCIe пристрою (NIC)</tspan></text>
