<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Накопичувач на BLAKE2s і генератор на ChaCha20</text>
<rect x="40.0" y="56.0" width="268.0" height="50.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="2.0"/><text x="174.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">події заліза</tspan></text>
<rect x="40.0" y="124.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="174.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">переривання, введення,</tspan><tspan x="174.0" dy="15.6">диски, інструкція</tspan><tspan x="174.0" dy="15.6">процесора, прошивка</tspan></text>
<rect x="40.0" y="238.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="174.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="174.0" dy="0.0">надходять коли завгодно,</tspan><tspan x="174.0" dy="15.6">дрібними й нерівними</tspan><tspan x="174.0" dy="15.6">порціями</tspan></text>
<line x1="314.0" y1="81.0" x2="346.0" y2="81.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="352.0" y="56.0" width="268.0" height="50.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="2.0"/><text x="486.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="486.0" dy="0.0">накопичувач</tspan></text>
<rect x="352.0" y="124.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="486.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="486.0" dy="0.0">стан геш-функції</tspan><tspan x="486.0" dy="15.6">BLAKE2s, 256 бітів</tspan><tspan x="486.0" dy="15.6">(mix_pool_bytes)</tspan></text>
<rect x="352.0" y="238.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="486.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="486.0" dy="0.0">усе вмішується всередину;</tspan><tspan x="486.0" dy="15.6">дістати назад окремий</tspan><tspan x="486.0" dy="15.6">внесок неможливо</tspan></text>
<line x1="626.0" y1="81.0" x2="658.0" y2="81.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="664.0" y="56.0" width="268.0" height="50.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="2.0"/><text x="798.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="798.0" dy="0.0">ключ генератора</tspan></text>
<rect x="664.0" y="124.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.5"/><text x="798.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="798.0" dy="0.0">base_crng: ключ ChaCha20</tspan><tspan x="798.0" dy="15.6">на 256 бітів</tspan><tspan x="798.0" dy="15.6">+ номер покоління</tspan></text>
<rect x="664.0" y="238.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="798.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="798.0" dy="0.0">перезаряджається з</tspan><tspan x="798.0" dy="15.6">накопичувача раз на 60 с</tspan><tspan x="798.0" dy="15.6">і при появі ентропії</tspan></text>
<line x1="938.0" y1="81.0" x2="970.0" y2="81.0" stroke="#7a4fb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="976.0" y="56.0" width="268.0" height="50.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="2.0"/><text x="1110.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">потоки на ядрах</tspan></text>
<rect x="976.0" y="124.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1110.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">на кожному ядрі свій</tspan><tspan x="1110.0" dy="15.6">примірник ChaCha20,</tspan><tspan x="1110.0" dy="15.6">без спільного замка</tspan></text>
<rect x="976.0" y="238.0" width="268.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1110.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1110.0" dy="0.0">перший блок шифру стирає</tspan><tspan x="1110.0" dy="15.6">власний ключ, решта йде</tspan><tspan x="1110.0" dy="15.6">на вихід</tspan></text>
<rect x="40.0" y="372.0" width="1204.0" height="52.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="642.0" y="402.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">усе, що ліворуч, працює на дві потреби: набрати перші 256 бітів невідомості й далі не дати ключу застаріти</tspan></text>
<line x1="227.3" y1="436.0" x2="227.3" y2="470.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="478.0" width="374.7" height="46.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/><text x="227.3" y="505.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="227.3" dy="0.0">getrandom()</tspan></text>
<rect x="40.0" y="534.0" width="374.7" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="227.3" y="561.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="227.3" dy="0.0">виклик без файлів</tspan><tspan x="227.3" dy="15.6">і без дескрипторів</tspan></text>
<line x1="642.0" y1="436.0" x2="642.0" y2="470.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="454.7" y="478.0" width="374.7" height="46.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/><text x="642.0" y="505.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">/dev/urandom, /dev/random</tspan></text>
<rect x="454.7" y="534.0" width="374.7" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="642.0" y="561.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="642.0" dy="0.0">той самий потік,</tspan><tspan x="642.0" dy="15.6">виданий через read()</tspan></text>
<line x1="1056.7" y1="436.0" x2="1056.7" y2="470.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="869.3" y="478.0" width="374.7" height="46.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/><text x="1056.7" y="505.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="1056.7" dy="0.0">сама система</tspan></text>
<rect x="869.3" y="534.0" width="374.7" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1056.7" y="561.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1056.7" dy="0.0">адреси ASLR, куки стека,</tspan><tspan x="1056.7" dy="15.6">номери портів, ключі</tspan></text>
<text x="650.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">накопичувач збирає невідомість, генератор роздає її без обмежень</text>
</svg>