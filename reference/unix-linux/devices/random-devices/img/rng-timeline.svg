<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 888" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="888" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова смуга підсистеми випадковості Linux</text>
<rect x="40.0" y="46.0" width="210.0" height="40.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="145.0" y="70.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">рік · версія ядра</tspan></text>
<rect x="264.0" y="46.0" width="660.0" height="40.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="594.0" y="70.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="594.0" dy="0.0">що сталося</tspan></text>
<rect x="938.0" y="46.0" width="360.0" height="40.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="1118.0" y="70.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1118.0" dy="0.0">що це змінило для читача байтів</tspan></text>
<rect x="40.0" y="102.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="145.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">1994 · random.c</tspan><tspan x="145.0" dy="18.2">1.3.30 (1995)</tspan></text>
<rect x="264.0" y="102.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="594.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">Теодор Тсо пише random.c: накопичувач-LFSR на 4096 бітів, бухгалтерія</tspan><tspan x="594.0" dy="16.2">ентропії, гешування замість шифру через експортні обмеження</tspan></text>
<rect x="938.0" y="102.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">два файли: /dev/random блокує, /dev/urandom — ні</tspan></text>
<rect x="40.0" y="210.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="145.0" y="262.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2014 · 3.17</tspan></text>
<rect x="264.0" y="210.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="594.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">скарга LibreSSL: файл потребує дескриптора й може бути відсутнім</tspan><tspan x="594.0" dy="16.2">у chroot — з'являється системний виклик getrandom()</tspan></text>
<rect x="938.0" y="210.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">перший інтерфейс, що вміє чекати засівання</tspan></text>
<rect x="40.0" y="318.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="145.0" y="370.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2016 · 4.8</tspan></text>
<rect x="264.0" y="318.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="594.0" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">генератор переведено на потоковий шифр ChaCha20</tspan></text>
<rect x="938.0" y="318.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">якість байтів більше не залежить від лічильника</tspan></text>
<rect x="40.0" y="426.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/><text x="145.0" y="478.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2019 · 5.4</tspan></text>
<rect x="264.0" y="426.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.5"/><text x="594.0" y="470.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">оптимізація ext4 у 5.3 зменшила переривання й машини перестали</tspan><tspan x="594.0" dy="16.2">завантажуватися; Торвальдс додає try_to_generate_entropy()</tspan></text>
<rect x="938.0" y="426.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="478.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">джерелом стає дрейф власного планувальника</tspan></text>
<rect x="40.0" y="534.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/><text x="145.0" y="586.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2020 · 5.6</tspan></text>
<rect x="264.0" y="534.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.5"/><text x="594.0" y="578.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">Енді Лутомирський прибирає блокувальний накопичувач,</tspan><tspan x="594.0" dy="16.2">Тсо погоджується відмовитися від бухгалтерії</tspan></text>
<rect x="938.0" y="534.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="586.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">/dev/random зрівняно з /dev/urandom</tspan></text>
<rect x="40.0" y="642.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="2.0"/><text x="145.0" y="694.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2022 · 5.17–5.18</tspan></text>
<rect x="264.0" y="642.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.5"/><text x="594.0" y="686.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">Джейсон Доненфельд переписує підсистему: SHA-1 → BLAKE2s,</tspan><tspan x="594.0" dy="16.2">стан на 256 бітів замість LFSR, раунд SipHash у перериваннях</tspan></text>
<rect x="938.0" y="642.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="694.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">поріг готовності піднято зі 128 до 256 бітів</tspan></text>
<rect x="40.0" y="750.0" width="210.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="145.0" y="802.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2024 · 6.11</tspan></text>
<rect x="264.0" y="750.0" width="660.0" height="96.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="594.0" y="794.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">getrandom() покладено у vDSO — байти породжуються</tspan><tspan x="594.0" dy="16.2">в самому процесі, без переходу в ядро</tspan></text>
<rect x="938.0" y="750.0" width="360.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1118.0" y="802.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1118.0" dy="0.0">ключ ядро стирає при fork і при клонуванні ВМ</tspan></text>
</svg>