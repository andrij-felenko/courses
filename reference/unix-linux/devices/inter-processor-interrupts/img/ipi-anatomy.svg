<rect x="1000.0" y="30.0" width="300.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1150.0" y="62.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1150.0" dy="0.0">ядро процесора 3 — ціль</tspan></text>
<rect x="40.0" y="120.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="147.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1 · заповнює описувач csd:</tspan><tspan x="190.0" dy="16.9">функція, аргумент, прапорець</tspan></text>
<rect x="40.0" y="206.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">2 · вкладає його в чергу цілі</tspan></text>
<rect x="40.0" y="292.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">3 · пише вектор у регістр</tspan><tspan x="190.0" dy="16.9">контролера переривань</tspan></text>
<rect x="40.0" y="378.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">4 · крутиться, чекаючи,</tspan><tspan x="190.0" dy="16.9">доки прапорець знімуть</tspan></text>
<rect x="1000.0" y="206.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1150.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">5 · переривання: прийшов вектор</tspan></text>
