<rect x="684.0" y="210.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="764.0" y="234.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="764.0" dy="0.0">csd</tspan><tspan x="764.0" dy="15.6">від ядра 5</tspan></text>
<rect x="470.0" y="340.0" width="400.0" height="116.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/>
<text x="670.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ЗАЛІЗО</text>
<text x="670.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер переривань</text>
<text x="670.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">вантаж — лише номер вектора</text>
