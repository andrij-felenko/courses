<rect x="40.0" y="630.0" width="560.0" height="64.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="667.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">черга була порожня — дзвонимо</tspan></text>
<rect x="636.0" y="630.0" width="560.0" height="64.0" rx="6" fill="#eef0f2" stroke="#333333" stroke-width="1.5"/><text x="916.0" y="667.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="916.0" dy="0.0">черга не порожня — дзвінок уже в дорозі</tspan></text>
