<rect x="1000.0" y="378.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1150.0" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">7 · виконує функцію</tspan><tspan x="1150.0" dy="16.9">й знімає прапорець</tspan></text>
