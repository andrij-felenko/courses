<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Програма пише в чанк, який ще жодного разу не змінювали від створення знімка</text>
<text x="80.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">origin — робочий том</text>
<rect x="80.0" y="126.0" width="250.0" height="52.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="205.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">чанк 0</tspan></text>
<rect x="80.0" y="188.0" width="250.0" height="52.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="205.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">чанк 1</tspan></text>
<rect x="80.0" y="250.0" width="250.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="205.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">чанк 2 — сюди пишуть</tspan></text>
<rect x="80.0" y="312.0" width="250.0" height="52.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="205.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">чанк 3</tspan></text>
<rect x="80.0" y="374.0" width="250.0" height="52.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="205.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">чанк 4</tspan></text>
<text x="460.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">таблиця винятків</text>
<rect x="460.0" y="126.0" width="300.0" height="176.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="480.0" y="150.0" width="260.0" height="40.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="610.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">чанк 0  →  COW 0</tspan></text>
<rect x="480.0" y="200.0" width="260.0" height="40.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="610.0" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">чанк 2  →  COW 1</tspan></text>
<text x="480.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="start">новий рядок з'явився щойно</text>
<text x="880.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">COW-том — сховище винятків</text>
<rect x="880.0" y="126.0" width="260.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="1010.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">COW 0 — старий чанк 0</tspan></text>
<rect x="880.0" y="188.0" width="260.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="1010.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">COW 1 — старий чанк 2</tspan></text>
<rect x="880.0" y="250.0" width="260.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">вільне</tspan></text>
<rect x="880.0" y="312.0" width="260.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">вільне</tspan></text>
<line x1="340.0" y1="322.0" x2="468.0" y2="322.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="770.0" y1="322.0" x2="872.0" y2="322.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="60.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">У що перетворюється один-єдиний запис програми:</text>
<rect x="60.0" y="460.0" width="260.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">① прочитати з origin</tspan><tspan x="190.0" dy="16.9">старий вміст чанка 2</tspan></text>
<rect x="345.0" y="460.0" width="260.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="475.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">② записати цей вміст</tspan><tspan x="475.0" dy="16.9">у вільне місце COW-тому</tspan></text>
<rect x="630.0" y="460.0" width="260.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="760.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">③ додати рядок</tspan><tspan x="760.0" dy="16.9">у таблицю винятків</tspan></text>
<rect x="915.0" y="460.0" width="260.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1045.0" y="499.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1045.0" dy="0.0">④ і аж тепер покласти</tspan><tspan x="1045.0" dy="16.9">нові дані в origin</tspan></text>
<rect x="60.0" y="590.0" width="1100.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="624.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Поки чанк не скопійовано, кожен запис у нього коштує носієві вчетверо дорожче; наступні записи в той самий чанк — уже звичайні</tspan></text>
<rect x="60.0" y="676.0" width="1100.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="610.0" y="709.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Читання знімка: якщо чанк є в таблиці винятків — беремо з COW-тому, інакше — прямо з origin</tspan><tspan x="610.0" dy="18.2">Скільки місця треба COW-тому — залежить не від розміру тому, а від того, скільки різних чанків змінять</tspan></text>
</svg>