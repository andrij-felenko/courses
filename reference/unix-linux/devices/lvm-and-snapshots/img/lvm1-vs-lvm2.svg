<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">LVM1 — латка до ядра 2.2, у дереві з 2.4</text>
<rect x="50.0" y="70.0" width="600.0" height="62.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="350.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">простір користувача: команди LVM</tspan><tspan x="350.0" dy="18.2">лише передають накази модулю</tspan></text>
<line x1="350.0" y1="132.0" x2="350.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="168.0" width="600.0" height="232.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="350.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">один модуль ядра: lvm.o</text>
<rect x="80.0" y="214.0" width="540.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="350.0" y="240.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">розбір двійкових метаданих з диска</tspan></text>
<rect x="80.0" y="272.0" width="540.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="350.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">відображення екстентів на носії</tspan></text>
<rect x="80.0" y="330.0" width="540.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="350.0" y="356.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">знімки — лише для читання</tspan></text>
<text x="350.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">хто теж хоче підмінювати блоки — будує свій стек:</text>
<rect x="50.0" y="462.0" width="285.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="192.5" y="497.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="192.5" dy="0.0">md — дзеркала й RAID</tspan></text>
<rect x="365.0" y="462.0" width="285.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="507.5" y="497.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">cryptoloop — шифрування</tspan></text>
<rect x="50.0" y="556.0" width="600.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="591.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">три незалежні механізми роблять те саме й не складаються один з одним</tspan></text>
<line x1="680.0" y1="60.0" x2="680.0" y2="630.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="1010.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">LVM2 — ядро 2.6, від 17 грудня 2003</text>
<rect x="710.0" y="70.0" width="600.0" height="62.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="1010.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">простір користувача: lvm2 + libdevmapper</tspan><tspan x="1010.0" dy="18.2">читають текстові метадані, складають таблицю</tspan></text>
<line x1="1010.0" y1="132.0" x2="1010.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="168.0" width="600.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="1010.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">device mapper у ядрі</text>
<text x="1010.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">виконує таблицю «діапазон адрес → ціль»</text>
<text x="1010.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">про групи томів не знає нічого</text>
<line x1="779.8" y1="264.0" x2="779.8" y2="306.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="710.0" y="306.0" width="139.5" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="779.8" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="779.8" dy="0.0">linear</tspan></text>
<line x1="933.2" y1="264.0" x2="933.2" y2="306.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="863.5" y="306.0" width="139.5" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="933.2" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="933.2" dy="0.0">snapshot</tspan></text>
<line x1="1086.8" y1="264.0" x2="1086.8" y2="306.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="1017.0" y="306.0" width="139.5" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="1086.8" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1086.8" dy="0.0">crypt</tspan></text>
<line x1="1240.2" y1="264.0" x2="1240.2" y2="306.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="1170.5" y="306.0" width="139.5" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="1240.2" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.2" dy="0.0">mirror</tspan></text>
<text x="1010.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">цілі — змінний список, ядро добудовують без LVM:</text>
<rect x="710.0" y="408.0" width="600.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="440.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">згодом сюди ж стали multipath, thin, dm-verity, dm-cache</tspan></text>
<rect x="710.0" y="490.0" width="600.0" height="128.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1010.0" y="557.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">механіка спільна: знімки, шифрування й дзеркала стали цілями ОДНОГО шару, а політику «з яких екстентів скласти том» винесено нагору, у програму</tspan></text>
</svg>