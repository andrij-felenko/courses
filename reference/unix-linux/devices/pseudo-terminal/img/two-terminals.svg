<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два термінали в одній програмі</text>
<text x="560.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">натиснуто одну клавішу «l»</text>
<rect x="40.0" y="60.0" width="300.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="96.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">наш термінал і наш процес</tspan><tspan x="190.0" dy="15.6">сирий режим: ECHO, ICANON, ISIG вимкнено</tspan><tspan x="190.0" dy="15.6">read(0) → write(ведучий)</tspan></text>
<line x1="346.0" y1="112.0" x2="434.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="60.0" width="320.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="96.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ядро pty</tspan><tspan x="600.0" dy="15.6">ECHO повертає байт назад</tspan><tspan x="600.0" dy="15.6">ICANON тримає рядок до Enter</tspan></text>
<text x="812.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">після Enter</text>
<line x1="766.0" y1="116.0" x2="854.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="860.0" y="60.0" width="220.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">оболонка</tspan><tspan x="970.0" dy="15.6">читає підлеглий кінець</tspan></text>
<line x1="600.0" y1="160.0" x2="600.0" y2="248.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="620.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">відлуння: той самий байт на ведучому кінці</text>
<rect x="400.0" y="252.0" width="400.0" height="84.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">наш процес</tspan><tspan x="600.0" dy="15.6">read(ведучий) → write(1)</tspan></text>
<line x1="394.0" y1="294.0" x2="306.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="252.0" width="260.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">наш екран</tspan><tspan x="170.0" dy="15.6">«l» з'являється один раз</tspan></text>
<text x="560.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">лишили ECHO в себе — на екрані «ll»:</text>
<text x="560.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">символ намалювали б і ми, і ядро pty</text>
</svg>