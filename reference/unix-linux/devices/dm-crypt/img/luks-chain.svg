<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пароль не шифрує дані: він лише відмикає майстер-ключ</text>
<rect x="319.3" y="89.5" width="161.4" height="41.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">пароль користувача</tspan></text>
<rect x="888.6" y="84.2" width="242.9" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">його можна змінити,</tspan><tspan x="1010.0" dy="15.6">не чіпаючи жодного сектора даних</tspan></text>
<line x1="660.0" y1="110.0" x2="830.0" y2="110.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="278.6" y="221.1" width="242.9" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Argon2id: сіль, час і пам'ять</tspan><tspan x="400.0" dy="16.9">узяті з опису слота</tspan></text>
<rect x="854.4" y="224.2" width="311.3" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">повільно й на десятки мегабайтів пам'яті —</tspan><tspan x="1010.0" dy="15.6">щоб перебір коштував дорого</tspan></text>
<line x1="660.0" y1="250.0" x2="830.0" y2="250.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="348.9" y="369.5" width="102.1" height="41.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ключ слота</tspan></text>
<rect x="902.2" y="364.2" width="215.5" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">живе лише кілька мілісекунд,</tspan><tspan x="1010.0" dy="15.6">на диску його немає</tspan></text>
<line x1="660.0" y1="390.0" x2="830.0" y2="390.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="286.0" y="501.1" width="228.1" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">розшифрувати матеріал слота</tspan><tspan x="400.0" dy="16.9">і згорнути смуги назад</tspan></text>
<rect x="874.9" y="504.2" width="270.2" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="526.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">матеріал роздутий у 4000 смуг:</tspan><tspan x="1010.0" dy="15.6">затерта частина губить ключ назавжди</tspan></text>
<line x1="660.0" y1="530.0" x2="830.0" y2="530.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="300.8" y="649.5" width="198.4" height="41.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="674.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">майстер-ключ, 512 бітів</tspan></text>
<rect x="895.4" y="644.2" width="229.2" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="666.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">узятий із джерела випадковості</tspan><tspan x="1010.0" dy="15.6">один раз, при створенні тому</tspan></text>
<line x1="660.0" y1="670.0" x2="830.0" y2="670.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="304.5" y="771.0" width="191.0" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="796.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">рядок таблиці dm-crypt</tspan><tspan x="400.0" dy="16.9">або кільце ключів ядра</tspan></text>
<rect x="902.2" y="774.2" width="215.5" height="51.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1010.0" y="796.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">далі заголовок не потрібен —</tspan><tspan x="1010.0" dy="15.6">працює вже сама ціль</tspan></text>
<line x1="660.0" y1="800.0" x2="830.0" y2="800.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="400.0" y1="130.5" x2="400.0" y2="221.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="278.9" x2="400.0" y2="369.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="410.5" x2="400.0" y2="501.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="559.0" x2="400.0" y2="649.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="690.5" x2="400.0" y2="771.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="105.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">слотів вісім;</text>
<text x="105.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кожен веде</text>
<text x="105.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">до того самого</text>
<text x="105.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">майстер-ключа</text>
</svg>