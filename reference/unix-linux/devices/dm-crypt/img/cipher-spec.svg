<text x="592.4" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">random</text>
<text x="592.4" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">IV лежить у метаданих сектора</text>
<text x="70.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Роль сегмента визначає позиція, а не назва: останній сегмент — завжди режим нумерації IV.</text>
<text x="70.0" y="573.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Двокрапка всередині сегмента — його власний параметр: :keycount у першому, :ivopts в останньому.</text>
