<text x="257.6" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">capi:authenc(hmac(sha256),xts(aes))</text>
<text x="257.6" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">шифр разом із кодом автентичності</text>
