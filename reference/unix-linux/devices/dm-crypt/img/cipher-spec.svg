<text x="183.2" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">capi:xts(aes)</text>
<text x="183.2" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">алгоритм і режим одним іменем</text>
<text x="313.4" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">-</text>
<rect x="330.4" y="263.0" width="151.1" height="74.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="405.9" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">plain64</text>
<text x="405.9" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">режим нумерації IV</text>
<text x="70.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">capi: з автентифікацією — вимагає ще й integrity:&lt;байти&gt;:aead</text>
