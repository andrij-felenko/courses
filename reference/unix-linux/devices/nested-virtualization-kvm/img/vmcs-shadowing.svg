<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація VMCS Shadowing: скорочення трапів у L0</text>
<rect x="40.0" y="55.0" width="360.0" height="335.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Без VMCS Shadowing</text>
<rect x="60.0" y="105.0" width="320.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">L1 виконує VMREAD / VMWRITE</tspan><tspan x="220.0" dy="16.9">до VMCS12</tspan></text>
<line x1="220.0" y1="155.0" x2="220.0" y2="195.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Кожен виклик = VM Exit!</text>
<rect x="60.0" y="195.0" width="320.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">L0 (Host KVM) перехоплює trap,</tspan><tspan x="220.0" dy="16.9">програмно емулює читання/запис</tspan></text>
<line x1="220.0" y1="250.0" x2="220.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="290.0" width="320.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/><text x="220.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Результат: тисячі VM Exits</tspan><tspan x="220.0" dy="16.9">на один цикл запуску L2</tspan><tspan x="220.0" dy="16.9">(Колосальні накладні витрати)</tspan></text>
<rect x="440.0" y="55.0" width="360.0" height="335.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="620.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">З VMCS Shadowing (Intel Haswell+)</text>
<rect x="460.0" y="105.0" width="320.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">L1 виконує VMREAD / VMWRITE</tspan><tspan x="620.0" dy="16.9">до VMCS12</tspan></text>
<line x1="620.0" y1="155.0" x2="620.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Без VM Exit (HW direct)</text>
<rect x="460.0" y="195.0" width="320.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Процесор оновлює Shadow VMCS</tspan><tspan x="620.0" dy="16.9">прямо в пам'яті за VMCS Pointer</tspan></text>
<line x1="620.0" y1="250.0" x2="620.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="290.0" width="320.0" height="75.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="620.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">VM Exit викликається ЛИШЕ на</tspan><tspan x="620.0" dy="16.9">VMLAUNCH / VMRESUME</tspan><tspan x="620.0" dy="16.9">(Синхронізація VMCS02 в L0)</tspan></text>
</svg>