<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація EPT Violations та злиття EPT02 у KVM</text>
<rect x="40.0" y="50.0" width="160.0" height="60.0" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1.5"/><text x="120.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">L2 GVA</tspan><tspan x="120.0" dy="16.9">(Віртуальна L2)</tspan></text>
<line x1="200.0" y1="80.0" x2="240.0" y2="80.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Page Tables</text>
<rect x="240.0" y="50.0" width="160.0" height="60.0" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1.5"/><text x="320.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">L2 GPA</tspan><tspan x="320.0" dy="16.9">(Фізична L2)</tspan></text>
<line x1="400.0" y1="80.0" x2="440.0" y2="80.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f39c12" text-anchor="middle" font-weight="700">EPT12 (L1)</text>
<rect x="440.0" y="50.0" width="160.0" height="60.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="520.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">L1 GPA</tspan><tspan x="520.0" dy="16.9">(Фізична L1)</tspan></text>
<line x1="600.0" y1="80.0" x2="640.0" y2="80.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">EPT01 (L0)</text>
<rect x="640.0" y="50.0" width="160.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">L0 HPA</tspan><tspan x="720.0" dy="16.9">(Дійсна DRAM)</tspan></text>
<rect x="180.0" y="150.0" width="480.0" height="65.0" rx="6" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/><text x="420.0" y="179.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Злиття в L0: Тіньовий EPT (EPT02 = EPT12 + EPT01)</tspan><tspan x="420.0" dy="11.7">Апаратне забезпечення MMU використовує єдиний EPTP02 для трансляції L2 GPA -&gt; L0 HPA</tspan></text>
<line x1="420.0" y1="215.0" x2="420.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Порушення EPT (EPT Violation) під час виконання L2</text>
<rect x="220.0" y="255.0" width="400.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Апаратний VM Exit до L0 (Host KVM)</tspan></text>
<line x1="320.0" y1="300.0" x2="200.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="300.0" x2="640.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="345.0" width="320.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="373.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Сценарій А: Помилка у мапінгу EPT01</tspan><tspan x="200.0" dy="15.6">(Хостовий swap / розширення пам'яті L1)</tspan><tspan x="200.0" dy="15.6">L0 виправляє мапінг, оновлює EPT02,</tspan><tspan x="200.0" dy="15.6">повертає управління L2 (L1 не залучається)</tspan></text>
<rect x="480.0" y="345.0" width="320.0" height="95.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="640.0" y="373.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Сценарій Б: Помилка у мапінгу EPT12</tspan><tspan x="640.0" dy="15.6">(Пам'ять не виділена у L1 для L2)</tspan><tspan x="640.0" dy="15.6">L0 впорскує синтетичний EPT Exit у L1.</tspan><tspan x="640.0" dy="15.6">L1 обробляє помилку та робить VMRESUME</tspan></text>
</svg>