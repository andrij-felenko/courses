<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="270.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">процес</text>
<text x="770.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро</text>
<text x="1240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер</text>
<rect x="137.4" y="144.2" width="265.1" height="91.7" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">struct nvme_passthru_cmd — 72 Б</tspan><tspan x="270.0" dy="16.9">opcode 0x06 · nsid · cdw10 = CNS</tspan><tspan x="270.0" dy="16.9">addr · data_len = 4096</tspan><tspan x="270.0" dy="16.9">result — сюди ляже CDW0</tspan></text>
<rect x="641.1" y="152.6" width="257.7" height="74.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">перевірка прав,</tspan><tspan x="770.0" dy="16.9">копія 72 Б із процесу,</tspan><tspan x="770.0" dy="16.9">з неї ядро складає 64 Б команди</tspan></text>
<rect x="1155.6" y="161.1" width="168.8" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1240.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">адміністративна</tspan><tspan x="1240.0" dy="16.9">пара черг (номер 0)</tspan></text>
<line x1="410.6" y1="190.0" x2="633.1" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="906.9" y1="190.0" x2="1147.6" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="174.5" y="351.1" width="191.0" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">буфер 4096 Б,</tspan><tspan x="270.0" dy="16.9">вирівняний на сторінку</tspan></text>
<line x1="270.0" y1="241.8" x2="270.0" y2="345.1" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="652.3" y="342.6" width="235.5" height="74.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="770.0" y="367.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">сторінки буфера відображено</tspan><tspan x="770.0" dy="16.9">для DMA — а якщо адреса</tspan><tspan x="770.0" dy="16.9">не вирівняна, зроблено копію</tspan></text>
<line x1="373.5" y1="380.0" x2="644.3" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="895.7" y1="380.0" x2="1280.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1280.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">відповідь пише сам пристрій</text>
<rect x="1133.4" y="581.0" width="213.2" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1240.0" y="606.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">комірка завершення, 16 Б:</tspan><tspan x="1240.0" dy="16.9">статус (15 бітів) і CDW0</tspan></text>
<line x1="1240.0" y1="440.0" x2="1240.0" y2="575.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="667.1" y="581.0" width="205.8" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="606.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ядро розводить відповідь</tspan><tspan x="770.0" dy="16.9">на два різні канали</tspan></text>
<line x1="1125.4" y1="610.0" x2="880.9" y2="610.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="492.6" width="279.9" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="517.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">що повернув ioctl — це СТАТУС:</tspan><tspan x="270.0" dy="16.9">0 — виконано · &gt; 0 — SCT/SC</tspan><tspan x="270.0" dy="16.9">−1 і errno — до пристрою не дійшло</tspan></text>
<rect x="141.1" y="712.6" width="257.7" height="74.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="737.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">cmd.result — це CDW0:</tspan><tspan x="270.0" dy="16.9">число, своє для кожної команди,</tspan><tspan x="270.0" dy="16.9">ознакою успіху воно не є</tspan></text>
<line x1="659.1" y1="588.0" x2="418.0" y2="545.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="659.1" y1="632.0" x2="406.9" y2="735.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>