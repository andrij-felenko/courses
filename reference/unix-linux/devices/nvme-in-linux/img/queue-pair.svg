<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="70.0" width="600.0" height="650.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.2"/>
<rect x="960.0" y="70.0" width="360.0" height="650.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.2"/>
<text x="350.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">пам'ять хоста (своя пара на ядро)</text>
<text x="1140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер NVMe</text>
<rect x="259.2" y="159.8" width="181.6" height="80.4" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">черга подань SQ</tspan><tspan x="350.0" dy="18.2">1024 комірки × 64 Б</tspan><tspan x="350.0" dy="18.2">хвіст рухає хост</tspan></text>
<rect x="166.6" y="292.1" width="366.9" height="55.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="350.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">① команду записано у вільну комірку —</tspan><tspan x="350.0" dy="16.9">звичайний запис у пам'ять, шини PCIe тут немає</tspan></text>
<rect x="247.2" y="430.7" width="205.6" height="98.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="457.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">черга завершень CQ</tspan><tspan x="350.0" dy="18.2">1024 комірки × 16 Б</tspan><tspan x="350.0" dy="18.2">у кожній — фазовий біт</tspan><tspan x="350.0" dy="18.2">голову рухає хост</tspan></text>
<rect x="166.6" y="612.0" width="366.9" height="55.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="350.0" y="636.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">⑥ свіжу комірку хост упізнає за фазовим бітом:</tspan><tspan x="350.0" dy="16.9">читання з власної пам'яті, а не з пристрою</tspan></text>
<rect x="1045.2" y="168.9" width="189.6" height="62.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">регістри-дзвінки</tspan><tspan x="1140.0" dy="18.2">хвіст SQ / голова CQ</tspan></text>
<rect x="1009.3" y="379.8" width="261.4" height="80.4" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">виконавець:</tspan><tspan x="1140.0" dy="18.2">забирає команди DMA,</tspan><tspan x="1140.0" dy="18.2">працює з мікросхемами пам'яті</tspan></text>
<rect x="1029.2" y="578.9" width="221.5" height="62.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="605.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">MSI-X: своє переривання</tspan><tspan x="1140.0" dy="18.2">на кожну чергу завершень</tspan></text>
<line x1="655.0" y1="160.0" x2="955.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="697.8" y="81.0" width="194.4" height="53.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="795.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">② один запис у регістр:</tspan><tspan x="795.0" dy="16.9">«мій хвіст тепер тут»</tspan></text>
<line x1="955.0" y1="280.0" x2="655.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="697.8" y="201.1" width="194.4" height="53.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="795.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">③ контролер сам читає</tspan><tspan x="795.0" dy="16.9">команду з пам'яті хоста</tspan></text>
<line x1="955.0" y1="455.0" x2="655.0" y2="455.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="694.1" y="376.1" width="201.8" height="53.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="795.0" y="399.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">⑤ завершення лягає в CQ,</tspan><tspan x="795.0" dy="16.9">далі — переривання</tspan></text>
<line x1="655.0" y1="640.0" x2="955.0" y2="640.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="708.9" y="561.0" width="172.2" height="53.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="795.0" y="584.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">⑦ дзвінок голови CQ:</tspan><tspan x="795.0" dy="16.9">комірки знову вільні</tspan></text>
</svg>