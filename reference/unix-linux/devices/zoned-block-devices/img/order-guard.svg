<text x="410.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">усі чотири в польоті; адресу назве пристрій</text>
<rect x="60.0" y="686.0" width="1160.0" height="84.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="640.0" y="723.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">перші дві відповіді бережуть порядок тим, що душать паралельність;</tspan><tspan x="640.0" dy="18.9">третя знімає саме питання порядку — і тим повертає паралельність назад</tspan></text>
</svg>