<text x="410.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">три інші чекають і тримають талони черги</text>
<rect x="60.0" y="300.0" width="300.0" height="74.0" rx="6" fill="#eef2f7" stroke="#b8860b" stroke-width="2.2"/><text x="210.0" y="332.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">затички запису в блоковому шарі</tspan><tspan x="210.0" dy="18.2">ядра 6.10 і новіші</tspan></text>
