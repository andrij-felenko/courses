<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири записи в одну зону: хто не дасть їм переплутатися</text>
<rect x="60.0" y="110.0" width="300.0" height="74.0" rx="6" fill="#eef2f7" stroke="#c0392b" stroke-width="2.2"/><text x="210.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">замок зони в планувальнику</tspan><tspan x="210.0" dy="18.2">ядра 4.10 – 6.9</tspan></text>
