<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">стани зони: чому пристрій узагалі їх розрізняє</text>
<rect x="75.0" y="168.5" width="170.0" height="43.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/><text x="160.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">ПОРОЖНЯ</tspan></text>
<rect x="435.0" y="168.5" width="170.0" height="43.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.2"/><text x="520.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ВІДКРИТА</tspan></text>
<rect x="795.0" y="168.5" width="170.0" height="43.0" rx="6" fill="#dfe8fc" stroke="#2457d6" stroke-width="2.2"/><text x="880.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">ПОВНА</tspan></text>
<rect x="435.0" y="378.5" width="170.0" height="43.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="2.2"/><text x="520.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ЗАКРИТА</tspan></text>
<line x1="251.0" y1="190.0" x2="429.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="340.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">перший запис</text>
<text x="340.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">або команда «відкрити»</text>
<line x1="611.0" y1="190.0" x2="789.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">запис дійшов кінця</text>
<text x="700.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">або команда «завершити»</text>
<line x1="492.0" y1="224.0" x2="492.0" y2="366.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="548.0" y1="366.0" x2="548.0" y2="224.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="590.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">«закрити» — пристрій</text>
<text x="590.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">забирає свій буфер назад</text>
<text x="240.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">новий запис — буфер</text>
<text x="240.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">доводиться видавати знову</text>
<line x1="880.0" y1="340.0" x2="880.0" y2="530.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="880.0" y1="530.0" x2="160.0" y2="530.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="160.0" y1="530.0" x2="160.0" y2="224.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="520.0" y="554.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">«скинути» — єдиний спосіб знову писати в ту саму зону</text>
<rect x="1010.0" y="140.0" width="240.0" height="96.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="1130.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">відкритих зон</tspan><tspan x="1130.0" dy="17.6">не більше ніж</tspan><tspan x="1130.0" dy="17.6">max_open_zones</tspan></text>
<rect x="1010.0" y="268.0" width="240.0" height="116.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="1130.0" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">відкритих плюс закритих</tspan><tspan x="1130.0" dy="17.6">не більше ніж</tspan><tspan x="1130.0" dy="17.6">max_active_zones</tspan><tspan x="1130.0" dy="17.6">(звідси й другий ліміт)</tspan></text>
</svg>