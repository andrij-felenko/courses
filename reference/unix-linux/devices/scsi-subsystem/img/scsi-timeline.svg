<rect x="341.0" y="141.6" width="208.0" height="72.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">жовтень 1981</tspan><tspan x="445.0" dy="16.9">спільна подача</tspan><tspan x="445.0" dy="16.9">Shugart і NCR</tspan></text>
