<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="670" fill="#ffffff"/>
