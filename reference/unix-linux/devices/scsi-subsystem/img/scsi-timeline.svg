<rect x="831.0" y="141.6" width="208.0" height="72.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">1996</tspan><tspan x="935.0" dy="16.9">SAM: команди окремо</tspan><tspan x="935.0" dy="16.9">від транспорту</tspan></text>
