<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві довжини сенс-буфера й ланцюг описувачів</text>
<text x="650.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки байтів сенс-буфера справді ваші</text>
<text x="650.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">буфер, який дав виклик — у ядра це 96 байтів на кожну команду</text>
<rect x="110.0" y="104.0" width="670.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">заповнено пристроєм: 8 + байт 7 (додаткова довжина)</tspan></text>
<rect x="780.0" y="104.0" width="420.0" height="56.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">решта — сміття від попередньої команди</tspan></text>
<text x="110.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">ланцюг описувачів у форматі 0x72 / 0x73</text>
<rect x="110.0" y="300.0" width="180.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">шапка — 8 байтів</tspan></text>
<line x1="290.0" y1="337.0" x2="320.0" y2="337.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="300.0" width="250.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">тип 0x00 · довж. 0x0A</tspan><tspan x="445.0" dy="16.9">номер блока, 8 байтів</tspan></text>
<line x1="570.0" y1="337.0" x2="600.0" y2="337.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="300.0" width="180.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">тип 0x05</tspan><tspan x="690.0" dy="16.9">довж. 0x02</tspan></text>
<line x1="780.0" y1="337.0" x2="810.0" y2="337.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="300.0" width="300.0" height="74.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">тип 0x0C · довж. 0x1E</tspan><tspan x="960.0" dy="16.9">обіцяє 32 байти, яких немає</tspan></text>
<line x1="780.0" y1="100.0" x2="780.0" y2="400.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="110.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">крок до наступного описувача = 2 + байт довжини</text>
<text x="810.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">далі читати не можна</text>
</svg>