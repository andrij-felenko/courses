<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири вироки над невдалою командою SCSI</text>
<text x="700.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невдала команда: від причини до вироку</text>
<rect x="100.0" y="120.0" width="520.0" height="59.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">BUSY   ·   TASK SET FULL</tspan><tspan x="360.0" dy="16.9">пристрій справний, але захлинувся</tspan></text>
<rect x="870.0" y="111.6" width="420.0" height="76.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">назад у чергу</tspan><tspan x="1080.0" dy="16.9">чекати звичайним порядком;</tspan><tspan x="1080.0" dy="16.9">надалі посилати менше команд</tspan></text>
<line x1="634.0" y1="150.0" x2="856.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="260.1" width="520.0" height="59.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">NOT READY   ·   пристрій готується</tspan><tspan x="360.0" dy="16.9">диск розкручується, масив збирається</tspan></text>
<rect x="870.0" y="251.6" width="420.0" height="76.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">повторити</tspan><tspan x="1080.0" dy="16.9">поки не вичерпано дозволені спроби</tspan><tspan x="1080.0" dy="16.9">(для диска — типово п'ять)</tspan></text>
<line x1="634.0" y1="290.0" x2="856.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="400.1" width="520.0" height="59.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">MEDIUM ERROR   ·   непоправне читання</tspan><tspan x="360.0" dy="16.9">ILLEGAL REQUEST   ·   RESERVATION CONFLICT</tspan></text>
<rect x="870.0" y="391.6" width="420.0" height="76.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">віддати нагору</tspan><tspan x="1080.0" dy="16.9">повтор нічого не змінить —</tspan><tspan x="1080.0" dy="16.9">це помилка вводу-виводу</tspan></text>
<line x1="634.0" y1="430.0" x2="856.0" y2="430.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="540.0" width="520.0" height="59.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="566.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">мовчання   ·   таймер сплив   ·   DID_TIME_OUT</tspan><tspan x="360.0" dy="16.9">сенс-даних немає взагалі</tspan></text>
<rect x="870.0" y="531.6" width="420.0" height="76.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">до обробника помилок</tspan><tspan x="1080.0" dy="16.9">скасувати команду,</tspan><tspan x="1080.0" dy="16.9">а не вийде — скидати</tspan></text>
<line x1="634.0" y1="570.0" x2="856.0" y2="570.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="660.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">вирішує одна функція ядра — scsi_decide_disposition</text>
</svg>