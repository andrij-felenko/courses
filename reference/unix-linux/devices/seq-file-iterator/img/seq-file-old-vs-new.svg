<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння старого підходу read_proc та підсистеми seq_file</text>
<rect x="40.0" y="60.0" width="530.0" height="560.0" rx="6" fill="#fdeeec" stroke="#6b7280" stroke-width="1.2"/>
<text x="305.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Старий інтерфейс: read_proc_t (Linux 2.2 / 2.4)</text>
<rect x="65.0" y="125.0" width="480.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Виклик ядра: драйвер отримує фіксовану сторінку пам'яті</tspan><tspan x="305.0" dy="16.9">char *page = PAGE_SIZE (4096 байтів)</tspan></text>
<rect x="65.0" y="220.0" width="480.0" height="85.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">sprintf(page + len, ...)</tspan><tspan x="305.0" dy="15.6">Драйвер форматує всі записи ядра в один суцільний буфер.</tspan><tspan x="305.0" dy="15.6">Якщо тексту більше ніж 4 КБ — затирання пам'яті ядра!</tspan></text>
<rect x="65.0" y="325.0" width="480.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Ручна розбивка на сторінки (пагінація):</tspan><tspan x="305.0" dy="15.6">• Зсув off рахується в байтах, а довжина рядків змінна</tspan><tspan x="305.0" dy="15.6">• *start та *eof обчислюються кожним автором вручну</tspan><tspan x="305.0" dy="15.6">• Результат: зсув lseek ламається, рядки дублюються або зникають</tspan></text>
<rect x="65.0" y="460.0" width="480.0" height="130.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="505.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Небезпека перегонів даних (race conditions):</tspan><tspan x="305.0" dy="15.6">Між системними викликами read(1024) стан списку змінюється,</tspan><tspan x="305.0" dy="15.6">байтовий зсув off вказує на середину чужого рядка.</tspan><tspan x="305.0" dy="15.6">Підсумок: падіння системи або пошкодження пам'яті.</tspan></text>
<rect x="630.0" y="60.0" width="530.0" height="560.0" rx="6" fill="#eff7ef" stroke="#6b7280" stroke-width="1.2"/>
<text x="895.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасний інтерфейс: seq_file (починаючи з 2.4.15)</text>
<rect x="655.0" y="125.0" width="480.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Абстракція послідовності: struct seq_operations</tspan><tspan x="895.0" dy="16.9">start() -&gt; show() -&gt; next() -&gt; stop()</tspan><tspan x="895.0" dy="16.9">Ядро оперує логічними об'єктами, а не сирими байтами</tspan></text>
<rect x="655.0" y="220.0" width="480.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="895.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Динамічний буфер з авторозширенням:</tspan><tspan x="895.0" dy="15.6">seq_printf(m, ...) пише в буфер struct seq_file.</tspan><tspan x="895.0" dy="15.6">При переповненні буфер подвоюється (4K -&gt; 8K -&gt; 16K -&gt; 32K...)</tspan></text>
<rect x="655.0" y="325.0" width="480.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="895.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Логічне позиціонування (*pos):</tspan><tspan x="895.0" dy="15.6">• *pos є номером запису (0, 1, 2...) або ID об'єкта</tspan><tspan x="895.0" dy="15.6">• lseek крокує послідовністю за допомогою start() та next()</tspan><tspan x="895.0" dy="15.6">• Повне позбавлення від ручного підрахунку байтів</tspan></text>
<rect x="655.0" y="460.0" width="480.0" height="130.0" rx="6" fill="#eef4fb" stroke="#27ae60" stroke-width="1.5"/><text x="895.0" y="507.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Надійна синхронізація та безпека:</tspan><tspan x="895.0" dy="14.3">• seq_file-&gt;lock (м'ютекс) захищає файл від гонитви читачів</tspan><tspan x="895.0" dy="14.3">• Замки структури / RCU захоплюються у start() і знімаються у stop()</tspan><tspan x="895.0" dy="14.3">• Коректна поведінка при зміні списку між читаннями</tspan></text>
<text x="600.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від низькорівневого копіювання до повноцінного ітератора структур ядра</text>
</svg>