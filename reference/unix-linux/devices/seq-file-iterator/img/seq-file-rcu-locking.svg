<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі синхронізації та захист структур ядра під час ітерації seq_file</text>
<rect x="50.0" y="50.0" width="1100.0" height="130.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.2"/>
<text x="80.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень файлового дескриптора: struct seq_file-&gt;lock (Mutex)</text>
<rect x="80.0" y="100.0" width="490.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="128.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Захоплюється під час входу в seq_read() / seq_lseek()</tspan><tspan x="325.0" dy="15.6">Захищає буфер m-&gt;buf, m-&gt;count, m-&gt;from від одночасних read()</tspan></text>
<rect x="610.0" y="100.0" width="510.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Гарантує послідовність викликів start/show/next/stop для одного struct file</tspan><tspan x="865.0" dy="14.3">(Запобігає пошкодженню стану ітератора спільними потоками)</tspan></text>
<rect x="50.0" y="210.0" width="1100.0" height="240.0" rx="6" fill="#eff7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Рівень даних ядра: межі критичної секції start() ... stop()</text>
<rect x="80.0" y="265.0" width="300.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">op-&gt;start(m, &amp;pos)</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">• rcu_read_lock()</tspan><tspan x="230.0" dy="15.6">або spin_lock_irqsave()</tspan><tspan x="230.0" dy="15.6">• Пошук вузла за pos</tspan><tspan x="230.0" dy="15.6">• Повертає вказівник v</tspan></text>
<line x1="380.0" y1="345.0" x2="440.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="265.0" width="320.0" height="160.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="324.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">op-&gt;show() та op-&gt;next()</tspan><tspan x="600.0" dy="11.7"></tspan><tspan x="600.0" dy="11.7">Виконуються ВСЕРЕДИНІ замка:</tspan><tspan x="600.0" dy="11.7">• Безпечне читання полів структури</tspan><tspan x="600.0" dy="11.7">• m-&gt;buf вже виділено, тому seq_printf не спить і не виділяє пам'ять</tspan></text>
<line x1="760.0" y1="345.0" x2="820.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="820.0" y="265.0" width="300.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">op-&gt;stop(m, v)</tspan><tspan x="970.0" dy="15.6"></tspan><tspan x="970.0" dy="15.6">• rcu_read_unlock()</tspan><tspan x="970.0" dy="15.6">або spin_unlock_irqrestore()</tspan><tspan x="970.0" dy="15.6">• Очищення локального контексту</tspan><tspan x="970.0" dy="15.6">• Кличеться ЗАВЖДИ у фіналі</tspan></text>
<rect x="50.0" y="480.0" width="1100.0" height="160.0" rx="6" fill="#f3f0fa" stroke="#6b7280" stroke-width="1.2"/>
<text x="80.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Між викликами read(): замок даних ЗВІЛЬНЕНО, але логічний індекс *pos збережено</text>
<rect x="80.0" y="530.0" width="320.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Виклик 1: read(fd, buf, 512)</tspan><tspan x="240.0" dy="15.6">Читає елементи pos: 0..15</tspan><tspan x="240.0" dy="15.6">stop() знімає RCU lock.</tspan><tspan x="240.0" dy="15.6">Ядро віддає керування в юзерспейс.</tspan></text>
<rect x="440.0" y="530.0" width="320.0" height="90.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Інший потік ядра модифікує список:</tspan><tspan x="600.0" dy="15.6">list_del_rcu(елемент 8)</tspan><tspan x="600.0" dy="15.6">list_add_tail_rcu(новий елемент)</tspan><tspan x="600.0" dy="15.6">Пам'ять видаленого жива до grace period</tspan></text>
<rect x="800.0" y="530.0" width="320.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Виклик 2: read(fd, buf, 512)</tspan><tspan x="960.0" dy="15.6">start(m, pos=16) знову бере RCU lock.</tspan><tspan x="960.0" dy="15.6">Позиція pos=16 знаходиться надійно</tspan><tspan x="960.0" dy="15.6">без падінь та виходу за межі пам'яті.</tspan></text>
<line x1="400.0" y1="575.0" x2="440.0" y2="575.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="760.0" y1="575.0" x2="800.0" y2="575.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>