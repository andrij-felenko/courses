<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння станів енергозбереження ACPI: S0, S0ix, S3 та S4</text>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани енергозбереження системи: від активного стану до глибокого сну</text>
<rect x="30.0" y="72.5" width="280.0" height="35.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="170.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">S0 (Working)</tspan></text>
<rect x="330.0" y="72.5" width="280.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="470.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">S0ix (Modern Standby)</tspan></text>
<rect x="660.0" y="72.5" width="280.0" height="35.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="800.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">S3 (Suspend to RAM)</tspan></text>
<rect x="990.0" y="72.5" width="280.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1130.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1130.0" dy="0.0">S4 (Hibernation)</tspan></text>
<text x="30.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Режим у Linux (/sys/power/state)</text>
<line x1="30.0" y1="158.0" x2="1330.0" y2="158.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="30.0" y="169.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">active (робочий)</tspan></text>
<rect x="330.0" y="169.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="470.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">freeze (s2idle)</tspan></text>
<rect x="660.0" y="169.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="800.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">mem (suspend-to-RAM)</tspan></text>
<rect x="990.0" y="169.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1130.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">disk (hibernation)</tspan></text>
<text x="30.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан процесора (CPU)</text>
<line x1="30.0" y1="253.0" x2="1330.0" y2="253.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="30.0" y="264.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">C0–C10 (активний / cpuidle)</tspan></text>
<rect x="317.5" y="264.8" width="305.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="470.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">SoC Power Gating (C10 / Package C-state)</tspan></text>
<rect x="643.9" y="264.8" width="312.1" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="800.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Вимкнено (живлення знято, контекст у RAM)</tspan></text>
<rect x="963.2" y="264.8" width="333.5" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1130.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">Вимкнено (живлення знято, контекст на диску)</tspan></text>
<text x="30.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан пам'яті (RAM)</text>
<line x1="30.0" y1="348.0" x2="1330.0" y2="348.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="30.0" y="359.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Активна (постійний рефреш)</tspan></text>
<rect x="324.6" y="359.8" width="290.8" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="470.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Self-Refresh коротко / низьке живлення</tspan></text>
<rect x="660.0" y="359.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="800.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Self-Refresh (автономне утримання)</tspan></text>
<rect x="990.0" y="359.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1130.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">Знеструмлена (образ скинуто в Swap)</tspan></text>
<text x="30.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Шини живлення платформи</text>
<line x1="30.0" y1="443.0" x2="1330.0" y2="443.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="21.1" y="454.8" width="297.9" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="475.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Всі увімкнені (+12V, +5V, +3.3V, Vcore)</tspan></text>
<rect x="328.2" y="454.8" width="283.6" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="470.0" y="475.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Vcore/GPU знеструмлені, PMIC активний</tspan></text>
<rect x="660.0" y="454.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="800.0" y="475.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Лише +5VSB та VDDQ (RAM retention)</tspan></text>
<rect x="988.2" y="454.8" width="283.6" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1130.0" y="475.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">Повне знеструмлення (0 Вт споживання)</tspan></text>
<text x="30.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Час пробудження (Latency)</text>
<line x1="30.0" y1="538.0" x2="1330.0" y2="538.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="30.0" y="549.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">0 мс (миттєво)</tspan></text>
<rect x="330.0" y="549.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="470.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">10–100 мс (без участі BIOS)</tspan></text>
<rect x="660.0" y="549.8" width="280.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="800.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">500–2000 мс (крізь BIOS POST / FACS)</tspan></text>
<rect x="973.9" y="549.8" width="312.1" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1130.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">5000–20000 мс (завантаження образу з SSD)</tspan></text>
<text x="680.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">S0ix забезпечує швидке пробудження під контролем ОС; S3 забезпечує мінімальне споживання ціною скидання контексту CPU</text>
</svg>