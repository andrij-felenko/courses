<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="252.7" y="22.0" width="694.6" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="45.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Архітектурне порівняння захисту пам'яті: AMD SEV-SNP проти Intel TDX</tspan></text>
<rect x="132.1" y="83.9" width="375.9" height="52.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">AMD SEV-SNP (Secure Nested Paging)</tspan><tspan x="320.0" dy="18.2">Апаратний захист цілісності та шифрування</tspan></text>
<rect x="172.9" y="176.6" width="294.2" height="66.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Конфіденційна ВМ (Guest VM)</tspan><tspan x="320.0" dy="16.9">Зашифрована пам'ять (AES-128/256)</tspan><tspan x="320.0" dy="16.9">Захищений стан CPU (VMSA) &amp; VMPL 0..3</tspan></text>
<rect x="169.2" y="306.6" width="301.6" height="66.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Reverse Map Table (RMP)</tspan><tspan x="320.0" dy="16.9">Апаратна таблиця цілісності пам'яті</tspan><tspan x="320.0" dy="16.9">Запобігання aliasing та remapping атак</tspan></text>
<rect x="147.0" y="436.6" width="346.0" height="66.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">AMD Secure Processor (ASP / PSP)</tspan><tspan x="320.0" dy="16.9">Криптографічний співпроцесор (ARM Cortex-A5)</tspan><tspan x="320.0" dy="16.9">Управління ключами та віддалена атестація</tspan></text>
<rect x="158.1" y="566.6" width="323.8" height="66.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Недовірений гіпервізор (KVM / QEMU)</tspan><tspan x="320.0" dy="16.9">Управління ресурсами без доступу до даних</tspan><tspan x="320.0" dy="16.9">Обмін через незашифровані буфери GHCB</tspan></text>
<line x1="320.0" y1="135.0" x2="320.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="235.0" x2="320.0" y2="315.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="365.0" x2="320.0" y2="445.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="495.0" x2="320.0" y2="575.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="709.4" y="83.9" width="341.2" height="52.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Intel TDX (Trust Domain Extensions)</tspan><tspan x="880.0" dy="18.2">Ізоляція віртуальних машин через SEAM</tspan></text>
<rect x="751.4" y="176.6" width="257.1" height="66.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Trust Domain (TD Guest VM)</tspan><tspan x="880.0" dy="16.9">Шифрування пам'яті MKTME (KeyID)</tspan><tspan x="880.0" dy="16.9">Захищений стан регістрів (TDVPS)</tspan></text>
<rect x="688.5" y="306.6" width="383.1" height="66.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Intel TDX Module (SEAM Mode)</tspan><tspan x="880.0" dy="16.9">Підписана мікропрограма Intel у захищеному режимі</tspan><tspan x="880.0" dy="16.9">Обробка перемикань контексту та S-EPT</tspan></text>
<rect x="732.9" y="436.6" width="294.2" height="66.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Контролер пам'яті MKTME / AES-XTS</tspan><tspan x="880.0" dy="16.9">Апаратний криптографічний рушій DRAM</tspan><tspan x="880.0" dy="16.9">Апаратний захист цілісності та ключів</tspan></text>
<rect x="714.4" y="566.6" width="331.2" height="66.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Недовірений гіпервізор (KVM / QEMU)</tspan><tspan x="880.0" dy="16.9">Виклики SEAMCALL для управління ВМ</tspan><tspan x="880.0" dy="16.9">Відсутність прямого доступу до сторінок TD</tspan></text>
<line x1="880.0" y1="135.0" x2="880.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
