<polyline points="510,300 710,300 734,162.5 910,162.5" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
<text x="710.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">сусід замовк</text>
<text x="710.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">донор віддав невикористану частку:</tspan><tspan x="710.0" dy="16.9">група розганяється на весь носій</tspan></text>
<text x="1165.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">io.latency</text>
