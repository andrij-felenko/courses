<text x="1165.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">захищена група промахнулася</text>
<text x="1165.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">крива — це СУСІД захищеної групи:</tspan><tspan x="1165.0" dy="16.9">глибину подання тиснуть, потім відпускають</tspan></text>
