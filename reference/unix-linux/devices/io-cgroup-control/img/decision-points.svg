<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 1048.58" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="1048.58" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях запиту: три брами, і межа, за якою груп немає</text>
<rect x="208.3" y="99.9" width="243.5" height="60.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">буферизований запис</tspan><tspan x="330.0" dy="18.2">write() повертається одразу</tspan></text>
<rect x="180.3" y="234.9" width="299.3" height="60.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">сторінковий кеш</tspan><tspan x="330.0" dy="18.2">брудну сторінку записано за групою</tspan></text>
<rect x="212.3" y="369.9" width="235.5" height="60.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">потік фонового запису</tspan><tspan x="330.0" dy="18.2">подає чужу роботу, не свою</tspan></text>
<line x1="330.0" y1="166.1" x2="330.0" y2="228.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="301.1" x2="330.0" y2="363.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="924.2" y="99.9" width="171.6" height="60.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">читання і O_DIRECT</tspan><tspan x="1010.0" dy="18.2">подає сам процес</tspan></text>
<rect x="559.8" y="496.0" width="220.5" height="48.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="670.0" y="525.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">bio з міткою cgroup</tspan></text>
<line x1="330.0" y1="436.1" x2="545.8" y2="492.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="166.1" x2="794.2" y2="492.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="436.6" y="624.0" width="466.9" height="42.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="649.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">io.max — чи вкладається група в стелю байтів і операцій</tspan></text>
<line x1="670.0" y1="550.0" x2="670.0" y2="618.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="436.6" y="734.0" width="466.9" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="759.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">io.weight (iocost) — чи лишився в групи віртуальний час</tspan></text>
<line x1="670.0" y1="672.0" x2="670.0" y2="728.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="452.5" y="844.0" width="435.0" height="42.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="869.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">io.latency — чи не страждає через це захищена група</tspan></text>
<line x1="670.0" y1="782.0" x2="670.0" y2="838.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="532.0" y="953.5" width="275.9" height="43.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="980.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">планувальник → тег → пристрій</tspan></text>
<line x1="670.0" y1="892.0" x2="670.0" y2="947.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="1026.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">нижче цієї межі поняття «чия це група» в інтерфейсі вже немає</text>
</svg>