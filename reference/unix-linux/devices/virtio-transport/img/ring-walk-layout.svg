<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка віртчерги на 8 ланок: зсуви, розміри, вирівнювання</text>
<text x="760.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">одна ділянка mmap; початок вирівняно на сторінку, тож вимога «16» задоволена сама собою</text>
<rect x="320.0" y="119.0" width="880.0" height="61.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ТАБЛИЦЯ ДЕСКРИПТОРІВ  —  16 Б × 8 ланок = 128 Б</tspan><tspan x="760.0" dy="16.9">вирівнювання 16 · заповнює драйвер, читає пристрій</tspan></text>
<text x="323.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">+0</text>
<rect x="320.0" y="250.6" width="880.0" height="78.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ДОСТУПНЕ КІЛЬЦЕ  —  6 + 2×8 = 22 Б</tspan><tspan x="760.0" dy="16.9">вирівнювання 2 · flags, idx, ring[8] пише драйвер</tspan><tspan x="760.0" dy="16.9">used_event — останні 2 Б — пише ПРИСТРІЙ</tspan></text>
<text x="323.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">+128</text>
<rect x="320.0" y="399.1" width="880.0" height="61.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ПОРОЖНЄ МІСЦЕ  —  42 Б</tspan><tspan x="760.0" dy="16.9">щоб ужите кільце почалося зі свого рядка кешу</tspan></text>
<text x="323.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">+150</text>
<rect x="320.0" y="530.6" width="880.0" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">УЖИТЕ КІЛЬЦЕ  —  6 + 8×8 = 70 Б</tspan><tspan x="760.0" dy="16.9">специфікація вимагає 4, беремо 64 · flags, idx, ring[8] пише пристрій</tspan><tspan x="760.0" dy="16.9">avail_event — останні 2 Б — пише ДРАЙВЕР</tspan></text>
<text x="323.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">+192</text>
<rect x="320.0" y="689.0" width="880.0" height="61.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="716.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ПУЛ БУФЕРІВ  —  самі дані</tspan><tspan x="760.0" dy="16.9">адреси в дескрипторах — зсуви від початку ділянки, не покажчики</tspan></text>
<text x="323.0" y="725.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">+320</text>
</svg>