<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 990" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="990" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок кроків, якими драйвер приводить пристрій virtio до роботи</text>
<rect x="311.9" y="49.5" width="176.2" height="41.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">скидання: status = 0</tspan></text>
<rect x="230.4" y="156.1" width="339.2" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">status |= ACKNOWLEDGE</tspan><tspan x="400.0" dy="16.9">ядро побачило пристрій і впізнало його тип</tspan></text>
<rect x="226.7" y="286.1" width="346.6" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">status |= DRIVER</tspan><tspan x="400.0" dy="16.9">знайшовся драйвер, який береться його вести</tspan></text>
<rect x="208.2" y="426.1" width="383.7" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">драйвер читає біти можливостей пристрою</tspan><tspan x="400.0" dy="16.9">й записує назад ту підмножину, яку підтримує сам</tspan></text>
<rect x="263.7" y="571.0" width="272.5" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="596.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">status |= FEATURES_OK</tspan><tspan x="400.0" dy="16.9">і драйвер одразу перечитує status</tspan></text>
<rect x="226.7" y="706.0" width="346.6" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="731.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">налаштування віртчерг:</tspan><tspan x="400.0" dy="16.9">розмір і адреси трьох областей кожної черги</tspan></text>
<rect x="223.0" y="841.0" width="354.0" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="866.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">status |= DRIVER_OK</tspan><tspan x="400.0" dy="16.9">з цієї миті пристрій має право читати кільця</tspan></text>
<line x1="400.0" y1="100.5" x2="400.0" y2="146.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="223.9" x2="400.0" y2="276.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="353.9" x2="400.0" y2="416.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="493.9" x2="400.0" y2="561.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="639.0" x2="400.0" y2="696.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="774.0" x2="400.0" y2="831.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="861.6" y="419.5" width="296.8" height="71.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">перетин двох списків і є контракт;</tspan><tspan x="1010.0" dy="16.2">після нього жодна сторона не має права</tspan><tspan x="1010.0" dy="16.2">ані додати можливість, ані відібрати</tspan></text>
<line x1="605.8" y1="455.0" x2="847.6" y2="455.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="865.2" y="564.5" width="289.6" height="71.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="588.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">якщо біт не втримався — пристрій</tspan><tspan x="1010.0" dy="16.2">не годен обслуговувати такий набір;</tspan><tspan x="1010.0" dy="16.2">драйверові лишається status |= FAILED</tspan></text>
<line x1="550.3" y1="600.0" x2="851.2" y2="600.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="893.7" y="699.5" width="232.6" height="71.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="723.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">розкладка кілець залежить від</tspan><tspan x="1010.0" dy="16.2">узгоджених бітів — тому черги</tspan><tspan x="1010.0" dy="16.2">налаштовують ПІСЛЯ, а не до</tspan></text>
<line x1="587.3" y1="735.0" x2="879.7" y2="735.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="875.9" y="842.6" width="268.2" height="54.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1010.0" y="866.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">до цієї миті пристрій зобов'язаний</tspan><tspan x="1010.0" dy="16.2">вдавати, що кілець не бачить</tspan></text>
<line x1="591.0" y1="870.0" x2="861.9" y2="870.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
</svg>