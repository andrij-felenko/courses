<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1510 990" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1510" height="990" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="750.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три області розділеної віртчерги і хто в яку пише</text>
<text x="560.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">СПІЛЬНА ПАМ'ЯТЬ ГОСТЯ</text>
<text x="560.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зелене пише лише драйвер · тепле пише лише пристрій</text>
<rect x="396.8" y="135.1" width="326.4" height="59.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/><text x="560.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">ДОСТУПНЕ КІЛЬЦЕ</tspan><tspan x="560.0" dy="16.9">flags │ idx = 5 │ ring[] = 0, 4, 9, 2, 6</tspan></text>
<text x="560.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ТАБЛИЦЯ ДЕСКРИПТОРІВ — один запит це ланцюг ланок</text>
<rect x="185.8" y="376.4" width="168.5" height="87.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">#6  addr = 0x3f21000</tspan><tspan x="270.0" dy="16.2">len = 12</tspan><tspan x="270.0" dy="16.2">flags = NEXT</tspan><tspan x="270.0" dy="16.2">next = 7</tspan></text>
<rect x="475.8" y="376.4" width="168.5" height="87.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">#7  addr = 0x3f8a200</tspan><tspan x="560.0" dy="16.2">len = 1500</tspan><tspan x="560.0" dy="16.2">flags = WRITE|NEXT</tspan><tspan x="560.0" dy="16.2">next = 9</tspan></text>
<rect x="765.8" y="376.4" width="168.5" height="87.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">#9  addr = 0x3f8c000</tspan><tspan x="850.0" dy="16.2">len = 1</tspan><tspan x="850.0" dy="16.2">flags = WRITE</tspan><tspan x="850.0" dy="16.2">next = —</tspan></text>
<line x1="362.2" y1="420.0" x2="467.8" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="652.2" y1="420.0" x2="757.8" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="352.3" y="590.0" width="415.3" height="59.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="560.0" y="616.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">УЖИТЕ КІЛЬЦЕ</tspan><tspan x="560.0" dy="16.9">flags │ idx = 3 │ ring[] = { id = 6, len = 1513 }, …</tspan></text>
<line x1="560.0" y1="204.9" x2="560.0" y2="285.6" stroke="#333333" stroke-width="1.8"/>
<line x1="560.0" y1="307.1" x2="560.0" y2="336.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="475.6" x2="560.0" y2="580.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1100.1" y="129.5" width="239.7" height="71.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="1220.0" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1220.0" dy="0.0">idx драйвер піднімає ОСТАННІМ:</tspan><tspan x="1220.0" dy="16.2">поки число не зросло,</tspan><tspan x="1220.0" dy="16.2">ланцюга для пристрою не існує</tspan></text>
<line x1="737.2" y1="165.0" x2="1086.1" y2="165.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="1114.4" y="384.5" width="211.2" height="71.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1220.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1220.0" dy="0.0">прапорець WRITE каже,</tspan><tspan x="1220.0" dy="16.2">кому належить право писати</tspan><tspan x="1220.0" dy="16.2">саме в цей буфер</tspan></text>
<line x1="658.2" y1="420.0" x2="1100.4" y2="420.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="1103.7" y="584.5" width="232.6" height="71.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="1220.0" y="608.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1220.0" dy="0.0">len — скільки байтів пристрій</tspan><tspan x="1220.0" dy="16.2">справді записав; id — номер</tspan><tspan x="1220.0" dy="16.2">голови ланцюга, а не позиція</tspan></text>
<line x1="781.7" y1="620.0" x2="1089.7" y2="620.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="386.7" y="762.6" width="346.6" height="54.8" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.3"/><text x="560.0" y="786.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Індекси вільно ростуть і обертаються на 2¹⁶ —</tspan><tspan x="560.0" dy="16.2">жодна сторона ніколи не править чуже поле.</tspan></text>
<rect x="447.4" y="871.6" width="605.1" height="56.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="750.0" y="896.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Межу перетинають лише дві події: «кік» від драйвера в регістр сповіщення</tspan><tspan x="750.0" dy="16.2">і переривання від пристрою. Дані нікуди не копіюються — обидва працюють на місці.</tspan></text>
</svg>