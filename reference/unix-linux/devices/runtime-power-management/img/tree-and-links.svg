<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пристрій не спить сам по собі: хто ще мусить не спати разом із ним</text>
<text x="70.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Дерево: батько тримають діти</text>
<rect x="125.0" y="124.5" width="290.0" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">кореневий міст PCIe</tspan><tspan x="270.0" dy="17.6">usage_count = 0
child_count = 1</tspan></text>
<text x="431.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">спати не може</text>
<rect x="125.0" y="264.5" width="290.0" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">контролер xHCI</tspan><tspan x="270.0" dy="17.6">usage_count = 0
child_count = 1</tspan></text>
<text x="431.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">спати не може</text>
<rect x="125.0" y="404.5" width="290.0" height="51.1" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="270.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">USB-камера</tspan><tspan x="270.0" dy="17.6">usage_count = 1
child_count = 0</tspan></text>
<text x="431.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">нею користуються</text>
<line x1="270.0" y1="190.0" x2="270.0" y2="250.0" stroke="#333333" stroke-width="1.6"/>
<line x1="270.0" y1="330.0" x2="270.0" y2="390.0" stroke="#333333" stroke-width="1.6"/>
<line x1="90.0" y1="400.0" x2="90.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="76.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">пробудження</text>
<text x="76.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">знизу вгору</text>
<text x="70.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">батько втратить живлення — дитина втратить його теж,</text>
<text x="70.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">тому ненульовий child_count блокує присипляння батька</text>
<line x1="730.0" y1="60.0" x2="730.0" y2="580.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="790.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Поза деревом: постачальник і споживач</text>
<rect x="910.0" y="154.5" width="240.0" height="51.1" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1030.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">контролер I²C</tspan><tspan x="1030.0" dy="17.6">споживач</tspan></text>
<rect x="787.0" y="364.5" width="230.0" height="51.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="902.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="902.0" dy="0.0">генератор такту</tspan><tspan x="902.0" dy="17.6">постачальник</tspan></text>
<line x1="1030.0" y1="222.0" x2="902.0" y2="350.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1043.0" y="364.5" width="230.0" height="51.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1158.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1158.0" dy="0.0">регулятор напруги</tspan><tspan x="1158.0" dy="17.6">постачальник</tspan></text>
<line x1="1030.0" y1="222.0" x2="1158.0" y2="350.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">ці двоє — не батьки контролера в дереві, але без них</text>
<text x="790.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">він мертвий; зв'язок оголошують device_link_add()</text>
</svg>