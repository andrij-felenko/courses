<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від встромленого заліза до файлу в /dev</text>
<rect x="70.0" y="90.0" width="560.0" height="92.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="350.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">На шині з'явився новий учасник</tspan></text>
<rect x="720.0" y="90.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">контролер USB помічає зміну на порту</tspan><tspan x="1025.0" dy="16.9">й будить драйвер шини</tspan></text>
<line x1="350.0" y1="182.0" x2="350.0" y2="200.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="202.0" width="560.0" height="92.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="350.0" y="252.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Драйвер шини читає ідентифікатори</tspan></text>
<rect x="720.0" y="202.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">дескриптори USB чи конфігураційний простір PCI;</tspan><tspan x="1025.0" dy="16.9">на нерозпізнаваних шинах — опис від прошивки</tspan></text>
<line x1="350.0" y1="294.0" x2="350.0" y2="312.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="314.0" width="560.0" height="92.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="350.0" y="364.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Вузол стає на місце в дереві</tspan></text>
<rect x="720.0" y="314.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">батько — те, у що фізично встромлено;</tspan><tspan x="1025.0" dy="16.9">у /sys виникає каталог із файлами-атрибутами</tspan></text>
<line x1="350.0" y1="406.0" x2="350.0" y2="424.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="426.0" width="560.0" height="92.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="350.0" y="476.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Шина шукає драйвер за ознаками</tspan></text>
<rect x="720.0" y="426.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">рядок modalias проти таблиць драйверів;</tspan><tspan x="1025.0" dy="16.9">збіг → probe(), нема збігу → вузол без драйвера</tspan></text>
<line x1="350.0" y1="518.0" x2="350.0" y2="536.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="538.0" width="560.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="350.0" y="588.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Ядро розсилає подію широкомовно</tspan></text>
<rect x="720.0" y="538.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="580.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">add, шлях у дереві, підсистема, modalias,</tspan><tspan x="1025.0" dy="16.9">старший і молодший номери — через netlink</tspan></text>
<line x1="350.0" y1="630.0" x2="350.0" y2="648.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="650.0" width="560.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="350.0" y="700.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">У /dev з'являється файл, далі — політика</tspan></text>
<rect x="720.0" y="650.0" width="610.0" height="92.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1025.0" y="692.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">devtmpfs робить вузол за номерами одразу;</tspan><tspan x="1025.0" dy="16.9">udev ставить права й стійкі імена by-uuid</tspan></text>
<text x="700.0" y="760.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ядро доводить справу до вузла з номерами; ім'я та права — вже простір користувача</text>
</svg>