<text x="30.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Архітектурні абстракції Linux Counter Subsystem</text>
<rect x="30.0" y="65.0" width="140.0" height="150.0" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/><text x="100.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1E1B4B" text-anchor="middle"><tspan x="100.0" dy="0.0">Signal (Сигнал)</tspan><tspan x="100.0" dy="14.3"></tspan><tspan x="100.0" dy="14.3">• Signal 0: Phase A</tspan><tspan x="100.0" dy="14.3">• Signal 1: Phase B</tspan><tspan x="100.0" dy="14.3">• Signal 2: Index Z</tspan><tspan x="100.0" dy="14.3">(Апаратні входи)</tspan></text>
<line x1="170.0" y1="140.0" x2="210.0" y2="140.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="210.0" y="65.0" width="150.0" height="150.0" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/><text x="285.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#052E16" text-anchor="middle"><tspan x="285.0" dy="0.0">Synapse (Синапс)</tspan><tspan x="285.0" dy="13.0"></tspan><tspan x="285.0" dy="13.0">• Action A: Both Edges</tspan><tspan x="285.0" dy="13.0">• Action B: Both Edges</tspan><tspan x="285.0" dy="13.0">• Action Z: Rising Edge</tspan><tspan x="285.0" dy="13.0">(Зв'язок входу та дії)</tspan></text>
