<rect x="400.0" y="65.0" width="160.0" height="150.0" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/><text x="480.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#451A03" text-anchor="middle"><tspan x="480.0" dy="0.0">Count (Лічильник)</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• Function:</tspan><tspan x="480.0" dy="14.3">  Quadrature X4</tspan><tspan x="480.0" dy="14.3">• Value: 64-bit int</tspan><tspan x="480.0" dy="14.3">• Extensions:</tspan><tspan x="480.0" dy="14.3">  ceiling, floor, mode</tspan></text>
