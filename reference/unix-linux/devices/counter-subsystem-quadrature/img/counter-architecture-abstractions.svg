<rect x="500.0" y="245.0" width="250.0" height="85.0" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/><text x="625.0" y="269.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle"><tspan x="625.0" dy="0.0">Символьний пристрій (/dev/counter0)</tspan><tspan x="625.0" dy="14.3">• High-rate events (counter_event)</tspan><tspan x="625.0" dy="14.3">• Timestamps (CLOCK_MONOTONIC)</tspan><tspan x="625.0" dy="14.3">• Poll/epoll + ring buffer</tspan></text>
</svg>