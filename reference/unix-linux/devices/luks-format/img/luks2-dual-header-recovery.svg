<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарне оновлення подвійного заголовка LUKS2 та відновлення</text>
<rect x="40.0" y="60.0" width="270.0" height="230.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="175.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1. Початковий стан</text>
<rect x="55.0" y="105.0" width="240.0" height="70.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="175.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Первинний заголовок</tspan><tspan x="175.0" dy="14.3">seqid = 42</tspan><tspan x="175.0" dy="14.3">CRC32: ВАЛІДНИЙ (OK)</tspan></text>
<rect x="55.0" y="195.0" width="240.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="175.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Вторинний заголовок</tspan><tspan x="175.0" dy="14.3">seqid = 42</tspan><tspan x="175.0" dy="14.3">CRC32: ВАЛІДНИЙ (OK)</tspan></text>
<line x1="315.0" y1="175.0" x2="360.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="365.0" y="60.0" width="270.0" height="230.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">2. Збій живлення при записі</text>
<rect x="380.0" y="105.0" width="240.0" height="70.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Первинний заголовок</tspan><tspan x="500.0" dy="14.3">seqid = 42</tspan><tspan x="500.0" dy="14.3">CRC32: ВАЛІДНИЙ (OK)</tspan></text>
<rect x="380.0" y="195.0" width="240.0" height="70.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
<text x="500.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Вторинний заголовок</tspan><tspan x="500.0" dy="14.3">seqid = 43 (обірвано)</tspan><tspan x="500.0" dy="14.3">CRC32: ПОШКОДЖЕНО (FAIL)</tspan></text>
<line x1="640.0" y1="175.0" x2="685.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="60.0" width="230.0" height="230.0" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8"/>
<text x="805.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">3. Вибір та відновлення</text>
<rect x="705.0" y="105.0" width="200.0" height="80.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="805.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Ядро обирає первинний:</tspan><tspan x="805.0" dy="14.3">seqid = 42 (дійсний CRC)</tspan><tspan x="805.0" dy="14.3">Том монтується штатно</tspan></text>
<rect x="705.0" y="200.0" width="200.0" height="75.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="805.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Автоматичне виправлення:</tspan><tspan x="805.0" dy="13.0">cryptsetup repair</tspan><tspan x="805.0" dy="13.0">Копіює дійсний заголовок</tspan></text>
<rect x="40.0" y="310.0" width="880.0" height="95.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="480.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">Алгоритм вибору активного заголовка при завантаженні:</text>
<text x="60.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="start">1. Читаються обидва бінарні заголовки (0 байт та 4 МіБ) і для кожного обчислюється контрольна сума CRC32.</text>
<text x="60.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="start">2. Відкидаються екземпляри з недійсним CRC або пошкодженою структурою JSON.</text>
<text x="60.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="start">3. З-поміж валідних екземплярів активним обирається заголовок із максимальним значенням монотонного seqid.</text>
</svg>