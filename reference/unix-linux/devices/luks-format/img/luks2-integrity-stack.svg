<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек автентифікованого шифрування (LUKS2 + dm-integrity / AEAD)</text>
<rect x="60.0" y="65.0" width="400.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="260.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файлова система (VFS)</text>
<text x="260.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ext4, btrfs, XFS — звичайні запити на читання/запис секторів</text>
<rect x="60.0" y="135.0" width="400.0" height="55.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="260.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шар dm-crypt (Шифрування)</text>
<text x="260.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перетворення шифротексту: AES-XTS або AEAD (ChaCha20-Poly1305 / AES-GCM)</text>
<rect x="60.0" y="205.0" width="400.0" height="55.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="260.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шар dm-integrity (Цілісність)</text>
<text x="260.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перевірка тегів HMAC-SHA256 / Poly1305 + журнал транзакцій (Journal)</text>
<rect x="60.0" y="275.0" width="400.0" height="55.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="260.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний диск / Блоковий пристрій</text>
<text x="260.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">NVMe / SSD / HDD — зберігання секторів даних та метаданих цілісності</text>
<line x1="260.0" y1="120.0" x2="260.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="190.0" x2="260.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="260.0" x2="260.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490.0" y="65.0" width="420.0" height="265.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="700.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Анатомія сектора на диску з dm-integrity</text>
<rect x="510.0" y="115.0" width="270.0" height="75.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="645.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Сектор даних (Data Sector)</tspan><tspan x="645.0" dy="14.3">512 байтів або 4096 байтів</tspan><tspan x="645.0" dy="14.3">Зашифровані дані (AES-XTS)</tspan></text>
<rect x="785.0" y="115.0" width="105.0" height="75.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="837.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="837.0" dy="0.0">Тег MAC</tspan><tspan x="837.0" dy="13.0">28–32 B</tspan><tspan x="837.0" dy="13.0">HMAC / Poly</tspan></text>
<rect x="510.0" y="205.0" width="380.0" height="50.0" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="700.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Журнал цілісності (Integrity Journal)</tspan><tspan x="700.0" dy="13.0">Захист від розриву запису (Write-Tear Protection) при аварії живлення</tspan></text>
<text x="700.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Помилка при читанні: якщо MAC-тег не збігається,</text>
<text x="700.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">ядро повертає -EILSEQ, блокуючи підроблені дані.</text>
<rect x="60.0" y="350.0" width="850.0" height="80.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="485.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Загроза підробки даних без контролю цілісності:</text>
<text x="485.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Режим AES-XTS гарантує конфіденційність, але дозволяє зловмиснику маніпулювати бітами шифротексту.</text>
<text x="485.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Шар dm-integrity унеможливлює підміну виконавчого коду та структур файлової системи.</text>
</svg>