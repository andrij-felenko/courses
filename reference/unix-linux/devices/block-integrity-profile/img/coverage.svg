<text x="780.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доки дістає кожен рівень захисту даних на шляху до носія</text>
<text x="70.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">шлях байта від застосунку до комірки — і скільки з нього накриває кожен захист</text>
