<line x1="70.0" y1="700.0" x2="1490.0" y2="700.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="444.8" y="738.8" width="670.4" height="82.4" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="766.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Кожна ланка має власну перевірку свого відтинка, але вони не складаються в одну:</tspan><tspan x="780.0" dy="18.2">спотворення всередині ланки входить у наступний відтинок як законні дані</tspan><tspan x="780.0" dy="18.2">й дістає законну нову контрольну суму.</tspan></text>
