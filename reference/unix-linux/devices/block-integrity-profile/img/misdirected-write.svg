<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1510 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1510" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="750.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис не за тією адресою і роль тега з адресою блока</text>
<text x="70.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">запис пішов не за тією адресою — що бачить носій</text>
<rect x="70.0" y="110.0" width="480.0" height="88.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="310.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">дані, призначені для блока 100</tspan></text>
<rect x="70.0" y="220.0" width="230.0" height="76.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">guard</tspan><tspan x="185.0" dy="16.9">= CRC(дані)</tspan></text>
<rect x="320.0" y="220.0" width="230.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="435.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">reference</tspan><tspan x="435.0" dy="16.9">= 100</tspan></text>
<line x1="580.0" y1="200.0" x2="780.0" y2="200.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="580.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start">прошивка помилилася в арифметиці адреси</text>
<rect x="820.0" y="110.0" width="610.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1125.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1125.0" dy="0.0">сектор ліг на блок 200</tspan></text>
<rect x="820.0" y="220.0" width="610.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="1125.0" y="262.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1125.0" dy="0.0">CRC від даних збігається з guard — дані цілі</tspan></text>
<rect x="820.0" y="320.0" width="610.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1125.0" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1125.0" dy="0.0">у тезі 100, а адреса 200 — не збігається</tspan></text>
<rect x="820.0" y="420.0" width="610.0" height="76.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="2.0"/><text x="1125.0" y="462.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1125.0" dy="0.0">команду відхилено: 10h/03h</tspan></text>
<rect x="426.8" y="578.8" width="646.5" height="82.4" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="750.0" y="606.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Сама лише контрольна сума тут безсила: дані бездоганні, просто лежать не там.</tspan><tspan x="750.0" dy="18.2">Ловить адресу тільки тег, у який цю адресу вписали заздалегідь,</tspan><tspan x="750.0" dy="18.2">і звіряє його той, хто адресу приймає — контролер носія.</tspan></text>
</svg>