<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один потік на текст, команди й відповіді</text>
<text x="560.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">уперед: літери й команди — один потік байтів</text>
<rect x="40.0" y="96.0" width="250.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">програма</tspan><tspan x="165.0" dy="16.9">write(1, …)</tspan></text>
<rect x="360.0" y="96.0" width="340.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">ядро: лінійна дисципліна</tspan><tspan x="530.0" dy="16.9">дописує \r перед \n,</tspan><tspan x="530.0" dy="16.9">послідовностей не розбирає</tspan></text>
<rect x="770.0" y="96.0" width="310.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">емулятор термінала</tspan><tspan x="925.0" dy="16.9">розбирає команди й малює</tspan></text>
<line x1="292.0" y1="144.0" x2="356.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="702.0" y1="144.0" x2="766.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="216.0" width="310.0" height="60.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="925.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">курсор, кольори, розмір екрана — стан живе тут</tspan></text>
<line x1="925.0" y1="196.0" x2="925.0" y2="212.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="560.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">назад: натиснуті клавіші й відповіді термінала — теж один потік</text>
<rect x="40.0" y="336.0" width="250.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">програма</tspan><tspan x="165.0" dy="16.9">read(0, …)</tspan></text>
<rect x="360.0" y="336.0" width="340.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">ядро: ICANON, ISIG, ECHO</tspan><tspan x="530.0" dy="16.9">теж лише байти</tspan></text>
<rect x="770.0" y="336.0" width="310.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">емулятор термінала</tspan><tspan x="925.0" dy="16.9">клавіші · відповіді на запити</tspan></text>
<line x1="766.0" y1="384.0" x2="702.0" y2="384.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="356.0" y1="384.0" x2="292.0" y2="384.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">відповідь на запит приходить упереміш із тим, що набрала людина</text>
</svg>