<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="730.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три знімки /sys: відкладення, прив'язка, ручна відв'язка</text>
<rect x="30.0" y="60.0" width="460.0" height="500.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.2"/>
<text x="260.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">після insmod termo.ko</text>
<rect x="50.0" y="130.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="260.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">/sys/devices/platform/termodatchyk/</tspan><tspan x="260.0" dy="16.9">посилання driver немає</tspan></text>
<rect x="50.0" y="226.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="260.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">/sys/bus/platform/drivers/termo/</tspan><tspan x="260.0" dy="16.9">у списку драйвера порожньо</tspan></text>
<rect x="50.0" y="322.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="260.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">/sys/kernel/debug/devices_deferred</tspan><tspan x="260.0" dy="16.9">termodatchyk   немає джерела</tspan></text>
<rect x="50.0" y="418.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="260.0" y="455.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">/sys/class/hwmon/</tspan><tspan x="260.0" dy="16.9">жодного пристрою</tspan></text>
<text x="260.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">пристрій є, драйвер є — прив'язки немає</text>
<rect x="500.0" y="60.0" width="460.0" height="500.0" rx="6" fill="#eff7ef" stroke="#6b7280" stroke-width="1.2"/>
<text x="730.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">після insmod dzherelo.ko</text>
<rect x="520.0" y="130.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">.../termodatchyk/driver</tspan><tspan x="730.0" dy="16.9">→ .../drivers/termo</tspan></text>
<rect x="520.0" y="226.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">.../drivers/termo/termodatchyk</tspan><tspan x="730.0" dy="16.9">→ .../platform/termodatchyk</tspan></text>
<rect x="520.0" y="322.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">/sys/kernel/debug/devices_deferred</tspan><tspan x="730.0" dy="16.9">порожній файл</tspan></text>
<rect x="520.0" y="418.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="455.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">/sys/class/hwmon/hwmon4/temp1_input</tspan><tspan x="730.0" dy="16.9">30100</tspan></text>
<text x="730.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">прив'язку записано з обох боків</text>
<rect x="970.0" y="60.0" width="460.0" height="500.0" rx="6" fill="#f3f0fa" stroke="#6b7280" stroke-width="1.2"/>
<text x="1200.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">після echo &gt; .../termo/unbind</text>
<rect x="990.0" y="130.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1200.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">.../termodatchyk/driver</tspan><tspan x="1200.0" dy="16.9">посилання зникло</tspan></text>
<rect x="990.0" y="226.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1200.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">/sys/bus/platform/drivers/termo/</tspan><tspan x="1200.0" dy="16.9">у списку драйвера порожньо</tspan></text>
<rect x="990.0" y="322.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1200.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">/sys/kernel/debug/devices_deferred</tspan><tspan x="1200.0" dy="16.9">порожній файл</tspan></text>
<rect x="990.0" y="418.0" width="420.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1200.0" y="455.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">/sys/class/hwmon/</tspan><tspan x="1200.0" dy="16.9">жодного пристрою</tspan></text>
<text x="1200.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">той самий вигляд — інша причина</text>
<line x1="492.0" y1="300.0" x2="498.0" y2="300.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="962.0" y1="300.0" x2="968.0" y2="300.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="730.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">відкладення й відв'язка дають однаковий вигляд у /sys — розрізняє їх лише файл devices_deferred</text>
</svg>