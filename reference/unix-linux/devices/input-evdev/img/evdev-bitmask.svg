<text x="40.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">ioctl(fd, EVIOCGBIT(EV_KEY, sizeof bits), bits)  →  повертає кількість записаних БАЙТІВ</text>
