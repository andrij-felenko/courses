<rect x="40.0" y="210.0" width="460.0" height="92.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">KEY_A = 30</tspan><tspan x="270.0" dy="16.9">слово bits[0], біт 30</tspan></text>
<rect x="580.0" y="210.0" width="500.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="830.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">BTN_LEFT = 0x110 = 272</tspan><tspan x="830.0" dy="16.9">272 / 64 = 4 → слово bits[4], біт 272 % 64 = 16</tspan></text>
