<rect x="810.0" y="560.0" width="450.0" height="130.0" rx="8" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/>
<text x="1035.0" y="620.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">udev: ім'я, права,</tspan><tspan x="1035.0" dy="19.5">посилання — за правилами</tspan></text>
<line x1="762.0" y1="625.0" x2="798.0" y2="625.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="780.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">подія летить у порожнечу</text>
<text x="780.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">вузол уже є, коли по нього приходять</text>
<text x="650.0" y="730.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-style="italic">межа рухалася двічі: усередину ядра — і назад назовні</text>
