<rect x="330.0" y="350.0" width="420.0" height="130.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.6"/>
<text x="540.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">сам створює вузли</tspan><tspan x="540.0" dy="19.5">і сам дає їм імена</tspan></text>
<rect x="810.0" y="350.0" width="450.0" height="130.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.6"/>
<text x="1035.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">devfsd доганяє події:</tspan><tspan x="1035.0" dy="19.5">права, посилання, гонки</tspan></text>
