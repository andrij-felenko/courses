<text x="540.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">вузлів не створює:</tspan><tspan x="540.0" dy="19.5">лише роздає номери</tspan></text>
<rect x="810.0" y="140.0" width="450.0" height="130.0" rx="8" fill="#eef0f3" stroke="#333333" stroke-width="1.6"/>
<text x="1035.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">MAKEDEV робить тисячі</tspan><tspan x="1035.0" dy="19.5">вузлів наперед, один раз</tspan></text>
<line x1="762.0" y1="205.0" x2="798.0" y2="205.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
