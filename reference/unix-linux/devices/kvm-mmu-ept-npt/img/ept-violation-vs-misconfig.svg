<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння EPT Violation та EPT Misconfiguration</text>
<rect x="25.0" y="25.0" width="1030.0" height="470.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<rect x="290.0" y="45.0" width="500.0" height="49.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="66.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Апаратний MMU виконує трансляцію через EPT</tspan><tspan x="540.0" dy="16.9">Зустрічає проблему з записом SPTE (EPT Entry)</tspan></text>
<line x1="400.0" y1="105.0" x2="290.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="105.0" x2="790.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="170.1" width="420.0" height="49.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">EPT Violation (код виходу 48)</tspan><tspan x="290.0" dy="16.9">Аналог звичайного #PF у просторі EPT</tspan></text>
<rect x="80.0" y="257.3" width="420.0" height="145.4" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Причини:</tspan><tspan x="290.0" dy="14.3">• Запис відсутній (P = 0): сторінку ще не виділено</tspan><tspan x="290.0" dy="14.3">• Порушення прав: спроба запису при R/W = Read-Only</tspan><tspan x="290.0" dy="14.3">  (наприклад, Dirty Logging або CoW)</tspan><tspan x="290.0" dy="14.3">• Спроба виконання при X = 0</tspan><tspan x="290.0" dy="14.3">──────────────────────────────────────────────</tspan><tspan x="290.0" dy="14.3">Обробка KVM:</tspan><tspan x="290.0" dy="14.3">• Виділяє сторінку HPA або оновлює біт брудності</tspan><tspan x="290.0" dy="14.3">• Нормальна штатна робота гіпервізора</tspan></text>
<rect x="580.0" y="170.1" width="420.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">EPT Misconfiguration (код виходу 49)</tspan><tspan x="790.0" dy="16.9">Неприпустимий формат запису в EPT</tspan></text>
<rect x="580.0" y="257.3" width="420.0" height="145.4" rx="6" fill="#f3e8fd" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Причини:</tspan><tspan x="790.0" dy="14.3">• Встановлено зарезервовані біти (Reserved Bits)</tspan><tspan x="790.0" dy="14.3">• Неприпустимий тип пам'яті (Memory Type)</tspan><tspan x="790.0" dy="14.3">• Біти прав мають неприпустиму комбінацію</tspan><tspan x="790.0" dy="14.3">  (наприклад, W=1, але R=0 на старому залізі)</tspan><tspan x="790.0" dy="14.3">──────────────────────────────────────────────</tspan><tspan x="790.0" dy="14.3">Обробка KVM:</tspan><tspan x="790.0" dy="14.3">• Швидка емуляція MMIO (KVM Fast MMIO)</tspan><tspan x="790.0" dy="14.3">• АБО фатальна помилка ядра гіпервізора</tspan></text>
</svg>