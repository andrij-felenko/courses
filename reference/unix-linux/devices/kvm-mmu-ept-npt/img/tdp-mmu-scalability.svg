<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння спадкового KVM MMU та масштабованого TDP MMU</text>
<rect x="25.0" y="25.0" width="1070.0" height="490.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<rect x="50.0" y="60.0" width="470.0" height="430.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="285.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спадковий MMU (Legacy Shadow MMU)</text>
<rect x="85.0" y="136.2" width="400.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Глобальний mmu_lock (Spinlock)</tspan><tspan x="285.0" dy="15.6">Єдине вузьке місце для всіх vCPU</tspan></text>
<rect x="85.0" y="244.4" width="400.0" height="131.1" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Особливості реалізації:</tspan><tspan x="285.0" dy="14.3">• Спільна кодова база для Shadow PT та EPT</tspan><tspan x="285.0" dy="14.3">• Зворотні відображення rmap (важкі списки)</tspan><tspan x="285.0" dy="14.3">• Будь-який page fault або dirty logging</tspan><tspan x="285.0" dy="14.3">  бере spinlock у монопольному режимі</tspan><tspan x="285.0" dy="14.3">• Проблема: при сотнях vCPU процесори</tspan><tspan x="285.0" dy="14.3">  проводять 90% часу в очікуванні замка</tspan><tspan x="285.0" dy="14.3">• Масштабування падає до нуля</tspan></text>
<rect x="600.0" y="60.0" width="470.0" height="430.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="835.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасний TDP MMU (Linux 5.10+)</text>
<rect x="635.0" y="136.2" width="400.0" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Паралельний RCU + Атомарний CAS</tspan><tspan x="835.0" dy="15.6">mmu_lock береться в режимі читання (Read Lock)</tspan></text>
<rect x="635.0" y="244.4" width="400.0" height="131.1" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Особливості реалізації:</tspan><tspan x="835.0" dy="14.3">• Відокремлений рушій суто для EPT/NPT</tspan><tspan x="835.0" dy="14.3">• Обхід дерева таблиць без блокувань через RCU</tspan><tspan x="835.0" dy="14.3">• Модифікація записів через atomic cmpxchg</tspan><tspan x="835.0" dy="14.3">• Паралельна обробка page faults усіма vCPU</tspan><tspan x="835.0" dy="14.3">• Швидке встановлення Write Protection для</tspan><tspan x="835.0" dy="14.3">  живої міграції (Live Migration)</tspan><tspan x="835.0" dy="14.3">• Масштабується лінійно на 512+ vCPU та ТБ ОЗП</tspan></text>
</svg>