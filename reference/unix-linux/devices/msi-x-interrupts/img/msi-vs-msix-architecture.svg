<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурна еволюція: монолітний MSI проти гнучкого MSI-X</text>
<rect x="60.4" y="48.9" width="419.3" height="52.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="70.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Класичний MSI (PCI 2.2 / PCIe)</tspan><tspan x="270.0" dy="18.2">До 32 векторів (степінь 2: 1, 2, 4, 8, 16, 32)</tspan></text>
<rect x="107.5" y="136.8" width="325.0" height="106.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">PCI Config Space: MSI Capability (0x05)</tspan><tspan x="270.0" dy="14.3">┌──────────────────────────────────────────────┐</tspan><tspan x="270.0" dy="14.3">│ Message Address: 0xFEE00000 (Local APIC CPU0)│</tspan><tspan x="270.0" dy="14.3">│ Message Data: Base Vector 0x60               │</tspan><tspan x="270.0" dy="14.3">│ Multiple Message Enable: 4 вектори           │</tspan><tspan x="270.0" dy="14.3">└──────────────────────────────────────────────┘</tspan></text>
<rect x="112.9" y="300.6" width="314.1" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Вектор 0: Data = 0x60 → CPU0 (Local APIC 0)</tspan><tspan x="270.0" dy="15.6">Вектор 1: Data = 0x61 → CPU0 (Local APIC 0)</tspan><tspan x="270.0" dy="15.6">Вектор 2: Data = 0x62 → CPU0 (Local APIC 0)</tspan><tspan x="270.0" dy="15.6">Вектор 3: Data = 0x63 → CPU0 (Local APIC 0)</tspan></text>
<rect x="81.3" y="433.1" width="377.4" height="73.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="452.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Обмеження MSI:</tspan><tspan x="270.0" dy="14.3">• Усі вектори мають ОДНУ адресу (летять на одне ядро CPU)</tspan><tspan x="270.0" dy="14.3">• Вектори мусять бути неперервним блоком у процесорі</tspan><tspan x="270.0" dy="14.3">• Максимум 32 вектори на функцію</tspan></text>
<line x1="530.0" y1="50.0" x2="530.0" y2="530.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="623.8" y="48.9" width="332.5" height="52.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="70.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Розширений MSI-X (PCI 3.0 / PCIe)</tspan><tspan x="790.0" dy="18.2">До 2048 повністю незалежних векторів</tspan></text>
<rect x="589.9" y="139.6" width="400.2" height="120.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">MSI-X Table (у MMIO BAR пристрою, масив 16 байт):</tspan><tspan x="790.0" dy="14.3">┌──────────────────────────────────────────────────────────┐</tspan><tspan x="790.0" dy="14.3">│ Запис 0: Addr=0xFEE00000 (CPU0), Data=0x40, Mask=0       │</tspan><tspan x="790.0" dy="14.3">│ Запис 1: Addr=0xFEE01000 (CPU1), Data=0x52, Mask=0       │</tspan><tspan x="790.0" dy="14.3">│ Запис 2: Addr=0xFEE02000 (CPU2), Data=0x71, Mask=0       │</tspan><tspan x="790.0" dy="14.3">│ Запис 3: Addr=0xFEE03000 (CPU3), Data=0x83, Mask=0       │</tspan><tspan x="790.0" dy="14.3">└──────────────────────────────────────────────────────────┘</tspan></text>
<rect x="632.9" y="300.6" width="314.1" height="78.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Вектор 0 → CPU0 (Local APIC 0, вектор 0x40)</tspan><tspan x="790.0" dy="15.6">Вектор 1 → CPU1 (Local APIC 1, вектор 0x52)</tspan><tspan x="790.0" dy="15.6">Вектор 2 → CPU2 (Local APIC 2, вектор 0x71)</tspan><tspan x="790.0" dy="15.6">Вектор 3 → CPU3 (Local APIC 3, вектор 0x83)</tspan></text>
<rect x="563.7" y="433.1" width="452.6" height="73.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="790.0" y="452.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Переваги MSI-X:</tspan><tspan x="790.0" dy="14.3">• Кожен вектор має власну адресу (пряме націлювання на будь-яке ядро)</tspan><tspan x="790.0" dy="14.3">• Вектори не залежать один від одного в таблиці IDT</tspan><tspan x="790.0" dy="14.3">• До 2048 векторів, індивідуальне маскування в MMIO</tspan></text>
</svg>