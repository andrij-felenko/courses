<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаточерговість PCIe пристрою та пряме прив'язування переривань до ядер CPU</text>
<rect x="6.9" y="40.0" width="326.3" height="49.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">PCIe Пристрій (Multi-Queue NIC / NVMe)</tspan><tspan x="170.0" dy="16.9">RSS хешування або Per-CPU SQ/CQ</tspan></text>
<rect x="101.9" y="126.2" width="136.3" height="47.6" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Черга RX 0 / CQ 0</tspan><tspan x="170.0" dy="15.6">MSI-X Вектор 0</tspan></text>
<line x1="238.1" y1="150.0" x2="460.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="101.9" y="216.2" width="136.3" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Черга RX 1 / CQ 1</tspan><tspan x="170.0" dy="15.6">MSI-X Вектор 1</tspan></text>
<line x1="238.1" y1="240.0" x2="460.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="101.9" y="306.2" width="136.3" height="47.6" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Черга RX 2 / CQ 2</tspan><tspan x="170.0" dy="15.6">MSI-X Вектор 2</tspan></text>
<line x1="238.1" y1="330.0" x2="460.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="101.9" y="396.2" width="136.3" height="47.6" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Черга RX 3 / CQ 3</tspan><tspan x="170.0" dy="15.6">MSI-X Вектор 3</tspan></text>
<line x1="238.1" y1="420.0" x2="460.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="418.3" y="224.6" width="243.4" height="120.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="245.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">PCIe Switch / Root Complex</tspan><tspan x="540.0" dy="14.3">TLP Memory Write 32-bit:</tspan><tspan x="540.0" dy="14.3">• Запис у 0xFEE00000 (APIC 0)</tspan><tspan x="540.0" dy="14.3">• Запис у 0xFEE01000 (APIC 1)</tspan><tspan x="540.0" dy="14.3">• Запис у 0xFEE02000 (APIC 2)</tspan><tspan x="540.0" dy="14.3">• Запис у 0xFEE03000 (APIC 3)</tspan><tspan x="540.0" dy="14.3">(In-band запис без виділених ліній)</tspan></text>
<line x1="620.0" y1="150.0" x2="760.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="240.0" x2="760.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="330.0" x2="760.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="420.0" x2="760.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="784.5" y="126.2" width="191.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ядро CPU 0 (Local APIC 0)</tspan><tspan x="880.0" dy="15.6">irq 42 → napi_poll CPU0</tspan></text>
<rect x="784.5" y="216.2" width="191.0" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ядро CPU 1 (Local APIC 1)</tspan><tspan x="880.0" dy="15.6">irq 43 → napi_poll CPU1</tspan></text>
<rect x="784.5" y="306.2" width="191.0" height="47.6" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ядро CPU 2 (Local APIC 2)</tspan><tspan x="880.0" dy="15.6">irq 44 → napi_poll CPU2</tspan></text>
<rect x="784.5" y="396.2" width="191.0" height="47.6" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ядро CPU 3 (Local APIC 3)</tspan><tspan x="880.0" dy="15.6">irq 45 → napi_poll CPU3</tspan></text>
<rect x="168.0" y="506.2" width="704.0" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="526.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Результат паралелізації: кожне ядро CPU обслуговує виключно свою апаратну чергу пристрою.</tspan><tspan x="520.0" dy="15.6">Повна відсутність між'ядерних замків (lockless), міжпроцесорних IPI та перенесення ліній кешу L1/L2.</tspan></text>
</svg>