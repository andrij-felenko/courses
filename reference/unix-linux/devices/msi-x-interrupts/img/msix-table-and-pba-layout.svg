<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розміщення MSI-X Table та PBA у просторі пам'яті BAR пристрою</text>
<rect x="81.0" y="55.0" width="277.9" height="49.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">PCI Configuration Space (Type 0)</tspan><tspan x="220.0" dy="16.9">Capability ID 0x11 (MSI-X)</tspan></text>
<rect x="40.4" y="190.8" width="359.2" height="98.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">MSI-X Capability Structure</tspan><tspan x="220.0" dy="15.6">offset 0x00: Cap ID (0x11) | Next Pointer</tspan><tspan x="220.0" dy="15.6">offset 0x02: Message Control (Table Size, Enable)</tspan><tspan x="220.0" dy="15.6">offset 0x04: Table Offset (29b) | Table BIR (3b)</tspan><tspan x="220.0" dy="15.6">offset 0x08: PBA Offset (29b)   | PBA BIR (3b)</tspan></text>
<line x1="399.6" y1="250.0" x2="480.0" y2="180.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="399.6" y1="275.0" x2="480.0" y2="410.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="482.9" y="105.3" width="494.2" height="149.4" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">MSI-X Table (у BAR[Table BIR] за зсувом Table Offset)</tspan><tspan x="730.0" dy="14.3">┌─────────────────────────────────────────────────────────────┐</tspan><tspan x="730.0" dy="14.3">│ Запис 0: Msg Addr Low | Msg Addr High | Msg Data | Vec Ctrl │ (16 байтів)</tspan><tspan x="730.0" dy="14.3">│ Запис 1: Msg Addr Low | Msg Addr High | Msg Data | Vec Ctrl │ (16 байтів)</tspan><tspan x="730.0" dy="14.3">│ Запис 2: Msg Addr Low | Msg Addr High | Msg Data | Vec Ctrl │ (16 байтів)</tspan><tspan x="730.0" dy="14.3">│ ...                                                         │</tspan><tspan x="730.0" dy="14.3">│ Запис N: Msg Addr Low | Msg Addr High | Msg Data | Vec Ctrl │ (N &lt;= 2047)</tspan><tspan x="730.0" dy="14.3">└─────────────────────────────────────────────────────────────┘</tspan><tspan x="730.0" dy="14.3">Vector Control: біт 0 = Mask Bit (1 = вектор замасковано)</tspan></text>
<rect x="520.5" y="349.6" width="419.0" height="120.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Pending Bit Array (PBA) (у BAR[PBA BIR] за зсувом PBA Offset)</tspan><tspan x="730.0" dy="14.3">┌─────────────────────────────────────────────────────────────┐</tspan><tspan x="730.0" dy="14.3">│ QWORD 0 (біти 0..63):    [P63][P62] ... [P2][P1][P0]        │</tspan><tspan x="730.0" dy="14.3">│ QWORD 1 (біти 64..127):  [P127][P126] ... [P65][P64]        │</tspan><tspan x="730.0" dy="14.3">│ ...                                                         │</tspan><tspan x="730.0" dy="14.3">└─────────────────────────────────────────────────────────────┘</tspan><tspan x="730.0" dy="14.3">P[k] = 1: під час дії Mask Bit для вектора k виникла подія.</tspan></text>
<text x="730.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен запис таблиці займає рівно 16 байтів (4 DWORD). PBA запаковано по 64 біти на рядок.</text>
</svg>