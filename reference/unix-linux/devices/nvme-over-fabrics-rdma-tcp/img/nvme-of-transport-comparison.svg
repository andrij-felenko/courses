<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="300.0" height="440.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Локальний PCIe NVMe</text>
<rect x="40.0" y="75.0" width="260.0" height="55.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост CPU / App</text>
<text x="170.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">blk-mq &amp; nvme.ko</text>
<line x1="170.0" y1="130.0" x2="170.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="160.0" width="260.0" height="60.0" rx="4" fill="#f5f7fa" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">PCIe Bus &amp; Doorbell BAR</text>
<text x="170.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Direct PCIe DMA Transfers</text>
<line x1="170.0" y1="220.0" x2="170.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="250.0" width="260.0" height="65.0" rx="4" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний NVMe SSD</text>
<text x="170.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">Затримка: 10 - 20 µs</text>
<rect x="40.0" y="340.0" width="260.0" height="105.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливості:</text>
<text x="170.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Максимальна швидкість</text>
<text x="170.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Фізичне обмеження шасі</text>
<text x="170.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Без мережевого оверхеду</text>
<rect x="340.0" y="20.0" width="300.0" height="440.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. NVMe over RDMA</text>
<rect x="360.0" y="75.0" width="260.0" height="55.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост CPU (Bypassed on Data)</text>
<text x="490.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">nvme-rdma (Zero-Copy)</text>
<line x1="490.0" y1="130.0" x2="490.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="360.0" y="160.0" width="260.0" height="60.0" rx="4" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">RDMA NIC (RNIC) &amp; Fabric</text>
<text x="490.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">InfiniBand / RoCEv2 (No CPU)</text>
<line x1="490.0" y1="220.0" x2="490.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="360.0" y="250.0" width="260.0" height="65.0" rx="4" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віддалений Target SSD</text>
<text x="490.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">Затримка: 15 - 35 µs</text>
<rect x="360.0" y="340.0" width="260.0" height="105.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливості:</text>
<text x="490.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Апаратне розвантаження CPU</text>
<text x="490.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Потребує Lossless Ethernet</text>
<text x="490.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Спеціалізовані RNIC картки</text>
<rect x="660.0" y="20.0" width="300.0" height="440.0" rx="8" fill="#f5f7fa" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. NVMe over TCP</text>
<rect x="680.0" y="75.0" width="260.0" height="55.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост CPU / TCP Stack</text>
<text x="810.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">nvme-tcp (Kernel Sockets)</text>
<line x1="810.0" y1="130.0" x2="810.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="160.0" width="260.0" height="60.0" rx="4" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стандартний Ethernet</text>
<text x="810.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Звичайний TCP/IP (Port 4420)</text>
<line x1="810.0" y1="220.0" x2="810.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="250.0" width="260.0" height="65.0" rx="4" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віддалений Target SSD</text>
<text x="810.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle" font-weight="700">Затримка: 60 - 120 µs</text>
<rect x="680.0" y="340.0" width="260.0" height="105.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="810.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Особливості:</text>
<text x="810.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Працює на будь-яких NIC</text>
<text x="810.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Не вимагає налаштувань SAN</text>
<text x="810.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">• Навантажує CPU (TCP stack)</text>
</svg>