<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="40.0" width="320.0" height="440.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес-виробник (3D гра)</text>
<rect x="60.0" y="100.0" width="280.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Створення буфера кадру</tspan><tspan x="200.0" dy="15.6">Хендл H1 = 4 у /dev/dri/renderD128</tspan><tspan x="200.0" dy="15.6">GEM Object (Розмір 1920x1080 RGBA)</tspan></text>
<rect x="60.0" y="195.0" width="280.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">2. Експорт у dma-buf</tspan><tspan x="200.0" dy="15.6">ioctl(PRIME_HANDLE_TO_FD, H1)</tspan><tspan x="200.0" dy="15.6">-&gt; Створює struct dma_buf у ядрі</tspan><tspan x="200.0" dy="15.6">-&gt; Повертає анонімний fd = 12</tspan></text>
<rect x="60.0" y="305.0" width="280.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">3. Передача дескриптора</tspan><tspan x="200.0" dy="14.3">sendmsg(unix_socket, SCM_RIGHTS, fd=12)</tspan><tspan x="200.0" dy="14.3">Передає володіння дескриптором</tspan><tspan x="200.0" dy="14.3">через сокет Wayland IPC</tspan></text>
<text x="200.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">GPU рендерить кадр у буфер</text>
<rect x="400.0" y="40.0" width="320.0" height="440.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="560.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Linux: dma-buf &amp; PRIME</text>
<rect x="420.0" y="110.0" width="280.0" height="110.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">struct dma_buf</tspan><tspan x="560.0" dy="14.3">- file-&gt;f_count (лічильник посилань)</tspan><tspan x="560.0" dy="14.3">- ops -&gt; drm_gem_prime_dmabuf_ops</tspan><tspan x="560.0" dy="14.3">- resv -&gt; спільний dma_resv</tspan><tspan x="560.0" dy="14.3">- priv -&gt; вказівник на GEM Object</tspan></text>
<rect x="420.0" y="250.0" width="280.0" height="100.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Фізичні сторінки пам'яті</tspan><tspan x="560.0" dy="14.3">(sg_table / TTM VRAM)</tspan><tspan x="560.0" dy="14.3">Єдиний масив пікселів у пам'яті!</tspan><tspan x="560.0" dy="14.3">Копіювання байтів ВІДСУТНЄ (Zero-Copy)</tspan></text>
<rect x="420.0" y="375.0" width="280.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Апаратна синхронізація</tspan><tspan x="560.0" dy="14.3">dma_fence в об'єкті dma_resv</tspan><tspan x="560.0" dy="14.3">захищає буфер від одночасного</tspan><tspan x="560.0" dy="14.3">запису та читання</tspan></text>
<rect x="760.0" y="40.0" width="320.0" height="440.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="920.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес-споживач (Wayland / KMS)</text>
<rect x="780.0" y="100.0" width="280.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">4. Прийом дескриптора</tspan><tspan x="920.0" dy="15.6">recvmsg(unix_socket, &amp;prime_fd)</tspan><tspan x="920.0" dy="15.6">Отримує локальний fd = 8</tspan></text>
<rect x="780.0" y="195.0" width="280.0" height="85.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="218.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">5. Імпорт у GEM драйвера</tspan><tspan x="920.0" dy="15.6">ioctl(PRIME_FD_TO_HANDLE, fd=8)</tspan><tspan x="920.0" dy="15.6">-&gt; Отримує локальний Хендл H2 = 9</tspan><tspan x="920.0" dy="15.6">у своєму /dev/dri/card0</tspan></text>
<rect x="780.0" y="305.0" width="280.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">6. Виведення на дисплей</tspan><tspan x="920.0" dy="15.6">drmModeAddFB2() з хендлом H2</tspan><tspan x="920.0" dy="15.6">-&gt; Атомарний коміт у KMS площину</tspan><tspan x="920.0" dy="15.6">(Direct Scanout без копіювання)</tspan></text>
<text x="920.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Контролер дисплея читає пікселі</text>
<line x1="340.0" y1="235.0" x2="420.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="345.0" x2="780.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="237.0" x2="700.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="220.0" x2="560.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="350.0" x2="560.0" y2="375.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="300.0" x2="780.0" y2="345.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>