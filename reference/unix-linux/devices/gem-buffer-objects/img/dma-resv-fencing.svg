<rect x="60.0" y="95.0" width="360.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Блокування: ww_mutex (Wound-Wait)</tspan><tspan x="240.0" dy="14.3">Запобігає взаємному блокуванню (Deadlock)</tspan><tspan x="240.0" dy="14.3">при захопленні багатьох буферів одночасно</tspan></text>
<rect x="60.0" y="175.0" width="360.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Слот запису (DMA_RESV_USAGE_WRITE):</tspan><tspan x="240.0" dy="14.3">dma_fence_write (Огородження GPU-рендерингу)</tspan><tspan x="240.0" dy="14.3">- Стан: Очікує завершення шейдерів кадру N</tspan><tspan x="240.0" dy="14.3">- Гарантує: Буфер не читатиметься до готовності</tspan></text>
<rect x="60.0" y="300.0" width="360.0" height="120.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Слоти читання (DMA_RESV_USAGE_READ):</tspan><tspan x="240.0" dy="14.3">1. dma_fence_scanout (Контролер дисплея KMS)</tspan><tspan x="240.0" dy="14.3">2. dma_fence_video (Апаратний енкодер NVENC)</tspan><tspan x="240.0" dy="14.3">- Дозволяє паралельне читання багатьма клієнтами</tspan><tspan x="240.0" dy="14.3">- Блокує новий запис до завершення читання</tspan></text>
