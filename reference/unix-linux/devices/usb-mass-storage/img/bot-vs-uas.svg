<line x1="105.0" y1="185.0" x2="295.0" y2="185.0" stroke="#198754" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="200.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc3545" text-anchor="middle">CSW (Status Block)</text>
