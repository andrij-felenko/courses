<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="380.0" height="330.0" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
<text x="200.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bulk-Only Transport (BOT)</text>
<rect x="30.0" y="60.0" width="150.0" height="40.0" rx="5" fill="#e9ecef" stroke="#6c757d" stroke-width="1.5"/>
<text x="105.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">USB Host (usb-storage)</text>
