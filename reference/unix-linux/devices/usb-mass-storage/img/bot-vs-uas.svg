<text x="200.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d6efd" text-anchor="middle">CBW (Command Block)</text>
<line x1="105.0" y1="135.0" x2="295.0" y2="135.0" stroke="#0d6efd" stroke-width="2.0" marker-end="url(#arrow)"/>
