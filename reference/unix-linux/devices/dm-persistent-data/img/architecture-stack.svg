<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Архітектурний стек dm-persistent-data: від цілей ядра до фізичних 4 КіБ блоків</text>
<rect x="60.0" y="75.0" width="1260.0" height="95.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/>
<text x="80.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">КЛІЄНТСЬКІ ЦІЛІ DEVICE MAPPER (drivers/md/)</text>
<rect x="100.0" y="115.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/><text x="230.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">dm-thin</tspan><tspan x="230.0" dy="15.6">тонкі пули та знімки</tspan></text>
<rect x="400.0" y="115.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/><text x="530.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">dm-cache</tspan><tspan x="530.0" dy="15.6">кешування SSD/NVMe</tspan></text>
<rect x="700.0" y="115.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/><text x="830.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">dm-era</tspan><tspan x="830.0" dy="15.6">відстеження змін блоків</tspan></text>
<rect x="1000.0" y="115.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/><text x="1130.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1130.0" dy="0.0">dm-clone</tspan><tspan x="1130.0" dy="15.6">фонове клонування томів</tspan></text>
<line x1="690.0" y1="170.0" x2="690.0" y2="205.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="205.0" width="1260.0" height="150.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="80.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">СТРУКТУРИ ДАНИХ (drivers/md/persistent-data/)</text>
<rect x="100.0" y="248.0" width="380.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="273.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">dm-btree (B+ дерева з CoW-тінюванням)</tspan><tspan x="290.0" dy="15.6">• 1D/2D ключі (dev_id, logical_block)</tspan><tspan x="290.0" dy="15.6">• вузли фіксованого розміру 4 КіБ</tspan><tspan x="290.0" dy="15.6">• підтримка знімків і розгалужень</tspan></text>
<rect x="520.0" y="248.0" width="370.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="705.0" y="273.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">dm-space-map-disk (пул даних)</tspan><tspan x="705.0" dy="15.6">• бітові карти виділення блоків даних</tspan><tspan x="705.0" dy="15.6">• 32-бітні лічильники посилань (refcounts)</tspan><tspan x="705.0" dy="15.6">• індексні блоки великого адресного простору</tspan></text>
<rect x="920.0" y="248.0" width="380.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="1110.0" y="273.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">dm-space-map-metadata (метадані)</tspan><tspan x="1110.0" dy="15.6">• облік самих 4 КіБ блоків метаданих</tspan><tspan x="1110.0" dy="15.6">• розв'язання рекурсії виділення блоків</tspan><tspan x="1110.0" dy="15.6">• внутрішнє бітове тінювання в пам'яті</tspan></text>
<line x1="690.0" y1="355.0" x2="690.0" y2="390.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="390.0" width="1260.0" height="130.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="80.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">ТРАНЗАКЦІЙНИЙ МЕНЕДЖЕР (dm_transaction_manager)</text>
<rect x="100.0" y="432.0" width="1180.0" height="72.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="690.0" y="448.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Координація тіньового копіювання блоків (shadowing) та двофазної фіксації (two-phase commit)</tspan><tspan x="690.0" dy="15.6">• dm_tm_shadow_block(): виділяє новий блок при зміні вузла, старий лишається незмінним</tspan><tspan x="690.0" dy="15.6">• dm_tm_commit(): скидає брудні буфери, фіксує space map і готує оновлений суперблок</tspan><tspan x="690.0" dy="15.6">• Лічильник поколінь транзакцій (generation / transaction ID) для виявлення збоїв</tspan></text>
<line x1="690.0" y1="520.0" x2="690.0" y2="555.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="555.0" width="1260.0" height="140.0" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.8"/>
<text x="80.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7b1fa2" text-anchor="start" font-weight="700">МЕНЕДЖЕР БЛОКІВ (dm_block_manager)</text>
<rect x="100.0" y="597.0" width="570.0" height="82.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.4"/><text x="385.0" y="618.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Кеш 4 КіБ буферів і блокування:</tspan><tspan x="385.0" dy="15.6">• dm_bm_read_lock() / dm_bm_write_lock_zero()</tspan><tspan x="385.0" dy="15.6">• Посторінковий хеш-кеш у RAM</tspan><tspan x="385.0" dy="15.6">• Відстеження dirty-буферів для запису</tspan></text>
<rect x="700.0" y="597.0" width="580.0" height="82.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.4"/><text x="990.0" y="618.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Валідація, контрольні суми та скидання I/O:</tspan><tspan x="990.0" dy="15.6">• struct dm_block_validator (CRC32c перевірка)</tspan><tspan x="990.0" dy="15.6">• Автоматичний розрахунок CRC перед записом на диск</tspan><tspan x="990.0" dy="15.6">• dm_bm_flush(): бар'єр скидання з кешів носія</tspan></text>
<line x1="690.0" y1="695.0" x2="690.0" y2="730.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="730.0" width="1260.0" height="80.0" rx="8" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="100.0" y="742.0" width="1180.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="690.0" y="758.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ФІЗИЧНИЙ АБО ЛОГІЧНИЙ ПРИСТРІЙ МЕТАДАНИХ (raw block device /dev/sdX1, NVMe)</tspan><tspan x="690.0" dy="15.6">Блок 0: Суперблок (версія, UUID, transaction_id, корені B-дерев та карт простору, CRC32c)</tspan><tspan x="690.0" dy="15.6">Блоки 1..N: Вузли B-дерев, індексні блоки карт простору, бітові карти (розмір блоку строго 4 КіБ)</tspan></text>
</svg>