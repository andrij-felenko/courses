<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="252.1" y="17.0" width="545.8" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Конвеєр нумерації пристрою USB (Enumeration Pipeline)</tspan></text>
<rect x="43.7" y="80.6" width="252.6" height="78.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Виявлення підключення</tspan><tspan x="170.0" dy="15.6">Переривання змінення стану порту</tspan><tspan x="170.0" dy="15.6">Сигнал на D+/D- ↔ Hub Event</tspan><tspan x="170.0" dy="15.6">Запуск обробника khubd / workqueue</tspan></text>
<rect x="388.5" y="80.6" width="273.1" height="78.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">2. Портовий скид (Port Reset)</tspan><tspan x="525.0" dy="15.6">Скидання лінії в стан SE0 (10 мс)</tspan><tspan x="525.0" dy="15.6">Встановлення швидкості (LS/FS/HS/SS)</tspan><tspan x="525.0" dy="15.6">Призначення адреси 0 за замовчуванням</tspan></text>
<rect x="733.2" y="80.6" width="293.6" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">3. Читання перших 8 байтів</tspan><tspan x="880.0" dy="15.6">GET_DESCRIPTOR (Device)</tspan><tspan x="880.0" dy="15.6">Визначення розміру bMaxPacketSize0</tspan><tspan x="880.0" dy="15.6">Повторне скидання порту для стабілізації</tspan></text>
<rect x="746.9" y="300.6" width="266.2" height="78.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">4. Призначення адреси шини</tspan><tspan x="880.0" dy="15.6">SET_ADDRESS (Адреса N: 1..127)</tspan><tspan x="880.0" dy="15.6">Пристрій переходить у стан Addressed</tspan><tspan x="880.0" dy="15.6">Всі наступні URB адресовані N</tspan></text>
<rect x="391.9" y="300.6" width="266.2" height="78.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">5. Повне зчитування дескрипторів</tspan><tspan x="525.0" dy="15.6">Зчитування Device Descriptor (18B)</tspan><tspan x="525.0" dy="15.6">Зчитування Config/Interface/Endpoint</tspan><tspan x="525.0" dy="15.6">Створення системних структур у ядрі</tspan></text>
<rect x="33.5" y="300.6" width="273.1" height="78.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">6. Пошук драйвера &amp; Probe</tspan><tspan x="170.0" dy="15.6">Матчинг id_table з Vendor/Product ID</tspan><tspan x="170.0" dy="15.6">Створення нод у sysfs (/sys/bus/usb/)</tspan><tspan x="170.0" dy="15.6">Виклик driver-&gt;probe(interface)</tspan></text>
<line x1="320.0" y1="120.0" x2="370.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="120.0" x2="730.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="880.0" y1="190.0" x2="880.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730.0" y1="340.0" x2="680.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="370.0" y1="340.0" x2="320.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>