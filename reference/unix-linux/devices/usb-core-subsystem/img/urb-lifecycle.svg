<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="267.1" y="17.0" width="545.8" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Життєвий цикл та стан об'єкта USB Request Block (URB)</tspan></text>
<rect x="23.2" y="90.6" width="293.6" height="78.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Виділення та ініціалізація</tspan><tspan x="170.0" dy="15.6">usb_alloc_urb()</tspan><tspan x="170.0" dy="15.6">usb_fill_bulk_urb() / control / int</tspan><tspan x="170.0" dy="15.6">Налаштування буфера та complete callback</tspan></text>
<rect x="379.5" y="90.6" width="321.0" height="78.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">2. Відправка в ядро</tspan><tspan x="540.0" dy="15.6">usb_submit_urb()</tspan><tspan x="540.0" dy="15.6">Перевірка параметрів та прапорців</tspan><tspan x="540.0" dy="15.6">Передача до HCD (urb-&gt;status = -EINPROGRESS)</tspan></text>
<rect x="804.2" y="90.6" width="211.5" height="78.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">3. Планування в HCD</tspan><tspan x="910.0" dy="15.6">Формування кільця TRB (xHCI)</tspan><tspan x="910.0" dy="15.6">DMA-передача даних по шині</tspan><tspan x="910.0" dy="15.6">Фізичний обмін пакетами</tspan></text>
<rect x="807.7" y="320.6" width="204.7" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">4. Переривання та Callback</tspan><tspan x="910.0" dy="15.6">Апаратне IRQ від контролера</tspan><tspan x="910.0" dy="15.6">Виклик urb-&gt;complete(urb)</tspan><tspan x="910.0" dy="15.6">Контекст softirq / tasklet</tspan></text>
<rect x="410.3" y="320.6" width="259.4" height="78.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">5. Завершення або Перепідпис</tspan><tspan x="540.0" dy="15.6">Перевірка status (0 = ОК, -ENOENT)</tspan><tspan x="540.0" dy="15.6">Повторна відправка usb_submit_urb()</tspan><tspan x="540.0" dy="15.6">або виклик usb_free_urb()</tspan></text>
<line x1="320.0" y1="130.0" x2="390.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="130.0" x2="765.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="910.0" y1="200.0" x2="910.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="765.0" y1="360.0" x2="690.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="290.0" x2="540.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Цикл повторного підпису (Resubmit)</text>
</svg>