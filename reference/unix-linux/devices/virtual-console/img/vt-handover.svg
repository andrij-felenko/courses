<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передача екрана під час перемикання консолі</text>
<rect x="50.0" y="40.0" width="130.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="75.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">процес</tspan></text>
<rect x="196.0" y="40.0" width="814.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="603.0" y="67.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">ioctl(VT_SETMODE) з полем mode = VT_PROCESS: «перемикання цієї консолі</tspan><tspan x="603.0" dy="16.9">більше не автоматичне; ось номери двох сигналів — relsig і acqsig»</tspan></text>
<line x1="115.0" y1="105.0" x2="115.0" y2="133.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="136.0" width="130.0" height="62.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">ядро</tspan></text>
<rect x="196.0" y="136.0" width="814.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="603.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">людина натиснула Alt+F1. Перемалювати екран не можна: відеорежим чужий,</tspan><tspan x="603.0" dy="16.9">графічним пристроєм порядкує процес. Ядро шле relsig і чекає</tspan></text>
<line x1="115.0" y1="201.0" x2="115.0" y2="229.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="232.0" width="130.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">процес</tspan></text>
<rect x="196.0" y="232.0" width="814.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="603.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">наводить лад: вертає текстовий режим і віддає право розпоряджатися</tspan><tspan x="603.0" dy="16.9">графічним пристроєм</tspan></text>
<line x1="115.0" y1="297.0" x2="115.0" y2="325.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="328.0" width="130.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">процес</tspan></text>
<rect x="196.0" y="328.0" width="814.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="603.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">ioctl(VT_RELDISP, 1) — «віддав, перемикай»</tspan></text>
<line x1="115.0" y1="393.0" x2="115.0" y2="421.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="424.0" width="130.0" height="62.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="459.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">ядро</tspan></text>
<rect x="196.0" y="424.0" width="814.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="603.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="603.0" dy="0.0">аж тепер перемикає: зберігає стан старої консолі, повідомляє драйвер консолі</tspan><tspan x="603.0" dy="16.9">й перемальовує екран з буфера нової</tspan></text>
<rect x="50.0" y="512.0" width="960.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Крок 4 не настав — не настає й крок 5: ядро пообіцяло не перемикати самовільно</tspan><tspan x="530.0" dy="16.9">й чекатиме далі. Саме так виглядає зависання з чорним екраном після падіння графіки</tspan></text>
<rect x="50.0" y="576.0" width="960.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="602.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Повернення дзеркальне: ядро шле acqsig, процес забирає екран назад і знову відповідає VT_RELDISP</tspan></text>
</svg>