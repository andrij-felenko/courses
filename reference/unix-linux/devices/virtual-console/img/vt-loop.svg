<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях виводу й шлях вводу у віртуальній консолі</text>
<rect x="240.0" y="44.0" width="640.0" height="52.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">оболонка на цій консолі: write(1, …) і read(0, …)</tspan></text>
<rect x="40.0" y="130.0" width="440.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">лінійна дисципліна на виході:</tspan><tspan x="260.0" dy="16.2">OPOST, ONLCR — що дописати перед видачею</tspan></text>
<rect x="640.0" y="130.0" width="440.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">лінійна дисципліна на вході:</tspan><tspan x="860.0" dy="16.2">ICANON, ECHO, ISIG — рядок, відлуння, сигнали</tspan></text>
<rect x="40.0" y="218.0" width="440.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">емулятор VT (drivers/tty/vt/vt.c):</tspan><tspan x="260.0" dy="16.2">автомат над потоком, стан курсора й кольорів</tspan></text>
<rect x="640.0" y="218.0" width="440.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">черга вводу того tty,</tspan><tspan x="860.0" dy="16.2">до якого прив'язана поточна консоль</tspan></text>
<rect x="40.0" y="306.0" width="440.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">буфер екрана: на кожне знакомісце</tspan><tspan x="260.0" dy="16.2">16 біт — номер гліфа й атрибут</tspan></text>
<rect x="640.0" y="306.0" width="440.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">keyboard.c: розкладка перетворює</tspan><tspan x="860.0" dy="16.2">клавішу на байти або на дію</tspan></text>
<rect x="40.0" y="394.0" width="440.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">драйвер консолі (struct consw):</tspan><tspan x="260.0" dy="16.2">fbcon, vgacon або dummycon</tspan></text>
<rect x="640.0" y="394.0" width="440.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">підсистема вводу: номер клавіші</tspan><tspan x="860.0" dy="16.2">плюс позначка натиску чи відпускання</tspan></text>
<rect x="40.0" y="482.0" width="440.0" height="60.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">текстова пам'ять плати</tspan><tspan x="260.0" dy="16.2">або пікселі кадрового буфера → екран</tspan></text>
<rect x="640.0" y="482.0" width="440.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="516.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">клавіатура: PS/2, USB або Bluetooth</tspan></text>
<line x1="260.0" y1="100.0" x2="260.0" y2="126.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="260.0" y1="194.0" x2="260.0" y2="214.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="260.0" y1="282.0" x2="260.0" y2="302.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="260.0" y1="370.0" x2="260.0" y2="390.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="260.0" y1="458.0" x2="260.0" y2="478.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="860.0" y1="126.0" x2="860.0" y2="100.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="860.0" y1="214.0" x2="860.0" y2="194.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="860.0" y1="302.0" x2="860.0" y2="282.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="860.0" y1="390.0" x2="860.0" y2="370.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="860.0" y1="478.0" x2="860.0" y2="458.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">вивід: байти треба зрозуміти</text>
<text x="1010.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">ввід: байтів немає, їх треба вигадати</text>
<rect x="40.0" y="566.0" width="1040.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="593.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Alt+F2 далі keyboard.c не йде: перемикання консолі — це дія розкладки, а не байт.</tspan><tspan x="560.0" dy="17.6">Тому воно спрацьовує й тоді, коли програма на екрані зависла і нічого не читає</tspan></text>
</svg>