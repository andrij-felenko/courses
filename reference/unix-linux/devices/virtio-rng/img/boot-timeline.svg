<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли яке джерело непередбачності доходить до гостьового ядра</text>
<line x1="60.0" y1="430.0" x2="1210.0" y2="430.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1150.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час роботи</text>
<rect x="79.1" y="595.5" width="301.9" height="69.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="230.0" y="618.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">мить першої інструкції ядра</tspan><tspan x="230.0" dy="16.2">зерно від прошивки: SETUP_RNG_SEED,</tspan><tspan x="230.0" dy="16.2">EFI RNG або rng-seed у дереві пристроїв</tspan></text>
<line x1="230.0" y1="440.0" x2="230.0" y2="587.5" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="230.0" cy="430.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="322.6" y="215.5" width="294.8" height="69.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="470.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">перебір шини й probe драйвера</tspan><tspan x="470.0" dy="16.2">з'являється virtio-rng, і каркас hwrng</tspan><tspan x="470.0" dy="16.2">робить його поточним джерелом</tspan></text>
<line x1="470.0" y1="292.5" x2="470.0" y2="420.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="470.0" cy="430.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="565.5" y="605.5" width="309.0" height="69.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="720.0" y="628.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">сплеск</tspan><tspan x="720.0" dy="16.2">потік качає буфер за буфером без пауз,</tspan><tspan x="720.0" dy="16.2">поки не набереться 256 зарахованих бітів</tspan></text>
<line x1="720.0" y1="440.0" x2="720.0" y2="597.5" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="720.0" cy="430.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="831.1" y="228.6" width="237.7" height="52.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="950.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">ядро вважає себе готовим</tspan><tspan x="950.0" dy="16.2">getrandom() перестає блокувати</tspan></text>
<line x1="950.0" y1="289.4" x2="950.0" y2="420.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="950.0" cy="430.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="1038.9" y="618.6" width="202.1" height="52.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="1140.0" y="641.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">далі — крапельниця</tspan><tspan x="1140.0" dy="16.2">одне читання раз на ≤60 с</tspan></text>
<line x1="1140.0" y1="440.0" x2="1140.0" y2="610.6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="1140.0" cy="430.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="356.9" y="782.6" width="546.1" height="54.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="630.0" y="806.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Окремою колією: клон або відновлення знімка повертає ядро в минулий стан.</tspan><tspan x="630.0" dy="16.2">virtio-rng цього не помічає — тривогу б'є пристрій VM Generation ID.</tspan></text>
</svg>