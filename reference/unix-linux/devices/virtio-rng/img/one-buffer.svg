<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмін одним буфером між драйвером virtio-rng і гіпервізором</text>
<text x="320.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГОСТЬОВЕ ЯДРО</text>
<text x="1000.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГІПЕРВІЗОР</text>
<line x1="660.0" y1="92.0" x2="660.0" y2="762.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="172.6" y="121.0" width="294.8" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">виділяє буфер у власній пам'яті</tspan><tspan x="320.0" dy="16.9">й позначає його «сюди пише пристрій»</tspan></text>
<rect x="154.1" y="256.1" width="331.8" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">кладе номер дескриптора в доступне кільце</tspan><tspan x="320.0" dy="16.9">й торкає регістр сповіщення</tspan></text>
<rect x="856.3" y="402.6" width="287.3" height="74.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">бачить сповіщення, читає дескриптор</tspan><tspan x="1000.0" dy="16.9">і бере байти з власного джерела:</tspan><tspan x="1000.0" dy="16.9">getrandom() господаря</tspan></text>
<rect x="860.0" y="572.6" width="279.9" height="74.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="597.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">пише байти просто в пам'ять гостя,</tspan><tspan x="1000.0" dy="16.9">в ужите кільце кладе номер буфера</tspan><tspan x="1000.0" dy="16.9">і скільки байтів записав</tspan></text>
<rect x="176.3" y="746.0" width="287.3" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="771.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">обробник переривання забирає буфер;</tspan><tspan x="320.0" dy="16.9">довжина — єдине, що приїхало назад</tspan></text>
<line x1="320.0" y1="190.9" x2="320.0" y2="244.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="499.9" y1="309.0" x2="842.3" y2="406.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="489.4" x2="1000.0" y2="560.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="846.0" y1="640.0" x2="477.7" y2="749.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="459.2" y="833.6" width="401.6" height="52.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="660.0" y="856.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Назад не йде нічого, крім довжини:</tspan><tspan x="660.0" dy="16.2">буфер описано як придатний лише для запису пристроєм.</tspan></text>
</svg>