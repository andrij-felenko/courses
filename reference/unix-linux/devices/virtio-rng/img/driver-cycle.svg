<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл одного буфера в драйвері virtio-rng</text>
<rect x="136.1" y="171.6" width="207.8" height="76.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="240.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">У ПОЛЬОТІ</tspan><tspan x="240.0" dy="16.9">буфер стоїть у віртчерзі</tspan><tspan x="240.0" dy="16.9">avail = 0; читач спить</tspan></text>
<rect x="540.1" y="171.6" width="259.7" height="76.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/><text x="670.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">ПОВНИЙ</tspan><tspan x="670.0" dy="16.9">зворотний виклик забрав буфер</tspan><tspan x="670.0" dy="16.9">avail = min(len, розмір буфера)</tspan></text>
<rect x="1010.9" y="171.6" width="178.2" height="76.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="1100.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">РОЗДАЄТЬСЯ</tspan><tspan x="1100.0" dy="16.9">read() віддає шматки</tspan><tspan x="1100.0" dy="16.9">idx росте до avail</tspan></text>
<line x1="355.9" y1="210.0" x2="528.1" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
