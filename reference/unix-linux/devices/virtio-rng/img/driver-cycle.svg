<rect x="816.9" y="72.2" width="136.3" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.1"/><text x="885.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">complete(&amp;filled)</tspan><tspan x="885.0" dy="15.6">читач прокинувся</tspan></text>
<line x1="1100.0" y1="260.4" x2="1100.0" y2="420.0" stroke="#333333" stroke-width="1.7"/>
<line x1="1100.0" y1="420.0" x2="240.0" y2="420.0" stroke="#333333" stroke-width="1.7"/>
<line x1="240.0" y1="420.0" x2="240.0" y2="260.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="479.9" y="393.6" width="380.2" height="52.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="670.0" y="423.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">буфер вичерпано (idx == avail) → krng_arm()</tspan><tspan x="670.0" dy="16.2">sg_init_one · virtqueue_add_inbuf · virtqueue_kick</tspan></text>
<rect x="130.8" y="16.2" width="218.4" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.1"/><text x="240.0" y="36.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">probe: virtio_device_ready(),</tspan><tspan x="240.0" dy="15.6">потім перший krng_arm()</tspan></text>
<rect x="457.5" y="512.6" width="425.0" height="54.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="670.0" y="536.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">У черзі стоїть рівно одне прохання й ніколи — жодного:</tspan><tspan x="670.0" dy="16.2">наступні байти вже їдуть, поки читач розбирає попередні.</tspan></text>
