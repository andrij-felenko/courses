<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема витоку Platypus та захист ядра</text>
<rect x="15.0" y="15.0" width="830.0" height="440.0" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="430.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">Схема витоку даних Platypus через RAPL та бар'єри безпеки ядра</text>
<rect x="35.0" y="70.0" width="360.0" height="360.0" rx="6" fill="#fdf2e9" stroke="#e74c3c" stroke-width="1.5"/>
<text x="215.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Жертва: Захищене середовище</text>
<rect x="93.4" y="112.0" width="243.2" height="56.0" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/><text x="215.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Intel SGX Enclave / Ядро Linux / TLS</tspan><tspan x="215.0" dy="13.0">Виконання криптографічних операцій</tspan><tspan x="215.0" dy="13.0">(AES-NI, RSA, вибірка ключів)</tspan></text>
<rect x="84.1" y="205.5" width="261.8" height="69.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Апаратна фізика КМОН-транзисторів:</tspan><tspan x="215.0" dy="13.0">Динамічна енергія залежить від</tspan><tspan x="215.0" dy="13.0">ваги Хеммінга операндів (HW(Data))</tspan><tspan x="215.0" dy="13.0">Біт '1' споживає більше заряду, ніж '0'</tspan></text>
<rect x="105.8" y="332.0" width="218.4" height="56.0" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/><text x="215.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Апаратний лічильник RAPL</tspan><tspan x="215.0" dy="13.0">MSR_PKG_ENERGY_STATUS (0x611)</tspan><tspan x="215.0" dy="13.0">Оновлення ~1000 разів на секунду</tspan></text>
<line x1="215.0" y1="175.0" x2="215.0" y2="205.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215.0" y1="285.0" x2="215.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="435.0" y="70.0" width="390.0" height="360.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
<text x="630.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="700">Атака Platypus та захист ядра</text>
<rect x="492.9" y="117.0" width="274.2" height="56.0" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/><text x="630.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Непривілейований процес зловмисника</tspan><tspan x="630.0" dy="13.0">Високочастотний вимір енергії (20 кГц)</tspan><tspan x="630.0" dy="13.0">Відновлення приватного ключа біт за бітом</tspan></text>
<rect x="474.3" y="210.5" width="311.4" height="69.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Захист ядра Linux (CVE-2020-8694):</tspan><tspan x="630.0" dy="13.0">Права доступу /sys/class/powercap/.../energy_uj</tspan><tspan x="630.0" dy="13.0">змінено з 0444 (world) на 0400 (root-only)</tspan><tspan x="630.0" dy="13.0">CAP_SYS_RAWIO для читання MSR</tspan></text>
<rect x="499.1" y="332.0" width="261.8" height="56.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="630.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Апаратний захист (Оновлення мікрокоду):</tspan><tspan x="630.0" dy="13.0">Додавання шуму та фільтрація</tspan><tspan x="630.0" dy="13.0">частоти оновлення MSR лічильників</tspan></text>
<line x1="345.0" y1="360.0" x2="485.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Витік</text>
</svg>