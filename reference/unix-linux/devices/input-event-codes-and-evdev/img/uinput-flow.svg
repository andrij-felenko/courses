<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема роботи та інжекції подій через /dev/uinput</text>
<rect x="40.0" y="60.0" width="220.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Простір користувача</tspan><tspan x="150.0" dy="15.6">(Демон / Емулятор / Macro)</tspan><tspan x="150.0" dy="15.6">`fd = open(&quot;/dev/uinput&quot;)`</tspan></text>
<line x1="260.0" y1="80.0" x2="330.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ioctl()</text>
<text x="295.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">write()</text>
<rect x="330.0" y="60.0" width="240.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Модуль ядра uinput</tspan><tspan x="450.0" dy="15.6">(drivers/input/misc/uinput.c)</tspan><tspan x="450.0" dy="15.6">`UI_DEV_CREATE`</tspan></text>
<line x1="570.0" y1="95.0" x2="640.0" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="605.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Реєстрація</text>
<rect x="640.0" y="60.0" width="140.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Input Core</tspan><tspan x="710.0" dy="15.6">`struct input_dev`</tspan></text>
<line x1="710.0" y1="130.0" x2="710.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="220.0" width="260.0" height="60.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Новий вузол пристрою evdev</tspan><tspan x="650.0" dy="13.0">`/dev/input/eventN`</tspan><tspan x="650.0" dy="13.0">(Створений для віртуального пристрою)</tspan></text>
<line x1="520.0" y1="250.0" x2="260.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зчитування подій read()</text>
<rect x="40.0" y="220.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Клієнтський процес</tspan><tspan x="150.0" dy="15.6">(Wayland / X11 / libinput)</tspan><tspan x="150.0" dy="15.6">Отримує синтетичні події</tspan></text>
<rect x="40.0" y="305.0" width="740.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Етапи створення віртуального пристрою uinput:</tspan><tspan x="410.0" dy="13.0">1. UI_SET_EVBIT / UI_SET_KEYBIT (оголошення capabilities) → 2. ioctl(UI_DEV_SETUP) → 3. UI_DEV_CREATE → 4. write(input_event)</tspan></text>
</svg>