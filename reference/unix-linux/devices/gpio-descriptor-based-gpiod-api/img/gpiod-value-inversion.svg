<rect x="118.5" y="324.0" width="663.0" height="32.0" rx="6" fill="#fff8e1" stroke="#ffa000" stroke-width="1.5"/><text x="450.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">gpiod_set_raw_value(desc, 1) bypasses ACTIVE_LOW flag and forces physical HIGH (3.3V) directly</tspan></text>
