<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія упакованої черги Packed Virtqueue</text>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЄДИНЕ КІЛЬЦЕ ДЕСКРИПТОРІВ (PACKED VIRTQUEUE)</text>
<text x="700.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Драйвер і пристрій працюють в одному масиві, використовуючи Wrap Counter</text>
<rect x="105.9" y="178.6" width="188.2" height="82.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Desc 0 (Used by Device)</tspan><tspan x="200.0" dy="15.6">addr = 0x1000, len = 512</tspan><tspan x="200.0" dy="15.6">id = 0</tspan><tspan x="200.0" dy="15.6">AVAIL = 1, USED = 1</tspan></text>
<rect x="352.5" y="178.6" width="195.0" height="82.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Desc 1 (Used by Device)</tspan><tspan x="450.0" dy="15.6">addr = 0x2000, len = 1024</tspan><tspan x="450.0" dy="15.6">id = 1</tspan><tspan x="450.0" dy="15.6">AVAIL = 1, USED = 1</tspan></text>
<rect x="602.5" y="178.6" width="195.0" height="82.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Desc 2 (Avail for Device)</tspan><tspan x="700.0" dy="15.6">addr = 0x3000, len = 2048</tspan><tspan x="700.0" dy="15.6">id = 2</tspan><tspan x="700.0" dy="15.6">AVAIL = 1, USED = 0</tspan></text>
<rect x="852.5" y="178.6" width="195.0" height="82.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Desc 3 (Avail for Device)</tspan><tspan x="950.0" dy="15.6">addr = 0x4000, len = 64</tspan><tspan x="950.0" dy="15.6">id = 3</tspan><tspan x="950.0" dy="15.6">AVAIL = 1, USED = 0</tspan></text>
<rect x="1112.8" y="178.6" width="174.5" height="82.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1200.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">Desc 4 (Free / Old)</tspan><tspan x="1200.0" dy="15.6">addr = 0x0000, len = 0</tspan><tspan x="1200.0" dy="15.6">id = 4</tspan><tspan x="1200.0" dy="15.6">AVAIL = 0, USED = 0</tspan></text>
<rect x="384.9" y="373.1" width="630.2" height="93.7" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">СТАН WRAP COUNTERS:</tspan><tspan x="700.0" dy="16.9">Driver Wrap Counter = 1  │  Device Wrap Counter = 1</tspan><tspan x="700.0" dy="16.9">Дескриптор доступний (Avail), коли: AVAIL == Wrap Counter &amp;&amp; USED != Wrap Counter</tspan><tspan x="700.0" dy="16.9">Дескриптор оброблено (Used), коли: AVAIL == Wrap Counter &amp;&amp; USED == Wrap Counter</tspan></text>
<rect x="363.7" y="551.0" width="672.7" height="57.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="700.0" y="576.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Головна перевага Packed Virtqueue: виключна локальність кешу (Cache Locality).</tspan><tspan x="700.0" dy="16.9">Немає окремих масивів Avail та Used — процесор вичитує лише одну послідовну cache line.</tspan></text>
</svg>