<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="86.0" width="290.0" height="104.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="185.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">порожній</text>
<text x="185.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">щойно виділений</tspan><tspan x="185.0" dy="15.6">або очищений REINIT</tspan></text>
<rect x="450.0" y="86.0" width="290.0" height="104.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="595.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">у черзі</text>
<text x="595.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="595.0" dy="0.0">ядро роздало вміст</tspan><tspan x="595.0" dy="15.6">драйверам</tspan></text>
<rect x="860.0" y="86.0" width="290.0" height="104.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="1005.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">завершений</text>
<text x="1005.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1005.0" dy="0.0">буфери можна забирати,</tspan><tspan x="1005.0" dy="15.6">значення застигли</tspan></text>
<line x1="336.0" y1="138.0" x2="444.0" y2="138.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="390.0" dy="0.0">MEDIA_REQUEST_</tspan><tspan x="390.0" dy="14.3">IOC_QUEUE</tspan></text>
<line x1="746.0" y1="138.0" x2="854.0" y2="138.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="800.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="800.0" dy="0.0">останній об'єкт</tspan><tspan x="800.0" dy="14.3">завершився</tspan></text>
<line x1="1005.0" y1="84.0" x2="1005.0" y2="44.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="1005.0" y1="44.0" x2="185.0" y2="44.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="185.0" y1="46.0" x2="185.0" y2="84.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="595.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">MEDIA_REQUEST_IOC_REINIT — той самий дескриптор іде на наступний кадр</text>
<rect x="40.0" y="232.0" width="290.0" height="148.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="56.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="56.0" dy="0.0">S_EXT_CTRLS, QBUF — кладуть у запит</tspan><tspan x="56.0" dy="18.6">G_EXT_CTRLS → EACCES</tspan><tspan x="56.0" dy="18.6">QUEUE без буфера → ENOENT</tspan><tspan x="56.0" dy="18.6">poll → POLLERR одразу</tspan><tspan x="56.0" dy="18.6">REINIT — дозволено</tspan></text>
<rect x="450.0" y="232.0" width="290.0" height="148.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="466.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="466.0" dy="0.0">S_EXT_CTRLS → EBUSY</tspan><tspan x="466.0" dy="18.6">QUEUE вдруге → EBUSY</tspan><tspan x="466.0" dy="18.6">REINIT → EBUSY</tspan><tspan x="466.0" dy="18.6">G_EXT_CTRLS → EACCES</tspan><tspan x="466.0" dy="18.6">poll — чекає</tspan></text>
<rect x="860.0" y="232.0" width="290.0" height="148.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="876.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="876.0" dy="0.0">G_EXT_CTRLS — віддає застосоване</tspan><tspan x="876.0" dy="18.6">poll → POLLPRI одразу</tspan><tspan x="876.0" dy="18.6">REINIT — очищає під наступний кадр</tspan><tspan x="876.0" dy="18.6">close — звільняє</tspan></text>
<text x="600.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що приймає, а чим відмовляє кожен стан</text>
<rect x="40.0" y="400.0" width="1110.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="427.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">майже кожна відмова механізму запитів — це виклик, зроблений не в тому стані, у якому запит зараз перебуває</tspan></text>
</svg>