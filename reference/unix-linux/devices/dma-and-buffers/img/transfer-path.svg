<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях однієї передачі: що робить драйвер і що це означає для заліза</text>
<text x="275.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер</text>
<text x="830.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідок для заліза</text>
<rect x="50.0" y="96.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1.  dma_map_sgtable(sgt, dir)</tspan></text>
<rect x="620.0" y="96.0" width="450.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="845.0" dy="0.0">кеш скинуто в пам'ять,</tspan><tspan x="845.0" dy="16.9">буфер тепер належить пристроєві</tspan></text>
<line x1="510.0" y1="127.0" x2="610.0" y2="127.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="158.0" x2="90.0" y2="178.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="178.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="213.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">2.  обхід по sgt-&gt;nents</tspan></text>
<rect x="620.0" y="178.0" width="450.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="205.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="845.0" dy="0.0">після злиття в IOMMU сегментів</tspan><tspan x="845.0" dy="16.9">менше, ніж було в списку</tspan></text>
<line x1="510.0" y1="209.0" x2="610.0" y2="209.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="240.0" x2="90.0" y2="260.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="260.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">3.  d-&gt;addr, d-&gt;len через cpu_to_le</tspan></text>
<rect x="620.0" y="260.0" width="450.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="845.0" dy="0.0">числа лягають у порядку байтів</tspan><tspan x="845.0" dy="16.9">пристрою, не процесора</tspan></text>
<line x1="510.0" y1="291.0" x2="610.0" y2="291.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="322.0" x2="90.0" y2="342.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="342.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">4.  dma_wmb()</tspan></text>
<rect x="620.0" y="342.0" width="450.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="845.0" dy="0.0">адреса й довжина мусять дійти</tspan><tspan x="845.0" dy="16.9">ДО прапорця власника</tspan></text>
<line x1="510.0" y1="373.0" x2="610.0" y2="373.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="404.0" x2="90.0" y2="424.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="424.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">5.  d-&gt;flags = OWN</tspan></text>
<rect x="620.0" y="424.0" width="450.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="845.0" dy="0.0">з цієї миті дескриптор читає</tspan><tspan x="845.0" dy="16.9">пристрій, а не драйвер</tspan></text>
<line x1="510.0" y1="455.0" x2="610.0" y2="455.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="486.0" x2="90.0" y2="506.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="506.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="541.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">6.  writel(tail) — дзвінок у регістр</tspan></text>
<rect x="620.0" y="506.0" width="450.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="533.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="845.0" dy="0.0">writel сам чекає попередніх</tspan><tspan x="845.0" dy="16.9">записів; writel_relaxed — ні</tspan></text>
<line x1="510.0" y1="537.0" x2="610.0" y2="537.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="568.0" x2="90.0" y2="588.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="588.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="623.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">7.  переривання: OWN знято, далі dma_rmb()</tspan></text>
<rect x="620.0" y="588.0" width="450.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="615.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="845.0" dy="0.0">прапорець прочитано — лише тепер</tspan><tspan x="845.0" dy="16.9">решта полів справді наша</tspan></text>
<line x1="510.0" y1="619.0" x2="610.0" y2="619.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="650.0" x2="90.0" y2="670.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="670.0" width="450.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="705.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">8.  dma_unmap_sgtable(sgt, той самий dir)</tspan></text>
<rect x="620.0" y="670.0" width="450.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="845.0" y="697.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="845.0" dy="0.0">буфер повернувся процесорові,</tspan><tspan x="845.0" dy="16.9">читати його можна аж тепер</tspan></text>
<line x1="510.0" y1="701.0" x2="610.0" y2="701.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
