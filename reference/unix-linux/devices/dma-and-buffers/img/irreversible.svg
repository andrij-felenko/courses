<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна й та сама адреса — три різні відповіді платформи</text>
<rect x="60.0" y="66.0" width="400.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="99.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="260.0" dy="0.0">Було: bus = virt_to_bus(buf)</tspan><tspan x="260.0" dy="16.9">чиста арифметика, оборотна в обидва боки</tspan></text>
<rect x="60.0" y="176.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Стало: da = dma_map_single(dev, buf, len, dir)</tspan></text>
<rect x="200.0" y="252.0" width="400.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="400.0" dy="0.0">пряме відображення</tspan><tspan x="400.0" dy="16.9">адреса шини = фізична + стала різниця</tspan></text>
<line x1="260.0" y1="238.0" x2="260.0" y2="252.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="352.0" width="400.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="400.0" dy="0.0">через IOMMU</tspan><tspan x="400.0" dy="16.9">адресу видано з таблиці перекладу</tspan></text>
<line x1="260.0" y1="238.0" x2="260.0" y2="352.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="452.0" width="400.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="480.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="400.0" dy="0.0">через swiotlb</tspan><tspan x="400.0" dy="16.9">адреса вказує на ІНШИЙ буфер, не на buf</tspan></text>
<line x1="260.0" y1="238.0" x2="260.0" y2="452.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="176.0" width="340.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Що дістав драйвер: dma_addr_t</tspan></text>
<line x1="600.0" y1="284.0" x2="660.0" y2="284.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="384.0" x2="660.0" y2="384.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="484.0" x2="660.0" y2="484.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="252.0" width="340.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Число залежить від платформи,</tspan><tspan x="830.0" dy="16.9">від наявности IOMMU</tspan><tspan x="830.0" dy="16.9">і від того, чи спрацював обхід</tspan></text>
<rect x="660.0" y="384.0" width="340.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="419.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Зворотної функції bus_to_virt</tspan><tspan x="830.0" dy="16.9">немає й бути не може:</tspan><tspan x="830.0" dy="16.9">з числа не видно, звідки воно</tspan></text>
<rect x="660.0" y="500.0" width="340.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="527.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="830.0" dy="0.0">Тому dma_addr_t зберігає драйвер</tspan></text>
</svg>