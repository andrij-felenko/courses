<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивість опису → поле запису → те, що бере probe()</text>
<rect x="60.0" y="70.0" width="440.0" height="46.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">у вузлі дерева пристроїв</tspan></text>
<rect x="780.0" y="70.0" width="460.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">у платформному пристрої</tspan></text>
<rect x="60.0" y="140.0" width="440.0" height="76.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">compatible =</tspan><tspan x="280.0" dy="16.9">&quot;acme,myuart-r1p2&quot;</tspan></text>
<rect x="780.0" y="140.0" width="460.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">of_node → рядок, за яким</tspan><tspan x="1010.0" dy="16.9">шукається збіг із драйвером</tspan></text>
<line x1="510.0" y1="178.0" x2="770.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="232.0" width="440.0" height="76.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">reg = &lt;0xe0001000 0x1000&gt;</tspan></text>
<rect x="780.0" y="232.0" width="460.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">resource[0], IORESOURCE_MEM →</tspan><tspan x="1010.0" dy="16.9">devm_platform_ioremap_resource()</tspan></text>
<line x1="510.0" y1="270.0" x2="770.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="324.0" width="440.0" height="76.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="366.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">interrupts = &lt;0 59 4&gt;</tspan></text>
<rect x="780.0" y="324.0" width="460.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="358.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">resource[1], IORESOURCE_IRQ →</tspan><tspan x="1010.0" dy="16.9">platform_get_irq() після мапування</tspan></text>
<line x1="510.0" y1="362.0" x2="770.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="416.0" width="440.0" height="76.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">clocks = &lt;&amp;clkc 24&gt;</tspan></text>
<rect x="780.0" y="416.0" width="460.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="450.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">лишається у вузлі: драйвер бере</tspan><tspan x="1010.0" dy="16.9">його сам, уже в probe()</tspan></text>
<line x1="510.0" y1="454.0" x2="770.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="520.0" width="1180.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="650.0" y="557.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">жодне з цих чисел ядро не перевіряло: усі вони прийшли ззовні, з документації на мікросхему</tspan></text>
</svg>