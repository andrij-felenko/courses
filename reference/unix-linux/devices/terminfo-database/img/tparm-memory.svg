<text x="580.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Памʼять тлумача рядків з параметрами</text>
<text x="580.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">памʼять тлумача: чотири різні сховища й один вивід</text>
<rect x="460.0" y="76.0" width="240.0" height="96.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="112.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">параметри</tspan><tspan x="580.0" dy="16.2">%p1 … %p9</tspan><tspan x="580.0" dy="16.2">задає виклик</tspan></text>
<rect x="60.0" y="76.0" width="340.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="112.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">здебільшого числа; рядки бувають</tspan><tspan x="230.0" dy="16.2">лише в кількох можливостях —</tspan><tspan x="230.0" dy="16.2">тих, що програмують клавіші</tspan></text>
