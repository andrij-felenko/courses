<line x1="970.0" y1="240.0" x2="210.0" y2="240.0" stroke="#333333" stroke-width="1.5"/>
<line x1="210.0" y1="240.0" x2="210.0" y2="286.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="286.0" width="300.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">tigetstr(&quot;cup&quot;)</tspan><tspan x="210.0" dy="16.2"></tspan><tspan x="210.0" dy="16.2">віддає рецепт</tspan><tspan x="210.0" dy="16.2">\E[%i%p1%d;%p2%dH</tspan></text>
<rect x="440.0" y="286.0" width="300.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">tparm(рецепт, 9, 2)</tspan><tspan x="590.0" dy="16.2"></tspan><tspan x="590.0" dy="16.2">розгортає в готові байти</tspan><tspan x="590.0" dy="16.2">ESC [ 10 ; 3 H</tspan></text>
<rect x="820.0" y="286.0" width="300.0" height="118.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">tputs(байти, 1, putc)</tspan><tspan x="970.0" dy="16.2"></tspan><tspan x="970.0" dy="16.2">додає заповнення за швидкістю</tspan><tspan x="970.0" dy="16.2">лінії — і аж тоді write</tspan></text>
<line x1="364.0" y1="345.0" x2="436.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="744.0" y1="345.0" x2="816.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
