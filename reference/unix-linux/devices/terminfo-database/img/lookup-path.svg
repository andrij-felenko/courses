<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях від імені термінала до байтів</text>
<rect x="60.0" y="84.0" width="300.0" height="118.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">TERM=xterm-256color</tspan><tspan x="210.0" dy="16.2"></tspan><tspan x="210.0" dy="16.2">ім'я, яке процес успадкував</tspan><tspan x="210.0" dy="16.2">від батька — не вимір</tspan></text>
<rect x="440.0" y="84.0" width="300.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">пошук файлу запису</tspan><tspan x="590.0" dy="16.2"></tspan><tspan x="590.0" dy="16.2">TERMINFO · ~/.terminfo ·</tspan><tspan x="590.0" dy="16.2">TERMINFO_DIRS · /usr/share/terminfo</tspan></text>
<rect x="820.0" y="84.0" width="300.0" height="118.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">запис у пам'яті</tspan><tspan x="970.0" dy="16.2"></tspan><tspan x="970.0" dy="16.2">булеві, числа й рядки</tspan><tspan x="970.0" dy="16.2">одного термінала</tspan></text>
