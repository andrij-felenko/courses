<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа перебудови (reshape_position) та маршрутизація активного вводу/виводу</text>
<rect x="60.0" y="110.0" width="380.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ЗОНА НОВОЇ РОЗКЛАДКИ</tspan><tspan x="250.0" dy="14.3">(Сектори 0 .. reshape_position − 1)</tspan><tspan x="250.0" dy="14.3">Геометрія: new_level, new_layout, new_chunk, new_disks</tspan></text>
<rect x="450.0" y="110.0" width="140.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="520.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">КРИТИЧНА ЗОНА</tspan><tspan x="520.0" dy="14.3">[suspend_lo ..</tspan><tspan x="520.0" dy="14.3">.. suspend_hi]</tspan></text>
<rect x="600.0" y="110.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ЗОНА СТАРОЇ РОЗКЛАДКИ</tspan><tspan x="770.0" dy="15.6">(Сектори reshape_position .. кінець)</tspan><tspan x="770.0" dy="15.6">Геометрія: level, layout, chunksize, raid_disks</tspan></text>
<line x1="520.0" y1="70.0" x2="520.0" y2="105.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="520.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">reshape_position</text>
<line x1="470.0" y1="195.0" x2="570.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Напрямок ходу (forwards)</text>
<rect x="60.0" y="250.0" width="270.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="195.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">ВХІДНИЙ ЗАПИТ &lt; reshape_pos</tspan><tspan x="195.0" dy="11.7"></tspan><tspan x="195.0" dy="11.7">1. Запит bio потрапляє у вже змінену зону.</tspan><tspan x="195.0" dy="11.7">2. Драйвер md транслює адресу за НОВОЮ формулою:</tspan><tspan x="195.0" dy="11.7">   новий chunk, нова кількість дисків, новий offset.</tspan><tspan x="195.0" dy="11.7">3. Виконується негайно без очікування.</tspan></text>
<rect x="365.0" y="250.0" width="270.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ЗАПИТ ПОТРАПЛЯЄ В [lo .. hi]</tspan><tspan x="500.0" dy="11.7"></tspan><tspan x="500.0" dy="11.7">1. Адреса збігається з поточною смугою перебудови.</tspan><tspan x="500.0" dy="11.7">2. Потік запиту ПРИЗУПИНЯЄТЬСЯ (блокується на черзі suspend_lo/hi).</tspan><tspan x="500.0" dy="11.7">3. Reshape-потік записує смугу й просуває межу.</tspan><tspan x="500.0" dy="11.7">4. Запит розблоковується та йде за новою розкладкою.</tspan></text>
<rect x="670.0" y="250.0" width="270.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="805.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">ВХІДНИЙ ЗАПИТ ≥ reshape_pos</tspan><tspan x="805.0" dy="11.7"></tspan><tspan x="805.0" dy="11.7">1. Запит bio потрапляє в зону, яку ще не рухали.</tspan><tspan x="805.0" dy="11.7">2. Драйвер md транслює адресу за СТАРОЮ формулою:</tspan><tspan x="805.0" dy="11.7">   старий chunk, старі диски, стара парність.</tspan><tspan x="805.0" dy="11.7">3. Виконується негайно без затримок.</tspan></text>
</svg>