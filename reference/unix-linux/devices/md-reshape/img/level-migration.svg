<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція рівнів масиву без зупинки роботи: RAID1 → RAID5 → RAID6</text>
<rect x="50.0" y="70.0" width="270.0" height="320.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="185.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">ЕТАП 1: RAID1 → RAID5</tspan><tspan x="185.0" dy="14.3">(2 накопичувачі)</tspan><tspan x="185.0" dy="14.3"></tspan><tspan x="185.0" dy="14.3">Команда:</tspan><tspan x="185.0" dy="14.3">mdadm --grow /dev/md0 --level=5</tspan><tspan x="185.0" dy="14.3"></tspan><tspan x="185.0" dy="14.3">• Дзеркало RAID1 перетворюється</tspan><tspan x="185.0" dy="14.3">  на RAID5 із двох дисків.</tspan><tspan x="185.0" dy="14.3">• У 2-дисковому RAID5 один диск</tspan><tspan x="185.0" dy="14.3">  містить дані (D), другий —</tspan><tspan x="185.0" dy="14.3">  парність (P=D).</tspan><tspan x="185.0" dy="14.3">• Структура даних не змінюється,</tspan><tspan x="185.0" dy="14.3">  масив готовий до додавання дисків.</tspan></text>
<line x1="326.0" y1="230.0" x2="358.0" y2="230.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="365.0" y="70.0" width="270.0" height="320.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ЕТАП 2: РОЗШИРЕННЯ RAID5</tspan><tspan x="500.0" dy="14.3">(Додавання 3-го диска)</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">Команди:</tspan><tspan x="500.0" dy="14.3">mdadm --add /dev/md0 /dev/sdc1</tspan><tspan x="500.0" dy="14.3">mdadm --grow /dev/md0 \</tspan><tspan x="500.0" dy="14.3">  --raid-devices=3</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">• reshape перерозподіляє блоки:</tspan><tspan x="500.0" dy="14.3">  парність P обертається по 3 дисках.</tspan><tspan x="500.0" dy="14.3">• Корисна ємність масиву зростає</tspan><tspan x="500.0" dy="14.3">  вдвічі (з 1×Size до 2×Size) наживо!</tspan><tspan x="500.0" dy="14.3">• Ввід/вивід не зупиняється.</tspan></text>
<line x1="641.0" y1="230.0" x2="673.0" y2="230.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="680.0" y="70.0" width="270.0" height="320.0" rx="6" fill="#f3e8fd" stroke="#7e57c2" stroke-width="1.4"/><text x="815.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">ЕТАП 3: RAID5 → RAID6</tspan><tspan x="815.0" dy="14.3">(Додавання другого захисту Q)</tspan><tspan x="815.0" dy="14.3"></tspan><tspan x="815.0" dy="14.3">Команди:</tspan><tspan x="815.0" dy="14.3">mdadm --add /dev/md0 /dev/sdd1</tspan><tspan x="815.0" dy="14.3">mdadm --grow /dev/md0 \</tspan><tspan x="815.0" dy="14.3">  --level=6 --raid-devices=4</tspan><tspan x="815.0" dy="14.3"></tspan><tspan x="815.0" dy="14.3">• До кожної смуги обчислюється</tspan><tspan x="815.0" dy="14.3">  другий синдром Q (GF(2⁸)).</tspan><tspan x="815.0" dy="14.3">• Розкладка переходить на 2 блоки</tspan><tspan x="815.0" dy="14.3">  парності (P + Q) на смугу.</tspan><tspan x="815.0" dy="14.3">• Масив витримує одночасну відмову</tspan><tspan x="815.0" dy="14.3">  двох будь-яких дисків.</tspan></text>
<rect x="50.0" y="410.0" width="900.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Усі перетворення виконуються прозоро для файлової системи зверху (ext4, XFS).</tspan><tspan x="500.0" dy="14.3">Після завершення перебудови файлову систему розширюють командою resize2fs або xfs_growfs.</tspan></text>
</svg>