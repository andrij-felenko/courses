<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол захисту критичної смуги через резервний файл (--backup-file)</text>
<rect x="50.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="117.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">1. Блокування I/O</tspan><tspan x="117.5" dy="13.0"></tspan><tspan x="117.5" dy="13.0">mddev-&gt;suspend_lo/hi</tspan><tspan x="117.5" dy="13.0">заморожує доступ</tspan><tspan x="117.5" dy="13.0">до вікна смуги</tspan></text>
<line x1="187.0" y1="127.5" x2="201.0" y2="127.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="203.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="270.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.5" dy="0.0">2. Зчитування даних</tspan><tspan x="270.5" dy="13.0"></tspan><tspan x="270.5" dy="13.0">Зчитування критичних</tspan><tspan x="270.5" dy="13.0">смуг із дисків</tspan><tspan x="270.5" dy="13.0">масиву в RAM</tspan></text>
<line x1="340.0" y1="127.5" x2="354.0" y2="127.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="356.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="423.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="423.5" dy="0.0">3. Запис у backup</tspan><tspan x="423.5" dy="13.0"></tspan><tspan x="423.5" dy="13.0">Збереження копії</tspan><tspan x="423.5" dy="13.0">у файл + виклик</tspan><tspan x="423.5" dy="13.0">fsync() на носій</tspan></text>
<line x1="493.0" y1="127.5" x2="507.0" y2="127.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="509.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="576.5" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="576.5" dy="0.0">4. Фіксація стану</tspan><tspan x="576.5" dy="11.7"></tspan><tspan x="576.5" dy="11.7">Запис reshape_position</tspan><tspan x="576.5" dy="11.7">і прапорця в суперблок</tspan><tspan x="576.5" dy="11.7">на дисках</tspan></text>
<line x1="646.0" y1="127.5" x2="660.0" y2="127.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="662.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="729.5" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="729.5" dy="0.0">5. Нова розкладка</tspan><tspan x="729.5" dy="11.7"></tspan><tspan x="729.5" dy="11.7">Обчислення нової</tspan><tspan x="729.5" dy="11.7">парності й запис нової</tspan><tspan x="729.5" dy="11.7">смуги на диски</tspan></text>
<line x1="799.0" y1="127.5" x2="813.0" y2="127.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="815.0" y="75.0" width="135.0" height="105.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="882.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="882.5" dy="0.0">6. Зняття замка</tspan><tspan x="882.5" dy="13.0"></tspan><tspan x="882.5" dy="13.0">Просування suspend,</tspan><tspan x="882.5" dy="13.0">розмороження черги</tspan><tspan x="882.5" dy="13.0">вводу/виводу</tspan></text>
<line x1="435.0" y1="184.0" x2="435.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="438.8" y="194.5" width="272.3" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="575.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Збій живлення / аварія посеред запису</tspan></text>
<rect x="50.0" y="245.0" width="900.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="270.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ВІДНОВЛЕННЯ ПІСЛЯ АВАРІЇ (CRASH RECOVERY):</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">1. При збиранні масиву: mdadm --assemble --backup-file=/path/to/backup /dev/md0 /dev/sd[a-d]1</tspan><tspan x="500.0" dy="14.3">2. Утиліта mdadm виявляє активний біт MD_FEATURE_RESHAPE_ACTIVE у суперблоці.</tspan><tspan x="500.0" dy="14.3">3. Зчитує збережені оригінальні блоки з backup-file і відновлює пошкоджену смугу на дисках масиву.</tspan><tspan x="500.0" dy="14.3">4. Ядро відновлює стан reshape_position і безпечно продовжує перебудову далі.</tspan></text>
<rect x="50.0" y="380.0" width="900.0" height="115.0" rx="6" fill="#f3e8fd" stroke="#7e57c2" stroke-width="1.4"/><text x="500.0" y="412.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">АЛЬТЕРНАТИВА В МЕТАДАНИХ 1.1 ТА 1.2 — ЗСУВ ПРОСТОРУ ДАНИХ (DATA OFFSET SHIFTING):</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">Якщо суперблок має запас зміщення на початку розділу (data_offset: 2048 → 4096 секторів), нова смуга пишеться</tspan><tspan x="500.0" dy="14.3">у фізично вільне місце на диску. Стара смуга взагалі не перетирається in-place, тому окремий зовнішній</tspan><tspan x="500.0" dy="14.3">резервний файл не потрібен — захист від краху гарантується самою структурою простору на носії.</tspan></text>
</svg>