<line x1="365.0" y1="168.0" x2="570.0" y2="112.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="270.0" width="420.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">КОЛІЗІЯ ПЕРЕЗАПИСУ (Stripe Overwrite):</tspan><tspan x="260.0" dy="15.6">• Нова смуга 0 вимагає блоків D0, D1 і D2.</tspan><tspan x="260.0" dy="15.6">• Блок D2 у старій геометрії лежить у смузі 1 на Диску 0.</tspan><tspan x="260.0" dy="15.6">• Якщо писати нову смугу 0 на початок дисків, вона</tspan><tspan x="260.0" dy="15.6">  затирає сектори старої смуги 0 до зчитування всіх даних!</tspan></text>
<rect x="510.0" y="270.0" width="440.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">ДВА СПОСОБИ БЕЗПЕЧНОГО РОЗВ'ЯЗАННЯ:</tspan><tspan x="730.0" dy="15.6">1. Зворотний хід (Backward Reshape):</tspan><tspan x="730.0" dy="15.6">   Перебудова йде з кінця масиву до початку (max → 0).</tspan><tspan x="730.0" dy="15.6">2. Зсув простору даних (Data Offset Shifting):</tspan><tspan x="730.0" dy="15.6">   Нова геометрія пишеться у вільний проміжок перед даними.</tspan></text>
<rect x="50.0" y="400.0" width="900.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Головне правило: якщо нова смуга ширша за стару, читання і запис конкурують за ті самі фізичні сектори.</tspan><tspan x="500.0" dy="15.6">Ядро обирає напрямок перебудови (forwards/backwards) або використовує резервний файл (--backup-file),</tspan><tspan x="500.0" dy="15.6">щоб жоден блок старої смуги не був затертий до того, як його вичитано й зафіксовано в новій структурі.</tspan></text>
</svg>