<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 1314" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="1314" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="355.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">демон у просторі користувача</text>
<text x="1105.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро: f_fs і libcomposite</text>
<rect x="50.0" y="74.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">mount -t functionfs echo /dev/ffs-echo</tspan><tspan x="355.0" dy="19.5">-o uid=1000,gid=1000</tspan></text>
<rect x="800.0" y="74.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">у точці монтування є єдиний файл ep0</tspan></text>
<line x1="674.0" y1="122.0" x2="786.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="200.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="243.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">write(ep0, дескриптори)</tspan><tspan x="355.0" dy="19.5">одним викликом, magic V2</tspan></text>
<rect x="800.0" y="200.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">розбирає: інтерфейс і дві bulk-точки</tspan></text>
<line x1="674.0" y1="248.0" x2="786.0" y2="248.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="326.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">write(ep0, рядки)</tspan></text>
<rect x="800.0" y="326.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">поруч із ep0 виникають ep1 і ep2</tspan></text>
<line x1="674.0" y1="374.0" x2="786.0" y2="374.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="452.0" width="1360.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="490.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">поки цих двох записів нема, гаджет не прив'яжеться до контролера:</tspan><tspan x="730.0" dy="19.5">підтяжки нема, і для хоста роз'єм порожній</tspan></text>
<rect x="50.0" y="568.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="611.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">open(ep1), open(ep2)</tspan><tspan x="355.0" dy="19.5">read(ep1) — блокується</tspan></text>
<rect x="800.0" y="568.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="611.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">echo fe980000.usb &gt; UDC</tspan><tspan x="1105.0" dy="19.5">прив'язка, підтяжка, хост питає «хто ти»</tspan></text>
<line x1="674.0" y1="616.0" x2="786.0" y2="616.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="694.0" width="1360.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="732.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">read(ep1) спить у ядрі, доки хост не ввімкне конфігурацію</tspan><tspan x="730.0" dy="19.5">(з O_NONBLOCK замість сну — EAGAIN, і чекати нема на чому: poll на ep-файлах не працює)</tspan></text>
<rect x="50.0" y="810.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="863.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">read(ep0) віддає подію ENABLE</tspan></text>
<rect x="800.0" y="810.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="853.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">хост вибрав конфігурацію,</tspan><tspan x="1105.0" dy="19.5">кінцеві точки ввімкнено</tspan></text>
<line x1="786.0" y1="858.0" x2="674.0" y2="858.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="936.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="979.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">read(ep1) повертає дані,</tspan><tspan x="355.0" dy="19.5">write(ep2) відсилає їх назад</tspan></text>
<rect x="800.0" y="936.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="989.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">заявки ходять шиною</tspan></text>
<line x1="786.0" y1="984.0" x2="674.0" y2="984.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="1062.0" width="610.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="355.0" y="1105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">read(ep1) падає з ESHUTDOWN,</tspan><tspan x="355.0" dy="19.5">read(ep0) віддає DISABLE</tspan></text>
<rect x="800.0" y="1062.0" width="610.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1105.0" y="1105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">кабель висмикнуто:</tspan><tspan x="1105.0" dy="19.5">заявки в польоті скасовано</tspan></text>
<line x1="786.0" y1="1110.0" x2="674.0" y2="1110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="1188.0" width="1360.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="730.0" y="1226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">файли точок після DISABLE не закривають:</tspan><tspan x="730.0" dy="19.5">наступний read(ep1) просто засинає до нового ENABLE</tspan></text>
</svg>