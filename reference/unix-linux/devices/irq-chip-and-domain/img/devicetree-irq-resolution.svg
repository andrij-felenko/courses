<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція Device Tree: від опису контролера до виділення Linux virq</text>
<text x="600.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях трансляції переривання від вузла Device Tree до номера Linux</text>
<rect x="40.0" y="75.0" width="360.0" height="495.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Опис у Device Tree (.dts)</text>
<rect x="55.0" y="125.0" width="330.0" height="220.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">gic: interrupt-controller@2c001000 {</tspan><tspan x="220.0" dy="14.3">    compatible = &quot;arm,gic-400&quot;;</tspan><tspan x="220.0" dy="14.3">    #interrupt-cells = &lt;3&gt;;</tspan><tspan x="220.0" dy="14.3">    interrupt-controller;</tspan><tspan x="220.0" dy="14.3">};</tspan><tspan x="220.0" dy="14.3"></tspan><tspan x="220.0" dy="14.3">serial@1c28000 {</tspan><tspan x="220.0" dy="14.3">    compatible = &quot;ns16550a&quot;;</tspan><tspan x="220.0" dy="14.3">    interrupt-parent = &lt;&amp;gic&gt;;</tspan><tspan x="220.0" dy="14.3">    interrupts = &lt;GIC_SPI 32</tspan><tspan x="220.0" dy="14.3">                 IRQ_TYPE_LEVEL_HIGH&gt;;</tspan><tspan x="220.0" dy="14.3">};</tspan></text>
<rect x="55.0" y="360.0" width="330.0" height="195.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="220.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Ключові властивості:</tspan><tspan x="220.0" dy="14.3">• interrupt-controller: оголошує домен</tspan><tspan x="220.0" dy="14.3">• #interrupt-cells = &lt;3&gt;: формат кортежу</tspan><tspan x="220.0" dy="14.3">  [тип, номер, прапорці фронту/рівня]</tspan><tspan x="220.0" dy="14.3">• interrupt-parent: посилання на контролер</tspan><tspan x="220.0" dy="14.3">• interrupts: параметри лінії пристрою</tspan></text>
<rect x="430.0" y="75.0" width="380.0" height="495.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Ядро Linux: of_irq_get()</text>
<rect x="445.0" y="125.0" width="350.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">of_irq_parse_one(dev-&gt;of_node, 0, &amp;fwspec)</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Парсинг властивості interrupts, знаходження вузла</tspan><tspan x="620.0" dy="14.3">interrupt-parent і заповнення struct irq_fwspec</tspan></text>
<rect x="445.0" y="230.0" width="350.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">irq_find_matching_fwspec(&amp;fwspec)</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Пошук відповідного struct irq_domain за fwnode</tspan></text>
<rect x="445.0" y="335.0" width="350.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="364.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">domain-&gt;ops-&gt;translate(&amp;fwspec, &amp;hwirq, &amp;type)</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Виклик драйверного кольбеку: перетворення</tspan><tspan x="620.0" dy="14.3">&lt;GIC_SPI 32&gt; у hwirq = 32 + 32 = 64 (SPI зміщення)</tspan></text>
<rect x="445.0" y="440.0" width="350.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="469.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">irq_create_mapping(domain, hwirq)</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Якщо virq ще не виділено -&gt; irq_domain_alloc_descs()</tspan><tspan x="620.0" dy="14.3">-&gt; domain-&gt;ops-&gt;map() -&gt; прив'язка chip + handler</tspan></text>
<rect x="840.0" y="75.0" width="320.0" height="495.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="1000.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Драйвер пристрою</text>
<rect x="855.0" y="125.0" width="290.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">// У функції probe():</tspan><tspan x="1000.0" dy="14.3">int irq = platform_get_irq(pdev, 0);</tspan><tspan x="1000.0" dy="14.3">// Повертає virq = 42</tspan><tspan x="1000.0" dy="14.3"></tspan><tspan x="1000.0" dy="14.3">devm_request_irq(&amp;pdev-&gt;dev,</tspan><tspan x="1000.0" dy="14.3">    irq,</tspan><tspan x="1000.0" dy="14.3">    uart_interrupt,</tspan><tspan x="1000.0" dy="14.3">    0,</tspan><tspan x="1000.0" dy="14.3">    &quot;serial-uart&quot;,</tspan><tspan x="1000.0" dy="14.3">    port);</tspan><tspan x="1000.0" dy="14.3"></tspan><tspan x="1000.0" dy="14.3">// Драйвер НЕ знає про hwirq,</tspan><tspan x="1000.0" dy="14.3">// GIC чи регістри контролера.</tspan><tspan x="1000.0" dy="14.3">// Він оперує лише virq = 42!</tspan></text>
<rect x="855.0" y="380.0" width="290.0" height="175.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="435.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">Результат абстракції:</tspan><tspan x="1000.0" dy="14.3">Драйвер повністю переносимий між</tspan><tspan x="1000.0" dy="14.3">x86 (APIC/MSI), ARM (GIC),</tspan><tspan x="1000.0" dy="14.3">RISC-V (PLIC) та MIPS.</tspan><tspan x="1000.0" dy="14.3">Уся апаратна специфіка прихована</tspan><tspan x="1000.0" dy="14.3">всередині irq_domain та irq_chip.</tspan></text>
<line x1="385.0" y1="235.0" x2="445.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="795.0" y1="445.0" x2="855.0" y2="245.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>