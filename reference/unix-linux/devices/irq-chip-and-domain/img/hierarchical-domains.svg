<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархічні домени переривань: зв'язок шарів від шини до ядра</text>
<text x="600.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія доменів (MSI / IOMMU / GIC / CPU)</text>
<rect x="100.0" y="100.0" width="1000.0" height="95.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.0"/>
<text x="120.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Рівень пристрою (PCIe Endpoint / NVMe)</text>
<rect x="130.0" y="128.0" width="290.0" height="59.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Пристрій PCIe (NVMe / NIC)</tspan><tspan x="275.0" dy="14.3">Генерує MSI-X запис у пам'ять</tspan><tspan x="275.0" dy="14.3">Адреса: 0xFEE00000 / Дані: 0x4021</tspan></text>
<rect x="460.0" y="128.0" width="290.0" height="59.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Периферія ядра (I2C / UART)</tspan><tspan x="605.0" dy="14.3">Сигнал на фізичному дроті SPI</tspan><tspan x="605.0" dy="14.3">Лінія hwirq=48</tspan></text>
<rect x="790.0" y="128.0" width="280.0" height="59.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Зовнішній GPIO розширювач</tspan><tspan x="930.0" dy="14.3">Спад на піні GPIO_5</tspan><tspan x="930.0" dy="14.3">Перериває через I2C шину</tspan></text>
<rect x="100.0" y="235.0" width="1000.0" height="95.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.0"/>
<text x="120.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Проміжні домени трансформації</text>
<rect x="130.0" y="263.0" width="290.0" height="59.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">PCIe MSI irq_domain</tspan><tspan x="275.0" dy="14.3">struct irq_data (рівень MSI)</tspan><tspan x="275.0" dy="14.3">chip: pci_msi_irq_chip</tspan><tspan x="275.0" dy="14.3">hwirq: 0 (MSI vector index)</tspan></text>
<rect x="460.0" y="263.0" width="290.0" height="59.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="605.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Direct Wire Mapping</tspan><tspan x="605.0" dy="14.3">Пряма трансляція ліній без</tspan><tspan x="605.0" dy="14.3">проміжних контролерів</tspan></text>
<rect x="790.0" y="263.0" width="280.0" height="59.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">GPIO irq_domain (nested/chained)</tspan><tspan x="930.0" dy="14.3">struct irq_data (рівень GPIO)</tspan><tspan x="930.0" dy="14.3">chip: max7301_chip</tspan><tspan x="930.0" dy="14.3">hwirq: 5</tspan></text>
<rect x="100.0" y="370.0" width="1000.0" height="95.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.0"/>
<text x="120.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Домен трансляції повідомлень / переривань</text>
<rect x="130.0" y="398.0" width="290.0" height="59.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">GICv3 ITS / IOMMU IR Domain</tspan><tspan x="275.0" dy="14.3">struct irq_data (рівень ITS)</tspan><tspan x="275.0" dy="14.3">chip: gic_its_irq_chip</tspan><tspan x="275.0" dy="14.3">Трансляція DeviceID + EventID -&gt; LPI</tspan></text>
<rect x="460.0" y="398.0" width="290.0" height="59.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">GIC Distributor Domain</tspan><tspan x="605.0" dy="14.3">struct irq_data (рівень SPI/Distributor)</tspan><tspan x="605.0" dy="14.3">chip: gic_data.chip</tspan><tspan x="605.0" dy="14.3">hwirq: 48 (GIC SPI 16)</tspan></text>
<rect x="790.0" y="398.0" width="280.0" height="59.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">GIC SPI Parent Domain</tspan><tspan x="930.0" dy="14.3">struct irq_data (батьківський SPI)</tspan><tspan x="930.0" dy="14.3">chip: gic_data.chip</tspan><tspan x="930.0" dy="14.3">hwirq: 54 (GIC SPI 22)</tspan></text>
<rect x="100.0" y="505.0" width="1000.0" height="85.0" rx="6" fill="#fcfdfe" stroke="#6b7280" stroke-width="1.0"/>
<text x="120.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Кореневий домен та інтерфейс CPU</text>
<rect x="130.0" y="533.0" width="940.0" height="49.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="547.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Кореневий апаратний контролер (GIC Distributor / Core APIC)</tspan><tspan x="600.0" dy="14.3">struct irq_desc (єдиний virq у ядрі) -&gt; generic flow handler (handle_fasteoi_irq / handle_edge_irq)</tspan><tspan x="600.0" dy="14.3">Каскадний виклик операцій: parent_data-&gt;chip-&gt;irq_mask() -&gt; ... -&gt; chip-&gt;irq_mask()</tspan></text>
