<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння generic flow handlers: Level, Edge та FastEOI</text>
<text x="600.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритми стандартних обробників потоку (Generic IRQ Flow Handlers)</text>
<rect x="50.0" y="75.0" width="340.0" height="530.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">handle_level_irq()</text>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Для переривань за рівнем напруги</text>
<rect x="70.0" y="145.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Захоплення raw_spin_lock</tspan><tspan x="220.0" dy="14.3">Блокування дескриптора desc-&gt;lock</tspan></text>
<rect x="70.0" y="217.0" width="300.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. mask_ack_irq()</tspan><tspan x="220.0" dy="14.3">Маскування в chip-&gt;irq_mask()</tspan><tspan x="220.0" dy="14.3">+ квитування chip-&gt;irq_ack()</tspan><tspan x="220.0" dy="14.3">(усуває шторм переривань)</tspan></text>
<rect x="70.0" y="289.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3. Перевірка прапорців</tspan><tspan x="220.0" dy="14.3">Чи лінія не відключена (IRQD_IRQ_DISABLED)?</tspan></text>
<rect x="70.0" y="361.0" width="300.0" height="64.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">4. handle_irq_event()</tspan><tspan x="220.0" dy="14.3">Зняття замка -&gt; виклик ISR драйвера</tspan><tspan x="220.0" dy="14.3">action-&gt;handler(irq, dev_id)</tspan></text>
<rect x="70.0" y="433.0" width="300.0" height="64.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="220.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">5. cond_unmask_irq()</tspan><tspan x="220.0" dy="14.3">Захоплення замка -&gt; розмаскування</tspan><tspan x="220.0" dy="14.3">chip-&gt;irq_unmask(), якщо лінія активна</tspan></text>
<rect x="70.0" y="505.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="533.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">6. Звільнення замка</tspan><tspan x="220.0" dy="14.3">Завершення обробки переривання</tspan></text>
<rect x="430.0" y="75.0" width="340.0" height="530.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="600.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">handle_edge_irq()</text>
<text x="600.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Для переривань за фронтом сигналу</text>
<rect x="450.0" y="145.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Захоплення raw_spin_lock</tspan><tspan x="600.0" dy="14.3">Блокування дескриптора desc-&gt;lock</tspan></text>
<rect x="450.0" y="217.0" width="300.0" height="64.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">2. chip-&gt;irq_ack()</tspan><tspan x="600.0" dy="14.3">Негайне квитування фронту в контролері</tspan><tspan x="600.0" dy="14.3">(маскування НЕ робиться!)</tspan></text>
<rect x="450.0" y="289.0" width="300.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. Перевірка IRQS_PENDING</tspan><tspan x="600.0" dy="14.3">Якщо інше ядро вже обробляє цей IRQ —</tspan><tspan x="600.0" dy="14.3">ставимо IRQS_PENDING і виходимо</tspan></text>
<rect x="450.0" y="361.0" width="300.0" height="64.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">4. Цикл handle_irq_event()</tspan><tspan x="600.0" dy="14.3">Виклик ISR драйвера action-&gt;handler()</tspan><tspan x="600.0" dy="14.3">поки з'являються повторні фронти!</tspan></text>
<rect x="450.0" y="433.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="461.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">5. Очищення стану</tspan><tspan x="600.0" dy="14.3">Скидання прапорця IRQS_PENDING</tspan></text>
<rect x="450.0" y="505.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="533.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">6. Звільнення замка</tspan><tspan x="600.0" dy="14.3">Завершення обробки</tspan></text>
<rect x="810.0" y="75.0" width="340.0" height="530.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="980.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">handle_fasteoi_irq()</text>
<text x="980.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сучасні контролери (ARM GIC, x86 APIC)</text>
<rect x="830.0" y="145.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">1. Захоплення raw_spin_lock</tspan><tspan x="980.0" dy="14.3">Блокування дескриптора desc-&gt;lock</tspan></text>
<rect x="830.0" y="217.0" width="300.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">2. Без маскування на вході</tspan><tspan x="980.0" dy="14.3">Апаратний контролер сам тримає</tspan><tspan x="980.0" dy="14.3">стан переривання Active у процесорі</tspan></text>
<rect x="830.0" y="289.0" width="300.0" height="64.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">3. handle_irq_event()</tspan><tspan x="980.0" dy="14.3">Зняття замка -&gt; прямий виклик</tspan><tspan x="980.0" dy="14.3">action-&gt;handler(irq, dev_id)</tspan></text>
<rect x="830.0" y="361.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="389.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">4. Захоплення замка</tspan><tspan x="980.0" dy="14.3">Повернення під захист desc-&gt;lock</tspan></text>
<rect x="830.0" y="433.0" width="300.0" height="64.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">5. chip-&gt;irq_eoi()</tspan><tspan x="980.0" dy="14.3">Єдиний швидкий сигнал End-Of-Interrupt</tspan><tspan x="980.0" dy="14.3">(наприклад, запис у ICC_EOIR1_EL1)</tspan></text>
<rect x="830.0" y="505.0" width="300.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="533.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">6. Звільнення замка</tspan><tspan x="980.0" dy="14.3">Контролер переводить стан Active-&gt;Inactive</tspan></text>
</svg>