<text x="120.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">пам'ять із пікселями:</tspan><tspan x="120.0" dy="17.2">формат, крок, ручки</tspan></text>
<rect x="235.0" y="60.0" width="180.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Плоскість</tspan></text>
<text x="325.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="325.0" dy="0.0">один вхід мікшера:</tspan><tspan x="325.0" dy="17.2">основна, курсор, накладка</tspan></text>
