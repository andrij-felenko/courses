<rect x="645.0" y="60.0" width="180.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Кодер</tspan></text>
<text x="735.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="735.0" dy="0.0">потік пікселів стає</tspan><tspan x="735.0" dy="17.2">сигналом свого типу</tspan></text>
<rect x="850.0" y="60.0" width="180.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Роз'єм</tspan></text>
<text x="940.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="940.0" dy="0.0">гніздо: підключено чи ні,</tspan><tspan x="940.0" dy="17.2">EDID, перелік режимів</tspan></text>
