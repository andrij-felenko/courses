<text x="30.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Два двигуни розгортки на три гнізда: одночасно — щонайбільше дві незалежні картинки, і не в будь-якому поєднанні.</text>
