<text x="30.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Шлях одного пікселя: кожна ланка — окремий ресурс кристала</text>
<text x="30.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Ланки не з'єднуються довільно: кожна знає, з ким їй дозволено працювати</text>
