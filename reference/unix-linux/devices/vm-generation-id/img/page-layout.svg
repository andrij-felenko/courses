<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шістнадцять байтів GUID лежать із зсувом 40 у сторінці fw_cfg</text>
<text x="700.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блоб fw_cfg «etc/vmgenid_guid» — рівно одна сторінка, 4096 байтів</text>
<text x="700.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ширина сегментів не пропорційна їхньому розмірові</text>
<rect x="90.0" y="230.0" width="340.0" height="112.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="260.0" y="273.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">36 байтів заглушки</tspan><tspan x="260.0" dy="16.9">проти пошуку</tspan><tspan x="260.0" dy="16.9">SDT-заголовка в OVMF</tspan></text>
<rect x="430.0" y="230.0" width="170.0" height="112.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="515.0" y="273.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">4 байти</tspan><tspan x="515.0" dy="16.9">добивки</tspan><tspan x="515.0" dy="16.9">до вирівняння на 8</tspan></text>
<rect x="600.0" y="230.0" width="300.0" height="112.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="750.0" y="272.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">GUID</tspan><tspan x="750.0" dy="18.2">16 байтів</tspan><tspan x="750.0" dy="18.2">те, що читає гість</tspan></text>
<rect x="900.0" y="230.0" width="410.0" height="112.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1105.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">решта сторінки</tspan><tspan x="1105.0" dy="16.9">до 4096 байтів</tspan></text>
<text x="90.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<text x="430.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">36</text>
<text x="600.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">40</text>
<text x="900.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">56</text>
<text x="1310.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">4096</text>
<text x="693.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зсув від початку блоба, у байтах</text>
<line x1="750.0" y1="342.0" x2="750.0" y2="452.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="577.3" y="461.5" width="345.5" height="61.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="750.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">ADDR() → Package(2) { VGIA + 0x28 , 0 }</tspan><tspan x="750.0" dy="17.6">молодші 32 біти адреси GUID, потім старші</tspan></text>
<rect x="444.8" y="577.6" width="510.5" height="54.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="601.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">VGIA — іменована комірка в SSDT: адресу блоба туди вписує прошивка,</tspan><tspan x="700.0" dy="16.2">а QEMU дізнається її назад із записуваного блоба «etc/vmgenid_addr».</tspan></text>
</svg>