<text x="24.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">VIDIOC_STREAMOFF повертає буфери з обох черг у другий рядок: QUEUED і DONE знято, дані втрачено</text>
