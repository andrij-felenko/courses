<text x="440.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Цикл перевикористання буферів та запитів без повторного виділення пам'яті (Request::reuse)</text>
