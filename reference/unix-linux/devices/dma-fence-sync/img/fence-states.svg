<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="36.0" y="50.0" width="480.0" height="330.0" rx="10" fill="#fbfcfd" stroke="#c3c9d1" stroke-width="1.4"/>
<text x="60.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Огорожа (dma_fence)</text>
<rect x="60.0" y="100.0" width="170.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">не спрацювала</tspan></text>
<line x1="240.0" y1="127.0" x2="316.0" y2="127.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="278.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">падає раз</text>
<rect x="322.0" y="100.0" width="170.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="407.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="407.0" dy="0.0">спрацювала</tspan></text>
<text x="60.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">назад дороги немає: нова порція роботи — нова огорожа</text>
<text x="60.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">контекст — з якої апаратної черги вона вийшла</text>
<text x="60.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">номер — місце в цій черзі, звідси й порядок</text>
<text x="60.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">помилка — позначка всередині; стан однаково «спрацювала»</text>
<text x="60.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">лічильник посилань — живе, доки дивиться хоч хтось</text>
<rect x="660.0" y="70.0" width="370.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">потік у ядрі засинає до сигналу</tspan></text>
<text x="1030.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">дорого: потік стоїть</text>
<line x1="524.0" y1="93.0" x2="654.0" y2="93.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="185.0" width="370.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="212.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">зворотний виклик у мить падіння</tspan></text>
<text x="1030.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">дешево: нікому не чекати</text>
<line x1="524.0" y1="208.0" x2="654.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="300.0" width="370.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="327.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">черга команд пристрою чекає сама</tspan></text>
<text x="1030.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">найдешевше: без процесора</text>
<line x1="524.0" y1="323.0" x2="654.0" y2="323.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>