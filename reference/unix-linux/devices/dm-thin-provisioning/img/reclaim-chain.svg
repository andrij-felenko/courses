<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Місце виділяється саме, а повертається лише ланцюгом: розірваний на будь-якій ланці — не повертається зовсім</text>
<rect x="60.0" y="96.0" width="400.0" height="74.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.8"/><text x="260.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">файл видалено</tspan></text>
<rect x="490.0" y="96.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">у карті вільного місця файлової системи змінилися біти — і більше ніде нічого</tspan></text>
<line x1="260.0" y1="170.0" x2="260.0" y2="224.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="224.0" width="400.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="260.0" y="266.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">fstrim або монтування з discard</tspan></text>
<rect x="490.0" y="224.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">хтось мусить обійти карту й вимовити «ці діапазони вільні» вголос</tspan></text>
<rect x="1020.0" y="224.0" width="240.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">нема ні того, ні того — пул не дізнається нічого й далі росте</tspan></text>
<line x1="260.0" y1="298.0" x2="260.0" y2="352.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="352.0" width="400.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="260.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">запит накриває цілий блок пулу</tspan></text>
<rect x="490.0" y="352.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">звільнити півблока не можна: решта половина комусь потрібна</tspan></text>
<rect x="1020.0" y="352.0" width="240.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">дрібні розкидані діри при блоці 512 КіБ не звільняють нічого</tspan></text>
<line x1="260.0" y1="426.0" x2="260.0" y2="480.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="480.0" width="400.0" height="74.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="260.0" y="522.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">лічильник посилань упав до нуля</tspan></text>
<rect x="490.0" y="480.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="521.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">поки на блок дивиться бодай один знімок, він лишається зайнятим</tspan></text>
<rect x="1020.0" y="480.0" width="240.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="520.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">забутий знімок мовчки тримає все, що том колись записав</tspan></text>
<line x1="260.0" y1="554.0" x2="260.0" y2="608.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="608.0" width="400.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="260.0" y="650.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">блок повернувся у вільні пулу</tspan></text>
<rect x="490.0" y="608.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="649.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">тепер його видадуть під наступний перший запис будь-якого тому</tspan></text>
<line x1="260.0" y1="682.0" x2="260.0" y2="736.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="736.0" width="400.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="260.0" y="778.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">discard_passdown до носія</tspan></text>
<rect x="490.0" y="736.0" width="500.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="777.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">пул переказує звільнення вниз, і аж тепер про це дізнається SSD</tspan></text>
<rect x="1020.0" y="736.0" width="240.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="776.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">вимкнено — місце вільне в пулі, але зайняте всередині носія</tspan></text>
<rect x="60.0" y="862.0" width="1200.0" height="60.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="660.0" y="896.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Ті самі ланки повторюються на кожному поверсі стека: гість, образ, хазяїн, пул, носій — і кожен поверх треба вмикати окремо</tspan></text>
</svg>