<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Пул — це пара пристроїв: маленький із відображеннями і великий із даними</text>
<rect x="60.0" y="84.0" width="700.0" height="640.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">пристрій метаданих — типово одиниці ГіБ, стеля 16 ГіБ</text>
<rect x="90.0" y="140.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="240.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">суперблок</tspan></text>
<text x="410.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">єдине місце, яке пишуть на місці</text>
<line x1="240.0" y1="192.0" x2="240.0" y2="236.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="236.0" width="620.0" height="56.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/><text x="400.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">верхнє дерево:  номер тому  →  корінь його дерева відображень</tspan></text>
<line x1="240.0" y1="292.0" x2="200.0" y2="336.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="292.0" x2="600.0" y2="336.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="336.0" width="260.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="220.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">дерево тому app</tspan><tspan x="220.0" dy="16.9">логічний блок → запис</tspan></text>
<rect x="450.0" y="336.0" width="260.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="580.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">дерево знімка app-1</tspan><tspan x="580.0" dy="16.9">логічний блок → запис</tspan></text>
<line x1="220.0" y1="414.0" x2="300.0" y2="466.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="580.0" y1="414.0" x2="500.0" y2="466.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="466.0" width="620.0" height="90.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="400.0" y="506.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">листок — 64 біти на одне відображення</tspan><tspan x="400.0" dy="18.2">40 бітів: номер блока даних        24 біти: час, коли відображення зробили</tspan></text>
<rect x="90.0" y="586.0" width="620.0" height="118.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="400.0" y="631.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">карта простору: скільки дерев посилається на кожен блок даних</tspan><tspan x="400.0" dy="18.2">0 — вільний, 1 — чийсь власний, 2 і більше — спільний зі знімками</tspan><tspan x="400.0" dy="18.2">лежить тут-таки й міняється в тій самій транзакції, що й дерева</tspan></text>
<rect x="800.0" y="84.0" width="540.0" height="640.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="820.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">пристрій даних — власне місце</text>
<text x="820.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">порізаний на блоки однакового розміру:</text>
<text x="820.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">від 64 КіБ до 1 ГіБ, кратно 64 КіБ, назавжди</text>
<rect x="830.0" y="210.0" width="230.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="945.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">блок 0</tspan><tspan x="945.0" dy="16.9">посилань 2</tspan></text>
<rect x="1090.0" y="210.0" width="230.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1205.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">блок 1</tspan><tspan x="1205.0" dy="16.9">посилань 1</tspan></text>
<rect x="830.0" y="328.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="945.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">блок 2</tspan><tspan x="945.0" dy="16.9">вільний</tspan></text>
<rect x="1090.0" y="328.0" width="230.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="1205.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">блок 3</tspan><tspan x="1205.0" dy="16.9">посилань 2</tspan></text>
<rect x="830.0" y="446.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="945.0" y="487.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">блок 4</tspan><tspan x="945.0" dy="16.9">вільний</tspan></text>
<rect x="1090.0" y="446.0" width="230.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1205.0" y="487.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">блок 5</tspan><tspan x="1205.0" dy="16.9">посилань 1</tspan></text>
<rect x="830.0" y="564.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="945.0" y="605.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">блок 6</tspan><tspan x="945.0" dy="16.9">вільний</tspan></text>
<rect x="1090.0" y="564.0" width="230.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="1205.0" y="605.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">блок 7</tspan><tspan x="1205.0" dy="16.9">вільний</tspan></text>
<rect x="60.0" y="752.0" width="1280.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="700.0" y="788.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Скільки треба метаданих: приблизно 48 байтів на кожен блок даних.</tspan><tspan x="700.0" dy="18.2">Пул на 4 ТіБ із блоком 64 КіБ — це 67 108 864 блоків і близько 3 ГіБ метаданих;</tspan><tspan x="700.0" dy="18.2">той самий пул із блоком 512 КіБ — 8 388 608 блоків і близько 384 МіБ</tspan></text>
</svg>