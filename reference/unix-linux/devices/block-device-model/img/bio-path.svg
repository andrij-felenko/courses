<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від наміру файлової системи до секторів і назад</text>
<rect x="306.4" y="57.9" width="327.3" height="64.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">файлова система: треба записати вміст</tspan><tspan x="470.0" dy="18.2">двох сусідніх блоків файлу</tspan></text>
