<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура V4L2 M2M: дві черги на єдиному дескрипторі файлу</text>
<rect x="279.9" y="30.8" width="540.1" height="78.4" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Простір користувача (Userspace)</tspan><tspan x="550.0" dy="18.2">Один відкритий дескриптор: fd = open(&quot;/dev/video0&quot;, O_RDWR)</tspan><tspan x="550.0" dy="18.2">poll(POLLIN | POLLOUT) / epoll</tspan></text>
<line x1="50.0" y1="145.0" x2="1050.0" y2="145.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ядро Linux (Kernel Space) — struct v4l2_m2m_ctx</text>
<rect x="126.7" y="185.7" width="346.6" height="108.6" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Черга OUTPUT (vb2_queue)</tspan><tspan x="300.0" dy="16.9">V4L2_BUF_TYPE_VIDEO_OUTPUT</tspan><tspan x="300.0" dy="16.9">Вхідні кадри / стиснений потік від програми</tspan><tspan x="300.0" dy="16.9">Операції: VIDIOC_QBUF / VIDIOC_DQBUF</tspan><tspan x="300.0" dy="16.9">Стан буферів: QUEUED → ACTIVE → DONE</tspan></text>
<rect x="652.6" y="185.7" width="294.8" height="108.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Черга CAPTURE (vb2_queue)</tspan><tspan x="800.0" dy="16.9">V4L2_BUF_TYPE_VIDEO_CAPTURE</tspan><tspan x="800.0" dy="16.9">Порожні буфери під готовий результат</tspan><tspan x="800.0" dy="16.9">Операції: VIDIOC_QBUF / VIDIOC_DQBUF</tspan><tspan x="800.0" dy="16.9">Стан буферів: QUEUED → ACTIVE → DONE</tspan></text>
<line x1="430.0" y1="105.0" x2="300.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="165.0" x2="670.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="341.6" y="343.1" width="416.9" height="93.7" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Каркас v4l2-mem2mem (Планувальник завдань)</tspan><tspan x="550.0" dy="16.9">struct v4l2_m2m_dev &amp; черга робіт job_queue</tspan><tspan x="550.0" dy="16.9">Перевірка: є буфер в OUTPUT І є буфер в CAPTURE?</tspan><tspan x="550.0" dy="16.9">Виклик драйвера: ops-&gt;device_run(ctx)</tspan></text>
<line x1="300.0" y1="315.0" x2="450.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="315.0" x2="650.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="308.0" y="512.1" width="484.0" height="95.7" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="539.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Апаратний блок прискорювача (VPU / Кодек / Масштабувач / CSC)</tspan><tspan x="550.0" dy="16.9">1. DMA Read: зчитує вхідний кадр з пам'яті (OUTPUT buf)</tspan><tspan x="550.0" dy="16.9">2. Апаратне обчислення / декодування / масштабування матрицею</tspan><tspan x="550.0" dy="16.9">3. DMA Write: записує результат у пам'ять (CAPTURE buf)</tspan></text>
<line x1="550.0" y1="445.0" x2="550.0" y2="495.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="228.8" y="646.2" width="642.4" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="550.0" y="666.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Апаратне переривання (IRQ) → Обробник драйвера: v4l2_m2m_buf_done() + v4l2_m2m_job_finish()</tspan><tspan x="550.0" dy="15.6">Пробудження epoll/poll (POLLIN на CAPTURE, POLLOUT на OUTPUT)</tspan></text>
<line x1="550.0" y1="625.0" x2="550.0" y2="645.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>