<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність динамічної зміни формату (DRC) у Stateful декодері</text>
<rect x="100.0" y="52.5" width="900.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">1. Декодування потоку: OUTPUT черга приймає NAL-пакети, CAPTURE віддає YUV 1080p</tspan></text>
<rect x="100.0" y="137.5" width="900.0" height="35.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">2. Новий SPS у бітстрімі: зміна роздільності на 4K (3840×2160) або оновлення буферів DPB</tspan></text>
<line x1="550.0" y1="93.0" x2="550.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="222.5" width="900.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="550.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">3. Драйвер зупиняє CAPTURE чергу та надсилає V4L2_EVENT_SOURCE_CHANGE (POLLPRI)</tspan></text>
<line x1="550.0" y1="178.0" x2="550.0" y2="217.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="307.5" width="900.0" height="35.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">4. Userspace спустошує старі кадри (VIDIOC_DQBUF) і викликає VIDIOC_STREAMOFF(CAPTURE)</tspan></text>
<line x1="550.0" y1="263.0" x2="550.0" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="392.5" width="900.0" height="35.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">5. Зчитування нових параметрів: VIDIOC_G_FMT(CAPTURE) повертає новий розмір та вирівнювання</tspan></text>
<line x1="550.0" y1="348.0" x2="550.0" y2="387.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="477.5" width="900.0" height="35.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="499.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">6. Перевиділення пулу: VIDIOC_REQBUFS(count=0) звільняє 1080p, REQBUFS(N) виділяє 4K буфери</tspan></text>
<line x1="550.0" y1="433.0" x2="550.0" y2="472.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="557.5" width="900.0" height="35.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="579.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">7. Перезапуск CAPTURE: VIDIOC_QBUF + VIDIOC_STREAMON(CAPTURE). Потік OUTPUT не переривався!</tspan></text>
<line x1="550.0" y1="518.0" x2="550.0" y2="552.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>