<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">rmmod: хто дочекався черги зворотних викликів, а хто ні</text>
<rect x="40.0" y="96.0" width="216.0" height="116.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><text x="148.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">без</tspan><tspan x="148.0" dy="17.6">rcu_barrier()</tspan></text>
<rect x="292.0" y="96.0" width="236.0" height="116.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="410.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">call_rcu()</tspan><tspan x="410.0" dy="16.2">виклик стає в чергу</tspan><tspan x="410.0" dy="16.2">свого ядра процесора</tspan></text>
<rect x="564.0" y="96.0" width="236.0" height="116.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="682.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">module_exit()</tspan><tspan x="682.0" dy="16.2">повернувся,</tspan><tspan x="682.0" dy="16.2">черга не порожня</tspan></text>
<rect x="836.0" y="96.0" width="236.0" height="116.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="954.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="954.0" dy="0.0">код модуля</tspan><tspan x="954.0" dy="16.2">звільнено</tspan></text>
<rect x="1108.0" y="96.0" width="236.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1226.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1226.0" dy="0.0">період скінчився —</tspan><tspan x="1226.0" dy="16.2">ядро кличе адресу,</tspan><tspan x="1226.0" dy="16.2">де коду вже немає</tspan></text>
<line x1="528.0" y1="154.0" x2="556.0" y2="154.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="154.0" x2="828.0" y2="154.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1072.0" y1="154.0" x2="1100.0" y2="154.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="316.0" width="216.0" height="116.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/><text x="148.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">з</tspan><tspan x="148.0" dy="17.6">rcu_barrier()</tspan></text>
<rect x="292.0" y="316.0" width="236.0" height="116.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="410.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">call_rcu()</tspan><tspan x="410.0" dy="16.2">виклик стає в чергу</tspan><tspan x="410.0" dy="16.2">свого ядра процесора</tspan></text>
<rect x="564.0" y="316.0" width="236.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="682.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">rcu_barrier()</tspan><tspan x="682.0" dy="16.2">ставить свій виклик</tspan><tspan x="682.0" dy="16.2">у чергу кожного ядра</tspan></text>
<rect x="836.0" y="316.0" width="236.0" height="116.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="954.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="954.0" dy="0.0">черга йде по порядку —</tspan><tspan x="954.0" dy="16.2">все попереду</tspan><tspan x="954.0" dy="16.2">вже відпрацювало</tspan></text>
<rect x="1108.0" y="316.0" width="236.0" height="116.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1226.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1226.0" dy="0.0">module_exit()</tspan><tspan x="1226.0" dy="16.2">повернувся, кликати</tspan><tspan x="1226.0" dy="16.2">вже нема кому</tspan></text>
<line x1="528.0" y1="374.0" x2="556.0" y2="374.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="374.0" x2="828.0" y2="374.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1072.0" y1="374.0" x2="1100.0" y2="374.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">synchronize_rcu() тут не рятує: він чекає періоду відстрочки,</text>
<text x="700.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">а не виконання того, що вже стоїть у черзі</text>
</svg>