<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна зона пам'яті на всі три частини AEAD</text>
<text x="700.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">один шматок із kmalloc: 16 + 64 + 16 = 96 байтів</text>
<text x="700.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">sg_init_one описує його цілком — де закінчується зона, кажуть числа в запиті, а не список сегментів</text>
<text x="210.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">на вхід шифрування</text>
<rect x="210.0" y="151.0" width="250.0" height="78.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="335.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">заголовок (AAD)</tspan><tspan x="335.0" dy="16.9">16 байтів</tspan></text>
<rect x="460.0" y="151.0" width="470.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="695.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">відкритий текст</tspan><tspan x="695.0" dy="16.9">64 байти</tspan></text>
<rect x="930.0" y="151.0" width="250.0" height="78.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1055.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">порожньо</tspan><tspan x="1055.0" dy="16.9">місце під тег</tspan></text>
<text x="210.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">на вихід шифрування</text>
<rect x="210.0" y="331.0" width="250.0" height="78.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="335.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">заголовок</tspan><tspan x="335.0" dy="16.9">не змінився</tspan></text>
<rect x="460.0" y="331.0" width="470.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="695.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">шифротекст</tspan><tspan x="695.0" dy="16.9">64 байти</tspan></text>
<rect x="930.0" y="331.0" width="250.0" height="78.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1055.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">тег</tspan><tspan x="1055.0" dy="16.9">16 байтів</tspan></text>
<line x1="695.0" y1="233.0" x2="695.0" y2="327.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">crypto_aead_encrypt()</text>
<text x="700.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">aead_request_set_ad(req, 16) — скільки з початку лише автентифікуємо</text>
<text x="700.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">aead_request_set_crypt(req, sg, sg, 64, iv) — шифруємо лише текст, тег ляже одразу за ним</text>
<text x="700.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">на розшифрування те саме місце, але довжина вже 64 + 16 = 80: тег входить у неї</text>
</svg>