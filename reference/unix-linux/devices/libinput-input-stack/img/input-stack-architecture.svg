<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 534" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="534" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Архітектура сучасного стека вводу Linux</text>
<text x="40.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Єдиний шар libinput обслуговує і нативні композитори Wayland, і Xorg через уніфікований драйвер</text>
<text x="40.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">АПАРАТНІ ПРИСТРОЇ ТА ДРАЙВЕРИ ЯДРА</text>
<rect x="40.0" y="100.0" width="200.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">USB / Bluetooth миша</tspan><tspan x="140.0" dy="15.6">hid-generic</tspan></text>
<rect x="260.0" y="100.0" width="260.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Тачпад ноутбука (I2C / RMI4)</tspan><tspan x="390.0" dy="15.6">i2c-hid / rmi4_core</tspan></text>
<rect x="540.0" y="100.0" width="260.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Графічний планшет / стилус</tspan><tspan x="670.0" dy="15.6">wacom / hid-uclogic</tspan></text>
<rect x="820.0" y="100.0" width="280.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Вбудований тачскрин</tspan><tspan x="960.0" dy="15.6">hid-multitouch / goodix</tspan></text>
<rect x="40.0" y="175.0" width="1060.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ядро Linux: підсистема введення evdev (/dev/input/event0 … eventN)</tspan><tspan x="570.0" dy="16.9">Уніфікований двійковий потік структур struct input_event (EV_REL, EV_ABS, EV_KEY, EV_SYN)</tspan></text>
<line x1="140.0" y1="153.0" x2="140.0" y2="173.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="153.0" x2="390.0" y2="173.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="670.0" y1="153.0" x2="670.0" y2="173.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="153.0" x2="960.0" y2="173.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="245.0" width="1060.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">libevdev (кешування бітових масок, розбір ioctl, захист від SYN_DROPPED) + udev hwdb (коригування осей)</tspan></text>
<line x1="570.0" y1="224.0" x2="570.0" y2="243.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="310.0" width="1060.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">libinput (бібліотека простору користувача)</tspan><tspan x="570.0" dy="16.9">Балістичне прискорення курсора · Жести (Pinch, Swipe) · Tap-to-click · Клікпади (Clickfinger / Softbuttons)</tspan><tspan x="570.0" dy="16.9">Фільтрація долоні (Palm Detection) · Блокування при наборі (DWT) · Калібрування планшетів і матриць</tspan></text>
<line x1="570.0" y1="290.0" x2="570.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">СПОЖИВАЧІ В ПРОСТОРІ КОРИСТУВАЧА</text>
<rect x="40.0" y="415.0" width="620.0" height="50.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="350.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Композитор Wayland (Mutter / KWin / wlroots / Sway / Weston)</tspan><tspan x="350.0" dy="15.6">Пряма інтеграція через libinput API, власна обробка фокусу й розсилка клієнтам</tspan></text>
<line x1="350.0" y1="379.0" x2="350.0" y2="413.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="415.0" width="400.0" height="50.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="900.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Xorg Server + xf86-input-libinput</tspan><tspan x="900.0" dy="15.6">Уніфікований драйвер трансляції подій libinput у X11</tspan></text>
<line x1="900.0" y1="379.0" x2="900.0" y2="413.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="480.0" width="400.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Клієнти Wayland (GTK4, Qt6, Wayland-програми)</tspan></text>
<rect x="470.0" y="480.0" width="190.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Xwayland (міст X11)</tspan></text>
<rect x="700.0" y="480.0" width="400.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Традиційні клієнти X11 (програми під Xlib / XCB)</tspan></text>
<line x1="240.0" y1="466.0" x2="240.0" y2="478.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="565.0" y1="466.0" x2="565.0" y2="478.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="466.0" x2="900.0" y2="478.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>