<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Внутрішній конвеєр фільтрації та обробки подій у libinput</text>
<text x="40.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Від сирих імпульсів ядра до високорівневих семантичних жестів і нормалізованих координат</text>
<rect x="40.0" y="90.0" width="220.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Зчитування та база вад</tspan><tspan x="150.0" dy="15.6">(Ingestion &amp; Quirks)</tspan></text>
<rect x="40.0" y="142.0" width="220.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Зчитування з fd evdev</tspan><tspan x="150.0" dy="15.6">Виправлення залізяччя</tspan><tspan x="150.0" dy="15.6">через .quirks та hwdb</tspan><tspan x="150.0" dy="15.6">(роздільність, шуми, осі)</tspan></text>
<rect x="280.0" y="90.0" width="220.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">2. Нормалізація координат</tspan><tspan x="390.0" dy="15.6">(Normalization)</tspan></text>
<rect x="280.0" y="142.0" width="220.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Переведення відліків</tspan><tspan x="390.0" dy="15.6">у міліметри (DPI-scaling)</tspan><tspan x="390.0" dy="15.6">Відстеження слотів MT-B</tspan><tspan x="390.0" dy="15.6">Усунення тремтіння (jitter)</tspan></text>
<rect x="520.0" y="90.0" width="340.0" height="44.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="690.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">3. Спеціалізовані автомати станів</tspan><tspan x="690.0" dy="15.6">(State Engines)</tspan></text>
<rect x="520.0" y="142.0" width="340.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">• Тачпад: Tap, DWT, Clickpad, Palm, Скрол</tspan><tspan x="690.0" dy="15.6">• Жести: Pinch (zoom/rotate), 3-4F Swipe</tspan><tspan x="690.0" dy="15.6">• Вказівник: Адаптивне прискорення</tspan><tspan x="690.0" dy="15.6">• Планшет: Натиск, нахил, дистанція, пера</tspan><tspan x="690.0" dy="15.6">• Тачскрин: Афінна матриця калібрування</tspan></text>
<rect x="880.0" y="90.0" width="220.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">4. Диспетчеризація подій</tspan><tspan x="990.0" dy="15.6">(Public API Event Queue)</tspan></text>
<rect x="880.0" y="142.0" width="220.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">LIBINPUT_EVENT_POINTER_*</tspan><tspan x="990.0" dy="15.6">LIBINPUT_EVENT_GESTURE_*</tspan><tspan x="990.0" dy="15.6">LIBINPUT_EVENT_TOUCH_*</tspan><tspan x="990.0" dy="15.6">LIBINPUT_EVENT_TABLET_*</tspan></text>
<line x1="262.0" y1="230.0" x2="278.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="502.0" y1="230.0" x2="518.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="862.0" y1="230.0" x2="878.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="385.0" width="1060.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="408.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Динамічна конфігурація та блокування (DWT interlock):</tspan><tspan x="570.0" dy="15.6">Події клавіатури переводять тачпад у стан очікування; налаштування tap/scroll змінюють логіку автоматів без перезапуску</tspan></text>
</svg>