<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="257.5" y="17.5" width="485.0" height="35.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ескалація відновлення після збоїв та таймаутів USB</tspan></text>
<rect x="257.4" y="78.4" width="485.1" height="63.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Рівень 1: Стан зупинки кінцевої точки (Endpoint STALL)</tspan><tspan x="500.0" dy="15.6">Апаратний прапорець Halt на кінцевій точці передачі даних</tspan><tspan x="500.0" dy="15.6">usb_clear_halt(udev, pipe) -&gt; відправка CLEAR_FEATURE(ENDPOINT_HALT)</tspan></text>
<rect x="271.1" y="208.4" width="457.8" height="63.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Рівень 2: Таймаут URB або відсутність відповіді контролера</tspan><tspan x="500.0" dy="15.6">Скасування незавершених запитів (usb_unlink_urb)</tspan><tspan x="500.0" dy="15.6">Драйвер ініціює скидання пристрою через usb_queue_reset_device()</tspan></text>
<rect x="284.8" y="340.6" width="430.4" height="78.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Рівень 3: Скидання порту концентратора (usb_reset_device)</tspan><tspan x="500.0" dy="15.6">hub_port_reset(): фізичний імпульс SE0 тривалістю &gt;= 50 мс</tspan><tspan x="500.0" dy="15.6">Повторне зчитування дескрипторів та верифікація конфігурації</tspan><tspan x="500.0" dy="15.6">Відновлення альтернативних налаштувань інтерфейсів</tspan></text>
<rect x="240.3" y="490.6" width="519.3" height="78.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="510.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Рівень 4: Морфінг або критичний збій дескрипторів</tspan><tspan x="500.0" dy="15.6">Дескриптори змінилися (USB_QUIRK_RESET_MORPHS) або пристрій не відповідає</tspan><tspan x="500.0" dy="15.6">Ядро фіксує логічне від'єднання (disconnect) та видаляє старий вузол</tspan><tspan x="500.0" dy="15.6">Повна повторна нумерація як нового фізичного пристрою</tspan></text>
<rect x="173.8" y="629.0" width="652.4" height="32.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="649.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Шина відновлена: стек продовжує передачу пакетів або створює новий екземпляр пристрою</tspan></text>
<line x1="500.0" y1="145.0" x2="500.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="275.0" x2="500.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="425.0" x2="500.0" y2="490.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="570.0" x2="500.0" y2="620.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>