<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово з шини, два типи змінної — і два різні світи</text>
<rect x="330.0" y="78.0" width="680.0" height="76.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="670.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">з шини прийшло слово 0xE480</tspan><tspan x="670.0" dy="19.5">1110 0100 1000 0000₂</tspan></text>
<rect x="60.0" y="200.0" width="580.0" height="200.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="350.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ПОМИЛКОВО — беззнаковий тип</tspan><tspan x="350.0" dy="18.2">u16 reg = 0xE480;          →   58496</tspan><tspan x="350.0" dy="18.2">reg &gt;&gt; 7   (зсув затягує нулі)  →   457</tspan><tspan x="350.0" dy="18.2">457 × 500                       →   228500</tspan><tspan x="350.0" dy="18.2">temp1_input = 228500   =   +228.5 °C</tspan></text>
<rect x="700.0" y="200.0" width="580.0" height="200.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="990.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">ПРАВИЛЬНО — знаковий тип</tspan><tspan x="990.0" dy="18.2">s16 reg = 0xE480;          →   −7040</tspan><tspan x="990.0" dy="18.2">reg &gt;&gt; 7   (зсув тягне знак)    →   −55</tspan><tspan x="990.0" dy="18.2">−55 × 500                       →   −27500</tspan><tspan x="990.0" dy="18.2">temp1_input = −27500   =   −27.5 °C</tspan></text>
<rect x="60.0" y="434.0" width="1220.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="670.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Різниця вся в типі: над беззнаковим зсув вправо затягує згори нулі, над знаковим — копії старшого біта.</tspan><tspan x="670.0" dy="17.6">Мороз перетворюється на пожежу, і жоден компілятор про це не попередить.</tspan></text>
</svg>