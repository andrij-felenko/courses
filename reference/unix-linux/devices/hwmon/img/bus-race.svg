<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 674" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="674" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Без замка два читачі забирають відповіді один в одного</text>
<text x="96.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Читач A</text>
<text x="96.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Читач B</text>
<rect x="220.0" y="84.0" width="300.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="370.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">пише 0x00</tspan><tspan x="370.0" dy="16.9">«далі — температура»</tspan></text>
<rect x="560.0" y="198.0" width="300.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="710.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">пише 0x03</tspan><tspan x="710.0" dy="16.9">«далі — межа»</tspan></text>
<rect x="900.0" y="84.0" width="320.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#c0392b" stroke-width="2.0"/><text x="1060.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">читає слово →</tspan><tspan x="1060.0" dy="16.9">дістає МЕЖУ</tspan></text>
<rect x="1240.0" y="198.0" width="150.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1315.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1315.0" dy="0.0">читає</tspan><tspan x="1315.0" dy="16.9">межу</tspan></text>
<line x1="200.0" y1="316.0" x2="1390.0" y2="316.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">час на шині</text>
<rect x="220.0" y="356.0" width="1170.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="805.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">покажчик регістра в мікросхемі один на всіх — його перезаписав той, хто прийшов другим</tspan></text>
<line x1="60.0" y1="448.0" x2="1380.0" y2="448.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="710.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">З м'ютексом пара «вибір регістра + читання» неподільна</text>
<rect x="220.0" y="520.0" width="470.0" height="76.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="455.0" y="554.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">A тримає замок:</tspan><tspan x="455.0" dy="16.9">0x00 → читання → температура</tspan></text>
<rect x="830.0" y="520.0" width="470.0" height="76.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1065.0" y="554.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">потім замок у B:</tspan><tspan x="1065.0" dy="16.9">0x03 → читання → межа</tspan></text>
<line x1="700.0" y1="558.0" x2="820.0" y2="558.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="614.0" width="1080.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="760.0" y="638.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">той самий замок закриває і кеш — тож ніхто не побачить напівоновленого запису</tspan></text>
</svg>