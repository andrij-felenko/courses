<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер оголошує канали — файли створює ядро</text>
<rect x="50.0" y="90.0" width="430.0" height="230.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="265.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">ДРАЙВЕР ОГОЛОШУЄ</tspan><tspan x="265.0" dy="18.2"></tspan><tspan x="265.0" dy="18.2">temp: INPUT | MAX | CRIT</tspan><tspan x="265.0" dy="18.2">temp: INPUT | LABEL</tspan><tspan x="265.0" dy="18.2">fan:  INPUT | FAULT</tspan><tspan x="265.0" dy="18.2"></tspan><tspan x="265.0" dy="18.2">жодного імені файла тут нема</tspan></text>
<rect x="560.0" y="90.0" width="280.0" height="230.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="700.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ЯДРО, клас hwmon</tspan><tspan x="700.0" dy="18.2"></tspan><tspan x="700.0" dy="18.2">розгортає маски</tspan><tspan x="700.0" dy="18.2">в атрибути</tspan><tspan x="700.0" dy="18.2"></tspan><tspan x="700.0" dy="18.2">перевіряє ім'я</tspan><tspan x="700.0" dy="18.2">пристрою</tspan></text>
<rect x="920.0" y="90.0" width="430.0" height="230.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1135.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1135.0" dy="0.0">ЯДРО СТВОРЮЄ ФАЙЛИ</tspan><tspan x="1135.0" dy="18.2"></tspan><tspan x="1135.0" dy="18.2">temp1_input  temp1_max</tspan><tspan x="1135.0" dy="18.2">temp1_crit</tspan><tspan x="1135.0" dy="18.2">temp2_input  temp2_label</tspan><tspan x="1135.0" dy="18.2">fan1_input   fan1_fault</tspan></text>
<line x1="484.0" y1="170.0" x2="556.0" y2="170.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="844.0" y1="170.0" x2="916.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">звертання йде у зворотний бік</text>
<rect x="920.0" y="400.0" width="430.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1135.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1135.0" dy="0.0">читання файла temp2_input</tspan><tspan x="1135.0" dy="17.6">з простору користувача</tspan></text>
<rect x="50.0" y="400.0" width="430.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="265.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">read(dev, hwmon_temp,</tspan><tspan x="265.0" dy="17.6">     hwmon_temp_input, channel = 1, &amp;val)</tspan></text>
<line x1="916.0" y1="446.0" x2="486.0" y2="446.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ядро перекладає ім'я на трійку</text>
<rect x="50.0" y="530.0" width="1300.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="700.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">драйвер повертає число в одиниці свого типу — і не має можливості ані назвати файл по-своєму,</tspan><tspan x="700.0" dy="17.6">ані підсунути градуси туди, де ядро вже пообіцяло мілі°C</tspan></text>
</svg>