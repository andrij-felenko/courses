<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що процесор вважає правдою про пам'ять — і чого з цього не можна робити з регістром</text>
<rect x="50.0" y="70.0" width="440.0" height="50.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="2.0"/><text x="270.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ПРИПУЩЕННЯ ПРО ПАМ'ЯТЬ</tspan></text>
<rect x="520.0" y="70.0" width="440.0" height="50.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="740.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">ЩО НАСПРАВДІ З РЕГІСТРОМ</tspan></text>
<rect x="990.0" y="70.0" width="380.0" height="50.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1180.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">ЩО МАЄ ЗАБОРОНИТИ КАРТА</tspan></text>
<rect x="50.0" y="140.0" width="440.0" height="86.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">читання повертає те,</tspan><tspan x="270.0" dy="18.2">що було записано останнім</tspan></text>
<rect x="520.0" y="140.0" width="440.0" height="86.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">біт стану міняє саме залізо,</tspan><tspan x="740.0" dy="18.2">а кеш віддає стару копію</tspan></text>
<rect x="990.0" y="140.0" width="380.0" height="86.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1180.0" y="187.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">кешування</tspan></text>
<rect x="50.0" y="250.0" width="440.0" height="86.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">зайве читання нікому</tspan><tspan x="270.0" dy="18.2">не шкодить</tspan></text>
<rect x="520.0" y="250.0" width="440.0" height="86.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">читання регістра черги</tspan><tspan x="740.0" dy="18.2">виймає з неї слово</tspan></text>
<rect x="990.0" y="250.0" width="380.0" height="86.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1180.0" y="297.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">випереджальне читання</tspan></text>
<rect x="50.0" y="360.0" width="440.0" height="86.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="398.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">два записи поспіль можна</tspan><tspan x="270.0" dy="18.2">злити в один ширший</tspan></text>
<rect x="520.0" y="360.0" width="440.0" height="86.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="398.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">кожен запис — окрема команда;</tspan><tspan x="740.0" dy="18.2">злиті — це вже інша команда</tspan></text>
<rect x="990.0" y="360.0" width="380.0" height="86.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1180.0" y="407.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">об'єднання записів</tspan></text>
<rect x="50.0" y="470.0" width="440.0" height="86.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="508.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">порядок доступів видно</tspan><tspan x="270.0" dy="18.2">лише за залежностями даних</tspan></text>
<rect x="520.0" y="470.0" width="440.0" height="86.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="508.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">пристрій бачить порядок</tspan><tspan x="740.0" dy="18.2">і діє на кожному кроці</tspan></text>
<rect x="990.0" y="470.0" width="380.0" height="86.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1180.0" y="517.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">перестановку</tspan></text>
<rect x="320.0" y="580.0" width="800.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="720.0" y="610.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">усе це — не властивість адреси, а тип пам'яті в записі таблиці сторінок</tspan></text>
</svg>