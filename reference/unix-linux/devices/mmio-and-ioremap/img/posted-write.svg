<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис до пристрою відкладений: writel повертається раніше, ніж пристрій щось побачив</text>
<rect x="55.0" y="70.0" width="600.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="355.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">БЕЗ ЗУСТРІЧНОГО ЧИТАННЯ</tspan></text>
<rect x="720.0" y="70.0" width="600.0" height="50.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1020.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">ІЗ ЗУСТРІЧНИМ ЧИТАННЯМ</tspan></text>
<rect x="55.0" y="140.0" width="600.0" height="90.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">writel(cause, REG_IRQ_CAUSE)</tspan><tspan x="355.0" dy="18.2">міст прийняв запис і відпустив процесор</tspan></text>
<rect x="720.0" y="140.0" width="600.0" height="90.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">writel(cause, REG_IRQ_CAUSE)</tspan><tspan x="1020.0" dy="18.2">міст прийняв запис і відпустив процесор</tspan></text>
<line x1="355.0" y1="230.0" x2="355.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="230.0" x2="1020.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="252.0" width="600.0" height="90.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="292.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">обробник повернув IRQ_HANDLED</tspan><tspan x="355.0" dy="18.2">через вісімдесят наносекунд</tspan></text>
<rect x="720.0" y="252.0" width="600.0" height="90.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="292.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">readl(REG_IRQ_CAUSE)</tspan><tspan x="1020.0" dy="18.2">читання не можна відкласти: чекає відповіді</tspan></text>
<line x1="355.0" y1="342.0" x2="355.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="342.0" x2="1020.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="364.0" width="600.0" height="90.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">лінія переривання досі притиснута —</tspan><tspan x="355.0" dy="18.2">пристрій запису ще не бачив</tspan></text>
<rect x="720.0" y="364.0" width="600.0" height="90.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">відповідь повернулася —</tspan><tspan x="1020.0" dy="18.2">отже, запис уже позаду неї</tspan></text>
<line x1="355.0" y1="454.0" x2="355.0" y2="474.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="454.0" x2="1020.0" y2="474.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="476.0" width="600.0" height="90.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="516.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">контролер заводить обробник</tspan><tspan x="355.0" dy="18.2">удруге, втретє, вчетверте</tspan></text>
<rect x="720.0" y="476.0" width="600.0" height="90.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="516.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">обробник виходить, коли лінія</tspan><tspan x="1020.0" dy="18.2">вже відпущена</tspan></text>
<rect x="55.0" y="600.0" width="600.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="355.0" y="640.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">шторм холостих переривань</tspan></text>
<rect x="720.0" y="600.0" width="600.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.2"/><text x="1020.0" y="640.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">одна затримка на переривання</tspan></text>
<line x1="355.0" y1="566.0" x2="355.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="566.0" x2="1020.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>