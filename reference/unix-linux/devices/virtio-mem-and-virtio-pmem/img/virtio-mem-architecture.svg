<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1490 930" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1490" height="930" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="740.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура virtio-mem та механізм sub-block memory hotplug</text>
<text x="740.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">АРХІТЕКТУРА VIRTIO-MEM: SUB-BLOCK MEMORY HOTPLUG</text>
<text x="740.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Господар керує requested_size; гість динамічно онлайнить і офлайнить блоки по 2-4 МБ</text>
<rect x="290.0" y="115.0" width="900.0" height="59.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="740.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">ГОСПОДАР (QEMU / KVM)</tspan><tspan x="740.0" dy="16.9">Задає requested_size у регістрі конфігурації | Отримує сповіщення через virtqueue</tspan></text>
<line x1="740.0" y1="185.0" x2="740.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="250.1" width="900.0" height="59.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="740.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">ДРАЙВЕР ГОСТЯ (virtio_mem.ko)</tspan><tspan x="740.0" dy="16.9">Обробляє переривання конфігурації · Керує станом блоків · Взаємодіє з Buddy Allocator</tspan></text>
<line x1="740.0" y1="320.0" x2="740.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">НЕПЕРЕРВНЕ ВІКНО АДРЕС ГОСТЯ (GPA WINDOW — наприклад 128 ГБ)</text>
<rect x="100.0" y="451.4" width="280.0" height="67.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="240.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Блок #0 (4 МБ)</tspan><tspan x="240.0" dy="15.6">PLUGGED / ONLINE</tspan><tspan x="240.0" dy="15.6">(ZONE_NORMAL)</tspan></text>
<rect x="430.0" y="451.4" width="280.0" height="67.2" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="570.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Блок #1 (4 МБ)</tspan><tspan x="570.0" dy="15.6">PLUGGED / UNMOVABLE</tspan><tspan x="570.0" dy="15.6">(пропущено при unplug)</tspan></text>
<rect x="760.0" y="451.4" width="280.0" height="67.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="900.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Блок #2 (4 МБ)</tspan><tspan x="900.0" dy="15.6">PLUGGED / ONLINE</tspan><tspan x="900.0" dy="15.6">(ZONE_MOVABLE)</tspan></text>
<rect x="1090.0" y="451.4" width="280.0" height="67.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.4"/><text x="1230.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1230.0" dy="0.0">Блок #3 (4 МБ)</tspan><tspan x="1230.0" dy="15.6">UNPLUGGED / OFFLINE</tspan><tspan x="1230.0" dy="15.6">(повернуто господарю)</tspan></text>
<rect x="260.0" y="585.4" width="960.0" height="89.2" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="740.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Гнучкість sub-block unplug:</tspan><tspan x="740.0" dy="16.2">Якщо Блок #1 містить непереміщувані дані ядра (unmovable pages), virtio-mem пропускає його,</tspan><tspan x="740.0" dy="16.2">але успішно вивільняє й повертає господарю Блок #2 (Блок #3 віддано ще раніше).</tspan><tspan x="740.0" dy="16.2">На відміну від ACPI DIMM, вилучення не скасовується цілком.</tspan></text>
<rect x="260.0" y="751.6" width="960.0" height="56.8" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="776.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">ПІДСИСТЕМА ПАМ'ЯТІ LINUX (buddy allocator / zone_movable)</tspan><tspan x="740.0" dy="16.2">add_memory_driver_managed() · offline_pages() · alloc_contig_range()</tspan></text>
<line x1="740.0" y1="690.0" x2="740.0" y2="735.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>