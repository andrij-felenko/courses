<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1490 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1490" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="740.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канали даних DAX та механізм флаш-запитів у virtio-pmem</text>
<text x="740.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">КАНАЛИ ДАНИХ ТА ГАРАНТІЯ НАДІЙНОСТІ VIRTIO-PMEM</text>
<text x="740.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Прямий доступ (DAX) оминає кеш гостя, а флаш-запити через virtqueue гарантують скидання на диски хоста</text>
<text x="400.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. ШЛЯХ ЧИТАННЯ ТА ЗАПИСУ (DAX / mmap)</text>
<rect x="170.0" y="160.5" width="460.0" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="400.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Додаток у гості (mmap)</tspan></text>
<line x1="400.0" y1="215.0" x2="400.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="170.0" y="290.5" width="460.0" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="400.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Файлова система гостя (ext4 / XFS -o dax)</tspan></text>
<line x1="400.0" y1="345.0" x2="400.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="137.6" y="420.8" width="524.8" height="38.5" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="400.0" y="444.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Прямий доступ до BAR пам'яті хоста
(Без копіювання в page cache гостя)</tspan></text>
<text x="1080.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. ШЛЯХ ФЛАШУ ВІРТУАЛЬНОЇ ПЕРЗИСТЕНТНОСТІ</text>
<rect x="850.0" y="160.5" width="460.0" height="39.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="1080.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">Запит на надійний скид: fsync() / msync()</tspan></text>
<line x1="1080.0" y1="215.0" x2="1080.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850.0" y="290.5" width="460.0" height="39.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="1080.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">virtio_pmem.ko (виправка VIRTIO_PMEM_REQ_TYPE_FLUSH)</tspan></text>
<line x1="1080.0" y1="345.0" x2="1080.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="774.9" y="420.8" width="610.2" height="38.5" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="1080.0" y="444.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">Обробник QEMU у хості: виконання fsync() / msync()
на бекенд-файлі або NVDIMM host</tspan></text>
<line x1="740.0" y1="110.0" x2="740.0" y2="520.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="100.0" y="613.4" width="1280.0" height="93.2" rx="6" fill="#fff6e5" stroke="#27ae60" stroke-width="1.4"/><text x="740.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Чому звичайні CPU-інструкції (clwb/clflush) не гарантують збереження в VM:</tspan><tspan x="740.0" dy="16.2">Інструкція clwb гостя виштовхує дані з кешу CPU у кеш сторінок хоста або контролер RAID хоста.</tspan><tspan x="740.0" dy="16.2">При аварійному вимкненні хоста ці дані втрачаються. Лише virtio_pmem flush через virtqueue</tspan><tspan x="740.0" dy="16.2">примушує ядро хоста записати дані на фізичний енергонезалежний носій.</tspan></text>
</svg>