<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1160 722" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1160" height="722" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="300.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">пристрій засинає</text>
<text x="830.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">пристрій знову потрібен</text>
<rect x="80.0" y="76.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">runtime PM: лічильник користувачів</tspan><tspan x="295.0" dy="16.9">пристрою дійшов нуля</tspan></text>
<rect x="80.0" y="172.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">genpd підміняє собою зворотні виклики</tspan><tspan x="295.0" dy="16.9">пристрою й дістає керування першим</tspan></text>
<line x1="295.0" y1="148.0" x2="295.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="268.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">виклик драйвера: зберегти стан,</tspan><tspan x="295.0" dy="16.9">спинити залізо</tspan></text>
<line x1="295.0" y1="244.0" x2="295.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="364.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">-&gt;stop: зняти такти з пристрою</tspan></text>
<line x1="295.0" y1="340.0" x2="295.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="460.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">мінус один до лічильника</tspan><tspan x="295.0" dy="16.9">активних у домені</tspan></text>
<line x1="295.0" y1="436.0" x2="295.0" y2="458.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="556.0" width="430.0" height="72.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="588.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">нуль і губернатор дозволив →</tspan><tspan x="295.0" dy="16.9">-&gt;power_off: відкрити вимикач</tspan></text>
<line x1="295.0" y1="532.0" x2="295.0" y2="554.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="76.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">хтось заявив: пристрій потрібен</tspan></text>
<rect x="620.0" y="172.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">genpd дістає керування першим —</tspan><tspan x="835.0" dy="16.9">до драйвера</tspan></text>
<line x1="835.0" y1="148.0" x2="835.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="268.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">спершу ввімкнути батьківські домени,</tspan><tspan x="835.0" dy="16.9">згори вниз</tspan></text>
<line x1="835.0" y1="244.0" x2="835.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="364.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">-&gt;power_on: закрити вимикач</tspan><tspan x="835.0" dy="16.9">цього домену</tspan></text>
<line x1="835.0" y1="340.0" x2="835.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="460.0" width="430.0" height="72.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="500.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">-&gt;start: подати такти на пристрій</tspan></text>
<line x1="835.0" y1="436.0" x2="835.0" y2="458.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="556.0" width="430.0" height="72.0" rx="6" fill="#e6f5ec" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="588.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">виклик драйвера: відновити регістри,</tspan><tspan x="835.0" dy="16.9">бо їхній вміст утрачено</tspan></text>
<line x1="835.0" y1="532.0" x2="835.0" y2="554.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="642.0" width="970.0" height="56.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="565.0" y="674.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">порядок незворотний: звернення до блока, з якого знято живлення, — це не помилка на шині, а зависла транзакція</tspan></text>
</svg>