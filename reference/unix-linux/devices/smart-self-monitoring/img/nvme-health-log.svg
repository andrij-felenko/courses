<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта полів журналу здоров'я NVMe (Log Identifier 0x02, 512 байтів)</text>
<rect x="80.0" y="70.0" width="1100.0" height="150.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="107.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Байт 0: Маска критичних попереджень (Critical Warning Bitmask)</tspan><tspan x="630.0" dy="16.9">• Біт 0: Available Spare нижче критичного порогу (Available Spare Threshold)</tspan><tspan x="630.0" dy="16.9">• Біт 1: Температура перевищила поріг перегріву або переохолодження</tspan><tspan x="630.0" dy="16.9">• Біт 2: Надійність підсистеми NVM деградувала (множинні помилки носія/пам'яті)</tspan><tspan x="630.0" dy="16.9">• Біт 3: Носій переведено в режим «Тільки для читання» (Read Only Mode для захисту даних)</tspan><tspan x="630.0" dy="16.9">• Біт 4: Збій пристрою резервного живлення енергонезалежного кешу (Volatile Memory Backup Failed)</tspan></text>
<rect x="80.0" y="240.0" width="260.0" height="210.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Температурні поля</tspan><tspan x="210.0" dy="15.6">(Байти 1-2, 200-215)</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">Composite Temperature (у Кельвінах)</tspan><tspan x="210.0" dy="15.6">+ Давачі Sensor 1..8.</tspan><tspan x="210.0" dy="15.6">Фіксація часу роботи в зоні</tspan><tspan x="210.0" dy="15.6">попередження та критичного нагріву.</tspan></text>
<rect x="360.0" y="240.0" width="260.0" height="210.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Ресурс комірок</tspan><tspan x="490.0" dy="15.6">(Байти 3, 4, 5)</tspan><tspan x="490.0" dy="15.6"></tspan><tspan x="490.0" dy="15.6">Available Spare (залишок резерву %)</tspan><tspan x="490.0" dy="15.6">Available Spare Threshold (поріг %)</tspan><tspan x="490.0" dy="15.6">Percentage Used (витрата ресурсу %,</tspan><tspan x="490.0" dy="15.6">може перевищувати 100%).</tspan></text>
<rect x="640.0" y="240.0" width="260.0" height="210.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Обсяги вводу-виводу</tspan><tspan x="770.0" dy="16.9">(Байти 32-63)</tspan><tspan x="770.0" dy="16.9"></tspan><tspan x="770.0" dy="16.9">Data Units Read (128-біт)</tspan><tspan x="770.0" dy="16.9">Data Units Written (128-біт)</tspan><tspan x="770.0" dy="16.9">Одиниця = 1000 секторів по 512B</tspan><tspan x="770.0" dy="16.9">(~500 КБ даних).</tspan></text>
<rect x="920.0" y="240.0" width="260.0" height="210.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="309.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Помилки та надійність</tspan><tspan x="1050.0" dy="13.0">(Байти 112-175)</tspan><tspan x="1050.0" dy="13.0"></tspan><tspan x="1050.0" dy="13.0">Media &amp; Data Integrity Errors (128-біт)</tspan><tspan x="1050.0" dy="13.0">Unsafe Shutdowns (аварійні вимкнення)</tspan><tspan x="1050.0" dy="13.0">Power On Hours (години під живленням)</tspan><tspan x="1050.0" dy="13.0">Number of Error Log Entries.</tspan></text>
<rect x="80.0" y="470.0" width="1100.0" height="200.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="523.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Чому протокол NVMe SMART стандартизовано жорсткіше за ATA:</tspan><tspan x="630.0" dy="16.9"></tspan><tspan x="630.0" dy="16.9">1. Фіксовані зміщення: Усі байти телеметрії (температура, ресурс, лічильники запису) мають суворі позиції в специфікації NVM Express.</tspan><tspan x="630.0" dy="16.9">2. Відсутність «магічних чисел»: Значення передаються як прямі фізичні величини (Кельвіни, відсотки, 128-бітні числа байтів),</tspan><tspan x="630.0" dy="16.9">   а не пропрієтарні нормалізовані бали конкретного вендора.</tspan><tspan x="630.0" dy="16.9">3. Асинхронні сповіщення (AEN): Контролер сам надсилає переривання хосту в разі зміни бітів Critical Warning,</tspan><tspan x="630.0" dy="16.9">   усуваючи потребу в неперервному агресивному опитуванні пристрою.</tspan></text>
</svg>