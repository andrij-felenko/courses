<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="238.2" y="87.9" width="223.5" height="64.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">мінімум затримки читання</tspan><tspan x="350.0" dy="18.2">за вікном 100 мс</tspan></text>
<rect x="858.4" y="87.9" width="343.2" height="64.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">порівняння з цільовою затримкою</tspan><tspan x="1030.0" dy="18.2">2 мс без обертання · 75 мс з обертанням</tspan></text>
<rect x="870.4" y="288.8" width="319.3" height="82.4" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">щабель гальмування</tspan><tspan x="1030.0" dy="18.2">перевищено → +1, глибина ÷ 2</tspan><tspan x="1030.0" dy="18.2">вклалися → −1, глибина вгору на крок</tspan></text>
<rect x="254.2" y="297.9" width="191.6" height="64.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">дозволена глибина</tspan><tspan x="350.0" dy="18.2">незавершених записів</tspan></text>
<line x1="469.8" y1="120.0" x2="850.4" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1030.0" y1="160.1" x2="1030.0" y2="280.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="862.4" y1="330.0" x2="453.8" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="289.9" x2="350.0" y2="160.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">менше записів у носії — швидші читання</text>
<line x1="350.0" y1="370.1" x2="350.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна лічильниця незавершених записів, три пороги</text>
<rect x="152.3" y="517.0" width="235.5" height="57.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="542.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">фоновий запис</tspan><tspan x="270.0" dy="16.9">і сусіднє введення-виведення</tspan></text>
<text x="270.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">чверть глибини</text>
<rect x="578.6" y="525.5" width="242.9" height="41.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="550.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">звичайний буферизований запис</tspan></text>
<text x="700.0" y="600.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">половина глибини</text>
<rect x="990.0" y="517.0" width="279.9" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="542.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">високий пріоритет</tspan><tspan x="1130.0" dy="16.9">і гальмування на брудних сторінках</tspan></text>
<text x="1130.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">повна глибина</text>
<line x1="150.0" y1="500.0" x2="1250.0" y2="500.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="700.0" y="700.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Понад свій поріг запит не отримує тега — той, хто подає, засинає</text>
</svg>