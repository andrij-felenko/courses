<text x="590.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">i2c_transfer()  &lt;===&gt;  i2c_smbus_xfer()</text>
