<text x="410.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4338ca" text-anchor="middle">i2c-tools (i2cdetect, i2cget, i2cset, i2ctransfer)  |  демони сенсорів і прикладні сервіси</text>
