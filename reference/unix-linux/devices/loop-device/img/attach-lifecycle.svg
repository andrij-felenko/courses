<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя однієї прив'язки: від вільного номера до відчеплення</text>
<rect x="504.4" y="49.2" width="351.2" height="41.5" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="74.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">fd_ctl = open(&quot;/dev/loop-control&quot;, O_RDWR)</tspan></text>
<rect x="527.5" y="142.5" width="305.0" height="59.1" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">n = ioctl(fd_ctl, LOOP_CTL_GET_FREE)</tspan><tspan x="680.0" dy="17.6">ядро віддає номер вільного пристрою</tspan></text>
<rect x="531.3" y="264.2" width="297.3" height="41.5" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="289.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">fd_dev = open(&quot;/dev/loopN&quot;, O_RDWR)</tspan></text>
<rect x="539.0" y="359.2" width="281.9" height="41.5" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="384.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">fd_img = open(&quot;disk.img&quot;, O_RDWR)</tspan></text>
<rect x="427.5" y="468.5" width="505.1" height="59.1" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">ioctl(fd_dev, LOOP_CONFIGURE, &amp;cfg)</tspan><tspan x="680.0" dy="17.6">дескриптор образу · зсув · sizelimit · розмір блока · прапорці</tspan></text>
<rect x="519.8" y="597.2" width="320.4" height="41.5" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="622.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">pread(fd_dev, …) — пристрій уже працює</tspan></text>
<rect x="489.0" y="692.5" width="382.0" height="59.1" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="718.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">ioctl(fd_dev, LOOP_CLR_FD) повертає 0</tspan><tspan x="680.0" dy="17.6">ядро лише ставить прапорець LO_FLAGS_AUTOCLEAR</tspan></text>
<rect x="519.8" y="800.5" width="320.4" height="59.1" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="826.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">close(fd_dev)</tspan><tspan x="680.0" dy="17.6">ось тут прив'язка справді розпадається</tspan></text>
<line x1="680.0" y1="98.8" x2="680.0" y2="134.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="209.5" x2="680.0" y2="256.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="313.8" x2="680.0" y2="351.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="408.8" x2="680.0" y2="460.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="535.5" x2="680.0" y2="589.2" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="646.8" x2="680.0" y2="684.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="759.5" x2="680.0" y2="792.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1021.9" y="250.5" width="316.1" height="69.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="1180.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">ENOENT або EACCES: вузла ще немає</tspan><tspan x="1180.0" dy="16.2">або udev не встиг виставити права —</tspan><tspan x="1180.0" dy="16.2">пауза 25 мс і нова спроба, до шістнадцяти</tspan></text>
<line x1="840.7" y1="285.0" x2="1009.9" y2="285.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="1021.9" y="463.5" width="316.1" height="69.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="1180.0" y="486.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">один виклик замість LOOP_SET_FD</tspan><tspan x="1180.0" dy="16.2">плюс LOOP_SET_STATUS64: між ними пристрій</tspan><tspan x="1180.0" dy="16.2">жив би з неправильними параметрами</tspan></text>
<line x1="944.5" y1="498.0" x2="1009.9" y2="498.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="1046.9" y="687.5" width="266.2" height="69.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="1180.0" y="710.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">доки на пристрої стоїть монтування</tspan><tspan x="1180.0" dy="16.2">чи відкритий чужий дескриптор —</tspan><tspan x="1180.0" dy="16.2">відчеплення тільки відкладається</tspan></text>
<line x1="883.0" y1="722.0" x2="1034.9" y2="722.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="415.5" y1="521.5" x2="56.0" y2="521.5" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
<line x1="56.0" y1="521.5" x2="56.0" y2="172.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4"/>
<line x1="56.0" y1="172.0" x2="515.5" y2="172.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.4" y="315.5" width="259.1" height="69.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="250.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">EBUSY: той самий номер устиг</tspan><tspan x="250.0" dy="16.2">зайняти інший процес —</tspan><tspan x="250.0" dy="16.2">беремо наступний і пробуємо знову</tspan></text>
</svg>