<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від запиту в BAR до вікна у фізичній пам'яті</text>
<text x="620.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">BAR не зберігає адресу від виробника — він оголошує ЗАПИТ на розмір</text>
<rect x="50.0" y="80.0" width="620.0" height="34.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="2.0"/><text x="360.0" y="101.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Що робить ядро під час перелічення</tspan></text>
<rect x="50.0" y="130.0" width="620.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">1. Ядро записує в BAR0 усі одиниці</tspan><tspan x="360.0" dy="16.9">0xFFFFFFFF → BAR0</tspan></text>
<line x1="360.0" y1="222.0" x2="360.0" y2="256.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="258.0" width="620.0" height="92.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Читає назад — пристрій повернув маску</tspan><tspan x="360.0" dy="16.9">BAR0 → 0xFFFE0000    молодші 17 бітів нульові</tspan></text>
<line x1="360.0" y1="350.0" x2="360.0" y2="384.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="386.0" width="620.0" height="92.0" rx="6" fill="#e6f5ec" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="428.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">3. Обчислює розмір, шукає вільне місце й пише базу</tspan><tspan x="360.0" dy="16.9">2¹⁷ байтів = 131072 = 128 КБ    →    0xE1200000 → BAR0</tspan></text>
<rect x="760.0" y="80.0" width="430.0" height="34.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="2.0"/><text x="975.0" y="101.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">Фізичний адресний простір процесора</tspan></text>
<rect x="760.0" y="130.0" width="430.0" height="96.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">0x00000000 – …</tspan><tspan x="975.0" dy="16.9">оперативна пам'ять</tspan></text>
<rect x="760.0" y="238.0" width="430.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">дірка: не відповідає ніхто</tspan></text>
<rect x="760.0" y="310.0" width="430.0" height="96.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.4"/><text x="975.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">0xE1200000 – 0xE121FFFF</tspan><tspan x="975.0" dy="16.9">вікно BAR0 цього пристрою (128 КБ)</tspan></text>
<rect x="760.0" y="418.0" width="430.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">вікна інших пристроїв</tspan></text>
<line x1="670.0" y1="358.0" x2="760.0" y2="358.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="700.0" y="508.0" width="550.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="540.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">Відтепер звертання процесора за цією адресою</tspan><tspan x="975.0" dy="16.9">контролер пам'яті направляє на шину PCI саме цьому пристрою</tspan></text>
</svg>