<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1160 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1160" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="460.0" y="20.0" width="230.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2b579a" stroke-width="2.0"/><text x="575.0" y="39.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">/proc/[pid]/</tspan><tspan x="575.0" dy="18.2">Директорія процесу</tspan></text>
<line x1="575.0" y1="70.0" x2="140.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="70.0" x2="390.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="70.0" x2="640.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="70.0" x2="880.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="70.0" x2="1030.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="125.0" width="200.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#1e7e34" stroke-width="1.8"/><text x="140.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Метадані та стан</tspan><tspan x="140.0" dy="16.9">Текстові файли</tspan></text>
<line x1="140.0" y1="172.0" x2="140.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="210.0" width="220.0" height="140.0" rx="6" fill="#ffffff" stroke="#1e7e34" stroke-width="1.5"/><text x="140.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">status  (зведення для людини)</tspan><tspan x="140.0" dy="15.6">stat    (поля для парсингу)</tspan><tspan x="140.0" dy="15.6">cmdline (аргументи argv)</tspan><tspan x="140.0" dy="15.6">environ (змінні оточення)</tspan><tspan x="140.0" dy="15.6">wchan   (назва блокування)</tspan></text>
<rect x="290.0" y="125.0" width="200.0" height="45.0" rx="6" fill="#f3e8ff" stroke="#6f42c1" stroke-width="1.8"/><text x="390.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Віртуальна пам'ять</tspan><tspan x="390.0" dy="16.9">Адресний простір</tspan></text>
<line x1="390.0" y1="172.0" x2="390.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="210.0" width="220.0" height="140.0" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/><text x="390.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">maps     (регіони VMA)</tspan><tspan x="390.0" dy="15.6">smaps    (детальний PSS/RSS)</tspan><tspan x="390.0" dy="15.6">statm    (сторінки пам'яті)</tspan><tspan x="390.0" dy="15.6">pagemap  (мапінг у PFN)</tspan><tspan x="390.0" dy="15.6">mem      (прямий доступ RAM)</tspan></text>
<rect x="540.0" y="125.0" width="200.0" height="45.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="640.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Дескриптори та шляхи</tspan><tspan x="640.0" dy="16.9">Магічні посилання</tspan></text>
<line x1="640.0" y1="172.0" x2="640.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="210.0" width="220.0" height="140.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="640.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">fd/     (0, 1, 2... -&gt; inode)</tspan><tspan x="640.0" dy="15.6">fdinfo/ (позиція, прапорці)</tspan><tspan x="640.0" dy="15.6">cwd     (поточна директорія)</tspan><tspan x="640.0" dy="15.6">exe     (шлях до бінарника)</tspan><tspan x="640.0" dy="15.6">root    (корінь chroot)</tspan></text>
<rect x="780.0" y="125.0" width="200.0" height="45.0" rx="6" fill="#fdecea" stroke="#bd2130" stroke-width="1.8"/><text x="880.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Потоки (Threads)</tspan><tspan x="880.0" dy="16.9">Ієрархія task/</tspan></text>
<line x1="880.0" y1="172.0" x2="880.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="210.0" width="220.0" height="140.0" rx="6" fill="#ffffff" stroke="#bd2130" stroke-width="1.5"/><text x="880.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">task/[tid]/status</tspan><tspan x="880.0" dy="15.6">task/[tid]/stat</tspan><tspan x="880.0" dy="15.6">task/[tid]/comm</tspan><tspan x="880.0" dy="15.6">task/[tid]/children</tspan><tspan x="880.0" dy="15.6">(власні файли потоку)</tspan></text>
<rect x="980.0" y="125.0" width="140.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2b579a" stroke-width="1.8"/><text x="1050.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Ізоляція</tspan><tspan x="1050.0" dy="16.9">ns/ та cgroup</tspan></text>
<line x1="1050.0" y1="172.0" x2="1050.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="970.0" y="210.0" width="160.0" height="140.0" rx="6" fill="#ffffff" stroke="#2b579a" stroke-width="1.5"/><text x="1050.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">ns/net  (pid_ns)</tspan><tspan x="1050.0" dy="15.6">ns/mnt  (mount_ns)</tspan><tspan x="1050.0" dy="15.6">ns/pid  (pid_ns)</tspan><tspan x="1050.0" dy="15.6">cgroup  (групи)</tspan><tspan x="1050.0" dy="15.6">oom_score</tspan></text>
<rect x="30.0" y="380.0" width="1090.0" height="130.0" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/><text x="575.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Особливості доступу та генерації вмісту ядра:</tspan><tspan x="575.0" dy="15.6">• st_size = 0 для більшості файлів: вміст генерується 'on-the-fly' під час системного виклику read().</tspan><tspan x="575.0" dy="15.6">• fd/ та ns/ є 'магічними' посиланнями: вони посилаються безпосередньо на inode ядра, а не на шляхи у VFS.</tspan><tspan x="575.0" dy="15.6">• Налаштування hidepid регулює видимість чужих директорій /proc/[pid] для користувачів без привілеїв.</tspan></text>
</svg>