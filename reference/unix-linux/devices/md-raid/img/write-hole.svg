<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1380 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1380" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дірка запису: чому неповна смуга стає пасткою</text>
<text x="190.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. усе узгоджено</text>
<text x="530.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. запис смуги в польоті</text>
<text x="870.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. живлення зникло</text>
<text x="1210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. гине носій із D2</text>
<rect x="40.0" y="110.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">D0</tspan></text>
<rect x="40.0" y="174.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">D1</tspan></text>
<rect x="40.0" y="238.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">D2</tspan></text>
<rect x="40.0" y="302.0" width="300.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="190.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">P = D0 ⊕ D1 ⊕ D2</tspan></text>
<rect x="380.0" y="110.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">D0</tspan></text>
<rect x="380.0" y="174.0" width="300.0" height="52.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">D1′ уже записано</tspan></text>
<rect x="380.0" y="238.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">D2</tspan></text>
<rect x="380.0" y="302.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">P — ще стара</tspan></text>
<rect x="720.0" y="110.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="870.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">D0</tspan></text>
<rect x="720.0" y="174.0" width="300.0" height="52.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="870.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">D1′</tspan></text>
<rect x="720.0" y="238.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="870.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">D2</tspan></text>
<rect x="720.0" y="302.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="870.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">P — стара</tspan></text>
<rect x="1060.0" y="110.0" width="300.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="1210.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">D0</tspan></text>
<rect x="1060.0" y="174.0" width="300.0" height="52.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="1210.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">D1′</tspan></text>
<rect x="1060.0" y="238.0" width="300.0" height="52.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.4"/><text x="1210.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">носій зник</tspan></text>
<rect x="1060.0" y="302.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.4"/><text x="1210.0" y="332.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">P — стара</tspan></text>
<rect x="40.0" y="400.0" width="300.0" height="92.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">будь-який шматок смуги</tspan><tspan x="190.0" dy="18.2">відновлюється з решти</tspan></text>
<rect x="380.0" y="400.0" width="300.0" height="92.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">вікно неузгодженості:</tspan><tspan x="530.0" dy="18.2">дані нові, парність стара</tspan></text>
<rect x="720.0" y="400.0" width="300.0" height="92.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">суперечність лягла на носії,</tspan><tspan x="870.0" dy="18.2">і ніхто про неї не знає</tspan></text>
<rect x="1060.0" y="400.0" width="300.0" height="92.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1210.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">D0 ⊕ D1′ ⊕ P дає сміття</tspan><tspan x="1210.0" dy="18.2">замість утраченого D2</tspan></text>
<text x="670.0" y="565.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Карта намірів запису тут не рятує: вона підказує, ЯКУ смугу перевірити,</text>
<text x="670.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">але не зберігає того, чим була парність до початку запису.</text>
</svg>