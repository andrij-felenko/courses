<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="730.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від накладки до градусів: п'ять слідів і місця розриву</text>
<rect x="50.0" y="70.0" width="520.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="310.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">ЛАНКА — ДЕ МАЄ З'ЯВИТИСЯ СЛІД</tspan></text>
<rect x="700.0" y="70.0" width="700.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1050.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">ЯК РВЕТЬСЯ І ЧИМ ЦЕ ВИДНО</tspan></text>
<rect x="50.0" y="140.0" width="520.0" height="118.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">вузол у дереві ядра</tspan><tspan x="310.0" dy="18.9">/proc/device-tree/…/sensor@48</tspan></text>
<rect x="700.0" y="140.0" width="700.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1050.0" y="186.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">накладка не лягла: у базовому дереві нема __symbols__</tspan><tspan x="1050.0" dy="17.6">або мітку перейменували → fdt apply віддає помилку,</tspan><tspan x="1050.0" dy="17.6">запис у configfs — EINVAL</tspan></text>
<line x1="570.0" y1="199.0" x2="700.0" y2="199.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="258.0" x2="310.0" y2="288.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="288.0" width="520.0" height="118.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">клієнт на шині</tspan><tspan x="310.0" dy="18.9">/sys/bus/i2c/devices/1-0048</tspan></text>
<rect x="700.0" y="288.0" width="700.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1050.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">шина сама має status = &quot;disabled&quot;, або адресу вже</tspan><tspan x="1050.0" dy="17.6">тримає інший клієнт → у dmesg</tspan><tspan x="1050.0" dy="17.6">«Failed to register i2c client … at 0x48 (-16)»</tspan></text>
<line x1="570.0" y1="347.0" x2="700.0" y2="347.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="406.0" x2="310.0" y2="436.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="436.0" width="520.0" height="118.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="490.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">прив'язка драйвера</tspan><tspan x="310.0" dy="18.9">…/1-0048/driver → tmp102</tspan></text>
<rect x="700.0" y="436.0" width="700.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1050.0" y="482.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">під рядок compatible нема коду — і в журналі</tspan><tspan x="1050.0" dy="17.6">ЖОДНОГО слова; шукай of:N*T*Cti,tmp102</tspan><tspan x="1050.0" dy="17.6">у /lib/modules/$(uname -r)/modules.alias</tspan></text>
<line x1="570.0" y1="495.0" x2="700.0" y2="495.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="554.0" x2="310.0" y2="584.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="584.0" width="520.0" height="118.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="638.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">probe() дійшов до кінця</tspan><tspan x="310.0" dy="18.9">(мовчання = добре)</tspan></text>
<rect x="700.0" y="584.0" width="700.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1050.0" y="630.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">-EPROBE_DEFER без кінця: ресурс із посилання</tspan><tspan x="1050.0" dy="17.6">(vcc-supply, такт, GPIO) так і не зареєстровано →</tspan><tspan x="1050.0" dy="17.6">ім'я й причина в /sys/kernel/debug/devices_deferred</tspan></text>
<line x1="570.0" y1="643.0" x2="700.0" y2="643.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="702.0" x2="310.0" y2="732.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="732.0" width="520.0" height="118.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="310.0" y="786.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">значення</tspan><tspan x="310.0" dy="18.9">/sys/class/hwmon/hwmonN/temp1_input</tspan></text>
<rect x="700.0" y="732.0" width="700.0" height="118.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.6"/><text x="1050.0" y="778.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">число в тисячних градуса Цельсія:</tspan><tspan x="1050.0" dy="17.6">42125 → 42.125 °C</tspan><tspan x="1050.0" dy="17.6">дійшли сюди — договір «опис ↔ драйвер» зійшовся</tspan></text>
</svg>