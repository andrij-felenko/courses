<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях опису: від тексту на диску до probe() драйвера</text>
<rect x="40.0" y="100.0" width="285.0" height="110.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="182.5" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">.dts і .dtsi</tspan><tspan x="182.5" dy="18.2">текстовий опис</tspan><tspan x="182.5" dy="18.2">SoC та плати</tspan></text>
<line x1="325.0" y1="155.0" x2="385.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="385.0" y="100.0" width="285.0" height="110.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="527.5" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">dtc</tspan><tspan x="527.5" dy="18.2">компілятор</tspan><tspan x="527.5" dy="18.2">дерева</tspan></text>
<line x1="670.0" y1="155.0" x2="730.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="100.0" width="285.0" height="110.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="872.5" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="872.5" dy="0.0">.dtb — плаский блоб:</tspan><tspan x="872.5" dy="18.2">самі зміщення,</tspan><tspan x="872.5" dy="18.2">жодного вказівника</tspan></text>
<line x1="1015.0" y1="155.0" x2="1075.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1075.0" y="100.0" width="285.0" height="110.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="1217.5" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1217.5" dy="0.0">завантажувач кладе блоб</tspan><tspan x="1217.5" dy="18.2">у пам'ять і передає ядру</tspan><tspan x="1217.5" dy="18.2">його фізичну адресу</tspan></text>
<rect x="40.0" y="320.0" width="285.0" height="110.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="182.5" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">of_platform_populate():</tspan><tspan x="182.5" dy="18.2">кожен вузол верхнього рівня</tspan><tspan x="182.5" dy="18.2">стає platform_device</tspan></text>
<rect x="385.0" y="320.0" width="285.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="527.5" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">unflatten_device_tree():</tspan><tspan x="527.5" dy="18.2">блоб → дерево вузлів</tspan><tspan x="527.5" dy="18.2">struct device_node у пам'яті</tspan></text>
<line x1="385.0" y1="375.0" x2="325.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="320.0" width="285.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="872.5" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="872.5" dy="0.0">ранній скан плаского блоба:</tspan><tspan x="872.5" dy="18.2">/memory — де і скільки RAM</tspan><tspan x="872.5" dy="18.2">/chosen — bootargs, initrd</tspan></text>
<line x1="730.0" y1="375.0" x2="670.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1075.0" y="320.0" width="285.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1217.5" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1217.5" dy="0.0">ядро отримало адресу</tspan><tspan x="1217.5" dy="18.2">блоба ще до того, як має</tspan><tspan x="1217.5" dy="18.2">алокатор пам'яті</tspan></text>
<line x1="1075.0" y1="375.0" x2="1015.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1217.5" y1="210.0" x2="1217.5" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="182.5" y1="430.0" x2="182.5" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="472.0" width="640.0" height="78.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="360.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">рядок compatible вузла збігається з of_match_table</tspan><tspan x="360.0" dy="18.9">драйвера → ядро кличе його probe()</tspan></text>
<line x1="680.0" y1="511.0" x2="748.0" y2="511.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="750.0" y="472.0" width="610.0" height="78.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="1055.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">/sys/firmware/devicetree/base — саме дерево;</tspan><tspan x="1055.0" dy="18.9">/sys/devices/… — вузли, яким знайшовся драйвер</tspan></text>
</svg>