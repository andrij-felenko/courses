<text x="425.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Зупинка CPU</text>
<rect x="363.0" y="115.0" width="124.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">NMI-переривання зупиняють</tspan><tspan x="425.0" dy="11.7">інші CPU; збереження</tspan><tspan x="425.0" dy="11.7">регістрів у crash_notes</tspan></text>
<line x1="495.0" y1="180.0" x2="515.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.0" y="70.0" width="140.0" height="220.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="585.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Purgatory Stub</text>
<rect x="523.0" y="115.0" width="124.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Код релокації перевіряє</tspan><tspan x="585.0" dy="11.7">SHA256 хеші сегментів;</tspan><tspan x="585.0" dy="11.7">вимкнення VMX/IOMMU</tspan></text>
<line x1="655.0" y1="180.0" x2="675.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="675.0" y="70.0" width="140.0" height="220.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="745.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">5. Запуск Crash Kernel</text>
<rect x="683.0" y="115.0" width="124.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Стрибок на startup_64;</tspan><tspan x="745.0" dy="11.7">boot з elfcorehdr=;</tspan><tspan x="745.0" dy="11.7">монтування /proc/vmcore</tspan></text>
<rect x="35.0" y="305.0" width="750.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Загальний час переходу від фатального збою до збереження дампу в /proc/vmcore становить 1-3 секунди</tspan></text>
</svg>