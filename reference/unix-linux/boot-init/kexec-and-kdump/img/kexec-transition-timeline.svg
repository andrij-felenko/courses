<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 836.28 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="836.28" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи виконання kexec та фази аварійного переходу kdump</text>
<rect x="35.0" y="70.0" width="140.0" height="220.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="105.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Підготовка</text>
<rect x="43.0" y="115.0" width="124.0" height="160.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Утиліта kexec готує</tspan><tspan x="105.0" dy="11.7">сегменти ядра та initramfs;</tspan><tspan x="105.0" dy="11.7">виклики kexec_file_load()</tspan></text>
<line x1="175.0" y1="180.0" x2="195.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="195.0" y="70.0" width="140.0" height="220.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="265.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Сигнал паніки</text>
<rect x="203.0" y="115.0" width="124.0" height="160.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Kernel Panic / SysRq 'c';</tspan><tspan x="265.0" dy="11.7">викликається panic()</tspan><tspan x="265.0" dy="11.7">та crash_kexec()</tspan></text>
<line x1="335.0" y1="180.0" x2="355.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
