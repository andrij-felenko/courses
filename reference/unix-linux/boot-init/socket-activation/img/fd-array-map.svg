<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1550 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1550" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="60.0" width="520.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="300.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">web.socket — що написано в юніті</tspan></text>
<rect x="790.0" y="60.0" width="678.0" height="48.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1129.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1129.0" dy="0.0">що процес бачить одразу після exec</tspan></text>
<rect x="40.0" y="150.0" width="520.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ListenStream=80</tspan></text>
<line x1="576.0" y1="181.0" x2="774.0" y2="181.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="150.0" width="70.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="825.0" y="186.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">3</tspan></text>
<rect x="878.0" y="150.0" width="600.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1178.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1178.0" dy="0.0">TCP :80 — уже bind, уже listen</tspan></text>
<rect x="40.0" y="230.0" width="520.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ListenStream=443</tspan></text>
<line x1="576.0" y1="261.0" x2="774.0" y2="261.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="230.0" width="70.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="825.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">4</tspan></text>
<rect x="878.0" y="230.0" width="600.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1178.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1178.0" dy="0.0">TCP :443 — те саме</tspan></text>
<rect x="40.0" y="310.0" width="520.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ListenStream=/run/web.sock</tspan></text>
<line x1="576.0" y1="341.0" x2="774.0" y2="341.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="310.0" width="70.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="825.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">5</tspan></text>
<rect x="878.0" y="310.0" width="600.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1178.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1178.0" dy="0.0">AF_UNIX /run/web.sock</tspan></text>
<rect x="40.0" y="390.0" width="520.0" height="62.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="425.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">FileDescriptorName=web</tspan></text>
<line x1="576.0" y1="421.0" x2="774.0" y2="492.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="462.0" width="678.0" height="76.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.3"/><text x="1129.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1129.0" dy="0.0">Ім'я одне на весь юніт — усі три дескриптори звуться «web».</tspan><tspan x="1129.0" dy="16.9">За іменем окремий сокет не знайти: імена не унікальні.</tspan></text>
<rect x="40.0" y="540.0" width="1460.0" height="120.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/><text x="770.0" y="586.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">LISTEN_FDS=3        LISTEN_PID=&lt;номер процесу служби&gt;</tspan><tspan x="770.0" dy="18.2">LISTEN_FDNAMES=web:web:web</tspan><tspan x="770.0" dy="18.2">Порядок чисел — це порядок рядків у юніті; між різними юнітами сокетів порядок не визначено.</tspan></text>
</svg>