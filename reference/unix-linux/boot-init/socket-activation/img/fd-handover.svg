<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1530 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1530" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="60.0" width="430.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="255.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">менеджер, він же PID 1</tspan></text>
<rect x="545.0" y="60.0" width="430.0" height="46.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.4"/><text x="760.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">нащадок після fork, ще до exec</tspan></text>
<rect x="1050.0" y="60.0" width="430.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1265.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1265.0" dy="0.0">служба після exec</tspan></text>
<rect x="40.0" y="136.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="255.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">fd = socket(AF_INET, SOCK_STREAM)</tspan></text>
<rect x="545.0" y="136.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="169.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">dup2(fd, 3)</tspan><tspan x="760.0" dy="16.9">сокет переставлено на місце з номером 3</tspan></text>
<rect x="40.0" y="226.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="255.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">bind(fd, :80)</tspan><tspan x="255.0" dy="16.9">порт нижче 1024 — а менеджер працює від root</tspan></text>
<rect x="545.0" y="226.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">зняти FD_CLOEXEC</tspan><tspan x="760.0" dy="16.9">інакше exec його закриє</tspan></text>
<rect x="40.0" y="316.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="255.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">listen(fd, backlog)</tspan><tspan x="255.0" dy="16.9">з цієї миті ядро приймає з'єднання в чергу</tspan></text>
<rect x="545.0" y="316.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="340.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">LISTEN_FDS=1</tspan><tspan x="760.0" dy="16.9">LISTEN_PID=&lt;номер цього процесу&gt;</tspan><tspan x="760.0" dy="16.9">LISTEN_FDNAMES=http.socket</tspan></text>
<rect x="40.0" y="406.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="255.0" y="439.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">fork()</tspan><tspan x="255.0" dy="16.9">таблиця дескрипторів копіюється в нащадка</tspan></text>
<rect x="545.0" y="406.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="447.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">execve(&quot;/usr/sbin/web&quot;, …)</tspan></text>
<line x1="482.0" y1="443.0" x2="533.0" y2="173.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="987.0" y1="443.0" x2="1038.0" y2="300.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
