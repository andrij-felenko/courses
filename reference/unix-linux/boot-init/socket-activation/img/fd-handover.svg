<rect x="1120.0" y="136.0" width="360.0" height="58.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1300.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1300.0" dy="0.0">/dev/null або журнал</tspan></text>
<rect x="1050.0" y="206.0" width="60.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">1</tspan></text>
<rect x="1120.0" y="206.0" width="360.0" height="58.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1300.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1300.0" dy="0.0">журнал</tspan></text>
<rect x="1050.0" y="276.0" width="60.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">2</tspan></text>
<rect x="1120.0" y="276.0" width="360.0" height="58.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1300.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1300.0" dy="0.0">журнал</tspan></text>
<rect x="1050.0" y="346.0" width="60.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1080.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">3</tspan></text>
<rect x="1120.0" y="346.0" width="360.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="1300.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1300.0" dy="0.0">той самий сокет: прив'язаний, слухає</tspan></text>
<rect x="1050.0" y="436.0" width="430.0" height="92.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1265.0" y="478.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1265.0" dy="0.0">socket, bind і listen служба не викликає взагалі.</tspan><tspan x="1265.0" dy="16.9">Її перша дія з мережею — accept(3, …).</tspan></text>
</svg>