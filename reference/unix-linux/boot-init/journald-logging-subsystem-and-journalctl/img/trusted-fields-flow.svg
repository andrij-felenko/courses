<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування довірених полів через SO_PASSCRED</text>
<text x="600.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм формування довірених полів запису в journald</text>
<rect x="50.0" y="80.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="97.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Клієнтський процес (PID 2410)</tspan><tspan x="200.0" dy="16.9"></tspan><tspan x="200.0" dy="16.9">Надсилає датаграму:</tspan><tspan x="200.0" dy="16.9">MESSAGE=Database query failed</tspan><tspan x="200.0" dy="16.9">PRIORITY=3</tspan><tspan x="200.0" dy="16.9">ERRNO=111</tspan></text>
<rect x="430.0" y="80.0" width="340.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Ядро Linux (AF_UNIX socket)</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Додає SCM_CREDENTIALS:</tspan><tspan x="600.0" dy="15.6">struct ucred { pid=2410, uid=1000, gid=1000 }</tspan></text>
<rect x="850.0" y="80.0" width="300.0" height="110.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1000.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">systemd-journald</tspan><tspan x="1000.0" dy="16.9"></tspan><tspan x="1000.0" dy="16.9">Отримує датаграму та ucred,</tspan><tspan x="1000.0" dy="16.9">потім читає /proc/2410/</tspan></text>
<line x1="350.0" y1="135.0" x2="430.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="135.0" x2="850.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="240.0" width="340.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Віртуальна файлова система /proc/2410/</tspan><tspan x="600.0" dy="16.9"></tspan><tspan x="600.0" dy="16.9">/proc/2410/cgroup → system.slice/db.service</tspan><tspan x="600.0" dy="16.9">/proc/2410/exe    → /usr/bin/postgres</tspan><tspan x="600.0" dy="16.9">/proc/2410/cmdline → postgres: worker</tspan></text>
<line x1="850.0" y1="165.0" x2="770.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="360.0" width="1100.0" height="130.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збірне підсумкове повідомлення журналу</text>
<rect x="70.0" y="398.0" width="510.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="325.0" y="417.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Поля відправника (невірифіковані):</tspan><tspan x="325.0" dy="15.6">MESSAGE=Database query failed</tspan><tspan x="325.0" dy="15.6">PRIORITY=3</tspan><tspan x="325.0" dy="15.6">ERRNO=111</tspan></text>
<rect x="600.0" y="398.0" width="530.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Довірені метаполя ядра та /proc (захищені від підробки):</tspan><tspan x="865.0" dy="15.6">_PID=2410  _UID=1000  _GID=1000</tspan><tspan x="865.0" dy="15.6">_SYSTEMD_UNIT=db.service  _EXE=/usr/bin/postgres  _TRANSPORT=journal</tspan></text>
<line x1="1000.0" y1="190.0" x2="1000.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>