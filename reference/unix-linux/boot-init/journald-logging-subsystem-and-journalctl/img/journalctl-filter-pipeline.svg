<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пайплайн вибірки та фільтрації journalctl</text>
<text x="600.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пайплайн вибірки, фільтрації та форматування утилітою journalctl</text>
<rect x="50.0" y="90.0" width="220.0" height="160.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Файли сховища</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">/var/log/journal/*</tspan><tspan x="160.0" dy="16.9">/run/log/journal/*</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">системний + юзерські</tspan><tspan x="160.0" dy="16.9">бінарні журналі</tspan></text>
<rect x="320.0" y="80.0" width="520.0" height="360.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="580.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм фільтрації (Journal Match Engine)</text>
<rect x="340.0" y="125.0" width="480.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Фільтр за джерелом / юнітом: -u nginx.service</tspan></text>
<rect x="340.0" y="180.0" width="480.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Фільтр за часом: --since '1 hour ago' --until 'now'</tspan></text>
<rect x="340.0" y="235.0" width="480.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Фільтр за пріоритетом: -p err..emerg (PRIORITY &lt;= 3)</tspan></text>
<rect x="340.0" y="290.0" width="480.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Сесія / завантаження: -b -1 (попередній boot)</tspan></text>
<rect x="340.0" y="345.0" width="480.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Довільні точні співпадіння по полях:</tspan><tspan x="580.0" dy="15.6">_PID=1234  _TRANSPORT=kernel  _COMM=sshd</tspan></text>
<line x1="270.0" y1="170.0" x2="320.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="890.0" y="80.0" width="260.0" height="360.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="1020.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рендерер виводу (-o)</text>
<rect x="910.0" y="130.0" width="220.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-o short-precise</tspan><tspan x="1020.0" dy="15.6">(стандартний людський)</tspan></text>
<rect x="910.0" y="190.0" width="220.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-o json-pretty</tspan><tspan x="1020.0" dy="15.6">(для аналізу та парсингу)</tspan></text>
<rect x="910.0" y="250.0" width="220.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-o verbose</tspan><tspan x="1020.0" dy="15.6">(усі поля запису)</tspan></text>
<rect x="910.0" y="310.0" width="220.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-o cat</tspan><tspan x="1020.0" dy="15.6">(чистий текст MESSAGE)</tspan></text>
<rect x="910.0" y="370.0" width="220.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-o export</tspan><tspan x="1020.0" dy="15.6">(бінарний потік)</tspan></text>
<line x1="840.0" y1="260.0" x2="890.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>