<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема запечатування журналів FSS</text>
<text x="600.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математична схема запечатування журналів FSS (Forward Secure Sealing)</text>
<rect x="50.0" y="90.0" width="260.0" height="90.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Майстер-ключ K_master</tspan><tspan x="180.0" dy="16.9">(Offline / Безпечне сховище)</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">Сгенеровано при setup-keys</tspan></text>
<rect x="370.0" y="90.0" width="240.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Епоха t = 0 (0-15 хв)</tspan><tspan x="490.0" dy="16.9"></tspan><tspan x="490.0" dy="16.9">Ключ підпису K_0</tspan><tspan x="490.0" dy="16.9">Підпис подій епохи t0</tspan><tspan x="490.0" dy="16.9">HASH(K_0) записано</tspan></text>
<rect x="660.0" y="90.0" width="240.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Епоха t = 1 (15-30 хв)</tspan><tspan x="780.0" dy="16.9"></tspan><tspan x="780.0" dy="16.9">K_1 = HMAC(K_0, 'SEAL')</tspan><tspan x="780.0" dy="16.9">K_0 знищено з пам'яті!</tspan><tspan x="780.0" dy="16.9">Підпис подій епохи t1</tspan></text>
<rect x="950.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1050.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Епоха t = 2 (30-45 хв)</tspan><tspan x="1050.0" dy="16.9"></tspan><tspan x="1050.0" dy="16.9">K_2 = HMAC(K_1, 'SEAL')</tspan><tspan x="1050.0" dy="16.9">K_1 знищено!</tspan><tspan x="1050.0" dy="16.9">Підпис подій t2</tspan></text>
<line x1="310.0" y1="135.0" x2="370.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="145.0" x2="660.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="145.0" x2="950.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="250.0" width="1100.0" height="210.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій зламу системи в епоху t = 2</text>
<rect x="80.0" y="305.0" width="480.0" height="130.0" rx="6" fill="#fdeae8" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Зловмисник отримує root у t = 2:</tspan><tspan x="320.0" dy="16.9"></tspan><tspan x="320.0" dy="16.9">- Бачить поточний ключ K_2 в ОЗП</tspan><tspan x="320.0" dy="16.9">- МАТЕМАТИЧНО НЕ МОЖЕ обчислити K_1 або K_0,</tspan><tspan x="320.0" dy="16.9">  бо HMAC-SHA256 є однонаправленою функцією!</tspan></text>
<rect x="610.0" y="305.0" width="510.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="865.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Результат верифікації journalctl --verify:</tspan><tspan x="865.0" dy="16.9"></tspan><tspan x="865.0" dy="16.9">- Спроба підробити записи епох t0 або t1 буде викрита!</tspan><tspan x="865.0" dy="16.9">- Офлайн K_master дозволяє перевірити цілісність</tspan><tspan x="865.0" dy="16.9">  усього ланцюжка від початку створення.</tspan></text>
</svg>