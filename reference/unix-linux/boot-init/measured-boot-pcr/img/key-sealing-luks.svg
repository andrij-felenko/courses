<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запечатування та розпечатування ключів</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запечатування та розпечатування ключів (Sealing/Unsealing) у LUKS2 через TPM 2.0</text>
<rect x="50.0" y="80.0" width="450.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1. Запечатування (Sealing)</tspan><tspan x="275.0" dy="11.7"></tspan><tspan x="275.0" dy="11.7">Створення політики довіри tpm2_createpolicy.</tspan><tspan x="275.0" dy="11.7">Ключ диска Volume Key шифрується у TPM під конкретне значення обраних PCR (наприклад, PCR 0, 7, 11).</tspan></text>
<rect x="600.0" y="80.0" width="450.0" height="140.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="825.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">2. Завантаження системи</tspan><tspan x="825.0" dy="15.6"></tspan><tspan x="825.0" dy="15.6">Кожен компонент робить Extend в PCR.</tspan><tspan x="825.0" dy="15.6">systemd-cryptsetup запитує TPM: Unseal(VolumeKey).</tspan></text>
<line x1="500.0" y1="150.0" x2="600.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="260.0" width="450.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="317.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">УСПІХ (PCR збігаються):</tspan><tspan x="275.0" dy="11.7">TPM видає Volume Key -&gt; Диск розшифровується без введення пароля користувача.</tspan></text>
<rect x="600.0" y="260.0" width="450.0" height="120.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="825.0" y="317.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">ВІДМОВА (Зміна в PCR):</tspan><tspan x="825.0" dy="11.7">Систему завантажено з флешки чи змінено ядро -&gt; TPM відмовляється видати Volume Key -&gt; Вимога пароля відновлення.</tspan></text>
<line x1="275.0" y1="220.0" x2="275.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="825.0" y1="220.0" x2="825.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>