<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операція Extend та відтворення журналу</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операція TPM2_Extend та перевірка Event Log через відтворення</text>
<rect x="50.0" y="70.0" width="420.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">TCG Event Log в RAM (/sys/kernel/security/...)</tspan></text>
<rect x="50.0" y="130.0" width="420.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Запис #1: Event = UEFI Code, Digest = d1</tspan></text>
<rect x="50.0" y="195.0" width="420.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Запис #2: Event = Boot Loader, Digest = d2</tspan></text>
<rect x="50.0" y="260.0" width="420.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="289.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Запис #3: Event = Kernel Cmdline, Digest = d3</tspan></text>
<rect x="510.0" y="180.0" width="140.0" height="60.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Послідовне</tspan><tspan x="580.0" dy="15.6">відтворення</tspan><tspan x="580.0" dy="15.6">Replay</tspan></text>
<line x1="470.0" y1="220.0" x2="510.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="220.0" x2="690.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="70.0" width="360.0" height="40.0" rx="6" fill="#eaf7ef" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Апаратний чип TPM 2.0</tspan></text>
<rect x="690.0" y="130.0" width="360.0" height="110.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="870.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">PCR[i]_new = HASH( PCR[i]_old || Digest )</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">[Операція є незворотною та залежною від порядку]</tspan></text>
<rect x="690.0" y="260.0" width="360.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Апаратне значення PCR у TPM</tspan><tspan x="870.0" dy="15.6">(наприклад, SHA256 Digest)</tspan></text>
<rect x="50.0" y="350.0" width="1000.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Збіг відтвореного хешу з апаратним PCR доводить цілісність журналу та системи.</tspan><tspan x="550.0" dy="15.6">Будь-яка підміна в логу дасть неспівпадаючий хеш.</tspan></text>
</svg>