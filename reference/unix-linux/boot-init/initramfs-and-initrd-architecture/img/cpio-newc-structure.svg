<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурна анатомія кадру cpio newc (SVR4 Portable Format)</text>
<rect x="40.0" y="90.0" width="340.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ASCII Header (110 байтів)</tspan><tspan x="210.0" dy="16.9">Magic: '070701'</tspan><tspan x="210.0" dy="16.9">ino, mode, uid, gid, filesize...</tspan></text>
<rect x="380.0" y="90.0" width="280.0" height="90.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ім'я файлу (namesize)</tspan><tspan x="520.0" dy="16.9">наприклад: 'init' або 'bin/sh'</tspan><tspan x="520.0" dy="16.9">+ NUL-символ</tspan></text>
<rect x="660.0" y="90.0" width="160.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Падінг ім'я</tspan><tspan x="740.0" dy="15.6">(0-3 байти)</tspan></text>
<rect x="820.0" y="90.0" width="260.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Дані файлу (filesize)</tspan><tspan x="950.0" dy="16.9">бінарне навантаження</tspan></text>
<rect x="1080.0" y="90.0" width="120.0" height="90.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1140.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">Падінг дані</tspan><tspan x="1140.0" dy="15.6">(0-3 байти)</tspan></text>
<line x1="40.0" y1="230.0" x2="1200.0" y2="230.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="620.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Усі частини вирівнюються за межею 4 байтів: (offset % 4 == 0)</text>
<rect x="40.0" y="270.0" width="560.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Маркер кінця архіву (TRAILER!!!):</tspan><tspan x="320.0" dy="16.9">• namesize = 11 ('TRAILER!!!\0')</tspan><tspan x="320.0" dy="16.9">• filesize = 0</tspan><tspan x="320.0" dy="16.9">• Вказує ядерному парсеру зупинити витягування поточного cpio</tspan></text>
<rect x="640.0" y="270.0" width="560.0" height="140.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="310.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Типи файлів (c_mode &amp; 0170000):</tspan><tspan x="920.0" dy="16.9">• 0100000 (S_IFREG): Звичайний файл</tspan><tspan x="920.0" dy="16.9">• 0040000 (S_IFDIR): Каталог</tspan><tspan x="920.0" dy="16.9">• 0120000 (S_IFLNK): Символьне посилання</tspan><tspan x="920.0" dy="16.9">• 0020000 (S_IFCHR) / 0060000 (S_IFBLK): Пристрої</tspan></text>
</svg>