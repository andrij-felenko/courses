<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що менеджер справді читає, коли ви кажете «nginx.service»</text>
<rect x="50.0" y="82.0" width="620.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Крок 1 — ФРАГМЕНТ</tspan><tspan x="360.0" dy="19.5">перший знайдений файл виграє, далі не шукають</tspan></text>
<rect x="750.0" y="82.0" width="620.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">Крок 2 — ДОВАЖКИ</tspan><tspan x="1060.0" dy="19.5">читають УСІ знайдені, у порядку імен файлів</tspan></text>
<rect x="50.0" y="168.0" width="430.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">/etc/systemd/system/nginx.service</tspan></text>
<rect x="498.0" y="168.0" width="172.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="584.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">беруть ЦЕЙ</tspan></text>
<rect x="50.0" y="228.0" width="430.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">/run/systemd/system/nginx.service</tspan></text>
<rect x="498.0" y="228.0" width="172.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="584.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">уже не дивляться</tspan></text>
<rect x="50.0" y="288.0" width="430.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">/usr/local/lib/systemd/system/nginx.service</tspan></text>
<rect x="498.0" y="288.0" width="172.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="584.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">уже не дивляться</tspan></text>
<rect x="50.0" y="348.0" width="430.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">/usr/lib/systemd/system/nginx.service</tspan></text>
<rect x="498.0" y="348.0" width="172.0" height="46.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="584.0" y="374.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">файл пакунка лежить без дії</tspan></text>
<rect x="750.0" y="168.0" width="430.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">/usr/lib/systemd/system/service.d/10-all.conf</tspan></text>
<rect x="1198.0" y="168.0" width="172.0" height="46.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1284.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1284.0" dy="0.0">читають 1-м</tspan></text>
<rect x="750.0" y="228.0" width="430.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">/usr/lib/systemd/system/nginx.service.d/20-pkg.conf</tspan></text>
<rect x="1198.0" y="228.0" width="172.0" height="46.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1284.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1284.0" dy="0.0">читають 2-м</tspan></text>
<rect x="750.0" y="288.0" width="430.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">/run/systemd/system/nginx.service.d/50-run.conf</tspan></text>
<rect x="1198.0" y="288.0" width="172.0" height="46.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1284.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1284.0" dy="0.0">читають 3-м</tspan></text>
<rect x="750.0" y="348.0" width="430.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">/etc/systemd/system/nginx.service.d/90-local.conf</tspan></text>
<rect x="1198.0" y="348.0" width="172.0" height="46.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1284.0" y="375.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1284.0" dy="0.0">читають 4-м</tspan></text>
<text x="50.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="50.0" dy="0.0">Порядок згори вниз — це і є пріоритет.</tspan><tspan x="50.0" dy="19.5">Посилання на /dev/null у /etc — юніт замаскований:</tspan><tspan x="50.0" dy="19.5">для менеджера його просто немає.</tspan></text>
<text x="750.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="750.0" dy="0.0">Сортує ІМ'Я файлу, а не каталог.</tspan><tspan x="750.0" dy="19.5">Однакове ім'я в різних каталогах — виграє той,</tspan><tspan x="750.0" dy="19.5">що вище в переліку кроку 1.</tspan></text>
<line x1="50.0" y1="512.0" x2="1370.0" y2="512.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="8,6"/>
<text x="710.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефективний юніт = фрагмент + усі доважки, злиті в цьому порядку</text>
<rect x="50.0" y="588.0" width="1320.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="617.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Скалярна директива (Type=, Restart=, User=) — діє ОСТАННЄ присвоєння в порядку читання</tspan></text>
<rect x="50.0" y="650.0" width="1320.0" height="50.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="679.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Директива-список (ExecStart=, Wants=, Environment=) — присвоєння НАКОПИЧУЮТЬСЯ; порожнє значення обнуляє список</tspan></text>
<rect x="50.0" y="712.0" width="1320.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="741.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Побачити результат: systemctl cat nginx.service — покаже фрагмент і всі доважки тим самим порядком</tspan></text>
</svg>