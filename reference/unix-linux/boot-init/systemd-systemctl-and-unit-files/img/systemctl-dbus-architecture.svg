<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура взаємодії systemctl з PID 1 та підсистемами ядра</text>
<rect x="60.0" y="100.0" width="320.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="169.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Клієнтський шар:</tspan><tspan x="220.0" dy="11.7">systemctl CLI / утиліти</tspan><tspan x="220.0" dy="11.7"></tspan><tspan x="220.0" dy="11.7">1. Формує D-Bus метод (StartUnit, StopUnit, Reload)</tspan><tspan x="220.0" dy="11.7">2. Читає/пише симлінки у /etc/</tspan></text>
<rect x="460.0" y="100.0" width="300.0" height="180.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="140.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">IPC Шар D-Bus:</tspan><tspan x="610.0" dy="18.2">/run/systemd/system/bus</tspan><tspan x="610.0" dy="18.2">(або /run/systemd/private)</tspan><tspan x="610.0" dy="18.2"></tspan><tspan x="610.0" dy="18.2">Інтерфейси:</tspan><tspan x="610.0" dy="18.2">org.freedesktop.systemd1.Manager</tspan><tspan x="610.0" dy="18.2">org.freedesktop.systemd1.Unit</tspan></text>
<rect x="840.0" y="100.0" width="500.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="149.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">Системний менеджер (PID 1):</tspan><tspan x="1090.0" dy="18.2">org.freedesktop.systemd1</tspan><tspan x="1090.0" dy="18.2"></tspan><tspan x="1090.0" dy="18.2">1. Обчислює граф залежностей (DAG)</tspan><tspan x="1090.0" dy="18.2">2. Створює транзакційні роботи (Jobs)</tspan><tspan x="1090.0" dy="18.2">3. Відстежує стани (ActiveState, SubState)</tspan></text>
<line x1="380.0" y1="190.0" x2="450.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="760.0" y1="190.0" x2="830.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="380.0" width="360.0" height="200.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="439.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Файлова система (/etc, /usr, /run):</tspan><tspan x="260.0" dy="18.2"></tspan><tspan x="260.0" dy="18.2">- unit-файли (INI)</tspan><tspan x="260.0" dy="18.2">- drop-in оверриди (.d/)</tspan><tspan x="260.0" dy="18.2">- символьні посилання автозапуску</tspan><tspan x="260.0" dy="18.2">(wants/, requires/)</tspan></text>
<rect x="520.0" y="380.0" width="380.0" height="200.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="439.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Підсистема cgroups v2:</tspan><tspan x="710.0" dy="18.2">/sys/fs/cgroup/system.slice/...</tspan><tspan x="710.0" dy="18.2"></tspan><tspan x="710.0" dy="18.2">- Точне відстеження процесів демона</tspan><tspan x="710.0" dy="18.2">- Гарантована зупинка (SIGKILL групи)</tspan><tspan x="710.0" dy="18.2">- Обмеження ресурсів (CPU, Memory, IO)</tspan></text>
<rect x="960.0" y="380.0" width="380.0" height="200.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1150.0" y="448.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">Системні події та логування:</tspan><tspan x="1150.0" dy="18.2"></tspan><tspan x="1150.0" dy="18.2">- systemd-journald (stdout/stderr)</tspan><tspan x="1150.0" dy="18.2">- udev (події пристроїв .device)</tspan><tspan x="1150.0" dy="18.2">- systemd-logind (сесії)</tspan></text>
<line x1="880.0" y1="290.0" x2="260.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1090.0" y1="290.0" x2="710.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1200.0" y1="290.0" x2="1150.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>