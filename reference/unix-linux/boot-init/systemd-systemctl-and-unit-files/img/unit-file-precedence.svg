<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет пошуку юнітів та механізм перекриття Drop-in (.d/*.conf)</text>
<rect x="40.0" y="80.0" width="620.0" height="560.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія каталогів юнітів (від вищого пріоритету)</text>
<rect x="60.0" y="140.0" width="580.0" height="110.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">1. /run/systemd/system/</tspan><tspan x="350.0" dy="14.3">Тимчасові юніти, згенеровані під час виконання та transient-юніти (systemd-run)</tspan></text>
<line x1="350.0" y1="250.0" x2="350.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">перекриває</text>
<rect x="60.0" y="280.0" width="580.0" height="110.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">2. /etc/systemd/system/</tspan><tspan x="350.0" dy="16.9">Адміністративні юніти, симлінки увімкнення та дроп-ін оверриди (.d/)</tspan></text>
<line x1="350.0" y1="390.0" x2="350.0" y2="415.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-style="italic">перекриває</text>
<rect x="60.0" y="420.0" width="580.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="470.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">3. /usr/lib/systemd/system/ (або /lib/)</tspan><tspan x="350.0" dy="18.2">Початкові юніти за замовчуванням від пакета дистрибутива</tspan></text>
<rect x="60.0" y="550.0" width="580.0" height="70.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="581.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Маскування (Masking):</tspan><tspan x="350.0" dy="16.9">символьне посилання у /etc/.../foo.service -&gt; /dev/null блокує юніт повністю</tspan></text>
<rect x="720.0" y="80.0" width="640.0" height="560.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="1040.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування конфігурації у пам'яті PID 1</text>
<rect x="740.0" y="140.0" width="600.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Базовий файл пакету:</tspan><tspan x="1040.0" dy="16.9">/lib/systemd/system/nginx.service</tspan><tspan x="1040.0" dy="16.9">(ExecStart=/usr/sbin/nginx, MemoryMax=1G)</tspan></text>
<line x1="1040.0" y1="220.0" x2="1040.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<text x="1033.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">+</text>
<rect x="740.0" y="260.0" width="600.0" height="90.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="292.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Дроп-ін файл 1:</tspan><tspan x="1040.0" dy="16.9">/etc/systemd/system/nginx.service.d/10-env.conf</tspan><tspan x="1040.0" dy="16.9">(Environment=&quot;ENV=prod&quot;)</tspan></text>
<line x1="1040.0" y1="350.0" x2="1040.0" y2="380.0" stroke="#333333" stroke-width="1.5"/>
<text x="1033.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#333333" text-anchor="middle" font-weight="700">+</text>
<rect x="740.0" y="390.0" width="600.0" height="90.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Дроп-ін файл 2 (вищий номер):</tspan><tspan x="1040.0" dy="16.9">/etc/systemd/system/nginx.service.d/20-limits.conf</tspan><tspan x="1040.0" dy="16.9">(ExecStart=, ExecStart=/usr/local/bin/custom-nginx, MemoryMax=2G)</tspan></text>
<line x1="1040.0" y1="480.0" x2="1040.0" y2="515.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="740.0" y="520.0" width="600.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="549.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">Підсумковий результуючий юніт у пам'яті PID 1:</tspan><tspan x="1040.0" dy="16.9">- ExecStart=/usr/local/bin/custom-nginx (перезаписано)</tspan><tspan x="1040.0" dy="16.9">- MemoryMax=2G (перезаписано)</tspan><tspan x="1040.0" dy="16.9">- Environment=&quot;ENV=prod&quot; (об'єднано)</tspan></text>
</svg>