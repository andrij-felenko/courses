<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 898" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="898" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="166.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">макрос</text>
<text x="440.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">секція</text>
<text x="1004.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що туди кладуть</text>
<rect x="40.0" y="84.0" width="252.0" height="62.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">early_initcall</tspan></text>
<rect x="308.0" y="84.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcallearly.init</tspan></text>
<rect x="588.0" y="84.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">виконується окремим проходом ще до підняття решти процесорів</tspan></text>
<rect x="40.0" y="156.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">pure_initcall</tspan></text>
<rect x="308.0" y="156.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall0.init</tspan></text>
<rect x="588.0" y="156.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="191.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">не залежить ні від чого: лише задає змінні, яких не задати статично</tspan></text>
<rect x="40.0" y="228.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">core_initcall</tspan></text>
<rect x="308.0" y="228.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall1.init</tspan></text>
<rect x="588.0" y="228.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">серцевина ядра: те, на що спирається геть усе інше</tspan></text>
<rect x="40.0" y="300.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">postcore_initcall</tspan></text>
<rect x="308.0" y="300.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall2.init</tspan></text>
<rect x="588.0" y="300.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="335.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">спирається на серцевину, але потрібне ще до архітектурного коду</tspan></text>
<rect x="40.0" y="372.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">arch_initcall</tspan></text>
<rect x="308.0" y="372.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="407.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall3.init</tspan></text>
<rect x="588.0" y="372.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="407.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">залежне від архітектури: шини платформи, особливості процесора</tspan></text>
<rect x="40.0" y="444.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="480.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">subsys_initcall</tspan></text>
<rect x="308.0" y="444.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="479.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall4.init</tspan></text>
<rect x="588.0" y="444.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="479.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">великі підсистеми: типи шин, мережа, керування живленням</tspan></text>
<rect x="40.0" y="516.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="552.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">fs_initcall</tspan></text>
<rect x="308.0" y="516.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="551.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall5.init</tspan></text>
<rect x="588.0" y="516.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="551.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">файлові системи й те, що реєструється всередині них</tspan></text>
<rect x="40.0" y="588.0" width="252.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="624.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">rootfs_initcall</tspan></text>
<rect x="308.0" y="588.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="623.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcallrootfs.init</tspan></text>
<rect x="588.0" y="588.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="623.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">розпакування initramfs; лежить усередині діапазону рівня fs</tspan></text>
<rect x="40.0" y="660.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="696.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">device_initcall</tspan></text>
<rect x="308.0" y="660.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="695.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall6.init</tspan></text>
<rect x="588.0" y="660.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="695.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">драйвери; сюди ж потрапляє module_init вбудованого модуля</tspan></text>
<rect x="40.0" y="732.0" width="252.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="166.0" y="768.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">late_initcall</tspan></text>
<rect x="308.0" y="732.0" width="264.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="440.0" y="767.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">.initcall7.init</tspan></text>
<rect x="588.0" y="732.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="1004.0" y="767.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">останнє: те, чому потрібна вже готова решта системи</tspan></text>
<rect x="40.0" y="816.0" width="1380.0" height="62.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="730.0" y="842.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Суфікс _sync дає ту саму назву з літерою s (.initcall4s.init) — другий слот у хвості того самого рівня.</tspan><tspan x="730.0" dy="18.2">Жодної окремої дії він не виконує: усе, що він робить, — стає після решти записів свого рівня.</tspan></text>
</svg>