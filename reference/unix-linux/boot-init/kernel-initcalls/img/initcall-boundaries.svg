<rect x="984.0" y="166.0" width="456.0" height="28.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="1212.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1212.0" dy="0.0">__con_initcall_end</tspan></text>
<rect x="984.0" y="224.0" width="456.0" height="132.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="1212.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1212.0" dy="0.0">console_init() проходить його рано й окремо,</tspan><tspan x="1212.0" dy="18.2">щоб було куди друкувати журнал.</tspan><tspan x="1212.0" dy="18.2">Записи викликаються прямо, не через</tspan><tspan x="1212.0" dy="18.2">do_one_initcall() — тож initcall_blacklist=</tspan><tspan x="1212.0" dy="18.2">їх не бачить.</tspan></text>
<rect x="984.0" y="392.0" width="456.0" height="132.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="1212.0" y="426.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1212.0" dy="0.0">Ім'я проходу — не прикраса. Тим самим</tspan><tspan x="1212.0" dy="18.2">рядком ядро розбирає параметри</tspan><tspan x="1212.0" dy="18.2">командного рядка саме перед цим</tspan><tspan x="1212.0" dy="18.2">проходом і ним же помічає точку</tspan><tspan x="1212.0" dy="18.2">трасування initcall_level.</tspan></text>
<rect x="984.0" y="560.0" width="456.0" height="132.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1212.0" y="594.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1212.0" dy="0.0">Суфікс _sync дає другу секцію того</tspan><tspan x="1212.0" dy="18.2">самого рівня — з літерою s на кінці.</tspan><tspan x="1212.0" dy="18.2">Компонувальник ставить її одразу після</tspan><tspan x="1212.0" dy="18.2">основної, тож ці виклики йдуть у хвості</tspan><tspan x="1212.0" dy="18.2">свого проходу.</tspan></text>
</svg>