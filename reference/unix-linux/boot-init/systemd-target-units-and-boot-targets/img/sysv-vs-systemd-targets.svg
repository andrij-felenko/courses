<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція: Монолітні числові runlevels vs Графові цільові юніти</text>
<rect x="40.0" y="80.0" width="620.0" height="520.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадигма SysVinit (Лінійна шкала 0-6)</text>
<rect x="70.0" y="150.0" width="560.0" height="70.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Числові стани у /etc/inittab:</tspan><tspan x="350.0" dy="18.2">id:3:initdefault:</tspan></text>
<line x1="350.0" y1="220.0" x2="350.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="250.0" width="560.0" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Послідовні каталоги скриптів:</tspan><tspan x="350.0" dy="16.9">/etc/rc.d/rc3.d/</tspan><tspan x="350.0" dy="16.9">K15httpd -&gt; S10network -&gt; S20syslog -&gt; S55sshd</tspan></text>
<line x1="350.0" y1="350.0" x2="350.0" y2="380.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="380.0" width="560.0" height="190.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Недоліки системи:</tspan><tspan x="350.0" dy="16.9">- Синхронне однопотокове виконання скриптів Shell</tspan><tspan x="350.0" dy="16.9">- Фіксовані номери S10/S55 замість графа залежностей</tspan><tspan x="350.0" dy="16.9">- Неможливість описати проміжні стани</tspan><tspan x="350.0" dy="16.9">- Ризик залишення невизначеного стану при помилках</tspan></text>
<rect x="720.0" y="80.0" width="640.0" height="520.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="1040.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадигма systemd (Декларативний DAG)</text>
<rect x="750.0" y="150.0" width="580.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Символьне посилання таргета за замовчуванням:</tspan><tspan x="1040.0" dy="16.9">/etc/systemd/system/default.target -&gt; multi-user.target</tspan></text>
<line x1="1040.0" y1="220.0" x2="1040.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="750.0" y="250.0" width="580.0" height="100.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Сумісність через символьні посилання:</tspan><tspan x="1040.0" dy="16.9">runlevel0.target -&gt; poweroff.target</tspan><tspan x="1040.0" dy="16.9">runlevel3.target -&gt; multi-user.target</tspan><tspan x="1040.0" dy="16.9">runlevel5.target -&gt; graphical.target</tspan></text>
<line x1="1040.0" y1="350.0" x2="1040.0" y2="380.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="750.0" y="380.0" width="580.0" height="190.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Переваги systemd:</tspan><tspan x="1040.0" dy="16.9">- Паралельний запуск залежностей у багатопотоковому режимі</tspan><tspan x="1040.0" dy="16.9">- Декларативний граф (Wants=, Requires=, After=, Before=)</tspan><tspan x="1040.0" dy="16.9">- Динамічна та надійна ізоляція станів (systemctl isolate)</tspan><tspan x="1040.0" dy="16.9">- Масштабованість через дроп-ін каталоги .wants/ та .requires/</tspan></text>
</svg>