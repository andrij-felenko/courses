<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="290.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">засинання — згори вниз</text>
<text x="930.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">пробудження — знизу вгору</text>
<rect x="50.0" y="82.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">сповіщення PM_SUSPEND_PREPARE:</tspan><tspan x="290.0" dy="16.9">підсистеми готуються, поки все ще працює</tspan></text>
<line x1="290.0" y1="153.0" x2="290.0" y2="163.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="164.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">freeze_processes(): простір користувача</tspan><tspan x="290.0" dy="16.9">зупинено на межі системного виклику</tspan></text>
<line x1="290.0" y1="235.0" x2="290.0" y2="245.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="246.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">prepare: нові пристрої більше не реєструють</tspan></text>
<line x1="290.0" y1="317.0" x2="290.0" y2="327.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="328.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">suspend: драйвер спиняє обмін і зберігає регістри</tspan></text>
<line x1="290.0" y1="399.0" x2="290.0" y2="409.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="410.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">suspend_late: сон на ходу вимкнено —</tspan><tspan x="290.0" dy="16.9">ніхто не розбудить пристрій збоку</tspan></text>
<line x1="290.0" y1="481.0" x2="290.0" y2="491.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="492.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">suspend_noirq: обробники переривань уже мовчать</tspan></text>
<line x1="290.0" y1="563.0" x2="290.0" y2="573.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="574.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="605.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">неосновні ядра вимкнено,</tspan><tspan x="290.0" dy="16.9">локальні переривання закрито</tspan></text>
<line x1="290.0" y1="645.0" x2="290.0" y2="655.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="656.0" width="480.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="290.0" y="687.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">syscore: годинник і контролер переривань;</tspan><tspan x="290.0" dy="16.9">далі — виклик до прошивки</tspan></text>
<rect x="690.0" y="82.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">PM_POST_SUSPEND: система знову повна</tspan></text>
<line x1="930.0" y1="163.0" x2="930.0" y2="153.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="164.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">thaw_processes(): процеси виходять із холодильника</tspan></text>
<line x1="930.0" y1="245.0" x2="930.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="246.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">complete: реєстрація пристроїв знову дозволена</tspan></text>
<line x1="930.0" y1="327.0" x2="930.0" y2="317.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="328.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">resume: регістри назад, обмін знову йде</tspan></text>
<line x1="930.0" y1="409.0" x2="930.0" y2="399.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="410.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">resume_early: знято те, що поставив suspend_late</tspan></text>
<line x1="930.0" y1="491.0" x2="930.0" y2="481.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="492.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">resume_noirq: пристрій готовий приймати переривання</tspan></text>
<line x1="930.0" y1="573.0" x2="930.0" y2="563.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="574.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="613.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">ядра вертаються в стрій</tspan></text>
<line x1="930.0" y1="655.0" x2="930.0" y2="645.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="656.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="695.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">прошивка віддала керування; syscore_resume</tspan></text>
<rect x="50.0" y="754.0" width="1120.0" height="66.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="1.6"/><text x="610.0" y="792.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">живлення знято: між останньою виконаною інструкцією й наступною минає стільки, скільки триває сон</tspan></text>
</svg>