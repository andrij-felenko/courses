<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1510 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1510" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="174.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">доба</text>
<text x="682.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ланки між живленням і ядром</text>
<text x="1258.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чим це вимушене</text>
<rect x="40.0" y="96.0" width="268.0" height="98.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">BIOS і LILO</tspan><tspan x="174.0" dy="18.2">1990-ті</tspan></text>
<rect x="332.0" y="96.0" width="700.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="682.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">перший сектор, 446 байтів коду  →  решта коду,</tspan><tspan x="682.0" dy="16.9">знайдена за жорстким списком номерів блоків  →  ядро</tspan></text>
<rect x="1056.0" y="96.0" width="404.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1258.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1258.0" dy="0.0">прошивка знає лише «сектор нуль»</tspan><tspan x="1258.0" dy="16.9">і нічого не знає про файли</tspan></text>
<rect x="40.0" y="210.0" width="268.0" height="98.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">BIOS і GRUB Legacy</tspan><tspan x="174.0" dy="18.2">від 1999</tspan></text>
<rect x="332.0" y="210.0" width="700.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="682.0" y="255.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">перший сектор  →  проміжна частина в щілині</tspan><tspan x="682.0" dy="16.9">перед першим розділом  →  основна частина файлом  →  ядро</tspan></text>
<rect x="1056.0" y="210.0" width="404.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1258.0" y="255.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1258.0" dy="0.0">проміжна частина приносить із собою</tspan><tspan x="1258.0" dy="16.9">драйвер файлової системи</tspan></text>
<rect x="40.0" y="324.0" width="268.0" height="98.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="368.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">UEFI і GRUB 2</tspan><tspan x="174.0" dy="18.2">від середини 2000-х</tspan></text>
<rect x="332.0" y="324.0" width="700.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="682.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">прошивка читає файл із розділу ESP  →  завантажувач  →  ядро</tspan></text>
<rect x="1056.0" y="324.0" width="404.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1258.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1258.0" dy="0.0">прошивка сама розуміє FAT,</tspan><tspan x="1258.0" dy="16.9">а список завантажень лежить у її пам'яті</tspan></text>
<rect x="40.0" y="438.0" width="268.0" height="98.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="482.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">UEFI і EFI-заглушка</tspan><tspan x="174.0" dy="18.2">від ядра 3.3, 2012</tspan></text>
<rect x="332.0" y="438.0" width="700.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="682.0" y="491.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">прошивка  →  ядро</tspan></text>
<rect x="1056.0" y="438.0" width="404.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1258.0" y="483.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1258.0" dy="0.0">ядро прикидається програмою у форматі</tspan><tspan x="1258.0" dy="16.9">прошивки й запускає себе саме</tspan></text>
<rect x="40.0" y="552.0" width="268.0" height="98.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="596.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">UEFI і єдиний образ</tspan><tspan x="174.0" dy="18.2">(UKI)</tspan></text>
<rect x="332.0" y="552.0" width="700.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="682.0" y="605.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">прошивка  →  один файл: ядро, рядок параметрів, initramfs</tspan></text>
<rect x="1056.0" y="552.0" width="404.0" height="98.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1258.0" y="597.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1258.0" dy="0.0">підписати треба все, а не лише ядро,</tspan><tspan x="1258.0" dy="16.9">тож усе складають в один підписаний файл</tspan></text>
</svg>