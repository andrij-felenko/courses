<rect x="820.0" y="232.0" width="440.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1040.0" y="265.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">корінь: справжня файлова система</tspan><tspan x="1040.0" dy="16.9">з носія</tspan></text>
