<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="200.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ланка</text>
<text x="558.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">де живе її код</text>
<text x="1038.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">як вона знаходить наступну</text>
<rect x="50.0" y="96.0" width="300.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Прошивка</tspan></text>
<rect x="372.0" y="96.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">постійна пам'ять на платі;</tspan><tspan x="558.0" dy="16.9">адресу першої команди задає схема</tspan></text>
<rect x="766.0" y="96.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">читає файл із розділу ESP</tspan><tspan x="1038.0" dy="16.9">(у старій схемі — перший сектор диска)</tspan></text>
<rect x="50.0" y="204.0" width="300.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Завантажувач</tspan></text>
<rect x="372.0" y="204.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">файл на ESP</tspan><tspan x="558.0" dy="16.9">або блоки, дописані біля початку диска</tspan></text>
<rect x="766.0" y="204.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">читає з файлової системи ядро, initramfs</tspan><tspan x="1038.0" dy="16.9">і складає рядок параметрів</tspan></text>
<rect x="50.0" y="312.0" width="300.0" height="94.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Стиснене ядро</tspan></text>
<rect x="372.0" y="312.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="355.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">образ, покладений у пам'ять</tspan><tspan x="558.0" dy="16.9">попередньою ланкою</tspan></text>
<rect x="766.0" y="312.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="355.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">розпаковує саме себе на місці</tspan><tspan x="1038.0" dy="16.9">й передає керування всередину</tspan></text>
<rect x="50.0" y="420.0" width="300.0" height="94.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="472.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Ядро</tspan></text>
<rect x="372.0" y="420.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="463.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">розпакований код у пам'яті;</tspan><tspan x="558.0" dy="16.9">носії ще не змонтовані</tspan></text>
<rect x="766.0" y="420.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="463.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">піднімає підсистеми й розпаковує</tspan><tspan x="1038.0" dy="16.9">cpio-архів у rootfs — файлову систему в пам'яті</tspan></text>
<rect x="50.0" y="528.0" width="300.0" height="94.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="580.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">/init з initramfs</tspan></text>
<rect x="372.0" y="528.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">rootfs: кілька мегабайтів</tspan><tspan x="558.0" dy="16.9">у оперативній пам'яті</tspan></text>
<rect x="766.0" y="528.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">знаходить і монтує справжній корінь,</tspan><tspan x="1038.0" dy="16.9">переставляє корінь і викликає exec</tspan></text>
<rect x="50.0" y="636.0" width="300.0" height="94.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="688.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">init, він же PID 1</tspan></text>
<rect x="372.0" y="636.0" width="372.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="558.0" y="679.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">справжній корінь на носії;</tspan><tspan x="558.0" dy="16.9">процес живе до вимкнення</tspan></text>
<rect x="766.0" y="636.0" width="544.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1038.0" y="679.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1038.0" dy="0.0">наступної ланки немає — від цієї миті</tspan><tspan x="1038.0" dy="16.9">він не шукає, а тримає служби</tspan></text>
</svg>