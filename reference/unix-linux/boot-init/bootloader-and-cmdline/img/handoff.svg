<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передача керування: пам'ять, заповнений заголовок і тільки після цього стрибок</text>
<text x="220.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що кладе в пам'ять</text>
<text x="700.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що вписує в заголовок образу</text>
<text x="1160.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">і лише тоді — передача керування</text>
<rect x="60.0" y="100.0" width="320.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">образ ядра,</tspan><tspan x="220.0" dy="16.9">розпакований у своє місце</tspan></text>
<rect x="60.0" y="220.0" width="320.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">initramfs —</tspan><tspan x="220.0" dy="16.9">архів так, як лежав на диску</tspan></text>
<rect x="60.0" y="340.0" width="320.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">командний рядок —</tspan><tspan x="220.0" dy="16.9">текст із нулем у кінці</tspan></text>
<rect x="520.0" y="100.0" width="360.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">type_of_loader — хто саме завантажує</tspan></text>
<rect x="520.0" y="160.0" width="360.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">cmdline_size — стеля, яку оголосило ядро</tspan></text>
<rect x="520.0" y="220.0" width="360.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ramdisk_image — адреса архіву initramfs</tspan></text>
<rect x="520.0" y="280.0" width="360.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ramdisk_size — довжина того архіву</tspan></text>
<rect x="520.0" y="340.0" width="360.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">cmd_line_ptr — адреса рядка</tspan></text>
<line x1="516.0" y1="244.0" x2="388.0" y2="258.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="516.0" y1="364.0" x2="388.0" y2="378.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="120.0" width="360.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="1160.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">виставити стан процесора</tspan><tspan x="1160.0" dy="16.9">так, як вимагає протокол</tspan></text>
<rect x="980.0" y="230.0" width="360.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="1160.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">стрибнути в точку входу</tspan><tspan x="1160.0" dy="16.9">образу</tspan></text>
<rect x="980.0" y="340.0" width="360.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="1160.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">далі керує ядро —</tspan><tspan x="1160.0" dy="16.9">завантажувача більше немає</tspan></text>
<line x1="1160.0" y1="194.0" x2="1160.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1160.0" y1="304.0" x2="1160.0" y2="336.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="888.0" y1="265.0" x2="972.0" y2="265.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">чого немає ні в пам'яті, ні в заголовку — того для ядра не існує</text>
</svg>