<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири різні відповіді на питання «що ця машина отримала при старті»</text>
<text x="670.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">усе з bootconfig стоїть попереду — тому слово з рядка завантажувача перекриває його, а не навпаки</text>
<rect x="70.0" y="86.0" width="300.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">bootconfig · ключі під kernel</tspan></text>
<rect x="378.0" y="86.0" width="340.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="548.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="548.0" dy="0.0">рядок від завантажувача</tspan></text>
<rect x="726.0" y="86.0" width="64.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="758.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="758.0" dy="0.0">--</tspan></text>
<rect x="798.0" y="86.0" width="300.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="948.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="948.0" dy="0.0">bootconfig · ключі під init</tspan></text>
<rect x="70.0" y="196.0" width="1028.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="584.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">склеєний рядок: його ядро й розбирає, і зберігає назавжди</tspan></text>
<line x1="584.0" y1="152.0" x2="584.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="300.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="215.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">/proc/cmdline</tspan></text>
<rect x="70.0" y="352.0" width="290.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="215.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">увесь склеєний рядок,</tspan><tspan x="215.0" dy="16.9">разом зі словами, які ядро</tspan><tspan x="215.0" dy="16.9">викинуло або передало далі</tspan></text>
<rect x="386.0" y="300.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="531.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">/proc/bootconfig</tspan></text>
<rect x="386.0" y="352.0" width="290.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="531.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="531.0" dy="0.0">лише те, що прийшло</tspan><tspan x="531.0" dy="16.9">з bootconfig, і вже деревом</tspan><tspan x="531.0" dy="16.9">ключів, а не текстом</tspan></text>
<rect x="702.0" y="300.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="847.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0.0">/proc/1/cmdline</tspan></text>
<rect x="702.0" y="352.0" width="290.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="847.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">argv init: argv[0] — справжній</tspan><tspan x="847.0" dy="16.9">шлях, далі слова без «=»</tspan><tspan x="847.0" dy="16.9">і все, що стояло після «--»</tspan></text>
<rect x="1018.0" y="300.0" width="290.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="1163.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1163.0" dy="0.0">/proc/1/environ</tspan></text>
<rect x="1018.0" y="352.0" width="290.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1163.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1163.0" dy="0.0">оточення init: HOME=/ і</tspan><tspan x="1163.0" dy="16.9">TERM=linux плюс невпізнані</tspan><tspan x="1163.0" dy="16.9">слова, у яких було «=»</tspan></text>
<line x1="584.0" y1="258.0" x2="215.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="258.0" x2="531.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="258.0" x2="847.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="258.0" x2="1163.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">чого не показує жоден: які слова ядро не впізнало — це лише в журналі, рядком «Unknown kernel command line parameters»</text>
</svg>