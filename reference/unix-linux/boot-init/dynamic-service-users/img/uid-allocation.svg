<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибір тимчасового числа й замок, що знімається сам</text>
<text x="650.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">вибір кандидата — три заходи по черзі</text>
<text x="220.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · підказка з диску</text>
<rect x="60.0" y="108.0" width="320.0" height="84.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">власник каталогу стану</tspan><tspan x="220.0" dy="18.2">/var/lib/private/metrics</tspan></text>
<text x="650.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · хеш імені</text>
<rect x="490.0" y="108.0" width="320.0" height="84.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">siphash24(&quot;metrics&quot;)</tspan><tspan x="650.0" dy="18.2">стиснутий у 61184…65519</tspan></text>
<text x="1080.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · навмання</text>
<rect x="920.0" y="108.0" width="320.0" height="84.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1080.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">випадкове число з проміжку</tspan><tspan x="1080.0" dy="18.2">до ста спроб</tspan></text>
<line x1="380.0" y1="150.0" x2="490.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="810.0" y1="150.0" x2="920.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зайнято</text>
<text x="865.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зайнято</text>
<line x1="650.0" y1="200.0" x2="650.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="250.0" width="640.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="291.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">open(&quot;/run/systemd/dynamic-uid/61234&quot;, O_CREAT|O_RDWR, 0600)</tspan><tspan x="650.0" dy="18.2">flock(fd, LOCK_EX|LOCK_NB)</tspan></text>
<line x1="650.0" y1="342.0" x2="650.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="396.0" width="480.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">у файлі — один рядок: metrics</tspan><tspan x="380.0" dy="18.2">число → ім'я читається просто з файлу</tspan></text>
<rect x="680.0" y="396.0" width="480.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">замок тримається за дескриптором</tspan><tspan x="920.0" dy="18.2">останній дескриптор закрито — число вільне</tspan></text>
<rect x="140.0" y="528.0" width="1020.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="571.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">/run — це tmpfs: після перезавантаження жодного замка не лишається, тож зайнятість числа не переживає вимкнення живлення</tspan></text>
</svg>