<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура образу vmlinuz (bzImage) та завантажувальний заголовок</text>
<rect x="60.0" y="86.0" width="1280.0" height="460.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="80.0" y="106.0" width="380.0" height="200.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="270.0" y="159.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">16-bit Boot Sector &amp; Setup Code</tspan><tspan x="270.0" dy="16.9"></tspan><tspan x="270.0" dy="16.9">• Offset 0x01F1: setup_header</tspan><tspan x="270.0" dy="16.9">• Header signature: &quot;HdrS&quot; (0x53726448)</tspan><tspan x="270.0" dy="16.9">• Boot protocol version (e.g. 0x020f)</tspan><tspan x="270.0" dy="16.9">• code32_start (початкова адреса 32-біт)</tspan><tspan x="270.0" dy="16.9">• cmd_line_ptr &amp; ramdisk_image</tspan></text>
<rect x="480.0" y="106.0" width="420.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="690.0" y="159.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Decompressor Engine</tspan><tspan x="690.0" dy="16.9">(head_64.S + extract_kernel.c)</tspan><tspan x="690.0" dy="16.9"></tspan><tspan x="690.0" dy="16.9">• startup_32 / startup_64 (вхід)</tspan><tspan x="690.0" dy="16.9">• Алгоритми розпакування: LZ4, ZSTD, XZ</tspan><tspan x="690.0" dy="16.9">• KASLR розрахунок випадкового зсуву</tspan><tspan x="690.0" dy="16.9">• Будування ранніх PML4 таблиць сторінок</tspan></text>
<rect x="920.0" y="106.0" width="400.0" height="200.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="1120.0" y="159.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Compressed Payload (piggy.o)</tspan><tspan x="1120.0" dy="16.9"></tspan><tspan x="1120.0" dy="16.9">• Повний ELF-дискрет ядра vmlinux</tspan><tspan x="1120.0" dy="16.9">• Скомпонований під віртуальну адресу</tspan><tspan x="1120.0" dy="16.9">  0xFFFFFFFF81000000</tspan><tspan x="1120.0" dy="16.9">• Розпаковується у RAM функцією</tspan><tspan x="1120.0" dy="16.9">  extract_kernel()</tspan></text>
<rect x="80.0" y="326.0" width="1240.0" height="190.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Результат роботи розпакувальника у фізичній пам'яті (RAM):</tspan><tspan x="700.0" dy="16.9"></tspan><tspan x="700.0" dy="16.9">[ Фізичний адресний простір: 0x01000000 (або KASLR Base) ]</tspan><tspan x="700.0" dy="16.9">┌─────────────────────┬─────────────────────┬─────────────────────┬─────────────────────┐</tspan><tspan x="700.0" dy="16.9">│ .text (startup_64)  │ .rodata (таблиці)   │ .data (змінні)      │ .init.text (init)   │</tspan><tspan x="700.0" dy="16.9">└─────────────────────┴─────────────────────┴─────────────────────┴─────────────────────┘</tspan><tspan x="700.0" dy="16.9">Після розпакування розпакувальник передає керування на розпаковану startup_64 у коді vmlinux.</tspan></text>
<rect x="60.0" y="566.0" width="1280.0" height="120.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="612.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Файл vmlinuz — це саморозпаковуваний шар. Він поєднує в одному двійковому файлі стандартизований заголовок boot_params,</tspan><tspan x="700.0" dy="18.2">автономний розпакувальник зі своїми таблицями сторінок та стиснутий ELF-образ vmlinux.</tspan><tspan x="700.0" dy="18.2">Це дозволяє завантажувачу працювати за єдиним протоколом незалежно від того, як згодом буде розпаковано ядро.</tspan></text>
</svg>