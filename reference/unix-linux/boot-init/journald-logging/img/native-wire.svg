<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Байтова розкладка рідного протоколу journald</text>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">рідний протокол: що саме летить у сокет</text>
<rect x="40.0" y="70.0" width="700.0" height="508.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="390.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">датаграма з даними — це і є запис</text>
<rect x="70.0" y="130.0" width="640.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="390.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">MESSAGE=не вдалося відкрити сокет\n</tspan></text>
<rect x="70.0" y="176.0" width="640.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="390.0" y="200.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">PRIORITY=3\n</tspan></text>
<rect x="70.0" y="222.0" width="640.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="390.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ORDER_ID=8841\n</tspan></text>
<text x="390.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">значення з переносом рядка — лише другою формою:</text>
<rect x="70.0" y="306.0" width="140.0" height="66.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.0"/><text x="140.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">TRACE\n</tspan></text>
<rect x="220.0" y="306.0" width="262.0" height="66.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.0"/><text x="351.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="351.0" dy="0.0">довжина значення:</tspan><tspan x="351.0" dy="16.9">8 байтів, молодший перший</tspan></text>
<rect x="492.0" y="306.0" width="178.0" height="66.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.0"/><text x="581.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="581.0" dy="0.0">байти значення,</tspan><tspan x="581.0" dy="16.9">як вони є</tspan></text>
<rect x="680.0" y="306.0" width="50.0" height="66.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.0"/><text x="705.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">\n</tspan></text>
<rect x="70.0" y="388.0" width="640.0" height="42.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.0"/><text x="390.0" y="413.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">\n     порожній рядок — тут запис скінчився</tspan></text>
<text x="390.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">поле з підкресленням, надіслане клієнтом, демон відкидає</text>
<rect x="780.0" y="70.0" width="540.0" height="508.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="1050.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">запис не вліз у датаграму</text>
<rect x="810.0" y="132.0" width="480.0" height="58.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="1050.0" y="165.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">send() → EMSGSIZE</tspan></text>
<line x1="1050.0" y1="194.0" x2="1050.0" y2="224.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="230.0" width="480.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1050.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">друга спроба: датаграма</tspan><tspan x="1050.0" dy="18.2">з порожніми даними</tspan></text>
<line x1="1050.0" y1="310.0" x2="1050.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="346.0" width="480.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1050.0" y="379.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">SCM_RIGHTS: рівно один</tspan><tspan x="1050.0" dy="18.2">дескриптор і жодного більше</tspan></text>
<line x1="1050.0" y1="426.0" x2="1050.0" y2="456.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="462.0" width="480.0" height="88.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="1050.0" y="492.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">memfd, запечатаний від змін:</tspan><tspan x="1050.0" dy="18.2">усередині ті самі байти</tspan><tspan x="1050.0" dy="18.2">тією самою розкладкою</tspan></text>
</svg>