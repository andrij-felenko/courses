<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системна таблиця EFI: три гілки з різною тривалістю життя</text>
<text x="222.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">EFI_SYSTEM_TABLE — усе, що дістає точка входу</text>
<text x="942.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що за цим стоїть і скільки воно живе</text>
<rect x="60.0" y="100.0" width="324.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="222.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">ConIn / ConOut</tspan><tspan x="222.0" dy="16.9">готова консоль без драйвера</tspan></text>
<rect x="60.0" y="190.0" width="324.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="222.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">BootServices</tspan><tspan x="222.0" dy="16.9">послуги завантаження</tspan></text>
<rect x="60.0" y="280.0" width="324.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="222.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">RuntimeServices</tspan><tspan x="222.0" dy="16.9">послуги виконання</tspan></text>
<rect x="60.0" y="370.0" width="324.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="222.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">ConfigurationTable[]</tspan><tspan x="222.0" dy="16.9">таблиці налаштувань</tspan></text>
<rect x="552.0" y="165.0" width="780.0" height="72.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="942.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="942.0" dy="0.0">пам'ять · події й таймери · дескриптори та протоколи · запуск образів · вихід</tspan></text>
<text x="942.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зникають у мить ExitBootServices: покажчики стають недійсними</text>
<rect x="552.0" y="285.0" width="780.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="942.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="942.0" dy="0.0">змінні незалежної пам'яті · годинник · перезавантаження · оновлення прошивки</tspan></text>
<text x="942.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лишаються, поки жива система, і переїжджають в адресний простір ядра</text>
<rect x="552.0" y="405.0" width="780.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="942.0" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="942.0" dy="0.0">ACPI · SMBIOS — адреси структур даних, а не функцій</tspan></text>
<text x="942.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ядро перечитує їх і звільняє ту пам'ять, яку дозволено звільнити</text>
<line x1="390.0" y1="222.0" x2="546.0" y2="201.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="312.0" x2="546.0" y2="321.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="402.0" x2="546.0" y2="441.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
