<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві дороги збірки застосунку UEFI і спільний кінець</text>
<rect x="510.0" y="56.0" width="360.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="690.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">hello.c</tspan><tspan x="690.0" dy="16.9">жодного #include &lt;stdio.h&gt;</tspan></text>
<line x1="600.0" y1="108.0" x2="385.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="108.0" x2="1000.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="95.0" y="146.0" width="550.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Дорога 1 — gnu-efi: спершу ELF, потім переклеїти</tspan></text>
<rect x="735.0" y="146.0" width="550.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">Дорога 2 — clang і lld: PE одразу</tspan></text>
<rect x="95.0" y="210.0" width="550.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">gcc -ffreestanding -fshort-wchar -mno-red-zone</tspan><tspan x="370.0" dy="15.6">-fpic -DGNU_EFI_USE_MS_ABI -c hello.c</tspan></text>
<rect x="95.0" y="296.0" width="550.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="330.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">ld -shared -Bsymbolic -T elf_x86_64_efi.lds</tspan><tspan x="370.0" dy="15.6">crt0-efi-x86_64.o hello.o -lefi   →   hello.so (ELF!)</tspan></text>
<rect x="95.0" y="382.0" width="550.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">objcopy --target efi-app-x86_64 hello.so hello.efi</tspan><tspan x="370.0" dy="15.6">секції переносить, підсистему пише 10</tspan></text>
<rect x="735.0" y="210.0" width="550.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">clang -target x86_64-unknown-windows</tspan><tspan x="1010.0" dy="15.6">-ffreestanding -mno-red-zone -c hello.c</tspan></text>
<rect x="735.0" y="296.0" width="550.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="1010.0" y="330.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">lld-link -subsystem:efi_application</tspan><tspan x="1010.0" dy="15.6">-entry:efi_main -nodefaultlib hello.o</tspan></text>
<rect x="735.0" y="382.0" width="550.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1010.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1010.0" dy="0.0">CHAR16 і ms-угода про виклик тут уже рідні:</tspan><tspan x="1010.0" dy="15.6">ціль сама «віндова», окремих ключів не треба</tspan></text>
<line x1="370.0" y1="462.0" x2="560.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="462.0" x2="820.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="474.0" width="780.0" height="68.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="504.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">hello.efi — PE32+ · Subsystem = 10 (застосунок UEFI)</tspan><tspan x="690.0" dy="16.9">AddressOfEntryPoint веде в efi_main, переміщення дають покласти образ будь-куди</tspan></text>
<line x1="560.0" y1="546.0" x2="400.0" y2="568.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="572.0" width="500.0" height="64.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="600.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">розділ EFI, файлова система FAT:</tspan><tspan x="400.0" dy="16.9">\EFI\hello\hello.efi</tspan></text>
<line x1="656.0" y1="604.0" x2="728.0" y2="604.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="735.0" y="572.0" width="500.0" height="64.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="985.0" y="600.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">запуск: UEFI Shell · efibootmgr</tspan><tspan x="985.0" dy="16.9">· QEMU з OVMF</tspan></text>
</svg>