<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід із послуг завантаження: ключ карти пам'яті й стан машини до і після</text>
<text x="700.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">передача керування</text>
<rect x="60.0" y="88.0" width="380.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="250.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">GetMemoryMap → карта і ключ</tspan></text>
<rect x="520.0" y="88.0" width="380.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ExitBootServices(образ, ключ)</tspan></text>
<rect x="980.0" y="88.0" width="360.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1160.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">успіх: машина ваша</tspan></text>
<line x1="446.0" y1="120.0" x2="514.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="906.0" y1="120.0" x2="974.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="152.0" x2="710.0" y2="200.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="710.0" y1="200.0" x2="250.0" y2="200.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="250.0" y1="200.0" x2="250.0" y2="158.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">ключ застарів — карту перечитують, і між читанням та виходом не роблять нічого</text>
<rect x="60.0" y="300.0" width="600.0" height="48.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">поки живуть послуги завантаження</tspan></text>
<rect x="60.0" y="364.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">пам'яттю розпоряджається прошивка</tspan></text>
<rect x="60.0" y="424.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">таймерні події спрацьовують</tspan></text>
<rect x="60.0" y="484.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="514.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">пристроями керують драйвери прошивки</tspan></text>
<rect x="60.0" y="544.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="574.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ConOut малює текст на екрані</tspan></text>
<rect x="740.0" y="300.0" width="600.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1040.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">після виходу</tspan></text>
<rect x="740.0" y="364.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1040.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">пам'ять типів Loader* і BootServices* вільна</tspan></text>
<rect x="740.0" y="424.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1040.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">покажчики на послуги завантаження недійсні</tspan></text>
<rect x="740.0" y="484.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1040.0" y="514.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">консолі немає: друк = чорний екран</tspan></text>
<rect x="740.0" y="544.0" width="600.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1040.0" y="574.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">лишилися послуги виконання й карта пам'яті</tspan></text>
</svg>