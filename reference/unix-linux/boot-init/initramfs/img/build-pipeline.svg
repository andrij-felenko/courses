<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири кроки збирання initramfs і пастка на кожному</text>
<text x="190.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · зібрати</text>
<rect x="40.0" y="72.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">cc -static -O2 -o root/init init.c</tspan><tspan x="190.0" dy="16.9">chmod +x root/init</tspan></text>
<rect x="40.0" y="232.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">лишили динамічне лінкування:</tspan><tspan x="190.0" dy="16.9">Failed to execute /init (error -2)</tspan><tspan x="190.0" dy="16.9">— бракує не /init, а ld-linux.so</tspan></text>
<line x1="344.0" y1="127.0" x2="374.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · скласти дерево</text>
<rect x="380.0" y="72.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">root/proc  root/sys  root/dev</tspan><tspan x="530.0" dy="16.9">nod /dev/console  c 5 1</tspan><tspan x="530.0" dy="16.9">(gen_init_cpio або з-під root)</tspan></text>
<rect x="380.0" y="232.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">немає вузла /dev/console:</tspan><tspan x="530.0" dy="16.9">Warning: unable to open an</tspan><tspan x="530.0" dy="16.9">initial console — і далі жодного</tspan><tspan x="530.0" dy="16.9">рядка від нашого /init</tspan></text>
<line x1="684.0" y1="127.0" x2="714.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="870.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · запакувати</text>
<rect x="720.0" y="72.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="870.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">cd root</tspan><tspan x="870.0" dy="16.9">find . | cpio -o -H newc | zstd</tspan><tspan x="870.0" dy="16.9">&gt; ../initramfs.cpio.zst</tspan></text>
<rect x="720.0" y="232.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">пакували з батьківської теки:</tspan><tspan x="870.0" dy="16.9">усі імена стали root/… ,</tspan><tspan x="870.0" dy="16.9">/init у образі просто немає</tspan></text>
<line x1="1024.0" y1="127.0" x2="1054.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1210.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">4 · запустити</text>
<rect x="1060.0" y="72.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1210.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">qemu-system-x86_64 -kernel bzImage</tspan><tspan x="1210.0" dy="16.9">-initrd initramfs.cpio.zst</tspan><tspan x="1210.0" dy="16.9">-append &quot;console=ttyS0&quot;</tspan></text>
<rect x="1060.0" y="232.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1210.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">забули console=ttyS0:</tspan><tspan x="1210.0" dy="16.9">ядро пише у віртуальний екран,</tspan><tspan x="1210.0" dy="16.9">а термінал мовчить</tspan></text>
<text x="700.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">…і як саме воно ламається</text>
<text x="700.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">усі чотири помилки виглядають майже однаково — машина мовчить або панікує; розрізняє їх лише останній рядок ядра</text>
</svg>