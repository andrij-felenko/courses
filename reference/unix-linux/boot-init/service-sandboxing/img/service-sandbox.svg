<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
    <!-- Тло -->
    <rect width="100%" height="100%" fill="#1e1e2e" />
    
    <!-- Хост ОС -->
    <rect x="50" y="50" width="300" height="300" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
    <text x="200" y="80" fill="#cba6f7" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Хост (Реальна ОС)</text>
    
    <rect x="70" y="110" width="260" height="40" rx="5" fill="#45475a" />
    <text x="200" y="135" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/ (корінь, RW)</text>
    
    <rect x="70" y="170" width="260" height="40" rx="5" fill="#45475a" />
    <text x="200" y="195" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/tmp (спільний)</text>
    
    <rect x="70" y="230" width="260" height="40" rx="5" fill="#45475a" />
    <text x="200" y="255" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/home (домашні теки)</text>
    
    <!-- Стрілка -->
    <path d="M 370 200 L 430 200" stroke="#f38ba8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8" />
        </marker>
    </defs>
    
    <!-- Пісочниця -->
    <rect x="450" y="50" width="300" height="300" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="600" y="80" fill="#a6e3a1" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Служба (systemd Sandbox)</text>
    
    <rect x="470" y="110" width="260" height="40" rx="5" fill="#45475a" />
    <text x="600" y="135" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/ (Read-Only: ProtectSystem)</text>
    
    <rect x="470" y="170" width="260" height="40" rx="5" fill="#45475a" />
    <text x="600" y="195" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/tmp (Ізольований: PrivateTmp)</text>
    
    <rect x="470" y="230" width="260" height="40" rx="5" fill="#45475a" />
    <text x="600" y="255" fill="#cdd6f4" font-family="sans-serif" font-size="14" text-anchor="middle">/home (Порожній: ProtectHome)</text>
</svg>