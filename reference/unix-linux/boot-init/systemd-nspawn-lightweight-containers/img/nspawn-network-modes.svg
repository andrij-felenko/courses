<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережеві режими systemd-nspawn</text>
<rect x="30.0" y="55.0" width="780.0" height="75.0" rx="8" fill="#f4f6f8" stroke="#34495e" stroke-width="2.0"/>
<text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="middle" font-weight="700">Мережевий стек хоста (Host Network Namespace)</text>
<rect x="50.0" y="85.0" width="740.0" height="35.0" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/><text x="420.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Хостові інтерфейси: eth0 (192.168.1.50) · br0 (10.0.0.1) · systemd-networkd</tspan></text>
<rect x="30.0" y="155.0" width="240.0" height="280.0" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">1. Загальний стек</text>
<rect x="42.0" y="195.0" width="216.0" height="50.0" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/><text x="150.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Без прапорів мережі</tspan><tspan x="150.0" dy="14.3">(Default / Direct)</tspan></text>
<rect x="42.0" y="255.0" width="216.0" height="100.0" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/><text x="150.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Контейнер ділить eth0</tspan><tspan x="150.0" dy="14.3">і всі сокети з хостом.</tspan><tspan x="150.0" dy="14.3">Максимальна швидкість,</tspan><tspan x="150.0" dy="14.3">але відсутня ізоляція.</tspan></text>
<rect x="42.0" y="365.0" width="216.0" height="55.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Конфлікти портів</tspan><tspan x="150.0" dy="14.3">з хостовими службами</tspan></text>
<rect x="300.0" y="155.0" width="240.0" height="280.0" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b4f72" text-anchor="middle" font-weight="700">2. Приватна мережа</text>
<rect x="312.0" y="195.0" width="216.0" height="50.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="420.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">--private-network</tspan><tspan x="420.0" dy="14.3">--port=8080:80</tspan></text>
<rect x="312.0" y="255.0" width="216.0" height="100.0" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/><text x="420.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Окремий Network NS.</tspan><tspan x="420.0" dy="14.3">Лише інтерфейс lo.</tspan><tspan x="420.0" dy="14.3">Доступ ззовні тільки</tspan><tspan x="420.0" dy="14.3">через проксі портів.</tspan></text>
<rect x="312.0" y="365.0" width="216.0" height="55.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Повна локальна</tspan><tspan x="420.0" dy="14.3">ізоляція сокетів</tspan></text>
<rect x="570.0" y="155.0" width="240.0" height="280.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="middle" font-weight="700">3. veth пара / міст</text>
<rect x="582.0" y="195.0" width="216.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">--network-veth</tspan><tspan x="690.0" dy="14.3">--network-bridge=br0</tspan></text>
<rect x="582.0" y="255.0" width="216.0" height="100.0" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/><text x="690.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Створюється veth пара:</tspan><tspan x="690.0" dy="14.3">ve-&lt;name&gt; на хості,</tspan><tspan x="690.0" dy="14.3">host0 у контейнері.</tspan><tspan x="690.0" dy="14.3">Авто-DHCP в networkd.</tspan></text>
<rect x="582.0" y="365.0" width="216.0" height="55.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="690.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Повноцінний L2/L3</tspan><tspan x="690.0" dy="14.3">мережевий вузол</tspan></text>
<line x1="150.0" y1="130.0" x2="150.0" y2="155.0" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420.0" y1="130.0" x2="420.0" y2="155.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/>
