<rect x="372.0" y="320.0" width="452.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="598.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">сертифікати й хеші файлів,</tspan><tspan x="598.0" dy="16.9">яким вірять при запуску</tspan></text>
<rect x="856.0" y="320.0" width="300.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1006.0" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1006.0" dy="0.0">підпис одним із KEK</tspan></text>
<rect x="1188.0" y="320.0" width="292.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1334.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1334.0" dy="0.0">при кожному запуску</tspan><tspan x="1334.0" dy="16.9">EFI-програми</tspan></text>
<rect x="40.0" y="432.0" width="300.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="475.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">dbx</tspan><tspan x="190.0" dy="19.5">база заборонених</tspan></text>
<rect x="372.0" y="432.0" width="452.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="598.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">хеші й сертифікати, які відкликано</tspan><tspan x="598.0" dy="16.9">через знайдені вади</tspan></text>
<rect x="856.0" y="432.0" width="300.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1006.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1006.0" dy="0.0">підпис одним із KEK</tspan></text>
<rect x="1188.0" y="432.0" width="292.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1334.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1334.0" dy="0.0">при кожному запуску;</tspan><tspan x="1334.0" dy="16.9">переважає над db</tspan></text>
<rect x="416.6" y="573.0" width="686.9" height="49.9" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="594.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Окремо стоїть MOK: це список ключів власника, яким завідує не прошивка, а shim.</tspan><tspan x="760.0" dy="16.9">Прошивка про нього не знає — тому й вносять туди ключ не з системи, а з екрана MokManager.</tspan></text>
