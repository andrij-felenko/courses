<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1530 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1530" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="190.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">сховище</text>
<text x="598.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що в ньому лежить</text>
<text x="1006.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">хто може змінити</text>
<text x="1334.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">коли працює</text>
<rect x="40.0" y="96.0" width="300.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">PK</tspan><tspan x="190.0" dy="19.5">ключ платформи</tspan></text>
<rect x="372.0" y="96.0" width="452.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="598.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">один ключ власника машини</tspan></text>
<rect x="856.0" y="96.0" width="300.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1006.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1006.0" dy="0.0">лише той, хто тримає</tspan><tspan x="1006.0" dy="16.9">чинний PK</tspan></text>
<rect x="1188.0" y="96.0" width="292.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1334.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1334.0" dy="0.0">лише при зміні KEK</tspan></text>
<rect x="40.0" y="208.0" width="300.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">KEK</tspan><tspan x="190.0" dy="19.5">ключі обміну</tspan></text>
