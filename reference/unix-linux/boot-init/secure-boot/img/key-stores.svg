<rect x="856.0" y="208.0" width="300.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1006.0" y="260.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1006.0" dy="0.0">підпис ключем PK</tspan></text>
