<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">два режими прошивки — і двері між ними</text>
<rect x="40.0" y="96.0" width="520.0" height="330.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="860.0" y="96.0" width="520.0" height="330.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="64.0" y="118.0" width="472.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">режим налаштування</tspan><tspan x="300.0" dy="19.5">PK порожній</tspan></text>
<rect x="64.0" y="194.0" width="472.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">db, KEK і dbx приймають</tspan><tspan x="300.0" dy="16.9">будь-який запис без підпису</tspan></text>
<rect x="64.0" y="276.0" width="472.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">саме тут кладуть усі списки —</tspan><tspan x="300.0" dy="16.9">іншої такої нагоди не буде</tspan></text>
<rect x="64.0" y="358.0" width="472.0" height="54.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">увійти — лише з меню прошивки</tspan></text>
<rect x="884.0" y="118.0" width="472.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1120.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1120.0" dy="0.0">робочий режим</tspan><tspan x="1120.0" dy="19.5">PK встановлено</tspan></text>
<rect x="884.0" y="194.0" width="472.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1120.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">запис приймають лише як .auth,</tspan><tspan x="1120.0" dy="16.9">підписаний рівнем вище</tspan></text>
<rect x="884.0" y="276.0" width="472.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1120.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">db і KEK — підписом KEK або PK,</tspan><tspan x="1120.0" dy="16.9">сам PK — лише чинним PK</tspan></text>
<rect x="884.0" y="358.0" width="472.0" height="54.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1120.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">вийти — лише стерши PK з меню</tspan></text>
<line x1="576.0" y1="240.0" x2="844.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">вносимо PK</text>
<line x1="844.0" y1="320.0" x2="576.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">стираємо PK з меню</text>
<text x="710.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок внесення, поки машина в режимі налаштування</text>
<rect x="190.0" y="502.0" width="200.0" height="64.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/><text x="290.0" y="529.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">dbx</tspan><tspan x="290.0" dy="18.2">чужі заборони</tspan></text>
<rect x="470.0" y="502.0" width="200.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/><text x="570.0" y="529.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">db</tspan><tspan x="570.0" dy="18.2">чуже + своє</tspan></text>
<rect x="750.0" y="502.0" width="200.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/><text x="850.0" y="529.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">KEK</tspan><tspan x="850.0" dy="18.2">чуже + своє</tspan></text>
<rect x="1030.0" y="502.0" width="200.0" height="64.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.4"/><text x="1130.0" y="529.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1130.0" dy="0.0">PK</tspan><tspan x="1130.0" dy="18.2">лише своє</tspan></text>
<line x1="398.0" y1="534.0" x2="462.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="678.0" y1="534.0" x2="742.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="958.0" y1="534.0" x2="1022.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="403.6" y="593.0" width="612.8" height="49.9" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="614.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Поки PK порожній, кожен із цих записів безкоштовний.</tspan><tspan x="710.0" dy="16.9">Щойно ліг PK — прошивка вимагає підпис навіть від того, хто його щойно поставив.</tspan></text>
</svg>