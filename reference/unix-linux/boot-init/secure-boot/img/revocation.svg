<text x="360.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">заборона за хешем (dbx)</text>
<text x="1060.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">заборона за поколінням (SBAT)</text>
<rect x="80.0" y="130.0" width="560.0" height="66.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">один запис на кожен поганий файл</tspan></text>
<rect x="80.0" y="216.0" width="560.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">хеш образу GRUB дистрибутива A, версія 2.04</tspan></text>
<rect x="80.0" y="272.0" width="560.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">хеш образу GRUB дистрибутива A, версія 2.06</tspan></text>
<rect x="80.0" y="328.0" width="560.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">хеш образу GRUB дистрибутива B, версія 2.04</tspan></text>
<rect x="80.0" y="384.0" width="560.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="411.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">…і так далі — близько 150 записів на одну ваду</tspan></text>
<rect x="780.0" y="130.0" width="560.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">один рядок на весь компонент</tspan></text>
<rect x="780.0" y="216.0" width="560.0" height="66.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1060.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">усередині кожної збірки: «grub, покоління 4»</tspan></text>
<rect x="780.0" y="298.0" width="560.0" height="66.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1060.0" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">у змінній машини: «grub — не нижче 4»</tspan></text>
<rect x="780.0" y="380.0" width="560.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1060.0" y="417.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">усі старіші збірки всіх дистрибутивів відпадають разом</tspan></text>
<text x="360.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перевіряє прошивка · оновлюють через прошивку</text>
<text x="1060.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перевіряє shim · оновлюють пакунком</text>
<rect x="322.1" y="527.0" width="775.8" height="49.9" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">У прошивці типово близько 32 кБ під усі змінні — а одна подія 2020 року з'їла приблизно 10 кБ.</tspan><tspan x="710.0" dy="16.9">Саме скінченність цієї пам'яті, а не складність криптографії, змусила шукати інший спосіб відкликання.</tspan></text>
