<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні вмикання неблокуючого режиму</text>
<text x="160.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">де вмикають</text>
<text x="505.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чим саме</text>
<text x="835.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">кого зачіпає</text>
<rect x="24.0" y="52.0" width="272.0" height="92.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">при створенні</tspan><tspan x="160.0" dy="16.9">дескриптора</tspan></text>
<rect x="316.0" y="52.0" width="382.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="507.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="507.0" dy="0.0">socket(AF_INET, SOCK_STREAM | SOCK_NONBLOCK, 0)</tspan><tspan x="507.0" dy="14.3">accept4(lfd, NULL, NULL, SOCK_NONBLOCK)</tspan><tspan x="507.0" dy="14.3">pipe2(fd, O_NONBLOCK)</tspan><tspan x="507.0" dy="14.3">open(path, O_RDONLY | O_NONBLOCK)</tspan></text>
<rect x="718.0" y="52.0" width="238.0" height="92.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="837.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="837.0" dy="0.0">опис відкритого файлу —</tspan><tspan x="837.0" dy="15.6">від першої миті життя</tspan></text>
<rect x="24.0" y="160.0" width="272.0" height="92.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">на вже відкритому</tspan><tspan x="160.0" dy="16.9">дескрипторі</tspan></text>
<rect x="316.0" y="160.0" width="382.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="507.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="507.0" dy="0.0">f = fcntl(fd, F_GETFL, 0);</tspan><tspan x="507.0" dy="14.3">fcntl(fd, F_SETFL, f | O_NONBLOCK);</tspan></text>
<rect x="718.0" y="160.0" width="238.0" height="92.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="837.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="837.0" dy="0.0">той самий опис —</tspan><tspan x="837.0" dy="15.6">разом з усіма, хто його ділить</tspan></text>
<rect x="24.0" y="268.0" width="272.0" height="92.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">на один виклик</tspan></text>
<rect x="316.0" y="268.0" width="382.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="507.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="507.0" dy="0.0">recv(fd, buf, n, MSG_DONTWAIT)</tspan><tspan x="507.0" dy="14.3">preadv2(fd, iov, 1, -1, RWF_NOWAIT)</tspan></text>
<rect x="718.0" y="268.0" width="238.0" height="92.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="837.0" y="310.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="837.0" dy="0.0">нікого: спільний опис</tspan><tspan x="837.0" dy="15.6">лишається недоторканим</tspan></text>
</svg>