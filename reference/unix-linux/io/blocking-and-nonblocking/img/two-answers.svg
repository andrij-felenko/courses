<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокуючий і неблокуючий режим очікування</text>
<text x="24.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">блокуючий</text>
<rect x="200.0" y="62.0" width="120.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="92.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">read()</tspan></text>
<rect x="324.0" y="62.0" width="356.0" height="52.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="502.0" y="84.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="502.0" dy="0.0">задача спить у черзі очікування</tspan><tspan x="502.0" dy="16.9">0 % процесора, потік зайнятий</tspan></text>
<rect x="684.0" y="62.0" width="232.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">повертає n байтів</tspan></text>
<text x="684.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дані прийшли — драйвер будить чергу</text>
<line x1="684.0" y1="38.0" x2="684.0" y2="58.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="24.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">неблокуючий</text>
<rect x="200.0" y="152.0" width="120.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">read()</tspan></text>
<rect x="324.0" y="152.0" width="128.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="388.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">EAGAIN</tspan></text>
<rect x="456.0" y="152.0" width="224.0" height="52.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="568.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="568.0" dy="0.0">потік працює</tspan><tspan x="568.0" dy="15.6">з іншими дескрипторами</tspan></text>
<rect x="684.0" y="152.0" width="232.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">read() → n байтів</tspan></text>
<rect x="200.0" y="236.0" width="716.0" height="54.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="558.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="558.0" dy="0.0">у неблокуючому режимі одне засинання обслуговує сотні дескрипторів:</tspan><tspan x="558.0" dy="16.9">потік спить не в read(), а в очікуванні готовності</tspan></text>
</svg>