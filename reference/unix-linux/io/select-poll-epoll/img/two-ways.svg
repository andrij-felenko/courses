<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 536" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="536" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи дізнатися, які дескриптори готові</text>
<rect x="24.0" y="20.0" width="452.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">select і poll: питаємо на кожному виклику</tspan></text>
<rect x="524.0" y="20.0" width="452.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="46.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">epoll: джерело доповідає в мить події</tspan></text>
<rect x="24.0" y="80.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">виклик: увесь список дескрипторів</tspan><tspan x="250.0" dy="15.6">перетинає межу в ядро</tspan></text>
<rect x="524.0" y="80.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">epoll_ctl(ADD), одноразово:</tspan><tspan x="750.0" dy="15.6">epitem у червоно-чорному дереві</tspan></text>
<line x1="250.0" y1="144.0" x2="250.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="750.0" y1="144.0" x2="750.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24.0" y="160.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ядро обходить кожен файл зі списку:</tspan><tspan x="250.0" dy="15.6">запис у чергу очікування + поточна маска</tspan></text>
<rect x="524.0" y="160.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">разом із ним — зворотний виклик,</tspan><tspan x="750.0" dy="15.6">вставлений у чергу очікування файлу</tspan></text>
<line x1="250.0" y1="224.0" x2="250.0" y2="238.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="750.0" y1="224.0" x2="750.0" y2="238.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24.0" y="240.0" width="452.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="266.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">задача спить</tspan></text>
<rect x="524.0" y="240.0" width="452.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="266.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">задача спить</tspan></text>
<line x1="250.0" y1="286.0" x2="250.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="750.0" y1="286.0" x2="750.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24.0" y="302.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="329.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">пробудження від будь-якого одного —</tspan><tspan x="250.0" dy="15.6">і ядро обходить увесь список ще раз</tspan></text>
<rect x="524.0" y="302.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">прийшли байти → драйвер будить чергу →</tspan><tspan x="750.0" dy="15.6">зворотний виклик кладе epitem</tspan><tspan x="750.0" dy="15.6">у список готових</tspan></text>
<line x1="250.0" y1="366.0" x2="250.0" y2="380.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="750.0" y1="366.0" x2="750.0" y2="380.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="24.0" y="382.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="409.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">увесь список результатів</tspan><tspan x="250.0" dy="15.6">перетинає межу назад</tspan></text>
<rect x="524.0" y="382.0" width="452.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="409.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">epoll_wait забирає</tspan><tspan x="750.0" dy="15.6">сам лише список готових</tspan></text>
<rect x="24.0" y="468.0" width="452.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">робота ядра ∝ довжині списку,</tspan><tspan x="250.0" dy="16.9">а не кількості подій</tspan></text>
<rect x="524.0" y="468.0" width="452.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">робота ядра ∝ кількості подій,</tspan><tspan x="750.0" dy="16.9">а не довжині списку</tspan></text>
</svg>