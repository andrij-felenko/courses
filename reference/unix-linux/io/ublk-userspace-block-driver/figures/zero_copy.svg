<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <rect width="800" height="600" fill="#ffffff"/>
    <rect x="100" y="50" width="600" height="500" fill="none" stroke="#333333" stroke-width="2"/>
    <text x="400" y="90" text-anchor="middle" font-size="24" font-weight="bold">Zero-Copy Data Flow in ublk</text>

    <!-- Process -->
    <circle cx="200" cy="200" r="40" fill="#ffcc80" stroke="#ef6c00" stroke-width="2"/>
    <text x="200" y="205" text-anchor="middle" font-size="16">App</text>
    
    <!-- Kernel Buffer -->
    <rect x="350" y="160" width="100" height="80" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
    <text x="400" y="205" text-anchor="middle" font-size="14">Kernel Pages</text>
    
    <!-- Target -->
    <circle cx="600" cy="200" r="40" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
    <text x="600" y="205" text-anchor="middle" font-size="16">ublksrv</text>

    <path d="M 240 200 L 350 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow-black)"/>
    <path d="M 450 200 L 560 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow-black)"/>
    <text x="505" y="190" font-size="12" text-anchor="middle">mapped via bvec</text>

    <!-- Hardware -->
    <rect x="300" y="400" width="200" height="80" fill="#e0e0e0" stroke="#616161" stroke-width="2"/>
    <text x="400" y="445" text-anchor="middle" font-size="16">Physical Device (NVMe)</text>
    
    <path d="M 400 240 L 400 400" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-black)"/>
    <text x="410" y="320" font-size="14">DMA Transfer</text>

    <defs>
        <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
    </defs>
</svg>