<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 845.52 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="845.52" height="470" fill="#ffffff"/>
