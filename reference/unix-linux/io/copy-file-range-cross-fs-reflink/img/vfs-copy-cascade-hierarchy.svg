<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадна ієрархія copy_file_range</text>
<rect x="10.0" y="10.0" width="780.0" height="440.0" rx="8" fill="#fafafa" stroke="#d0d0d0" stroke-width="1.5"/>
<rect x="120.3" y="12.5" width="559.4" height="35.0" rx="6" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5"/><text x="400.0" y="42.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Каскадна ієрархія виконання copy_file_range() у ядрі Linux</tspan></text>
<rect x="184.8" y="48.5" width="430.4" height="43.0" rx="4" fill="#f0f7ff" stroke="#3b82f6" stroke-width="1.5"/><text x="400.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Системний виклик copy_file_range(fd_in, off_in, fd_out, off_out, len, 0)</tspan><tspan x="400.0" dy="13.0">VFS: sys_copy_file_range() -&gt; vfs_copy_file_range()</tspan></text>
<line x1="400.0" y1="95.0" x2="400.0" y2="120.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="193.4" y="118.5" width="413.3" height="43.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="400.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Рівень 1: Reflink / Extent Cloning (sb_in == sb_out)</tspan><tspan x="400.0" dy="13.0">Вказівник file_in-&gt;f_op-&gt;remap_file_range (CoW на рівні метаданих ФС)</tspan></text>
<line x1="400.0" y1="165.0" x2="400.0" y2="190.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="415.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Якщо rfr не підтримується або sb_in != sb_out (Cross-FS)</text>
<rect x="193.4" y="188.5" width="413.3" height="43.0" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="400.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Рівень 2: Хук ФС file_in-&gt;f_op-&gt;copy_file_range</tspan><tspan x="400.0" dy="13.0">Server-Side Copy (NFS v4.2 SSC, SMB3 CopyChunk) / Cross-Mount Offload</tspan></text>
<line x1="400.0" y1="235.0" x2="400.0" y2="260.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="415.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Якщо f_op-&gt;copy_file_range = NULL</text>
<rect x="216.2" y="258.5" width="367.7" height="43.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Рівень 3: Апаратний Offload блочного шару (blkdev_issue_copy)</tspan><tspan x="400.0" dy="13.0">NVMe Simple Copy (TP 4040) / SCSI EXTENDED COPY (XCOPY)</tspan></text>
<line x1="400.0" y1="305.0" x2="400.0" y2="330.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="415.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">Якщо апаратний offload не підтримується</text>
<rect x="170.6" y="338.5" width="458.9" height="43.0" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="400.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Рівень 4: Універсальний фолбек ядра (generic_copy_file_range)</tspan><tspan x="400.0" dy="13.0">Передача байтів через Kernel Page Cache за допомогою splice_direct_to_actor()</tspan></text>
<text x="670.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start" font-weight="700">-&gt; Повернення (0 байт I/O)</text>
<text x="670.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c2410c" text-anchor="start" font-weight="700">-&gt; Повернення (Offload без CPU)</text>
<text x="670.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="start" font-weight="700">-&gt; Повернення (PCIe Direct Copy)</text>
<text x="670.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="start" font-weight="700">-&gt; Повернення (DRAM / PageCache)</text>
</svg>