<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл прибирання сміття (GC) та Zone Reset у f2fs</text>
<rect x="35.0" y="55.0" width="140.0" height="180.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="105.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Зона-жертва</text>
<text x="105.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Зона містить застарілі</tspan><tspan x="105.0" dy="14.3">та дійсні блоки</tspan></text>
<line x1="177.0" y1="145.0" x2="233.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="235.0" y="55.0" width="140.0" height="180.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="305.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Міграція GC</text>
<text x="305.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Дійсні блоки читаються</tspan><tspan x="305.0" dy="14.3">й пишуться в відкриту зону</tspan></text>
<line x1="377.0" y1="145.0" x2="433.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="435.0" y="55.0" width="140.0" height="180.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="505.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. BLKRESETZONE</text>
<text x="505.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">f2fs надсилає команду</tspan><tspan x="505.0" dy="14.3">Zone Reset в ZNS</tspan></text>
<line x1="577.0" y1="145.0" x2="633.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="635.0" y="55.0" width="140.0" height="180.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="705.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Чиста зона</text>
<text x="705.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Write Pointer = 0</tspan><tspan x="705.0" dy="14.3">Зона готова до запису</tspan></text>
<text x="410.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Цикл вивільнення зони хостом позбавляє накопичувач фонового FTL GC</text>
</svg>