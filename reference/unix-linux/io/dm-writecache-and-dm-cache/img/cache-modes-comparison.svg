<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння режимів роботи кешу на блоковому рівні</text>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи обробки запису: Writeback, Writethrough та Passthrough</text>
<rect x="60.0" y="80.0" width="340.0" height="500.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режим Writeback</text>
<text x="230.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Максимальна швидкість запису</text>
<line x1="80.0" y1="140.0" x2="380.0" y2="140.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="80.0" y="170.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Додаток робить write()</tspan></text>
<rect x="80.0" y="240.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2. Запис у SSD кеш</tspan></text>
<rect x="80.0" y="310.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">3. Повернення успіху в VFS</tspan></text>
<rect x="80.0" y="410.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="431.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">4. Фоновий flush брудних</tspan><tspan x="230.0" dy="15.0">блоків на Origin HDD</tspan></text>
<rect x="80.0" y="510.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="230.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Ризик: втрата брудних блоків</tspan><tspan x="230.0" dy="15.0">при аварії SSD</tspan></text>
<rect x="430.0" y="80.0" width="340.0" height="500.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="600.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режим Writethrough</text>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Надійність і прискорення читань</text>
<line x1="450.0" y1="140.0" x2="750.0" y2="140.0" stroke="#2457d6" stroke-width="1.2"/>
<rect x="450.0" y="170.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Додаток робить write()</tspan></text>
<rect x="450.0" y="240.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="261.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">2. Паралельний запис у</tspan><tspan x="600.0" dy="15.0">SSD кеш ТА Origin HDD</tspan></text>
<rect x="450.0" y="340.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="361.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. Чекаємо завершення</tspan><tspan x="600.0" dy="15.0">обох пристроїв</tspan></text>
<rect x="450.0" y="410.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">4. Повернення успіху в VFS</tspan></text>
<rect x="450.0" y="510.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="600.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Надійність: HDD завжди</tspan><tspan x="600.0" dy="15.0">містить актуальні дані</tspan></text>
<rect x="800.0" y="80.0" width="340.0" height="500.0" rx="8" fill="#f1f2f4" stroke="#333333" stroke-width="1.8"/>
<text x="970.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режим Passthrough</text>
<text x="970.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обхід кешу (байпас)</text>
<line x1="820.0" y1="140.0" x2="1120.0" y2="140.0" stroke="#333333" stroke-width="1.2"/>
<rect x="820.0" y="170.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="970.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">1. Додаток робить write()</tspan></text>
<rect x="820.0" y="250.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="970.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">2. Прямий запис на Origin HDD</tspan><tspan x="970.0" dy="15.0">(кеш оминається)</tspan></text>
<rect x="820.0" y="350.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="970.0" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">3. Інвалідація застарілих</tspan><tspan x="970.0" dy="15.0">блоків у SSD кеші</tspan></text>
<rect x="820.0" y="430.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="970.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">4. Повернення успіху в VFS</tspan></text>
<rect x="820.0" y="510.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="970.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Використання: масовий бекап,</tspan><tspan x="970.0" dy="15.0">щоб не вимивати кеш</tspan></text>
</svg>