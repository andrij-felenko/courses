<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невирівняний запит потребує читання-підміни-запису, а прямому шляху нема де це зробити</text>
<text x="600.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">запит: 5000 байтів із зміщення 100 000, логічний блок 4096</text>
