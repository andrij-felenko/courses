<text x="90.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="90.0" dy="0.0">Перший і останній сектори потрібні не цілком. Щоб записати таку ділянку,</tspan></text>
<text x="90.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="90.0" dy="0.0">хтось мусить прочитати сектор, підмінити в ньому частину й записати назад.</tspan></text>
