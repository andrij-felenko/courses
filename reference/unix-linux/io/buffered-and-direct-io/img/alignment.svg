<rect x="630.0" y="420.0" width="470.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">прямий шлях</tspan><tspan x="865.0" dy="16.2"></tspan><tspan x="865.0" dy="16.2">такого місця немає зовсім,</tspan><tspan x="865.0" dy="16.2">тому запит мусить прийти</tspan><tspan x="865.0" dy="16.2">вирівняним уже готовим</tspan></text>
<text x="600.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вирівняний запит: зміщення 98 304, довжина 8192, адреса буфера кратна 4096</text>
