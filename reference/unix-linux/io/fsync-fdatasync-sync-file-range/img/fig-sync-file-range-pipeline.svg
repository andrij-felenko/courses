<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асинхронний конвеєр sync_file_range та фінальне очищення кешу накопичувача</text>
<text x="600.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комбінації прапорців sync_file_range та конвеєризація скидання</text>
<rect x="80.0" y="90.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#eaf0fd" stroke-width="1.6"/>
<text x="250.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">SYNC_FILE_RANGE_WAIT_BEFORE</text>
<text x="250.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">чекає завершення попереднього В/В</text>
<rect x="430.0" y="90.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#eaf0fd" stroke-width="1.6"/>
<text x="600.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">SYNC_FILE_RANGE_WRITE</text>
<text x="600.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">запускає асинхронний запис брудних сторінок</text>
<rect x="780.0" y="90.0" width="340.0" height="60.0" rx="6" fill="#fbfcff" stroke="#eaf0fd" stroke-width="1.6"/>
<text x="950.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">SYNC_FILE_RANGE_WAIT_AFTER</text>
<text x="950.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">чекає виштовхування відправлених сторінок</text>
<rect x="80.0" y="180.0" width="1040.0" height="380.0" rx="6" fill="#fdf3e7" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="288.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Практичний патерн конвеєризації в базах даних (Asynchronous Page Flushing Pipeline):</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Крок 1: Фоновий потік генерує брудні сторінки та викликає sync_file_range(fd, off, len, SYNC_FILE_RANGE_WRITE).</tspan><tspan x="600.0" dy="15.6">        -&gt; Запит на запис відправляється до блокового шару НЕ БЛОКУЮЧИ потік виконання.</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Крок 2: Потік продовжує виконувати інші обчислення, поки контролер диска виконує DMA-передачу.</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Крок 3: Перед фіксацією транзакції потік викликає sync_file_range(fd, off, len, SYNC_FILE_RANGE_WAIT_BEFORE | WRITE | WAIT_AFTER).</tspan><tspan x="600.0" dy="15.6">        -&gt; Очікування триває мінімальний час, бо сторінки ВЖЕ виштовхувалися під час Кроку 1 та 2!</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Крок 4 (ОБОВ'ЯЗКОВИЙ): fdatasync(fd) або fsync(fd) для видачі FLUSH на носій.</tspan><tspan x="600.0" dy="15.6">        -&gt; Скидає волатильний DRAM-кеш накопичувача й гарантує долговічність при аварійному вимкненні!</tspan></text>
</svg>