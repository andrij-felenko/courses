<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різниця між fsync та fdatasync при перезаписі та розширенні файла</text>
<text x="600.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння fsync та fdatasync: перезапис блока проти розширення файла</text>
<rect x="80.0" y="90.0" width="480.0" height="210.0" rx="8" fill="#fbfcff" stroke="#eaf0fd" stroke-width="1.8"/>
<text x="320.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сценарій А: Перезапис в межах наявного блока</text>
<text x="320.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Розмір файла не змінився, нові блоки не виділялися</text>
<rect x="100.0" y="165.0" width="440.0" height="55.0" rx="6" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fdatasync(fd)</tspan><tspan x="320.0" dy="14.3">• 1 операція В/В: сторінка даних -&gt; диск + FLUSH</tspan><tspan x="320.0" dy="14.3">• st_mtime оновлюється лише в ОЗП (dirty inode)</tspan></text>
<rect x="100.0" y="230.0" width="440.0" height="55.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fsync(fd)</tspan><tspan x="320.0" dy="14.3">• 2+ операції В/В: сторінка даних + транзакція журналу ФС</tspan><tspan x="320.0" dy="14.3">• запис метаданих inode на диск обов'язковий</tspan></text>
<rect x="640.0" y="90.0" width="480.0" height="210.0" rx="8" fill="#fbfcff" stroke="#eaf0fd" stroke-width="1.8"/>
<text x="880.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сценарій Б: Запис із розширенням файла (append)</text>
<text x="880.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Змінився i_size або виділено нові екстенти</text>
<rect x="660.0" y="165.0" width="440.0" height="55.0" rx="6" fill="#fdf3e7" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">fdatasync(fd)</tspan><tspan x="880.0" dy="14.3">• 2 операції В/В: сторінка даних + новий i_size / екстент</tspan><tspan x="880.0" dy="14.3">• i_size істотний для зчитування нових байтів!</tspan></text>
<rect x="660.0" y="230.0" width="440.0" height="55.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">fsync(fd)</tspan><tspan x="880.0" dy="14.3">• 2+ операції В/В: сторінка даних + повні метадані inode + журнал</tspan><tspan x="880.0" dy="14.3">• повністю ідентична поведінка щодо збереження i_size</tspan></text>
<rect x="80.0" y="330.0" width="1040.0" height="260.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Чому fdatasync швидший при перезаписі наявних блоків (In-place Overwrite):</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">1. Журнальні файлові системи (ext4, xfs) при кожній зміні файлу змінюють мітку часу st_mtime в inode.</tspan><tspan x="600.0" dy="15.6">2. Для fsync(fd) зміна st_mtime вважається зміною метаданих, яка ВИМАГАЄ транзакції в журналі (journal commit).</tspan><tspan x="600.0" dy="15.6">3. Для fdatasync(fd) зміна st_mtime НЕ є істотною для читання даних, тому запис у журнал пропускається.</tspan><tspan x="600.0" dy="15.6">4. Результат: fdatasync заощаджує цілу дискову транзакцію та затримку позиціонування голівки/блокування транзакції!</tspan></text>
</svg>