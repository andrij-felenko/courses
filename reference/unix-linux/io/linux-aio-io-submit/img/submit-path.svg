<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">io_submit(): робота відбувається на вашому потоці, не в черзі</text>
<rect x="20.0" y="70.0" width="270.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">шлях файлової системи</tspan><tspan x="155.0" dy="15.6">(кеш сторінок або метадані)</tspan></text>
<rect x="340.0" y="70.0" width="270.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">блоковий шар</tspan><tspan x="475.0" dy="15.6">(слот у черзі пристрою)</tspan></text>
<rect x="660.0" y="70.0" width="270.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">передано контролеру:</tspan><tspan x="795.0" dy="15.6">повернуто -EIOCBQUEUED</tspan></text>
<line x1="294.0" y1="100.0" x2="336.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="614.0" y1="100.0" x2="656.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="155.0" y1="134.0" x2="155.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="176.0" width="270.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">спить, якщо:</tspan><tspan x="155.0" dy="15.6">потрібної сторінки немає в кеші;</tspan><tspan x="155.0" dy="15.6">брудних сторінок дійшло до межі;</tspan><tspan x="155.0" dy="15.6">вузол дерева екстентів не в пам'яті</tspan></text>
<line x1="475.0" y1="134.0" x2="475.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="176.0" width="270.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">спить, якщо:</tspan><tspan x="475.0" dy="15.6">вільного слоту в черзі</tspan><tspan x="475.0" dy="15.6">пристрою немає — чекає,</tspan><tspan x="475.0" dy="15.6">доки хтось звільнить</tspan></text>
<rect x="660.0" y="176.0" width="270.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="212.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">лише дійшовши сюди,</tspan><tspan x="795.0" dy="15.6">виклик повертається,</tspan><tspan x="795.0" dy="15.6">не дочекавшись даних</tspan></text>
<rect x="20.0" y="306.0" width="910.0" height="62.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="333.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">усе, що ліворуч від правої колонки, — синхронне: доки потік спить там, він нічого не подає,</tspan><tspan x="475.0" dy="15.6">тож фактична глибина черги дорівнює темпу подання, помноженому на затримку носія</tspan></text>
</svg>