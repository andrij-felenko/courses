<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що стоїть за дескриптором файлу і за дескриптором сокета</text>
<rect x="290.0" y="18.0" width="400.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="38.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">таблиця дескрипторів процесу</tspan><tspan x="490.0" dy="16.9">fd 3 → struct file</tspan></text>
<line x1="490.0" y1="66.0" x2="490.0" y2="88.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="270.0" y="90.0" width="440.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">struct file: прапорці, лічильник посилань,</tspan><tspan x="490.0" dy="16.9">вказівник на таблицю операцій</tspan></text>
<line x1="400.0" y1="138.0" x2="240.0" y2="178.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="580.0" y1="138.0" x2="740.0" y2="178.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="60.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">звичайний файл</text>
<rect x="60.0" y="180.0" width="350.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">операції файлової системи</tspan></text>
<rect x="60.0" y="236.0" width="350.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">inode → кеш сторінок → диск</tspan></text>
<rect x="60.0" y="292.0" width="350.0" height="56.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">вміст лежить увесь і чекає:</tspan><tspan x="235.0" dy="16.9">є позиція, працює lseek</tspan></text>
<text x="570.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">сокет</text>
<rect x="570.0" y="180.0" width="350.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">операції сокета</tspan></text>
<rect x="570.0" y="236.0" width="350.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">стан протоколу й мережевий стек</tspan></text>
<rect x="570.0" y="292.0" width="350.0" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">буфер прийому · буфер передачі</tspan><tspan x="745.0" dy="16.9">позиції немає, lseek → ESPIPE</tspan></text>
<rect x="60.0" y="366.0" width="860.0" height="52.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="388.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">усе вище таблиці операцій спільне: dup, close, fcntl, fork, epoll</tspan><tspan x="490.0" dy="16.9">розходження починається рівно з неї</tspan></text>
</svg>