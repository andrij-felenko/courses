<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1000 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1000" height="380" fill="#ffffff"/>
