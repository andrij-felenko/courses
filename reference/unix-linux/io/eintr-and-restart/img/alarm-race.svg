<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="507.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перегони тайм-ауту на SIGALRM</text>
<text x="260.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">як прийом працює майже завжди</text>
<text x="745.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">а як він зривається</text>
<rect x="40.0" y="50.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">alarm(1) — таймер заведено</tspan></text>
<rect x="530.0" y="50.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">alarm(1) — таймер заведено</tspan></text>
<rect x="40.0" y="112.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">read() входить у ядро й засинає</tspan></text>
<rect x="530.0" y="112.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="135.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">процес витіснено з процесора</tspan><tspan x="750.0" dy="15.6">довше ніж на секунду</tspan></text>
<rect x="40.0" y="174.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">через секунду ядро доставляє SIGALRM</tspan></text>
<rect x="530.0" y="174.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">SIGALRM доставлено ЩЕ ДО входу в read()</tspan></text>
<rect x="40.0" y="236.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">обробник ставить прапорець,</tspan><tspan x="260.0" dy="15.6">сплячий виклик перервано</tspan></text>
<rect x="530.0" y="236.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">обробник ставить прапорець,</tspan><tspan x="750.0" dy="15.6">але переривати ще нема чого</tspan></text>
<rect x="40.0" y="298.0" width="440.0" height="56.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">read() → −1, errno = EINTR:</tspan><tspan x="260.0" dy="16.9">тайм-аут спрацював вчасно</tspan></text>
<rect x="530.0" y="298.0" width="440.0" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">read() входить у ядро й спить</tspan><tspan x="750.0" dy="16.9">без жодного обмеження часу</tspan></text>
<rect x="40.0" y="368.0" width="930.0" height="46.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="505.0" y="395.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">проміжок між обробником і входом у ядро з простору користувача закрити нічим</tspan></text>
</svg>