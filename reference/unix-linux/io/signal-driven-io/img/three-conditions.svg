<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 422" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="422" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три умови народження сигналу про готовність</text>
<rect x="30.0" y="26.0" width="250.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="50.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">умова</tspan></text>
<rect x="300.0" y="26.0" width="320.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="50.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">як вмикають</tspan></text>
<rect x="640.0" y="26.0" width="330.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="50.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">якщо забути</tspan></text>
<rect x="30.0" y="90.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">кому слати</tspan></text>
<rect x="300.0" y="90.0" width="320.0" height="64.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">fcntl(fd, F_SETOWN, getpid())</tspan><tspan x="460.0" dy="15.6">запис лягає в опис відкритого файлу</tspan></text>
<rect x="640.0" y="90.0" width="330.0" height="64.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">власник = 0:</tspan><tspan x="805.0" dy="15.6">сигнал народжується й зникає</tspan></text>
<rect x="30.0" y="170.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">чи слати взагалі</tspan></text>
<rect x="300.0" y="170.0" width="320.0" height="64.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="198.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">fcntl(fd, F_SETFL, fl | O_ASYNC)</tspan><tspan x="460.0" dy="15.6">через open прапорець не ставиться</tspan></text>
<rect x="640.0" y="170.0" width="330.0" height="64.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="198.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">сигналів немає зовсім,</tspan><tspan x="805.0" dy="15.6">програма чекає марно</tspan></text>
<rect x="30.0" y="250.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="286.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">що станеться на приході</tspan></text>
<rect x="300.0" y="250.0" width="320.0" height="64.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">обробник або блокування сигналу —</tspan><tspan x="460.0" dy="15.6">до ввімкнення O_ASYNC</tspan></text>
<rect x="640.0" y="250.0" width="330.0" height="64.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">типова дія SIGIO в Linux —</tspan><tspan x="805.0" dy="15.6">завершити процес</tspan></text>
<rect x="30.0" y="336.0" width="940.0" height="56.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">порядок важить: спершу власник, потім O_ASYNC — інакше подія,</tspan><tspan x="500.0" dy="16.9">що трапиться між двома викликами fcntl, пропаде безслідно</tspan></text>
</svg>