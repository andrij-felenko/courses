<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1040 478" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1040" height="478" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкий шлях і запасний шлях одного циклу</text>
<rect x="30.0" y="24.0" width="960.0" height="38.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="47.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">звичайний хід: подія помістилася в чергу ядра</tspan></text>
<rect x="30.0" y="76.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="138.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">sigwaitinfo() віддає</tspan><tspan x="138.0" dy="15.6">SIGRTMIN+1</tspan></text>
<rect x="278.0" y="76.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="386.0" y="112.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="386.0" dy="0.0">si_fd — котрий дескриптор,</tspan><tspan x="386.0" dy="15.6">si_band — те саме кодування,</tspan><tspan x="386.0" dy="15.6">що revents у poll</tspan></text>
<rect x="526.0" y="76.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="634.0" y="112.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="634.0" dy="0.0">read на одному дескрипторі</tspan><tspan x="634.0" dy="15.6">доки не EAGAIN,</tspan><tspan x="634.0" dy="15.6">відповідь тим же write</tspan></text>
<rect x="774.0" y="76.0" width="216.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="882.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="882.0" dy="0.0">робота пропорційна</tspan><tspan x="882.0" dy="15.6">кількості подій</tspan></text>
<line x1="250.0" y1="124.0" x2="274.0" y2="124.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="498.0" y1="124.0" x2="522.0" y2="124.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746.0" y1="124.0" x2="770.0" y2="124.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="196.0" width="960.0" height="38.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="219.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">черга вперлася в RLIMIT_SIGPENDING</tspan></text>
<rect x="30.0" y="248.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="138.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="138.0" dy="0.0">sigwaitinfo() віддає</tspan><tspan x="138.0" dy="15.6">звичайний SIGIO</tspan></text>
<rect x="278.0" y="248.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="386.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="386.0" dy="0.0">адреси немає:</tspan><tspan x="386.0" dy="15.6">частину подій утрачено,</tspan><tspan x="386.0" dy="15.6">стан невідомий</tspan></text>
<rect x="526.0" y="248.0" width="216.0" height="96.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="634.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="634.0" dy="0.0">sigtimedwait з нульовим часом —</tspan><tspan x="634.0" dy="14.3">викинути стале з черги,</tspan><tspan x="634.0" dy="14.3">далі poll по всіх дескрипторах</tspan></text>
<rect x="774.0" y="248.0" width="216.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="882.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="882.0" dy="0.0">робота пропорційна</tspan><tspan x="882.0" dy="15.6">кількості з'єднань</tspan></text>
<line x1="250.0" y1="296.0" x2="274.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="498.0" y1="296.0" x2="522.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746.0" y1="296.0" x2="770.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="372.0" width="960.0" height="72.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">обидва шляхи закінчуються тією самою функцією обробки:</tspan><tspan x="510.0" dy="16.9">si_band і revents кодують подію однаково, тож коду для неї один</tspan></text>
</svg>