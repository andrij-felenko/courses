<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1020 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1020" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де готовність має що повідомляти</text>
<text x="250.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">є стан «поки нічого немає»</text>
<text x="760.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">такого стану не існує</text>
<rect x="30.0" y="58.0" width="430.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">сокет: буфер прийому буває порожній</tspan></text>
<rect x="30.0" y="122.0" width="430.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">канал і FIFO</tspan></text>
<rect x="30.0" y="186.0" width="430.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">термінал і послідовний порт</tspan></text>
<rect x="30.0" y="250.0" width="430.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="281.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">eventfd, timerfd, signalfd, inotify</tspan></text>
<rect x="530.0" y="58.0" width="450.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="81.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">звичайний файл: він «готовий» завжди,</tspan><tspan x="755.0" dy="15.6">а читання все одно чекає на носій</tspan></text>
<rect x="530.0" y="122.0" width="450.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">блоковий пристрій</tspan></text>
<rect x="530.0" y="186.0" width="450.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">сторінковий збій на відображеному файлі</tspan></text>
<rect x="530.0" y="250.0" width="450.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="281.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">open, stat, rename — операції над метаданими</tspan></text>
<rect x="530.0" y="314.0" width="450.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">розв'язання доменного імені</tspan></text>
<rect x="30.0" y="356.0" width="950.0" height="60.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="505.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">модель завершення покриває обидва стовпці, бо ставить ядру не питання «чи можна вже»,</tspan><tspan x="505.0" dy="16.9">а замовлення «зроби» — на яке відповідь є завжди</tspan></text>
</svg>