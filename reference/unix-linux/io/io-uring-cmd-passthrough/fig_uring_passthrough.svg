  <path d="M 200 240 L 200 270" stroke="#005c99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 200 215 C 275 215, 325 215, 340 215" stroke="#cc3300" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <text x="275" y="210" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#cc3300">Bypass</text>
  <path d="M 400 350 L 400 380" stroke="#009900" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 425 L 500 355" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <text x="510" y="390" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">Interrupt / CQE</text>
