<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
    </marker>
  </defs>
  <rect x="50" y="50" width="700" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="400" y="70" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Простір користувача (Userspace)</text>
  <rect x="100" y="85" width="200" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="105" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">io_uring SQE (URING_CMD)</text>
  <rect x="50" y="150" width="700" height="220" rx="5" fill="#e6f7ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="170" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Простір ядра (Kernel space)</text>
  <rect x="100" y="190" width="200" height="50" rx="3" fill="#b3e0ff" stroke="#005c99" stroke-width="2"/>
  <text x="200" y="220" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333">io_uring core</text>
  <rect x="350" y="190" width="150" height="50" rx="3" fill="#ffd6cc" stroke="#cc3300" stroke-width="2" stroke-dasharray="4"/>
  <text x="425" y="220" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333">VFS / blk-mq</text>
  <rect x="100" y="280" width="600" height="70" rx="3" fill="#b3ffb3" stroke="#009900" stroke-width="2"/>
  <text x="400" y="305" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333">NVMe Character Device Driver (/dev/ng0n1)</text>
  <text x="400" y="330" font-family="monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">nvme_uring_cmd() / uring_cmd_comp()</text>
  <rect x="50" y="390" width="700" height="80" rx="5" fill="#ffe6e6" stroke="#333" stroke-width="2"/>
  <text x="400" y="410" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Апаратне забезпечення (Hardware)</text>
  <rect x="300" y="425" width="200" height="30" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="400" y="445" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333">NVMe Controller</text>
