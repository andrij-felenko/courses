<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Interrupts vs Polling</text>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння обробки I/O: Переривання проти IO Polling</text>
<rect x="30.0" y="50.0" width="350.0" height="350.0" rx="8" fill="#fdfcfb" stroke="#d9d9d9" stroke-width="1.5"/>
<text x="205.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратні переривання (IRQ-driven)</text>
<rect x="45.0" y="98.5" width="320.0" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">1. Застосунок робить I/O системний виклик</tspan></text>
<rect x="42.2" y="138.5" width="325.5" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">2. Ядро додає команду в SQ і подзвонить у Doorbell</tspan></text>
<rect x="45.0" y="178.5" width="320.0" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">3. Потік засинає (TASK_UNINTERRUPTIBLE)</tspan></text>
<rect x="45.0" y="218.5" width="320.0" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">4. Контекст перемикається на інший процес</tspan></text>
<rect x="45.0" y="258.5" width="320.0" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="273.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">5. Пристрій завершує I/O і шле MSI-X IRQ</tspan></text>
<rect x="45.0" y="298.5" width="320.0" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">6. CPU обробляє ISR / SoftIRQ та пробуджує потік</tspan></text>
<rect x="42.2" y="338.5" width="325.5" height="23.0" rx="6" fill="#f4f6f8" stroke="#cccccc" stroke-width="1.5"/><text x="205.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">7. Контекст перемикається назад (затримка 2-5 мкс)</tspan></text>
<rect x="420.0" y="50.0" width="350.0" height="350.0" rx="8" fill="#f6f9fc" stroke="#d9d9d9" stroke-width="1.5"/>
<text x="595.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Активне опитування (IO Polling)</text>
<rect x="435.0" y="98.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1. Застосунок подає запит (RWF_HIPRI / IOPOLL)</tspan></text>
<rect x="435.0" y="138.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">2. Ядро додає команду у Poll-чергу (без IRQ)</tspan></text>
<rect x="435.0" y="178.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">3. Потік НЕ засинає і не робить context switch</tspan></text>
<rect x="432.2" y="218.5" width="325.5" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">4. CPU активно перевіряє (spins) NVMe CQ у пам'яті</tspan></text>
<rect x="435.0" y="258.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="273.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">5. Пристрій записує completion у CQ (без IRQ)</tspan></text>
<rect x="435.0" y="298.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">6. CPU миттєво виявляє запис у пам'яті</tspan></text>
<rect x="435.0" y="338.5" width="320.0" height="23.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="595.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">7. Виконання повертається в користувацький код</tspan></text>
</svg>