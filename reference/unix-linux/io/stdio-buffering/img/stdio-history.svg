<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири кроки від переносного пакета Леска до трьох режимів стандарту</text>
<line x1="210.0" y1="118.0" x2="210.0" y2="630.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="120.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">1975</text>
<text x="120.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шоста редакція Unix</text>
<circle cx="210.0" cy="149.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<line x1="219.0" y1="149.0" x2="250.0" y2="149.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="250.0" y="90.0" width="880.0" height="118.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="276.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">iolib Майка Леска</text>
<text x="276.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">переносний пакет на PDP-11, GCOS і IBM 370</text>
<text x="276.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">диск — по 512 символів · телетайп — посимвольно</text>
<text x="120.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#27ae60" text-anchor="middle" font-weight="700">1979</text>
<text x="120.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сьома редакція Unix</text>
<circle cx="210.0" cy="299.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<line x1="219.0" y1="299.0" x2="250.0" y2="299.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="250.0" y="240.0" width="880.0" height="118.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="276.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">stdio Денніса Рітчі</text>
<text x="276.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">стан у FILE, дескриптор зник з інтерфейсу, getc і putc — макроси</text>
<text x="276.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">той самий вибір за isatty: термінал — без буфера</text>
<text x="120.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">1983</text>
<text x="120.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4.2BSD</text>
<circle cx="210.0" cy="449.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<line x1="219.0" y1="449.0" x2="250.0" y2="449.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="250.0" y="390.0" width="880.0" height="118.0" rx="8" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.7"/>
<text x="276.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">прапорець _IOLBF</text>
<text x="276.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">швидкі екранні термінали замість телетайпа на 110 бодів</text>
<text x="276.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">термінал стає порядковим, з'являється setlinebuf</text>
<text x="120.0" y="591.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">1989</text>
<text x="120.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ANSI C</text>
<circle cx="210.0" cy="599.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="219.0" y1="599.0" x2="250.0" y2="599.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="250.0" y="540.0" width="880.0" height="118.0" rx="8" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="276.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">три сталі й setvbuf</text>
<text x="276.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">_IOFBF, _IOLBF, _IONBF — імена для того, що вже склалося</text>
<text x="276.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">поблоковий — лише коли пристрій не інтерактивний</text>
<text x="590.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Наскрізна лінія: порцію обирає бібліотека, бо про пристрій знає вона, а не програма.</text>
</svg>