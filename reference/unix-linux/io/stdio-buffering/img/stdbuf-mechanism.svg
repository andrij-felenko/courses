<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як stdbuf дотягується до setvbuf через LD_PRELOAD і чому це не завжди спрацьовує</text>
<text x="350.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що робить stdbuf -oL ./prog</text>
<rect x="80.0" y="80.0" width="540.0" height="100.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="104.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1 · stdbuf</text>
<text x="104.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ставить _STDBUF_O=L і LD_PRELOAD=libstdbuf.so</text>
<text x="104.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">і робить execvp: сам зникає, лишається оточення</text>
<line x1="350.0" y1="183.0" x2="350.0" y2="206.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="210.0" width="540.0" height="100.0" rx="8" fill="#f1f2f4" stroke="#6b7280" stroke-width="1.7"/>
<text x="104.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">2 · динамічний завантажувач</text>
<text x="104.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">підтягує libstdbuf.so разом з рештою бібліотек</text>
<text x="104.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ще до першої інструкції головної функції</text>
<line x1="350.0" y1="313.0" x2="350.0" y2="336.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="340.0" width="540.0" height="100.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="104.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">3 · конструктор libstdbuf</text>
<text x="104.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">читає _STDBUF_O і кличе setvbuf(stdout, NULL, _IOLBF, 0)</text>
<text x="104.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">потік ще не займаний — правило дотримано</text>
<line x1="350.0" y1="443.0" x2="350.0" y2="466.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="470.0" width="540.0" height="100.0" rx="8" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="104.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4 · main</text>
<text x="104.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">перший printf потрапляє вже в порядковий режим</text>
<text x="104.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рядок виходить на своєму переході рядка</text>
<text x="960.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">де цей важіль нічого не змінить</text>
<rect x="690.0" y="80.0" width="540.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="714.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">програма сама кличе setvbuf</text>
<text x="714.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="714.0" dy="0.0">її виклик стається пізніше за конструктор</tspan><tspan x="714.0" dy="16.5">і просто перезаписує режим; довідка coreutils</tspan><tspan x="714.0" dy="16.5">наводить прикладом саме tee</tspan></text>
<rect x="690.0" y="250.0" width="540.0" height="150.0" rx="8" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.7"/>
<text x="714.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">програма не користується stdio</text>
<text x="714.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="714.0" dy="0.0">dd і cat читають та пишуть напряму, read і write;</tspan><tspan x="714.0" dy="16.5">буфера бібліотеки в них немає, отже перемикати</tspan><tspan x="714.0" dy="16.5">нема чого — розмір порції там задає bs=</tspan></text>
<rect x="690.0" y="420.0" width="540.0" height="150.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="714.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">лишається інший важіль: псевдотермінал</text>
<text x="714.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="714.0" dy="0.0">script -qec './prog | tee log' /dev/null</tspan><tspan x="714.0" dy="16.5">дає програмі tty; isatty каже «так», і бібліотека</tspan><tspan x="714.0" dy="16.5">сама обирає порядковий режим</tspan></text>
<text x="650.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">важіль діє лише там, де буфер stdio є і його ніхто не перевизначає</text>
</svg>