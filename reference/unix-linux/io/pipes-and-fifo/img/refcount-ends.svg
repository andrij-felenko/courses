<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінець даних і SIGPIPE як два лічильники</text>
<rect x="40.0" y="26.0" width="880.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="51.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">поки обидва лічильники більші за нуль: read() чекає на дані, write() чекає на місце</tspan></text>
<rect x="40.0" y="92.0" width="420.0" height="46.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">кінців на запис лишилося 0</tspan></text>
<line x1="250.0" y1="142.0" x2="250.0" y2="168.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="172.0" width="420.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="200.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">read() повертає 0 — кінець даних</tspan></text>
<rect x="40.0" y="232.0" width="420.0" height="62.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">не тому, що записувач попрощався,</tspan><tspan x="250.0" dy="15.6">а тому, що написати вже фізично нема кому</tspan></text>
<rect x="500.0" y="92.0" width="420.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">кінців на читання лишилося 0</tspan></text>
<line x1="710.0" y1="142.0" x2="710.0" y2="168.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="500.0" y="172.0" width="420.0" height="48.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="199.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">SIGPIPE записувачеві; якщо ігнорується — write() = −1, EPIPE</tspan></text>
<rect x="500.0" y="232.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">не тому, що читач попрощався,</tspan><tspan x="710.0" dy="15.6">а тому, що написані байти нема кому забрати</tspan></text>
<rect x="40.0" y="306.0" width="880.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">лічильники рахують описи в УСІХ процесах системи — успадкована й забута копія рахується теж</tspan></text>
</svg>