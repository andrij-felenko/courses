<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анонімний канал проти іменованого каналу FIFO у VFS</text>
<rect x="40.0" y="20.0" width="430.0" height="50.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Анонімний канал (pipe / pipe2)</tspan><tspan x="255.0" dy="16.9">Створюється в пам'яті, доступний через успадкування</tspan></text>
<rect x="40.0" y="85.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">1. pipe(fds) виділяє анонімний інод у pipefs</tspan><tspan x="255.0" dy="15.6">(спеціальна псевдо-ФС ядра без точки монтування)</tspan><tspan x="255.0" dy="15.6">Інод не має імені в каталогах ФС (dentry = NULL)</tspan></text>
<line x1="255.0" y1="155.0" x2="255.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="185.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">2. Ядро повертає 2 дескриптори одному процесу:</tspan><tspan x="255.0" dy="15.6">fds[0] (читання) та fds[1] (запис).</tspan><tspan x="255.0" dy="15.6">Обидва вказують на спільний struct pipe_inode_info</tspan></text>
<line x1="255.0" y1="255.0" x2="255.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="285.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">3. Передача між процесами тільки через fork():</tspan><tspan x="255.0" dy="15.6">Нащадок успадковує таблицю дескрипторів.</tspan><tspan x="255.0" dy="15.6">Сторонній неспоріднений процес під'єднатися не може</tspan></text>
<rect x="530.0" y="20.0" width="430.0" height="50.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Іменований канал / FIFO (mkfifo)</tspan><tspan x="745.0" dy="16.9">Має ім'я у файловій системі, доступний усім</tspan></text>
<rect x="530.0" y="85.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">1. mkfifo(&quot;/tmp/my_fifo&quot;, 0666) створює інод у звичайній ФС</tspan><tspan x="745.0" dy="15.6">Тип інода: S_IFIFO. Розмір на диску: 0 байтів.</tspan><tspan x="745.0" dy="15.6">Має ім'я (dentry), права доступу та власника (UID/GID)</tspan></text>
<line x1="745.0" y1="155.0" x2="745.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="185.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">2. Непов'язані процеси викликають open(&quot;/tmp/my_fifo&quot;):</tspan><tspan x="745.0" dy="15.6">VFS відкриває файл і підставляє fifo_open().</tspan><tspan x="745.0" dy="15.6">Інод пов'язується з тим самим struct pipe_inode_info</tspan></text>
<line x1="745.0" y1="255.0" x2="745.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="285.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">3. Рукостискання (rendezvous) при відкритті:</tspan><tspan x="745.0" dy="15.6">open(O_RDONLY) блокується, доки хтось не відкриє O_WRONLY.</tspan><tspan x="745.0" dy="15.6">Будь-який процес із правами доступу може під'єднатися</tspan></text>
<rect x="40.0" y="380.0" width="920.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Спільна основа: після успішного відкриття VFS направляє read() та write()</tspan><tspan x="500.0" dy="15.6">в одну й ту саму функцію ядра (pipe_read / pipe_write) та однаковий кільцевий буфер у RAM.</tspan></text>
</svg>