<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл дескрипторів у конвеєрі</text>
<rect x="40.0" y="15.0" width="920.0" height="45.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Життєвий цикл дескрипторів конвеєра: cmd1 | cmd2</tspan><tspan x="500.0" dy="16.9">Чому критично закривати невикористані кінці в батьківському та дочірніх процесах</tspan></text>
<rect x="40.0" y="75.0" width="280.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Батьківський процес (Shell)</tspan><tspan x="180.0" dy="13.0">pipe(pfd) → pfd[0] (читання), pfd[1] (запис)</tspan><tspan x="180.0" dy="13.0">Лічильник читачів = 1, письменників = 1</tspan></text>
<rect x="360.0" y="75.0" width="280.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. fork() → Дочірній 1 (cmd1)</tspan><tspan x="500.0" dy="14.3">Успадковує pfd[0] і pfd[1].</tspan><tspan x="500.0" dy="14.3">dup2(pfd[1], STDOUT_FILENO)</tspan><tspan x="500.0" dy="14.3">close(pfd[0]), close(pfd[1])</tspan></text>
<rect x="680.0" y="75.0" width="280.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">3. fork() → Дочірній 2 (cmd2)</tspan><tspan x="820.0" dy="14.3">Успадковує pfd[0] і pfd[1].</tspan><tspan x="820.0" dy="14.3">dup2(pfd[0], STDIN_FILENO)</tspan><tspan x="820.0" dy="14.3">close(pfd[0]), close(pfd[1])</tspan></text>
<line x1="180.0" y1="165.0" x2="180.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="165.0" x2="500.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="165.0" x2="820.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="920.0" height="75.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">4. ГОЛОВНИЙ КРОК: Батьківський процес викликає close(pfd[0]) та close(pfd[1])</tspan><tspan x="500.0" dy="15.6">Тепер єдиним письменником є cmd1 (через свій stdout), а єдиним читачем — cmd2 (через свій stdin).</tspan><tspan x="500.0" dy="15.6">Батьківський процес викликає waitpid() для обох нащадків.</tspan></text>
<line x1="300.0" y1="280.0" x2="300.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="280.0" x2="700.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="430.0" height="160.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Усі невикористані кінці закрито (ПРАВИЛЬНО):</tspan><tspan x="255.0" dy="14.3"></tspan><tspan x="255.0" dy="14.3">1. cmd1 закінчує роботу та завершується (exit);</tspan><tspan x="255.0" dy="14.3">2. Ядро автоматично закриває його stdout;</tspan><tspan x="255.0" dy="14.3">3. Кількість відкритих дескрипторів на запис стає 0;</tspan><tspan x="255.0" dy="14.3">4. Наступний read() у cmd2 повертає 0 байтів (EOF);</tspan><tspan x="255.0" dy="14.3">5. cmd2 коректно завершує обробку та виходить.</tspan></text>
<rect x="530.0" y="320.0" width="430.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Батько забув викликати close(pfd[1]) (ТИПОВИЙ БАГ):</tspan><tspan x="745.0" dy="14.3"></tspan><tspan x="745.0" dy="14.3">1. cmd1 завершується (exit);</tspan><tspan x="745.0" dy="14.3">2. У системі все ще лишається 1 відкритий pfd[1] у батька;</tspan><tspan x="745.0" dy="14.3">3. Кількість письменників не дорівнює нулю!</tspan><tspan x="745.0" dy="14.3">4. read() у cmd2 БЛОКУЄТЬСЯ НАЗАВЖДИ в очікуванні даних;</tspan><tspan x="745.0" dy="14.3">5. Весь конвеєр зависає намертво.</tspan></text>
</svg>