<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура кільцевого буфера pipe_inode_info</text>
<rect x="40.0" y="20.0" width="920.0" height="52.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="42.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Кільцевий буфер каналу в пам'яті ядра: struct pipe_inode_info</tspan><tspan x="500.0" dy="16.9">Масив покажчиків pipe_buffer на сторінки пам'яті (за замовчуванням 16 слотів по 4 КіБ = 64 КіБ)</tspan></text>
<rect x="40.0" y="100.0" width="200.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Процес-письменник</tspan><tspan x="140.0" dy="16.9">(write / splice)</tspan></text>
<line x1="240.0" y1="130.0" x2="310.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запис</text>
<line x1="690.0" y1="130.0" x2="760.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="725.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">читання</text>
<rect x="760.0" y="100.0" width="200.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Процес-читач</tspan><tspan x="860.0" dy="16.9">(read / splice)</tspan></text>
<rect x="310.0" y="95.0" width="180.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">pipe-&gt;head = 9</tspan><tspan x="400.0" dy="15.6">(позиція запису)</tspan><tspan x="400.0" dy="15.6">head % 16 = слот 9</tspan></text>
<rect x="510.0" y="95.0" width="180.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">pipe-&gt;tail = 5</tspan><tspan x="600.0" dy="15.6">(позиція читання)</tspan><tspan x="600.0" dy="15.6">tail % 16 = слот 5</tspan></text>
<text x="500.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий масив pipe_buffer (head − tail = 4 зайняті сторінки з 16)</text>
<rect x="80.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="127.5" y="236.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="127.5" dy="0.0">Слот 4</tspan><tspan x="127.5" dy="11.7">Звільнено</tspan><tspan x="127.5" dy="11.7">(tail був тут)</tspan></text>
<rect x="185.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="232.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Слот 5</tspan><tspan x="232.5" dy="14.3">Зайнято</tspan><tspan x="232.5" dy="14.3">4096 Б</tspan></text>
<rect x="290.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="337.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="337.5" dy="0.0">Слот 6</tspan><tspan x="337.5" dy="14.3">Зайнято</tspan><tspan x="337.5" dy="14.3">4096 Б</tspan></text>
<rect x="395.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="442.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="442.5" dy="0.0">Слот 7</tspan><tspan x="442.5" dy="14.3">Зайнято</tspan><tspan x="442.5" dy="14.3">4096 Б</tspan></text>
<rect x="500.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="547.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="547.5" dy="0.0">Слот 8</tspan><tspan x="547.5" dy="14.3">Зайнято</tspan><tspan x="547.5" dy="14.3">4096 Б</tspan></text>
<rect x="605.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="652.5" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">Слот 9</tspan><tspan x="652.5" dy="13.0">Наступний</tspan><tspan x="652.5" dy="13.0">(head вказує)</tspan></text>
<rect x="710.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="757.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">Слот 10</tspan><tspan x="757.5" dy="14.3">Вільний</tspan><tspan x="757.5" dy="14.3">(порожньо)</tspan></text>
<rect x="815.0" y="200.0" width="95.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="862.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="862.5" dy="0.0">Слот 11</tspan><tspan x="862.5" dy="14.3">Вільний</tspan><tspan x="862.5" dy="14.3">(порожньо)</tspan></text>
<line x1="600.0" y1="165.0" x2="230.0" y2="200.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="165.0" x2="650.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="320.0" width="840.0" height="130.0" rx="6" fill="#fdfbf7" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Вміст кожного елемента struct pipe_buffer:</tspan><tspan x="500.0" dy="15.6">• struct page *page — покажчик на фізичну сторінку пам'яті (виділяється ядром за потребою);</tspan><tspan x="500.0" dy="15.6">• unsigned int offset — зміщення першого дійсного байта даних у сторінці (після часткового read);</tspan><tspan x="500.0" dy="15.6">• unsigned int len — кількість доступних байтів у цій сторінці;</tspan><tspan x="500.0" dy="15.6">• const struct pipe_buf_operations *ops — операції зі сторінкою (звільнення, отримання посилання, крадіжка);</tspan><tspan x="500.0" dy="15.6">• unsigned int flags — прапорці (наприклад, PIPE_BUF_FLAG_CAN_MERGE для дозапису малих порцій).</tspan></text>
</svg>