<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="30.0" width="520.0" height="50.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="300.0" y="60.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Письменник (Writer)</tspan></text>
<rect x="680.0" y="30.0" width="520.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="940.0" y="60.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">Читач (Reader — Оптимістичний цикл)</tspan></text>
<rect x="40.0" y="110.0" width="230.0" height="64.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="155.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">1. spin_lock(&amp;sl-&gt;lock)</tspan></text>
<rect x="280.0" y="110.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Захоплює спінлок для відсікання інших письменників</tspan></text>
<line x1="155.0" y1="174.0" x2="155.0" y2="194.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="194.0" width="230.0" height="64.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="155.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">2. write_seqcount_begin()</tspan><tspan x="155.0" dy="15.6">seq++ (стає НЕПАРНИМ)</tspan></text>
<rect x="280.0" y="194.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Оголошує початок запису + smp_wmb()</tspan></text>
<line x1="155.0" y1="258.0" x2="155.0" y2="278.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="278.0" width="230.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="155.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">3. Оновлення даних (payload)</tspan></text>
<rect x="280.0" y="278.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="313.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Запис у структуру даних (не містить вказівників)</tspan></text>
<line x1="155.0" y1="342.0" x2="155.0" y2="362.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="362.0" width="230.0" height="64.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="155.0" y="390.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">4. write_seqcount_end()</tspan><tspan x="155.0" dy="15.6">seq++ (стає ПАРНИМ)</tspan></text>
<rect x="280.0" y="362.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Оголошує завершення запису + smp_wmb()</tspan></text>
<line x1="155.0" y1="426.0" x2="155.0" y2="446.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="446.0" width="230.0" height="64.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="155.0" y="482.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">5. spin_unlock(&amp;sl-&gt;lock)</tspan></text>
<rect x="280.0" y="446.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="481.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Звільняє спінлок для наступних письменників</tspan></text>
<rect x="680.0" y="110.0" width="230.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="795.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">1. seq = read_seqbegin()</tspan></text>
<rect x="920.0" y="110.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1060.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Прочитати seq + smp_rmb(). Якщо seq непарне, чекати у циклі</tspan></text>
<line x1="795.0" y1="174.0" x2="795.0" y2="194.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="194.0" width="230.0" height="64.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="795.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">2. Читання даних (payload)</tspan></text>
<rect x="920.0" y="194.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1060.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Копіювати локально всі поля структури</tspan></text>
<line x1="795.0" y1="258.0" x2="795.0" y2="278.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="278.0" width="230.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="795.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">3. read_seqretry(seq)?</tspan></text>
<rect x="920.0" y="278.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1060.0" y="313.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">smp_rmb() + перевірка: чи змінився seq від початку?</tspan></text>
<line x1="795.0" y1="346.0" x2="795.0" y2="420.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="420.0" width="230.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="795.0" y="446.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Ні (seq не змінився)</tspan><tspan x="795.0" dy="16.2">УСПІХ</tspan></text>
<rect x="920.0" y="420.0" width="280.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="1060.0" y="446.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Дані цілісні й консистентні.</tspan><tspan x="1060.0" dy="15.0">Вихід із циклу читання.</tspan></text>
<line x1="795.0" y1="346.0" x2="610.0" y2="346.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="346.0" x2="610.0" y2="142.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="610.0" y1="142.0" x2="676.0" y2="142.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="575.0" y="230.0" width="70.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="598.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="598.0" dy="0.0">Так</tspan><tspan x="598.0" dy="14.3">повтор</tspan></text>
<rect x="40.0" y="560.0" width="1160.0" height="80.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="596.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Ключовий момент: Читач НЕ захоплює атомарних замків і не модифікує спільно використовувану пам'ять.</tspan><tspan x="620.0" dy="16.2">При колізії (письменник вклинився під час читання) читач відкидає часткові дані й повторює цикл.</tspan></text>
