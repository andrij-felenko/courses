<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="30.0" width="520.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="300.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Звичайний RWLock (Read-Write Spinlock)</tspan></text>
<rect x="60.0" y="100.0" width="480.0" height="80.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Кожен читач виконує atomic_inc() / cmpxchg()</tspan><tspan x="300.0" dy="16.2">Рядок кеша переходить у стан Modified (M)</tspan></text>
<rect x="80.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Ядро CPU 1</tspan><tspan x="145.0" dy="15.6">(Читач)</tspan></text>
<line x1="145.0" y1="270.0" x2="145.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Ядро CPU 2</tspan><tspan x="305.0" dy="15.6">(Читач)</tspan></text>
<line x1="305.0" y1="270.0" x2="305.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="400.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="465.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">Ядро CPU 3</tspan><tspan x="465.0" dy="15.6">(Читач)</tspan></text>
<line x1="465.0" y1="270.0" x2="465.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="480.0" height="70.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="300.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Спільна лінія кеша з замком rwlock_t</tspan><tspan x="300.0" dy="16.9">Постійне анулювання (Cache-Line Bouncing)!</tspan></text>
<rect x="620.0" y="30.0" width="520.0" height="50.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="880.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Послідовний замок (Seqlock)</tspan></text>
<rect x="640.0" y="100.0" width="480.0" height="80.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="880.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Читачі лише ЧИТАЮТЬ seqcount (Zero Write Overhead)</tspan><tspan x="880.0" dy="16.2">Рядок кеша залишається у стані Shared (S) на всіх ядрах</tspan></text>
<rect x="660.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Ядро CPU 1</tspan><tspan x="725.0" dy="15.6">(Читач)</tspan></text>
<line x1="725.0" y1="320.0" x2="725.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="820.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Ядро CPU 2</tspan><tspan x="885.0" dy="15.6">(Читач)</tspan></text>
<line x1="885.0" y1="320.0" x2="885.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="980.0" y="210.0" width="130.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="1045.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1045.0" dy="0.0">Ядро CPU 3</tspan><tspan x="1045.0" dy="15.6">(Читач)</tspan></text>
<line x1="1045.0" y1="320.0" x2="1045.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="320.0" width="480.0" height="70.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="880.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Спільна лінія кеша з seqcount_t</tspan><tspan x="880.0" dy="16.9">Тиша у шині когерентності кешів!</tspan></text>
<rect x="40.0" y="430.0" width="1100.0" height="130.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="482.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Результат для масштабованості системи:</tspan><tspan x="590.0" dy="16.9">• RWLock: Додавання читачів масштабується погано через трафік когерентності (MESI invalidation) на кожен read_lock.</tspan><tspan x="590.0" dy="16.9">• Seqlock: Додавання тисяч читачів має майже нульову ціну для шини пам'яті. Письменник виконує оновлення без блокування читачами.</tspan></text>
</svg>