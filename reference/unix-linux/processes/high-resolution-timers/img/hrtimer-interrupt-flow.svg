<rect x="20.0" y="55.0" width="220.0" height="80.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="130.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Апаратна подія</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">APIC / HPET генерує hardirq</tspan><tspan x="130.0" dy="14.3">за досягненням часу</tspan></text>
