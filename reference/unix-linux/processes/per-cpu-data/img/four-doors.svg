<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна копія — чотири входи, чотири різні правила</text>
<rect x="480.0" y="150.0" width="400.0" height="430.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="680.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">копія ядра процесора N</text>
<rect x="510.0" y="210.0" width="340.0" height="130.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="680.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">лічильники</tspan><tspan x="680.0" dy="16.9">events · bytes · misses · refills</tspan></text>
<rect x="510.0" y="370.0" width="340.0" height="170.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="680.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">запас об'єктів</tspan><tspan x="680.0" dy="16.9">local_lock_t + список + count</tspan></text>
<rect x="40.0" y="170.0" width="380.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">таймер, контекст softirq</tspan><tspan x="230.0" dy="16.2"></tspan><tspan x="230.0" dy="16.2">this_cpu_inc(events)</tspan><tspan x="230.0" dy="16.2">замка немає — одна інструкція</tspan></text>
<line x1="430.0" y1="235.0" x2="470.0" y2="235.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="390.0" width="380.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">поповнення запасу, контекст задачі</tspan><tspan x="230.0" dy="16.2"></tspan><tspan x="230.0" dy="16.2">local_lock_irqsave(&amp;depot.lock)</tspan><tspan x="230.0" dy="16.2">суперник — softirq на цьому ж ядрі</tspan></text>
<line x1="430.0" y1="465.0" x2="470.0" y2="465.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="940.0" y="170.0" width="380.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1130.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">читання з будь-якого ядра</tspan><tspan x="1130.0" dy="16.2"></tspan><tspan x="1130.0" dy="16.2">per_cpu_ptr(&amp;cnt, cpu)</tspan><tspan x="1130.0" dy="16.2">замка немає — сума приблизна</tspan></text>
<line x1="890.0" y1="235.0" x2="930.0" y2="235.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="940.0" y="390.0" width="380.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1130.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">гак cpuhp на ядрі, що гасне</tspan><tspan x="1130.0" dy="16.2"></tspan><tspan x="1130.0" dy="16.2">local_lock_irqsave + злив у спільне</tspan><tspan x="1130.0" dy="16.2">інакше пам'ять лишиться замкненою</tspan></text>
<line x1="890.0" y1="465.0" x2="930.0" y2="465.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="200.0" y="630.0" width="960.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="680.0" y="657.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">правило вибирає не тип даних, а контекст того, хто заходить:</tspan><tspan x="680.0" dy="17.6">хто мій суперник на ЦЬОМУ ядрі й чи маю я право заснути</tspan></text>
<text x="680.0" y="740.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">жоден із чотирьох входів не боронить від інших ядер процесора — і не мусить</text>
</svg>