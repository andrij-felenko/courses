<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна підсистема пам'яті: Store Buffers та Invalidate Queues</text>
<rect x="30.0" y="60.0" width="370.0" height="240.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="215.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро CPU 0 (Producer)</text>
<rect x="97.6" y="103.2" width="234.9" height="43.6" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Конвеєр виконання (Out-of-Order)</tspan><tspan x="215.0" dy="15.6">WRITE data = 42; WRITE flag = 1;</tspan></text>
<line x1="215.0" y1="150.0" x2="215.0" y2="185.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="39.4" y="198.2" width="351.2" height="43.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Store Buffer (Буфер відкладеного запису)</tspan><tspan x="215.0" dy="15.6">[data=42 (затримується)] -&gt; [flag=1 (скидається)]</tspan></text>
<line x1="215.0" y1="255.0" x2="215.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
