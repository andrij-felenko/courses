<rect x="459.7" y="103.2" width="330.6" height="43.6" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="625.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Конвеєр виконання (Out-of-Order)</tspan><tspan x="625.0" dy="15.6">READ flag (==1); READ data (==0! Спекулятивно)</tspan></text>
<line x1="625.0" y1="185.0" x2="625.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="473.4" y="198.2" width="303.3" height="43.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="625.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Invalidate Queue (Черга інвалідації кешу)</tspan><tspan x="625.0" dy="15.6">[Запит інвалідації data затримано в черзі]</tspan></text>
<line x1="625.0" y1="305.0" x2="625.0" y2="255.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
