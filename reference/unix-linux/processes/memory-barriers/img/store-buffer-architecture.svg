<text x="420.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системна шина інтерконнекту (Interconnect) та спільний L3 Кеш / RAM</text>
<rect x="161.0" y="288.0" width="517.9" height="24.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">smp_wmb() скидає Store Buffer | smp_rmb() спорожнює Invalidate Queue</tspan></text>
</svg>