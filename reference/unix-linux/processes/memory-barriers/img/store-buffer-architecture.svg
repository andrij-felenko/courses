<rect x="468.8" y="330.5" width="312.4" height="29.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">L1 Cache Core 1 (MESI: Shared / Invalid)</tspan></text>
<line x1="215.0" y1="370.0" x2="215.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
