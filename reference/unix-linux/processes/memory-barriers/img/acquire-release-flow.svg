<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причинно-наслідковий зв'язок (Happens-Before) у Acquire-Release</text>
<rect x="30.0" y="60.0" width="360.0" height="300.0" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">Потік 1: Виробник (Producer)</text>
<rect x="133.6" y="118.2" width="152.8" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Підготовка даних:</tspan><tspan x="210.0" dy="15.6">WRITE payload = 42;</tspan></text>
<line x1="210.0" y1="175.0" x2="210.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.4" y="240.4" width="239.2" height="59.2" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="210.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">2. Публікація з Release:</tspan><tspan x="210.0" dy="15.6">smp_store_release(&amp;ready, 1);</tspan><tspan x="210.0" dy="15.6">[Бар'єр ЗВЕРХУ, перед записом]</tspan></text>
<rect x="470.0" y="60.0" width="360.0" height="300.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Потік 2: Споживач (Consumer)</text>
<rect x="515.5" y="110.4" width="269.0" height="59.2" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">1. Зчитання з Acquire:</tspan><tspan x="650.0" dy="15.6">if (smp_load_acquire(&amp;ready) == 1)</tspan><tspan x="650.0" dy="15.6">[Бар'єр ЗНИЗУ, після читання]</tspan></text>
<line x1="650.0" y1="185.0" x2="650.0" y2="225.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="539.4" y="248.2" width="221.2" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">2. Використання даних:</tspan><tspan x="650.0" dy="15.6">READ payload (гарантовано 42!)</tspan></text>
<rect x="359.2" y="111.3" width="141.6" height="37.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Синхронізація</tspan><tspan x="430.0" dy="14.3">(Synchronizes-With)</tspan></text>
<line x1="345.0" y1="270.0" x2="520.0" y2="160.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="133.3" y="378.0" width="593.4" height="24.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Операції до Release НЕ випливають нижче. Операції після Acquire НЕ піднімаються вище.</tspan></text>
</svg>