<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм інструкцій Load-Linked / Store-Conditional (LL/SC)</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм інструкцій Load-Linked / Store-Conditional (LL/SC)</text>
<rect x="40.0" y="70.0" width="1020.0" height="140.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="60.0" y="90.0" width="140.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Крок 1: LL</tspan></text>
<text x="570.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро читає значення інструкцією LL (LDXR / lr.w) та активує Exclusive Monitor</text>
<rect x="90.0" y="145.0" width="280.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Процесорне ядро 0</tspan><tspan x="230.0" dy="16.9">Виконує LL [addr]</tspan></text>
<line x1="370.0" y1="170.0" x2="450.0" y2="170.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="145.0" width="300.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Апаратний монітор (Exclusive Monitor)</tspan><tspan x="600.0" dy="16.9">Стан: EXCLUSIVE (Адреса записана)</tspan></text>
<line x1="750.0" y1="170.0" x2="830.0" y2="170.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="145.0" width="200.0" height="50.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="930.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Комірка RAM</tspan><tspan x="930.0" dy="16.9">[addr] = 42</tspan></text>
<rect x="40.0" y="230.0" width="490.0" height="310.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="285.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій А: Успішний запис (без втручання)</text>
<rect x="60.0" y="280.0" width="450.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Жодне інше ядро не записувало за адресою [addr]</tspan><tspan x="285.0" dy="16.9">Exclusive Monitor залишається у стані EXCLUSIVE</tspan></text>
<line x1="285.0" y1="325.0" x2="285.0" y2="355.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="355.0" width="450.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Ядро 0 виконує SC (STXR / sc.w [addr], new_val)</tspan><tspan x="285.0" dy="16.9">Монітор підтверджує право запису</tspan></text>
<line x1="285.0" y1="415.0" x2="285.0" y2="445.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="445.0" width="450.0" height="65.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Результат: SC повертає 0 (УСПІХ)</tspan><tspan x="285.0" dy="16.9">Значення в [addr] атомарно оновлено до new_val</tspan><tspan x="285.0" dy="16.9">Цикл зупиняється</tspan></text>
<rect x="570.0" y="230.0" width="490.0" height="310.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="815.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій Б: Конфлікт та повтор циклу</text>
<rect x="590.0" y="280.0" width="450.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Інше ядро або переривання змінило дані [addr]</tspan><tspan x="815.0" dy="16.9">Exclusive Monitor скинуто у стан INVALID!</tspan></text>
<line x1="815.0" y1="325.0" x2="815.0" y2="355.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="355.0" width="450.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Ядро 0 виконує SC (STXR / sc.w [addr], new_val)</tspan><tspan x="815.0" dy="16.9">Монітор ВІДХИЛЯЄ запис</tspan></text>
<line x1="815.0" y1="415.0" x2="815.0" y2="445.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="445.0" width="450.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Результат: SC повертає ПОМИЛКУ (1)</tspan><tspan x="815.0" dy="16.9">Запис скасовано, значення [addr] не змінилося</tspan><tspan x="815.0" dy="16.9">Програма повторює цикл спроб з LL</tspan></text>
</svg>