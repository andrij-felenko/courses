<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Когерентність кешів та блокування ліній пам'яті (MESI)</text>
<rect x="40.0" y="40.0" width="540.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="310.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Шинне блокування (Bus Lock / #LOCK)</text>
<text x="310.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Незрівняний доступ або незакешована пам'ять</text>
<rect x="70.0" y="130.0" width="220.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Ядро CPU 0</tspan><tspan x="180.0" dy="18.2">(виконує LOCK INC)</tspan></text>
<rect x="330.0" y="130.0" width="220.0" height="60.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ядро CPU 1</tspan><tspan x="440.0" dy="18.2">(ЗАБЛОКОВАНО)</tspan></text>
<rect x="70.0" y="240.0" width="480.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="310.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний сигнал #LOCK активний (Системна шина RAM)</text>
<line x1="180.0" y1="190.0" x2="180.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="190.0" x2="440.0" y2="240.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="4,4"/>
<rect x="170.0" y="340.0" width="280.0" height="60.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="365.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Оперативна пам'ять (RAM)</tspan><tspan x="310.0" dy="18.2">Доступ усіх інших ядер заморожено</tspan></text>
<line x1="310.0" y1="290.0" x2="310.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">Високі накладні витрати: блокується весь шинний контролер</text>
<text x="310.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Усі інші процесори чекають на звільнення шини</text>
<rect x="620.0" y="40.0" width="540.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="890.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Кеш-блокування (Cache Lock / MESI)</text>
<text x="890.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Вирівняні дані в кеші L1/L2</text>
<rect x="650.0" y="130.0" width="220.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Ядро CPU 0</tspan><tspan x="760.0" dy="18.2">(виконує LOCK INC)</tspan></text>
<rect x="910.0" y="130.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1020.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Ядро CPU 1</tspan><tspan x="1020.0" dy="15.6">(вільно виконує інші задачі)</tspan></text>
<rect x="650.0" y="230.0" width="220.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Кеш L1/L2 (CPU 0)</tspan><tspan x="760.0" dy="15.6">Стан MESI: Exclusive/Modified</tspan><tspan x="760.0" dy="15.6">Утримується Cache Line Lock</tspan></text>
<rect x="910.0" y="230.0" width="220.0" height="70.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="1020.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Кеш L1/L2 (CPU 1)</tspan><tspan x="1020.0" dy="14.3">Стан MESI: Invalid (I)</tspan><tspan x="1020.0" dy="14.3">Отримано сповіщення Invalidate</tspan></text>
<line x1="760.0" y1="190.0" x2="760.0" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="190.0" x2="1020.0" y2="230.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="870.0" y1="265.0" x2="910.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="890.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Invalidate</text>
<rect x="750.0" y="350.0" width="280.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Оперативна пам'ять (RAM)</tspan><tspan x="890.0" dy="18.2">Не блокується для інших ядер</tspan></text>
<text x="890.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Низька затримка: операція в межах кеш-лінії L1 (декілька тактів)</text>
<text x="890.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Шина пам'яті залишається вільною для паралельних операцій</text>
</svg>