<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народити всередині групи проти «народити й перевести»</text>
<rect x="40.0" y="70.0" width="250.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="165.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">fork()</tspan><tspan x="165.0" dy="15.6">+ запис PID у cgroup.procs</tspan></text>
<rect x="310.0" y="76.0" width="130.0" height="50.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="375.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">fork</tspan></text>
<rect x="450.0" y="76.0" width="300.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="600.0" y="97.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">дитина вже біжить</tspan><tspan x="600.0" dy="14.3">і списується на СТАРУ групу</tspan></text>
<rect x="760.0" y="76.0" width="170.0" height="50.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="845.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">запис PID</tspan></text>
<rect x="940.0" y="76.0" width="100.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="990.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">у групі</tspan></text>
<text x="600.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вікно перегонів</text>
<line x1="40.0" y1="176.0" x2="1040.0" y2="176.0" stroke="#d7dbe0" stroke-width="1.3" stroke-dasharray="6 6"/>
<rect x="40.0" y="208.0" width="250.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="165.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">clone3()</tspan><tspan x="165.0" dy="15.6">з CLONE_INTO_CGROUP</tspan></text>
<rect x="310.0" y="214.0" width="130.0" height="50.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="375.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">clone3</tspan></text>
<rect x="450.0" y="214.0" width="590.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="745.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">перша ж інструкція дитини виконується вже всередині</tspan></text>
<text x="745.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вікна немає</text>
<rect x="40.0" y="318.0" width="1000.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="540.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">у вікні дитина встигає виділити пам'ять — і та спишеться сусідній групі,</tspan><tspan x="540.0" dy="15.6">де й залишиться; встигає розгалузитися далі; встигає навіть померти,</tspan><tspan x="540.0" dy="15.6">і тоді ваша група не побачить її взагалі</tspan></text>
<rect x="40.0" y="410.0" width="1000.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="540.0" y="436.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">плата: цільова тека мусить бути листком — clone3 поверне EBUSY, якщо в ній самій увімкнено контролери</tspan></text>
</svg>