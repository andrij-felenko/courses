<rect x="60.0" y="352.0" width="230.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="175.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">leaf</tspan><tspan x="175.0" dy="15.6">сюди зсунули оболонку</tspan></text>
<rect x="330.0" y="352.0" width="230.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="445.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">lab</tspan><tspan x="445.0" dy="15.6">дослід</tspan></text>
