<rect x="452.0" y="446.0" width="108.0" height="44.0" rx="6" fill="#f7fdf9" stroke="#27ae60" stroke-width="1.4"/><text x="506.0" y="472.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="506.0" dy="0.0">lab/b</tspan></text>
