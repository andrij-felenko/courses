<line x1="506.0" y1="408.0" x2="506.0" y2="446.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="60.0" y="526.0" width="500.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="310.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">щоб увімкнути контролери в scope, спершу заберіть</tspan><tspan x="310.0" dy="14.3">з нього всі процеси: вузол, який роздає ресурс дітям,</tspan><tspan x="310.0" dy="14.3">сам процесів не тримає — інакше запис у</tspan><tspan x="310.0" dy="14.3">cgroup.subtree_control поверне EBUSY</tspan></text>
<rect x="640.0" y="60.0" width="440.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="860.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">НИЖЧЕ межі — ваше</tspan><tspan x="860.0" dy="14.3">mkdir і rmdir; у створеній вами теці</tspan><tspan x="860.0" dy="14.3">всі файли одразу належать вам</tspan></text>
<rect x="640.0" y="168.0" width="440.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="860.0" y="203.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">у самому зрізі віддано в оренду три файли:</tspan><tspan x="860.0" dy="14.3">cgroup.procs · cgroup.threads</tspan><tspan x="860.0" dy="14.3">cgroup.subtree_control</tspan></text>
<rect x="640.0" y="276.0" width="440.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="860.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">ВИЩЕ межі — systemd</tspan><tspan x="860.0" dy="14.3">його дерево перезбирається на кожному</tspan><tspan x="860.0" dy="14.3">daemon-reload; ваші зміни зникнуть</tspan></text>
<rect x="640.0" y="384.0" width="440.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="860.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">cpu.max і memory.max самого зрізу</tspan><tspan x="860.0" dy="14.3">виставляє systemd — властивостями юніта</tspan></text>
<rect x="640.0" y="476.0" width="440.0" height="146.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="860.0" y="524.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">перевірка перед стартом:</tspan><tspan x="860.0" dy="14.3">stat -fc %T /sys/fs/cgroup  →  cgroup2fs</tspan><tspan x="860.0" dy="14.3">cat cgroup.controllers  →  що вам справді дали</tspan><tspan x="860.0" dy="14.3">(у сеансі часто лише memory pids —</tspan><tspan x="860.0" dy="14.3">cpu долучають окремо)</tspan></text>
</svg>