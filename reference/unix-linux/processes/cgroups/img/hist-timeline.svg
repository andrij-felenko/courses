<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 852" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="852" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія cgroups</text>
<text x="540.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">від латки для машин з нерівномірною пам'яттю до одиниці обліку всієї машини</text>
<line x1="212.0" y1="74.0" x2="212.0" y2="764.0" stroke="#d7dbe0" stroke-width="2.0"/>
<rect x="60.0" y="74.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2004–2005</tspan></text>
<circle cx="212.0" cy="94.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="232.0" y="74.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.2"/><text x="626.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">cpusets: прив'язка до ядер і вузлів пам'яті. Каркас, з якого потім виросло все</tspan></text>
<rect x="60.0" y="128.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2006</tspan></text>
<circle cx="212.0" cy="148.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="232.0" y="128.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.2"/><text x="626.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">Google: «process containers» — узагальнення cpusets до довільних контролерів</tspan></text>
<rect x="60.0" y="182.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">кін. 2007</tspan></text>
<circle cx="212.0" cy="202.0" r="5.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<rect x="232.0" y="182.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="626.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">перейменування на «control groups»: слово «container» уже зайняте</tspan></text>
<rect x="60.0" y="236.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">січень 2008</tspan></text>
<circle cx="212.0" cy="256.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="232.0" y="236.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.2"/><text x="626.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">2.6.24: cgroups у ядрі. Кожен контролер — власна ієрархія</tspan></text>
<rect x="60.0" y="290.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2008–2012</tspan></text>
<circle cx="212.0" cy="310.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="232.0" y="290.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.2"/><text x="626.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">контролери множаться: пам'ять, blkio, квота процесора, freezer, PIDs</tspan></text>
<rect x="60.0" y="344.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="367.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">березень 2012</tspan></text>
<circle cx="212.0" cy="364.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="232.0" y="344.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.2"/><text x="626.0" y="367.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">публічне «так далі не можна»: роздільні дерева не дають списати відкладений запис</tspan></text>
<rect x="60.0" y="398.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="421.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">серпень 2014</tspan></text>
<circle cx="212.0" cy="418.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="398.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="421.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">3.16: єдине дерево під прапорцем __DEVEL__sane_behavior</tspan></text>
<rect x="60.0" y="452.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="475.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2015</tspan></text>
<circle cx="212.0" cy="472.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="452.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="475.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">4.2: облік відкладеного запису — та сама поломка, заради якої все й починалося</tspan></text>
<rect x="60.0" y="506.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="529.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">березень 2016</tspan></text>
<circle cx="212.0" cy="526.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="506.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="529.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">4.5: тип ФС cgroup2, інтерфейс оголошено стабільним — але без процесора</tspan></text>
<rect x="60.0" y="560.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="583.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2016–2017</tspan></text>
<circle cx="212.0" cy="580.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="232.0" y="560.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.2"/><text x="626.0" y="583.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">суперечка з планувальником: заборона процесів у вузлах і облік на процес, не на нитку</tspan></text>
<rect x="60.0" y="614.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="637.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">січень 2018</tspan></text>
<circle cx="212.0" cy="634.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="614.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="637.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">4.15: контролер процесора у v2 разом із «нитковим» режимом</tspan></text>
<rect x="60.0" y="668.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="691.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2018</tspan></text>
<circle cx="212.0" cy="688.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="668.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="691.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">4.20: PSI — не «скільки взяв», а «скільки простояв»</tspan></text>
<rect x="60.0" y="722.0" width="140.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="745.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">2019–2022</tspan></text>
<circle cx="212.0" cy="742.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="232.0" y="722.0" width="788.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.2"/><text x="626.0" y="745.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">дистрибутиви перемикаються за замовчуванням: Fedora 31 → Debian 11 → RHEL 9</tspan></text>
<text x="540.0" y="812.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">шістнадцять років між першою латкою й типовою машиною, де все це ввімкнено з коробки</text>
</svg>