<text x="76.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<rect x="340.0" y="56.0" width="610.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="645.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">перевищили max: відбір не витяг → OOM усередині цієї групи</tspan></text>
<line x1="185.0" y1="96.0" x2="185.0" y2="86.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="90.0" y="500.0" width="860.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="520.0" y="521.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">пам'ять доводиться і обмежувати зверху, і берегти знизу:</tspan><tspan x="520.0" dy="15.6">відбір сторінок глобальний, тож без підлоги важливий кеш вимиє</tspan><tspan x="520.0" dy="15.6">будь-яке фонове копіювання файлів у сусідній групі</tspan></text>
</svg>