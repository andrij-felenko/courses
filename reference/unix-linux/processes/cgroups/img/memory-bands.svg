<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять: чотири позначки замість однієї стелі</text>
<rect x="90.0" y="96.0" width="190.0" height="96.0" rx="0" fill="#fbe3df" stroke="#c0392b" stroke-width="1.6"/>
<text x="185.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">high … max</text>
<line x1="280.0" y1="144.0" x2="330.0" y2="144.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="340.0" y="110.0" width="610.0" height="68.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="645.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">ядро жене посилений відбір сторінок і присипляє нитку</tspan><tspan x="645.0" dy="14.3">на виході з ядра: чим глибше зайшов, тим довша затримка</tspan></text>
<rect x="90.0" y="192.0" width="190.0" height="96.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="185.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">low … high</text>
<line x1="280.0" y1="240.0" x2="330.0" y2="240.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="340.0" y="206.0" width="610.0" height="68.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="645.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">звичайна робота: ніхто нікого не чіпає</tspan></text>
<rect x="90.0" y="288.0" width="190.0" height="96.0" rx="0" fill="#e6f6ec" stroke="#27ae60" stroke-width="1.6"/>
<text x="185.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">min … low</text>
<line x1="280.0" y1="336.0" x2="330.0" y2="336.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="340.0" y="302.0" width="610.0" height="68.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="645.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">м'який захист: сторінки заберуть лише тоді,</tspan><tspan x="645.0" dy="14.3">коли більше нема звідки</tspan></text>
<rect x="90.0" y="384.0" width="190.0" height="96.0" rx="0" fill="#cdedd9" stroke="#27ae60" stroke-width="1.6"/>
<text x="185.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">0 … min</text>
<line x1="280.0" y1="432.0" x2="330.0" y2="432.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="340.0" y="398.0" width="610.0" height="68.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="645.0" y="435.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">тверда підлога: відбір сторінок сюди не заходить узагалі</tspan></text>
<line x1="82.0" y1="96.0" x2="90.0" y2="96.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="76.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">memory.max</text>
<line x1="82.0" y1="192.0" x2="90.0" y2="192.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="76.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">memory.high</text>
<line x1="82.0" y1="288.0" x2="90.0" y2="288.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="76.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">memory.low</text>
<line x1="82.0" y1="384.0" x2="90.0" y2="384.0" stroke="#6b7280" stroke-width="1.2"/>
