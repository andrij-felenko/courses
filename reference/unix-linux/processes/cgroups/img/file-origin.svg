<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файл у каталозі створює не сама група, а її батько</text>
<rect x="60.0" y="60.0" width="460.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="290.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">БАТЬКО   /sys/fs/cgroup/build</tspan></text>
<rect x="60.0" y="104.0" width="460.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="128.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">cgroup.controllers   (лише читання)</tspan><tspan x="290.0" dy="15.6">cpu   io   memory   pids</tspan></text>
<rect x="60.0" y="172.0" width="460.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="290.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">cgroup.subtree_control   (запис)</tspan><tspan x="290.0" dy="15.6">+cpu +memory</tspan></text>
<line x1="290.0" y1="236.0" x2="290.0" y2="284.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="292.0" width="460.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="290.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">ДИТИНА   /sys/fs/cgroup/build/job1</tspan></text>
<rect x="60.0" y="336.0" width="460.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">cgroup.controllers   (лише читання)</tspan><tspan x="290.0" dy="15.6">cpu   memory   — рівно те, що дав батько</tspan></text>
<rect x="560.0" y="104.0" width="460.0" height="150.0" rx="6" fill="#f7fdf9" stroke="#27ae60" stroke-width="1.6"/><text x="790.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">у каталозі дитини З'ЯВИЛИСЯ:</tspan><tspan x="790.0" dy="15.6">cpu.weight   cpu.weight.nice   cpu.max</tspan><tspan x="790.0" dy="15.6">cpu.max.burst   cpu.idle   cpu.uclamp.min</tspan><tspan x="790.0" dy="15.6">memory.max   memory.high   memory.low</tspan><tspan x="790.0" dy="15.6">memory.min   memory.events   memory.stat</tspan></text>
<rect x="560.0" y="292.0" width="460.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="790.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">і НЕ з'явилися:</tspan><tspan x="790.0" dy="15.6">io.max   io.weight   io.latency   pids.max</tspan><tspan x="790.0" dy="15.6">— батько не ввімкнув io й pids</tspan></text>
<line x1="528.0" y1="196.0" x2="552.0" y2="174.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="528.0" y1="212.0" x2="552.0" y2="332.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="428.0" width="960.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="540.0" y="452.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ядрові файли є в КОЖНОМУ каталозі незалежно від контролерів:</tspan><tspan x="540.0" dy="15.6">cgroup.type   cgroup.procs   cgroup.threads   cgroup.controllers</tspan><tspan x="540.0" dy="15.6">cgroup.subtree_control   cgroup.events   cgroup.stat   cgroup.freeze   cgroup.kill</tspan><tspan x="540.0" dy="15.6">cpu.stat   cpu.pressure   memory.pressure   io.pressure</tspan></text>
<rect x="60.0" y="530.0" width="960.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="540.0" y="555.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">у самого кореня /sys/fs/cgroup файлів обмежень немає: його ліміти нема кому ввімкнути</tspan></text>
</svg>