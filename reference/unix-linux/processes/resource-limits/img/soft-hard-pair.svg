<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ліміт — це пара чисел із різними правилами руху</text>
<line x1="80.0" y1="200.0" x2="950.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="80.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">0</text>
<text x="950.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">RLIM_INFINITY</text>
<line x1="400.0" y1="184.0" x2="400.0" y2="216.0" stroke="#2457d6" stroke-width="2.6"/>
<rect x="317.9" y="132.2" width="164.3" height="35.5" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="400.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">м'який · rlim_cur</tspan></text>
<line x1="780.0" y1="184.0" x2="780.0" y2="216.0" stroke="#c0392b" stroke-width="2.6"/>
<rect x="689.5" y="132.2" width="181.0" height="35.5" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="780.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">жорсткий · rlim_max</tspan></text>
<rect x="80.0" y="258.0" width="700.0" height="34.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="430.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">тут ядро дозволяє стояти м'якому значенню</tspan></text>
<rect x="40.0" y="340.0" width="290.0" height="122.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">м'який — будь-куди в [0, жорсткий]</tspan><tspan x="185.0" dy="16.9">без жодних особливих прав</tspan><tspan x="185.0" dy="16.9">саме це число ядро звіряє</tspan><tspan x="185.0" dy="16.9">на кожному запиті ресурсу</tspan></text>
<rect x="365.0" y="340.0" width="290.0" height="122.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">жорсткий — тільки ВНИЗ</tspan><tspan x="510.0" dy="16.9">теж без особливих прав,</tspan><tspan x="510.0" dy="16.9">але назад підняти вже не можна:</tspan><tspan x="510.0" dy="16.9">незворотне самообмеження</tspan></text>
<rect x="690.0" y="340.0" width="290.0" height="122.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="835.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">жорсткий — УГОРУ</tspan><tspan x="835.0" dy="16.9">лише з можливістю CAP_SYS_RESOURCE</tspan><tspan x="835.0" dy="16.9">для NOFILE є ще й окрема стеля</tspan><tspan x="835.0" dy="16.9">на саме значення — fs.nr_open</tspan></text>
<text x="510.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Два числа замість одного дають і делеговану стелю, і самообмеження — одним механізмом</text>
</svg>