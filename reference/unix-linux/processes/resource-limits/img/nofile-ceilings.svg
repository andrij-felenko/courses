<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки стель насправді стоїть над дескрипторами</text>
<line x1="110.0" y1="470.0" x2="110.0" y2="186.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="110.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">одна вісь:</text>
<text x="110.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">скільки дескрипторів</text>
<text x="110.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тримає ОДИН процес</text>
<line x1="94.0" y1="430.0" x2="126.0" y2="430.0" stroke="#2457d6" stroke-width="2.6"/>
<rect x="150.0" y="400.0" width="420.0" height="60.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">м'який RLIMIT_NOFILE — типово 1024</tspan><tspan x="360.0" dy="16.9">саме його ядро звіряє в open(): вище → EMFILE</tspan></text>
<line x1="94.0" y1="330.0" x2="126.0" y2="330.0" stroke="#c0392b" stroke-width="2.6"/>
<rect x="150.0" y="300.0" width="420.0" height="60.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">жорсткий RLIMIT_NOFILE — 512K у systemd від 240</tspan><tspan x="360.0" dy="16.9">стеля, до якої процес сам піднімає м'який</tspan></text>
<line x1="94.0" y1="230.0" x2="126.0" y2="230.0" stroke="#27ae60" stroke-width="2.6"/>
<rect x="150.0" y="200.0" width="420.0" height="60.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">fs.nr_open — типово 1 048 576</tspan><tspan x="360.0" dy="16.9">стеля для самого ЗНАЧЕННЯ жорсткого ліміту</tspan></text>
<rect x="620.0" y="230.0" width="320.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="780.0" y="283.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">fs.file-max</tspan><tspan x="780.0" dy="16.9"></tspan><tspan x="780.0" dy="16.9">ІНША вісь: рахує відкриті файли</tspan><tspan x="780.0" dy="16.9">в усій системі разом,</tspan><tspan x="780.0" dy="16.9">а не номер у одному процесі</tspan><tspan x="780.0" dy="16.9"></tspan><tspan x="780.0" dy="16.9">вичерпання дає ENFILE</tspan></text>
<rect x="150.0" y="486.0" width="790.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="545.0" y="514.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">EMFILE — уперся ти; ENFILE — уперлася система</tspan></text>
</svg>