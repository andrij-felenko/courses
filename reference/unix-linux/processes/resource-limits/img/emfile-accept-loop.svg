<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">EMFILE у циклі приймання: петля проти чесної відмови</text>
<rect x="120.0" y="44.0" width="400.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="320.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">без резервного дескриптора</tspan></text>
<rect x="610.0" y="44.0" width="400.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="810.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">з резервним дескриптором</tspan></text>
<rect x="120.0" y="122.0" width="400.0" height="56.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">epoll_wait: слухач готовий</tspan></text>
<line x1="320.0" y1="182.0" x2="320.0" y2="202.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="208.0" width="400.0" height="56.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="240.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">accept4() → EMFILE</tspan></text>
<line x1="320.0" y1="268.0" x2="320.0" y2="288.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="294.0" width="400.0" height="56.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">з'єднання лишилося в черзі —</tspan><tspan x="320.0" dy="17.6">слухач і далі «готовий»</tspan></text>
<line x1="320.0" y1="354.0" x2="320.0" y2="374.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="380.0" width="400.0" height="56.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">epoll_wait будить одразу знову</tspan></text>
<line x1="114.0" y1="408.0" x2="74.0" y2="408.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="74.0" y1="408.0" x2="74.0" y2="150.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="74.0" y1="150.0" x2="112.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="122.0" width="400.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">accept4() → EMFILE</tspan></text>
<line x1="810.0" y1="182.0" x2="810.0" y2="202.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="208.0" width="400.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="231.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">close(spare) —</tspan><tspan x="810.0" dy="17.6">один номер під межею вільний</tspan></text>
<line x1="810.0" y1="268.0" x2="810.0" y2="288.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="294.0" width="400.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">accept4() → з'єднання прийнято</tspan></text>
<line x1="810.0" y1="354.0" x2="810.0" y2="374.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="380.0" width="400.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">close(client) —</tspan><tspan x="810.0" dy="17.6">клієнт бачить розрив одразу</tspan></text>
<line x1="810.0" y1="440.0" x2="810.0" y2="460.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="466.0" width="400.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">spare = open(&quot;/dev/null&quot;) —</tspan><tspan x="810.0" dy="17.6">резерв на місці до наступного разу</tspan></text>
<rect x="120.0" y="572.0" width="400.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="601.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">петля без жодного поступу:</tspan><tspan x="320.0" dy="16.9">ядро процесора зайняте вщент,</tspan><tspan x="320.0" dy="16.9">у журналі — той самий рядок без упину</tspan></text>
<rect x="610.0" y="572.0" width="400.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="601.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">черга спорожніла, слухач замовк:</tspan><tspan x="810.0" dy="16.9">перевантаження нікуди не зникло,</tspan><tspan x="810.0" dy="16.9">але стало чесною відмовою</tspan></text>
<text x="560.0" y="700.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Різниця лише в одному наперед відкритому дескрипторі, який ні для чого не вживають і закривають саме в цю мить</text>
</svg>