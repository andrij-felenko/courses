<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форму ліміту диктує не ресурс, а наявність моменту запиту</text>
<rect x="40.0" y="62.0" width="300.0" height="468.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="190.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Відмова у запиті</text>
<text x="190.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">є момент, коли процес просить</text>
<text x="190.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">коли ядро дивиться</text>
<rect x="56.0" y="162.0" width="268.0" height="80.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.3"/><text x="190.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">процес просить у ядра об'єкт:</tspan><tspan x="190.0" dy="16.9">open, socket, fork, mmap, brk</tspan></text>
<text x="190.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">які саме ліміти</text>
<rect x="56.0" y="284.0" width="268.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="190.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">NOFILE · NPROC · SIGPENDING</tspan><tspan x="190.0" dy="16.9">MSGQUEUE · MEMLOCK</tspan><tspan x="190.0" dy="16.9">AS · DATA · STACK</tspan></text>
<text x="190.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">як це бачить програма</text>
<rect x="56.0" y="406.0" width="268.0" height="88.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.3"/><text x="190.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">звичайна помилка виклику:</tspan><tspan x="190.0" dy="16.9">EMFILE, EAGAIN, ENOMEM</tspan><tspan x="190.0" dy="16.9">слова «ліміт» ніде немає</tspan></text>
<rect x="370.0" y="62.0" width="300.0" height="468.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="520.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Сигнал під час споживання</text>
<text x="520.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запиту немає — ресурс тече</text>
<text x="520.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">коли ядро дивиться</text>
<rect x="386.0" y="162.0" width="268.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.3"/><text x="520.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ядро звіряє накопичений</tspan><tspan x="520.0" dy="16.9">лічильник на тиках таймера</tspan></text>
<text x="520.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">які саме ліміти</text>
<rect x="386.0" y="284.0" width="268.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="520.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">CPU · RTTIME</tspan><tspan x="520.0" dy="16.9">FSIZE — гібрид: і сигнал,</tspan><tspan x="520.0" dy="16.9">і помилка write</tspan></text>
<text x="520.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">як це бачить програма</text>
<rect x="386.0" y="406.0" width="268.0" height="88.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.3"/><text x="520.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">SIGXCPU на м'якому,</tspan><tspan x="520.0" dy="16.9">SIGKILL на жорсткому,</tspan><tspan x="520.0" dy="16.9">SIGXFSZ і EFBIG для файлу</tspan></text>
<rect x="700.0" y="62.0" width="300.0" height="468.0" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="850.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Перевіряти нема де</text>
<text x="850.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ресурс не просять — він виникає</text>
<text x="850.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">коли ядро дивиться</text>
<rect x="716.0" y="162.0" width="268.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="850.0" y="189.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">сторінка стає резидентною</tspan><tspan x="850.0" dy="16.9">від дотику, а йде — від</tspan><tspan x="850.0" dy="16.9">витіснення, не від виклику</tspan></text>
<text x="850.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">які саме ліміти</text>
<rect x="716.0" y="284.0" width="268.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="850.0" y="320.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">RSS — не діє з 2.4.30</tspan><tspan x="850.0" dy="16.9">LOCKS — знято в 2.4.25</tspan></text>
<text x="850.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">як це бачить програма</text>
<rect x="716.0" y="406.0" width="268.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="850.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">жодного прояву:</tspan><tspan x="850.0" dy="16.9">значення можна виставити,</tspan><tspan x="850.0" dy="16.9">але його просто ігнорують</tspan></text>
<rect x="40.0" y="566.0" width="960.0" height="88.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="597.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Третій стовпець — не недогляд реалізації, а межа самої моделі:</tspan><tspan x="520.0" dy="17.6">де немає моменту запиту, туди ліміт на окремий процес нема куди вставити.</tspan><tspan x="520.0" dy="17.6">Відповіддю став інший механізм — облік і витіснення на ГРУПУ процесів (cgroups).</tspan></text>
</svg>