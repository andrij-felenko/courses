<text x="760.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="760.0" dy="0.0">взяти інший спін-замок</tspan><tspan x="760.0" dy="18.1">GFP_ATOMIC</tspan><tspan x="760.0" dy="18.1">атомарні операції</tspan></text>
