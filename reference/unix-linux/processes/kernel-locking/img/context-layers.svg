<rect x="420.0" y="92.0" width="300.0" height="84.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="570.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">задача в ядрі</tspan></text>
<text x="760.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="760.0" dy="0.0">заснути · взяти м'ютекс</tspan><tspan x="760.0" dy="18.1">виділити пам'ять з GFP_KERNEL</tspan><tspan x="760.0" dy="18.1">взяти будь-який спін-замок</tspan></text>
