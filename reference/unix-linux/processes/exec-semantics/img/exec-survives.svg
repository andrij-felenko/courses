<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що переживає заміну образу, а що гине</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило: переживає запис у ядрі, гине адреса в образі</text>
<text x="275.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">переживає заміну</text>
<text x="765.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">гине разом зі старим образом</text>
<rect x="50.0" y="94.0" width="450.0" height="300.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="275.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">номер процесу, батько, група, сеанс</tspan><tspan x="275.0" dy="17.6">керівний термінал</tspan><tspan x="275.0" dy="17.6">справжні uid і gid, додаткові групи</tspan><tspan x="275.0" dy="17.6">поточний і кореневий каталоги, umask</tspan><tspan x="275.0" dy="17.6">дескриптори без позначки close-on-exec</tspan><tspan x="275.0" dy="17.6">обмеження ресурсів, nice, спожитий час</tspan><tspan x="275.0" dy="17.6">блокування записів у файлах (fcntl)</tspan><tspan x="275.0" dy="17.6">маска сигналів і черга нерозданих</tspan><tspan x="275.0" dy="17.6">alarm і три інтервальні таймери</tspan></text>
<rect x="540.0" y="94.0" width="450.0" height="300.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="765.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">усі відображення: код, дані, купа, стеки</tspan><tspan x="765.0" dy="17.6">ділянки mmap і спільна пам'ять</tspan><tspan x="765.0" dy="17.6">значення регістрів</tspan><tspan x="765.0" dy="17.6">решта потоків — без жодного прибирання</tspan><tspan x="765.0" dy="17.6">обробники atexit, каталогові потоки</tspan><tspan x="765.0" dy="17.6">альтернативний стек сигналів, замки mlock</tspan><tspan x="765.0" dy="17.6">таймери, створені timer_create</tspan><tspan x="765.0" dy="17.6">середовище обчислень з рухомою комою</tspan><tspan x="765.0" dy="17.6">дескриптори з позначкою close-on-exec</tspan></text>
<text x="520.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевірка правила: диспозиція сигналу розпадається за ним надвоє</text>
<rect x="35.0" y="452.0" width="306.0" height="110.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="188.0" y="486.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">спійманий сигнал</tspan><tspan x="188.0" dy="16.9">— це АДРЕСА обробника</tspan><tspan x="188.0" dy="16.9">у старому образі</tspan><tspan x="188.0" dy="16.9">→ скинуто на типову дію</tspan></text>
<rect x="367.0" y="452.0" width="306.0" height="110.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="494.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">«ігнорувати» й «типова дія»</tspan><tspan x="520.0" dy="16.9">— це позначки, не адреси</tspan><tspan x="520.0" dy="16.9">→ лишаються як були</tspan></text>
<rect x="699.0" y="452.0" width="306.0" height="110.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="852.0" y="494.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="852.0" dy="0.0">маска й черга нерозданих</tspan><tspan x="852.0" dy="16.9">живуть у структурах ядра</tspan><tspan x="852.0" dy="16.9">→ переходять цілими</tspan></text>
<rect x="50.0" y="590.0" width="940.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="520.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Той самий поділ пояснює таймери: alarm і setitimer названі сталими, які знає будь-яка програма,</tspan><tspan x="520.0" dy="17.6">тож переходять; таймер від timer_create має ідентифікатор, виданий тій програмі, якої вже немає.</tspan></text>
</svg>