<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях «#!» від листа до звичаю</text>
<rect x="50.0" y="72.0" width="250.0" height="74.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="175.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1979 · Сьома редакція</tspan></text>
<rect x="330.0" y="72.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="105.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">exec розуміє лише двійковий файл; сценарій запускає оболонка,</tspan><tspan x="680.0" dy="16.9">підхопивши відмову ENOEXEC, — і в списку процесів видно її, не сценарій</tspan></text>
<rect x="50.0" y="160.0" width="250.0" height="74.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="175.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">бл. 1978 · csh, Берклі</tspan></text>
<rect x="330.0" y="160.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">перший символ «#» означає «сценарій мій»; усе інше csh віддає</tspan><tspan x="680.0" dy="16.9">стандартній оболонці — домовленість на один символ, без імені програми</tspan></text>
<rect x="50.0" y="248.0" width="250.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="175.0" y="289.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">10 січня 1980 · Bell Labs</tspan></text>
<rect x="330.0" y="248.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">лист Денніса Рітчі: ядро саме читає «#!» і бере решту рядка</tspan><tspan x="680.0" dy="16.9">за ім'я інтерпретатора; усередині Bell Labs — Восьма редакція</tspan></text>
<rect x="50.0" y="336.0" width="250.0" height="74.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/><text x="175.0" y="377.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">жовтень 1980 · 4.0BSD</tspan></text>
<rect x="330.0" y="336.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">код у системі є, але типово вимкнений; рядок короткий,</tspan><tspan x="680.0" dy="16.9">аргумент після імені інтерпретатора ще не доходить</tspan></text>
<rect x="50.0" y="424.0" width="250.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="175.0" y="465.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">вересень 1983 · 4.2BSD</tspan></text>
<rect x="330.0" y="424.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="457.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">увімкнено типово (kern_exec.c, Роберт Елз) — саме звідси звичай</tspan><tspan x="680.0" dy="16.9">розходиться по всьому світу разом із берклійськими стрічками</tspan></text>
<rect x="50.0" y="512.0" width="250.0" height="74.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/><text x="175.0" y="553.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1988 · SVR4</tspan></text>
<rect x="330.0" y="512.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">перша ПУБЛІЧНА система від AT&amp;T із «#!»: вісім років потому,</tspan><tspan x="680.0" dy="16.9">як механізм народився в тій-таки компанії</tspan></text>
<rect x="50.0" y="600.0" width="250.0" height="74.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="641.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">POSIX · донині</tspan></text>
<rect x="330.0" y="600.0" width="700.0" height="74.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="680.0" y="633.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">не стандартизовано: комітет не може приписати, за яким шляхом</tspan><tspan x="680.0" dy="16.9">у системі лежить інтерпретатор, — тож механізм лишився звичаєм</tspan></text>
</svg>