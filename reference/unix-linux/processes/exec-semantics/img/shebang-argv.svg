<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як «#!» переписує масив аргументів</text>
<text x="530.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файл із «#!»: ядро переписує argv</text>
<rect x="60.0" y="66.0" width="440.0" height="66.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="280.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">користувач набрав:</tspan><tspan x="280.0" dy="17.6">report data.csv --dry-run</tspan></text>
<rect x="560.0" y="66.0" width="440.0" height="66.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="780.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">перший рядок файлу report:</tspan><tspan x="780.0" dy="17.6">#!/usr/bin/awk -f</tspan></text>
<line x1="530.0" y1="138.0" x2="530.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро складає новий масив аргументів</text>
<text x="130.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">argv[0]</text>
<rect x="146.0" y="210.0" width="350.0" height="46.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="321.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">/usr/bin/awk</tspan></text>
<rect x="530.0" y="216.0" width="470.0" height="34.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.1"/><text x="765.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">ім'я інтерпретатора з рядка «#!»</tspan></text>
<text x="130.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">argv[1]</text>
<rect x="146.0" y="266.0" width="350.0" height="46.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="321.0" y="293.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">-f</tspan></text>
<rect x="530.0" y="272.0" width="470.0" height="34.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.1"/><text x="765.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">усе після імені — ОДНИМ рядком</tspan></text>
<text x="130.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">argv[2]</text>
<rect x="146.0" y="322.0" width="350.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="321.0" y="349.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">/usr/local/bin/report</tspan></text>
<rect x="530.0" y="328.0" width="470.0" height="34.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.1"/><text x="765.0" y="349.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">шлях до самого файлу-сценарію</tspan></text>
<text x="130.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">argv[3]</text>
<rect x="146.0" y="378.0" width="350.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="321.0" y="405.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">data.csv</tspan></text>
<rect x="530.0" y="384.0" width="470.0" height="34.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.1"/><text x="765.0" y="405.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">аргументи користувача, від argv[1]</tspan></text>
<text x="130.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">argv[4]</text>
<rect x="146.0" y="434.0" width="350.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="321.0" y="461.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">--dry-run</tspan></text>
<rect x="530.0" y="440.0" width="470.0" height="34.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.1"/><text x="765.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">аргументи користувача, від argv[1]</tspan></text>
<line x1="60.0" y1="512.0" x2="1000.0" y2="512.0" stroke="#c8ced6" stroke-width="1.4"/>
<text x="60.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">та сама властивість — і найпоширеніша пастка</text>
<rect x="60.0" y="560.0" width="440.0" height="66.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="597.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">#!/usr/bin/env python3 -u</tspan></text>
<line x1="510.0" y1="593.0" x2="550.0" y2="593.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="560.0" width="440.0" height="66.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="589.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">argv[1] = «python3 -u» — один рядок</tspan><tspan x="780.0" dy="16.9">із пробілом усередині імені програми</tspan></text>
<rect x="60.0" y="644.0" width="940.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="530.0" y="674.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">env шукає програму з таким іменем і не знаходить: ключ до інтерпретатора так не передати.</tspan></text>
</svg>