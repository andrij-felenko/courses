<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 880" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="880" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок дій execve і точка неповернення</text>
<text x="510.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">execve: спершу все, що може відмовити</text>
<rect x="50.0" y="76.0" width="520.0" height="62.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="102.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">відкрити файл, перевірити право на виконання,</tspan><tspan x="310.0" dy="17.6">noexec і чи не пише в файл хтось інший</tspan></text>
<rect x="610.0" y="86.0" width="360.0" height="42.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="790.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">−1:  EACCES · ENOENT · ETXTBSY</tspan></text>
<rect x="50.0" y="154.0" width="520.0" height="62.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">прочитати перші байти й запропонувати їх</tspan><tspan x="310.0" dy="17.6">обробникам форматів: ELF, «#!», інші</tspan></text>
<rect x="610.0" y="164.0" width="360.0" height="42.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="790.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">−1:  ENOEXEC</tspan></text>
<rect x="50.0" y="232.0" width="520.0" height="62.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">розібрати заголовки, знайти інтерпретатор</tspan><tspan x="310.0" dy="17.6">(завантажувач або інтерпретатор сценарію)</tspan></text>
<rect x="610.0" y="242.0" width="360.0" height="42.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="790.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">−1:  ENOENT · ELOOP</tspan></text>
<rect x="50.0" y="310.0" width="520.0" height="62.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">скопіювати argv і envp у нове відображення:</tspan><tspan x="310.0" dy="17.6">старий простір зараз зникне</tspan></text>
<rect x="610.0" y="320.0" width="360.0" height="42.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="790.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">−1:  E2BIG · ENOMEM</tspan></text>
<line x1="50.0" y1="396.0" x2="970.0" y2="396.0" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 6"/>
<text x="58.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">точка неповернення</text>
<rect x="50.0" y="422.0" width="520.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">поставити нове відображення пам'яті,</tspan><tspan x="310.0" dy="17.6">викинути старе</tspan></text>
<rect x="50.0" y="500.0" width="520.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="527.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">знищити решту потоків без прибирання,</tspan><tspan x="310.0" dy="17.6">скинути спіймані сигнали на типову дію</tspan></text>
<rect x="50.0" y="578.0" width="520.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="605.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">розкласти сегменти з файлу, стек,</tspan><tspan x="310.0" dy="17.6">допоміжний вектор</tspan></text>
<rect x="50.0" y="656.0" width="520.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="683.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">регістри на точку входу —</tspan><tspan x="310.0" dy="17.6">виконується вже інша програма</tspan></text>
<rect x="610.0" y="482.0" width="360.0" height="130.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="509.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">старої програми вже немає,</tspan><tspan x="790.0" dy="16.9">нової ще немає — повертати</tspan><tspan x="790.0" dy="16.9">−1 нема кому й нікуди.</tspan><tspan x="790.0" dy="16.9">Будь-яка помилка тут:</tspan><tspan x="790.0" dy="16.9">ядро надсилає SIGSEGV</tspan><tspan x="790.0" dy="16.9">(до версії 3.17 — SIGKILL)</tspan></text>
<rect x="50.0" y="746.0" width="920.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="510.0" y="770.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Ззовні виклик атомарний: процес або досі виконує стару програму й має errno,</tspan><tspan x="510.0" dy="17.6">або вже виконує нову. Проміжного стану програміст не бачить ніколи.</tspan></text>
</svg>