<rect x="50.0" y="224.0" width="380.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">fd 3  →  /tmp/exec-probe.dat</tspan><tspan x="240.0" dy="18.2">зсув виставлено на 10</tspan></text>
<rect x="610.0" y="104.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">fd 0, 1, 2 — той самий термінал</tspan></text>
