<rect x="300.0" y="396.0" width="440.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="520.0" y="430.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">той самий опис відкритого файлу</tspan><tspan x="520.0" dy="18.2">інод файлу · режим O_RDWR · зсув 10</tspan></text>
<text x="520.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">Таблиця дескрипторів належить процесові, а не образові,</tspan><tspan x="520.0" dy="16.9">тому переживає заміну разом з описом відкритого файлу.</tspan></text>
