<rect x="610.0" y="224.0" width="380.0" height="52.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">fd 3 — те саме, що й було</tspan><tspan x="800.0" dy="18.2">lseek(fd, 0, SEEK_CUR) → 10</tspan></text>
