<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи дістати чистий контекст</text>
<rect x="30.0" y="56.0" width="580.0" height="452.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="320.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#333333" text-anchor="middle" font-weight="700">Демон готує контекст сам</text>
<rect x="60.0" y="116.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fork() — вийти з дерева оболонки</tspan></text>
<rect x="60.0" y="178.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">setsid() — позбутися термінала</tspan></text>
<rect x="60.0" y="240.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">fork() — не здобути його знову</tspan></text>
<rect x="60.0" y="302.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">chdir(&quot;/&quot;) і явна umask()</tspan></text>
<rect x="60.0" y="364.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="392.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">закрити fd, зайняти 0–2 через /dev/null</tspan></text>
<rect x="60.0" y="426.0" width="520.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="320.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">скинути диспозиції й маску сигналів</tspan></text>
<rect x="147.0" y="527.0" width="346.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="320.0" dy="0.0">код виходу втрачено — готовність доводиться</tspan><tspan x="320.0" dy="16.9">передавати саморобною трубою, номер — файлом</tspan></text>
<rect x="630.0" y="56.0" width="580.0" height="452.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="920.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Менеджер служб дає контекст</text>
<rect x="660.0" y="116.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">без термінала, власний сеанс</tspan></text>
<rect x="660.0" y="178.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">визначені cwd, umask, ліміти, права</tspan></text>
<rect x="660.0" y="240.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">stdout і stderr — одразу в журнал</tspan></text>
<rect x="660.0" y="302.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">власна cgroup, з якої не вийти</tspan></text>
<rect x="660.0" y="364.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="392.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">сокети можуть бути відкриті наперед</tspan></text>
<rect x="660.0" y="426.0" width="520.0" height="48.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="920.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">готовність — sd_notify(READY=1)</tspan></text>
<rect x="758.1" y="527.0" width="323.8" height="49.9" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="920.0" dy="0.0">програма лишається на передньому плані:</tspan><tspan x="920.0" dy="16.9">менеджер бачить її код виходу й керує нею</tspan></text>
<text x="620.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">властивості ті самі — різниця в тому, хто їх забезпечує і чи лишається зворотний зв'язок</text>
</svg>