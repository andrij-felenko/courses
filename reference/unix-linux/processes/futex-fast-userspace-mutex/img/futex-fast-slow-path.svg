<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи виконання Futex: Fast Path vs Slow Path</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи виконання Futex: Fast Path (Userspace) vs Slow Path (Kernel)</text>
<rect x="40.0" y="60.0" width="490.0" height="470.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="285.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Fast Path (без конкуренції)</text>
<text x="285.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Виконується 100% у просторі користувача</text>
<rect x="70.0" y="145.0" width="430.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="285.0" y="168.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Потік А: lock()</tspan><tspan x="285.0" dy="18.2">Спроба CAS (0 -&gt; 1) за адресою uaddr</tspan></text>
<line x1="285.0" y1="200.0" x2="285.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="235.0" width="430.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="252.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Апаратна інструкція CPU</tspan><tspan x="285.0" dy="16.9">cmpxchg / LDREX-STREX</tspan><tspan x="285.0" dy="16.9">Оновлення пам'яті в L1/L2 кеші</tspan></text>
<line x1="285.0" y1="295.0" x2="285.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="330.0" width="430.0" height="65.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Результат: УСПІХ (М'ютекс захоплено)</tspan><tspan x="285.0" dy="16.9">Виклику sys_futex() НЕМАЄ</tspan><tspan x="285.0" dy="16.9">Затримка: ~5-15 тактів CPU (~2-5 нс)</tspan></text>
<text x="285.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Межа між простором користувача та ядром НЕ перетинається</text>
<text x="285.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Контекст не зберігається, TLB не скидається</text>
<rect x="570.0" y="60.0" width="490.0" height="470.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="815.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Slow Path (наявна конкуренція)</text>
<text x="815.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Залучення ядра Linux для засинання</text>
<rect x="600.0" y="145.0" width="430.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="168.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Потік Б: lock()</tspan><tspan x="815.0" dy="18.2">Спроба CAS повертає 1 (Зайнято)</tspan></text>
<line x1="815.0" y1="200.0" x2="815.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="235.0" width="430.0" height="60.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="252.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Системний виклик sys_futex(FUTEX_WAIT)</tspan><tspan x="815.0" dy="16.9">Перехід у режим ядра (syscall / sysenter)</tspan><tspan x="815.0" dy="16.9">Атомарна перевірка *uaddr == val під hb-&gt;lock</tspan></text>
<line x1="815.0" y1="295.0" x2="815.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="330.0" width="430.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Додавання потоку в futex_hash_bucket</tspan><tspan x="815.0" dy="16.9">Перевід потоку в стан TASK_INTERRUPTIBLE</tspan><tspan x="815.0" dy="16.9">Затримка: ~1000-2000 тактів CPU (~1-2 мкс)</tspan></text>
<text x="815.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">Повна збереженість контексту та виклик планировщика</text>
<text x="815.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пробудження іншим потоком через FUTEX_WAKE</text>
</svg>