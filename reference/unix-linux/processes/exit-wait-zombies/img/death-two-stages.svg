<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завершення у два кроки: що звільняють одразу, а що чекає на wait</text>
<rect x="30.0" y="80.0" width="300.0" height="52.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="111.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">живий процес</tspan></text>
<text x="180.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що система ще тримає</text>
<rect x="30.0" y="182.0" width="300.0" height="152.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">адресний простір і відображення</tspan><tspan x="180.0" dy="16.9">таблиця дескрипторів</tspan><tspan x="180.0" dy="16.9">таймери, замки, черга сигналів</tspan><tspan x="180.0" dy="16.9">номер PID і місце в дереві</tspan><tspan x="180.0" dy="16.9">право виконуватися</tspan></text>
<text x="180.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">чого вже немає</text>
<rect x="30.0" y="386.0" width="300.0" height="156.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.3"/><text x="180.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">нічого ще не звільнено</tspan></text>
<rect x="30.0" y="580.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="180.0" y="622.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ps показує R або S</tspan></text>
<rect x="440.0" y="80.0" width="300.0" height="52.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="590.0" y="111.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">зомбі</tspan></text>
<text x="590.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що система ще тримає</text>
<rect x="440.0" y="182.0" width="300.0" height="152.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">рядок у таблиці процесів</tspan><tspan x="590.0" dy="16.9">номер PID — досі зайнятий</tspan><tspan x="590.0" dy="16.9">код виходу або сигнал смерті</tspan><tspan x="590.0" dy="16.9">лічильники витраченого часу</tspan><tspan x="590.0" dy="16.9">посилання на батька</tspan></text>
<text x="590.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">чого вже немає</text>
<rect x="440.0" y="386.0" width="300.0" height="156.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.3"/><text x="590.0" y="434.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">адресний простір цілком</tspan><tspan x="590.0" dy="16.9">усі дескриптори закрито</tspan><tspan x="590.0" dy="16.9">таймери й замки знято</tspan><tspan x="590.0" dy="16.9">стек ядра звільнено</tspan><tspan x="590.0" dy="16.9">діти перечеплені до підбирача</tspan></text>
<rect x="440.0" y="580.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="590.0" y="614.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">ps показує Z, «&lt;defunct&gt;»</tspan><tspan x="590.0" dy="16.9">сигнали на нього не діють</tspan></text>
<rect x="850.0" y="80.0" width="300.0" height="52.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="1000.0" y="111.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">прибрано</tspan></text>
<text x="1000.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що система ще тримає</text>
<rect x="850.0" y="182.0" width="300.0" height="152.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">нічого:</tspan><tspan x="1000.0" dy="16.9">запису про процес більше немає</tspan></text>
<text x="1000.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">чого вже немає</text>
<rect x="850.0" y="386.0" width="300.0" height="156.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.3"/><text x="1000.0" y="460.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1000.0" dy="0.0">рядок таблиці звільнено</tspan><tspan x="1000.0" dy="16.9">номер PID знову вільний</tspan></text>
<rect x="850.0" y="580.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="1000.0" y="614.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">процесу не існує;</tspan><tspan x="1000.0" dy="16.9">wait на нього дасть ECHILD</tspan></text>
<line x1="336.0" y1="106.0" x2="434.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="385.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">exit()</text>
<line x1="746.0" y1="106.0" x2="844.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="795.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">wait()</text>
<rect x="30.0" y="690.0" width="1120.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="590.0" y="719.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Перший крок робить сам процес і ядро — він звільняє все, за що платить пам'яттю.</tspan><tspan x="590.0" dy="17.6">Другий робить БАТЬКО, забираючи результат: доти запис мусить існувати, бо результат ще нікому не віддано.</tspan></text>
</svg>