<rect x="90.0" y="526.0" width="440.0" height="150.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="310.0" y="579.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">обробник кличе waitpid() ОДИН раз</tspan><tspan x="310.0" dy="17.6"></tspan><tspan x="310.0" dy="17.6">прибрано 2 дітей із 5</tspan><tspan x="310.0" dy="17.6">троє лишаються зомбі назавжди</tspan></text>
