<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Смертей п'ять, сигналів два: чому прибирати треба циклом</text>
<text x="550.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">п'ять дітей завершуються двома тісними групами — а сигналів доставлено два</text>
<rect x="300.0" y="92.0" width="500.0" height="82.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="550.0" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">SIGCHLD — звичайний сигнал, він не чергується:</tspan><tspan x="550.0" dy="16.9">другий примірник, що застав перший ще не</tspan><tspan x="550.0" dy="16.9">доправленим, просто зникає</tspan></text>
<text x="230.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">процеси-діти</text>
