<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири долі мертвої дитини — і лише одна з них лишає зомбі</text>
<rect x="20.0" y="66.0" width="280.0" height="62.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="160.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">батько кличе wait()</tspan></text>
<line x1="160.0" y1="132.0" x2="160.0" y2="158.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20.0" y="162.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="160.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">wait, waitpid або waitid</tspan><tspan x="160.0" dy="16.9">блокує або питає з WNOHANG</tspan></text>
<line x1="160.0" y1="258.0" x2="160.0" y2="284.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20.0" y="288.0" width="280.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ядро віддає статус</tspan><tspan x="160.0" dy="16.9">і звільняє запис задачі</tspan><tspan x="160.0" dy="16.9">номер PID знову вільний</tspan></text>
<line x1="160.0" y1="392.0" x2="160.0" y2="418.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20.0" y="422.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="160.0" y="472.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">нормальний перебіг</tspan></text>
<rect x="20.0" y="548.0" width="280.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="160.0" y="588.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">код виходу: доставлено</tspan></text>
<line x1="160.0" y1="518.0" x2="160.0" y2="544.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="66.0" width="280.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="460.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">батько живий,</tspan><tspan x="460.0" dy="18.9">але не чекає</tspan></text>
<line x1="460.0" y1="132.0" x2="460.0" y2="158.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="162.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="460.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">SIGCHLD типово ігнорується,</tspan><tspan x="460.0" dy="16.9">тож ніщо не нагадує</tspan></text>
<line x1="460.0" y1="258.0" x2="460.0" y2="284.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="288.0" width="280.0" height="100.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">запис лишається зомбі</tspan><tspan x="460.0" dy="16.9">стільки, скільки живе батько</tspan></text>
<line x1="460.0" y1="392.0" x2="460.0" y2="418.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320.0" y="422.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="460.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">зомбі накопичуються,</tspan><tspan x="460.0" dy="16.9">номери PID зайняті</tspan></text>
<rect x="320.0" y="548.0" width="280.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="460.0" y="588.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">код виходу: чекає вічно</tspan></text>
<line x1="460.0" y1="518.0" x2="460.0" y2="544.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="66.0" width="280.0" height="62.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="760.0" y="92.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">батько поставив SIGCHLD</tspan><tspan x="760.0" dy="18.9">у SIG_IGN</tspan></text>
<line x1="760.0" y1="132.0" x2="760.0" y2="158.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="162.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="760.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">або sigaction із прапорцем</tspan><tspan x="760.0" dy="16.9">SA_NOCLDWAIT</tspan></text>
<line x1="760.0" y1="258.0" x2="760.0" y2="284.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="288.0" width="280.0" height="100.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="760.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ядро прибирає дитину саме,</tspan><tspan x="760.0" dy="16.9">зомбі не виникає взагалі</tspan></text>
<line x1="760.0" y1="392.0" x2="760.0" y2="418.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="422.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="760.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">wait поверне ECHILD:</tspan><tspan x="760.0" dy="16.9">чекати вже нема на кого</tspan></text>
<rect x="620.0" y="548.0" width="280.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="760.0" y="588.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">код виходу: утрачено</tspan></text>
<line x1="760.0" y1="518.0" x2="760.0" y2="544.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="920.0" y="66.0" width="280.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="1060.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">батько помер раніше</tspan></text>
<line x1="1060.0" y1="132.0" x2="1060.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="920.0" y="162.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="1060.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">дитину перечеплено</tspan><tspan x="1060.0" dy="16.9">до підбирача або до PID 1</tspan></text>
<line x1="1060.0" y1="258.0" x2="1060.0" y2="284.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="920.0" y="288.0" width="280.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="1060.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">новий батько дістає SIGCHLD</tspan><tspan x="1060.0" dy="16.9">і забирає статус</tspan></text>
<line x1="1060.0" y1="392.0" x2="1060.0" y2="418.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="920.0" y="422.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="1060.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">дерево не рветься,</tspan><tspan x="1060.0" dy="16.9">прибирання гарантоване</tspan></text>
<rect x="920.0" y="548.0" width="280.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="1060.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">код виходу: не тому,</tspan><tspan x="1060.0" dy="17.6">хто його запускав</tspan></text>
<line x1="1060.0" y1="518.0" x2="1060.0" y2="544.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20.0" y="650.0" width="1180.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="610.0" y="679.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Зомбі — не окремий різновид збою, а єдиний із чотирьох варіантів, у якому результат нікому не віддано</tspan><tspan x="610.0" dy="17.6">й ніхто по нього не прийде. Три інші закінчуються тим, що запис про померлого зникає.</tspan></text>
</svg>