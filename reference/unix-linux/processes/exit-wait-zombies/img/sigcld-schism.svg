<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один слот, дві задачі: як розійшлися SIGCLD і SIGCHLD і хто їх помирив</text>
<rect x="40.0" y="250.0" width="280.0" height="140.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="180.0" y="298.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">спільний корінь</tspan><tspan x="180.0" dy="17.6">1971 · wait у першій редакції</tspan><tspan x="180.0" dy="17.6">1973—74 · стан SZOMB у ядрі</tspan><tspan x="180.0" dy="17.6">батько мусить прийти по статус</tspan></text>
<rect x="420.0" y="90.0" width="380.0" height="46.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">System III, 1980 — SIGCLD (18)</tspan></text>
<rect x="420.0" y="144.0" width="380.0" height="160.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.4"/><text x="610.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">сенс: «дитина померла»</tspan><tspan x="610.0" dy="16.9">SIG_IGN — ядро прибирає зомбі саме</tspan><tspan x="610.0" dy="16.9">обробник не скидається на типову дію</tspan><tspan x="610.0" dy="16.9">сигнали не зливаються: по одному на смерть</tspan></text>
<rect x="420.0" y="396.0" width="380.0" height="46.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="610.0" y="423.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">4.1cBSD / 4.2BSD, 1982—83 — SIGCHLD (20)</tspan></text>
<rect x="420.0" y="450.0" width="380.0" height="160.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.4"/><text x="610.0" y="509.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">сенс: «стан дитини змінився»</tspan><tspan x="610.0" dy="16.9">приходить і на зупинку та відновлення</tspan><tspan x="610.0" dy="16.9">звичайний сигнал: тісні смерті зливаються</tspan><tspan x="610.0" dy="16.9">SIG_IGN нічого не міняє — зомбі лишаються</tspan></text>
<rect x="890.0" y="200.0" width="330.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="1055.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">POSIX розсуджує</tspan></text>
<rect x="890.0" y="254.0" width="330.0" height="190.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.4"/><text x="1055.0" y="319.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">1988 · ім'я SIGCHLD, виклик waitpid</tspan><tspan x="1055.0" dy="16.9">1988 · SA_NOCLDSTOP — «лише смерті»</tspan><tspan x="1055.0" dy="16.9">1990 · SIG_IGN для SIGCHLD заборонено</tspan><tspan x="1055.0" dy="16.9">2001 · SIG_IGN і SA_NOCLDWAIT узаконено</tspan><tspan x="1055.0" dy="16.9">Linux · SIGCLD — просто інше ім'я</tspan></text>
<line x1="324.0" y1="300.0" x2="416.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="324.0" y1="340.0" x2="416.0" y2="440.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="804.0" y1="224.0" x2="886.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="804.0" y1="476.0" x2="886.0" y2="410.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>