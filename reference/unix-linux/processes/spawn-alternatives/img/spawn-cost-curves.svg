<rect x="70.0" y="502.0" width="920.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="530.0" y="538.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Нахил єдиної висхідної кривої — стала машини, а не програми: на кожен гігабайт</tspan><tspan x="530.0" dy="16.9">торкнутої пам'яті ядро копіює приблизно два мегабайти статей таблиць сторінок.</tspan><tspan x="530.0" dy="16.9">Три горизонтальні криві пласкі з різних причин: vfork і posix_spawn не створюють</tspan><tspan x="530.0" dy="16.9">адресного простору взагалі, а fork із великими сторінками копіює у 512 разів менше статей.</tspan><tspan x="530.0" dy="16.9">Якщо в тебе posix_spawn росте разом із батьком — бібліотека реалізує його через fork.</tspan></text>
