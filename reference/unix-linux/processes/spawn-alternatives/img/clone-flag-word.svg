<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка слова прапорців clone і clone3</text>
<text x="580.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне слово на дві різні речі — і чому воно скінчилося</text>
<text x="580.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">розкладка бітів, які clone і clone3 приймають як «прапорці»</text>
<rect x="40.0" y="100.0" width="286.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="183.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">біти 0–7</tspan><tspan x="183.0" dy="17.6">CSIGNAL = 0x000000ff</tspan></text>
<rect x="40.0" y="204.0" width="286.0" height="190.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="183.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">номер сигналу, який ядро надішле</tspan><tspan x="183.0" dy="16.2">батькові, коли дитина завершиться;</tspan><tspan x="183.0" dy="16.2">fork ставить сюди SIGCHLD</tspan><tspan x="183.0" dy="16.2"></tspan><tspan x="183.0" dy="16.2">сюди ж утиснули CLONE_NEWTIME</tspan><tspan x="183.0" dy="16.2">(0x00000080) — у clone його не</tspan><tspan x="183.0" dy="16.2">передати, лише clone3 і unshare</tspan></text>
<rect x="336.0" y="100.0" width="436.0" height="86.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="554.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="554.0" dy="0.0">біти 8–31</tspan><tspan x="554.0" dy="17.6">класичні прапорці clone</tspan></text>
<rect x="336.0" y="204.0" width="436.0" height="190.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="554.0" y="246.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="554.0" dy="0.0">24 біти — і всі зайняті:</tspan><tspan x="554.0" dy="16.2">CLONE_VM = 0x00000100</tspan><tspan x="554.0" dy="16.2">…</tspan><tspan x="554.0" dy="16.2">CLONE_IO = 0x80000000</tspan><tspan x="554.0" dy="16.2"></tspan><tspan x="554.0" dy="16.2">в обгортці glibc flags — це int,</tspan><tspan x="554.0" dy="16.2">у сирому виклику — unsigned long;</tspan><tspan x="554.0" dy="16.2">вище 31-го біта не проходить ні там, ні там</tspan></text>
<rect x="782.0" y="100.0" width="338.0" height="86.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="951.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="951.0" dy="0.0">біти 32–63</tspan><tspan x="951.0" dy="17.6">лише clone3</tspan></text>
<rect x="782.0" y="204.0" width="338.0" height="190.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="951.0" y="262.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="951.0" dy="0.0">CLONE_CLEAR_SIGHAND = 1 &lt;&lt; 32</tspan><tspan x="951.0" dy="16.2">CLONE_INTO_CGROUP = 1 &lt;&lt; 33</tspan><tspan x="951.0" dy="16.2">далі — нові біти свіжих ядер</tspan><tspan x="951.0" dy="16.2"></tspan><tspan x="951.0" dy="16.2">передати їх можна лише полем</tspan><tspan x="951.0" dy="16.2">clone_args.flags завширшки 64 біти</tspan></text>
<rect x="40.0" y="424.0" width="540.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="452.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">clone(): прапорці й номер сигналу лежать в одному слові —</tspan><tspan x="310.0" dy="16.9">дописати 33-й прапорець нікуди</tspan></text>
<rect x="620.0" y="424.0" width="500.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="452.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">clone3(): cl_args.flags і cl_args.exit_signal —</tspan><tspan x="870.0" dy="16.9">два різні поля, і обидва по 64 біти</tspan></text>
<rect x="40.0" y="510.0" width="1080.0" height="64.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="580.0" y="538.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Старий виклик вичерпався не через хибний задум, а через те, що склав дві незалежні речі в одне машинне слово.</tspan><tspan x="580.0" dy="16.9">Щоб додати наступний прапорець, довелося зробити новий виклик — зі структурою замість набору регістрів.</tspan></text>
</svg>