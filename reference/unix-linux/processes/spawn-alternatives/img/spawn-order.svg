<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 712" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="712" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що і в якій послідовності робить posix_spawn</text>
<rect x="60.0" y="52.0" width="280.0" height="40.0" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.3"/><text x="200.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">батько</tspan></text>
<rect x="420.0" y="52.0" width="560.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.3"/><text x="700.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">дитина — той самий адресний простір</tspan></text>
<rect x="60.0" y="110.0" width="280.0" height="76.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="144.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">posix_spawn(&amp;pid, …)</tspan><tspan x="200.0" dy="16.9">дії та атрибути вже складені</tspan></text>
<rect x="60.0" y="250.0" width="280.0" height="76.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">спить</tspan><tspan x="200.0" dy="16.9">аж доки дитина не зробить exec</tspan></text>
<rect x="60.0" y="470.0" width="280.0" height="88.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="501.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">прокидається:</tspan><tspan x="200.0" dy="16.9">0 і pid — або код помилки</tspan><tspan x="200.0" dy="16.9">(невдалу дитину вже прибрано)</tspan></text>
<rect x="420.0" y="110.0" width="560.0" height="54.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1 · дескриптори — копія батькового набору</tspan></text>
<rect x="420.0" y="184.0" width="560.0" height="72.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">2 · атрибути: сеанс, група процесів, RESETIDS,</tspan><tspan x="700.0" dy="16.9">планування, маска сигналів, SETSIGDEF</tspan></text>
<rect x="420.0" y="290.0" width="560.0" height="54.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3 · дії з файлами — строго в порядку додавання</tspan></text>
<rect x="420.0" y="364.0" width="560.0" height="54.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="395.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">4 · закриваються всі дескриптори з FD_CLOEXEC</tspan></text>
<rect x="420.0" y="438.0" width="560.0" height="54.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="469.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">5 · execve або execvpe — програма замінена</tspan></text>
<line x1="700.0" y1="164.0" x2="700.0" y2="184.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="256.0" x2="700.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="344.0" x2="700.0" y2="364.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="418.0" x2="700.0" y2="438.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="148.0" x2="420.0" y2="137.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="465.0" x2="348.0" y2="505.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="590.0" width="920.0" height="86.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="520.0" y="620.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Невдача на будь-якому з кроків 1–5 не мовчить: код помилки лягає в пам'ять, спільну з батьком,</tspan><tspan x="520.0" dy="16.9">і glibc повертає його прямо з posix_spawn — саме тому «спільна пам'ять» тут вигода, а не ризик.</tspan><tspan x="520.0" dy="16.9">Стандарт дозволяє й інший шлях: дитина виходить із кодом 127. Переносний код перевіряє обидва.</tspan></text>
</svg>