<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний стек: що ламає return у дитині vfork</text>
<text x="510.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек один на двох: чому дитині vfork не можна повертатися</text>
<text x="510.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нижче = глибший виклик; батько спинений на рамці spawn_child()</text>
<rect x="166.1" y="95.2" width="227.8" height="33.5" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="280.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">дитина тільки заглиблюється</tspan></text>
<rect x="100.0" y="150.0" width="360.0" height="52.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="280.0" y="180.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">main()</tspan></text>
<rect x="100.0" y="210.0" width="360.0" height="52.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="280.0" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">spawn_child()  ·  тут покликано vfork</tspan></text>
<rect x="100.0" y="270.0" width="360.0" height="52.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="300.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">execvp() — рамка дитини</tspan></text>
<rect x="100.0" y="330.0" width="360.0" height="52.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.4"/><text x="280.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">(глибше нічого немає)</tspan></text>
<rect x="100.0" y="396.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="280.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">рамки батька під дитиною недоторканні</tspan></text>
<rect x="599.2" y="95.2" width="281.6" height="33.5" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.3"/><text x="740.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">дитина повернулася з spawn_child()</tspan></text>
<rect x="560.0" y="150.0" width="360.0" height="52.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="740.0" y="180.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">main()</tspan></text>
<rect x="560.0" y="210.0" width="360.0" height="52.0" rx="6" fill="#fbe0dc" stroke="#c0392b" stroke-width="1.4"/><text x="740.0" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">printf() дитини — лягло сюди</tspan></text>
<rect x="560.0" y="270.0" width="360.0" height="52.0" rx="6" fill="#fbe0dc" stroke="#c0392b" stroke-width="1.4"/><text x="740.0" y="300.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">snprintf() дитини</tspan></text>
<rect x="560.0" y="330.0" width="360.0" height="52.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.4"/><text x="740.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">(глибше нічого немає)</tspan></text>
<rect x="560.0" y="396.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="740.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">батько прокинеться в затертій рамці</tspan></text>
<rect x="60.0" y="512.0" width="900.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="510.0" y="541.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Рамка spawn_child() — та, у яку батько повернеться, коли його розбудять.</tspan><tspan x="510.0" dy="16.9">Поки дитина лише викликає глибші функції, вона пише під цією рамкою й нічого не псує.</tspan><tspan x="510.0" dy="16.9">Щойно вона з неї вийшла, ця пам'ять стала вільною — і будь-який наступний виклик дитини лягає в неї.</tspan><tspan x="510.0" dy="16.9">Тому контракт vfork забороняє і return, і exit: обидва означають вихід із рамки.</tspan></text>
</svg>