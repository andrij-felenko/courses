<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три перепони на шляху чужого коду — і те, що проходить крізь усі</text>
<text x="205.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">класи планування</text>
<rect x="60.0" y="112.0" width="290.0" height="56.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="205.0" y="144.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">клас stop — потік migration/N</tspan></text>
<rect x="60.0" y="178.0" width="290.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="205.0" y="210.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">SCHED_DEADLINE</tspan></text>
<rect x="60.0" y="244.0" width="290.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="205.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">SCHED_FIFO / SCHED_RR</tspan></text>
<rect x="60.0" y="310.0" width="290.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="205.0" y="342.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">SCHED_OTHER (CFS/EEVDF)</tspan></text>
<rect x="60.0" y="376.0" width="290.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="205.0" y="408.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">SCHED_IDLE</tspan></text>
<text x="205.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="205.0" dy="0.0">вищий клас витісняє всі нижчі;</tspan><tspan x="205.0" dy="17.5">клас stop не витісняє ніхто</tspan></text>
<text x="720.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">повз планувальник</text>
<rect x="430.0" y="112.0" width="190.0" height="60.0" rx="6" fill="#fff4e0" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">апаратне</tspan><tspan x="525.0" dy="16.9">переривання</tspan></text>
<rect x="820.0" y="112.0" width="190.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="915.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">NMI, SMI,</tspan><tspan x="915.0" dy="16.9">машинний виняток</tspan></text>
<line x1="525.0" y1="178.0" x2="525.0" y2="232.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="915.0" y1="178.0" x2="915.0" y2="344.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="238.0" width="610.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="715.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">local_irq_disable() на кожному ядрі</text>
<rect x="430.0" y="300.0" width="190.0" height="56.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.2"/><text x="525.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">чекає до кінця</tspan></text>
<rect x="820.0" y="350.0" width="190.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="915.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">виконується</tspan></text>
<text x="715.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">stop_machine глушить усе, чим керує ядро,</tspan><tspan x="715.0" dy="17.5">і нічого не обіцяє про решту</tspan></text>
</svg>