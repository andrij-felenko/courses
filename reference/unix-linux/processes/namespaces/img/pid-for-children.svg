<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Після unshare у процесу дві ручки на простір номерів</text>
<rect x="40.0" y="140.0" width="240.0" height="116.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.8"/><text x="160.0" y="185.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">процес,</tspan><tspan x="160.0" dy="16.9">що зробив</tspan><tspan x="160.0" dy="16.9">unshare(CLONE_NEWPID)</tspan></text>
<line x1="288.0" y1="136.0" x2="336.0" y2="136.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="342.0" y="78.0" width="320.0" height="116.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="502.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="502.0" dy="0.0">/proc/self/ns/pid</tspan><tspan x="502.0" dy="15.6">pid:[4026531836]</tspan></text>
<line x1="670.0" y1="136.0" x2="714.0" y2="136.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="78.0" width="250.0" height="116.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="845.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">старий простір номерів —</tspan><tspan x="845.0" dy="14.3">мій, і змінити його вже не можна</tspan></text>
<line x1="288.0" y1="292.0" x2="336.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="342.0" y="234.0" width="320.0" height="116.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="502.0" y="288.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="502.0" dy="0.0">/proc/self/ns/pid_for_children</tspan><tspan x="502.0" dy="15.6">pid:[4026532567]</tspan></text>
<line x1="670.0" y1="292.0" x2="714.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="234.0" width="250.0" height="116.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="845.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">новий простір номерів —</tspan><tspan x="845.0" dy="14.3">у ньому народяться діти</tspan></text>
<text x="505.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">два різні номери вузла в одного процесу — це нормальний стан, а не збій</text>
<text x="505.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">так само влаштована пара time / time_for_children у просторі часу</text>
</svg>