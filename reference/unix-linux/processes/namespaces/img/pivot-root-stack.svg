<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підміна кореня без тимчасового каталогу</text>
<rect x="40.0" y="56.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1 · перед викликом</tspan></text><rect x="40.0" y="118.0" width="300.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">корінь процесу — дерево хоста</tspan></text><rect x="40.0" y="194.0" width="300.0" height="66.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="223.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">rootfs, прив'язаний сам на себе:</tspan><tspan x="190.0" dy="14.3">тепер це точка монтування</tspan></text><rect x="40.0" y="326.0" width="300.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="190.0" y="364.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">cwd переведено в rootfs;</tspan><tspan x="190.0" dy="14.3">хост-корінь досяжний звичайним шляхом</tspan></text>
<rect x="380.0" y="56.0" width="300.0" height="44.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.8"/><text x="530.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">2 · pivot_root(&quot;.&quot;, &quot;.&quot;)</tspan></text><rect x="380.0" y="118.0" width="300.0" height="66.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.5"/><text x="530.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">старий корінь — покладений зверху</tspan><tspan x="530.0" dy="14.3">в ту саму точку</tspan></text><rect x="380.0" y="194.0" width="300.0" height="66.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.5"/><text x="530.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">rootfs — тепер це «/»</tspan></text><rect x="380.0" y="326.0" width="300.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="530.0" y="364.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">корінь і cwd показують на новий корінь,</tspan><tspan x="530.0" dy="14.3">старий лежить стосом поверх нього</tspan></text>
<rect x="720.0" y="56.0" width="300.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="870.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">3 · umount2(&quot;.&quot;, MNT_DETACH)</tspan></text><rect x="720.0" y="118.0" width="300.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="870.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">старий корінь від'єднано —</tspan><tspan x="870.0" dy="14.3">іменувати його вже нічим</tspan></text><rect x="720.0" y="194.0" width="300.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">rootfs — єдиний корінь</tspan></text><rect x="720.0" y="326.0" width="300.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="870.0" y="364.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">«.» розкривається з нового кореня</tspan><tspan x="870.0" dy="14.3">вгору по стосу — знімається саме старий</tspan></text>
<text x="530.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">put_old збігається з new_root — тому окремий каталог під старий корінь усередині образу не потрібен</text>
<text x="530.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">chroot так не вміє: він міняє точку відліку шляху, а не дерево, і старий корінь лишається на місці</text>
</svg>