<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 552" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="552" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто саме опиняється в новому просторі імен</text>
<rect x="40.0" y="40.0" width="200.0" height="56.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="140.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">виклик</tspan></text>
<rect x="256.0" y="40.0" width="250.0" height="56.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="381.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="381.0" dy="0.0">що робить</tspan></text>
<rect x="522.0" y="40.0" width="250.0" height="56.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="647.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.0" dy="0.0">шість звичайних типів</tspan></text>
<rect x="788.0" y="40.0" width="232.0" height="56.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="904.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="904.0" dy="0.0">номери процесів і час</tspan></text>
<rect x="40.0" y="116.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.9"/><text x="140.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">clone3()</tspan><tspan x="140.0" dy="16.9">clone()</tspan></text>
<rect x="256.0" y="116.0" width="250.0" height="96.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="381.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="381.0" dy="0.0">створює новий простір</tspan></text>
<rect x="522.0" y="116.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="647.0" y="160.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">дитина народжується вже в ньому;</tspan><tspan x="647.0" dy="14.3">той, хто кликав, лишається де був</tspan></text>
<rect x="788.0" y="116.0" width="232.0" height="96.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.4"/><text x="904.0" y="160.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="904.0" dy="0.0">так само — дитина в новому,</tspan><tspan x="904.0" dy="14.3">батько в старому</tspan></text>
<rect x="40.0" y="224.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.9"/><text x="140.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">unshare()</tspan></text>
<rect x="256.0" y="224.0" width="250.0" height="96.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="381.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="381.0" dy="0.0">створює новий простір</tspan></text>
<rect x="522.0" y="224.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="647.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">викликач переходить у новий</tspan><tspan x="647.0" dy="14.3">тієї ж миті</tspan></text>
<rect x="788.0" y="224.0" width="232.0" height="96.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.4"/><text x="904.0" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="904.0" dy="0.0">викликач лишається в старому;</tspan><tspan x="904.0" dy="14.3">у новий потраплять лише</tspan><tspan x="904.0" dy="14.3">його майбутні діти</tspan></text>
<rect x="40.0" y="332.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.9"/><text x="140.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">setns()</tspan></text>
<rect x="256.0" y="332.0" width="250.0" height="96.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="381.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="381.0" dy="0.0">приєднує до наявного</tspan><tspan x="381.0" dy="15.6">за дескриптором</tspan></text>
<rect x="522.0" y="332.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="647.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="647.0" dy="0.0">викликач входить сам</tspan></text>
<rect x="788.0" y="332.0" width="232.0" height="96.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.4"/><text x="904.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="904.0" dy="0.0">викликач лишається в старому;</tspan><tspan x="904.0" dy="14.3">увійдуть лише</tspan><tspan x="904.0" dy="14.3">його майбутні діти</tspan></text>
<rect x="40.0" y="450.0" width="980.0" height="62.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="530.0" y="477.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">членство в просторі номерів і в просторі часу фіксується в мить створення задачі —</tspan><tspan x="530.0" dy="16.9">тому для себе його не змінює жоден із трьох викликів</tspan></text>
<text x="530.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">решта шести типів такого обмеження не має: там перехід відбувається одразу</text>
</svg>