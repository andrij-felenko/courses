<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1018" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="1018" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дванадцять кроків: кожен можливий лише після попереднього</text>
<rect x="40.0" y="56.0" width="460.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">батько — звичайний користувач, uid 1000</tspan></text>
<rect x="580.0" y="56.0" width="460.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="810.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">дитина — root у власних просторах</tspan></text>
<rect x="40.0" y="112.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">clone(дитина, стек, прапорці | SIGCHLD)</tspan><tspan x="270.0" dy="15.6">дитина народжується вже у власних просторах</tspan></text>
<rect x="580.0" y="182.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">read(канал) — чекає</tspan><tspan x="810.0" dy="15.6">до мапи вона «nobody» 65534, зміна ідентифікаторів не працює</tspan></text>
<rect x="40.0" y="252.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="278.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">у setgroups пишемо deny</tspan><tspan x="270.0" dy="15.6">інакше ядро не прийме мапу груп</tspan></text>
<rect x="40.0" y="322.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="348.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">uid_map ← «0 1000 1» · gid_map ← «0 1000 1»</tspan><tspan x="270.0" dy="15.6">один рядок — усе, що дозволено без прав</tspan></text>
<rect x="40.0" y="392.0" width="1000.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="540.0" y="426.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">батько пише в канал один байт — дитина прокидається вже з мапою</tspan></text>
<rect x="580.0" y="462.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="488.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">sethostname(&quot;box&quot;)</tspan><tspan x="810.0" dy="15.6">власний рядок у просторі UTS</tspan></text>
<rect x="580.0" y="532.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="558.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">mount(NULL, &quot;/&quot;, MS_REC | MS_PRIVATE)</tspan><tspan x="810.0" dy="15.6">відв'язати свіжу копію дерева від поширення</tspan></text>
<rect x="580.0" y="602.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="628.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">mount(rootfs, rootfs, MS_BIND | MS_REC)</tspan><tspan x="810.0" dy="15.6">pivot_root вимагає, щоб новий корінь був точкою монтування</tspan></text>
<rect x="580.0" y="672.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="698.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">mount(&quot;proc&quot;, &quot;proc&quot;, &quot;proc&quot;)</tspan><tspan x="810.0" dy="15.6">свіжий примірник procfs — під новий простір номерів</tspan></text>
<rect x="580.0" y="742.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="768.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">pivot_root(&quot;.&quot;, &quot;.&quot;) · umount2(&quot;.&quot;, MNT_DETACH)</tspan><tspan x="810.0" dy="15.6">старий корінь знято зі стосу — назад дороги немає</tspan></text>
<rect x="580.0" y="812.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="838.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">execve(&quot;/bin/sh&quot;)</tspan><tspan x="810.0" dy="15.6">дитина стає програмою контейнера й лишається PID 1</tspan></text>
<rect x="40.0" y="882.0" width="460.0" height="60.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="270.0" y="908.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">waitpid(pid) → код виходу</tspan><tspan x="270.0" dy="15.6">смерть PID 1 забирає весь простір номерів</tspan></text>
<text x="540.0" y="998.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">переставити рядки не можна: мапа — до першої дії від імені root, приватність — до всіх монтувань, прив'язка — до pivot_root</text>
</svg>