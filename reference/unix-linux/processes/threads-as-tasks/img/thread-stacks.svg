<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адресний простір багатопотокової програми</text>
<text x="270.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">високі адреси</text>
<rect x="60.0" y="66.0" width="420.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="270.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">стек головної задачі</tspan><tspan x="270.0" dy="15.6">росте вниз на вимогу</tspan></text>
<rect x="60.0" y="128.0" width="420.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">вільний проміжок до межі RLIMIT_STACK</tspan></text>
<rect x="60.0" y="186.0" width="420.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="270.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">стек потоку 1 — фіксовані 8 МіБ</tspan></text>
<rect x="60.0" y="238.0" width="420.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="270.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">сторінка-вартовий: жодних прав доступу</tspan></text>
<rect x="60.0" y="282.0" width="420.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="270.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">стек потоку 2 — фіксовані 8 МіБ</tspan></text>
<rect x="60.0" y="334.0" width="420.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="270.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">сторінка-вартовий: жодних прав доступу</tspan></text>
<rect x="60.0" y="378.0" width="420.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="270.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">стек потоку 3 — фіксовані 8 МіБ</tspan></text>
<rect x="60.0" y="430.0" width="420.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="270.0" y="446.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">сторінка-вартовий: жодних прав доступу</tspan></text>
<rect x="60.0" y="474.0" width="420.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">інші відображення: бібліотеки, файли, буфери</tspan></text>
<rect x="60.0" y="536.0" width="420.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="270.0" y="563.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">купа — спільна на всю групу</tspan></text>
<rect x="60.0" y="598.0" width="420.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="270.0" y="625.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">код і статичні дані — спільні</tspan></text>
<text x="270.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">низькі адреси</text>
<rect x="545.0" y="66.0" width="435.0" height="96.0" rx="9" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.6"/>
<text x="563.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Головний стек ростить ядро</text>
<text x="563.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="563.0" dy="0.0">доторк нижче межі дає сторінковий збій,</tspan><tspan x="563.0" dy="14.3">ядро посуває межу — поки є запас до RLIMIT_STACK</tspan></text>
<rect x="545.0" y="176.0" width="435.0" height="96.0" rx="9" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.6"/>
<text x="563.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Стеки потоків ростити нікуди</text>
<text x="563.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="563.0" dy="0.0">у спільному просторі вони росли б назустріч чужим</tspan><tspan x="563.0" dy="14.3">ділянкам, тому libc бере їх mmap-ом наперед</tspan></text>
<rect x="545.0" y="286.0" width="435.0" height="96.0" rx="9" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.6"/>
<text x="563.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Сторінка-вартовий робить збій негайним</text>
<text x="563.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="563.0" dy="0.0">переповнення впирається в неї й дає SIGSEGV</tspan><tspan x="563.0" dy="14.3">замість тихого псування сусіднього стека</tspan></text>
<rect x="545.0" y="396.0" width="435.0" height="96.0" rx="9" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="563.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="start" font-weight="700">Резерв віртуальний, не фізичний</text>
<text x="563.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="563.0" dy="0.0">1000 потоків = ~8.4 ГБ у VSZ,</tspan><tspan x="563.0" dy="14.3">але лише ~8 МіБ реально зайнятих сторінок</tspan></text>
<rect x="545.0" y="506.0" width="435.0" height="96.0" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="563.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Ділянку не віддають ядру</text>
<text x="563.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="563.0" dy="0.0">після завершення потоку стек лишається</tspan><tspan x="563.0" dy="14.3">в кеші libc — наступне створення бере готове</tspan></text>
<text x="510.0" y="706.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усі задачі групи ділять один простір адрес; окремим у кожної лишається тільки її власний стек і блок TLS</text>
</svg>