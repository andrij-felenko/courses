<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Група задач: що спільне, а що своє в кожного потоку</text>
<rect x="40.0" y="58.0" width="480.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="280.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Спільне на всю групу задач</tspan><tspan x="280.0" dy="16.9">(структура одна, лічильник посилань = кількість потоків)</tspan></text>
<rect x="560.0" y="58.0" width="480.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="800.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Своє в кожної задачі</tspan><tspan x="800.0" dy="16.9">(лежить усередині task_struct, примірник лише власний)</tspan></text>
<rect x="40.0" y="118.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">mm_struct — відображення пам'яті:</tspan><tspan x="280.0" dy="14.3">код, купа, усі стеки, усі відображення файлів</tspan></text><rect x="40.0" y="184.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="209.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">files_struct — таблиця дескрипторів:</tspan><tspan x="280.0" dy="14.3">відкритий тут файл миттю видно всім</tspan></text><rect x="40.0" y="250.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="282.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">fs_struct — корінь, поточний каталог, umask</tspan></text><rect x="40.0" y="316.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">sighand_struct — диспозиції сигналів:</tspan><tspan x="280.0" dy="14.3">один обробник на весь TGID</tspan></text><rect x="40.0" y="382.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">signal_struct — ліміти ресурсів, таймери,</tspan><tspan x="280.0" dy="14.3">рахунок процесорного часу, спільна черга сигналів</tspan></text><rect x="40.0" y="448.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="473.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">nsproxy — набір просторів імен</tspan><tspan x="280.0" dy="14.3">(тому потік не може піти у свій)</tspan></text><rect x="40.0" y="514.0" width="480.0" height="58.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="546.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">TGID — номер програми, який повертає getpid()</tspan></text>
<rect x="560.0" y="118.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">TID — власний номер задачі (gettid)</tspan></text><rect x="560.0" y="184.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="216.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">регістри й стек ядра (16 КіБ на x86-64)</tspan></text><rect x="560.0" y="250.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="275.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">стек користувача — окрема ділянка mmap</tspan><tspan x="800.0" dy="14.3">із сторінкою-вартовим під нею</tspan></text><rect x="560.0" y="316.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">блок локальних даних потоку (TLS):</tspan><tspan x="800.0" dy="14.3">errno, змінні __thread, покажчик у регістрі %fs</tspan></text><rect x="560.0" y="382.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">маска сигналів, власна черга,</tspan><tspan x="800.0" dy="14.3">альтернативний стек обробника</tspan></text><rect x="560.0" y="448.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="480.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">nice, політика планування, набір дозволених ядер</tspan></text><rect x="560.0" y="514.0" width="480.0" height="58.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="800.0" y="546.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">cred — ідентичність і можливості (!)</tspan></text>
<rect x="40.0" y="588.0" width="960.0" height="46.0" rx="6" fill="#fff" stroke="#7a4fb0" stroke-width="1.4"/><text x="520.0" y="614.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">cred стоїть праворуч, хоч POSIX вимагає спільних прав на всю програму: розрив закриває не ядро, а libc — розсилкою внутрішнього сигналу всім потокам</tspan></text>
<text x="540.0" y="684.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">питання «що станеться, якщо…» вирішує не слово «потік», а те, у якій із двох колонок лежить річ</text>
</svg>