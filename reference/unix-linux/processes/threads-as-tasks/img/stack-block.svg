<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ділянка стека одного потоку зсередини</text>
<rect x="60.0" y="76.0" width="360.0" height="56.0" rx="6" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.6"/><text x="240.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">struct pthread — службова структура libc</tspan><tspan x="240.0" dy="15.0">сюди вказує %fs, це саме число дає pthread_self()</tspan></text>
<rect x="60.0" y="132.0" width="360.0" height="52.0" rx="6" fill="#faf7fe" stroke="#7a4fb0" stroke-width="1.6"/><text x="240.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">статичний блок TLS: own_counter, errno</tspan><tspan x="240.0" dy="15.0">за від'ємними зсувами від %fs</tspan></text>
<rect x="60.0" y="184.0" width="360.0" height="44.0" rx="6" fill="#e3ebfb" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="202.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">верхівка стека, уже витрачена</tspan><tspan x="240.0" dy="15.0">(&amp;on_stack — точка тут)</tspan></text>
<rect x="60.0" y="228.0" width="360.0" height="168.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="308.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">вільний стек потоку — росте вниз</tspan><tspan x="240.0" dy="15.0">8 388 608 байтів від lo до hi</tspan></text>
<rect x="60.0" y="396.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="240.0" y="415.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">сторінка-вартовий 4 КіБ</tspan><tspan x="240.0" dy="15.0">у maps це ---p: жодних прав</tspan></text>
<text x="240.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">високі адреси</text>
<text x="240.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">низькі адреси</text>
<line x1="426.0" y1="76.0" x2="496.0" y2="76.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="502.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">hi — кінець ділянки</text>
<line x1="426.0" y1="396.0" x2="496.0" y2="396.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="502.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">lo — початок стека</text>
<line x1="426.0" y1="442.0" x2="496.0" y2="442.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="502.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">B — початок ділянки</text>
<rect x="700.0" y="76.0" width="400.0" height="118.0" rx="9" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.8"/>
<text x="718.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Свідок 1 — бібліотека</text>
<text x="718.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="718.0" dy="0.0">pthread_attr_getstack → lo і size</tspan><tspan x="718.0" dy="14.9">pthread_attr_getguardsize → 4096</tspan><tspan x="718.0" dy="14.9">pthread_self() → адреса TCB</tspan></text>
<rect x="700.0" y="208.0" width="400.0" height="118.0" rx="9" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="718.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Свідок 2 — ядро</text>
<text x="718.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="718.0" dy="0.0">/proc/&lt;pid&gt;/maps: дві сусідні ділянки —</tspan><tspan x="718.0" dy="14.9">---p завширшки з вартового й rw-p завширшки</tspan><tspan x="718.0" dy="14.9">з size; /proc/&lt;pid&gt;/task/&lt;tid&gt;/ — свій каталог</tspan></text>
<rect x="700.0" y="340.0" width="400.0" height="118.0" rx="9" fill="#f7f3fd" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="718.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="start" font-weight="700">Свідок 3 — сама програма</text>
<text x="718.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="718.0" dy="0.0">&amp;on_stack лежить усередині [lo, hi)</tspan><tspan x="718.0" dy="14.9">&amp;own_counter — трохи нижче від %fs</tspan><tspan x="718.0" dy="14.9">&amp;group_counter однакова в усіх задач</tspan></text>
<rect x="60.0" y="490.0" width="1020.0" height="62.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.6"/><text x="570.0" y="517.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">lo = B + вартовий   ·   size = розмір ділянки − вартовий   ·   hi = lo + size = кінець ділянки</tspan><tspan x="570.0" dy="16.2">збіг усіх трьох свідків і є перевіркою: одне джерело дає твердження, три — факт</tspan></text>
<text x="570.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">верхівку ділянки libc забрала собі: TCB і статичний TLS лежать усередині того, що вона зве стеком</text>
</svg>