<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доставка сигналу: у групу задач і в окрему задачу</text>
<rect x="300.0" y="150.0" width="700.0" height="300.0" rx="12" fill="#fafbfc" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="320.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">група задач TGID 1200</text>
<rect x="324.0" y="198.0" width="300.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="474.0" y="225.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="474.0" dy="0.0">спільна черга групи</tspan><tspan x="474.0" dy="15.0">сигнали, послані на номер 1200</tspan></text>
<rect x="330.0" y="286.0" width="200.0" height="118.0" rx="9" fill="#f2f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="430.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">TID 1200</text>
<text x="430.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">маска: SIGTERM заблоковано</tspan></text>
<rect x="344.0" y="358.0" width="172.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="430.0" y="378.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">власна черга задачі</tspan></text>
<rect x="550.0" y="286.0" width="200.0" height="118.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TID 1203</text>
<text x="650.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">маска: порожня — може прийняти</tspan></text>
<rect x="564.0" y="358.0" width="172.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="650.0" y="378.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">власна черга задачі</tspan></text>
<rect x="770.0" y="286.0" width="200.0" height="118.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="870.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TID 1204</text>
<text x="870.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">маска: порожня — може прийняти</tspan></text>
<rect x="784.0" y="358.0" width="172.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="870.0" y="378.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">власна черга задачі</tspan></text>
<rect x="324.0" y="416.0" width="652.0" height="24.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.3"/><text x="650.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">таблиця диспозицій одна на групу: який би потік не отримав сигнал, виконається той самий обробник</tspan></text>
<rect x="30.0" y="194.0" width="236.0" height="82.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="148.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">kill 1200</text>
<text x="148.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">адресовано програмі: у спільну чергу,</tspan><tspan x="148.0" dy="13.1">звідти одній із незаблокованих задач</tspan></text>
<line x1="270.0" y1="236.0" x2="292.0" y2="236.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="306.0" width="236.0" height="82.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="148.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">tgkill 1200, 1204</text>
<text x="148.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">адресовано задачі:</tspan><tspan x="148.0" dy="13.1">у власну чергу саме цієї</tspan></text>
<line x1="270.0" y1="348.0" x2="292.0" y2="348.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="388.0" width="236.0" height="82.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="148.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">помилкова інструкція</text>
<text x="148.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">SIGSEGV, SIGFPE — вибору немає:</tspan><tspan x="148.0" dy="13.1">тій задачі, що її виконала</tspan></text>
<line x1="270.0" y1="430.0" x2="292.0" y2="430.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="474.0" width="700.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="650.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">якщо диспозиція означає смерть — ядро завершує ВСЮ групу,</tspan><tspan x="650.0" dy="16.9">хоч отримала сигнал лише одна задача</tspan></text>
<text x="520.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">надійний спосіб один: заблокувати сигнали в усіх потоках і читати їх з одного місця — sigwaitinfo або signalfd</text>
</svg>