<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три області дії системного виклику в багатопотоковій програмі</text>
<rect x="40.0" y="62.0" width="340.0" height="74.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Ядро діє на всю групу</tspan></text>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">поле лежить у спільній структурі</tspan><tspan x="210.0" dy="13.1">з лічильником посилань</tspan></text>
<rect x="420.0" y="62.0" width="340.0" height="74.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="590.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ядро діє на одну задачу</tspan></text>
<text x="590.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">поле лежить усередині</tspan><tspan x="590.0" dy="13.1">власної task_struct</tspan></text>
<rect x="800.0" y="62.0" width="340.0" height="74.0" rx="10" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="2.0"/>
<text x="970.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">Ядро діє на задачу,</tspan><tspan x="970.0" dy="16.9">а libc вдає групу</tspan></text>
<text x="970.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">розсилка всім потокам</tspan><tspan x="970.0" dy="13.1">поверх виклику, що бере одного</tspan></text>
<rect x="40.0" y="154.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">mm_struct</tspan><tspan x="210.0" dy="13.7">mmap · mprotect · brk · madvise · mlockall</tspan></text><rect x="40.0" y="236.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">files_struct</tspan><tspan x="210.0" dy="13.7">open · close · dup2 · fcntl(F_SETFD)</tspan></text><rect x="40.0" y="318.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">fs_struct</tspan><tspan x="210.0" dy="13.7">chdir · chroot · umask</tspan></text><rect x="40.0" y="400.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">sighand_struct</tspan><tspan x="210.0" dy="13.7">sigaction · signal</tspan></text><rect x="40.0" y="482.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="513.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">signal_struct</tspan><tspan x="210.0" dy="13.7">setrlimit · alarm · setitimer · times</tspan></text><rect x="40.0" y="564.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="595.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">номери групи</tspan><tspan x="210.0" dy="13.7">setpgid · setsid · getpgid · getppid</tspan></text><rect x="40.0" y="646.0" width="340.0" height="70.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="210.0" y="677.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">кінець групи</tspan><tspan x="210.0" dy="13.7">exit_group · execve · смертельний сигнал</tspan></text>
<rect x="420.0" y="154.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">планування</tspan><tspan x="590.0" dy="13.7">nice · setpriority · sched_setscheduler</tspan></text><rect x="420.0" y="236.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">розміщення на ядрах</tspan><tspan x="590.0" dy="13.7">sched_setaffinity · getcpu</tspan></text><rect x="420.0" y="318.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">черга до диска</tspan><tspan x="590.0" dy="13.7">ioprio_set</tspan></text><rect x="420.0" y="400.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">сигнали, які прийме саме вона</tspan><tspan x="590.0" dy="13.7">sigprocmask · sigaltstack · sigwaitinfo</tspan></text><rect x="420.0" y="482.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="513.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">дрібні властивості</tspan><tspan x="590.0" dy="13.7">PR_SET_NAME · PR_SET_PDEATHSIG</tspan></text><rect x="420.0" y="564.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="595.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">права й можливості (сирі виклики)</tspan><tspan x="590.0" dy="13.7">setuid · setgid · capset</tspan></text><rect x="420.0" y="646.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="677.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">фільтр викликів і простори імен</tspan><tspan x="590.0" dy="13.7">seccomp без TSYNC · unshare · setns</tspan></text><rect x="420.0" y="728.0" width="340.0" height="70.0" rx="6" fill="#f5f8fe" stroke="#2457d6" stroke-width="1.4"/><text x="590.0" y="759.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">кінець задачі</tspan><tspan x="590.0" dy="13.7">exit · tgkill · ptrace</tspan></text>
<rect x="800.0" y="154.0" width="340.0" height="88.0" rx="6" fill="#faf7fe" stroke="#7a4fb0" stroke-width="1.4"/><text x="970.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">setuid · setgid · setresuid · setgroups</tspan><tspan x="970.0" dy="13.7">glibc розсилає SIGSETXID усім потокам</tspan><tspan x="970.0" dy="13.7">свого списку й чекає підтверджень</tspan></text><rect x="800.0" y="236.0" width="340.0" height="88.0" rx="6" fill="#faf7fe" stroke="#7a4fb0" stroke-width="1.4"/><text x="970.0" y="263.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">cap_set_proc</tspan><tspan x="970.0" dy="13.7">сам по собі — лише свій потік;</tspan><tspan x="970.0" dy="13.7">-lcap -lpsx і --wrap=pthread_create</tspan><tspan x="970.0" dy="13.7">роблять із нього розсилку</tspan></text><rect x="800.0" y="318.0" width="340.0" height="88.0" rx="6" fill="#faf7fe" stroke="#7a4fb0" stroke-width="1.4"/><text x="970.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">seccomp(…, SECCOMP_FILTER_FLAG_TSYNC)</tspan><tspan x="970.0" dy="13.7">тут розсилку бере на себе саме ядро</tspan></text><rect x="800.0" y="400.0" width="340.0" height="88.0" rx="6" fill="#faf7fe" stroke="#7a4fb0" stroke-width="1.4"/><text x="970.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">задача, народжена прямим clone()</tspan><tspan x="970.0" dy="13.7">повз список libc — жодна розсилка</tspan><tspan x="970.0" dy="13.7">її не зачепить</tspan></text>
<rect x="40.0" y="822.0" width="1100.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="590.0" y="847.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Назва нічого не обіцяє: PRIO_PROCESS, IOPRIO_WHO_PROCESS і аргумент pid у sched_setaffinity</tspan><tspan x="590.0" dy="16.2">усі беруть номер ЗАДАЧІ — renice й ionice по номеру програми міняють лише головний потік</tspan></text>
<text x="590.0" y="922.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">щоб дізнатися область дії виклику, питають не про слово «потік», а про те, у якій структурі лежить поле</text>
</svg>