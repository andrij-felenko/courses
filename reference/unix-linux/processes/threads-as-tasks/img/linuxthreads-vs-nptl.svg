<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">LinuxThreads і NPTL: що змінилося</text>
<rect x="30.0" y="24.0" width="540.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="300.0" y="43.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">LinuxThreads (1996–2003)</tspan><tspan x="300.0" dy="16.9">потік = процес зі спільною пам'яттю</tspan></text>
<rect x="610.0" y="24.0" width="540.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="880.0" y="43.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">NPTL (з 2003)</tspan><tspan x="880.0" dy="16.9">потік = задача в спільній групі задач</tspan></text>
<text x="200.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">прохання трубою</text>
<rect x="45.0" y="118.0" width="190.0" height="58.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.6"/><text x="140.0" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">головна задача</tspan><tspan x="140.0" dy="15.6">PID 1200</tspan></text>
<rect x="365.0" y="118.0" width="190.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="460.0" y="143.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="460.0" dy="0.0">потік-керівник</tspan><tspan x="460.0" dy="15.6">PID 1201</tspan></text>
<line x1="240.0" y1="147.0" x2="360.0" y2="147.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460.0" y1="176.0" x2="460.0" y2="206.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="120.0" y1="206.0" x2="460.0" y2="206.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="120.0" y1="206.0" x2="120.0" y2="232.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="38.0" y="234.0" width="164.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="120.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">потік</tspan><tspan x="120.0" dy="15.6">PID 1202</tspan></text>
<line x1="290.0" y1="206.0" x2="290.0" y2="232.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="208.0" y="234.0" width="164.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="290.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">потік</tspan><tspan x="290.0" dy="15.6">PID 1203</tspan></text>
<line x1="460.0" y1="206.0" x2="460.0" y2="232.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="378.0" y="234.0" width="164.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="460.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">потік</tspan><tspan x="460.0" dy="15.6">PID 1204</tspan></text>
<rect x="45.0" y="312.0" width="510.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="300.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">усі потоки — діти керівника: він їх створює, а потім збирає через wait(),</tspan><tspan x="300.0" dy="14.3">інакше кожен завершений лишався б зомбі</tspan></text>
<rect x="45.0" y="382.0" width="510.0" height="176.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">що з цього виходило:</tspan><tspan x="300.0" dy="14.3"></tspan><tspan x="300.0" dy="14.3">getpid() різний у кожному потоці, getppid() показує керівника</tspan><tspan x="300.0" dy="14.3">сигналів, адресованих програмі, не існує — тільки задачі</tspan><tspan x="300.0" dy="14.3">setuid() міняє права одного потоку, не всієї програми</tspan><tspan x="300.0" dy="14.3">SIGUSR1 і SIGUSR2 забрала бібліотека на власні потреби</tspan><tspan x="300.0" dy="14.3">стек у гнізді 2 МіБ за фіксованою сіткою → стеля на кількість потоків</tspan></text>
<rect x="610.0" y="96.0" width="540.0" height="200.0" rx="10" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.8"/>
<text x="880.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">група задач, TGID 1200 — це й є «процес»</text>
<rect x="632.0" y="142.0" width="116.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="690.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">TID 1200</tspan><tspan x="690.0" dy="15.0">лідер групи</tspan></text>
<rect x="762.0" y="142.0" width="116.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="820.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">TID 1201</tspan></text>
<rect x="892.0" y="142.0" width="116.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="950.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">TID 1202</tspan></text>
<rect x="1022.0" y="142.0" width="116.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="1080.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">TID 1203</tspan></text>
<rect x="632.0" y="224.0" width="506.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="885.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">getpid() у кожної повертає 1200 — назовні це одна програма</tspan></text>
<rect x="610.0" y="312.0" width="540.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">потік створює потік сам, одним clone(): посередника немає,</tspan><tspan x="880.0" dy="14.3">тож створення різних потоків іде паралельно</tspan></text>
<rect x="610.0" y="382.0" width="540.0" height="176.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="423.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">що для цього додали в ядро (гілка 2.5):</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">спільна черга сигналів групи + tgkill() у конкретну задачу</tspan><tspan x="880.0" dy="14.3">exit_group() — завершити всю групу одним викликом</tspan><tspan x="880.0" dy="14.3">CLONE_SETTLS — блок локальних даних потоку від ядра</tspan><tspan x="880.0" dy="14.3">CLONE_CHILD_CLEARTID — сповіщення про смерть через пам'ять,</tspan><tspan x="880.0" dy="14.3">тому pthread_join() чекає на слові, а не на wait()</tspan><tspan x="880.0" dy="14.3">futex — м'ютекс без входу в ядро, поки немає суперечки</tspan></text>
<text x="590.0" y="624.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">змінилася не бібліотека, а межа між нею й ядром: керівник зник, бо ядро взяло на себе те, що він робив вручну</text>
</svg>