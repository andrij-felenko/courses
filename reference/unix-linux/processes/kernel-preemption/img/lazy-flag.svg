<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="98.0" width="235.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="132.5" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">звичайна задача</tspan><tspan x="132.5" dy="15.6">будить звичайну</tspan></text>
<text x="280.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">подія: ставлять слабкий прапорець LAZY</text>
<rect x="280.0" y="110.0" width="480.0" height="30.0" rx="6" fill="#e9ecef" stroke="#6b7280" stroke-width="1.2"/>
<text x="520.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">задача працює далі — до найближчого тіку</text>
<rect x="760.0" y="110.0" width="180.0" height="30.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="850.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">перемикання</text>
<text x="760.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">↑ тік таймера підвищує LAZY до справжнього NEED_RESCHED</text>
<rect x="15.0" y="238.0" width="235.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="132.5" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">прокинулася</tspan><tspan x="132.5" dy="15.6">реальночасова задача</tspan></text>
<text x="280.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">подія: ставлять справжній прапорець NEED_RESCHED</text>
<rect x="280.0" y="250.0" width="30.0" height="30.0" rx="6" fill="#e9ecef" stroke="#6b7280" stroke-width="1.2"/>
<rect x="310.0" y="250.0" width="630.0" height="30.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">перемикання одразу — на найближчій безпечній межі</text>
<rect x="40.0" y="330.0" width="920.0" height="52.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Лінивий прапорець дає повному витісненню пропускну здатність, близьку до PREEMPT_NONE,</tspan><tspan x="500.0" dy="15.6">не забираючи негайності там, де вона справді потрібна.</tspan></text>
</svg>