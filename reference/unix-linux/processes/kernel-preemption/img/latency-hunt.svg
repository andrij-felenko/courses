<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="217.5" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">куди зник час</text>
<text x="567.5" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чим це видно</text>
<text x="927.5" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що з цим робити</text>
<line x1="20.0" y1="82.0" x2="1130.0" y2="82.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="25.0" y="96.0" width="385.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">переривання вимкнені —</tspan><tspan x="217.5" dy="16.9">ядро не дізналося про подію</tspan></text>
<rect x="425.0" y="96.0" width="285.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.5" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.5" dy="0.0">ftrace: irqsoff</tspan></text>
<rect x="730.0" y="96.0" width="395.0" height="66.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="927.5" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">винуватця називає рядок</tspan><tspan x="927.5" dy="16.9">«started at» у трасі</tspan></text>
<rect x="25.0" y="174.0" width="385.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">витіснення заборонене —</tspan><tspan x="217.5" dy="16.9">ядро знає, але не перемикає</tspan></text>
<rect x="425.0" y="174.0" width="285.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.5" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.5" dy="0.0">ftrace: preemptoff</tspan></text>
<rect x="730.0" y="174.0" width="395.0" height="66.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="927.5" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">довга ділянка під спін-замком</tspan><tspan x="927.5" dy="16.9">або затяжний softirq</tspan></text>
<rect x="25.0" y="252.0" width="385.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">від пробудження задачі</tspan><tspan x="217.5" dy="16.9">до її першої інструкції</tspan></text>
<rect x="425.0" y="252.0" width="285.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.5" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.5" dy="0.0">ftrace: wakeup_rt</tspan></text>
<rect x="730.0" y="252.0" width="395.0" height="66.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="927.5" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">та сама величина, що й у нашій</tspan><tspan x="927.5" dy="16.9">програмі, — але разом із трасою</tspan></text>
<rect x="25.0" y="330.0" width="385.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">процесор виконував те,</tspan><tspan x="217.5" dy="16.9">чого ядро не бачило взагалі</tspan></text>
<rect x="425.0" y="330.0" width="285.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.5" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.5" dy="0.0">hwlatdetect</tspan></text>
<rect x="730.0" y="330.0" width="395.0" height="66.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="927.5" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">прошивка й SMI: ядро безсиле,</tspan><tspan x="927.5" dy="16.9">лишається BIOS або інше залізо</tspan></text>
<rect x="25.0" y="408.0" width="385.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="217.5" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">ядро прокидалося з глибокого</tspan><tspan x="217.5" dy="16.9">сну або на низькій частоті</tspan></text>
<rect x="425.0" y="408.0" width="285.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.5" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.5" dy="0.0">cpupower idle-info,</tspan><tspan x="567.5" dy="16.9">turbostat</tspan></text>
<rect x="730.0" y="408.0" width="395.0" height="66.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="927.5" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">/dev/cpu_dma_latency = 0,</tspan><tspan x="927.5" dy="16.9">governor performance</tspan></text>
</svg>