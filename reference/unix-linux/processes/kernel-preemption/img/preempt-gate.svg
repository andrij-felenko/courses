<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="51.0" y="63.5" width="397.9" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">тік таймера · пробудження задачі · зміна пріоритету</tspan></text>
<line x1="250.0" y1="106.0" x2="250.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="158.5" y="143.1" width="183.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ядро ставить прапорець</tspan><tspan x="250.0" dy="16.9">TIF_NEED_RESCHED = 1</tspan></text>
<line x1="250.0" y1="200.0" x2="250.0" y2="232.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="123.1" y="243.1" width="253.7" height="49.9" rx="6" fill="#fff9e6" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">чи можна перемикати саме тут?</tspan><tspan x="250.0" dy="16.9">preempt_count == 0 ?</tspan></text>
<line x1="195.0" y1="300.0" x2="135.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="305.0" y1="300.0" x2="365.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="350.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">≠ 0 — ні:</tspan><tspan x="125.0" dy="15.6">прапорець висить далі,</tspan><tspan x="125.0" dy="15.6">ядро працює як працювало</tspan></text>
<rect x="280.0" y="350.0" width="220.0" height="76.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">= 0 — так:</tspan><tspan x="390.0" dy="15.6">schedule() тут і зараз,</tspan><tspan x="390.0" dy="15.6">задачу знімають</tspan></text>
<text x="760.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">preempt_count — одне слово, кілька полів</text>
<rect x="560.0" y="95.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">NMI — немасковане переривання</tspan></text>
<rect x="560.0" y="157.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">HARDIRQ — обробник переривання</tspan></text>
<rect x="560.0" y="219.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">SOFTIRQ — local_bh_disable()</tspan></text>
<rect x="560.0" y="281.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">PREEMPT — spin_lock(), preempt_disable()</tspan></text>
<rect x="560.0" y="350.0" width="400.0" height="76.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="760.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Будь-яке ненульове поле означає</tspan><tspan x="760.0" dy="15.6">«тут перемикати не можна».</tspan><tspan x="760.0" dy="15.6">Нуль у всіх — витіснення дозволене.</tspan></text>
<text x="500.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">де ядро питає цей вентиль</text>
<rect x="20.0" y="468.0" width="230.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="497.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">вихід із ядра</tspan><tspan x="135.0" dy="15.6">в простір користувача</tspan><tspan x="135.0" dy="15.6">— у всіх моделях</tspan></text>
<rect x="266.0" y="468.0" width="230.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="381.0" y="497.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="381.0" dy="0.0">preempt_enable()</tspan><tspan x="381.0" dy="15.6">spin_unlock()</tspan><tspan x="381.0" dy="15.6">— у всіх моделях</tspan></text>
<rect x="512.0" y="468.0" width="230.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="497.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">повернення з переривання</tspan><tspan x="627.0" dy="15.6">в код ядра</tspan><tspan x="627.0" dy="15.6">— PREEMPT і RT</tspan></text>
<rect x="758.0" y="468.0" width="230.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="873.0" y="497.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="873.0" dy="0.0">cond_resched()</tspan><tspan x="873.0" dy="15.6">у довгих циклах</tspan><tspan x="873.0" dy="15.6">— NONE і VOLUNTARY</tspan></text>
</svg>