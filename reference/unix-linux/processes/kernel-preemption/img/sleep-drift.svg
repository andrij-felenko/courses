<rect x="35.0" y="326.0" width="1070.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="350.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Відносний сон: кожен оберт додає до кроку власну роботу й затримку, тож сітка тікає —</tspan><tspan x="570.0" dy="16.9">а запізнення непомітне, бо відлік щоразу ведеться від щойно пропущеного прокидання.</tspan></text>
<rect x="35.0" y="394.0" width="1070.0" height="56.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="418.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Абсолютний сон: наступний момент рахують від сітки, а не від «зараз» — дрейф не накопичується,</tspan><tspan x="570.0" dy="16.9">кожне запізнення лишається при своєму оберті, і різниця «мав — прокинувся» і є те, що ми міряємо.</tspan></text>
