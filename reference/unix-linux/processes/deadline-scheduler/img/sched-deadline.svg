<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка SCHED_DEADLINE: Бюджет CBS та дедлайн EDF</text>
<line x1="50.0" y1="240.0" x2="780.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<line x1="760.0" y1="240.0" x2="780.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Час (t)</text>
<line x1="60.0" y1="80.0" x2="60.0" y2="250.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">t = 0 (Прибуття)</text>
<rect x="60.0" y="120.0" width="150.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Виконання (Runtime Q)</tspan><tspan x="135.0" dy="13.0">10 мс</tspan></text>
<rect x="220.0" y="120.0" width="210.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Дроселювання (Throttled)</tspan><tspan x="325.0" dy="15.6">Чекає на поповнення</tspan></text>
<line x1="440.0" y1="70.0" x2="440.0" y2="250.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Абсолютний дедлайн (d₁ = 30 мс)</text>
<text x="440.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">t = 30 мс (Кінець періоду P)</text>
<line x1="440.0" y1="80.0" x2="440.0" y2="250.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
<rect x="450.0" y="120.0" width="150.0" height="40.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="525.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Новий період (P₂)</tspan><tspan x="525.0" dy="15.6">Бюджет поповнено</tspan></text>
<rect x="60.0" y="300.0" width="720.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">CBS гарантує: Потік отримує максимум Q (10 мс) кожні P (30 мс). При вичерпанні Q потік дроселюється.</tspan><tspan x="420.0" dy="14.3">EDF обирає для виконання потік із найближчим дедлайном d = r + D.</tspan></text>
</svg>