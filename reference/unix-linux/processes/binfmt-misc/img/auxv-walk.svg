<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 802" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="802" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початок стека нового процесу: argc, argv, envp і допоміжний вектор</text>
<rect x="60.0" y="48.0" width="1000.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="74.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Ядро розклало це на початку стека ще до першої інструкції програми</tspan></text>
<rect x="60.0" y="112.0" width="440.0" height="46.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">argc = 4</tspan></text>
<rect x="540.0" y="112.0" width="520.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">перший аргумент main()</tspan></text>
<rect x="60.0" y="170.0" width="440.0" height="100.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">argv[0] → &quot;/home/dana/crslab/crsrun&quot;</tspan><tspan x="280.0" dy="16.9">argv[1] → &quot;./hello.crs&quot;</tspan><tspan x="280.0" dy="16.9">argv[2] → &quot;alpha&quot;</tspan><tspan x="280.0" dy="16.9">argv[3] → &quot;beta&quot;</tspan></text>
<rect x="540.0" y="170.0" width="520.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">другий аргумент main():</tspan><tspan x="800.0" dy="16.9">масив покажчиків на рядки аргументів</tspan></text>
<rect x="60.0" y="282.0" width="440.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="280.0" y="307.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">NULL</tspan></text>
<rect x="540.0" y="282.0" width="520.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="307.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">нуль-роздільник: кінець масиву argv</tspan></text>
<rect x="60.0" y="336.0" width="440.0" height="78.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="362.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">envp[0] → &quot;PATH=/usr/local/bin:/usr/bin:/bin&quot;</tspan><tspan x="280.0" dy="16.9">envp[1] → &quot;HOME=/home/dana&quot;</tspan><tspan x="280.0" dy="16.9">…</tspan></text>
<rect x="540.0" y="336.0" width="520.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">третій аргумент main():</tspan><tspan x="800.0" dy="16.9">масив покажчиків на рядки оточення</tspan></text>
<rect x="60.0" y="426.0" width="440.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="280.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">NULL</tspan></text>
<rect x="540.0" y="426.0" width="520.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">нуль-роздільник: кінець масиву envp —</tspan><tspan x="800.0" dy="16.9">саме його шукає цикл  for (p = envp; *p; p++);</tspan></text>
<rect x="60.0" y="496.0" width="440.0" height="104.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="280.0" y="527.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">AT_EXECFN  (31)  →  &quot;./hello.crs&quot;</tspan><tspan x="280.0" dy="16.9">AT_FLAGS    (8)  =  0x1</tspan><tspan x="280.0" dy="16.9">AT_EXECFD   (2)  =  3</tspan><tspan x="280.0" dy="16.9">…  решта пар від ядра</tspan></text>
<rect x="540.0" y="496.0" width="520.0" height="104.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="535.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">допоміжний вектор: пари «тип, значення»,</tspan><tspan x="800.0" dy="16.9">по два машинні слова кожна.</tspan><tspan x="800.0" dy="16.9">У сигнатурі main() його немає — тільки тут.</tspan></text>
<rect x="60.0" y="612.0" width="440.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="280.0" y="639.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">AT_NULL     (0)  =  0</tspan></text>
<rect x="540.0" y="612.0" width="520.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="800.0" y="639.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">пара з типом AT_NULL закриває вектор</tspan></text>
<rect x="60.0" y="678.0" width="1000.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="560.0" y="708.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Три аргументи main() — це перші три ділянки цього блоку.</tspan><tspan x="560.0" dy="16.9">Допоміжний вектор лежить одразу за завершальним нулем envp, тож дійти до нього можна лише пройшовши оточення до кінця.</tspan></text>
</svg>