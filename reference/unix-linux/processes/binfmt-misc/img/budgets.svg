<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два незалежні обмеження реєстрації: байти буфера й символи рядка</text>
<rect x="50.0" y="50.0" width="1040.0" height="40.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="570.0" y="74.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Бюджет буфера: offset + довжина прикмети ≤ BINPRM_BUF_SIZE = 256 байтів (у ядрах до 5.0 — 128)</tspan></text>
<rect x="50.0" y="112.0" width="226.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="163.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="163.0" dy="0.0">рядок QEMU AArch64</tspan><tspan x="163.0" dy="16.9">offset 0, прикмета 20 Б</tspan></text>
<rect x="300.0" y="112.0" width="61.7" height="46.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<rect x="361.7" y="112.0" width="728.3" height="46.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="725.9" y="139.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.9" dy="0.0">вільно: 236 байтів буфера</tspan></text>
<line x1="1090.0" y1="102.0" x2="1090.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="50.0" y="178.0" width="1040.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="570.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">0 + 20 = 20 ≤ 256 — реєстрація проходить</tspan></text>
<rect x="50.0" y="224.0" width="226.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="163.0" y="243.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="163.0" dy="0.0">прикмета задалеко</tspan><tspan x="163.0" dy="16.9">offset 240, прикмета 20 Б</tspan></text>
<rect x="300.0" y="224.0" width="740.6" height="46.0" rx="4" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.6"/><text x="670.3" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.3" dy="0.0">offset 240 байтів</tspan></text>
<rect x="1040.6" y="224.0" width="61.7" height="46.0" rx="4" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/>
<line x1="1090.0" y1="214.0" x2="1090.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="50.0" y="290.0" width="1040.0" height="34.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.4"/><text x="570.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">240 + 20 = 260 &gt; 256 → EINVAL; найбільший дозволений offset для цієї прикмети — 256 − 20 = 236</tspan></text>
<rect x="50.0" y="344.0" width="1040.0" height="40.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="570.0" y="368.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Бюджет рядка: увесь запис у файл register ≤ MAX_REGISTER_LENGTH = 1920 символів</tspan></text>
<rect x="50.0" y="406.0" width="226.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="163.0" y="425.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="163.0" dy="0.0">той самий рядок QEMU</tspan><tspan x="163.0" dy="16.9">200 символів</tspan></text>
<rect x="300.0" y="406.0" width="82.3" height="46.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<rect x="382.3" y="406.0" width="707.7" height="46.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="736.1" y="433.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.1" dy="0.0">вільно: 20 байтів прикмети — 71 символ, маска — 80, решта на імʼя, шлях і роздільники</tspan></text>
<line x1="1090.0" y1="396.0" x2="1090.0" y2="462.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="50.0" y="472.0" width="1040.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="570.0" y="493.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">запас величезний — межу в 1920 символів упирають самі лише дуже довгі прикмети</tspan></text>
<rect x="50.0" y="518.0" width="226.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="163.0" y="537.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="163.0" dy="0.0">межа екранування</tspan><tspan x="163.0" dy="16.9">1024 + 1024 = 2048</tspan></text>
<rect x="300.0" y="518.0" width="842.7" height="46.0" rx="4" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="721.3" y="545.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="721.3" dy="0.0">прикмета 256 Б і маска 256 Б, записані «\xNN» повністю</tspan></text>
<line x1="1090.0" y1="508.0" x2="1090.0" y2="574.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="50.0" y="584.0" width="1040.0" height="34.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.4"/><text x="570.0" y="605.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">повний буфер із маскою в рядок не влазить: 2048 &gt; 1920 — сирі друковані байти економлять по три символи</tspan></text>
</svg>