<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три фази оновлення RCU</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оновлення в три фази</text>
<rect x="30.0" y="60.0" width="240.0" height="200.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="150.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Усунення</text>
<text x="150.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">новий вказівник стає</tspan><tspan x="150.0" dy="18.0">видимим для нових читачів;</tspan><tspan x="150.0" dy="18.0">старий вузол більше</tspan><tspan x="150.0" dy="18.0">ніхто не знайде</tspan></text>
<line x1="272.0" y1="160.0" x2="308.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="60.0" width="240.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="430.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">2. Період відстрочки</text>
<text x="430.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">чекаємо, доки завершаться</tspan><tspan x="430.0" dy="18.0">УСІ читачі, що встигли</tspan><tspan x="430.0" dy="18.0">узяти старий вказівник</tspan><tspan x="430.0" dy="18.0">до усунення</tspan></text>
<line x1="552.0" y1="160.0" x2="588.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="590.0" y="60.0" width="240.0" height="200.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="710.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">3. Звільнення</text>
<text x="710.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">жоден читач більше не</tspan><tspan x="710.0" dy="18.0">тримає старий вузол —</tspan><tspan x="710.0" dy="18.0">памʼять можна</tspan><tspan x="710.0" dy="18.0">віддати</tspan></text>
<text x="290.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">rcu_assign_pointer()</text>
<text x="570.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">synchronize_rcu()</text>
<rect x="150.0" y="290.0" width="560.0" height="46.0" rx="6" fill="#27ae60" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Старий вузол живий увесь другий крок — саме тому читачеві</text>
<text x="430.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">не потрібен ані замок, ані перевірка</text>
</svg>