<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="900" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віхи: звідки прийшли ім'я, реалізація й семантика fork</text>
<line x1="250.0" y1="70.0" x2="250.0" y2="850.0" stroke="#6b7280" stroke-width="2.2"/>
<circle cx="250.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="224.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1963</text>
<rect x="280.0" y="58.0" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Мелвін Конвей, «A Multiprocessor System Design»</tspan><tspan x="600.0" dy="17.6">термін: розвилка (fork) і злиття (join)</tspan><tspan x="600.0" dy="17.6">теорія багатопроцесорності, не ОС</tspan></text>
<circle cx="250.0" cy="223.3" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="224.0" y="228.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1964–65</text>
<rect x="280.0" y="181.3" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Project GENIE, SDS 930 (Берклі)</tspan><tspan x="600.0" dy="17.6">перша реалізація fork — Пітер Дойч</tspan><tspan x="600.0" dy="17.6">дитина ДІЛИТЬ простір із батьком</tspan></text>
<circle cx="250.0" cy="346.7" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="224.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1969</text>
<rect x="280.0" y="304.7" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="333.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Unix на PDP-7 — Кен Томпсон</tspan><tspan x="600.0" dy="17.6">копія всього процесу через своп</tspan><tspan x="600.0" dy="17.6">27 рядків асемблера</tspan></text>
<circle cx="250.0" cy="470.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="224.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1971</text>
<rect x="280.0" y="428.0" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="457.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">TENEX на PDP-10 (BBN)</tspan><tspan x="600.0" dy="17.6">той самий родовід, є сторінкова пам'ять</tspan><tspan x="600.0" dy="17.6">fork знову НЕ копіює простору</tspan></text>
<circle cx="250.0" cy="593.3" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
<text x="224.0" y="598.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1974</text>
<rect x="280.0" y="551.3" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="580.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Рітчі й Томпсон, CACM</tspan><tspan x="600.0" dy="17.6">«по суті такий, як у Берклі»</tspan><tspan x="600.0" dy="17.6">— спогад, що розходиться з документами</tspan></text>
<circle cx="250.0" cy="716.7" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="224.0" y="721.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1979</text>
<rect x="280.0" y="674.7" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="703.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Рітчі, «The Evolution of…»; vfork у 3BSD</tspan><tspan x="600.0" dy="17.6">визнано: прижився через легкість</tspan><tspan x="600.0" dy="17.6">реалізації; ціну вже обходять</tspan></text>
<circle cx="250.0" cy="840.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="224.0" y="845.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">2019</text>
<rect x="280.0" y="798.0" width="640.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="600.0" y="827.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">HotOS: «A fork() in the road»</tspan><tspan x="600.0" dy="17.6">привілеї, ціна, відмови пам'яті</tspan><tspan x="600.0" dy="17.6">заклик вважати fork застарілим</tspan></text>
</svg>