<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коло, яким ходить задача: готова → на процесорі → у сні → знову готова</text>
<rect x="60.0" y="90.0" width="240.0" height="110.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Черга готових</text><text x="180.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">задачі зі станом R:</tspan><tspan x="180.0" dy="14.9">нічого не бракує,</tspan><tspan x="180.0" dy="14.9">бракує лише ядра</tspan></text>
<rect x="700.0" y="90.0" width="240.0" height="110.0" rx="10" fill="#fbfcff" stroke="#27ae60" stroke-width="2.0"/><text x="820.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Процесор</text><text x="820.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">одна задача виконується;</tspan><tspan x="820.0" dy="14.9">їй належить</tspan><tspan x="820.0" dy="14.9">увесь регістровий стан</tspan></text>
<rect x="700.0" y="340.0" width="240.0" height="110.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="2.0"/><text x="820.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700">Черга очікування</text><text x="820.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">задача стоїть при об'єкті,</tspan><tspan x="820.0" dy="14.9">якого чекає:</tspan><tspan x="820.0" dy="14.9">сокет, сторінка, м'ютекс</tspan></text>
<rect x="60.0" y="340.0" width="240.0" height="110.0" rx="10" fill="#fdf3e7" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Хто розбудить</text><text x="180.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">перервання від пристрою</tspan><tspan x="180.0" dy="14.9">або інша задача,</tspan><tspan x="180.0" dy="14.9">яка дала дані</tspan></text>
<line x1="300.0" y1="145.0" x2="700.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">планувальник обирає й ставить на процесор</text>
<line x1="820.0" y1="200.0" x2="820.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="800.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="800.0" dy="0.0">блокувальний виклик не має даних:</tspan><tspan x="800.0" dy="14.3">стан = S або D, далі schedule()</tspan></text>
<line x1="700.0" y1="395.0" x2="300.0" y2="395.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поки подія не сталася, задача не є кандидатом на процесор</text>
<line x1="180.0" y1="340.0" x2="180.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="200.0" dy="0.0">wake_up(): стан = R,</tspan><tspan x="200.0" dy="14.3">задача знову в черзі готових</tspan></text>
</svg>