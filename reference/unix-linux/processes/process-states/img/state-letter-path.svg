<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як біти поля __state перетворюються на одну літеру</text>
<rect x="40.0" y="78.0" width="340.0" height="176.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">у масці TASK_REPORT — видно назовні</text>
<text x="58.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="58.0" dy="0.0">0x0001  TASK_INTERRUPTIBLE</tspan><tspan x="58.0" dy="15.9">0x0002  TASK_UNINTERRUPTIBLE</tspan><tspan x="58.0" dy="15.9">0x0004  __TASK_STOPPED</tspan><tspan x="58.0" dy="15.9">0x0008  __TASK_TRACED</tspan><tspan x="58.0" dy="15.9">0x0010  EXIT_DEAD  (exit_state)</tspan><tspan x="58.0" dy="15.9">0x0020  EXIT_ZOMBIE  (exit_state)</tspan><tspan x="58.0" dy="15.9">0x0040  TASK_PARKED</tspan></text>
<rect x="40.0" y="288.0" width="340.0" height="176.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">поза маскою — назовні не потрапляє</text>
<text x="58.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="58.0" dy="0.0">0x0100  TASK_WAKEKILL — «можна вбити»</tspan><tspan x="58.0" dy="15.9">0x0200  TASK_WAKING</tspan><tspan x="58.0" dy="15.9">0x0400  TASK_NOLOAD — не в навантаженні</tspan><tspan x="58.0" dy="15.9">0x0800  TASK_NEW</tspan><tspan x="58.0" dy="15.9">0x1000  TASK_RTLOCK_WAIT</tspan><tspan x="58.0" dy="15.9">0x2000  TASK_FREEZABLE</tspan><tspan x="58.0" dy="15.9">0x8000  TASK_FROZEN</tspan></text>
<rect x="430.0" y="78.0" width="310.0" height="110.0" rx="10" fill="#fbfcff" stroke="#333333" stroke-width="1.8"/>
<text x="585.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. звести до маски</text>
<text x="448.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="448.0" dy="0.0">state = (__state | exit_state)</tspan><tspan x="448.0" dy="16.5">              &amp; TASK_REPORT</tspan></text>
<rect x="430.0" y="212.0" width="310.0" height="120.0" rx="10" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="585.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. підмінити спецвипадки</text>
<text x="448.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="448.0" dy="0.0">TASK_IDLE (0x0402) → 0x80</tspan><tspan x="448.0" dy="16.5">RTLOCK_WAIT або FROZEN → 0x02</tspan></text>
<rect x="430.0" y="368.0" width="310.0" height="96.0" rx="10" fill="#fbfcff" stroke="#27ae60" stroke-width="1.8"/>
<text x="585.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. узяти номер біта</text>
<text x="585.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">index = fls(state)</tspan><tspan x="585.0" dy="16.5">старший одиничний біт</tspan></text>
<rect x="790.0" y="78.0" width="350.0" height="250.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="2.0"/>
<text x="965.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700">task_state_array[index]</text>
<text x="818.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="818.0" dy="0.0">0 → R (running)</tspan><tspan x="818.0" dy="17.1">1 → S (sleeping)</tspan><tspan x="818.0" dy="17.1">2 → D (disk sleep)</tspan><tspan x="818.0" dy="17.1">3 → T (stopped)</tspan><tspan x="818.0" dy="17.1">4 → t (tracing stop)</tspan><tspan x="818.0" dy="17.1">5 → X (dead)</tspan><tspan x="818.0" dy="17.1">6 → Z (zombie)</tspan><tspan x="818.0" dy="17.1">7 → P (parked)</tspan><tspan x="818.0" dy="17.1">8 → I (idle)</tspan></text>
<rect x="790.0" y="372.0" width="350.0" height="92.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="965.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">ту саму літеру віддають:</tspan><tspan x="965.0" dy="16.5">поле 3 у /proc/PID/stat · «State:» у status</tspan><tspan x="965.0" dy="16.5">перший символ STAT у ps</tspan></text>
<line x1="382.0" y1="160.0" x2="426.0" y2="133.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="382.0" y1="350.0" x2="426.0" y2="205.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<line x1="585.0" y1="188.0" x2="585.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="585.0" y1="332.0" x2="585.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="744.0" y1="404.0" x2="788.0" y2="318.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="965.0" y1="330.0" x2="965.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>