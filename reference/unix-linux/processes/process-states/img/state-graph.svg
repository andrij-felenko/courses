<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани задачі й події, що ними рухають</text>
<rect x="380.9" y="99.5" width="318.2" height="41.0" rx="10" fill="#fbfcff" stroke="#27ae60" stroke-width="2.2"/><text x="540.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">R — готова: на процесорі або в черзі</tspan></text>
<rect x="113.5" y="299.5" width="173.1" height="41.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="2.2"/><text x="200.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">S — переривний сон</tspan></text>
<rect x="785.4" y="299.5" width="189.2" height="41.0" rx="10" fill="#fdf3e7" stroke="#c0392b" stroke-width="2.2"/><text x="880.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">D — непереривний сон</tspan></text>
<rect x="109.4" y="519.5" width="181.1" height="41.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.2"/><text x="200.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">T — зупинена ззовні</tspan></text>
<rect x="829.7" y="519.5" width="100.5" height="41.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="2.2"/><text x="880.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Z — зомбі</tspan></text>
<line x1="415.0" y1="148.0" x2="258.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="275.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="275.0" dy="0.0">туди: чекання, яке можна перервати</tspan><tspan x="275.0" dy="14.3">назад: дані прийшли або сигнал</tspan></text>
<line x1="665.0" y1="148.0" x2="822.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1040.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="1040.0" dy="0.0">туди: сон усередині вже початої операції</tspan><tspan x="1040.0" dy="14.3">назад: тільки її завершення</tspan></text>
<line x1="500.0" y1="145.0" x2="224.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="378.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="378.0" dy="0.0">SIGSTOP, SIGTSTP — зупинити</tspan><tspan x="378.0" dy="14.3">SIGCONT — пустити далі</tspan></text>
<line x1="580.0" y1="145.0" x2="856.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="702.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="702.0" dy="0.0">exit(): ресурси віддано,</tspan><tspan x="702.0" dy="14.3">лишився тільки код виходу</tspan></text>
<line x1="880.0" y1="566.0" x2="880.0" y2="590.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="880.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">батько викликав wait() — запис зникає</text>
<text x="60.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стрілки — події, що переводять задачу між станами</text>
</svg>