<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять фаз піддослідного і що виводить його з кожної</text>
<text x="1180.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">усі п'ять — на одному PID, окрім Z: зомбі — це дитина</text>
<rect x="40.0" y="88.0" width="150.0" height="54.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="115.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">фаза</tspan></text>
<rect x="40.0" y="158.0" width="150.0" height="92.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="115.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">що робить</tspan><tspan x="115.0" dy="15.6">піддослідний</tspan></text>
<rect x="40.0" y="266.0" width="150.0" height="92.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="115.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">що поверне</tspan><tspan x="115.0" dy="15.6">його в R</tspan></text>
<rect x="40.0" y="374.0" width="150.0" height="92.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="115.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">як діє</tspan><tspan x="115.0" dy="15.6">сигнал</tspan></text>
<rect x="210.0" y="88.0" width="180.0" height="54.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">R</tspan></text>
<rect x="210.0" y="158.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.4"/><text x="300.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">порожній цикл</tspan><tspan x="300.0" dy="15.6">рівно 3 секунди</tspan></text>
<rect x="210.0" y="266.0" width="180.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="300.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">нічого чекати не треба:</tspan><tspan x="300.0" dy="15.6">задача вже готова</tspan></text>
<rect x="210.0" y="374.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="300.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">SIGTERM — гине одразу</tspan></text>
<rect x="406.0" y="88.0" width="180.0" height="54.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="2.4"/><text x="496.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="496.0" dy="0.0">S</tspan></text>
<rect x="406.0" y="158.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.4"/><text x="496.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">nanosleep(3 c)</tspan></text>
<rect x="406.0" y="266.0" width="180.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="496.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">таймер — або</tspan><tspan x="496.0" dy="15.6">будь-який сигнал</tspan></text>
<rect x="406.0" y="374.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="496.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">SIGTERM — гине одразу</tspan></text>
<rect x="602.0" y="88.0" width="180.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/><text x="692.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="692.0" dy="0.0">T</tspan></text>
<rect x="602.0" y="158.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.4"/><text x="692.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="692.0" dy="0.0">raise(SIGSTOP)</tspan></text>
<rect x="602.0" y="266.0" width="180.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="692.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="692.0" dy="0.0">тільки SIGCONT;</tspan><tspan x="692.0" dy="15.6">його шле спостерігач</tspan></text>
<rect x="602.0" y="374.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="692.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="692.0" dy="0.0">SIGTERM чекає</tspan><tspan x="692.0" dy="15.6">до SIGCONT</tspan></text>
<rect x="798.0" y="88.0" width="180.0" height="54.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="2.4"/><text x="888.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="888.0" dy="0.0">Z</tspan></text>
<rect x="798.0" y="158.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.4"/><text x="888.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="888.0" dy="0.0">дитина вийшла,</tspan><tspan x="888.0" dy="15.6">wait() ще не було</tspan></text>
<rect x="798.0" y="266.0" width="180.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="888.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="888.0" dy="0.0">wait() від батька</tspan></text>
<rect x="798.0" y="374.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.6"/><text x="888.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="888.0" dy="0.0">сигнали не діють:</tspan><tspan x="888.0" dy="15.6">виконувати вже нікому</tspan></text>
<rect x="994.0" y="88.0" width="180.0" height="54.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="2.4"/><text x="1084.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1084.0" dy="0.0">D</tspan></text>
<rect x="994.0" y="158.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.4"/><text x="1084.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1084.0" dy="0.0">clone(CLONE_VFORK):</tspan><tspan x="1084.0" dy="15.6">батько чекає дитину</tspan></text>
<rect x="994.0" y="266.0" width="180.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="1084.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1084.0" dy="0.0">тільки вихід дитини</tspan></text>
<rect x="994.0" y="374.0" width="180.0" height="92.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="1084.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1084.0" dy="0.0">SIGTERM лежить у черзі,</tspan><tspan x="1084.0" dy="15.6">SIGKILL — виводить</tspan></text>
</svg>