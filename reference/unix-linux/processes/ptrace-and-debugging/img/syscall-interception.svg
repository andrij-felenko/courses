<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоетапне перехоплення системних викликів у strace</text>
<rect x="40.0" y="50.0" width="960.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="520.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Трасування системного виклику за допомогою PTRACE_SYSCALL</tspan></text>
<rect x="60.0" y="110.0" width="260.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="190.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Вхід у виклик (Syscall Entry)</tspan></text>
<rect x="60.0" y="152.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="190.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Зупинка перед виконанням виклику.</tspan><tspan x="190.0" dy="14.3">strace читає RAX (номер виклику)</tspan><tspan x="190.0" dy="14.3">та RDI, RSI, RDX (аргументи)</tspan></text>
<rect x="390.0" y="110.0" width="260.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="520.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">2. Виконання у ядрі</tspan></text>
<rect x="390.0" y="152.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="520.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ядро виконує системну операцію</tspan><tspan x="520.0" dy="14.3">(наприклад, sys_read або sys_write).</tspan><tspan x="520.0" dy="14.3">Трасований процес спить у ядрі</tspan></text>
<rect x="720.0" y="110.0" width="260.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="850.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">3. Вихід з виклику (Syscall Exit)</tspan></text>
<rect x="720.0" y="152.0" width="260.0" height="150.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="850.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Зупинка після виконання виклику.</tspan><tspan x="850.0" dy="14.3">strace читає RAX (код повернення).</tspan><tspan x="850.0" dy="14.3">Друкування результату у консоль</tspan></text>
<line x1="324.0" y1="185.0" x2="386.0" y2="185.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="654.0" y1="185.0" x2="716.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="920.0" height="110.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.4"/><text x="520.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Прапорець PTRACE_O_TRACESYSGOOD:</tspan><tspan x="520.0" dy="14.3">За замовчуванням ядро надсилає звичайний SIGTRAP при системному виклику.</tspan><tspan x="520.0" dy="14.3">З прапорцем PTRACE_O_TRACESYSGOOD ядро встановлює 7-й біт у номері сигналу (SIGTRAP | 0x80 = 0x85).</tspan><tspan x="520.0" dy="14.3">Це дозволяє strace миттєво відрізнити зупинку на системному виклику від звичайного сигналу.</tspan></text>
</svg>