<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм роботи програмної точки зупину (INT 3)</text>
<rect x="40.0" y="70.0" width="220.0" height="36.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.6"/><text x="150.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Початковий код</tspan></text>
<rect x="40.0" y="114.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><text x="150.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Адреса 0x401120: [ 0x55 ] (push rbp)</tspan><tspan x="150.0" dy="11.7">Оригінальний байт інструкції в пам'яті</tspan></text>
<line x1="264.0" y1="220.0" x2="281.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="285.0" y="70.0" width="220.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="395.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">2. Впровадження 0xCC</tspan></text>
<rect x="285.0" y="114.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="395.0" y="220.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">gdb робить PTRACE_POKEDATA</tspan><tspan x="395.0" dy="14.3">Запис 0xCC (int 3) замість 0x55</tspan></text>
<line x1="509.0" y1="220.0" x2="526.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="70.0" width="220.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="640.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">3. Спрацьовування #BP</tspan></text>
<rect x="530.0" y="114.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="640.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Процесор виконує 0xCC → виняток #BP</tspan><tspan x="640.0" dy="13.0">Ядро шле SIGTRAP, RIP = 0x401121</tspan></text>
<line x1="754.0" y1="220.0" x2="771.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="775.0" y="70.0" width="220.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="885.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">4. Відновлення та крок</tspan></text>
<rect x="775.0" y="114.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="885.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">gdb повертає 0x55, ставить RIP = 0x401120</tspan><tspan x="885.0" dy="11.7">PTRACE_SINGLESTEP → повернення 0xCC</tspan></text>
<rect x="40.0" y="370.0" width="960.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="520.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Деталі виконання Singlestep:</tspan><tspan x="520.0" dy="14.3">1. PTRACE_POKEDATA: запис оригінального байта 0x55 назад у пам'ять.</tspan><tspan x="520.0" dy="14.3">2. PTRACE_SETREGS: зменшення регістра RIP на 1 байт (з 0x401121 назад на 0x401120).</tspan><tspan x="520.0" dy="14.3">3. PTRACE_SINGLESTEP: встановлення прапорця TF (Trap Flag) у RFLAGS для виконання 1 інструкції.</tspan><tspan x="520.0" dy="14.3">4. Після виконання 0x55 процесор генерує виняток #DB, ядро шле SIGTRAP; gdb повертає 0xCC і робить PTRACE_CONT.</tspan></text>
<text x="520.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Програмна точка зупину тимчасово модифікує машинний код процесу в пам'яті</text>
</svg>