<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні обмежень безпеки Yama ptrace_scope</text>
<rect x="40.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Scope 0: Класичний</tspan></text>
<rect x="40.0" y="116.0" width="220.0" height="240.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.4"/><text x="150.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ptrace_scope = 0</tspan><tspan x="150.0" dy="11.7"></tspan><tspan x="150.0" dy="11.7">Будь-який процес може трасувати</tspan><tspan x="150.0" dy="11.7">інший процес того самого UID.</tspan><tspan x="150.0" dy="11.7">Високий ризик ін'єкцій шкідливого коду.</tspan></text>
<rect x="285.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Scope 1: Обмежений</tspan></text>
<rect x="285.0" y="116.0" width="220.0" height="240.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="395.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">ptrace_scope = 1 (Стандарт)</tspan><tspan x="395.0" dy="11.7"></tspan><tspan x="395.0" dy="11.7">Процес може трасувати лише своїх</tspan><tspan x="395.0" dy="11.7">нащадків (через fork + TRACEME).</tspan><tspan x="395.0" dy="11.7">Прямий attach до сторонніх заборонено.</tspan></text>
<rect x="530.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="640.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Scope 2: Лише Root</tspan></text>
<rect x="530.0" y="116.0" width="220.0" height="240.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="640.0" y="211.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">ptrace_scope = 2</tspan><tspan x="640.0" dy="14.3"></tspan><tspan x="640.0" dy="14.3">Трасування дозволено лише для</tspan><tspan x="640.0" dy="14.3">процесів з CAP_SYS_PTRACE</tspan><tspan x="640.0" dy="14.3">(зазвичай це root).</tspan></text>
<rect x="775.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="885.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Scope 3: Заблоковано</tspan></text>
<rect x="775.0" y="116.0" width="220.0" height="240.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="885.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">ptrace_scope = 3</tspan><tspan x="885.0" dy="11.7"></tspan><tspan x="885.0" dy="11.7">ptrace повністю вимкнено для всіх.</tspan><tspan x="885.0" dy="11.7">Зміна режиму вимагає перезавантаження</tspan><tspan x="885.0" dy="11.7">системи (перезапуск ядра).</tspan></text>
<rect x="40.0" y="390.0" width="960.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="520.0" y="427.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Налаштування через sysctl / procfs:</tspan><tspan x="520.0" dy="14.3">Поточний рівень регулюється у файлі /proc/sys/kernel/yama/ptrace_scope.</tspan><tspan x="520.0" dy="14.3">Для обходу Scope 1 при налагодженні сервісів використовують команду:</tspan><tspan x="520.0" dy="14.3">sysctl -w kernel.yama.ptrace_scope=0  або надають права CAP_SYS_PTRACE.</tspan></text>
<text x="520.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Модуль безпеки Yama обмежує радіус ураження ptrace у сучасних Linux дистрибутивах</text>
</svg>