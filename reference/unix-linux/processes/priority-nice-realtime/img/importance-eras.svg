<rect x="195.0" y="452.0" width="225.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="307.5" y="500.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">EEVDF: відставання й дедлайн</tspan></text>
<rect x="435.0" y="452.0" width="405.0" height="88.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">і частка, і черговість: та сама вага</tspan><tspan x="637.5" dy="16.9">ще й стискає віртуальний дедлайн</tspan></text>
<rect x="855.0" y="452.0" width="130.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="920.0" dy="0.0">вага</tspan><tspan x="920.0" dy="16.9">+ термін</tspan></text>
<text x="500.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">Саме число nice лишалося тим самим −20 … 19 — мінялося те, на що воно перетворюється всередині</text>
