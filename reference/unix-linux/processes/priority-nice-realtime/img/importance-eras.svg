<text x="307.5" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">механізм</text>
<text x="637.5" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">чим була «важливість»</text>
<text x="920.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">одиниця</text>
<rect x="30.0" y="60.0" width="150.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="100.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1973</tspan><tspan x="105.0" dy="16.9">Unix V4…V7</tspan></text>
<rect x="195.0" y="60.0" width="225.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="307.5" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">p_cpu/16 + PUSER + nice</tspan></text>
<rect x="435.0" y="60.0" width="405.0" height="88.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="100.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">доданок до штрафу за спожитий час:</tspan><tspan x="637.5" dy="16.9">nice зсуває всю криву згасання</tspan></text>
<rect x="855.0" y="60.0" width="130.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="100.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="920.0" dy="0.0">одиниці</tspan><tspan x="920.0" dy="16.9">пріоритету</tspan></text>
<rect x="30.0" y="158.0" width="150.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1991–2003</tspan><tspan x="105.0" dy="16.9">Linux 1.0 – 2.4</tspan></text>
<rect x="195.0" y="158.0" width="225.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="307.5" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">goodness() і епохи</tspan></text>
<rect x="435.0" y="158.0" width="405.0" height="88.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">квота тиків на епоху; недобрана половина</tspan><tspan x="637.5" dy="16.9">переходить у наступну</tspan></text>
<rect x="855.0" y="158.0" width="130.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="920.0" dy="0.0">тики</tspan><tspan x="920.0" dy="16.9">(jiffies)</tspan></text>
<rect x="30.0" y="256.0" width="150.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">2003–2007</tspan><tspan x="105.0" dy="15.6">Linux 2.6.0 – 2.6.22</tspan></text>
<rect x="195.0" y="256.0" width="225.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="307.5" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">O(1): два масиви</tspan></text>
<rect x="435.0" y="256.0" width="405.0" height="88.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">довжина кванта плюс евристична добавка</tspan><tspan x="637.5" dy="16.9">за те, скільки задача спала</tspan></text>
<rect x="855.0" y="256.0" width="130.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="920.0" dy="0.0">мілісекунди</tspan><tspan x="920.0" dy="16.9">5 … 800</tspan></text>
