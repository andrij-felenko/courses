<rect x="195.0" y="354.0" width="225.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="307.5" y="402.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">CFS: віртуальний час</tspan></text>
