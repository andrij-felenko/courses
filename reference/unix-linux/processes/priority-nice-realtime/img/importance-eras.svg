<rect x="855.0" y="354.0" width="130.0" height="88.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="394.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="920.0" dy="0.0">вага</tspan><tspan x="920.0" dy="16.9">15 … 88761</tspan></text>
