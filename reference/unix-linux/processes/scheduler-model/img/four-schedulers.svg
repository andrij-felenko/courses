<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири планувальники Linux: чим обирали і що кожного зламало</text>
<rect x="30.0" y="46.0" width="226.0" height="62.0" rx="8" fill="#fbfcff" stroke="#9aa1ab" stroke-width="2.2"/>
<text x="143.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#9aa1ab" text-anchor="middle" font-weight="700">Обхід усіх</text>
<text x="143.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1991 — 2.4</text>
<text x="143.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">як обирає</text>
<rect x="30.0" y="152.0" width="226.0" height="152.0" rx="6" fill="#ffffff" stroke="#9aa1ab" stroke-width="1.6"/><text x="143.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="143.0" dy="0.0">перебрати ВСІ готові задачі,</tspan><tspan x="143.0" dy="15.0">кожній порахувати goodness(),</tspan><tspan x="143.0" dy="15.0">узяти найкращу;</tspan><tspan x="143.0" dy="15.0">одна черга на всю машину</tspan><tspan x="143.0" dy="15.0">під одним замком</tspan></text>
<text x="143.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що на нього натиснуло</text>
<rect x="30.0" y="358.0" width="226.0" height="152.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.4"/><text x="143.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="143.0" dy="0.0">сервер із тисячами задач:</tspan><tspan x="143.0" dy="15.0">вибір коштує тим більше,</tspan><tspan x="143.0" dy="15.0">чим більше охочих,</tspan><tspan x="143.0" dy="15.0">а спільний замок черги</tspan><tspan x="143.0" dy="15.0">не ділиться між процесорами</tspan></text>
<rect x="288.0" y="46.0" width="226.0" height="62.0" rx="8" fill="#fbfcff" stroke="#2457d6" stroke-width="2.2"/>
<text x="401.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Сталий час</text>
<text x="401.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">O(1), 2002 → 2.6.0</text>
<text x="401.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">як обирає</text>
<rect x="288.0" y="152.0" width="226.0" height="152.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="401.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="401.0" dy="0.0">черга на КОЖЕН процесор;</tspan><tspan x="401.0" dy="15.0">140 рівнів, масиви</tspan><tspan x="401.0" dy="15.0">active / expired,</tspan><tspan x="401.0" dy="15.0">вибір — один пошук</tspan><tspan x="401.0" dy="15.0">по бітовій мапі</tspan></text>
<text x="401.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що на нього натиснуло</text>
<rect x="288.0" y="358.0" width="226.0" height="152.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.4"/><text x="401.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="401.0" dy="0.0">інтерактивність — ЗДОГАДКА</tspan><tspan x="401.0" dy="15.0">за середнім часом сну:</tspan><tspan x="401.0" dy="15.0">евристика хибно судила</tspan><tspan x="401.0" dy="15.0">про ігри, звук і відео,</tspan><tspan x="401.0" dy="15.0">а кожна латка родила виняток</tspan></text>
<rect x="546.0" y="46.0" width="226.0" height="62.0" rx="8" fill="#fbfcff" stroke="#27ae60" stroke-width="2.2"/>
<text x="659.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Чесний облік</text>
<text x="659.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CFS, 2.6.23, 2007</text>
<text x="659.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">як обирає</text>
<rect x="546.0" y="152.0" width="226.0" height="152.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="659.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">жодних здогадок про наміри:</tspan><tspan x="659.0" dy="15.0">віртуальний час і борг,</tspan><tspan x="659.0" dy="15.0">червоно-чорне дерево,</tspan><tspan x="659.0" dy="15.0">біжить найлівіший</tspan></text>
<text x="659.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що на нього натиснуло</text>
<rect x="546.0" y="358.0" width="226.0" height="152.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.4"/><text x="659.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">одна ручка nice керувала</tspan><tspan x="659.0" dy="15.0">ЧАСТКОЮ; попросити</tspan><tspan x="659.0" dy="15.0">«часто й потроху»</tspan><tspan x="659.0" dy="15.0">було нічим — доводилося</tspan><tspan x="659.0" dy="15.0">просити зайвий відсоток</tspan></text>
<rect x="804.0" y="46.0" width="226.0" height="62.0" rx="8" fill="#fbfcff" stroke="#c0392b" stroke-width="2.2"/>
<text x="917.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Придатність і строк</text>
<text x="917.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">EEVDF, 6.6, 2023</text>
<text x="917.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">як обирає</text>
<rect x="804.0" y="152.0" width="226.0" height="152.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="917.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="917.0" dy="0.0">борг відсіює тих, хто забрав</tspan><tspan x="917.0" dy="15.0">наперед; серед решти —</tspan><tspan x="917.0" dy="15.0">найближчий віртуальний строк;</tspan><tspan x="917.0" dy="15.0">довжина відрізка стала</tspan><tspan x="917.0" dy="15.0">окремою, другою віссю</tspan></text>
<text x="917.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що на нього натиснуло</text>
<rect x="804.0" y="358.0" width="226.0" height="152.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.4"/><text x="917.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="917.0" dy="0.0">тримається; але відповіддю</tspan><tspan x="917.0" dy="15.0">на наступний тиск</tspan><tspan x="917.0" dy="15.0">став не п'ятий алгоритм,</tspan><tspan x="917.0" dy="15.0">а sched_ext (6.12):</tspan><tspan x="917.0" dy="15.0">політика як програма eBPF</tspan></text>
<line x1="262.0" y1="78.0" x2="280.0" y2="78.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="78.0" x2="538.0" y2="78.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="778.0" y1="78.0" x2="796.0" y2="78.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="530.0" width="1000.0" height="44.0" rx="6" fill="#eef3ff" stroke="#1a1a1a" stroke-width="1.8"/><text x="530.0" y="556.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Щоразу переписували не через кращу теорію, а через навантаження, якого попередній автор не бачив</tspan></text>
</svg>