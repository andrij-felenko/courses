<text x="823.2" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">борг A = 1 · (V − 10) = −2.86 мс</text>
<line x1="528.5" y1="116.0" x2="528.5" y2="252.0" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="124.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">придатні: v ≤ V, борг невід'ємний</text>
<text x="916.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">забрали наперед: v &gt; V</text>
<rect x="150.0" y="496.0" width="720.0" height="58.0" rx="6" fill="#eef3ff" stroke="#1a1a1a" stroke-width="2.0"/><text x="510.0" y="530.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Σ wᵢ · (V − vᵢ) = 0   ⇒   V = Σ wᵢvᵢ / Σ wᵢ</tspan></text>
