<text x="208.8" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">борг B = 1 · (V − 4) = +3.14 мс</text>
<line x1="611.1" y1="282.0" x2="611.1" y2="184.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4 4"/>
