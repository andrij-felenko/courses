<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари стану процесу і різниця між вмістом та ідентичністю</text>
<rect x="40.0" y="30.0" width="1040.0" height="40.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="560.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">«Стан процесу» лежить у трьох різних місцях — і скопіювати вміст замало</tspan></text>
<rect x="40.0" y="92.0" width="320.0" height="58.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="200.0" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">У самій задачі</tspan></text>
<rect x="50.0" y="172.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">регістри й точка виконання</tspan></text>
<rect x="50.0" y="230.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">маска й черга сигналів</tspan></text>
<rect x="50.0" y="288.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">PID · PPID · PGID · SID</tspan></text>
<rect x="50.0" y="346.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="373.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">UID, GID, можливості</tspan></text>
<rect x="50.0" y="404.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ліміти ресурсів (rlimit)</tspan></text>
<rect x="400.0" y="92.0" width="320.0" height="58.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="560.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Структури, на які</tspan><tspan x="560.0" dy="18.2">задача посилається</tspan></text>
<rect x="410.0" y="172.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">mm_struct — карта пам'яті</tspan></text>
<rect x="410.0" y="230.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">files_struct — таблиця fd</tspan></text>
<rect x="410.0" y="288.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">sighand — диспозиції</tspan></text>
