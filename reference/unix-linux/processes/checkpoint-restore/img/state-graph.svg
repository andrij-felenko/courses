<rect x="410.0" y="404.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">nsproxy — простори імен</tspan></text>
<rect x="760.0" y="92.0" width="320.0" height="58.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.8"/><text x="920.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Об'єкти ядра</tspan><tspan x="920.0" dy="18.2">за дескрипторами</tspan></text>
<rect x="770.0" y="172.0" width="300.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">опис відкритого файлу:</tspan><tspan x="920.0" dy="15.6">зміщення й прапорці</tspan></text>
<rect x="770.0" y="246.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">канал: вміст буфера</tspan></text>
<rect x="770.0" y="304.0" width="300.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">сокет: черги й номери</tspan><tspan x="920.0" dy="15.6">послідовності TCP</tspan></text>
<rect x="770.0" y="378.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">epoll: набір цілей</tspan></text>
<rect x="770.0" y="436.0" width="300.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="920.0" y="463.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">таймер: залишок до спрацювання</tspan></text>
<line x1="366.0" y1="121.0" x2="396.0" y2="121.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="726.0" y1="121.0" x2="756.0" y2="121.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="566.0" width="1040.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="560.0" y="592.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">ВМІСТ — байти сторінок, буферів, черг: його можна прочитати й записати назад</tspan></text>
<rect x="40.0" y="622.0" width="1040.0" height="44.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.8"/><text x="560.0" y="648.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">ІДЕНТИЧНІСТЬ — число 4711 як PID, число 7 як номер дескриптора, адреса 0x7f… як місце відображення</tspan></text>
<text x="560.0" y="700.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вміст копіюється тривіально; уся складність знімка — у другому рядку</text>
