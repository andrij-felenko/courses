<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стратегії перенесення живої задачі та довжина паузи в кожній</text>
<rect x="40.0" y="26.0" width="1040.0" height="38.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="560.0" y="49.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Знімок завжди коштує паузи — питання лише, скільки роботи в неї зігнати</tspan></text>
<rect x="40.0" y="106.0" width="240.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="137.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Зупинити й скопіювати</tspan></text>
<rect x="300.0" y="112.0" width="154.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="377.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">робота</tspan></text>
<rect x="454.0" y="112.0" width="406.0" height="42.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="657.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="657.0" dy="0.0">ПАУЗА: знімок і передача всієї пам'яті</tspan></text>
<rect x="860.0" y="112.0" width="140.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="930.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">робота</tspan></text>
<rect x="40.0" y="172.0" width="1040.0" height="34.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.1"/><text x="560.0" y="192.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">проста, але пауза дорівнює обсягу пам'яті, поділеному на смугу</tspan></text>
<rect x="40.0" y="230.0" width="240.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Копіювати наперед</tspan></text>
<rect x="300.0" y="236.0" width="434.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="517.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="517.0" dy="0.0">робота + ітерації копіювання</tspan></text>
<rect x="734.0" y="236.0" width="84.0" height="42.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="776.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">пауза: дозбір бруду</tspan></text>
<rect x="818.0" y="236.0" width="182.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="909.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="909.0" dy="0.0">робота</tspan></text>
<rect x="40.0" y="296.0" width="1040.0" height="34.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.1"/><text x="560.0" y="316.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">пауза мала, доки задача бруднить сторінки повільніше, ніж їх устигає передати мережа</tspan></text>
<rect x="40.0" y="354.0" width="240.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="385.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Копіювати навздогін</tspan></text>
<rect x="300.0" y="360.0" width="238.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="419.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="419.0" dy="0.0">робота</tspan></text>
<rect x="538.0" y="360.0" width="42.0" height="42.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.5"/><text x="559.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="559.0" dy="0.0">пауза</tspan></text>
<rect x="580.0" y="360.0" width="420.0" height="42.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">робота на новій машині: сторінки підтягують за збоями</tspan></text>
<rect x="40.0" y="420.0" width="1040.0" height="34.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.1"/><text x="560.0" y="440.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">пауза найкоротша, зате перші хвилини задача працює повільніше</tspan></text>
<line x1="300.0" y1="486.0" x2="1000.0" y2="486.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="970.0" y1="486.0" x2="1020.0" y2="486.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="650.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">час</text>
<text x="560.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">пауза — це відрізок, протягом якого задача не виконала жодної інструкції</text>
</svg>