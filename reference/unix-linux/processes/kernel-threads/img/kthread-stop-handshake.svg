<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупинка потоку — рукостискання, а не наказ</text>
<rect x="40.0" y="52.0" width="360.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="220.0" y="76.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">rmmod → kdemo_exit()</tspan></text>
<rect x="680.0" y="52.0" width="360.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="860.0" y="76.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">потік kdemo/0</tspan></text>
<rect x="40.0" y="108.0" width="360.0" height="50.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">kthread_stop(demo-&gt;task)</tspan></text>
<rect x="680.0" y="108.0" width="360.0" height="50.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">спить у wait_event_interruptible()</tspan></text>
<text x="540.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">виставляє KTHREAD_SHOULD_STOP</text>
<text x="540.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">і TIF_NOTIFY_SIGNAL, будить</text>
<line x1="406.0" y1="204.0" x2="674.0" y2="204.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40.0" y="228.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="250.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">wait_for_completion(&amp;exited)</tspan><tspan x="220.0" dy="14.3">— засинає сам</tspan></text>
<rect x="680.0" y="228.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="250.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">прокидається; умову перевірено:</tspan><tspan x="860.0" dy="14.3">kthread_should_stop() → true</tspan></text>
<line x1="860.0" y1="280.0" x2="860.0" y2="310.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="680.0" y="314.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">break з циклу; kfree(scratch);</tspan><tspan x="860.0" dy="14.3">потік прибирає за собою</tspan></text>
<line x1="860.0" y1="366.0" x2="860.0" y2="396.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="680.0" y="400.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">return 0 → kthread_exit(0)</tspan><tspan x="860.0" dy="14.3">complete(&amp;exited)</tspan></text>
<text x="540.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потік уже мертвий</text>
<line x1="220.0" y1="280.0" x2="220.0" y2="454.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3 4"/>
<line x1="674.0" y1="488.0" x2="406.0" y2="488.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40.0" y="510.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="539.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">kthread_stop() повертає 0</tspan></text>
<line x1="220.0" y1="562.0" x2="220.0" y2="588.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="3 4"/>
<rect x="40.0" y="592.0" width="360.0" height="52.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="614.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">kfree(demo); далі ядро звільняє</tspan><tspan x="220.0" dy="14.3">пам'ять модуля</tspan></text>
<text x="540.0" y="670.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">поки kthread_stop() не повернувся, код потоку ще виконується — а лежить він у пам'яті модуля</text>
</svg>