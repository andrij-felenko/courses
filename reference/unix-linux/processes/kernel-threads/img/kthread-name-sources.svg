<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки інструменти беруть назву потоку ядра</text>
<rect x="340.0" y="52.0" width="360.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">задача ядра, народжена як</tspan><tspan x="520.0" dy="15.6">&quot;kworker/u16:3&quot;</tspan></text>
<line x1="430.0" y1="100.0" x2="300.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="610.0" y1="100.0" x2="740.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="158.0" width="440.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="270.0" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">task_struct.comm[16]</tspan><tspan x="270.0" dy="15.6">15 символів плюс нуль — усе,</tspan><tspan x="270.0" dy="15.6">що не влізло, відрізано</tspan></text>
<rect x="550.0" y="158.0" width="440.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="770.0" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">kthread-&gt;full_name, а для робітника —</tspan><tspan x="770.0" dy="15.6">ще й опис поточної роботи:</tspan><tspan x="770.0" dy="15.6">довжина не обмежена п'ятнадцятьма</tspan></text>
<line x1="270.0" y1="244.0" x2="270.0" y2="292.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="770.0" y1="244.0" x2="770.0" y2="292.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="294.0" width="440.0" height="108.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="270.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">події ftrace й perf (поле comm)</tspan><tspan x="270.0" dy="15.6">дампи ядра: oops, sysrq-w</tspan><tspan x="270.0" dy="15.6"></tspan><tspan x="270.0" dy="15.6">видно: kworker/u16:3</tspan></text>
<rect x="550.0" y="294.0" width="440.0" height="108.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="770.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">/proc/PID/comm, /proc/PID/stat,</tspan><tspan x="770.0" dy="15.6">/proc/PID/status → ps, top, htop</tspan><tspan x="770.0" dy="15.6"></tspan><tspan x="770.0" dy="15.6">видно: kworker/u16:3-writeback</tspan></text>
<text x="520.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одна задача — дві назви: довшу /proc складає на льоту, тому в ps вона є, а в трасуванні немає</text>
