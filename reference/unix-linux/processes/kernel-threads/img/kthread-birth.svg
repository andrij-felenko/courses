<text x="530.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">потоки ядра не висять під init — тому вони не сироти, їх ніхто не перепідпорядковує й вони не турбують wait() у першого процесу</text>
