<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження потоку ядра і два корені дерева задач</text>
<rect x="40.0" y="34.0" width="980.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="530.0" y="55.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Шлях створення: замовник лише лишає заявку</tspan></text>
<rect x="40.0" y="84.0" width="172.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="126.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="126.0" dy="0.0">драйвер чи підсистема</tspan><tspan x="126.0" dy="14.3">kthread_run(fn, ...)</tspan></text>
<rect x="242.0" y="84.0" width="172.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="328.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="328.0" dy="0.0">заявку в чергу</tspan><tspan x="328.0" dy="14.3">kthread_create_list</tspan></text>
<line x1="216.0" y1="117.0" x2="237.0" y2="117.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="444.0" y="84.0" width="172.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="530.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">прокидається kthreadd</tspan><tspan x="530.0" dy="14.3">PID 2</tspan></text>
<line x1="418.0" y1="117.0" x2="439.0" y2="117.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="646.0" y="84.0" width="172.0" height="66.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="732.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="732.0" dy="0.0">клон від init_task:</tspan><tspan x="732.0" dy="14.3">чисте оточення</tspan></text>
<line x1="620.0" y1="117.0" x2="641.0" y2="117.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="848.0" y="84.0" width="172.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="934.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="934.0" dy="0.0">нова задача</tspan><tspan x="934.0" dy="14.3">виконує fn()</tspan></text>
<line x1="822.0" y1="117.0" x2="843.0" y2="117.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="530.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">посередник потрібен, бо нова задача успадковує оточення батька — а батьком має бути завідомо чистий предок, а не випадковий процес</text>
<rect x="40.0" y="250.0" width="980.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="530.0" y="270.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Дерево задач: два корені під спільним нулем</tspan></text>
<rect x="410.0" y="304.0" width="240.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="530.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">0 — задача простою</tspan><tspan x="530.0" dy="14.3">(swapper, у ps не видно)</tspan></text>
<rect x="150.0" y="400.0" width="250.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="275.0" y="430.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">1 — init / systemd</tspan></text>
