<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 492" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="492" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що станеться з kthread_stop() залежно від умови засинання</text>
<rect x="40.0" y="50.0" width="330.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="205.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Як написано засинання</tspan></text>
<rect x="380.0" y="50.0" width="250.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="505.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Що бачить потік</tspan></text>
<rect x="640.0" y="50.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="840.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Що з цього виходить</tspan></text>
<rect x="40.0" y="104.0" width="330.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">wait_event(wq, has_work)</tspan><tspan x="205.0" dy="14.3">непереривний сон</tspan></text>
<rect x="380.0" y="104.0" width="250.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.3"/><text x="505.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">розбудили, умова та сама</tspan></text>
<rect x="640.0" y="104.0" width="400.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="840.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">заснув назад; і потік, і rmmod</tspan><tspan x="840.0" dy="14.3">назавжди в стані D</tspan></text>
<rect x="40.0" y="186.0" width="330.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">wait_event_interruptible(wq, has_work)</tspan><tspan x="205.0" dy="14.3">ядра до 6.0 включно</tspan></text>
<rect x="380.0" y="186.0" width="250.0" height="72.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.3"/><text x="505.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">розбудили, сигналу немає</tspan></text>
<rect x="640.0" y="186.0" width="400.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="840.0" y="218.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">заснув назад; rmmod висить,</tspan><tspan x="840.0" dy="14.3">через 120 с — «blocked for more than»</tspan></text>
<rect x="40.0" y="268.0" width="330.0" height="72.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="205.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">wait_event_interruptible(wq, has_work)</tspan><tspan x="205.0" dy="14.3">ядра 6.1 і новіші</tspan></text>
<rect x="380.0" y="268.0" width="250.0" height="72.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="505.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">kthread_stop() ставить</tspan><tspan x="505.0" dy="14.3">TIF_NOTIFY_SIGNAL</tspan></text>
<rect x="640.0" y="268.0" width="400.0" height="72.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="840.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">вихід із -ERESTARTSYS; якщо код</tspan><tspan x="840.0" dy="14.3">повернення ігнорують — 100 % CPU</tspan></text>
<rect x="40.0" y="350.0" width="330.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">wait_event_interruptible(wq,</tspan><tspan x="205.0" dy="14.3">    has_work || kthread_should_stop())</tspan></text>
<rect x="380.0" y="350.0" width="250.0" height="72.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.3"/><text x="505.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">прапорець перевіряє</tspan><tspan x="505.0" dy="14.3">сама умова</tspan></text>
<rect x="640.0" y="350.0" width="400.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">вийшов із циклу й повернувся —</tspan><tspan x="840.0" dy="14.3">rmmod звільнився за мілісекунди</tspan></text>
<text x="540.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">різниця в одному доданку умови — і в тому, чи вдасться колись вивантажити модуль</text>
</svg>