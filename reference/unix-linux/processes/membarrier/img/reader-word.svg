<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слово стану читача очима письменника</text>
<rect x="140.0" y="66.0" width="500.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><rect x="640.0" y="66.0" width="180.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="390.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">покоління — знімок gp</text><text x="730.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">глибина, 7 біт</text><text x="140.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">біт 63</text><text x="820.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">біт 0</text><text x="480.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">письменник підняв gp з 7 до 8 і зробив обидва виклики membarrier</text><rect x="22.0" y="186.0" width="296.0" height="240.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ctr = 7 | 0</text><text x="170.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">глибина нульова —</tspan><tspan x="170.0" dy="19.5">читач зараз не в секції</tspan></text><rect x="90.2" y="370.5" width="159.5" height="35.0" rx="6" fill="#e8f6ee" stroke="#1f8a4c" stroke-width="1.5"/><text x="170.0" y="393.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1f8a4c" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">можна звільняти</tspan></text><rect x="332.0" y="186.0" width="296.0" height="240.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ctr = 8 | 1</text><text x="480.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">покоління свіже: зайшов</tspan><tspan x="480.0" dy="19.5">після виклику, отже</tspan><tspan x="480.0" dy="19.5">читає вже нову таблицю</tspan></text><rect x="400.2" y="370.5" width="159.5" height="35.0" rx="6" fill="#e8f6ee" stroke="#1f8a4c" stroke-width="1.5"/><text x="480.0" y="393.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1f8a4c" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">можна звільняти</tspan></text><rect x="642.0" y="186.0" width="296.0" height="240.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="790.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ctr = 7 | 2</text><text x="790.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">старе покоління,</tspan><tspan x="790.0" dy="19.5">дві вкладені секції —</tspan><tspan x="790.0" dy="19.5">тримає стару таблицю</tspan></text><rect x="724.2" y="370.5" width="131.6" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="393.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">чекаємо далі</tspan></text>
</svg>