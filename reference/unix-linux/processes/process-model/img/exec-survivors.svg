<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заміна образу: що лишається, а що зникає</text>
<rect x="40.0" y="56.0" width="400.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="240.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Переживає заміну образу</tspan></text>
<rect x="500.0" y="56.0" width="400.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="700.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Замінюється новим образом</tspan></text>
<rect x="40.0" y="96.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">PID і TGID — номер лишається той самий</tspan></text><rect x="40.0" y="146.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">батько й місце в дереві процесів</tspan></text><rect x="40.0" y="196.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">поточний каталог і корінь</tspan></text><rect x="40.0" y="246.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">відкриті дескриптори без позначки CLOEXEC</tspan></text><rect x="40.0" y="296.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">простори імен і група обмежень (cgroup)</tspan></text><rect x="40.0" y="346.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="370.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">маска сигналів і черга нерозданих сигналів</tspan></text><rect x="40.0" y="396.0" width="400.0" height="42.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.4"/><text x="240.0" y="420.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">пріоритет (nice) та обмеження ресурсів</tspan></text>
<rect x="500.0" y="96.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">усе відображення пам'яті: код, дані, купа, стеки</tspan></text><rect x="500.0" y="146.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">усі регістри — виконання починається з точки входу</tspan></text><rect x="500.0" y="196.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">обробники сигналів: перехоплені стають типовими</tspan></text><rect x="500.0" y="246.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">решта потоків групи — лишається тільки той, хто викликав</tspan></text><rect x="500.0" y="296.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">дескриптори з позначкою CLOEXEC</tspan></text><rect x="500.0" y="346.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="370.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ідентичність — якщо у файлі стоїть біт setuid</tspan></text><rect x="500.0" y="396.0" width="400.0" height="42.0" rx="6" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="420.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">відображення файлів через mmap і замки пам'яті</tspan></text>
<text x="470.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">execve не створює процес: ідентичність лишається на місці, міняється лише вміст під нею</text>
</svg>