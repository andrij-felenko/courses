<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1090" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="545.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві форми clone і чому дитині потрібен власний стек</text>
<rect x="30.0" y="58.0" width="490.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="275.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">clone(fn, stack + SIZE, …) — форма з функцією</tspan></text>
<rect x="30.0" y="116.0" width="490.0" height="74.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="275.0" y="149.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">дитина стартує прямо у fn(arg),</tspan><tspan x="275.0" dy="15.6">а її %rsp — верхівка виділеної ділянки</tspan></text>
<line x1="275.0" y1="192.0" x2="275.0" y2="212.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="216.0" width="490.0" height="74.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="275.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">кадру батька в цьому стеку немає,</tspan><tspan x="275.0" dy="15.6">і він дитині не потрібен</tspan></text>
<line x1="275.0" y1="292.0" x2="275.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="316.0" width="490.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="275.0" y="349.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">fn повертає — обгортка glibc</tspan><tspan x="275.0" dy="15.6">робить системний виклик exit</tspan></text>
<line x1="275.0" y1="392.0" x2="275.0" y2="412.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570.0" y="58.0" width="490.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="815.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">syscall(SYS_clone, …) — сира форма</tspan></text>
<rect x="570.0" y="116.0" width="490.0" height="74.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="815.0" y="149.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">дитина прокидається на тому самому рядку C,</tspan><tspan x="815.0" dy="15.6">але %rsp уже вказує на порожню ділянку</tspan></text>
<line x1="815.0" y1="192.0" x2="815.0" y2="212.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570.0" y="216.0" width="490.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="815.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">локальні змінні компілятор читає зі стека —</tspan><tspan x="815.0" dy="15.6">там не нулі, там ніщо</tspan></text>
<line x1="815.0" y1="292.0" x2="815.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570.0" y="316.0" width="490.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="815.0" y="349.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">return з цієї функції зніме зі стека</tspan><tspan x="815.0" dy="15.6">випадкове число й стрибне за ним</tspan></text>
<line x1="815.0" y1="392.0" x2="815.0" y2="412.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="545.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">у сирій формі перше, що робить дитина, мусить бути виклик функції або exit — жодного повернення назад</text>
</svg>