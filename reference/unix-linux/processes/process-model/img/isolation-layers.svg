<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири шари ізоляції процесу</text>
<rect x="60.0" y="60.0" width="840.0" height="74.0" rx="10" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="80.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Пам'ять — апаратна стіна</text>
<text x="80.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">чужих сторінок немає в таблицях цього процесу;</tspan><tspan x="80.0" dy="13.8">доступ не забороняють — його просто нема куди зробити</tspan></text>
<rect x="60.0" y="148.0" width="840.0" height="74.0" rx="10" fill="#f5f0fb" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="80.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="start" font-weight="700">Права — перевірка на вході в ядро</text>
<text x="80.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">ядро звіряє ідентичність (uid, групи, можливості)</tspan><tspan x="80.0" dy="13.8">з кожним проханням; поламана перевірка = поламана стіна</tspan></text>
<rect x="60.0" y="236.0" width="840.0" height="74.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="80.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Простори імен — інша видимість</text>
<text x="80.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">ті самі об'єкти ядра, інший словник імен:</tspan><tspan x="80.0" dy="13.8">свої номери процесів, своє дерево монтувань, своя мережа</tspan></text>
<rect x="60.0" y="324.0" width="840.0" height="74.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="80.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">cgroups — рахунок і межа</text>
<text x="80.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">нічого не ховає: рахує спожите й обриває понад міру</tspan><tspan x="80.0" dy="13.8">(пам'ять, час процесора, ввід-вивід)</tspan></text>
<rect x="60.0" y="416.0" width="840.0" height="62.0" rx="10" fill="#eceff2" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="480.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільне ядро для всіх</text>
<text x="480.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один набір системних викликів, один планувальник, одні кеші процесора, один годинник</text>
<text x="480.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чотири шари роблять чотири різні речі; жоден з них не прибирає спільного ядра — тут і проходить межа з віртуальною машиною</text>
</svg>