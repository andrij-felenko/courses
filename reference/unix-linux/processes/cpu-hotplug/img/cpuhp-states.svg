<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один відрізок станів, двоє воріт і три різні світи</text>
<line x1="100.0" y1="118.0" x2="1280.0" y2="118.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="690.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">увімкнення: колбеки startup, зліва направо</text>
<text x="100.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CPUHP_OFFLINE</text>
<text x="520.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CPUHP_BRINGUP_CPU</text>
<text x="850.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CPUHP_AP_ONLINE</text>
<text x="1280.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CPUHP_ONLINE</text>
<rect x="100.0" y="184.0" width="420.0" height="76.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/>
<text x="310.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">PREPARE</text>
<rect x="540.0" y="184.0" width="290.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="685.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">STARTING</text>
<rect x="850.0" y="184.0" width="430.0" height="76.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/>
<text x="1065.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ONLINE</text>
<rect x="100.0" y="292.0" width="420.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">виконує чуже, керівне ядро процесора</tspan><tspan x="310.0" dy="16.2">це ядро процесора ще навіть не запущене</tspan><tspan x="310.0" dy="16.2">startup має право впасти — усе відкотять</tspan><tspan x="310.0" dy="16.2">тут виділяють пам'ять і структури</tspan></text>
<rect x="540.0" y="292.0" width="290.0" height="150.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="685.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">виконує саме це ядро процесора</tspan><tspan x="685.0" dy="13.7">переривання вимкнені, спати не можна</tspan><tspan x="685.0" dy="13.7">падати заборонено — відкочувати нікуди</tspan><tspan x="685.0" dy="13.7">тут заводять таймер і контролер переривань</tspan></text>
<rect x="850.0" y="292.0" width="430.0" height="150.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="1065.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">виконує потік cpuhp/N цього ядра</tspan><tspan x="1065.0" dy="16.2">витіснення й сон дозволені</tspan><tspan x="1065.0" dy="16.2">startup має право впасти</tspan><tspan x="1065.0" dy="16.2">тут прокидаються кеші, лічильники, служби</tspan></text>
<line x1="1280.0" y1="500.0" x2="100.0" y2="500.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="690.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вимикання: колбеки teardown, справа наліво</text>
<rect x="230.0" y="540.0" width="920.0" height="96.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="690.0" y="583.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">кожен стан — пара колбеків: що зробити на дорозі вгору</tspan><tspan x="690.0" dy="18.2">і що рівно те саме скасувати на дорозі вниз</tspan></text>
<text x="690.0" y="684.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">номер стану задає порядок; хто нічого не впорядковує, бере динамічний номер CPUHP_AP_ONLINE_DYN</text>
</svg>