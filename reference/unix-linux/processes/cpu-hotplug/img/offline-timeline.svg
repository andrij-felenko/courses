<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1490 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1490" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="740.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що діється між натиском на клавішу й порожнім місцем у списку</text>
<rect x="748.0" y="96.0" width="240.0" height="592.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="868.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="868.0" dy="0.0">stop_machine</tspan><tspan x="868.0" dy="18.2">усі ядра стоять</tspan></text>
<text x="30.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">керівне ядро процесора</text>
<rect x="290.0" y="165.0" width="215.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="397.5" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="397.5" dy="0.0">cpus_write_lock</tspan><tspan x="397.5" dy="15.6">маски завмерли</tspan></text>
<rect x="525.0" y="165.0" width="215.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="632.5" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="632.5" dy="0.0">геть із cpu_active_mask</tspan><tspan x="632.5" dy="15.6">будить потік cpuhp/N</tspan></text>
<rect x="760.0" y="165.0" width="215.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="867.5" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">запускає stop_machine</tspan></text>
<rect x="995.0" y="165.0" width="215.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1102.5" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1102.5" dy="0.0">чекає звіту</tspan><tspan x="1102.5" dy="15.6">«мене більше немає»</tspan></text>
<rect x="1230.0" y="165.0" width="215.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1337.5" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1337.5" dy="0.0">teardown PREPARE</tspan><tspan x="1337.5" dy="15.6">стан CPUHP_OFFLINE</tspan></text>
<text x="30.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ядро процесора, що гасне</text>
<rect x="525.0" y="330.0" width="215.0" height="150.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.8"/><text x="632.5" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="632.5" dy="0.0">teardown ONLINE-секції</tspan><tspan x="632.5" dy="15.6">в потоці cpuhp/N</tspan><tspan x="632.5" dy="15.6">паркує smpboot-потоки</tspan></text>
<rect x="760.0" y="330.0" width="215.0" height="150.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.8"/><text x="867.5" y="385.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">__cpu_disable()</tspan><tspan x="867.5" dy="15.6">геть із cpu_online_mask</tspan><tspan x="867.5" dy="15.6">переривання — на інші</tspan><tspan x="867.5" dy="15.6">teardown STARTING</tspan></text>
<rect x="995.0" y="330.0" width="215.0" height="150.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.8"/><text x="1102.5" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1102.5" dy="0.0">останні задачі й таймери</tspan><tspan x="1102.5" dy="15.6">переїжджають</tspan><tspan x="1102.5" dy="15.6">далі idle і play_dead</tspan></text>
<rect x="1230.0" y="330.0" width="215.0" height="150.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="1.8"/><text x="1337.5" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1337.5" dy="0.0">не виконує нічого</tspan></text>
<text x="30.0" y="602.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">решта ядер процесора</text>
<rect x="525.0" y="550.0" width="215.0" height="95.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="632.5" y="601.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="632.5" dy="0.0">працюють як звичайно</tspan></text>
<rect x="760.0" y="550.0" width="215.0" height="95.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="867.5" y="601.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="867.5" dy="0.0">завмерли всі до одного</tspan></text>
<rect x="995.0" y="550.0" width="215.0" height="95.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1102.5" y="593.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1102.5" dy="0.0">беруть на себе</tspan><tspan x="1102.5" dy="15.6">переривання й задачі</tspan></text>
<rect x="1230.0" y="550.0" width="215.0" height="95.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1337.5" y="601.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1337.5" dy="0.0">працюють як звичайно</tspan></text>
<text x="740.0" y="726.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">поки триває середня колонка, на машині не виконується жоден рядок жодної задачі</text>
<text x="740.0" y="756.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">саме тому вимикання ядра процесора — не безкоштовна дрібниця, а помітний провал у часі відгуку</text>
</svg>