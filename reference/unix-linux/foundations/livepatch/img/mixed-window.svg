<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перемикання посеред операції небезпечне: стара версія на стеку зустрічає нову</text>
<text x="630.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">одна задача, одна операція — і мить перемикання посередині</text>
<line x1="70.0" y1="300.0" x2="1190.0" y2="300.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="70.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">час →</text>
<line x1="630.0" y1="120.0" x2="630.0" y2="470.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="7,6"/>
<text x="630.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">тут задачу перемкнули на нову версію</text>
<rect x="120.0" y="170.0" width="400.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">увійшла у стару handle_request()</tspan><tspan x="320.0" dy="16.9">стара версія наприкінці</tspan><tspan x="320.0" dy="16.9">звільняє об'єкт</tspan></text>
<line x1="320.0" y1="268.0" x2="320.0" y2="294.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="170.0" width="440.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">викликала НОВУ use_thing()</tspan><tspan x="920.0" dy="16.9">нова версія теж</tspan><tspan x="920.0" dy="16.9">звільняє об'єкт</tspan></text>
<line x1="920.0" y1="268.0" x2="920.0" y2="294.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="350.0" width="440.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="392.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">повернення у стару handle_request(),</tspan><tspan x="920.0" dy="16.9">яка звільняє вдруге:</tspan><tspan x="920.0" dy="16.9">подвійне звільнення</tspan></text>
<line x1="920.0" y1="322.0" x2="920.0" y2="346.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="500.0" width="1080.0" height="96.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="630.0" y="552.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">причина одна: стара версія однієї з латаних функцій уже лежала на стеку задачі, коли зайшла нова версія іншої</tspan></text>
</svg>