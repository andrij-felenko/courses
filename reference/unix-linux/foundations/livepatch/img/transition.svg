<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід іде задача за задачею; кожна знімає свій прапорець у безпечну для себе мить</text>
<rect x="390.0" y="40.0" width="520.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="78.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">початок переходу:</tspan><tspan x="650.0" dy="18.2">прапорець «ще не перемкнена» — кожній задачі</tspan></text>
<rect x="50.0" y="210.0" width="380.0" height="140.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">задача спить</tspan><tspan x="240.0" dy="16.9">надійно розгорнути її стек;</tspan><tspan x="240.0" dy="16.9">жодної латаної функції</tspan><tspan x="240.0" dy="16.9">там немає → перемкнути</tspan></text>
<rect x="460.0" y="210.0" width="380.0" height="140.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">задача повертається</tspan><tspan x="650.0" dy="16.9">з системного виклику</tspan><tspan x="650.0" dy="16.9">чи обробника сигналу</tspan><tspan x="650.0" dy="16.9">стек ядра порожній → перемкнути</tspan></text>
<rect x="870.0" y="210.0" width="380.0" height="140.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1060.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">неробоча задача</tspan><tspan x="1060.0" dy="16.9">перемикається сама</tspan><tspan x="1060.0" dy="16.9">перед тим, як ядро процесора</tspan><tspan x="1060.0" dy="16.9">піде спати</tspan></text>
<line x1="560.0" y1="130.0" x2="240.0" y2="204.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="130.0" x2="650.0" y2="204.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="130.0" x2="1060.0" y2="204.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="430.0" width="640.0" height="86.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="468.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">прапорців не лишилося → перехід завершено,</tspan><tspan x="650.0" dy="18.2">всі задачі бачать один набір версій</tspan></text>
<line x1="240.0" y1="354.0" x2="480.0" y2="424.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="354.0" x2="650.0" y2="424.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1060.0" y1="354.0" x2="820.0" y2="424.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="570.0" width="1060.0" height="106.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="619.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">потік ядра, що спить усередині латаної функції, не перемикається жодним із трьох шляхів:</tspan><tspan x="650.0" dy="16.9">кожні 15 секунд йому шлють підробний сигнал, через 15 хвилин ядро пише його ім'я в журнал</tspan></text>
</svg>