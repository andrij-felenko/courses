<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий printf, два різні режими буфера</text>
<text x="230.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">вивід у термінал</text>
<text x="230.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">рядковий режим</text>
<rect x="60.0" y="120.0" width="340.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">printf(&quot;рядок\n&quot;)</tspan></text>
<line x1="230.0" y1="176.0" x2="230.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="206.0" width="340.0" height="66.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="230.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">буфер libc</tspan><tspan x="230.0" dy="16.9">(у пам'яті процесу)</tspan></text>
<line x1="230.0" y1="274.0" x2="230.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="304.0" width="340.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">write() — на кожному</tspan><tspan x="230.0" dy="16.9">символі нового рядка</tspan></text>
<line x1="230.0" y1="372.0" x2="230.0" y2="398.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="402.0" width="340.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">термінал</tspan></text>
<text x="670.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">вивід у канал або файл</text>
<text x="670.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">повний режим</text>
<rect x="500.0" y="120.0" width="340.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">printf(&quot;рядок\n&quot;)</tspan></text>
<line x1="670.0" y1="176.0" x2="670.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="206.0" width="340.0" height="66.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="670.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">буфер libc</tspan><tspan x="670.0" dy="16.9">(типово 4 КіБ)</tspan></text>
<line x1="670.0" y1="274.0" x2="670.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="304.0" width="340.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">write() — коли буфер повний</tspan><tspan x="670.0" dy="16.9">або коли викликали exit()</tspan></text>
<line x1="670.0" y1="372.0" x2="670.0" y2="398.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="402.0" width="340.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">канал / файл</tspan></text>
<rect x="60.0" y="478.0" width="780.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="510.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Поки текст у буфері, його ще ніхто не бачив: _exit() і аварія його втрачають, а fork() копіює разом з усією пам'яттю — і рядок виходить двічі.</tspan></text>
</svg>