<rect x="722.0" y="124.0" width="175.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="809.5" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="809.5" dy="0.0">GLIBC_2.2.5 … 2.17</tspan><tspan x="809.5" dy="16.9">… аж до GLIBC_2.28</tspan><tspan x="809.5" dy="16.9">і більше нічого</tspan></text>
<rect x="525.0" y="260.0" width="372.0" height="106.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="711.0" y="308.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">мітки GLIBC_2.34 тут немає</tspan><tspan x="711.0" dy="18.2">й не з'явиться — старт зривається</tspan></text>
<rect x="40.0" y="402.0" width="880.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="433.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Мітки версій лише додаються й ніколи не зникають — звідси однобічність.</tspan></text>
