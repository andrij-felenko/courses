<rect x="65.0" y="260.0" width="372.0" height="106.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="251.0" y="308.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="251.0" dy="0.0">усі три мітки в бібліотеці є</tspan><tspan x="251.0" dy="18.2">— програма стартує</tspan></text>
