<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід libc: одна бібліотека, два стандарти, кілька реалізацій</text>
<text x="30.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Unix</text>
<text x="30.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Стандарти</text>
<text x="30.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Реалізації</text>
<text x="30.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Альтернатива</text>
<rect x="180.0" y="90.0" width="290.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">1979 · Сьома редакція Unix</tspan><tspan x="325.0" dy="16.9">розділи 2 (виклики ядра)</tspan><tspan x="325.0" dy="16.9">і 3 (підпрограми) — одна libc,</tspan><tspan x="325.0" dy="16.9">яку компілятор бере сам</tspan></text>
<rect x="180.0" y="230.0" width="250.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1983 · ANSI збирає</tspan><tspan x="305.0" dy="16.9">комітет X3J11</tspan></text>
<rect x="470.0" y="230.0" width="250.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="595.0" y="272.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1988 · POSIX 1003.1</tspan><tspan x="595.0" dy="16.9">бере непереносну</tspan><tspan x="595.0" dy="16.9">половину бібліотеки</tspan></text>
<rect x="760.0" y="230.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="272.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">1989 · ANSI X3.159</tspan><tspan x="900.0" dy="16.9">переносна половина стає</tspan><tspan x="900.0" dy="16.9">частиною стандарту мови</tspan></text>
<rect x="180.0" y="370.0" width="250.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">1987 · Роланд Макґрат</tspan><tspan x="305.0" dy="16.9">починає GNU libc</tspan><tspan x="305.0" dy="16.9">у ФВПЗ</tspan></text>
<rect x="470.0" y="370.0" width="250.0" height="110.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1994 · «Linux libc» —</tspan><tspan x="595.0" dy="16.9">відгалуження від glibc 1.x</tspan><tspan x="595.0" dy="16.9">libc4 (a.out) → libc5 (ELF)</tspan></text>
<rect x="760.0" y="370.0" width="280.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">1997 · glibc 2.0 —</tspan><tspan x="900.0" dy="16.9">гілки сходяться;</tspan><tspan x="900.0" dy="16.9">soname libc.so.6</tspan></text>
<rect x="180.0" y="512.0" width="860.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="565.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2011 · musl (Річ Фелкер) — не відгалуження, а окремий код: ті самі функції стандарту, інші пріоритети — розмір, статичне лінкування, відсутність гонок</tspan></text>
