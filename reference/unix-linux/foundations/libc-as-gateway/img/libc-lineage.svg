<line x1="434.0" y1="425.0" x2="466.0" y2="425.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="724.0" y1="425.0" x2="756.0" y2="425.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>