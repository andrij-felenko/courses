<rect x="340.0" y="240.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">кладе аргументи в інші</tspan><tspan x="480.0" dy="16.9">регістри й б'є пасткою</tspan></text>
<rect x="720.0" y="240.0" width="200.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">рівно один</tspan></text>
<line x1="248.0" y1="295.0" x2="332.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="628.0" y1="295.0" x2="712.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
