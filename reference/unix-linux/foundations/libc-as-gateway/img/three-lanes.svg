<rect x="340.0" y="370.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">своя політика: буфер,</tspan><tspan x="480.0" dy="16.9">розподільник, порядок</tspan><tspan x="480.0" dy="16.9">джерел імен</tspan></text>
<rect x="720.0" y="370.0" width="200.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">нуль, один або</tspan><tspan x="820.0" dy="16.9">багато — і зовсім</tspan><tspan x="820.0" dy="16.9">інших на ім'я</tspan></text>
