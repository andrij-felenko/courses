<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Права root і рівень привілею — дві різні осі</text>
<rect x="40.0" y="62.0" width="270.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Хто виконується</tspan></text>
<rect x="330.0" y="62.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Рівень процесора</tspan></text>
<rect x="640.0" y="62.0" width="290.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Хто перевіряє його права</tspan></text>
<rect x="950.0" y="62.0" width="310.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1105.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1105.0" dy="0.0">Що може зробити напряму</tspan></text>
<rect x="40.0" y="132.0" width="270.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">звичайний процес</tspan><tspan x="175.0" dy="16.9">uid 1000</tspan></text>
<rect x="330.0" y="132.0" width="290.0" height="96.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">кільце 3</tspan></text>
<rect x="640.0" y="132.0" width="290.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">ядро — за uid і бітами прав</tspan></text>
<rect x="950.0" y="132.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1105.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">лише свою пам'ять;</tspan><tspan x="1105.0" dy="15.6">усе інше — через прохання</tspan></text>
<rect x="40.0" y="240.0" width="270.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">процес від root</tspan><tspan x="175.0" dy="16.9">uid 0</tspan></text>
<rect x="330.0" y="240.0" width="290.0" height="96.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="293.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">кільце 3</tspan></text>
<rect x="640.0" y="240.0" width="290.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">ядро — і майже ніколи</tspan><tspan x="785.0" dy="15.6">не відмовляє</tspan></text>
<rect x="950.0" y="240.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1105.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">теж лише свою пам'ять;</tspan><tspan x="1105.0" dy="15.6">усе інше — через прохання</tspan></text>
<rect x="40.0" y="348.0" width="270.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">код ядра</tspan></text>
<rect x="330.0" y="348.0" width="290.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">кільце 0</tspan></text>
<rect x="640.0" y="348.0" width="290.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">ніхто — перевіряти вже нікому</tspan></text>
<rect x="950.0" y="348.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1105.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">усе: таблиці сторінок,</tspan><tspan x="1105.0" dy="15.6">регістри пристроїв, чужу пам'ять</tspan></text>
<rect x="40.0" y="466.0" width="1220.0" height="92.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="499.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">root — не рівень процесора, а число, яке зберігає й перевіряє саме ядро.</tspan><tspan x="650.0" dy="16.9">Тому найвищі права в системі не дають жодної зайвої команди процесорові:</tspan><tspan x="650.0" dy="16.9">щоб опинитися в кільці 0, root мусить попросити ядро завантажити свій код усередину.</tspan></text>
</svg>