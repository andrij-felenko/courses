<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві половини системи й три двері між ними</text>
<rect x="40.0" y="66.0" width="1240.0" height="210.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="60.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ПРОСТІР КОРИСТУВАЧА · рівень 3</text>
<text x="60.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">у кожного свій адресний простір · нічого спільного, крім ядра</text>
<rect x="74.0" y="150.0" width="258.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="203.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="203.0" dy="0.0">оболонка</tspan><tspan x="203.0" dy="16.9">PID 2317</tspan><tspan x="203.0" dy="16.9">власні сторінки пам'яті</tspan></text>
<rect x="372.0" y="150.0" width="258.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="501.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="501.0" dy="0.0">вебсервер</tspan><tspan x="501.0" dy="16.9">PID 811</tspan><tspan x="501.0" dy="16.9">власні сторінки пам'яті</tspan></text>
<rect x="670.0" y="150.0" width="258.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="799.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="799.0" dy="0.0">редактор</tspan><tspan x="799.0" dy="16.9">PID 4402</tspan><tspan x="799.0" dy="16.9">власні сторінки пам'яті</tspan></text>
<rect x="968.0" y="150.0" width="258.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1097.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1097.0" dy="0.0">systemd</tspan><tspan x="1097.0" dy="16.9">PID 1</tspan><tspan x="1097.0" dy="16.9">власні сторінки пам'яті</tspan></text>
<rect x="40.0" y="430.0" width="1240.0" height="190.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="60.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">ЯДРО · рівень 0</text>
<text x="60.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">одне на всю машину · видиме з кожного адресного простору · без свого PID</text>
<rect x="74.0" y="536.0" width="220.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="184.0" y="567.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="184.0" dy="0.0">планувальник</tspan></text>
<rect x="320.0" y="536.0" width="220.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="567.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">таблиці сторінок</tspan></text>
<rect x="566.0" y="536.0" width="220.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="676.0" y="567.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="676.0" dy="0.0">файлові системи</tspan></text>
<rect x="812.0" y="536.0" width="220.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="922.0" y="567.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">мережевий стек</tspan></text>
<rect x="1058.0" y="536.0" width="220.0" height="54.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1168.0" y="567.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1168.0" dy="0.0">драйвери</tspan></text>
<line x1="110.0" y1="290.0" x2="110.0" y2="416.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="150.0" y="313.0" width="300.0" height="80.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">системний виклик</tspan><tspan x="300.0" dy="15.6">процес просить —</tspan><tspan x="300.0" dy="15.6">і сам чекає всередині ядра</tspan></text>
<line x1="520.0" y1="416.0" x2="520.0" y2="290.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="313.0" width="296.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="708.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="708.0" dy="0.0">повернення</tspan><tspan x="708.0" dy="15.6">рівень падає назад до 3,</tspan><tspan x="708.0" dy="15.6">процес біжить далі</tspan></text>
<rect x="1108.0" y="319.0" width="176.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1196.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1196.0" dy="0.0">пристрій</tspan><tspan x="1196.0" dy="15.6">мережева карта,</tspan><tspan x="1196.0" dy="15.6">диск, таймер</tspan></text>
<line x1="1196.0" y1="393.0" x2="1100.0" y2="450.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="908.0" y="313.0" width="176.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="996.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="996.0" dy="0.0">переривання</tspan><tspan x="996.0" dy="15.6">ядро прокидається</tspan><tspan x="996.0" dy="15.6">без чийогось прохання</tspan></text>
<rect x="40.0" y="646.0" width="1240.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="672.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">Ядро ніде не «крутиться» саме собою: воно або відпрацьовує чиєсь прохання, або відповідає на переривання — і в обох випадках повертає керування назад.</tspan></text>
</svg>