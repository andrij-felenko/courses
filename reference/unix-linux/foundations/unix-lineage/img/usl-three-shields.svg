<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 455" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="455" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три щити коду — і чим кожен із них уразливий</text>
<rect x="30.0" y="60.0" width="200.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">щит</tspan></text>
<rect x="250.0" y="60.0" width="250.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">що він захищає</tspan></text>
<rect x="520.0" y="60.0" width="250.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">від чого гине</tspan></text>
<rect x="790.0" y="60.0" width="280.0" height="46.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">що з ним сталося у справі</tspan></text>
<rect x="30.0" y="112.0" width="200.0" height="94.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Торгова марка</tspan><tspan x="130.0" dy="15.6">UNIX®</tspan></text>
<rect x="250.0" y="112.0" width="250.0" height="94.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">назву — не текст</tspan><tspan x="375.0" dy="15.6">і не ідею</tspan></text>
<rect x="520.0" y="112.0" width="250.0" height="94.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="147.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">недбалість власника;</tspan><tspan x="645.0" dy="15.6">перетворення на</tspan><tspan x="645.0" dy="15.6">загальну назву</tspan></text>
<rect x="790.0" y="112.0" width="280.0" height="94.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="147.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">BSDi прибрала з реклами</tspan><tspan x="930.0" dy="15.6">номер 1-800-ITS-UNIX —</tspan><tspan x="930.0" dy="15.6">і претензія майже зникла</tspan></text>
<rect x="30.0" y="212.0" width="200.0" height="94.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="255.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Комерційна</tspan><tspan x="130.0" dy="15.6">таємниця</tspan></text>
<rect x="250.0" y="212.0" width="250.0" height="94.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="255.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">зміст, поки він</tspan><tspan x="375.0" dy="15.6">справді таємний</tspan></text>
<rect x="520.0" y="212.0" width="250.0" height="94.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="255.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">будь-яке публічне</tspan><tspan x="645.0" dy="15.6">розкриття — і назавжди</tspan></text>
<rect x="790.0" y="212.0" width="280.0" height="94.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">код роздавали тисячам</tspan><tspan x="930.0" dy="15.6">університетів і друкували</tspan><tspan x="930.0" dy="15.6">в коментарі Лайонса</tspan></text>
<rect x="30.0" y="312.0" width="200.0" height="94.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="363.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Авторське право</tspan></text>
<rect x="250.0" y="312.0" width="250.0" height="94.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="375.0" y="355.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">конкретний текст —</tspan><tspan x="375.0" dy="15.6">не ідею й не інтерфейс</tspan></text>
<rect x="520.0" y="312.0" width="250.0" height="94.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="347.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">за законом 1976 року —</tspan><tspan x="645.0" dy="15.6">публікація без знака ©,</tspan><tspan x="645.0" dy="15.6">не виправлена за 5 років</tspan></text>
<rect x="790.0" y="312.0" width="280.0" height="94.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="347.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">32V роздали без ©,</tspan><tspan x="930.0" dy="15.6">зареєстрували аж 1992-го;</tspan><tspan x="930.0" dy="15.6">суд визнав шанси слабкими</tspan></text>
<text x="550.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">щити падають незалежно — тому питати треба не «чи ваше?», а «на якій підставі й що з нею сталося раніше?»</text>
</svg>