<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Про що питає умовна компіляція</text>
<rect x="30.0" y="52.0" width="410.0" height="44.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">вісь МАШИН: перелічуємо імена</tspan></text>
<rect x="500.0" y="52.0" width="410.0" height="44.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">вісь ВЛАСТИВОСТЕЙ: перелічуємо факти</tspan></text>
<rect x="30.0" y="112.0" width="410.0" height="124.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">#if   defined(__x86_64__)</tspan><tspan x="235.0" dy="15.6">#elif defined(__arm__)</tspan><tspan x="235.0" dy="15.6">#elif defined(__sparc__)</tspan><tspan x="235.0" dy="15.6">#else</tspan><tspan x="235.0" dy="15.6">#  error «невідома машина»</tspan></text>
<rect x="500.0" y="112.0" width="410.0" height="124.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="705.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">#if SIZEOF_LONG == 8</tspan><tspan x="705.0" dy="15.6">#if WORDS_BIGENDIAN</tspan><tspan x="705.0" dy="15.6">#if HAVE_UNALIGNED_LOAD</tspan><tspan x="705.0" dy="15.6">значення вимірює ./configure</tspan><tspan x="705.0" dy="15.6">на тій самій машині, де збирає</tspan></text>
<line x1="235.0" y1="244.0" x2="235.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="705.0" y1="244.0" x2="705.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="282.0" width="410.0" height="92.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="315.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Список імен скінченний.</tspan><tspan x="235.0" dy="16.9">Машина, якої автор не знав, або впаде</tspan><tspan x="235.0" dy="16.9">на #error, або тихо піде не в ту гілку.</tspan></text>
<rect x="500.0" y="282.0" width="410.0" height="92.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="315.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Список питань скінченний, відповіді — ні.</tspan><tspan x="705.0" dy="16.9">Машина, якої автор не знав,</tspan><tspan x="705.0" dy="16.9">відповідає на ті самі питання сама.</tspan></text>
<text x="470.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Обряд ./configure — це і є друга вісь: десятки крихітних програм, які питають систему про неї саму</text>
</svg>