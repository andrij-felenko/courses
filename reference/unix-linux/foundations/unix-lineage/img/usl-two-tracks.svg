<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1020 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1020" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поки BSD стояла в суді, код виходив далі</text>
<rect x="222.0" y="50.0" width="390.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="71.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="417.0" dy="0.0">правова доріжка</tspan></text>
<rect x="634.0" y="50.0" width="346.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="71.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="807.0" dy="0.0">код, що виходив</tspan></text>
<rect x="30.0" y="96.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">червень 1991</tspan></text>
<rect x="222.0" y="96.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">—</tspan></text>
<rect x="634.0" y="96.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">Net/2: майже повна система</tspan><tspan x="807.0" dy="15.6">без коду AT&amp;T, ~18 000 файлів</tspan></text>
<rect x="30.0" y="184.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">січень 1992</tspan></text>
<rect x="222.0" y="184.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">лист USL: приберіть із реклами</tspan><tspan x="417.0" dy="15.6">номер 1-800-ITS-UNIX</tspan></text>
<rect x="634.0" y="184.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">BSDi продає BSD/386</tspan><tspan x="807.0" dy="15.6">з вихідними текстами за $995</tspan></text>
<rect x="30.0" y="272.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">квітень 1992</tspan></text>
<rect x="222.0" y="272.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">позов USL проти BSDi; другим</tspan><tspan x="417.0" dy="15.6">відповідачем додано</tspan><tspan x="417.0" dy="15.6">Каліфорнійський університет</tspan></text>
<rect x="634.0" y="272.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">386BSD 0.1 (липень)</tspan></text>
<rect x="30.0" y="360.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">кінець 1992</tspan></text>
<rect x="222.0" y="360.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">суддя Дебевойз відмовляє в забороні</tspan><tspan x="417.0" dy="15.6">й лишає два пункти позову</tspan><tspan x="417.0" dy="15.6">з чотирьох</tspan></text>
<rect x="634.0" y="360.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">Linux уже під GPL,</tspan><tspan x="807.0" dy="15.6">версія 0.99</tspan></text>
<rect x="30.0" y="448.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="490.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">1993</tspan></text>
<rect x="222.0" y="448.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">університет подає зустрічний позов;</tspan><tspan x="417.0" dy="15.6">14 червня Novell завершує</tspan><tspan x="417.0" dy="15.6">купівлю USL</tspan></text>
<rect x="634.0" y="448.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="482.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">NetBSD 0.8 (квітень),</tspan><tspan x="807.0" dy="15.6">FreeBSD 1.0 (кінець року)</tspan></text>
<rect x="30.0" y="536.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="578.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">4 лютого 1994</tspan></text>
<rect x="222.0" y="536.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">мирова угода; більшість умов —</tspan><tspan x="417.0" dy="15.6">конфіденційні (розкриті аж 2004-го)</tspan></text>
<rect x="634.0" y="536.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="578.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">Linux 1.0 (березень)</tspan></text>
<rect x="30.0" y="624.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="666.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">червень 1994</tspan></text>
<rect x="222.0" y="624.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="658.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">3 файли вилучено,</tspan><tspan x="417.0" dy="15.6">~70 — зі знаком © USL</tspan></text>
<rect x="634.0" y="624.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="666.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">4.4BSD-Lite</tspan></text>
<rect x="30.0" y="712.0" width="170.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="754.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">кінець 1994</tspan></text>
<rect x="222.0" y="712.0" width="390.0" height="76.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="417.0" y="754.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">правова невизначеність знята</tspan></text>
<rect x="634.0" y="712.0" width="346.0" height="76.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="738.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">NetBSD 1.0 (жовтень)</tspan><tspan x="807.0" dy="15.6">і FreeBSD 2.0 (листопад) —</tspan><tspan x="807.0" dy="15.6">перезасновані на 4.4BSD-Lite</tspan></text>
<text x="505.0" y="808.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">двадцять два місяці правової невизначеності — і жодної паузи на сусідній доріжці</text>
</svg>