<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Копія в буфері проти сегмента, який і є файлом</text>
<rect x="34.0" y="48.0" width="440.0" height="42.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="254.0" dy="0.0">Явне введення-виведення: два світи</tspan></text>
<rect x="526.0" y="48.0" width="440.0" height="42.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="746.0" dy="0.0">Однорівневе сховище: один світ</tspan></text>
<rect x="34.0" y="106.0" width="440.0" height="62.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">файл лежить на диску,</tspan><tspan x="254.0" dy="16.9">пам'ять процесу — окремо</tspan></text>
<rect x="526.0" y="106.0" width="440.0" height="62.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">сегмент — це і запис у каталозі,</tspan><tspan x="746.0" dy="16.9">і ділянка адресного простору</tspan></text>
<line x1="254.0" y1="168.0" x2="254.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746.0" y1="168.0" x2="746.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34.0" y="188.0" width="440.0" height="62.0" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">open(): процес дістає дескриптор,</tspan><tspan x="254.0" dy="16.9">але ще жодного байта</tspan></text>
<rect x="526.0" y="188.0" width="440.0" height="62.0" rx="6" fill="#f2f7f2" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">процес дістає сегментові номер</tspan><tspan x="746.0" dy="16.9">у власній таблиці дескрипторів</tspan></text>
<line x1="254.0" y1="250.0" x2="254.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746.0" y1="250.0" x2="746.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34.0" y="270.0" width="440.0" height="62.0" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">read(): ядро КОПІЮЄ n байтів</tspan><tspan x="254.0" dy="16.9">з диска в буфер процесу</tspan></text>
<rect x="526.0" y="270.0" width="440.0" height="62.0" rx="6" fill="#f2f7f2" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="297.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">звичайне звернення до слова;</tspan><tspan x="746.0" dy="16.9">немає сторінки — апарат підкачує</tspan></text>
<line x1="254.0" y1="332.0" x2="254.0" y2="352.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746.0" y1="332.0" x2="746.0" y2="352.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="34.0" y="352.0" width="440.0" height="62.0" rx="6" fill="#f7f7f8" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">правки йдуть у копію; щоб вони</tspan><tspan x="254.0" dy="16.9">стали файлом, потрібен write()</tspan></text>
<rect x="526.0" y="352.0" width="440.0" height="62.0" rx="6" fill="#f2f7f2" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">змінена сторінка сама йде</tspan><tspan x="746.0" dy="16.9">на диск: копії не було ніколи</tspan></text>
<rect x="34.0" y="424.0" width="932.0" height="54.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ціна елегантності праворуч: зміщення в адресі — 18 бітів, тобто сегмент не більший за 256 тисяч слів (≈1.1 МіБ).</tspan><tspan x="500.0" dy="16.9">Файл, що переріс сегмент, перестає бути сегментом: його доводиться складати з кількох (multisegment file).</tspan></text>
</svg>