<rect x="680.0" y="52.0" width="300.0" height="36.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="74.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">чим кінчається write</tspan></text>
