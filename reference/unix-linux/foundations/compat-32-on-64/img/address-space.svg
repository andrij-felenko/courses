<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки простору бачить 32-бітна програма</text>
<rect x="60.0" y="62.0" width="300.0" height="42.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">32-бітне ядро</tspan></text><rect x="60.0" y="116.0" width="300.0" height="81.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="210.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ядро — 1 ГіБ</tspan></text><rect x="60.0" y="201.0" width="300.0" height="251.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="210.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">програма —</tspan><tspan x="210.0" dy="16.9">3 ГіБ</tspan></text><rect x="60.0" y="476.0" width="300.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="500.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">ядро мусить уміститися</tspan><tspan x="210.0" dy="16.9">в ті самі 4 ГіБ</tspan></text>
<rect x="580.0" y="62.0" width="300.0" height="42.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">64-бітне ядро</tspan></text><rect x="580.0" y="116.0" width="300.0" height="336.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="730.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">програма —</tspan><tspan x="730.0" dy="16.9">майже 4 ГіБ</tspan></text><rect x="580.0" y="476.0" width="300.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="500.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">ядро живе у власному</tspan><tspan x="730.0" dy="16.9">64-бітному діапазоні</tspan></text>
<line x1="460.0" y1="116.0" x2="460.0" y2="456.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="460.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">4 ГіБ</text>
<text x="460.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="60.0" y="536.0" width="820.0" height="40.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="470.0" y="560.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">та сама програма, той самий процесор — а доступної пам'яті майже на гігабайт більше</tspan></text>
</svg>