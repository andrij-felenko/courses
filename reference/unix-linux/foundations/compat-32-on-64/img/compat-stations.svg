<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три станції перекладу на межі системного виклику</text>
<rect x="50.0" y="54.0" width="280.0" height="36.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">з боку 32-бітної програми</tspan></text>
<rect x="390.0" y="54.0" width="300.0" height="36.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">станція перекладу</tspan></text>
<rect x="730.0" y="54.0" width="260.0" height="36.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">у бік коду ядра</tspan></text>
<rect x="50.0" y="104.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">вхід int 0x80,</tspan><tspan x="190.0" dy="15.6">sysenter або syscall;</tspan><tspan x="190.0" dy="15.6">номер 4 = write</tspan></text>
<rect x="390.0" y="104.0" width="300.0" height="96.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/><text x="540.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">вибір таблиці</tspan><tspan x="540.0" dy="15.6">за точкою входу</tspan></text>
<rect x="730.0" y="104.0" width="260.0" height="96.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">номер 1 = write</tspan><tspan x="860.0" dy="15.6">у рідній таблиці</tspan></text>
<line x1="334.0" y1="152.0" x2="386.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="694.0" y1="152.0" x2="726.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="222.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">EBX, ECX, EDX,</tspan><tspan x="190.0" dy="15.6">ESI, EDI, EBP;</tspan><tspan x="190.0" dy="15.6">старші половини — сміття</tspan></text>
<rect x="390.0" y="222.0" width="300.0" height="96.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/><text x="540.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">звуження до 32 бітів</tspan><tspan x="540.0" dy="15.6">і свідоме доповнення:</tspan><tspan x="540.0" dy="15.6">нулями або знаком</tspan></text>
<rect x="730.0" y="222.0" width="260.0" height="96.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">чисті значення</tspan><tspan x="860.0" dy="15.6">у RDI, RSI, RDX…</tspan></text>
<line x1="334.0" y1="270.0" x2="386.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="694.0" y1="270.0" x2="726.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="340.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">struct compat_stat,</tspan><tspan x="190.0" dy="15.6">old_timespec32,</tspan><tspan x="190.0" dy="15.6">масив 4-байтових адрес</tspan></text>
<rect x="390.0" y="340.0" width="300.0" height="96.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/><text x="540.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">перебудова полів</tspan><tspan x="540.0" dy="15.6">за рідними зсувами;</tspan><tspan x="540.0" dy="15.6">compat_ptr() для адрес</tspan></text>
<rect x="730.0" y="340.0" width="260.0" height="96.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">struct stat,</tspan><tspan x="860.0" dy="15.6">struct timespec,</tspan><tspan x="860.0" dy="15.6">звичайні покажчики</tspan></text>
<line x1="334.0" y1="388.0" x2="386.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="694.0" y1="388.0" x2="726.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="100.0" x2="360.0" y2="442.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7 6"/>
<line x1="712.0" y1="100.0" x2="712.0" y2="442.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="7 6"/>
<rect x="50.0" y="472.0" width="940.0" height="56.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="520.0" y="495.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">глибше цієї смуги ядро працює лише з рідними типами —</tspan><tspan x="520.0" dy="18.2">жодна функція нижче не питає, якої розрядности була програма</tspan></text>
<text x="520.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">ліва штрихова лінія — межа привілею, права — межа перекладу</text>
</svg>