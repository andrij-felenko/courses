<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">У що розгортається COMPAT_SYSCALL_DEFINE3</text>
<rect x="56.0" y="60.0" width="590.0" height="78.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="2.0"/><text x="351.0" y="85.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="351.0" dy="0.0">COMPAT_SYSCALL_DEFINE3(ioctl,</tspan><tspan x="351.0" dy="18.2">        unsigned int, fd, unsigned int, cmd,</tspan><tspan x="351.0" dy="18.2">        compat_ulong_t, arg)</tspan></text>
<rect x="692.0" y="60.0" width="372.0" height="78.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="878.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="878.0" dy="0.0">один рядок, який пише автор</tspan><tspan x="878.0" dy="16.9">виклику; далі все робить</tspan><tspan x="878.0" dy="16.9">препроцесор</tspan></text>
<line x1="351.0" y1="140.0" x2="351.0" y2="164.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="168.0" width="590.0" height="88.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="351.0" y="199.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="351.0" dy="0.0">asmlinkage long compat_sys_ioctl(</tspan><tspan x="351.0" dy="16.9">        unsigned int fd, unsigned int cmd,</tspan><tspan x="351.0" dy="16.9">        compat_ulong_t arg);</tspan></text>
<rect x="692.0" y="168.0" width="372.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="878.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="878.0" dy="0.0">ім'я, яке стоїть у 32-бітній</tspan><tspan x="878.0" dy="16.9">таблиці викликів;</tspan><tspan x="878.0" dy="16.9">власного тіла не має —</tspan><tspan x="878.0" dy="16.9">це псевдонім (alias)</tspan></text>
<line x1="351.0" y1="258.0" x2="351.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="300.0" width="590.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/><text x="351.0" y="337.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="351.0" dy="0.0">asmlinkage long __se_compat_sys_ioctl(</tspan><tspan x="351.0" dy="16.9">        long fd, long cmd, long arg)</tspan><tspan x="351.0" dy="16.9">{ ... __SC_DELOUSE на кожному аргументі ... }</tspan></text>
<rect x="692.0" y="300.0" width="372.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="878.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="878.0" dy="0.0">ЄДИНЕ місце звуження:</tspan><tspan x="878.0" dy="16.9">усе прийшло як long,</tspan><tspan x="878.0" dy="16.9">звідси виходить уже чистим;</tspan><tspan x="878.0" dy="16.9">на s390 саме тут гасять</tspan><tspan x="878.0" dy="16.9">старший біт покажчиків</tspan></text>
<line x1="351.0" y1="402.0" x2="351.0" y2="440.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="444.0" width="590.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="351.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="351.0" dy="0.0">static inline long __do_compat_sys_ioctl(</tspan><tspan x="351.0" dy="16.9">        unsigned int fd, unsigned int cmd,</tspan><tspan x="351.0" dy="16.9">        compat_ulong_t arg)</tspan></text>
<rect x="692.0" y="444.0" width="372.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="878.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="878.0" dy="0.0">тіло, яке пишете ви:</tspan><tspan x="878.0" dy="16.9">типи вже оголошені,</tspan><tspan x="878.0" dy="16.9">значення вже перевірені</tspan></text>
<rect x="56.0" y="566.0" width="1008.0" height="60.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="591.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">три імені на один макрос — і жодного розгалуження «а якщо 32 біти»</tspan><tspan x="560.0" dy="18.2">нижче за __se_-обгортку</tspan></text>
</svg>