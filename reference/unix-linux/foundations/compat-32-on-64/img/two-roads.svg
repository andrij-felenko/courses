<rect x="668.0" y="112.0" width="212.0" height="106.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="774.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="774.0" dy="0.0">2006</tspan><tspan x="774.0" dy="16.9">Montecito: апаратний</tspan><tspan x="774.0" dy="16.9">x86-вузол прибрано</tspan><tspan x="774.0" dy="16.9">з кристала зовсім</tspan></text>
