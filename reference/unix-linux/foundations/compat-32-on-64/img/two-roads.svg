<rect x="28.0" y="392.0" width="1124.0" height="52.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="2.0"/><text x="590.0" y="423.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ціна сумісности не зникла в переможця — її перенесли з кремнію в ядро операційної системи</tspan></text>
