<rect x="208.0" y="112.0" width="212.0" height="106.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="314.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="314.0" dy="0.0">червень 2001</tspan><tspan x="314.0" dy="16.9">Itanium (Merced):</tspan><tspan x="314.0" dy="16.9">старий x86-код бере</tspan><tspan x="314.0" dy="16.9">окремий вузол — повільно</tspan></text>
