<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 546" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="546" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стани макроса опції і що з ними робити</text>
<rect x="330.0" y="52.0" width="440.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="550.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">макрос опції в unistd.h</tspan><tspan x="550.0" dy="19.5">наприклад _POSIX_SPAWN</tspan></text>
<line x1="550.0" y1="112.0" x2="157.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="37.0" y="152.0" width="240.0" height="50.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="2.0"/><text x="157.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.0" dy="0.0">не визначено</tspan></text>
<line x1="157.0" y1="204.0" x2="157.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="37.0" y="234.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="157.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="157.0" dy="0.0">опції немає</tspan><tspan x="157.0" dy="16.9">ні на компіляції,</tspan><tspan x="157.0" dy="16.9">ні на виконанні</tspan></text>
<line x1="157.0" y1="318.0" x2="157.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="37.0" y="348.0" width="240.0" height="106.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="1.5"/><text x="157.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="157.0" dy="0.0">писати обхід</tspan><tspan x="157.0" dy="16.9">або відмовитись</tspan></text>
<line x1="550.0" y1="112.0" x2="419.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="299.0" y="152.0" width="240.0" height="50.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="2.0"/><text x="419.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="419.0" dy="0.0">= -1</tspan></text>
<line x1="419.0" y1="204.0" x2="419.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="299.0" y="234.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="419.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="419.0" dy="0.0">те саме, тільки</tspan><tspan x="419.0" dy="16.9">сказано прямо</tspan></text>
<line x1="419.0" y1="318.0" x2="419.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="299.0" y="348.0" width="240.0" height="106.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="1.5"/><text x="419.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="419.0" dy="0.0">писати обхід</tspan><tspan x="419.0" dy="16.9">або відмовитись</tspan></text>
<line x1="550.0" y1="112.0" x2="681.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="561.0" y="152.0" width="240.0" height="50.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.0"/><text x="681.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="681.0" dy="0.0">= 0</tspan></text>
<line x1="681.0" y1="204.0" x2="681.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="561.0" y="234.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="681.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">на компіляції</tspan><tspan x="681.0" dy="16.9">невідомо: залежить</tspan><tspan x="681.0" dy="16.9">від машини запуску</tspan></text>
<line x1="681.0" y1="318.0" x2="681.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="561.0" y="348.0" width="240.0" height="106.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="681.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">спитати на виконанні:</tspan><tspan x="681.0" dy="16.9">sysconf(_SC_SPAWN)</tspan><tspan x="681.0" dy="16.9">&gt; 0 — опція є</tspan><tspan x="681.0" dy="16.9">-1 — опції немає</tspan></text>
<line x1="550.0" y1="112.0" x2="943.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="823.0" y="152.0" width="240.0" height="50.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="943.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="943.0" dy="0.0">&gt; 0   (202405L)</tspan></text>
<line x1="943.0" y1="204.0" x2="943.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="823.0" y="234.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="943.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="943.0" dy="0.0">опція є завжди;</tspan><tspan x="943.0" dy="16.9">число називає</tspan><tspan x="943.0" dy="16.9">редакцію стандарту</tspan></text>
<line x1="943.0" y1="318.0" x2="943.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="823.0" y="348.0" width="240.0" height="106.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="943.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="943.0" dy="0.0">вживати прямо,</tspan><tspan x="943.0" dy="16.9">питати не треба</tspan></text>
<rect x="37.0" y="480.0" width="1026.0" height="44.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="550.0" y="507.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">нуль — єдиний стан, у якому sysconf обов'язковий; в усіх інших він просто підтверджує</tspan></text>
</svg>