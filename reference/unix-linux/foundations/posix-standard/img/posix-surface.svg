<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що POSIX описує, а що лишає системі</text>
<rect x="50.0" y="66.0" width="520.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="310.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Застосунок</tspan><tspan x="310.0" dy="18.2">вживає лише те, що дозволено контрактом</tspan></text>
<rect x="610.0" y="77.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">інший бік контракту</tspan></text>
<rect x="50.0" y="146.0" width="520.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="310.0" y="172.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Оболонка й утиліти</tspan><tspan x="310.0" dy="18.2">мова sh, sed, awk, find, sort</tspan></text>
<rect x="610.0" y="157.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">описано в POSIX</tspan></text>
<rect x="50.0" y="226.0" width="520.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="310.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Бібліотека C</tspan><tspan x="310.0" dy="18.2">open(), fork(), pthread_create()</tspan></text>
<rect x="610.0" y="237.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">описано в POSIX</tspan></text>
<rect x="50.0" y="306.0" width="520.0" height="62.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="332.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Системний виклик</tspan><tspan x="310.0" dy="18.2">номери, регістри, формат ELF</tspan></text>
<rect x="610.0" y="317.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">поза стандартом</tspan></text>
<rect x="50.0" y="386.0" width="520.0" height="62.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="412.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Ядро</tspan><tspan x="310.0" dy="18.2">планувальник, VFS, драйвери</tspan></text>
<rect x="610.0" y="397.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="421.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">поза стандартом</tspan></text>
<rect x="50.0" y="466.0" width="520.0" height="62.0" rx="6" fill="#f2f2f4" stroke="#6b7280" stroke-width="1.8"/><text x="310.0" y="492.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Залізо</tspan><tspan x="310.0" dy="18.2">архітектура процесора, шини</tspan></text>
<rect x="610.0" y="477.0" width="290.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="501.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">поза стандартом</tspan></text>
<rect x="50.0" y="554.0" width="850.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="475.0" y="577.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Контракт живе на рівні вихідного коду:</tspan><tspan x="475.0" dy="19.5">перекомпілювати — так, перенести двійковий файл — ні</tspan></text>
</svg>