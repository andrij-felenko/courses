<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три претенденти на роль єдиного опису Unix</text>
<rect x="30.0" y="54.0" width="320.0" height="66.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">SVID · 1985</tspan><tspan x="190.0" dy="19.5">AT&amp;T</tspan></text>
<rect x="30.0" y="138.0" width="320.0" height="208.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="48.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="48.0" dy="0.0">Що це: опис поведінки</tspan><tspan x="48.0" dy="20.2">System V плюс набір</tspan><tspan x="48.0" dy="20.2">перевірок SVVS</tspan><tspan x="48.0" dy="20.2"></tspan><tspan x="48.0" dy="20.2">Питання, на яке відповідає:</tspan><tspan x="48.0" dy="20.2">«чий Unix справжній?»</tspan><tspan x="48.0" dy="20.2"></tspan><tspan x="48.0" dy="20.2">Сила: ліцензія на код</tspan></text>
<rect x="30.0" y="362.0" width="320.0" height="70.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Належить одному учаснику ринку —</tspan><tspan x="190.0" dy="16.9">решта не може на нього спертися</tspan></text>
<rect x="390.0" y="54.0" width="320.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="550.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">/usr/group 1984 →</tspan><tspan x="550.0" dy="19.5">IEEE 1003 з 1985</tspan></text>
<rect x="390.0" y="138.0" width="320.0" height="208.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="408.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="408.0" dy="0.0">Що це: перетин того,</tspan><tspan x="408.0" dy="20.2">що фактично є в усіх</tspan><tspan x="408.0" dy="20.2">системах одразу</tspan><tspan x="408.0" dy="20.2"></tspan><tspan x="408.0" dy="20.2">Питання:</tspan><tspan x="408.0" dy="20.2">«що я маю право</tspan><tspan x="408.0" dy="20.2">викликати з програми?»</tspan><tspan x="408.0" dy="20.2"></tspan><tspan x="408.0" dy="20.2">Сила: акредитований орган</tspan></text>
<rect x="390.0" y="362.0" width="320.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Нейтральний, але сам нічого</tspan><tspan x="550.0" dy="16.9">не сертифікує й марки не має</tspan></text>
<rect x="750.0" y="54.0" width="320.0" height="66.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/><text x="910.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">X/Open XPG</tspan><tspan x="910.0" dy="19.5">консорціум із 1984</tspan></text>
<rect x="750.0" y="138.0" width="320.0" height="208.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="768.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="768.0" dy="0.0">Що це: посібник</tspan><tspan x="768.0" dy="20.2">із переносності мовою</tspan><tspan x="768.0" dy="20.2">тендерних вимог</tspan><tspan x="768.0" dy="20.2"></tspan><tspan x="768.0" dy="20.2">Питання:</tspan><tspan x="768.0" dy="20.2">«що я маю право</tspan><tspan x="768.0" dy="20.2">вимагати в договорі?»</tspan><tspan x="768.0" dy="20.2"></tspan><tspan x="768.0" dy="20.2">Сила: гаманець покупця</tspan></text>
<rect x="750.0" y="362.0" width="320.0" height="70.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.5"/><text x="910.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Ширший за POSIX — і саме він</tspan><tspan x="910.0" dy="16.9">згодом видаватиме марку UNIX</tspan></text>
<rect x="30.0" y="458.0" width="1040.0" height="46.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="550.0" y="486.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Переміг не найкращий текст, а той, що не належав жодному з тих, хто воював</tspan></text>
</svg>