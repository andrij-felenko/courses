<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три класи несумісності й коли кожен дається взнаки</text>
<rect x="45.0" y="58.0" width="360.0" height="54.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="225.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">1. Синтаксис</tspan><tspan x="225.0" dy="20.8">шел узагалі не розбере</tspan></text>
<rect x="45.0" y="126.0" width="360.0" height="224.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="63.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="63.0" dy="0.0">[[ -n $x ]] — подвійні дужки</tspan><tspan x="63.0" dy="21.1">files=(a b c) — масив</tspan><tspan x="63.0" dy="21.1">cmd &lt;&lt;&lt; &quot;$s&quot; — рядок-документ</tspan><tspan x="63.0" dy="21.1">function f { … } — ключове слово</tspan><tspan x="63.0" dy="21.1">$'\t' — на sh, старших за 2024</tspan></text>
<rect x="45.0" y="364.0" width="360.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">dash -n script.sh</tspan><tspan x="225.0" dy="16.9">розбір без запуску, миттєво</tspan></text>
<rect x="430.0" y="58.0" width="360.0" height="54.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.0"/><text x="610.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">2. Поведінка</tspan><tspan x="610.0" dy="20.8">розібрав, робить інше</tspan></text>
<rect x="430.0" y="126.0" width="360.0" height="224.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="448.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="448.0" dy="0.0">echo -n і echo &quot;$x&quot; з \t усередині</tspan><tspan x="448.0" dy="21.1">local у функції</tspan><tspan x="448.0" dy="21.1">. config.sh — шукає ще й у PATH</tspan><tspan x="448.0" dy="21.1">[ $x = y ] без лапок</tspan><tspan x="448.0" dy="21.1">set -e мовчить у конвеєрі</tspan></text>
<rect x="430.0" y="364.0" width="360.0" height="76.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">запуск під dash і busybox sh</tspan><tspan x="610.0" dy="16.9">плюс shellcheck -s sh і set -eu</tspan></text>
<rect x="815.0" y="58.0" width="360.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="995.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="995.0" dy="0.0">3. Утиліти й оточення</tspan><tspan x="995.0" dy="20.8">видно лише на чужій машині</tspan></text>
<rect x="815.0" y="126.0" width="360.0" height="224.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="833.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="833.0" dy="0.0">sed -i, grep -P, readlink -f</tspan><tspan x="833.0" dy="21.1">head -c: немає до Issue 8</tspan><tspan x="833.0" dy="21.1">sort і comm під LC_COLLATE</tspan><tspan x="833.0" dy="21.1">[a-z] поза локаллю C</tspan><tspan x="833.0" dy="21.1">awk: кома замість крапки</tspan></text>
<rect x="815.0" y="364.0" width="360.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="995.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">PATH=$(command -p getconf PATH)</tspan><tspan x="995.0" dy="16.9">LC_ALL=C і справжній цільовий образ</tspan></text>
<text x="45.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">коли б'є</text>
<line x1="45.0" y1="484.0" x2="1175.0" y2="484.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="225.0" y1="476.0" x2="225.0" y2="492.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="225.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">розбір скрипта</text>
<line x1="610.0" y1="476.0" x2="610.0" y2="492.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="610.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перший запуск</text>
<line x1="995.0" y1="476.0" x2="995.0" y2="492.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="995.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">чужа машина, за тиждень</text>
<rect x="45.0" y="534.0" width="1130.0" height="46.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="610.0" y="562.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">перші два класи вичерпуються вдома; третій — це вже не про шел, а про те, що навколо нього</tspan></text>
</svg>