<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1400" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що зробили з дверима, які не можна ні лишити, ні прибрати</text>
<rect x="50.0" y="90.0" width="330.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="215.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Статичний файл 2009 року</text>
<text x="215.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у машинному коді стоїть</text>
<text x="215.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">call 0xffffffffff600400</text>
<text x="215.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перезібрати його ніхто</text>
<text x="215.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">не буде — джерел немає</text>
<rect x="470.0" y="70.0" width="420.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="680.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сторінка за сталою адресою</text>
<text x="680.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">позначена «виконувати не можна»</text>
<rect x="494.0" y="146.0" width="372.0" height="50.0" rx="6" fill="#fff5e0" stroke="#6b7280" stroke-width="1.4"/>
<text x="514.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">…ff600000</text>
<text x="846.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">gettimeofday</text>
<rect x="494.0" y="208.0" width="372.0" height="50.0" rx="6" fill="#fff5e0" stroke="#6b7280" stroke-width="1.4"/>
<text x="514.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">…ff600400</text>
<text x="846.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">time</text>
<rect x="494.0" y="270.0" width="372.0" height="50.0" rx="6" fill="#fff5e0" stroke="#6b7280" stroke-width="1.4"/>
<text x="514.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">…ff600800</text>
<text x="846.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">getcpu</text>
<text x="680.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">між входами — добивка байтами 0xcc</text>
<rect x="980.0" y="70.0" width="370.0" height="320.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="1165.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро, обробник збою</text>
<text x="1004.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">1 · це вибірка інструкції?</text>
<text x="1004.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">2 · адреса — точно вхід?</text>
<text x="1004.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">3 · зняти адресу повернення</text>
<text x="1004.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">     з верхівки стека процесу</text>
<text x="1004.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">4 · виконати справжній виклик</text>
<text x="1004.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">5 · повернути керування туди,</text>
<text x="1004.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">     звідки прийшли</text>
<line x1="380.0" y1="190.0" x2="494.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="437.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виклик</text>
<line x1="890.0" y1="190.0" x2="980.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="935.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">збій</text>
<line x1="1165.0" y1="390.0" x2="1165.0" y2="448.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="1165.0" y1="448.0" x2="215.0" y2="448.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="215.0" y1="448.0" x2="215.0" y2="292.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">відповідь така сама, як була у 2009-му — лише повільніша</text>
<rect x="50.0" y="496.0" width="700.0" height="106.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="400.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Стрибок у середину сторінки — те, заради чого її брали в атаках</text>
<text x="400.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">адреса не збігається з жодним входом: ядро не емулює нічого,</text>
<text x="400.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">процес дістає звичайний SIGSEGV</text>
<line x1="756.0" y1="549.0" x2="894.0" y2="549.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="900.0" y="508.0" width="450.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="1125.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">жодного байта сторінки процесор не виконує —</text>
<text x="1125.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">виконуваного гаджета за сталою адресою немає</text>
</svg>