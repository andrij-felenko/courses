<text x="203.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">CONFIG_LOCALVERSION із .config, далі LOCALVERSION= у команді make</text>
