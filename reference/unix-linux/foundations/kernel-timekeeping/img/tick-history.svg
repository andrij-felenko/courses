<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 816" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="816" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="90.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">1970-ті</tspan><tspan x="90.0" dy="19.6">PDP-11</tspan></text>
<rect x="150.0" y="40.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">апаратура дає тільки переривання від мережі —</tspan><tspan x="360.0" dy="16.9">50 або 60 разів на секунду, читати нічого</tspan></text>
<line x1="584.0" y1="80.0" x2="616.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="40.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">лічити ці переривання:</tspan><tspan x="855.0" dy="16.9">змінна lbolt у шостій редакції Unix</tspan></text>
<text x="90.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">1991+</tspan><tspan x="90.0" dy="19.6">Linux</tspan></text>
<rect x="150.0" y="148.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">тик — і годинник, і мить, коли ядро</tspan><tspan x="360.0" dy="16.9">гарантовано дістає керування</tspan></text>
<line x1="584.0" y1="188.0" x2="616.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="148.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="192.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">jiffies і HZ, задане при складанні ядра</tspan></text>
<text x="90.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">2005</tspan><tspan x="90.0" dy="19.6">2.6.13</tspan></text>
<rect x="150.0" y="256.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">роздільність дорівнює періоду тику,</tspan><tspan x="360.0" dy="16.9">а 1000 Гц коштує 8.15 Вт замість 7.59 Вт</tspan></text>
<line x1="584.0" y1="296.0" x2="616.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="256.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">HZ стало налаштовним;</tspan><tspan x="855.0" dy="16.9">типове значення на i386 — 250</tspan></text>
<text x="90.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">2006</tspan><tspan x="90.0" dy="19.6">2.6.16</tspan></text>
<rect x="150.0" y="364.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="400.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">жодне єдине значення HZ не влаштовує</tspan><tspan x="360.0" dy="16.9">і ноутбук, і студію звукозапису</tspan></text>
<line x1="584.0" y1="404.0" x2="616.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="364.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="400.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">hrtimers: термін задають миттю</tspan><tspan x="855.0" dy="16.9">в наносекундах, а не номером тику</tspan></text>
<text x="90.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">2006</tspan><tspan x="90.0" dy="19.6">2.6.18</tspan></text>
<rect x="150.0" y="472.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">джерело часу вшите в код кожної архітектури</tspan><tspan x="360.0" dy="16.9">окремо, спільної основи немає</tspan></text>
<line x1="584.0" y1="512.0" x2="616.0" y2="512.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="472.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">узагальнений час доби (GTOD):</tspan><tspan x="855.0" dy="16.9">одне джерело часу на всіх</tspan></text>
<text x="90.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">2007</tspan><tspan x="90.0" dy="19.6">2.6.21</tspan></text>
<rect x="150.0" y="580.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="616.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">переривання приходить і тоді,</tspan><tspan x="360.0" dy="16.9">коли на нього ніхто не чекає</tspan></text>
<line x1="584.0" y1="620.0" x2="616.0" y2="620.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="580.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="616.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">шар пристроїв подій + NO_HZ_IDLE:</tspan><tspan x="855.0" dy="16.9">у простої періодичного тику немає</tspan></text>
<text x="90.0" y="718.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">2013</tspan><tspan x="90.0" dy="19.6">3.10</tspan></text>
<rect x="150.0" y="688.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="724.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">на зайнятому ядрі тик псує затримку</tspan><tspan x="360.0" dy="16.9">і вимір однозадачного навантаження</tspan></text>
<line x1="584.0" y1="728.0" x2="616.0" y2="728.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="688.0" width="450.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="724.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">NO_HZ_FULL: тик знімають і з зайнятого ядра;</tspan><tspan x="855.0" dy="16.9">ціна — приблизний облік часу</tspan></text>
<text x="360.0" y="794.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">виміряна ціна попереднього кроку</text>
<text x="855.0" y="794.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">чим на неї відповіли</text>
</svg>