<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела плям і дві маски</text>
<rect x="30.0" y="65.7" width="360.0" height="68.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Метадані модуля</tspan><tspan x="210.0" dy="17.6">ліцензія · intree · підпис · test</tspan><tspan x="210.0" dy="17.6">→ P   O   E   N   C</tspan></text><rect x="440.0" y="65.7" width="360.0" height="68.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Код ядра</tspan><tspan x="620.0" dy="17.6">WARN() · oops · BUG() · add_taint()</tspan><tspan x="620.0" dy="17.6">→ W   D   B   L   M</tspan></text><rect x="850.0" y="65.7" width="360.0" height="68.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="1030.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Простір користувача</tspan><tspan x="1030.0" dy="17.6">запис у /proc/sys/kernel/tainted</tspan><tspan x="1030.0" dy="17.6">→ будь-який біт, лише додаванням</tspan></text><rect x="320.0" y="222.8" width="600.0" height="54.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="620.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">add_taint(flag, lockdep_ok) — єдині двері</tspan><tspan x="620.0" dy="19.5">тут-таки спрацьовує panic_on_taint</tspan></text><line x1="210.0" y1="140.0" x2="490.0" y2="218.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="620.0" y1="140.0" x2="620.0" y2="218.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="1030.0" y1="140.0" x2="750.0" y2="218.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="90.0" y="377.7" width="520.0" height="68.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">tainted_mask — одна на все ядро</tspan><tspan x="350.0" dy="17.6">живе до перезавантаження, біти не знімаються</tspan><tspan x="350.0" dy="17.6">читати: /proc/sys/kernel/tainted, заголовок oops</tspan></text><rect x="630.0" y="377.7" width="520.0" height="68.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="890.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">mod-&gt;taints — своя в кожного модуля</tspan><tspan x="890.0" dy="17.6">зникає разом із rmmod</tspan><tspan x="890.0" dy="17.6">читати: /sys/module/&lt;назва&gt;/taint, /proc/modules</tspan></text><line x1="500.0" y1="285.0" x2="350.0" y2="370.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="740.0" y1="285.0" x2="890.0" y2="370.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="175.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">усі плями</text><text x="1055.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">лише плями модулів</text><text x="620.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маска ядра переживає вивантаження модуля — тому в звіті лишається слід від того, кого вже немає.</text>
</svg>