<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три роди прапорців taint</text>
<rect x="35.0" y="51.5" width="330.0" height="37.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><text x="200.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Сторонній код у ядрі</tspan></text><rect x="35.0" y="125.0" width="330.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="200.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">P  O  E  F  R  C  K  X</tspan></text><text x="200.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">виконується код, якого немає</tspan><tspan x="200.0" dy="20.3">в дереві ядра або якого ядро</tspan><tspan x="200.0" dy="20.3">не перевіряло</tspan></text><rect x="35.0" y="323.9" width="330.0" height="52.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="200.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">Питання: чи міг цей код</tspan><tspan x="200.0" dy="18.2">зіпсувати пам'ять раніше?</tspan></text><rect x="425.0" y="51.5" width="330.0" height="37.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/><text x="590.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Ядро вже спотикалося</tspan></text><rect x="425.0" y="125.0" width="330.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">D  W  B  L  M</tspan></text><text x="590.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">збій, попередження, зіпсована</tspan><tspan x="590.0" dy="20.3">сторінка, зависання або</tspan><tspan x="590.0" dy="20.3">апаратна помилка вже були</tspan></text><rect x="425.0" y="323.9" width="330.0" height="52.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">Питання: де в журналі</tspan><tspan x="590.0" dy="18.2">найперша з цих подій?</tspan></text><rect x="815.0" y="51.5" width="330.0" height="37.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/><text x="980.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Середовище не типове</tspan></text><rect x="815.0" y="125.0" width="330.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="980.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">S  A  I  T  N  U  J</tspan></text><text x="980.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">залізо поза специфікацією,</tspan><tspan x="980.0" dy="20.3">підмінені таблиці, обхід вади</tspan><tspan x="980.0" dy="20.3">прошивки, тестовий режим</tspan></text><rect x="815.0" y="323.9" width="330.0" height="52.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="980.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">Питання: чи однакові умови</tspan><tspan x="980.0" dy="18.2">у вас і в розробника?</tspan></text><text x="590.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Маска одна на все ядро: біти лише додаються й не знімаються до перезавантаження.</tspan></text>
</svg>