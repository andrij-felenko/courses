<line x1="216.0" y1="176.0" x2="244.0" y2="176.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="150.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="385.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">write_all(out, buf, n) → знову</tspan></text>
<rect x="40.0" y="218.0" width="170.0" height="52.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="125.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">n == 0</tspan></text>
<line x1="216.0" y1="244.0" x2="244.0" y2="244.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="218.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="385.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">джерело скінчилося → вихід</tspan></text>
<rect x="40.0" y="286.0" width="170.0" height="52.0" rx="7" fill="#fff6e5" stroke="#b8860b" stroke-width="1.7"/><text x="125.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">n &lt; 0, EINTR</tspan></text>
