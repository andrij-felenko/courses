<text x="560.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">жоден із цих випадків не питає, що стоїть за дескриптором</text>
