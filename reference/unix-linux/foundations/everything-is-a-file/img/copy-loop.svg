<rect x="250.0" y="286.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.5"/><text x="385.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">нічого не сталося → знову</tspan></text>
<rect x="40.0" y="354.0" width="170.0" height="52.0" rx="7" fill="#fff6e5" stroke="#b8860b" stroke-width="1.7"/><text x="125.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">n &lt; 0, EAGAIN</tspan></text>
