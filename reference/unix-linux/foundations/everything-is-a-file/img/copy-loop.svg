<text x="280.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">зовнішня петля: read</text>
<rect x="125.0" y="66.0" width="310.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="280.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">n = read(in, buf, N)</tspan></text>
<text x="280.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що повернулось</text>
