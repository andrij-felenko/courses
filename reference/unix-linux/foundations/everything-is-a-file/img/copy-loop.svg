<rect x="40.0" y="422.0" width="170.0" height="52.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="125.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">n &lt; 0, решта</tspan></text>
<line x1="216.0" y1="448.0" x2="244.0" y2="448.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="422.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="385.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">справжня помилка → перервати</tspan></text>
<text x="840.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">внутрішня петля: write_all</text>
<rect x="685.0" y="66.0" width="310.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="840.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">m = write(out, p, left)</tspan></text>
<text x="840.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що повернулось</text>
<rect x="600.0" y="150.0" width="170.0" height="52.0" rx="7" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="685.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">m &gt; 0</tspan></text>
<line x1="776.0" y1="176.0" x2="804.0" y2="176.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="150.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="945.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">p += m; left −= m; знову</tspan></text>
<rect x="600.0" y="218.0" width="170.0" height="52.0" rx="7" fill="#fff6e5" stroke="#b8860b" stroke-width="1.7"/><text x="685.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">m &lt; 0, EINTR</tspan></text>
<line x1="776.0" y1="244.0" x2="804.0" y2="244.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="218.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.5"/><text x="945.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">той самий шматок ще раз</tspan></text>
<rect x="600.0" y="286.0" width="170.0" height="52.0" rx="7" fill="#fff6e5" stroke="#b8860b" stroke-width="1.7"/><text x="685.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">m &lt; 0, EAGAIN</tspan></text>
<line x1="776.0" y1="312.0" x2="804.0" y2="312.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="286.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.5"/><text x="945.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">чекати готовності запису</tspan></text>
<rect x="600.0" y="354.0" width="170.0" height="52.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="685.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">m &lt; 0, EPIPE</tspan></text>
<line x1="776.0" y1="380.0" x2="804.0" y2="380.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="354.0" width="270.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="945.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">читач зник — перервати</tspan></text>
<text x="840.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="840.0" dy="0.0">поки left &gt; 0 — повторюємо той самий буфер;</tspan><tspan x="840.0" dy="16.2">left == 0 — шматок дописано, вертаємось до read</tspan></text>
