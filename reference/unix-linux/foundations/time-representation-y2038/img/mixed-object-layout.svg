<text x="190.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">молодша половина секунд —</tspan><tspan x="190.0" dy="15.6">доки вона менша за 2³¹,</tspan><tspan x="190.0" dy="15.6">збігається</tspan></text>
<text x="520.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="520.0" dy="0.0">старша половина секунд —</tspan><tspan x="520.0" dy="15.6">сьогодні нулі, тож</tspan><tspan x="520.0" dy="15.6">наносекунди виходять 0</tspan></text>
<text x="820.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="820.0" dy="0.0">наступне поле більшої</tspan><tspan x="820.0" dy="15.6">структури він візьме</tspan><tspan x="820.0" dy="15.6">з байта 8</tspan></text>
