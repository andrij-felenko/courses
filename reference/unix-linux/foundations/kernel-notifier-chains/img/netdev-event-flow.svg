<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік сповіщень мережевого стека: реакція підсистем на подію NETDEV_DOWN</text>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">ЖИТТЄВИЙ ЦИКЛ ПОДІЇ МЕРЕЖЕВОГО ПРИСТРОЮ (netdev_chain)</text>
<rect x="40.0" y="70.0" width="300.0" height="110.0" rx="6" fill="#fef9e7" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ДЖЕРЕЛО ПОДІЇ</tspan><tspan x="190.0" dy="15.6">ip link set eth0 down</tspan><tspan x="190.0" dy="15.6">───────────────</tspan><tspan x="190.0" dy="15.6">dev_close() / dev_change_flags()</tspan><tspan x="190.0" dy="15.6">генерує подію NETDEV_DOWN</tspan></text>
<rect x="400.0" y="70.0" width="380.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ДИСПЕТЧЕР СПОВІЩЕНЬ</tspan><tspan x="590.0" dy="15.6">call_netdevice_notifiers(NETDEV_DOWN, dev)</tspan><tspan x="590.0" dy="15.6">───────────────</tspan><tspan x="590.0" dy="15.6">вхід: srcu_read_lock(&amp;netdev_chain.srcu)</tspan><tspan x="590.0" dy="15.6">обхід черги struct notifier_block*</tspan></text>
<line x1="342.0" y1="125.0" x2="398.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="840.0" y="60.0" width="320.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">FIB / IP ROUTING (fib_netdev_event)</tspan><tspan x="1000.0" dy="14.3">скидає маршрути через eth0</tspan><tspan x="1000.0" dy="14.3">повертає NOTIFY_OK</tspan></text>
<rect x="840.0" y="150.0" width="320.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ARP / NEIGHBOUR (arp_netdev_event)</tspan><tspan x="1000.0" dy="14.3">очищає кеш сусідів для eth0</tspan><tspan x="1000.0" dy="14.3">повертає NOTIFY_OK</tspan></text>
<rect x="840.0" y="240.0" width="320.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">AF_PACKET / SNIFFER (packet_notifier)</tspan><tspan x="1000.0" dy="14.3">повідомляє сокети про зміну стану</tspan><tspan x="1000.0" dy="14.3">повертає NOTIFY_OK</tspan></text>
<rect x="840.0" y="330.0" width="320.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">BONDING / TEAM (bond_netdev_event)</tspan><tspan x="1000.0" dy="14.3">перемикає трафік на резервний порт</tspan><tspan x="1000.0" dy="14.3">повертає NOTIFY_OK</tspan></text>
<line x1="782.0" y1="100.0" x2="838.0" y2="100.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="782.0" y1="115.0" x2="838.0" y2="190.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="782.0" y1="130.0" x2="838.0" y2="280.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="782.0" y1="145.0" x2="838.0" y2="370.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="260.0" width="380.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">РЕЗУЛЬТАТ ОБХОДУ</tspan><tspan x="590.0" dy="15.6">───────────────</tspan><tspan x="590.0" dy="15.6">1. Усі обробники повернули NOTIFY_OK</tspan><tspan x="590.0" dy="15.6">2. srcu_read_unlock(&amp;netdev_chain.srcu)</tspan><tspan x="590.0" dy="15.6">3. Зміна стану eth0 успішно зафіксована</tspan></text>
<line x1="590.0" y1="182.0" x2="590.0" y2="258.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="440.0" width="1120.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="470.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ВЕТО ТА ДВОФАЗНИЙ ПРОТОКОЛ (NETDEV_PRECHANGEMTU, CPU_UP_PREPARE):</tspan><tspan x="600.0" dy="15.6">Якщо будь-який обробник повертає NOTIFY_BAD, обхід негайно припиняється.</tspan><tspan x="600.0" dy="15.6">Ядро ініціює компенсуюче повідомлення (наприклад, NETDEV_CHANGEMTU_CANCEL або CPU_UP_CANCELED),</tspan><tspan x="600.0" dy="15.6">дозволяючи попереднім підсистемам відкотити тимчасово змінений стан.</tspan></text>
</svg>