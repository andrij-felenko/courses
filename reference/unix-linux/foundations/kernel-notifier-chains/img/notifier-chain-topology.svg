<rect x="40.0" y="420.0" width="1120.0" height="95.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="600.0" y="448.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ПОТІК ВИКЛИКУ: notifier_call_chain(head, action, data)</tspan><tspan x="600.0" dy="15.6">1. Читач захоплює блокування (spin_lock / down_read / srcu_read_lock) і йде за вказівниками next.</tspan><tspan x="600.0" dy="15.6">2. Кожен обробник отримує: (struct notifier_block *nb, unsigned long action, void *data).</tspan><tspan x="600.0" dy="15.6">3. Код повернення: NOTIFY_OK (продовжити), NOTIFY_STOP (зупинити), NOTIFY_BAD (помилка, перервати ланцюг).</tspan></text>
</svg>