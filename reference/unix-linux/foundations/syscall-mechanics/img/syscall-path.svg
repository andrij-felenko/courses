<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного виклику write і назад</text>
<line x1="470.0" y1="66.0" x2="470.0" y2="596.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7 6"/>
<text x="240.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">простір користувача</text>
<text x="700.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро</text>
<rect x="60.0" y="88.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">n = write(1, buf, 13); — рядок у програмі</tspan></text>
<rect x="60.0" y="158.0" width="380.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="187.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">обгортка libc: 1 → rax,</tspan><tspan x="250.0" dy="16.9">fd → rdi, buf → rsi, 13 → rdx</tspan></text>
<rect x="60.0" y="244.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">інструкція syscall</tspan></text>
<rect x="500.0" y="314.0" width="380.0" height="66.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="343.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">swapgs, стек ядра,</tspan><tspan x="690.0" dy="16.9">реєстри → pt_regs</tspan></text>
<rect x="500.0" y="400.0" width="380.0" height="66.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="429.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">перевірка номера,</tspan><tspan x="690.0" dy="16.9">диспетчер: номер 1 → sys_write</tspan></text>
<rect x="500.0" y="486.0" width="380.0" height="66.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="515.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">дескриптор, copy_from_user,</tspan><tspan x="690.0" dy="16.9">запис; результат → rax</tspan></text>
<rect x="60.0" y="572.0" width="380.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="601.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">sysretq; libc: rax у [−4095…−1]?</tspan><tspan x="250.0" dy="16.9">тоді errno = −rax і повернути −1</tspan></text>
