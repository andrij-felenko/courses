<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="730" fill="#ffffff"/>
