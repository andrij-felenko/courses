<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне означення — чотири різні імені</text>
<rect x="140.0" y="56.0" width="800.0" height="36.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">у fs/read_write.c написано рівно це:</tspan></text>
<rect x="140.0" y="100.0" width="800.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">SYSCALL_DEFINE3(write, unsigned int, fd, const char __user *, buf, size_t, count)</tspan></text>
<line x1="540.0" y1="148.0" x2="540.0" y2="176.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="180.0" width="480.0" height="42.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">препроцесор склеює: write → _write → sys_write</tspan></text>
<line x1="141.0" y1="240.0" x2="939.0" y2="240.0" stroke="#333333" stroke-width="1.5"/>
<line x1="540.0" y1="224.0" x2="540.0" y2="239.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="141.0" y1="240.0" x2="141.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="16.0" y="256.0" width="250.0" height="106.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="141.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="141.0" dy="0.0">__x64_sys_write</tspan><tspan x="141.0" dy="15.6">(const struct pt_regs *)</tspan><tspan x="141.0" dy="15.6">розбирає реєстри</tspan><tspan x="141.0" dy="15.6">64-бітної програми</tspan></text>
<line x1="407.0" y1="240.0" x2="407.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="282.0" y="256.0" width="250.0" height="106.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="407.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="407.0" dy="0.0">__ia32_sys_write</tspan><tspan x="407.0" dy="15.6">(const struct pt_regs *)</tspan><tspan x="407.0" dy="15.6">те саме для 32-бітної</tspan><tspan x="407.0" dy="15.6">програми на цьому ж ядрі</tspan></text>
<line x1="673.0" y1="240.0" x2="673.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="548.0" y="256.0" width="250.0" height="106.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="673.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="673.0" dy="0.0">__se_sys_write</tspan><tspan x="673.0" dy="15.6">(long, long, long)</tspan><tspan x="673.0" dy="15.6">знакове розширення</tspan><tspan x="673.0" dy="15.6">аргументів</tspan></text>
<line x1="939.0" y1="240.0" x2="939.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="814.0" y="256.0" width="250.0" height="106.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="939.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="939.0" dy="0.0">__do_sys_write</tspan><tspan x="939.0" dy="15.6">(fd, buf, count)</tspan><tspan x="939.0" dy="15.6">тіло: те, що написано</tspan><tspan x="939.0" dy="15.6">в дужках макроса</tspan></text>
<rect x="60.0" y="394.0" width="620.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="370.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">рядка «sys_write» як означення функції в дереві немає —</tspan><tspan x="370.0" dy="16.9">тому пошук за цим іменем не знаходить тіла</tspan></text>
<rect x="700.0" y="394.0" width="340.0" height="62.0" rx="6" fill="#eaf3ec" stroke="#27ae60" stroke-width="2.0"/><text x="870.0" y="421.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">де «sys_write» таки написано:</tspan><tspan x="870.0" dy="15.6">syscall_64.tbl і оголошення в syscalls.h</tspan></text>
<text x="540.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">шукати треба аргумент макроса — «write», а не склеєне ім'я</text>
</svg>