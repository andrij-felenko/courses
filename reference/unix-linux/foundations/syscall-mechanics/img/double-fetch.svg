<rect x="45.0" y="140.0" width="200.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">читає len = 8,</tspan><tspan x="145.0" dy="15.6">перевіряє: помістилося</tspan></text>
