<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари одного write — три різні зонди</text>
<rect x="30.0" y="52.0" width="300.0" height="34.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">куди чіпляти</tspan></text>
<rect x="350.0" y="52.0" width="330.0" height="34.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">що побачите</tspan></text>
<rect x="700.0" y="52.0" width="330.0" height="34.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">чого не побачите</tspan></text>
<rect x="30.0" y="98.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">__x64_sys_write</tspan></text>
<rect x="350.0" y="98.0" width="330.0" height="80.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">усі write</tspan><tspan x="515.0" dy="15.6">з програм на x86-64</tspan></text>
<rect x="700.0" y="98.0" width="330.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">виклики 32-бітних програм</tspan><tspan x="865.0" dy="15.6">і писання зсередини ядра</tspan></text>
<rect x="30.0" y="190.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">__se_sys_write</tspan><tspan x="180.0" dy="16.9">__do_sys_write</tspan></text>
<rect x="350.0" y="190.0" width="330.0" height="80.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">нічого: обидві статичні,</tspan><tspan x="515.0" dy="15.6">компілятор їх вбудовує</tspan></text>
<rect x="700.0" y="190.0" width="330.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">у /proc/kallsyms</tspan><tspan x="865.0" dy="15.6">цих імен зазвичай немає</tspan></text>
<rect x="30.0" y="282.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">vfs_write</tspan></text>
<rect x="350.0" y="282.0" width="330.0" height="80.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="318.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">усі писання через VFS —</tspan><tspan x="515.0" dy="15.6">і від програм, і від ядра</tspan></text>
<rect x="700.0" y="282.0" width="330.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="318.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">писання повз VFS —</tspan><tspan x="865.0" dy="15.6">напряму у write_iter</tspan></text>
<rect x="30.0" y="374.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">tracepoint:</tspan><tspan x="180.0" dy="16.9">syscalls:sys_enter_write</tspan></text>
<rect x="350.0" y="374.0" width="330.0" height="80.0" rx="6" fill="#eaf3ec" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="410.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">виклик за номером,</tspan><tspan x="515.0" dy="15.6">без архітектурних імен</tspan></text>
<rect x="700.0" y="374.0" width="330.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="410.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">що робилося далі —</tspan><tspan x="865.0" dy="15.6">нижче межі не видно</tspan></text>
<text x="530.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">вибір шару — це вибір того, що саме ви ловите, а не деталь синтаксису</text>
</svg>