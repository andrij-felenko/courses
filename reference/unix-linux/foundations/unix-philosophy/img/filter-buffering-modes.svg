<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="490" fill="#ffffff"/>
