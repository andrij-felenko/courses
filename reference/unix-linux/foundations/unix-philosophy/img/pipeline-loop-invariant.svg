<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна ітерація циклу: канал з'являється, prev переїжджає</text>
<rect x="364.4" y="61.0" width="331.2" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">батько: pipe() → fork() → закрити зайве</tspan></text>
<line x1="430.0" y1="97.0" x2="250.0" y2="161.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="530.0" y1="97.0" x2="530.0" y2="161.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="630.0" y1="97.0" x2="810.0" y2="161.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="154.4" y="176.6" width="131.1" height="66.8" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ланка 1</tspan><tspan x="220.0" dy="16.9">ввід — свій</tspan><tspan x="220.0" dy="16.9">вивід → канал 1</tspan></text>
<rect x="464.4" y="176.6" width="131.1" height="66.8" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">ланка 2</tspan><tspan x="530.0" dy="16.9">ввід ← канал 1</tspan><tspan x="530.0" dy="16.9">вивід → канал 2</tspan></text>
<rect x="767.0" y="176.6" width="146.0" height="66.8" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">ланка 3 (остання)</tspan><tspan x="840.0" dy="16.9">ввід ← канал 2</tspan><tspan x="840.0" dy="16.9">вивід — свій</tspan></text>
<line x1="295.6" y1="210.0" x2="454.4" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="375.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">канал 1</text>
<text x="375.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p[0] стає prev</text>
<line x1="605.6" y1="210.0" x2="757.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="681.3" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">канал 2</text>
<text x="681.3" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p[0] стає prev</text>
<text x="45.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">після fork() батько:</text>
<rect x="169.0" y="288.2" width="102.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="220.0" dy="0.0">закрив p[1];</tspan><tspan x="220.0" dy="15.6">prev = p[0]</tspan></text>
<rect x="431.1" y="288.2" width="197.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">закрив старий prev і p[1];</tspan><tspan x="530.0" dy="15.6">prev = p[0]</tspan></text>
<rect x="765.0" y="288.2" width="150.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="840.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="840.0" dy="0.0">закрив prev;</tspan><tspan x="840.0" dy="15.6">каналу не створював</tspan></text>
<text x="530.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">інваріант: у батька в руках рівно один цікавий дескриптор — prev, читальний кінець останнього створеного каналу</text>
<text x="530.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тому довжина ланцюжка не змінює того, скільки дескрипторів відкрито одночасно</text>
</svg>