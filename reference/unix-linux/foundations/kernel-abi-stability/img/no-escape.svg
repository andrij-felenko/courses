<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири способи пережити несумісну зміну — і жодного в ядра</text>
<rect x="40.0" y="52.0" width="260.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Спосіб пережити зміну</tspan></text>
<rect x="320.0" y="52.0" width="320.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Бібліотека простору користувача</tspan></text>
<rect x="660.0" y="52.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Ядро</tspan></text>
<rect x="40.0" y="112.0" width="260.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="146.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Поставити дві версії</tspan><tspan x="170.0" dy="18.2">поруч</tspan></text>
<rect x="320.0" y="112.0" width="320.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="146.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">libfoo.so.2 і libfoo.so.3</tspan><tspan x="480.0" dy="18.2">спокійно лежать разом</tspan></text>
<rect x="660.0" y="112.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="146.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">на машині виконується</tspan><tspan x="810.0" dy="18.2">рівно одне ядро</tspan></text>
<rect x="40.0" y="204.0" width="260.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Позначити в бінарнику,</tspan><tspan x="170.0" dy="18.2">яку версію він хоче</tspan></text>
<rect x="320.0" y="204.0" width="320.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">версіонування символів:</tspan><tspan x="480.0" dy="18.2">мітка в кожному файлі</tspan></text>
<rect x="660.0" y="204.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">бінарник кладе номер</tspan><tspan x="810.0" dy="18.2">виклику в регістр — і все</tspan></text>
<rect x="40.0" y="296.0" width="260.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Перезібрати всіх,</tspan><tspan x="170.0" dy="18.2">хто залежить</tspan></text>
<rect x="320.0" y="296.0" width="320.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">дистрибутив володіє</tspan><tspan x="480.0" dy="18.2">вихідними текстами</tspan></text>
<rect x="660.0" y="296.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">чужу, закриту, покинуту</tspan><tspan x="810.0" dy="18.2">програму не перезбере ніхто</tspan></text>
<rect x="40.0" y="388.0" width="260.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Утекти від залежності</tspan></text>
<rect x="320.0" y="388.0" width="320.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="422.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">злінкувати статично</tspan><tspan x="480.0" dy="18.2">й нести з собою</tspan></text>
<rect x="660.0" y="388.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="422.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">системного виклику</tspan><tspan x="810.0" dy="18.2">статикою не заміниш</tspan></text>
<rect x="40.0" y="448.0" width="920.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="473.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">лишається єдиний вихід: не міняти того, що вже випущено</tspan></text>
</svg>