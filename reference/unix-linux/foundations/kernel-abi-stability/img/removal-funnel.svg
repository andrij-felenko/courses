<rect x="300.0" y="116.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="413.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">замінений на /proc/sys</tspan></text>
<rect x="546.0" y="116.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="659.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">ELF від 1995 року</tspan></text>
<rect x="792.0" y="116.0" width="198.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="891.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">оголошено легасі</tspan></text>
<rect x="30.0" y="202.0" width="250.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Виміряти: чи хтось лишився</tspan></text>
<rect x="300.0" y="202.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="413.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">нікого: вимкнений</tspan><tspan x="413.0" dy="16.9">у конфігураціях</tspan></text>
<rect x="546.0" y="202.0" width="226.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="659.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">один: інструменти</tspan><tspan x="659.0" dy="16.9">для Atari Jaguar</tspan></text>
<rect x="792.0" y="202.0" width="198.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">є: старі статичні</tspan><tspan x="891.0" dy="16.9">бінарники</tspan></text>
<rect x="30.0" y="288.0" width="250.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Дати заміну тим, хто лишився</tspan></text>
<rect x="300.0" y="288.0" width="226.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="413.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">не знадобилася</tspan></text>
<rect x="546.0" y="288.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="659.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">обгортка на ELF,</tspan><tspan x="659.0" dy="16.9">перевірена автором</tspan></text>
<rect x="792.0" y="288.0" width="198.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">vDSO є, але старого</tspan><tspan x="891.0" dy="16.9">не перезібрати</tspan></text>
<rect x="30.0" y="374.0" width="250.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="415.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Прибрати</tspan></text>
<rect x="300.0" y="374.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="413.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">ядро 5.5</tspan></text>
<rect x="546.0" y="374.0" width="226.0" height="74.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="659.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">ядро 5.19, x86</tspan></text>
<rect x="792.0" y="374.0" width="198.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">не прибрано:</tspan><tspan x="891.0" dy="16.9">vsyscall=emulate</tspan></text>
<rect x="30.0" y="460.0" width="960.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="510.0" y="481.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">прибирають не за строком, а за доведеною відсутністю користувачів</tspan></text>
