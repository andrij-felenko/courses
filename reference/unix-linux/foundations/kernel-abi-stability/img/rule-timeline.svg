<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 814" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="814" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як правило «не ламати простір користувача» твердішало</text>
<rect x="40.0" y="46.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Коли</tspan></text>
<rect x="320.0" y="46.0" width="660.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Що сталося з правилом</tspan></text>
<rect x="40.0" y="108.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="147.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">1991 — 2003</tspan></text>
<rect x="320.0" y="108.0" width="660.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Правила немає: ламати можна</tspan><tspan x="650.0" dy="18.2">в непарній гілці розробки</tspan></text>
<rect x="40.0" y="190.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">липень 2004</tspan></text>
<rect x="320.0" y="190.0" width="660.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Гілки розробки більше не буде —</tspan><tspan x="650.0" dy="18.2">кожен випуск іде просто до людей</tspan></text>
<rect x="40.0" y="272.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="311.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">грудень 2005</tspan></text>
<rect x="320.0" y="272.0" width="660.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="302.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Сварка про udev: правило</tspan><tspan x="650.0" dy="18.2">вимовлено вголос уперше</tspan></text>
<rect x="40.0" y="354.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="393.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">2005 — 2006</tspan></text>
<rect x="320.0" y="354.0" width="660.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Спроби записати наперед:</tspan><tspan x="650.0" dy="18.2">графік прибирання, тека ABI</tspan></text>
<rect x="40.0" y="436.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="475.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">жовтень 2012</tspan></text>
<rect x="320.0" y="436.0" width="660.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="466.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Межу переносять у include/uapi:</tspan><tspan x="650.0" dy="18.2">обіцянка дістає адресу</tspan></text>
<rect x="40.0" y="518.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="557.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">2012</tspan></text>
<rect x="320.0" y="518.0" width="660.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="548.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Графік прибирання видалено:</tspan><tspan x="650.0" dy="18.2">схема наперед не працює</tspan></text>
<rect x="40.0" y="600.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="639.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">грудень 2012</tspan></text>
<rect x="320.0" y="600.0" width="660.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="630.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">«WE DO NOT BREAK USERSPACE!» —</tspan><tspan x="650.0" dy="18.2">правило стає гаслом</tspan></text>
<rect x="40.0" y="682.0" width="250.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="721.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">2020 — 2022</tspan></text>
<rect x="320.0" y="682.0" width="660.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="712.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Трекер, бот і текст у дереві:</tspan><tspan x="650.0" dy="18.2">гасло дістає процедуру</tspan></text>
</svg>