<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1030" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з відповіді проби можна запам'ятати, а що ні</text>
<rect x="30.0" y="44.0" width="300.0" height="50.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Спитати один раз</tspan></text>
<rect x="365.0" y="44.0" width="300.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="515.0" y="73.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">Перепитати після зміни контексту</tspan></text>
<rect x="700.0" y="44.0" width="300.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Не кешувати ніколи</tspan></text>
<text x="30.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Від чого залежить відповідь</text>
<rect x="30.0" y="138.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="165.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">тільки від коду ядра,</tspan><tspan x="180.0" dy="16.9">яке зараз виконується</tspan></text>
<rect x="365.0" y="138.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="165.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">від фільтрів і прав</tspan><tspan x="515.0" dy="16.9">самого процесу</tspan></text>
<rect x="700.0" y="138.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="165.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">від файлу, файлової системи</tspan><tspan x="850.0" dy="16.9">чи конкретного пристрою</tspan></text>
<text x="30.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Приклад</text>
<rect x="30.0" y="244.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">чи є openat2;</tspan><tspan x="180.0" dy="16.9">чи знають MFD_HUGETLB</tspan></text>
<rect x="365.0" y="244.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">seccomp, накладений після старту;</tspan><tspan x="515.0" dy="16.9">скинуті можливості; зміна uid</tspan></text>
<rect x="700.0" y="244.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">copy_file_range між різними ФС;</tspan><tspan x="850.0" dy="16.9">ioctl конкретного драйвера</tspan></text>
<text x="30.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Коли відповідь застаріває</text>
<rect x="30.0" y="350.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="385.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">поки процес живий — ніколи</tspan></text>
<rect x="365.0" y="350.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">після seccomp, setuid,</tspan><tspan x="515.0" dy="16.9">входу в чужий простір імен</tspan></text>
<rect x="700.0" y="350.0" width="300.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">щоразу: EOPNOTSUPP і EXDEV</tspan><tspan x="850.0" dy="16.9">обробляють на місці виклику</tspan></text>
<rect x="30.0" y="398.0" width="970.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="515.0" y="420.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">кеш проби — це твердження про ядро; усе, що залежить від об'єкта чи прав, твердженням про ядро не є</tspan></text>
</svg>