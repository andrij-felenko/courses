<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 636" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="636" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири твердження суперечки 1992 року й те, чим вони обернулися</text>
<text x="310.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закид, сказаний у січні 1992-го</text>
<text x="900.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як розсудив час</text>
<rect x="40.0" y="88.0" width="540.0" height="118.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.4"/><text x="310.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Таненбаум: монолітне ядро 1991 року —</tspan><tspan x="310.0" dy="16.9">це крок назад у 1970-ті</tspan></text>
<line x1="596.0" y1="147.0" x2="654.0" y2="147.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="88.0" width="470.0" height="118.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="905.0" y="134.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Linux лишився монолітним, але навчився</tspan><tspan x="905.0" dy="16.9">вантажити модулі: драйвер відокремили,</tspan><tspan x="905.0" dy="16.9">не ізолюючи його адресним простором</tspan></text>
<rect x="40.0" y="222.0" width="540.0" height="118.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.4"/><text x="310.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Таненбаум: прив'язка до 80x86 — система</tspan><tspan x="310.0" dy="16.9">застаріє разом із самою архітектурою</tspan></text>
<line x1="596.0" y1="281.0" x2="654.0" y2="281.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="222.0" width="470.0" height="118.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="905.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Березень 1995, версія 1.2: Alpha, MIPS, SPARC.</tspan><tspan x="905.0" dy="16.9">Закид був слушний — тому його й усунули,</tspan><tspan x="905.0" dy="16.9">розділивши код на спільний і машинний</tspan></text>
<rect x="40.0" y="356.0" width="540.0" height="118.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.4"/><text x="310.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Таненбаум: серед проєктувальників ОС</tspan><tspan x="310.0" dy="16.9">мікроядра вже перемогли</tspan></text>
<line x1="596.0" y1="415.0" x2="654.0" y2="415.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="356.0" width="470.0" height="118.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="905.0" y="402.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Перемогли в нішах: QNX, L4 у радіомодемах,</tspan><tspan x="905.0" dy="16.9">seL4 з доведеною коректністю,</tspan><tspan x="905.0" dy="16.9">MINIX 3 всередині чипсетів Intel</tspan></text>
<rect x="40.0" y="490.0" width="540.0" height="118.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.4"/><text x="310.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Торвальдс: у MINIX кульгає багатозадачність,</tspan><tspan x="310.0" dy="16.9">а Linux уже є — і безкоштовно</tspan></text>
<line x1="596.0" y1="549.0" x2="654.0" y2="549.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="490.0" width="470.0" height="118.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="905.0" y="536.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Вирішила не будова, а умови поширення:</tspan><tspan x="905.0" dy="16.9">MINIX став вільним аж 2000 року,</tspan><tspan x="905.0" dy="16.9">коли це вже нічого не міняло</tspan></text>
</svg>