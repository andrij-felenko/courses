<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один експортований символ — і другий модуль тримає перший</text>
<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">збирання</text>
<rect x="138.1" y="103.5" width="123.7" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">make: hello.ko</tspan></text>
<rect x="494.5" y="96.2" width="191.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Module.symvers</tspan><tspan x="590.0" dy="15.6">hello_ping → CRC + адреса</tspan></text>
<rect x="881.6" y="96.2" width="156.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">make: hello_user.ko</tspan><tspan x="960.0" dy="15.6">KBUILD_EXTRA_SYMBOLS</tspan></text>
<line x1="268.0" y1="120.0" x2="488.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="692.0" y1="120.0" x2="876.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="195.0" width="1100.0" height="200.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.2"/>
<text x="56.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">адресний простір ядра — жодної межі всередині</text>
<rect x="204.5" y="266.2" width="191.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">hello.ko</tspan><tspan x="300.0" dy="15.6">EXPORT_SYMBOL(hello_ping)</tspan></text>
<rect x="808.4" y="266.2" width="143.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">hello_user.ko</tspan><tspan x="880.0" dy="15.6">кличе hello_ping()</tspan></text>
<text x="600.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">прямий виклик функції, без жодної перевірки</text>
<line x1="796.0" y1="290.0" x2="402.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">ядро записує посилання: hello.refcnt = 1</text>
<text x="590.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">/sys/module/hello/refcnt → 1</text>
<text x="590.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">/sys/module/hello/holders/ → hello_user</text>
<rect x="169.5" y="436.2" width="321.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="330.0" y="456.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">rmmod hello →</tspan><tspan x="330.0" dy="15.6">ERROR: Module hello is in use by: hello_user</tspan></text>
<rect x="696.4" y="436.2" width="307.3" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="850.0" y="456.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">спершу rmmod hello_user, потім rmmod hello</tspan><tspan x="850.0" dy="15.6">→ знімаються обидва</tspan></text>
</svg>