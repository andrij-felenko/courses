<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з цієї купи називається «Linux», а що — «GNU»</text>
<rect x="60.0" y="62.0" width="600.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Застосунки: редактор, браузер, сервер, ваша програма</tspan></text>
<rect x="60.0" y="146.0" width="190.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">init / systemd</tspan><tspan x="155.0" dy="16.9">(перший процес)</tspan></text>
<rect x="265.0" y="146.0" width="190.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">bash, coreutils,</tspan><tspan x="360.0" dy="16.9">grep, sed, awk</tspan></text>
<rect x="470.0" y="146.0" width="190.0" height="78.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">gcc, as, ld,</tspan><tspan x="565.0" dy="16.9">make — тулчейн</tspan></text>
<rect x="60.0" y="254.0" width="600.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">glibc — бібліотека C: open(), printf(), malloc(), pthread_create()</tspan></text>
<line x1="60.0" y1="336.0" x2="660.0" y2="336.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="8 6"/>
<text x="360.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ABI системних викликів: номер у регістрі, аргументи в регістрах</text>
<rect x="60.0" y="374.0" width="600.0" height="88.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="413.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ЯДРО LINUX</tspan><tspan x="360.0" dy="19.5">процеси · пам'ять · файлові системи · драйвери · мережа</tspan></text>
<rect x="60.0" y="492.0" width="600.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="523.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Апаратура: процесор, пам'ять, диски, мережеві карти</tspan></text>
<line x1="670.0" y1="146.0" x2="670.0" y2="310.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="670.0" y1="146.0" x2="682.0" y2="146.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="670.0" y1="310.0" x2="682.0" y2="310.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="696.0" y="190.0" width="178.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">GNU:</tspan><tspan x="785.0" dy="18.2">уся ця частина</tspan></text>
<line x1="670.0" y1="374.0" x2="670.0" y2="462.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="670.0" y1="374.0" x2="682.0" y2="374.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="670.0" y1="462.0" x2="682.0" y2="462.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="696.0" y="386.0" width="178.0" height="64.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="413.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Linux:</tspan><tspan x="785.0" dy="18.2">лише ця смуга</tspan></text>
<text x="450.0" y="588.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ядро без другої половини завантажується — і одразу зупиняється: нема кого запустити</text>
</svg>