<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 646" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="646" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях від теки з одним файлом до працюючого PID 1</text>
<rect x="46.0" y="46.0" width="470.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="281.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">root/ — тека-заготовка: init, dev/console,</tspan><tspan x="281.0" dy="16.9">порожні proc/ sys/ dev/</tspan></text>
<rect x="46.0" y="144.0" width="470.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="281.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">find . | cpio -o -H newc</tspan><tspan x="281.0" dy="16.9">дерево тек стає одним потоком байтів</tspan></text>
<rect x="46.0" y="242.0" width="470.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="281.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">gzip -9  →  initramfs.cpio.gz</tspan></text>
<rect x="46.0" y="340.0" width="470.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="281.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">QEMU: -kernel vmlinuz -initrd initramfs.cpio.gz</tspan><tspan x="281.0" dy="16.9">два файли лягають у пам'ять поруч</tspan></text>
<rect x="46.0" y="438.0" width="470.0" height="64.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="281.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">ЯДРО розпаковує архів у rootfs (ramfs/tmpfs)</tspan><tspan x="281.0" dy="16.9">і шукає в корені файл /init</tspan></text>
<rect x="46.0" y="536.0" width="470.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="281.0" y="572.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="281.0" dy="0.0">exec /init — простір користувача живий</tspan></text>
<line x1="281.0" y1="110.0" x2="281.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="281.0" y1="208.0" x2="281.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="281.0" y1="306.0" x2="281.0" y2="338.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="281.0" y1="404.0" x2="281.0" y2="436.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="281.0" y1="502.0" x2="281.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="516.0" y1="176.0" x2="556.0" y2="176.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="564.0" y="144.0" width="300.0" height="64.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="714.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="714.0" dy="0.0">магія «070701»; без -H newc</tspan><tspan x="714.0" dy="15.6">вийде старий формат, і ядро</tspan><tspan x="714.0" dy="15.6">архіву не впізнає</tspan></text>
<line x1="516.0" y1="470.0" x2="556.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="564.0" y="438.0" width="300.0" height="64.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="714.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="714.0" dy="0.0">нема /init → panic:</tspan><tspan x="714.0" dy="15.6">«No working init found»</tspan></text>
<text x="450.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ані розділу, ані файлової системи на диску: увесь корінь приїхав у пам'яті</text>
</svg>