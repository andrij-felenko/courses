<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 628" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="628" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять способів не завантажитися і один робочий</text>
<text x="195.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">що лежить в образі</text>
<text x="655.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">що каже машина</text>
<line x1="30.0" y1="76.0" x2="910.0" y2="76.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="30.0" y="96.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">порожній образ</tspan></text>
<rect x="400.0" y="96.0" width="510.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Kernel panic — not syncing:</tspan><tspan x="655.0" dy="16.9">No working init found.</tspan></text>
<line x1="366.0" y1="129.0" x2="394.0" y2="129.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="180.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="217.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">init, що повертається з main</tspan></text>
<rect x="400.0" y="180.0" width="510.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Kernel panic — not syncing:</tspan><tspan x="655.0" dy="16.9">Attempted to kill init! exitcode=0x00000000</tspan></text>
<line x1="366.0" y1="213.0" x2="394.0" y2="213.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="264.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">init, зв'язаний динамічно</tspan></text>
<rect x="400.0" y="264.0" width="510.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">«No such file or directory» —</tspan><tspan x="655.0" dy="16.9">хоча файл на місці: нема /lib/ld-linux</tspan></text>
<line x1="366.0" y1="297.0" x2="394.0" y2="297.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="348.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="385.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">нема вузла /dev/console</tspan></text>
<rect x="400.0" y="348.0" width="510.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">«unable to open an initial console»,</tspan><tspan x="655.0" dy="16.9">далі — цілковита тиша</tspan></text>
<line x1="366.0" y1="381.0" x2="394.0" y2="381.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="432.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="469.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">нема змонтованого /proc</tspan></text>
<rect x="400.0" y="432.0" width="510.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="461.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">ps порожній, free мовчить,</tspan><tspan x="655.0" dy="16.9">/proc/self не існує</tspan></text>
<line x1="366.0" y1="465.0" x2="394.0" y2="465.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="30.0" y="516.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="553.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">init + busybox + /proc + /dev</tspan></text>
<rect x="400.0" y="516.0" width="510.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">запрошення оболонки;</tspan><tspan x="655.0" dy="16.9">ls, mount, ps, ping працюють</tspan></text>
<line x1="366.0" y1="549.0" x2="394.0" y2="549.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="470.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожен рядок — окремий запуск: прибрали одну деталь і подивилися, що станеться</text>
</svg>