<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 654" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="654" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять смуг переносності повсякденних ключів</text>
<rect x="34.0" y="60.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="159.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">POSIX</tspan><tspan x="159.0" dy="18.2">є скрізь і однаково</tspan></text>
<rect x="302.0" y="60.0" width="644.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="624.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">grep -E -F -i -c -l -q · sed -E -n -e -f · find -print0 -iname</tspan><tspan x="624.0" dy="16.9">xargs -0 -r -I -n · head -c -n · tail -n +N · sort -n -k -t -u · cp -R -p</tspan></text>
<rect x="34.0" y="170.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="159.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">не POSIX, але скрізь</tspan><tspan x="159.0" dy="18.2">синтаксис той самий</tspan></text>
<rect x="302.0" y="170.0" width="644.0" height="96.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="624.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">grep -r -R · readlink -f · mktemp -d ШАБЛОН</tspan><tspan x="624.0" dy="16.9">find -maxdepth · du -h · df -h · ls -h</tspan></text>
<rect x="34.0" y="280.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="159.0" y="323.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">не POSIX, скрізь,</tspan><tspan x="159.0" dy="18.2">АЛЕ СИНТАКСИС ІНШИЙ</tspan></text>
<rect x="302.0" y="280.0" width="644.0" height="96.0" rx="6" fill="#fdf3e3" stroke="#c0392b" stroke-width="1.5"/><text x="624.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">sed -i · stat формат · date крім -u · кольори ls</tspan><tspan x="624.0" dy="16.9">mktemp -t -p · xargs на порожньому вході</tspan></text>
<rect x="34.0" y="390.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="159.0" y="433.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">є у двох діалектах</tspan><tspan x="159.0" dy="18.2">із трьох</tspan></text>
<rect x="302.0" y="390.0" width="644.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="624.0" y="434.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">GNU і BSD, нема в busybox:  sort -h · sort -V · grep --include</tspan><tspan x="624.0" dy="16.9">GNU і busybox, нема в BSD:  date -d · stat -c ФОРМАТ</tspan></text>
<rect x="34.0" y="500.0" width="250.0" height="96.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="159.0" y="552.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">лише GNU</tspan></text>
<rect x="302.0" y="500.0" width="644.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="624.0" y="544.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">grep -P · cp --parents · find -printf · find -regex · head -n -N</tspan><tspan x="624.0" dy="16.9">ключі ПІСЛЯ операндів: sort f -o out працює тільки тут</tspan></text>
<text x="490.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чим нижче смуга, тим менше машин зрозуміє рядок; третя смуга небезпечніша за п'яту</text>
</svg>