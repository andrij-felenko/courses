<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки: чого бракувало кожній</text>
<rect x="40.0" y="46.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Проєкт GNU: інструменти без ядра</tspan></text>
<rect x="520.0" y="46.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Linux: ядро без інструментів</tspan></text>
