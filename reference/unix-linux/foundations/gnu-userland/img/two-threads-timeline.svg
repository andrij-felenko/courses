<rect x="40.0" y="100.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">27.09.1983 · оголошення GNU в net.unix-wizards</tspan></text>
<rect x="40.0" y="148.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">20.03.1985 · GNU Emacs 13 — перший випуск</tspan></text>
<rect x="40.0" y="196.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">22.03.1987 · GCC — перший випуск</tspan></text>
<rect x="40.0" y="244.0" width="400.0" height="38.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1987–1990 · чекання на ліцензію Mach</tspan></text>
<rect x="40.0" y="292.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">08.06.1989 · bash — перший випуск</tspan></text>
<rect x="40.0" y="340.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1990 · початок роботи над Hurd</tspan></text>
<rect x="520.0" y="388.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="411.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">25.08.1991 · допис Торвальдса в comp.os.minix</tspan></text>
<rect x="520.0" y="436.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">17.09.1991 · Linux 0.01 на ftp.funet.fi</tspan></text>
<rect x="40.0" y="484.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="507.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">листопад 1991 · Hurd — офіційне ядро GNU</tspan></text>
<rect x="520.0" y="532.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="555.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">05.01.1992 · випуск 0.12 переходить на GPL</tspan></text>
<rect x="520.0" y="580.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="603.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">1994 · форк Linux libc — шов роздвоївся</tspan></text>
<rect x="40.0" y="628.0" width="400.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="651.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">січень 1997 · glibc 2.0 — шов знову один</tspan></text>
<rect x="520.0" y="676.0" width="400.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="699.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">1998 · супровід Linux libc припинено</tspan></text>
<text x="480.0" y="752.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дві нитки йшли нарізно вісім років і зійшлися восени 1991-го</text>
