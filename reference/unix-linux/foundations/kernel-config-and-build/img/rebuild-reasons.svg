<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три механізми, через які зміна одного символу веде до перезбирання</text>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">три різні причини, чому make береться щось перезбирати</text>
<rect x="40.0" y="56.0" width="340.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">символ живе тільки в Makefile</tspan></text>
<line x1="210.0" y1="104.0" x2="210.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="136.0" width="340.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">CONFIG_DUMMY: n → y</tspan></text>
<line x1="210.0" y1="188.0" x2="210.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="222.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">оновлено</tspan><tspan x="210.0" dy="16.9">include/config/auto.conf</tspan></text>
<line x1="210.0" y1="280.0" x2="210.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="316.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">obj-$(CONFIG_DUMMY) += dummy.o</tspan><tspan x="210.0" dy="16.9">тепер потрапляє в obj-y</tspan></text>
<line x1="210.0" y1="374.0" x2="210.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="414.0" width="340.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">CC dummy.o</tspan><tspan x="210.0" dy="16.9">і перелінковка vmlinux</tspan></text>
<rect x="430.0" y="56.0" width="340.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">символ згадано в коді</tspan></text>
<line x1="600.0" y1="104.0" x2="600.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="136.0" width="340.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">CONFIG_SMP: y → n</tspan></text>
<line x1="600.0" y1="188.0" x2="600.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="222.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">оновлено позначку</tspan><tspan x="600.0" dy="16.9">include/config/SMP</tspan></text>
<line x1="600.0" y1="280.0" x2="600.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="316.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">на неї посилаються</tspan><tspan x="600.0" dy="16.9">тисячі .o.cmd — це робота fixdep</tspan></text>
<line x1="600.0" y1="374.0" x2="600.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="414.0" width="340.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">перекомпілюється</tspan><tspan x="600.0" dy="16.9">майже все дерево</tspan></text>
<rect x="820.0" y="56.0" width="340.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">символ змінює прапорці компілятора</tspan></text>
<line x1="990.0" y1="104.0" x2="990.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="136.0" width="340.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">CONFIG_CC_OPTIMIZE_FOR_SIZE: n → y</tspan></text>
<line x1="990.0" y1="188.0" x2="990.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="222.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">у кожному .cmd</tspan><tspan x="990.0" dy="16.9">інший рядок savedcmd_</tspan></text>
<line x1="990.0" y1="280.0" x2="990.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="316.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">позначки тут ні до чого:</tspan><tspan x="990.0" dy="16.9">змінилася сама команда</tspan></text>
<line x1="990.0" y1="374.0" x2="990.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="414.0" width="340.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">перекомпілюється</tspan><tspan x="990.0" dy="16.9">усе дерево</tspan></text>
<rect x="40.0" y="512.0" width="1120.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="543.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">порахувати наперед: grep -rlF 'include/config/СИМВОЛ)' --include='*.cmd' . | wc -l</tspan></text>
</svg>