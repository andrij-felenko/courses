<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1040 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1040" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні паніки: не знайдено кореня і не вдалося виконати init</text>
<rect x="120.0" y="56.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">initramfs розпаковано в rootfs;</tspan><tspan x="380.0" dy="16.9">/dev/console відкрито як 0, 1, 2</tspan></text>
<line x1="380.0" y1="118.0" x2="380.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="144.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">чи існує /init?   (init_eaccess)</tspan></text>
<line x1="644.0" y1="173.0" x2="676.0" y2="173.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="130.0" width="310.0" height="86.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="835.0" y="161.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="835.0" dy="0.0">немає → prepare_namespace():</tspan><tspan x="835.0" dy="15.6">монтувати корінь із root=</tspan><tspan x="835.0" dy="15.6">panic: «Unable to mount root fs»</tspan></text>
<line x1="380.0" y1="202.0" x2="380.0" y2="258.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="262.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">execve(&quot;/init&quot;)</tspan></text>
<line x1="644.0" y1="291.0" x2="676.0" y2="291.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="253.0" width="310.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="835.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="835.0" dy="0.0">успіх → /init стає PID 1,</tspan><tspan x="835.0" dy="15.6">ядро більше нічого не запускає</tspan></text>
<line x1="380.0" y1="320.0" x2="380.0" y2="376.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="380.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="413.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">невдача → «Failed to execute /init (error −N)»</tspan></text>
<line x1="644.0" y1="409.0" x2="676.0" y2="409.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="371.0" width="310.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="397.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">−2 (ENOENT): бінарник динамічний,</tspan><tspan x="835.0" dy="15.6">а завантажувача в архіві немає</tspan><tspan x="835.0" dy="15.6">−13 (EACCES): забули chmod +x</tspan></text>
<line x1="380.0" y1="438.0" x2="380.0" y2="464.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="468.0" width="520.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="502.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">по черзі: /sbin/init → /etc/init →</tspan><tspan x="380.0" dy="16.9">/bin/init → /bin/sh</tspan></text>
<line x1="380.0" y1="544.0" x2="380.0" y2="588.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="592.0" width="520.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="380.0" y="623.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">panic: «No working init found.</tspan><tspan x="380.0" dy="16.9">Try passing init= option to kernel.»</tspan></text>
</svg>