<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 325" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="325" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від одного .c до працюючої «системи»</text>
<rect x="30.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">init.c</tspan><tspan x="120.0" dy="16.9">жодного #include,</tspan><tspan x="120.0" dy="16.9">п'ять syscall-ів</tspan></text>
<rect x="350.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">init</tspan><tspan x="440.0" dy="16.9">статичний ELF</tspan><tspan x="440.0" dy="16.9">≈9 КБ</tspan></text>
<rect x="670.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">initramfs.cpio.gz</tspan><tspan x="760.0" dy="16.9">cpio newc + gzip</tspan></text>
<rect x="990.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">ядро в QEMU</tspan><tspan x="1080.0" dy="16.9">розпаковує архів</tspan><tspan x="1080.0" dy="16.9">і виконує /init</tspan></text>
<line x1="216.0" y1="120.0" x2="346.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">gcc -static -nostdlib</text>
<text x="280.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">-nostartfiles</text>
<line x1="536.0" y1="120.0" x2="666.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">cpio -o -H newc</text>
<text x="600.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">| gzip -9</text>
<line x1="856.0" y1="120.0" x2="986.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="920.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">qemu-system-x86_64</text>
<text x="920.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">-kernel … -initrd …</text>
<rect x="30.0" y="228.0" width="1140.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Єдине, що цей файл просить у системи, — заморожений ABI системних викликів</tspan></text>
</svg>