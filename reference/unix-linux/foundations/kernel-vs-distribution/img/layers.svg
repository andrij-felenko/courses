<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари системи і дві межі між ними</text>
<rect x="50.0" y="55.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="91.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Програми: оболонка, служби, застосунки</tspan></text>
<rect x="580.0" y="58.0" width="330.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="745.0" y="82.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">обирає й супроводжує</tspan><tspan x="745.0" dy="16.9">дистрибутив</tspan></text>
<rect x="50.0" y="129.0" width="500.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Бібліотеки простору користувача:</tspan><tspan x="300.0" dy="18.2">libc (glibc / musl / bionic) та інші .so</tspan></text>
<rect x="580.0" y="134.0" width="330.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="745.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">базова лінія ABI —</tspan><tspan x="745.0" dy="16.9">вибір дистрибутива</tspan></text>
<line x1="50.0" y1="214.0" x2="550.0" y2="214.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="9,6"/>
<text x="300.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">МЕЖА ABI СИСТЕМНИХ ВИКЛИКІВ — заморожена назавжди</text>
<rect x="50.0" y="265.0" width="500.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="66.0" y="278.0" width="468.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="311.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Ядро: планувальник, пам'ять, VFS, стек мережі</tspan></text>
<line x1="66.0" y1="352.0" x2="534.0" y2="352.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="300.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">внутрішній API ядра — змінюється щоверсії</text>
<rect x="66.0" y="395.0" width="468.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="428.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Модулі й драйвери</tspan></text>
<rect x="580.0" y="278.0" width="330.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="745.0" y="302.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">спільне для всіх —</tspan><tspan x="745.0" dy="16.9">договір не змінюється</tspan></text>
<rect x="580.0" y="395.0" width="330.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="745.0" y="419.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">зібрані під конкретну</tspan><tspan x="745.0" dy="16.9">версію ядра</tspan></text>
<rect x="50.0" y="490.0" width="500.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="521.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Залізо</tspan></text>
