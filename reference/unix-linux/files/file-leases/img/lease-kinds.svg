<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 514.24" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="514.24" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два види оренди й що з чого випливає</text>
<rect x="358.0" y="40.0" width="330.0" height="58.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="523.0" y="64.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="523.0" dy="0.0">F_RDLCK</tspan><tspan x="523.0" dy="19.5">оренда на читання</tspan></text>
<rect x="700.0" y="40.0" width="330.0" height="58.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="865.0" y="64.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">F_WRLCK</tspan><tspan x="865.0" dy="19.5">оренда на запис</tspan></text>
<rect x="30.0" y="116.0" width="316.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="188.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">Яку обіцянку дає ядро</tspan></text>
<rect x="358.0" y="116.0" width="330.0" height="62.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.2"/><text x="523.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">цього файлу</tspan><tspan x="523.0" dy="16.9">ніхто не пише</tspan></text>
<rect x="700.0" y="116.0" width="330.0" height="62.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.2"/><text x="865.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">цей файл не відкритий</tspan><tspan x="865.0" dy="16.9">більш ніким</tspan></text>
<rect x="30.0" y="186.0" width="316.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="188.0" y="221.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">За якої умови видається</tspan></text>
<rect x="358.0" y="186.0" width="330.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="523.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">дескриптор відкрито</tspan><tspan x="523.0" dy="16.9">лише на читання</tspan></text>
<rect x="700.0" y="186.0" width="330.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="865.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">інших відкритих дескрипторів</tspan><tspan x="865.0" dy="16.9">на файл немає</tspan></text>
<rect x="30.0" y="256.0" width="316.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="188.0" y="291.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">Що її рве</tspan></text>
<rect x="358.0" y="256.0" width="330.0" height="62.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="523.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">чуже відкриття на запис,</tspan><tspan x="523.0" dy="16.9">truncate</tspan></text>
<rect x="700.0" y="256.0" width="330.0" height="62.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="865.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">будь-яке чуже відкриття,</tspan><tspan x="865.0" dy="16.9">truncate</tspan></text>
<rect x="30.0" y="326.0" width="316.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="188.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">Прийшов чужий читач</tspan></text>
<rect x="358.0" y="326.0" width="330.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.2"/><text x="523.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">нічого не стається</tspan></text>
<rect x="700.0" y="326.0" width="330.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.2"/><text x="865.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">досить знизити</tspan><tspan x="865.0" dy="16.9">оренду до F_RDLCK</tspan></text>
<rect x="30.0" y="396.0" width="316.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="188.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">Прийшов чужий письменник</tspan></text>
<rect x="358.0" y="396.0" width="330.0" height="62.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="523.0" y="431.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">оренду треба віддати</tspan></text>
<rect x="700.0" y="396.0" width="330.0" height="62.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="865.0" y="431.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">оренду треба віддати</tspan></text>
<text x="30.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">Умови у другому рядку не свавільні: ядро видає лише ту обіцянку, яка істинна вже в мить видачі.</text>
</svg>