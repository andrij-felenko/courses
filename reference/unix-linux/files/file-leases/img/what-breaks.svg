<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 642.24" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="642.24" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузькі ворота оренди: що крізь них іде, а що повз</text>
<rect x="760.0" y="96.0" width="320.0" height="420.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="920.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">inode файлу</tspan><tspan x="920.0" dy="19.5"></tspan><tspan x="920.0" dy="19.5">вміст, метадані,</tspan><tspan x="920.0" dy="19.5">список оренд</tspan></text>
<rect x="530.0" y="96.0" width="128.0" height="190.0" rx="6" fill="#f0d9d6" stroke="#c0392b" stroke-width="2.0"/><text x="594.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="594.0" dy="0.0">перевірка</tspan><tspan x="594.0" dy="19.5">оренди</tspan></text>
<text x="594.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">open і truncate</text>
<text x="594.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">— і більше ніде</text>
