<rect x="30.0" y="164.0" width="430.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="245.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">open(…, O_WRONLY)</tspan></text>
<line x1="466.0" y1="192.0" x2="524.0" y2="192.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="228.0" width="430.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="245.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">truncate(…, 0)</tspan></text>
<line x1="466.0" y1="256.0" x2="524.0" y2="256.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="30.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start">рве оренду — орендар дізнається до того, як доступ станеться</text>
