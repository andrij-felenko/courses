<line x1="466.0" y1="500.0" x2="754.0" y2="500.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="536.0" width="430.0" height="56.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="245.0" y="568.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">запис із іншої машини по NFS</tspan></text>
<line x1="466.0" y1="564.0" x2="754.0" y2="564.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start">оренда мовчить — ядро тут її просто не питає</text>
