<rect x="40.0" y="95.0" width="340.0" height="505.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="210.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Демон</text>
<text x="210.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">звичайний користувач</text>
