<text x="625.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">setuid root</text>
<rect x="870.0" y="95.0" width="340.0" height="505.0" rx="10" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/>
<text x="1040.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро</text>
<text x="1040.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">підсистема монтувань</text>
<rect x="55.0" y="111.0" width="310.0" height="78.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="210.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. демон робить пару сокетів</tspan><tspan x="210.0" dy="16.9">і запускає помічника</tspan></text>
<line x1="368.0" y1="172.0" x2="467.0" y2="228.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="211.0" width="310.0" height="78.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="625.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">2. open(&quot;/dev/fuse&quot;) —</tspan><tspan x="625.0" dy="16.9">дескриптор N, поки нікуди не веде</tspan></text>
<line x1="783.0" y1="272.0" x2="882.0" y2="348.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="885.0" y="323.0" width="310.0" height="94.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="1040.0" y="357.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">3. mount(&quot;fuse&quot;, точка, &quot;fd=N,</tspan><tspan x="1040.0" dy="16.9">rootmode=…,user_id=…,group_id=…&quot;)</tspan><tspan x="1040.0" dy="16.9">плюс примусові nosuid і nodev</tspan></text>
<line x1="882.0" y1="400.0" x2="783.0" y2="462.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="441.0" width="310.0" height="78.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="625.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">4. дескриптор N іде демонові</tspan><tspan x="625.0" dy="16.9">через сокет; привілеї скинуто</tspan></text>
<line x1="467.0" y1="502.0" x2="368.0" y2="542.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="511.0" width="310.0" height="78.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="210.0" y="546.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">5. цикл на дескрипторі N:</tspan><tspan x="210.0" dy="16.9">запит → відповідь → запит</tspan></text>
<rect x="40.0" y="636.0" width="1170.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="625.0" y="673.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Монтування прив'язане саме до дескриптора N. Закрився дескриптор — з'єднання обірване, і кожен виклик у цій точці відповідає ENOTCONN.</tspan></text>
</svg>