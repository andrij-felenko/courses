<rect x="900.0" y="400.0" width="300.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="1050.0" y="438.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">демон рахує відповідь</tspan><tspan x="1050.0" dy="16.9">і кладе в неї той самий unique</tspan></text>
