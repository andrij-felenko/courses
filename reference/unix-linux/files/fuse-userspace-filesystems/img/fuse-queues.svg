<line x1="420.0" y1="154.0" x2="420.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="190.0" width="760.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="420.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1 · interrupts — FUSE_INTERRUPT; забирається поперед усього іншого</tspan></text>
<rect x="40.0" y="262.0" width="760.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="420.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2 · forget — FUSE_FORGET і FUSE_BATCH_FORGET; відповіді не буде</tspan></text>
<rect x="40.0" y="334.0" width="760.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="420.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">3 · pending — звичайні запити в порядку надходження</tspan></text>
<rect x="40.0" y="406.0" width="760.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="420.0" y="439.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">4 · bg_queue — фонові (readahead, writeback): у роботі не більше max_background</tspan></text>
