<rect x="40.0" y="616.0" width="760.0" height="60.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="420.0" y="650.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">ядро знаходить запит за unique, копіює тіло в буфер програми й будить її</tspan></text>
<text x="620.0" y="726.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Запити з черг interrupts і forget у processing не потрапляють — відповіді на них не буде.</text>
