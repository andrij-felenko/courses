<rect x="40.0" y="500.0" width="760.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#2457d6" stroke-width="1.6"/><text x="420.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">processing — хеш-таблиця за unique:</tspan><tspan x="420.0" dy="16.9">запити, вже видані демонові й ще без відповіді</tspan></text>
