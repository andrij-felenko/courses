<text x="825.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="825.0" dy="0.0">write(/dev/fuse):</tspan><tspan x="825.0" dy="15.6">відповідь із байтами</tspan></text>
<rect x="487.0" y="466.0" width="236.0" height="68.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="605.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">модуль fuse копіює байти</tspan><tspan x="605.0" dy="16.9">і будить програму</tspan></text>
<line x1="460.0" y1="570.0" x2="310.0" y2="570.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="385.0" y="543.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="385.0" dy="0.0">повернення з виклику</tspan></text>
<rect x="47.0" y="536.0" width="236.0" height="68.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="165.0" y="574.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">n == 4096, байти в buf</tspan></text>
<rect x="30.0" y="650.0" width="1150.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="605.0" y="682.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Червоні стрілки — перетини межі ядра. Їх два на кожен запит, і кожен коштує перемикання контексту та копіювання даних.</tspan><tspan x="605.0" dy="18.2">Для файлової системи всередині ядра таких перетинів немає жодного.</tspan></text>
</svg>