<line x1="1045.0" y1="322.0" x2="1045.0" y2="358.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="927.0" y="366.0" width="236.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#1a1a1a" stroke-width="1.4"/><text x="1045.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1045.0" dy="0.0">демон дістає байти</tspan><tspan x="1045.0" dy="16.9">звідки завгодно: мережа,</tspan><tspan x="1045.0" dy="16.9">архів, шифросховище</tspan></text>
