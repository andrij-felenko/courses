<text x="165.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програма</text>
<text x="165.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">простір користувача</text>
<text x="605.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро</text>
<text x="605.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">VFS і модуль fuse</text>
<text x="1045.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Демон файлової системи</text>
<text x="1045.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">теж простір користувача</text>
<rect x="47.0" y="116.0" width="236.0" height="68.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="165.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">read(fd, buf, 4096)</tspan><tspan x="165.0" dy="16.9">на файлі з /mnt/build</tspan></text>
<text x="385.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="385.0" dy="0.0">системний виклик</tspan></text>
<line x1="310.0" y1="150.0" x2="460.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="487.0" y="116.0" width="236.0" height="68.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="605.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">VFS бачить: цей inode</tspan><tspan x="605.0" dy="16.9">належить fuse</tspan></text>
<rect x="487.0" y="251.0" width="236.0" height="68.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="605.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">модуль fuse складає запит</tspan><tspan x="605.0" dy="16.9">і приспиняє програму</tspan></text>
<text x="825.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="825.0" dy="0.0">повідомлення FUSE_READ:</tspan><tspan x="825.0" dy="15.6">nodeid, зміщення, розмір</tspan></text>
<line x1="750.0" y1="285.0" x2="900.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
