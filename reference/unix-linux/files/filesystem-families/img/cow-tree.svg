<text x="60.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">сіре — старе дерево: воно цілісне до останньої миті</text>
<text x="60.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">червоне — нові копії: змінений листок і весь шлях над ним</text>
<text x="60.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">штрих зелений — незмінені гілки нове дерево ділить зі старим</text>
<text x="60.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">перемикання суперблока — один запис сектора; стану посередині не існує</text>
<text x="60.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">якщо старий корінь зберегти, він і є знімок</text>
