<text x="480.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">Окремі файлові дескриптори посилаються на один стійкий inode у псевдо-ФС pidfs</text>
</svg>