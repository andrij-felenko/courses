<text x="480.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Зв'язок дескрипторів із внутрішньою файловою системою pidfs</tspan></text>
<rect x="50.0" y="100.0" width="260.0" height="70.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
