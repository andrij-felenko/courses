<text x="785.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Inode у pidfs_mnt</tspan><tspan x="785.0" dy="16.9">stx_dev: pidfs (pseudo-dev)</tspan><tspan x="785.0" dy="16.9">stx_ino: 0x8f4a2b01c3... (64-bit)</tspan><tspan x="785.0" dy="16.9">Прив'язано до struct pid</tspan></text>
<line x1="590.0" y1="135.0" x2="660.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="235.0" x2="660.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="315.0" width="560.0" height="70.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/>
<text x="630.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Об'єкт ядра struct pid (процес-ціль)</tspan><tspan x="630.0" dy="16.9">Порівняння statx(fd1) == statx(fd2) дає ідентичні (stx_dev, stx_ino)</tspan><tspan x="630.0" dy="16.9">Навіть якщо процес завершено, inode у pidfs зберігає унікальність</tspan></text>
