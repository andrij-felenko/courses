<text x="180.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Процес-наглядач №2</tspan><tspan x="180.0" dy="16.9">pidfd = 9 (через SCM_RIGHTS)</tspan></text>
<rect x="370.0" y="100.0" width="220.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="480.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">struct file #1</tspan><tspan x="480.0" dy="15.6">(f_op = pidfs_file_operations)</tspan></text>
<rect x="370.0" y="200.0" width="220.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="480.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">struct file #2</tspan><tspan x="480.0" dy="15.6">(f_op = pidfs_file_operations)</tspan></text>
