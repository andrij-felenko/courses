<text x="660.0" y="738.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">Номери контекстів у заголовках для простору користувача не експортовані —</tspan><tspan x="660.0" dy="17.6">їх переписують до себе. Помилка в будь-якій клітинці дає правдоподібний чужий ключ.</tspan></text>
