<text x="225.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">солі немає, отже сіль = нулі</text>
<rect x="430.0" y="108.0" width="380.0" height="66.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">повідомлення — головний ключ, 16…64 Б</tspan></text>
<text x="620.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">приходить ЗЗОВНІ, ядро його не віддає</text>
