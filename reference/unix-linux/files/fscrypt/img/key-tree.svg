<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">що з чого виводять і що з цього лежить на носії відкрито</text>
<rect x="149.5" y="83.3" width="301.0" height="53.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="300.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">головний ключ</tspan><tspan x="300.0" dy="18.9">32–64 байти, тільки в пам'яті ядра</tspan></text>
<rect x="809.5" y="83.3" width="301.0" height="53.4" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="960.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">nonce файлу</tspan><tspan x="960.0" dy="18.9">16 випадкових байтів у xattr inode</tspan></text>
<rect x="505.0" y="232.0" width="250.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="630.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">HKDF-SHA512</tspan></text>
<line x1="300.0" y1="136.7" x2="540.0" y2="232.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="136.7" x2="720.0" y2="232.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="111.5" y="403.3" width="177.0" height="53.4" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ідентифікатор ключа</tspan><tspan x="200.0" dy="18.9">16 байтів</tspan></text>
<line x1="630.0" y1="268.0" x2="200.0" y2="403.3" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200.0" y="490.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">записаний у політику</tspan><tspan x="200.0" dy="17.6">ВІДКРИТО: каже, якого</tspan><tspan x="200.0" dy="17.6">ключа просить файл,</tspan><tspan x="200.0" dy="17.6">і не каже, який він</tspan></text>
<rect x="537.4" y="403.3" width="185.3" height="53.4" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">ключ файлу</tspan><tspan x="630.0" dy="18.9">свій у кожного inode</tspan></text>
<line x1="630.0" y1="268.0" x2="630.0" y2="403.3" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="630.0" y="490.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="630.0" dy="0.0">IV = номер блока у файлі;</tspan><tspan x="630.0" dy="17.6">однаковий IV у різних файлах</tspan><tspan x="630.0" dy="17.6">нешкідливий, бо ключі різні</tspan></text>
<rect x="967.4" y="403.3" width="185.3" height="53.4" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1060.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">ключ режиму</tspan><tspan x="1060.0" dy="18.9">один на всю політику</tspan></text>
<line x1="630.0" y1="268.0" x2="1060.0" y2="403.3" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1060.0" y="490.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">для апаратного шифрувальника,</tspan><tspan x="1060.0" dy="17.6">у якого лічені комірки ключів;</tspan><tspan x="1060.0" dy="17.6">IV = номер inode ‖ номер блока</tspan></text>
<line x1="60.0" y1="650.0" x2="1220.0" y2="650.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="640.0" y="686.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">на носії відкрито лежать: версія політики, ідентифікатор ключа, назви режимів і nonce кожного файлу.</tspan><tspan x="640.0" dy="18.2">Самого ключа немає ніде на носії — він з'являється лише в пам'яті ядра, коли його туди подали.</tspan></text>
</svg>