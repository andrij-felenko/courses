<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обсяг дії chroot</text>
<rect x="70.0" y="193.3" width="420.0" height="193.4" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ЩО МІНЯЄТЬСЯ</tspan><tspan x="280.0" dy="18.2"></tspan><tspan x="280.0" dy="18.2">одне поле в описі процесу:</tspan><tspan x="280.0" dy="18.2">звідки починати розбір шляху,</tspan><tspan x="280.0" dy="18.2">що написаний із «/»</tspan><tspan x="280.0" dy="18.2"></tspan><tspan x="280.0" dy="18.2">успадковується через fork,</tspan><tspan x="280.0" dy="18.2">переживає execve</tspan></text>
<rect x="570.0" y="175.1" width="420.0" height="229.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">ЩО ЛИШАЄТЬСЯ ТИМ САМИМ</tspan><tspan x="780.0" dy="18.2"></tspan><tspan x="780.0" dy="18.2">поточний каталог процесу</tspan><tspan x="780.0" dy="18.2">уже відкриті дескриптори</tspan><tspan x="780.0" dy="18.2">таблиця монтувань</tspan><tspan x="780.0" dy="18.2">uid, gid і можливості</tspan><tspan x="780.0" dy="18.2">PID-и, сигнали, ptrace</tspan><tspan x="780.0" dy="18.2">мережа й відкриті сокети</tspan><tspan x="780.0" dy="18.2">спільна пам'ять і черги</tspan><tspan x="780.0" dy="18.2">параметри ядра, модулі</tspan></text>
<text x="530.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">chroot: одна зміна — і все решта поза нею</text>
</svg>