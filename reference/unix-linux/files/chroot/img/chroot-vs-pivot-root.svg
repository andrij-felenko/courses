<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">chroot лишає старе дерево змонтованим, pivot_root — ні</text>
<rect x="40.0" y="40.0" width="480.0" height="540.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="280.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">chroot</text>
<rect x="110.0" y="123.0" width="340.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">монтування «/»</tspan><tspan x="280.0" dy="16.9">(усе дерево системи)</tspan></text>
<line x1="280.0" y1="186.0" x2="280.0" y2="224.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="110.0" y="233.1" width="340.0" height="53.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">каталог /new</tspan><tspan x="280.0" dy="16.9">— новий корінь процесу</tspan></text>
<rect x="70.0" y="340.0" width="420.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="280.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">старе дерево нікуди не поділося:</tspan><tspan x="280.0" dy="15.6">воно змонтоване й досяжне —</tspan><tspan x="280.0" dy="15.6">потрібен лише спосіб на нього послатися</tspan></text>
<rect x="70.0" y="460.0" width="420.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="494.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">оборона тримається на тому,</tspan><tspan x="280.0" dy="15.6">що процес утратив права</tspan></text>
<rect x="560.0" y="40.0" width="480.0" height="540.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="800.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">pivot_root у власному просторі монтувань</text>
<rect x="630.0" y="123.0" width="340.0" height="53.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">монтування «/»</tspan><tspan x="800.0" dy="16.9">— тепер це дерево контейнера</tspan></text>
<rect x="630.0" y="233.1" width="340.0" height="53.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="800.0" dy="0.0">старе дерево:</tspan><tspan x="800.0" dy="16.9">відмонтовано</tspan></text>
<rect x="590.0" y="340.0" width="420.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="800.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">у цьому просторі монтувань</tspan><tspan x="800.0" dy="15.6">старого кореня немає в таблиці —</tspan><tspan x="800.0" dy="15.6">послатися на нього нема чим</tspan></text>
<rect x="590.0" y="460.0" width="420.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="494.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">оборона тримається на тому,</tspan><tspan x="800.0" dy="15.6">що дороги не існує</tspan></text>
</svg>