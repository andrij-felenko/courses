<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок публікації і що лишить раптове вимкнення</text>
<rect x="158.3" y="86.5" width="283.3" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">open(dir, O_TMPFILE | O_RDWR, 0600)</tspan></text>
<rect x="236.1" y="166.5" width="127.7" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">write(): уміст</tspan></text>
<rect x="169.4" y="238.1" width="261.1" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">fchown(), fchmod(), fsetxattr():</tspan><tspan x="300.0" dy="16.9">власник, права, атрибути</tspan></text>
<rect x="195.4" y="336.5" width="209.2" height="37.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="300.0" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">fsync(fd): уміст на носії</tspan></text>
<rect x="199.1" y="436.5" width="201.8" height="37.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">linkat(): ім'я з'явилося</tspan></text>
<rect x="180.6" y="526.5" width="238.9" height="37.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="300.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">fsync(каталог): ім'я на носії</tspan></text>
<line x1="300.0" y1="128.5" x2="300.0" y2="159.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="208.5" x2="300.0" y2="231.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="296.9" x2="300.0" y2="329.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="378.5" x2="300.0" y2="429.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="478.5" x2="300.0" y2="519.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="646.1" y="188.1" width="327.8" height="53.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">збій тут: на носії не лишиться нічого —</tspan><tspan x="810.0" dy="16.9">імені не було, блоки поверне список сиріт</tspan></text>
<line x1="451.7" y1="310.0" x2="638.1" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="649.8" y="383.1" width="320.4" height="53.9" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="810.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">збій тут: ім'я могло не пережити збою,</tspan><tspan x="810.0" dy="16.9">але якщо пережило — уміст під ним повний</tspan></text>
<line x1="451.7" y1="405.0" x2="641.8" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.9" y="573.0" width="298.2" height="53.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="596.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">після цього кроку ім'я і повний уміст</tspan><tspan x="810.0" dy="16.9">переживуть будь-яке вимкнення</tspan></text>
<line x1="451.7" y1="583.0" x2="652.9" y2="600.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
