<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться безіменний файл: два шляхи</text>
<text x="70.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">класично</text>
<rect x="141.5" y="129.6" width="187.0" height="70.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">mkstemp()</tspan><tspan x="235.0" dy="16.9">створює /tmp/sort-a7Bx</tspan><tspan x="235.0" dy="16.9">і відкриває його</tspan></text>
<rect x="506.5" y="129.6" width="187.0" height="70.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ім'я лежить у каталозі</tspan><tspan x="600.0" dy="16.9">файл видно кожному,</tspan><tspan x="600.0" dy="16.9">хто читає /tmp</tspan></text>
<rect x="871.3" y="129.6" width="157.4" height="70.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">unlink()</tspan><tspan x="950.0" dy="16.9">імені немає,</tspan><tspan x="950.0" dy="16.9">дескриптор лишився</tspan></text>
<line x1="336.5" y1="165.0" x2="498.5" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="701.5" y1="165.0" x2="863.3" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">вікно: чужий процес устигає взяти на цей файл своє ім'я</text>
<text x="70.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">з O_TMPFILE</text>
<rect x="212.6" y="349.6" width="164.8" height="70.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="295.0" y="372.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">open(&quot;/var/tmp&quot;,</tspan><tspan x="295.0" dy="16.9">O_TMPFILE | O_RDWR,</tspan><tspan x="295.0" dy="16.9">0600)</tspan></text>
<rect x="655.4" y="349.6" width="209.2" height="70.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="372.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">безіменний inode</tspan><tspan x="760.0" dy="16.9">з першої ж миті:</tspan><tspan x="760.0" dy="16.9">запису в каталозі не було</tspan></text>
<line x1="385.4" y1="385.0" x2="647.4" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">вікна немає: імені не існувало жодної миті</text>
</svg>