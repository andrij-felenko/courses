<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 602" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="602" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні відповіді openat2 на ту саму втечу</text>
<text x="560.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">dirfd = /srv/box        шлях = &quot;link/passwd&quot;        /srv/box/link → /etc</text>
<rect x="30.0" y="86.0" width="320.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">resolve = 0</tspan></text>
<rect x="30.0" y="152.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">складник link — посилання</tspan><tspan x="190.0" dy="16.9">його вміст:  /etc</tspan><tspan x="190.0" dy="16.9">риска спереду → корінь процесу</tspan><tspan x="190.0" dy="16.9">обхід уже поза /srv/box</tspan></text>
<line x1="190.0" y1="348.0" x2="190.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="374.0" width="320.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">відкрито /etc/passwd</tspan><tspan x="190.0" dy="16.9">саме цієї діри й боялися</tspan></text>
<rect x="400.0" y="86.0" width="320.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="560.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">RESOLVE_BENEATH</tspan></text>
<rect x="400.0" y="152.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">абсолютне посилання</tspan><tspan x="560.0" dy="16.9">відкидається одразу:</tspan><tspan x="560.0" dy="16.9">його ціль не є нащадком</tspan><tspan x="560.0" dy="16.9">каталога dirfd</tspan></text>
<line x1="560.0" y1="348.0" x2="560.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="374.0" width="320.0" height="84.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="560.0" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">EXDEV</tspan><tspan x="560.0" dy="16.9">виклик не відбувся</tspan></text>
<rect x="770.0" y="86.0" width="320.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">RESOLVE_IN_ROOT</tspan></text>
<rect x="770.0" y="152.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">риска спереду означає</tspan><tspan x="930.0" dy="16.9">сам dirfd, а не корінь;</tspan><tspan x="930.0" dy="16.9">обхід іде далі, але</tspan><tspan x="930.0" dy="16.9">всередині /srv/box</tspan></text>
<line x1="930.0" y1="348.0" x2="930.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="374.0" width="320.0" height="84.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="403.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">відкрито</tspan><tspan x="930.0" dy="16.9">/srv/box/etc/passwd</tspan><tspan x="930.0" dy="16.9">нема такого → ENOENT</tspan></text>
<rect x="30.0" y="486.0" width="1060.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="521.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">BENEATH відмовляє, IN_ROOT замикає:</tspan><tspan x="560.0" dy="18.2">перший — для програми, що сама будує шляхи; другий — для тієї, що приймає чужі</tspan></text>
</svg>