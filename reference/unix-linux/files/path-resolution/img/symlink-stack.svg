<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить ядро, коли складник виявився посиланням</text>
<rect x="30.0" y="90.0" width="320.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="190.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">натрапили на посилання</tspan></text>
<rect x="30.0" y="156.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">розбираємо /var/log/app/today.log</tspan><tspan x="190.0" dy="16.9">пройдено:  /  →  var  →  log</tspan><tspan x="190.0" dy="16.9">складник app — посилання</tspan><tspan x="190.0" dy="16.9">його вміст:  ../../srv/logs</tspan></text>
<rect x="380.0" y="90.0" width="320.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">залишок відкладено</tspan></text>
<rect x="380.0" y="156.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">стек:  today.log</tspan><tspan x="540.0" dy="16.9">новий залишок:  ../../srv/logs</tspan><tspan x="540.0" dy="16.9">каталог обходу:  /var/log</tspan><tspan x="540.0" dy="16.9">перехід 1 із дозволених 40</tspan></text>
<rect x="730.0" y="90.0" width="320.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">залишок повернуто</tspan></text>
<rect x="730.0" y="156.0" width="320.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">«..» двічі →  /</tspan><tspan x="890.0" dy="16.9">далі srv, потім logs</tspan><tspan x="890.0" dy="16.9">стек порожній → беремо today.log</tspan><tspan x="890.0" dy="16.9">знайдено inode файлу</tspan></text>
<line x1="356.0" y1="250.0" x2="374.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="706.0" y1="250.0" x2="724.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="396.0" width="1020.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="540.0" y="429.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">посилання не веде до файлу — воно підмінює хвіст маршруту:</tspan><tspan x="540.0" dy="18.2">залишок відкладається, вміст посилання стає новим початком</tspan></text>
<rect x="30.0" y="496.0" width="1020.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="529.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">вміст, що починається з «/», скидає обхід на корінь процесу;</tspan><tspan x="540.0" dy="18.2">сорок підстановок на один розбір — і виклик повертає ELOOP</tspan></text>
</svg>