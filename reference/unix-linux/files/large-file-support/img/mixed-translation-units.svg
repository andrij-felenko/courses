<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">власна функція: імена збігаються, ширини — ні</text>
<rect x="70.0" y="78.0" width="440.0" height="92.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="290.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">a.o — зібрано з _FILE_OFFSET_BITS=64</tspan><tspan x="290.0" dy="18.2">викликає file_tail_offset(fd, back)</tspan></text>
<rect x="670.0" y="78.0" width="440.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="890.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">b.o — зібрано без макроса</tspan><tspan x="890.0" dy="18.2">визначає file_tail_offset(fd, back)</tspan></text>
<rect x="332.6" y="199.0" width="514.8" height="34.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">компонувальник: імена символів однакові — з’єднано мовчки</tspan></text>
<line x1="290.0" y1="176.0" x2="530.0" y2="194.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="890.0" y1="176.0" x2="650.0" y2="194.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">що кладе той, хто викликає (off_t на 8 байтів)</text>
<rect x="240.0" y="306.0" width="120.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="300.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">fd</tspan></text>
<rect x="370.0" y="306.0" width="330.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="535.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">back — молодші 32</tspan></text>
<rect x="710.0" y="306.0" width="330.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="875.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">back — старші 32</tspan></text>
<text x="240.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">що читає той, кого викликають (off_t на 4 байти)</text>
<rect x="240.0" y="424.0" width="120.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="300.0" y="457.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">fd</tspan></text>
<rect x="370.0" y="424.0" width="330.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="535.0" y="457.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">back — усе число</tspan></text>
<rect x="710.0" y="424.0" width="330.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="875.0" y="457.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">цей слот ніхто не читає</tspan></text>
<text x="590.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">плюс повернення: одна сторона віддає 32 біти там, де друга чекає 64</text>
<text x="590.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">ані попередження компілятора, ані помилки компонування — лише інші числа</text>
</svg>