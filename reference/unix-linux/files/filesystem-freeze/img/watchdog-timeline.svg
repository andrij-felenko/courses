<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три задачі навколо одного вікна заморожування</text>
<text x="40.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Сторож зводять ДО бар'єра: інакше він не покриває ні саме заморожування, ні смерть основного процесу</text>
<text x="620.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">вікно: файлова система зупинена</text>
<text x="185.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">основний процес</text>
<rect x="240.0" y="133.0" width="112.0" height="32.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="296.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="296.0" dy="0.0">syncfs()</tspan></text>
<rect x="360.0" y="133.0" width="110.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="415.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">FIFREEZE</tspan></text>
<rect x="470.0" y="133.0" width="360.0" height="32.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="650.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">утримання: тут роблять знімок</tspan></text>
<rect x="830.0" y="133.0" width="50.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="855.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="855.0" dy="0.0">FITHAW</tspan></text>
<text x="185.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">сторож</text>
<rect x="230.0" y="218.0" width="650.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="555.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">сон із дескриптором, відкритим заздалегідь</tspan></text>
<line x1="880.0" y1="234.0" x2="1080.0" y2="234.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="980.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">невитрачений запас</text>
<circle cx="886.0" cy="234.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="1080.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дедлайн</text>
<text x="185.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">писар</text>
<rect x="200.0" y="303.0" width="160.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">write() ≈ 0.1 мс</tspan></text>
<rect x="360.0" y="303.0" width="520.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="620.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="620.0" dy="0.0">стан D: непереривний сон, kill -9 не діє</tspan></text>
<rect x="880.0" y="303.0" width="300.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">той самий write() віддає</tspan></text>
<line x1="360.0" y1="372.0" x2="880.0" y2="372.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="360.0" y1="366.0" x2="360.0" y2="378.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="880.0" y1="366.0" x2="880.0" y2="378.0" stroke="#b8860b" stroke-width="2.0"/>
<text x="620.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">довжина вікна = FIFREEZE + утримання + FITHAW</text>
<line x1="200.0" y1="430.0" x2="1180.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="1180.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">час</text>
<line x1="230.0" y1="92.0" x2="230.0" y2="438.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="230.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">таймер</text>
<line x1="360.0" y1="92.0" x2="360.0" y2="438.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="360.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">FIFREEZE</text>
<line x1="880.0" y1="92.0" x2="880.0" y2="438.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="880.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">FITHAW</text>
<rect x="40.0" y="500.0" width="380.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Таймер, зведений після ioctl, не покриває самого заморожування:</tspan><tspan x="230.0" dy="13.0">на брудному кеші воно триває секунди, а на цій ділянці процес</tspan><tspan x="230.0" dy="13.0">уже може загинути з підвішеною файловою системою.</tspan></text>
<rect x="450.0" y="500.0" width="380.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Сторож — окремий процес із власним дескриптором. Він відтає</tspan><tspan x="640.0" dy="13.0">незалежно від долі основної логіки й не пише у вікні нічого:</tspan><tspan x="640.0" dy="13.0">спершу FITHAW, і лише потім повідомлення.</tspan></text>
<rect x="860.0" y="500.0" width="380.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1050.0" y="550.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Писар усередині вікна не «повільний», а зупинений. Він не бачить</tspan><tspan x="1050.0" dy="11.7">помилки й не переривається сигналом — його write() просто</tspan><tspan x="1050.0" dy="11.7">віддає керування через усю довжину вікна.</tspan></text>
<text x="40.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Три задачі, три ролі: одна тримає вікно, друга гарантує вихід із нього, третя називає його ціну числом.</text>
</svg>