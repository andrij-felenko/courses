<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно заморожування: хто добігає, хто чекає, куди падає знімок</text>
<text x="50.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Вікно заморожування: наявні писарі добігають, нові стають у чергу, знімок падає в тишу</text>
<rect x="420.0" y="112.0" width="480.0" height="478.0" rx="8" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.6"/>
<text x="660.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">вікно заморожування</text>
<text x="80.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">писар A</text>
<rect x="150.0" y="177.0" width="320.0" height="26.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="484.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">зайшов до бар'єра — його дочекалися</text>
<text x="80.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">писар B</text>
<rect x="150.0" y="237.0" width="355.0" height="26.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="519.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">довга транзакція — саме вона задає довжину чекання</text>
<text x="80.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">писар C</text>
<rect x="560.0" y="297.0" width="340.0" height="26.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="914.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">прийшов у вікно — спить непереривно до відтавання</text>
<text x="80.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">писар D</text>
<rect x="780.0" y="357.0" width="120.0" height="26.0" rx="5" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/>
<text x="914.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">те саме: жодного запису у вікні не проходить</text>
<text x="80.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">ядро</text>
<rect x="420.0" y="418.0" width="110.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="475.0" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">бар'єри</tspan></text>
<rect x="530.0" y="418.0" width="140.0" height="54.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">скидання на носій</tspan></text>
<rect x="670.0" y="418.0" width="120.0" height="54.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="441.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">журнал дописано,</tspan><tspan x="730.0" dy="14.3">суперблок чистий</tspan></text>
<text x="845.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тиша</text>
<line x1="90.0" y1="560.0" x2="1240.0" y2="560.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="1240.0" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">час</text>
<line x1="420.0" y1="112.0" x2="420.0" y2="568.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="420.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">FIFREEZE</text>
<line x1="900.0" y1="112.0" x2="900.0" y2="568.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="900.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">FITHAW</text>
<line x1="800.0" y1="150.0" x2="800.0" y2="568.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="3 4"/>
<circle cx="800.0" cy="176.0" r="15.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="800.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<text x="800.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">мить знімка</text>
<rect x="90.0" y="620.0" width="560.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="370.0" y="655.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Поза вікном знімок ловить середину операції:</tspan><tspan x="370.0" dy="16.9">монтування копії йде через відтворення журналу.</tspan></text>
<rect x="680.0" y="620.0" width="560.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="960.0" y="655.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">У вікні на носії немає нічого недописаного:</tspan><tspan x="960.0" dy="16.9">копія монтується як охайно розмонтований том.</tspan></text>
</svg>