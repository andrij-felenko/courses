<text x="655.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">O(1) Metadata update</text>
<line x1="530.0" y1="125.0" x2="530.0" y2="270.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="433.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Пряма передача
без User Space</text>
<text x="410.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">copy_file_range виконує копіювання в ядрі або делегує його апаратному сховищу (NFS SSC / CoW)</text>
