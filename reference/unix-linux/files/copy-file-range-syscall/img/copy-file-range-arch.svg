<rect x="133.7" y="253.1" width="142.6" height="53.9" rx="6" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/><text x="205.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Цільовий файл</tspan><tspan x="205.0" dy="16.9">(NVMe / Storage)</tspan></text>
<line x1="205.0" y1="140.0" x2="205.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">1. read() sys_call</text>
