<text x="615.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Zero-Copy: copy_file_range()</text>
<rect x="554.8" y="88.0" width="120.3" height="53.9" rx="6" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/><text x="615.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Вихідний файл</tspan><tspan x="615.0" dy="16.9">(fd_in)</tspan></text>
<rect x="484.4" y="168.1" width="261.1" height="53.9" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">VFS / Kernel Layer</tspan><tspan x="615.0" dy="16.9">(CoW Reflink / Server-Side Copy)</tspan></text>
<rect x="554.8" y="253.1" width="120.3" height="53.9" rx="6" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/><text x="615.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Цільовий файл</tspan><tspan x="615.0" dy="16.9">(fd_out)</tspan></text>
