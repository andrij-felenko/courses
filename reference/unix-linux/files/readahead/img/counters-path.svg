<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="40.0" width="300.0" height="82.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="180.0" y="77.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">програма:</tspan><tspan x="180.0" dy="16.9">pread(fd, buf, 4096)</tspan></text>
<rect x="30.0" y="192.0" width="300.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="180.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">кеш сторінок</tspan></text>
<rect x="30.0" y="344.0" width="300.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="180.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">блоковий рівень:</tspan><tspan x="180.0" dy="16.9">злиття запитів і черга</tspan></text>
<rect x="30.0" y="496.0" width="300.0" height="82.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.6"/><text x="180.0" y="541.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">накопичувач</tspan></text>
<line x1="180.0" y1="122.0" x2="180.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="180.0" y1="157.0" x2="374.0" y2="157.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="380.0" y="114.0" width="300.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="530.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">rchar, syscr</tspan><tspan x="530.0" dy="16.2">/proc/self/io</tspan></text>
<rect x="720.0" y="114.0" width="510.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="975.0" y="137.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">скільки байтів повернули виклики читання.</tspan><tspan x="975.0" dy="15.6">Влучання в кеш рахуються теж — тому сам собою</tspan><tspan x="975.0" dy="15.6">цей лічильник про носій не каже нічого.</tspan><tspan x="975.0" dy="15.6">Через відображення в пам'ять він і зовсім нуль.</tspan></text>
<line x1="180.0" y1="274.0" x2="180.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="180.0" y1="309.0" x2="374.0" y2="309.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="380.0" y="266.0" width="300.0" height="86.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="530.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">read_bytes</tspan><tspan x="530.0" dy="16.2">/proc/self/io</tspan></text>
<rect x="720.0" y="266.0" width="510.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="975.0" y="289.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">скільки байтів це завдання справді замовило</tspan><tspan x="975.0" dy="15.6">з носія — разом із прочитаним наперед.</tspan><tspan x="975.0" dy="15.6">У гарячому прогоні тут нуль: влучання</tspan><tspan x="975.0" dy="15.6">в кеш сюди не доходить.</tspan></text>
<line x1="180.0" y1="426.0" x2="180.0" y2="492.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="180.0" y1="461.0" x2="374.0" y2="461.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="380.0" y="418.0" width="300.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="530.0" y="457.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">поля 1 і 3</tspan><tspan x="530.0" dy="16.2">/sys/dev/block/M:m/stat</tspan></text>
<rect x="720.0" y="418.0" width="510.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="975.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">скільки вийшло ЗАПИТІВ і по скільки секторів</tspan><tspan x="975.0" dy="15.6">у кожному — уже після злиття сусідніх.</tspan><tspan x="975.0" dy="15.6">Рахує весь пристрій, а не лише нас:</tspan><tspan x="975.0" dy="15.6">міряти треба на тихій машині.</tspan></text>
<text x="30.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">три числа — три різні питання; саме розбіжність між ними й міряє випереджувальне читання</text>
</svg>