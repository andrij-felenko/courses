<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="25.0" width="1120.0" height="45.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="620.0" y="53.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Механізм вивільнення пам'яті dcache під керуванням ядра (Memory Pressure)</tspan></text>
<rect x="60.0" y="90.0" width="340.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Нестача вільної пам'яті (RAM)</tspan><tspan x="230.0" dy="13.0">• Аллокатор сторінок досяг нижньої межі (low watermark)</tspan><tspan x="230.0" dy="13.0">• Пробудження фонового демона kswapd</tspan><tspan x="230.0" dy="13.0">• Або пряме витіснення (direct reclaim)</tspan></text>
<rect x="450.0" y="90.0" width="340.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2. Ядерний інтерфейс struct shrinker</tspan><tspan x="620.0" dy="14.3">• Реєстрація зворотних викликів підсистем VFS</tspan><tspan x="620.0" dy="14.3">• Метод count_objects() оцінює розмір Unused dentry</tspan><tspan x="620.0" dy="14.3">• Метод scan_objects() ініціює вивільнення</tspan></text>
<rect x="840.0" y="90.0" width="340.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">3. Функція prune_dcache_sb()</tspan><tspan x="1010.0" dy="15.6">• Обхід per-NUMA / per-memcg списків list_lru</tspan><tspan x="1010.0" dy="15.6">• Вилучення найстаріших dentry (d_count == 0)</tspan><tspan x="1010.0" dy="15.6">• Виклик dentry_kill() та iput(inode)</tspan></text>
<line x1="405.0" y1="145.0" x2="445.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795.0" y1="145.0" x2="835.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="230.0" width="1120.0" height="380.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="80.0" y="245.0" width="1080.0" height="40.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Регулювання балансу витіснення через /proc/sys/vm/vfs_cache_pressure</tspan></text>
<rect x="80.0" y="305.0" width="340.0" height="200.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">vfs_cache_pressure = 50 (&lt; 100)</tspan><tspan x="250.0" dy="11.7">Пріоритет збереження метаданих</tspan><tspan x="250.0" dy="11.7">───────────────────────────</tspan><tspan x="250.0" dy="11.7">• Ядро менш охоче скидає dcache та icache.</tspan><tspan x="250.0" dy="11.7">• Агресивніше витісняються сторінки даних (page cache).</tspan><tspan x="250.0" dy="11.7">• Вигідно для компіляторів, Git, веб-серверів із мільйонами дрібних файлів.</tspan><tspan x="250.0" dy="11.7">• Ризик: вищий тиск на пам'ять при великих файлах.</tspan></text>
<rect x="450.0" y="305.0" width="340.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">vfs_cache_pressure = 100 (Default)</tspan><tspan x="620.0" dy="11.7">Збалансоване витіснення</tspan><tspan x="620.0" dy="11.7">───────────────────────────</tspan><tspan x="620.0" dy="11.7">• Справедливий паритет 1:1 між page cache та dentry/inode cache.</tspan><tspan x="620.0" dy="11.7">• Кількість записів dcache, що скидаються, пропорційна загальному скануванню сторінок.</tspan><tspan x="620.0" dy="11.7">• Оптимально для більшості стандартних робочих навантажень.</tspan></text>
<rect x="820.0" y="305.0" width="340.0" height="200.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1008.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1008.0" dy="0.0">vfs_cache_pressure = 500 (&gt; 100)</tspan><tspan x="1008.0" dy="11.7">Агресивне очищення метаданих</tspan><tspan x="1008.0" dy="11.7">───────────────────────────</tspan><tspan x="1008.0" dy="11.7">• Ядро скидає dentry та inode кеші у 5 разів агресивніше за page cache.</tspan><tspan x="1008.0" dy="11.7">• Звільняє slab-пам'ять при перших ознаках браку RAM.</tspan><tspan x="1008.0" dy="11.7">• Вигідно для streaming баз даних, транскодування відео (де важливі сторінки даних).</tspan></text>
<rect x="80.0" y="520.0" width="1080.0" height="75.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.2"/><text x="620.0" y="553.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Формула розрахунку сканування dcache:</tspan><tspan x="620.0" dy="15.6">objects_to_scan = (unused_dentries * scan_pages * vfs_cache_pressure) / (total_reclaimable_pages * 100)</tspan></text>
<rect x="60.0" y="630.0" width="1120.0" height="120.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="670.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ручне скидання кешів простору ядра (Drop Caches):</tspan><tspan x="620.0" dy="15.6">• sync &amp;&amp; echo 2 &gt; /proc/sys/vm/drop_caches  → скидає всі Unused dentry та неактивні inode.</tspan><tspan x="620.0" dy="15.6">• sync &amp;&amp; echo 3 &gt; /proc/sys/vm/drop_caches  → скидає pagecache + dentry + inodes.</tspan><tspan x="620.0" dy="15.6">Active dentry (d_count &gt; 0) залишаються в пам'яті та захищені від скидання.</tspan></text>
</svg>