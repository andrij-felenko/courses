<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="30.0" width="1120.0" height="50.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="620.0" y="60.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Стани запису каталогу (dentry lifecycle) та переходи між ними</tspan></text>
<rect x="60.0" y="130.0" width="280.0" height="90.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Виділення пам'яті: d_alloc()</tspan><tspan x="200.0" dy="16.9">slab кеш: dentry_cache</tspan><tspan x="200.0" dy="16.9">d_count = 1, d_inode = NULL</tspan></text>
<rect x="460.0" y="110.0" width="340.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="630.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">СТАН: Active (Використовуваний)</tspan><tspan x="630.0" dy="16.9">• d_count &gt; 0, d_inode != NULL</tspan><tspan x="630.0" dy="16.9">• Відкритий процесом, cwd або предок</tspan><tspan x="630.0" dy="16.9">• НЕ перебуває в чергах LRU</tspan><tspan x="630.0" dy="16.9">• Захищений від вивільнення пам'яті</tspan></text>
<rect x="880.0" y="110.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1030.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">СТАН: Negative (Негативний)</tspan><tspan x="1030.0" dy="15.6">• d_inode == NULL (файл відсутній)</tspan><tspan x="1030.0" dy="15.6">• Кешує факт помилки ENOENT</tspan><tspan x="1030.0" dy="15.6">• Може бути Active або Unused (в LRU)</tspan><tspan x="1030.0" dy="15.6">• Запобігає дисковим перевіркам</tspan></text>
<rect x="460.0" y="380.0" width="340.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="630.0" y="427.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">СТАН: Unused (Невикористовуваний)</tspan><tspan x="630.0" dy="13.0">• d_count == 0, d_inode != NULL</tspan><tspan x="630.0" dy="13.0">• Знаходиться у списку super_block-&gt;s_dentry_lru</tspan><tspan x="630.0" dy="13.0">• Залишається в dentry_hashtable (швидкий хіт)</tspan><tspan x="630.0" dy="13.0">• Кандидат на вивільнення при брак пам'яті</tspan></text>
<rect x="460.0" y="620.0" width="340.0" height="100.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="649.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Звільнення: dentry_kill()</tspan><tspan x="630.0" dy="16.9">• Видалення з хешу d_drop() та з LRU</tspan><tspan x="630.0" dy="16.9">• iput(d_inode) декрементує inode</tspan><tspan x="630.0" dy="16.9">• call_rcu() → kmem_cache_free()</tspan></text>
<line x1="345.0" y1="175.0" x2="455.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">d_instantiate()</text>
<line x1="200.0" y1="125.0" x2="875.0" y2="125.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">i_op-&gt;lookup() повернув NULL → d_add(dentry, NULL)</text>
<line x1="580.0" y1="245.0" x2="580.0" y2="375.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">dput() (d_count == 0)</text>
<line x1="680.0" y1="375.0" x2="680.0" y2="245.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="740.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">dget() (кеш-хіт)</text>
<line x1="805.0" y1="175.0" x2="875.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="840.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">d_delete()</text>
<line x1="875.0" y1="210.0" x2="805.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="840.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">d_instantiate()</text>
<line x1="630.0" y1="525.0" x2="630.0" y2="615.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">dcache shrinker (пам'ятний тиск)</text>
<line x1="1030.0" y1="245.0" x2="680.0" y2="620.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="910.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">витіснення з LRU</text>
</svg>