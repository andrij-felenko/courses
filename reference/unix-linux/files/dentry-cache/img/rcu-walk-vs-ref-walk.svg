<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="20.0" width="1160.0" height="45.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="630.0" y="48.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Механізм розбору шляхів у Linux: паралельний RCU-walk проти блокувального Ref-walk</tspan></text>
<rect x="50.0" y="80.0" width="560.0" height="540.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="70.0" y="90.0" width="520.0" height="40.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">RCU-walk (LOOKUP_RCU) — Швидкий шлях</tspan></text>
<rect x="70.0" y="140.0" width="520.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/><text x="330.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">1. Вхід у критичну секцію RCU</tspan><tspan x="330.0" dy="14.3">rcu_read_lock() — забороняє вивільнення пам'яті об'єктів.</tspan><tspan x="330.0" dy="14.3">Жодних блокувань і змін d_count (0 atomic операцій!).</tspan></text>
<line x1="330.0" y1="217.0" x2="330.0" y2="228.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="230.0" width="520.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/><text x="330.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">2. Отримання послідовності seqlock</tspan><tspan x="330.0" dy="14.3">seq = read_seqcount_begin(&amp;dentry-&gt;d_seq);</tspan><tspan x="330.0" dy="14.3">Фіксує версію стану dentry перед читанням полів.</tspan></text>
<line x1="330.0" y1="307.0" x2="330.0" y2="318.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="320.0" width="520.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/><text x="330.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">3. Читання полів та хеш-пошук</tspan><tspan x="330.0" dy="14.3">Звірка d_parent, hashlen та рядка d_name.</tspan><tspan x="330.0" dy="14.3">Отримання вказівника d_inode без взяття spinlock.</tspan></text>
<line x1="330.0" y1="397.0" x2="330.0" y2="408.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="410.0" width="520.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/><text x="330.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">4. Перевірка цілісності (Seqlock Validation)</tspan><tspan x="330.0" dy="14.3">if (read_seqcount_retry(&amp;dentry-&gt;d_seq, seq)) → FAIL</tspan><tspan x="330.0" dy="14.3">Якщо під час читання dentry змінився, перевірка провалюється.</tspan></text>
<line x1="330.0" y1="487.0" x2="330.0" y2="498.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70.0" y="510.0" width="520.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/><text x="330.0" y="537.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">5. Успішний перехід до нащадка</tspan><tspan x="330.0" dy="14.3">Поточний dentry стає новим parent.</tspan><tspan x="330.0" dy="14.3">Продовжуємо RCU-walk для наступного компонента шляху.</tspan></text>
<rect x="650.0" y="80.0" width="560.0" height="540.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="670.0" y="90.0" width="520.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="930.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">Ref-walk (LOOKUP_REPARSE) — Повільний шлях</tspan></text>
<rect x="670.0" y="140.0" width="520.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="930.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">1. Блокування та посилання</tspan><tspan x="930.0" dy="14.3">dget(dentry) — атомарний інкремент лічильника посилань.</tspan><tspan x="930.0" dy="14.3">Спричиняє cacheline contention на багатоядерних CPU.</tspan></text>
<line x1="930.0" y1="217.0" x2="930.0" y2="228.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="230.0" width="520.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="930.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">2. Обробка промахів (lookup_slow)</tspan><tspan x="930.0" dy="14.3">dir-&gt;i_op-&gt;lookup() — файлова система читає диск.</tspan><tspan x="930.0" dy="14.3">Процес може засинати в очікуванні блокового I/O.</tspan></text>
<line x1="930.0" y1="307.0" x2="930.0" y2="318.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="320.0" width="520.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="930.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">3. Обробка складних переходів</tspan><tspan x="930.0" dy="14.3">Читання символьних посилань (symlinks, vfs_readlink).</tspan><tspan x="930.0" dy="14.3">Перетин точок монтування із взяттям mount_lock.</tspan></text>
<line x1="930.0" y1="397.0" x2="930.0" y2="408.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="410.0" width="520.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="930.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">4. Кастомна валідація d_revalidate()</tspan><tspan x="930.0" dy="14.3">Виклик d_op-&gt;d_revalidate() у мережевих ФС (NFS, CIFS)</tspan><tspan x="930.0" dy="14.3">із можливістю відправки RPC-запитів по мережі.</tspan></text>
<line x1="930.0" y1="487.0" x2="930.0" y2="498.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670.0" y="510.0" width="520.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="930.0" y="537.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">5. Завершення обходу</tspan><tspan x="930.0" dy="14.3">Повернення знайденого struct path (dentry + vfsmount).</tspan><tspan x="930.0" dy="14.3">Звільнення проміжних посилань через dput().</tspan></text>
<rect x="50.0" y="650.0" width="1160.0" height="160.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/>
<rect x="70.0" y="660.0" width="1120.0" height="30.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/><text x="630.0" y="679.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Точка відкату: unlazy_walk() та legitimize_path()</tspan></text>
<rect x="70.0" y="700.0" width="1120.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="630.0" y="728.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Коли RCU-walk не може продовжити роботу (symlink, монтування, промах у dcache, збій seqlock):</tspan><tspan x="630.0" dy="15.6">1. Викликається legitimize_path() — спроба атомарно взяти dget() на поточному dentry через lockref_get_not_dead().</tspan><tspan x="630.0" dy="15.6">2. У разі успіху — обхід безпечно переходить у Ref-walk для решти шляху без повернення на старт.</tspan><tspan x="630.0" dy="15.6">3. У разі невдачі — повний перезапуск обходу від самого кореня у режимі Ref-walk з блокуваннями.</tspan></text>
<line x1="330.0" y1="622.0" x2="330.0" y2="648.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">Fallback</text>
<line x1="930.0" y1="648.0" x2="930.0" y2="622.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="990.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">Перехід</text>
</svg>