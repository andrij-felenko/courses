<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проходи e2fsck: порядок диктує залежність за даними</text>
<rect x="50.0" y="80.0" width="660.0" height="128.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="50.0" y="80.0" width="660.0" height="40.0" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прохід 1 — inode, блоки, розміри</tspan></text>
<rect x="70.0" y="132.0" width="620.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">читає всі inode поспіль; для кожного зайнятого обходить</tspan><tspan x="380.0" dy="16.9">карту блоків і ловить неможливі значення</tspan></text>
<line x1="715.0" y1="144.0" x2="765.0" y2="144.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="108.0" width="400.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">дає: власні бітові карти</tspan><tspan x="970.0" dy="16.9">зайнятих блоків та inode</tspan></text>
<line x1="380.0" y1="208.0" x2="380.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="240.0" width="660.0" height="128.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="50.0" y="240.0" width="660.0" height="40.0" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прохід 2 — структура каталогів</tspan></text>
<rect x="70.0" y="292.0" width="620.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">перевіряє записи каталогів; номер має вести на inode,</tspan><tspan x="380.0" dy="16.9">позначений зайнятим у карті з проходу 1</tspan></text>
<line x1="715.0" y1="304.0" x2="765.0" y2="304.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="268.0" width="400.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">дає: скільки разів кожен</tspan><tspan x="970.0" dy="16.9">номер згадано в каталогах</tspan></text>
<line x1="380.0" y1="368.0" x2="380.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="400.0" width="660.0" height="128.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="50.0" y="400.0" width="660.0" height="40.0" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прохід 3 — зв'язність каталогів</tspan></text>
<rect x="70.0" y="452.0" width="620.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="479.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">від кожного каталогу йде вгору за записом «..»;</tspan><tspan x="380.0" dy="16.9">гілка, що не дістає кореня, чіпляється до lost+found</tspan></text>
<line x1="715.0" y1="464.0" x2="765.0" y2="464.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="428.0" width="400.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="460.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">дає: перелік каталогів,</tspan><tspan x="970.0" dy="16.9">досяжних від кореня</tspan></text>
<line x1="380.0" y1="528.0" x2="380.0" y2="560.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="560.0" width="660.0" height="128.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="50.0" y="560.0" width="660.0" height="40.0" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прохід 4 — лічильники імен</tspan></text>
<rect x="70.0" y="612.0" width="620.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="639.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">звіряє пораховане на проході 2 з полем st_nlink;</tspan><tspan x="380.0" dy="16.9">inode без жодного імені йде до lost+found</tspan></text>
<line x1="715.0" y1="624.0" x2="765.0" y2="624.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="588.0" width="400.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="620.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">дає: виправлені лічильники</tspan><tspan x="970.0" dy="16.9">імен у самих inode</tspan></text>
<line x1="380.0" y1="688.0" x2="380.0" y2="720.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="720.0" width="660.0" height="128.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="50.0" y="720.0" width="660.0" height="40.0" rx="10" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="380.0" y="745.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Прохід 5 — зведені відомості</tspan></text>
<rect x="70.0" y="772.0" width="620.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="799.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">карти з проходу 1 лягають поверх дискових, лічильники</tspan><tspan x="380.0" dy="16.9">вільного місця перераховуються, том стає чистим</tspan></text>
<line x1="715.0" y1="784.0" x2="765.0" y2="784.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="748.0" width="400.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="780.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">дає: узгоджений том,</tspan><tspan x="970.0" dy="16.9">який можна монтувати</tspan></text>
<text x="610.0" y="908.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">кожен прохід ставить питання, відповідь на яке лежить у таблиці попереднього</text>
</svg>