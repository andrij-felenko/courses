<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="500.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="20.0" y="15.0" width="800.0" height="35.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="420.0" y="37.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Структура struct statx у пам'яті (фіксований розмір 256 байтів)</tspan></text><rect x="20.0" y="60.0" width="190.0" height="48.0" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/><text x="115.0" y="81.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">stx_mask (4B)</tspan><tspan x="115.0" dy="11.7">Маска заповнених полів</tspan></text><rect x="220.0" y="60.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="81.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">stx_blksize (4B)</tspan><tspan x="315.0" dy="11.7">Оптимальний блок вводу/виводу</tspan></text><rect x="420.0" y="60.0" width="400.0" height="48.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="81.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">stx_attributes (8B)</tspan><tspan x="620.0" dy="11.7">Розширені прапорці файлу (compressed, immutable, dax, verity)</tspan></text><rect x="20.0" y="118.0" width="150.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">stx_nlink (4B)</tspan><tspan x="95.0" dy="11.7">Жорсткі посилання</tspan></text><rect x="180.0" y="118.0" width="150.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">stx_uid (4B)</tspan><tspan x="255.0" dy="11.7">Власник (UID)</tspan></text><rect x="340.0" y="118.0" width="150.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">stx_gid (4B)</tspan><tspan x="415.0" dy="11.7">Група (GID)</tspan></text><rect x="500.0" y="118.0" width="160.0" height="48.0" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/><text x="580.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">stx_mode (2B)</tspan><tspan x="580.0" dy="11.7">Тип і права доступу</tspan></text><rect x="670.0" y="118.0" width="150.0" height="48.0" rx="6" fill="#eaeded" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">__spare0 (2B)</tspan><tspan x="745.0" dy="11.7">Вирівнювання</tspan></text><rect x="20.0" y="176.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">stx_ino (8B)</tspan><tspan x="115.0" dy="11.7">Номер inode (64 біти)</tspan></text><rect x="220.0" y="176.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">stx_size (8B)</tspan><tspan x="315.0" dy="11.7">Розмір файлу в байтах</tspan></text><rect x="420.0" y="176.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">stx_blocks (8B)</tspan><tspan x="515.0" dy="11.7">Блоки по 512 байтів</tspan></text><rect x="620.0" y="176.0" width="200.0" height="48.0" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="197.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">stx_attributes_mask (8B)</tspan><tspan x="720.0" dy="11.7">Маска підтримуваних атрибутів</tspan></text><rect x="20.0" y="234.0" width="190.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="115.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">stx_atime (16B)</tspan><tspan x="115.0" dy="11.7">Час останнього доступу</tspan><tspan x="115.0" dy="11.7">(tv_sec 64b + tv_nsec 32b)</tspan></text><rect x="220.0" y="234.0" width="190.0" height="52.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="315.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">stx_btime (16B)</tspan><tspan x="315.0" dy="11.7">Час створення (birth time)</tspan><tspan x="315.0" dy="11.7">(tv_sec 64b + tv_nsec 32b)</tspan></text><rect x="420.0" y="234.0" width="190.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="515.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">stx_ctime (16B)</tspan><tspan x="515.0" dy="11.7">Час зміни статусу inode</tspan><tspan x="515.0" dy="11.7">(tv_sec 64b + tv_nsec 32b)</tspan></text><rect x="620.0" y="234.0" width="200.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="720.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">stx_mtime (16B)</tspan><tspan x="720.0" dy="11.7">Час зміни вмісту файлу</tspan><tspan x="720.0" dy="11.7">(tv_sec 64b + tv_nsec 32b)</tspan></text><rect x="20.0" y="296.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="317.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">stx_rdev_* (8B)</tspan><tspan x="115.0" dy="11.7">Major/Minor пристрою</tspan></text><rect x="220.0" y="296.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="317.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">stx_dev_* (8B)</tspan><tspan x="315.0" dy="11.7">Major/Minor файлової системи</tspan></text><rect x="420.0" y="296.0" width="400.0" height="48.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="620.0" y="317.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">stx_mnt_id (8B)</tspan><tspan x="620.0" dy="11.7">Ідентифікатор точки монтування (Linux 5.8 / 6.8 unique)</tspan></text><rect x="20.0" y="354.0" width="390.0" height="48.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="215.0" y="375.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">stx_dio_mem_align &amp; stx_dio_offset_align (8B)</tspan><tspan x="215.0" dy="11.7">Вимоги до вирівнювання буфера та зсуву для O_DIRECT (Linux 6.1)</tspan></text><rect x="420.0" y="354.0" width="400.0" height="48.0" rx="6" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="620.0" y="375.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">stx_atomic_write_* (16B)</tspan><tspan x="620.0" dy="11.7">Атомарні межі запису min/max/segments (Linux 6.11)</tspan></text><rect x="20.0" y="412.0" width="800.0" height="42.0" rx="6" fill="#f2f4f4" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="430.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">__spare2 / Padding reserve (~80B)</tspan><tspan x="420.0" dy="11.7">Резервні байти для збереження ABI-сумісності при розширенні ядра у майбутньому</tspan></text>
