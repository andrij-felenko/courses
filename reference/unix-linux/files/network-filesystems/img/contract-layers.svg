<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чинні опції монтування — не те, що написали у fstab</text>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">КЛІЄНТ просить</text>
<rect x="40.0" y="92.0" width="340.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="210.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">vers=4.2</tspan><tspan x="210.0" dy="17.6">rw</tspan><tspan x="210.0" dy="17.6">sec=krb5p</tspan><tspan x="210.0" dy="17.6">nconnect=8</tspan><tspan x="210.0" dy="17.6">actimeo=30</tspan></text>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рядок у /etc/fstab</text>
<text x="1030.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">СЕРВЕР дозволяє</text>
<rect x="860.0" y="92.0" width="340.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1030.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">rw</tspan><tspan x="1030.0" dy="17.6">root_squash</tspan><tspan x="1030.0" dy="17.6">sec=krb5</tspan><tspan x="1030.0" dy="17.6">sync</tspan><tspan x="1030.0" dy="17.6">no_subtree_check</tspan></text>
<text x="1030.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рядок у /etc/exports</text>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">по дроту</text>
<rect x="460.0" y="112.0" width="320.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="620.0" y="145.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">узгодження версії,</tspan><tspan x="620.0" dy="16.9">розмірів читання-запису</tspan><tspan x="620.0" dy="16.9">та способу автентифікації</tspan></text>
<line x1="392.0" y1="158.0" x2="452.0" y2="158.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="848.0" y1="158.0" x2="788.0" y2="158.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="620.0" y1="212.0" x2="620.0" y2="262.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="270.0" width="1160.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="620.0" y="313.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">ЧИННИЙ КОНТРАКТ — перетин усіх трьох, і побачити його можна лише тут:</tspan><tspan x="620.0" dy="18.2">/proc/mounts   ·   findmnt   ·   nfsstat -m</tspan></text>
<text x="620.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">звідки беруться три найчастіші несподіванки</text>
<rect x="40.0" y="436.0" width="340.0" height="170.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="210.0" y="500.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">просили vers=4.2</tspan><tspan x="210.0" dy="16.9">сервер уміє 4.1</tspan><tspan x="210.0" dy="16.9">→ чинне vers=4.1</tspan><tspan x="210.0" dy="16.9">тиха підміна, монтування вдалося</tspan></text>
<rect x="450.0" y="436.0" width="340.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="620.0" y="500.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">просили rw</tspan><tspan x="620.0" dy="16.9">в експорті ro</tspan><tspan x="620.0" dy="16.9">→ монтується як завжди,</tspan><tspan x="620.0" dy="16.9">а перший запис дає EROFS</tspan></text>
<rect x="860.0" y="436.0" width="340.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1030.0" y="500.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">просили sec=sys</tspan><tspan x="1030.0" dy="16.9">в експорті sec=krb5</tspan><tspan x="1030.0" dy="16.9">→ сервер відмовляє,</tspan><tspan x="1030.0" dy="16.9">монтування не виникає взагалі</tspan></text>
</svg>