<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки триває мовчання сервера, перш ніж воно стане подією</text>
<line x1="90.0" y1="210.0" x2="700.0" y2="210.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="120.0" cy="210.0" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="120.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0 с</text>
<text x="120.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запит пішов</text>
<circle cx="330.0" cy="210.0" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="330.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">60 с</text>
<text x="330.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тиша → повтор №1</text>
<circle cx="610.0" cy="210.0" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="610.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">180 с</text>
<text x="610.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тиша → великий таймаут</text>
<rect x="90.0" y="268.0" width="610.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="395.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">timeo=600 децисекунд = 60 с; після кожного повтору чекання росте</tspan><tspan x="395.0" dy="16.2">рівно на timeo (лінійний приріст), стеля — 600 с</tspan></text>
<line x1="700.0" y1="210.0" x2="756.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="164.0" width="180.0" height="92.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="850.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">retrans=2</tspan><tspan x="850.0" dy="16.2">вичерпано:</tspan><tspan x="850.0" dy="16.2">«server not</tspan><tspan x="850.0" dy="16.2">responding»</tspan></text>
<line x1="946.0" y1="188.0" x2="996.0" y2="118.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1000.0" y="62.0" width="210.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1105.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">hard</tspan><tspan x="1105.0" dy="15.6">(типове для NFS)</tspan><tspan x="1105.0" dy="15.6">повторювати далі:</tspan><tspan x="1105.0" dy="15.6">процес у стані D,</tspan><tspan x="1105.0" dy="15.6">жодного байта не втрачено</tspan></text>
<line x1="946.0" y1="232.0" x2="996.0" y2="322.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1000.0" y="268.0" width="210.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1105.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">soft → EIO</tspan><tspan x="1105.0" dy="15.6">softerr → ETIMEDOUT</tspan><tspan x="1105.0" dy="15.6">перша відмова аж</tspan><tspan x="1105.0" dy="15.6">на третій хвилині,</tspan><tspan x="1105.0" dy="15.6">а записане в кеші</tspan><tspan x="1105.0" dy="15.6">віддати вже нікуди</tspan></text>
<rect x="90.0" y="400.0" width="780.0" height="66.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="480.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">У клієнта cifs типове значення протилежне — soft: програма дістає помилку замість того,</tspan><tspan x="480.0" dy="16.2">щоб чекати повернення сервера. Це найчастіша причина «різної» поведінки NFS і SMB при обриві.</tspan></text>
</svg>