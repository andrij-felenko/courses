<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Друга копія правди: питати самому або чекати, поки скажуть</text>
<rect x="30.0" y="55.0" width="540.0" height="480.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">клієнт питає  —  NFSv3</text>
<rect x="55.0" y="121.0" width="490.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="300.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">клієнт має копію файлу</tspan><tspan x="300.0" dy="16.9">і довіряє їй, поки не спливе таймер</tspan></text>
<line x1="300.0" y1="178.0" x2="300.0" y2="208.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="213.0" width="490.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="300.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">файл змінили на сервері —</tspan><tspan x="300.0" dy="16.9">сповіщення не буде, сервер не пам'ятає нікого</tspan></text>
<line x1="300.0" y1="270.0" x2="300.0" y2="300.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="305.0" width="490.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="300.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">клієнт упевнено відповідає застарілим</tspan><tspan x="300.0" dy="16.9">усе вікно між перевірками</tspan></text>
<line x1="300.0" y1="362.0" x2="300.0" y2="392.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="397.0" width="490.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="300.0" y="419.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">таймер сплив → запит атрибутів →</tspan><tspan x="300.0" dy="16.9">кеш викинуто, дані знову свіжі</tspan></text>
<rect x="55.0" y="455.0" width="490.0" height="60.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="300.0" y="481.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">вікно застарілості = період перевірки</tspan><tspan x="300.0" dy="16.2">сервер не коштує нічого, клієнт платить обмінами</tspan></text>
<rect x="650.0" y="55.0" width="540.0" height="480.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="920.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">сервер каже  —  SMB, делегації NFSv4</text>
<rect x="675.0" y="121.0" width="490.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="920.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">клієнт має копію</tspan><tspan x="920.0" dy="16.9">і виданий сервером дозвіл кешувати</tspan></text>
<line x1="920.0" y1="178.0" x2="920.0" y2="208.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="675.0" y="213.0" width="490.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="920.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">той самий файл відкриває інший клієнт</tspan></text>
<line x1="920.0" y1="270.0" x2="920.0" y2="300.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="675.0" y="305.0" width="490.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="920.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">сервер надсилає власникові копії</tspan><tspan x="920.0" dy="16.9">відкликання дозволу</tspan></text>
<line x1="920.0" y1="362.0" x2="920.0" y2="392.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="675.0" y="397.0" width="490.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="920.0" y="419.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">той дописує накопичене — і лише тоді</tspan><tspan x="920.0" dy="16.9">другий клієнт отримує відповідь</tspan></text>
<rect x="675.0" y="455.0" width="490.0" height="60.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="920.0" y="481.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">вікно застарілості ≈ 0</tspan><tspan x="920.0" dy="16.2">сервер пам'ятає всіх і мусить достукатися до кожного</tspan></text>
</svg>