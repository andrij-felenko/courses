<rect x="969.4" y="265.1" width="131.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1035.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">монтування 40</tspan><tspan x="1035.0" dy="16.9">точка: /mnt/img</tspan></text>
