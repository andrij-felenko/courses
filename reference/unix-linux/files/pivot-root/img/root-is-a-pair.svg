<line x1="910.0" y1="442.8" x2="910.0" y2="412.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Перший ховає ім'я старого дерева, другий прибирає його з таблиці монтувань.</text>
</svg>