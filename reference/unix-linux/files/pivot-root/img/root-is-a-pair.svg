<rect x="80.0" y="120.0" width="420.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">корінь</tspan><tspan x="290.0" dy="18.2">( монтування 25  ·  dentry «/» )</tspan></text>
<rect x="80.0" y="216.0" width="420.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">поточний каталог</tspan><tspan x="290.0" dy="18.2">( монтування 25  ·  dentry «home/ann» )</tspan></text>
<text x="290.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">кожне поле — пара, а не сам лише каталог</text>
<text x="290.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">монтування каже, яким входом ми сюди зайшли</text>
