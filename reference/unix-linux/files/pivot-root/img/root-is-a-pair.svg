<rect x="176.3" y="450.8" width="227.5" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="472.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">chroot</tspan><tspan x="290.0" dy="18.2">переписує пару в процесі —</tspan><tspan x="290.0" dy="18.2">дерево монтувань те саме</tspan></text>
<line x1="290.0" y1="442.8" x2="290.0" y2="412.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
