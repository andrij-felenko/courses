<text x="1060.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">від'єднане дерево машини</text>
<rect x="930.0" y="306.0" width="260.0" height="50.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="1060.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">монтування 25 — старий корінь</tspan></text>
<rect x="930.0" y="372.0" width="260.0" height="50.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="1060.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1060.0" dy="0.0">усі його діти поїхали разом</tspan></text>
<text x="1060.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у таблиці монтувань його немає,</text>
<text x="1060.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">але об'єкт живий</text>
