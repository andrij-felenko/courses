<rect x="544.8" y="288.6" width="190.4" height="66.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="640.0" dy="0.0">fchdir(7)</tspan><tspan x="640.0" dy="16.9">розбору шляху немає —</tspan><tspan x="640.0" dy="16.9">отже, немає й перевірки</tspan></text>
<text x="630.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">MNT_DETACH прибирає ім'я, а не об'єкт: успадкований дескриптор лишається дорогою, доки його не закрити.</text>
