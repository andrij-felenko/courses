<rect x="70.0" y="190.0" width="320.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">fd 7 — каталог старого кореня,</tspan><tspan x="230.0" dy="16.9">відкритий ДО підміни</tspan></text>
<text x="230.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">корінь процесу: монтування 40</text>
<text x="230.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">поточний каталог: «/»</text>
<rect x="638.1" y="123.9" width="123.7" height="52.2" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">новий корінь</tspan><tspan x="700.0" dy="18.2">монтування 40</tspan></text>
<text x="700.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">жодне ім'я звідси</text>
<text x="700.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">не веде назовні</text>
