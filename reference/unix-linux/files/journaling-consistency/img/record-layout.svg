<circle cx="76.0" cy="339.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="76.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="104.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">обрив усередині тіла: прочитано менше байтів, ніж обіцяє len → хвіст відкидаємо</text>
<circle cx="76.0" cy="373.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="76.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="104.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">тіло ціле, печатки немає: запис не завершено → хвіст відкидаємо</text>
<circle cx="76.0" cy="407.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="76.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="104.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">печатка на місці й CRC сходиться: запис приймаємо й застосовуємо</text>
<text x="60.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">носій вільний класти байти не в тому порядку, у якому їх подали: тоді печатка вже є, а CRC не сходиться — вирок той самий</text>
<text x="60.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Журнал цілком: відтворення йде від початку й спиняється на першому записі, що не пройшов перевірку</text>
