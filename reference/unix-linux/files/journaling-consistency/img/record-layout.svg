<text x="60.0" y="642.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">ftruncate до кінця останнього справного запису — далі журнал росте від цієї межі</text>
