<rect x="560.0" y="544.0" width="250.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="685.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">запис 3</tspan><tspan x="685.0" dy="16.9">seq 3</tspan></text>
<rect x="810.0" y="544.0" width="350.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="985.0" y="579.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">огризок seq 4 — без печатки</tspan></text>
