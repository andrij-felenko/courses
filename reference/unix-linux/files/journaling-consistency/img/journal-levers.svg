<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1220 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1220" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="605.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Важелі керування журналом за шарами</text>
<text x="46.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Кожен важіль діє на своєму шарі — а гарантія не сильніша за найнижчий із них</text>
<rect x="46.0" y="86.0" width="250.0" height="36.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="171.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">шар</tspan></text>
<rect x="316.0" y="86.0" width="560.0" height="36.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="596.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">важелі, що діють саме тут</tspan></text>
<rect x="896.0" y="86.0" width="268.0" height="36.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="1030.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">що зникає, коли зрушити не туди</tspan></text>
<rect x="46.0" y="132.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Програма</tspan></text>
<rect x="316.0" y="132.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">fsync() · fdatasync() · fsync(дескриптор каталогу)</tspan><tspan x="596.0" dy="16.9">O_SYNC · O_DSYNC · O_DIRECT</tspan></text>
<rect x="896.0" y="132.0" width="268.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">нічого з цього немає —</tspan><tspan x="1030.0" dy="15.6">журнал цілий,</tspan><tspan x="1030.0" dy="15.6">а ваш файл порожній</tspan></text>
<line x1="171.0" y1="233.0" x2="171.0" y2="245.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="246.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Кеш сторінок</tspan></text>
<rect x="316.0" y="246.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">delalloc / nodelalloc</tspan><tspan x="596.0" dy="16.9">auto_da_alloc</tspan></text>
<rect x="896.0" y="246.0" width="268.0" height="100.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1030.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">блоки під дані ще не вибрані,</tspan><tspan x="1030.0" dy="15.6">а метадані вже фіксуються</tspan></text>
<line x1="171.0" y1="347.0" x2="171.0" y2="359.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="360.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Файлова система</tspan></text>
<rect x="316.0" y="360.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">data=ordered | journal | writeback</tspan><tspan x="596.0" dy="16.9">commit=N (типово 5 с) · errors=</tspan></text>
<rect x="896.0" y="360.0" width="268.0" height="100.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1030.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">writeback: розмір правильний,</tspan><tspan x="1030.0" dy="15.6">всередині чужий старий вміст</tspan></text>
<line x1="171.0" y1="461.0" x2="171.0" y2="473.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="474.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="519.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Журнал</tspan><tspan x="171.0" dy="19.5">JBD2 / XFS log</tspan></text>
<rect x="316.0" y="474.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="511.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">ext4:  -J size=  ·  -J device=  ·  journal_ioprio=</tspan><tspan x="596.0" dy="16.9">journal_checksum  ·  journal_async_commit</tspan><tspan x="596.0" dy="16.9">XFS:  logbufs=  ·  logbsize=  ·  logdev=</tspan></text>
<rect x="896.0" y="474.0" width="268.0" height="100.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1030.0" y="512.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">малий журнал —</tspan><tspan x="1030.0" dy="15.6">частіші зупинки</tspan><tspan x="1030.0" dy="15.6">на перенесення</tspan></text>
<line x1="171.0" y1="575.0" x2="171.0" y2="587.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="588.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="643.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Блоковий шар</tspan></text>
<rect x="316.0" y="588.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="634.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">/sys/block/*/queue/write_cache  (читання й запис)</tspan><tspan x="596.0" dy="16.9">/sys/block/*/queue/fua  (лише читання)</tspan></text>
<rect x="896.0" y="588.0" width="268.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="626.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">«write through» руками —</tspan><tspan x="1030.0" dy="15.6">ядро перестає слати</tspan><tspan x="1030.0" dy="15.6">скидання кешу</tspan></text>
<line x1="171.0" y1="689.0" x2="171.0" y2="701.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="702.0" width="250.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="171.0" y="757.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">Носій</tspan></text>
<rect x="316.0" y="702.0" width="560.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="596.0" y="748.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">hdparm -W 0|1  (ATA)  ·  sdparm --set=WCE  (SCSI)</tspan><tspan x="596.0" dy="16.9">nobarrier — лише за батареї чи конденсаторів</tspan></text>
<rect x="896.0" y="702.0" width="268.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="748.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">летючий кеш без скидань —</tspan><tspan x="1030.0" dy="15.6">журнал не гарантує нічого</tspan></text>
<text x="46.0" y="842.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Читати знизу вгору: найсуворіший режим даних не додає нічого, якщо нижче кеш носія бере записи й забуває їх при знеструмленні.</text>
</svg>