<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому дескриптор сам по собі ще не гарантія</text>
<rect x="60.0" y="62.0" width="480.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="96.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">один виклик з довгим рядком</tspan></text>
<rect x="660.0" y="62.0" width="480.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="96.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">спуск по одному складнику</tspan></text>
<rect x="60.0" y="152.0" width="480.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">openat(d, &quot;logs/2026/out.txt&quot;, O_RDONLY)</tspan></text>
<rect x="60.0" y="236.0" width="480.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="269.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ядро шукає &quot;logs&quot; у d</tspan></text>
<rect x="60.0" y="316.0" width="480.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ядро шукає &quot;2026&quot; — поза контролем</tspan></text>
<rect x="60.0" y="396.0" width="480.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="429.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ядро шукає &quot;out.txt&quot; — поза контролем</tspan></text>
<line x1="300.0" y1="210.0" x2="300.0" y2="232.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="294.0" x2="300.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="374.0" x2="300.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="486.0" width="480.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="523.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">програма не бачила жодного з трьох кроків:</tspan><tspan x="300.0" dy="18.2">підміна середнього складника проходить непоміченою</tspan></text>
<line x1="300.0" y1="454.0" x2="300.0" y2="482.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="152.0" width="480.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">openat(d, &quot;logs&quot;, O_DIRECTORY|O_NOFOLLOW)</tspan></text>
<rect x="660.0" y="236.0" width="480.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">openat(d1, &quot;2026&quot;, O_DIRECTORY|O_NOFOLLOW)</tspan></text>
<rect x="660.0" y="316.0" width="480.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">openat(d2, &quot;out.txt&quot;, O_RDONLY|O_NOFOLLOW)</tspan></text>
<line x1="900.0" y1="210.0" x2="900.0" y2="232.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="294.0" x2="900.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="396.0" width="480.0" height="84.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="900.0" y="433.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">після кожного кроку — або дескриптор,</tspan><tspan x="900.0" dy="18.2">або ELOOP (посилання) чи ENOTDIR (не каталог)</tspan></text>
<line x1="900.0" y1="374.0" x2="900.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="508.0" width="480.0" height="62.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="534.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">рішення «йти далі» ухвалює програма,</tspan><tspan x="900.0" dy="18.2">і воно ухвалюється тричі</tspan></text>
<line x1="900.0" y1="480.0" x2="900.0" y2="504.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="632.0" width="920.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="658.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">O_NOFOLLOW стосується лише ОСТАННЬОГО складника — тому в довгому рядку від нього</tspan><tspan x="600.0" dy="18.2">мало користі, а в однокомпонентному він накриває весь шлях</tspan></text>
</svg>