<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір бітів AT_*: одне число на всю родину</text>
<rect x="130.0" y="40.0" width="980.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="70.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">усі прапорці AT_* живуть в одному цілому аргументі flags</tspan></text>
<rect x="40.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="118.0" dy="0.0">0x100</tspan></text>
<rect x="40.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">AT_SYMLINK_</tspan><tspan x="118.0" dy="15.6">NOFOLLOW</tspan></text>
<rect x="208.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="286.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="286.0" dy="0.0">0x200</tspan></text>
<rect x="208.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="286.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="286.0" dy="0.0">AT_EACCESS</tspan><tspan x="286.0" dy="15.6">AT_REMOVEDIR</tspan><tspan x="286.0" dy="15.6">AT_HANDLE_FID</tspan></text>
<rect x="376.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="454.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="454.0" dy="0.0">0x400</tspan></text>
<rect x="376.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="454.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">AT_SYMLINK_</tspan><tspan x="454.0" dy="15.6">FOLLOW</tspan></text>
<rect x="544.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="622.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="622.0" dy="0.0">0x800</tspan></text>
<rect x="544.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="622.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="622.0" dy="0.0">AT_NO_</tspan><tspan x="622.0" dy="15.6">AUTOMOUNT</tspan></text>
<rect x="712.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">0x1000</tspan></text>
<rect x="712.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">AT_EMPTY_</tspan><tspan x="790.0" dy="15.6">PATH</tspan></text>
<rect x="880.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="958.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="958.0" dy="0.0">0x2000</tspan><tspan x="958.0" dy="19.5">0x4000</tspan></text>
<rect x="880.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="958.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="958.0" dy="0.0">AT_STATX_*</tspan><tspan x="958.0" dy="15.6">одне двобітове</tspan><tspan x="958.0" dy="15.6">поле</tspan></text>
<rect x="1048.0" y="126.0" width="156.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1126.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1126.0" dy="0.0">0x8000</tspan></text>
<rect x="1048.0" y="200.0" width="156.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1126.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1126.0" dy="0.0">AT_RECURSIVE</tspan><tspan x="1126.0" dy="15.6">родина монту-</tspan><tspan x="1126.0" dy="15.6">вання, не ця</tspan></text>
<rect x="40.0" y="396.0" width="540.0" height="122.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">той самий біт 0x200 читається за іменем виклику:</tspan><tspan x="310.0" dy="16.9">faccessat — брати чинні (effective) UID і GID</tspan><tspan x="310.0" dy="16.9">unlinkat — знімати каталог, а не файл</tspan><tspan x="310.0" dy="16.9">name_to_handle_at — ідентифікатор лише для порівняння</tspan></text>
<line x1="286.0" y1="320.0" x2="300.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="396.0" width="540.0" height="122.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">0x2000 і 0x4000 — не два незалежні прапорці,</tspan><tspan x="930.0" dy="16.9">а двобітове поле AT_STATX_SYNC_TYPE:</tspan><tspan x="930.0" dy="16.9">рівно одне зі значень за раз,</tspan><tspan x="930.0" dy="16.9">обидва біти разом — EINVAL</tspan></text>
<line x1="958.0" y1="320.0" x2="930.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="580.0" width="960.0" height="84.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="608.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">кожен виклик приймає свою підмножину бітів, а не весь набір:</tspan><tspan x="620.0" dy="18.2">зайвий біт — це EINVAL, тож «прапорець існує» й «цей виклик його бере» —</tspan><tspan x="620.0" dy="18.2">різні запитання</tspan></text>
</svg>