<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три різні питання про одне й те саме число</text>
<rect x="60.0" y="96.0" width="340.0" height="132.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="68.0" y="104.0" width="324.0" height="116.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="230.0" y="167.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Чи є це поле взагалі?</tspan></text>
<line x1="414.0" y1="162.0" x2="470.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="484.0" y="96.0" width="300.0" height="132.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="634.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="634.0" dy="0.0">відповідає stx_mask</tspan></text>
<rect x="806.0" y="96.0" width="454.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="1033.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1033.0" dy="0.0">ext4 на томі зі 128-байтовим inode не має де тримати час</tspan><tspan x="1033.0" dy="16.9">створення — і чесно не виставляє біт btime</tspan></text>
<rect x="60.0" y="254.0" width="340.0" height="132.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="68.0" y="262.0" width="324.0" height="116.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="230.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Чи значення щось означає?</tspan></text>
<line x1="414.0" y1="320.0" x2="470.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="484.0" y="254.0" width="300.0" height="132.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="634.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="634.0" dy="0.0">не відповідає ніщо</tspan></text>
<rect x="806.0" y="254.0" width="454.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="1033.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1033.0" dy="0.0">FAT віддає власника з опції монтування uid=, а Btrfs пише</tspan><tspan x="1033.0" dy="15.6">будь-якому каталогу лічильник імен 1 — біти при цьому стоять</tspan></text>
<rect x="60.0" y="412.0" width="340.0" height="132.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="68.0" y="420.0" width="324.0" height="116.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="230.0" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Чи воно свіже?</tspan></text>
<line x1="414.0" y1="478.0" x2="470.0" y2="478.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="484.0" y="412.0" width="300.0" height="132.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="634.0" y="482.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="634.0" dy="0.0">відповідає прапорець синхронізації</tspan></text>
<rect x="806.0" y="412.0" width="454.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="1033.0" y="474.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1033.0" dy="0.0">на мережевій ФС розмір беруть із кеша (DONT_SYNC) або</tspan><tspan x="1033.0" dy="16.9">звіряють із сервером (FORCE_SYNC) — це вибір програми</tspan></text>
</svg>