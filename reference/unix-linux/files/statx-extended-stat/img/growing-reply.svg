<rect x="650.0" y="100.0" width="470.0" height="158.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="885.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">ПРОГРАМА, ЗІБРАНА 2017 РОКУ</tspan><tspan x="885.0" dy="18.2">її заголовок знає поля до 0x90;</tspan><tspan x="885.0" dy="18.2">бітів, яких не знає, вона не просить,</tspan><tspan x="885.0" dy="18.2">а ядро однаково пише всі 256 байтів —</tspan><tspan x="885.0" dy="18.2">буфер саме такий із самого початку</tspan></text>
<rect x="650.0" y="292.0" width="470.0" height="158.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="885.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">ПРОГРАМА, ЗІБРАНА 2026 РОКУ</tspan><tspan x="885.0" dy="18.2">просить STATX_SUBVOL і перевіряє біт;</tspan><tspan x="885.0" dy="18.2">на ядрі 5.4 біт не прийде —</tspan><tspan x="885.0" dy="18.2">це не помилка, а чесна відповідь</tspan><tspan x="885.0" dy="18.2">«тут такого поняття немає»</tspan></text>
<rect x="650.0" y="484.0" width="470.0" height="128.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="885.0" y="525.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Нове поле лягає в запас</tspan><tspan x="885.0" dy="18.2">і дістає власний біт маски.</tspan><tspan x="885.0" dy="18.2">Зміщення старих полів і розмір</tspan><tspan x="885.0" dy="18.2">структури не міняються ніколи.</tspan></text>
<rect x="60.0" y="646.0" width="1060.0" height="116.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="590.0" y="690.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Ось чому нову можливість тут не треба «вмикати версією»:</tspan><tspan x="590.0" dy="18.2">прохання — це набір бітів, відповідь — теж набір бітів,</tspan><tspan x="590.0" dy="18.2">і кожна зі сторін просто ігнорує ті, яких не знає.</tspan></text>
