<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мапування логічного простору чанків на фізичні накопичувачі</text>
<rect x="361.0" y="57.9" width="518.1" height="64.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Логічний простір адресації Btrfs (Logical Address Space)</tspan><tspan x="620.0" dy="18.2">Чанки: Data Chunk (1 ГіБ) | Metadata Chunk (256 МіБ)</tspan></text>
<rect x="393.8" y="200.1" width="452.4" height="59.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Chunk Tree (BTRFS_CHUNK_TREE_OBJECTID)</tspan><tspan x="620.0" dy="16.9">Мапує logical_bytenr -&gt; (devid, physical_offset, profile)</tspan></text>
<line x1="620.0" y1="128.1" x2="620.0" y2="194.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="139.8" y="401.6" width="200.4" height="76.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Накопичувач /dev/sda</tspan><tspan x="240.0" dy="16.9">Stripe 0 (Single/RAID1)</tspan><tspan x="240.0" dy="16.9">Stripe 0 (RAID5 Data)</tspan></text>
<rect x="519.8" y="401.6" width="200.4" height="76.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Накопичувач /dev/sdb</tspan><tspan x="620.0" dy="16.9">Stripe 1 (RAID1 Mirror)</tspan><tspan x="620.0" dy="16.9">Stripe 1 (RAID5 Data)</tspan></text>
<rect x="899.8" y="401.6" width="200.4" height="76.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">Накопичувач /dev/sdc</tspan><tspan x="1000.0" dy="16.9">Unallocated / Spare</tspan><tspan x="1000.0" dy="16.9">Stripe 2 (RAID5 Parity)</tspan></text>
<line x1="470.0" y1="265.9" x2="240.0" y2="395.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="265.9" x2="620.0" y2="395.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="265.9" x2="1000.0" y2="395.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="311.9" y="622.2" width="616.2" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="620.0" y="646.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Попередження RAID5/6: при раптовому збої живлення оновлення Stripe 0/1 та Parity</tspan><tspan x="620.0" dy="15.6">може виявитися неатомним (Write Hole). Захист гарантується у профілях RAID1 / RAID1c3.</tspan></text>
</svg>