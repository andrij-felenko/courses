<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм перевірки контрольних сум та самоновлення (Self-Healing)</text>
<rect x="375.6" y="68.0" width="508.8" height="44.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Запит read() або процес btrfs scrub зчитує блок з Дзеркала 1</tspan></text>
<rect x="343.7" y="198.0" width="572.6" height="44.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="224.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Обчислення CRC32c зчитаного блоку та порівняння з хешем із CSUM Tree</tspan></text>
<line x1="630.0" y1="118.0" x2="630.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="195.2" y="341.1" width="309.6" height="57.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Хеші збігаються (OK)</tspan><tspan x="350.0" dy="16.9">Дані цілісні. Повертаємо блок додаткам</tspan></text>
<rect x="736.7" y="341.1" width="346.6" height="57.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Помилка хешу (Checksum Mismatch / Bit Rot!)</tspan><tspan x="910.0" dy="16.9">Дані пошкоджено! Генериться dmesg warning</tspan></text>
<line x1="530.0" y1="248.0" x2="350.0" y2="335.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730.0" y1="248.0" x2="910.0" y2="335.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="677.4" y="491.1" width="465.2" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="516.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">1. Зчитування резервної копії з Дзеркала 2 (mirror_num + 1)</tspan><tspan x="910.0" dy="16.9">2. Перевірка хешу резервної копії</tspan></text>
<line x1="910.0" y1="404.9" x2="910.0" y2="485.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="654.2" y="611.0" width="511.6" height="57.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="910.0" y="636.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">3. Повернення валидних даних користувачу</tspan><tspan x="910.0" dy="16.9">4. Автоматичний перезапис пошкодженого сектора на Дзеркалі 1</tspan></text>
<line x1="910.0" y1="555.0" x2="910.0" y2="605.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>