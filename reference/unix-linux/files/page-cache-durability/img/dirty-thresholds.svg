<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пороги брудної пам'яті й важелі, що ними керують</text>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три зони поведінки зворотного запису і важіль, що рухає кожну межу</text>
<rect x="281.7" y="92.0" width="290.0" height="62.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.6"/><text x="426.7" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="426.7" dy="0.0">dirty_background_ratio = 10 %</tspan><tspan x="426.7" dy="15.0">або dirty_background_bytes</tspan></text>
<line x1="426.7" y1="158.0" x2="426.7" y2="190.0" stroke="#b7791f" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="608.3" y="92.0" width="290.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="753.3" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="753.3" dy="0.0">dirty_ratio = 20 %</tspan><tspan x="753.3" dy="15.0">або dirty_bytes</tspan></text>
<line x1="753.3" y1="158.0" x2="753.3" y2="190.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="100.0" y="190.0" width="326.7" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="263.3" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="263.3" dy="0.0">тільки за віком</tspan></text>
<rect x="426.7" y="190.0" width="326.7" height="64.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.8"/><text x="590.0" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">фонове винесення</tspan></text>
<rect x="753.3" y="190.0" width="326.7" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="916.7" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="916.7" dy="0.0">дроселювання запису</tspan></text>
<line x1="100.0" y1="278.0" x2="1080.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="590.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">частка брудних сторінок від доступної пам'яті (вільна + та, що вивільняється) — зростає праворуч</text>
<rect x="108.0" y="318.0" width="310.7" height="96.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="263.3" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="263.3" dy="0.0">потоки зворотного запису прокидаються</tspan><tspan x="263.3" dy="14.3">за розкладом і виносять тільки те,</tspan><tspan x="263.3" dy="14.3">що брудне довше за поріг віку</tspan></text>
<rect x="434.7" y="318.0" width="310.7" height="96.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.4"/><text x="590.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">потоки зворотного запису працюють</tspan><tspan x="590.0" dy="14.3">безперервно; програма, що пише,</tspan><tspan x="590.0" dy="14.3">швидкості при цьому не втрачає</tspan></text>
<rect x="761.3" y="318.0" width="310.7" height="96.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="916.7" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="916.7" dy="0.0">write() у самій програмі затримується,</tspan><tspan x="916.7" dy="14.3">доки зворотний запис не опустить</tspan><tspan x="916.7" dy="14.3">частку назад під поріг</tspan></text>
<rect x="40.0" y="434.0" width="1100.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Вік діє в усіх трьох зонах незалежно від обсягу: dirty_writeback_centisecs = 500 — як часто прокидатися, dirty_expire_centisecs = 3000 — з якого віку виносити.</tspan></text>
</svg>