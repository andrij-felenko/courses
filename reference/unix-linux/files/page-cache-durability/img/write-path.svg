<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири передачі даних між буфером програми і носієм</text>
<rect x="60.0" y="70.0" width="430.0" height="74.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/>
<text x="275.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">буфер програми</text>
<text x="275.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">власна пам'ять процесу</text>
<rect x="60.0" y="210.0" width="430.0" height="74.0" rx="8" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="275.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сторінка кешу сторінок, позначена «брудна»</text>
<text x="275.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">оперативна пам'ять, якою розпоряджається ядро</text>
<rect x="60.0" y="350.0" width="430.0" height="74.0" rx="8" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="275.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">черга запитів блокового пристрою</text>
<text x="275.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">оперативна пам'ять, якою розпоряджається ядро</text>
<rect x="60.0" y="490.0" width="430.0" height="74.0" rx="8" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="275.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">кеш накопичувача</text>
<text x="275.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">енергозалежна пам'ять на платі пристрою</text>
<rect x="60.0" y="620.0" width="430.0" height="74.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="275.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">носій: пластина або NAND</text>
<text x="275.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">переживає зникнення живлення</text>
<line x1="275.0" y1="148.0" x2="275.0" y2="204.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="545.0" dy="0.0">копіювання в межах пам'яті:</tspan><tspan x="545.0" dy="14.9">жодної команди пристроєві не йде</tspan></text>
<text x="545.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start"><tspan x="545.0" dy="0.0">`write` повертає успіх одразу після цього кроку</tspan></text>
<line x1="275.0" y1="288.0" x2="275.0" y2="344.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="545.0" dy="0.0">зворотний запис — за одним із трьох приводів:</tspan><tspan x="545.0" dy="14.9">вік (типово 30 с) · обсяг (10 % і 20 % пам'яті) · прохання `fsync`</tspan></text>
<text x="545.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start"><tspan x="545.0" dy="0.0">до цього моменту зникнення живлення стирає зміни без сліду</tspan></text>
<line x1="275.0" y1="428.0" x2="275.0" y2="484.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="545.0" dy="0.0">контролер підтверджує запис,</tspan><tspan x="545.0" dy="14.9">щойно дані лягли в його власний буфер</tspan></text>
<text x="545.0" y="483.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start"><tspan x="545.0" dy="0.0">ядро вважає запит виконаним, хоча носій ще порожній</tspan></text>
<line x1="275.0" y1="568.0" x2="275.0" y2="614.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="545.0" dy="0.0">лише за окремою командою скидання кешу</tspan><tspan x="545.0" dy="14.9">(SYNCHRONIZE CACHE / FLUSH CACHE) або з ознакою FUA</tspan></text>
<text x="545.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start"><tspan x="545.0" dy="0.0">рівно тут закінчується довговічність — і рівно це вимикають «для швидкості»</tspan></text>
<text x="590.0" y="702.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожна стрілка має власний момент «прийнято»; успіх виклику каже лише про ту стрілку, яку він проходить</text>
</svg>