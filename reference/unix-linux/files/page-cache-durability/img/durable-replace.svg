<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заміна файлу, що переживає збій на будь-якому кроці</text>
<rect x="40.0" y="66.0" width="245.0" height="92.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/><text x="162.5" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">1. записати вміст</tspan><tspan x="162.5" dy="16.2">у тимчасовий файл</tspan></text>
<rect x="58.0" y="172.0" width="209.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="162.5" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="162.5" dy="0.0">write(tmp)</tspan></text>
<line x1="162.5" y1="212.0" x2="162.5" y2="242.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40.0" y="250.0" width="245.0" height="150.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="162.5" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">старий файл цілий і робочий;</tspan><tspan x="162.5" dy="14.3">тимчасовий на диску порожній —</tspan><tspan x="162.5" dy="14.3">блоки для нього ще не виділено</tspan></text>
<line x1="297.0" y1="112.0" x2="333.0" y2="112.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="66.0" width="245.0" height="92.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.8"/><text x="467.5" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="467.5" dy="0.0">2. проштовхнути його</tspan><tspan x="467.5" dy="16.2">на носій</tspan></text>
<rect x="363.0" y="172.0" width="209.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="467.5" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="467.5" dy="0.0">fsync(tmp)</tspan></text>
<line x1="467.5" y1="212.0" x2="467.5" y2="242.0" stroke="#b7791f" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="345.0" y="250.0" width="245.0" height="150.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.4"/><text x="467.5" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="467.5" dy="0.0">старий файл цілий і робочий;</tspan><tspan x="467.5" dy="14.3">поруч лежить готовий тимчасовий,</tspan><tspan x="467.5" dy="14.3">який після збою просто зайвий</tspan></text>
<line x1="602.0" y1="112.0" x2="638.0" y2="112.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650.0" y="66.0" width="245.0" height="92.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.8"/><text x="772.5" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">3. підмінити ім'я</tspan></text>
<rect x="668.0" y="172.0" width="209.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="772.5" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="772.5" dy="0.0">rename(tmp, файл)</tspan></text>
<line x1="772.5" y1="212.0" x2="772.5" y2="242.0" stroke="#b7791f" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="650.0" y="250.0" width="245.0" height="150.0" rx="6" fill="#fbfcff" stroke="#b7791f" stroke-width="1.4"/><text x="772.5" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">ім'я вже вказує на новий вміст,</tspan><tspan x="772.5" dy="14.3">але сам запис каталогу може</tspan><tspan x="772.5" dy="14.3">ще лишатися тільки в пам'яті</tspan></text>
<line x1="907.0" y1="112.0" x2="943.0" y2="112.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="955.0" y="66.0" width="245.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1077.5" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1077.5" dy="0.0">4. проштовхнути</tspan><tspan x="1077.5" dy="16.2">запис каталогу</tspan></text>
<rect x="973.0" y="172.0" width="209.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1077.5" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="1077.5" dy="0.0">fsync(каталог)</tspan></text>
<line x1="1077.5" y1="212.0" x2="1077.5" y2="242.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="955.0" y="250.0" width="245.0" height="150.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.4"/><text x="1077.5" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1077.5" dy="0.0">нове ім'я і новий вміст на носії;</tspan><tspan x="1077.5" dy="14.3">з цієї миті заміна пережила б</tspan><tspan x="1077.5" dy="14.3">будь-яке зникнення живлення</tspan></text>
<text x="620.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">стан диска, якщо живлення зникло саме на цьому кроці</text>
<rect x="40.0" y="440.0" width="1160.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="620.0" y="474.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">у жодному з чотирьох станів читач не бачить половини файлу: до третього кроку працює старий вміст, після нього — новий; проміжного вмісту не існує, бо підміна імені неподільна</tspan></text>
</svg>