<rect x="190.0" y="78.0" width="270.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">1  readdir()</tspan><tspan x="325.0" dy="16.9">«logs» є в таблиці</tspan></text>
<rect x="485.0" y="158.0" width="270.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2  запис підмінено:</tspan><tspan x="620.0" dy="16.9">«logs» → symlink на /etc</tspan></text>
<rect x="780.0" y="78.0" width="270.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="915.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">3  lstat(&quot;dump/logs&quot;)</tspan><tspan x="915.0" dy="16.9">міряє вже /etc</tspan></text>
<line x1="190.0" y1="248.0" x2="1050.0" y2="248.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1006.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">час</text>
<text x="540.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">З дескриптором: ім'я вживається один раз</text>
<rect x="30.0" y="334.0" width="140.0" height="64.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">наш</tspan><tspan x="100.0" dy="16.9">процес</tspan></text>
<rect x="30.0" y="414.0" width="140.0" height="64.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">зловмисник</tspan></text>
<rect x="190.0" y="334.0" width="270.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="353.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">1  openat(dfd, «logs»,</tspan><tspan x="325.0" dy="16.9">O_DIRECTORY|O_NOFOLLOW)</tspan><tspan x="325.0" dy="16.9">→ fd 5</tspan></text>
<rect x="485.0" y="414.0" width="270.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="442.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2  та сама підміна</tspan><tspan x="620.0" dy="16.9">запису в таблиці</tspan></text>
<rect x="780.0" y="334.0" width="270.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="915.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">3  fstatat(fd 5, …)</tspan><tspan x="915.0" dy="16.9">той самий inode</tspan></text>
