<text x="520.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">запис у каталозі й відкритий дескриптор тримають дані незалежно один від одного</text>
