<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані звільняються тільки тоді, коли на них не лишилось жодного посилання</text>
<rect x="40.0" y="110.0" width="180.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">два імені</tspan><tspan x="130.0" dy="16.9">nlink = 2</tspan><tspan x="130.0" dy="16.9">відкритих: 1</tspan><tspan x="130.0" dy="16.9">дані живі</tspan></text>
<rect x="300.0" y="110.0" width="180.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">одне ім'я</tspan><tspan x="390.0" dy="16.9">nlink = 1</tspan><tspan x="390.0" dy="16.9">відкритих: 1</tspan><tspan x="390.0" dy="16.9">дані живі</tspan></text>
<rect x="560.0" y="110.0" width="180.0" height="120.0" rx="6" fill="#fdf3ea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">імені немає</tspan><tspan x="650.0" dy="16.9">nlink = 0</tspan><tspan x="650.0" dy="16.9">відкритих: 1</tspan><tspan x="650.0" dy="16.9">дані ще живі</tspan></text>
<rect x="820.0" y="110.0" width="180.0" height="120.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">nlink = 0</tspan><tspan x="910.0" dy="16.9">відкритих: 0</tspan><tspan x="910.0" dy="16.9">блоки звільнено</tspan></text>
