<text x="60.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">довше ім'я просто обтинається до 14 байтів</text>
<text x="60.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">4.2BSD FFS (1983) та ext2 (1993) — змінна довжина</text>
<text x="60.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">заголовок несе довжину запису, тож наступний знаходять додаванням</text>
