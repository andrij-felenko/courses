<text x="60.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">htree (ext3/ext4, 2001–2002) — індекс поверх тих самих блоків</text>
