<line x1="970.0" y1="374.0" x2="970.0" y2="402.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="406.0" width="540.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">лише тепер ядро віддає керування</tspan></text>
<line x1="970.0" y1="488.0" x2="970.0" y2="516.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="520.0" width="540.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="555.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">живлення зникло: усе, що програма</tspan><tspan x="970.0" dy="16.2">встигла скинути, лишилося на місці</tspan></text>
