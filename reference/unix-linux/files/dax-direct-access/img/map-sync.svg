<line x1="800.0" y1="108.0" x2="1000.0" y2="172.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="648.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">різниця лише в тому, коли ядро вважає помилку сторінки залагодженою</text>
