<rect x="390.0" y="40.0" width="520.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="67.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">запис у ще не виділену ділянку відображення →</tspan><tspan x="650.0" dy="16.2">помилка сторінки, керування переходить до ядра</tspan></text>
<text x="330.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">звичайне відображення</text>
