<text x="905.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">власна пам'ять процесу</text>
<rect x="690.0" y="240.0" width="430.0" height="74.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 5"/>
