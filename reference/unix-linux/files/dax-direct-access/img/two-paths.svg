<text x="624.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end"><tspan x="624.0" dy="0.0">запис у таблиці сторінок</tspan><tspan x="624.0" dy="14.3">веде просто на носій</tspan></text>
<text x="620.0" y="648.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ліворуч вміст лежить у пам'яті двічі; праворуч — жодного разу</text>
