<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 716" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="716" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок дій під час додавання запису</text>
<text x="1000.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">що побачить перевірка, якщо аварія сталася тут</text>
<rect x="60.0" y="96.0" width="560.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">1. звичайні store: тіло, довжина, контрольна сума</tspan></text>
<line x1="104.0" y1="169.0" x2="104.0" y2="181.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="184.0" width="560.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. CLWB на кожен рядок кешу під тілом</tspan></text>
<line x1="104.0" y1="257.0" x2="104.0" y2="269.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="272.0" width="560.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="340.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">3. SFENCE: чекаємо, поки виштовхування дійдуть</tspan></text>
<line x1="104.0" y1="345.0" x2="104.0" y2="357.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="560.0" height="70.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/><text x="340.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">4. один вирівняний 8-байтовий store ознаки</tspan></text>
<line x1="104.0" y1="433.0" x2="104.0" y2="445.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="448.0" width="560.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="487.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">5. CLWB на рядок з ознакою</tspan></text>
<line x1="104.0" y1="521.0" x2="104.0" y2="533.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="536.0" width="560.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="340.0" y="575.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">6. SFENCE: запис зафіксовано остаточно</tspan></text>
<rect x="720.0" y="96.0" width="560.0" height="246.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="1000.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ознаки немає — слот при відновленні пропускається,</tspan><tspan x="1000.0" dy="16.2">журнал лишається таким, яким був до додавання</tspan></text>
<line x1="634.0" y1="219.0" x2="706.0" y2="219.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="720.0" y="360.0" width="560.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1000.0" y="391.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">8 байтів, вирівняних і в одному рядку кешу: на носії</tspan><tspan x="1000.0" dy="16.2">буде або старий нуль, або нове слово цілком</tspan></text>
<line x1="634.0" y1="395.0" x2="706.0" y2="395.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
<rect x="720.0" y="448.0" width="560.0" height="158.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="1000.0" y="523.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ознака могла ще не перетнути межу домену —</tspan><tspan x="1000.0" dy="16.2">це той самий безпечний випадок «запису не було»</tspan></text>
<line x1="634.0" y1="527.0" x2="706.0" y2="527.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="670.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="670.0" dy="0.0">небезпечний порядок — виставити ознаку раніше, ніж тіло перетне межу домену:</tspan><tspan x="670.0" dy="16.2">тоді відновлення повірить у запис, тіла якого на носії немає</tspan></text>
</svg>