<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура таблиці дедуплікації (DDT) та адресація у ZFS</text>
<rect x="30.0" y="45.0" width="740.0" height="180.0" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
<text x="50.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">Оперативна пам'ять (RAM / ARC)</text>
<rect x="114.1" y="101.0" width="571.8" height="73.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="400.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle"><tspan x="400.0" dy="0.0">Deduplication Table (DDT in ARC)</tspan><tspan x="400.0" dy="14.3">Хеш блоку (SHA256/SHA512/SKEIN)  |  RefCount  |  DVA (Physical Address)</tspan><tspan x="400.0" dy="14.3">0x8F3A...E910 (256 bit)                 |     Count=2    |  DVA: pool/dev0:offset 0x4000</tspan><tspan x="400.0" dy="14.3">0x11B2...90AC (256 bit)                 |     Count=1    |  DVA: pool/dev0:offset 0x8000</tspan></text>
<rect x="30.0" y="240.0" width="740.0" height="160.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="50.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">Дискове сховище (Zpool Storage)</text>
<rect x="64.8" y="292.4" width="170.5" height="45.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="150.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle"><tspan x="150.0" dy="0.0">Файл A (Block Pointer 1)</tspan><tspan x="150.0" dy="14.3">Вказує на 0x8F3A...</tspan></text>
<rect x="564.8" y="292.4" width="170.5" height="45.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="650.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle"><tspan x="650.0" dy="0.0">Файл B (Block Pointer 3)</tspan><tspan x="650.0" dy="14.3">Вказує на 0x8F3A...</tspan></text>
<rect x="277.5" y="342.4" width="245.1" height="45.3" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="400.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Фізичний блок на диску (DVA1)</tspan><tspan x="400.0" dy="14.3">Збережений єдиний примірник даних</tspan></text>
<line x1="150.0" y1="290.0" x2="270.0" y2="192.0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="650.0" y1="290.0" x2="530.0" y2="192.0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="400.0" y1="192.0" x2="400.0" y2="342.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>