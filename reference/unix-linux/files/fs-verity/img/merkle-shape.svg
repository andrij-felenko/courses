<rect x="300.0" y="150.0" width="560.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="580.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">геш кореневого блока — root_hash</tspan></text>
<line x1="335.0" y1="254.0" x2="390.0" y2="218.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="900.0" y="150.0" width="360.0" height="62.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.4"/><text x="1080.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">дескриптор: версія, алгоритм,</tspan><tspan x="1080.0" dy="16.2">розмір блока, сіль, розмір файлу</tspan></text>
<line x1="870.0" y1="181.0" x2="890.0" y2="181.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="74.0" width="590.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="595.0" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">цифра файлу = геш дескриптора: 32 байти на весь файл</tspan></text>
<line x1="1080.0" y1="146.0" x2="640.0" y2="136.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
