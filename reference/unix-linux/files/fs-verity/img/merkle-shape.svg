<text x="285.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="285.0" dy="0.0">рівень 1 дерева</tspan><tspan x="285.0" dy="17.6">600 гешів = 5 блоків</tspan></text>
<rect x="900.0" y="378.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="1080.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">128 разів менше блоків,</tspan><tspan x="1080.0" dy="16.2">ніж на рівні нижче</tspan></text>
<rect x="300.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><rect x="370.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="440.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="510.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="580.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="650.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="720.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/><rect x="790.0" y="260.0" width="70.0" height="52.0" rx="3" fill="#fff6e5" stroke="#b8860b" stroke-width="1.2"/>
<text x="285.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="285.0" dy="0.0">рівень 2 — корінь</tspan><tspan x="285.0" dy="17.6">5 гешів = 1 блок</tspan></text>
<rect x="900.0" y="258.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="1080.0" y="282.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">далі стискати нема куди:</tspan><tspan x="1080.0" dy="16.2">усе вмістилось в один блок</tspan></text>
