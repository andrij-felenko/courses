<text x="285.0" y="642.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="285.0" dy="0.0">дані файлу</tspan><tspan x="285.0" dy="17.6">76 800 блоків по 4 КіБ</tspan></text>
<rect x="900.0" y="618.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="1080.0" y="642.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">читаємо один блок даних</tspan><tspan x="1080.0" dy="16.2">решти файлу не торкаємось</tspan></text>
<rect x="300.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="370.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="440.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="510.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="580.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><rect x="650.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="720.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><rect x="790.0" y="500.0" width="70.0" height="52.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="285.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end"><tspan x="285.0" dy="0.0">рівень 0 дерева</tspan><tspan x="285.0" dy="17.6">76 800 гешів = 600 блоків</tspan></text>
<rect x="900.0" y="498.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="1080.0" y="522.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">у кожному блоці — 128 гешів</tspan><tspan x="1080.0" dy="16.2">по 32 байти (SHA-256)</tspan></text>
