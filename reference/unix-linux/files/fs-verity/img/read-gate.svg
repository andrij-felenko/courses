<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевірка стоїть не на відкритті файлу, а на вході сторінки в кеш</text>
<rect x="330.0" y="78.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="590.0" y="112.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">read() або дотик до відображеної адреси</tspan></text>
<rect x="330.0" y="170.0" width="520.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="590.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">сторінка вже в кеші й позначена справною?</tspan></text>
<line x1="590.0" y1="140.0" x2="590.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="910.0" y="170.0" width="250.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1035.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">так — віддати байти</tspan><tspan x="1035.0" dy="16.2">без жодної перевірки</tspan></text>
<line x1="862.0" y1="199.0" x2="900.0" y2="199.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="262.0" width="520.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="590.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">прочитати блок 4 КіБ з носія</tspan></text>
<line x1="590.0" y1="232.0" x2="590.0" y2="258.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="616.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">ні</text>
<rect x="330.0" y="354.0" width="520.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="590.0" y="388.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">обчислити SHA-256 прочитаного блока</tspan></text>
<line x1="590.0" y1="324.0" x2="590.0" y2="350.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="446.0" width="520.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="590.0" y="480.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">збігається з гешем у блоці дерева вище?</tspan></text>
<line x1="590.0" y1="416.0" x2="590.0" y2="442.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="446.0" width="240.0" height="58.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.4"/><text x="180.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">блок дерева перевіряють</tspan><tspan x="180.0" dy="15.6">так само, аж до кореня</tspan></text>
<line x1="310.0" y1="475.0" x2="300.0" y2="475.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="560.0" width="480.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="300.0" y="593.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ні: сторінка НЕ стає справною</tspan><tspan x="300.0" dy="16.9">read() → EIO · доступ через mmap → SIGBUS</tspan><tspan x="300.0" dy="16.9">наступна спроба почне все спочатку</tspan></text>
<line x1="390.0" y1="510.0" x2="300.0" y2="556.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="650.0" y="560.0" width="470.0" height="92.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.2"/><text x="885.0" y="593.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">так: сторінку позначено справною</tspan><tspan x="885.0" dy="16.9">далі вона віддається з кешу без перевірок,</tspan><tspan x="885.0" dy="16.9">а після витіснення все повториться</tspan></text>
<line x1="790.0" y1="510.0" x2="880.0" y2="556.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>