<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">які саме байти проходять шлях до підпису</text>
<rect x="215.9" y="81.7" width="428.1" height="76.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="430.0" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">struct fsverity_descriptor — 256 байтів</tspan><tspan x="430.0" dy="17.6">version · hash_algorithm · log_blocksize · salt_size</tspan><tspan x="430.0" dy="17.6">data_size · root_hash[64] · salt[32] · reserved[144]</tspan></text>
<rect x="277.5" y="255.5" width="305.0" height="59.1" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="430.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">цифра файлу — 32 байти для SHA-256</tspan><tspan x="430.0" dy="17.6">саме її віддає FS_IOC_MEASURE_VERITY</tspan></text>
<rect x="200.5" y="420.5" width="458.9" height="59.1" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="430.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">struct fsverity_formatted_digest — 44 байти</tspan><tspan x="430.0" dy="17.6">«FSVerity» (8) + алгоритм (2) + довжина (2) + цифра (32)</tspan></text>
<rect x="231.3" y="585.5" width="397.4" height="59.1" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.6"/><text x="430.0" y="611.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">підпис PKCS#7 у sig_ptr — не більше 16128 байтів</tspan><tspan x="430.0" dy="17.6">ядро звіряє його з кільцем ключів .fs-verity</tspan></text>
<line x1="430.0" y1="172.0" x2="430.0" y2="239.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="207.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">SHA-256 над цими 256 байтами</text>
<line x1="430.0" y1="337.0" x2="430.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="372.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">обгортка з магією «FSVerity»</text>
<line x1="430.0" y1="502.0" x2="430.0" y2="569.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="537.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">підписують саме ці 44 байти</text>
<text x="430.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">fs.verity.require_signatures = 1 → файл без дійсного підпису не відкриється</text>
</svg>