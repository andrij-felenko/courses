<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 820" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="820" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-style="italic">Позначка «переказ» — факт із переказів і спогадів, а не з публікації</text>
<line x1="282.0" y1="94.0" x2="282.0" y2="776.0" stroke="#6b7280" stroke-width="2.5"/>
<text x="262.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">берез. 1984</text>
<circle cx="282.0" cy="129.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<rect x="300.0" y="100.0" width="1040.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="820.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Sun береться за NFS: мережева файлова система мусить стояти в дереві</tspan><tspan x="820.0" dy="20.8">поруч із дисковою й бути невідрізненною від неї · переказ</tspan></text>
<text x="262.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">черв. 1984</text>
<circle cx="282.0" cy="197.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<rect x="300.0" y="168.0" width="1040.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="820.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">перше ядро SunOS із новими об'єктами: inode розділено на незалежний</tspan><tspan x="820.0" dy="20.8">від формату vnode і приватну частину файлової системи · переказ</tspan></text>
<text x="262.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">лют. 1985</text>
<circle cx="282.0" cy="265.0" r="7.0" fill="#b8860b" stroke="#b8860b" stroke-width="2.0"/>
<rect x="300.0" y="236.0" width="1040.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="820.0" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Research Unix, 8-ма редакція: file system switch і мережеві імена</tspan><tspan x="820.0" dy="20.8">вигляду /n/&lt;машина&gt;/&lt;шлях&gt; · дата без первинного джерела</tspan></text>
<text x="262.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1985</text>
<circle cx="282.0" cy="333.0" r="7.0" fill="#b8860b" stroke="#b8860b" stroke-width="2.0"/>
<rect x="300.0" y="304.0" width="1040.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="820.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">П. Вайнберґер, «The UNIX eighth edition network file system»,</tspan><tspan x="820.0" dy="20.8">13-та щорічна ACM Computer Science Conference, с. 299–301</tspan></text>
<text x="262.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">черв. 1986</text>
<circle cx="282.0" cy="401.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<rect x="300.0" y="372.0" width="1040.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="820.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">С. Клейман, «Vnodes: An Architecture for Multiple File System Types</tspan><tspan x="820.0" dy="20.8">in Sun UNIX», USENIX Summer, с. 238–247</tspan></text>
<text x="262.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">1987</text>
<circle cx="282.0" cy="469.0" r="7.0" fill="#b8860b" stroke="#b8860b" stroke-width="2.0"/>
<rect x="300.0" y="440.0" width="1040.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="820.0" y="474.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">System V Release 3: власний file system switch від AT&amp;T</tspan></text>
<text x="262.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">18 жовт. 1988</text>
<circle cx="282.0" cy="537.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="300.0" y="508.0" width="1040.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="820.0" y="532.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">оголошено System V Release 4, спільну роботу AT&amp;T і Sun:</tspan><tspan x="820.0" dy="20.8">інтерфейс VFS від Sun заступає file system switch</tspan></text>
<text x="262.0" y="612.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">весна 1992</text>
<circle cx="282.0" cy="605.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="300.0" y="576.0" width="1040.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="820.0" y="600.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Linux 0.96: власний шар VFS — спершу Кріс Провенцано,</tspan><tspan x="820.0" dy="20.8">далі переписав Торвальдс</tspan></text>
<text x="262.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">квіт. 1992</text>
<circle cx="282.0" cy="673.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="300.0" y="644.0" width="1040.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="820.0" y="668.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">ext Ремі Кара — перша файлова система Linux, написана</tspan><tspan x="820.0" dy="20.8">через новий інтерфейс; випущено в складі 0.96c</tspan></text>
<text x="262.0" y="748.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">гілка 2.1</text>
<circle cx="282.0" cy="741.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="300.0" y="712.0" width="1040.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="820.0" y="736.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">dentry й кеш записів каталогу стають окремим об'єктом —</tspan><tspan x="820.0" dy="20.8">такого в задумі 1986 року не було · переказ</tspan></text>
</svg>