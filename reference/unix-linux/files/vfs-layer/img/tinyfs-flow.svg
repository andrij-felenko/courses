<rect x="1000.0" y="358.0" width="410.0" height="78.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="1205.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">i_op-&gt;lookup = tiny_lookup</tspan></text>
