<rect x="1000.0" y="634.0" width="410.0" height="78.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="1205.0" y="678.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">unregister_filesystem(&amp;tiny_fs_type)</tspan></text>
<line x1="356.0" y1="673.0" x2="372.0" y2="673.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
