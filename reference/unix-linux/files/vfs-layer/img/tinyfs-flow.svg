<rect x="380.0" y="174.0" width="590.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="675.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">створює fs_context, кличе get_tree,</tspan><tspan x="675.0" dy="19.5">бере анонімний номер пристрою</tspan></text>
<rect x="1000.0" y="174.0" width="410.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1205.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">tiny_init_fs_context → tiny_get_tree</tspan><tspan x="1205.0" dy="19.5">→ tiny_fill_super → d_make_root</tspan></text>
