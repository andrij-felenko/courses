<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний стек EROFS у контейнерах та хмарній інфраструктурі</text>
<rect x="40.0" y="60.0" width="1100.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Простір користувача / Контейнери (nerdctl, containerd, Podman, Nydus)</tspan></text>
<line x1="590.0" y1="110.0" x2="590.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="150.0" width="520.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Класичний підхід (OverlayFS layer stack):</tspan><tspan x="300.0" dy="16.9">• Десятки шарів tgz розпаковуються в каталоги</tspan><tspan x="300.0" dy="16.9">• Мільйони окремих inodes/dentries у пам'яті</tspan><tspan x="300.0" dy="16.9">• Оверхед dentry cache та повільний старт</tspan></text>
<rect x="620.0" y="150.0" width="520.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Сучасний підхід (EROFS + Composefs / Nydus):</tspan><tspan x="880.0" dy="16.9">• Контейнерний образ як єдиний blob EROFS</tspan><tspan x="880.0" dy="16.9">• Chunk-based дедуплікація вмісту файлів</tspan><tspan x="880.0" dy="16.9">• Миттєвий mount за мілісекунди без un-tar</tspan></text>
<line x1="880.0" y1="260.0" x2="880.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="300.0" width="560.0" height="100.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="680.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Шар ядра Linux: EROFS + FS-Cache (erofs over fscache)</tspan><tspan x="680.0" dy="15.6">• Надекономне онлайн-завантаження блоків (On-demand pulling)</tspan><tspan x="680.0" dy="15.6">• Запитуються лише ті 4 КБ блоки, які дійсно читаються під час старту</tspan><tspan x="680.0" dy="15.6">• Прямий доступ через VFS без шаррування OverlayFS</tspan></text>
<line x1="680.0" y1="400.0" x2="680.0" y2="435.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="440.0" width="960.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="498.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Практичні переваги EROFS для хмарних навантажень та прошивок:</tspan><tspan x="680.0" dy="18.2"></tspan><tspan x="680.0" dy="18.2">1. Апаратна безпека: Read-Only захищає від атаки модифікації системного коду.</tspan><tspan x="680.0" dy="18.2">2. Скорочення часу запуску контейнера: з 5-10 секунд до декількох мілісекунд.</tspan><tspan x="680.0" dy="18.2">3. Економія пам'яті вузла: відсутність дублювання dentries та підтримка shared page cache.</tspan></text>
</svg>