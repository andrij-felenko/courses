<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр In-place декомпресії в ядрах Linux</text>
<rect x="40.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Читання сторінки</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">Запит VFS page read fault</tspan><tspan x="140.0" dy="14.3">для логічної 4 КБ сторінки</tspan></text>
<line x1="244.0" y1="125.0" x2="266.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Пошук у Bmap</tspan><tspan x="370.0" dy="13.0"></tspan><tspan x="370.0" dy="13.0">Перетворення логічного зсуву</tspan><tspan x="370.0" dy="13.0">у фізичний кластер диска</tspan></text>
<line x1="474.0" y1="125.0" x2="496.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">3. Драйвер пристрою</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">Пряме читання 4 КБ блоку</tspan><tspan x="600.0" dy="15.6">із диска (Block I/O)</tspan></text>
<line x1="704.0" y1="125.0" x2="726.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">4. Decompressor</tspan><tspan x="830.0" dy="13.0"></tspan><tspan x="830.0" dy="13.0">Rolling LZ4 / Zstd</tspan><tspan x="830.0" dy="13.0">в режимі in-place / pcluster</tspan></text>
<line x1="934.0" y1="125.0" x2="956.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="960.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1060.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">5. Заповнення Cache</tspan><tspan x="1060.0" dy="13.0"></tspan><tspan x="1060.0" dy="13.0">Дані записані прямо у цільові</tspan><tspan x="1060.0" dy="13.0">сторінки Page Cache RAM</tspan></text>
<line x1="40.0" y1="220.0" x2="1140.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="60.0" y="250.0" width="510.0" height="360.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="315.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Звичайна декомпресія (Bounce Buffer):</tspan><tspan x="315.0" dy="16.9"></tspan><tspan x="315.0" dy="16.9">1. Зчитування стисненого блоку з диска у буфер A.</tspan><tspan x="315.0" dy="16.9">2. Виділення тимчасового буфера B під розпаковані дані.</tspan><tspan x="315.0" dy="16.9">3. Декомпресія з A в B через CPU.</tspan><tspan x="315.0" dy="16.9">4. Копіювання з B у цільові сторінки Page Cache.</tspan><tspan x="315.0" dy="16.9">5. Звільнення буферів A та B.</tspan><tspan x="315.0" dy="16.9"></tspan><tspan x="315.0" dy="16.9">❌ Результат: подвійне копіювання, навантаження на kmalloc,</tspan><tspan x="315.0" dy="16.9">  затримки таймінгу та фрагментація RAM.</tspan></text>
<rect x="610.0" y="250.0" width="510.0" height="360.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">In-Place декомпресія в EROFS:</tspan><tspan x="865.0" dy="16.9"></tspan><tspan x="865.0" dy="16.9">1. Зчитування стисненого блоку у хвіст цільового масиву сторінок.</tspan><tspan x="865.0" dy="16.9">2. Декомпресія виконується безпосередньо у тому ж масиві</tspan><tspan x="865.0" dy="16.9">   фізичних сторінок (Rolling Decompression).</tspan><tspan x="865.0" dy="16.9">3. Жодного проміжного виділення пам'яті (0 extra allocations).</tspan><tspan x="865.0" dy="16.9">4. Жодного зайвого копіювання байтів (Zero CPU memcpy).</tspan><tspan x="865.0" dy="16.9"></tspan><tspan x="865.0" dy="16.9">✅ Результат: затримка читання нижча в рази, передбачуваний</tspan><tspan x="865.0" dy="16.9">  час відгуку для системних процесів Android/microVM.</tspan></text>
</svg>