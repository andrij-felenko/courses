<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дискова структура та вирівнювання блоків EROFS</text>
<rect x="40.0" y="60.0" width="240.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Блок 0 (1024 байти)</tspan><tspan x="160.0" dy="18.2">Суперблок 0xE0F5E1E2</tspan></text>
<rect x="310.0" y="60.0" width="380.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Таблиці індексних вузлів (Inodes)</tspan><tspan x="500.0" dy="18.2">Compact (32B) або Extended (64B)</tspan></text>
<rect x="720.0" y="60.0" width="420.0" height="60.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">Фізичні блоки даних (4 КБ)</tspan><tspan x="930.0" dy="18.2">Стиснені / Нестиснені екстенти</tspan></text>
<line x1="280.0" y1="90.0" x2="306.0" y2="90.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="90.0" x2="716.0" y2="90.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="520.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="233.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Структура Inode та Inline-дані (Tail-packing):</tspan><tspan x="300.0" dy="16.9"></tspan><tspan x="300.0" dy="16.9">• i_format: FLAT_PLAIN, FLAT_INLINE, COMPRESSED_FULL, CHUNK_BASED</tspan><tspan x="300.0" dy="16.9">• Метадані: UID/GID, mode, size, nlink, xattr_icount</tspan><tspan x="300.0" dy="16.9">• Tail-packing: якщо хвіст файла &lt; 4 КБ, він зберігається</tspan><tspan x="300.0" dy="16.9">  безпосередньо в тому ж блоці метаданих одразу за inode!</tspan><tspan x="300.0" dy="16.9">• Виграш: 0 марнованого місця на фрагментацію останнього блоку</tspan></text>
<rect x="600.0" y="180.0" width="540.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="242.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Картування екстентів (Compressed Block Map):</tspan><tspan x="870.0" dy="16.9"></tspan><tspan x="870.0" dy="16.9">• Логічні блоки групи (наприклад, 12 КБ = 3 × 4 КБ)</tspan><tspan x="870.0" dy="16.9">• Упаковка у фіксований фізичний блок (4 КБ на диску)</tspan><tspan x="870.0" dy="16.9">• Head-запис (початок pcluster) + Non-head (продовження)</tspan><tspan x="870.0" dy="16.9">• Послідовне розташування на диску полегшує блокове I/O</tspan></text>
<line x1="40.0" y1="410.0" x2="1140.0" y2="410.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="140.0" y="450.0" width="900.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="508.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Ключовий принцип дискового розташування EROFS:</tspan><tspan x="590.0" dy="18.2"></tspan><tspan x="590.0" dy="18.2">1. Фізичне вирівнювання: усі фізичні блоки строго вирівняні по 4 КБ (розмір сторінки RAM).</tspan><tspan x="590.0" dy="18.2">2. Нульові витрати на нестиснені файли: зсув перераховується арифметично, без таблиць екстентів.</tspan><tspan x="590.0" dy="18.2">3. Дедуплікація метаданих: спільна таблиця xattr для SELinux-контекстів багатьох файлів.</tspan></text>
</svg>