<text x="28.0" y="676.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">Синє — struct flock: відлік від точки, заданої l_whence. Червоне — lockf: відлік ЗАВЖДИ від поточної позиції.</text>
