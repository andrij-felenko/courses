<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="26.0" width="260.0" height="82.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="160.0" y="62.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1984</tspan><tspan x="160.0" dy="19.5">V8, Bell Labs</tspan></text>
<rect x="340.0" y="26.0" width="850.0" height="82.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="765.0" y="62.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Том Кілліан, доповідь «Processes as Files»:</tspan><tspan x="765.0" dy="19.5">/proc/&lt;pid&gt; — один файл на процес, керування через ioctl</tspan></text>
<line x1="160.0" y1="111.0" x2="160.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="138.0" width="260.0" height="82.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="160.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">кін. 1980-х</tspan><tspan x="160.0" dy="19.5">Plan 9</tspan></text>
<rect x="340.0" y="138.0" width="850.0" height="82.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="765.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">каталог на процес; замість ioctl —</tspan><tspan x="765.0" dy="19.5">запис слова у файл керування ctl</tspan></text>
<line x1="160.0" y1="223.0" x2="160.0" y2="247.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="250.0" width="260.0" height="82.0" rx="8" fill="#eef0f3" stroke="#333333" stroke-width="1.8"/>
<text x="160.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1991</tspan><tspan x="160.0" dy="19.5">SVR4</tspan></text>
<rect x="340.0" y="250.0" width="850.0" height="82.0" rx="8" fill="#eef0f3" stroke="#333333" stroke-width="1.6"/>
<text x="765.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Фолкнер і Гомс переносять /proc у System V;</tspan><tspan x="765.0" dy="19.5">пізніше, у Solaris 2.6, — каталоги на потоки, без ioctl</tspan></text>
<line x1="160.0" y1="335.0" x2="160.0" y2="359.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="362.0" width="260.0" height="82.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/>
<text x="160.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1992</tspan><tspan x="160.0" dy="19.5">Linux 0.97.3</tspan></text>
<rect x="340.0" y="362.0" width="850.0" height="82.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/>
<text x="765.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">/proc з'являється; уже в 0.98.6, за три місяці, —</tspan><tspan x="765.0" dy="19.5">перші дані, що не стосуються жодного процесу</tspan></text>
<line x1="160.0" y1="447.0" x2="160.0" y2="471.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="474.0" width="260.0" height="82.0" rx="8" fill="#eef0f3" stroke="#333333" stroke-width="1.8"/>
<text x="160.0" y="510.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1994</tspan><tspan x="160.0" dy="19.5">4.4BSD</tspan></text>
<rect x="340.0" y="474.0" width="850.0" height="82.0" rx="8" fill="#eef0f3" stroke="#333333" stroke-width="1.6"/>
<text x="765.0" y="510.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">/proc за зразком Plan 9;</tspan><tspan x="765.0" dy="19.5">згодом відмирає на користь sysctl</tspan></text>
<line x1="160.0" y1="559.0" x2="160.0" y2="583.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="586.0" width="260.0" height="82.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="160.0" y="622.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">2002</tspan><tspan x="160.0" dy="19.5">Linux 2.5</tspan></text>
<rect x="340.0" y="586.0" width="850.0" height="82.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="765.0" y="622.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Патрік Мохел: driverfs → sysfs разом із kobject —</tspan><tspan x="765.0" dy="19.5">окреме дерево з правилами замість купок у /proc</tspan></text>
<line x1="160.0" y1="671.0" x2="160.0" y2="695.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>