<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне жорстке посилання — два записи на диск</text>
<rect x="50.0" y="110.0" width="230.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">спершу — запис</tspan><tspan x="165.0" dy="16.9">імені в каталог</tspan></text>
<line x1="292.0" y1="150.0" x2="348.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="110.0" width="160.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">збій</tspan><tspan x="440.0" dy="16.9">живлення</tspan></text>
<line x1="532.0" y1="150.0" x2="588.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="104.0" width="360.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">ім'я вказує на inode,</tspan><tspan x="780.0" dy="15.6">чиї блоки система вважає вільними:</tspan><tspan x="780.0" dy="15.6">руйнація</tspan></text>
<rect x="50.0" y="270.0" width="230.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">спершу — збільшити</tspan><tspan x="165.0" dy="16.9">лічильник імен</tspan></text>
<line x1="292.0" y1="310.0" x2="348.0" y2="310.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="270.0" width="160.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">збій</tspan><tspan x="440.0" dy="16.9">живлення</tspan></text>
<line x1="532.0" y1="310.0" x2="588.0" y2="310.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="264.0" width="360.0" height="92.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="780.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">лічильник більший за кількість імен:</tspan><tspan x="780.0" dy="15.6">місце не звільниться,</tspan><tspan x="780.0" dy="15.6">але дані цілі</tspan></text>
<rect x="180.0" y="430.0" width="640.0" height="80.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="465.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">журнал: обидва записи — одна транзакція,</tspan><tspan x="500.0" dy="18.2">тож після збою є або обидва, або жодного</tspan></text>
</svg>