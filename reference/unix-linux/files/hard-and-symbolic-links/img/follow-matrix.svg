<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Останній компонент шляху: хто його розгортає</text>
<rect x="30.0" y="60.0" width="490.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">префікс шляху:   /var/log/</tspan><tspan x="275.0" dy="16.9">посилання розгортаються ЗАВЖДИ, у кожному виклику</tspan></text>
<rect x="560.0" y="60.0" width="470.0" height="66.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="795.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">останній компонент:   app</tspan><tspan x="795.0" dy="16.9">поведінка залежить від виклику й прапорців</tspan></text>
<line x1="795.0" y1="130.0" x2="795.0" y2="164.0" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="30.0" y="176.0" width="320.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">завжди йде за посиланням</tspan></text>
<rect x="30.0" y="232.0" width="320.0" height="174.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="281.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">stat</tspan><tspan x="190.0" dy="16.9">open, openat (без O_NOFOLLOW)</tspan><tspan x="190.0" dy="16.9">chdir, chroot</tspan><tspan x="190.0" dy="16.9">chmod, chown, truncate</tspan><tspan x="190.0" dy="16.9">execve</tspan><tspan x="190.0" dy="16.9">opendir, access</tspan></text>
<rect x="370.0" y="176.0" width="320.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ніколи не йде за ним</tspan></text>
<rect x="370.0" y="232.0" width="320.0" height="174.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">lstat</tspan><tspan x="530.0" dy="16.9">readlink</tspan><tspan x="530.0" dy="16.9">unlink, rmdir</tspan><tspan x="530.0" dy="16.9">rename</tspan><tspan x="530.0" dy="16.9">symlink (кладе саме тут)</tspan><tspan x="530.0" dy="16.9">link (Linux, від 2.0)</tspan><tspan x="530.0" dy="16.9">lchown, lsetxattr, lgetxattr</tspan></text>
<rect x="710.0" y="176.0" width="320.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="870.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">вирішує прапорець</tspan></text>
<rect x="710.0" y="232.0" width="320.0" height="174.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">fstatat, statx</tspan><tspan x="870.0" dy="16.9">AT_SYMLINK_NOFOLLOW</tspan><tspan x="870.0" dy="16.9">linkat</tspan><tspan x="870.0" dy="16.9">AT_SYMLINK_FOLLOW</tspan><tspan x="870.0" dy="16.9">open, openat</tspan><tspan x="870.0" dy="16.9">O_NOFOLLOW, O_PATH</tspan><tspan x="870.0" dy="16.9">fchownat, utimensat</tspan></text>
<rect x="30.0" y="428.0" width="1000.0" height="78.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="530.0" y="463.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">кінцева скісна риска дорівнює додаванню «/.»: вона примусово розгортає останній компонент</tspan><tspan x="530.0" dy="16.9">і вимагає, щоб там був каталог — тому lstat(&quot;посилання/&quot;) розповідає вже про ціль, а не про посилання</tspan></text>
</svg>