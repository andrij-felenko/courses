<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1030" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки часу файл прожив під іменем</text>
<text x="515.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">класичний прийом: створити ім'я й одразу від'єднати</text>
<rect x="60.0" y="78.0" width="190.0" height="56.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="155.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">open(O_CREAT)</tspan><tspan x="155.0" dy="16.9">ім'я з'явилося</tspan></text>
<rect x="300.0" y="78.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">unlink</tspan><tspan x="395.0" dy="16.9">імені вже немає</tspan></text>
<rect x="540.0" y="78.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">запис даних</tspan><tspan x="635.0" dy="16.9">доки живий дескриптор</tspan></text>
<rect x="780.0" y="78.0" width="190.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">close</tspan><tspan x="875.0" dy="16.9">блоки звільнено</tspan></text>
<line x1="258.0" y1="106.0" x2="292.0" y2="106.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="498.0" y1="106.0" x2="532.0" y2="106.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="738.0" y1="106.0" x2="772.0" y2="106.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="155.0" y1="136.0" x2="155.0" y2="146.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="60.0" y="148.0" width="430.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">поки ім'я існує, чужий процес</tspan><tspan x="275.0" dy="16.9">встигає його відкрити або підмінити</tspan></text>
<text x="515.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">O_TMPFILE: ім'я дають наприкінці</text>
<rect x="60.0" y="248.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">open(dir, O_TMPFILE)</tspan><tspan x="155.0" dy="16.9">інод без імені</tspan></text>
<rect x="300.0" y="248.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">запис даних</tspan><tspan x="395.0" dy="16.9">імені все ще немає</tspan></text>
<rect x="540.0" y="248.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">fsync</tspan><tspan x="635.0" dy="16.9">дані на носії</tspan></text>
<rect x="780.0" y="248.0" width="190.0" height="56.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">linkat(/proc/self/fd/N)</tspan><tspan x="875.0" dy="16.9">ім'я з'являється</tspan></text>
<line x1="258.0" y1="276.0" x2="292.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="498.0" y1="276.0" x2="532.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="738.0" y1="276.0" x2="772.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="875.0" y1="306.0" x2="875.0" y2="316.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="5,4"/>
<rect x="600.0" y="318.0" width="380.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">ім'я з'являється лише тут —</tspan><tspan x="790.0" dy="16.9">одразу разом із повним вмістом</tspan></text>
</svg>