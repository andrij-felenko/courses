<text x="220.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Кворум = floor(3/2) + 1 = 2 (Більшість збережена)</text>
<rect x="76.7" y="119.1" width="106.6" height="41.9" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вузол 1 (Node 1)</tspan><tspan x="130.0" dy="12.3">Стан: Active</tspan></text>
<rect x="256.7" y="119.1" width="106.6" height="41.9" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="310.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Вузол 2 (Node 2)</tspan><tspan x="310.0" dy="12.3">Стан: Active</tspan></text>
<rect x="120.7" y="197.9" width="198.6" height="64.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="220.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Дія Сегменту A:</tspan><tspan x="220.0" dy="11.7">1. Зафіксовано втрату Вузла 3</tspan><tspan x="220.0" dy="11.7">2. Виклик STONITH через IPMI/iLO</tspan><tspan x="220.0" dy="11.7">3. Блокування доступу до SAN</tspan></text>
