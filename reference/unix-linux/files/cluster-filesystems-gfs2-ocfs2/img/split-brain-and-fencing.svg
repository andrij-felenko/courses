<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a252f" text-anchor="middle" font-weight="700">Розрив Мережі (Split-Brain), Кворум та Апаратна Ізоляція STONITH</text>
