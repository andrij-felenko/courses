<text x="443.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">МЕРЕЖІ</text>
<line x1="430.0" y1="115.0" x2="470.0" y2="185.0" stroke="#dc2626" stroke-width="2.0"/>
<rect x="490.0" y="50.0" width="380.0" height="280.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="680.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Сегмент B: НЕМАЄ КВОРУМУ (1 з 3)</text>
<text x="680.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">1 &lt; 2 → Вузол втрачає право на запис</text>
<rect x="614.0" y="119.1" width="131.9" height="41.9" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="680.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Вузол 3 (Node 3)</tspan><tspan x="680.0" dy="12.3">[ІЗОЛЬОВАНИЙ ВУЗОЛ]</tspan></text>
<rect x="587.9" y="197.9" width="184.2" height="64.1" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="680.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Примусове Знеструмлення:</tspan><tspan x="680.0" dy="11.7">STONITH вимикає живлення</tspan><tspan x="680.0" dy="11.7">або SCSI-3 PR скидає реєстрацію.</tspan><tspan x="680.0" dy="11.7">Запис унеможливлено!</tspan></text>
