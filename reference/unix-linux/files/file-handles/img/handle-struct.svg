<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="40.0" width="560.0" height="600.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="320.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">struct file_handle у пам'яті</text>
<line x1="54.0" y1="82.0" x2="586.0" y2="82.0" stroke="#2457d6" stroke-width="1.2"/>
<rect x="660.0" y="40.0" width="560.0" height="600.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="940.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Розмір узгоджують у два виклики</text>
<line x1="674.0" y1="82.0" x2="1206.0" y2="82.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="66.0" y="108.0" width="508.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="320.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">handle_bytes — unsigned int, 4 байти</tspan><tspan x="320.0" dy="18.2">[in] скільки місця під байти дав виклик</tspan><tspan x="320.0" dy="18.2">[out] скільки насправді треба або зайнято</tspan></text>
<rect x="66.0" y="220.0" width="508.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="320.0" y="254.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">handle_type — int, 4 байти</tspan><tspan x="320.0" dy="18.2">[out] як саме файлова система закодувала;</tspan><tspan x="320.0" dy="18.2">молодші 8 бітів — від ФС, старші 16 — від ядра</tspan></text>
<rect x="66.0" y="332.0" width="508.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="320.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">f_handle[] — рівно handle_bytes байтів</tspan><tspan x="320.0" dy="18.2">[out] непрозорі байти рукоятки;</tspan><tspan x="320.0" dy="18.2">довжина завжди кратна чотирьом</tspan></text>
<rect x="66.0" y="444.0" width="508.0" height="110.0" rx="6" fill="#fff6e5" stroke="#1a1a1a" stroke-width="1.6"/><text x="320.0" y="476.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Хвіст гнучкий: sizeof(struct file_handle) = 8,</tspan><tspan x="320.0" dy="18.2">і самої рукоятки в ці 8 байтів не входить.</tspan><tspan x="320.0" dy="18.2">malloc(sizeof *fh + MAX_HANDLE_SZ) = 8 + 128 = 136</tspan><tspan x="320.0" dy="18.2">вистачає за будь-якої файлової системи.</tspan></text>
<rect x="66.0" y="566.0" width="508.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="320.0" y="593.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">handle_bytes понад MAX_HANDLE_SZ — це EINVAL,</tspan><tspan x="320.0" dy="18.2">а не «стільки, скільки влізе».</tspan></text>
<rect x="686.0" y="108.0" width="508.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="940.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">виклик 1: handle_bytes = 0</tspan></text>
<line x1="940.0" y1="186.0" x2="940.0" y2="206.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="686.0" y="208.0" width="508.0" height="86.0" rx="6" fill="#fff6e5" stroke="#1a1a1a" stroke-width="1.6"/><text x="940.0" y="246.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">−1, errno = EOVERFLOW,</tspan><tspan x="940.0" dy="18.2">handle_bytes := 12 — стільки треба</tspan></text>
<line x1="940.0" y1="296.0" x2="940.0" y2="316.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="686.0" y="318.0" width="508.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="940.0" y="351.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">виділити sizeof *fh + 12 байтів</tspan><tspan x="940.0" dy="18.2">і покласти handle_bytes = 12</tspan></text>
<line x1="940.0" y1="396.0" x2="940.0" y2="416.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="686.0" y="418.0" width="508.0" height="86.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="940.0" y="456.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">виклик 2: повертає 0 —</tspan><tspan x="940.0" dy="19.5">байти й handle_type на місці</tspan></text>
<rect x="686.0" y="522.0" width="508.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="562.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">Пастка: EOVERFLOW, а handle_bytes не зріс —</tspan><tspan x="940.0" dy="18.2">для цього імені рукоятки немає взагалі.</tspan><tspan x="940.0" dy="18.2">Повторювати з більшим буфером марно.</tspan></text>
</svg>