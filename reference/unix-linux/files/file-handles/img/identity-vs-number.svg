<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="46.0" width="560.0" height="570.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="320.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Ключ покажчика — номер inode</text>
<line x1="54.0" y1="88.0" x2="586.0" y2="88.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="640.0" y="46.0" width="560.0" height="570.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="920.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Ключ покажчика — рукоятка</text>
<line x1="654.0" y1="88.0" x2="1186.0" y2="88.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="66.0" y="104.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="320.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">УЧОРА</tspan><tspan x="320.0" dy="18.2">index.log лежить в inode 4711</tspan><tspan x="320.0" dy="18.2">у покажчику збережено число 4711</tspan></text>
<line x1="320.0" y1="196.0" x2="320.0" y2="218.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="66.0" y="222.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="320.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ЗА НІЧ</tspan><tspan x="320.0" dy="18.2">index.log вилучено, inode 4711 звільнено;</tspan><tspan x="320.0" dy="18.2">новий journal.tmp зайняв той самий 4711</tspan></text>
<line x1="320.0" y1="314.0" x2="320.0" y2="336.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="66.0" y="340.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="320.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">СЬОГОДНІ</tspan><tspan x="320.0" dy="18.2">програма шукає файл із номером 4711</tspan><tspan x="320.0" dy="18.2">і знаходить journal.tmp</tspan></text>
<rect x="666.0" y="104.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="920.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">УЧОРА</tspan><tspan x="920.0" dy="18.2">index.log лежить в inode 4711, покоління 12</tspan><tspan x="920.0" dy="18.2">у покажчику збережено 4711 · 12</tspan></text>
<line x1="920.0" y1="196.0" x2="920.0" y2="218.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="666.0" y="222.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="920.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">ЗА НІЧ</tspan><tspan x="920.0" dy="18.2">index.log вилучено; journal.tmp узяв inode 4711,</tspan><tspan x="920.0" dy="18.2">і лічильник поколінь піднявся до 13</tspan></text>
<line x1="920.0" y1="314.0" x2="920.0" y2="336.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="666.0" y="340.0" width="508.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="920.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">СЬОГОДНІ</tspan><tspan x="920.0" dy="18.2">ядро бере inode 4711 і звіряє покоління:</tspan><tspan x="920.0" dy="18.2">12 у рукоятці ≠ 13 в inode</tspan></text>
<rect x="66.0" y="466.0" width="508.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="320.0" y="504.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Помилки немає, і бути не може.</tspan><tspan x="320.0" dy="18.2">Покажчик мовчки говорить про чужий файл,</tspan><tspan x="320.0" dy="18.2">і жодне поле stat цього не викаже.</tspan></text>
<rect x="666.0" y="466.0" width="508.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="920.0" y="504.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">ESTALE — «такого файлу тут уже немає».</tspan><tspan x="920.0" dy="18.2">Програма дізнається правду одразу</tspan><tspan x="920.0" dy="18.2">і перечитує лише те, що справді змінилося.</tspan></text>
</svg>