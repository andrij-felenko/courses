<rect x="760.0" y="372.0" width="470.0" height="62.0" rx="6" fill="#dfe8fc" stroke="#2457d6" stroke-width="2.0"/><text x="995.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">seq/1   розмір 8192</tspan></text>
<line x1="544.0" y1="403.0" x2="746.0" y2="403.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
