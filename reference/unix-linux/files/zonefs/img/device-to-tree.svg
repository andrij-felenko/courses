<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 768" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="768" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">усе, що zonefs робить на монтуванні: один звіт про зони — і дерево файлів</text>
<text x="295.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">пристрій про себе розповів</text>
<text x="995.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що видно в точці монтування</text>
<rect x="60.0" y="120.0" width="470.0" height="62.0" rx="6" fill="#e8f4ea" stroke="#6b7280" stroke-width="2.0"/><text x="295.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">зона 0 — звичайна, тут суперблок</tspan></text>
<rect x="760.0" y="120.0" width="470.0" height="62.0" rx="6" fill="#ececec" stroke="#6b7280" stroke-width="2.0"/><text x="995.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">назовні не показана взагалі</tspan></text>
<line x1="544.0" y1="151.0" x2="746.0" y2="151.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7,6"/>
<rect x="60.0" y="204.0" width="470.0" height="62.0" rx="6" fill="#e8f4ea" stroke="#27ae60" stroke-width="2.0"/><text x="295.0" y="240.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">зона 1 — звичайна, 256 МіБ</tspan></text>
<rect x="760.0" y="204.0" width="470.0" height="62.0" rx="6" fill="#e8f4ea" stroke="#27ae60" stroke-width="2.0"/><text x="995.0" y="240.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">cnv/0   розмір 268435456</tspan></text>
<line x1="544.0" y1="235.0" x2="746.0" y2="235.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="288.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="295.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">зона 2 — послідовна, вказівник 0</tspan></text>
<rect x="760.0" y="288.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="995.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">seq/0   розмір 0</tspan></text>
<line x1="544.0" y1="319.0" x2="746.0" y2="319.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
