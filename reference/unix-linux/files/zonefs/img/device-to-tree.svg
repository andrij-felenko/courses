<rect x="760.0" y="456.0" width="470.0" height="62.0" rx="6" fill="#dfe8fc" stroke="#c0392b" stroke-width="2.0"/><text x="995.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">seq/2   розмір 268435456</tspan></text>
<line x1="544.0" y1="487.0" x2="746.0" y2="487.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="570.0" width="380.0" height="86.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="608.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ім'я файлу — це порядковий</tspan><tspan x="250.0" dy="18.2">номер зони серед свого ґатунку</tspan></text>
<rect x="460.0" y="570.0" width="380.0" height="86.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="608.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">розмір файлу — це положення</tspan><tspan x="650.0" dy="18.2">вказівника запису в зоні</tspan></text>
<rect x="860.0" y="570.0" width="380.0" height="86.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="1050.0" y="608.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">st_blocks — це місткість зони,</tspan><tspan x="1050.0" dy="18.2">тобто найбільший розмір файлу</tspan></text>
<rect x="60.0" y="686.0" width="1180.0" height="62.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="650.0" y="722.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">на носій при цьому не пішло жодного запису: єдині метадані zonefs — незмінний суперблок у нульовому секторі</tspan></text>
