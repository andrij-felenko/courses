<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 820" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="820" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">файл послідовної зони: єдина точка, куди приймуть запис</text>
<rect x="90.0" y="300.0" width="300.0" height="92.0" rx="4" fill="#dfe8fc" stroke="#2457d6" stroke-width="2.2"/>
<rect x="390.0" y="300.0" width="520.0" height="92.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="910.0" y="300.0" width="200.0" height="92.0" rx="4" fill="#ececec" stroke="#6b7280" stroke-width="1.6"/>
<text x="240.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">записані дані</text>
<text x="650.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">вільна частина зони</text>
<text x="1010.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">порожнеча</text>
<rect x="200.0" y="140.0" width="380.0" height="66.0" rx="6" fill="#e8f4ea" stroke="#27ae60" stroke-width="2.2"/><text x="390.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">запис за цим зміщенням —</tspan><tspan x="390.0" dy="18.9">єдиний, який приймуть</tspan></text>
<line x1="390.0" y1="210.0" x2="390.0" y2="294.0" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="140.0" width="380.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="910.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">запис, що починається за</tspan><tspan x="910.0" dy="18.9">місткістю зони, — EFBIG</tspan></text>
<line x1="940.0" y1="210.0" x2="940.0" y2="294.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,5"/>
<line x1="390.0" y1="394.0" x2="390.0" y2="420.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="215.0" y="422.0" width="350.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="390.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">вказівник запису = розмір файлу</tspan></text>
<line x1="910.0" y1="394.0" x2="910.0" y2="420.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="735.0" y="422.0" width="350.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="910.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">місткість зони = st_blocks · 512</tspan></text>
<rect x="90.0" y="508.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="542.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">запис за будь-яким іншим</tspan><tspan x="270.0" dy="18.2">зміщенням — EINVAL</tspan></text>
<rect x="470.0" y="508.0" width="360.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="542.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">читання за розміром —</tspan><tspan x="650.0" dy="18.2">звичайний кінець файлу</tspan></text>
<rect x="850.0" y="508.0" width="360.0" height="78.0" rx="6" fill="#e8f4ea" stroke="#27ae60" stroke-width="2.0"/><text x="1030.0" y="542.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">успішний запис зсуває</tspan><tspan x="1030.0" dy="18.2">вказівник, а з ним і розмір</tspan></text>
<rect x="90.0" y="616.0" width="550.0" height="92.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.2"/><text x="365.0" y="657.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">ftruncate до 0 — скидання зони:</tspan><tspan x="365.0" dy="18.9">вміст стерто фізично, вказівник на початку</tspan></text>
<rect x="700.0" y="616.0" width="550.0" height="92.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.2"/><text x="975.0" y="657.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">ftruncate до місткості — завершення зони:</tspan><tspan x="975.0" dy="18.9">дописувати нікуди, розмір дорівнює місткості</tspan></text>
<rect x="90.0" y="734.0" width="1160.0" height="58.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="670.0" y="768.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">інших значень скорочення немає: обидва дозволені — це команди до самого носія, а не правка обліку</tspan></text>
</svg>