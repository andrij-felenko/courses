<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 1140" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="1140" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">що ядро перевіряє в записі у файл zonefs і в якому порядку</text>
<rect x="90.0" y="108.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">зміщення ≥ місткості зони?</tspan></text>
<rect x="790.0" y="108.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">EFBIG — перша ж перевірка,</tspan><tspan x="1025.0" dy="18.9">ще до розбору режиму запису</tspan></text>
<line x1="646.0" y1="147.0" x2="774.0" y2="147.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="190.0" x2="360.0" y2="218.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="222.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">запис без O_DIRECT у файл</tspan><tspan x="360.0" dy="19.5">послідовної зони?</tspan></text>
<rect x="790.0" y="222.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">EIO — прямий запис тут обов'язковий</tspan></text>
<line x1="646.0" y1="261.0" x2="774.0" y2="261.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="304.0" x2="360.0" y2="332.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="336.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">O_APPEND у файлі</tspan><tspan x="360.0" dy="19.5">звичайної зони?</tspan></text>
<rect x="790.0" y="336.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">EINVAL — вказівника запису там немає</tspan></text>
<line x1="646.0" y1="375.0" x2="774.0" y2="375.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="418.0" x2="360.0" y2="446.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="450.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="494.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">довжина перетинає місткість зони?</tspan></text>
<rect x="790.0" y="450.0" width="470.0" height="78.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.2"/><text x="1025.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">довжину підрізають:</tspan><tspan x="1025.0" dy="18.9">вийде КОРОТКИЙ запис, а не помилка</tspan></text>
<line x1="646.0" y1="489.0" x2="774.0" y2="489.0" stroke="#b8860b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="532.0" x2="360.0" y2="560.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="564.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="598.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">зміщення й довжина кратні</tspan><tspan x="360.0" dy="19.5">st_blksize?</tspan></text>
<rect x="790.0" y="564.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="608.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">EINVAL — вимога прямого вводу-виводу</tspan></text>
<line x1="646.0" y1="603.0" x2="774.0" y2="603.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="646.0" x2="360.0" y2="674.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="678.0" width="540.0" height="78.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.2"/><text x="360.0" y="712.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">зміщення дорівнює</tspan><tspan x="360.0" dy="19.5">розмірові файлу?</tspan></text>
<rect x="790.0" y="678.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="722.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">EINVAL — той самий код, інша причина</tspan></text>
<line x1="646.0" y1="717.0" x2="774.0" y2="717.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="760.0" x2="360.0" y2="788.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="792.0" width="540.0" height="78.0" rx="6" fill="#e8f4ea" stroke="#27ae60" stroke-width="2.2"/><text x="360.0" y="836.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">запит іде на пристрій</tspan></text>
<rect x="790.0" y="792.0" width="470.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1025.0" y="836.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">неповний результат перетворюють на EIO</tspan></text>
<line x1="646.0" y1="831.0" x2="774.0" y2="831.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="890.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ліворуч — шлях, яким запит іде далі</text>
<rect x="90.0" y="912.0" width="1170.0" height="74.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.2"/><text x="675.0" y="944.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">після невдалого запису вказівник у пам'яті ядра вже зсунуто наперед —</tspan><tspan x="675.0" dy="18.9">розмір файлу правлять, перепитавши стан зони в самого пристрою</tspan></text>
</svg>