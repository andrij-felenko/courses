<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SEEK_HOLE приходив у Linux двічі</text>
<line x1="210.0" y1="107.0" x2="210.0" y2="625.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="4,5"/>
<text x="176.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2006</text>
<circle cx="210.0" cy="107.0" r="7.0" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.2"/>
<rect x="250.0" y="78.0" width="830.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="102.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Solaris: lseek дістає SEEK_HOLE і SEEK_DATA</tspan><tspan x="665.0" dy="17.6">два питання про найближчу межу замість карти файлу</tspan></text>
<text x="176.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">листопад 2007</text>
<circle cx="210.0" cy="181.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="250.0" y="152.0" width="830.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="665.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Josef Bacik надсилає в LKML перший патч для Linux</tspan><tspan x="665.0" dy="17.6">загальна реалізація поблочно, через bmap</tspan></text>
<text x="176.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">жовтень 2007</text>
<circle cx="210.0" cy="255.0" r="7.0" fill="#fff6e5" stroke="#b8860b" stroke-width="2.2"/>
<rect x="250.0" y="226.0" width="830.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="665.0" y="250.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Andreas Dilger пропонує ioctl FIEMAP — повну карту екстентів</tspan><tspan x="665.0" dy="17.6">LWN, 3 грудня: «SEEK_HOLE or FIEMAP?» — вирок на користь карти</tspan></text>
<text x="176.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">грудень 2008</text>
<circle cx="210.0" cy="329.0" r="7.0" fill="#fff6e5" stroke="#b8860b" stroke-width="2.2"/>
<rect x="250.0" y="300.0" width="830.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="665.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">ядро 2.6.28: FIEMAP прийнято в Linux</tspan><tspan x="665.0" dy="17.6">SEEK_HOLE лишається поза ядром — його «зробить бібліотека C»</tspan></text>
<text x="176.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">квітень 2011</text>
<circle cx="210.0" cy="403.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="250.0" y="374.0" width="830.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="665.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Bacik надсилає патч удруге</tspan><tspan x="665.0" dy="17.6">«fiemap у таких речах, як cp, створює більше проблем, ніж розв'язує»</tspan></text>
<text x="176.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">жовтень 2011</text>
<circle cx="210.0" cy="477.0" r="7.0" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.2"/>
<rect x="250.0" y="448.0" width="830.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">ядро 3.1: SEEK_HOLE і SEEK_DATA в Linux</tspan><tspan x="665.0" dy="17.6">разом із загальною відповіддю «весь файл — дані, діра в кінці»</tspan></text>
<text x="176.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2011 – 2018</text>
<circle cx="210.0" cy="551.0" r="7.0" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.2"/>
<rect x="250.0" y="522.0" width="830.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">розповзання по файлових системах: Btrfs 3.1, OCFS2 3.2, XFS 3.5,</tspan><tspan x="665.0" dy="17.6">ext4 і tmpfs 3.8, NFS 3.18, FUSE 4.5, GFS2 4.15</tspan></text>
<text x="176.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2024</text>
