<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">два способи спитати файлову систему про порожнечу</text>
<rect x="40.0" y="70.0" width="500.0" height="46.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="290.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">ioctl FIEMAP: «віддай карту»</tspan></text>
<rect x="40.0" y="132.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.4"/><text x="290.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">відповідь — масив екстентів зі зсувами,</tspan><tspan x="290.0" dy="16.9">довжинами й набором прапорців</tspan></text>
<rect x="40.0" y="206.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.4"/><text x="290.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">два виклики: спершу спитати кількість,</tspan><tspan x="290.0" dy="16.9">потім віддати буфер потрібного розміру</tspan></text>
<rect x="40.0" y="280.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.4"/><text x="290.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">прапорці HOLE, UNWRITTEN, DELALLOC,</tspan><tspan x="290.0" dy="16.9">ENCODED, DATA_INLINE — кожен окремий випадок</tspan></text>
<rect x="40.0" y="354.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.4"/><text x="290.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">ФС без підтримки відповідає EOPNOTSUPP:</tspan><tspan x="290.0" dy="16.9">у викликача мусить бути запасна гілка</tspan></text>
<rect x="560.0" y="70.0" width="500.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="810.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">lseek SEEK_HOLE: «де найближча межа»</tspan></text>
<rect x="560.0" y="132.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="167.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">відповідь — одне число: зсув межі</tspan></text>
<rect x="560.0" y="206.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">один виклик, той самий lseek,</tspan><tspan x="810.0" dy="16.9">без структур і без буферів</tspan></text>
<rect x="560.0" y="280.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">кінець файлу завжди вважається дірою,</tspan><tspan x="810.0" dy="16.9">тож відповідь є завжди</tspan></text>
<rect x="560.0" y="354.0" width="500.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="810.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">ФС без підтримки каже «все — дані»:</tspan><tspan x="810.0" dy="16.9">відповідь незручна, але правдива</tspan></text>
<rect x="40.0" y="420.0" width="1020.0" height="40.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="444.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">слабший контракт переміг сильніший: на просте питання завжди є проста відповідь</tspan></text>
</svg>