<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 230" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="230" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальний порядок пошуку символу (Symbol Search Scope)</text>
<rect x="79.5" y="65.0" width="140.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. LD_PRELOAD</tspan><tspan x="150.0" dy="16.9">(перехоплювачі)</tspan></text>
<rect x="259.4" y="65.0" width="181.2" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">2. Головний бінарник</tspan><tspan x="350.0" dy="16.9">(Executable Binary)</tspan></text>
<rect x="465.4" y="65.0" width="189.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">3. Спільні бібліотеки</tspan><tspan x="560.0" dy="16.9">(libc.so, libm.so...)</tspan></text>
<line x1="225.0" y1="90.0" x2="270.0" y2="90.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="430.0" y1="90.0" x2="480.0" y2="90.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="150.0" width="580.0" height="50.0" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Динамічний лінкер ld.so шукає назву символу за алгоритмом First-Match Wins.</tspan><tspan x="350.0" dy="15.6">Перше знайдене визначення символу зв'язується з усіма GOT-записами.</tspan></text>
</svg>