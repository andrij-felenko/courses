<text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">dlsym(RTLD_NEXT)</text>
<rect x="100.0" y="160.0" width="500.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="178.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">myhook.so отримує виклик першою, виконує логування чи перевірку,</tspan><tspan x="350.0" dy="15.6">після чого передає керування наступному символу в списку завантаження.</tspan></text>
