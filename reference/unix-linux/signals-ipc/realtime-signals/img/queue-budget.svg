<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга коштує пам'яті, і квота — спільна на всього користувача</text>
<rect x="40.0" y="66.0" width="420.0" height="240.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">процеси одного власника</text>
<rect x="64.0" y="110.0" width="372.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="250.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">служба A</tspan></text>
<line x1="444.0" y1="135.0" x2="520.0" y2="200.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="64.0" y="172.0" width="372.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="250.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">служба B</tspan></text>
<line x1="444.0" y1="197.0" x2="520.0" y2="200.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="64.0" y="234.0" width="372.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="250.0" y="248.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">чужий</tspan><tspan x="250.0" dy="14.3">скрипт того ж</tspan><tspan x="250.0" dy="14.3">користувача</tspan></text>
<line x1="444.0" y1="259.0" x2="520.0" y2="200.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="528.0" y="108.0" width="300.0" height="190.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="678.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">RLIMIT_SIGPENDING</text>
<text x="678.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="678.0" dy="0.0">спільна квота записів</tspan><tspan x="678.0" dy="14.3">на РЕАЛЬНОГО власника,</tspan><tspan x="678.0" dy="14.3">по всіх його процесах</tspan><tspan x="678.0" dy="14.3">(ulimit -i)</tspan></text>
<text x="678.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">рахуються і звичайні теж</text>
<line x1="834.0" y1="170.0" x2="900.0" y2="150.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="908.0" y="118.0" width="216.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="1016.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1016.0" dy="0.0">є місце</tspan><tspan x="1016.0" dy="15.6">sigqueue() = 0</tspan></text>
<line x1="834.0" y1="240.0" x2="900.0" y2="260.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="908.0" y="230.0" width="216.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1016.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1016.0" dy="0.0">місця немає</tspan><tspan x="1016.0" dy="15.6">sigqueue() = EAGAIN</tspan></text>
<rect x="40.0" y="336.0" width="540.0" height="108.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="310.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">kill() квоту не питає</text>
<text x="310.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Один примірник сигналу, який ще не очікує, покласти</tspan><tspan x="310.0" dy="14.3">вдасться завжди — інакше вичерпана квота робила б</tspan><tspan x="310.0" dy="14.3">процеси невбиваними.</tspan></text>
<rect x="600.0" y="336.0" width="524.0" height="108.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="862.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро собі квоти не бере</text>
<text x="862.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="862.0" dy="0.0">POSIX-таймер тримає щонайбільше ОДИН незабраний</tspan><tspan x="862.0" dy="14.3">сигнал; решту спрацювань рахує лічильник пропусків</tspan><tspan x="862.0" dy="14.3">(timer_getoverrun).</tspan></text>
<rect x="40.0" y="472.0" width="1084.0" height="110.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="582.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з цього виходить для відправника</text>
<text x="582.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">EAGAIN — не аварія, а звичайний стан під сплеском. Потрібен план:</tspan><tspan x="582.0" dy="14.3">спробувати ще раз, злити кілька подій в одну й надіслати один сигнал,</tspan><tspan x="582.0" dy="14.3">або чесно повідомити про втрату. Мовчки проковтнути — повернутися до злипання.</tspan></text>
</svg>