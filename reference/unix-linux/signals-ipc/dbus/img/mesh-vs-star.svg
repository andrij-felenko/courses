<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">напряму: 3 клієнти × 3 служби = 9 окремих з'єднань</text>
<text x="530.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">кожна пара сама домовляється про шлях сокета, кадрування, типи й перевірку прав</text>
