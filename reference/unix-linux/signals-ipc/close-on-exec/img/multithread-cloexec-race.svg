<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан гонитви: неатомарний open() + fcntl() у багатопотоковій програмі</text>
<line x1="60.0" y1="70.0" x2="60.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час (t)</text>
<rect x="130.0" y="70.0" width="300.0" height="300.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="280.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік 1 (Відкриває файл)</text>
<rect x="145.0" y="120.0" width="270.0" height="42.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="155.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. fd = open(&quot;secret.key&quot;, O_RDONLY)</text>
<rect x="145.0" y="175.0" width="270.0" height="95.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНЕ ВІКНО ГОНИТВИ</text>
<text x="280.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(fd існує, але close_on_exec == 0)</text>
<text x="280.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">дитина успадкує відкритий файл!</text>
<rect x="145.0" y="285.0" width="270.0" height="42.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="155.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. fcntl(fd, F_SETFD, FD_CLOEXEC)</text>
<text x="155.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(пізно! дочірній процес уже створено)</text>
<rect x="480.0" y="70.0" width="340.0" height="300.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="650.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік 2 (Створює підпроцес)</text>
<rect x="495.0" y="185.0" width="310.0" height="46.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="505.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. pid = fork()</text>
<text x="505.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">дитина копіює fdtable (у якій fd ще без прапорця)</text>
<rect x="495.0" y="245.0" width="310.0" height="50.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="505.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">3. [у дитині] execve(&quot;/bin/helper&quot;)</text>
<text x="505.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ядро НЕ закриває fd -&gt; секрет витік у helper!</text>
<line x1="415.0" y1="200.0" x2="495.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="458.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">гонка</text>
</svg>