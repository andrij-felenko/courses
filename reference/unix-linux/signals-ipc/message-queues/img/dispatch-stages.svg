<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">шлях розпорядження крізь службу</text>
<rect x="40.0" y="84.0" width="170.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">виробники</tspan><tspan x="125.0" dy="16.9">mq_timedsend()</tspan></text>
<rect x="280.0" y="84.0" width="200.0" height="116.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="129.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">черга в ядрі</tspan><tspan x="380.0" dy="16.9">mq_maxmsg слотів</tspan><tspan x="380.0" dy="16.9">видача за рангом</tspan></text>
<rect x="570.0" y="84.0" width="190.0" height="116.0" rx="6" fill="#eaf6ec" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="129.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">дві полиці</tspan><tspan x="665.0" dy="16.9">по 8 записів</tspan><tspan x="665.0" dy="16.9">термінові · рутинні</tspan></text>
<rect x="850.0" y="84.0" width="150.0" height="116.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">диспетчер</tspan><tspan x="925.0" dy="16.9">квота 4 : 1</tspan></text>
<line x1="214.0" y1="142.0" x2="274.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="484.0" y1="142.0" x2="564.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="764.0" y1="142.0" x2="844.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="202.0" x2="380.0" y2="246.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="280.0" y="250.0" width="200.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">черга повна →</tspan><tspan x="380.0" dy="15.6">відправник дістає EAGAIN</tspan><tspan x="380.0" dy="15.6">і гальмує сам</tspan></text>
<line x1="665.0" y1="202.0" x2="665.0" y2="246.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="560.0" y="250.0" width="210.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="665.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">полиця мала НАВМИСНО:</tspan><tspan x="665.0" dy="15.6">більша полиця осушує чергу</tspan><tspan x="665.0" dy="15.6">й протитиску не лишається</tspan></text>
<line x1="925.0" y1="202.0" x2="925.0" y2="246.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="825.0" y="250.0" width="200.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">після чотирьох термінових</tspan><tspan x="925.0" dy="15.6">одне рутинне йде поза</tspan><tspan x="925.0" dy="15.6">чергою — і не голодує</tspan></text>
<text x="380.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">протитиск</text>
<text x="665.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">місце, де його легко втратити</text>
<text x="925.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">справедливість</text>
<text x="520.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ядро впорядковує за рангом, але від голодування не рятує; процес додає справедливість —</text>
<text x="520.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">і мусить при цьому не зруйнувати протитиск, заради якого черга й має стелю</text>
</svg>