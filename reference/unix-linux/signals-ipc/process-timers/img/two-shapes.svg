<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи скласти багато періодів в один цикл подій</text>
<rect x="40.0" y="36.0" width="590.0" height="556.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<rect x="670.0" y="36.0" width="590.0" height="556.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<rect x="70.0" y="56.0" width="530.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="335.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">A · окремий timerfd на кожну задачу</tspan></text>
<rect x="70.0" y="122.0" width="530.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="335.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">ЯДРО тримає N періодичних таймерів;</tspan><tspan x="335.0" dy="16.2">фазу веде it_interval, тобто саме ядро</tspan></text>
<rect x="70.0" y="222.0" width="166.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="153.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">timerfd</tspan><tspan x="153.0" dy="16.2">20 мс</tspan></text>
<line x1="153.0" y1="286.0" x2="153.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="252.0" y="222.0" width="166.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="335.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">timerfd</tspan><tspan x="335.0" dy="16.2">200 мс</tspan></text>
<line x1="335.0" y1="286.0" x2="335.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="434.0" y="222.0" width="166.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="517.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="517.0" dy="0.0">timerfd</tspan><tspan x="517.0" dy="16.2">5 с</tspan></text>
<line x1="517.0" y1="286.0" x2="517.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="316.0" width="530.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="335.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">один epoll_wait: сокети й таймери — рівні події</tspan></text>
<rect x="70.0" y="402.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="335.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">на спрацювання: один read(), жодного переозброєння —</tspan><tspan x="335.0" dy="16.2">O(1), але N дескрипторів і N таймерів у ядрі</tspan></text>
<rect x="70.0" y="506.0" width="530.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="335.0" y="541.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">доречно, поки задач одиниці-сотні й вони сталі</tspan></text>
<rect x="700.0" y="56.0" width="530.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="965.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">B · один timerfd на найближчий дедлайн</tspan></text>
<rect x="700.0" y="122.0" width="530.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="965.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">ЯДРО тримає ОДИН таймер —</tspan><tspan x="965.0" dy="16.2">на найближчий абсолютний дедлайн</tspan></text>
<rect x="700.0" y="222.0" width="530.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="965.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">купа строків У ПРОГРАМІ: у корені — найближчий</tspan></text>
<line x1="965.0" y1="286.0" x2="965.0" y2="312.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="700.0" y="316.0" width="530.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="965.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">один epoll_wait: сокети й ОДИН таймер</tspan></text>
<rect x="700.0" y="402.0" width="530.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="965.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">на спрацювання: знімаємо все, чому час настав —</tspan><tspan x="965.0" dy="16.2">O(log N) на кожен плюс одне переозброєння кореня</tspan></text>
<rect x="700.0" y="506.0" width="530.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="965.0" y="541.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">єдиний спосіб, коли строків тисячі й вони недовговічні</tspan></text>
<rect x="40.0" y="612.0" width="1220.0" height="68.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="650.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Фаза в обох обрисах тримається однаково: строк задають АБСОЛЮТНИМ моментом, а наступний рахують</tspan><tspan x="650.0" dy="16.2">від номіналу, а не від миті обробки. Різниця лише в тому, хто веде розклад — ядро чи ваша купа.</tspan></text>
</svg>