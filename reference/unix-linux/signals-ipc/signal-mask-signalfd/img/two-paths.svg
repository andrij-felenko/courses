<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один сигнал, два шляхи: обробник або дескриптор</text>
<rect x="420.0" y="58.0" width="260.0" height="54.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="2.0"/><text x="550.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">надійшов SIGTERM</tspan></text>
<line x1="480.0" y1="114.0" x2="300.0" y2="158.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="114.0" x2="800.0" y2="158.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">не заблокований</text>
<text x="800.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">заблокований</text>
<rect x="40.0" y="166.0" width="480.0" height="380.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="280.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ЧЕРЕЗ ОБРОБНИК</text>
<rect x="66.0" y="216.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="280.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ядро вставляє виклик функції</tspan><tspan x="280.0" dy="15.6">між двома машинними інструкціями</tspan></text>
<line x1="280.0" y1="278.0" x2="280.0" y2="294.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="66.0" y="298.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="280.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">обробник працює на довільному стеку,</tspan><tspan x="280.0" dy="15.6">усередині невідомо якої роботи</tspan></text>
<line x1="280.0" y1="360.0" x2="280.0" y2="376.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="66.0" y="380.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="280.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">звідси можна кликати лише</tspan><tspan x="280.0" dy="15.6">асинхронно-сигнально-безпечне</tspan></text>
<line x1="280.0" y1="442.0" x2="280.0" y2="458.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="66.0" y="462.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="280.0" y="489.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">усе, що треба зробити насправді,</tspan><tspan x="280.0" dy="15.6">доводиться відкладати прапорцем</tspan></text>
<rect x="580.0" y="166.0" width="480.0" height="380.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="820.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ЧЕРЕЗ SIGNALFD</text>
<rect x="606.0" y="216.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="820.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">біт лягає в набір очікуваних</tspan><tspan x="820.0" dy="15.6">і спокійно там чекає</tspan></text>
<line x1="820.0" y1="278.0" x2="820.0" y2="294.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="606.0" y="298.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="820.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">дескриптор стає готовим на читання —</tspan><tspan x="820.0" dy="15.6">звичайна подія для epoll</tspan></text>
<line x1="820.0" y1="360.0" x2="820.0" y2="376.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="606.0" y="380.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="820.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">read() віддає 128 байтів siginfo</tspan><tspan x="820.0" dy="15.6">і знімає біт очікування</tspan></text>
<line x1="820.0" y1="442.0" x2="820.0" y2="458.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="606.0" y="462.0" width="428.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="820.0" y="489.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">код виконується в точці циклу,</tspan><tspan x="820.0" dy="15.6">яку програма обрала сама</tspan></text>
<rect x="40.0" y="572.0" width="1020.0" height="100.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="550.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Перемикач між шляхами — маска, а не сам signalfd</text>
<text x="70.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="70.0" dy="0.0">signalfd лише дає читати вже накопичене; він нічого не блокує сам.</tspan><tspan x="70.0" dy="15.6">Забули заблокувати — сигнал піде лівим шляхом і типова дія вб'є процес раніше, ніж дійде до read().</tspan></text>
</svg>