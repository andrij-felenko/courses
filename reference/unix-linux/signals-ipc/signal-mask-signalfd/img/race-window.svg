<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка «перевірив — заснув» і те, чим її закривають</text>
<rect x="40.0" y="62.0" width="1000.0" height="210.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="540.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Перевірити прапорець, потім заснути — між ними є щілина</text>
<line x1="90.0" y1="176.0" x2="960.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="1000.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<line x1="150.0" y1="168.0" x2="150.0" y2="184.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">перевірка</tspan><tspan x="150.0" dy="15.6">prapor == 0</tspan></text>
<line x1="430.0" y1="168.0" x2="430.0" y2="184.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="430.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">щілина</tspan></text>
<line x1="700.0" y1="168.0" x2="700.0" y2="184.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="700.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">pause()</tspan><tspan x="700.0" dy="15.6">засинає</tspan></text>
<line x1="430.0" y1="246.0" x2="430.0" y2="194.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">сигнал приходить саме тут: обробник ставить прапорець і виходить</text>
<text x="830.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">спить, доки не прийде</text>
<text x="830.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НАСТУПНИЙ сигнал</text>
<rect x="40.0" y="318.0" width="1000.0" height="240.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="540.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Під маскою щілини немає: засинання й зняття маски — одна дія</text>
<line x1="90.0" y1="432.0" x2="960.0" y2="432.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="1000.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<line x1="150.0" y1="424.0" x2="150.0" y2="440.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">заблокувати</tspan><tspan x="150.0" dy="15.6">INT</tspan></text>
<line x1="360.0" y1="424.0" x2="360.0" y2="440.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перевірка</tspan><tspan x="360.0" dy="15.6">prapor == 0</tspan></text>
<line x1="620.0" y1="424.0" x2="620.0" y2="440.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="620.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">sigsuspend():</tspan><tspan x="620.0" dy="15.6">зняти маску + заснути</tspan></text>
<line x1="470.0" y1="502.0" x2="470.0" y2="450.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">сигнал приходить тут — але заблокований, тож лише лягає в очікувані</text>
<text x="800.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">sigsuspend знімає маску вже зсередини сну:</text>
<text x="800.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">накопичене доправляють негайно, сон уривається</text>
</svg>