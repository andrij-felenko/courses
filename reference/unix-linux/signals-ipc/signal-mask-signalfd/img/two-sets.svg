<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ядро вирішує щоразу, повертаючи керування програмі</text>
<rect x="50.0" y="70.0" width="420.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НАБІР ОЧІКУВАНИХ</text>
<text x="260.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">що вже надійшло і ще не опрацьовано</text>
<rect x="74.0" y="142.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="105.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">INT</text>
<text x="105.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="150.0" y="142.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="181.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TERM</text>
<text x="181.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="226.0" y="142.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="257.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">HUP</text>
<text x="257.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="302.0" y="142.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="333.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CHLD</text>
<text x="333.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="378.0" y="142.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="409.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">USR1</text>
<text x="409.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="50.0" y="262.0" width="420.0" height="150.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="260.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">МАСКА ЗАБЛОКОВАНИХ</text>
<text x="260.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">що програма попросила поки не доправляти</text>
<rect x="74.0" y="334.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="105.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">INT</text>
<text x="105.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="150.0" y="334.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="181.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TERM</text>
<text x="181.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="226.0" y="334.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="257.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">HUP</text>
<text x="257.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="302.0" y="334.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="333.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CHLD</text>
<text x="333.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="378.0" y="334.0" width="62.0" height="56.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="409.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">USR1</text>
<text x="409.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="486.0" y1="148.0" x2="556.0" y2="216.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="486.0" y1="336.0" x2="556.0" y2="268.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="196.0" width="470.0" height="92.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="795.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">на межі повернення в простір користувача</text>
<text x="795.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">доправити можна лише: очікувані І НЕ заблоковані</text>
<text x="795.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тут це рівно один сигнал — CHLD</text>
<line x1="795.0" y1="292.0" x2="795.0" y2="336.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="340.0" width="220.0" height="96.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="670.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">CHLD — доправляють</tspan><tspan x="670.0" dy="15.6">обробник або типова дія</tspan><tspan x="670.0" dy="15.6">(біт очікування знімають)</tspan></text>
<rect x="810.0" y="340.0" width="220.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="920.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">INT, TERM — лежать далі</tspan><tspan x="920.0" dy="15.6">нічого не втрачено,</tspan><tspan x="920.0" dy="15.6">чекають на зняття маски</tspan></text>
<rect x="50.0" y="470.0" width="980.0" height="130.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/>
<text x="540.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокування — це не ігнорування</text>
<text x="78.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="78.0" dy="0.0">Заблокований сигнал зберігає свій біт у наборі очікуваних: щойно маску знімуть,</tspan><tspan x="78.0" dy="15.6">його доправлять негайно. Диспозиція «ігнорувати» (SIG_IGN) робить протилежне —</tspan><tspan x="78.0" dy="15.6">сигнал доходить до доправлення й там його викидають назавжди.</tspan><tspan x="78.0" dy="15.6">Обидва набори — бітові карти однакової форми, тож звичайний сигнал, поки лежить</tspan><tspan x="78.0" dy="15.6">заблокований, повторами не накопичується: другий такий самий просто зливається з першим.</tspan></text>
</svg>