<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 424" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="424" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="36.0" width="150.0" height="88.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">прапорець</tspan><tspan x="95.0" dy="18.2">у пам'яті</tspan></text>
<rect x="190.0" y="36.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="67.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">головний цикл</tspan><tspan x="285.0" dy="16.9">перевірив прапорець:</tspan><tspan x="285.0" dy="16.9">ще нуль</tspan></text>
<rect x="410.0" y="36.0" width="190.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="505.0" y="67.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">сигнал: обробник</tspan><tspan x="505.0" dy="16.9">ставить одиницю</tspan><tspan x="505.0" dy="16.9">саме тут</tspan></text>
<rect x="630.0" y="36.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="67.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">цикл входить у poll:</tspan><tspan x="725.0" dy="16.9">перевіряти прапорець</tspan><tspan x="725.0" dy="16.9">вже пізно</tspan></text>
<rect x="850.0" y="36.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="945.0" y="67.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">спить, доки не прийде</tspan><tspan x="945.0" dy="16.9">клієнт — а він</tspan><tspan x="945.0" dy="16.9">може не прийти</tspan></text>
<line x1="384.0" y1="80.0" x2="406.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="604.0" y1="80.0" x2="626.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="80.0" x2="846.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="190.0" y="138.0" width="850.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">сигнал припав на щілину між перевіркою й очікуванням — і не розбудив нікого</tspan></text>
<rect x="20.0" y="232.0" width="150.0" height="88.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">самоканал</tspan><tspan x="95.0" dy="18.2">або signalfd</tspan></text>
<rect x="190.0" y="232.0" width="190.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">сигнал у будь-яку</tspan><tspan x="285.0" dy="16.9">мить: у канал</tspan><tspan x="285.0" dy="16.9">лягає байт</tspan></text>
<rect x="410.0" y="232.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="505.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">цикл входить</tspan><tspan x="505.0" dy="16.9">у poll</tspan></text>
<rect x="630.0" y="232.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">poll повертається</tspan><tspan x="725.0" dy="16.9">негайно: читальний</tspan><tspan x="725.0" dy="16.9">кінець готовий</tspan></text>
<rect x="850.0" y="232.0" width="190.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="945.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">закрити слухавний,</tspan><tspan x="945.0" dy="16.9">дописати в польоті,</tspan><tspan x="945.0" dy="16.9">вмерти від сигналу</tspan></text>
<line x1="384.0" y1="276.0" x2="406.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="604.0" y1="276.0" x2="626.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="276.0" x2="846.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="190.0" y="334.0" width="850.0" height="46.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">подія не має миті, яку можна проґавити: вона лежить у дескрипторі й чекає</tspan></text>
</svg>