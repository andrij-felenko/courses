<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="60.0" width="240.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ядро доставляє сигнал</tspan><tspan x="150.0" dy="16.9">одному з потоків процесу</tspan></text>
<line x1="272.0" y1="102.0" x2="302.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="304.0" y="60.0" width="260.0" height="84.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="434.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="434.0" dy="0.0">обробник:</tspan><tspan x="434.0" dy="16.9">зберегти errno →</tspan><tspan x="434.0" dy="16.9">write(запис, 1 байт) →</tspan><tspan x="434.0" dy="16.9">відновити errno</tspan></text>
<line x1="566.0" y1="102.0" x2="596.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="598.0" y="60.0" width="190.0" height="84.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="693.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="693.0" dy="0.0">канал:</tspan><tspan x="693.0" dy="16.9">байт лежить</tspan><tspan x="693.0" dy="16.9">і чекає</tspan></text>
<line x1="790.0" y1="102.0" x2="820.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="822.0" y="60.0" width="210.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="927.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.0" dy="0.0">poll() бачить</tspan><tspan x="927.0" dy="16.9">готовність</tspan><tspan x="927.0" dy="16.9">читального кінця</tspan></text>
<line x1="927.0" y1="144.0" x2="927.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="304.0" y="198.0" width="728.0" height="78.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="668.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="668.0" dy="0.0">головний цикл читає байт — і аж тепер робить справжню роботу:</tspan><tspan x="668.0" dy="18.2">закриває з'єднання, скидає буфери, звільняє пам'ять, виходить</tspan></text>
<rect x="304.0" y="320.0" width="260.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="434.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="434.0" dy="0.0">тут виконано рівно один</tspan><tspan x="434.0" dy="15.6">виклик зі списку безпечних</tspan></text>
<rect x="598.0" y="320.0" width="434.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="815.0" dy="0.0">байт не зникне, навіть якщо сигнал прийшов</tspan><tspan x="815.0" dy="15.6">за мить до входу в poll() —</tspan><tspan x="815.0" dy="15.6">саме це прибирає гонку</tspan></text>
</svg>