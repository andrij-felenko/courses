<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="250.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">своє — обробник має на це право</text>
<text x="770.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">спільне на весь процес — чіпати не можна</text>
<rect x="40.0" y="40.0" width="420.0" height="62.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="67.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">власний кадр на стеку:</tspan><tspan x="250.0" dy="16.9">локальні змінні обробника</tspan></text>
<rect x="560.0" y="40.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="67.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">арена аллокатора:</tspan><tspan x="770.0" dy="16.9">замок і списки вільних блоків</tspan></text>
<rect x="40.0" y="114.0" width="420.0" height="62.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">об'єкти volatile sig_atomic_t:</tspan><tspan x="250.0" dy="16.9">запис — один неподільний крок</tspan></text>
<rect x="560.0" y="114.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">буфери stdio та їхні замки:</tspan><tspan x="770.0" dy="16.9">printf, fputs, fflush</tspan></text>
<rect x="40.0" y="188.0" width="420.0" height="62.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">лок-фрі атоміки C11:</tspan><tspan x="250.0" dy="16.9">без замка всередині</tspan></text>
<rect x="560.0" y="188.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">локаль, таблиці часових поясів,</tspan><tspan x="770.0" dy="16.9">стан розв'язувача імен</tspan></text>
<rect x="40.0" y="262.0" width="420.0" height="62.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="289.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">тонкі обгортки над системними викликами:</tspan><tspan x="250.0" dy="16.9">write, read, kill, sigaction, _exit</tspan></text>
<rect x="560.0" y="262.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="289.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">таблиці динамічного завантажувача,</tspan><tspan x="770.0" dy="16.9">внутрішній стан бібліотек</tspan></text>
<rect x="40.0" y="346.0" width="940.0" height="66.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">errno — окреме на кожен потік, але спільне з перерваним кадром:</tspan><tspan x="510.0" dy="16.9">обробник зобов'язаний зберегти його на вході й відновити перед виходом</tspan></text>
</svg>