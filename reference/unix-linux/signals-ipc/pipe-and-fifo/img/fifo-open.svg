<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 434" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="434" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкриття іменованого каналу і його відповіді</text>
<rect x="30.0" y="26.0" width="336.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="51.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="198.0" dy="0.0">як відкривають FIFO</tspan></text>
<rect x="378.0" y="26.0" width="250.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="51.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="503.0" dy="0.0">що робить open()</tspan></text>
<rect x="640.0" y="26.0" width="330.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="51.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">чому саме так</tspan></text>
<rect x="30.0" y="80.0" width="336.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="198.0" dy="0.0">open(шлях, O_RDONLY)</tspan></text>
<rect x="378.0" y="80.0" width="250.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="503.0" dy="0.0">блокує</tspan></text>
<rect x="640.0" y="80.0" width="330.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">чекає, доки хтось відкриє на запис</tspan></text>
<rect x="30.0" y="146.0" width="336.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="198.0" dy="0.0">open(шлях, O_WRONLY)</tspan></text>
<rect x="378.0" y="146.0" width="250.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="503.0" dy="0.0">блокує</tspan></text>
<rect x="640.0" y="146.0" width="330.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="178.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">чекає, доки хтось відкриє на читання</tspan></text>
<rect x="30.0" y="212.0" width="336.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="198.0" dy="0.0">open(шлях, O_RDONLY | O_NONBLOCK)</tspan></text>
<rect x="378.0" y="212.0" width="250.0" height="58.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="503.0" dy="0.0">вдається негайно</tspan></text>
<rect x="640.0" y="212.0" width="330.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">читач без пари нікому не шкодить —</tspan><tspan x="805.0" dy="14.3">він просто нічого не прочитає</tspan></text>
<rect x="30.0" y="278.0" width="336.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="311.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="198.0" dy="0.0">open(шлях, O_WRONLY | O_NONBLOCK)</tspan></text>
<rect x="378.0" y="278.0" width="250.0" height="58.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="311.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="503.0" dy="0.0">−1, errno = ENXIO</tspan></text>
<rect x="640.0" y="278.0" width="330.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="303.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">прийняти байти, яких гарантовано</tspan><tspan x="805.0" dy="14.3">ніхто не забере, ядро не дає</tspan></text>
<rect x="30.0" y="344.0" width="336.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="198.0" y="377.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="198.0" dy="0.0">open(шлях, O_RDWR)</tspan></text>
<rect x="378.0" y="344.0" width="250.0" height="58.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="503.0" y="377.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="503.0" dy="0.0">вдається негайно</tspan></text>
<rect x="640.0" y="344.0" width="330.0" height="58.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="369.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Linux дозволяє, POSIX не визначає;</tspan><tspan x="805.0" dy="14.3">кінець даних не настане ніколи</tspan></text>
</svg>