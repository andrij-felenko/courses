<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікна смерті виробника й вирок відновлювача</text>
<text x="230.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кроки вкладання (усе під замком)</text>
<text x="780.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що бачить відновлювач</text>
<rect x="50.0" y="63.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1 · намір: op = PUSH, index = T</tspan></text>
<rect x="50.0" y="143.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2 · slot.gen++  →  непарне</tspan></text>
<rect x="50.0" y="223.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">3 · копіюємо дані в слот</tspan></text>
<rect x="50.0" y="303.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">4 · slot.gen++  →  парне</tspan></text>
<rect x="50.0" y="383.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">5 · tail = T + 1   (публікація)</tspan></text>
<rect x="50.0" y="463.5" width="360.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">6 · op = NONE</tspan></text>
<rect x="565.0" y="78.4" width="430.0" height="63.2" rx="6" fill="#f2fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">помер до кроку 2:</tspan><tspan x="780.0" dy="15.6">gen парне, tail == T</tspan><tspan x="780.0" dy="15.6">→ нічого не сталося, знімаємо намір</tspan></text>
<rect x="565.0" y="218.4" width="430.0" height="63.2" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">помер на кроці 3:</tspan><tspan x="780.0" dy="15.6">gen НЕПАРНЕ — дані рвані</tspan><tspan x="780.0" dy="15.6">→ ВІДКІТ: gen++, tail лишається T</tspan></text>
<rect x="565.0" y="358.4" width="430.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">помер після кроку 4:</tspan><tspan x="780.0" dy="15.6">gen парне, tail == T</tspan><tspan x="780.0" dy="15.6">→ ДОКОЧУВАННЯ: tail = T + 1</tspan></text>
<rect x="565.0" y="468.4" width="430.0" height="63.2" rx="6" fill="#f2fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="488.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">помер після кроку 5:</tspan><tspan x="780.0" dy="15.6">tail == T + 1 — уже опубліковано</tspan><tspan x="780.0" dy="15.6">→ знімаємо намір</tspan></text>
