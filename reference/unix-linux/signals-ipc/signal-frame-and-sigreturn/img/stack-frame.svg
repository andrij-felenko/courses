<text x="900.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">адреса ucontext_t у кадрі</text>
<rect x="718.0" y="422.0" width="168.0" height="34.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
