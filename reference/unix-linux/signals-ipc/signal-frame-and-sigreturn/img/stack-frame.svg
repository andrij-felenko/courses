<text x="82.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">розширений стан процесора</text>
<text x="82.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="82.0" dy="0.0">регістри співпроцесора й векторні;</tspan><tspan x="82.0" dy="14.4">розмір залежить від розширень</tspan></text>
