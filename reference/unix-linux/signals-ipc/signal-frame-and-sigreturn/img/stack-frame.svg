<text x="564.0" y="611.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start"><tspan x="564.0" dy="0.0">покажчик стека</tspan><tspan x="564.0" dy="15.0">на вході в обробник</tspan></text>
