<text x="82.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ucontext_t</text>
<text x="82.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="82.0" dy="0.0">uc_mcontext: усі регістри, покажчики</tspan><tspan x="82.0" dy="14.4">інструкції та стека, прапорці</tspan><tspan x="82.0" dy="14.4">uc_sigmask: маска, яку відновити</tspan><tspan x="82.0" dy="14.4">uc_stack: запасний стек, що діяв</tspan></text>
