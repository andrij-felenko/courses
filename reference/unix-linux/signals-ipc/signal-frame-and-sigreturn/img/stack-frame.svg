<text x="295.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="295.0" dy="0.0">ЧЕРВОНА ЗОНА — 128 байтів</tspan><tspan x="295.0" dy="16.9">ядро їх не чіпає: вони можуть бути зайняті</tspan></text>
<rect x="48.0" y="232.0" width="494.0" height="372.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="295.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">СИГНАЛЬНИЙ КАДР</text>
<rect x="64.0" y="274.0" width="462.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/>
