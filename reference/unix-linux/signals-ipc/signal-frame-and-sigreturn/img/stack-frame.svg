<text x="82.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="82.0" dy="0.0">номер, код причини, відправник,</tspan><tspan x="82.0" dy="14.4">адреса збою  (при SA_SIGINFO)</tspan></text>
