<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ядро записує на стек користувача перед запуском обробника</text>
<text x="60.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="700">стек користувача (росте вниз)</text>
<rect x="60.0" y="62.0" width="470.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="295.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="295.0" dy="0.0">кадри функцій, які працювали</tspan><tspan x="295.0" dy="16.9">в мить приходу сигналу</tspan></text>
<line x1="34.0" y1="146.0" x2="556.0" y2="146.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="7 5"/>
<text x="564.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">покажчик стека до сигналу</text>
