<rect x="700.0" y="556.0" width="440.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="920.0" y="589.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">З погляду процесора нічого незвичайного:</tspan><tspan x="920.0" dy="16.9">виконується звичайна функція, у якої є</tspan><tspan x="920.0" dy="16.9">аргументи, свій стек і адреса повернення.</tspan><tspan x="920.0" dy="16.9">Виклику в програмі при цьому не було.</tspan></text>
