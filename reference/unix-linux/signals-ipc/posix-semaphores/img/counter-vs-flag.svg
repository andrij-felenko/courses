<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="240.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">якби об'єкт був прапорцем</text>
<text x="720.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">об'єкт рахує</text>
<rect x="30.0" y="58.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="90.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">виробник поклав перший елемент</tspan><tspan x="240.0" dy="15.6">прапорець піднято</tspan></text>
<rect x="30.0" y="146.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">виробник поклав другий елемент</tspan><tspan x="240.0" dy="15.6">прапорець уже піднято — слід стерто</tspan></text>
<rect x="30.0" y="234.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">споживач прокинувся, узяв один</tspan><tspan x="240.0" dy="15.6">прапорець опущено</tspan></text>
<rect x="30.0" y="322.0" width="420.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">другий елемент лежить, а знака про нього нема</tspan></text>
<rect x="510.0" y="58.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="90.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">виробник поклав перший елемент</tspan><tspan x="720.0" dy="15.6">лічильник = 1</tspan></text>
<rect x="510.0" y="146.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">виробник поклав другий елемент</tspan><tspan x="720.0" dy="15.6">лічильник = 2</tspan></text>
<rect x="510.0" y="234.0" width="420.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">споживач прокинувся, узяв один</tspan><tspan x="720.0" dy="15.6">лічильник = 1</tspan></text>
<rect x="510.0" y="322.0" width="420.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">лічильник не нуль — споживач не засинає й бере другий</tspan></text>
</svg>