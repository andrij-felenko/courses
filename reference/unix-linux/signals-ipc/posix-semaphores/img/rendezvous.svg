<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="250.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">безіменний: sem_init(&amp;s, 1, 0)</text>
<text x="750.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">іменований: sem_open(&quot;/frames.filled&quot;, …)</text>
<rect x="40.0" y="58.0" width="180.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">процес A</tspan></text>
<rect x="280.0" y="58.0" width="180.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">процес B</tspan></text>
<line x1="130.0" y1="116.0" x2="150.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="370.0" y1="116.0" x2="350.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="200.0" width="420.0" height="110.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="60.0" y="222.0" width="150.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="260.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">sem_t</tspan></text>
<rect x="230.0" y="222.0" width="210.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="335.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">дані, заради яких</tspan><tspan x="335.0" dy="15.6">усе робиться</tspan></text>
<text x="250.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спільне відображення: об'єкт shm</text>
<text x="250.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">або MAP_SHARED, зроблене до fork</text>
<rect x="127.1" y="380.4" width="245.7" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">семафор мусить лежати ВСЕРЕДИНІ</tspan><tspan x="250.0" dy="15.6">спільної пам'яті: копія структури</tspan><tspan x="250.0" dy="15.6">в кожного — це два різні семафори</tspan></text>
<rect x="540.0" y="58.0" width="180.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">процес A</tspan></text>
<rect x="780.0" y="58.0" width="180.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">процес B</tspan></text>
<line x1="630.0" y1="116.0" x2="650.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="870.0" y1="116.0" x2="850.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="200.0" width="420.0" height="110.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="560.0" y="222.0" width="380.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">/dev/shm/sem.frames.filled — файл на tmpfs,</tspan><tspan x="750.0" dy="15.6">який libc відображає обом</tspan></text>
<text x="750.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">домовляються про ім'я, а не про пам'ять:</text>
<text x="750.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спорідненість процесів не потрібна</text>
<rect x="640.8" y="380.4" width="218.4" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">той самий об'єкт у крихітному</tspan><tspan x="750.0" dy="15.6">спільному відображенні, яке</tspan><tspan x="750.0" dy="15.6">бібліотека зробила за вас</tspan></text>
</svg>