<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="260.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">спершу лічильний, потім м'ютекс</text>
<text x="780.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">спершу м'ютекс, потім лічильний</text>
<rect x="30.0" y="56.0" width="460.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">виробник: sem_wait(free_slots)</tspan><tspan x="260.0" dy="15.6">буфер повний — засинає, м'ютекс лишився вільним</tspan></text>
<rect x="30.0" y="152.0" width="460.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="189.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">споживач: sem_wait(filled), потім sem_wait(mutex)</tspan><tspan x="260.0" dy="15.6">бере елемент, віддає м'ютекс</tspan></text>
<rect x="30.0" y="248.0" width="460.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">споживач: sem_post(free_slots)</tspan><tspan x="260.0" dy="15.6">виробника розбуджено — обмін триває</tspan></text>
<rect x="550.0" y="56.0" width="460.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">виробник: sem_wait(mutex)</tspan><tspan x="780.0" dy="15.6">м'ютекс тепер у виробника</tspan></text>
<rect x="550.0" y="152.0" width="460.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="189.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">виробник: sem_wait(free_slots)</tspan><tspan x="780.0" dy="15.6">буфер повний — засинає, ТРИМАЮЧИ м'ютекс</tspan></text>
<rect x="550.0" y="248.0" width="460.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">споживач: sem_wait(filled), потім sem_wait(mutex)</tspan><tspan x="780.0" dy="15.6">м'ютекс зайнято — засинає теж</tspan></text>
<rect x="133.7" y="372.2" width="252.6" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">той, хто спить, нічого не тримає —</tspan><tspan x="260.0" dy="15.6">тому розбудити його завжди є кому</tspan></text>
<rect x="619.5" y="364.4" width="321.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">вільний слот з'явиться лише після споживача,</tspan><tspan x="780.0" dy="15.6">а споживач чекає на м'ютекс виробника:</tspan><tspan x="780.0" dy="15.6">обидва сплять назавжди</tspan></text>
</svg>