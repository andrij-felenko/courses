<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнал процесові, сигнал потокові й сигнал від власної інструкції</text>
<rect x="300.0" y="70.0" width="660.0" height="400.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="630.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">група потоків (один процес)</text>
<rect x="340.0" y="116.0" width="580.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">спільна маска очікуваних на всю групу  (ShdPnd)</tspan></text>
<rect x="340.0" y="216.0" width="176.0" height="62.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="428.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="428.0" dy="0.0">потік A</tspan><tspan x="428.0" dy="15.6">сигнал заблоковано</tspan></text>
<rect x="340.0" y="292.0" width="176.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="428.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="428.0" dy="0.0">власна маска</tspan><tspan x="428.0" dy="14.3">(SigPnd)</tspan></text>
<line x1="428.0" y1="172.0" x2="428.0" y2="212.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="536.0" y="216.0" width="176.0" height="62.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="624.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">потік B</tspan><tspan x="624.0" dy="15.6">сигнал відкрито</tspan></text>
<rect x="536.0" y="292.0" width="176.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="624.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="624.0" dy="0.0">власна маска</tspan><tspan x="624.0" dy="14.3">(SigPnd)</tspan></text>
<line x1="624.0" y1="172.0" x2="624.0" y2="212.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="732.0" y="216.0" width="176.0" height="62.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="820.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">потік C</tspan><tspan x="820.0" dy="15.6">сигнал відкрито</tspan></text>
<rect x="732.0" y="292.0" width="176.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="820.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="820.0" dy="0.0">власна маска</tspan><tspan x="820.0" dy="14.3">(SigPnd)</tspan></text>
<line x1="820.0" y1="172.0" x2="820.0" y2="212.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="630.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">ядро віддає сигнал БУДЬ-ЯКОМУ потоку, що його не заблокував</text>
<text x="630.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">передбачити, кому саме, не можна</text>
<text x="630.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">смертельна типова дія вбиває ВСЮ групу, а не один потік</text>
<rect x="30.0" y="116.0" width="236.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="148.0" y="140.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">kill(pid, sig)</tspan><tspan x="148.0" dy="15.6">сигнал процесові</tspan></text>
<line x1="270.0" y1="144.0" x2="336.0" y2="144.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="216.0" width="236.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="148.0" y="240.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">tgkill(), pthread_kill()</tspan><tspan x="148.0" dy="15.6">сигнал конкретному потоку</tspan></text>
<line x1="270.0" y1="244.0" x2="336.0" y2="244.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="316.0" width="236.0" height="74.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.8"/><text x="148.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">пастка процесора</tspan><tspan x="148.0" dy="15.6">в самому потоці B</tspan><tspan x="148.0" dy="15.6">(SIGSEGV, SIGFPE)</tspan></text>
<line x1="148.0" y1="392.0" x2="148.0" y2="500.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="148.0" y1="500.0" x2="620.0" y2="500.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="660.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">завжди тому потокові, чия інструкція завинила</text>
</svg>