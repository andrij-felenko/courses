<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">

    <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
        </marker>
    </defs>
    
<rect x="0" y="0" width="800" height="400" fill="#ffffff" />
<text x="400" y="30" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Netfilter Conntrack Tuple Example</text>
<rect x="50" y="100" width="150" height="200" fill="#e0f7fa" stroke="#006064" stroke-width="2" rx="10" />
<text x="125" y="140" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Client</text>
<text x="125" y="170" text-anchor="middle" font-size="14" font-family="Arial">192.168.1.100</text>
<text x="125" y="190" text-anchor="middle" font-size="14" font-family="Arial">Port: 50000</text>
<rect x="600" y="100" width="150" height="200" fill="#fce4ec" stroke="#880e4f" stroke-width="2" rx="10" />
<text x="675" y="140" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">Server</text>
<text x="675" y="170" text-anchor="middle" font-size="14" font-family="Arial">8.8.8.8</text>
<text x="675" y="190" text-anchor="middle" font-size="14" font-family="Arial">Port: 80</text>
<rect x="275" y="100" width="250" height="200" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="10" stroke-dasharray="5,5" />
<text x="400" y="130" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">nf_conntrack</text>
<text x="400" y="160" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold" fill="#1565c0">ORIGINAL Tuple</text>
<text x="400" y="180" text-anchor="middle" font-size="12" font-family="Courier">SRC:192.168.1.100 DST:8.8.8.8</text>
<text x="400" y="195" text-anchor="middle" font-size="12" font-family="Courier">SP:50000 DP:80 PROTO:TCP</text>
<text x="400" y="230" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold" fill="#c62828">REPLY Tuple</text>
<text x="400" y="250" text-anchor="middle" font-size="12" font-family="Courier">SRC:8.8.8.8 DST:192.168.1.100</text>
<text x="400" y="265" text-anchor="middle" font-size="12" font-family="Courier">SP:80 DP:50000 PROTO:TCP</text>
<line x1="200" y1="170" x2="275" y2="170" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)" />
<line x1="525" y1="170" x2="600" y2="170" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)" />
<line x1="600" y1="240" x2="525" y2="240" stroke="#c62828" stroke-width="3" marker-end="url(#arrow-red)" />
<line x1="275" y1="240" x2="200" y2="240" stroke="#c62828" stroke-width="3" marker-end="url(#arrow-red)" />
</svg>
