<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="780.0" height="420.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Структура TCP-опції Data Sequence Signal (DSS, Kind=30, Subtype=2)</text>
<rect x="50.0" y="60.0" width="700.0" height="25.0" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.0"/>
<text x="137.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0..7 біт (Kind)</text>
<text x="312.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">8..15 біт (Length)</text>
<text x="487.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">16..19 біт (Subtype)</text>
<text x="637.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">20..23 біт (Прапори)</text>
<rect x="50.0" y="95.0" width="175.0" height="45.0" rx="6" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/><text x="137.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Kind = 30</tspan><tspan x="137.5" dy="15.6">(0x1E - MPTCP)</tspan></text>
<rect x="225.0" y="95.0" width="175.0" height="45.0" rx="6" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/><text x="312.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.5" dy="0.0">Довжина (Length)</tspan><tspan x="312.5" dy="15.6">в байтах (змінна)</tspan></text>
<rect x="400.0" y="95.0" width="175.0" height="45.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="487.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="487.5" dy="0.0">Subtype = 2</tspan><tspan x="487.5" dy="15.6">(DSS)</tspan></text>
<rect x="575.0" y="95.0" width="175.0" height="45.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="662.5" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">Прапори: F m M a A</tspan><tspan x="662.5" dy="14.3">F=FIN, M/m=DSN, A/a=ACK</tspan></text>
<rect x="50.0" y="150.0" width="700.0" height="45.0" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="400.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Data ACK (32-біт або 64-біт)</tspan><tspan x="400.0" dy="15.6">Кумулятивне підтвердження даних у глобальному просторі DSN</tspan></text>
<rect x="50.0" y="205.0" width="700.0" height="45.0" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="400.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Data Sequence Number (DSN, 32-біт або 64-біт)</tspan><tspan x="400.0" dy="15.6">Глобальний порядковий номер першого байта даного фрагмента</tspan></text>
<rect x="50.0" y="260.0" width="345.0" height="45.0" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="222.5" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">Subflow Sequence Number (SSN, 32-біт)</tspan><tspan x="222.5" dy="15.6">Початковий SSN для даного DSN-маппінгу</tspan></text>
<rect x="405.0" y="260.0" width="170.0" height="45.0" rx="6" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/><text x="490.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Data Length (16-біт)</tspan><tspan x="490.0" dy="15.6">Довжина блоку даних</tspan></text>
<rect x="580.0" y="260.0" width="170.0" height="45.0" rx="6" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/><text x="665.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Checksum (16-біт)</tspan><tspan x="665.0" dy="15.6">Контрольна сума DSS</tspan></text>
<rect x="50.0" y="320.0" width="700.0" height="80.0" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.0"/>
<text x="400.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">Ключове призначення DSS:</text>
<text x="400.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Мапування локальних послідовностей підпотоку (SSN) у глобальну послідовність (DSN).</text>
<text x="400.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">Це дозволяє приймачу збирати пакети з різних підпотоків у єдиний впорядкований потік.</text>
</svg>