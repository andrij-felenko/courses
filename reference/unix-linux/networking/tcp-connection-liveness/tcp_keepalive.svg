<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  
  <!-- Заголовок -->
  <text x="300" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">TCP Keepalive Mechanics</text>
  
  <!-- Вісь часу -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="205" font-family="sans-serif" font-size="14">Час</text>
  
  <!-- Останній пакет даних -->
  <circle cx="100" cy="200" r="6" fill="#4CAF50"/>
  <text x="100" y="230" font-family="sans-serif" font-size="12" text-anchor="middle">Останні дані</text>
  <line x1="100" y1="190" x2="100" y2="100" stroke="#aaa" stroke-dasharray="4"/>
  
  <!-- TCP_KEEPIDLE -->
  <line x1="100" y1="130" x2="300" y2="130" stroke="#2196F3" stroke-width="2"/>
  <text x="200" y="120" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2196F3">TCP_KEEPIDLE (напр. 60с)</text>
  
  <!-- Перший зонд -->
  <circle cx="300" cy="200" r="6" fill="#FF9800"/>
  <text x="300" y="230" font-family="sans-serif" font-size="12" text-anchor="middle">Проба 1</text>
  <line x1="300" y1="190" x2="300" y2="100" stroke="#aaa" stroke-dasharray="4"/>
  
  <!-- TCP_KEEPINTVL -->
  <line x1="300" y1="150" x2="400" y2="150" stroke="#E91E63" stroke-width="2"/>
  <text x="350" y="140" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#E91E63">TCP_KEEPINTVL</text>
  
  <!-- Другий зонд -->
  <circle cx="400" cy="200" r="6" fill="#FF9800"/>
  <text x="400" y="230" font-family="sans-serif" font-size="12" text-anchor="middle">Проба 2</text>
  <line x1="400" y1="190" x2="400" y2="100" stroke="#aaa" stroke-dasharray="4"/>
  
  <!-- Розрив -->
  <line x1="500" y1="180" x2="520" y2="220" stroke="red" stroke-width="3"/>
  <line x1="520" y1="180" x2="500" y2="220" stroke="red" stroke-width="3"/>
  <text x="510" y="240" font-family="sans-serif" font-size="12" text-anchor="middle" fill="red">Розрив (TCP_KEEPCNT)</text>
</svg>