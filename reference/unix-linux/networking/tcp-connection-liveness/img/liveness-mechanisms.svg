<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні виявлення мертвих з'єднань у стеку Linux</text>
<rect x="40.0" y="60.0" width="240.0" height="280.0" rx="6" fill="#eef7fa" stroke="#2980b9" stroke-width="1.5"/><text x="160.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. TCP Keepalive</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">• Рівень: Ядро (TCP)</tspan><tspan x="160.0" dy="14.3">• Зонд: Порожній ACK</tspan><tspan x="160.0" dy="14.3">• Відповідає: Ядро peer-а</tspan><tspan x="160.0" dy="14.3">• Виявляє: Обрив мережі, crash ОС</tspan><tspan x="160.0" dy="14.3">• Не бачить: Зависання процесів</tspan><tspan x="160.0" dy="14.3">• Налаштування: setsockopt</tspan></text>
<rect x="300.0" y="60.0" width="240.0" height="280.0" rx="6" fill="#fdf7e7" stroke="#d35400" stroke-width="1.5"/><text x="413.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">2. TCP_USER_TIMEOUT</tspan><tspan x="413.0" dy="11.7"></tspan><tspan x="413.0" dy="11.7">• Рівень: Ядро (Таймаут)</tspan><tspan x="413.0" dy="11.7">• Зонд: Таймер повтору ACK</tspan><tspan x="413.0" dy="11.7">• Відповідає: ACK на дані/зонд</tspan><tspan x="413.0" dy="11.7">• Виявляє: Застрягання буферів передачі, невідповідь на проби</tspan><tspan x="413.0" dy="11.7">• Границя: Жорсткий ліміт мс</tspan><tspan x="413.0" dy="11.7">• Налаштування: RFC 5482</tspan></text>
<rect x="560.0" y="60.0" width="240.0" height="280.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">3. App Heartbeat</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">• Рівень: Застосунок</tspan><tspan x="680.0" dy="11.7">• Зонд: Ping / Pong кадри</tspan><tspan x="680.0" dy="11.7">• Відповідає: Застосунок peer-а</tspan><tspan x="680.0" dy="11.7">• Виявляє: Deadlock, freeze циклу, обрив мережі, NAT-drop</tspan><tspan x="680.0" dy="11.7">• Гарантія: Повна перевірка стеку</tspan><tspan x="680.0" dy="11.7">• Налаштування: Код програми</tspan></text>
</svg>