<rect x="113.5" y="180.4" width="187.0" height="59.2" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/><text x="207.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="207.0" dy="0.0">Ядро Linux (Kernel Space)</tspan><tspan x="207.0" dy="15.6">Буфери socket &amp; sk_buff</tspan><tspan x="207.0" dy="15.6">Копіювання пам'яті CPU</tspan></text>
<rect x="113.5" y="278.2" width="187.0" height="43.6" rx="6" fill="#eaeded" stroke="#7f8c8d" stroke-width="1.5"/><text x="207.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="207.0" dy="0.0">Драйвер та мережева карта</tspan><tspan x="207.0" dy="15.6">(NIC DMA / Ring Buffer)</tspan></text>
