<rect x="518.5" y="98.2" width="187.0" height="43.6" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5"/><text x="612.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Користувацький додаток</tspan><tspan x="612.0" dy="15.6">(Закріплена пам'ять / MR)</tspan></text>
