<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Порівняння традиційного захоплення пакетів (recvfrom) та механізму PACKET_MMAP</tspan></text>
<rect x="40.0" y="90.0" width="440.0" height="390.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="60.0" y="105.0" width="400.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Традиційний SOCK_RAW + recvfrom()</tspan></text>
<rect x="70.0" y="155.0" width="380.0" height="55.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="178.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">NIC Drivers / NAPI Softirq</tspan><tspan x="260.0" dy="15.6">Отримання кадру -&gt; Виділення sk_buff</tspan></text>
<rect x="70.0" y="225.0" width="380.0" height="55.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="248.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Socket Queue (af_packet)</tspan><tspan x="260.0" dy="15.6">Кожен пакет чекає у черзі ядра</tspan></text>
<line x1="60.0" y1="295.0" x2="460.0" y2="295.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="260.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Межа ядра та користувача (Syscall boundary)</text>
<rect x="70.0" y="310.0" width="380.0" height="60.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Користувацький процес (tcpdump / Wireshark)</tspan><tspan x="260.0" dy="15.6">Виклики recvfrom() у нескінченному циклі</tspan></text>
<line x1="260.0" y1="210.0" x2="260.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="280.0" x2="260.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="265.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">memcpy() + Перемикання контексту на КОЖЕН пакет</text>
<rect x="70.0" y="390.0" width="380.0" height="65.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Вузьке місце:</tspan><tspan x="260.0" dy="14.3">- Високий CPU overhead (context switch)</tspan><tspan x="260.0" dy="14.3">- Кеш-пам'ять вимивається при memcpy()</tspan><tspan x="260.0" dy="14.3">- Втрати пакетів (drops) на 10Gbps+</tspan></text>
<rect x="520.0" y="90.0" width="440.0" height="390.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="540.0" y="105.0" width="400.0" height="35.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">PACKET_MMAP (TPACKET_V3 Shared Ring)</tspan></text>
<rect x="550.0" y="155.0" width="380.0" height="55.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="178.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">NIC Drivers / NAPI Softirq</tspan><tspan x="740.0" dy="15.6">Запис пакетів безпосередньо в Ring Buffer</tspan></text>
<rect x="550.0" y="225.0" width="380.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Спільний кільцевий буфер (mmap shared memory)</tspan><tspan x="740.0" dy="15.6">Масив блоків TPACKET_V3 (Kernel &lt;-&gt; User)</tspan><tspan x="740.0" dy="15.6">Zero-Copy доступ до даних</tspan></text>
<rect x="550.0" y="320.0" width="380.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Користувацький процес</tspan><tspan x="740.0" dy="15.6">Пакетна обробка блоків (Block batching)</tspan><tspan x="740.0" dy="15.6">poll() лише коли буфер порожній</tspan></text>
<line x1="740.0" y1="210.0" x2="740.0" y2="225.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="740.0" y1="300.0" x2="740.0" y2="320.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="745.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Прямий читабельний доступ без syscalls!</text>
<rect x="550.0" y="390.0" width="380.0" height="65.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Переваги:</tspan><tspan x="740.0" dy="14.3">- Zero-Copy між ядром та користувачем</tspan><tspan x="740.0" dy="14.3">- Відсутність recvfrom() на кожен пакет</tspan><tspan x="740.0" dy="14.3">- Ефективна пакетна обробка сотень пакетів/блок</tspan></text>
</svg>