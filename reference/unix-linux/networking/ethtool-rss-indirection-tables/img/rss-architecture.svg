<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
<rect x="10" y="10" width="780" height="380" fill="#f8f9fa" stroke="#dee2e6"/>
<rect x="30" y="160" width="120" height="60" fill="#d1e7dd" stroke="#0f5132" rx="5"/>
<text x="90" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Incoming Packet</text>
<text x="90" y="205" text-anchor="middle" font-family="sans-serif" font-size="12">4-Tuple (IPs, Ports)</text>
<rect x="200" y="140" width="140" height="100" fill="#cfe2ff" stroke="#084298" rx="5"/>
<text x="270" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Toeplitz Hash</text>
<text x="270" y="195" text-anchor="middle" font-family="sans-serif" font-size="12">+ Secret Key</text>
<text x="270" y="225" text-anchor="middle" font-family="sans-serif" font-size="12">Result: 32-bit Hash</text>
<line x1="150" y1="190" x2="200" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
<rect x="400" y="80" width="140" height="220" fill="#fff3cd" stroke="#664d03" rx="5"/>
<text x="470" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">RETA</text>
<text x="470" y="125" text-anchor="middle" font-family="sans-serif" font-size="12">(128 entries)</text>
<rect x="420" y="140" width="100" height="20" fill="#fff" stroke="#000"/>
<text x="440" y="154" font-family="monospace" font-size="12">0  ->  Q0</text>
<rect x="420" y="160" width="100" height="20" fill="#fff" stroke="#000"/>
<text x="440" y="174" font-family="monospace" font-size="12">1  ->  Q1</text>
<rect x="420" y="180" width="100" height="20" fill="#fff" stroke="#000"/>
<text x="440" y="194" font-family="monospace" font-size="12">2  ->  Q2</text>
<text x="470" y="215" text-anchor="middle" font-family="sans-serif" font-size="14">...</text>
<rect x="420" y="230" width="100" height="20" fill="#fff" stroke="#000"/>
<text x="440" y="244" font-family="monospace" font-size="12">127 -> Q3</text>
<line x1="340" y1="190" x2="400" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
<text x="370" y="180" text-anchor="middle" font-family="sans-serif" font-size="12">LSB 7 bits</text>
<text x="370" y="205" text-anchor="middle" font-family="sans-serif" font-size="12">Index</text>
<rect x="600" y="60" width="80" height="40" fill="#e2e3e5" stroke="#41464b"/>
<text x="640" y="85" text-anchor="middle" font-family="sans-serif" font-size="12">Rx Q0</text>
<rect x="690" y="60" width="80" height="40" fill="#ffddcc" stroke="#663300"/>
<text x="730" y="85" text-anchor="middle" font-family="sans-serif" font-size="12">Core 0</text>
<rect x="600" y="130" width="80" height="40" fill="#e2e3e5" stroke="#41464b"/>
<text x="640" y="155" text-anchor="middle" font-family="sans-serif" font-size="12">Rx Q1</text>
<rect x="690" y="130" width="80" height="40" fill="#ffddcc" stroke="#663300"/>
<text x="730" y="155" text-anchor="middle" font-family="sans-serif" font-size="12">Core 1</text>
<rect x="600" y="200" width="80" height="40" fill="#e2e3e5" stroke="#41464b"/>
<text x="640" y="225" text-anchor="middle" font-family="sans-serif" font-size="12">Rx Q2</text>
<rect x="690" y="200" width="80" height="40" fill="#ffddcc" stroke="#663300"/>
<text x="730" y="225" text-anchor="middle" font-family="sans-serif" font-size="12">Core 2</text>
<rect x="600" y="270" width="80" height="40" fill="#e2e3e5" stroke="#41464b"/>
<text x="640" y="295" text-anchor="middle" font-family="sans-serif" font-size="12">Rx Q3</text>
<rect x="690" y="270" width="80" height="40" fill="#ffddcc" stroke="#663300"/>
<text x="730" y="295" text-anchor="middle" font-family="sans-serif" font-size="12">Core 3</text>
<line x1="520" y1="150" x2="600" y2="80" stroke="#000" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrowBlack)"/>
<line x1="520" y1="170" x2="600" y2="150" stroke="#000" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrowBlack)"/>
<line x1="520" y1="190" x2="600" y2="220" stroke="#000" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrowBlack)"/>
<line x1="520" y1="240" x2="600" y2="290" stroke="#000" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrowBlack)"/>
<defs><marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000" /></marker></defs>
</svg>
