<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол рукостискання Noise_IK та обмін ключами</text>
<rect x="50.0" y="45.0" width="220.0" height="330.0" rx="8" fill="#eef6fc" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ініціатор (Peer A)</text>
<rect x="60.0" y="80.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Генерація ефемерного ключа (e_a)</tspan><tspan x="160.0" dy="11.7">DH(e_a, s_b), DH(s_a, s_b)</tspan><tspan x="160.0" dy="11.7">Створення MAC1 та MAC2</tspan></text>
<rect x="530.0" y="45.0" width="220.0" height="330.0" rx="8" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Відповідач (Peer B)</text>
<rect x="540.0" y="80.0" width="200.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Перевірка MAC1 / MAC2</tspan><tspan x="640.0" dy="11.7">Дешифрація статичного ключа A</tspan><tspan x="640.0" dy="11.7">Перевірка таймштампу</tspan></text>
<line x1="270.0" y1="150.0" x2="530.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Handshake Initiation (148 байт)</text>
<rect x="310.0" y="155.0" width="180.0" height="22.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">msg_type=1, unencrypted_ephemeral, MAC1, MAC2</tspan></text>
<rect x="540.0" y="195.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Генерація ефемерного ключа (e_b)</tspan><tspan x="640.0" dy="11.7">DH(e_a, e_b), DH(s_a, e_b)</tspan><tspan x="640.0" dy="11.7">Обчислення симетричних ключів</tspan></text>
<line x1="530.0" y1="260.0" x2="270.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Handshake Response (92 байта)</text>
<rect x="310.0" y="265.0" width="180.0" height="22.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">msg_type=2, unencrypted_ephemeral, MAC1, MAC2</tspan></text>
<rect x="60.0" y="290.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Фіналізація сесійних ключів</tspan><tspan x="160.0" dy="11.7">Ключ запису (sending_key)</tspan><tspan x="160.0" dy="11.7">Ключ читання (receiving_key)</tspan></text>
<rect x="540.0" y="290.0" width="200.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Фіналізація сесійних ключів</tspan><tspan x="640.0" dy="11.7">Ключ читання (receiving_key)</tspan><tspan x="640.0" dy="11.7">Ключ запису (sending_key)</tspan></text>
<rect x="50.0" y="390.0" width="700.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="400.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Механізм захисту від DoS-атак (Cookie Reply / MAC2)</text>
<text x="400.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">При високому навантаженні процесора Відповідач надсилає Cookie (64B), вимагаючи MAC2 підтвердження IP</text>
</svg>