<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння Userspace TLS та Kernel TLS</text>
<rect x="50.0" y="23.0" width="280.0" height="34.0" rx="6" fill="#f2f4f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Традиційний Userspace TLS</tspan></text><rect x="60.0" y="82.8" width="260.0" height="74.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Простір користувача</tspan><tspan x="190.0" dy="18.2">OpenSSL / GnuTLS</tspan><tspan x="190.0" dy="18.2">(Рукостискання + Шифрування)</tspan></text><rect x="50.3" y="231.9" width="279.4" height="56.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Ядро Linux (TCP/IP стек)</tspan><tspan x="190.0" dy="18.2">(Буферизація та сегментація skb)</tspan></text><rect x="58.3" y="371.9" width="263.4" height="56.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Мережева карта (NIC)</tspan><tspan x="190.0" dy="18.2">(Передача зашифрованих кадрів)</tspan></text><line x1="190.0" y1="175.0" x2="190.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="190.0" y1="315.0" x2="190.0" y2="355.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="430.0" y="23.0" width="280.0" height="34.0" rx="6" fill="#f2f4f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ядерне прискорення (kTLS)</tspan></text><rect x="430.3" y="82.8" width="279.4" height="74.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Простір користувача</tspan><tspan x="570.0" dy="18.2">OpenSSL (Тільки Handshake)</tspan><tspan x="570.0" dy="18.2">Передача ключів через setsockopt</tspan></text><rect x="430.3" y="231.9" width="279.4" height="56.2" rx="6" fill="#d4efdf" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ядро Linux (kTLS ULP / net/tls)</tspan><tspan x="570.0" dy="18.2">(Шифрування records + Zero-Copy)</tspan></text><rect x="430.3" y="371.9" width="279.4" height="56.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Мережева карта (NIC)</tspan><tspan x="570.0" dy="18.2">(Передача зашифрованого трафіку)</tspan></text><line x1="570.0" y1="175.0" x2="570.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="570.0" y1="315.0" x2="570.0" y2="355.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
