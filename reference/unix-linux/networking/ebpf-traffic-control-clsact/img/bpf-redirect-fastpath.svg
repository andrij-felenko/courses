<svg viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="425" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Перенаправлення пакетів: bpf_redirect() проти звичайної маршрутизації</text>
  <rect x="40" y="70" width="160" height="270" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">Інтерфейс eth0 (veth0)</text>
  <rect x="55" y="115" width="130" height="60" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="120" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">TC Ingress Hook</text>
  <text x="120" y="160" font-size="11" text-anchor="middle" fill="#1d4ed8">bpf_redirect(ifindex, 0)</text>
  <rect x="650" y="70" width="160" height="270" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="730" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b21a8">Інтерфейс eth1 (veth1)</text>
  <rect x="665" y="250" width="130" height="60" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="730" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b21a8">TX Ring / Egress</text>
  <text x="730" y="295" font-size="11" text-anchor="middle" fill="#7e22ce">Вихід у мережу</text>
  <rect x="250" y="70" width="350" height="120" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="425" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Стандартний повільний шлях (Slow Path)</text>
  <rect x="265" y="115" width="100" height="55" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="315" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Netfilter / IPTables</text>
  <text x="315" y="156" font-size="10" text-anchor="middle" fill="#9a3412">Conntrack lookup</text>
  <rect x="375" y="115" width="100" height="55" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="425" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">FIB Route Lookup</text>
  <text x="425" y="156" font-size="10" text-anchor="middle" fill="#9a3412">ip_route_input()</text>
  <rect x="485" y="115" width="100" height="55" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="535" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Neighbor / ARP</text>
  <text x="535" y="156" font-size="10" text-anchor="middle" fill="#9a3412">neigh_resolve()</text>
  <rect x="250" y="220" width="350" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="425" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Прямий eBPF Fast-Path (bpf_redirect)</text>
  <rect x="270" y="260" width="310" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="425" y="283" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Обхід L3 маршрутизації та Netfilter</text>
  <text x="425" y="303" font-size="11" text-anchor="middle" fill="#166534">Пряма передача skb на dev_queue_xmit(eth1)</text>
  <defs>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <path d="M 185 145 L 220 145 L 220 130 L 250 130" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arr-orange)"/>
  <path d="M 600 130 L 630 130 L 630 280 L 665 280" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arr-orange)"/>
  <path d="M 185 175 L 220 175 L 220 280 L 250 280" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>
  <path d="M 600 280 L 665 280" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>
</svg>