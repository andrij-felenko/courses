<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
    <!-- Background -->
    <rect width="600" height="400" fill="#f4f4f9" />
    
    <!-- Title -->
    <text x="300" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">XDP Redirect: CPUMAP vs DEVMAP</text>
    
    <!-- NIC RX -->
    <rect x="50" y="100" width="100" height="80" rx="10" fill="#4caf50" />
    <text x="100" y="145" font-family="Arial" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">NIC RX</text>
    
    <!-- XDP Program -->
    <rect x="220" y="100" width="140" height="80" rx="10" fill="#ff9800" />
    <text x="290" y="135" font-family="Arial" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">XDP Program</text>
    <text x="290" y="155" font-family="Arial" font-size="12" text-anchor="middle" fill="#fff">bpf_redirect_map()</text>
    
    <!-- CPUMAP -->
    <rect x="430" y="60" width="120" height="60" rx="10" fill="#2196f3" />
    <text x="490" y="95" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">CPUMAP</text>
    
    <!-- CPU Core Network Stack -->
    <rect x="430" y="140" width="120" height="60" rx="10" fill="#9c27b0" />
    <text x="490" y="170" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Network Stack</text>
    <text x="490" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#fff">(Target CPU)</text>
    
    <!-- DEVMAP -->
    <rect x="220" y="240" width="140" height="60" rx="10" fill="#f44336" />
    <text x="290" y="275" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">DEVMAP</text>
    
    <!-- NIC TX -->
    <rect x="430" y="230" width="120" height="80" rx="10" fill="#00bcd4" />
    <text x="490" y="275" font-family="Arial" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">NIC TX</text>
    
    <!-- Arrows -->
    <line x1="150" y1="140" x2="210" y2="140" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- To CPUMAP -->
    <path d="M 360 120 C 390 120, 390 90, 420 90" stroke="#2196f3" stroke-width="3" fill="transparent" marker-end="url(#arrow-cpu)" />
    <line x1="490" y1="120" x2="490" y2="135" stroke="#2196f3" stroke-width="3" marker-end="url(#arrow-cpu)" />
    
    <!-- To DEVMAP -->
    <line x1="290" y1="180" x2="290" y2="230" stroke="#f44336" stroke-width="3" marker-end="url(#arrow-dev)" />
    <line x1="360" y1="270" x2="420" y2="270" stroke="#f44336" stroke-width="3" marker-end="url(#arrow-dev)" />
    
    <!-- Arrow definitions -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
        <marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#2196f3" />
        </marker>
        <marker id="arrow-dev" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#f44336" />
        </marker>
    </defs>
</svg>
