<svg viewBox="0 0 850 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="425" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Пакетна передача (Bulk Transmit) та переробка сторінок у DEVMAP</text>
  <rect x="30" y="70" width="220" height="250" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">RX Інтерфейс (eth0)</text>
  <rect x="45" y="115" width="190" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="140" font-size="12" text-anchor="middle" fill="#1e3a8a">Отримання кадра (page_pool)</text>
  <rect x="45" y="170" width="190" height="55" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="192" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">XDP Rewrite &amp; Redirect</text>
  <text x="140" y="210" font-size="10" text-anchor="middle" fill="#1e3a8a">L2 MAC Mod + bpf_redirect_map</text>
  <rect x="45" y="240" width="190" height="60" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="140" y="263" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Конвертація в xdp_frame</text>
  <text x="140" y="282" font-size="10" text-anchor="middle" fill="#1d4ed8">Перевірка HEADROOM &gt;= 256B</text>
  <rect x="290" y="120" width="230" height="150" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="405" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">xdp_bulk_queue</text>
  <rect x="305" y="165" width="200" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="405" y="189" font-size="12" font-family="monospace" text-anchor="middle" fill="#14532d">Пакетний буфер (до 16/64)</text>
  <text x="405" y="225" font-size="11" text-anchor="middle" fill="#15803d">Виклик xdp_do_flush() наприкінці NAPI</text>
  <text x="405" y="242" font-size="10" text-anchor="middle" fill="#166534">Мінімізація доступу до PCI-регістрів</text>
  <rect x="560" y="70" width="260" height="250" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="690" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">TX Інтерфейс (eth1)</text>
  <rect x="575" y="115" width="230" height="50" rx="4" fill="#e2e8f0" stroke="#475569"/>
  <text x="690" y="138" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">ndo_xdp_xmit()</text>
  <text x="690" y="154" font-size="11" text-anchor="middle" fill="#334155">Передача пачки xdp_frame</text>
  <rect x="575" y="178" width="230" height="45" rx="4" fill="#cbd5e1" stroke="#334155"/>
  <text x="690" y="205" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">TX Ring DMA</text>
  <rect x="575" y="235" width="230" height="70" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="690" y="258" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Рециклінг пам'яті page_pool</text>
  <text x="690" y="276" font-size="11" text-anchor="middle" fill="#7f1d1d">Повернення сторінок RX NIC</text>
  <text x="690" y="292" font-size="10" text-anchor="middle" fill="#991b1b">Без повторної аллокації!</text>
  <defs>
    <marker id="arr-b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-g2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
  </defs>
  <line x1="235" y1="195" x2="290" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b2)"/>
  <line x1="520" y1="195" x2="560" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g2)"/>
  <path d="M 575 270 L 270 270 L 270 135 L 235 135" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-r)"/>
  <text x="400" y="285" font-size="10" fill="#dc2626" text-anchor="middle">Зворотний потік сторінок (Zero Copy Recycle)</text>
</svg>