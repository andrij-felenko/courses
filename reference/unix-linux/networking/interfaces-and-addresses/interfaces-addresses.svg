<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
    <!-- Фон -->
    <rect width="800" height="400" fill="#f8f9fa"/>
    
    <!-- net_device -->
    <rect x="50" y="50" width="250" height="300" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="175" y="80" font-family="monospace" font-size="20" font-weight="bold" fill="#0d47a1" text-anchor="middle">struct net_device</text>
    
    <text x="70" y="120" font-family="monospace" font-size="14" fill="#333">name: "eth0"</text>
    <text x="70" y="145" font-family="monospace" font-size="14" fill="#333">dev_addr: MAC (6 bytes)</text>
    <text x="70" y="170" font-family="monospace" font-size="14" fill="#333">flags: IFF_UP | IFF_BROADCAST</text>
    <text x="70" y="195" font-family="monospace" font-size="14" fill="#333">mtu: 1500</text>
    <text x="70" y="220" font-family="monospace" font-size="14" fill="#333">netdev_ops: -> .ndo_start_xmit</text>
    
    <!-- ip_ptr зв'язок -->
    <line x1="300" y1="245" x2="400" y2="245" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="250" font-family="monospace" font-size="14" fill="#d32f2f">ip_ptr --------------------></text>
    
    <!-- in_device -->
    <rect x="420" y="50" width="330" height="300" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="585" y="80" font-family="monospace" font-size="20" font-weight="bold" fill="#1b5e20" text-anchor="middle">struct in_device</text>
    
    <!-- in_ifaddr 1 -->
    <rect x="440" y="110" width="290" height="100" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="585" y="130" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20" text-anchor="middle">struct in_ifaddr</text>
    <text x="450" y="155" font-family="monospace" font-size="14" fill="#333">ifa_local: 192.168.1.10</text>
    <text x="450" y="175" font-family="monospace" font-size="14" fill="#333">ifa_mask: 255.255.255.0 (/24)</text>
    <text x="450" y="195" font-family="monospace" font-size="14" fill="#333">ifa_broadcast: 192.168.1.255</text>

    <!-- in_ifaddr 2 -->
    <rect x="440" y="230" width="290" height="100" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
    <text x="585" y="250" font-family="monospace" font-size="16" font-weight="bold" fill="#1b5e20" text-anchor="middle">struct in_ifaddr (Alias)</text>
    <text x="450" y="275" font-family="monospace" font-size="14" fill="#333">ifa_local: 10.0.0.5</text>
    <text x="450" y="295" font-family="monospace" font-size="14" fill="#333">ifa_mask: 255.255.255.255 (/32)</text>
    <text x="450" y="315" font-family="monospace" font-size="14" fill="#333">ifa_broadcast: 10.0.0.5</text>
    
    <!-- Маркери для стрілок -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#1976d2" />
        </marker>
    </defs>
</svg>
