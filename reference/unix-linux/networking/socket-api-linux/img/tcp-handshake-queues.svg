<rect x="770.0" y="405.0" width="180.0" height="44.0" rx="6" fill="#bbf7d0" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="423.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">повертає новий conn_fd</tspan><tspan x="860.0" dy="14.3">(слухаючий FD вільний)</tspan></text>
<rect x="40.0" y="470.0" width="900.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="490.0" y="494.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">accept() НЕ бере участі у 3-Way Handshake — ядро виконує його повністю асинхронно у фоні</tspan></text>
