<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff" />
  <g font-family="sans-serif" font-size="14">
    <!-- Application -->
    <rect x="50" y="50" width="150" height="50" fill="#e0e0e0" stroke="#333" />
    <text x="125" y="80" text-anchor="middle">App: getaddrinfo()</text>
    
    <!-- NSS -->
    <rect x="50" y="150" width="150" height="50" fill="#d0e0ff" stroke="#333" />
    <text x="125" y="180" text-anchor="middle">nsswitch.conf</text>
    
    <!-- /etc/hosts -->
    <rect x="300" y="100" width="150" height="50" fill="#e0ffe0" stroke="#333" />
    <text x="375" y="130" text-anchor="middle">files: /etc/hosts</text>
    
    <!-- systemd-resolved -->
    <rect x="300" y="200" width="150" height="50" fill="#ffe0e0" stroke="#333" />
    <text x="375" y="230" text-anchor="middle">resolve / DNS</text>
    
    <!-- Network -->
    <rect x="550" y="200" width="150" height="50" fill="#ffffd0" stroke="#333" />
    <text x="625" y="230" text-anchor="middle">DNS Server (UDP/TCP)</text>
    
    <!-- Arrows -->
    <line x1="125" y1="100" x2="125" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="200" y1="165" x2="300" y2="125" stroke="#000" stroke-width="2" />
    <line x1="200" y1="185" x2="300" y2="225" stroke="#000" stroke-width="2" />
    <line x1="450" y1="225" x2="550" y2="225" stroke="#000" stroke-width="2" />
  </g>
</svg>