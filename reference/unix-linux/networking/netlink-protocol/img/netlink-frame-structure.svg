<text x="60.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">Заголовок повідомлення: struct nlmsghdr (16 байтів)</text>
<rect x="55.0" y="117.0" width="170.0" height="50.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="140.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">nlmsg_len (32 біти)</tspan><tspan x="140.0" dy="14.3">Повна довжина пакета</tspan></text>
