<rect x="40.0" y="190.0" width="760.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="60.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">Специфічний заголовок підсистеми (наприклад, struct ifinfomsg для rtnetlink / struct genlmsghdr)</text>
<rect x="55.0" y="217.0" width="730.0" height="30.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="420.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">ifi_family (8b) | ifi_type (16b) | ifi_index (32b) | ifi_flags (32b) | ifi_change (32b)</tspan></text>
