<rect x="65.0" y="363.0" width="330.0" height="35.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="230.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Дані: &quot;eth0\0&quot; (5 байтів) + 3 байти вирівнювання (Pad)</tspan></text>
<rect x="425.0" y="295.0" width="360.0" height="115.0" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
<text x="435.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">Атрибут 2: IFLA_LINKINFO (NLA_F_NESTED)</text>
<rect x="435.0" y="323.0" width="340.0" height="35.0" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/><text x="605.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">nla_len (16b) | nla_type = IFLA_LINKINFO | NLA_F_NESTED</tspan></text>
<rect x="435.0" y="363.0" width="340.0" height="35.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="605.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Вкладені атрибути: IFLA_INFO_KIND -&gt; &quot;vlan&quot;</tspan></text>
</svg>