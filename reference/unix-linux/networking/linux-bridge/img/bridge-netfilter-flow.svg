<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємодія Linux Bridge та Netfilter через br_netfilter</text>
<rect x="30.0" y="30.0" width="860.0" height="400.0" rx="8" fill="#fdfdfe" stroke="#495057" stroke-width="1.5"/>
<text x="460.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях транзитного L2-кадру через підсистему Netfilter (br_netfilter)</text>
<rect x="74.2" y="117.3" width="151.7" height="45.3" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/><text x="150.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідний кадр на порті</tspan><tspan x="150.0" dy="14.3">(NF_BR_PRE_ROUTING)</tspan></text>
<rect x="321.3" y="111.1" width="277.4" height="57.8" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/><text x="460.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Модуль br_netfilter (L2-&gt;L3 Bridge-NF)</tspan><tspan x="460.0" dy="13.7">[net.bridge.bridge-nf-call-iptables = 1]</tspan><tspan x="460.0" dy="13.7">Виклик L3 iptables PREROUTING над L2 кадром</tspan></text>
<rect x="681.6" y="117.3" width="176.8" height="45.3" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/><text x="770.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Рішення про комутацію</tspan><tspan x="770.0" dy="14.3">(FDB lookup / br_forward)</tspan></text>
<rect x="661.2" y="251.1" width="217.5" height="57.8" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/><text x="770.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">L3 iptables FORWARD</tspan><tspan x="770.0" dy="13.7">[Перевірка правил між L2-портами]</tspan><tspan x="770.0" dy="13.7">(NF_BR_FORWARD)</tspan></text>
<rect x="381.2" y="257.9" width="157.7" height="44.1" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.5"/><text x="460.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">L3 iptables POSTROUTING</tspan><tspan x="460.0" dy="13.7">[NF_BR_POST_ROUTING]</tspan></text>
<rect x="71.0" y="257.4" width="157.9" height="45.3" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="150.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вихідний порт (Egress)</tspan><tspan x="150.0" dy="14.3">[dev_queue_xmit()]</tspan></text>
<rect x="173.6" y="365.0" width="572.9" height="30.0" rx="6" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/><text x="460.0" y="383.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Застереження: перехоплення L2-трафіку модулем br_netfilter може спотворювати L3 NAT та ламати CNI</tspan></text>
