<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція вказівників у BPF Arena</text>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="440.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Механізм трансляції вказівників та маскування JIT у BPF Arena</text>
<rect x="40.0" y="70.0" width="800.0" height="90.0" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="440.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#24292f" text-anchor="middle" font-weight="700">Структура 64-бітного вказівника BPF Arena</text>
<rect x="96.9" y="101.2" width="266.2" height="47.6" rx="6" fill="#ddf4ff" stroke="#54aef5" stroke-width="1.5"/><text x="230.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Старші 32 біти: Базовий регіон Арени</tspan><tspan x="230.0" dy="15.6">(kern_vm_start або user_vm_start)</tspan></text>
<rect x="469.5" y="101.2" width="321.0" height="47.6" rx="6" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="630.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Молодші 32 біти: Зміщення у регіоні (Offset)</tspan><tspan x="630.0" dy="15.6">Діапазон 0 .. 4 ГБ (Sparse Memory)</tspan></text>
<rect x="40.0" y="190.0" width="380.0" height="210.0" rx="6" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="230.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a6700" text-anchor="middle" font-weight="700">Верифікатор BPF та JIT на x86-64 / arm64</text>
<rect x="120.8" y="241.2" width="218.4" height="47.6" rx="6" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><text x="230.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Перевірка атрибута __arena</tspan><tspan x="230.0" dy="15.6">LLVM address_space(1)</tspan></text>
<rect x="91.5" y="315.2" width="277.1" height="59.6" rx="6" fill="#ffffff" stroke="#d4a72c" stroke-width="1.5"/><text x="230.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">2. Вставка маскування інструкцій:</tspan><tspan x="230.0" dy="14.3">mov %eax, %eax (обнулення верхніх 32 біт)</tspan><tspan x="230.0" dy="14.3">add %r12, %rax (додавання kern_vm_start)</tspan></text>
<rect x="460.0" y="190.0" width="380.0" height="210.0" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="650.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700">Динамічне виділення та BPF Exception</text>
<rect x="523.7" y="241.2" width="252.6" height="47.6" rx="6" fill="#ddf4ff" stroke="#54aef5" stroke-width="1.5"/><text x="650.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Виклик bpf_arena_alloc_pages()</tspan><tspan x="650.0" dy="15.6">Виділення фізичних сторінок у ядрі</tspan></text>
<rect x="514.6" y="315.2" width="270.8" height="59.6" rx="6" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/><text x="650.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Спроба розіменування невидимої сторінки:</tspan><tspan x="650.0" dy="14.3">Безпечне перехоплення BPF Exception</tspan><tspan x="650.0" dy="14.3">(Захист від Kernel Panic / Fault)</tspan></text>
<line x1="420.0" y1="295.0" x2="460.0" y2="295.0" stroke="#8c959f" stroke-width="2.0" marker-end="url(#arrow)"/>
