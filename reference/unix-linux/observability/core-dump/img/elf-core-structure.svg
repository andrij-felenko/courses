<rect x="40.0" y="60.0" width="770.0" height="390.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<rect x="48.4" y="80.2" width="163.2" height="59.6" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="130.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ELF Header</tspan><tspan x="130.0" dy="14.3">e_type = ET_CORE</tspan><tspan x="130.0" dy="14.3">e_machine = EM_X86_64</tspan></text>
<rect x="298.4" y="80.2" width="163.2" height="59.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Program Headers Table</tspan><tspan x="380.0" dy="14.3">1x PT_NOTE segment</tspan><tspan x="380.0" dy="14.3">Nx PT_LOAD segments</tspan></text>
<rect x="60.0" y="180.0" width="340.0" height="240.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="230.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Сегмент PT_NOTE (Метадані процесів)</text>
<rect x="103.2" y="223.5" width="253.7" height="43.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="230.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">NT_PRSTATUS: registers (RIP, RSP, RAX...)</tspan><tspan x="230.0" dy="13.0">siginfo, PID, pr_cursig</tspan></text>
<rect x="114.6" y="290.0" width="230.9" height="30.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="230.0" y="308.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">NT_PRPSINFO: comm name, args, UID/GID</tspan></text>
<rect x="111.7" y="340.0" width="236.6" height="30.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="230.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">NT_SIGINFO: si_signo, si_code, si_addr</tspan></text>
<rect x="117.4" y="385.0" width="225.2" height="30.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="230.0" y="403.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">NT_FILE: mapped files &amp; mmap offsets</tspan></text>
<rect x="440.0" y="180.0" width="340.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Сегменти PT_LOAD (Зліпки пам'яті VMA)</text>
<rect x="486.0" y="228.5" width="248.0" height="43.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">PT_LOAD #1: Стек потоку 1 (Thread Stack)</tspan><tspan x="610.0" dy="13.0">[RSP-offset ... RSP-base]</tspan></text>
