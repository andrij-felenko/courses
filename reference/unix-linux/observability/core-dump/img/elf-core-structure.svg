<rect x="483.1" y="348.5" width="253.7" height="43.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">PT_LOAD #3: Глобальні дані (.data / .bss)</tspan><tspan x="610.0" dy="13.0">анонімні приватні мапінги</tspan></text>
