<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм стиснення та розпакування імен у kallsyms</text>
<rect x="20.0" y="20.0" width="860.0" height="440.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="40.0" y="50.0" width="390.0" height="180.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="235.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Таблиця відносних зміщень (kallsyms_offsets)</text>
<rect x="81.7" y="103.5" width="306.7" height="23.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="235.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Базова адреса ядра: _stext = 0xffffffff81000000</tspan></text>
<rect x="66.3" y="156.3" width="137.4" height="37.3" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="135.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Індекс 0: 0x00000000</tspan><tspan x="135.0" dy="14.3">-&gt; _stext</tspan></text>
<rect x="256.9" y="156.3" width="156.2" height="37.3" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="335.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Індекс 1024: 0x00043210</tspan><tspan x="335.0" dy="14.3">-&gt; vfs_read (+274.9 KB)</tspan></text>
<rect x="450.0" y="50.0" width="410.0" height="180.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="655.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Словник стиснення лексем (kallsyms_token_table)</text>
<rect x="462.5" y="101.3" width="175.0" height="37.3" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="550.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Токен 0x80 -&gt; &quot;sys_&quot;</tspan><tspan x="550.0" dy="14.3">Токен 0x81 -&gt; &quot;__x64_sys_&quot;</tspan></text>
<rect x="671.9" y="101.3" width="156.2" height="37.3" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="750.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Токен 0x82 -&gt; &quot;driver_&quot;</tspan><tspan x="750.0" dy="14.3">Токен 0x83 -&gt; &quot;__init_&quot;</tspan></text>
<rect x="507.9" y="161.3" width="294.1" height="37.3" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="655.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">256 найчастіших підрядків замінено на 1 байт</tspan><tspan x="655.0" dy="14.3">Заощаджує понад 60% обсягу імен у пам'яті RAM</tspan></text>
<rect x="40.0" y="250.0" width="820.0" height="190.0" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
<text x="450.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#713f12" text-anchor="middle" font-weight="700">Процес розпакування імені символу (kallsyms_expand_symbol)</text>
<rect x="110.5" y="309.4" width="179.0" height="41.3" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/><text x="200.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Стиснений потік байтів:</tspan><tspan x="200.0" dy="14.3">[0x81, 'o', 'p', 'e', 'n']</tspan></text>
<line x1="320.0" y1="330.0" x2="380.0" y2="330.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">Декодування</text>
<rect x="406.8" y="309.4" width="166.5" height="41.3" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/><text x="490.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Підстановка токена 0x81:</tspan><tspan x="490.0" dy="14.3">&quot;__x64_sys_&quot; + &quot;open&quot;</tspan></text>
<line x1="600.0" y1="330.0" x2="660.0" y2="330.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="673.0" y="309.4" width="153.9" height="41.3" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="750.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Фінальне ім'я символу:</tspan><tspan x="750.0" dy="14.3">&quot;__x64_sys_open&quot;</tspan></text>
<rect x="165.0" y="388.5" width="570.0" height="23.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="450.0" y="403.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Маркери kallsyms_markers розміщуються кожні 256 символів для прискорення бінарного пошуку</tspan></text>
</svg>