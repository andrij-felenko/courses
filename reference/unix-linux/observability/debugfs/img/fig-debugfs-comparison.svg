<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="580.0" rx="8" fill="#f8f9fa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="600.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#263238" text-anchor="middle" font-weight="700">Віртуальні файлові системи ядра Linux</text>
<rect x="50.0" y="90.0" width="340.0" height="480.0" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="2.0"/>
<rect x="50.0" y="90.0" width="340.0" height="50.0" rx="6" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5"/>
<text x="220.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#0d47a1" text-anchor="middle" font-weight="700">procfs (/proc)</text>
<text x="70.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">• Призначення: метадані процесів</text>
<text x="70.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  та глобальні параметри ядра</text>
<text x="70.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700">• Правила ABI: СТАБІЛЬНІ</text>
<text x="70.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  зміна формату ламає утиліти</text>
<text x="70.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Формат файлів: текстовий,</text>
<text x="70.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  іноді неструктурований</text>
<text x="70.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Доступ: непривілейований</text>
<text x="70.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  (частково обмежений правами)</text>
<text x="70.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Основні об'єкти: /proc/[pid],</text>
<text x="70.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  /proc/cpuinfo, /proc/meminfo</text>
<rect x="430.0" y="90.0" width="340.0" height="480.0" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2.0"/>
<rect x="430.0" y="90.0" width="340.0" height="50.0" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="600.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="700">sysfs (/sys)</text>
<text x="450.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">• Призначення: модель пристроїв</text>
<text x="450.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  (Device Model &amp; kobjects)</text>
<text x="450.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700">• Правила ABI: СУВОРІ Й СТАБІЛЬНІ</text>
<text x="450.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  «Never break userspace»</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">• Формат: 1 файл = 1 значення</text>
<text x="450.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  строга структура атрибутів</text>
<text x="450.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Доступ: керується udev/sysfs</text>
<text x="450.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  (системні сервіси й користувачі)</text>
<text x="450.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Основні об'єкти: /sys/bus,</text>
<text x="450.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  /sys/class, /sys/devices</text>
<rect x="810.0" y="90.0" width="340.0" height="480.0" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2.0"/>
<rect x="810.0" y="90.0" width="340.0" height="50.0" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
<text x="980.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#b71c1c" text-anchor="middle" font-weight="700">debugfs (/sys/kernel/debug)</text>
<text x="830.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">• Призначення: відлагодження</text>
<text x="830.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  драйверів та підсистем ядра</text>
<text x="830.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700">• Правила ABI: ВІДСУТНІ</text>
<text x="830.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  формат може змінюватися щодня</text>
<text x="830.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Формат: довільні дампи,</text>
<text x="830.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  seq_file, регістри, блоби</text>
<text x="830.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700">• Доступ: лише root (0700)</text>
<text x="830.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  блокується під Lockdown</text>
<text x="830.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">• Основні об'єкти: DRM, USB,</text>
<text x="830.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#455a64" text-anchor="start">  mac80211, dynamic_debug</text>
</svg>