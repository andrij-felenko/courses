<rect x="129.0" y="243.1" width="602.0" height="53.9" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Таймер ядра calc_load() (кожні 5 сек / LOAD_FREQ)</tspan><tspan x="430.0" dy="16.9">Обчислення згладженого середнього (EMA): active_tasks · exp + load · (1 - exp)</tspan></text>
