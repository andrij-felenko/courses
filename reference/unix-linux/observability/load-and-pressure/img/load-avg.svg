<rect x="68.2" y="101.9" width="183.6" height="56.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">TASK_RUNNING</tspan><tspan x="160.0" dy="18.2">(Виконується на CPU)</tspan></text>
