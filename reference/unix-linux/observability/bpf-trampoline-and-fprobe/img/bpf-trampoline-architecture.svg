<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури Kprobe INT3 та BPF Trampoline fentry</text>
<rect x="30.0" y="40.0" width="340.0" height="320.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1. Традиційний Kprobe (INT3 Trap)</text>
<rect x="50.0" y="60.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Вхід у функцію ядра</tspan><tspan x="200.0" dy="18.2">[заміна 1-го байта на INT3 0xCC]</tspan></text>
<line x1="200.0" y1="100.0" x2="200.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="120.0" width="300.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Програмне переривання (#BP Trap)</tspan><tspan x="200.0" dy="15.6">Скидання конвеєра CPU, перемикання NMI</tspan></text>
<line x1="200.0" y1="170.0" x2="200.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="190.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="200.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Обробник traps: збереження pt_regs</tspan><tspan x="200.0" dy="16.9">(21+ регістр: RAX, RBX, RDI, RSI...)</tspan></text>
<line x1="200.0" y1="240.0" x2="200.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="260.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="200.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Виклик BPF-програми + Single-step OOL</tspan><tspan x="200.0" dy="16.9">Відновлення всіх регістрів -&gt; RET</tspan></text>
<text x="200.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Оверхед: ~300-1000 тактів / нс</text>
<rect x="410.0" y="40.0" width="340.0" height="320.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="580.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2. BPF Trampoline (fentry / fexit)</text>
<rect x="430.0" y="60.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Вхід у функцію ядра</tspan><tspan x="580.0" dy="18.2">[ftrace CALL __fentry__]</tspan></text>
<line x1="580.0" y1="100.0" x2="580.0" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="120.0" width="300.0" height="50.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Динамічний JIT Trampoline Stub</tspan><tspan x="580.0" dy="15.6">Збереження лише аргументів (до 6 рег)</tspan></text>
<line x1="580.0" y1="170.0" x2="580.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="190.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Прямий виклик JIT BPF-програми</tspan><tspan x="580.0" dy="16.9">O(1) без pt_regs, без traps, type-safe</tspan></text>
<line x1="580.0" y1="240.0" x2="580.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="260.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Прямий виклик оригіналу -&gt; fexit -&gt; RET</tspan><tspan x="580.0" dy="15.6">Мінімальний пролог/епілог</tspan></text>
<text x="580.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Оверхед: ~5-15 тактів / нс (Zero-trap)</text>
</svg>