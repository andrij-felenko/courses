<line x1="295.0" y1="170.0" x2="250.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="272.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">SIGTRAP</text>
<line x1="505.0" y1="110.0" x2="550.0" y2="110.0" stroke="#e67e22" stroke-width="2.0" marker-end="url(#arrow)"/>
