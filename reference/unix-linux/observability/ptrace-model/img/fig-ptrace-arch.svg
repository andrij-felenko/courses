<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура ptrace: Tracer, Ядро та Tracee</text>
<rect x="40.0" y="70.0" width="210.0" height="230.0" rx="6" fill="#e8f4f8" stroke="#1b6ec2" stroke-width="1.5"/><text x="145.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Tracer (Трасувальник)</tspan><tspan x="145.0" dy="15.6">[gdb / strace / ltrace]</tspan><tspan x="145.0" dy="15.6"></tspan><tspan x="145.0" dy="15.6">• Цикл waitpid()</tspan><tspan x="145.0" dy="15.6">• Читання/запис регістрів</tspan><tspan x="145.0" dy="15.6">• Модифікація пам'яті</tspan></text>
<rect x="295.0" y="70.0" width="210.0" height="230.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/><text x="400.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Ядро Linux (Kernel)</tspan><tspan x="400.0" dy="15.6">[ptrace subsystem]</tspan><tspan x="400.0" dy="15.6"></tspan><tspan x="400.0" dy="15.6">• task_struct (PT_PTRACED)</tspan><tspan x="400.0" dy="15.6">• Сигнальна черга</tspan><tspan x="400.0" dy="15.6">• syscall entry/exit trap</tspan><tspan x="400.0" dy="15.6">• seccomp filter</tspan></text>
<rect x="550.0" y="70.0" width="210.0" height="230.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Tracee (Трасований)</tspan><tspan x="655.0" dy="16.9">[Цільовий процес]</tspan><tspan x="655.0" dy="16.9"></tspan><tspan x="655.0" dy="16.9">• Виконання коду</tspan><tspan x="655.0" dy="16.9">• Зупинка в SIGTRAP</tspan><tspan x="655.0" dy="16.9">• Очікування команд</tspan><tspan x="655.0" dy="16.9">• Інструкція INT 3</tspan></text>
