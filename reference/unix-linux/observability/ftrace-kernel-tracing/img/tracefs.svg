<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерфейс tracefs та підсистема кільцевих буферів ftrace</text>
<rect x="40.0" y="60.0" width="220.0" height="80.0" rx="6" fill="#e8f4f8" stroke="#2b7b98" stroke-width="1.5"/><text x="150.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Юзерпростір</tspan><tspan x="150.0" dy="18.2">trace-cmd / cat / echo</tspan><tspan x="150.0" dy="18.2">KernelShark / bpftrace</tspan></text>
<rect x="310.0" y="60.0" width="220.0" height="80.0" rx="6" fill="#f9f2e7" stroke="#d98c21" stroke-width="1.5"/><text x="420.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Інтерфейс VFS</tspan><tspan x="420.0" dy="16.9">/sys/kernel/tracing/</tspan><tspan x="420.0" dy="16.9">current_tracer, trace_pipe</tspan></text>
<rect x="580.0" y="60.0" width="220.0" height="80.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="690.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Кільцевий буфер ядра</tspan><tspan x="690.0" dy="14.3">Per-CPU Ring Buffers</tspan><tspan x="690.0" dy="14.3">Lockless pages (commit/reader)</tspan></text>
<line x1="260.0" y1="100.0" x2="310.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="100.0" x2="580.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="170.0" width="760.0" height="90.0" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/><text x="420.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Ключові файли керування vfs tracefs:</tspan><tspan x="420.0" dy="15.6">• current_tracer: вибір плагіна (function, function_graph, hwlat, nop)</tspan><tspan x="420.0" dy="15.6">• tracing_on: глобальний вимикач запису подій (1 / 0)</tspan><tspan x="420.0" dy="15.6">• set_ftrace_filter / set_ftrace_notrace: білий та чорний списки функцій</tspan><tspan x="420.0" dy="15.6">• trace_pipe: потоковий бінарний/текстовий вивід у реальному часі</tspan></text>
</svg>