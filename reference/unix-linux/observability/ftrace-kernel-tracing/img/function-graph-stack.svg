<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 210" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="210" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм function_graph: підміна адреси повернення на стеку</text>
<rect x="40.0" y="60.0" width="230.0" height="110.0" rx="6" fill="#e8f4f8" stroke="#2b7b98" stroke-width="1.5"/><text x="155.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. Вхід у функцію</tspan><tspan x="155.0" dy="15.6">ftrace_caller перехоплює виклик</tspan><tspan x="155.0" dy="15.6">ftrace_push_return_trace()</tspan><tspan x="155.0" dy="15.6">Збереження orig_ret + ts</tspan><tspan x="155.0" dy="15.6">у тіньовому стеку task_struct</tspan></text>
<rect x="305.0" y="60.0" width="230.0" height="110.0" rx="6" fill="#f9f2e7" stroke="#d98c21" stroke-width="1.5"/><text x="420.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. Підміна стеку</tspan><tspan x="420.0" dy="18.2">Адреса повернення на стеку</tspan><tspan x="420.0" dy="18.2">перезаписується на</tspan><tspan x="420.0" dy="18.2">return_to_handler</tspan></text>
<rect x="570.0" y="60.0" width="230.0" height="110.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="685.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">3. Вихід з функції</tspan><tspan x="685.0" dy="18.2">Інструкція RET повертає в</tspan><tspan x="685.0" dy="18.2">return_to_handler</tspan><tspan x="685.0" dy="18.2">Запис тривалості в буфер</tspan><tspan x="685.0" dy="18.2">Відновлення orig_ret</tspan></text>
<line x1="270.0" y1="115.0" x2="305.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="535.0" y1="115.0" x2="570.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
