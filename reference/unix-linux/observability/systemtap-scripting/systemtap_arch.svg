<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <rect width="800" height="400" fill="#f8f9fa"/>
    <text x="400" y="50" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#333">Архітектура SystemTap</text>
    
    <rect x="50" y="100" width="150" height="200" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="125" y="140" font-family="sans-serif" font-size="16" text-anchor="middle">.stp скрипт</text>
    <text x="125" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">stap (Pass 1-2)</text>
    
    <path d="M 210 200 L 290 200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="300" y="100" width="200" height="200" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="400" y="140" font-family="sans-serif" font-size="16" text-anchor="middle">C код &amp; Модуль (Kbuild)</text>
    <text x="400" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">stap (Pass 3-4)</text>
    
    <path d="M 510 200 L 590 200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="600" y="100" width="150" height="200" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="675" y="140" font-family="sans-serif" font-size="16" text-anchor="middle">Ядро (Kernel)</text>
    <text x="675" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#666">staprun (Pass 5)</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
    </defs>
</svg>