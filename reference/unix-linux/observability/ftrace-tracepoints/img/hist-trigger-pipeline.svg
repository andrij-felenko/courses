<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр внутрішньоядерної агрегації даних через hist-тригери ftrace</text>
<rect x="30.0" y="60.0" width="175.0" height="110.0" rx="6" fill="#e8f4f8" stroke="#2b7b98" stroke-width="1.5"/><text x="117.5" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">1. Подія ядра</tspan><tspan x="117.5" dy="15.6"></tspan><tspan x="117.5" dy="15.6">Виклик tracepoint</tspan><tspan x="117.5" dy="15.6">Наприклад:</tspan><tspan x="117.5" dy="15.6">sched:sched_switch</tspan><tspan x="117.5" dy="15.6">або net:netif_rx</tspan></text>
<rect x="235.0" y="60.0" width="185.0" height="110.0" rx="6" fill="#f9f2e7" stroke="#d98c21" stroke-width="1.5"/><text x="327.5" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">2. Фільтр ftrace</tspan><tspan x="327.5" dy="15.6"></tspan><tspan x="327.5" dy="15.6">Обчислення предиката</tspan><tspan x="327.5" dy="15.6">Парсинг полів у ядрі:</tspan><tspan x="327.5" dy="15.6">prev_state == 1 &amp;&amp;</tspan><tspan x="327.5" dy="15.6">prev_prio &gt; 100</tspan></text>
<rect x="450.0" y="60.0" width="185.0" height="110.0" rx="6" fill="#f3e8f8" stroke="#7b2b98" stroke-width="1.5"/><text x="542.5" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="542.5" dy="0.0">3. Хеш-таблиця hist</tspan><tspan x="542.5" dy="15.6"></tspan><tspan x="542.5" dy="15.6">Агрегація в пам'яті:</tspan><tspan x="542.5" dy="15.6">Ключі (keys=prev_comm)</tspan><tspan x="542.5" dy="15.6">Значення (vals=hitcount)</tspan><tspan x="542.5" dy="15.6">Модифікатори (.log2)</tspan></text>
<rect x="665.0" y="60.0" width="165.0" height="110.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="747.5" y="83.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="747.5" dy="0.0">4. Експорт / tracefs</tspan><tspan x="747.5" dy="14.3"></tspan><tspan x="747.5" dy="14.3">Читання файлу hist</tspan><tspan x="747.5" dy="14.3">Готовий звіт розподілу</tspan><tspan x="747.5" dy="14.3">Без викликів userspace</tspan><tspan x="747.5" dy="14.3">Нульовий I/O оверхед</tspan></text>
<line x1="205.0" y1="115.0" x2="235.0" y2="115.0" stroke="#2b7b98" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="420.0" y1="115.0" x2="450.0" y2="115.0" stroke="#d98c21" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="635.0" y1="115.0" x2="665.0" y2="115.0" stroke="#7b2b98" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="195.0" width="800.0" height="75.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="430.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Синтетичні події (Synthetic Events):</tspan><tspan x="430.0" dy="15.6">Збереження мітки часу в точці А (наприклад, sched_waking) -&gt; обчислення дельти в точці Б (sched_switch)</tspan><tspan x="430.0" dy="15.6">Результат: розрахунок латентності планувальника повністю всередині ядра Linux</tspan></text>
</svg>