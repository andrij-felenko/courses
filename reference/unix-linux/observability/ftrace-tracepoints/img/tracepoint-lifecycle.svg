<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл трасувальної точки ядра: від Static Key до обробників</text>
<rect x="30.0" y="50.0" width="240.0" height="40.0" rx="6" fill="#e8f4f8" stroke="#2b7b98" stroke-width="1.5"/><text x="150.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Потік коду ядра (Hot Path)</tspan></text>
<rect x="30.0" y="95.0" width="240.0" height="165.0" rx="6" fill="#ffffff" stroke="#2b7b98" stroke-width="1.5"/><text x="150.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Виклик trace_sched_switch(...)</tspan><tspan x="150.0" dy="13.0"></tspan><tspan x="150.0" dy="13.0">• Вимкнено: інструкція NOP (5 байтів)</tspan><tspan x="150.0" dy="13.0">  Нульове навантаження на кеш і CPU</tspan><tspan x="150.0" dy="13.0"></tspan><tspan x="150.0" dy="13.0">• Увімкнено: інструкція JMP</tspan><tspan x="150.0" dy="13.0">  Атомарно замінена через text_poke</tspan><tspan x="150.0" dy="13.0">  Перехід на out-of-line трамплін</tspan></text>
<rect x="300.0" y="50.0" width="260.0" height="40.0" rx="6" fill="#f9f2e7" stroke="#d98c21" stroke-width="1.5"/><text x="430.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">2. Диспетчер обробників (RCU)</tspan></text>
<rect x="300.0" y="95.0" width="260.0" height="165.0" rx="6" fill="#ffffff" stroke="#d98c21" stroke-width="1.5"/><text x="430.0" y="119.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Трамплін __tracepoint_sched_switch</tspan><tspan x="430.0" dy="15.6"></tspan><tspan x="430.0" dy="15.6">• Вхід у секцію RCU-читача</tspan><tspan x="430.0" dy="15.6">• rcu_dereference_raw(tp-&gt;funcs)</tspan><tspan x="430.0" dy="15.6">• Безблокувальний обхід масиву</tspan><tspan x="430.0" dy="15.6">• Виклик зареєстрованих функцій:</tspan><tspan x="430.0" dy="15.6">  - ftrace_event_probe()</tspan><tspan x="430.0" dy="15.6">  - bpf_trace_run()</tspan><tspan x="430.0" dy="15.6">  - perf_trace_run()</tspan></text>
<rect x="590.0" y="50.0" width="240.0" height="40.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="710.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">3. Споживачі та Кільцевий буфер</tspan></text>
<rect x="590.0" y="95.0" width="240.0" height="165.0" rx="6" fill="#ffffff" stroke="#4b9932" stroke-width="1.5"/><text x="710.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Запис події у кільцевий буфер</tspan><tspan x="710.0" dy="13.0"></tspan><tspan x="710.0" dy="13.0">• TP_fast_assign: бінарне копіювання</tspan><tspan x="710.0" dy="13.0">• Per-CPU буфер без блокувань</tspan><tspan x="710.0" dy="13.0">• eBPF програми (raw tracepoints)</tspan><tspan x="710.0" dy="13.0">• Агрегація у пам'яті (hist triggers)</tspan><tspan x="710.0" dy="13.0">• Читання через tracefs / trace_pipe</tspan></text>
<line x1="270.0" y1="175.0" x2="300.0" y2="175.0" stroke="#2b7b98" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="175.0" x2="590.0" y2="175.0" stroke="#d98c21" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="275.0" width="380.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#888888" stroke-width="1.5"/><text x="220.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Static Keys (Jump Labels):</tspan><tspan x="220.0" dy="11.7">При вимкненні відновлюється NOP, усуваючи будь-який оверхед гілкування</tspan></text>
<rect x="450.0" y="275.0" width="380.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#888888" stroke-width="1.5"/><text x="640.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Безпека RCU та NMI:</tspan><tspan x="640.0" dy="11.7">Реєстрація та відключення проб не вимагають блокувань у гарячому шляху</tspan></text>
</svg>