<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатофазна кодогенерація макросу TRACE_EVENT через define_trace.h</text>
<rect x="50.0" y="50.0" width="760.0" height="60.0" rx="6" fill="#fdf3e7" stroke="#d98c21" stroke-width="1.5"/><text x="430.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Визначення TRACE_EVENT(sched_switch, TP_PROTO(...), TP_ARGS(...), TP_STRUCT__entry(...), TP_fast_assign(...), TP_printk(...))</tspan></text>
<rect x="50.0" y="135.0" width="235.0" height="125.0" rx="6" fill="#e8f4f8" stroke="#2b7b98" stroke-width="1.5"/><text x="167.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Фаза 1: Структура події</tspan><tspan x="167.5" dy="13.0"></tspan><tspan x="167.5" dy="13.0">include/trace/trace_events.h</tspan><tspan x="167.5" dy="13.0">Генерація C-структури:</tspan><tspan x="167.5" dy="13.0">struct trace_event_raw_sched_switch</tspan><tspan x="167.5" dy="13.0">з типами полів із</tspan><tspan x="167.5" dy="13.0">TP_STRUCT__entry</tspan></text>
<rect x="312.0" y="135.0" width="235.0" height="125.0" rx="6" fill="#f3e8f8" stroke="#7b2b98" stroke-width="1.5"/><text x="429.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="429.5" dy="0.0">Фаза 2: Обробник та запис</tspan><tspan x="429.5" dy="13.0"></tspan><tspan x="429.5" dy="13.0">include/trace/trace_events.h</tspan><tspan x="429.5" dy="13.0">Генерація функції-проби:</tspan><tspan x="429.5" dy="13.0">trace_event_raw_event_sched_switch()</tspan><tspan x="429.5" dy="13.0">Серіалізація через TP_fast_assign</tspan><tspan x="429.5" dy="13.0">у кільцевий буфер ftrace</tspan></text>
<rect x="575.0" y="135.0" width="235.0" height="125.0" rx="6" fill="#eef7e9" stroke="#4b9932" stroke-width="1.5"/><text x="692.5" y="158.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Фаза 3: Метадані й VFS</tspan><tspan x="692.5" dy="14.3"></tspan><tspan x="692.5" dy="14.3">include/trace/trace_events.h</tspan><tspan x="692.5" dy="14.3">Генерація дескриптора формату:</tspan><tspan x="692.5" dy="14.3">trace_event_fields_sched_switch[]</tspan><tspan x="692.5" dy="14.3">Створення записів у tracefs:</tspan><tspan x="692.5" dy="14.3">format, filter, enable, trigger</tspan></text>
<line x1="167.0" y1="110.0" x2="167.0" y2="135.0" stroke="#d98c21" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="430.0" y1="110.0" x2="430.0" y2="135.0" stroke="#d98c21" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="692.0" y1="110.0" x2="692.0" y2="135.0" stroke="#d98c21" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="280.0" width="760.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#888888" stroke-width="1.5"/><text x="430.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Результат компіляції: єдиний макрос TRACE_EVENT створює двійковий макет, функцію запису,</tspan><tspan x="430.0" dy="15.6">інтерфейс фільтрації та експорт у /sys/kernel/tracing/events/ без дублювання коду</tspan></text>
</svg>