<rect x="70.0" y="244.0" width="1120.0" height="46.0" rx="6" fill="#f7faf8" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Кожна вершина везе в param1 кількість вершин свого полігону — і цього поля досить, щоб розрізати плоский список назад на полігони.</tspan></text>
<text x="70.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Зйомка: проєкція необоротна</text>
