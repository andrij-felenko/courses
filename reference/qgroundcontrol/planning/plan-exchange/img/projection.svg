<text x="630.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому геозона повертається з борту цілою, а зйомка — ні</text>
<text x="70.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Геозона: проєкція оборотна</text>
<rect x="70.0" y="104.0" width="300.0" height="90.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">полігон-включення</tspan><tspan x="220.0" dy="18.2">з чотирьох вершин</tspan></text>
