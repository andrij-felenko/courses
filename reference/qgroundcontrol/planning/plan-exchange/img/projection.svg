<rect x="874.0" y="386.0" width="316.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1032.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">вісім окремих точок:</tspan><tspan x="1032.0" dy="18.2">ані кроку, ані кута,</tspan><tspan x="1032.0" dy="18.2">ані меж полігона</tspan></text>
<rect x="70.0" y="544.0" width="1120.0" height="74.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="577.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">У пункті місії сім числових параметрів, і всі сім зайняті координатами й аргументами команди.</tspan><tspan x="630.0" dy="16.9">Покласти туди крок, кут чи межі полігона нема куди — тож відновити зйомку з точок нема з чого.</tspan></text>
