<rect x="566.0" y="199.0" width="740.0" height="132.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="936.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">Перший шар: одинадцять номерів поспіль, без жодного пропуску.</tspan><tspan x="936.0" dy="18.2">Так виглядає підсистема, спроєктована за один захід.</tspan><tspan x="936.0" dy="18.2">Координати пунктів тут — сім чисел з рухомою комою,</tspan><tspan x="936.0" dy="18.2">широта й довгота просто в градусах.</tspan></text>
<line x1="500.0" y1="489.0" x2="554.0" y2="489.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="566.0" y="455.0" width="740.0" height="68.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.5"/><text x="936.0" y="485.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="936.0" dy="0.0">Сусіди блоку вже тоді везли широту й довготу</tspan><tspan x="936.0" dy="16.9">як int32 у десятимільйонних частках градуса.</tspan></text>
<line x1="500.0" y1="553.0" x2="554.0" y2="553.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="713.0" x2="554.0" y2="713.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="566.0" y="559.0" width="740.0" height="148.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="936.0" y="601.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">Другий шар: цілочислові координати.</tspan><tspan x="936.0" dy="18.2">Номер повідомлення роздають раз і назавжди, тож замінити</tspan><tspan x="936.0" dy="18.2">старі повідомлення було нічим — лишалося дописати нові</tspan><tspan x="936.0" dy="18.2">у перші вільні номери, серед зовсім чужих сусідів.</tspan><tspan x="936.0" dy="18.2">Із 2020-06 старі оголошено застарілими.</tspan></text>
<text x="673.0" y="826.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Третій і четвертий шари власних номерів не мають зовсім</text>
<rect x="56.0" y="844.0" width="420.0" height="116.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="266.0" y="872.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="266.0" dy="0.0">Третій шар: mission_type</tspan><tspan x="266.0" dy="16.9"></tspan><tspan x="266.0" dy="16.9">розширене поле в кожному повідомленні блоку:</tspan><tspan x="266.0" dy="16.9">0 — місія · 1 — геозона · 2 — точки збору</tspan><tspan x="266.0" dy="16.9">255 — усі типи, лише в MISSION_CLEAR_ALL</tspan></text>
<rect x="496.0" y="844.0" width="420.0" height="116.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="706.0" y="882.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">Четвертий шар: ідентифікатори плану</tspan><tspan x="706.0" dy="15.6"></tspan><tspan x="706.0" dy="15.6">MISSION_ACK.opaque_id · MISSION_COUNT.opaque_id</tspan><tspan x="706.0" dy="15.6">MISSION_CURRENT.mission_id / fence_id / rally_points_id</tspan></text>
<rect x="956.0" y="844.0" width="350.0" height="116.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.5"/><text x="1131.0" y="891.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1131.0" dy="0.0">Розширені поля дописують у кінець уже випущеного</tspan><tspan x="1131.0" dy="14.3">повідомлення. Це можливо лише в MAVLink 2 — і саме</tspan><tspan x="1131.0" dy="14.3">тому обидва шари молодші за нього.</tspan></text>
</svg>