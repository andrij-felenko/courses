<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1340" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один протокол, два таймери: різниця не в смаку, а в тому, чим зайнятий борт</text>
<rect x="60.0" y="76.0" width="250.0" height="38.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">момент обміну</tspan></text>
<rect x="330.0" y="76.0" width="390.0" height="38.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">що робить борт</tspan></text>
<rect x="740.0" y="76.0" width="350.0" height="38.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">що означає тиша</tspan></text>
<rect x="1110.0" y="76.0" width="170.0" height="38.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1195.0" dy="0.0">таймер</tspan></text>
<rect x="60.0" y="126.0" width="250.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">після MISSION_COUNT</tspan></text>
<rect x="330.0" y="126.0" width="390.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">перевіряє тип плану,</tspan><tspan x="525.0" dy="16.9">рахує місце в пам'яті,</tspan><tspan x="525.0" dy="16.9">готується приймати</tspan></text>
<rect x="740.0" y="126.0" width="350.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">борт може бути</tspan><tspan x="915.0" dy="16.9">справді зайнятий —</tspan><tspan x="915.0" dy="16.9">чекати варто довго</tspan></text>
<rect x="1110.0" y="126.0" width="170.0" height="96.0" rx="6" fill="#fdf6f5" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1195.0" dy="0.0">1500 мс</tspan></text>
<rect x="60.0" y="232.0" width="250.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">між пунктами</tspan></text>
<rect x="330.0" y="232.0" width="390.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">нічого важкого:</tspan><tspan x="525.0" dy="16.9">кладе пункт у буфер</tspan><tspan x="525.0" dy="16.9">і просить наступний</tspan></text>
<rect x="740.0" y="232.0" width="350.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">зайнятості немає, тож</tspan><tspan x="915.0" dy="16.9">тиша майже напевно —</tspan><tspan x="915.0" dy="16.9">це втрачений кадр</tspan></text>
<rect x="1110.0" y="232.0" width="170.0" height="96.0" rx="6" fill="#fdf6f5" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1195.0" dy="0.0">250 мс</tspan></text>
<rect x="60.0" y="338.0" width="250.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">після останнього пункту</tspan></text>
<rect x="330.0" y="338.0" width="390.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">перевіряє місію цілком</tspan><tspan x="525.0" dy="16.9">і записує її у сховище</tspan></text>
<rect x="740.0" y="338.0" width="350.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="373.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">запис у флеш триває</tspan><tspan x="915.0" dy="16.9">довше за політ кадру —</tspan><tspan x="915.0" dy="16.9">чекати варто довго</tspan></text>
<rect x="1110.0" y="338.0" width="170.0" height="96.0" rx="6" fill="#fdf6f5" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1195.0" dy="0.0">1500 мс</tspan></text>
<rect x="60.0" y="448.0" width="1220.0" height="40.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="472.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Коротший таймер мусить бути більший за затримку туди-назад: на радіо з RTT 150 мс поріг 250 мс іще безпечний, а 100 мс подвоїв би кожен пункт.</tspan></text>
</svg>