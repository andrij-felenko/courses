<rect x="60.0" y="806.0" width="1000.0" height="76.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="831.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Кожен запит — водночас підтвердження попереднього пункту й замовлення наступного.</tspan><tspan x="560.0" dy="16.9">Немає відповіді 1500 мс — станція повторює; на невідданий пункт чекає 250 мс;</tspan><tspan x="560.0" dy="16.9">після п'ятої невдалої спроби транзакцію скасовано, місія на борту лишається старою.</tspan></text>
