<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 940" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1420" height="940" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машина станів вивантажувача: чого чекаємо і скільки</text>
<rect x="130.0" y="73.9" width="340.0" height="52.2" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">СПОКІЙ</tspan><tspan x="300.0" dy="18.2">таймерів немає</tspan></text>
<rect x="130.0" y="223.9" width="340.0" height="52.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ЧЕКАЮ ПЕРШОГО ЗАПИТУ</tspan><tspan x="300.0" dy="18.2">таймер 1500 мс · до 5 спроб</tspan></text>
<rect x="130.0" y="373.9" width="340.0" height="52.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ЧЕКАЮ ЧЕРГОВОГО ЗАПИТУ</tspan><tspan x="300.0" dy="18.2">таймер 250 мс · до 5 спроб</tspan></text>
<rect x="130.0" y="523.9" width="340.0" height="52.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="545.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ЧЕКАЮ ПІДТВЕРДЖЕННЯ</tspan><tspan x="300.0" dy="18.2">таймер 1500 мс · без повторів</tspan></text>
<rect x="130.0" y="673.9" width="340.0" height="52.2" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="695.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">СПОКІЙ</tspan><tspan x="300.0" dy="18.2">успіх або названа помилка</tspan></text>
<line x1="300.0" y1="126.0" x2="300.0" y2="224.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">надіслали MISSION_COUNT (n = 12, тип плану — місія);</tspan><tspan x="510.0" dy="16.9">у черзі всі номери 0…11, віддано жодного</tspan></text>
<line x1="300.0" y1="276.0" x2="300.0" y2="374.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">прийшов MISSION_REQUEST або MISSION_REQUEST_INT:</tspan><tspan x="510.0" dy="16.9">шлемо MISSION_ITEM_INT і викреслюємо номер із черги</tspan></text>
<line x1="300.0" y1="426.0" x2="300.0" y2="524.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">черга спорожніла — кожен номер віддано принаймні раз</tspan></text>
<line x1="300.0" y1="576.0" x2="300.0" y2="674.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="510.0" y="620.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">MISSION_ACK: ACCEPTED — місія на борту;</tspan><tspan x="510.0" dy="16.9">інший код — помилка з описом останнього відданого пункта</tspan></text>
<rect x="60.0" y="790.0" width="420.0" height="36.0" rx="6" fill="#f3efe6" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="812.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Повторний запит — не помилка</tspan></text>
<rect x="60.0" y="830.0" width="420.0" height="82.0" rx="6" fill="#fbf9f5" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="858.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">борт має право попросити номер, який уже віддано,</tspan><tspan x="270.0" dy="16.9">і просити не підряд. Відповідаємо ще раз; черга</tspan><tspan x="270.0" dy="16.9">лише каже, чи все віддано, а не куди йти далі.</tspan></text>
<rect x="510.0" y="790.0" width="420.0" height="36.0" rx="6" fill="#f3efe6" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="812.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Таймаут — повтор останнього</tspan></text>
<rect x="510.0" y="830.0" width="420.0" height="82.0" rx="6" fill="#fbf9f5" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="858.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">мовчання: шлемо ще раз те саме, що й посилали, —</tspan><tspan x="720.0" dy="16.9">лічильник або той самий пункт, спроба +1.</tspan><tspan x="720.0" dy="16.9">Нічого, чого не просили, у канал не йде.</tspan></text>
<rect x="960.0" y="790.0" width="420.0" height="36.0" rx="6" fill="#f3efe6" stroke="#333333" stroke-width="1.5"/><text x="1170.0" y="812.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">Скасування — теж повідомлення</tspan></text>
<rect x="960.0" y="830.0" width="420.0" height="82.0" rx="6" fill="#fbf9f5" stroke="#6b7280" stroke-width="1.5"/><text x="1170.0" y="858.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">своє скасування й вичерпані спроби закриваємо</tspan><tspan x="1170.0" dy="16.9">через MISSION_ACK (OPERATION_CANCELLED): борт</tspan><tspan x="1170.0" dy="16.9">не чекатиме решти до власного таймауту.</tspan></text>
</svg>