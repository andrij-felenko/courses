<rect x="670.0" y="560.0" width="640.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="585.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Борт зберігає лише пронумеровані записи однакової довжини.</tspan><tspan x="990.0" dy="16.9">Крок, кут і перекриття зникли: замість полігона зйомки —</tspan><tspan x="990.0" dy="16.9">просто вісім точок підряд, нічим між собою не зв'язаних.</tspan></text>
<rect x="40.0" y="578.0" width="410.0" height="76.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="603.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Структура живе тільки тут: типи елементів,</tspan><tspan x="245.0" dy="16.9">параметри патернів, режими висоти, посилання</tspan><tspan x="245.0" dy="16.9">на рельєф, планована домашня точка.</tspan></text>
