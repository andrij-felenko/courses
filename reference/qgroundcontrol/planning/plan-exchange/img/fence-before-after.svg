<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1420" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геозона й точки збору: два вендорські протоколи проти одного поля</text>
<text x="320.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Було: діалект ArduPilot</text>
<rect x="60.0" y="100.0" width="250.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">FENCE_POINT · 160</tspan></text>
<rect x="330.0" y="100.0" width="250.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">FENCE_FETCH_POINT · 161</tspan></text>
<rect x="60.0" y="148.0" width="520.0" height="76.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">lat, lng — float у градусах: та сама вада, що й у місіях,</tspan><tspan x="320.0" dy="16.9">тільки тут вона припала на межу дозволеної зони.</tspan><tspan x="320.0" dy="16.9">Перша точка має індекс 1: нульовий зайнято точкою повернення.</tspan></text>
<rect x="60.0" y="256.0" width="250.0" height="40.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">RALLY_POINT · 175</tspan></text>
<rect x="330.0" y="256.0" width="250.0" height="40.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="455.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">RALLY_FETCH_POINT · 176</tspan></text>
<rect x="60.0" y="304.0" width="520.0" height="76.0" rx="6" fill="#f7faff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">lat, lng — int32 у десятимільйонних частках градуса,</tspan><tspan x="320.0" dy="16.9">тобто зроблено правильно.</tspan><tspan x="320.0" dy="16.9">Перша точка має індекс 0.</tspan></text>
<rect x="60.0" y="410.0" width="520.0" height="92.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="435.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Дві пари повідомлень одного діалекту, написані для однієї</tspan><tspan x="320.0" dy="16.9">задачі, розійшлися і в поданні координат, і в нумерації.</tspan><tspan x="320.0" dy="16.9">Кожна пара — крихітний власний протокол із власними</tspan><tspan x="320.0" dy="16.9">таймаутами, повторами й порядком обміну.</tspan></text>
<text x="675.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">одне розширене</text>
<text x="675.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">поле mission_type</text>
<line x1="608.0" y1="300.0" x2="742.0" y2="300.0" stroke="#333333" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1075.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стало: той самий протокол місій</text>
<rect x="770.0" y="100.0" width="610.0" height="40.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1075.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1075.0" dy="0.0">Протокол місій: рахунок, запит пункту, підтвердження, повтори</tspan></text>
<rect x="770.0" y="160.0" width="196.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="868.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="868.0" dy="0.0">mission_type = 0</tspan></text>
<rect x="770.0" y="202.0" width="196.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="868.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="868.0" dy="0.0">місія</tspan><tspan x="868.0" dy="16.9">MAV_CMD_NAV_*</tspan></text>
<rect x="976.0" y="160.0" width="196.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1074.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1074.0" dy="0.0">mission_type = 1</tspan></text>
<rect x="976.0" y="202.0" width="196.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1074.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1074.0" dy="0.0">геозона</tspan><tspan x="1074.0" dy="16.9">MAV_CMD_NAV_FENCE_*</tspan></text>
<rect x="1182.0" y="160.0" width="196.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1280.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1280.0" dy="0.0">mission_type = 2</tspan></text>
<rect x="1182.0" y="202.0" width="196.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1280.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1280.0" dy="0.0">точки збору</tspan><tspan x="1280.0" dy="16.9">MAV_CMD_NAV_RALLY_POINT</tspan></text>
<rect x="770.0" y="288.0" width="610.0" height="62.0" rx="6" fill="#f7faf8" stroke="#27ae60" stroke-width="1.5"/><text x="1075.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1075.0" dy="0.0">Координати всюди int32 · 10⁷, нумерація всюди з нуля,</tspan><tspan x="1075.0" dy="16.9">домовленість про обмін одна на всі три частини плану.</tspan></text>
<rect x="770.0" y="374.0" width="610.0" height="128.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="1075.0" y="408.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1075.0" dy="0.0">У застосунку це один клас:</tspan><tspan x="1075.0" dy="16.9"></tspan><tspan x="1075.0" dy="16.9">PlanManager(vehicle, _planType)</tspan><tspan x="1075.0" dy="16.9">    GeoFenceManager   → MAV_MISSION_TYPE_FENCE</tspan><tspan x="1075.0" dy="16.9">    RallyPointManager → MAV_MISSION_TYPE_RALLY</tspan></text>
<rect x="60.0" y="540.0" width="1320.0" height="106.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="580.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Поле mission_type — розширене, тобто дописане в кінець уже випущених повідомлень, а розширені поля існують лише в MAVLink 2.</tspan><tspan x="720.0" dy="16.9">Приймач, який поля не знає, добиває тіло нулями — тож нуль мусив означати саме те, що діялося до появи поля, тобто місію.</tspan><tspan x="720.0" dy="16.9">Якби нулем позначили геозону, кожна стара станція зносила б апаратові межі дозволеної зони своїм маршрутом.</tspan></text>
</svg>