<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роздільність на місцевості з подібних трикутників камери-обскури</text>
<line x1="150.0" y1="550.0" x2="660.0" y2="550.0" stroke="#333333" stroke-width="2.6"/>
<text x="600.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">земля</text>
<line x1="356.0" y1="180.0" x2="444.0" y2="180.0" stroke="#2457d6" stroke-width="5.0"/>
<text x="400.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">матриця:  s = 23.5 мм,  w = 6000 пікс</text>
<line x1="356.0" y1="180.0" x2="588.6" y2="550.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="444.0" y1="180.0" x2="211.4" y2="550.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="400.0" y1="180.0" x2="400.0" y2="550.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<circle cx="400.0" cy="250.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="416.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">отвір</text>
<line x1="300.0" y1="180.0" x2="300.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="294.0" y1="180.0" x2="306.0" y2="180.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="294.0" y1="250.0" x2="306.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="292.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">f = 16 мм</text>
<line x1="200.0" y1="250.0" x2="200.0" y2="550.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="194.0" y1="250.0" x2="206.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="194.0" y1="550.0" x2="206.0" y2="550.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="192.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">H = 60 м</text>
<line x1="211.4" y1="585.0" x2="588.6" y2="585.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="211.4" y1="579.0" x2="211.4" y2="591.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="588.6" y1="579.0" x2="588.6" y2="591.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="400.0" y="612.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">слід кадру = H · s / f = 88.1 м</text>
<text x="400.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">зображення на матриці перевернуте — на пропорцію це не впливає</text>
<rect x="730.0" y="88.0" width="540.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">подібні трикутники:   (s/2) / f = (слід/2) / H</tspan><tspan x="1000.0" dy="20.8">звідси   слід = H · s / f</tspan></text>
<rect x="730.0" y="214.0" width="540.0" height="104.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="261.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">піксель:  p = s / w = 3.917 мкм</tspan><tspan x="1000.0" dy="20.8">роздільність:  g = H · p / f = H · s / (w · f)</tspan></text>
<rect x="730.0" y="340.0" width="258.0" height="152.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="859.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="859.0" dy="0.0">висота → роздільність</tspan><tspan x="859.0" dy="18.2"></tspan><tspan x="859.0" dy="18.2">g = H·s·100 / (w·f)</tspan><tspan x="859.0" dy="18.2"></tspan><tspan x="859.0" dy="18.2">60 м → 1.469 см/пікс</tspan></text>
<rect x="1012.0" y="340.0" width="258.0" height="152.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="1141.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1141.0" dy="0.0">роздільність → висота</tspan><tspan x="1141.0" dy="18.2"></tspan><tspan x="1141.0" dy="18.2">H = g·w·f / (s·100)</tspan><tspan x="1141.0" dy="18.2"></tspan><tspan x="1141.0" dy="18.2">2.00 см/пікс → 81.7 м</tspan></text>
<rect x="730.0" y="514.0" width="540.0" height="104.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="561.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">висота матриці в цю арифметику не входить узагалі:</tspan><tspan x="1000.0" dy="18.2">пікселі квадратні, тож p = s/w — те саме по обох сторонах</tspan></text>
</svg>