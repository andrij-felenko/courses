<text x="136.0" y="568.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Пакування в ефір</text>
<text x="136.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">градуси · 10⁷ → int32, крім MAV_FRAME_MISSION</text>
<line x1="660.0" y1="550.0" x2="660.0" y2="600.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="678.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">потребує: frame запису — він вирішує, чи це координата</text>
<line x1="60.0" y1="648.0" x2="1180.0" y2="648.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="620.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">порядок не переставити: крок 4 підставляє номери, яких до кроку 3 ще немає,</text>
<text x="620.0" y="706.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">а крок 3 не знає номерів, поки крок 2 не вирішив, чи є нульовий запис</text>
</svg>