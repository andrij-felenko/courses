<line x1="240.0" y1="428.0" x2="940.0" y2="428.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">правка біжить уперед, разом з обходом</text>
<line x1="150.0" y1="570.0" x2="940.0" y2="570.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="545.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">обхід масиву: i = 0 … n−2</text>
<rect x="1019.4" y="432.0" width="141.1" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="451.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">виправлена точка —</tspan><tspan x="1090.0" dy="15.6">та, до якої обхід</tspan><tspan x="1090.0" dy="15.6">ще не дійшов:</tspan><tspan x="1090.0" dy="15.6">другий прохід лише</tspan><tspan x="1090.0" dy="15.6">підтверджує,</tspan><tspan x="1090.0" dy="15.6">що правок немає</tspan></text>
