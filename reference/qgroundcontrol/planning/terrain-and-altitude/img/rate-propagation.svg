<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обхід іде вперед, а правка набору — назад: звідси різна кількість проходів</text>
<text x="56.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Набір: правило піднімає ПОПЕРЕДНЮ точку пари</text>
