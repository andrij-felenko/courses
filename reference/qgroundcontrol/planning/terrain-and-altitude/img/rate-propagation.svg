<rect x="1022.9" y="162.0" width="134.3" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">за один прохід</tspan><tspan x="1090.0" dy="15.6">виправляється</tspan><tspan x="1090.0" dy="15.6">одна пара:</tspan><tspan x="1090.0" dy="15.6">проходів стільки,</tspan><tspan x="1090.0" dy="15.6">скільки точок</tspan><tspan x="1090.0" dy="15.6">у похилій</tspan></text>
