<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три копії плану й дві позначки змін</text>
<rect x="410.0" y="90.0" width="360.0" height="90.0" rx="6" fill="#fffbea" stroke="#b8860b" stroke-width="2.0"/><text x="590.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">модель редактора</tspan><tspan x="590.0" dy="19.5">те, що зараз на екрані</tspan></text>
<rect x="70.0" y="350.0" width="340.0" height="90.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">файл .plan</tspan><tspan x="240.0" dy="19.5">на диску</tspan></text>
<rect x="770.0" y="350.0" width="340.0" height="90.0" rx="6" fill="#fbf1ee" stroke="#c0392b" stroke-width="2.0"/><text x="940.0" y="390.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">пам'ять апарата</tspan><tspan x="940.0" dy="19.5">три списки</tspan></text>
<line x1="470.0" y1="186.0" x2="290.0" y2="344.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="344.0" x2="430.0" y2="186.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="186.0" x2="890.0" y2="344.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="930.0" y1="344.0" x2="750.0" y2="186.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="81.6" y="207.9" width="132.8" height="52.2" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="148.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">dirtyForSave</tspan><tspan x="148.0" dy="18.2">модель ≠ файл</tspan></text>
<rect x="961.2" y="207.9" width="141.5" height="52.2" rx="6" fill="#fbf1ee" stroke="#c0392b" stroke-width="1.5"/><text x="1032.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1032.0" dy="0.0">dirtyForUpload</tspan><tspan x="1032.0" dy="18.2">модель ≠ борт</tspan></text>
<line x1="414.0" y1="395.0" x2="766.0" y2="395.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="8,7"/>
<rect x="340.6" y="464.8" width="498.8" height="70.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="486.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Файл із бортом порівняти нема як: щоб дізнатися вміст борту,</tspan><tspan x="590.0" dy="18.2">його треба прочитати, а читання затирає модель редактора.</tspan><tspan x="590.0" dy="18.2">Тому обидві позначки міряють розбіжність від моделі.</tspan></text>
</svg>