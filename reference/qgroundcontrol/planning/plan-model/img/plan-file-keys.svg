<rect x="470.0" y="384.0" width="320.0" height="168.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">polygons[ ]</tspan><tspan x="630.0" dy="18.2">circles[ ]</tspan><tspan x="630.0" dy="18.2">breachReturn</tspan><tspan x="630.0" dy="18.2">(лише коли її задано)</tspan></text>
