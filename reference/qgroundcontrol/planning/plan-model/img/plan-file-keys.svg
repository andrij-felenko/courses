<rect x="70.0" y="384.0" width="320.0" height="168.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.8"/><text x="230.0" y="436.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">firmwareType · vehicleType</tspan><tspan x="230.0" dy="18.2">cruiseSpeed · hoverSpeed</tspan><tspan x="230.0" dy="18.2">globalPlanAltitudeMode</tspan><tspan x="230.0" dy="18.2">plannedHomePosition</tspan><tspan x="230.0" dy="18.2">items[ ]</tspan></text>
