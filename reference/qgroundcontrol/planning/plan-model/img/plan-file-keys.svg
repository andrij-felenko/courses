<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файл .plan: одна оболонка, три об'єкти, чотири незалежні версії</text>
<rect x="40.0" y="58.0" width="1180.0" height="700.0" rx="12" fill="#fffdf5" stroke="#b8860b" stroke-width="2.2"/>
<text x="62.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d1f" text-anchor="start" font-weight="700">оболонка файлу — PlanMasterController</text>
<rect x="271.2" y="114.5" width="717.5" height="35.0" rx="6" fill="#fffbea" stroke="#b8860b" stroke-width="1.5"/><text x="630.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">&quot;fileType&quot;: &quot;Plan&quot;      &quot;version&quot;: 1      &quot;groundStation&quot;: &quot;QGroundControl&quot;</tspan></text>
<text x="630.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">версія оболонки відповідає лише за те, чи це взагалі план</text>
<text x="70.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ключі об'єкта</text>
