<rect x="870.0" y="384.0" width="320.0" height="168.0" rx="6" fill="#fbf1ee" stroke="#c0392b" stroke-width="1.8"/><text x="1030.0" y="463.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">points[ ]</tspan><tspan x="1030.0" dy="18.2">[широта, довгота, висота]</tspan></text>
<rect x="870.0" y="580.0" width="320.0" height="106.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="1030.0" y="620.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">версія 1 —</tspan><tspan x="1030.0" dy="16.9">тихо пропущено:</tspan><tspan x="1030.0" dy="16.9">план без точок збору</tspan></text>
<rect x="332.7" y="793.9" width="594.6" height="52.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="815.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Незнайомого ключа читач просто не помічає: перевіряються наявність і тип</tspan><tspan x="630.0" dy="18.2">лише тих ключів, які він сам шукає. Чуже поле у файлі нічого не ламає.</tspan></text>
