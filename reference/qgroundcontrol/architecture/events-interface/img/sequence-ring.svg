<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1380" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Циклічне порівняння номерів однією беззнаковою різницею</text>
<path d="M 400.0 205.0 A 225.0 225.0 0 0 1 400.0 655.0 Z" fill="#fdecea"/>
<path d="M 400.0 655.0 A 225.0 225.0 0 0 1 400.0 205.0 Z" fill="#eaf0fd"/>
<circle cx="400.0" cy="430.0" r="225.0" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="400.0" y1="205.0" x2="400.0" y2="655.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="7,5"/>
<rect x="430.0" y="375.0" width="170.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="515.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">новіше</tspan><tspan x="515.0" dy="16.9">1 … 32767</tspan><tspan x="515.0" dy="16.9">діра в нумерації</tspan></text>
<rect x="200.0" y="375.0" width="170.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="285.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">старіше</tspan><tspan x="285.0" dy="16.9">32768 … 65535</tspan><tspan x="285.0" dy="16.9">дублікат</tspan></text>
<circle cx="400.0" cy="205.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="400.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">diff = 0 — рівно: приймаємо</text>
<circle cx="400.0" cy="655.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="689.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">межа: UINT16_MAX / 2 = 32767</text>
<text x="400.0" y="721.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">diff = incoming − expected, беззнакове 16-бітове</text>
<text x="1050.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ті самі два рядки на переході через нуль</text>
<rect x="770.0" y="130.0" width="560.0" height="112.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="1050.0" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">прийнято 65533, прийшла 65534</tspan><tspan x="1050.0" dy="18.2">diff = 65534 − 65534 = 0</tspan><tspan x="1050.0" dy="18.2">рівно: приймаємо, таймер геть</tspan></text>
<rect x="770.0" y="275.0" width="560.0" height="112.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1050.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">прийнято 65535, прийшла 1</tspan><tspan x="1050.0" dy="18.2">diff = 1 − 0 = 1   (≤ 32767)</tspan><tspan x="1050.0" dy="18.2">новіше: пропущено 0, просимо повтор</tspan></text>
<rect x="770.0" y="420.0" width="560.0" height="112.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1050.0" y="462.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">прийнято 2, прийшла 65535</tspan><tspan x="1050.0" dy="18.2">diff = 65535 − 3 = 65532   (&gt; 32767)</tspan><tspan x="1050.0" dy="18.2">старіше: дублікат, відкидаємо</tspan></text>
<rect x="770.0" y="565.0" width="560.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="1050.0" y="607.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">прийнято 65531, найстаріше доступне 2</tspan><tspan x="1050.0" dy="18.2">втрачено = 2 − 65531 − 1 = 6</tspan><tspan x="1050.0" dy="18.2">це 65532, 65533, 65534, 65535, 0, 1</tspan></text>
</svg>