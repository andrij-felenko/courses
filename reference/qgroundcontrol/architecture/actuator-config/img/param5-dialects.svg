<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне поле, дві нумерації функцій</text>
<rect x="435.0" y="87.5" width="430.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">param5 команди ACTUATOR_TEST</tspan></text>
<rect x="140.0" y="220.1" width="400.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">param5 &lt; 1000</tspan><tspan x="340.0" dy="16.9">стандартна нумерація MAVLink</tspan></text>
<rect x="760.0" y="220.1" width="400.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="960.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">param5 ≥ 1000</tspan><tspan x="960.0" dy="16.9">діалект PX4</tspan></text>
<line x1="495.0" y1="132.5" x2="340.0" y2="210.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="805.0" y1="132.5" x2="960.0" y2="210.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
