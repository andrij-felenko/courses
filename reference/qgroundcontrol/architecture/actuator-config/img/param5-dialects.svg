<line x1="340.0" y1="279.9" x2="340.0" y2="355.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="510.1" width="400.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">будь-яке інше число</tspan><tspan x="340.0" dy="16.9">→ UNSUPPORTED</tspan></text>
<line x1="340.0" y1="424.9" x2="340.0" y2="500.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.0" y="373.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">функція = param5 − 1000</tspan></text>
<line x1="960.0" y1="279.9" x2="960.0" y2="363.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.0" y="510.1" width="400.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">101 Motor · 201 Servo</tspan><tspan x="960.0" dy="16.9">400 шасі · 430 захват · 2000 камера</tspan></text>
<line x1="960.0" y1="416.5" x2="960.0" y2="500.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">клієнт починає з діалекту PX4; почувши UNSUPPORTED, падає на стандартну нумерацію,</text>
<text x="650.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">але нею адресуються лише мотори й серви — шасі, захвата й камери там немає</text>
</svg>