<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два місця реєстрації власної групи фактів</text>
<rect x="40.0" y="60.0" width="480.0" height="400.0" rx="10" fill="#eef4fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="280.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Правка Vehicle</text>
<text x="280.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Vehicle.h — член _winchFactGroup</text>
<text x="280.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Vehicle.h — Q_PROPERTY winch</text>
<text x="280.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Vehicle.h — рядок «winch» у полях імен</text>
<text x="280.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Vehicle.cc — new + _addFactGroup</text>
<text x="280.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">З екрана: _activeVehicle.winch.lineLength</text>
<text x="280.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ціна: чотири правки в чужих файлах,</text>
<text x="280.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">конфлікт при кожному оновленні апстриму</text>
<text x="280.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Доречно: повідомлення СПІЛЬНОГО набору,</text>
<text x="280.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">зміна піде в апстрим</text>
<rect x="620.0" y="60.0" width="480.0" height="400.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="860.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">FirmwarePlugin::factGroups()</text>
<text x="860.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">свій плагін прошивки повертає карту</text>
<text x="860.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">{ «winch» → примірник групи }</text>
<text x="860.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Vehicle сам покличе _addFactGroup</text>
<text x="860.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">у файлах апстриму — жодної правки</text>
<text x="860.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">З екрана: getFactGroup(«winch»)</text>
<text x="860.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ціна: Q_PROPERTY немає,</text>
<text x="860.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">звертання лише за іменем</text>
<text x="860.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Доречно: повідомлення свого діалекту,</text>
<text x="860.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">власна збірка</text>
<rect x="315.5" y="495.1" width="509.1" height="49.9" rx="6" fill="#fffbea" stroke="#b8860b" stroke-width="1.5"/><text x="570.0" y="516.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">У панелі значень група з'явиться однаково за обома шляхами:</tspan><tspan x="570.0" dy="16.9">список будується з factGroupNames(), а не з переліку в коді екрана</tspan></text>
