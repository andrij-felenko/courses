<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реєстрація тримається на об'єкті, на який ніхто не посилається</text>
<rect x="60.0" y="50.0" width="540.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">як фабрика потрапляє в реєстр</tspan></text>
<rect x="700.0" y="50.0" width="540.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">як вона звідти тихо зникає</tspan></text>
<rect x="60.0" y="132.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">custom/CMakeLists.txt</tspan><tspan x="330.0" dy="18.2">list(APPEND CUSTOM_SOURCES …)</tspan></text>
<rect x="700.0" y="132.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">add_library(sokil_plugin STATIC …)</tspan><tspan x="970.0" dy="18.2">target_link_libraries(… sokil_plugin)</tspan></text>
<line x1="330.0" y1="228.0" x2="330.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="228.0" x2="970.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="260.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="303.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">апстрим: target_sources(QGroundControl …)</tspan><tspan x="330.0" dy="18.2">файл компілюється просто в застосунок</tspan></text>
<rect x="700.0" y="260.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="303.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">архів об'єктних файлів — компонувальник</tspan><tspan x="970.0" dy="18.2">бере з нього тільки потрібні</tspan></text>
<line x1="330.0" y1="356.0" x2="330.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="356.0" x2="970.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="388.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="431.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">об'єктний код у виконуваному файлі</tspan><tspan x="330.0" dy="18.2">разом з ініціалізацією глобальних об'єктів</tspan></text>
<rect x="700.0" y="388.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="431.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">на SokilFirmwarePluginFactory_instance</tspan><tspan x="970.0" dy="18.2">не посилається жоден символ</tspan></text>
<line x1="330.0" y1="484.0" x2="330.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="484.0" x2="970.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="516.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="559.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">до main(): конструктор глобального об'єкта</tspan><tspan x="330.0" dy="18.2">вписує фабрику в реєстр</tspan></text>
<rect x="700.0" y="516.0" width="540.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="559.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">об'єктний файл у бінарник не потрапляє —</tspan><tspan x="970.0" dy="18.2">ані помилки, ані попередження</tspan></text>
<line x1="330.0" y1="612.0" x2="330.0" y2="644.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="612.0" x2="970.0" y2="644.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="644.0" width="540.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/><text x="330.0" y="683.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">апарат із autopilot = 21</tspan><tspan x="330.0" dy="19.5">дістає SokilFirmwarePlugin:</tspan><tspan x="330.0" dy="19.5">режими, вміння, дії</tspan></text>
<rect x="700.0" y="644.0" width="540.0" height="108.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="683.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">реєстр без нашої фабрики</tspan><tspan x="970.0" dy="19.5">апарат дістає загальний плагін:</tspan><tspan x="970.0" dy="19.5">сама телеметрія, кнопки мертві</tspan></text>
</svg>