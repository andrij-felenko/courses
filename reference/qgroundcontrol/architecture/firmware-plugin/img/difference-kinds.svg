<rect x="732.0" y="330.0" width="548.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1006.0" y="372.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1006.0" dy="0.0">команда прийнята, а зльоту немає,</tspan><tspan x="1006.0" dy="16.9">бо режим був не той</tspan></text>
