<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Згортання каналу: п'ять кроків у жорсткому порядку</text>
<text x="120.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">нитка</text>
<text x="490.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок згортання</text>
<text x="955.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">що станеться, якщо пропустити</text>
<rect x="40.0" y="66.0" width="160.0" height="62.0" rx="6" fill="#e8eef8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ГОЛОВНА</tspan></text>
<rect x="220.0" y="66.0" width="540.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">1 · invokeMethod(_worker, &quot;closeSocket&quot;,</tspan><tspan x="490.0" dy="15.6">Qt::BlockingQueuedConnection)</tspan></text>
<rect x="790.0" y="66.0" width="330.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="93.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">робітник читатиме сокет,</tspan><tspan x="955.0" dy="14.3">якого вже нема</tspan></text>
<line x1="490.0" y1="128.0" x2="490.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="150.0" width="160.0" height="62.0" rx="6" fill="#eef6ec" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">РОБІТНИК</tspan></text>
<rect x="220.0" y="150.0" width="540.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">2 · closeSocket(): socket-&gt;close(), delete socket</tspan><tspan x="490.0" dy="15.6">ресурс віддано там само, де відкритий</tspan></text>
<rect x="790.0" y="150.0" width="330.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">дескриптор лишається відкритим,</tspan><tspan x="955.0" dy="14.3">порт зайнято до кінця процесу</tspan></text>
<line x1="490.0" y1="212.0" x2="490.0" y2="234.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="234.0" width="160.0" height="62.0" rx="6" fill="#e8eef8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ГОЛОВНА</tspan></text>
<rect x="220.0" y="234.0" width="540.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">3 · _thread-&gt;quit() — цикл подій виходить з exec()</tspan></text>
<rect x="790.0" y="234.0" width="330.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">нитка крутиться далі,</tspan><tspan x="955.0" dy="14.3">а wait() ніколи не поверне true</tspan></text>
<line x1="490.0" y1="296.0" x2="490.0" y2="318.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="318.0" width="160.0" height="62.0" rx="6" fill="#eef6ec" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="353.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">РОБІТНИК</tspan></text>
<rect x="220.0" y="318.0" width="540.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="345.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">4 · finished → deleteLater(_worker):</tspan><tspan x="490.0" dy="15.6">об'єкт гине у своїй нитці</tspan></text>
<rect x="790.0" y="318.0" width="330.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="345.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">витік або знищення об'єкта</tspan><tspan x="955.0" dy="14.3">з чужої нитки</tspan></text>
<line x1="490.0" y1="380.0" x2="490.0" y2="402.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="402.0" width="160.0" height="62.0" rx="6" fill="#e8eef8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="437.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ГОЛОВНА</tspan></text>
<rect x="220.0" y="402.0" width="540.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="437.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">5 · _thread-&gt;wait(2000) — чекаємо на зупинку</tspan></text>
<rect x="790.0" y="402.0" width="330.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="429.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">знищення живого QThread —</tspan><tspan x="955.0" dy="14.3">гарантована аварія</tspan></text>
<rect x="40.0" y="494.0" width="1080.0" height="76.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="520.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Єдиний блокувальний перехід у всій схемі — крок 1, і тільки в бік робітника.</tspan><tspan x="580.0" dy="16.2">Якщо робітник у цю саму мить блокувально покличе головну нитку,</tspan><tspan x="580.0" dy="16.2">обидві чекатимуть одна одну назавжди.</tspan></text>
</svg>