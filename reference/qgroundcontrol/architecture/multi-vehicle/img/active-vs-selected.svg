<rect x="60.0" y="236.0" width="400.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">джойстик і ручне керування</tspan></text>
<rect x="60.0" y="302.0" width="400.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">панель параметрів</tspan></text>
<rect x="60.0" y="368.0" width="400.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">зліт, посадка, повернення додому</tspan></text>
<rect x="510.0" y="52.0" width="440.0" height="400.0" rx="10" fill="#fbfdff" stroke="#27ae60" stroke-width="1.6"/>
