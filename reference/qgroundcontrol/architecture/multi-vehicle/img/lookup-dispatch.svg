<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доставка через таблицю: три шляхи замість одного</text>
<rect x="60.0" y="44.0" width="420.0" height="48.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">розібране повідомлення: sysid · compid · msgid</tspan></text>
<rect x="60.0" y="110.0" width="420.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">sysid == 0 ?</tspan><tspan x="270.0" dy="16.9">джерело не назвало себе</tspan></text>
<line x1="488.0" y1="155.0" x2="552.0" y2="155.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="520.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">так</text>
<rect x="560.0" y="110.0" width="420.0" height="90.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">віддати ВСІМ об'єктам:</tspan><tspan x="770.0" dy="16.9">комірки [0] у таблиці немає,</tspan><tspan x="770.0" dy="16.9">наївний пошук губить пакет</tspan></text>
