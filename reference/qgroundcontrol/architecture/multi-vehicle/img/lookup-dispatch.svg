<rect x="560.0" y="390.0" width="420.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">рівно один об'єкт апарата;</tspan><tspan x="770.0" dy="16.9">порожня комірка — відкинути</tspan></text>
<rect x="60.0" y="500.0" width="920.0" height="84.0" rx="6" fill="#f7f7f9" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="537.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">другий рівень фільтра лишається В ОБОХ схемах:</tspan><tspan x="520.0" dy="18.2">усередині апарата compid != _defaultComponentId → вихід</tspan></text>
