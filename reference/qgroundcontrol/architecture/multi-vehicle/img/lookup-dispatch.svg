<rect x="60.0" y="250.0" width="420.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">msgid == RADIO_STATUS ?</tspan><tspan x="270.0" dy="16.9">і канал у списку цього апарата</tspan></text>
<line x1="488.0" y1="295.0" x2="552.0" y2="295.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
