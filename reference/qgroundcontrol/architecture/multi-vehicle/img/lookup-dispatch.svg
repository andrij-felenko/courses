<rect x="560.0" y="250.0" width="420.0" height="90.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">модем доповідає СВОЇМ номером</tspan><tspan x="770.0" dy="16.9">(у SiK це sysid 51, compid 68):</tspan><tspan x="770.0" dy="16.9">шукати за каналом, не за номером</tspan></text>
