<rect x="50.0" y="398.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="242.5" y="428.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">2 · V зникає зі списку selectedVehicles</tspan></text>
<rect x="50.0" y="458.0" width="385.0" height="60.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="242.5" y="484.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">3 · activeVehicleAvailableChanged(false)</tspan><tspan x="242.5" dy="15.6">parameterReadyVehicleAvailableChanged(false)</tspan></text>
<rect x="50.0" y="526.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="242.5" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">4 · vehicleRemoved(V) — V ще живий</tspan></text>
<rect x="585.0" y="338.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">5 · activeVehicleChanged(vehicles[0] або nullptr)</tspan></text>
<rect x="585.0" y="398.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="428.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">6 · availability знову true, якщо активний є</tspan></text>
<rect x="585.0" y="458.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="488.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">7 · V-&gt;deleteLater()</tspan></text>
<rect x="585.0" y="518.0" width="385.0" height="60.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="777.5" y="544.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="777.5" dy="0.0">від цієї миті кожен збережений Vehicle*</tspan><tspan x="777.5" dy="15.6">на V стає висячим</tspan></text>
<text x="510.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">прапорці доступності падають у фазі 1 незалежно від того, чи зникає саме активний апарат</text>
