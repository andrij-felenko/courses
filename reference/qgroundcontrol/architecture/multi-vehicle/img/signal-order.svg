<rect x="50.0" y="160.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="242.5" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">2 · parameterReadyVehicleAvailableChanged(false)</tspan></text>
<rect x="50.0" y="220.0" width="385.0" height="56.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="242.5" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="242.5" dy="0.0">activeVehicle досі вказує на A —</tspan><tspan x="242.5" dy="15.6">сама властивість ще не змінилася</tspan></text>
<rect x="585.0" y="100.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">3 · activeVehicleChanged(B)</tspan></text>
<rect x="585.0" y="160.0" width="385.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">4 · activeVehicleAvailableChanged(true)</tspan></text>
<rect x="585.0" y="220.0" width="385.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="777.5" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">5 · parameterReadyVehicleAvailableChanged(true)</tspan><tspan x="777.5" dy="15.6">лише якщо параметри B уже завантажені</tspan></text>
<text x="50.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">② Видалення апарата V (за сигналом allLinksRemoved)</text>
<rect x="455.0" y="334.0" width="110.0" height="248.0" rx="10" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/>
<text x="510.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">+20 мс</tspan><tspan x="510.0" dy="15.6">оберт</tspan><tspan x="510.0" dy="15.6">циклу подій</tspan></text>
