<text x="510.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">+20 мс</tspan><tspan x="510.0" dy="15.6">оберт</tspan><tspan x="510.0" dy="15.6">циклу подій</tspan></text>
