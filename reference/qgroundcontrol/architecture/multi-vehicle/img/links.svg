<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один апарат, кілька каналів</text>
<rect x="50.0" y="66.0" width="320.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="99.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">USB напряму</tspan><tspan x="210.0" dy="16.9">тиша 0.2 с — живий</tspan></text>
