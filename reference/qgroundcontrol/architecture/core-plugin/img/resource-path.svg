<rect x="100.0" y="52.0" width="1000.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">екран просить ресурс за звичайною адресою</tspan><tspan x="600.0" dy="19.5">qrc:/qml/QGroundControl/FlyView/FlyViewCustomLayer.qml</tspan></text>
