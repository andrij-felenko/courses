<text x="830.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">ні</text>
<rect x="60.0" y="424.0" width="520.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="465.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">у custom.qrc є псевдонім із цим самим іменем —</tspan><tspan x="320.0" dy="18.2">віддаємо власну копію, апстримовий файл</tspan><tspan x="320.0" dy="18.2">лишається в бінарнику незайманим</tspan></text>
<rect x="620.0" y="424.0" width="520.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="465.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">власної копії немає —</tspan><tspan x="880.0" dy="18.2">віддаємо адресу без змін,</tspan><tspan x="880.0" dy="18.2">завантажиться стандартний екран</tspan></text>
