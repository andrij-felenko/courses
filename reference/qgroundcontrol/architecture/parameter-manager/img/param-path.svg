<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від байтів у каналі до числа з одиницями на екрані</text>
<rect x="26.0" y="96.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="116.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="116.0" dy="0.0">Канал</tspan><tspan x="116.0" dy="19.5">байти в ефірі</tspan></text>
<text x="116.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="116.0" dy="0.0">серійний порт,</tspan><tspan x="116.0" dy="15.6">UDP, TCP</tspan></text>
<line x1="212.0" y1="144.0" x2="242.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="248.0" y="96.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="338.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="338.0" dy="0.0">Розбір MAVLink</tspan><tspan x="338.0" dy="16.9">кадр → повідомлення</tspan></text>
<text x="338.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="338.0" dy="0.0">PARAM_VALUE:</tspan><tspan x="338.0" dy="15.6">ім'я, значення,</tspan><tspan x="338.0" dy="15.6">тип, номер, усього</tspan></text>
<line x1="434.0" y1="144.0" x2="464.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="96.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Розширення</tspan><tspan x="560.0" dy="19.5">прошивки</tspan></text>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">зводить діалект</tspan><tspan x="560.0" dy="15.6">борту до одного:</tspan><tspan x="560.0" dy="15.6">байтове подання</tspan></text>
<line x1="656.0" y1="144.0" x2="686.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="692.0" y="96.0" width="180.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="782.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="782.0" dy="0.0">Менеджер</tspan><tspan x="782.0" dy="19.5">параметрів</tspan></text>
<text x="782.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="782.0" dy="0.0">карта:</tspan><tspan x="782.0" dy="15.6">компонент → ім'я</tspan><tspan x="782.0" dy="15.6">→ факт</tspan></text>
<line x1="878.0" y1="144.0" x2="908.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="914.0" y="96.0" width="180.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1004.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1004.0" dy="0.0">Факт + метадані</tspan><tspan x="1004.0" dy="19.5">на екрані</tspan></text>
<text x="1004.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1004.0" dy="0.0">одиниці, межі,</tspan><tspan x="1004.0" dy="15.6">перелік варіантів,</tspan><tspan x="1004.0" dy="15.6">опис</tspan></text>
<line x1="560.0" y1="256.0" x2="560.0" y2="286.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="294.4" y="281.1" width="531.3" height="49.9" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="302.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">PX4 передає ціле побайтово, ArduPilot — числовим перетворенням.</tspan><tspan x="560.0" dy="16.9">Менеджер бачить лише одну домовленість — розбіжність гасять до нього.</tspan></text>
</svg>