<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сорок дір, три способи їх добрати: чому пачка виграє в обох сусідів</text>
<text x="30.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Усе одразу</text>
<text x="30.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">сорок запитів у ту саму</tspan><tspan x="30.0" dy="15.6">мить, у той самий канал</tspan></text>
<text x="30.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">По одному</text>
<text x="30.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">наступний запит — тільки</tspan><tspan x="30.0" dy="15.6">після відповіді</tspan></text>
<text x="30.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Пачка ≤ 10</text>
<text x="30.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">десять у польоті завжди,</tspan><tspan x="30.0" dy="15.6">звільнилось — беремо ще</tspan></text>
<rect x="340.0" y="110.0" width="18.0" height="52.0" rx="6" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.6"/>
<rect x="490.0" y="110.0" width="18.0" height="52.0" rx="6" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.6"/>
<rect x="640.0" y="110.0" width="18.0" height="52.0" rx="6" fill="#f5b7b1" stroke="#c0392b" stroke-width="1.6"/>
<rect x="690.0" y="110.0" width="350.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">усі 40 дедлайнів спливають разом —</tspan><tspan x="865.0" dy="16.9">залп повторюється цілком</tspan></text>
<line x1="1048.0" y1="136.0" x2="1102.0" y2="136.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">у каналі немає нічого, крім наших запитів: відповідям нема коли пройти</text>
