<rect x="740.0" y="260.0" width="14.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<line x1="754.0" y1="276.0" x2="840.0" y2="276.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,5"/>
<rect x="840.0" y="260.0" width="14.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="864.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">… ще 35 кроків — разом 40 RTT</text>
<text x="340.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">запит → відповідь → наступний запит: затримки складаються</text>
<rect x="344.0" y="390.0" width="92.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">діри 1–10</tspan></text>
<rect x="444.0" y="390.0" width="92.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">11–20</tspan></text>
