<text x="1040.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
<text x="30.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час, у затримках туди-назад</text>
<rect x="35.4" y="541.0" width="1109.3" height="49.9" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="562.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">40 дір, затримка туди-назад 0.4 с:</tspan><tspan x="590.0" dy="16.9">по одному — 40 · 0.4 = 16 с   ·   пачкою по 10 — ⌈40/10⌉ · 0.4 = 1.6 с   ·   усе одразу — 0.4 с на ідеальному каналі й лавина повторів на реальному</tspan></text>
