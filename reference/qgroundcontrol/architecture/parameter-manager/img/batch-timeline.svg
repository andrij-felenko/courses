<rect x="644.0" y="390.0" width="92.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">31–40</tspan></text>
