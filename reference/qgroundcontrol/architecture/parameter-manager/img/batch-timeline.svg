<text x="740.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
<line x1="840.0" y1="490.0" x2="840.0" y2="498.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="840.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
