<rect x="56.0" y="76.0" width="318.0" height="44.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="215.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">СТАН СТАНЦІЇ</tspan></text>
<rect x="56.0" y="122.0" width="318.0" height="30.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="215.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="215.0" dy="0.0">власник — сама станція</tspan></text>
<line x1="60.0" y1="162.0" x2="370.0" y2="162.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="66.0" y="186.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">одиниці й мова</tspan></text>
<rect x="66.0" y="230.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">тека збереження</tspan></text>
<rect x="66.0" y="274.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">ключі до карт</tspan></text>
<rect x="66.0" y="318.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">перелік каналів</tspan></text>
<rect x="66.0" y="362.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">гучність попереджень</tspan></text>
<line x1="60.0" y1="412.0" x2="370.0" y2="412.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="66.0" y="428.0" width="298.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ФАЙЛ НАЛАШТУВАНЬ</tspan></text>
<text x="66.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">читається як істина</text>
<text x="66.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">іншого джерела немає</text>
<text x="66.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">втрата = кілька хвилин</text>
<text x="66.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перенастроювання</text>
<rect x="415.0" y="60.0" width="350.0" height="560.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<rect x="431.0" y="76.0" width="318.0" height="44.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="590.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КОПІЯ СТАНУ АПАРАТА</tspan></text>
<rect x="431.0" y="122.0" width="318.0" height="30.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="590.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">власник — апарат</tspan></text>
<line x1="435.0" y1="162.0" x2="745.0" y2="162.0" stroke="#2457d6" stroke-width="1.2"/>
<rect x="441.0" y="186.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">параметри автопілота</tspan></text>
<rect x="441.0" y="230.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">місія на борту</tspan></text>
<rect x="441.0" y="274.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">геозона</tspan></text>
<rect x="441.0" y="318.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">опис компонентів</tspan></text>
<rect x="441.0" y="362.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">набір режимів</tspan></text>
<line x1="435.0" y1="412.0" x2="745.0" y2="412.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="441.0" y="428.0" width="298.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">КЕШ ІЗ ПЕРЕВІРКОЮ</tspan></text>
<text x="441.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перед ужитком звіряємо</text>
<text x="441.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">контрольну суму з апаратом</text>
<text x="441.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">не збіглося — тягнемо заново</text>
<text x="441.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">втрата = зайвий час</text>
<rect x="790.0" y="60.0" width="350.0" height="560.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<rect x="806.0" y="76.0" width="318.0" height="44.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="965.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">СТАН СЕАНСУ</tspan></text>
<rect x="806.0" y="122.0" width="318.0" height="30.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="965.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="965.0" dy="0.0">власника після вимкнення немає</tspan></text>
<line x1="810.0" y1="162.0" x2="1120.0" y2="162.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="816.0" y="186.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">координати й висота</tspan></text>
<rect x="816.0" y="230.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">режим польоту</tspan></text>
<rect x="816.0" y="274.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">заряд батареї</tspan></text>
<rect x="816.0" y="318.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">факт під'єднаності</tspan></text>
<rect x="816.0" y="362.0" width="298.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">швидкість каналу</tspan></text>
<line x1="810.0" y1="412.0" x2="1120.0" y2="412.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="816.0" y="428.0" width="298.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="965.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">НЕ ЗБЕРІГАЄТЬСЯ НІДЕ</tspan></text>
<text x="816.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">описує подію, якої вже немає</text>
<text x="816.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">збережене було б хибним</text>
<text x="816.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">із першої ж секунди</text>
<text x="816.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">будується з нуля щоразу</text>
<text x="590.0" y="660.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">критерій поділу: чия копія вважається правдою, коли дві копії розійшлися</text>
