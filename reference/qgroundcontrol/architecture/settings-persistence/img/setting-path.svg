<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки факт налаштування бере значення і куди його віддає</text>
<rect x="50.4" y="88.8" width="319.3" height="82.4" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">JSON-МЕТАДАНІ (ресурс у застосунку)</tspan><tspan x="210.0" dy="18.2">тип · межі · одиниці · підпис · опис</tspan><tspan x="210.0" dy="18.2">ТИПОВЕ ЗНАЧЕННЯ</tspan></text>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">незмінне, однакове в усіх копіях застосунку</text>
<rect x="70.3" y="358.8" width="279.4" height="82.4" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="210.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ФАЙЛ НАЛАШТУВАНЬ НА ДИСКУ</tspan><tspan x="210.0" dy="18.2">лише ключі, яких хтось торкався</tspan><tspan x="210.0" dy="18.2">ПЕРЕКРИТТЯ ЗНАЧЕННЯ</tspan></text>
<text x="210.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">немає ключа — діє типове значення</text>
<rect x="448.9" y="92.6" width="302.2" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ЯДРОВЕ РОЗШИРЕННЯ</tspan><tspan x="600.0" dy="16.9">править метадані до народження факту:</tspan><tspan x="600.0" dy="16.9">інше типове · сховати налаштування</tspan></text>
<rect x="500.2" y="349.7" width="199.6" height="100.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/><text x="600.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">SettingsFact</tspan><tspan x="600.0" dy="18.2">значення + метадані</tspan><tspan x="600.0" dy="18.2">читає при народженні</tspan><tspan x="600.0" dy="18.2">пише при кожній зміні</tspan></text>
<rect x="893.2" y="302.6" width="183.6" height="74.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="985.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">ІНТЕРФЕЙС</tspan><tspan x="985.0" dy="16.9">редактор із підписом,</tspan><tspan x="985.0" dy="16.9">межами й одиницями</tspan></text>
<rect x="908.0" y="432.6" width="154.0" height="74.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="985.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">КОД ПІДСИСТЕМ</tspan><tspan x="985.0" dy="16.9">читає значення</tspan><tspan x="985.0" dy="16.9">як звичайний факт</tspan></text>
<line x1="210.0" y1="171.2" x2="210.0" y2="354.8" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="369.6" y1="130.0" x2="444.9" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="167.4" x2="600.0" y2="345.7" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="349.7" y1="400.0" x2="496.2" y2="400.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="699.8" y1="385.0" x2="889.2" y2="350.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="699.8" y1="415.0" x2="904.0" y2="460.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тільки для ключів,</text>
<text x="310.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">що є у файлі</text>
<text x="405.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">метадані</text>
<text x="405.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">значення</text>
<text x="628.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">сховане налаштування</text>
<text x="628.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">бере типове, диск не читає</text>
<line x1="496.2" y1="435.0" x2="349.7" y2="435.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="405.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">запис на кожну зміну</text>
<text x="590.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">окремої дії «зберегти» немає: зміна значення одразу лягає на диск</text>
</svg>