<rect x="550.0" y="178.0" width="400.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">канал відтворення замість радіо</tspan></text>
<line x1="250.0" y1="248.0" x2="250.0" y2="274.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="248.0" x2="750.0" y2="274.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="278.0" width="400.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">словник полів у пам'яті станції</tspan></text>
<rect x="550.0" y="278.0" width="400.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">звичайний шлях: розбір → Vehicle → факти</tspan></text>
<line x1="250.0" y1="348.0" x2="250.0" y2="374.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="348.0" x2="750.0" y2="374.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="378.0" width="400.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">графік, карта, параметри, повідомлення</tspan></text>
<rect x="550.0" y="378.0" width="400.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">інспектор MAVLink малює ті самі поля</tspan></text>
<rect x="250.6" y="480.8" width="498.8" height="54.5" rx="6" fill="#eaf4ee" stroke="#27ae60" stroke-width="2.0"/><text x="500.0" y="503.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">дороги різні, бо .tlog — це кадри протоколу,</tspan><tspan x="500.0" dy="19.5">які застосунок уже вміє тлумачити без окремого розбирача</tspan></text>
