<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два види файлів — дві різні дороги до графіка</text>
<rect x="50.0" y="78.0" width="400.0" height="66.0" rx="6" fill="#eef2f9" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">.ulg або .bin — бортовий файл</tspan></text>
<rect x="550.0" y="78.0" width="400.0" height="66.0" rx="6" fill="#eef2f9" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">.tlog — файл телеметрії станції</tspan></text>
<line x1="250.0" y1="148.0" x2="250.0" y2="174.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="148.0" x2="750.0" y2="174.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
