<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві лінії, якими не передають даних, — і дві різні долі плати</text>
<rect x="60.0" y="66.0" width="1120.0" height="244.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="90.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">міст із справжніми виводами</text>
<rect x="80.0" y="112.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">застосунок</tspan><tspan x="180.0" dy="15.0">відкриває порт</tspan></text>
<line x1="180.0" y1="210.0" x2="180.0" y2="264.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="180.0" cy="272.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="300.0" y="112.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">лінія DTR переходить</tspan><tspan x="400.0" dy="15.0">у стверджений стан</tspan></text>
<line x1="400.0" y1="210.0" x2="400.0" y2="264.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="272.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="520.0" y="112.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">конденсатор пропускає</tspan><tspan x="620.0" dy="15.0">тільки фронт: короткий</tspan><tspan x="620.0" dy="15.0">імпульс на вхід скидання</tspan></text>
<line x1="620.0" y1="210.0" x2="620.0" y2="264.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="620.0" cy="272.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="740.0" y="112.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">плата перезавантажується</tspan><tspan x="840.0" dy="15.0">і стартує з завантажувача</tspan></text>
<line x1="840.0" y1="210.0" x2="840.0" y2="264.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="840.0" cy="272.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="960.0" y="112.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">прошивка оживає,</tspan><tspan x="1060.0" dy="15.0">перші байти йдуть</tspan><tspan x="1060.0" dy="15.0">із затримкою</tspan></text>
<line x1="1060.0" y1="210.0" x2="1060.0" y2="264.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="1060.0" cy="272.0" r="5.0" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<line x1="80.0" y1="272.0" x2="1160.0" y2="272.0" stroke="#333333" stroke-width="2.0"/>
<text x="620.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">порт лише відкрили — а весь стан плати вже скинуто</text>
<rect x="60.0" y="330.0" width="1120.0" height="210.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="90.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">вбудований USB: цих виводів фізично немає</text>
<rect x="80.0" y="378.0" width="300.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="436.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">DTR і RTS доходять</tspan><tspan x="230.0" dy="15.6">до плати як керуючий</tspan><tspan x="230.0" dy="15.6">запит — і тільки</tspan></text>
<line x1="384.0" y1="420.0" x2="474.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="384.0" y1="474.0" x2="474.0" y2="484.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="478.0" y="378.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="648.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">прошивка запит ігнорує</tspan></text>
<rect x="478.0" y="452.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="648.0" y="481.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">прошивка тлумачить умовне число</tspan><tspan x="648.0" dy="15.0">швидкості як «іди в завантажувач»</tspan></text>
<line x1="822.0" y1="411.0" x2="854.0" y2="411.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="822.0" y1="485.0" x2="854.0" y2="485.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="858.0" y="378.0" width="300.0" height="66.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1008.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1008.0" dy="0.0">відкриття порту безпечне</tspan></text>
<rect x="858.0" y="452.0" width="300.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1008.0" y="489.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1008.0" dy="0.0">плата пішла в завантажувач</tspan></text>
</svg>