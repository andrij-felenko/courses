<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди діваються байти, коли серійний вхід швидший за ефір</text>
<rect x="50.0" y="66.0" width="560.0" height="430.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="330.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">без апаратного керування потоком</text>
<rect x="80.0" y="112.0" width="500.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">у модуль ллється 5760 байтів/с</tspan></text>
<line x1="330.0" y1="174.0" x2="330.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="202.0" width="500.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">ефір виносить у рази менше — буфер повний</tspan></text>
<line x1="330.0" y1="264.0" x2="330.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="292.0" width="500.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">зайві байти зникають мовчки</tspan></text>
<line x1="330.0" y1="354.0" x2="330.0" y2="378.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="382.0" width="500.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">нагорі: биті контрольні суми й дірки</tspan><tspan x="330.0" dy="15.6">в номерах — схоже на «поганий зв'язок»,</tspan><tspan x="330.0" dy="15.6">хоча антена й потужність ні до чого</tspan></text>
<rect x="610.0" y="66.0" width="560.0" height="430.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="890.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">з апаратним керуванням потоком</text>
<rect x="640.0" y="112.0" width="500.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">буфер модуля заповнився до порога</tspan></text>
<line x1="890.0" y1="174.0" x2="890.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="202.0" width="500.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">модуль знімає готовність на своєму виводі</tspan></text>
<line x1="890.0" y1="264.0" x2="890.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="292.0" width="500.0" height="58.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">передавач зупиняється між кадрами</tspan></text>
<line x1="890.0" y1="354.0" x2="890.0" y2="378.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="382.0" width="500.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">байти не губляться, лише чекають;</tspan><tspan x="890.0" dy="15.6">але якщо дріт заведено з одного боку,</tspan><tspan x="890.0" dy="15.6">чекання стає вічним і не піде жоден байт</tspan></text>
</svg>