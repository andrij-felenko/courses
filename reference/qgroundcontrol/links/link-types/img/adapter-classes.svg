<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три конструкції одного й того самого перекладача з USB на UART</text>
<rect x="30.0" y="70.0" width="1260.0" height="200.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="50.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">вбудований USB</text>
<text x="50.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">плата говорить по USB сама</text>
<rect x="260.0" y="125.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">мікроконтролер:</tspan><tspan x="360.0" dy="15.6">USB-периферія</tspan><tspan x="360.0" dy="15.6">всередині нього</tspan></text>
<line x1="464.0" y1="170.0" x2="504.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="484.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">USB</text>
<rect x="510.0" y="125.0" width="210.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">драйвер класу —</tspan><tspan x="615.0" dy="15.6">один на всі</tspan><tspan x="615.0" dy="15.6">такі пристрої</tspan></text>
<line x1="724.0" y1="170.0" x2="764.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="125.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">вузол з іменем</tspan><tspan x="870.0" dy="15.6">за класом:</tspan><tspan x="870.0" dy="15.6">ttyACM, usbmodem</tspan></text>
<rect x="1000.0" y="118.0" width="270.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1135.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1135.0" dy="0.0">число швидкості нікуди</tspan><tspan x="1135.0" dy="15.0">не доходить: справжнього</tspan><tspan x="1135.0" dy="15.0">UART за портом немає</tspan></text>
<rect x="30.0" y="300.0" width="1260.0" height="200.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="50.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">окремий міст</text>
<text x="50.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">мікросхема поруч із МК</text>
<rect x="250.0" y="355.0" width="160.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">мікроконтролер</tspan></text>
<line x1="414.0" y1="400.0" x2="446.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UART</text>
<rect x="450.0" y="355.0" width="160.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">мікросхема-міст</tspan><tspan x="530.0" dy="15.6">USB↔UART</tspan></text>
<line x1="614.0" y1="400.0" x2="646.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">USB</text>
<rect x="650.0" y="355.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">драйвер під саме</tspan><tspan x="745.0" dy="15.6">цю модель мосту</tspan></text>
<line x1="844.0" y1="400.0" x2="876.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="880.0" y="355.0" width="170.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">вузол ttyUSB,</tspan><tspan x="965.0" dy="15.6">usbserial</tspan></text>
<rect x="1070.0" y="348.0" width="200.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1170.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">число швидкості</tspan><tspan x="1170.0" dy="15.0">програмує дільник —</tspan><tspan x="1170.0" dy="15.0">мусить збігатися</tspan></text>
<rect x="30.0" y="530.0" width="1260.0" height="200.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="50.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">радіомодуль</text>
<text x="50.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">міст і радіо в одному</text>
<text x="50.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">корпусі</text>
<rect x="250.0" y="585.0" width="130.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="626.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">контролер</tspan><tspan x="315.0" dy="15.0">борту</tspan></text>
<line x1="384.0" y1="630.0" x2="408.0" y2="630.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="396.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">UART</text>
<rect x="412.0" y="585.0" width="120.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="472.0" y="626.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">радіо</tspan><tspan x="472.0" dy="15.0">борту</tspan></text>
<line x1="536.0" y1="630.0" x2="594.0" y2="630.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="565.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ефір</text>
<rect x="598.0" y="585.0" width="120.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="658.0" y="626.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">радіо</tspan><tspan x="658.0" dy="15.0">землі</tspan></text>
<line x1="722.0" y1="630.0" x2="750.0" y2="630.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="754.0" y="585.0" width="190.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="849.0" y="626.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="849.0" dy="0.0">міст USB↔UART</tspan><tspan x="849.0" dy="15.0">у тому ж корпусі</tspan></text>
<line x1="948.0" y1="630.0" x2="976.0" y2="630.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="585.0" width="160.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">вузол ttyUSB</tspan></text>
<rect x="1160.0" y="578.0" width="115.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1217.5" y="619.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1217.5" dy="0.0">швидкість —</tspan><tspan x="1217.5" dy="14.3">мосту,</tspan><tspan x="1217.5" dy="14.3">а не борту</tspan></text>
<text x="660.0" y="766.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">функція в усіх трьох однакова; різняться драйвер, ім'я вузла й те, чи означає щось число швидкості</text>
</svg>