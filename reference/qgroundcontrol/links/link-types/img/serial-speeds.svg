<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Серійний шлях: три різні швидкості, і в діалозі станції задають лише одну</text>
<rect x="40.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#ffffff" stroke="#98a6b4" stroke-width="1.6"/>
<text x="140.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">польотний</tspan><tspan x="140.0" dy="16.9">контролер</tspan></text>
<text x="140.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UART на платі</text>
<rect x="300.0" y="150.0" width="190.0" height="96.0" rx="10" fill="#ffffff" stroke="#98a6b4" stroke-width="1.6"/>
<text x="395.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">радіомодуль</tspan><tspan x="395.0" dy="16.9">на борту</tspan></text>
<text x="395.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">серійний бік</text>
<rect x="560.0" y="150.0" width="190.0" height="96.0" rx="10" fill="#ffffff" stroke="#98a6b4" stroke-width="1.6"/>
<text x="655.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">радіомодуль</tspan><tspan x="655.0" dy="16.9">на столі</tspan></text>
<text x="655.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">серійний бік</text>
<rect x="820.0" y="150.0" width="200.0" height="96.0" rx="10" fill="#ffffff" stroke="#98a6b4" stroke-width="1.6"/>
<text x="920.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">міст USB↔UART</tspan><tspan x="920.0" dy="16.9">у тому ж корпусі</tspan></text>
<text x="920.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перетворювач</text>
<rect x="1080.0" y="150.0" width="180.0" height="96.0" rx="10" fill="#ffffff" stroke="#98a6b4" stroke-width="1.6"/>
<text x="1170.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">вузол пристрою</tspan><tspan x="1170.0" dy="16.9">в системі</tspan></text>
<text x="1170.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">COM7, ttyUSB0</text>
<line x1="240.0" y1="198.0" x2="300.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="198.0" x2="820.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="198.0" x2="1080.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="198.0" x2="560.0" y2="198.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="525.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">ефір</text>
<rect x="40.0" y="330.0" width="450.0" height="108.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="265.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">швидкість №1: UART борту</text>
<text x="265.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">її узгоджують прошивка й радіомодуль;</tspan><tspan x="265.0" dy="15.0">станція про неї нічого не знає</tspan></text>
<rect x="520.0" y="330.0" width="380.0" height="108.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="710.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">швидкість №2: темп ефіру</text>
<text x="710.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">задана в самому радіомодулі;</tspan><tspan x="710.0" dy="15.0">вона й обмежує реальний потік</tspan></text>
<rect x="930.0" y="330.0" width="330.0" height="108.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="1095.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">швидкість №3: та, що в діалозі</text>
<text x="1095.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">стосується ЛИШЕ останнього стрибка:</tspan><tspan x="1095.0" dy="15.0">міст USB↔UART ↔ застосунок</tspan></text>
<line x1="140.0" y1="246.0" x2="140.0" y2="330.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="655.0" y1="246.0" x2="655.0" y2="330.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="1095.0" y1="246.0" x2="1095.0" y2="330.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="40.0" y="490.0" width="560.0" height="108.0" rx="10" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="320.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">пряме USB до плати</text>
<text x="320.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">плата показує себе як віртуальний серійний порт;</tspan><tspan x="320.0" dy="15.0">число в полі швидкості нічого не змінює</tspan></text>
<rect x="660.0" y="490.0" width="600.0" height="108.0" rx="10" fill="#eef2f6" stroke="#98a6b4" stroke-width="1.6"/>
<text x="960.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">не збігається швидкість №3</text>
<text x="960.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">помилки не буде: у порту немає рукостискання —</tspan><tspan x="960.0" dy="15.0">просто на вхід посиплеться сміття, і серцебиття не з'явиться</tspan></text>
</svg>