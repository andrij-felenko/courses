<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рішення ухвалюють окремо для КОЖНОГО вихідного каналу</text>
<rect x="70.0" y="80.0" width="620.0" height="78.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">це той самий канал, звідки кадр прийшов?</tspan></text>
<rect x="830.0" y="91.0" width="400.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1030.0" y="115.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">ВИКИНУТИ</tspan><tspan x="1030.0" dy="16.9">назад у той самий дріт — ніколи</tspan></text>
<line x1="690.0" y1="119.0" x2="830.0" y2="119.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
