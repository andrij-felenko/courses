<rect x="660.0" y="538.0" width="500.0" height="62.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.1"/><text x="910.0" y="565.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">виняток — RADIO_STATUS зі свого каналу:</tspan><tspan x="910.0" dy="15.6">модем має власний sysid, а доповідає про канал</tspan></text>
