<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">номер каналу передають новому орендарю разом зі станом</text>
<rect x="45.0" y="80.0" width="450.0" height="460.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="270.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">mavlink_status_t каналу №3</text>
<rect x="65.0" y="140.0" width="410.0" height="54.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">parse_state</tspan><tspan x="270.0" dy="16.9">де ми посеред пакета</tspan></text>
<rect x="65.0" y="202.0" width="410.0" height="54.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="225.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">flags</tspan><tspan x="270.0" dy="16.9">версія протоколу на вихід і на вхід</tspan></text>
<rect x="65.0" y="264.0" width="410.0" height="54.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">signing</tspan><tspan x="270.0" dy="16.9">вказівник на ключ підпису</tspan></text>
<rect x="65.0" y="326.0" width="410.0" height="54.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">signing_streams</tspan><tspan x="270.0" dy="16.9">вказівник на таблицю потоків</tspan></text>
<rect x="65.0" y="388.0" width="410.0" height="54.0" rx="6" fill="#fdf4f3" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">current_rx_seq / current_tx_seq</tspan><tspan x="270.0" dy="16.9">наскрізні номери пакетів</tspan></text>
<rect x="65.0" y="450.0" width="410.0" height="54.0" rx="6" fill="#fdf4f3" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="473.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">packet_rx_success_count / drop_count</tspan><tspan x="270.0" dy="16.9">лічильники втрат</tspan></text>
<rect x="545.0" y="116.0" width="525.0" height="104.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="807.5" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="807.5" dy="0.0">mavlink_reset_channel_status(3)</tspan><tspan x="807.5" dy="19.5">скидає РІВНО одне поле: parse_state</tspan></text>
<rect x="545.0" y="268.0" width="525.0" height="150.0" rx="6" fill="#f2f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="807.5" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="807.5" dy="0.0">решту версії й підпису доводять руками:</tspan><tspan x="807.5" dy="18.2">flags — виставити потрібну версію протоколу</tspan><tspan x="807.5" dy="18.2">signing = nullptr, signing_streams = nullptr</tspan><tspan x="807.5" dy="18.2">інакше новий орендар підпише чужим ключем</tspan></text>
<rect x="545.0" y="452.0" width="525.0" height="104.0" rx="6" fill="#fdf4f3" stroke="#c0392b" stroke-width="1.5"/><text x="807.5" y="499.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="807.5" dy="0.0">а лічильники не чистить ніхто —</tspan><tspan x="807.5" dy="19.5">новий орендар успадковує чужу статистику</tspan></text>
<line x1="480.0" y1="167.0" x2="540.0" y2="168.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="229.0" x2="540.0" y2="300.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="291.0" x2="540.0" y2="330.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="353.0" x2="540.0" y2="360.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="415.0" x2="540.0" y2="480.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="477.0" x2="540.0" y2="520.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">назва функції обіцяє повне очищення — насправді вона забуває лише позицію в потоці</text>
<text x="560.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">тому видача каналу — це не «дати число», а «дати число й прибрати за попереднім»</text>
</svg>