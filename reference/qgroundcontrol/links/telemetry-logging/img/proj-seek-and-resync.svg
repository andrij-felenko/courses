<text x="637.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">запис = 8 Б часу + кадр; ширина запису різна, бо різна довжина кадру</text>
<text x="180.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">що бачить автомат, почавши з цієї позиції</text>
<rect x="180.0" y="248.0" width="300.0" height="64.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="275.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">хвіст чужого кадру</tspan><tspan x="330.0" dy="18.2">для автомата — сміття</tspan></text>
<rect x="486.0" y="248.0" width="340.0" height="64.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="275.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">0xFD усередині даних</tspan><tspan x="656.0" dy="18.2">кадр зібрано, сума не зійшлася</tspan></text>
<rect x="832.0" y="248.0" width="308.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="986.0" y="275.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="986.0" dy="0.0">0xFD справжній</tspan><tspan x="986.0" dy="18.2">сума зійшлася — межа</tspan></text>
<text x="180.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">хибний старт коштує щонайбільше одного кадру: байти, які автомат забрав, назад не вертаються</text>
<rect x="180.0" y="358.0" width="960.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="386.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ДЕ ПОЧИНАЄТЬСЯ ЗНАЙДЕНИЙ ЗАПИС</tspan><tspan x="660.0" dy="19.5">позиція після кадру − mavlink_msg_get_send_buffer_length(&amp;msg) = початок кадру</tspan><tspan x="660.0" dy="19.5">початок кадру − 8 = початок запису, тобто його мітка часу</tspan></text>
<text x="80.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Б. Індекс «час → зсув», зібраний під час відкриття</text>
<rect x="140.0" y="516.0" width="240.0" height="38.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.4"/>
<text x="260.0" y="541.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">час у лозі</text>
<rect x="380.0" y="516.0" width="240.0" height="38.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.4"/>
<text x="500.0" y="541.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">зсув запису, Б</text>
