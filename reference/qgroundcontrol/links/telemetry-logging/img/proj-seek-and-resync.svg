<rect x="720.0" y="642.0" width="520.0" height="84.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="670.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">зсув із таблиці — СПРАВЖНЯ межа запису:</tspan><tspan x="980.0" dy="18.2">ресинхронізувати нема чого,</tspan><tspan x="980.0" dy="18.2">далі просто читаємо вперед до цілі</tspan></text>
<rect x="90.0" y="782.0" width="560.0" height="110.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="814.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">БЕЗ ІНДЕКСУ</tspan><tspan x="370.0" dy="18.2">позиція за часткою байтів — влучання приблизне:</tspan><tspan x="370.0" dy="18.2">щільна ділянка займає більше байтів за секунду,</tspan><tspan x="370.0" dy="18.2">і повзунок над нею повзе повільніше</tspan></text>
<rect x="690.0" y="782.0" width="560.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="814.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">З ІНДЕКСОМ</tspan><tspan x="970.0" dy="18.2">пошук O(log m), влучання точне</tspan><tspan x="970.0" dy="18.2">крок 1 с → 57 КБ на годину логу</tspan><tspan x="970.0" dy="18.2">дочитування — не більше як 6.4 КБ</tspan></text>
