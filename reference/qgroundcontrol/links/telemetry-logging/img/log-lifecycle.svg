<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="860" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя файлу телеметрії: тимчасовий із першої ж миті</text>
<rect x="40.0" y="80.0" width="600.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">перший HEARTBEAT або HIGH_LATENCY у каналі</tspan></text>
<line x1="340.0" y1="150.0" x2="340.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="196.0" width="600.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">відкрито тимчасовий файл у системній теці tmp:</tspan><tspan x="340.0" dy="19.5">FlightDataXXXXXX.mavlink</tspan></text>
<line x1="340.0" y1="284.0" x2="340.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="600.0" height="88.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="369.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">кожен цілий кадр — обох напрямків — лягає на диск</tspan><tspan x="340.0" dy="19.5">одразу, до кінця сеансу</tspan></text>
<line x1="340.0" y1="418.0" x2="340.0" y2="462.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="464.0" width="600.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">останній апарат зник із переліку → _stopLogging()</tspan></text>
<line x1="340.0" y1="534.0" x2="340.0" y2="578.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="580.0" width="600.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="629.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">апарат був зброєний  АБО  ввімкнено telemetrySaveNotArmed ?</tspan></text>
<line x1="180.0" y1="668.0" x2="180.0" y2="714.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="108.0" y="696.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">так</text>
<rect x="20.0" y="716.0" width="320.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="750.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Telemetry/</tspan><tspan x="180.0" dy="18.2">2026-08-02 14-31-07.tlog</tspan><tspan x="180.0" dy="18.2">(атомарна заміна)</tspan></text>
<line x1="500.0" y1="668.0" x2="500.0" y2="714.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="572.0" y="696.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ні</text>
<rect x="360.0" y="716.0" width="300.0" height="96.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="768.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">файл прибрано</tspan></text>
<line x1="640.0" y1="374.0" x2="680.0" y2="374.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">застосунок упав</text>
<rect x="680.0" y="330.0" width="600.0" height="88.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="369.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">ніхто не викликав _stopLogging(),</tspan><tspan x="980.0" dy="19.5">але файл уже лежить на диску цілий</tspan></text>
<line x1="980.0" y1="418.0" x2="980.0" y2="462.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="464.0" width="600.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">наступний запуск: обхід tmp за маскою *.mavlink</tspan></text>
<line x1="980.0" y1="534.0" x2="980.0" y2="578.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="580.0" width="600.0" height="88.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="629.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">порожні прибрано, решту збережено як звичайні логи</tspan></text>
<line x1="980.0" y1="668.0" x2="980.0" y2="714.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="716.0" width="600.0" height="96.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="750.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">ФІЛЬТР ЗБРОЄНОСТИ ТУТ НЕ ДІЄ:</tspan><tspan x="980.0" dy="18.2">прапорець зник разом із застосунком,</tspan><tspan x="980.0" dy="18.2">тож рятують усі непорожні файли підряд</tspan></text>
