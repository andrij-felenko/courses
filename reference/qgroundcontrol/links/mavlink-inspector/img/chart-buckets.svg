<rect x="850.0" y="530.0" width="330.0" height="62.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="1015.0" y="565.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">червоним — кожен 20-й</tspan></text>
<rect x="130.0" y="616.0" width="1050.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="646.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Пара «найменше — найбільше» лишає від відра вертикальний штрих: сплеск, що трапився</tspan><tspan x="655.0" dy="19.5">будь-де всередині відра, доживає до екрана на повну висоту.</tspan></text>
<rect x="130.0" y="700.0" width="1050.0" height="70.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="730.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Кроковий вибір «кожен N-й» дає таку саму кількість точок, але сплеск між кроками</tspan><tspan x="655.0" dy="19.5">просто не потрапляє у вибірку — і графік стає гладким та брехливим.</tspan></text>
