<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що застосунок робить із кожним прийнятим кадром</text>
<rect x="160.0" y="70.0" width="480.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">кадр із сигналу messageReceived</tspan></text>
<line x1="400.0" y1="128.0" x2="400.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="162.0" width="480.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">знайти рядок за трійкою ключа</tspan></text>
<line x1="400.0" y1="220.0" x2="400.0" y2="252.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="254.0" width="480.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">лічильник + 1</tspan><tspan x="400.0" dy="19.5">зберегти копію кадру</tspan></text>
<line x1="400.0" y1="330.0" x2="400.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="364.0" width="480.0" height="76.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="397.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">рядок розгорнутий</tspan><tspan x="400.0" dy="19.5">або поле винесене на графік?</tspan></text>
<line x1="640.0" y1="402.0" x2="800.0" y2="402.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ні</text>
<rect x="808.0" y="372.0" width="380.0" height="60.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="998.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="998.0" dy="0.0">усе, кадр відпрацьовано</tspan></text>
<line x1="400.0" y1="440.0" x2="400.0" y2="476.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="426.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">так</text>
<rect x="160.0" y="478.0" width="480.0" height="96.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="521.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">розкласти поля:</tspan><tspan x="400.0" dy="19.5">memcpy → рядок → сигнал інтерфейсу</tspan></text>
<line x1="400.0" y1="574.0" x2="400.0" y2="606.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="608.0" width="480.0" height="76.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="641.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">поле на графіку — ще й у відро</tspan><tspan x="400.0" dy="19.5">мінімуму й максимуму</tspan></text>
<rect x="880.0" y="470.0" width="380.0" height="244.0" rx="10" fill="#eef2f6" stroke="#c8d2dc" stroke-width="1.2"/>
<text x="1070.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">40 повідомлень, 200 кадрів/с,</text>
<text x="1070.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">12 полів у середньому</text>
<rect x="908.0" y="542.0" width="324.0" height="70.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="572.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">розкладати все:</tspan><tspan x="1070.0" dy="18.2">200 × 12 = 2400 за секунду</tspan></text>
<rect x="908.0" y="624.0" width="324.0" height="70.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="654.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">лише вибране (10 Гц):</tspan><tspan x="1070.0" dy="18.2">10 × 12 = 120 за секунду</tspan></text>
</svg>