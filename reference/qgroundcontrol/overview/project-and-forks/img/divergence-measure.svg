<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від чого міряють розходження — і що з нього коштує грошей</text>
<text x="70.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Дві лінії від однієї точки</text>
<rect x="114.1" y="113.5" width="71.9" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Апстрим</tspan></text>
<rect x="125.2" y="193.5" width="49.6" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Форк</tspan></text>
<line x1="250.0" y1="130.0" x2="960.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="210.0" x2="830.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="130.0" x2="250.0" y2="210.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<circle cx="250.0" cy="130.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="350.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="450.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="550.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="650.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="750.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="850.0" cy="130.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="350.0" cy="210.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="450.0" cy="210.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="550.0" cy="210.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="650.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1487 комітів, яких у нас немає — «позаду»</text>
<text x="258.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">точка розгалуження (merge-base)</text>
<text x="550.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">63 наші коміти — «попереду»</text>
<text x="70.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Три множини файлів — і та єдина, що коштує грошей</text>
<rect x="70.0" y="350.0" width="230.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">U — змінив апстрим</tspan><tspan x="185.0" dy="16.9">3162 файли</tspan></text>
<rect x="320.0" y="350.0" width="370.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="505.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">U \ C — чужі правки</tspan><tspan x="505.0" dy="16.9">прийдуть як є</tspan></text>
<rect x="690.0" y="350.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="70.0" y="424.0" width="230.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">M — змінили ми</tspan><tspan x="185.0" dy="16.9">57 правок спільних файлів</tspan></text>
<rect x="690.0" y="424.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="820.0" y="424.0" width="160.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">M \ C — наше</tspan><tspan x="900.0" dy="16.9">піде без питань</tspan></text>
<rect x="70.0" y="498.0" width="230.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="517.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">C = M ∩ U — перетин</tspan><tspan x="185.0" dy="16.9">тут буде ручна робота</tspan></text>
<rect x="690.0" y="498.0" width="130.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="517.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">C</tspan><tspan x="755.0" dy="16.9">41 файл</tspan></text>
<text x="835.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">рахунок за наступне злиття</text>
<line x1="690.0" y1="396.0" x2="690.0" y2="424.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="690.0" y1="470.0" x2="690.0" y2="498.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="820.0" y1="396.0" x2="820.0" y2="424.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="820.0" y1="470.0" x2="820.0" y2="498.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="70.0" y="570.0" width="910.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="525.0" y="597.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="525.0" dy="0.0">поза перетином вибору немає: якщо одна сторона файл не чіпала, злиття бере версію другої</tspan></text>
</svg>