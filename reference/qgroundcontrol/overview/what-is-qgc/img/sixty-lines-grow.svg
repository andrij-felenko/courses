<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="190.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шістдесят рядків</text>
<text x="610.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що це ламає</text>
<text x="1040.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція</text>
<rect x="40.0" y="94.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">один сокет,</tspan><tspan x="190.0" dy="16.9">відкритий назавжди</tspan></text>
<rect x="400.0" y="94.0" width="420.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">канал рветься, а пакети губляться</tspan><tspan x="610.0" dy="15.6">мовчки — ніхто про це не скаже</tspan></text>
<rect x="880.0" y="94.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">облік каналів із перепідключенням</tspan><tspan x="1040.0" dy="16.9">і лічильник втрат за полем seq</tspan></text>
<line x1="344.0" y1="130.0" x2="394.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="130.0" x2="874.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="194.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">розбір на каналі</tspan><tspan x="190.0" dy="16.9">MAVLINK_COMM_0</tspan></text>
<rect x="400.0" y="194.0" width="420.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">в ефірі кілька апаратів, камер</tspan><tspan x="610.0" dy="15.6">і ще одна станція</tspan></text>
<rect x="880.0" y="194.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">свій канал розбору на кожен лінк,</tspan><tspan x="1040.0" dy="16.9">маршрутизація за sysid і compid</tspan></text>
<line x1="344.0" y1="230.0" x2="394.0" y2="230.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="230.0" x2="874.0" y2="230.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="294.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">switch по чотирьох</tspan><tspan x="190.0" dy="16.9">номерах повідомлень</tspan></text>
<rect x="400.0" y="294.0" width="420.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">параметри й місія — не повідомлення,</tspan><tspan x="610.0" dy="15.6">а домовлені обміни з підтвердженням</tspan></text>
<rect x="880.0" y="294.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">кеш параметрів зі звіркою</tspan><tspan x="1040.0" dy="16.9">й узгодження місії з перезапитами</tspan></text>
<line x1="344.0" y1="330.0" x2="394.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="330.0" x2="874.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="394.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">друк рядка</tspan><tspan x="190.0" dy="16.9">в консоль</tspan></text>
<rect x="400.0" y="394.0" width="420.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">людина мислить місцевістю,</tspan><tspan x="610.0" dy="15.6">а не парою чисел</tspan></text>
<rect x="880.0" y="394.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">модель апарата, а з неї —</tspan><tspan x="1040.0" dy="16.9">карта, прилади, журнали</tspan></text>
<line x1="344.0" y1="430.0" x2="394.0" y2="430.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="430.0" x2="874.0" y2="430.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="494.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">читання блокує</tspan><tspan x="190.0" dy="16.9">єдиний цикл</tspan></text>
<rect x="400.0" y="494.0" width="420.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="526.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">вікно не сміє завмерти</tspan><tspan x="610.0" dy="15.6">ні на десяту частку секунди</tspan></text>
<rect x="880.0" y="494.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">окремий потік каналу</tspan><tspan x="1040.0" dy="16.9">й черга до інтерфейсу</tspan></text>
<line x1="344.0" y1="530.0" x2="394.0" y2="530.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="824.0" y1="530.0" x2="874.0" y2="530.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>