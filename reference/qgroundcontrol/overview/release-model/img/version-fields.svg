<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три числа: що дозволено змінити і чим за це платить користувач</text>
<rect x="40.0" y="60.0" width="200.0" height="46.0" rx="6" fill="#e8ecf2" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">номер</tspan></text>
<rect x="260.0" y="60.0" width="400.0" height="46.0" rx="6" fill="#e8ecf2" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">що дозволено покласти всередину</tspan></text>
<rect x="680.0" y="60.0" width="380.0" height="46.0" rx="6" fill="#e8ecf2" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">що це коштує тому, хто оновлюється</tspan></text>
<rect x="40.0" y="118.0" width="200.0" height="100.0" rx="6" fill="#f7f8fa" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Z — патч</tspan></text>
<rect x="260.0" y="118.0" width="400.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">виправлення, важливі настільки,</tspan><tspan x="460.0" dy="18.2">щоб вимагати оновлення,</tspan><tspan x="460.0" dy="18.2">і безпечні настільки,</tspan><tspan x="460.0" dy="18.2">щоб лінія лишалась якісною</tspan></text>
<rect x="680.0" y="118.0" width="380.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">нічого не треба вчити наново;</tspan><tspan x="870.0" dy="18.2">оновлюють між польотами,</tspan><tspan x="870.0" dy="18.2">а не перед вильотом</tspan></text>
<rect x="40.0" y="230.0" width="200.0" height="100.0" rx="6" fill="#f7f8fa" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Y — мінорна</tspan></text>
<rect x="260.0" y="230.0" width="400.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">нове з master: функції,</tspan><tspan x="460.0" dy="18.2">підтримка свіжих можливостей</tspan><tspan x="460.0" dy="18.2">автопілота, перероблені екрани</tspan></text>
<rect x="680.0" y="230.0" width="380.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">зʼявляються нові екрани;</tspan><tspan x="870.0" dy="18.2">документацію читати</tspan><tspan x="870.0" dy="18.2">від сторінки своєї лінії</tspan></text>
<rect x="40.0" y="342.0" width="200.0" height="100.0" rx="6" fill="#f7f8fa" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">X — мажорна</tspan></text>
<rect x="260.0" y="342.0" width="400.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">зміни, що ламають звичне:</tspan><tspan x="460.0" dy="18.2">інша система збірки,</tspan><tspan x="460.0" dy="18.2">викинуті старі протоколи,</tspan><tspan x="460.0" dy="18.2">вищі вимоги до ОС</tspan></text>
<rect x="680.0" y="342.0" width="380.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">переучування оператора;</tspan><tspan x="870.0" dy="18.2">вендорський форк переносить</tspan><tspan x="870.0" dy="18.2">свої зміни на нову основу</tspan></text>
</svg>