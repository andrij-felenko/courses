<text x="590.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">побачене в журналі повертає апарат на стіл</text>
<text x="590.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">у застосунку немає ні входу, ні облікових записів: та сама людина буває всіма трьома за один день</text>
