<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 740" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="740" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Четверо воріт між елементом у коді й виконаною дією</text>
<text x="275.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">ворота</text>
<text x="820.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">яку саме помилку вони ловлять</text>
<rect x="60.0" y="92.0" width="430.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="121.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Елемент існує у вихідному коді</tspan></text>
<line x1="275.0" y1="146.0" x2="275.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="176.0" width="430.0" height="74.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1. Збірка: чи ввімкнено його</tspan><tspan x="275.0" dy="18.2">у ЦЬОМУ застосунку</tspan></text>
<rect x="560.0" y="176.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">хибний набір можливостей для цієї</tspan><tspan x="820.0" dy="16.9">аудиторії — вирішує розробник збірки</tspan></text>
<line x1="275.0" y1="254.0" x2="275.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="284.0" width="430.0" height="74.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="316.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">2. Поглиблений режим: чи відкрито</tspan><tspan x="275.0" dy="18.2">шар налаштувальника</tspan></text>
<rect x="560.0" y="284.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">блукання поза межами своєї ролі —</tspan><tspan x="820.0" dy="16.9">пілот у сторінках, яких не розуміє</tspan></text>
<line x1="275.0" y1="362.0" x2="275.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="392.0" width="430.0" height="74.0" rx="6" fill="#eef2f7" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="424.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">3. Стан: чи має дія сенс</tspan><tspan x="275.0" dy="18.2">саме зараз</tspan></text>
<rect x="560.0" y="392.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="425.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">дія неможлива або небезпечна в цьому</tspan><tspan x="820.0" dy="16.9">стані — апарат зброєний, борт не на USB</tspan></text>
<line x1="275.0" y1="470.0" x2="275.0" y2="496.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="500.0" width="430.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="532.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">4. Намір: жест, який шум</tspan><tspan x="275.0" dy="18.2">не відтворює</tspan></text>
<rect x="560.0" y="500.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="533.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">випадковий дотик, поштовх, крапля</tspan><tspan x="820.0" dy="16.9">дощу на екрані</tspan></text>
<line x1="275.0" y1="578.0" x2="275.0" y2="604.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="608.0" width="430.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="637.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Команда пішла на апарат</tspan></text>
<text x="570.0" y="714.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">жодні з них не замінюють інших: кожні відповідають на своє питання</text>
</svg>