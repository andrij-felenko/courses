<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">CONSTANT чи NOTIFY: чому половина перемикачів не діє після старту</text>
<text x="620.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">подія: showAdvancedUI стає true</tspan><tspan x="620.0" dy="16.9">(п'ять натисків по кнопці)</tspan></text>
<line x1="620.0" y1="116.0" x2="620.0" y2="496.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="7 6"/>
<rect x="40.0" y="140.0" width="280.0" height="130.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="167.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">CONSTANT</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">showInstrumentPanel</tspan><tspan x="180.0" dy="16.9">showMapScale</tspan><tspan x="180.0" dy="16.9">combineSettingsAndSetup</tspan><tspan x="180.0" dy="16.9">guidedActionsRequireRCRSSI</tspan></text>
<rect x="340.0" y="140.0" width="260.0" height="130.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">QML читає значення</tspan><tspan x="470.0" dy="16.9">один раз — коли</tspan><tspan x="470.0" dy="16.9">будує прив'язку</tspan></text>
<rect x="660.0" y="140.0" width="480.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">сигналу немає — прив'язка не переобчислюється:</tspan><tspan x="900.0" dy="16.9">елемент лишається таким, яким був на старті</tspan></text>
<rect x="40.0" y="330.0" width="280.0" height="130.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="357.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">NOTIFY</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">showFirmwareUpgrade</tspan><tspan x="180.0" dy="16.9">showSensorCalibration*</tspan><tspan x="180.0" dy="16.9">missionWaypointsOnly</tspan><tspan x="180.0" dy="16.9">guidedBarShowOrbit</tspan></text>
<rect x="340.0" y="330.0" width="260.0" height="130.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">QML читає значення</tspan><tspan x="470.0" dy="16.9">і підписується</tspan><tspan x="470.0" dy="16.9">на сигнал зміни</tspan></text>
<rect x="660.0" y="330.0" width="480.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="391.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">твій emit …Changed → прив'язка переобчислюється:</tspan><tspan x="900.0" dy="16.9">елемент з'являється або зникає на льоту</tspan></text>
<line x1="340.0" y1="492.0" x2="1140.0" y2="492.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час роботи застосунку</text>
<text x="590.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">CONSTANT — обіцянка QML, що значення ніколи не зміниться</text>
</svg>