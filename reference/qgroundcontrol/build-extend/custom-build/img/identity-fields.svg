<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири поля ідентичності й куди кожне доїжджає</text>
<rect x="50.0" y="74.0" width="380.0" height="132.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="240.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">QGC_APP_NAME</tspan><tspan x="240.0" dy="19.5">«ім'я застосунку»</tspan></text>
<rect x="620.0" y="74.0" width="630.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">ім'я цілі CMake  →  виконуваний файл і пакет</tspan><tspan x="935.0" dy="18.2">ім'я застосунку  →  тека, де лежать налаштування</tspan><tspan x="935.0" dy="18.2">у щоденній збірці до нього додається « Daily»</tspan></text>
<line x1="444.0" y1="140.0" x2="606.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="238.0" width="380.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="279.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">QGC_ORG_NAME</tspan><tspan x="240.0" dy="19.5">QGC_ORG_DOMAIN</tspan></text>
<rect x="620.0" y="238.0" width="630.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="279.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">організація й домен  →  друга половина шляху</tspan><tspan x="935.0" dy="18.2">до файлу налаштувань, яку бачить система</tspan></text>
<line x1="444.0" y1="284.0" x2="606.0" y2="284.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="362.0" width="380.0" height="106.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="410.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">QGC_PACKAGE_NAME</tspan><tspan x="240.0" dy="19.5">«ідентифікатор пакета»</tspan></text>
<rect x="620.0" y="362.0" width="630.0" height="106.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">пакет Android  ·  пакунок macOS  ·  запис .desktop</tspan><tspan x="935.0" dy="18.2">той самий ідентифікатор — застосунки не стануть поруч,</tspan><tspan x="935.0" dy="18.2">а магазин відмовить у завантаженні</tspan></text>
<line x1="444.0" y1="415.0" x2="606.0" y2="415.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="500.0" width="380.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="545.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">QGC_SETTINGS_VERSION</tspan><tspan x="240.0" dy="19.5">«версія схеми ключів»</tspan></text>
<rect x="620.0" y="500.0" width="630.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="545.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">число не збіглося з тим, що у файлі  →  settings.clear()</tspan><tspan x="935.0" dy="18.2">і повідомлення користувачеві про скидання налаштувань</tspan></text>
<line x1="444.0" y1="550.0" x2="606.0" y2="550.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>