<text x="390.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">біт 3 доходить до позиції 0 — його бачить крок j + 4</text>
<text x="520.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тому маска спрацювань u = t ^ (t &lt;&lt; 4), де t = байт ^ (crc &amp; 0xFF)</text>
<rect x="90.0" y="224.0" width="860.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">біт 15 многочлена після (7 − j) зсувів опиняється на позиції 8 + j   ⇒   доданок u &lt;&lt; 8</tspan></text>
<rect x="90.0" y="282.0" width="860.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">біт 10 многочлена опиняється на позиції 3 + j   ⇒   доданок u &lt;&lt; 3</tspan></text>
<rect x="90.0" y="340.0" width="860.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">біт 3 многочлена опиняється на позиції j − 4, тільки для j ≥ 4   ⇒   доданок u &gt;&gt; 4</tspan></text>
<rect x="90.0" y="408.0" width="860.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="440.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">старший байт просто зсувається вниз, решта — три доданки:</tspan><tspan x="520.0" dy="18.2">crc ← (crc &gt;&gt; 8) ^ (u &lt;&lt; 8) ^ (u &lt;&lt; 3) ^ (u &gt;&gt; 4)</tspan></text>
