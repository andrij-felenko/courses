<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок, у якому встановлюється значення опції збірки</text>
<text x="300.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">звідки береться значення</text>
<text x="940.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">чи перебиває вже встановлене</text>
<rect x="50.0" y="76.0" width="500.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">cmake/CustomOptions.cmake</tspan><tspan x="300.0" dy="20.8">option() і set(… CACHE …)</tspan></text>
<rect x="630.0" y="76.0" width="620.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">запише значення, ЛИШЕ якщо в кеші</tspan><tspan x="940.0" dy="18.2">ще немає запису з таким іменем</tspan></text>
<line x1="566.0" y1="122.0" x2="614.0" y2="122.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="300.0" y1="168.0" x2="300.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="204.0" width="500.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">числа з .github/build-config.json</tspan></text>
<rect x="630.0" y="204.0" width="620.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">ті самі set(… CACHE …) — просто</tspan><tspan x="940.0" dy="18.2">число приїхало з одного JSON</tspan></text>
<line x1="566.0" y1="250.0" x2="614.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="300.0" y1="296.0" x2="300.0" y2="326.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="332.0" width="500.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="373.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">cacheVariables пресета</tspan><tspan x="300.0" dy="20.8">і -D у командному рядку</tspan></text>
<rect x="630.0" y="332.0" width="620.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="373.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">потрапляють у кеш ДО читання CMakeLists,</tspan><tspan x="940.0" dy="18.2">тож типове значення вже не спрацює</tspan></text>
<line x1="566.0" y1="378.0" x2="614.0" y2="378.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="300.0" y1="424.0" x2="300.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="460.0" width="500.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">CMakeCache.txt</tspan><tspan x="300.0" dy="20.8">від попередньої конфігурації</tspan></text>
<rect x="630.0" y="460.0" width="620.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="501.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">запис уже існує — типове значення</tspan><tspan x="940.0" dy="18.2">не застосується більше ніколи</tspan></text>
<line x1="566.0" y1="506.0" x2="614.0" y2="506.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="300.0" y1="552.0" x2="300.0" y2="582.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="588.0" width="500.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="639.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">custom/cmake/CustomOverrides.cmake</tspan></text>
<rect x="630.0" y="588.0" width="620.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="629.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">set(… CACHE … FORCE) читається останнім —</tspan><tspan x="940.0" dy="18.2">перебиває навіть ваш -D</tspan></text>
<line x1="566.0" y1="634.0" x2="614.0" y2="634.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="90.0" y="728.0" width="1120.0" height="96.0" rx="6" fill="#eef2f6" stroke="#c0392b" stroke-width="2.2"/><text x="650.0" y="771.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">прибрати -D з рядка НЕ означає повернути типове значення:</tspan><tspan x="650.0" dy="20.8">запис лишається в кеші, поки його не стерти — cmake -B build -U ІМʼЯ</tspan></text>
</svg>