<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1400" height="1090" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія переходу збірки QGroundControl з qmake на CMake</text>
<text x="145.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">коли</text>
<text x="600.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">що сталося</text>
<text x="1155.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">слід у репозиторії</text>
<rect x="40.0" y="76.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">вересень –</tspan><tspan x="145.0" dy="19.5">жовтень 2018</tspan></text>
<rect x="280.0" y="76.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Деніел Аґар подає «initial cmake support» (PR #6862)</tspan></text>
<rect x="950.0" y="76.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">поруч із qgroundcontrol.pro</tspan><tspan x="1155.0" dy="18.2">з'являється CMakeLists.txt</tspan></text>
<line x1="145.0" y1="146.0" x2="145.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="164.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">2018 – 2023</tspan></text>
<rect x="280.0" y="164.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">дві системи живуть поруч; головна — qmake</tspan></text>
<rect x="950.0" y="164.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">.pro важить 49 КБ,</tspan><tspan x="1155.0" dy="18.2">CMakeLists.txt — близько 6 КБ</tspan></text>
<line x1="145.0" y1="234.0" x2="145.0" y2="248.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="252.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">30 листопада 2023</tspan></text>
<rect x="280.0" y="252.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">вийшла лінія 4.3 на Qt 5; того ж дня Сергій Лісовенко</tspan><tspan x="600.0" dy="19.5">відкриває «Adopt cmake to Qt6 build» (PR #10884)</tspan></text>
<rect x="950.0" y="252.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="282.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">порт на Qt 6 із самого початку</tspan><tspan x="1155.0" dy="18.2">йде через CMake, не через .pro</tspan></text>
<line x1="145.0" y1="322.0" x2="145.0" y2="336.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="340.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">1 травня 2024</tspan></text>
<rect x="280.0" y="340.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Голден Ремзі заводить issue #11436</tspan><tspan x="600.0" dy="19.5">«Custom Build Implementation for CMake»</tspan></text>
<rect x="950.0" y="340.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">механізм custom/ під CMake</tspan><tspan x="1155.0" dy="18.2">ще не працює</tspan></text>
<line x1="145.0" y1="410.0" x2="145.0" y2="424.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="428.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="468.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">10 травня 2024</tspan></text>
<rect x="280.0" y="428.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="458.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">PR #11517 вимикає юніт-тести на qmake</tspan><tspan x="600.0" dy="19.5">із формулюванням «build tool is deprecated»</tspan></text>
<rect x="950.0" y="428.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="467.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">qmake офіційно названо застарілим</tspan></text>
<line x1="145.0" y1="498.0" x2="145.0" y2="512.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="516.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">11 червня 2024</tspan></text>
<rect x="280.0" y="516.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">вийшла лінія 4.4 — остання на Qt 5</tspan></text>
<rect x="950.0" y="516.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="546.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">у корені ще обидва файли:</tspan><tspan x="1155.0" dy="18.2">і .pro, і CMakeLists.txt</tspan></text>
<line x1="145.0" y1="586.0" x2="145.0" y2="600.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="604.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="644.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">15 серпня 2024</tspan></text>
<rect x="280.0" y="604.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="644.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">PR #11735 «Remove Deprecated QMake Build System» злито</tspan></text>
<rect x="950.0" y="604.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="634.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">qgroundcontrol.pro зник;</tspan><tspan x="1155.0" dy="18.2">.gitmodules свідомо лишили</tspan></text>
<line x1="145.0" y1="674.0" x2="145.0" y2="688.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="692.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="732.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">16 січня 2025</tspan></text>
<rect x="280.0" y="692.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="732.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">PR #12333 «CMake: Add CPM» злито (закриває issue #11725)</tspan></text>
<rect x="950.0" y="692.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="722.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">з'явився механізм добування</tspan><tspan x="1155.0" dy="18.2">залежностей на етапі конфігурації</tspan></text>
<line x1="145.0" y1="762.0" x2="145.0" y2="776.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="780.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="820.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">28 червня 2025</tspan></text>
<rect x="280.0" y="780.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="820.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">PR #13037 переводить останній підмодуль на CPM</tspan></text>
<rect x="950.0" y="780.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="819.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">.gitmodules зник із master</tspan></text>
<line x1="145.0" y1="850.0" x2="145.0" y2="864.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="868.0" width="210.0" height="70.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="908.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">11 липня 2025</tspan></text>
<rect x="280.0" y="868.0" width="640.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="908.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">стабільна 5.0.6</tspan></text>
<rect x="950.0" y="868.0" width="410.0" height="70.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1155.0" y="898.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1155.0" dy="0.0">перша стабільна лінія,</tspan><tspan x="1155.0" dy="18.2">яка збирається лише CMake</tspan></text>
<rect x="150.0" y="970.0" width="1100.0" height="90.0" rx="6" fill="#eef2f6" stroke="#c0392b" stroke-width="2.2"/><text x="700.0" y="999.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">перехід тривав майже сім років і не мав однієї дати:</tspan><tspan x="700.0" dy="20.8">спершу друга система з'явилася поруч, потім стала головною,</tspan><tspan x="700.0" dy="20.8">і аж наприкінці зникла перша</tspan></text>
</svg>