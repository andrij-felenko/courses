<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три роди того, від чого залежить збірка</text>
<rect x="40.0" y="58.0" width="380.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">ПРИНЕСЕНЕ РУКАМИ</tspan></text>
<rect x="440.0" y="58.0" width="380.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">ПРИТЯГНУТЕ ЗБІРКОЮ</tspan></text>
<rect x="840.0" y="58.0" width="380.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">ПОРОДЖЕНЕ ЗБІРКОЮ</tspan></text>
<rect x="40.0" y="128.0" width="380.0" height="216.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Qt потрібної версії</tspan><tspan x="230.0" dy="19.5">з потрібними модулями</tspan><tspan x="230.0" dy="19.5"></tspan><tspan x="230.0" dy="19.5">компілятор, CMake ≥ 3.25,</tspan><tspan x="230.0" dy="19.5">Ninja, Python ≥ 3.10</tspan><tspan x="230.0" dy="19.5"></tspan><tspan x="230.0" dy="19.5">системні бібліотеки:</tspan><tspan x="230.0" dy="19.5">speech-dispatcher, SDL2</tspan></text>
<rect x="440.0" y="128.0" width="380.0" height="216.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">опис протоколу MAVLink</tspan><tspan x="630.0" dy="19.5">за прибитим комітом</tspan><tspan x="630.0" dy="19.5"></tspan><tspan x="630.0" dy="19.5">готовий SDK GStreamer</tspan><tspan x="630.0" dy="19.5">із перевіркою суми</tspan><tspan x="630.0" dy="19.5"></tspan><tspan x="630.0" dy="19.5">дрібніші залежності</tspan><tspan x="630.0" dy="19.5">через CPM</tspan></text>
<rect x="840.0" y="128.0" width="380.0" height="216.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">дерево заголовків MAVLink</tspan><tspan x="1030.0" dy="19.5">із XML-описів</tspan><tspan x="1030.0" dy="19.5"></tspan><tspan x="1030.0" dy="19.5">перелічення протоколу</tspan><tspan x="1030.0" dy="19.5">для C++ і для QML</tspan><tspan x="1030.0" dy="19.5"></tspan><tspan x="1030.0" dy="19.5">рядок версії застосунку</tspan><tspan x="1030.0" dy="19.5">зі стану репозиторію</tspan></text>
<rect x="40.0" y="364.0" width="380.0" height="134.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">надто дороге, щоб добувати</tspan><tspan x="230.0" dy="18.2">щоразу: гігабайти й години.</tspan><tspan x="230.0" dy="18.2">Збірка тільки перевіряє</tspan><tspan x="230.0" dy="18.2">наявність і зупиняється</tspan></text>
<rect x="440.0" y="364.0" width="380.0" height="134.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">версія прямо міняє поведінку,</tspan><tspan x="630.0" dy="18.2">тож проєкт мусить обрати її сам —</tspan><tspan x="630.0" dy="18.2">і може принести за хвилини</tspan></text>
<rect x="840.0" y="364.0" width="380.0" height="134.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">цілком виводиться з джерела,</tspan><tspan x="1030.0" dy="18.2">тож тримати похідне в репозиторії</tspan><tspan x="1030.0" dy="18.2">означало б комітити тисячі</tspan><tspan x="1030.0" dy="18.2">файлів, яких ніхто не перегляне</tspan></text>
<rect x="70.0" y="528.0" width="1120.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/><text x="630.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">КРИТЕРІЙ МЕЖІ</tspan><tspan x="630.0" dy="20.8">притягують те, версію чого проєкт мусить контролювати сам і що дешево принести;</tspan><tspan x="630.0" dy="20.8">приносять руками те, що проєкт контролювати не в змозі або що надто дороге;</tspan><tspan x="630.0" dy="20.8">породжують те, що є похідним від уже наявного джерела</tspan></text>
</svg>