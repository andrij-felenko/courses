<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три кільця, крізь які проходить зміна</text>
<rect x="40.0" y="66.0" width="290.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/><text x="185.0" y="103.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">ЛОКАЛЬНІ ГАЧКИ</tspan><tspan x="185.0" dy="20.8">секунди, ще до коміту</tspan></text>
<rect x="40.0" y="178.0" width="290.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">формат і відступи</tspan><tspan x="185.0" dy="19.5">заборонені виклики</tspan><tspan x="185.0" dy="19.5">секрети в коді</tspan><tspan x="185.0" dy="19.5">лінт QML і Python</tspan></text>
<rect x="395.0" y="66.0" width="290.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/><text x="540.0" y="103.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">CI НА П'ЯТЬ ПЛАТФОРМ</tspan><tspan x="540.0" dy="20.8">десятки хвилин, у черзі</tspan></text>
<rect x="395.0" y="178.0" width="290.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">збірка під кожну ОС</tspan><tspan x="540.0" dy="19.5">попередження = помилка</tspan><tspan x="540.0" dy="19.5">модульні тести</tspan><tspan x="540.0" dy="19.5">пакування збірок</tspan></text>
<rect x="750.0" y="66.0" width="290.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><text x="895.0" y="103.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="895.0" dy="0.0">РЕВ'Ю ЛЮДИНОЮ</tspan><tspan x="895.0" dy="20.8">години або доба</tspan></text>
<rect x="750.0" y="178.0" width="290.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">чи розв'язує задачу</tspan><tspan x="895.0" dy="19.5">чи рішення узагальнене</tspan><tspan x="895.0" dy="19.5">чи не росте борг</tspan><tspan x="895.0" dy="19.5">чи це взагалі сюди</tspan></text>
<line x1="340.0" y1="108.0" x2="388.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="695.0" y1="108.0" x2="743.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що далі кільце, то дорожчий цикл «помилка → виправлення»</text>
<text x="540.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">тому кожне кільце ловить лише те, чого не вміє попереднє</text>
</svg>