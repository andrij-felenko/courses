<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ціни, які проєкт платить за прийняту зміну</text>
<rect x="50.0" y="56.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/><text x="265.0" y="88.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">ЦІНА ПРИЙНЯТТЯ</tspan><tspan x="265.0" dy="20.8">увага кількох супровідників, тут і зараз</tspan></text>
<rect x="50.0" y="152.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">лінтери й формат пройдено локально</tspan></text>
<rect x="50.0" y="218.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">CI зелений — збірку перевіряти не треба</tspan></text>
<rect x="50.0" y="284.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">зміна вузька й про одну тему</tspan></text>
<rect x="50.0" y="350.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">опис: задача, як перевіряв, що ламається</tspan></text>
<rect x="540.0" y="56.0" width="430.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/><text x="755.0" y="88.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">ЦІНА ВОЛОДІННЯ</tspan><tspan x="755.0" dy="20.8">життя зміни в дереві всі наступні роки</tspan></text>
<rect x="540.0" y="152.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">інваріанти коду: Facts, плагін прошивки</tspan></text>
<rect x="540.0" y="218.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">тести на нову підсистему</tspan></text>
<rect x="540.0" y="284.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">рішення узагальнене, а не під один продукт</tspan></text>
<rect x="540.0" y="350.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">коміт у форматі, який читає реліз-машина</tspan></text>
<rect x="50.0" y="428.0" width="920.0" height="76.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/><text x="510.0" y="462.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Обидва рахунки платить не автор зміни, а проєкт.</tspan><tspan x="510.0" dy="16.9">Тому процес внеску перекладає якомога більше роботи на автора: він один, супровідників мало, а зміна лишається назавжди.</tspan></text>
</svg>