<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні перевірки — і лише їх перетин дає робочий порт</text>
<rect x="40.0" y="70.0" width="300.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">рядки: android/res/xml/device_filter.xml</tspan><tspan x="190.0" dy="15.6">стовпці: таблиця QGCUsbSerialProber</tspan></text>
<rect x="366.0" y="70.0" width="400.0" height="66.0" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.5"/><text x="566.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="566.0" dy="0.0">драйвер для цього VID/PID у таблиці Є</tspan></text>
<rect x="792.0" y="70.0" width="400.0" height="66.0" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.5"/><text x="992.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="992.0" dy="0.0">драйвера для цього VID/PID НЕМА</tspan></text>
<rect x="40.0" y="160.0" width="300.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">пристрій</tspan><tspan x="190.0" dy="19.5">збігається</tspan><tspan x="190.0" dy="19.5">з фільтром</tspan></text>
<rect x="366.0" y="160.0" width="400.0" height="130.0" rx="6" fill="#eaf7ec" stroke="#27ae60" stroke-width="1.5"/><text x="566.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">система сама пропонує запустити станцію,</tspan><tspan x="566.0" dy="18.2">дозвіл дають одним дотиком —</tspan><tspan x="566.0" dy="18.2">порт з'являється у списку</tspan></text>
<rect x="792.0" y="160.0" width="400.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="992.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="992.0" dy="0.0">станція запустилася від встромляння,</tspan><tspan x="992.0" dy="18.2">дозвіл є — а порту в списку НЕМА.</tspan><tspan x="992.0" dy="18.2">Ось та сама пастка</tspan></text>
<rect x="40.0" y="312.0" width="300.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="362.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">пристрій</tspan><tspan x="190.0" dy="19.5">не збігається</tspan><tspan x="190.0" dy="19.5">з фільтром</tspan></text>
<rect x="366.0" y="312.0" width="400.0" height="130.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="566.0" y="363.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">автозапуску нема; станція сама просить</tspan><tspan x="566.0" dy="18.2">дозвіл через requestPermission, і після</tspan><tspan x="566.0" dy="18.2">«дозволити» порт з'являється</tspan></text>
<rect x="792.0" y="312.0" width="400.0" height="130.0" rx="6" fill="#f4f4f4" stroke="#6b7280" stroke-width="1.5"/><text x="992.0" y="381.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="992.0" dy="0.0">пристрій для станції просто невидимий</tspan></text>
<rect x="40.0" y="476.0" width="1200.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="512.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">У стандартній збірці нижнього рядка не існує: фільтр — це &lt;usb-device /&gt;, тобто «будь-який пристрій»</tspan></text>
</svg>