<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 894" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="894" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="36.0" y="30.0" width="1228.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="64.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Ручка діє лише на своєму етапі — і читається рівно один раз</tspan></text>
<rect x="36.0" y="114.0" width="300.0" height="108.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="186.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">Вибір тулчейна</tspan><tspan x="186.0" dy="20.8">(до конфігурації)</tspan></text>
<rect x="360.0" y="114.0" width="904.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="812.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">який саме qt-cmake викликано  ·  CMAKE_TOOLCHAIN_FILE  ·  CMAKE_PREFIX_PATH</tspan><tspan x="812.0" dy="18.2">QT_HOST_PATH  ·  QT_ANDROID_ABIS  ·  ANDROID_NDK, ANDROID_PLATFORM</tspan></text>
<rect x="36.0" y="238.0" width="1228.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Межа неповоротності: ціль прибита до теки збірки. Інша платформа або інший ABI — нова тека, а не новий прапорець</tspan></text>
<rect x="36.0" y="306.0" width="300.0" height="108.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="186.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">Конфігурація</tspan></text>
<rect x="360.0" y="306.0" width="904.0" height="108.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="355.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">-DQGC_… осідають у кеші теки збірки  ·  .github/build-config.json → QGC_CONFIG_*</tspan><tspan x="812.0" dy="18.2">вибір системних чи завантажених залежностей: QGC_USE_SYSTEM_LIBS, QGC_SYSTEM_LIBS_ONLY</tspan></text>
<rect x="36.0" y="434.0" width="300.0" height="100.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="186.0" y="489.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">Генерація</tspan></text>
<rect x="360.0" y="434.0" width="904.0" height="100.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="479.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">властивості цілі QT_ANDROID_* → шаблон AndroidManifest.xml</tspan><tspan x="812.0" dy="18.2">список дозволів  ·  версійний код  ·  qt_import_plugins</tspan></text>
<rect x="36.0" y="554.0" width="300.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="186.0" y="609.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">Збірка</tspan></text>
<rect x="360.0" y="554.0" width="904.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="812.0" y="599.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">компіляція під обраний ABI  ·  завантаження архіву GStreamer</tspan><tspan x="812.0" dy="18.2">і звірка sha256 з .github/build-config.json</tspan></text>
<rect x="36.0" y="674.0" width="300.0" height="108.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="186.0" y="733.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="186.0" dy="0.0">Установлення й пакування</tspan></text>
<rect x="360.0" y="674.0" width="904.0" height="108.0" rx="6" fill="#eaf7ec" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="723.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">cmake --install → тека payload  ·  QGC_CREATE_APPIMAGE, QGC_BUILD_INSTALLER</tspan><tspan x="812.0" dy="18.2">QGC_CPACK_GENERATOR  ·  ціль qgc-package  ·  кінцеве ім'я артефакту</tspan></text>
<rect x="36.0" y="806.0" width="1228.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="840.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Прапорець, доданий після першої конфігурації, потребує повторної конфігурації тієї самої теки: значення вже лежить у кеші CMake</tspan></text>
</svg>