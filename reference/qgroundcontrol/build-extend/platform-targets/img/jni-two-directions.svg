<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="900" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міст JNI працює у два боки — і в кожному свій потік</text>
<rect x="60.0" y="72.0" width="560.0" height="46.0" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.5"/><text x="340.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Униз: C++ кличе Java  (запис у порт)</tspan></text>
<rect x="680.0" y="72.0" width="560.0" height="46.0" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.5"/><text x="960.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">Угору: Java кличе C++  (прихід байтів)</tspan></text>
<rect x="60.0" y="152.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">потік лінка (QThread)</tspan><tspan x="340.0" dy="18.2">SerialLink → QSerialPort::write()</tspan></text>
<line x1="340.0" y1="239.0" x2="340.0" y2="257.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="260.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">QJniEnvironment</tspan><tspan x="340.0" dy="18.2">приєднує цей потік до віртуальної машини</tspan><tspan x="340.0" dy="18.2">і дає власний JNIEnv*</tspan></text>
<line x1="340.0" y1="347.0" x2="340.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="368.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="405.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">CallStaticIntMethod</tspan><tspan x="340.0" dy="18.2">за кешованим jmethodID і глобальним jclass</tspan></text>
<line x1="340.0" y1="455.0" x2="340.0" y2="473.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="476.0" width="560.0" height="84.0" rx="6" fill="#fdf1e4" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="513.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">QGCUsbSerialManager.write(id, data, len, timeout)</tspan><tspan x="340.0" dy="18.2">UsbSerialPort → USB host API</tspan></text>
<line x1="340.0" y1="563.0" x2="340.0" y2="581.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="584.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="621.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">checkAndClearExceptions()</tspan><tspan x="340.0" dy="18.2">виняток Java не розкрутив стек — він чекає прапорцем</tspan></text>
<rect x="680.0" y="152.0" width="560.0" height="84.0" rx="6" fill="#fdf1e4" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">читальний потік Java</tspan><tspan x="960.0" dy="18.2">SerialInputOutputManager, пріоритет URGENT_AUDIO</tspan></text>
<line x1="960.0" y1="239.0" x2="960.0" y2="257.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="260.0" width="560.0" height="84.0" rx="6" fill="#fdf1e4" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="297.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">onNewData(byte[])</tspan><tspan x="960.0" dy="18.2">→ nativeDeviceNewData(token, data)</tspan></text>
<line x1="960.0" y1="347.0" x2="960.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="368.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="405.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">jniDeviceNewData: токен → QSerialPortPrivate</tspan><tspan x="960.0" dy="18.2">сталий токен = об'єкт уже знищено, мовчки виходимо</tspan></text>
<line x1="960.0" y1="455.0" x2="960.0" y2="473.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="476.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="513.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">копія байтів у _pendingData під мутексом</tspan><tspan x="960.0" dy="18.2">потік лінка сюди ще не заходив</tspan></text>
<line x1="960.0" y1="563.0" x2="960.0" y2="581.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="584.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="621.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">QueuedConnection у потік-власник порту</tspan><tspan x="960.0" dy="18.2">один відкладений виклик на пачку, а не на пакет</tspan></text>
<line x1="960.0" y1="671.0" x2="960.0" y2="689.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="692.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="738.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">злив у буфер QIODevice → emit readyRead()</tspan></text>
<rect x="60.0" y="834.0" width="250.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="859.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">боки C++</tspan></text>
<rect x="334.0" y="834.0" width="250.0" height="42.0" rx="6" fill="#fdf1e4" stroke="#333333" stroke-width="1.5"/><text x="459.0" y="859.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="459.0" dy="0.0">боки Java</tspan></text>
<text x="960.0" y="860.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">межа мов проходить усередині кожного ланцюжка</text>
</svg>