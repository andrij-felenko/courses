<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1420" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три нитки приймача відео й що між ними ходить</text>
<rect x="40.0" y="40.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">1 · Нитка виклику — головна</tspan></text>
<rect x="40.0" y="110.0" width="380.0" height="420.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="520.0" y="40.0" width="360.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">2 · Нитка робітника приймача</tspan></text>
<rect x="520.0" y="110.0" width="360.0" height="420.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="1000.0" y="40.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1190.0" dy="0.0">3 · Нитки потоку GStreamer</tspan></text>
<rect x="1000.0" y="110.0" width="380.0" height="420.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="65.0" y="140.0" width="330.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="168.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">VideoManager, QML, код станції:</tspan><tspan x="230.0" dy="15.6">start · stop · startDecoding · startRecording</tspan></text>
<rect x="65.0" y="250.0" width="330.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">QTimer сторожа, такт 1000 мс:</tspan><tspan x="230.0" dy="16.9">читає мітки часу зондів</tspan><tspan x="230.0" dy="16.9">і лічильники якости</tspan></text>
<rect x="65.0" y="400.0" width="330.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">обробники сигналів:</tspan><tspan x="230.0" dy="16.9">onStartComplete · timeout ·</tspan><tspan x="230.0" dy="16.9">streamingChanged · recordingChanged</tspan></text>
<rect x="545.0" y="140.0" width="310.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">черга задач під м'ютексом</tspan></text>
<rect x="545.0" y="250.0" width="310.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">єдина нитка, що будує,</tspan><tspan x="700.0" dy="16.9">розбирає й перемикає конвеєр:</tspan><tspan x="700.0" dy="16.9">елементи, пади, клапани</tspan></text>
<rect x="545.0" y="400.0" width="310.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">перезапуск тракту</tspan><tspan x="700.0" dy="16.9">з наростальною паузою</tspan></text>
<rect x="1025.0" y="140.0" width="330.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1190.0" dy="0.0">зонди на трійнику й на стоці:</tspan><tspan x="1190.0" dy="16.9">мітки часу останніх буферів</tspan></text>
<rect x="1025.0" y="250.0" width="330.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1190.0" dy="0.0">sync-message шини:</tspan><tspan x="1190.0" dy="16.9">ERROR · EOS · QOS ·</tspan><tspan x="1190.0" dy="16.9">ELEMENT · LATENCY</tspan></text>
<rect x="1025.0" y="400.0" width="330.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1190.0" dy="0.0">лічильники якости,</tspan><tspan x="1190.0" dy="16.9">атомарні</tspan></text>
<line x1="425.0" y1="200.0" x2="515.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dispatch</text>
<line x1="995.0" y1="450.0" x2="885.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="940.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dispatch</text>
<line x1="700.0" y1="535.0" x2="700.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1190.0" y1="535.0" x2="1190.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="598.0" width="1340.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="760.0" y="632.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Сигнали приймача летять із ниток 2 і 3 у нитку одержувача чергою подій:</tspan><tspan x="760.0" dy="19.6">обробник виконується там, де живе одержувач, і завжди пізніше за виклик.</tspan></text>
<line x1="210.0" y1="594.0" x2="210.0" y2="535.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="726.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило одне: усе, що чіпає конвеєр, виконує нитка 2 — байдуже, звідки покликали.</text>
<text x="40.0" y="754.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">Виклик із чужої нитки не помилка: він стає задачею в черзі й відповідає сигналом.</text>
</svg>