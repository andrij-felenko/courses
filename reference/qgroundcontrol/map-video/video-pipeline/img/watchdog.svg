<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1400" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві точки спостереження розрізняють три стани тракту</text>
<rect x="60.0" y="66.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">джерело</tspan><tspan x="185.0" dy="16.9">udpsrc / rtspsrc</tspan></text>
<rect x="390.0" y="66.0" width="260.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">трійник</tspan><tspan x="520.0" dy="16.9">зонд A: останній пакет</tspan></text>
<rect x="730.0" y="66.0" width="180.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">декодер</tspan></text>
<rect x="970.0" y="66.0" width="270.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1105.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1105.0" dy="0.0">стік</tspan><tspan x="1105.0" dy="16.9">зонд B: останній кадр</tspan></text>
<line x1="310.0" y1="98.0" x2="386.0" y2="98.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="98.0" x2="726.0" y2="98.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="910.0" y1="98.0" x2="966.0" y2="98.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1240.0" y1="98.0" x2="1275.0" y2="98.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1360.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">екран</text>
<rect x="40.0" y="220.0" width="420.0" height="200.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="60.0" y="240.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">A свіжий, B свіжий</tspan></text>
<text x="250.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Норма.</tspan><tspan x="250.0" dy="17.6">Кадри доходять до екрана,</tspan><tspan x="250.0" dy="17.6">перезапуск не потрібен.</tspan></text>
<rect x="490.0" y="220.0" width="420.0" height="200.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="510.0" y="240.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">A свіжий, B старіший за 2×T</tspan></text>
<text x="700.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Потік іде, та не декодується:</tspan><tspan x="700.0" dy="17.6">не той кодек, немає ключового</tspan><tspan x="700.0" dy="17.6">кадру, збій декодера.</tspan></text>
<rect x="940.0" y="220.0" width="420.0" height="200.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="960.0" y="240.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1150.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1150.0" dy="0.0">A старіший за T</tspan></text>
<text x="1150.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">Джерело зникло: радіоканал,</tspan><tspan x="1150.0" dy="17.6">живлення камери,</tspan><tspan x="1150.0" dy="17.6">маршрут у мережі.</tspan></text>
<text x="40.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">T — час очікування джерела (типово 8 с). Після кожної невдалої спроби пауза подвоюється: 1, 2, 4 … 30 с.</text>
</svg>