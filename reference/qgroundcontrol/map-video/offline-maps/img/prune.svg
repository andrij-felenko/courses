<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стеля кеша обмежує тільки те, що застосунок має право забути</text>
<line x1="433.9" y1="150.0" x2="433.9" y2="500.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="8,6"/>
<text x="433.9" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">стеля кеша 1024 МБ</text>
<text x="80.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">до очищення</text>
<rect x="80.0" y="200.0" width="110.6" height="76.0" rx="4" fill="#f0f2f4" stroke="#333333" stroke-width="1.5"/>
<rect x="190.6" y="200.0" width="829.4" height="76.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="80.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="80.0" dy="0.0">типовий набір, 320 МБ —</tspan><tspan x="80.0" dy="16.9">єдине, що можна викинути</tspan></text>
<text x="1020.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end"><tspan x="1020.0" dy="0.0">іменовані набори, 2400 МБ —</tspan><tspan x="1020.0" dy="16.9">обіцяно, недоторканне</tspan></text>
<text x="80.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">після очищення</text>
<rect x="80.0" y="430.0" width="829.4" height="76.0" rx="4" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="1020.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end"><tspan x="1020.0" dy="0.0">база лишилася понад стелею,</tspan><tspan x="1020.0" dy="16.9">бо викидати більше нема чого</tspan></text>
