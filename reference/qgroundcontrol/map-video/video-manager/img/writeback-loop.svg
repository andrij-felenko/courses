<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотний запис джерела згасає на другому колі</text>
<rect x="110.0" y="94.8" width="430.0" height="70.4" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="325.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">перерахунок №1</tspan><tspan x="325.0" dy="18.2">вхід: метадані камери</tspan><tspan x="325.0" dy="18.2">changed = так</tspan></text>
<rect x="680.0" y="94.8" width="430.0" height="70.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">перезапуск конвеєра</tspan><tspan x="895.0" dy="18.2">+ вибране джерело лягає</tspan><tspan x="895.0" dy="18.2">у налаштування</tspan></text>
<rect x="680.0" y="303.9" width="430.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">факт джерела змінився →</tspan><tspan x="895.0" dy="18.2">сигнал → перерахунок знову</tspan></text>
<rect x="110.0" y="294.8" width="430.0" height="70.4" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="325.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">перерахунок №2</tspan><tspan x="325.0" dy="18.2">ті самі входи</tspan><tspan x="325.0" dy="18.2">changed = ні</tspan></text>
<line x1="550.0" y1="130.0" x2="670.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="895.0" y1="173.2" x2="895.0" y2="295.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="670.0" y1="330.0" x2="550.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перше коло</text>
<text x="610.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">друге коло</text>
<rect x="110.0" y="463.9" width="430.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="325.0" y="485.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">конвеєр не чіпаємо —</tspan><tspan x="325.0" dy="18.2">повторне коло згасає тут</tspan></text>
<line x1="325.0" y1="373.2" x2="325.0" y2="455.9" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">ідемпотентність тут не оздоба стилю,</tspan><tspan x="610.0" dy="18.2">а те єдине, що зупиняє рекурсію «запис → сигнал → перерахунок»</tspan></text>
</svg>