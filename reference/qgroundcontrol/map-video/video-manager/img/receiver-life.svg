<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя приймача з боку менеджера</text>
<rect x="150.0" y="83.9" width="460.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">зупинено</tspan><tspan x="380.0" dy="18.2">адреса є, потоку нема</tspan></text>
<rect x="150.0" y="213.9" width="460.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">start(timeout)</tspan><tspan x="380.0" dy="18.2">3 с для UDP, 8 с для RTSP</tspan></text>
<rect x="150.0" y="343.9" width="460.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="365.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">onStartComplete(STATUS_OK)</tspan><tspan x="380.0" dy="18.2">приймання пішло</tspan></text>
<rect x="150.0" y="473.9" width="460.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="495.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">startDecoding(стік)</tspan><tspan x="380.0" dy="18.2">кадри йдуть на екран</tspan></text>
<line x1="380.0" y1="140.1" x2="380.0" y2="209.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="270.1" x2="380.0" y2="339.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="400.1" x2="380.0" y2="469.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="640.0" dy="0.0">менеджер запускає приймач,</tspan><tspan x="640.0" dy="16.8">щойно hasVideo() істинний</tspan></text>
<text x="640.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="640.0" dy="0.0">чекання асинхронне:</tspan><tspan x="640.0" dy="16.8">головна нитка не блокується</tspan></text>
<text x="640.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="640.0" dy="0.0">приймання й показ —</tspan><tspan x="640.0" dy="16.8">два окремі кроки</tspan></text>
<text x="640.0" y="491.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="640.0" dy="0.0">кадри в головну нитку</tspan><tspan x="640.0" dy="16.8">не заходять узагалі</tspan></text>
<rect x="150.0" y="543.9" width="460.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="380.0" y="565.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">будь-який інший стан</tspan><tspan x="380.0" dy="18.2">чекання 1 с → нова спроба</tspan></text>
<line x1="140.0" y1="370.0" x2="140.0" y2="537.9" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="140.0" y1="370.0" x2="150.0" y2="370.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="620.0" y1="570.0" x2="620.0" y2="248.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="570.0" x2="620.0" y2="570.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="620.0" y1="248.0" x2="610.0" y2="248.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="880.0" y="536.6" width="290.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="1025.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">з циклу виводять лише двоє:</tspan><tspan x="1025.0" dy="16.9">STATUS_INVALID_URL — адреса бита</tspan><tspan x="1025.0" dy="16.9">hasVideo() хибний — потік вимкнено</tspan></text>
<line x1="634.0" y1="550.0" x2="872.0" y2="550.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>