<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Величини перезапуску й живі величини</text>
<rect x="60.0" y="98.9" width="400.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">адреса зі схемою</tspan><tspan x="260.0" dy="18.2">udp://  udp265://  mpegts://</tspan></text>
<rect x="60.0" y="191.0" width="400.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="212.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">режим низької затримки</tspan></text>
<rect x="60.0" y="271.0" width="400.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="292.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">глибина буфера вирівнювання</tspan></text>
<rect x="530.0" y="181.9" width="320.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="690.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">прапорець змін</tspan><tspan x="690.0" dy="18.2">changed |= (нове ≠ поточного)</tspan></text>
<rect x="940.0" y="181.9" width="300.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="1090.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">перезапуск конвеєра</tspan><tspan x="1090.0" dy="18.2">секунди чорного екрана</tspan></text>
<line x1="470.0" y1="125.0" x2="520.0" y2="193.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="208.0" x2="520.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="288.0" x2="520.0" y2="222.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="860.0" y1="208.0" x2="930.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">читають, коли конвеєр БУДУЮТЬ</text>
<line x1="40.0" y1="372.0" x2="1260.0" y2="372.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7,6"/>
<text x="60.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">читають НА ХОДУ, коли сталася невдача</text>
<rect x="60.0" y="451.9" width="400.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="473.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">автоматичне перепід'єднання</tspan><tspan x="260.0" dy="18.2">rtspAutoReconnect</tspan></text>
<rect x="530.0" y="451.9" width="320.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="473.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">значення передаємо,</tspan><tspan x="690.0" dy="18.2">прапорця НЕ чіпаємо</tspan></text>
<rect x="940.0" y="451.9" width="300.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="1090.0" y="473.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">конвеєр працює далі,</tspan><tspan x="1090.0" dy="18.2">картинка не блимає</tspan></text>
<line x1="470.0" y1="478.0" x2="520.0" y2="478.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="860.0" y1="478.0" x2="930.0" y2="478.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">критерій один: коли саме значення читають —</tspan><tspan x="650.0" dy="18.2">під час побудови ланцюга чи вже під час його роботи</tspan></text>
</svg>