<text x="690.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">порівняння з тим, що вже стоїть у приймача</text>
<text x="630.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="630.0" dy="0.0">перезапуск коштує секунди чорного екрана,</tspan><tspan x="630.0" dy="18.2">тому його ціна платиться лише за справжню зміну</tspan></text>
