<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф походження та бар'єр оптимізації std::launder</text>
<rect x="340.0" y="25.0" width="260.0" height="36.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Фізична адреса сховища: 0x2000</tspan></text>
<rect x="40.0" y="80.0" width="390.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">SSA-граф без бар'єра походження</tspan></text>
<rect x="50.0" y="130.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">%ptr_old = getelementptr ... (об'єкт 1)</tspan><tspan x="235.0" dy="14.3">%val1 = load %ptr_old [!invariant.load]</tspan></text>
<line x1="235.0" y1="174.0" x2="235.0" y2="195.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="198.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="215.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">store 500, %ptr_old (placement new об'єкта 2)</tspan><tspan x="235.0" dy="14.3">Оптимізатор вважає store несуттєвим для %val1</tspan></text>
<line x1="235.0" y1="242.0" x2="235.0" y2="263.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="266.0" width="370.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">%val2 = %val1 (оптимізація Load CSE / ConstProp)</tspan><tspan x="235.0" dy="14.3">Результат: використовується старе значення 100!</tspan></text>
<rect x="510.0" y="80.0" width="390.0" height="34.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">SSA-граф із бар'єром std::launder</tspan></text>
<rect x="520.0" y="130.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">%ptr_old = getelementptr ... (об'єкт 1)</tspan><tspan x="705.0" dy="14.3">%val1 = load %ptr_old [!invariant.load]</tspan></text>
<line x1="705.0" y1="174.0" x2="705.0" y2="195.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="198.0" width="370.0" height="42.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="215.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="705.0" dy="0.0">store 500, %ptr_old (placement new об'єкта 2)</tspan><tspan x="705.0" dy="14.3">%ptr_new = call @llvm.launder(%ptr_old)</tspan></text>
<line x1="705.0" y1="242.0" x2="705.0" y2="263.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520.0" y="266.0" width="370.0" height="52.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">%val2 = load %ptr_new (новий SSA-вузол)</tspan><tspan x="705.0" dy="13.0">Оптимізатор зобов'язаний виконати реальне читання 500!</tspan></text>
<line x1="470.0" y1="80.0" x2="470.0" y2="340.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="470.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">std::launder створює новий SSA-вузол вказівника, відрізаючи спадковість попередніх invariant-метаданих.</text>
</svg>