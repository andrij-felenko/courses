<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розташування об'єкта в пам'яті: звичайний клас, PIMPL і Fast PIMPL</text>
<rect x="50.0" y="40.0" width="280.0" height="36.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="62.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Пряме збереження полів</tspan></text>
<rect x="50.0" y="90.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">Стек / Пам'ять власника (Widget)</tspan></text>
<rect x="50.0" y="135.0" width="280.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">int id_ (4 байта)</tspan></text>
<rect x="50.0" y="180.0" width="280.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">std::string name_ (32 байта)</tspan></text>
<rect x="50.0" y="225.0" width="280.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="250.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">SSL_CTX* ctx_ (8 байтів)</tspan></text>
<rect x="50.0" y="270.0" width="280.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">std::vector&lt;int&gt; buf_ (24 байта)</tspan></text>
<rect x="50.0" y="325.0" width="280.0" height="60.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Разом: sizeof(Widget) = 72 байта</tspan><tspan x="190.0" dy="14.3">Зміна поля змінює розмір об'єкта на стеку!</tspan></text>
<rect x="360.0" y="40.0" width="280.0" height="36.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="61.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">2. Класичний PIMPL (std::unique_ptr)</tspan></text>
<rect x="360.0" y="90.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">Стек (Widget)</tspan></text>
<rect x="360.0" y="135.0" width="280.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">std::unique_ptr&lt;Impl&gt; pImpl_</tspan><tspan x="500.0" dy="15.6">(8 байтів адреси)</tspan></text>
<line x1="500.0" y1="188.0" x2="500.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="225.0" width="280.0" height="130.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="258.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Динамічна купа (Купа/Heap)</tspan><tspan x="500.0" dy="14.3">struct Impl (72 байта):</tspan><tspan x="500.0" dy="14.3">· int id_</tspan><tspan x="500.0" dy="14.3">· std::string name_</tspan><tspan x="500.0" dy="14.3">· SSL_CTX* ctx_</tspan><tspan x="500.0" dy="14.3">· std::vector&lt;int&gt; buf_</tspan></text>
<rect x="360.0" y="370.0" width="280.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">sizeof(Widget) = 8 байтів стабільно</tspan><tspan x="500.0" dy="13.0">Ціна: heap-алокація + розіменування вказівника</tspan></text>
<rect x="670.0" y="40.0" width="280.0" height="36.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="62.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">3. Fast PIMPL (Фіксований буфер)</tspan></text>
<rect x="670.0" y="90.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="810.0" dy="0.0">Стек (Widget)</tspan></text>
<rect x="670.0" y="135.0" width="280.0" height="140.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">alignas(8) std::byte storage_[96]</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">[Усередині буфера через placement new]</tspan><tspan x="810.0" dy="14.3">struct Impl (72 байта)</tspan><tspan x="810.0" dy="14.3">+ 24 байти запасу під майбутні поля</tspan></text>
<rect x="670.0" y="290.0" width="280.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="322.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Купа не задіяна (0 алокацій)</tspan><tspan x="810.0" dy="11.7">Прямий доступ за зсувом без додаткового стрибка</tspan></text>
<rect x="670.0" y="370.0" width="280.0" height="60.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">sizeof(Widget) = 96 байтів фіксовано</tspan><tspan x="810.0" dy="14.3">Обмеження: фіксована стеля розміру Impl</tspan></text>
<text x="500.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Класичний PIMPL обирає повну ізоляцію через купу; Fast PIMPL усуває алокацію ціною резерву на стеку</text>
</svg>