<rect x="370.0" y="196.0" width="340.0" height="66.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">можу підмінити те,</tspan><tspan x="540.0" dy="15.6">чим володіє викликач</tspan></text>
