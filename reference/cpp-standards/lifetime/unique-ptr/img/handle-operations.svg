<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що роблять get, release і reset</text>
<rect x="50.0" y="56.0" width="260.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">операція</tspan></text>
<rect x="330.0" y="56.0" width="330.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">поле-вказівник усередині</tspan></text>
<rect x="690.0" y="56.0" width="260.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">об'єкт у купі</tspan></text>
<rect x="50.0" y="118.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">get()</tspan></text>
<rect x="330.0" y="118.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">лишається без змін</tspan></text>
<rect x="690.0" y="118.0" width="260.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">живий, власник той самий</tspan></text>
<rect x="50.0" y="186.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">release()</tspan></text>
<rect x="330.0" y="186.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">стає нульовим</tspan></text>
<rect x="690.0" y="186.0" width="260.0" height="60.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">живий, але без власника</tspan></text>
<rect x="50.0" y="254.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">reset(p)</tspan></text>
<rect x="330.0" y="254.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">спершу дістає p</tspan></text>
<rect x="690.0" y="254.0" width="260.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">старий гине ПІСЛЯ заміни поля</tspan></text>
<rect x="50.0" y="322.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">reset()</tspan></text>
<rect x="330.0" y="322.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">стає нульовим</tspan></text>
<rect x="690.0" y="322.0" width="260.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">гине негайно</tspan></text>
<rect x="50.0" y="390.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">переміщення</tspan></text>
<rect x="330.0" y="390.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">у джерела — нуль,</tspan><tspan x="495.0" dy="15.6">у приймача — стара адреса</tspan></text>
<rect x="690.0" y="390.0" width="260.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">живий, власник новий</tspan></text>
<rect x="50.0" y="458.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="492.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">~unique_ptr()</tspan></text>
<rect x="330.0" y="458.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="492.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">об'єкт власника зникає</tspan></text>
<rect x="690.0" y="458.0" width="260.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="492.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">гине, якщо поле не нульове</tspan></text>
<text x="500.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лише release розриває зв'язок між адресою і відповідальністю за неї</text>
