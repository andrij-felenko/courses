<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Sized delete у C++14: оптимізація повернення пам'яті</text>
<rect x="40.0" y="20.0" width="860.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="45.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Еволюція деалокації: класичний delete (C++98) проти Sized Delete (C++14)</tspan></text>
<rect x="60.0" y="75.0" width="380.0" height="38.0" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/><text x="250.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">До C++14: operator delete(void* ptr)</tspan></text>
<rect x="60.0" y="125.0" width="380.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Компілятор викликає ptr-&gt;~T()</tspan><tspan x="250.0" dy="15.6">2. Викликає operator delete(ptr) без розміру</tspan></text>
<rect x="60.0" y="185.0" width="380.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">Алокатор пам'яті (tcmalloc / jemalloc):</tspan><tspan x="250.0" dy="14.3">• Мусить читати заголовок сторінки / метадані</tspan><tspan x="250.0" dy="14.3">• Визначає, до якого розмірного класу належав ptr</tspan><tspan x="250.0" dy="14.3">• Зайвий промах повз кеш (cache miss) у гарячому коді</tspan></text>
<rect x="500.0" y="75.0" width="380.0" height="38.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">C++14: operator delete(void* ptr, std::size_t size)</tspan></text>
<rect x="500.0" y="125.0" width="380.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="145.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">1. Компілятор викликає ptr-&gt;~T()</tspan><tspan x="690.0" dy="15.6">2. Знає sizeof(T) статично -&gt; передає розмір одразу!</tspan></text>
<rect x="500.0" y="185.0" width="380.0" height="95.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="690.0" dy="0.0">Алокатор пам'яті (Slab / Size-class aware):</tspan><tspan x="690.0" dy="11.7">• Миттєво знаходить потрібний bin / freelist за size</tspan><tspan x="690.0" dy="11.7">• Нуль звернень до метаданих у пам'яті</tspan><tspan x="690.0" dy="11.7">• Суттєве прискорення викликів deallocate у навантажених системах</tspan></text>
<rect x="40.0" y="305.0" width="860.0" height="85.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Компілятор під час компіляції знає точний розмір повного типу sizeof(T).</tspan><tspan x="470.0" dy="15.6">Sized delete у C++14 передає це знання в алокатор безкоштовно,</tspan><tspan x="470.0" dy="15.6">усуваючи накладні витрати на пошук розміру чанка в таблицях купи.</tspan></text>
</svg>