<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазне виконання виразу delete</text>
<rect x="40.0" y="20.0" width="860.0" height="42.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="46.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Вираз delete ptr: послідовність руйнування та звільнення</tspan></text>
<rect x="50.0" y="90.0" width="210.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Перевірка вказівника:</tspan><tspan x="155.0" dy="15.6">ptr == nullptr ?</tspan></text>
<line x1="155.0" y1="142.0" x2="155.0" y2="215.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="175.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Так</text>
<rect x="60.0" y="220.0" width="190.0" height="46.0" rx="6" fill="#f5f5f5" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="239.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="155.0" dy="0.0">Безпечний вихід (no-op)</tspan><tspan x="155.0" dy="14.3">жодних дій не виконується</tspan></text>
<line x1="260.0" y1="116.0" x2="315.0" y2="116.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="285.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ні</text>
<rect x="320.0" y="90.0" width="265.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="452.5" y="104.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">Фаза 1: Знищення об'єкта</tspan><tspan x="452.5" dy="15.6">виклик ptr-&gt;~T()</tspan><tspan x="452.5" dy="15.6">(кінець часу життя об'єкта)</tspan></text>
<line x1="585.0" y1="116.0" x2="640.0" y2="116.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="645.0" y="90.0" width="255.0" height="52.0" rx="6" fill="#e8f4fd" stroke="#1976d2" stroke-width="1.5"/><text x="772.5" y="104.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0d47a1" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Фаза 2: Повернення пам'яті</tspan><tspan x="772.5" dy="15.6">operator delete(ptr)</tspan><tspan x="772.5" dy="15.6">або sized delete (C++14)</tspan></text>
<line x1="772.0" y1="142.0" x2="772.0" y2="215.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="635.0" y="220.0" width="275.0" height="54.0" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/><text x="772.5" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Пам'ять повернено алокатору.</tspan><tspan x="772.5" dy="13.0">Вказівник ptr стає висячим (dangling)!</tspan></text>
<rect x="40.0" y="325.0" width="860.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Деструктор завершує час життя об'єкта до того, як байти повертаються в купу.</tspan><tspan x="470.0" dy="15.6">Перевірка на nullptr гарантована стандартом: виклик delete nullptr є повністю безпечним.</tspan></text>
</svg>