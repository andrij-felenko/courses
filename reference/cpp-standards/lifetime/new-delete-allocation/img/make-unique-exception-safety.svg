<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виняткобезпека: пастка виклику з сирим new та захист std::make_unique</text>
<rect x="40.0" y="20.0" width="860.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="45.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Чому вираз new у викликах функцій небезпечний до C++17</tspan></text>
<rect x="60.0" y="75.0" width="820.0" height="36.0" rx="6" fill="#2b303c" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#f8f8f2" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">process(std::unique_ptr&lt;A&gt;(new A()), std::unique_ptr&lt;B&gt;(new B()));</tspan></text>
<rect x="60.0" y="125.0" width="820.0" height="105.0" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/><text x="470.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e65100" text-anchor="middle"><tspan x="470.0" dy="0.0">Один із дозволених стандартів порядку чергування інструкцій компілятором:</tspan><tspan x="470.0" dy="15.6">1. operator new(sizeof(A)) -&gt; успіх, пам'ять виділено</tspan><tspan x="470.0" dy="15.6">2. operator new(sizeof(B)) -&gt; успіх, пам'ять виділено</tspan><tspan x="470.0" dy="15.6">3. Конструктор A::A() -&gt; успіх</tspan><tspan x="470.0" dy="15.6">4. Конструктор B::B() -&gt; ВИКИДАЄ ВИНЯТОК! 💥</tspan></text>
<rect x="60.0" y="245.0" width="395.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="257.5" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="257.5" dy="0.0">Наслідок аварії:</tspan><tspan x="257.5" dy="13.0">• Пам'ять під B очиститься автоматичним відкатом</tspan><tspan x="257.5" dy="13.0">• std::unique_ptr&lt;A&gt; ЩЕ НЕ СТВОРЕНО!</tspan><tspan x="257.5" dy="13.0">• Об'єкт A і його пам'ять втрачено назавжди (витік пам'яті!).</tspan></text>
<rect x="485.0" y="245.0" width="395.0" height="85.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="682.5" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="682.5" dy="0.0">Рішення: std::make_unique&lt;T&gt;()</tspan><tspan x="682.5" dy="11.7">process(std::make_unique&lt;A&gt;(), std::make_unique&lt;B&gt;());</tspan><tspan x="682.5" dy="11.7">Виділення та передача володіння в RAII-обгортку неподільні (атомарні) в межах одного виклику функції.</tspan></text>
<rect x="40.0" y="350.0" width="860.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Сирий new залишає небезпечну часову щілину між виділенням ресурсу й передачею його розумному покажчику.</tspan><tspan x="470.0" dy="15.6">Фабричні функції std::make_unique та std::make_shared гарантують повну виняткобезпеку за будь-яких умов.</tspan></text>
</svg>