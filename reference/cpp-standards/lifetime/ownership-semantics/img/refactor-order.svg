<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 448" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="448" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="112.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">крок переписування</text>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">що перестає збиратися</text>
<text x="812.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">що саме це виявляє</text>
<rect x="24.0" y="54.0" width="176.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="112.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">1. повернення</tspan><tspan x="112.0" dy="15.6">фабрики</tspan></text>
<rect x="212.0" y="54.0" width="416.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Codec* c = make_codec(&quot;h264&quot;);</tspan><tspan x="420.0" dy="15.6">free_codec(c);</tspan></text>
<rect x="648.0" y="54.0" width="328.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">усі місця, що вважали</tspan><tspan x="812.0" dy="15.6">себе власниками кодека</tspan></text>
<rect x="24.0" y="138.0" width="176.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="112.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">2. явні</tspan><tspan x="112.0" dy="15.6">приймачі</tspan></text>
<rect x="212.0" y="138.0" width="416.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">set_sink(c, new FileSink(path));</tspan><tspan x="420.0" dy="15.6">set_sink(c, &amp;sink_on_stack);</tspan></text>
<rect x="648.0" y="138.0" width="328.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">справжня помилка: звільнення</tspan><tspan x="812.0" dy="15.6">об'єкта зі стека</tspan></text>
<rect x="24.0" y="222.0" width="176.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="112.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">3. співволодіння</tspan><tspan x="112.0" dy="15.6">там, де воно є</tspan></text>
<rect x="212.0" y="222.0" width="416.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">submit(c.get(), &amp;frame);</tspan></text>
<rect x="648.0" y="222.0" width="328.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">місця, де об'єкт мусить</tspan><tspan x="812.0" dy="15.6">пережити виклик</tspan></text>
<rect x="24.0" y="306.0" width="176.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="112.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">4. позичання</tspan></text>
<rect x="212.0" y="306.0" width="416.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">probe(c.get(), &amp;frame);   // сотні рядків</tspan></text>
<rect x="648.0" y="306.0" width="328.0" height="72.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">нічого нового — заміна</tspan><tspan x="812.0" dy="15.6">механічна, тому остання</tspan></text>
<text x="500.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожна помилка збирання — рядок, у якому досі жило неперевірене припущення про час життя.</text>
</svg>