<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диспетчеризація віртуального деструктора через vtable</text>
<rect x="40.0" y="50.0" width="240.0" height="260.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="160.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">Екземпляр Derived</text>
<rect x="55.0" y="95.0" width="210.0" height="48.0" rx="4" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">vptr (покажчик vtable)</text>
<text x="160.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вказує на vtable Derived</text>
<rect x="55.0" y="155.0" width="210.0" height="50.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="160.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Поля базового класу Base</text>
<text x="160.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">int base_id, flags...</text>
<rect x="55.0" y="215.0" width="210.0" height="75.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="160.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Поля похідного класу</text>
<text x="160.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">std::vector&lt;char&gt; buffer</text>
<text x="160.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">int socket_fd...</text>
<line x1="265.0" y1="119.0" x2="368.0" y2="119.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="50.0" width="270.0" height="260.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.4"/>
<text x="505.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">vtable для Derived (Itanium ABI)</text>
<rect x="385.0" y="95.0" width="240.0" height="36.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="505.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">offset-to-top (0) / RTTI ptr</text>
<rect x="385.0" y="138.0" width="240.0" height="42.0" rx="3" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="505.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Слот D1: Complete Dtor</text>
<text x="505.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">руйнує члени й бази без free()</text>
<rect x="385.0" y="188.0" width="240.0" height="46.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="505.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Слот D0: Deleting Dtor</text>
<text x="505.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">викликає D1 + operator delete</text>
<rect x="385.0" y="242.0" width="240.0" height="36.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="505.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Інші віртуальні методи (render...)</text>
<rect x="680.0" y="50.0" width="220.0" height="260.0" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.4"/>
<text x="790.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Виконання delete p;</text>
<text x="790.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">1. Отримання vptr</text>
<text x="790.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">p-&gt;vptr</text>
<text x="790.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Виклик слота D0</text>
<text x="790.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">vtable[D0_slot](p)</text>
<text x="790.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Руйнування об'єкта</text>
<text x="790.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">~Derived() → ~Base()</text>
<text x="790.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">4. Звільнення пам'яті</text>
<text x="790.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">operator delete(p, sizeof(D))</text>
<text x="790.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Пам'ять чиста</text>
<line x1="625.0" y1="211.0" x2="678.0" y2="211.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="860.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Компілятор розбиває віртуальний деструктор на дві сутності в ABI:</tspan><tspan x="470.0" dy="14.3">• D1 (Complete Object) викликається для автоматичних і статичних об'єктів (де пам'ять звільняє стек/сегмент).</tspan><tspan x="470.0" dy="14.3">• D0 (Deleting Destructor) викликається оператором delete для динамічних об'єктів (виконує руйнування та викликає operator delete).</tspan></text>
</svg>