<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік ресурсів та UB при невіртуальному видаленні</text>
<rect x="40.0" y="30.0" width="410.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="54.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Без virtual: статичний виклик ~Base()</tspan></text>
<rect x="490.0" y="30.0" width="410.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="54.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">З virtual: динамічний виклик ~Derived()</tspan></text>
<rect x="40.0" y="85.0" width="410.0" height="230.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Об'єкт Derived у динамічній пам'яті (купа)</text>
<rect x="60.0" y="125.0" width="370.0" height="50.0" rx="4" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/>
<text x="245.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Частина Base (vptr або поля бази)</text>
<text x="245.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Зруйновано: викликано ~Base()</text>
<rect x="60.0" y="185.0" width="370.0" height="115.0" rx="4" fill="#fff3f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Частина Derived (члени похідного класу)</text>
<text x="245.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• GPU-дескриптори (VkDevice, OpenGL ID) → витік</text>
<text x="245.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">• Динамічні буфери (std::vector, std::string) → витік</text>
<text x="245.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">• Деструктор ~Derived() НЕ викликано взагалі!</text>
<rect x="40.0" y="328.0" width="410.0" height="80.0" rx="6" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Наслідки delete (Base*)p:</tspan><tspan x="245.0" dy="11.7">1. Витік ресурсів, захоплених похідним класом.</tspan><tspan x="245.0" dy="11.7">2. Sized deallocation: деалокатор дістає sizeof(Base) замість sizeof(Derived) → руйнування пулів пам'яті.</tspan><tspan x="245.0" dy="11.7">3. За стандартом [expr.delete] — невизначена поведінка (UB)!</tspan></text>
<rect x="490.0" y="85.0" width="410.0" height="230.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="695.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Об'єкт Derived у динамічній пам'яті (купа)</text>
<rect x="510.0" y="125.0" width="370.0" height="50.0" rx="4" fill="#eef7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="695.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Частина Base (vptr → vtable Derived)</text>
<text x="695.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Зруйновано коректно: викликано ~Base()</text>
<rect x="510.0" y="185.0" width="370.0" height="115.0" rx="4" fill="#eef7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="695.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Частина Derived (члени похідного класу)</text>
<text x="695.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• GPU-дескриптори звільнено через vkDestroyDevice</text>
<text x="695.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• Внутрішні буфери очищено деструкторами членів</text>
<text x="695.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">• Деструктор ~Derived() викликано через vtable (D0)</text>
<rect x="490.0" y="328.0" width="410.0" height="80.0" rx="6" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Результат delete (Base*)p:</tspan><tspan x="695.0" dy="13.0">1. Повне та коректне розгортання ланцюга деструкторів.</tspan><tspan x="695.0" dy="13.0">2. Деалокація з точним розміром повного об'єкта sizeof(Derived).</tspan><tspan x="695.0" dy="13.0">3. Коректна базова адреса пам'яті навіть при множинному успадкуванні.</tspan></text>
</svg>