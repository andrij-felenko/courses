<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Продовження життя тримається лише на цілому ланцюгу</text>
<rect x="20.0" y="44.0" width="450.0" height="356.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="38.0" y="58.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">const Point&amp; r = make_box().tl;</tspan></text>
<rect x="38.0" y="108.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">посилання r</tspan></text>
<rect x="38.0" y="152.0" width="414.0" height="32.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="245.0" dy="0.0">крок «.tl» — доступ до члена: у списку</tspan></text>
<rect x="38.0" y="192.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">підоб'єкт tl усередині тимчасового</tspan></text>
<rect x="38.0" y="236.0" width="414.0" height="32.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="245.0" dy="0.0">крок «матеріалізація prvalue»: у списку</tspan></text>
<rect x="38.0" y="276.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">тимчасовий Box</tspan></text>
<rect x="38.0" y="336.0" width="414.0" height="50.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">ланцюг цілий: увесь Box живе стільки, скільки r</tspan></text>
<rect x="510.0" y="44.0" width="450.0" height="356.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="528.0" y="58.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">const std::string&amp; r = std::min(make(), s);</tspan></text>
<rect x="528.0" y="108.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">посилання r</tspan></text>
<rect x="528.0" y="152.0" width="414.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="735.0" dy="0.0">крок «виклик min()»: у списку його немає</tspan></text>
<rect x="528.0" y="192.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">ланцюг обірвано на першому ж кроці</tspan></text>
<rect x="528.0" y="236.0" width="414.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="735.0" dy="0.0">далі діє звичайне правило повного виразу</tspan></text>
<rect x="528.0" y="276.0" width="414.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">тимчасовий std::string</tspan></text>
<rect x="528.0" y="336.0" width="414.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">тимчасовий гине на «;» — r висить, а код збирається</tspan></text>
<text x="490.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Продовження вмикає не тип і не намір, а форма шляху: кожен крок від посилання до тимчасового мусить бути зі списку.</text>
</svg>