<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тимчасовий об'єкт: повний вираз проти продовження життя</text>
<rect x="30.0" y="44.0" width="860.0" height="158.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="52.0" y="62.0" width="500.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">const char* p = make().c_str();</tspan></text>
<rect x="52.0" y="118.0" width="214.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="159.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="159.0" dy="0.0">тимчасовий рядок</tspan><tspan x="159.0" dy="15.6">живий</tspan></text>
<rect x="282.0" y="118.0" width="270.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="417.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="417.0" dy="0.0">крапка з комою —</tspan><tspan x="417.0" dy="15.6">тимчасовий знищено, p висить</tspan></text>
<rect x="586.0" y="90.0" width="282.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="727.0" y="119.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="727.0" dy="0.0">звернення за p —</tspan><tspan x="727.0" dy="16.9">невизначена поведінка</tspan></text>
<rect x="30.0" y="230.0" width="860.0" height="158.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="52.0" y="248.0" width="500.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">const std::string&amp; r = make();</tspan></text>
<rect x="52.0" y="304.0" width="500.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="302.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="302.0" dy="0.0">тимчасовий живе рівно стільки, скільки посилання r — до кінця блока</tspan></text>
<rect x="586.0" y="276.0" width="282.0" height="66.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="727.0" y="305.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="727.0" dy="0.0">продовження життя</tspan><tspan x="727.0" dy="16.9">спрацювало</tspan></text>
<text x="460.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Різниця не в типі результату, а в тому, що зв'язали: посилання з самим тимчасовим чи вказівник з його нутрощами.</text>
</svg>