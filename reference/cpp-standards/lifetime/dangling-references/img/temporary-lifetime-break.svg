<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380">
<rect x="0.0" y="0.0" width="820.0" height="380.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="210.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Пряме зв'язування: подовження ДІЄ</text>
<text x="610.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Опосередкований виклик: подовження НЕ діє</text>
<line x1="410.0" y1="20.0" x2="410.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="50.0" y="66.0" width="320.0" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">const std::string&amp; ref = get_name();</tspan></text>
<rect x="70.0" y="138.2" width="280.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Тимчасовий рядок std::string</tspan><tspan x="210.0" dy="15.6">(матеріалізований prvalue)</tspan></text>
<line x1="210.0" y1="105.0" x2="210.0" y2="130.0" stroke="#27ae60" stroke-width="2.0"/>
<polygon points="205,130 210,140 215,130" fill="#27ae60"/>
<text x="300.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">зв'язує безпосередньо</text>
<rect x="50.0" y="230.0" width="320.0" height="36.0" rx="4" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Час життя тимчасового = часу життя ref</text>
<rect x="50.0" y="296.4" width="320.0" height="37.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Деструктор тимчасового об'єкта викличеться</tspan><tspan x="210.0" dy="14.3">лише наприкінці блоку, де оголошено ref</tspan></text>
<rect x="448.1" y="66.0" width="323.8" height="28.0" rx="6" fill="#fdeeed" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">const auto&amp; ref = std::min(get_a(), get_b());</tspan></text>
<rect x="441.0" y="141.3" width="338.0" height="37.3" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">std::min(const T&amp; a, const T&amp; b) повертає 'const T&amp;'</tspan><tspan x="610.0" dy="14.3">(компілятор не аналізує тіло функції)</tspan></text>
<line x1="610.0" y1="105.0" x2="610.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<polygon points="605,130 610,140 615,130" fill="#c0392b"/>
<rect x="450.0" y="230.0" width="150.0" height="36.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="525.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Живий до крапки з комою ';'</text>
<rect x="605.0" y="230.0" width="165.0" height="36.0" rx="4" fill="#eaecee" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="687.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Мертвий об'єкт (dangling!)</text>
<rect x="425.3" y="296.4" width="369.4" height="37.3" rx="6" fill="#fdeeed" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">ref вказує на зруйнований об'єкт уже на наступному рядку:</tspan><tspan x="610.0" dy="14.3">читання через ref — невизначена поведінка (UB)</tspan></text>
</svg>