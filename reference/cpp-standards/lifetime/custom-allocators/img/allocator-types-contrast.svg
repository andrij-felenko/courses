<rect x="734.0" y="160.0" width="156.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="183.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="812.0" dy="0.0">T живий</tspan></text>
<rect x="650.0" y="215.0" width="240.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">• Всі блоки однакового розміру</tspan><tspan x="770.0" dy="11.7">• Вільні слоти зв'язані у список (free-list)</tspan><tspan x="770.0" dy="11.7">• O(1) поштучне виділення й звільнення</tspan></text>
<rect x="40.0" y="300.0" width="860.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Висновки для архітектури:</tspan><tspan x="470.0" dy="15.6">• Арена ідеальна для короткоживучих задач кадру або HTTP-запиту: тисячі дрібних об'єктів без оверхеду на free().</tspan><tspan x="470.0" dy="15.6">• Пул фіксованих блоків ідеальний для вузлів std::list, std::map та графів: усуває фрагментацію й прискорює кеш.</tspan><tspan x="470.0" dy="15.6">• Загальна купа лишається для довгоживучих об'єктів довільного непередбачуваного розміру.</tspan></text>
</svg>