<rect x="640.0" y="100.0" width="260.0" height="170.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="650.0" y="110.0" width="72.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="686.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="686.0" dy="0.0">T живий</tspan></text>
