<line x1="525.0" y1="185.0" x2="525.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="525.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">cursor →</text>
<rect x="350.0" y="215.0" width="240.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">• Виділення: O(1) зсув вказівника</tspan><tspan x="470.0" dy="13.0">• Нульова внутрішня фрагментація</tspan><tspan x="470.0" dy="13.0">• Звільнення: тільки всієї арени разом</tspan></text>
