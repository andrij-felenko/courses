<rect x="810.0" y="110.0" width="80.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="850.0" dy="0.0">T живий</tspan></text>
