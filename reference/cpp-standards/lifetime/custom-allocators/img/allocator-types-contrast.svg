<rect x="50.0" y="210.0" width="240.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">• Оверхед на заголовок кожного блоку</tspan><tspan x="170.0" dy="13.0">• Фрагментація пам'яті</tspan><tspan x="170.0" dy="13.0">• Мютекси між потоками</tspan></text>
