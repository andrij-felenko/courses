<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення виділення байтів і часу життя об'єкта</text>
<rect x="60.0" y="50.0" width="820.0" height="52.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="72.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Контейнер (наприклад std::vector&lt;Widget, Alloc&gt;)</tspan><tspan x="470.0" dy="16.9">Керує логікою: ємність, розмір, індексація, збереження інваріантів</tspan></text>
<line x1="260.0" y1="106.0" x2="260.0" y2="146.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="106.0" x2="680.0" y2="146.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 · виділення сирих байтів</text>
<text x="680.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 · створення й руйнування</text>
<rect x="60.0" y="150.0" width="400.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">std::allocator_traits&lt;Alloc&gt;::allocate(a, n)</tspan><tspan x="260.0" dy="15.6">Повертає сирий покажчик на неініціалізовану пам'ять T*</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">std::allocator_traits&lt;Alloc&gt;::deallocate(a, p, n)</tspan><tspan x="260.0" dy="15.6">Повертає байти до джерела без виклику деструкторів</tspan></text>
<rect x="480.0" y="150.0" width="400.0" height="180.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="200.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">std::allocator_traits&lt;Alloc&gt;::construct(a, p, args...)</tspan><tspan x="680.0" dy="14.3">::new (static_cast&lt;void*&gt;(p)) T(args...)</tspan><tspan x="680.0" dy="14.3">Початок часу життя: виклик конструктора на готових байтах</tspan><tspan x="680.0" dy="14.3"></tspan><tspan x="680.0" dy="14.3">std::allocator_traits&lt;Alloc&gt;::destroy(a, p)</tspan><tspan x="680.0" dy="14.3">p-&gt;~T()</tspan><tspan x="680.0" dy="14.3">Кінець часу життя: явний виклик деструктора</tspan></text>
<line x1="260.0" y1="334.0" x2="260.0" y2="376.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сирі байти</text>
<rect x="60.0" y="380.0" width="820.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Джерело байтів (OS / malloc / Арена / Пул / Стек-буфер)</tspan><tspan x="470.0" dy="16.9">Знає лише про кількість байтів і вирівнювання (alignof); нічого не знає про типи</tspan></text>
</svg>