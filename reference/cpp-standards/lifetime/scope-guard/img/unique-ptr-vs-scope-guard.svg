<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння std::unique_ptr та scope_guard</text>
<rect x="50.0" y="40.0" width="220.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Критерій</tspan></text>
<rect x="290.0" y="40.0" width="320.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">std::unique_ptr&lt;T, Deleter&gt;</tspan></text>
<rect x="630.0" y="40.0" width="320.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">std::scope_exit&lt;EF&gt; / ScopeGuard</tspan></text>
<rect x="50.0" y="100.0" width="220.0" height="60.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Що зберігає</tspan></text>
<rect x="290.0" y="100.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вказівник або дескриптор ресурсу (T*)</tspan></text>
<rect x="630.0" y="100.0" width="320.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Довільний виконуваний об'єкт (лямбда, функтор)</tspan></text>
<rect x="50.0" y="175.0" width="220.0" height="60.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">У чому суть володіння</tspan></text>
<rect x="290.0" y="175.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Володіння дискретним об'єктом у пам'яті / ОС</tspan></text>
<rect x="630.0" y="175.0" width="320.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Керування виконанням відкладеної дії у потоці</tspan></text>
<rect x="50.0" y="250.0" width="220.0" height="60.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Умова виклику очищення</tspan></text>
<rect x="290.0" y="250.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вказівник не дорівнює nullptr</tspan></text>
<rect x="630.0" y="250.0" width="320.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Прапорець active == true (та стан винятків)</tspan></text>
<rect x="50.0" y="325.0" width="220.0" height="60.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Скасування / передача</tspan></text>
<rect x="290.0" y="325.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">release() повертає T* і обнуляє поле</tspan></text>
<rect x="630.0" y="325.0" width="320.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">release() / dismiss() скидає прапорець active</tspan></text>
<rect x="50.0" y="400.0" width="220.0" height="60.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Типове призначення</tspan></text>
<rect x="290.0" y="400.0" width="320.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Керування пам'яттю, файловими дескрипторами, сокетами</tspan></text>
<rect x="630.0" y="400.0" width="320.0" height="60.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="433.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Транзакційні відкати, зміна стану змінних, закриття блоків</tspan></text>
<rect x="50.0" y="475.0" width="900.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="500.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">unique_ptr керує адресою об'єкта; scope_guard керує виконанням дії на межі області видимості.</tspan></text>
</svg>