<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різновиди охоронців та їхня логіка спрацювання</text>
<rect x="50.0" y="40.0" width="260.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Різновид охоронця</tspan></text>
<rect x="330.0" y="40.0" width="340.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Умова спрацювання в деструкторі</tspan></text>
<rect x="690.0" y="40.0" width="260.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Коли застосовується</tspan></text>
<rect x="50.0" y="100.0" width="260.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">SCOPE_EXIT</tspan><tspan x="180.0" dy="16.9">std::scope_exit</tspan></text>
<rect x="330.0" y="100.0" width="340.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">uncaught_exceptions() &gt;= 0</tspan><tspan x="500.0" dy="15.6">(виконується ЗАВЖДИ, якщо активний)</tspan></text>
<rect x="690.0" y="100.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Звільнення ресурсів, зняття блокувань, закриття дескрипторів</tspan></text>
<rect x="50.0" y="200.0" width="260.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">SCOPE_FAIL</tspan><tspan x="180.0" dy="16.9">std::scope_fail</tspan></text>
<rect x="330.0" y="200.0" width="340.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">uncaught_exceptions() &gt; uncaught_on_entry</tspan><tspan x="500.0" dy="15.6">(лише коли вилітає НОВИЙ виняток)</tspan></text>
<rect x="690.0" y="200.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Відкат транзакції, видалення сміття після збою, запис логу помилки</tspan></text>
<rect x="50.0" y="300.0" width="260.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">SCOPE_SUCCESS</tspan><tspan x="180.0" dy="16.9">std::scope_success</tspan></text>
<rect x="330.0" y="300.0" width="340.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">uncaught_exceptions() &lt;= uncaught_on_entry</tspan><tspan x="500.0" dy="15.6">(лише при УСПІШНОМУ виході)</tspan></text>
<rect x="690.0" y="300.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="343.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Фіксація транзакції (commit), оновлення кешу, сповіщення підписників</tspan></text>
<rect x="50.0" y="410.0" width="900.0" height="80.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Механізм C++17 std::uncaught_exceptions() повертає кількість активних винятків у поточному потоці.</tspan><tspan x="500.0" dy="15.6">Запам'ятовуючи це число під час конструювання, охоронець безпомилково розрізняє нормальний вихід</tspan><tspan x="500.0" dy="15.6">і розгортання стека навіть у разі вкладеної обробки помилок всередині деструкторів.</tspan></text>
</svg>