<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок виконання дій при розгортанні стека</text>
<rect x="50.0" y="40.0" width="420.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Прямий хід: реєстрація дій (вхід у блок)</tspan></text>
<rect x="530.0" y="40.0" width="420.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Зворотний хід: спрацювання деструкторів (вихід)</tspan></text>
<rect x="50.0" y="100.0" width="420.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="128.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Створено тимчасовий файл</tspan><tspan x="260.0" dy="15.6">→ зареєстровано Guard 1: видалити файл</tspan></text>
<rect x="50.0" y="180.0" width="420.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">2. Виділено системний буфер</tspan><tspan x="260.0" dy="15.6">→ зареєстровано Guard 2: звільнити пам'ять</tspan></text>
<rect x="50.0" y="260.0" width="420.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="288.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">3. Змінено прапорець транзакції</tspan><tspan x="260.0" dy="15.6">→ зареєстровано Guard 3: скинути прапорець</tspan></text>
<rect x="50.0" y="340.0" width="420.0" height="64.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">4. Збій мережі / кинуто виняток!</tspan><tspan x="260.0" dy="15.6">Обчислення переривається, починається розгортання</tspan></text>
<line x1="260.0" y1="164.0" x2="260.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="244.0" x2="260.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="324.0" x2="260.0" y2="340.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="100.0" width="420.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="128.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Крок 3: ~Guard 1()</tspan><tspan x="740.0" dy="15.6">Видалення тимчасового файлу з диска</tspan></text>
<rect x="530.0" y="180.0" width="420.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Крок 2: ~Guard 2()</tspan><tspan x="740.0" dy="15.6">Звільнення виділеної оперативної пам'яті</tspan></text>
<rect x="530.0" y="260.0" width="420.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="288.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Крок 1: ~Guard 3()</tspan><tspan x="740.0" dy="15.6">Відновлення вихідного стану прапорця</tspan></text>
<rect x="530.0" y="340.0" width="420.0" height="64.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Початок розгортання стека (LIFO)</tspan><tspan x="740.0" dy="15.6">Деструктори автоматичних об'єктів кличуться назад</tspan></text>
<line x1="740.0" y1="340.0" x2="740.0" y2="324.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="260.0" x2="740.0" y2="244.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="180.0" x2="740.0" y2="164.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="372.0" x2="530.0" y2="372.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="430.0" width="900.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="453.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">Об'єкти на стеку знищуються у порядку, строго протилежному до їх створення.</tspan><tspan x="500.0" dy="15.6">Кожен охоронець скасовує рівно свій крок, гарантуючи повний відкат до вихідного стану.</tspan></text>
</svg>