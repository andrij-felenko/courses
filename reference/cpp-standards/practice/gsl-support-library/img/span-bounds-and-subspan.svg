<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура та операції gsl::span</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Структура gsl::span&lt;T&gt;: безпечний невласницький перегляд діапазону</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Об'єкт gsl::span&lt;int&gt; на стеку (16 байтів у dynamic_extent):</text>
<rect x="50.0" y="85.0" width="400.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="104.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">┌───────────────────────┬───────────────────────┐</tspan><tspan x="250.0" dy="14.3">│ ptr_: int* (8 байтів) │ size_: ptrdiff_t (8B) │</tspan><tspan x="250.0" dy="14.3">│ вказує на початок     │ кількість елементів   │</tspan><tspan x="250.0" dy="14.3">└───────────────────────┴───────────────────────┘</tspan></text>
<line x1="455.0" y1="122.0" x2="535.0" y2="122.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Суцільний буфер даних у heap або stack:</text>
<rect x="540.0" y="85.0" width="370.0" height="75.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="725.0" y="104.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">┌─────────┬─────────┬─────────┬─────────┬─────────┐</tspan><tspan x="725.0" dy="14.3">│ elem[0] │ elem[1] │ elem[2] │ elem[3] │ elem[4] │</tspan><tspan x="725.0" dy="14.3">│  0x1000 │  0x1004 │  0x1008 │  0x100C │  0x1010 │</tspan><tspan x="725.0" dy="14.3">└─────────┴─────────┴─────────┴─────────┴─────────┘</tspan></text>
<line x1="40.0" y1="185.0" x2="920.0" y2="185.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="50.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Контроль меж (Bounds Checking)</text>
<rect x="50.0" y="230.0" width="420.0" height="170.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Індексація span[index]:</tspan><tspan x="260.0" dy="13.0"></tspan><tspan x="260.0" dy="13.0">• Умова валідності: 0 &lt;= index &lt; span.size()</tspan><tspan x="260.0" dy="13.0">• При коректному index: прямий доступ O(1) *(ptr_ + index)</tspan><tspan x="260.0" dy="13.0">• При виході за межі (index &gt;= 5 або index &lt; 0):</tspan><tspan x="260.0" dy="13.0">  - Спрацьовує Expects(index &lt; size_)</tspan><tspan x="260.0" dy="13.0">  - Виклик std::terminate() або викидання винятку</tspan><tspan x="260.0" dy="13.0">  - Повністю усувається вразливість Buffer Overflow</tspan></text>
<text x="490.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Операція піддіапазону (subspan)</text>
<rect x="490.0" y="230.0" width="420.0" height="170.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Створення підвибірки: span.subspan(1, 3)</tspan><tspan x="700.0" dy="13.0"></tspan><tspan x="700.0" dy="13.0">• Не копіює жодного байта з масиву!</tspan><tspan x="700.0" dy="13.0">• Створює новий дескриптор span:</tspan><tspan x="700.0" dy="13.0">  - new_ptr = ptr_ + 1 (0x1004)</tspan><tspan x="700.0" dy="13.0">  - new_size = 3 (елементи 1, 2, 3)</tspan><tspan x="700.0" dy="13.0">• Статична безпека: межі перевіряються під час створення subspan</tspan><tspan x="700.0" dy="13.0">• Підтримує перетворення у gsl::as_bytes(span)</tspan></text>
</svg>