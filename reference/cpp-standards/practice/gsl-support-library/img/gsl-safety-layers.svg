<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівнева модель безпеки GSL</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Багаторівнева модель безпеки: C++ Core Guidelines та бібліотека GSL</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Рівень 1: Статичний аналіз вихідного коду (MSVC C++ Core Check, Clang-Tidy)</text>
<rect x="50.0" y="90.0" width="860.0" height="85.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Правила Lifetime, Bounds та Type Profile:</tspan><tspan x="480.0" dy="14.3">• Відстеження життєвого циклу посилань і вказівників без оверхеду в бінарнику</tspan><tspan x="480.0" dy="14.3">• Виявлення використання вивільненої пам'яті (Use-After-Free) та dangling посилань</tspan><tspan x="480.0" dy="14.3">• Заборона сирої арифметики вказівників (Bounds.1) та неявних звужуючих приведень (ES.46)</tspan></text>
<text x="50.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Рівень 2: Типобезпечні обгортки GSL (Type-Rich Zero-Overhead Abstractions)</text>
<rect x="50.0" y="215.0" width="275.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="187.5" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="187.5" dy="0.0">gsl::not_null&lt;T*&gt;</tspan><tspan x="187.5" dy="14.3"></tspan><tspan x="187.5" dy="14.3">• Гарантія ненульового стану</tspan><tspan x="187.5" dy="14.3">• Заборона nullptr на етапі збірки</tspan><tspan x="187.5" dy="14.3">• Нульовий оверхед у регістрах</tspan></text>
<rect x="342.0" y="215.0" width="275.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="479.5" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="479.5" dy="0.0">gsl::owner&lt;T*&gt;</tspan><tspan x="479.5" dy="14.3"></tspan><tspan x="479.5" dy="14.3">• Маркер володіння ресурсом</tspan><tspan x="479.5" dy="14.3">• Аліас типу для лінтерів</tspan><tspan x="479.5" dy="14.3">• Вимога явного delete/RAII</tspan></text>
<rect x="635.0" y="215.0" width="275.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">gsl::span&lt;T&gt;</tspan><tspan x="772.5" dy="14.3"></tspan><tspan x="772.5" dy="14.3">• Неперервний зріз пам'яті</tspan><tspan x="772.5" dy="14.3">• Автоматичний облік розміру</tspan><tspan x="772.5" dy="14.3">• Захист від Buffer Overflow</tspan></text>
<text x="50.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Рівень 3: Динамічний контроль, звуження та очищення ресурсів</text>
<rect x="50.0" y="350.0" width="420.0" height="70.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Контроль переповнень: gsl::narrow / narrow_cast</tspan><tspan x="260.0" dy="13.0">• gsl::narrow&lt;T&gt;(val): перевірка втрати бітів/знаку -&gt; narrowing_error</tspan><tspan x="260.0" dy="13.0">• gsl::narrow_cast&lt;T&gt;(val): явне документоване звуження без перевірки</tspan></text>
<rect x="490.0" y="350.0" width="420.0" height="70.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Контракти та Scope Guard: Expects / Ensures / finally</tspan><tspan x="700.0" dy="11.7">• Expects(cond) / Ensures(cond): преумови та постумови функцій</tspan><tspan x="700.0" dy="11.7">• gsl::finally([&amp;]{ ... }): гарантоване очищення під час виходу зі scope</tspan></text>
</svg>