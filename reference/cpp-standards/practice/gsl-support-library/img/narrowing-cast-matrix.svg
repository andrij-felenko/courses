<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звужуючі перетворення у GSL</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Звужуючі перетворення: безпечний gsl::narrow проти неявного касту</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Традиційний static_cast&lt;Target&gt;(v)</text>
<rect x="50.0" y="95.0" width="270.0" height="170.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Поведінка:</tspan><tspan x="185.0" dy="13.0">• Мовчазне відкидання старших бітів</tspan><tspan x="185.0" dy="13.0">• Зміна знаку при знакових/незнакових типах</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">Приклад аварії:</tspan><tspan x="185.0" dy="13.0">int big = 300;</tspan><tspan x="185.0" dy="13.0">char c = static_cast&lt;char&gt;(big);</tspan><tspan x="185.0" dy="13.0">// c == 44 (втрата даних 300 != 44!)</tspan><tspan x="185.0" dy="13.0">Компілятор мовчить, баг іде в production.</tspan></text>
<text x="345.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Явний gsl::narrow_cast&lt;Target&gt;(v)</text>
<rect x="345.0" y="95.0" width="270.0" height="170.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Поведінка:</tspan><tspan x="480.0" dy="13.0">• Еквівалентний static_cast у рантаймі</tspan><tspan x="480.0" dy="13.0">• Повідомляє аналізатору: звуження свідоме</tspan><tspan x="480.0" dy="13.0"></tspan><tspan x="480.0" dy="13.0">Призначення:</tspan><tspan x="480.0" dy="13.0">• Придушення попередження Core Check ES.46</tspan><tspan x="480.0" dy="13.0">• Використовується, коли інваріант доведено</tspan><tspan x="480.0" dy="13.0">математично (наприклад, v % 256).</tspan></text>
<text x="640.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Перевірений gsl::narrow&lt;Target&gt;(v)</text>
<rect x="640.0" y="95.0" width="270.0" height="170.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Поведінка:</tspan><tspan x="775.0" dy="11.7">• Виконує зворотне приведення у рантаймі</tspan><tspan x="775.0" dy="11.7">• static_cast&lt;Source&gt;(target) == source</tspan><tspan x="775.0" dy="11.7">• Перевіряє однаковість знаку (sign check)</tspan><tspan x="775.0" dy="11.7"></tspan><tspan x="775.0" dy="11.7">Результат перевірки:</tspan><tspan x="775.0" dy="11.7">• Значення збережено -&gt; повертає Target</tspan><tspan x="775.0" dy="11.7">• Значення спотворено -&gt; кидає narrowing_error</tspan></text>
<line x1="40.0" y1="285.0" x2="920.0" y2="285.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="50.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Внутрішній алгоритм перевірки у gsl::narrow&lt;Target&gt;(Source val):</text>
<rect x="50.0" y="335.0" width="860.0" height="65.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">1. Target tgt = static_cast&lt;Target&gt;(val);</tspan><tspan x="480.0" dy="14.3">2. if (static_cast&lt;Source&gt;(tgt) != val || ((tgt &lt; Target{}) != (val &lt; Source{})))</tspan><tspan x="480.0" dy="14.3">       throw gsl::narrowing_error{};</tspan><tspan x="480.0" dy="14.3">3. return tgt;</tspan></text>
</svg>