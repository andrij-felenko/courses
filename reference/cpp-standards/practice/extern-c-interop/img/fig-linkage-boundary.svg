<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа зв'язування та сумісність символів C/C++</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зіставлення символів компонувальником: без extern &quot;C&quot; та з extern &quot;C&quot;</text>
<text x="80.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Зв'язування за замовчуванням (C++ mangling):</text>
<rect x="74.2" y="98.4" width="211.5" height="63.2" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Одиниця C (caller)</tspan><tspan x="180.0" dy="15.6">виклик crypto_init(cfg)</tspan><tspan x="180.0" dy="15.6">потрібен символ: crypto_init</tspan></text>
<rect x="380.6" y="98.4" width="238.9" height="63.2" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Одиниця C++ (callee)</tspan><tspan x="500.0" dy="15.6">void crypto_init(const char*)</tspan><tspan x="500.0" dy="15.6">експортовано: _Z11crypto_initPKc</tspan></text>
<rect x="690.6" y="98.4" width="238.9" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Компонувальник (Linker)</tspan><tspan x="810.0" dy="15.6">strcmp != 0 (символ не знайдено)</tspan><tspan x="810.0" dy="15.6">undefined reference error</tspan></text>
<line x1="290.8" y1="130.0" x2="375.6" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="624.4" y1="130.0" x2="685.6" y2="130.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">імпорт C</text>
<text x="655.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">колізія імен</text>
<line x1="50.0" y1="205.0" x2="910.0" y2="205.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="80.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Зі специфікатором зв'язування extern &quot;C&quot;:</text>
<rect x="74.2" y="263.4" width="211.5" height="63.2" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Одиниця C (caller)</tspan><tspan x="180.0" dy="15.6">виклик crypto_init(cfg)</tspan><tspan x="180.0" dy="15.6">потрібен символ: crypto_init</tspan></text>
<rect x="353.2" y="263.4" width="293.6" height="63.2" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Одиниця C++ (callee)</tspan><tspan x="500.0" dy="15.6">extern &quot;C&quot; void crypto_init(...)</tspan><tspan x="500.0" dy="15.6">експортовано: crypto_init (без mangling)</tspan></text>
<rect x="714.5" y="263.4" width="191.0" height="63.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Компонувальник (Linker)</tspan><tspan x="810.0" dy="15.6">strcmp == 0 (точний збіг)</tspan><tspan x="810.0" dy="15.6">успішне зшивання адреси</tspan></text>
<line x1="290.8" y1="295.0" x2="348.2" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="651.8" y1="295.0" x2="709.5" y2="295.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">імпорт C</text>
<text x="655.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">збіг символу</text>
<text x="480.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">extern &quot;C&quot; вимикає декорування імен і гарантує сумісність двійкового виклику за C ABI</text>
</svg>