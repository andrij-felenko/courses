<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній механізм: Include Guard (MIOpt) проти #pragma once (FileID Table)</text>
<rect x="30.0" y="50.0" width="435.0" height="390.0" rx="8" fill="#fdfdfe" stroke="#2457d6" stroke-width="1.5"/>
<text x="247.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Include Guard (#ifndef ... #define)</text>
<rect x="50.0" y="95.0" width="395.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="247.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">1. Препроцесор зустрічає #include &quot;header.h&quot;</tspan><tspan x="247.5" dy="14.3">Викликає системний open() / read() файлу з диска.</tspan><tspan x="247.5" dy="14.3">Починає сканування та лексичний аналіз перших токенів.</tspan></text>
<line x1="247.0" y1="170.0" x2="247.0" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="195.0" width="395.0" height="95.0" rx="6" fill="#eef2fa" stroke="#2457d6" stroke-width="1.5"/><text x="247.5" y="217.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">2. Перевірка макросу в Symbol Table</tspan><tspan x="247.5" dy="14.3">• Якщо HEADER_H не визначено → парсимо тіло і робимо #define</tspan><tspan x="247.5" dy="14.3">• Якщо визначено → пропускаємо текст до #endif.</tspan><tspan x="247.5" dy="14.3">Оптимізація MIOpt: якщо файл чистий від тексту ззовні guard,</tspan><tspan x="247.5" dy="14.3">компілятор кешує макрос і не викликає open() повторно.</tspan></text>
<line x1="247.0" y1="290.0" x2="247.0" y2="315.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="315.0" width="395.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="247.5" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Властивості та обмеження:</tspan><tspan x="247.5" dy="13.0">✓ 100% переносимий стандарт C та C++.</tspan><tspan x="247.5" dy="13.0">✗ Ризик колізій макросів (наприклад, _COMMON_H_ у двох лібах).</tspan><tspan x="247.5" dy="13.0">✗ Якщо до або після guard є коментар чи токен, MIOpt</tspan><tspan x="247.5" dy="13.0">вимикається, змушуючи читати файл на кожне включення.</tspan></text>
<rect x="495.0" y="50.0" width="435.0" height="390.0" rx="8" fill="#fdfdfe" stroke="#27ae60" stroke-width="1.5"/>
<text x="712.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">#pragma once (Кеш дескрипторів файлів)</text>
<rect x="515.0" y="95.0" width="395.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="712.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">1. Препроцесор зустрічає #include &quot;header.h&quot;</tspan><tspan x="712.5" dy="13.0">Отримує File ID файлу (Linux: st_dev + st_ino; Win: FileIndex).</tspan><tspan x="712.5" dy="13.0">Перевіряє хеш-таблицю visited_files у пам'яті компілятора.</tspan></text>
<line x1="712.0" y1="170.0" x2="712.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.0" y="195.0" width="395.0" height="95.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="712.5" y="226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">2. Миттєве відсікання на рівні фронтенду</tspan><tspan x="712.5" dy="13.0">• Якщо File ID є в таблиці → файл взагалі НЕ відкривається,</tspan><tspan x="712.5" dy="13.0">  токенайзер і парсер пропускають директиву миттєво.</tspan><tspan x="712.5" dy="13.0">• Якщо File ID відсутній → читаємо файл і додаємо ID в таблицю.</tspan></text>
<line x1="712.0" y1="290.0" x2="712.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.0" y="315.0" width="395.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="712.5" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Властивості та обмеження:</tspan><tspan x="712.5" dy="14.3">✓ Найвища швидкість: нульовий парсинг при повторі.</tspan><tspan x="712.5" dy="14.3">✓ Немає забруднення препроцесора макросами guard.</tspan><tspan x="712.5" dy="14.3">✗ Нестандартне розширення (де-факто підтримується всіма).</tspan><tspan x="712.5" dy="14.3">✗ Пастка Symlinks/Hardlinks або копіювання в build-каталог.</tspan></text>
</svg>