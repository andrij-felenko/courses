<text x="480.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльний підсумок властивостей архітектур</text>
<text x="55.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Текстові заголовки: Макроси витікають, парсинг O(N · M), залежність від порядку включення.</text>
<text x="55.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">• PCH: Швидка чиста збірка, але монолітний, вразливий до прапорців компілятора та макросів.</text>
<text x="55.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• C++20 Модулі: Повна ізоляція символів, відсутність експорту макросів, максимальна швидкість.</text>
