<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
<rect width="960" height="480" fill="#ffffff"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Руйнування виклику віртуального методу через зміну vtable між версіями</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Бінарник клієнта (скомпільовано з v1.0.h)</text>
<rect x="40.0" y="80.0" width="400.0" height="360.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Об'єкт у пам'яті:</text>
<rect x="55.0" y="120.0" width="170.0" height="44.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">vptr (вказівник на vtable)</tspan><tspan x="140.0" dy="13.0">зміщення +0x00</tspan></text>
<rect x="55.0" y="172.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="190.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">int payload_</tspan><tspan x="140.0" dy="14.3">зміщення +0x08</tspan></text>
<text x="275.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">vtable v1.0 у shared library:</text>
<rect x="265.0" y="120.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="143.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Слот 0: &amp;Widget::render()</tspan></text>
<rect x="265.0" y="168.0" width="160.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="345.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Слот 1: &amp;Widget::update()</tspan></text>
<rect x="265.0" y="216.0" width="160.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="239.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Слот 2: &amp;Widget::~Widget()</tspan></text>
<line x1="225.0" y1="142.0" x2="260.0" y2="142.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="275.0" width="370.0" height="85.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Клієнтський код: w-&gt;update();</tspan><tspan x="240.0" dy="14.3">Асемблер: mov rax, [rdi]        ; rax = vptr</tspan><tspan x="240.0" dy="14.3">          call [rax + 8]        ; виклик Слот 1 (update)</tspan><tspan x="240.0" dy="14.3">Результат: викликається правильний метод update()</tspan></text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Оновлена динамічна бібліотека (v1.1.so)</text>
<rect x="520.0" y="80.0" width="400.0" height="360.0" rx="6" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Новий vtable v1.1 у бібліотеці:</text>
<rect x="545.0" y="120.0" width="350.0" height="38.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Слот 0: &amp;Widget::initialize()  [НОВИЙ МЕТОД]</tspan></text>
<rect x="545.0" y="164.0" width="350.0" height="38.0" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="186.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Слот 1: &amp;Widget::render()      [ЗСУНУВСЯ З 0]</tspan></text>
<rect x="545.0" y="208.0" width="350.0" height="38.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Слот 2: &amp;Widget::update()      [ЗСУНУВСЯ З 1]</tspan></text>
<rect x="545.0" y="252.0" width="350.0" height="38.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Слот 3: &amp;Widget::~Widget()     [ЗСУНУВСЯ З 2]</tspan></text>
<rect x="535.0" y="305.0" width="370.0" height="120.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Старий клієнт викликає: call [rax + 8] (Слот 1)</tspan><tspan x="720.0" dy="11.7">Очікування клієнта: виклик update()</tspan><tspan x="720.0" dy="11.7">Реальність у v1.1: виклик render() замість update()!</tspan><tspan x="720.0" dy="11.7">Наслідок: невідповідність параметрів, читання не тих регістрів,</tspan><tspan x="720.0" dy="11.7">тихе пошкодження пам'яті або Crash (SIGSEGV).</tspan></text>
<line x1="480.0" y1="75.0" x2="480.0" y2="445.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
