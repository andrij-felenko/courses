<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
<rect width="960" height="460" fill="#ffffff"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив нетривіального деструктора на конвенцію виклику System V AMD64 ABI</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сирий вказівник T* або тривіальна структура</text>
<rect x="40.0" y="80.0" width="400.0" height="350.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="100.0" width="360.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Клас ABI: INTEGER (тривіально копійований і знищуваний)</tspan><tspan x="240.0" dy="13.0">Розмір: 8 байтів &lt;= 16 байтів</tspan></text>
<rect x="60.0" y="165.0" width="360.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Регістр процесора %rdi:</tspan><tspan x="240.0" dy="11.7">┌──────────────────────────────────────────────┐</tspan><tspan x="240.0" dy="11.7">│               0x7fff_dead_beef               │ (пряма адреса об'єкта)</tspan><tspan x="240.0" dy="11.7">└──────────────────────────────────────────────┘</tspan></text>
<rect x="60.0" y="265.0" width="360.0" height="145.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="298.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Генерація машинного коду (0 звернень до стеку):</tspan><tspan x="240.0" dy="14.3">  mov rdi, rax          ; запис адреси в регістр rdi</tspan><tspan x="240.0" dy="14.3">  call process(T*)      ; прямий стрибок</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">Продуктивність:</tspan><tspan x="240.0" dy="14.3">• 0 інструкцій запису в оперативну пам'ять</tspan><tspan x="240.0" dy="14.3">• Максимальна швидкість виконання у пайплайні CPU</tspan></text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">std::unique_ptr&lt;T&gt; (має нетривіальний деструктор)</text>
<rect x="520.0" y="80.0" width="400.0" height="350.0" rx="6" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.5"/>
<rect x="540.0" y="100.0" width="360.0" height="50.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Клас ABI: MEMORY (нетривіальний деструктор у C++ ABI)</tspan><tspan x="720.0" dy="14.3">Правило: об'єкт передається через пам'ять стеку!</tspan></text>
<rect x="540.0" y="165.0" width="360.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Стек процесу (RSP) + прихований вказівник у %rdi:</tspan><tspan x="720.0" dy="14.3">  %rdi  ──&gt;  [ RSP + 8 ]:  0x7fff_dead_beef (адреса T)</tspan><tspan x="720.0" dy="14.3">             [ RSP + 0 ]:  адреса повернення</tspan></text>
<rect x="540.0" y="265.0" width="360.0" height="145.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Генерація машинного коду (навантаження на стек):</tspan><tspan x="720.0" dy="13.0">  mov [rsp+8], rax      ; запис вказівника на стек</tspan><tspan x="720.0" dy="13.0">  lea rdi, [rsp+8]      ; передача адреси слота стеку в rdi</tspan><tspan x="720.0" dy="13.0">  call process(uniq_ptr); функція читає через пам'ять</tspan><tspan x="720.0" dy="13.0"></tspan><tspan x="720.0" dy="13.0">Ціна збереження ABI: передача unique_ptr за значенням</tspan><tspan x="720.0" dy="13.0">потребує зайвих Store/Load операцій у пам'ять.</tspan></text>
<line x1="480.0" y1="75.0" x2="480.0" y2="435.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
