<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стале обчислення замкнене: усе, чого воно торкається, або аргумент, або створене всередині</text>
<rect x="340.0" y="88.0" width="340.0" height="202.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.5"/>
<text x="510.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">СТАЛЕ ОБЧИСЛЕННЯ</text>
<text x="510.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">результат залежить лише від</tspan><tspan x="510.0" dy="18.0">аргументів і від того,</tspan><tspan x="510.0" dy="18.0">що створене тут-таки</tspan></text>
<rect x="40.0" y="100.0" width="250.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">аргументи-сталі</tspan></text>
<rect x="40.0" y="170.0" width="250.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">літерали й constexpr-змінні</tspan></text>
<rect x="40.0" y="240.0" width="250.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">об'єкти, створені всередині</tspan></text>
<line x1="296.0" y1="126.0" x2="334.0" y2="126.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="296.0" y1="196.0" x2="334.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="296.0" y1="266.0" x2="334.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="686.0" y1="190.0" x2="762.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="164.0" width="210.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">одне значення</tspan></text>
<rect x="40.0" y="344.0" width="940.0" height="136.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="510.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Що зупиняє стале обчислення</text>
<text x="72.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="72.0" dy="0.0">• читання змінної, яка живе лише в час виконання</tspan><tspan x="72.0" dy="22.8">• ввід-вивід і будь-який системний виклик</tspan></text>
<text x="536.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="536.0" dy="0.0">• пам'ять із new, не звільнена до кінця обчислення</tspan><tspan x="536.0" dy="22.8">• невизначена поведінка — тут це помилка збірки</tspan></text>
</svg>