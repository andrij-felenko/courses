<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один і той самий предикат «x &lt; i» у чотирьох редакціях пропозиції</text>
<rect x="30.0" y="70.0" width="170.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">N1968</tspan><tspan x="115.0" dy="18.2">лютий 2006</tspan></text>
<rect x="220.0" y="83.0" width="560.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="234.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="234.0" dy="0.0">&lt;&gt;(int x) -&gt; bool extern(i) { return x &lt; i; }</tspan></text>
<rect x="810.0" y="70.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">ромб замість імені;</tspan><tspan x="980.0" dy="16.9">extern(...) — список</tspan><tspan x="980.0" dy="16.9">посилань, решта — копії</tspan></text>
<rect x="30.0" y="170.0" width="170.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">N2529</tspan><tspan x="115.0" dy="18.2">лютий 2008</tspan></text>
<rect x="220.0" y="183.0" width="560.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="234.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="234.0" dy="0.0">&lt;&amp;&gt;(int x) (x &lt; i)</tspan></text>
<rect x="810.0" y="170.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">кутові дужки з режимом</tspan><tspan x="980.0" dy="16.9">захоплення; тіло —</tspan><tspan x="980.0" dy="16.9">вираз без return</tspan></text>
<rect x="30.0" y="270.0" width="170.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="303.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">N2550</tspan><tspan x="115.0" dy="18.2">березень 2008</tspan></text>
<rect x="220.0" y="283.0" width="560.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="234.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="234.0" dy="0.0">[&amp;](int x) { return x &lt; i; }</tspan></text>
<rect x="810.0" y="270.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="295.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">квадратні дужки й тіло-блок;</tspan><tspan x="980.0" dy="16.9">саме це проголосували</tspan><tspan x="980.0" dy="16.9">в Bellevue</tspan></text>
<rect x="30.0" y="370.0" width="170.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="403.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">C++11</tspan><tspan x="115.0" dy="18.2">фінальний вигляд</tspan></text>
<rect x="220.0" y="383.0" width="560.0" height="50.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="234.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="234.0" dy="0.0">[i](int x) mutable { return x &lt; i; }</tspan></text>
<rect x="810.0" y="370.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="395.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">поіменні захоплення</tspan><tspan x="980.0" dy="16.9">й ключове слово mutable</tspan><tspan x="980.0" dy="16.9">(папір N2658)</tspan></text>
<text x="590.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Змінювався не сенс, а запис: об'єктом із полями замикання було в усіх редакціях.</text>
</svg>