<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="445.9" y="34.0" width="248.2" height="36.0" rx="6" fill="#eef3fd" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Куди піде це замикання?</tspan></text>
<line x1="570.0" y1="70.0" x2="570.0" y2="100.0" stroke="#333333" stroke-width="1.5"/>
<line x1="190.0" y1="100.0" x2="950.0" y2="100.0" stroke="#333333" stroke-width="1.5"/>
<line x1="190.0" y1="100.0" x2="190.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="100.0" x2="570.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="950.0" y1="100.0" x2="950.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="130.0" width="320.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">викликається тут-таки</tspan><tspan x="190.0" dy="18.2">(алгоритм, цикл, ranges)</tspan></text>
<line x1="190.0" y1="212.0" x2="190.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="246.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">гине наприкінці</tspan><tspan x="190.0" dy="18.2">повного виразу</tspan></text>
<line x1="190.0" y1="318.0" x2="190.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="352.0" width="320.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">[&amp;] безпечне</tspan><tspan x="190.0" dy="18.2">й найдешевше</tspan></text>
<rect x="410.0" y="130.0" width="320.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">зберігається:</tspan><tspan x="570.0" dy="18.2">std::function, контейнер,</tspan><tspan x="570.0" dy="18.2">обробник події</tspan></text>
<line x1="570.0" y1="212.0" x2="570.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="246.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">переживає область,</tspan><tspan x="570.0" dy="18.2">де його створили</tspan></text>
<line x1="570.0" y1="318.0" x2="570.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="352.0" width="320.0" height="100.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">тільки володіння: копія</tspan><tspan x="570.0" dy="18.2">або [p = std::move(p)];</tspan><tspan x="570.0" dy="18.2">на себе — через weak_ptr</tspan></text>
<rect x="790.0" y="130.0" width="320.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">їде в іншу нитку</tspan><tspan x="950.0" dy="18.2">або в корутину</tspan></text>
<line x1="950.0" y1="212.0" x2="950.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="246.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="950.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">живе непередбачувано</tspan><tspan x="950.0" dy="18.2">довго</tspan></text>
<line x1="950.0" y1="318.0" x2="950.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="352.0" width="320.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="950.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">тільки володіння;</tspan><tspan x="950.0" dy="18.2">будь-яке посилання —</tspan><tspan x="950.0" dy="18.2">перегони або мертва адреса</tspan></text>
<text x="570.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Спосіб захоплення обирає не смак, а те, чи може замикання пережити те, на що дивиться.</text>
</svg>