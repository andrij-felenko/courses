<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 774" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="774" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дванадцять років від «цю функцію не написати» до слова в стандарті</text>
<line x1="214.0" y1="68.0" x2="214.0" y2="722.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="192.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">до 2002</text>
<circle cx="214.0" cy="92.0" r="6.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<rect x="246.0" y="66.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="262.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">CWG 106</text>
<text x="262.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Бʼярне Строуструп: шаблони-біндери мимоволі творять посилання на посилання.</text>
<text x="262.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Ухвалено згортання для typedef і аргументу шаблону: T&amp; &amp; стає T&amp;.</text>
<text x="192.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">09.09.2002</text>
<circle cx="214.0" cy="166.0" r="6.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="246.0" y="140.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="262.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">N1385  «The Forwarding Problem: Arguments»</text>
<text x="262.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Дімов, Гіннант, Абрагамс: сім способів написати наскрізну обгортку, і жоден не годиться.</text>
<text x="262.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Підраховано 2ᴺ перевантажень; названо «проблему const». Розвʼязок №7 — те, що маємо нині.</text>
<text x="192.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">10.09.2002</text>
<circle cx="214.0" cy="240.0" r="6.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="246.0" y="214.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="262.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">N1377  «Move Semantics Support»</text>
<text x="262.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ті самі троє наступного дня: токен &amp;&amp; і чотири правила згортання посилань.</text>
<text x="262.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">У тексті прямо сказано: правила критичні і для переміщення, і для ідеального передавання.</text>
<text x="192.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">07.09.2004</text>
<circle cx="214.0" cy="314.0" r="6.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="246.0" y="288.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="262.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">N1690  «An Rvalue Reference to the C++ Language»</text>
<text x="262.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Обидва папери зведено в один; стару річ T&amp; відтоді звуть lvalue-посиланням.</text>
<text x="262.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Обіцянка: одна перевантажена версія замість 2ᴺ, скільки б параметрів не було.</text>
<text x="192.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">03–05.03.2005</text>
<circle cx="214.0" cy="388.0" r="6.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="246.0" y="362.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="262.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">N1770 · N1771</text>
<text x="262.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Формулювання для тексту стандарту — і окремий папір про наслідки для бібліотеки.</text>
<text x="262.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Саме там зʼявляються move(), forward(), unique_ptr і move_iterator.</text>
<text x="192.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">2011</text>
<circle cx="214.0" cy="462.0" r="6.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="246.0" y="436.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="262.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">C++11</text>
<text x="262.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Риса в стандарті й у компіляторах. Назви в неї немає.</text>
<text x="262.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Оголошення T&amp;&amp; у шаблоні читають за механізмом: «виведення плюс згортання».</text>
<text x="192.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">06.08 / 10 / 01.11.2012</text>
<circle cx="214.0" cy="536.0" r="6.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="246.0" y="510.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="262.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Скотт Маєрс: «universal reference»</text>
<text x="262.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Доповідь на C++ and Beyond (Ешвілл), стаття в Overload 111, передрук на isocpp.</text>
<text x="262.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Назву вигадала спільнота, бо комітет її не дав. Вона миттєво приживається.</text>
<text x="192.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">06.10.2014</text>
<circle cx="214.0" cy="610.0" r="6.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="246.0" y="584.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="262.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">N4164  «Forwarding References»</text>
<text x="262.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Саттер, Строуструп, Дос Рейс: «universal» обіцяє «вживай усюди» — і це неправда.</text>
<text x="262.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Згортання — механізм, передавання — суть. Дяка Маєрсові за готовність змінити назву.</text>
<text x="192.0" y="688.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">C++17</text>
<circle cx="214.0" cy="684.0" r="6.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="246.0" y="658.0" width="848.0" height="56.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="262.0" y="676.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">[temp.deduct.call]/3</text>
<text x="262.0" y="694.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Термін forwarding reference стоїть у самому стандарті — але не там, де просив N4164.</text>
<text x="262.0" y="710.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Визначення прив'язали до виведення аргументів, а не до правил про typedef.</text>
</svg>