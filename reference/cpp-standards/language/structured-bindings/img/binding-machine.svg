<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна прихована змінна і два імені для її частин</text>
<rect x="372.1" y="44.5" width="255.8" height="51.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">auto&amp; [k, v] = *it;</tspan></text>
<text x="500.0" y="28.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що написано в коді</text>
<line x1="500.0" y1="101.5" x2="500.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що з цього робить компілятор</text>
<rect x="310.7" y="165.6" width="378.6" height="68.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">auto&amp; e = *it;</tspan><tspan x="500.0" dy="20.8">e — справжня змінна; імені в неї немає</tspan></text>
<line x1="410.0" y1="240.4" x2="250.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="240.4" x2="750.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.2" y="267.6" width="219.5" height="64.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">k</tspan><tspan x="250.0" dy="20.8">інше ім'я для e.first</tspan></text>
<rect x="635.7" y="267.6" width="228.6" height="64.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">v</tspan><tspan x="750.0" dy="20.8">інше ім'я для e.second</tspan></text>
<rect x="255.2" y="378.8" width="489.7" height="62.5" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">жодної нової змінної, крім e:</tspan><tspan x="500.0" dy="19.5">k і v не копіюють нічого й не займають власної пам'яті</tspan></text>
</svg>