<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="396" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві сильні операції поспіль дають лише базову</text>
<rect x="40.0" y="74.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">крок 1: списати з A</tspan><tspan x="165.0" dy="16.2">сильна гарантія</tspan></text>
<line x1="294.0" y1="106.0" x2="332.0" y2="106.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="336.0" y="74.0" width="250.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="461.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="461.0" dy="0.0">крок 2: зарахувати на B</tspan><tspan x="461.0" dy="16.2">сильна гарантія</tspan></text>
<line x1="590.0" y1="106.0" x2="628.0" y2="106.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="632.0" y="74.0" width="250.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="757.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="757.0" dy="0.0">виняток</tspan></text>
<line x1="757.0" y1="142.0" x2="757.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="174.0" width="382.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="691.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="691.0" dy="0.0">крок 2 відкотив сам себе,</tspan><tspan x="691.0" dy="16.2">а крок 1 уже стався —</tspan><tspan x="691.0" dy="16.2">разом це лише базова гарантія</tspan></text>
<line x1="40.0" y1="274.0" x2="920.0" y2="274.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<rect x="40.0" y="296.0" width="400.0" height="76.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">щоб склалося в сильну, потрібен</tspan><tspan x="240.0" dy="16.2">відкат кроку 1, який сам</tspan><tspan x="240.0" dy="16.2">не має права кинути</tspan></text>
<line x1="446.0" y1="334.0" x2="494.0" y2="334.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="296.0" width="382.0" height="76.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="691.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="691.0" dy="0.0">охоронець області: деструктор</tspan><tspan x="691.0" dy="16.2">повертає списане, якщо до кінця</tspan><tspan x="691.0" dy="16.2">так і не дійшли</tspan></text>
</svg>