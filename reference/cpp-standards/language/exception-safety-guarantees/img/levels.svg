<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири різні відповіді на питання «що лишилося після винятку»</text>
<rect x="40.0" y="52.0" width="190.0" height="38.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">рівень</tspan></text>
<rect x="240.0" y="52.0" width="350.0" height="38.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">що правда після винятку</tspan></text>
<rect x="600.0" y="52.0" width="360.0" height="38.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">що дозволено тому, хто викликав</tspan></text>
<rect x="40.0" y="98.0" width="190.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">жодної</tspan></text>
<rect x="240.0" y="98.0" width="350.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">нічого не відомо: можливі витік ресурсу,</tspan><tspan x="415.0" dy="15.6">зламаний інваріант, подвійне звільнення</tspan></text>
<rect x="600.0" y="98.0" width="360.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">нічого безпечного — навіть знищити</tspan><tspan x="780.0" dy="15.6">об'єкт може виявитися фатальним</tspan></text>
<rect x="40.0" y="180.0" width="190.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">базова</tspan></text>
<rect x="240.0" y="180.0" width="350.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="213.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">ресурси не втрачені, інваріанти класу тримаються,</tspan><tspan x="415.0" dy="14.3">але яке саме значення всередині — не сказано</tspan></text>
<rect x="600.0" y="180.0" width="360.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">знищити, присвоїти нове, викликати</tspan><tspan x="780.0" dy="15.6">операції без передумов</tspan></text>
<rect x="40.0" y="262.0" width="190.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">сильна</tspan></text>
<rect x="240.0" y="262.0" width="350.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="295.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">або операція сталася вся,</tspan><tspan x="415.0" dy="15.6">або стан такий самий, як був до виклику</tspan></text>
<rect x="600.0" y="262.0" width="360.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="295.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">повторити ту саму спробу</tspan><tspan x="780.0" dy="15.6">на тому самому об'єкті</tspan></text>
<rect x="40.0" y="344.0" width="190.0" height="74.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="386.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">nothrow</tspan></text>
<rect x="240.0" y="344.0" width="350.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">операція завершилася успіхом;</tspan><tspan x="415.0" dy="15.6">винятку звідси не буває взагалі</tspan></text>
<rect x="600.0" y="344.0" width="360.0" height="74.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">покластися на неї в чужому відкаті</tspan><tspan x="780.0" dy="15.6">й у деструкторі</tspan></text>
<text x="500.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">наступний рівень — не «акуратніше написано», а інша обіцянка й інша ціна</text>
</svg>