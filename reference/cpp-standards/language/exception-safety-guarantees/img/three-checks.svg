<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="424" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що саме перевіряють після кожного винятку</text>
<rect x="40.0" y="54.0" width="244.0" height="34.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="162.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="162.0" dy="0.0">перевірка</tspan></text>
<rect x="296.0" y="54.0" width="330.0" height="34.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="461.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="461.0" dy="0.0">що вона міряє</tspan></text>
<rect x="638.0" y="54.0" width="322.0" height="34.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="799.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="799.0" dy="0.0">що ловить лише вона</tspan></text>
<rect x="40.0" y="96.0" width="244.0" height="84.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="162.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.0" dy="0.0">лічильники обліку</tspan></text>
<rect x="296.0" y="96.0" width="330.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="461.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="461.0" dy="0.0">збудовано мінус знищено,</tspan><tspan x="461.0" dy="15.6">виділено мінус звільнено —</tspan><tspan x="461.0" dy="15.6">обидві пари сходяться в нуль</tspan></text>
<rect x="638.0" y="96.0" width="322.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="799.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="799.0" dy="0.0">витік елемента чи блоку</tspan><tspan x="799.0" dy="15.6">і подвійне знищення</tspan><tspan x="799.0" dy="15.6">(лічильник іде в мінус)</tspan></text>
<rect x="40.0" y="190.0" width="244.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="162.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.0" dy="0.0">предикат інваріанта</tspan></text>
<rect x="296.0" y="190.0" width="330.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="461.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="461.0" dy="0.0">твердження, яке клас</tspan><tspan x="461.0" dy="15.6">обіцяє про себе назовні,</tspan><tspan x="461.0" dy="15.6">питають після винятку</tspan></text>
<rect x="638.0" y="190.0" width="322.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="799.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="799.0" dy="0.0">зламаний інваріант при</tspan><tspan x="799.0" dy="15.6">бездоганно чистих лічильниках —</tspan><tspan x="799.0" dy="15.6">найтихіший з дефектів</tspan></text>
<rect x="40.0" y="284.0" width="244.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="162.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.0" dy="0.0">порівняння зі знімком</tspan></text>
<rect x="296.0" y="284.0" width="330.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="461.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="461.0" dy="0.0">стан після невдачі</tspan><tspan x="461.0" dy="15.6">дорівнює копії, знятій</tspan><tspan x="461.0" dy="15.6">до самого виклику</tspan></text>
<rect x="638.0" y="284.0" width="322.0" height="84.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="799.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="799.0" dy="0.0">втрату сильної гарантії:</tspan><tspan x="799.0" dy="15.6">операція лишила слід там,</tspan><tspan x="799.0" dy="15.6">де обіцяла не лишати</tspan></text>
<text x="500.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">жодна з трьох не заміняє двох інших: вони ловлять різні способи все зіпсувати</text>
</svg>