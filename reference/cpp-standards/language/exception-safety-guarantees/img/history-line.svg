<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від колонки 1993 року до формулювань стандарту</text>
<line x1="60.0" y1="120.0" x2="960.0" y2="120.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="140.0" cy="120.0" r="8.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">жовтень 1993</text>
<line x1="140.0" y1="130.0" x2="140.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="35.0" y="164.0" width="210.0" height="118.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="212.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Девід Рід, колонка</tspan><tspan x="140.0" dy="15.0">в «C++ Report»:</tspan><tspan x="140.0" dy="15.0">винятки — це добре</tspan></text>
<circle cx="330.0" cy="120.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="330.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">лист.–груд. 1994</text>
<line x1="330.0" y1="130.0" x2="330.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="225.0" y="164.0" width="210.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="206.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Том Каргіл, «Exception</tspan><tspan x="330.0" dy="13.7">Handling: A False Sense</tspan><tspan x="330.0" dy="13.7">of Security» — розбір Stack&lt;T&gt;</tspan><tspan x="330.0" dy="13.7">і відкритий виклик</tspan></text>
<circle cx="560.0" cy="120.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="560.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1997</text>
<line x1="560.0" y1="130.0" x2="560.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="455.0" y="164.0" width="210.0" height="118.0" rx="6" fill="#e8f0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Дейв Абрагамс і Ґреґ Колвін,</tspan><tspan x="560.0" dy="15.0">документи комітету N1075,</tspan><tspan x="560.0" dy="15.0">N1086, N1114; серія</tspan><tspan x="560.0" dy="15.0">Герба Саттера в «C++ Report»</tspan></text>
<circle cx="790.0" cy="120.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="790.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">27.04–01.05.1998</text>
<line x1="790.0" y1="130.0" x2="790.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<rect x="685.0" y="164.0" width="210.0" height="118.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="206.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Дагштульський семінар</tspan><tspan x="790.0" dy="13.7">з узагальненого програмування:</tspan><tspan x="790.0" dy="13.7">«Exception-Safety in Generic</tspan><tspan x="790.0" dy="13.7">Components» (Springer, 2000)</tspan></text>
<rect x="60.0" y="320.0" width="900.0" height="46.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="347.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">ідея (щось не так) → формулювання (три рівні) → текст стандарту ISO/IEC 14882:1998</tspan></text>
<text x="510.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">терміни «basic», «strong», «nothrow» живуть у літературі; сам стандарт розписує</text>
<text x="510.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ті самі обіцянки для кожної операції окремо, здебільшого не називаючи їх</text>
</svg>