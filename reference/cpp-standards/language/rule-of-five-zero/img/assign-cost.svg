<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="336" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна присвоєння: виділення проти переприсвоєння в місце</text>
<rect x="30.0" y="40.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">копіюй і обмінюй</tspan></text>
<rect x="300.0" y="40.0" width="550.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="575.0" y="69.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">new[n]  →  copy n  →  swap  →  delete[] старий</tspan></text>
<text x="575.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">завжди одне виділення; пік пам'яті ≈ старий блок + новий</text>
<line x1="30.0" y1="136.0" x2="850.0" y2="136.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<rect x="30.0" y="160.0" width="240.0" height="50.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">переприсвоєння</tspan><tspan x="150.0" dy="18.2">на місці</tspan></text>
<rect x="300.0" y="160.0" width="550.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="575.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">capacity ≥ n ?  →  copy n у наявний блок  (інакше new[n])</tspan></text>
<text x="575.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">жодного виділення, поки місткості вистачає; пік ≈ один блок</text>
<text x="440.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">У циклі присвоєнь перший варіант виділяє пам'ять щоразу, другий — жодного разу після першої ітерації.</text>
<text x="440.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ціна економії — лише базова гарантія: перерване копіювання лишає блок частково перезаписаним.</text>
</svg>