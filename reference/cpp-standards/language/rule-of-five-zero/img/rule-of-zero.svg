<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де живе відповідальність за ресурс</text>
<rect x="40.0" y="58.0" width="360.0" height="306.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="58.0" y="74.0" width="324.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">ресурс тримає сам клас</tspan></text>
<rect x="58.0" y="128.0" width="324.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">char* data;</tspan></text>
<rect x="58.0" y="182.0" width="324.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">~Buffer()</tspan><tspan x="220.0" dy="18.2">Buffer(const Buffer&amp;)</tspan><tspan x="220.0" dy="18.2">operator=(const Buffer&amp;)</tspan><tspan x="220.0" dy="18.2">Buffer(Buffer&amp;&amp;)</tspan><tspan x="220.0" dy="18.2">operator=(Buffer&amp;&amp;)</tspan></text>
<text x="220.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">п'ять функцій, узгоджених вручну</text>
<rect x="460.0" y="58.0" width="360.0" height="306.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="478.0" y="74.0" width="324.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="98.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">ресурсом володіє член</tspan></text>
<rect x="478.0" y="128.0" width="324.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">std::vector&lt;char&gt; data;</tspan></text>
<rect x="478.0" y="182.0" width="324.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">— жодної з п'яти —</tspan><tspan x="640.0" dy="18.2"></tspan><tspan x="640.0" dy="18.2">почленні операції вже</tspan><tspan x="640.0" dy="18.2">правильні, бо правильний</tspan><tspan x="640.0" dy="18.2">сам член</tspan></text>
<text x="640.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">нуль функцій</text>
<text x="430.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">П'ятірку не скасовано — її написали один раз усередині типу-власника</text>
</svg>