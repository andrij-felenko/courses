<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл рефлексії: підйом (^^), обробка (consteval) і сплайсинг ([: :])</text>
<rect x="40.0" y="70.0" width="290.0" height="320.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="185.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Простір коду (AST)</text>
<rect x="55.0" y="126.0" width="260.0" height="110.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="71.0" y="151.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">struct User {</text><text x="71.0" y="168.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  std::string name;</text><text x="71.0" y="184.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  int age;</text><text x="71.0" y="201.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  double score;</text><text x="71.0" y="217.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">};</text>
<text x="185.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Типи, змінні, функції,</text>
<text x="185.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поля та переліки в коді</text>
<rect x="55.0" y="320.0" width="260.0" height="50.0" rx="8" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/><text x="71.0" y="340.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="start">^^User   // оператор ^^</text><text x="71.0" y="357.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="start">^^User::age</text>
<line x1="330.0" y1="230.0" x2="400.0" y2="230.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="365.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Lift</text>
<text x="365.0" y="252.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">^^T</text>
<rect x="400.0" y="70.0" width="320.0" height="320.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="560.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2. Значення std::meta::info</text>
<rect x="415.0" y="126.0" width="290.0" height="140.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="431.0" y="142.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">consteval {</text><text x="431.0" y="158.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  info r = ^^User;</text><text x="431.0" y="175.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  auto m = members_of(r);</text><text x="431.0" y="191.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  for (info f : m) {</text><text x="431.0" y="208.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">    name_of(f);</text><text x="431.0" y="224.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">    type_of(f);</text><text x="431.0" y="241.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  }</text><text x="431.0" y="257.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">}</text>
<text x="560.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Звичайний імперативний C++:</text>
<text x="560.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::vector, std::ranges, алгоритми</text>
<text x="560.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">без створення типів у таблиці символів</text>
<text x="560.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">виконується в consteval</text>
<line x1="720.0" y1="230.0" x2="790.0" y2="230.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="755.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Splice</text>
<text x="755.0" y="252.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">[: r :]</text>
<rect x="790.0" y="70.0" width="290.0" height="320.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="935.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">3. Розгорнутий код</text>
<rect x="805.0" y="126.0" width="260.0" height="110.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="821.0" y="151.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">// доступ до поля:</text><text x="821.0" y="168.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">u.[: member_info :] = 42;</text><text x="821.0" y="184.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start"></text><text x="821.0" y="201.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">// використання типу:</text><text x="821.0" y="217.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">[: type_info :] val;</text>
<text x="935.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зворотне перетворення</text>
<text x="935.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">значення у вираз, тип,</text>
<text x="935.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">назву члена чи базовий клас</text>
<text x="935.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Zero runtime overhead</text>
<text x="560.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Рефлексія перетворює код на дані (std::meta::info), опрацьовує їх у consteval, і вклеює назад оператором [: :]</text>
</svg>