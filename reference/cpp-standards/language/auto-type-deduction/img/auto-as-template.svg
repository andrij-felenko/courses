<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">auto — не тип, а місце для типу</text>
<rect x="113.3" y="95.5" width="253.3" height="49.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">const auto&amp; r = expr;</tspan></text>
<text x="240.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що написано в коді</text>
<rect x="595.7" y="77.0" width="228.6" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">template&lt;class T&gt;</tspan><tspan x="710.0" dy="19.5">void f(const T&amp; param);</tspan><tspan x="710.0" dy="19.5">f(expr);</tspan></text>
<text x="710.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">за якими правилами це читає компілятор</text>
<line x1="380.7" y1="120.0" x2="581.7" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="481.2" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ті самі правила</text>
<rect x="123.1" y="231.0" width="103.8" height="38.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">auto  →  T</tspan></text>
<rect x="356.3" y="231.0" width="247.4" height="38.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">декларатор  →  тип параметра</tspan></text>
<rect x="688.2" y="231.0" width="223.5" height="38.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">expr  →  аргумент виклику</tspan></text>
<text x="480.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">виведене T підставляється на місце auto</text>
</svg>