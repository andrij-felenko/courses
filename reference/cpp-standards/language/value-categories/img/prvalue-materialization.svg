<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Об'єкт виникає лише там, де його справді треба</text>
<rect x="30.0" y="152.0" width="240.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="150.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">make()</tspan><tspan x="150.0" dy="18.2"></tspan><tspan x="150.0" dy="18.2">prvalue —</tspan><tspan x="150.0" dy="18.2">рецепт ініціалізації,</tspan><tspan x="150.0" dy="18.2">а не об'єкт</tspan></text>
<rect x="330.0" y="66.0" width="250.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">контекст:</tspan><tspan x="455.0" dy="19.5">T x = make();</tspan></text>
<rect x="640.0" y="66.0" width="270.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="775.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">x ініціалізовано напряму;</tspan><tspan x="775.0" dy="18.2">тимчасовий об'єкт</tspan><tspan x="775.0" dy="18.2">не виникає взагалі</tspan></text>
<rect x="330.0" y="262.0" width="250.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="301.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">контекст:</tspan><tspan x="455.0" dy="19.5">const T&amp; r = make();</tspan></text>
<rect x="640.0" y="262.0" width="270.0" height="88.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="775.0" y="292.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">матеріалізація:</tspan><tspan x="775.0" dy="18.2">об'єкт таки виникає —</tspan><tspan x="775.0" dy="18.2">і це вже xvalue</tspan></text>
