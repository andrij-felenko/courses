<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик функції стирає різницю між xvalue і prvalue</text>
<rect x="30.0" y="55.0" width="250.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="155.0" y="80.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">probe(s)</tspan><tspan x="155.0" dy="16.9"></tspan><tspan x="155.0" dy="16.9">аргумент — lvalue</tspan></text>
<rect x="30.0" y="150.0" width="250.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="155.0" y="175.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">probe(std::move(s))</tspan><tspan x="155.0" dy="16.9"></tspan><tspan x="155.0" dy="16.9">аргумент — xvalue</tspan></text>
<rect x="30.0" y="245.0" width="250.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="155.0" y="270.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">probe(make())</tspan><tspan x="155.0" dy="16.9"></tspan><tspan x="155.0" dy="16.9">аргумент — prvalue</tspan></text>
<rect x="352.0" y="108.0" width="226.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="465.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">template &lt;class T&gt;</tspan><tspan x="465.0" dy="16.9">void probe(T&amp;&amp; p);</tspan><tspan x="465.0" dy="16.9"></tspan><tspan x="465.0" dy="16.9">виведення T</tspan><tspan x="465.0" dy="16.9">на місці виклику</tspan></text>
<rect x="660.0" y="62.0" width="270.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="795.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">T = std::string&amp;</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">lvalue ще видно</tspan></text>
<rect x="660.0" y="216.0" width="270.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="795.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">T = std::string</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">сюди злилися xvalue і prvalue —</tspan><tspan x="795.0" dy="16.9">розрізнити вже нічим</tspan></text>
<line x1="286.0" y1="93.0" x2="346.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="286.0" y1="188.0" x2="346.0" y2="188.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="286.0" y1="283.0" x2="346.0" y2="228.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="150.0" x2="654.0" y2="112.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="228.0" x2="654.0" y2="268.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="358.0" width="900.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="480.0" y="386.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">а сам параметр p усередині функції — завжди lvalue: у нього є ім'я.</tspan><tspan x="480.0" dy="18.2">Тому функція не може ані виміряти категорію, ані зберегти її.</tspan></text>
</svg>