<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="495" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де noexcept з'являється без вашого слова</text>
<rect x="40.0" y="46.0" width="268.0" height="42.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="174.0" dy="0.0">функція</tspan></text>
<rect x="320.0" y="46.0" width="214.0" height="42.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="427.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="427.0" dy="0.0">обіцянка за умовчанням</tspan></text>
<rect x="546.0" y="46.0" width="414.0" height="42.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="753.0" dy="0.0">що її скасовує</tspan></text>
<rect x="40.0" y="100.0" width="268.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">деструктор — і власноруч написаний,</tspan><tspan x="174.0" dy="14.3">і згенерований</tspan></text>
<rect x="320.0" y="100.0" width="214.0" height="68.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="427.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="427.0" dy="0.0">noexcept(true)</tspan></text>
<rect x="546.0" y="100.0" width="414.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="137.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">база або поле, чий деструктор оголошено noexcept(false)</tspan></text>
<rect x="40.0" y="176.0" width="268.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">operator delete,</tspan><tspan x="174.0" dy="14.3">operator delete[]</tspan></text>
<rect x="320.0" y="176.0" width="214.0" height="68.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="427.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="427.0" dy="0.0">noexcept(true)</tspan></text>
<rect x="546.0" y="176.0" width="414.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">нічого: обіцянка безумовна</tspan></text>
<rect x="40.0" y="252.0" width="268.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">згенеровані переміщення —</tspan><tspan x="174.0" dy="14.3">конструктор і присвоєння</tspan></text>
<rect x="320.0" y="252.0" width="214.0" height="68.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/><text x="427.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="427.0" dy="0.0">виводиться з полів</tspan></text>
<rect x="546.0" y="252.0" width="414.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">поле, чиє переміщення саме не має обіцянки</tspan></text>
<rect x="40.0" y="328.0" width="268.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="358.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">згенеровані копіювання —</tspan><tspan x="174.0" dy="14.3">конструктор і присвоєння</tspan></text>
<rect x="320.0" y="328.0" width="214.0" height="68.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/><text x="427.0" y="366.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="427.0" dy="0.0">виводиться з полів</tspan></text>
<rect x="546.0" y="328.0" width="414.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="365.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">поле, що виділяє пам'ять при копіюванні (майже завжди)</tspan></text>
<rect x="40.0" y="404.0" width="268.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="441.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">будь-яка інша функція</tspan></text>
<rect x="320.0" y="404.0" width="214.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="427.0" y="442.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="427.0" dy="0.0">noexcept(false)</tspan></text>
<rect x="546.0" y="404.0" width="414.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="441.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">нічого: тільки ви, написавши noexcept власноруч</tspan></text>
<text x="500.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жовте — обіцянка не задана наперед, а обчислена компілятором з операцій усіх полів і баз</text>
</svg>