<rect x="50.0" y="363.1" width="900.0" height="83.7" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Наслідки відсутності virtual:</tspan><tspan x="500.0" dy="16.9">1. Неоднозначність звернення: ptr-&gt;node_id — помилка компіляції (ambiguous base).</tspan><tspan x="500.0" dy="16.9">2. Розкол стану: ptr-&gt;AudioInput::node_id = 1 НЕ змінює ptr-&gt;AudioOutput::node_id.</tspan><tspan x="500.0" dy="16.9">3. Неможливий прямий upcast: static_cast&lt;DeviceNode*&gt;(ptr) не компілюється.</tspan></text>
