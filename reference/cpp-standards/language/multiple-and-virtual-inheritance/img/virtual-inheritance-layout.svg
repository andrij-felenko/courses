<rect x="40.0" y="431.6" width="920.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="452.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Непряма адресація: AudioInput звертається до полів DeviceNode за два кроки:</tspan><tspan x="500.0" dy="16.9">1. Читає vptr[ -3 ], отримує зсув +40;   2. Обчислює адресу: (char*)this + 40.</tspan><tspan x="500.0" dy="16.9">Завдяки цьому підоб'єкт DeviceNode існує в єдиному екземплярі на весь AudioDuplex.</tspan></text>
</svg>