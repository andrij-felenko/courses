<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка Strict Aliasing при переосмисленні типів</text>
<rect x="10.0" y="10.0" width="900.0" height="420.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка Strict Aliasing при порушенні сумісності типів</text>
<text x="460.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Оптимізатор компілятора (-O2/-O3) припускає, що вказівники різних типів не перетинаються</text>
<rect x="40.0" y="85.0" width="380.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код із порушенням Strict Aliasing</text>
<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">float f = 1.0f;</tspan><tspan x="60.0" dy="17.6">int* pi = reinterpret_cast&lt;int*&gt;(&amp;f);</tspan><tspan x="60.0" dy="17.6"></tspan><tspan x="60.0" dy="17.6">float step1 = f;     // Читання f</tspan><tspan x="60.0" dy="17.6">*pi = 0x40000000;    // Запис через int*</tspan><tspan x="60.0" dy="17.6">float step2 = f;     // Повторне читання f</tspan><tspan x="60.0" dy="17.6"></tspan><tspan x="60.0" dy="17.6">return step1 + step2;</tspan></text>
<rect x="460.0" y="85.0" width="420.0" height="315.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="670.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Що насправді робить оптимізатор</text>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="480.0" dy="0.0">1. Компілятор бачить, що float* і int*</tspan><tspan x="480.0" dy="15.6">   мають різні несумісні типи (ISO C++ §7.2.1).</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">2. За правилом Strict Aliasing запис у *pi</tspan><tspan x="480.0" dy="15.6">   НЕ МОЖЕ змінити значення змінної f.</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">3. Оптимізатор вважає читання step2</tspan><tspan x="480.0" dy="15.6">   надлишковим і використовує старе значення f,</tspan><tspan x="480.0" dy="15.6">   збережене у FPU/SSE-регістрі xmm0!</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">4. Результат: запис *pi ігнорується для f,</tspan><tspan x="480.0" dy="15.6">   повертається 1.0f + 1.0f замість очікуваного 3.0f.</tspan><tspan x="480.0" dy="15.6">   Поведінка є невизначеною (UB).</tspan></text>
</svg>