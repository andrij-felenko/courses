<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система чотирьох іменованих операторів приведення в C++</text>
<rect x="10.0" y="10.0" width="900.0" height="450.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система чотирьох іменованих операторів приведення в C++</text>
<text x="460.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розподіл за часом перевірки та характером перетворення типів</text>
<rect x="40.0" y="90.8" width="400.0" height="138.4" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="240.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">static_cast&lt;T&gt;(v)</tspan><tspan x="240.0" dy="16.9">Статична семантична конверсія</tspan><tspan x="240.0" dy="16.9">• Числові перетворення (int ↔ double)</tspan><tspan x="240.0" dy="16.9">• Upcast та unchecked downcast</tspan><tspan x="240.0" dy="16.9">• Зворотні перетворення через void*</tspan><tspan x="240.0" dy="16.9">• Виклик явних ctor / conversion ops</tspan><tspan x="240.0" dy="16.9">Вартість у runtime: 0 (компіляторна)</tspan></text>
<rect x="480.0" y="90.8" width="400.0" height="138.4" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="2.0"/><text x="680.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">dynamic_cast&lt;T&gt;(v)</tspan><tspan x="680.0" dy="16.9">Динамічна поліморфна перевірка</tspan><tspan x="680.0" dy="16.9">• Безпечний downcast в ієрархії з vtable</tspan><tspan x="680.0" dy="16.9">• Cross-cast між гілками спадкування</tspan><tspan x="680.0" dy="16.9">• Вказівник: повертає nullptr при невдачі</tspan><tspan x="680.0" dy="16.9">• Посилання: кидає std::bad_cast</tspan><tspan x="680.0" dy="16.9">Вартість у runtime: обхід RTTI-дерева</tspan></text>
<rect x="40.0" y="275.8" width="400.0" height="138.4" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="2.0"/><text x="240.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">const_cast&lt;T&gt;(v)</tspan><tspan x="240.0" dy="16.9">Модифікація кваліфікаторів типу</tspan><tspan x="240.0" dy="16.9">• Зняття або додавання const / volatile</tspan><tspan x="240.0" dy="16.9">• Безпечно: коли сам об'єкт не константний</tspan><tspan x="240.0" dy="16.9">• Небезпечно: запис у справжній const → UB</tspan><tspan x="240.0" dy="16.9">• Не змінює двійкове представлення</tspan><tspan x="240.0" dy="16.9">Вартість у runtime: 0 (кваліфікатор)</tspan></text>
<rect x="480.0" y="275.8" width="400.0" height="138.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="680.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">reinterpret_cast&lt;T&gt;(v)</tspan><tspan x="680.0" dy="16.9">Побітове переосмислення адреси</tspan><tspan x="680.0" dy="16.9">• Вказівник ↔ ціле число (uintptr_t)</tspan><tspan x="680.0" dy="16.9">• Вказівник ↔ вказівник без спільних предків</tspan><tspan x="680.0" dy="16.9">• Не зміщує байти при спадкуванні!</tspan><tspan x="680.0" dy="16.9">• Доступ до значення через чужий тип → UB</tspan><tspan x="680.0" dy="16.9">Вартість у runtime: 0 (Strict Aliasing ризик)</tspan></text>
</svg>