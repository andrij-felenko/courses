<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ятиступеневий каскад C-style cast</text>
<rect x="10.0" y="10.0" width="900.0" height="500.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ятиступеневий алгоритм розгортання C-style cast (T)expr</text>
<text x="460.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Компілятор вибирає перший варіант, що синтаксично підходить (ISO C++ [expr.cast])</text>
<rect x="75.0" y="82.0" width="450.0" height="45.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спроба 1: const_cast&lt;T&gt;(expr)</tspan><tspan x="300.0" dy="16.9">Зміна const / volatile</tspan></text>
<line x1="300.0" y1="129.0" x2="300.0" y2="147.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">не підійшло</text>
<rect x="75.0" y="148.1" width="450.0" height="45.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спроба 2: static_cast&lt;T&gt;(expr)</tspan><tspan x="300.0" dy="16.9">Семантичне приведення / upcast / downcast</tspan></text>
<line x1="300.0" y1="195.0" x2="300.0" y2="213.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">не підійшло</text>
<rect x="75.0" y="214.1" width="450.0" height="45.9" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="300.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спроба 3: static_cast + const_cast</tspan><tspan x="300.0" dy="16.9">Семантична зміна + зняття кваліфікатора</tspan></text>
<line x1="300.0" y1="261.0" x2="300.0" y2="279.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">не підійшло</text>
<rect x="75.0" y="280.1" width="450.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="299.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спроба 4: reinterpret_cast&lt;T&gt;(expr)</tspan><tspan x="300.0" dy="16.9">Побітове переосмислення вказівника</tspan></text>
<line x1="300.0" y1="327.0" x2="300.0" y2="345.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">не підійшло</text>
<rect x="75.0" y="346.1" width="450.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="365.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спроба 5: reinterpret_cast + const_cast</tspan><tspan x="300.0" dy="16.9">Побітове переосмислення + зняття const</tspan></text>
<rect x="580.0" y="105.0" width="310.0" height="370.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="735.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Чому це небезпечно?</text>
<text x="735.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тихий перехід у reinterpret_cast</text>
<text x="735.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Нехай клас Base стане private-базою</tspan><tspan x="735.0" dy="16.2">або втратить спадкування під час</tspan><tspan x="735.0" dy="16.2">рефакторингу. Тоді static_cast</tspan><tspan x="735.0" dy="16.2">дав би чітку помилку компіляції.</tspan><tspan x="735.0" dy="16.2"></tspan><tspan x="735.0" dy="16.2">Але C-style cast (Base*)pDerived</tspan><tspan x="735.0" dy="16.2">мовчки провалиться до Спроби 4</tspan><tspan x="735.0" dy="16.2">і згенерує reinterpret_cast!</tspan><tspan x="735.0" dy="16.2"></tspan><tspan x="735.0" dy="16.2">Вказівник не буде зміщено,</tspan><tspan x="735.0" dy="16.2">а програма отримає приховане UB.</tspan></text>
</svg>