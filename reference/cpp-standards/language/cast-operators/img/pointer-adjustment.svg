<text x="460.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Множинне спадкування: зміщення адреси при приведенні типів</text>
<text x="460.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розкладка об'єкта Derived у пам'яті: struct Derived : BaseA, BaseB</text>
<rect x="60.0" y="95.0" width="800.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="460.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Об'єкт Derived у пам'яті (розмір 24 байти)</text>
<rect x="80.0" y="130.0" width="240.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підоб'єкт BaseA (8 B)</text>
<text x="200.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зсув: +0 байтів [0x1000]</text>
<rect x="330.0" y="130.0" width="240.0" height="60.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/>
<text x="450.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підоб'єкт BaseB (8 B)</text>
<text x="450.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зсув: +8 байтів [0x1008]</text>
<rect x="580.0" y="130.0" width="260.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Власні поля Derived (8 B)</text>
<text x="710.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зсув: +16 байтів [0x1010]</text>
<text x="460.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приведення вказівника BaseB* ptr = 0x1008 назад до Derived*:</text>
<rect x="60.0" y="277.8" width="380.0" height="94.4" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">static_cast&lt;Derived*&gt;(ptr)</tspan><tspan x="250.0" dy="15.6">• Знає розкладку класів на етапі компіляції</tspan><tspan x="250.0" dy="15.6">• Автоматично віднімає зсув 8 байтів: 0x1008 − 8</tspan><tspan x="250.0" dy="15.6">• Результат: 0x1000 (початок об'єкта Derived)</tspan><tspan x="250.0" dy="15.6">✓ Коректний доступ до всіх полів та методів</tspan></text>
<rect x="461.6" y="277.8" width="416.7" height="94.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">reinterpret_cast&lt;Derived*&gt;(ptr)</tspan><tspan x="670.0" dy="15.6">• Не знає семантики класів, копіює «сирі» біти</tspan><tspan x="670.0" dy="15.6">• Залишає адресу 0x1008 без жодного зсуву</tspan><tspan x="670.0" dy="15.6">• Вважає початком Derived середину об'єкта!</tspan><tspan x="670.0" dy="15.6">✗ Спроба читання полів Derived/BaseA призведе до сміття/UB</tspan></text>
</svg>