<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол co_await</text>
<text x="590.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що насправді робить co_await e</text>
<rect x="310.0" y="76.0" width="560.0" height="46.0" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="102.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">з e добувають очікувача a (await_transform, operator co_await)</tspan></text>
<line x1="590.0" y1="122.0" x2="590.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="148.0" width="560.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">a.await_ready() → true: керування нікуди не віддають</tspan></text>
<line x1="590.0" y1="194.0" x2="590.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="220.0" width="560.0" height="60.0" rx="6" fill="#fff4d6" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">інакше: індекс точки відновлення записано в кадр —</tspan><tspan x="590.0" dy="15.6">корутина призупинена, кадр цілий</tspan></text>
<line x1="590.0" y1="280.0" x2="590.0" y2="304.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="306.0" width="560.0" height="62.0" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">a.await_suspend(h) — єдина мить, коли віддають handle</tspan><tspan x="590.0" dy="14.3">void або false: назад до того, хто відновлював</tspan><tspan x="590.0" dy="14.3">інший handle: керування прямо в ту корутину</tspan></text>
<line x1="590.0" y1="368.0" x2="590.0" y2="392.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="394.0" width="560.0" height="46.0" rx="6" fill="#eef2fb" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="421.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">… чекання … аж поки хтось покличе h.resume()</tspan></text>
<line x1="590.0" y1="440.0" x2="590.0" y2="464.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="466.0" width="560.0" height="46.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="493.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">a.await_resume() — її результат і є значення виразу co_await</tspan></text>
</svg>