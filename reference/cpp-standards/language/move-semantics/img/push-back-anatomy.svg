<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 505" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="950" height="505" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="475.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить push_back, коли місткість вичерпано</text>
<text x="302.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що відбувається всередині</text>
<text x="750.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що додають лічильники</text>
<rect x="52.0" y="80.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">тимчасовий Buffer(1 МіБ)</tspan><tspan x="302.0" dy="16.9">створюється у виразі виклику</tspan></text>
<rect x="580.0" y="80.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">ctor ×1</tspan></text>
<rect x="52.0" y="154.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">vector просить у купи сирий масив на 4 елементи —</tspan><tspan x="302.0" dy="16.9">конструкторів там ще немає</tspan></text>
<rect x="580.0" y="154.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">1 виділення</tspan></text>
<rect x="52.0" y="228.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">новий елемент будується з тимчасового —</tspan><tspan x="302.0" dy="16.9">це переміщення завжди</tspan></text>
<rect x="580.0" y="228.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="260.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">move-ctor ×1</tspan></text>
<rect x="52.0" y="392.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">старий масив звільняється,</tspan><tspan x="302.0" dy="16.9">тимчасовий гине наприкінці виразу</tspan></text>
<rect x="580.0" y="392.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">dtor ×3</tspan></text>
<rect x="52.0" y="302.0" width="500.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="302.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">два наявні елементи переносяться</tspan><tspan x="302.0" dy="16.9">у новий масив</tspan></text>
<rect x="580.0" y="302.0" width="340.0" height="34.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">noexcept: move-ctor ×2</tspan></text>
