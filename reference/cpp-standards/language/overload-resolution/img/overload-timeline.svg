<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віхи перевантаження: від слова overload до порядконезалежних правил</text>
<rect x="40.0" y="62.0" width="400.0" height="96.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1980—1983 · «C with Classes»</text>
<text x="60.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">перевантаження немає зовсім</tspan></text>
<text x="500.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="500.0" dy="0.0">чотири побоювання: розпухлий компілятор,</tspan><tspan x="500.0" dy="18.2">розпухла настанова, повільний код,</tspan><tspan x="500.0" dy="18.2">нечитний код</tspan></text>
<line x1="240.0" y1="166.0" x2="240.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="202.0" width="400.0" height="96.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1984 · дошка й перший дослід</text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">механіку розписано з Фелдманом,</tspan><tspan x="60.0" dy="17.6">Макілроєм і Шопіро</tspan></text>
<text x="500.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="500.0" dy="0.0">перша реалізація — 18 рядків у cfront,</tspan><tspan x="500.0" dy="18.2">опис у настанові виріс на півтори сторінки</tspan><tspan x="500.0" dy="18.2">з сорока двох</tspan></text>
<line x1="240.0" y1="306.0" x2="240.0" y2="334.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="342.0" width="400.0" height="96.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">жовтень 1985 · випуск 1.0</text>
<text x="60.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">перевантаження є, але його треба</tspan><tspan x="60.0" dy="17.6">оголосити словом overload</tspan></text>
<text x="500.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="500.0" dy="0.0">розсуд у два етапи: вбудовані перетворення</tspan><tspan x="500.0" dy="18.2">перемагають користувацькі; результат</tspan><tspan x="500.0" dy="18.2">залежить від порядку оголошень</tspan></text>
<line x1="240.0" y1="446.0" x2="240.0" y2="474.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="482.0" width="400.0" height="96.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">червень 1989 · cfront 2.0</text>
<text x="60.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">слово overload стає зайвим,</tspan><tspan x="60.0" dy="17.6">добір — порядконезалежним</tspan></text>
<text x="500.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="500.0" dy="0.0">більше викликів визнано неоднозначними:</tspan><tspan x="500.0" dy="18.2">чесна помилка замість тихого</tspan><tspan x="500.0" dy="18.2">випадкового вибору</tspan></text>
<line x1="240.0" y1="586.0" x2="240.0" y2="614.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="622.0" width="400.0" height="96.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">1990 · ARM, далі комітет ISO</text>
<text x="60.0" y="674.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">overload — у розділі анахронізмів</tspan></text>
<text x="500.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="500.0" dy="0.0">ранжування послідовностей перетворень</tspan><tspan x="500.0" dy="18.2">вигранено до вигляду, який стандарт</tspan><tspan x="500.0" dy="18.2">носить дотепер</tspan></text>
<text x="560.0" y="774.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">рух один: від позначки, яку ставить автор, до правила, тотожного для всіх викликів</text>
</svg>