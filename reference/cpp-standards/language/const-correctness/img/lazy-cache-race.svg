<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому mutable без замка ламається на двох потоках</text>
<text x="250.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік A — рахує й записує</text>
<text x="690.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік B — читає готове</text>
<text x="44.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">час</text>
<line x1="44.0" y1="114.0" x2="44.0" y2="412.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="152.8" y="109.0" width="194.4" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">бачить ready_ == false</tspan><tspan x="250.0" dy="16.9">рахує compute_summary()</tspan></text>
<rect x="138.0" y="209.5" width="224.1" height="37.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">запис 1: cache_ ← результат</tspan></text>
<rect x="156.5" y="287.5" width="187.0" height="37.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">запис 2: ready_ ← true</tspan></text>
<rect x="607.6" y="241.5" width="164.8" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">читає ready_ → true</tspan></text>
<rect x="581.7" y="319.5" width="216.7" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">читає cache_ → ще порожній</tspan></text>
<rect x="629.8" y="391.5" width="120.3" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="690.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">віддає сміття</tspan></text>
<line x1="355.5" y1="306.0" x2="595.6" y2="262.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">Обидва записи потоку A — звичайні, незахищені. Ні компілятор, ні процесор</tspan><tspan x="470.0" dy="16.9">не зобов'язані лишати їх у написаному порядку: ready_ може лягти першим.</tspan></text>
</svg>