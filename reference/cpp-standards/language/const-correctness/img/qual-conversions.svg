<rect x="495.0" y="228.0" width="250.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="620.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">char* const*</tspan></text>
