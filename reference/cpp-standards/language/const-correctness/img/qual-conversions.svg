<rect x="865.0" y="398.6" width="150.0" height="70.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="940.0" y="421.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">✓ можна</tspan><tspan x="940.0" dy="16.9">const додано й на</tspan><tspan x="940.0" dy="16.9">проміжному рівні</tspan></text>
