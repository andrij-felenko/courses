<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди константність додається мовчки, а куди — ніяк</text>
<text x="570.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">мовчазна конверсія: що компілятор зробить сам, без жодного касту</text>
<rect x="90.0" y="90.0" width="180.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">char*</tspan></text>
