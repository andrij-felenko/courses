<text x="570.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">правило: додаєш const на глибині — постав його й на всіх проміжних рівнях</text>
