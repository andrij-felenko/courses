<rect x="831.7" y="306.6" width="216.7" height="70.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="940.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">✗ не можна</tspan><tspan x="940.0" dy="16.9">крізь неї відкрився б</tspan><tspan x="940.0" dy="16.9">шлях запису в const-об'єкт</tspan></text>
