<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="496" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один рядок, два законні прочитання</text>
<rect x="330.0" y="52.0" width="340.0" height="44.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="500.0" y="79.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Widget w(Clock());</tspan></text>
<line x1="430.0" y1="98.0" x2="300.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="98.0" x2="700.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="150.0" width="420.0" height="146.0" rx="10" fill="#f7f8fa" stroke="#c8d2de" stroke-width="1.3"/>
<text x="250.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">прочитання 1 — визначення об'єкта</text>
<text x="250.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(відкинуто)</text>
<text x="58.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="58.0" dy="0.0">w — змінна типу Widget</tspan><tspan x="58.0" dy="17.4">аргумент — тимчасовий Clock()</tspan><tspan x="58.0" dy="17.4">саме цього хотів автор коду</tspan></text>
<rect x="540.0" y="150.0" width="420.0" height="146.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="750.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">прочитання 2 — оголошення функції</text>
<text x="750.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">(його й обирає мова)</text>
<text x="558.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="558.0" dy="0.0">w — функція, що повертає Widget</tspan><tspan x="558.0" dy="17.4">Clock() — безіменний параметр:</tspan><tspan x="558.0" dy="17.4">«функція без аргументів → Clock»,</tspan><tspan x="558.0" dy="17.4">а такий параметр стає вказівником</tspan></text>
<rect x="40.0" y="322.0" width="920.0" height="44.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="500.0" y="348.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">правило мови: те, що можна прочитати як оголошення, — є оголошенням</tspan></text>
<line x1="750.0" y1="320.0" x2="750.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">як зняти неоднозначність</text>
<rect x="40.0" y="412.0" width="290.0" height="46.0" rx="8" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.4"/><text x="185.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Widget w{};</tspan></text>
<rect x="355.0" y="412.0" width="290.0" height="46.0" rx="8" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.4"/><text x="500.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Widget w{Clock{}};</tspan></text>
<rect x="670.0" y="412.0" width="290.0" height="46.0" rx="8" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.4"/><text x="815.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Widget w((Clock()));</tspan></text>
</svg>