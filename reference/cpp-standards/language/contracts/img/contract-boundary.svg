<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі контракту: преумови, твердження та постумови</text>
<rect x="30.0" y="30.0" width="1020.0" height="420.0" rx="12" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="540.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інваріант класу / системи (чинний до виклику і після повернення)</text>
<rect x="60.0" y="90.0" width="280.0" height="330.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Зона викликача (Caller)</text>
<rect x="75.0" y="145.0" width="250.0" height="80.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="91.0" y="172.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#2457d6" text-anchor="start">pre: cond_1</text><text x="91.0" y="189.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#2457d6" text-anchor="start">pre [name]: cond_2</text><text x="91.0" y="205.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#2457d6" text-anchor="start">// Обов'язок викликача</text>
<text x="200.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія на вході:</text>
<text x="200.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Аргументи відповідають</text>
<text x="200.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">допустимому діапазону;</text>
<text x="200.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ресурси валідні й готові</text>
<text x="200.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Порушення = помилка викликача</text>
<line x1="340.0" y1="240.0" x2="400.0" y2="240.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="400.0" y="90.0" width="280.0" height="330.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="540.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тіло функції (Callee Body)</text>
<rect x="415.0" y="145.0" width="250.0" height="80.0" rx="8" fill="#fdfdfe" stroke="#333333" stroke-width="1.4"/><text x="431.0" y="164.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">void compute() {</text><text x="431.0" y="180.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  contract_assert: ok;</text><text x="431.0" y="197.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  // Внутрішній стан</text><text x="431.0" y="214.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">}</text>
<text x="540.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контрольні точки:</text>
<text x="540.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Перевірка локальних</text>
<text x="540.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">інваріантів алгоритму,</text>
<text x="540.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">цілісності проміжних даних</text>
<text x="540.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Внутрішній самоконтроль</text>
<line x1="680.0" y1="240.0" x2="740.0" y2="240.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="740.0" y="90.0" width="280.0" height="330.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="880.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Зона результату (Post)</text>
<rect x="755.0" y="145.0" width="250.0" height="80.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="771.0" y="172.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">post(r): r &gt;= 0</text><text x="771.0" y="189.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">post: balance() == old</text><text x="771.0" y="205.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">// Обов'язок реалізації</text>
<text x="880.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія на виході:</text>
<text x="880.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Результат r обчислено вірно;</text>
<text x="880.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стан об'єкта узгоджений;</text>
<text x="880.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ресурси збережено</text>
<text x="880.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Порушення = помилка функції</text>
</svg>