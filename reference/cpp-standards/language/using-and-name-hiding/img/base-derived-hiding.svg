<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затуляння методів базового класу та їх відновлення через using</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення множини перевантажень через using Base::foo</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Без using: Затуляння імен</text>
<rect x="90.0" y="90.6" width="300.0" height="78.8" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">struct Base {</tspan><tspan x="240.0" dy="15.6">    void foo(int);</tspan><tspan x="240.0" dy="15.6">    void foo(string_view);</tspan><tspan x="240.0" dy="15.6">};</tspan></text>
<rect x="86.4" y="198.4" width="307.3" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="240.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">struct Derived : Base {</tspan><tspan x="240.0" dy="15.6">    void foo(double); // затуляє Base::foo</tspan><tspan x="240.0" dy="15.6">};</tspan></text>
<rect x="52.2" y="308.4" width="375.7" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">d.foo(3.14);   // ✓ Derived::foo(double)</tspan><tspan x="240.0" dy="15.6">d.foo(10);     // ⚠ Derived::foo(10.0) [int-&gt;double]</tspan><tspan x="240.0" dy="15.6">d.foo(&quot;hi&quot;);   // ✗ Помилка компіляції!</tspan></text>
<line x1="240.0" y1="170.0" x2="240.0" y2="195.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="270.0" x2="240.0" y2="295.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="55.0" x2="470.0" y2="395.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="700.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З using: Об'єднана множина кандидатів</text>
<rect x="540.0" y="90.6" width="320.0" height="78.8" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">struct Base {</tspan><tspan x="700.0" dy="15.6">    void foo(int);</tspan><tspan x="700.0" dy="15.6">    void foo(string_view);</tspan><tspan x="700.0" dy="15.6">};</tspan></text>
<rect x="522.4" y="190.6" width="355.2" height="78.8" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="700.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">struct Derived : Base {</tspan><tspan x="700.0" dy="15.6">    using Base::foo; // втягує всі перевантаження</tspan><tspan x="700.0" dy="15.6">    void foo(double);</tspan><tspan x="700.0" dy="15.6">};</tspan></text>
<rect x="525.8" y="308.4" width="348.3" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">d.foo(3.14);   // ✓ Derived::foo(double)</tspan><tspan x="700.0" dy="15.6">d.foo(10);     // ✓ Base::foo(int) [точний збіг]</tspan><tspan x="700.0" dy="15.6">d.foo(&quot;hi&quot;);   // ✓ Base::foo(string_view)</tspan></text>
<line x1="700.0" y1="170.0" x2="700.0" y2="195.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="700.0" y1="270.0" x2="700.0" y2="295.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>