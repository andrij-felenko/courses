<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приведення в множинному спадкуванні змінює адресу</text>
<text x="250.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">об'єкт Sprite : Drawable, Serializable</text>
<rect x="100.0" y="90.0" width="300.0" height="100.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">підоб'єкт Drawable</tspan><tspan x="250.0" dy="16.9">(vptr₁ + поля)</tspan></text>
<text x="58.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">+0</text>
<rect x="100.0" y="200.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">підоб'єкт Serializable</tspan><tspan x="250.0" dy="16.9">(vptr₂ + поля)</tspan></text>
<text x="58.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">+16</text>
<rect x="100.0" y="310.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">власні поля Sprite</tspan></text>
<text x="58.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">+32</text>
<rect x="580.0" y="90.0" width="420.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Drawable* d = sprite;</tspan><tspan x="790.0" dy="16.9">адреса та сама, зсув 0</tspan></text>
<line x1="568.0" y1="140.0" x2="412.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="200.0" width="420.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Serializable* z = sprite;</tspan><tspan x="790.0" dy="16.9">компілятор мовчки додав 16</tspan></text>
<line x1="568.0" y1="250.0" x2="412.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="310.0" width="420.0" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">dynamic_cast&lt;Drawable*&gt;(z)</tspan><tspan x="790.0" dy="16.9">мусить відняти 16</tspan></text>
<text x="540.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Приведення — це не лише перевірка типу, а й правка адреси; величину правки знає тільки опис типу.</text>
</svg>