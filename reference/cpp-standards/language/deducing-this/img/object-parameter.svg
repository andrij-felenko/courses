<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Об'єкт як аргумент: безіменний і названий</text>
<line x1="560.0" y1="56.0" x2="560.0" y2="452.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="285.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">тип об'єкта записано кваліфікаторами</text>
<text x="845.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">тип об'єкта записано параметром</text>
<rect x="40.0" y="78.0" width="480.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7 5"/><text x="280.0" y="104.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c0392b" text-anchor="middle">аргумент об'єкта є, але імені не має:</text><text x="280.0" y="121.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c0392b" text-anchor="middle">його тип виводити нема з чого</text>
<rect x="40.0" y="174.0" width="480.0" height="44.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="56.0" y="200.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">std::string&amp;        get() &amp;</text>
<rect x="40.0" y="230.0" width="480.0" height="44.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="56.0" y="256.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">const std::string&amp;  get() const&amp;</text>
<rect x="40.0" y="286.0" width="480.0" height="44.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="56.0" y="312.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">std::string&amp;&amp;       get() &amp;&amp;</text>
<rect x="40.0" y="342.0" width="480.0" height="44.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="56.0" y="368.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">const std::string&amp;&amp; get() const&amp;&amp;</text>
<text x="280.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">чотири оголошення — один і той самий текст тіла</text>
<rect x="600.0" y="78.0" width="480.0" height="62.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="840.0" y="104.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="middle">self — звичайний параметр:</text><text x="840.0" y="121.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="middle">його тип виводиться, як у будь-якого шаблона</text>
<rect x="600.0" y="202.0" width="480.0" height="100.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.2"/><text x="616.0" y="238.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">template &lt;class Self&gt;</text><text x="616.0" y="256.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">auto&amp;&amp; get(this Self&amp;&amp; self)</text><text x="616.0" y="274.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">{ return std::forward&lt;Self&gt;(self).val; }</text>
<text x="840.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">одне тіло покриває всі чотири випадки</text>
<text x="840.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виклик не змінюється: b.get()</text>
<text x="840.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кваліфікаторів після дужок більше немає —</text>
<text x="840.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вони переїхали в тип параметра</text>
</svg>