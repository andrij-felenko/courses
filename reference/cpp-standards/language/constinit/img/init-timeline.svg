<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази ініціалізації: статична константна зона та динамічна зона ризику</text>
<rect x="40.0" y="40.0" width="920.0" height="390.0" rx="6" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ШКАЛА ЧАСУ: ВІД ЗАВАНТАЖЕННЯ БІНАРНИКА ДО MAIN()</text>
<rect x="60.0" y="100.0" width="410.0" height="260.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="265.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СТАТИЧНА ІНІЦІАЛІЗАЦІЯ (до будь-якого коду)</text>
<rect x="80.0" y="155.0" width="370.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="179.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">1. Нульова ініціалізація (Zero init)</tspan><tspan x="265.0" dy="15.6">Очищення пам'яті (.bss / занулення байтів)</tspan></text>
<line x1="265.0" y1="215.0" x2="265.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="240.0" width="370.0" height="70.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">2. Константна ініціалізація (Constant init)</tspan><tspan x="265.0" dy="15.6">constinit, constexpr, сталі вирази (.data)</tspan><tspan x="265.0" dy="15.6">Гарантовано готова до старту програми</tspan></text>
<text x="265.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Імунітет до порядку ініціалізації (без SIOF)</text>
<line x1="490.0" y1="95.0" x2="490.0" y2="370.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="510.0" y="100.0" width="430.0" height="260.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="725.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДИНАМІЧНА ІНІЦІАЛІЗАЦІЯ (час виконання)</text>
<rect x="530.0" y="155.0" width="390.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">3. Динамічні конструктори глобальних об'єктів</tspan><tspan x="725.0" dy="15.6">Виклики звичайних функцій, виділення ресурсів</tspan></text>
<line x1="725.0" y1="220.0" x2="725.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="245.0" width="390.0" height="65.0" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="725.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Порядок між одиницями трансляції НЕ визначено!</tspan><tspan x="725.0" dy="15.6">Ризик звернення до неініціалізованого об'єкта</tspan><tspan x="725.0" dy="15.6">(Static Initialization Order Fiasco)</tspan></text>
<text x="725.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Невизначена поведінка при міжфайлових залежностях</text>
<line x1="470.0" y1="385.0" x2="530.0" y2="385.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="370.0" width="240.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Виклик функції main()</tspan></text>
<text x="500.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">constinit жорстко прив'язує змінну до фази константної ініціалізації,</tspan><tspan x="500.0" dy="15.4">унеможливлюючи відкладення обчислення у динамічну фазу.</tspan></text>
</svg>