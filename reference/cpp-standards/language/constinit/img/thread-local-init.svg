<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 492.16" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="492.16" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація thread_local за допомогою constinit: усунення перевірок при доступі</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕХАНІЗМ ІНІЦІАЛІЗАЦІЇ THREAD_LOCAL ЗМІННИХ</text>
<rect x="40.0" y="65.0" width="440.0" height="360.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="260.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗВИЧАЙНИЙ thread_local</text>
<rect x="60.0" y="120.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">thread_local Widget t_w(compute_val());</tspan></text>
<line x1="260.0" y1="175.0" x2="260.0" y2="205.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="210.0" width="400.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Компілятор генерує приховану функцію-обгортку</tspan><tspan x="260.0" dy="14.3">та прапорець ініціалізації для кожного потоку.</tspan><tspan x="260.0" dy="14.3">При КОЖНОМУ зверненні: перевірка if (!inited) init();</tspan></text>
<line x1="260.0" y1="285.0" x2="260.0" y2="315.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="320.0" width="400.0" height="80.0" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Накладні витрати: розгалуження при кожному доступі,</tspan><tspan x="260.0" dy="14.3">виклики функцій підтримки TLS у рантаймі,</tspan><tspan x="260.0" dy="14.3">ризик виклику TLS до завершення конструктора</tspan></text>
<rect x="520.0" y="65.0" width="440.0" height="360.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">constinit thread_local</text>
<rect x="540.0" y="120.0" width="400.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">constinit thread_local State t_s{100, 0};</tspan></text>
<line x1="740.0" y1="175.0" x2="740.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="210.0" width="400.0" height="68.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Значення формується як готовий образ TLS (.tdata).</tspan><tspan x="740.0" dy="14.3">При створенні потоку образ копіюється апаратно/ОС.</tspan><tspan x="740.0" dy="14.3">Жодної функції-обгортки та перевірок!</tspan></text>
<line x1="740.0" y1="285.0" x2="740.0" y2="315.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="320.0" width="400.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Нульові накладні витрати: прямий доступ через</tspan><tspan x="740.0" dy="14.3">зсув у регістрі сегмента (%fs / %gs / TP),</tspan><tspan x="740.0" dy="14.3">нуль розгалужень, 100% потокобезпечний старт</tspan></text>
<text x="500.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">constinit thread_local усуває runtime-обгортки TLS і перетворює звернення</tspan><tspan x="500.0" dy="15.4">до потоково-локальної змінної на одну інструкцію зміщення пам'яті.</tspan></text>
</svg>