<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="252.1" y="17.0" width="535.8" height="36.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Синтаксична неоднозначність залежних імен у шаблонах</tspan></text>
<rect x="40.0" y="75.0" width="460.0" height="335.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="270.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неоднозначність типу: ключове слово typename</text>
<text x="270.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">Конфлікт: Тлумачення виразу T::name * p;</tspan><tspan x="270.0" dy="15.6">Тип (оголошення покажчика) чи статичне поле (множення)?</tspan></text>
<rect x="109.5" y="173.4" width="321.0" height="63.2" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">T::SubType * ptr;</tspan><tspan x="270.0" dy="15.6">// Компілятор вважає: T::SubType — значення,</tspan><tspan x="270.0" dy="15.6">// і виконує множення на ptr!</tspan></text>
<line x1="270.0" y1="255.0" x2="270.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="89.0" y="303.4" width="362.0" height="63.2" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="323.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">typename T::SubType * ptr;</tspan><tspan x="270.0" dy="15.6">// Ключове слово typename явно вказує компілятору:</tspan><tspan x="270.0" dy="15.6">// T::SubType є типом даних у залежній області</tspan></text>
<rect x="540.0" y="75.0" width="460.0" height="335.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="770.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неоднозначність методу: префікс template</text>
<text x="770.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="770.0" dy="0.0">Конфлікт: Тлумачення виразу obj.func&lt;int&gt;(val);</tspan><tspan x="770.0" dy="15.6">Виклик методу-шаблону чи операція менше-ніж (obj.func &lt; int)?</tspan></text>
<rect x="595.8" y="173.4" width="348.3" height="63.2" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">obj.get&lt;int&gt;(0);</tspan><tspan x="770.0" dy="15.6">// Символ '&lt;' парситься як оператор 'менше ніж',</tspan><tspan x="770.0" dy="15.6">// спричиняючи синтаксичну помилку!</tspan></text>
<line x1="770.0" y1="255.0" x2="770.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="592.4" y="303.4" width="355.2" height="63.2" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="323.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">obj.template get&lt;int&gt;(0);</tspan><tspan x="770.0" dy="15.6">// Префікс template явно вказує компілятору:</tspan><tspan x="770.0" dy="15.6">// символ '&lt;' відкриває список аргументів шаблону</tspan></text>
<rect x="111.0" y="428.5" width="817.9" height="33.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="449.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">На Фазі 1 компілятор не знає структуру T, тому за замовчуванням вважає всі залежні імена значеннями</tspan></text>
</svg>