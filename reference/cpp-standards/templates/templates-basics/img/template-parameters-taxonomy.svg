<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="331.4" y="17.0" width="377.1" height="36.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Таксономія параметрів шаблонів у C++</tspan></text>
<rect x="340.7" y="78.0" width="358.5" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Параметри шаблону (Template Parameters)</tspan></text>
<line x1="380.0" y1="115.0" x2="180.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="115.0" x2="520.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="115.0" x2="860.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="160.0" width="300.0" height="270.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="180.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Параметри-типи</text>
<text x="180.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">typename T або class T</tspan><tspan x="180.0" dy="15.6">Приймають будь-які типи даних</tspan></text>
<rect x="77.7" y="261.2" width="204.7" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">template &lt;typename T = int&gt;</tspan><tspan x="180.0" dy="15.6">void swap(T&amp; a, T&amp; b);</tspan></text>
<rect x="84.5" y="343.4" width="191.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Приклади аргументів:</tspan><tspan x="180.0" dy="15.6">int, double, std::string,</tspan><tspan x="180.0" dy="15.6">std::vector&lt;int&gt;, void*</tspan></text>
<rect x="350.0" y="160.0" width="340.0" height="270.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="520.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Нетипізовані (NTTP)</text>
<text x="520.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">Константні значення часу компіляції</tspan><tspan x="520.0" dy="15.6">Цілі, покажчики, auto, C++20 float/str</tspan></text>
<rect x="412.8" y="255.2" width="214.4" height="59.6" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">template &lt;typename T, size_t N&gt;</tspan><tspan x="520.0" dy="14.3">struct Array { T buf[N]; };</tspan><tspan x="520.0" dy="14.3">template &lt;auto Val&gt; void log();</tspan></text>
<rect x="394.0" y="338.1" width="252.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Еволюція стандарту:</tspan><tspan x="520.0" dy="14.3">• C++98: int, enum, вказівники</tspan><tspan x="520.0" dy="14.3">• C++17: auto N (виведення типу)</tspan><tspan x="520.0" dy="14.3">• C++20: float, double, Literal Class</tspan></text>
<rect x="710.0" y="160.0" width="300.0" height="270.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="860.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Параметри-шаблони</text>
<text x="860.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">Шаблони як параметри</tspan><tspan x="860.0" dy="15.6">template &lt;typename&gt; class C</tspan></text>
<rect x="756.0" y="255.2" width="208.1" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="860.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">template &lt;typename T,</tspan><tspan x="860.0" dy="14.3">  template &lt;typename&gt; class C&gt;</tspan><tspan x="860.0" dy="14.3">class Queue { C&lt;T&gt; data; };</tspan></text>
<rect x="754.2" y="343.4" width="211.5" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Передається сімейство типів:</tspan><tspan x="860.0" dy="15.6">Queue&lt;int, std::vector&gt;</tspan><tspan x="860.0" dy="15.6">(без повторення &lt;int&gt;)</tspan></text>
<rect x="159.4" y="448.5" width="721.2" height="33.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="469.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Поєднання трьох категорій створює виразну й строго типізовану систему метапрограмування</tspan></text>
</svg>