<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм часткового впорядкування шаблонів функцій</text>
<rect x="30.0" y="15.0" width="960.0" height="36.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="510.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Алгоритм часткового впорядкування шаблонів (Partial Ordering of Function Templates)</text>
<rect x="81.6" y="73.4" width="156.8" height="63.2" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="160.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Шаблон 1 (Загальний)</tspan><tspan x="160.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="160.0" dy="15.6">void process(T)</tspan></text>
<rect x="78.2" y="203.4" width="163.6" height="63.2" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="160.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Шаблон 2 (Вказівники)</tspan><tspan x="160.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="160.0" dy="15.6">void process(T*)</tspan></text>
<rect x="347.1" y="75.2" width="245.7" height="59.6" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="470.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#744210" text-anchor="middle"><tspan x="470.0" dy="0.0">Крок 1: Синтез фіктивних типів</tspan><tspan x="470.0" dy="14.3">Параметр T замінюється на унікальний</tspan><tspan x="470.0" dy="14.3">штучний тип-маркер U1 (UniqueType)</tspan></text>
<line x1="280.0" y1="105.0" x2="335.0" y2="105.0" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280.0" y1="235.0" x2="335.0" y2="140.0" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="352.3" y="187.2" width="235.4" height="55.6" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="470.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#22543d" text-anchor="middle"><tspan x="470.0" dy="0.0">Крок 2А: Підстановка процесу 2 у 1</tspan><tspan x="470.0" dy="14.3">Аргумент process(U1*) -&gt; process(T)</tspan><tspan x="470.0" dy="14.3">Виведення T = U1* -&gt; УСПІХ</tspan></text>
<rect x="352.3" y="282.2" width="235.4" height="55.6" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="470.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#742a2a" text-anchor="middle"><tspan x="470.0" dy="0.0">Крок 2Б: Підстановка процесу 1 у 2</tspan><tspan x="470.0" dy="14.3">Аргумент process(U1) -&gt; process(T*)</tspan><tspan x="470.0" dy="14.3">Виведення T* неможливе -&gt; НЕВДАЧА</tspan></text>
<line x1="470.0" y1="155.0" x2="470.0" y2="175.0" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="605.0" y1="215.0" x2="685.0" y2="255.0" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="605.0" y1="310.0" x2="685.0" y2="275.0" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.6" y="220.9" width="258.7" height="88.2" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="830.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c5282" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Крок 3: Висновок (Strict Ordering)</tspan><tspan x="830.0" dy="14.3">Шаблон 2 приймає вужчу підмножину</tspan><tspan x="830.0" dy="14.3">типів, ніж Шаблон 1.</tspan><tspan x="830.0" dy="14.3">process(T*) є БІЛЬШ СПЕЦІАЛІЗОВАНИМ</tspan><tspan x="830.0" dy="14.3">і перемагає під час перевантаження</tspan></text>
</svg>