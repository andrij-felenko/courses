<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виведення типу повернення auto при умовному компілюванні</text>
<rect x="30.0" y="20.0" width="420.0" height="150.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="240.0" y="39.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Шаблон функції з виведенням auto:</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">template&lt;typename T&gt;</tspan><tspan x="240.0" dy="14.3">auto get_representation(T val) {</tspan><tspan x="240.0" dy="14.3">  if constexpr (std::is_integral_v&lt;T&gt;)</tspan><tspan x="240.0" dy="14.3">    return val * 2;          // int</tspan><tspan x="240.0" dy="14.3">  else if constexpr (std::is_floating_point_v&lt;T&gt;)</tspan><tspan x="240.0" dy="14.3">    return val + 0.5;        // double</tspan><tspan x="240.0" dy="14.3">  else</tspan><tspan x="240.0" dy="14.3">    return std::string(val); // std::string</tspan><tspan x="240.0" dy="14.3">}</tspan></text>
<rect x="30.0" y="185.0" width="420.0" height="150.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="240.0" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Правило виведення типу повернення [dcl.spec.auto]:</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">У звичайній функції кожна інструкція return повинна</tspan><tspan x="240.0" dy="14.3">виводити в точності один і той самий тип даних.</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">В if constexpr інструкції return у відкинутих гілках</tspan><tspan x="240.0" dy="14.3">ПОВНІСТЮ ІГНОРУЮТЬСЯ під час виведення типу auto!</tspan></text>
<rect x="480.0" y="20.0" width="470.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="42.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Виклик get_representation(10) [T = int]:</tspan><tspan x="715.0" dy="14.3"></tspan><tspan x="715.0" dy="14.3">• Активна гілка 1 ⇒ повертає 20 (int)</tspan><tspan x="715.0" dy="14.3">• Гілки 2 і 3 відкинуті й не впливають на результат</tspan><tspan x="715.0" dy="14.3">⇒ Результуючий тип функції: int</tspan></text>
<rect x="480.0" y="130.0" width="470.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="152.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Виклик get_representation(3.14) [T = double]:</tspan><tspan x="715.0" dy="14.3"></tspan><tspan x="715.0" dy="14.3">• Активна гілка 2 ⇒ повертає 3.64 (double)</tspan><tspan x="715.0" dy="14.3">• Гілки 1 і 3 відкинуті й не впливають на результат</tspan><tspan x="715.0" dy="14.3">⇒ Результуючий тип функції: double</tspan></text>
<rect x="480.0" y="240.0" width="470.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="262.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Виклик get_representation(&quot;text&quot;) [T = const char*]:</tspan><tspan x="715.0" dy="14.3"></tspan><tspan x="715.0" dy="14.3">• Активна гілка 3 ⇒ повертає об'єкт std::string</tspan><tspan x="715.0" dy="14.3">• Гілки 1 і 2 відкинуті й не викликають множення тексту</tspan><tspan x="715.0" dy="14.3">⇒ Результуючий тип функції: std::string</tspan></text>
</svg>