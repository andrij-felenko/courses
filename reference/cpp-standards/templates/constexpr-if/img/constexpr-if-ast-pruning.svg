<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм відсікання синтаксичного дерева (AST Pruning) в if constexpr</text>
<rect x="20.0" y="20.0" width="290.0" height="130.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="165.0" y="50.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Фаза 1: Синтаксичний аналіз</tspan><tspan x="165.0" dy="15.6">(Template Definition Parsing)</tspan><tspan x="165.0" dy="15.6"></tspan><tspan x="165.0" dy="15.6">• Перевірка базової граматики C++</tspan><tspan x="165.0" dy="15.6">• Побудова неінстанційованого AST</tspan><tspan x="165.0" dy="15.6">• Збереження залежних імен без перевірки</tspan></text>
<line x1="320.0" y1="85.0" x2="370.0" y2="85.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="20.0" width="310.0" height="130.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="535.0" y="50.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Фаза 2: Інстанціювання для типу T</tspan><tspan x="535.0" dy="15.6">(Template Instantiation)</tspan><tspan x="535.0" dy="15.6"></tspan><tspan x="535.0" dy="15.6">• Підстановка конкретного типу T</tspan><tspan x="535.0" dy="15.6">• Обчислення умови if constexpr (bool)</tspan><tspan x="535.0" dy="15.6">• Вибір активної гілки компілятором</tspan></text>
<line x1="700.0" y1="55.0" x2="745.0" y2="55.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="115.0" x2="745.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="755.0" y="20.0" width="265.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="887.5" y="39.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="887.5" dy="0.0">Активна гілка (Active Branch)</tspan><tspan x="887.5" dy="14.3">• Повне інстанціювання залежних типів</tspan><tspan x="887.5" dy="14.3">• Генерація інструкцій машинного коду</tspan></text>
<rect x="755.0" y="90.0" width="265.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="887.5" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="887.5" dy="0.0">Відкинута гілка (Discarded Statement)</tspan><tspan x="887.5" dy="14.3">• Залежні вирази НЕ інстанціюються</tspan><tspan x="887.5" dy="14.3">• Машинний код НЕ генерується взагалі</tspan></text>
<rect x="20.0" y="175.0" width="1000.0" height="280.0" rx="6" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="35.0" y="190.0" width="460.0" height="110.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="265.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Шаблон функції з умовним компілюванням:</tspan><tspan x="265.0" dy="15.6"></tspan><tspan x="265.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="265.0" dy="15.6">auto process(T val) {</tspan><tspan x="265.0" dy="15.6">  if constexpr (std::is_pointer_v&lt;T&gt;) return *val;</tspan><tspan x="265.0" dy="15.6">  else return val;</tspan><tspan x="265.0" dy="15.6">}</tspan></text>
<rect x="515.0" y="190.0" width="490.0" height="115.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="760.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Спеціалізація process&lt;int&gt;(int val):</tspan><tspan x="760.0" dy="14.3"></tspan><tspan x="760.0" dy="14.3">• Умова std::is_pointer_v&lt;int&gt; ⇒ false</tspan><tspan x="760.0" dy="14.3">• return *val; ⇒ ВІДКИДАЄТЬСЯ (немає помилки розіменування int!)</tspan><tspan x="760.0" dy="14.3">• return val; ⇒ активна (тип повернення виведено як int)</tspan></text>
<rect x="515.0" y="320.0" width="490.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="352.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Спеціалізація process&lt;int*&gt;(int* val):</tspan><tspan x="760.0" dy="14.3"></tspan><tspan x="760.0" dy="14.3">• Умова std::is_pointer_v&lt;int*&gt; ⇒ true</tspan><tspan x="760.0" dy="14.3">• return *val; ⇒ активна (розпаковує вказівник, тип int)</tspan><tspan x="760.0" dy="14.3">• return val; ⇒ ВІДКИДАЄТЬСЯ (вказівник не повертається)</tspan></text>
<rect x="35.0" y="320.0" width="460.0" height="115.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="265.0" y="352.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Ключовий інваріант стандарту C++17 [stmt.if]:</tspan><tspan x="265.0" dy="14.3"></tspan><tspan x="265.0" dy="14.3">Відкинута гілка у тілі шаблону не піддається</tspan><tspan x="265.0" dy="14.3">інстанціюванню для заданих аргументів шаблону,</tspan><tspan x="265.0" dy="14.3">запобігаючи помилкам несумісності типів і методів.</tspan></text>
</svg>