<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія метафункції std::enable_if та генерація помилки підстановки</text>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній механізм std::enable_if: наявність або відсутність вкладеного ::type</text>
<rect x="155.3" y="68.0" width="209.4" height="53.9" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Умова B == true</tspan><tspan x="260.0" dy="16.9">std::enable_if&lt;true, T&gt;</tspan></text>
<rect x="146.0" y="150.7" width="228.1" height="108.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Спеціалізація шаблону:</tspan><tspan x="260.0" dy="16.9">template&lt;typename T&gt;</tspan><tspan x="260.0" dy="16.9">struct enable_if&lt;true, T&gt; {</tspan><tspan x="260.0" dy="16.9">    using type = T;</tspan><tspan x="260.0" dy="16.9">};</tspan></text>
<rect x="118.0" y="281.4" width="283.9" height="67.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Результат розіменування ::type:</tspan><tspan x="260.0" dy="15.6">Успіх: тип T підставлено у сигнатуру</tspan><tspan x="260.0" dy="15.6">Функція потрапляє до списку кандидатів</tspan></text>
<line x1="260.0" y1="123.0" x2="260.0" y2="157.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="253.0" x2="260.0" y2="283.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="611.3" y="68.0" width="217.4" height="53.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Умова B == false</tspan><tspan x="720.0" dy="16.9">std::enable_if&lt;false, T&gt;</tspan></text>
<rect x="557.8" y="159.2" width="324.4" height="91.7" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Первинний шаблон:</tspan><tspan x="720.0" dy="16.9">template&lt;bool B, typename T = void&gt;</tspan><tspan x="720.0" dy="16.9">struct enable_if {};</tspan><tspan x="720.0" dy="16.9">/* Вкладений псевдонім type ВІДСУТНІЙ */</tspan></text>
<rect x="557.5" y="281.4" width="325.0" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Спроба доступу до enable_if&lt;false, T&gt;::type:</tspan><tspan x="720.0" dy="15.6">Невдача: член type не існує у структурі!</tspan><tspan x="720.0" dy="15.6">SFINAE відкидає перевантаження</tspan></text>
<line x1="720.0" y1="123.0" x2="720.0" y2="157.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="253.0" x2="720.0" y2="283.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>