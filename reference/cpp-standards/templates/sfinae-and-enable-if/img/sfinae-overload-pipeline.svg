<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр SFINAE у процесі розв'язання перевантажень</text>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях виклику функції через конвеєр SFINAE та розв'язання перевантажень</text>
<rect x="59.6" y="79.9" width="140.8" height="60.2" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Точка виклику</tspan><tspan x="130.0" dy="18.2">serialize(42)</tspan></text>
<rect x="250.3" y="45.6" width="259.4" height="78.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="65.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Кандидат A (шаблон):</tspan><tspan x="380.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="380.0" dy="15.6">enable_if_t&lt;is_integral_v&lt;T&gt;, void&gt;</tspan><tspan x="380.0" dy="15.6">serialize(T val)</tspan></text>
<rect x="240.0" y="165.6" width="279.9" height="78.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Кандидат B (шаблон):</tspan><tspan x="380.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="380.0" dy="15.6">decltype(declval&lt;T&gt;().write(), void())</tspan><tspan x="380.0" dy="15.6">serialize(T val)</tspan></text>
<line x1="206.4" y1="110.0" x2="230.0" y2="85.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="206.4" y1="110.0" x2="230.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="567.4" y="45.6" width="225.2" height="78.8" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="65.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Підстановка T = int:</tspan><tspan x="680.0" dy="15.6">is_integral_v&lt;int&gt; == true</tspan><tspan x="680.0" dy="15.6">enable_if_t&lt;true, void&gt; ⇒ void</tspan><tspan x="680.0" dy="15.6">Сигнатура валідна: void(int)</tspan></text>
<rect x="560.6" y="165.6" width="238.9" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Підстановка T = int:</tspan><tspan x="680.0" dy="15.6">declval&lt;int&gt;().write() ⇒ ПОМИЛКА</tspan><tspan x="680.0" dy="15.6">Тип int не має методу write()</tspan><tspan x="680.0" dy="15.6">Невдача в сигнатурі (SFINAE)</tspan></text>
<line x1="530.0" y1="85.0" x2="535.0" y2="85.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="205.0" x2="535.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="844.8" y="53.4" width="170.5" height="63.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="73.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Множина кандидатів:</tspan><tspan x="930.0" dy="15.6">Кандидат A включено</tspan><tspan x="930.0" dy="15.6">Обирається для виклику</tspan></text>
<rect x="844.8" y="173.4" width="170.5" height="63.2" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="930.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Тихе вилучення:</tspan><tspan x="930.0" dy="15.6">Кандидат B відкинутий</tspan><tspan x="930.0" dy="15.6">Жодної помилки збірки!</tspan></text>
<line x1="825.0" y1="85.0" x2="835.0" y2="85.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="825.0" y1="205.0" x2="835.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="124.4" y="312.6" width="791.2" height="74.8" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="520.0" y="337.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ключова вимога стандарту C++ (§13.10.2):</tspan><tspan x="520.0" dy="16.9">Помилка підстановки дає тихе вилучення лише у безпосередньому контексті (сигнатурі) оголошення шаблону.</tspan><tspan x="520.0" dy="16.9">Помилка всередині тіла функції або всередині інстанційованого класу є жорсткою помилкою (Hard Error).</tspan></text>
</svg>