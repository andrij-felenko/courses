<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Недедуковані контексти у шаблонах C++</text>
<rect x="109.1" y="53.7" width="261.7" height="112.6" rx="6" fill="#fdf0ed" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Дедукований контекст (Deduced)</tspan><tspan x="240.0" dy="16.9">template&lt;typename T&gt;</tspan><tspan x="240.0" dy="16.9">void compare(T a, T b);</tspan><tspan x="240.0" dy="16.9">Виклик: compare(10, 20.0);</tspan><tspan x="240.0" dy="16.9">ПОМИЛКА: конфлікт int vs double</tspan></text>
<text x="240.0" y="37.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Пряме зіставлення типів (Deduction Conflict)</text>
<rect x="557.3" y="53.7" width="365.4" height="112.6" rx="6" fill="#eaf7ee" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Недедукований контекст (Non-deduced)</tspan><tspan x="740.0" dy="16.9">template&lt;typename T&gt;</tspan><tspan x="740.0" dy="16.9">void compare(T a, std::type_identity_t&lt;T&gt; b);</tspan><tspan x="740.0" dy="16.9">Виклик: compare(10, 20.0);</tspan><tspan x="740.0" dy="16.9">УСПІХ: T = int, аргумент b приводиться до int</tspan></text>
<text x="740.0" y="37.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Кероване вимкнення виведення (type_identity)</text>
<line x1="380.9" y1="110.0" x2="547.3" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.2" y="231.1" width="887.6" height="57.9" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="490.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">std::type_identity_t&lt;T&gt; (або typename Class&lt;T&gt;::type) блокує шаблонне виведення для аргументу b.</tspan><tspan x="490.0" dy="16.9">Компілятор виводить T виключно з аргументу a, а для другого аргументу застосовує стандартне неявне приведення типів.</tspan></text>
<text x="490.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Недедуковані контексти дозволяють розділити джерело типу від споживача перетвореного типу</text>
</svg>