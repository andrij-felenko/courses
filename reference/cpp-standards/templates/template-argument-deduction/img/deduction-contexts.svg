<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 414" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="414" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три контексти виведення аргументів шаблону</text>
<rect x="20.0" y="40.0" width="214.0" height="46.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="127.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.0" dy="0.0">Контекст передачі</tspan></text>
<rect x="240.0" y="40.0" width="234.0" height="46.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="357.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="357.0" dy="0.0">Шаблон параметра</tspan></text>
<rect x="480.0" y="40.0" width="294.0" height="46.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.0" dy="0.0">Поведінка трансформації типу</tspan></text>
<rect x="780.0" y="40.0" width="234.0" height="46.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="897.0" dy="0.0">Приклад виведення типу</tspan></text>
<rect x="20.0" y="92.0" width="214.0" height="90.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="127.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.0" dy="0.0">За значенням</tspan><tspan x="127.0" dy="15.6">(Pass-by-value)</tspan></text>
<rect x="240.0" y="92.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="357.0" y="133.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="357.0" dy="15.6">void f(T x);</tspan></text>
<rect x="480.0" y="92.0" width="294.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Відкидання top-level const/volatile.</tspan><tspan x="627.0" dy="15.6">Масиви та функції розпадаються</tspan><tspan x="627.0" dy="15.6">у сирі вказівники (type decay).</tspan></text>
<rect x="780.0" y="92.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">const int a = 5;  ⇒ T = int</tspan><tspan x="897.0" dy="14.3">int arr[10];      ⇒ T = int*</tspan><tspan x="897.0" dy="14.3">void fn();        ⇒ T = void(*)()</tspan></text>
<rect x="20.0" y="188.0" width="214.0" height="90.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="127.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.0" dy="0.0">За lvalue-посиланням</tspan><tspan x="127.0" dy="15.6">(Pass-by-reference)</tspan></text>
<rect x="240.0" y="188.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="357.0" y="221.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="357.0" dy="15.6">void f(T&amp; x);</tspan><tspan x="357.0" dy="15.6">void g(const T&amp; x);</tspan></text>
<rect x="480.0" y="188.0" width="294.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="221.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">Посилання в аргументі ігнорується.</tspan><tspan x="627.0" dy="15.6">Константність зберігається.</tspan><tspan x="627.0" dy="15.6">Масиви зберігають точний розмір.</tspan></text>
<rect x="780.0" y="188.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">const int a = 5;  ⇒ T = const int</tspan><tspan x="897.0" dy="14.3">int arr[10];      ⇒ T = int[10]</tspan><tspan x="897.0" dy="14.3">                   (x: int(&amp;)[10])</tspan></text>
<rect x="20.0" y="284.0" width="214.0" height="90.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="127.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="127.0" dy="0.0">Передавальне посилання</tspan><tspan x="127.0" dy="15.6">(Forwarding Reference)</tspan></text>
<rect x="240.0" y="284.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="357.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="357.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="357.0" dy="15.6">void f(T&amp;&amp; x);</tspan></text>
<rect x="480.0" y="284.0" width="294.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="627.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.0" dy="0.0">lvalue виводить T як посилання T&amp;.</tspan><tspan x="627.0" dy="15.6">rvalue виводить T як не-посилання T.</tspan><tspan x="627.0" dy="15.6">Спрацьовує згортання посилань.</tspan></text>
<rect x="780.0" y="284.0" width="234.0" height="90.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="897.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="897.0" dy="0.0">int a = 5;</tspan><tspan x="897.0" dy="15.6">f(a);   ⇒ T = int&amp;  ⇒ x: int&amp;</tspan><tspan x="897.0" dy="15.6">f(10);  ⇒ T = int   ⇒ x: int&amp;&amp;</tspan></text>
</svg>