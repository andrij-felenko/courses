<text x="510.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Кожен новий тип аргументу повторює весь конвеєр з етапу 1 до етапу 4</text>
