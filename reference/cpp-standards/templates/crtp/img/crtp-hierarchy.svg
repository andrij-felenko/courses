<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація окремих типів Base&lt;T&gt; для кожного похідного класу</text>
<rect x="264.8" y="34.1" width="450.4" height="91.7" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">template &lt;typename Derived&gt;</tspan><tspan x="490.0" dy="16.9">class Base {</tspan><tspan x="490.0" dy="16.9">  void process() { static_cast&lt;Derived*&gt;(this)-&gt;impl(); }</tspan><tspan x="490.0" dy="16.9">};</tspan></text>
<rect x="135.4" y="196.2" width="209.2" height="87.7" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">class DerivedA :</tspan><tspan x="240.0" dy="16.9">  public Base&lt;DerivedA&gt; {</tspan><tspan x="240.0" dy="16.9">  void impl();</tspan><tspan x="240.0" dy="16.9">};</tspan></text>
<rect x="635.4" y="196.2" width="209.2" height="87.7" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">class DerivedB :</tspan><tspan x="740.0" dy="16.9">  public Base&lt;DerivedB&gt; {</tspan><tspan x="740.0" dy="16.9">  void impl();</tspan><tspan x="740.0" dy="16.9">};</tspan></text>
<line x1="240.0" y1="190.0" x2="380.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
