<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Subsumption: нормалізація обмежень та вибір шаблону</text>
<rect x="25.0" y="15.0" width="990.0" height="36.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="520.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Механізм Subsumption: нормалізація обмежень та вибір найбільш спеціалізованого шаблону</text>
<rect x="25.0" y="65.0" width="310.0" height="335.0" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
<text x="180.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2d3748" text-anchor="middle" font-weight="700">Перевантаження функцій</text>
<rect x="100.8" y="119.0" width="158.5" height="52.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="180.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Кандидат 1 (Базовий)</tspan><tspan x="180.0" dy="13.0">template&lt;std::integral T&gt;</tspan><tspan x="180.0" dy="13.0">void advance(T x);</tspan></text>
<rect x="80.8" y="234.0" width="198.4" height="52.0" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="180.0" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Кандидат 2 (Спеціалізований)</tspan><tspan x="180.0" dy="13.0">template&lt;std::signed_integral T&gt;</tspan><tspan x="180.0" dy="13.0">void advance(T x);</tspan></text>
<rect x="360.0" y="65.0" width="370.0" height="335.0" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
<text x="545.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2d3748" text-anchor="middle" font-weight="700">Нормалізація до атомарних обмежень</text>
<rect x="454.4" y="125.5" width="181.3" height="39.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="545.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">Нормалізоване обмеження 1:</tspan><tspan x="545.0" dy="13.0">Атом A: std::is_integral_v&lt;T&gt;</tspan></text>
<rect x="454.4" y="227.5" width="181.3" height="65.0" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="545.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">Нормалізоване обмеження 2:</tspan><tspan x="545.0" dy="13.0">Атом A: std::is_integral_v&lt;T&gt;</tspan><tspan x="545.0" dy="13.0">ТА (&amp;&amp;)</tspan><tspan x="545.0" dy="13.0">Атом B: std::is_signed_v&lt;T&gt;</tspan></text>
<line x1="280.0" y1="145.0" x2="355.0" y2="145.0" stroke="#3182ce" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280.0" y1="260.0" x2="355.0" y2="260.0" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="755.0" y="65.0" width="260.0" height="335.0" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
<text x="885.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2d3748" text-anchor="middle" font-weight="700">Правило поглинання</text>
<rect x="811.5" y="134.5" width="147.1" height="91.0" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="885.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#744210" text-anchor="middle"><tspan x="885.0" dy="0.0">(A &amp;&amp; B) =&gt; A</tspan><tspan x="885.0" dy="13.0"></tspan><tspan x="885.0" dy="13.0">Кандидат 2 поглинає</tspan><tspan x="885.0" dy="13.0">(subsumes) Кандидата 1,</tspan><tspan x="885.0" dy="13.0">бо містить надмножину</tspan><tspan x="885.0" dy="13.0">атомарних обмежень.</tspan></text>
<rect x="796.4" y="266.0" width="177.2" height="78.0" rx="6" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/><text x="885.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#234e52" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Виклик: advance(-5); (int)</tspan><tspan x="885.0" dy="13.0"></tspan><tspan x="885.0" dy="13.0">ПЕРЕМАГАЄ Кандидат 2</tspan><tspan x="885.0" dy="13.0">без неоднозначності</tspan><tspan x="885.0" dy="13.0">(Ambiguity)!</tspan></text>
<line x1="675.0" y1="200.0" x2="750.0" y2="200.0" stroke="#d69e2e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="885.0" y1="235.0" x2="885.0" y2="265.0" stroke="#319795" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>