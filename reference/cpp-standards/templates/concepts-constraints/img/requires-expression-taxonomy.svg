<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050.5 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050.5" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація чотирьох видів вимог у виразі requires</text>
<rect x="25.0" y="15.0" width="990.0" height="36.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="520.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Анатомія виразу requires: чотири види вимог до типу</text>
<rect x="25.0" y="65.0" width="990.0" height="370.0" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.2"/>
<rect x="43.1" y="87.2" width="213.8" height="55.6" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="150.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Проста вимога</tspan><tspan x="150.0" dy="14.3">(Simple Requirement)</tspan><tspan x="150.0" dy="14.3">Синтаксична валідність виразу</tspan></text>
<rect x="65.1" y="188.0" width="169.9" height="104.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.5"/><text x="150.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">x + y;</tspan><tspan x="150.0" dy="13.0">*it;</tspan><tspan x="150.0" dy="13.0">a.clear();</tspan><tspan x="150.0" dy="13.0"></tspan><tspan x="150.0" dy="13.0">Перевіряє, чи вираз успішно</tspan><tspan x="150.0" dy="13.0">проходить синтаксичний</tspan><tspan x="150.0" dy="13.0">і семантичний розбір.</tspan></text>
<rect x="301.8" y="87.2" width="186.5" height="55.6" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="395.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">2. Типізована вимога</tspan><tspan x="395.0" dy="14.3">(Type Requirement)</tspan><tspan x="395.0" dy="14.3">Існування вкладеного типу</tspan></text>
<rect x="304.4" y="188.0" width="181.3" height="104.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.5"/><text x="395.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">typename T::value_type;</tspan><tspan x="395.0" dy="13.0">typename Container::iterator;</tspan><tspan x="395.0" dy="13.0"></tspan><tspan x="395.0" dy="13.0">Перевіряє наявність типу,</tspan><tspan x="395.0" dy="13.0">псевдоніма using або</tspan><tspan x="395.0" dy="13.0">валідності спеціалізації</tspan><tspan x="395.0" dy="13.0">шаблону типу.</tspan></text>
<rect x="524.5" y="87.2" width="241.1" height="55.6" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/><text x="645.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">3. Складена вимога</tspan><tspan x="645.0" dy="14.3">(Compound Requirement)</tspan><tspan x="645.0" dy="14.3">Вираз + noexcept + тип результату</tspan></text>
<rect x="514.5" y="181.5" width="261.1" height="117.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.5"/><text x="645.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">{ expr } noexcept -&gt; concept;</tspan><tspan x="645.0" dy="13.0"></tspan><tspan x="645.0" dy="13.0">{ x.size() } -&gt; std::same_as&lt;std::size_t&gt;;</tspan><tspan x="645.0" dy="13.0">{ *it } noexcept -&gt; std::convertible_to&lt;T&gt;;</tspan><tspan x="645.0" dy="13.0"></tspan><tspan x="645.0" dy="13.0">Валідує вираз, гарантію</tspan><tspan x="645.0" dy="13.0">noexcept та накладає концепт</tspan><tspan x="645.0" dy="13.0">на виведений тип результату.</tspan></text>
<rect x="779.7" y="87.2" width="220.6" height="55.6" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/><text x="890.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">4. Вкладена вимога</tspan><tspan x="890.0" dy="14.3">(Nested Requirement)</tspan><tspan x="890.0" dy="14.3">Обчислення логічного предикату</tspan></text>
<rect x="793.6" y="181.5" width="192.7" height="117.0" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.5"/><text x="890.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">requires predicate_v&lt;T&gt;;</tspan><tspan x="890.0" dy="13.0"></tspan><tspan x="890.0" dy="13.0">requires sizeof(T) &lt;= 64;</tspan><tspan x="890.0" dy="13.0">requires std::is_integral_v&lt;T&gt;;</tspan><tspan x="890.0" dy="13.0"></tspan><tspan x="890.0" dy="13.0">Обчислює константний логічний</tspan><tspan x="890.0" dy="13.0">вираз під час компіляції.</tspan><tspan x="890.0" dy="13.0">Якщо false — умова не виконана.</tspan></text>
<rect x="9.6" y="384.0" width="1020.9" height="22.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="520.0" y="398.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">requires (T a, T b) { /* 1. Прості */ a + b; /* 2. Типи */ typename T::value_type; /* 3. Складені */ { a.size() } -&gt; std::integral; /* 4. Вкладені */ requires sizeof(T) &gt;= 4; };</tspan></text>
</svg>