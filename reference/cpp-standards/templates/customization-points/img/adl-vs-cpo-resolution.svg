<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук імен: класичний ADL проти Customization Point Objects (CPO)</text>
<text x="260.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний ADL (using std::swap)</text>
<rect x="184.2" y="66.9" width="151.7" height="56.2" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="260.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">using std::swap;</tspan><tspan x="260.0" dy="18.2">swap(a, b);</tspan></text>
<rect x="92.4" y="154.6" width="335.2" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Пошук у поточній області дій</tspan><tspan x="260.0" dy="16.9">2. Пошук через ADL в неймспейсі аргументів</tspan><tspan x="260.0" dy="16.9">3. Запасний варіант std::swap</tspan></text>
<line x1="260.0" y1="127.1" x2="260.0" y2="150.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="96.1" y="266.1" width="327.8" height="87.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="289.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Недоліки:</tspan><tspan x="260.0" dy="16.9">• Ризик викрадення ADL (hijacking)</tspan><tspan x="260.0" dy="16.9">• Забудькуватість: виклик std::swap(a, b)</tspan><tspan x="260.0" dy="16.9">• Помилки компіляції всередині шаблону</tspan></text>
<line x1="260.0" y1="229.4" x2="260.0" y2="262.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="30.0" x2="520.0" y2="390.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="780.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPO в C++20 (std::ranges::swap)</text>
<rect x="672.2" y="76.0" width="215.5" height="38.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="780.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">std::ranges::swap(a, b);</tspan></text>
<rect x="619.8" y="154.6" width="320.4" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">1. Кваліфіковане викликання operator()</tspan><tspan x="780.0" dy="16.9">2. Автоматична диспетчеризація всередині</tspan><tspan x="780.0" dy="16.9">3. Захищений Poisoned Context для ADL</tspan></text>
<line x1="780.0" y1="118.0" x2="780.0" y2="150.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="642.0" y="266.1" width="275.9" height="87.7" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="289.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Переваги:</tspan><tspan x="780.0" dy="16.9">• Захист від викрадення ADL</tspan><tspan x="780.0" dy="16.9">• Прямий виклик без using</tspan><tspan x="780.0" dy="16.9">• Точні помилки на рівні концептів</tspan></text>
<line x1="780.0" y1="229.4" x2="780.0" y2="262.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>