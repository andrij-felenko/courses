<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація категорій і властивостей std::type_traits</text>
<rect x="20.0" y="50.0" width="234.0" height="48.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Категорія трейтів</tspan></text>
<rect x="260.0" y="50.0" width="414.0" height="48.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="467.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="467.0" dy="0.0">Приклади метафункцій у &lt;type_traits&gt;</tspan></text>
<rect x="680.0" y="50.0" width="334.0" height="48.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="847.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0.0">Що саме перевіряє або змінює</tspan></text>
<rect x="20.0" y="104.0" width="234.0" height="72.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Первинні категорії</tspan><tspan x="137.0" dy="16.9">(Primary Categories)</tspan></text>
<rect x="260.0" y="104.0" width="414.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="467.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">is_void, is_integral, is_pointer,</tspan><tspan x="467.0" dy="16.9">is_class, is_union, is_function</tspan></text>
<rect x="680.0" y="104.0" width="334.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="847.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">14 взаємовиключних категорій,</tspan><tspan x="847.0" dy="16.9">які покривають абсолютно всі типи C++</tspan></text>
<rect x="20.0" y="182.0" width="234.0" height="72.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Складені категорії</tspan><tspan x="137.0" dy="16.9">(Composite Categories)</tspan></text>
<rect x="260.0" y="182.0" width="414.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="467.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">is_reference, is_arithmetic,</tspan><tspan x="467.0" dy="16.9">is_object, is_compound, is_scalar</tspan></text>
<rect x="680.0" y="182.0" width="334.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="847.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Об'єднання первинних категорій</tspan><tspan x="847.0" dy="16.9">для зручних узагальнених перевірок</tspan></text>
<rect x="20.0" y="260.0" width="234.0" height="72.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Властивості та відносини</tspan><tspan x="137.0" dy="16.9">(Properties &amp; Relations)</tspan></text>
<rect x="260.0" y="260.0" width="414.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="467.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">is_const, is_trivially_copyable,</tspan><tspan x="467.0" dy="16.9">is_same&lt;T, U&gt;, is_base_of&lt;Base, Derived&gt;</tspan></text>
<rect x="680.0" y="260.0" width="334.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="847.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Перевірка кваліфікаторів, вимог до пам'яті</tspan><tspan x="847.0" dy="16.9">та ієрархічних зв'язків між типами</tspan></text>
<rect x="20.0" y="338.0" width="234.0" height="72.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="370.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Модифікатори типів</tspan><tspan x="137.0" dy="16.9">(Type Transformations)</tspan></text>
<rect x="260.0" y="338.0" width="414.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="467.0" y="370.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">remove_const_t, remove_reference_t,</tspan><tspan x="467.0" dy="16.9">decay_t, add_lvalue_reference_t</tspan></text>
<rect x="680.0" y="338.0" width="334.0" height="72.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="847.0" y="370.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">Трансформація типу: зняття const/ref,</tspan><tspan x="847.0" dy="16.9">розпад масивів і додавання посилань</tspan></text>
</svg>