<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="156.6" y="12.5" width="726.8" height="35.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Порівняння компіляції: C++11 рекурсивні шаблони проти C++17 Fold Expressions</tspan></text>
<rect x="30.0" y="65.0" width="465.0" height="355.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="262.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">C++11: Рекурсивне інстанціювання</text>
<text x="262.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="262.0" dy="0.0">Кожен аргумент породжує окрему інстанціацію шаблону,</tspan><tspan x="262.0" dy="14.3">навантажуючи компілятор глибиною рекурсії O(N)</tspan></text>
<rect x="142.3" y="165.9" width="239.4" height="88.2" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="262.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">sum(1, 2, 3, 4)</tspan><tspan x="262.0" dy="14.3">  -&gt; sum(1, Tail&lt;2,3,4&gt;...)</tspan><tspan x="262.0" dy="14.3">    -&gt; sum(2, Tail&lt;3,4&gt;...)</tspan><tspan x="262.0" dy="14.3">      -&gt; sum(3, Tail&lt;4&gt;...)</tspan><tspan x="262.0" dy="14.3">        -&gt; sum(4) [базовий випадок]</tspan></text>
<rect x="117.2" y="298.1" width="289.6" height="73.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="262.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">Проблеми підходу:</tspan><tspan x="262.0" dy="14.3">* N окремих функцій у таблиці символів</tspan><tspan x="262.0" dy="14.3">* Роздування бінарного коду без інлайнінгу</tspan><tspan x="262.0" dy="14.3">* Повільна компіляція (витрати пам'яті AST)</tspan></text>
<rect x="545.0" y="65.0" width="465.0" height="355.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="777.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">C++17: Вираз згортки (Fold)</text>
<text x="777.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="777.0" dy="0.0">Один єдиний шаблон інстанціюється миттєво;</tspan><tspan x="777.0" dy="14.3">компілятор згортає операцію в єдиний вузол виразу O(1)</tspan></text>
<rect x="682.4" y="165.9" width="189.3" height="88.2" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="777.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="777.0" dy="0.0">template &lt;typename... Args&gt;</tspan><tspan x="777.0" dy="14.3">auto sum(Args... args) {</tspan><tspan x="777.0" dy="14.3">    return (args + ...);</tspan><tspan x="777.0" dy="14.3">}</tspan><tspan x="777.0" dy="14.3">// AST: (1 + (2 + (3 + 4)))</tspan></text>
<rect x="629.1" y="298.1" width="295.9" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="777.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="777.0" dy="0.0">Переваги підходу:</tspan><tspan x="777.0" dy="14.3">* Рівно одна інстанціація функції в пам'яті</tspan><tspan x="777.0" dy="14.3">* Нульовий оверхед на рекурсивні виклики</tspan><tspan x="777.0" dy="14.3">* Миттєва трансляція та спрощена діагностика</tspan></text>
<rect x="85.9" y="434.0" width="868.2" height="32.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="454.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">C++17 згортка замінює рекурсивну генерацію AST-дерев пласким двійковим виразом безпосередньо у вузлі кодогенерації</tspan></text>
</svg>