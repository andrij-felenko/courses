<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="212.2" y="27.0" width="575.5" height="36.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Класифікація імен всередині шаблону template&lt;typename T&gt;</tspan></text>
<rect x="368.5" y="93.0" width="263.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ім'я у виразі або оголошенні</tspan></text>
<line x1="400.0" y1="130.0" x2="270.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="130.0" x2="730.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="175.0" width="440.0" height="220.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="260.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незалежне ім'я (Non-dependent)</text>
<text x="260.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="260.0" dy="0.0">Не залежить від параметрів шаблону:</tspan><tspan x="260.0" dy="15.6">• std::cout, int, std::vector&lt;int&gt;</tspan><tspan x="260.0" dy="15.6">• helper(42) — аргумент 42 має тип int</tspan><tspan x="260.0" dy="15.6">• Base::foo() — кваліфіковано неконкретним базовим</tspan></text>
<rect x="87.0" y="328.5" width="346.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Фаза 1: Пошук у контексті оголошення шаблону</tspan></text>
<rect x="520.0" y="175.0" width="440.0" height="220.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="740.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залежне ім'я (Dependent)</text>
<text x="740.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="740.0" dy="0.0">Тип або значення залежить від T:</tspan><tspan x="740.0" dy="15.6">• x (де x має тип T), t.field</tspan><tspan x="740.0" dy="15.6">• process(x) — тип аргументу T</tspan><tspan x="740.0" dy="15.6">• this-&gt;foo(), Base&lt;T&gt;::bar(), typename T::type</tspan></text>
<rect x="574.4" y="328.5" width="331.2" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Фаза 2: Пошук у POI + ADL типів аргументів</tspan></text>
<rect x="112.4" y="428.0" width="775.2" height="34.0" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Помилка класифікації (наприклад, пропущений this-&gt;) переносить ім'я з Фази 2 на Фазу 1!</tspan></text>
</svg>