<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переривання condition_variable_any</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переривання очікування в std::condition_variable_any за допомогою stop_token</text>
<rect x="40.0" y="70.0" width="260.0" height="90.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="83.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Крок 1: Вхід у wait()</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">cv.wait(lock, stoken, [&amp;]{</tspan><tspan x="170.0" dy="14.3">    return !queue.empty();</tspan><tspan x="170.0" dy="14.3">});</tspan><tspan x="170.0" dy="14.3">Потік тримає захоплений lock.</tspan></text>
<rect x="350.0" y="70.0" width="260.0" height="90.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="83.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Крок 2: Внутрішній stop_callback</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">Реєструється тимчасовий колбек:</tspan><tspan x="480.0" dy="14.3">stop_callback cb(stoken, [&amp;]{</tspan><tspan x="480.0" dy="14.3">    cv.notify_all();</tspan><tspan x="480.0" dy="14.3">});</tspan></text>
<rect x="660.0" y="70.0" width="260.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Крок 3: Атомарне засинання</tspan><tspan x="790.0" dy="14.3"></tspan><tspan x="790.0" dy="14.3">Перевірка predicate() == false.</tspan><tspan x="790.0" dy="14.3">Відпускання lock та перехід</tspan><tspan x="790.0" dy="14.3">у стан очікування ОС.</tspan></text>
<line x1="300.0" y1="115.0" x2="350.0" y2="115.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="115.0" x2="660.0" y2="115.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="220.0" width="880.0" height="65.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="248.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">ПОДІЯ СКАСУВАННЯ: Головний потік викликає stop_source.request_stop()</tspan><tspan x="480.0" dy="15.6">──► Спрацьовує stop_callback ──► Викликається cv.notify_all() ──► Сплячий потік миттєво прокидається!</tspan></text>
<rect x="150.0" y="320.0" width="310.0" height="90.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Крок 4: Захоплення lock</tspan><tspan x="305.0" dy="14.3"></tspan><tspan x="305.0" dy="14.3">Потік знову захоплює lock,</tspan><tspan x="305.0" dy="14.3">знищує тимчасовий stop_callback</tspan><tspan x="305.0" dy="14.3">та перевіряє умову виходу.</tspan></text>
<rect x="500.0" y="320.0" width="310.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Крок 5: Повернення з wait()</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">Повертає значення предиката.</tspan><tspan x="655.0" dy="14.3">Якщо stoken.stop_requested() == true,</tspan><tspan x="655.0" dy="14.3">потік коректно завершує роботу.</tspan></text>
<line x1="460.0" y1="365.0" x2="500.0" y2="365.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>