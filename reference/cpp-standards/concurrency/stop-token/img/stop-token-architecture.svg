<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура stop_token</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Триєдина архітектура кооперативного скасування: stop_source, stop_token та stop_callback</text>
<rect x="40.0" y="70.0" width="240.0" height="130.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">std::stop_source</tspan><tspan x="160.0" dy="15.6">(Ініціатор скасування)</tspan><tspan x="160.0" dy="15.6"></tspan><tspan x="160.0" dy="15.6">• request_stop()</tspan><tspan x="160.0" dy="15.6">• get_token()</tspan><tspan x="160.0" dy="15.6">• stop_requested()</tspan><tspan x="160.0" dy="15.6">• stop_possible()</tspan></text>
<rect x="340.0" y="60.0" width="280.0" height="150.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="95.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Спільний стан (stop_state)</tspan><tspan x="480.0" dy="14.3">[Блок керування у купі]</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• std::atomic&lt;uint64_t&gt; ref_count</tspan><tspan x="480.0" dy="14.3">• std::atomic&lt;bool&gt; stop_flag</tspan><tspan x="480.0" dy="14.3">• std::atomic&lt;thread_id&gt; caller</tspan><tspan x="480.0" dy="14.3">• Список callback-підписників</tspan></text>
<rect x="680.0" y="70.0" width="240.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">std::stop_token</tspan><tspan x="800.0" dy="15.6">(Спостерігач / Read-only)</tspan><tspan x="800.0" dy="15.6"></tspan><tspan x="800.0" dy="15.6">• stop_requested()</tspan><tspan x="800.0" dy="15.6">• stop_possible()</tspan><tspan x="800.0" dy="15.6">• Передається у робітника</tspan><tspan x="800.0" dy="15.6">  за значенням (копія)</tspan></text>
<line x1="280.0" y1="135.0" x2="340.0" y2="135.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="135.0" x2="620.0" y2="135.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="270.0" width="440.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">std::stop_callback&lt;Callback&gt;</tspan><tspan x="480.0" dy="11.7">(RAII-підписка на подію скасування)</tspan><tspan x="480.0" dy="11.7"></tspan><tspan x="480.0" dy="11.7">1. Конструктор: реєструє лямбду у списку stop_state</tspan><tspan x="480.0" dy="11.7">2. Якщо скасовано заздалегідь: негайно викликає лямбду у поточному потоці</tspan><tspan x="480.0" dy="11.7">3. Деструктор: безпечно вилучає лямбду зі списку або чекає завершення виклику</tspan></text>
<line x1="480.0" y1="210.0" x2="480.0" y2="270.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="270.0" width="190.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="304.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Поллінг у циклі:</tspan><tspan x="135.0" dy="13.0"></tspan><tspan x="135.0" dy="13.0">while (!st.stop_requested()) {</tspan><tspan x="135.0" dy="13.0">    process_batch();</tspan><tspan x="135.0" dy="13.0">}</tspan><tspan x="135.0" dy="13.0"></tspan><tspan x="135.0" dy="13.0">Чисте завершення</tspan></text>
<rect x="730.0" y="270.0" width="190.0" height="140.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Асинхронний тригер:</tspan><tspan x="825.0" dy="14.3"></tspan><tspan x="825.0" dy="14.3">stop_callback cb(st, [&amp;]{</tspan><tspan x="825.0" dy="14.3">    socket.close();</tspan><tspan x="825.0" dy="14.3">    cv.notify_all();</tspan><tspan x="825.0" dy="14.3">});</tspan><tspan x="825.0" dy="14.3">Розблокування I/O</tspan></text>
<line x1="730.0" y1="340.0" x2="700.0" y2="340.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="230.0" y1="340.0" x2="260.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>