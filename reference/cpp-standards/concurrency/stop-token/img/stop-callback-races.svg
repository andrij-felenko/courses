<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вирішення гонок у stop_callback</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація та вирішення гонок даних у stop_callback</text>
<rect x="40.0" y="70.0" width="270.0" height="340.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Сценарій 1: Нормальний виклик</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">Потік A: конструює stop_callback</tspan><tspan x="175.0" dy="14.3">└── Додає вузол у список стану</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">Потік B: викликає request_stop()</tspan><tspan x="175.0" dy="14.3">├── Атомарно встановлює прапорець</tspan><tspan x="175.0" dy="14.3">├── Захоплює список колбеків</tspan><tspan x="175.0" dy="14.3">└── Синхронно виконує колбек</tspan><tspan x="175.0" dy="14.3">    безпосередньо в Потоці B!</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">Гарантія: Виконання відбувається</tspan><tspan x="175.0" dy="14.3">рівно один раз (exact-once).</tspan></text>
<rect x="345.0" y="70.0" width="270.0" height="340.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Сценарій 2: Пізня реєстрація</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">Потік B: уже викликав request_stop()</tspan><tspan x="480.0" dy="14.3">└── Стан: stop_requested == true</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">Потік A: конструює stop_callback</tspan><tspan x="480.0" dy="14.3">├── Читає атомарний прапорець</tspan><tspan x="480.0" dy="14.3">├── Бачить, що сигнал уже надійшов</tspan><tspan x="480.0" dy="14.3">└── Негайно викликає колбек</tspan><tspan x="480.0" dy="14.3">    у Потоці A під час конструювання!</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">Гарантія: Сигнал не губиться,</tspan><tspan x="480.0" dy="14.3">навіть якщо прийшов раніше.</tspan></text>
<rect x="650.0" y="70.0" width="270.0" height="340.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="785.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Сценарій 3: Конкурентна деструкція</tspan><tspan x="785.0" dy="13.0"></tspan><tspan x="785.0" dy="13.0">Потік B: виконує callback у request_stop()</tspan><tspan x="785.0" dy="13.0">Потік A: виходить зі скоупу ~stop_callback()</tspan><tspan x="785.0" dy="13.0"></tspan><tspan x="785.0" dy="13.0">Синхронізація в деструкторі:</tspan><tspan x="785.0" dy="13.0">├── Перевіряє ID виконуючого потоку</tspan><tspan x="785.0" dy="13.0">├── Якщо це Потік B: деструктор Потоку A</tspan><tspan x="785.0" dy="13.0">│   БЛОКУЄТЬСЯ до завершення колбека</tspan><tspan x="785.0" dy="13.0">└── Лише після цього звільняє пам'ять!</tspan><tspan x="785.0" dy="13.0"></tspan><tspan x="785.0" dy="13.0">Гарантія: Жодних use-after-free</tspan><tspan x="785.0" dy="13.0">для захоплених локальних змінних.</tspan></text>
</svg>