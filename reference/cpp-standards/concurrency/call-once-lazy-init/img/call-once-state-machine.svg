<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1037.25 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1037.25" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат переходів стану std::once_flag</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат переходів внутрішнього стану std::once_flag</text>
<rect x="60.0" y="140.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Неініціалізовано</tspan><tspan x="160.0" dy="15.6">(Uninitialized / 0)</tspan><tspan x="160.0" dy="15.6">Початковий стан</tspan><tspan x="160.0" dy="15.6">constexpr-конструктор</tspan></text>
<rect x="380.0" y="140.0" width="200.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Виконується</tspan><tspan x="480.0" dy="14.3">(In-Progress / Running)</tspan><tspan x="480.0" dy="14.3">Один потік-лідер ініціалізує,</tspan><tspan x="480.0" dy="14.3">інші чекають на futex</tspan></text>
<rect x="700.0" y="140.0" width="200.0" height="90.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Ініціалізовано</tspan><tspan x="800.0" dy="11.7">(Done / Initialized)</tspan><tspan x="800.0" dy="11.7">Швидкий шлях: Acquire-load,</tspan><tspan x="800.0" dy="11.7">без блокувань та системних викликів</tspan></text>
<line x1="260.0" y1="170.0" x2="380.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">CAS: 0 → 1</text>
<text x="320.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потік виграв гонитву</text>
<line x1="580.0" y1="170.0" x2="700.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Успішне завершення</text>
<text x="640.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Release store + futex_wake</text>
<path d="M 480,140 C 480,75 200,75 160,140" stroke="#c0392b" stroke-width="2" fill="none"/>
<line x1="165.0" y1="130.0" x2="160.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Виняток (Exception) у функції ініціалізації</text>
<text x="320.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Стан скидається в 0, виняток прокидається далі, інші потоки пробують знову</text>
<path d="M 800,230 C 800,300 860,300 860,230" stroke="#27ae60" stroke-width="1.8" fill="none"/>
<line x1="858.0" y1="240.0" x2="856.0" y2="230.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="800.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">['Усі наступні виклики:', 'Acquire load бачить Done', 'і повертаються миттєво']</text>
<line x1="60.0" y1="260.0" x2="900.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="480.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Стан Done є фінальним і незворотним: після успішної ініціалізації call_once працює як безпечний read-only бар'єр</text>
<text x="480.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гарантується строгий порядок пам'яті: writes усередині ініціалізатора happens-before повернення з будь-якого call_once</text>
</svg>