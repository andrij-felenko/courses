<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняльна таблиця механізмів ініціалізації</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння механізмів одноразової ініціалізації у C++</text>
<rect x="30.0" y="60.0" width="180.0" height="36.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Механізм</tspan></text>
<rect x="220.0" y="60.0" width="170.0" height="36.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Потокобезпека</tspan></text>
<rect x="400.0" y="60.0" width="180.0" height="36.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Вартість Fast Path</tspan></text>
<rect x="590.0" y="60.0" width="170.0" height="36.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Сфера застосування</tspan></text>
<rect x="770.0" y="60.0" width="160.0" height="36.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="81.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Стійкість до винятків</tspan></text>
<rect x="30.0" y="105.0" width="180.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Рання ініціалізація</tspan><tspan x="120.0" dy="14.3">(Eager / main)</tspan></text>
<rect x="220.0" y="105.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Повна (до старту ниток)</tspan></text>
<rect x="400.0" y="105.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">0 (звичайна змінна)</tspan></text>
<rect x="590.0" y="105.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Глобальні незмінні конфігурації</tspan></text>
<rect x="770.0" y="105.0" width="160.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Крах програми до запуску</tspan></text>
<rect x="30.0" y="163.0" width="180.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">М'ютекс на кожен доступ</tspan><tspan x="120.0" dy="14.3">(std::mutex)</tspan></text>
<rect x="220.0" y="163.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Повна (через замок)</tspan></text>
<rect x="400.0" y="163.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Висока (atomic lock/unlock)</tspan></text>
<rect x="590.0" y="163.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Динамічні структури даних</tspan></text>
<rect x="770.0" y="163.0" width="160.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Потрібен RAII-замок</tspan></text>
<rect x="30.0" y="221.0" width="180.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="244.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Локальні статики</tspan><tspan x="120.0" dy="14.3">(Magic Statics)</tspan></text>
<rect x="220.0" y="221.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="251.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Повна (C++11 §6.7)</tspan></text>
<rect x="400.0" y="221.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="251.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Мінімальна (Acquire load)</tspan></text>
<rect x="590.0" y="221.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Одинаки (Meyer's Singleton)</tspan></text>
<rect x="770.0" y="221.0" width="160.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Виняток дозволяє повтор</tspan></text>
<rect x="30.0" y="279.0" width="180.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">std::call_once +</tspan><tspan x="120.0" dy="14.3">once_flag</tspan></text>
<rect x="220.0" y="279.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="305.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Повна (Acquire-Release + futex)</tspan></text>
<rect x="400.0" y="279.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="309.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Мінімальна (1 Acquire load)</tspan></text>
<rect x="590.0" y="279.0" width="170.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Члени класів, пули, повторювані ініціалізації</tspan></text>
<rect x="770.0" y="279.0" width="160.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="309.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Транзакційне відновлення</tspan></text>
<text x="480.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">std::call_once надає таку ж швидкість, як Magic Statics, але з гнучкістю прив'язки до екземплярів об'єктів</text>
</svg>