<rect x="400.0" y="120.0" width="160.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">3. continues_on(gpu)</tspan><tspan x="480.0" dy="14.3">(Зміна контексту)</tspan><tspan x="480.0" dy="14.3">GPU Stream Queue</tspan></text>
