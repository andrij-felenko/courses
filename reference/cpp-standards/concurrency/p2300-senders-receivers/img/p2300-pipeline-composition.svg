<rect x="30.0" y="120.0" width="155.0" height="90.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="107.5" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="107.5" dy="0.0">1. schedule(pool)</tspan><tspan x="107.5" dy="14.3">(Початок на пулі)</tspan><tspan x="107.5" dy="14.3">Worker Thread</tspan></text>
