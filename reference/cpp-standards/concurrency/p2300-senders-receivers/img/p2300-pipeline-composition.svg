<text x="470.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ланцюжок виразів P2300: декларативне перемикання між гетерогенними обчислювальними вузлами</text>
