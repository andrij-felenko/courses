<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ручного розблокування та автоматичного розгортання RAII</text>
<text x="250.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Ручне керування (C-style / pthreads)</text>
<text x="690.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Автоматичне керування (C++ RAII)</text>
<rect x="154.8" y="78.5" width="190.4" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">pthread_mutex_lock(&amp;m);</tspan></text>
<rect x="128.9" y="148.5" width="242.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Обчислення / робота з ресурсом</tspan></text>
<rect x="88.4" y="221.2" width="143.1" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Виняткова ситуація</tspan><tspan x="160.0" dy="15.6">або early return</tspan></text>
<rect x="244.5" y="229.0" width="191.0" height="32.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">pthread_mutex_unlock(&amp;m);</tspan></text>
<rect x="60.1" y="314.1" width="199.8" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="160.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Витік замка!</tspan><tspan x="160.0" dy="16.9">Deadlock для інших ниток</tspan></text>
<line x1="250.0" y1="115.0" x2="250.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="185.0" x2="160.0" y2="222.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="185.0" x2="340.0" y2="222.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="160.0" y1="268.0" x2="160.0" y2="318.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="587.4" y="78.5" width="205.2" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">std::scoped_lock lock(m);</tspan></text>
<rect x="568.9" y="148.5" width="242.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Обчислення / робота з ресурсом</tspan></text>
<rect x="528.4" y="221.2" width="143.1" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Виняткова ситуація</tspan><tspan x="600.0" dy="15.6">або early return</tspan></text>
<rect x="701.6" y="229.0" width="156.8" height="32.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Нормальне завершення</tspan></text>
<rect x="541.9" y="314.1" width="296.2" height="51.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="690.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Деструктор lock розгортається ЗАВЖДИ:</tspan><tspan x="690.0" dy="16.9">m.unlock() гарантовано викликано!</tspan></text>
