<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">notify_one проти notify_all</text>
<text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0b0c0c" text-anchor="middle" font-weight="700">Порівняння notify_one() та notify_all()</text>
<rect x="40.0" y="139.7" width="360.0" height="100.6" rx="6" fill="#eaf7ee" stroke="#28a745" stroke-width="1.5"/><text x="220.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">notify_one()</tspan><tspan x="220.0" dy="16.9">• Пробуджує 1 потік з черги</tspan><tspan x="220.0" dy="16.9">• Мінімальна контенція</tspan><tspan x="220.0" dy="16.9">• Для точкових ресурсів</tspan><tspan x="220.0" dy="16.9">• Ризик: пропуск якщо потік заснув</tspan></text>
<rect x="480.0" y="139.7" width="360.0" height="100.6" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="660.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">notify_all()</tspan><tspan x="660.0" dy="16.9">• Пробуджує всі потоки в черзі</tspan><tspan x="660.0" dy="16.9">• Thundering Herd (шторм)</tspan><tspan x="660.0" dy="16.9">• Для масових подій (stop/barrier)</tspan><tspan x="660.0" dy="16.9">• Контенція за м'ютекс при старті</tspan></text>
<text x="440.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ОС Linux використовує FUTEX_CMP_REQUEUE для мінімізації контенції при notify_all()</text>
</svg>