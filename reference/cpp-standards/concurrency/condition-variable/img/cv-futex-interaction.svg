<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємодія std::condition_variable із ядром Linux через futex</text>
<text x="430.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0b0c0c" text-anchor="middle" font-weight="700">Архітектура std::condition_variable над sys_futex у Linux</text>
<rect x="80.0" y="86.6" width="280.0" height="66.8" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="220.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Користувацький простір</tspan><tspan x="220.0" dy="16.9">std::condition_variable</tspan><tspan x="220.0" dy="16.9">std::unique_lock&lt;std::mutex&gt;</tspan></text>
<rect x="500.0" y="86.6" width="280.0" height="66.8" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="640.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">POSIX Threads (libpthread)</tspan><tspan x="640.0" dy="16.9">pthread_cond_wait()</tspan><tspan x="640.0" dy="16.9">pthread_cond_signal()</tspan></text>
<rect x="140.0" y="218.2" width="580.0" height="83.7" rx="6" fill="#eaf7ee" stroke="#28a745" stroke-width="1.5"/><text x="430.0" y="239.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Простір ядра Linux (Kernel)</tspan><tspan x="430.0" dy="16.9">sys_futex(addr, FUTEX_WAIT, val, timeout)</tspan><tspan x="430.0" dy="16.9">sys_futex(addr, FUTEX_WAKE, count)</tspan><tspan x="430.0" dy="16.9">Черги сну й хеш-таблиця futex_hash_bucket</tspan></text>
