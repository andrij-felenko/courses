<text x="430.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">futex комбінує атомарне слово в user-space із системним викликом ядра лише за потреби сну</text>
