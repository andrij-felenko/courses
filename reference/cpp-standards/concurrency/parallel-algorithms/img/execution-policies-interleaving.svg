<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Політики виконання та моделі чергування</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі виконання стандартних алгоритмів: потоки та чергування інструкцій</text>
<rect x="30.0" y="60.0" width="210.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">std::execution::seq</tspan><tspan x="135.0" dy="16.9">(Послідовна політика)</tspan></text>
<rect x="30.0" y="120.0" width="210.0" height="260.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="135.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">• 1 системний потік (T0)</tspan><tspan x="135.0" dy="13.0">• Послідовний порядок</tspan><tspan x="135.0" dy="13.0">• Немає чергування</tspan><tspan x="135.0" dy="13.0">• Повна детермінованість</tspan><tspan x="135.0" dy="13.0">• Дозволені будь-які блокування</tspan><tspan x="135.0" dy="13.0">• Дозволене виділення пам'яті</tspan><tspan x="135.0" dy="13.0">• Винятки розгортають стек</tspan></text>
<rect x="45.0" y="395.0" width="180.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Крок 1: e[0] -&gt; e[1] -&gt; e[2]</tspan></text>
<rect x="45.0" y="430.0" width="180.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Крок 2: e[3] -&gt; e[4] -&gt; e[5]</tspan></text>
<rect x="45.0" y="465.0" width="180.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="135.0" y="482.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">T0: строго послідовно</tspan></text>
<rect x="260.0" y="60.0" width="210.0" height="50.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">std::execution::par</tspan><tspan x="365.0" dy="14.3">(Багатопотокова паралельна)</tspan></text>
<rect x="260.0" y="120.0" width="210.0" height="260.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">• N потоків (T0, T1, T2...)</tspan><tspan x="365.0" dy="13.0">• Невизначений порядок між T[i]</tspan><tspan x="365.0" dy="13.0">• У межах T[i] послідовно</tspan><tspan x="365.0" dy="13.0">• Потрібен захист від Data Race</tspan><tspan x="365.0" dy="13.0">• М'ютекси/lock_guard дозволені</tspan><tspan x="365.0" dy="13.0">• Атоміки дозволені</tspan><tspan x="365.0" dy="13.0">• Виняток -&gt; std::terminate()</tspan></text>
<rect x="275.0" y="395.0" width="85.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="317.5" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="317.5" dy="0.0">T0: e[0..k]</tspan></text>
<rect x="370.0" y="395.0" width="85.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="412.5" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">T1: e[k..2k]</tspan></text>
<rect x="275.0" y="430.0" width="85.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="317.5" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="317.5" dy="0.0">T2: e[2k..3k]</tspan></text>
<rect x="370.0" y="430.0" width="85.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="412.5" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">T3: e[3k..N]</tspan></text>
<rect x="275.0" y="465.0" width="180.0" height="28.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="482.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Паралельні потоки пулу</tspan></text>
<rect x="490.0" y="60.0" width="210.0" height="50.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="81.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">std::execution::par_unseq</tspan><tspan x="595.0" dy="15.6">(Паралельна векторизована)</tspan></text>
<rect x="490.0" y="120.0" width="210.0" height="260.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">• N потоків + SIMD-векторизація</tspan><tspan x="595.0" dy="13.0">• Чергування між лініями SIMD</tspan><tspan x="595.0" dy="13.0">• Заборона м'ютексів (дедлок!)</tspan><tspan x="595.0" dy="13.0">• Заборона new/malloc</tspan><tspan x="595.0" dy="13.0">• Заборона atomic::wait</tspan><tspan x="595.0" dy="13.0">• Лише lock-free обчислення</tspan><tspan x="595.0" dy="13.0">• Виняток -&gt; std::terminate()</tspan></text>
<rect x="505.0" y="395.0" width="85.0" height="28.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="547.5" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="547.5" dy="0.0">T0 SIMD 0..3</tspan></text>
<rect x="600.0" y="395.0" width="85.0" height="28.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="642.5" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">T0 SIMD 4..7</tspan></text>
<rect x="505.0" y="430.0" width="85.0" height="28.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="547.5" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="547.5" dy="0.0">T1 SIMD 0..3</tspan></text>
<rect x="600.0" y="430.0" width="85.0" height="28.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="642.5" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">T1 SIMD 4..7</tspan></text>
<rect x="505.0" y="465.0" width="180.0" height="28.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="482.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Потоки + SIMD-регістри</tspan></text>
<rect x="720.0" y="60.0" width="210.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">std::execution::unseq</tspan><tspan x="825.0" dy="16.9">(Векторизована C++20)</tspan></text>
<rect x="720.0" y="120.0" width="210.0" height="260.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">• 1 потік + SIMD-векторизація</tspan><tspan x="825.0" dy="13.0">• Без накладних витрат пулу</tspan><tspan x="825.0" dy="13.0">• Чергування в 1 потоці</tspan><tspan x="825.0" dy="13.0">• Заборона блокуючих викликів</tspan><tspan x="825.0" dy="13.0">• Ідеально для чистої математики</tspan><tspan x="825.0" dy="13.0">• Пряме відображення в AVX/NEON</tspan><tspan x="825.0" dy="13.0">• Виняток -&gt; std::terminate()</tspan></text>
<rect x="735.0" y="395.0" width="180.0" height="28.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">T0 Вектор 1: e[0..3] (AVX)</tspan></text>
<rect x="735.0" y="430.0" width="180.0" height="28.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="447.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">T0 Вектор 2: e[4..7] (AVX)</tspan></text>
