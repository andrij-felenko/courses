<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Небезпека дедлоку при векторизації</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємне блокування (Deadlock) у векторизованому потоці par_unseq / unseq</text>
<rect x="40.0" y="60.0" width="880.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Один апаратний потік виконання CPU виконує векторну інструкцію над 4 лініями SIMD одночасно</tspan></text>
<rect x="40.0" y="125.0" width="205.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="142.5" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="142.5" dy="0.0">SIMD Лінія 0</tspan><tspan x="142.5" dy="14.3"></tspan><tspan x="142.5" dy="14.3">Захоплює std::mutex</tspan><tspan x="142.5" dy="14.3">(успішно lock())</tspan></text>
<rect x="265.0" y="125.0" width="205.0" height="90.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="367.5" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="367.5" dy="0.0">SIMD Лінія 1</tspan><tspan x="367.5" dy="14.3"></tspan><tspan x="367.5" dy="14.3">Намагається захопити</tspan><tspan x="367.5" dy="14.3">той самий mutex...</tspan></text>
<rect x="490.0" y="125.0" width="205.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="592.5" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">SIMD Лінія 2</tspan><tspan x="592.5" dy="14.3"></tspan><tspan x="592.5" dy="14.3">Очікує завершення</tspan><tspan x="592.5" dy="14.3">векторного кроку</tspan></text>
<rect x="715.0" y="125.0" width="205.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="817.5" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="817.5" dy="0.0">SIMD Лінія 3</tspan><tspan x="817.5" dy="14.3"></tspan><tspan x="817.5" dy="14.3">Очікує завершення</tspan><tspan x="817.5" dy="14.3">векторного кроку</tspan></text>
<line x1="367.0" y1="215.0" x2="367.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="255.0" width="660.0" height="65.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">КАТАСТРОФА: Потік призупиняється у mutex.lock() для Лінії 1!</tspan><tspan x="480.0" dy="14.3">Оскільки це ТОЙ САМИЙ потік ОС, він не може продовжити виконання Лінії 0 і зробити unlock()!</tspan><tspan x="480.0" dy="14.3">Потік назавжди блокує сам себе (Self-Deadlock)</tspan></text>
<rect x="40.0" y="345.0" width="880.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="377.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Золоте правило політик par_unseq та unseq:</tspan><tspan x="480.0" dy="11.7">У тілі лямбди КАТЕГОРИЧНО ЗАБОРОНЕНО використовувати м'ютекси, блокуючі атоміки, динамічне виділення пам'яті (malloc/new) та виклики не-reentrant функцій. Код мусить бути строго Vectorization-Safe!</tspan></text>
</svg>