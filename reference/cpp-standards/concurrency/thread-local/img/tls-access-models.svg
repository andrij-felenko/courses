<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі адресації TLS в ELF</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі адресації Thread-Local Storage (ELF / x86-64)</text>
<rect x="40.0" y="65.0" width="200.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Local Exec (LE)</tspan><tspan x="140.0" dy="15.6">-ftls-model=local-exec</tspan></text>
<rect x="40.0" y="135.0" width="200.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Де застосовується:</tspan><tspan x="140.0" dy="13.0">Виконуваний файл (main binary),</tspan><tspan x="140.0" dy="13.0">символ не експортується назовні.</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">Асемблерний код (1 інструкція):</tspan><tspan x="140.0" dy="13.0">movq %fs:-32, %rax</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">Ціна доступу:</tspan><tspan x="140.0" dy="13.0">Найшвидша (0 викликів функцій,</tspan><tspan x="140.0" dy="13.0">0 звернень до таблиці GOT)</tspan></text>
<rect x="260.0" y="65.0" width="200.0" height="60.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Initial Exec (IE)</tspan><tspan x="360.0" dy="15.6">-ftls-model=initial-exec</tspan></text>
<rect x="260.0" y="135.0" width="200.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Де застосовується:</tspan><tspan x="360.0" dy="13.0">Спільні бібліотеки (.so),</tspan><tspan x="360.0" dy="13.0">завантажені при старті програми.</tspan><tspan x="360.0" dy="13.0"></tspan><tspan x="360.0" dy="13.0">Асемблерний код (2 інструкції):</tspan><tspan x="360.0" dy="13.0">movq var@gottpoff(%rip), %rax</tspan><tspan x="360.0" dy="13.0">movq %fs:(%rax), %rax</tspan><tspan x="360.0" dy="13.0"></tspan><tspan x="360.0" dy="13.0">Ціна доступу:</tspan><tspan x="360.0" dy="13.0">1 непряме читання з GOT,</tspan><tspan x="360.0" dy="13.0">без виклику runtime-функції</tspan></text>
<rect x="480.0" y="65.0" width="200.0" height="60.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Local Dynamic (LD)</tspan><tspan x="580.0" dy="14.3">-ftls-model=local-dynamic</tspan></text>
<rect x="480.0" y="135.0" width="200.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Де застосовується:</tspan><tspan x="580.0" dy="11.7">Спільні бібліотеки (.so) з кількома</tspan><tspan x="580.0" dy="11.7">локальними TLS-змінними.</tspan><tspan x="580.0" dy="11.7"></tspan><tspan x="580.0" dy="11.7">Асемблерний код:</tspan><tspan x="580.0" dy="11.7">leaq var@tlsld(%rip), %rdi</tspan><tspan x="580.0" dy="11.7">call __tls_get_addr@PLT</tspan><tspan x="580.0" dy="11.7">leaq var@dtpoff(%rax), %rcx</tspan><tspan x="580.0" dy="11.7"></tspan><tspan x="580.0" dy="11.7">Ціна доступу:</tspan><tspan x="580.0" dy="11.7">1 виклик на модуль, зміщення</tspan><tspan x="580.0" dy="11.7">до змінних обчислюються локально</tspan></text>
<rect x="700.0" y="65.0" width="200.0" height="60.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">General Dynamic (GD)</tspan><tspan x="800.0" dy="14.3">-ftls-model=global-dynamic</tspan></text>
<rect x="700.0" y="135.0" width="200.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Де застосовується:</tspan><tspan x="800.0" dy="11.7">Експортовані символи бібліотек,</tspan><tspan x="800.0" dy="11.7">завантаження через dlopen().</tspan><tspan x="800.0" dy="11.7"></tspan><tspan x="800.0" dy="11.7">Асемблерний код:</tspan><tspan x="800.0" dy="11.7">leaq var@tlsgd(%rip), %rdi</tspan><tspan x="800.0" dy="11.7">call __tls_get_addr@PLT</tspan><tspan x="800.0" dy="11.7">movq (%rax), %rax</tspan><tspan x="800.0" dy="11.7"></tspan><tspan x="800.0" dy="11.7">Ціна доступу:</tspan><tspan x="800.0" dy="11.7">Найповільніша (повний виклик</tspan><tspan x="800.0" dy="11.7">__tls_get_addr на кожне звернення)</tspan></text>
<rect x="40.0" y="335.0" width="860.0" height="45.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Linker Relaxation: При статичній лінковці компонувальник автоматично оптимізує GD ──► IE ──► LE</tspan></text>
<rect x="40.0" y="390.0" width="860.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="416.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Продуктивність: Local Exec (1 такт CPU)  ◄────────  General Dynamic (десятки тактів + виклик функції)</tspan></text>
</svg>