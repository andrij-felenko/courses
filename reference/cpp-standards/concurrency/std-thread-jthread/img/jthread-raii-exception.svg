<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгортання стеку та безпека винятків</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгортання стеку (Stack Unwinding) при викиданні винятку</text>
<rect x="50.0" y="65.0" width="840.0" height="45.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Виклик функції з винятком: std::vector::at() кидає std::out_of_range ──► Початок unwind_stack()</tspan></text>
<text x="240.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">std::thread (C++11)</text>
<rect x="50.0" y="150.0" width="380.0" height="200.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Знищення локальних змінних стеку</tspan><tspan x="240.0" dy="15.6">2. Виклик деструктора ~thread()</tspan><tspan x="240.0" dy="15.6">3. Перевірка прапорця: joinable() == true</tspan><tspan x="240.0" dy="15.6">4. Виклик std::terminate()</tspan><tspan x="240.0" dy="15.6">5. КРАШ: Програма падає миттєво!</tspan><tspan x="240.0" dy="15.6"></tspan><tspan x="240.0" dy="15.6">Потік ОС залишається сиротою в пам'яті</tspan></text>
<text x="700.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">std::jthread (C++20)</text>
<rect x="510.0" y="150.0" width="380.0" height="200.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Знищення локальних змінних стеку</tspan><tspan x="700.0" dy="15.6">2. Виклик деструктора ~jthread()</tspan><tspan x="700.0" dy="15.6">3. Автоматичний t.request_stop()</tspan><tspan x="700.0" dy="15.6">4. Автоматичний блокуючий t.join()</tspan><tspan x="700.0" dy="15.6">5. УСПІХ: Стек розгорнуто повністю!</tspan><tspan x="700.0" dy="15.6"></tspan><tspan x="700.0" dy="15.6">Виняток перехоплюється в catch(){...}</tspan></text>
<text x="470.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::jthread гарантує базову та сильну безпеку винятків за рахунок RAII</text>
</svg>