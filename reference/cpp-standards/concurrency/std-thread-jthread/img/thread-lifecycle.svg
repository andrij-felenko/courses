<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл std::thread та std::jthread</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл системного потоку та об'єктів std::thread / std::jthread</text>
<rect x="40.0" y="80.0" width="220.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">std::thread t;</tspan><tspan x="150.0" dy="14.3">(Порожній об'єкт)</tspan><tspan x="150.0" dy="14.3">joinable() == false</tspan><tspan x="150.0" dy="14.3">id() == std::thread::id()</tspan></text>
<line x1="260.0" y1="125.0" x2="340.0" y2="125.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">t(worker_func)</text>
<rect x="340.0" y="80.0" width="260.0" height="90.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">АКТИВНИЙ ПОТІК</tspan><tspan x="470.0" dy="15.6">joinable() == true</tspan><tspan x="470.0" dy="15.6">OS thread біжить паралельно</tspan><tspan x="470.0" dy="15.6">t.get_id() != id()</tspan></text>
<line x1="600.0" y1="100.0" x2="700.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">t.join()</text>
<rect x="700.0" y="40.0" width="200.0" height="70.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="64.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Завершено та приєднано</tspan><tspan x="800.0" dy="14.3">ОС-ресурси звільнено</tspan><tspan x="800.0" dy="14.3">joinable() == false</tspan></text>
<line x1="600.0" y1="125.0" x2="700.0" y2="125.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">t.detach()</text>
<rect x="700.0" y="100.0" width="200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Від'єднано (Background)</tspan><tspan x="800.0" dy="14.3">C++ об'єкт не-joinable</tspan><tspan x="800.0" dy="14.3">ОС потім сама прибере</tspan></text>
<line x1="470.0" y1="170.0" x2="470.0" y2="192.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">~thread() при joinable() == true</text>
<line x1="470.0" y1="218.0" x2="470.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="240.0" width="300.0" height="70.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">КАТАСТРОФА: std::terminate()</tspan><tspan x="470.0" dy="15.6">Аварійне завершення всієї програми!</tspan><tspan x="470.0" dy="15.6">Ресурси потоку не збережено</tspan></text>
<rect x="40.0" y="340.0" width="860.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Поведінка std::jthread у C++20 при деструкції:</tspan><tspan x="470.0" dy="15.6">~jthread() автоматично робить:  1. request_stop()  ──►  2. join()  ──► Безпечне завершення без аварій</tspan></text>
</svg>