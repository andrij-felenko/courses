<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура кооперативного скасування</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура кооперативного скасування: std::stop_source, stop_token та stop_callback</text>
<rect x="40.0" y="70.0" width="250.0" height="100.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">std::stop_source</tspan><tspan x="165.0" dy="15.6">(Головний потік)</tspan><tspan x="165.0" dy="15.6"></tspan><tspan x="165.0" dy="15.6">Метод: .request_stop()</tspan><tspan x="165.0" dy="15.6">Перевірка: .stop_requested()</tspan></text>
<rect x="345.0" y="70.0" width="250.0" height="100.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Спільний stop_state</tspan><tspan x="470.0" dy="15.6">(Купа / Ref-counted)</tspan><tspan x="470.0" dy="15.6"></tspan><tspan x="470.0" dy="15.6">• Atomic bool stop_requested_</tspan><tspan x="470.0" dy="15.6">• Список callback-функцій</tspan></text>
<rect x="650.0" y="70.0" width="250.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">std::stop_token</tspan><tspan x="775.0" dy="15.6">(Робочий потік)</tspan><tspan x="775.0" dy="15.6"></tspan><tspan x="775.0" dy="15.6">Перевірка в циклі:</tspan><tspan x="775.0" dy="15.6">st.stop_requested()</tspan></text>
<line x1="290.0" y1="120.0" x2="345.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="595.0" y1="120.0" x2="650.0" y2="120.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="170.0" x2="470.0" y2="188.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Подія: Виклик request_stop() змінює прапорець на true</text>
<line x1="470.0" y1="214.0" x2="470.0" y2="236.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="240.0" width="380.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Шлях 1: Поллінг у робочому циклі</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">while (!st.stop_requested()) {</tspan><tspan x="250.0" dy="14.3">    do_chunk_of_work();</tspan><tspan x="250.0" dy="14.3">}</tspan><tspan x="250.0" dy="14.3">// Робочий потік коректно виходить з циклу</tspan></text>
<rect x="500.0" y="240.0" width="380.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Шлях 2: Асинхронний std::stop_callback</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">std::stop_callback cb(st, [&amp;]{</tspan><tspan x="690.0" dy="14.3">    socket.close(); // Сповіщає про переривання</tspan><tspan x="690.0" dy="14.3">});</tspan><tspan x="690.0" dy="14.3">// Викличуть негайно при настанні сигналу</tspan></text>
</svg>