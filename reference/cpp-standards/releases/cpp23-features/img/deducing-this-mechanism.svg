<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція методів об'єкта: від чотирьох перевантажень до Deducing this</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Явний параметр об'єкта скорочує шаблони й замінює складне успадкування</text>
<rect x="45.0" y="75.0" width="420.0" height="325.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="255.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">C++20: Комбінаторний вибух і CRTP</text>
<line x1="60.0" y1="113.0" x2="450.0" y2="113.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="60.0" y="120.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="255.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">1. Чотири дубльовані методи доступу:</tspan><tspan x="255.0" dy="14.3">   operator[]() &amp;, const&amp;, &amp;&amp;, const&amp;&amp;</tspan></text>
<rect x="60.0" y="185.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="255.0" y="200.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">2. Успадкування CRTP: struct Derived : Base&lt;Derived&gt;</tspan><tspan x="255.0" dy="14.3">   з небезпечним static_cast&lt;Derived*&gt;(this)</tspan></text>
<rect x="60.0" y="250.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="255.0" y="265.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">3. Рекурсивні лямбди вимагають повільного</tspan><tspan x="255.0" dy="14.3">   std::function або окремих допоміжних структур</tspan></text>
<rect x="60.0" y="315.4" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="255.0" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">4. Неможливість ідеально прокинути cv-ref</tspan><tspan x="255.0" dy="14.3">   кваліфікатори об'єкта в один шаблон</tspan></text>
<rect x="495.0" y="75.0" width="420.0" height="325.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="705.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">C++23: Явний параметр (Deducing this)</text>
<line x1="510.0" y1="113.0" x2="900.0" y2="113.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="510.0" y="120.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="705.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">1. Один шаблонний метод з дедукцією типу:</tspan><tspan x="705.0" dy="14.3">   auto&amp;&amp; operator[](this Self&amp;&amp; self, size_t i)</tspan></text>
<rect x="510.0" y="185.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="705.0" y="200.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">2. Чиста композиція без шаблонного успадкування:</tspan><tspan x="705.0" dy="14.3">   метод базового класу сам бачить тип нащадка</tspan></text>
<rect x="510.0" y="250.3" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="705.0" y="265.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">3. Природна рекурсія в лямбдах:</tspan><tspan x="705.0" dy="14.3">   [](this auto self, int n) { return self(n-1); }</tspan></text>
<rect x="510.0" y="315.4" width="390.0" height="37.3" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="705.0" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">4. std::forward_like&lt;Self&gt;(member) зберігає</tspan><tspan x="705.0" dy="14.3">   константність та rvalue-семантику вихідного виразу</tspan></text>
</svg>