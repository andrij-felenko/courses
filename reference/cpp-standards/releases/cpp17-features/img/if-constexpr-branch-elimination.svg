<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усунення неактивних гілок у if constexpr</text>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0b0c0c" text-anchor="middle" font-weight="700">Компіляція розгалуження: Звичайний if vs if constexpr</text>
<text x="230.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d4351c" text-anchor="middle" font-weight="700">Звичайний if (runtime-перевірка)</text>
<rect x="60.0" y="97.3" width="340.0" height="45.3" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="230.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Синтаксичний аналіз шаблону</tspan><tspan x="230.0" dy="14.3">template &lt;typename T&gt; void process(T v)</tspan></text>
<rect x="60.0" y="182.3" width="340.0" height="45.3" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="230.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Обидві гілки інстанціюються</tspan><tspan x="230.0" dy="14.3">if (std::is_integral_v&lt;T&gt;) v.clear(); else v++;</tspan></text>
<rect x="60.0" y="272.4" width="340.0" height="45.3" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="230.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Помилка компіляції для непідтримуваного T</tspan><tspan x="230.0" dy="14.3">T = int: помилка 'int no member clear()'</tspan></text>
<rect x="47.6" y="359.5" width="364.8" height="31.0" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="230.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Потрібні складні SFINAE / std::enable_if перевантаження</tspan></text>
<line x1="230.0" y1="140.0" x2="230.0" y2="185.0" stroke="#d4351c" stroke-width="1.8" marker-end="url(#arrow)"/>
