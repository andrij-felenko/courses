<text x="690.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">if constexpr (compile-time вибір)</text>
<rect x="520.0" y="97.3" width="340.0" height="45.3" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="690.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Обчислення константного виразу</tspan><tspan x="690.0" dy="14.3">if constexpr (std::is_integral_v&lt;T&gt;)</tspan></text>
<rect x="520.0" y="182.3" width="340.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Відкидання хибної гілки компілятором</tspan><tspan x="690.0" dy="14.3">Хибна гілка НЕ інстанціюється для типу T!</tspan></text>
<rect x="520.0" y="272.4" width="340.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Чиста генерація AST лише для істинної гілки</tspan><tspan x="690.0" dy="14.3">Жодних синтаксичних конфліктів у бінарнику</tspan></text>
