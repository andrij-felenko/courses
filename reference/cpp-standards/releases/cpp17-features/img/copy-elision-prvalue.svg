<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантоване вилучення копіювання в C++17</text>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0b0c0c" text-anchor="middle" font-weight="700">Еволюція ініціалізації: Опціональне RVO (C++11/14) vs Матеріалізація prvalue (C++17)</text>
<text x="230.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d4351c" text-anchor="middle" font-weight="700">C++11 / C++14: prvalue створює тимчасовий об'єкт</text>
<rect x="60.0" y="97.3" width="340.0" height="45.3" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="230.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Функція повертає значення</tspan><tspan x="230.0" dy="14.3">Widget make() { return Widget(); }</tspan></text>
<rect x="60.0" y="182.3" width="340.0" height="45.3" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="230.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Створення тимчасового об'єкта на стеку</tspan><tspan x="230.0" dy="14.3">Обов'язкова наявність Widget(Widget&amp;&amp;)!</tspan></text>
<rect x="60.0" y="272.4" width="340.0" height="45.3" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="230.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Ініціалізація цільової змінної</tspan><tspan x="230.0" dy="14.3">Widget w = make(); // RVO є лише оптимізацією</tspan></text>
<rect x="42.7" y="359.5" width="374.6" height="31.0" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="230.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">✗ Non-movable типи повертати за значенням ЗАБОРОНЕНО</tspan></text>
<line x1="230.0" y1="142.7" x2="230.0" y2="182.3" stroke="#d4351c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="227.7" x2="230.0" y2="272.4" stroke="#d4351c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="317.6" x2="230.0" y2="357.0" stroke="#d4351c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="50.0" x2="460.0" y2="400.0" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="690.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">C++17: prvalue є рецептом ініціалізації (без копій)</text>
<rect x="520.0" y="97.3" width="340.0" height="45.3" rx="6" fill="#f8f9fa" stroke="#505a5f" stroke-width="1.5"/><text x="690.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Функція повертає prvalue вираз</tspan><tspan x="690.0" dy="14.3">Widget make() { return Widget(); }</tspan></text>
<rect x="520.0" y="182.3" width="340.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Пряме передавання адреси призначення</tspan><tspan x="690.0" dy="14.3">Ніякого проміжного об'єкта не існує!</tspan></text>
<rect x="520.0" y="272.4" width="340.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Конструювання прямо в пам'яті w</tspan><tspan x="690.0" dy="14.3">Конструктор переміщення НЕ потрібен</tspan></text>
<rect x="472.0" y="359.5" width="436.0" height="31.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">✓ Гарантоване конструювання за місцем (Non-movable дозволені)</tspan></text>
<line x1="690.0" y1="142.7" x2="690.0" y2="182.3" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="227.7" x2="690.0" y2="272.4" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="317.6" x2="690.0" y2="357.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
