<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Семантика переміщення (C++11) проти глибокого копіювання (C++98)</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Глибоке копіювання пам'яті проти миттєвої передачі володіння покажчиком</text>
<rect x="40.0" y="70.0" width="820.0" height="155.0" rx="8" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="start" font-weight="700">Копіювання lvalue: std::vector&lt;int&gt; b = a; (глибоке дублювання)</text>
<rect x="101.1" y="116.3" width="117.7" height="67.4" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Об'єкт A (lvalue)</tspan><tspan x="160.0" dy="13.7">ptr: 0x1000</tspan><tspan x="160.0" dy="13.7">size: 100'000</tspan><tspan x="160.0" dy="13.7">cap: 100'000</tspan></text>
<rect x="329.2" y="123.1" width="141.7" height="53.8" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Буфер у купі (0x1000)</tspan><tspan x="400.0" dy="13.7">[ 100'000 елементів ]</tspan><tspan x="400.0" dy="13.7">Розмір: 400 КБ</tspan></text>
<line x1="225.0" y1="150.0" x2="315.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="552.1" y="116.3" width="135.7" height="67.4" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Об'єкт B (копія)</tspan><tspan x="620.0" dy="13.7">ptr: 0x5000 (новий!)</tspan><tspan x="620.0" dy="13.7">size: 100'000</tspan><tspan x="620.0" dy="13.7">cap: 100'000</tspan></text>
<rect x="705.6" y="126.0" width="148.8" height="48.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="140.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Новий буфер (0x5000)</tspan><tspan x="780.0" dy="13.0">Побайтова копія (memcpy)</tspan><tspan x="780.0" dy="13.0">Витрати: нова алокація</tspan></text>
<line x1="685.0" y1="150.0" x2="715.0" y2="150.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="510.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ціна: malloc(400KB) + memcpy 400KB пам'яті ядра/купи</text>
<rect x="40.0" y="245.0" width="820.0" height="165.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Переміщення rvalue: std::vector&lt;int&gt; c = std::move(a); (крадіжка покажчика)</text>
<rect x="89.2" y="296.3" width="141.7" height="67.4" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Об'єкт A (moved-from)</tspan><tspan x="160.0" dy="13.7">ptr: nullptr</tspan><tspan x="160.0" dy="13.7">size: 0</tspan><tspan x="160.0" dy="13.7">cap: 0</tspan></text>
<rect x="316.3" y="303.1" width="267.4" height="53.8" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Буфер у купі (0x1000)</tspan><tspan x="450.0" dy="13.7">[ 100'000 елементів залишаються на місці ]</tspan><tspan x="450.0" dy="13.7">Нуль виділень пам'яті!</tspan></text>
<rect x="654.2" y="296.3" width="171.6" height="67.4" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Об'єкт C (новий власник)</tspan><tspan x="740.0" dy="13.7">ptr: 0x1000 (перехоплено!)</tspan><tspan x="740.0" dy="13.7">size: 100'000</tspan><tspan x="740.0" dy="13.7">cap: 100'000</tspan></text>
<line x1="665.0" y1="330.0" x2="575.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="225.0" y1="330.0" x2="325.0" y2="330.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="450.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ціна: 3 копіювання 64-бітних полів (24 байти у регістрах) — складність O(1)</text>
</svg>