<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція документа: шлях пропозиції від чернетки до стандарту</text>
<rect x="47.5" y="92.2" width="125.0" height="55.6" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.8"/><text x="110.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Чернетка автора</tspan><tspan x="110.0" dy="14.3">DXXXXR0</tspan><tspan x="110.0" dy="14.3">(Робоча версія)</tspan></text>
<line x1="175.0" y1="120.0" x2="240.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="234.3" y="92.2" width="141.4" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="305.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Перша публікація</tspan><tspan x="305.0" dy="14.3">PXXXXR0</tspan><tspan x="305.0" dy="14.3">(Подання в розсилку)</tspan></text>
<line x1="370.0" y1="120.0" x2="435.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="435.6" y="92.2" width="128.9" height="55.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Доопрацювання</tspan><tspan x="500.0" dy="14.3">PXXXXRn</tspan><tspan x="500.0" dy="14.3">(EWG/LEWG ревізії)</tspan></text>
<line x1="565.0" y1="120.0" x2="630.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.6" y="92.2" width="128.9" height="55.6" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="695.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Формулювання</tspan><tspan x="695.0" dy="14.3">CWG / LWG</tspan><tspan x="695.0" dy="14.3">(Текст у стандарт)</tspan></text>
<line x1="760.0" y1="120.0" x2="815.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="817.5" y="92.2" width="125.0" height="55.6" rx="6" fill="#fdf2f8" stroke="#c0392b" stroke-width="1.8"/><text x="880.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Working Draft</tspan><tspan x="880.0" dy="14.3">Ухвалено Plenary</tspan><tspan x="880.0" dy="14.3">(Стандарт ISO)</tspan></text>
<rect x="60.0" y="205.0" width="860.0" height="85.0" rx="6" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="490.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключовий принцип версіонування документів WG21:</text>
<text x="490.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Номер PXXXX закріплюється за ідеєю назавжди. Кожна зміна дизайну чи формулювань отримує новий номер ревізії (R0 → R1 → R2...).</tspan><tspan x="490.0" dy="14.9">Історичні папери до 2015 року мали префікс N (наприклад, N3337) і єдину наскрізну нумерацію.</tspan></text>
</svg>