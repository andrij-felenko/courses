<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння суворого режиму відповідності ISO та розширень</text>
<text x="500.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння діалектів: суворий ISO C++ проти розширень компіляторів</text>
<rect x="40.0" y="70.0" width="445.0" height="425.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="262.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Суворий режим відповідності ISO C++</text>
<text x="262.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GCC/Clang: -std=c++20 -pedantic-errors  |  MSVC: /std:c++20 /permissive-</text>
<line x1="55.0" y1="132.0" x2="470.0" y2="132.0" stroke="#16a34a" stroke-width="1.0"/>
<rect x="54.0" y="148.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="262.5" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Двофазний пошук імен у шаблонах</tspan><tspan x="262.5" dy="14.3">Помилки у залежних іменах виявляються на першій фазі</tspan></text>
<rect x="54.0" y="214.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="262.5" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Заборона нестандартних VLA</tspan><tspan x="262.5" dy="14.3">Масиви змінної довжини відхиляються; std::vector/span</tspan></text>
<rect x="54.0" y="280.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="262.5" y="304.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Стандартний препроцесор ISO</tspan><tspan x="262.5" dy="14.3">Коректний розбір __VA_OPT__ та макросів (/Zc:preprocessor)</tspan></text>
<rect x="54.0" y="346.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="262.5" y="370.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Точне значення макроса __cplusplus</tspan><tspan x="262.5" dy="14.3">Повертає реальну дату стандарту 202002L (/Zc:__cplusplus)</tspan></text>
<rect x="54.0" y="412.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="262.5" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Гарантована кросплатформність</tspan><tspan x="262.5" dy="14.3">Код надійно збирається всіма основними компіляторами</tspan></text>
<rect x="515.0" y="70.0" width="445.0" height="425.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/>
<text x="737.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">Розширений та поблажливий режим (Extensions)</text>
<text x="737.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GCC/Clang: -std=gnu++20 (типовий)  |  MSVC: /permissive (застарілий)</text>
<line x1="530.0" y1="132.0" x2="945.0" y2="132.0" stroke="#dc2626" stroke-width="1.0"/>
<rect x="529.0" y="148.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="737.5" y="172.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Однофазний пошук імен (MSVC legacy)</tspan><tspan x="737.5" dy="14.3">Шаблони перевіряються лише при інстанціації, маскуючи баги</tspan></text>
<rect x="529.0" y="214.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="737.5" y="238.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Розширення GNU C у коді C++</tspan><tspan x="737.5" dy="14.3">VLA, вирази-блоки ({ ... }), typeof без попереджень</tspan></text>
<rect x="529.0" y="280.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="737.5" y="304.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Традиційний препроцесор MSVC</tspan><tspan x="737.5" dy="14.3">Помилкове склеювання токенів, що ламає макробібліотеки</tspan></text>
<rect x="529.0" y="346.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="737.5" y="370.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Застаріле значення __cplusplus</tspan><tspan x="737.5" dy="14.3">MSVC за замовчуванням видає 199711L задля сумісності</tspan></text>
<rect x="529.0" y="412.0" width="417.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="737.5" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Прив'язка до одного компілятора</tspan><tspan x="737.5" dy="14.3">Код не переноситься на інші платформи без правок</tspan></text>
</svg>