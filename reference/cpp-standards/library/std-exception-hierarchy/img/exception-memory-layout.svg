<svg xmlns="http://www.w3.org/2000/svg" viewBox="-266.75 -10 1473.5 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-266.75" y="-10" width="1473.5" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::system_error</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::system_error та механізм зберігання what()</text>
<text x="50.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Фізичне розміщення об'єкта std::system_error в EH-купі (Exception Heap):</text>
<rect x="50.0" y="85.0" width="540.0" height="200.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">┌─────────────────────────────────────────────────────────────┐</tspan><tspan x="320.0" dy="14.3">│ vptr ───► vtable (std::system_error)                       │</tspan><tspan x="320.0" dy="14.3">├─────────────────────────────────────────────────────────────┤</tspan><tspan x="320.0" dy="14.3">│ std::runtime_error payload: std::string what_buffer_        │</tspan><tspan x="320.0" dy="14.3">│  └─ ptr: 0x7f9a... ──► &quot;Network socket read failed: Connection reset&quot; │</tspan><tspan x="320.0" dy="14.3">├─────────────────────────────────────────────────────────────┤</tspan><tspan x="320.0" dy="14.3">│ std::error_code code_:                                      │</tspan><tspan x="320.0" dy="14.3">│  ├─ int val_ = 104 (ECONNRESET)                             │</tspan><tspan x="320.0" dy="14.3">│  └─ const std::error_category* cat_ ──► &amp;system_category() │</tspan><tspan x="320.0" dy="14.3">└─────────────────────────────────────────────────────────────┘</tspan></text>
<line x1="600.0" y1="180.0" x2="660.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="665.0" y="85.0" width="225.0" height="200.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="777.5" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Особливості роботи what():</tspan><tspan x="777.5" dy="14.3"></tspan><tspan x="777.5" dy="14.3">• Повідомлення what() генерується</tspan><tspan x="777.5" dy="14.3">  ПІД ЧАС КОНСТРУЮВАННЯ.</tspan><tspan x="777.5" dy="14.3">• Конструктор форматує рядок:</tspan><tspan x="777.5" dy="14.3">  &quot;custom_prefix: error_message&quot;.</tspan><tspan x="777.5" dy="14.3">• Метод what() повертає c_str()</tspan><tspan x="777.5" dy="14.3">  готового внутрішнього рядка.</tspan><tspan x="777.5" dy="14.3">• what() не виділяє пам'ять</tspan><tspan x="777.5" dy="14.3">  і має специфікатор noexcept!</tspan></text>
<rect x="50.0" y="305.0" width="840.0" height="100.0" rx="6" fill="#fffaf0" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="352.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ЧОМУ WHAT() МАЄ ГАРАНТІЮ NOEXCEPT:</tspan><tspan x="470.0" dy="11.7">Якщо під час обробки винятку (stack unwinding) метод what() кинув би власний виняток (наприклад, std::bad_alloc при спробі виділити пам'ять для std::string), середовище виконання C++ негайно викликає std::terminate(). Тому всі стандартні винятки зберігають буфер повідомлення заздалегідь або повертають статичні вказівники.</tspan></text>
</svg>