<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поліморфне перехоплення винятків та Slicing</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поліморфне перехоплення за посиланням проти зрізання об'єкта (Slicing)</text>
<rect x="330.0" y="55.0" width="280.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="82.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">throw std::out_of_range(&quot;Index 5 out of bounds&quot;);</tspan><tspan x="470.0" dy="11.7">Об'єкт створено у спеціальній зоні пам'яті EH</tspan></text>
<line x1="380.0" y1="115.0" x2="240.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="115.0" x2="700.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечний шлях (Посилання)</text>
<text x="670.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Небезпечний шлях (За значенням)</text>
<rect x="40.0" y="165.0" width="400.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">catch (const std::exception&amp; e)</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">• Зв'язується через const посилання на оригінал</tspan><tspan x="240.0" dy="14.3">• Таблиця vtable зберігає вихідний тип out_of_range</tspan><tspan x="240.0" dy="14.3">• e.what() повертає: &quot;Index 5 out of bounds&quot;</tspan><tspan x="240.0" dy="14.3">• Копіювання відсутнє (Нульовий оверхед)</tspan></text>
<rect x="500.0" y="165.0" width="400.0" height="120.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">catch (std::exception e)  // ⚠️ Object Slicing!</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">• Створюється копія лише базової частини std::exception</tspan><tspan x="700.0" dy="14.3">• Поле std::string із повідомленням ЗРІЗАЄТЬСЯ</tspan><tspan x="700.0" dy="14.3">• Таблиця vtable скидається до std::exception::vtable</tspan><tspan x="700.0" dy="14.3">• e.what() повертає банальне: &quot;std::exception&quot;</tspan></text>
<rect x="40.0" y="310.0" width="860.0" height="95.0" rx="6" fill="#fffaf0" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="341.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ПРАВИЛО ПЕРЕХОПЛЕННЯ ВИНЯТКІВ У C++:</tspan><tspan x="470.0" dy="13.0">1. Завжди перехоплюйте винятки за константним посиланням: catch (const std::exception&amp; e).</tspan><tspan x="470.0" dy="13.0">2. Розміщуйте блоки catch від найменш абстрактного (похідного) до найбільш абстрактного (базового).</tspan><tspan x="470.0" dy="13.0">3. Порушення порядку (наприклад, catch (const std::exception&amp;) перед catch (const std::out_of_range&amp;)) робить похідний блок недосяжним кодом.</tspan></text>
</svg>