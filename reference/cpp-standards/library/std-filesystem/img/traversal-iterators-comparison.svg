<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей обходу каталогів</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі обходу дерев каталогів: Однорівнева vs Рекурсивна</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">std::filesystem::directory_iterator</text>
<rect x="50.0" y="95.0" width="400.0" height="330.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Сканування тільки поточного рівня (Shallow Traversal)</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">root_dir/</tspan><tspan x="250.0" dy="14.3">  ├── file1.txt       [ Прочитано ]</tspan><tspan x="250.0" dy="14.3">  ├── sub_dir/        [ Прочитано лише запис про підкаталог ]</tspan><tspan x="250.0" dy="14.3">  │     ├── sub1.cpp  [ Ігнорується / Не заходимо ]</tspan><tspan x="250.0" dy="14.3">  │     └── sub2.h    [ Ігнорується / Не заходимо ]</tspan><tspan x="250.0" dy="14.3">  └── file2.bin       [ Прочитано ]</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">Особливості:</tspan><tspan x="250.0" dy="14.3">• Одиничний виклик opendir / readdir у системному дескрипторі</tspan><tspan x="250.0" dy="14.3">• Мінімальний стек пам'яті O(1)</tspan><tspan x="250.0" dy="14.3">• Ітератор звертається до directory_entry</tspan></text>
<text x="490.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">std::filesystem::recursive_directory_iterator</text>
<rect x="490.0" y="95.0" width="400.0" height="330.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Рекурсивний обхід вглиб (DFS Depth-First Traversal)</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">root_dir/</tspan><tspan x="690.0" dy="14.3">  ├── file1.txt       [ 1. Зайти ]</tspan><tspan x="690.0" dy="14.3">  ├── sub_dir/        [ 2. Зайти рекурсивно ]</tspan><tspan x="690.0" dy="14.3">  │     ├── sub1.cpp  [ 3. Обробити ]</tspan><tspan x="690.0" dy="14.3">  │     └── sub2.h    [ 4. Обробити ]</tspan><tspan x="690.0" dy="14.3">  └── file2.bin       [ 5. Повернутися та обробити ]</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">Управління стеком рекурсії:</tspan><tspan x="690.0" dy="14.3">• depth(): поточна глибина занурення</tspan><tspan x="690.0" dy="14.3">• disable_recursion_pending(): пропустити поточний підкаталог</tspan><tspan x="690.0" dy="14.3">• pop(): примусовий вихід на рівень вгору</tspan><tspan x="690.0" dy="14.3">• follow_directory_symlinks: захист від зациклень!</tspan></text>
<text x="470.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен крок ітератора повертає const directory_entry&amp; з кешованим статусом файлу</text>
</svg>