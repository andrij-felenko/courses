<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний макет модуля std::filesystem</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та компоненти std::filesystem (C++17)</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Рівень абстракцій C++ (High-Level C++ Abstractions)</text>
<rect x="50.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">std::filesystem::path</tspan><tspan x="150.0" dy="14.3">• Кросплатформовий шлях</tspan><tspan x="150.0" dy="14.3">• Синтаксичний розбір</tspan><tspan x="150.0" dy="14.3">• Кодування char/wchar_t</tspan><tspan x="150.0" dy="14.3">• preferred_separator</tspan></text>
<rect x="270.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">std::filesystem::directory_entry</tspan><tspan x="370.0" dy="11.7">• Кешований елемент каталогу</tspan><tspan x="370.0" dy="11.7">• status() / symlink_status()</tspan><tspan x="370.0" dy="11.7">• file_size() / last_write_time()</tspan><tspan x="370.0" dy="11.7">• Мінімізація syscalls</tspan></text>
<rect x="490.0" y="90.0" width="200.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Спеціальні типи даних</tspan><tspan x="590.0" dy="11.7">• file_status (file_type, perms)</tspan><tspan x="590.0" dy="11.7">• space_info (capacity, free, avail)</tspan><tspan x="590.0" dy="11.7">• file_time_type (std::chrono)</tspan><tspan x="590.0" dy="11.7">• copy_options / perm_options</tspan></text>
<rect x="710.0" y="90.0" width="180.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Ітератори дерева</tspan><tspan x="800.0" dy="11.7">• directory_iterator</tspan><tspan x="800.0" dy="11.7">• recursive_directory_iterator</tspan><tspan x="800.0" dy="11.7">• directory_options</tspan></text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень операцій та двокамерна обробка помилок</text>
<rect x="50.0" y="250.0" width="420.0" height="100.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="285.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Вільні операційні функції (fs::copy, fs::remove_all, fs::create_directories, ...)</tspan><tspan x="260.0" dy="11.7"></tspan><tspan x="260.0" dy="11.7">[ Шлях із винятками ]                 [ Шлях із кодами помилок ]</tspan><tspan x="260.0" dy="11.7">fs::exists(p) ──&gt; throws std::filesystem_error   fs::exists(p, ec) ──&gt; ec.clear() / ec.assign()</tspan></text>
<rect x="490.0" y="250.0" width="400.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Правила обробки TOCTOU та симпосилань</tspan><tspan x="690.0" dy="14.3">• symlink_status() проти status()</tspan><tspan x="690.0" dy="14.3">• canonical() проти weakly_canonical()</tspan><tspan x="690.0" dy="14.3">• skip_permission_denied прапорці</tspan></text>
<line x1="40.0" y1="375.0" x2="900.0" y2="375.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Низькорівневий шар операційної системи (VFS / Native OS APIs)</text>
<rect x="50.0" y="420.0" width="410.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">POSIX Systems (Linux / macOS / BSD)</tspan><tspan x="255.0" dy="14.3">• syscalls: stat(), lstat(), openat(), readdir_r()</tspan><tspan x="255.0" dy="14.3">• UTF-8 шляхи (std::string / char*)</tspan><tspan x="255.0" dy="14.3">• / ідентифікатор розділювача</tspan></text>
<rect x="480.0" y="420.0" width="410.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="685.0" y="439.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Windows Systems (Win32 / NTFS)</tspan><tspan x="685.0" dy="14.3">• APIs: GetFileAttributesExW, FindFirstFileW</tspan><tspan x="685.0" dy="14.3">• UTF-16 шляхи (std::wstring / wchar_t*)</tspan><tspan x="685.0" dy="14.3">• \ та / розділювачі, букви дисків (C:)</tspan></text>
</svg>