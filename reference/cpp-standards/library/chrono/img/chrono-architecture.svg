<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура точок часу та тривалостей у std::chrono</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Архітектура точок часу та тривалостей у std::chrono</text>
<line x1="70.0" y1="130.0" x2="870.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<line x1="860.0" y1="130.0" x2="890.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="890.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">Час (t)</text>
<line x1="120.0" y1="115.0" x2="120.0" y2="145.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="120.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Епоха (Epoch)</text>
<text x="120.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t = 0 (1970-01-01 / boot)</text>
<line x1="360.0" y1="115.0" x2="360.0" y2="145.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="360.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">time_point t1</text>
<line x1="720.0" y1="115.0" x2="720.0" y2="145.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="720.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">time_point t2</text>
<line x1="120.0" y1="185.0" x2="360.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4 4"/>
<line x1="120.0" y1="185.0" x2="360.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">d1 = t1 - Epoch</text>
<line x1="360.0" y1="185.0" x2="720.0" y2="185.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="360.0" y1="185.0" x2="720.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">∆t = t2 - t1 (duration: count × ratio)</text>
<rect x="50.0" y="225.0" width="400.0" height="180.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">std::chrono::duration&lt;Rep, Period&gt;</tspan><tspan x="250.0" dy="15.6">• Rep: тип лічильника (int64_t, double)</tspan><tspan x="250.0" dy="15.6">• Period: std::ratio&lt;Num, Denom&gt; (секунди, мс, нс)</tspan><tspan x="250.0" dy="15.6">• Збереження: типізований скаляр без оверхеду</tspan><tspan x="250.0" dy="15.6">• Арифметика: перевірка одиниць під час компіляції</tspan></text>
<rect x="490.0" y="225.0" width="400.0" height="180.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">std::chrono::time_point&lt;Clock, Duration&gt;</tspan><tspan x="690.0" dy="15.6">• Clock: зв'язує точку з фізичним годинником</tspan><tspan x="690.0" dy="15.6">• Duration: тривалість від епохи годинника</tspan><tspan x="690.0" dy="15.6">• Афінний простір: Point - Point = Duration</tspan><tspan x="690.0" dy="15.6">• Зміщення: Point + Duration = Point</tspan></text>
</svg>