<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті при оптимізації малих рядків (SSO)</text>
<text x="50.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Оптимізація малих рядків (SSO — Small String Optimization)</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Режим 1: Короткий рядок (довжина ≤ 15..23 символів)</text>
<rect x="50.0" y="95.0" width="840.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Внутрішній union об'єкта std::string (на стеку, 24/32 байти):</tspan><tspan x="470.0" dy="15.6">[ Буфер на стеку: 'S' 'm' 'a' 'l' 'l' '\0' . . . . . . . . . . . . . . . | size/tag ]</tspan><tspan x="470.0" dy="15.6">Пам'ять у купі НЕ ВИДІЛЯЄТЬСЯ. Дані розміщені безпосередньо всередині самого об'єкта.</tspan></text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Режим 2: Довгий рядок (довжина &gt; 15..23 символів)</text>
<rect x="50.0" y="250.0" width="360.0" height="110.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Об'єкт std::string на стеку:</tspan><tspan x="230.0" dy="15.6">ptr: 0x7fff5fbff010 ───┐</tspan><tspan x="230.0" dy="15.6">size: 1024              │</tspan><tspan x="230.0" dy="15.6">capacity: 2048          │</tspan></text>
<line x1="410.0" y1="305.0" x2="495.0" y2="305.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="250.0" width="390.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="695.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Динамічний буфер у купі (Heap Allocation):</tspan><tspan x="695.0" dy="11.7">['V','e','r','y',' ','l','o','n','g',' ','s','t','r','i','n','g','...','\0']</tspan><tspan x="695.0" dy="11.7">Буфер виділено через malloc/new[]; при зростанні робиться realloc</tspan></text>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">SSO усуває виклики new/delete для коротких рядків за рахунок більшого розміру sizeof(std::string)</text>
</svg>