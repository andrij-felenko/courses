<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Небезпека виникнення dangling pointer при вживанні string_view з тимчасовими об'єктами</text>
<text x="50.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">Пастка: Провалений вказівник (Dangling string_view)</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Створення тимчасового std::string</text>
<rect x="50.0" y="95.0" width="340.0" height="80.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">std::string_view sv = get_name();</tspan><tspan x="220.0" dy="15.6">// get_name() повертає тимчасовий std::string</tspan></text>
<line x1="390.0" y1="135.0" x2="455.0" y2="135.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="95.0" width="430.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Тимчасовий std::string (rvalue)</tspan><tspan x="675.0" dy="15.6">Виділений буфер у купі: [&quot;Alexander\0&quot;]</tspan><tspan x="675.0" dy="15.6">sv.ptr показує на цей буфер</tspan></text>
<line x1="40.0" y1="195.0" x2="900.0" y2="195.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Кінцівка виразу (Full-expression end): Тимчасовий об'єкт знищується!</text>
<rect x="50.0" y="240.0" width="340.0" height="110.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">std::string_view sv;</tspan><tspan x="220.0" dy="15.6">sv.ptr ───┐ (недійсний!)</tspan><tspan x="220.0" dy="15.6">sv.size = 9│</tspan></text>
<line x1="390.0" y1="295.0" x2="455.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="240.0" width="430.0" height="110.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Звільнена пам'ять (Freed Heap Memory)</tspan><tspan x="675.0" dy="15.6">[ Звільнено / Пошкоджено ] ✖</tspan><tspan x="675.0" dy="15.6">Виклик sv.data() або друк викликає Undefined Behavior!</tspan></text>
<text x="470.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">std::string_view НЕ продовжує час життя тимчасових об'єктів (на відміну від const std::string&amp;)</text>
</svg>