<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::string та std::string_view</text>
<text x="50.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">std::string (Володіння пам'яттю на купі)</text>
<rect x="50.0" y="65.0" width="260.0" height="110.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">std::string (на стеку)</tspan><tspan x="180.0" dy="16.9">ptr ────┐</tspan><tspan x="180.0" dy="16.9">size: 13  │</tspan><tspan x="180.0" dy="16.9">cap: 31   │</tspan></text>
<line x1="310.0" y1="95.0" x2="470.0" y2="95.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="65.0" width="415.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="682.5" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Динамічний буфер у купі (Heap Allocation)</tspan><tspan x="682.5" dy="15.6">['H','e','l','l','o',',',' ','W','o','r','l','d','!','\0']</tspan></text>
<text x="470.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::string володіє буфером: виділяє пам'ять через new[], стежить за capacity та гарантує '\0'</text>
<line x1="40.0" y1="215.0" x2="900.0" y2="215.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">std::string_view (Безволодісний погляд на підрядок)</text>
<rect x="50.0" y="265.0" width="260.0" height="110.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">std::string_view (на стеку)</tspan><tspan x="180.0" dy="16.9">ptr ────────┐</tspan><tspan x="180.0" dy="16.9">size: 5     │</tspan><tspan x="180.0" dy="16.9">(без cap)   │</tspan></text>
<line x1="310.0" y1="295.0" x2="545.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="265.0" width="415.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Зовнішній буфер у пам'яті (без виділення пам'яті!)</tspan><tspan x="682.5" dy="15.6">['H','e','l','l','o',',',' ','W','o','r','l','d','!','\0']</tspan><tspan x="682.5" dy="15.6">      ▲             ▲</tspan><tspan x="682.5" dy="15.6">      └─ size = 5 ──┘</tspan></text>
<text x="470.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::string_view лише посилається на чужу пам'ять: sizeof=16 байтів (ptr + size), O(1) substr, без '\0'</text>
</svg>