<rect x="539.9" y="109.3" width="160.2" height="41.3" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="620.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">func_ptr[A1, B2]</tspan><tspan x="620.0" dy="14.3">Call: visitor(A_i, B_j)</tspan></text>
