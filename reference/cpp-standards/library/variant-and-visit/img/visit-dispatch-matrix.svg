<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця диспетчеризації std::visit</text>
<text x="460.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця диспетчеризації std::visit(visitor, v1, v2) для двох варіантів</text>
<rect x="81.6" y="78.4" width="156.8" height="63.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">std::variant v1</tspan><tspan x="160.0" dy="15.6">Альтернативи: A1, A2</tspan><tspan x="160.0" dy="15.6">v1.index() ∈ {0, 1}</tspan></text>
