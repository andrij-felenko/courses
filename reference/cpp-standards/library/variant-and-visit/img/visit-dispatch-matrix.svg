<text x="460.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Генерація матриці комбінацій відбувається на етапі компіляції з опрацюванням усіх перегрузок visitor</text>
