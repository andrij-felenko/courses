<rect x="369.9" y="189.3" width="160.2" height="41.3" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="450.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">func_ptr[A2, B1]</tspan><tspan x="450.0" dy="14.3">Call: visitor(A_i, B_j)</tspan></text>
<rect x="539.9" y="189.3" width="160.2" height="41.3" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="620.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">func_ptr[A2, B2]</tspan><tspan x="620.0" dy="14.3">Call: visitor(A_i, B_j)</tspan></text>
<rect x="709.9" y="189.3" width="160.2" height="41.3" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.2"/><text x="790.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">func_ptr[A2, B3]</tspan><tspan x="790.0" dy="14.3">Call: visitor(A_i, B_j)</tspan></text>
<rect x="402.8" y="276.4" width="434.4" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Обчислення індексу в таблиці: matrix[v1.index()][v2.index()]</tspan><tspan x="620.0" dy="15.6">Прямий виклик покажчика на функцію за один крок O(1)</tspan><tspan x="620.0" dy="15.6">Жодних віртуальних таблиць (vtable) чи динамічного виділення</tspan></text>
