<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід у стан valueless_by_exception</text>
<text x="460.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка переходу std::variant у стан valueless_by_exception</text>
<rect x="59.1" y="126.4" width="201.8" height="67.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="160.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Стан 1: Валідний</tspan><tspan x="160.0" dy="15.6">index_ = 0 (Тип T1)</tspan><tspan x="160.0" dy="15.6">T1 в буфері ініціалізовано</tspan></text>
<rect x="318.9" y="69.3" width="282.2" height="61.4" rx="6" fill="#fcf8e3" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Операція v = T2(args...)</tspan><tspan x="460.0" dy="15.0">1. Деструктор ~T1() знищує старий об'єкт</tspan><tspan x="460.0" dy="15.0">2. Конструктор T2(args...) створює новий</tspan></text>
<rect x="351.7" y="209.3" width="216.6" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="460.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">ПОМИЛКА: Виняток!</tspan><tspan x="460.0" dy="15.0">T2(args...) кидає виняток</tspan><tspan x="460.0" dy="15.0">T1 вже знищено, T2 не створено</tspan></text>
<rect x="638.6" y="126.4" width="242.9" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="760.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Стан 2: Valueless</tspan><tspan x="760.0" dy="15.6">index_ = variant_npos</tspan><tspan x="760.0" dy="15.6">valueless_by_exception() == true</tspan></text>
<line x1="260.0" y1="140.0" x2="360.0" y2="100.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="100.0" x2="660.0" y2="140.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="145.0" x2="460.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="240.0" x2="660.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="153.9" y="316.4" width="612.2" height="67.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Шляхи відновлення з valueless стану:</tspan><tspan x="460.0" dy="15.6">• v.emplace&lt;T&gt;(args...) — створення нового об'єкта в буфері без огляду на минулий стан</tspan><tspan x="460.0" dy="15.6">• v = T(...) — присвоєння валідного значення через переміщення/копіювання</tspan></text>
<text x="460.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Виклик std::get або std::visit у стані valueless_by_exception викидає std::bad_variant_access</text>
</svg>