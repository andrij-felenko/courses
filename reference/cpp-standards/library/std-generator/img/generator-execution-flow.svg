<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура std::generator</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Архітектура та цикли призупинення / відновлення std::generator</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Код викликача (Caller Loop)</text>
<rect x="50.0" y="90.0" width="250.0" height="310.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">for (int v : generate_nums()) {</tspan><tspan x="175.0" dy="15.6">  // 1. auto it = gen.begin()</tspan><tspan x="175.0" dy="15.6">  //    --&gt; handle.resume()</tspan><tspan x="175.0" dy="15.6">  //</tspan><tspan x="175.0" dy="15.6">  // 2. int v = *it</tspan><tspan x="175.0" dy="15.6">  //    --&gt; promise.value()</tspan><tspan x="175.0" dy="15.6">  //</tspan><tspan x="175.0" dy="15.6">  // 3. ++it</tspan><tspan x="175.0" dy="15.6">  //    --&gt; handle.resume()</tspan><tspan x="175.0" dy="15.6">  use(v);</tspan><tspan x="175.0" dy="15.6">}</tspan></text>
<text x="340.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт std::generator&lt;T&gt;</text>
<rect x="340.0" y="90.0" width="240.0" height="310.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="177.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">std::generator&lt;T&gt;</tspan><tspan x="460.0" dy="14.3">┌───────────────────────────────┐</tspan><tspan x="460.0" dy="14.3">│ std::coroutine_handle&lt;P&gt; h_  │</tspan><tspan x="460.0" dy="14.3">└──────────────┬────────────────┘</tspan><tspan x="460.0" dy="14.3">               │</tspan><tspan x="460.0" dy="14.3">               ▼</tspan><tspan x="460.0" dy="14.3">iterator:</tspan><tspan x="460.0" dy="14.3">• begin() -&gt; resume() h_</tspan><tspan x="460.0" dy="14.3">• operator*() -&gt; promise.val_</tspan><tspan x="460.0" dy="14.3">• operator++() -&gt; resume() h_</tspan><tspan x="460.0" dy="14.3">• sentinel: default_sentinel_t</tspan></text>
<text x="630.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Кадр корутини у купі (Heap Frame)</text>
<rect x="630.0" y="90.0" width="260.0" height="310.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Coroutine Frame:</tspan><tspan x="760.0" dy="14.3">┌───────────────────────────────┐</tspan><tspan x="760.0" dy="14.3">│ promise_type (std::generator) │</tspan><tspan x="760.0" dy="14.3">│   • val_ptr / ref_holder     │</tspan><tspan x="760.0" dy="14.3">│   • initial_suspend: always   │</tspan><tspan x="760.0" dy="14.3">│   • yield_value(x): suspend   │</tspan><tspan x="760.0" dy="14.3">├───────────────────────────────┤</tspan><tspan x="760.0" dy="14.3">│ Тіло корутини:                │</tspan><tspan x="760.0" dy="14.3">│   co_yield 1; // suspend      │</tspan><tspan x="760.0" dy="14.3">│   co_yield 2; // suspend      │</tspan><tspan x="760.0" dy="14.3">│   co_return;  // done         │</tspan><tspan x="760.0" dy="14.3">└───────────────────────────────┘</tspan></text>
<line x1="300.0" y1="150.0" x2="340.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="180.0" x2="630.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="630.0" y1="240.0" x2="580.0" y2="240.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Призупинення на co_yield повертає керування у викликач без розгортання системного стеку</text>
</svg>