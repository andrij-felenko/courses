<text x="50.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Адреси елементів розташовані строго послідовно: addr(i) = base + i * sizeof(T). Сумісно з std::span.</text>
