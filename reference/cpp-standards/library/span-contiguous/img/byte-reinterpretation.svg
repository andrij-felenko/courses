<rect x="450.0" y="100.0" width="380.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Value 1: 0xABCDEF01 (4 байти)</tspan><tspan x="640.0" dy="15.6">[ 0x01 | 0xEF | 0xCD | 0xAB ]</tspan></text>
<line x1="440.0" y1="200.0" x2="440.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">std::as_bytes(span)</text>
<text x="50.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Байтовий зріз: std::span&lt;const std::byte, 8&gt; (size_bytes() = 8)</text>
