<text x="50.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дозволяє читати/писати сирі байти структур без порушення strict aliasing rules або reinterpret_cast.</text>
