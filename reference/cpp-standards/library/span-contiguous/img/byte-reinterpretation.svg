<svg xmlns="http://www.w3.org/2000/svg" viewBox="-235 -10 1175 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-235" y="-10" width="1175" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переінтерпретація типів у байтовий зріз</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Безпечна переінтерпретація пам'яті: std::as_bytes та std::as_writable_bytes</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Типизований зріз: std::span&lt;const uint32_t, 2&gt;</text>
