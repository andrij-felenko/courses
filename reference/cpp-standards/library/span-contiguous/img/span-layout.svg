<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::span з динамічним та статичним розміром</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Макет пам'яті std::span: Dynamic Extent проти Static Extent</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">1. Динамічний розмір: std::span&lt;int&gt; (Extent = std::dynamic_extent, sizeof = 16 байтів)</text>
<rect x="50.0" y="90.0" width="240.0" height="110.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">std::span&lt;int&gt;</tspan><tspan x="170.0" dy="15.6">ptr: 0x7fff... ──┐</tspan><tspan x="170.0" dy="15.6">size: 4       │</tspan><tspan x="170.0" dy="15.6">(розмір у runtime) │</tspan></text>
<line x1="290.0" y1="145.0" x2="470.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="90.0" width="415.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="682.5" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Суцільний масив у пам'яті (C-array / vector / array)</tspan><tspan x="682.5" dy="15.6">[10] | [20] | [30] | [40]</tspan><tspan x="682.5" dy="15.6">0x7fff00 | 0x7fff04 | 0x7fff08 | 0x7fff0C</tspan></text>
<text x="470.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зберігає вказівник data() та довжину size() у полях об'єкта.</text>
<line x1="40.0" y1="235.0" x2="900.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Статичний розмір: std::span&lt;int, 4&gt; (Extent = 4, sizeof = 8 байтів)</text>
<rect x="50.0" y="280.0" width="240.0" height="110.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">std::span&lt;int, 4&gt;</tspan><tspan x="170.0" dy="15.6">ptr: 0x7fff... ──┐</tspan><tspan x="170.0" dy="15.6">(без поля size!) │</tspan><tspan x="170.0" dy="15.6">(розмір у типі)   │</tspan></text>
<line x1="290.0" y1="335.0" x2="470.0" y2="335.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="280.0" width="415.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">Суцільний масив у пам'яті (статична довжина відома компілятору)</tspan><tspan x="682.5" dy="14.3">[10] | [20] | [30] | [40]</tspan><tspan x="682.5" dy="14.3">0x7fff00 | 0x7fff04 | 0x7fff08 | 0x7fff0C</tspan></text>
<text x="470.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нульові накладні витрати на довжину: sizeof дорівнює одному вказівнику (8 байтів).</text>
</svg>