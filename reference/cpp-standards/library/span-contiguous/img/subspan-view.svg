<svg xmlns="http://www.w3.org/2000/svg" viewBox="-248 -10 1188 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-248" y="-10" width="1188" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нуль-копіювальне зрізання масиву через subspan</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Вікно перегляду subspan(): зріз буфера за O(1) без виділення пам'яті</text>
<rect x="50.0" y="70.0" width="840.0" height="85.0" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Оригінальний буфер даних (std::vector&lt;uint8_t&gt; / std::array / C-array)</tspan><tspan x="470.0" dy="15.6">[ Byte 0 ] [ Byte 1 ] [ Byte 2 ] [ Byte 3 ] [ Byte 4 ] [ Byte 5 ] [ Byte 6 ] [ Byte 7 ] [ Byte 8 ] [ Byte 9 ]</tspan></text>
<rect x="50.0" y="180.0" width="840.0" height="60.0" rx="6" fill="#e2f0d9" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Головний view: std::span&lt;uint8_t&gt; (offset = 0, size = 10)</tspan></text>
<line x1="100.0" y1="180.0" x2="100.0" y2="155.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="218.0" y="280.0" width="420.0" height="60.0" rx="6" fill="#fff2cc" stroke="#c0392b" stroke-width="1.5"/><text x="428.0" y="313.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="428.0" dy="0.0">Зріз subspan(2, 5): std::span&lt;uint8_t&gt; (offset = 2, size = 5)</tspan></text>
<line x1="428.0" y1="280.0" x2="428.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="50.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Створення subspan лише змінює вказівник data() і лічильник size(). Дані в пам'яті не копіюються.</text>
