<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360">
<rect width="840" height="360" fill="#ffffff"/>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація синтаксису pipe: від r | adapt(args) до адаптера викладу</text>
<rect x="49.5" y="67.3" width="321.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#34495e" stroke-width="1.5"/><text x="210.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вираз розробника:</tspan><tspan x="210.0" dy="14.3">vec | views::filter(pred) | views::transform(fn)</tspan></text>
<rect x="482.1" y="67.3" width="295.9" height="45.3" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="630.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Часткове застосування (Currying):</tspan><tspan x="630.0" dy="14.3">views::filter(pred) -&gt; range_adaptor_closure</tspan></text>
<line x1="360.0" y1="90.0" x2="475.0" y2="90.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="417.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">1. Оцінка аргументів</text>
<rect x="46.4" y="207.3" width="327.2" height="45.3" rx="6" fill="#eef9f6" stroke="#16a085" stroke-width="1.5"/><text x="210.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Перевантажений operator|(Range&amp;&amp; r, Closure&amp;&amp; c):</tspan><tspan x="210.0" dy="14.3">повертає c(r)</tspan></text>
<rect x="485.0" y="207.3" width="290.0" height="45.3" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="630.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Результуючий вираз:</tspan><tspan x="630.0" dy="14.3">transform_view(filter_view(vec, pred), fn)</tspan></text>
<line x1="630.0" y1="130.0" x2="630.0" y2="185.0" stroke="#f39c12" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="645.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="start">2. Створення closure</text>
<line x1="210.0" y1="130.0" x2="210.0" y2="185.0" stroke="#16a085" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a085" text-anchor="start">3. Передача у pipe</text>
<line x1="360.0" y1="230.0" x2="475.0" y2="230.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="417.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle">4. Виклик конструктора</text>
<text x="420.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Нульова вартість абстракції: після інлайнінгу компілятором згортається у прямі виклики ітераторів</text>
</svg>