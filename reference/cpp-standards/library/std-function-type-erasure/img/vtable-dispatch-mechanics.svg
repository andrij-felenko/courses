<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка диспатчеризації виклику через ручний інвокер у std::function</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка виклику std::function::operator() через ручний інвокер</text>
<rect x="40.0" y="70.0" width="200.0" height="100.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Крок 1: Викликач</tspan><tspan x="140.0" dy="14.3">fn(42);</tspan><tspan x="140.0" dy="14.3">Виклик std::function::</tspan><tspan x="140.0" dy="14.3">operator()(int x)</tspan></text>
<line x1="245.0" y1="120.0" x2="295.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="70.0" width="260.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Крок 2: Непрямий виклик</tspan><tspan x="430.0" dy="14.3">this-&gt;invoker_(&amp;this-&gt;storage, 42);</tspan><tspan x="430.0" dy="14.3">Зчитування вказівника</tspan><tspan x="430.0" dy="14.3">на статичний шаблонний інвокер</tspan></text>
<line x1="565.0" y1="120.0" x2="615.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="70.0" width="280.0" height="100.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Крок 3: Статичний інвокер</tspan><tspan x="760.0" dy="13.0">template&lt;typename Lambda&gt;</tspan><tspan x="760.0" dy="13.0">static R invoke(void* storage, int x) {</tspan><tspan x="760.0" dy="13.0">  return (*cast&lt;Lambda*&gt;(storage))(x);</tspan><tspan x="760.0" dy="13.0">}</tspan></text>
<line x1="40.0" y1="200.0" x2="900.0" y2="200.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="470.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця віртуальних функцій управління (Custom Vtable / Control Block)</text>
<rect x="40.0" y="250.0" width="860.0" height="150.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="278.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">┌─────────────────────────────────────────────────────────────────────────────────────────┐</tspan><tspan x="470.0" dy="14.3">│ std::function Vtable / Function Pointers:                                               │</tspan><tspan x="470.0" dy="14.3">├─────────────────────────────┬─────────────────────────────┬─────────────────────────────┤</tspan><tspan x="470.0" dy="14.3">│ invoker_ptr                 │ manager_ptr (Destructor)    │ manager_ptr (Copy/Move)     │</tspan><tspan x="470.0" dy="14.3">│ R(*)(void* storage, Args...)│ void(*)(void* storage)      │ void(*)(void* dst, src)     │</tspan><tspan x="470.0" dy="14.3">│ Розіменовує storage і       │ Викликає явний деструктор   │ Випливає при копіюванні чи  │</tspan><tspan x="470.0" dy="14.3">│ здійснює виклик operator()  │ ~Lambda() або delete ptr    │ переміщенні std::function   │</tspan><tspan x="470.0" dy="14.3">└─────────────────────────────┴─────────────────────────────┴─────────────────────────────┘</tspan></text>
<text x="470.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Диспатчеризація здійснюється через статичні функціональні покажчики без віртуального спадкування</text>
</svg>