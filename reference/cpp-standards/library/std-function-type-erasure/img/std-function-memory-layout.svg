<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::function для SBO та алокації у купі</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія макету пам'яті std::function (SBO проти Heap)</text>
<text x="40.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Сценарій А: Малий об'єкт (Captures ≤ 16..32 байти)</text>
<rect x="40.0" y="90.0" width="860.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Об'єкт std::function&lt;R(Args...)&gt; на стеку (наприклад, sizeof = 32..48 байтів):</tspan><tspan x="470.0" dy="14.3">┌──────────────────────────────────────┬────────────────────────────────────────────────────────┐</tspan><tspan x="470.0" dy="14.3">│  vtable / invoker ptr (8 B)         │  Внутрішній буфер char storage[24..32 B]              │</tspan><tspan x="470.0" dy="14.3">│  0x004012a0 ─────────► [invoke_fn]   │  [ Вміст лямбди: int x=10, double y=3.14 ] (на стеку) │</tspan><tspan x="470.0" dy="14.3">└──────────────────────────────────────┴────────────────────────────────────────────────────────┘</tspan><tspan x="470.0" dy="14.3">Пам'ять у купі НЕ ВИДІЛЯЄТЬСЯ. Викликається placement new всередині storage.</tspan></text>
<line x1="40.0" y1="220.0" x2="900.0" y2="220.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="40.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Сценарій Б: Великий об'єкт (Captures &gt; SBO limit або non-trivially relocatable)</text>
<rect x="40.0" y="270.0" width="420.0" height="120.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Об'єкт std::function на стеку:</tspan><tspan x="250.0" dy="14.3">┌───────────────────────────────────────┐</tspan><tspan x="250.0" dy="14.3">│ vtable / invoker ptr (8 B)            │</tspan><tspan x="250.0" dy="14.3">├───────────────────────────────────────┤</tspan><tspan x="250.0" dy="14.3">│ storage.heap_ptr (8 B) ─────────────┐ │</tspan><tspan x="250.0" dy="14.3">│ (вказівник на купу)                 │ │</tspan><tspan x="250.0" dy="14.3">└───────────────────────────────────────┴─┘</tspan></text>
<line x1="470.0" y1="330.0" x2="535.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="270.0" width="360.0" height="120.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Динамічний буфер у купі (Heap Allocation):</tspan><tspan x="720.0" dy="14.3">┌────────────────────────────────────────┐</tspan><tspan x="720.0" dy="14.3">│ Динамічний об'єкт лямбди/функтора      │</tspan><tspan x="720.0" dy="14.3">│ [ std::vector, std::string, 100 байтів]│</tspan><tspan x="720.0" dy="14.3">│ Виділяється через operator new()       │</tspan><tspan x="720.0" dy="14.3">└────────────────────────────────────────┘</tspan></text>
<text x="470.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SBO гарантує відсутність алокацій у купі для малих функторів та покажчиків на функції</text>
</svg>