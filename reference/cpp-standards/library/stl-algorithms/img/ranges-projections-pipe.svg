<text x="460.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Елементи обробляються по одному по мірі потреби в циклі — тимчасові вектори не створюються</text>
