<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::expected</text>
<text x="50.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Макет пам'яті std::expected&lt;T, E&gt; (Теговане об'єднання на стеку)</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Стан 1: Успішний результат (Значення T активне)</text>
<rect x="50.0" y="95.0" width="540.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Об'єкт std::expected&lt;std::string, std::error_code&gt; (на стеку):</tspan><tspan x="320.0" dy="15.6">┌───────────────────────────────────────────────┬──────────────┐</tspan><tspan x="320.0" dy="15.6">│ Буфер під корисне значення T (std::string)   │ Прапорець    │</tspan><tspan x="320.0" dy="15.6">│ ptr: 0x7fff... | size: 14 | capacity: 31      │ bool: true   │</tspan><tspan x="320.0" dy="15.6">└───────────────────────────────────────────────┴──────────────┘</tspan></text>
<line x1="600.0" y1="150.0" x2="680.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="685.0" y="95.0" width="205.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="787.5" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Доступ через:</tspan><tspan x="787.5" dy="11.7">• *exp або exp.value()</tspan><tspan x="787.5" dy="11.7">• exp-&gt;length()</tspan><tspan x="787.5" dy="11.7">Конструктор T викликано в осередку storage_</tspan></text>
<text x="50.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Стан 2: Помилка (Значення E активне через std::unexpected)</text>
<rect x="50.0" y="255.0" width="540.0" height="110.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Об'єкт std::expected&lt;std::string, std::error_code&gt; (на стеку):</tspan><tspan x="320.0" dy="15.6">┌───────────────────────────────────────────────┬──────────────┐</tspan><tspan x="320.0" dy="15.6">│ Буфер під помилку E (std::error_code)         │ Прапорець    │</tspan><tspan x="320.0" dy="15.6">│ val: 2 (ENOENT) | cat: &amp;generic_category()    │ bool: false  │</tspan><tspan x="320.0" dy="15.6">└───────────────────────────────────────────────┴──────────────┘</tspan></text>
<line x1="600.0" y1="310.0" x2="680.0" y2="310.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="685.0" y="255.0" width="205.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="787.5" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Доступ через:</tspan><tspan x="787.5" dy="13.0">• exp.error()</tspan><tspan x="787.5" dy="13.0">• exp.has_value() == false</tspan><tspan x="787.5" dy="13.0">Спроба *exp — UB!</tspan><tspan x="787.5" dy="13.0">value() кидає bad_expected_access</tspan></text>
<text x="470.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sizeof(std::expected&lt;T, E&gt;) = max(sizeof(T), sizeof(E)) + align_padding + sizeof(bool)</text>
</svg>