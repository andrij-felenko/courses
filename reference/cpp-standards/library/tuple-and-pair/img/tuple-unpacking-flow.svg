<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розпакування std::tuple через std::apply</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розпакування std::tuple у виклик функції через std::apply</text>
<rect x="40.0" y="80.0" width="220.0" height="110.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">std::tuple&lt;T0, T1, T2&gt;</tspan><tspan x="150.0" dy="15.6">t = {arg0, arg1, arg2}</tspan></text>
<line x1="260.0" y1="135.0" x2="315.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="80.0" width="240.0" height="110.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">std::index_sequence&lt;0, 1, 2&gt;</tspan><tspan x="440.0" dy="13.0">Генерація індексів на етапі компіляції</tspan></text>
<line x1="560.0" y1="135.0" x2="615.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="80.0" width="280.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Розгортання пакета виразів:</tspan><tspan x="760.0" dy="14.3">f(std::get&lt;Is&gt;(t)...)</tspan><tspan x="760.0" dy="14.3">==&gt; f(get&lt;0&gt;(t), get&lt;1&gt;(t), get&lt;2&gt;(t))</tspan></text>
<line x1="470.0" y1="190.0" x2="470.0" y2="245.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="250.0" width="500.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="283.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Виклик цільової функції чи лямбди: f(arg0, arg1, arg2)</tspan><tspan x="470.0" dy="15.6">Повноцінне передавання категорій значень через std::forward</tspan></text>
<text x="470.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::apply усуває ручне розгортання ітераторів та забезпечує нульові накладні витрати на етапі виконання</text>
</svg>