<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння шляхів виводу даних в ОС</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння шляхів виводу: std::cout vs printf vs std::print</text>
<rect x="40.0" y="65.0" width="270.0" height="310.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">std::cout &lt;&lt; val1 &lt;&lt; val2</tspan><tspan x="175.0" dy="14.3">───────────────</tspan><tspan x="175.0" dy="14.3">1. Декілька викликів operator&lt;&lt;</tspan><tspan x="175.0" dy="14.3">2. Динамічна обробка локалі</tspan><tspan x="175.0" dy="14.3">3. Внутрішній буфер std::streambuf</tspan><tspan x="175.0" dy="14.3">4. Синхронізація з stdio (lock)</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">Пастки:</tspan><tspan x="175.0" dy="14.3">❌ Повільний через iostream-буфер</tspan><tspan x="175.0" dy="14.3">❌ Зміна стану (hex, setw)</tspan><tspan x="175.0" dy="14.3">❌ Мішанина при багатопотоковості</tspan></text>
<rect x="335.0" y="65.0" width="270.0" height="310.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">printf(&quot;%s: %d\n&quot;, str, val)</tspan><tspan x="470.0" dy="14.3">───────────────</tspan><tspan x="470.0" dy="14.3">1. Розбір рядка формату у runtime</tspan><tspan x="470.0" dy="14.3">2. Нетипобезпечні C-varargs (va_arg)</tspan><tspan x="470.0" dy="14.3">3. Буферизація через FILE*</tspan><tspan x="470.0" dy="14.3">4. Системний виклик write()</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">Пастки:</tspan><tspan x="470.0" dy="14.3">❌ Небезпечний: %s + int -&gt; UB</tspan><tspan x="470.0" dy="14.3">❌ Немає підтримки власних типів</tspan><tspan x="470.0" dy="14.3">⚠️ Проблеми з UTF-8 на Windows</tspan></text>
<rect x="630.0" y="65.0" width="270.0" height="310.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">std::print(&quot;{}: {}\n&quot;, str, val)</tspan><tspan x="765.0" dy="14.3">───────────────</tspan><tspan x="765.0" dy="14.3">1. Валідація формату під час компіляції</tspan><tspan x="765.0" dy="14.3">2. Форматування у стековий буфер</tspan><tspan x="765.0" dy="14.3">3. Атомарний прямоточний запис</tspan><tspan x="765.0" dy="14.3">4. Прямий виклик OS Unicode API</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">Переваги:</tspan><tspan x="765.0" dy="14.3">✅ Максимальна швидкість (fastest)</tspan><tspan x="765.0" dy="14.3">✅ Повна типобезпека (type safe)</tspan><tspan x="765.0" dy="14.3">✅ Нативна підтримка UTF-8 (OS API)</tspan></text>
<text x="470.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">std::print у C++23 об'єднує швидкість та типобезпеку std::format з прямоточним виводом у консоль</text>
</svg>