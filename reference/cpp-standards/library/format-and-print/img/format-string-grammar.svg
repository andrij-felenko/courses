<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура та граматика специфікаторів формату</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія рядка формату: структура специфікатора format-spec</text>
<rect x="180.0" y="65.0" width="580.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="91.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Синтаксис: {[arg_id] : [[fill]align] [sign] [#] [0] [width] [.precision] [type]}</tspan></text>
<text x="50.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Конкретний приклад: {:*&gt;+10.2f}</text>
<rect x="50.0" y="165.0" width="75.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="87.5" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="87.5" dy="0.0">'*'</tspan><tspan x="87.5" dy="13.0">─────────</tspan><tspan x="87.5" dy="13.0">Заповнювач</tspan><tspan x="87.5" dy="13.0">fill='*'</tspan></text>
<rect x="135.0" y="165.0" width="75.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="172.5" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">'&gt;'</tspan><tspan x="172.5" dy="11.7">─────────</tspan><tspan x="172.5" dy="11.7">Вирівнювання</tspan><tspan x="172.5" dy="11.7">align=праворуч</tspan></text>
<rect x="220.0" y="165.0" width="75.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="257.5" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">'+'</tspan><tspan x="257.5" dy="11.7">─────────</tspan><tspan x="257.5" dy="11.7">Знак</tspan><tspan x="257.5" dy="11.7">sign=завжди +</tspan></text>
<rect x="305.0" y="165.0" width="75.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="342.5" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="342.5" dy="0.0">'#'</tspan><tspan x="342.5" dy="11.7">─────────</tspan><tspan x="342.5" dy="11.7">Альтернативний</tspan><tspan x="342.5" dy="11.7"># (0x / .)</tspan></text>
<rect x="390.0" y="165.0" width="75.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="427.5" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">'0'</tspan><tspan x="427.5" dy="11.7">─────────</tspan><tspan x="427.5" dy="11.7">Нулі</tspan><tspan x="427.5" dy="11.7">0 (padding)</tspan></text>
<rect x="475.0" y="165.0" width="95.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="522.5" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">'10'</tspan><tspan x="522.5" dy="13.0">─────────</tspan><tspan x="522.5" dy="13.0">Ширина</tspan><tspan x="522.5" dy="13.0">width=10</tspan></text>
<rect x="580.0" y="165.0" width="95.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="627.5" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">'.2'</tspan><tspan x="627.5" dy="13.0">─────────</tspan><tspan x="627.5" dy="13.0">Точність</tspan><tspan x="627.5" dy="13.0">precision=2</tspan></text>
<rect x="685.0" y="165.0" width="85.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="727.5" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">'f'</tspan><tspan x="727.5" dy="13.0">─────────</tspan><tspan x="727.5" dy="13.0">Тип виводу</tspan><tspan x="727.5" dy="13.0">type=float</tspan></text>
<rect x="50.0" y="260.0" width="840.0" height="75.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Результат для числа 3.14159:</tspan><tspan x="470.0" dy="15.6">std::format(&quot;{:*&gt;+10.2f}&quot;, 3.14159)  ==&gt;  &quot;*****+3.14&quot;</tspan><tspan x="470.0" dy="15.6">(Ширина 10 символів, заповнення '*', знак '+', 2 знаки після коми)</tspan></text>
<rect x="50.0" y="355.0" width="840.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Основні типи (type):</tspan><tspan x="470.0" dy="14.3">• d (decimal), x/X (hexadecimal), b/B (binary), o (octal)</tspan><tspan x="470.0" dy="14.3">• f/F (fixed float), e/E (scientific), g/G (general float)</tspan><tspan x="470.0" dy="14.3">• s (string), c (char), p (pointer), ? (escaped debug formatting у C++23)</tspan></text>
</svg>