<text x="520.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">РІВЕНЬ 1 · Абстрактний граф цілей у мета-системі (CMake / Meson)</text>
<rect x="60.0" y="88.0" width="260.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Ціль: libnet (STATIC)</tspan><tspan x="190.0" dy="16.2">Входи: net.cpp, net.h</tspan><tspan x="190.0" dy="16.2">Вимоги: PUBLIC inc/net</tspan><tspan x="190.0" dy="16.2">PRIVATE libssl</tspan></text>
<rect x="390.0" y="88.0" width="260.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ціль: app (EXECUTABLE)</tspan><tspan x="520.0" dy="16.2">Входи: main.cpp</tspan><tspan x="520.0" dy="16.2">Залежність: PRIVATE libnet</tspan><tspan x="520.0" dy="16.2">Прапорець: $&lt;CONFIG:Debug:-g3&gt;</tspan></text>
<rect x="720.0" y="88.0" width="260.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Ціль: OpenSSL (IMPORTED)</tspan><tspan x="850.0" dy="16.2">Вимоги: INTERFACE /usr/include</tspan><tspan x="850.0" dy="16.2">Бібліотека: /usr/lib/libssl.so</tspan></text>
