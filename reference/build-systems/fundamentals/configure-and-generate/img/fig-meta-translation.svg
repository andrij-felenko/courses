<text x="520.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">РІВЕНЬ 2 · Плоский низькорівневий граф виконання (build.ninja)</text>
<rect x="60.0" y="338.0" width="425.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="272.5" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">Команда компіляції:</tspan><tspan x="272.5" dy="14.3">build CMakeFiles/net.dir/net.cpp.o: CXX_COMPILER ../src/net.cpp</tspan><tspan x="272.5" dy="14.3">  INCLUDES = -I../src/inc/net -I/usr/include</tspan><tspan x="272.5" dy="14.3">  FLAGS = -O0 -g3 -fPIC -std=c++20</tspan></text>
<rect x="555.0" y="338.0" width="425.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="767.5" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">Команда лінкування:</tspan><tspan x="767.5" dy="13.0">build bin/app: CXX_EXECUTABLE CMakeFiles/app.dir/main.cpp.o libnet.a</tspan><tspan x="767.5" dy="13.0">  LINK_FLAGS = -Wl,-rpath,/usr/lib</tspan><tspan x="767.5" dy="13.0">  LINK_LIBRARIES = libnet.a /usr/lib/libssl.so</tspan></text>
<line x1="487.0" y1="400.0" x2="553.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
