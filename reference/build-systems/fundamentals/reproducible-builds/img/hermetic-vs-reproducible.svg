<rect x="70.0" y="220.0" width="170.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="246.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Без доступу до мережі</tspan></text>
