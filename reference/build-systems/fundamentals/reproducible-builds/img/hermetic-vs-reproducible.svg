<text x="745.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">SHA256(A) ≡ SHA256(Б)</text>
<rect x="565.0" y="270.0" width="360.0" height="85.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="292.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Властивість результату:</tspan><tspan x="745.0" dy="16.2">незалежно від часу, шляху чи машини,</tspan><tspan x="745.0" dy="16.2">однакові вихідні файли дають ідентичний</tspan><tspan x="745.0" dy="16.2">двійковий образ біт-у-біт</tspan></text>
<rect x="565.0" y="370.0" width="360.0" height="45.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="396.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Незалежна перевірка автентичності коду</tspan></text>
