<rect x="70.0" y="290.0" width="360.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Властивість процесу збірки:</tspan><tspan x="250.0" dy="16.2">усі залежності та тулчейн задекларовані,</tspan><tspan x="250.0" dy="16.2">зовнішній світ не впливає на запуск</tspan></text>
