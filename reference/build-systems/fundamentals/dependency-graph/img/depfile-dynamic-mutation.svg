<text x="160.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Початковий статичний граф</text>
<text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(до першої компіляції)</text>
<rect x="113.0" y="143.5" width="94.1" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">engine.cpp</tspan></text>
