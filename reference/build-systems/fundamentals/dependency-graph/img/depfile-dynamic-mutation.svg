<text x="470.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">cc -MD -MF engine.d ...</text>
<rect x="365.0" y="125.0" width="210.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Компілятор парсить</tspan><tspan x="470.0" dy="15.6">всі #include під час</tspan><tspan x="470.0" dy="15.6">трансляції коду</tspan></text>
<rect x="365.0" y="240.0" width="210.0" height="120.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Згенеровано engine.d:</tspan><tspan x="470.0" dy="15.0">engine.o: \</tspan><tspan x="470.0" dy="15.0">  engine.cpp \</tspan><tspan x="470.0" dy="15.0">  engine.h \</tspan><tspan x="470.0" dy="15.0">  config.h \</tspan><tspan x="470.0" dy="15.0">  /usr/include/math.h</tspan></text>
