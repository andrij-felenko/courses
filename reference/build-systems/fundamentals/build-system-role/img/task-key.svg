<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш збірки правдивий рівно настільки, наскільки повний ключ</text>
<rect x="45.0" y="62.0" width="400.0" height="232.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="245.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оголошені входи</text>
<rect x="62.0" y="102.0" width="366.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">вміст .c і всіх включених заголовків</tspan></text>
<rect x="62.0" y="148.0" width="366.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">рядок команди: прапорці, макроси</tspan></text>
<rect x="62.0" y="194.0" width="366.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">версія компілятора й тулчейна</tspan></text>
<rect x="62.0" y="240.0" width="366.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">імена й шляхи вихідних файлів</tspan></text>
<line x1="452.0" y1="178.0" x2="512.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="552.2" y="141.0" width="131.6" height="74.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="618.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="618.0" dy="0.0">ключ задачі</tspan><tspan x="618.0" dy="19.5">= геш усього</tspan><tspan x="618.0" dy="19.5">оголошеного</tspan></text>
<line x1="687.8" y1="178.0" x2="762.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="791.0" y="143.7" width="173.9" height="68.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="878.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">такий ключ уже був —</tspan><tspan x="878.0" dy="17.6">результат беремо</tspan><tspan x="878.0" dy="17.6">з кеша</tspan></text>
<rect x="45.0" y="330.0" width="400.0" height="158.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Непроголошені входи</text>
<rect x="62.0" y="368.0" width="366.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="389.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">заголовок, знайдений у системній теці</tspan></text>
<rect x="62.0" y="408.0" width="366.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="429.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">час збірки, шлях до теки, оточення</tspan></text>
<rect x="62.0" y="448.0" width="366.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">порядок обходу каталогу, паралельність</tspan></text>
<line x1="452.0" y1="408.0" x2="762.0" y2="366.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="806.4" y="322.5" width="143.1" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="878.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">той самий ключ —</tspan><tspan x="878.0" dy="17.6">інший результат</tspan></text>
<text x="600.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">ключ їх не бачить — і рівність, на якій стоїть кеш, тихо ламається</text>
</svg>