<rect x="424.5" y="72.5" width="191.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">черга готових вершин</tspan></text>
<rect x="270.6" y="167.5" width="498.8" height="35.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ключ = геш( вміст входів · рядок команди · імʼя виходу )</tspan></text>
<rect x="365.9" y="257.8" width="308.3" height="54.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="520.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">такий самий ключ уже в журналі,</tspan><tspan x="520.0" dy="19.5">а артефакт на місці?</tspan></text>
<rect x="128.7" y="366.6" width="212.7" height="66.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="235.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">так:</tspan><tspan x="235.0" dy="16.9">команду не запускаємо</tspan><tspan x="235.0" dy="16.9">— ось і вся рання відсічка</tspan></text>
<rect x="706.1" y="366.6" width="197.8" height="66.8" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="2.0"/><text x="805.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">ні:</tspan><tspan x="805.0" dy="16.9">виконати у out.mb-tmp</tspan><tspan x="805.0" dy="16.9">і атомарно перейменувати</tspan></text>
<rect x="683.9" y="495.5" width="242.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="516.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">у журнал: ключ і геш артефакту</tspan></text>
<rect x="378.3" y="565.9" width="283.3" height="52.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="587.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">нащадкам −1 до лічильника;</tspan><tspan x="520.0" dy="18.2">хто дійшов нуля — у чергу готових</tspan></text>
