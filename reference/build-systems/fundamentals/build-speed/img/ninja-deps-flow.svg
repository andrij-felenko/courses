<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ninja .ninja_deps проти розсипу depfiles</text>
<rect x="40.0" y="40.0" width="420.0" height="330.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="250.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний Make: розсип .d файлів</text>
<rect x="65.0" y="105.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Компілятор пише окремий foo.d</tspan><tspan x="250.0" dy="16.2">для кожного з 10 000 об'єктних файлів</tspan></text>
<rect x="65.0" y="195.0" width="370.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Make парсить 10 000 текстових файлів</tspan><tspan x="250.0" dy="16.2">і робить сотні тисяч викликів stat()</tspan><tspan x="250.0" dy="16.2">при кожному запуску збірки</tspan></text>
<text x="250.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Час холостого запуску: 5–25 секунд</text>
