<text x="710.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ninja: компактний лог .ninja_deps</text>
<rect x="525.0" y="105.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Компілятор повертає залежності,</tspan><tspan x="710.0" dy="16.2">Ninja дописує їх у єдиний бінарний лог</tspan></text>
<rect x="525.0" y="195.0" width="370.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Індексований бінарний файл:</tspan><tspan x="710.0" dy="16.2">шляхи дедупліковано в числові ID,</tspan><tspan x="710.0" dy="16.2">читається за один послідовний mmap()</tspan></text>
<text x="710.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Час холостого запуску: 0.03 секунди</text>
