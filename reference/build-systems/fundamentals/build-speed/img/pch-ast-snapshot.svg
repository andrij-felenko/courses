<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефект попередньо скомпільованих заголовків</text>
<rect x="40.0" y="40.0" width="430.0" height="350.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="255.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Без PCH: повторний парсинг N разів</text>
<rect x="65.0" y="105.0" width="380.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Важкі заголовки: &lt;vector&gt;, &lt;string&gt;,</tspan><tspan x="255.0" dy="15.6">&lt;algorithm&gt;, &lt;boost/asio.hpp&gt; (300k рядків)</tspan></text>
<line x1="255.0" y1="168.0" x2="255.0" y2="198.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65.0" y="202.0" width="380.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Компілятор парсить 300 000 рядків</tspan><tspan x="255.0" dy="16.2">і будує AST окремо для a.cpp, b.cpp,</tspan><tspan x="255.0" dy="16.2">c.cpp ... z.cpp (1000 разів).</tspan><tspan x="255.0" dy="16.2">90% часу процесора марнується.</tspan></text>
<text x="255.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Загальний час парсингу: 1000 × 0.4 с = 400 с</text>
<rect x="510.0" y="40.0" width="430.0" height="350.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.6"/>
<text x="725.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З PCH: зліпок AST на диску</text>
<rect x="535.0" y="105.0" width="380.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Парсинг важких заголовків 1 раз</tspan><tspan x="725.0" dy="15.6">→ збереження зліпка AST у pch.h.pch</tspan></text>
<line x1="725.0" y1="168.0" x2="725.0" y2="198.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="535.0" y="202.0" width="380.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="245.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Усі a.cpp ... z.cpp завантажують</tspan><tspan x="725.0" dy="16.2">готовий AST через швидкий mmap() і</tspan><tspan x="725.0" dy="16.2">одразу переходять до аналізу власного коду.</tspan></text>
<text x="725.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Загальний час: 1 раз 0.5 с + 1000 × 0.02 с = 20.5 с</text>
</svg>