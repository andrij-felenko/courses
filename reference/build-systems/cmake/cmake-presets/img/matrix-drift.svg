<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роздробленість конфігурацій проти єдиної декларації у CMakePresets.json</text>
<text x="270.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">роздробленість: у кожного споживача своя копія прапорців</text>
<text x="800.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">декларація: єдине джерело істини</text>
<rect x="50.0" y="76.0" width="440.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Термінал (розробник Linux)</tspan><tspan x="270.0" dy="16.2">cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON</tspan></text>
<rect x="50.0" y="158.0" width="440.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="186.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">CI Runner (GitHub Actions)</tspan><tspan x="270.0" dy="16.2">cmake -B out -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=1</tspan></text>
<rect x="50.0" y="240.0" width="440.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="268.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">VS Code (settings.json)</tspan><tspan x="270.0" dy="16.2">&quot;cmake.configureSettings&quot;: {&quot;TESTS&quot;: &quot;ON&quot;}</tspan></text>
<rect x="50.0" y="322.0" width="440.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Visual Studio (CMakeSettings)</tspan><tspan x="270.0" dy="16.2">{&quot;name&quot;: &quot;x64-Debug&quot;, &quot;variables&quot;: [...]}</tspan></text>
<rect x="50.0" y="416.0" width="440.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">прапорці розходяться між машинами й середовищами;</tspan><tspan x="270.0" dy="16.2">локальна збірка не повторює збірку на сервері CI,</tspan><tspan x="270.0" dy="16.2">а зміна опції вимагає правок у чотирьох різних місцях</tspan></text>
<rect x="640.0" y="76.0" width="320.0" height="100.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">CMakePresets.json</tspan><tspan x="800.0" dy="13.0">configurePresets: [&quot;dev-debug&quot;, &quot;ci-release&quot;]</tspan><tspan x="800.0" dy="13.0">buildPresets: [&quot;dev-debug&quot;, &quot;ci-release&quot;]</tspan><tspan x="800.0" dy="13.0">testPresets: [&quot;dev-debug&quot;, &quot;ci-release&quot;]</tspan></text>
<rect x="630.0" y="230.0" width="340.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">CLI</tspan><tspan x="800.0" dy="16.2">cmake --preset dev-debug</tspan><tspan x="800.0" dy="16.2">cmake --build --preset dev-debug</tspan></text>
<rect x="630.0" y="304.0" width="340.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">CI Runner</tspan><tspan x="800.0" dy="16.2">cmake --workflow --preset ci-release</tspan></text>
<rect x="630.0" y="378.0" width="340.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="403.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">IDE (VS Code, VS, CLion)</tspan><tspan x="800.0" dy="15.0">Вибір пресета зі списку без локальних скриптів</tspan></text>
<line x1="750.0" y1="180.0" x2="700.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="180.0" x2="800.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="850.0" y1="180.0" x2="900.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="456.0" width="470.0" height="48.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="476.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">команда фіксує конфігурації у версійному JSON;</tspan><tspan x="795.0" dy="16.2">усі інструменти читають один і той самий набір параметрів</tspan></text>
</svg>