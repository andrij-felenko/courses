<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція підпроєкту у спільному графі цілей</text>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний граф цілей і три захисні бар'єри підпроєкту</text>
<rect x="50.0" y="75.0" width="360.0" height="250.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Головний проєкт: my_service</tspan><tspan x="230.0" dy="16.9"></tspan><tspan x="230.0" dy="16.9">add_executable(my_service main.cpp)</tspan><tspan x="230.0" dy="16.9">target_link_libraries(my_service</tspan><tspan x="230.0" dy="16.9">    PRIVATE fmt::fmt</tspan><tspan x="230.0" dy="16.9">)</tspan><tspan x="230.0" dy="16.9"></tspan><tspan x="230.0" dy="16.9">Прапорці: -Wall -Wextra -Werror</tspan><tspan x="230.0" dy="16.9">Стандарт: C++20</tspan></text>
<line x1="420.0" y1="200.0" x2="490.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="455.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лінкує</text>
<rect x="500.0" y="75.0" width="550.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="162.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Підпроєкт у _deps/fmt-src (чужий CMakeLists.txt)</tspan><tspan x="775.0" dy="16.9"></tspan><tspan x="775.0" dy="16.9">• Бібліотечна ціль: add_library(fmt ...) + ALIAS fmt::fmt</tspan><tspan x="775.0" dy="16.9">• Зайві цілі: fmt_test, fmt_benchmark, fmt_docs</tspan><tspan x="775.0" dy="16.9">• Опції: option(FMT_TEST &quot;Build tests&quot; ON)</tspan><tspan x="775.0" dy="16.9">• Заголовки з незвичним для проєкту стилем коду</tspan></text>
<rect x="50.0" y="360.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. ALIAS fmt::fmt</tspan><tspan x="200.0" dy="15.6"></tspan><tspan x="200.0" dy="15.6">Захищає від колізій імен і перевіряє</tspan><tspan x="200.0" dy="15.6">друкарські помилки на етапі конфігурації</tspan></text>
<rect x="400.0" y="360.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="395.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">2. EXCLUDE_FROM_ALL</tspan><tspan x="550.0" dy="15.6"></tspan><tspan x="550.0" dy="15.6">Виключає fmt_test і бенчмарки із цілі all</tspan><tspan x="550.0" dy="15.6">(збирається лише потрібна бібліотека)</tspan></text>
<rect x="750.0" y="360.0" width="300.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">3. SYSTEM include</tspan><tspan x="900.0" dy="14.3"></tspan><tspan x="900.0" dy="14.3">Позначає заголовки чужого коду як системні</tspan><tspan x="900.0" dy="14.3">й придушує попередження компілятора</tspan></text>
<rect x="50.0" y="490.0" width="1000.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="519.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Підпроєкт ділить із додатком єдиний граф збірки, але захисні механізми ізолюють опції та прапорці.</tspan></text>
</svg>