<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема взаємодії FetchContent із find_package</text>
<text x="530.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уніфікація системних пакетів і FetchContent (CMake 3.24+)</text>
<rect x="60.0" y="86.0" width="940.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">FetchContent_Declare(fmt ... FIND_PACKAGE_ARGS 10.0 CONFIG)</tspan><tspan x="530.0" dy="17.6">FetchContent_MakeAvailable(fmt)</tspan></text>
<line x1="530.0" y1="162.0" x2="530.0" y2="204.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">FETCHCONTENT_TRY_FIND_PACKAGE_MODE</text>
<rect x="60.0" y="216.0" width="440.0" height="160.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="259.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Гілка А: Пакет знайдено в системі</tspan><tspan x="280.0" dy="16.2">(vcpkg, Conan або системний пакунок)</tspan><tspan x="280.0" dy="16.2"></tspan><tspan x="280.0" dy="16.2">• Викликається find_package(fmt 10.0 CONFIG)</tspan><tspan x="280.0" dy="16.2">• Створюється імпортована ціль fmt::fmt</tspan><tspan x="280.0" dy="16.2">• Нуль завантажень з мережі, миттєва збірка</tspan></text>
<rect x="560.0" y="216.0" width="440.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="259.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Гілка Б: Пакет відсутній у системі</tspan><tspan x="780.0" dy="16.2">(автономне завантаження з джерел)</tspan><tspan x="780.0" dy="16.2"></tspan><tspan x="780.0" dy="16.2">• Скачується архів за URL_HASH або Git</tspan><tspan x="780.0" dy="16.2">• Викликається add_subdirectory()</tspan><tspan x="780.0" dy="16.2">• Створюється рідна ціль fmt::fmt</tspan></text>
<line x1="280.0" y1="382.0" x2="450.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="382.0" x2="610.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="412.0" width="500.0" height="52.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="434.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Код проєкту завжди лінкує fmt::fmt однаково:</tspan><tspan x="530.0" dy="16.9">target_link_libraries(my_app PRIVATE fmt::fmt)</tspan></text>
</svg>