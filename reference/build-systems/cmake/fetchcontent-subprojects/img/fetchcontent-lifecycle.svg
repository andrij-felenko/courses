<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири кроки життєвого циклу FetchContent</text>
<text x="560.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність обробки залежності у FetchContent</text>
<rect x="40.0" y="92.0" width="230.0" height="340.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="221.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. Декларація</tspan><tspan x="155.0" dy="15.0"></tspan><tspan x="155.0" dy="15.0">FetchContent_Declare(fmt ...)</tspan><tspan x="155.0" dy="15.0"></tspan><tspan x="155.0" dy="15.0">Реєструє джерело (Git/URL/шлях)</tspan><tspan x="155.0" dy="15.0">у внутрішньому реєстрі.</tspan><tspan x="155.0" dy="15.0">Ніяких завантажень чи мережі.</tspan></text>
<line x1="276.0" y1="260.0" x2="304.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="92.0" width="230.0" height="340.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="425.0" y="224.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">2. Активація</tspan><tspan x="425.0" dy="13.7"></tspan><tspan x="425.0" dy="13.7">FetchContent_MakeAvailable(fmt)</tspan><tspan x="425.0" dy="13.7"></tspan><tspan x="425.0" dy="13.7">Перевіряє, чи не створено вже fmt.</tspan><tspan x="425.0" dy="13.7">Якщо ні — запускає підготовку</tspan><tspan x="425.0" dy="13.7">джерел у каталозі _deps/.</tspan></text>
<line x1="546.0" y1="260.0" x2="574.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="92.0" width="230.0" height="340.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="695.0" y="221.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">3. Subbuild</tspan><tspan x="695.0" dy="15.0"></tspan><tspan x="695.0" dy="15.0">cmake --build _deps/fmt-subbuild</tspan><tspan x="695.0" dy="15.0"></tspan><tspan x="695.0" dy="15.0">Генерує тимчасовий мініпроєкт,</tspan><tspan x="695.0" dy="15.0">який скачує й розпаковує джерела</tspan><tspan x="695.0" dy="15.0">у _deps/fmt-src.</tspan></text>
<line x1="816.0" y1="260.0" x2="844.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850.0" y="92.0" width="230.0" height="340.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="965.0" y="221.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="965.0" dy="0.0">4. Вбудовування</tspan><tspan x="965.0" dy="15.0"></tspan><tspan x="965.0" dy="15.0">add_subdirectory(_deps/fmt-src)</tspan><tspan x="965.0" dy="15.0"></tspan><tspan x="965.0" dy="15.0">Виконує чужий CMakeLists.txt,</tspan><tspan x="965.0" dy="15.0">додає цілі (fmt::fmt) у спільну</tspan><tspan x="965.0" dy="15.0">модель поточного проєкту.</tspan></text>
<rect x="40.0" y="456.0" width="1040.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Декларація відокремлена від виконання: кореневий проєкт визначає параметри джерел,</tspan><tspan x="560.0" dy="17.6">а MakeAvailable матеріалізує їх і передає керування в add_subdirectory().</tspan></text>
</svg>