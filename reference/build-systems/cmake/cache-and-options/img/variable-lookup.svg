<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук змінної та затінення кешу</text>
<text x="140.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Обчислення ${VAR} шукає значення згори вниз:</text>
<rect x="140.0" y="86.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="112.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">1. Область функції або блоку block()</tspan><tspan x="320.0" dy="16.9">(стек викликів зсередини назовні)</tspan></text>
<rect x="140.0" y="192.0" width="360.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">2. Область поточного каталогу</tspan><tspan x="320.0" dy="16.9">(локальні змінні CMakeLists.txt)</tspan></text>
<rect x="140.0" y="292.0" width="360.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">3. Кеш проєкту</tspan><tspan x="320.0" dy="16.9">(глобальний CMakeCache.txt)</tspan></text>
<line x1="320.0" y1="146.0" x2="320.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="246.0" x2="320.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="516.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">якщо не знайдено</text>
<text x="516.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">якщо не знайдено</text>
<rect x="560.0" y="86.0" width="360.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">$CACHE{VAR}</tspan></text>
<line x1="560.0" y1="111.0" x2="504.0" y2="319.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Прямий доступ до кешу в обхід локальних змінних</text>
<rect x="560.0" y="192.0" width="360.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="740.0" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">$ENV{VAR}</tspan></text>
<rect x="560.0" y="292.0" width="360.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Змінні середовища процесу (OS Environment)</tspan><tspan x="740.0" dy="15.6">Окремий простір імен, не пов'язаний із ${VAR}</tspan></text>
<line x1="740.0" y1="242.0" x2="740.0" y2="292.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="420.0" width="900.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ЕФЕКТ ЗАТІНЕННЯ (SHADOWING):</tspan><tspan x="500.0" dy="16.9">Якщо у поточному CMakeLists.txt виконано set(VAR &quot;local&quot;), то звичайна змінна</tspan><tspan x="500.0" dy="16.9">перекриває кешовану VAR, і виклик ${VAR} повертає &quot;local&quot;, ігноруючи значення з кешу.</tspan></text>
</svg>