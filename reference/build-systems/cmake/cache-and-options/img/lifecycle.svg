<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл кешу CMake</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Два шляхи виконання CMake: перший запуск проти повторного</text>
<rect x="50.0" y="70.0" width="440.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ПЕРШИЙ ПРОГІН (порожній каталог збірки)</tspan></text>
<rect x="50.0" y="130.0" width="440.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1. Парсинг CLI: прапорці -D записуються в пам'ять</tspan></text>
<rect x="50.0" y="196.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">2. project() / toolchain: перевірки компілятора,</tspan><tspan x="270.0" dy="16.2">важкі проби try_compile записуються в кеш</tspan></text>
<rect x="50.0" y="268.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">3. set(VAR default CACHE): створює новий запис,</tspan><tspan x="270.0" dy="16.2">якщо прапорця -D не було в CLI</tspan></text>
<rect x="50.0" y="340.0" width="440.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">4. Генерація: створення build.ninja / Makefile</tspan></text>
<rect x="50.0" y="406.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="428.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">5. Серіалізація: збереження всіх змінних кешу</tspan><tspan x="270.0" dy="16.2">у файл build/CMakeCache.txt на диску</tspan></text>
<line x1="270.0" y1="176.0" x2="270.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="248.0" x2="270.0" y2="268.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="320.0" x2="270.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="386.0" x2="270.0" y2="406.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="70.0" width="440.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">ПОВТОРНИЙ ПРОГІН (build/CMakeCache.txt існує)</tspan></text>
<rect x="550.0" y="130.0" width="440.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">1. Зчитування build/CMakeCache.txt у пам'ять</tspan></text>
<rect x="550.0" y="196.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">2. project(): тести компілятора пропускаються,</tspan><tspan x="770.0" dy="16.2">значення беруться готовими з кешу</tspan></text>
<rect x="550.0" y="268.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">3. set(VAR default CACHE): ІГНОРУЄТЬСЯ,</tspan><tspan x="770.0" dy="16.2">бо змінна вже присутня в кеші пам'яті</tspan></text>
<rect x="550.0" y="340.0" width="440.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">4. Генерація: створення оновлених правил збірки</tspan></text>
<rect x="550.0" y="406.0" width="440.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="428.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">5. Оновлення build/CMakeCache.txt (збереження</tspan><tspan x="770.0" dy="16.2">нових та модифікованих значень)</tspan></text>
<line x1="770.0" y1="176.0" x2="770.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="248.0" x2="770.0" y2="268.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="320.0" x2="770.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="386.0" x2="770.0" y2="406.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="480.0" width="940.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головний наслідок: зміна дефолтного значення у файлі CMakeLists.txt</tspan><tspan x="520.0" dy="17.6">не змінює значення у вже наявному кеші — потрібен явний -D або очищення (--fresh)</tspan></text>
</svg>