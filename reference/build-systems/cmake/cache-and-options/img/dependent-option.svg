<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка роботи cmake_dependent_option</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Логіка роботи cmake_dependent_option(OPT doc default &quot;COND1;COND2&quot; force)</text>
<rect x="320.0" y="80.0" width="360.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Обчислення умови COND:</tspan><tspan x="500.0" dy="18.2">if(COND1 AND COND2)</tspan></text>
<line x1="400.0" y1="136.0" x2="260.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="136.0" x2="740.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Умова ІСТИННА</text>
<text x="710.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Умова ХИБНА</text>
<rect x="60.0" y="200.0" width="400.0" height="160.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="242.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">АКТИВНА ОПЦІЯ КЕШУ:</tspan><tspan x="260.0" dy="16.9"></tspan><tspan x="260.0" dy="16.9">• Змінна реєструється як кешована BOOL</tspan><tspan x="260.0" dy="16.9">• Доступна для зміни в ccmake / cmake-gui</tspan><tspan x="260.0" dy="16.9">• Зчитує значення за замовчуванням default</tspan><tspan x="260.0" dy="16.9">• Користувач може передати -DOPT=ON/OFF</tspan></text>
<rect x="540.0" y="200.0" width="400.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="242.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">ПРИМУСОВЕ ЗНАЧЕННЯ:</tspan><tspan x="740.0" dy="16.9"></tspan><tspan x="740.0" dy="16.9">• Змінній призначається force (зазвичай OFF)</tspan><tspan x="740.0" dy="16.9">• Опція ховається з інтерактивних GUI</tspan><tspan x="740.0" dy="16.9">• Попередньо збережене значення в кеші</tspan><tspan x="740.0" dy="16.9">  не впливає на поточну збірку</tspan></text>
<rect x="60.0" y="400.0" width="880.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Призначення: захист графа конфігурації від взаємовиключних або нечинних комбінацій.</tspan><tspan x="500.0" dy="17.6">Користувач не може ввімкнути фічу, якщо в системі відсутні її обов'язкові залежності.</tspan></text>
</svg>