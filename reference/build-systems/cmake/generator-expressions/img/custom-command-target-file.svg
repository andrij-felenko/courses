<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Використання цільового артефакту в кастомній команді</text>
<rect x="50.0" y="60.0" width="270.0" height="250.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="185.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1. Ціль-інструмент</text>
<rect x="70.0" y="110.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">add_executable(schema_gen</tspan><tspan x="185.0" dy="16.9">  generator.cpp)</tspan></text>
<rect x="70.0" y="185.0" width="230.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Артефакт збірки:</tspan><tspan x="185.0" dy="15.6">• Linux: build/schema_gen</tspan><tspan x="185.0" dy="15.6">• Windows: build/Debug/</tspan><tspan x="185.0" dy="15.6">  schema_gen.exe</tspan></text>
<line x1="320.0" y1="185.0" x2="380.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">$&lt;TARGET_FILE&gt;</text>
<rect x="390.0" y="60.0" width="360.0" height="250.0" rx="8" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="570.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2. Кастомна команда</text>
<rect x="410.0" y="110.0" width="320.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">add_custom_command(</tspan><tspan x="570.0" dy="15.6">  OUTPUT schema.cpp schema.h</tspan><tspan x="570.0" dy="15.6">  COMMAND $&lt;TARGET_FILE:schema_gen&gt;</tspan><tspan x="570.0" dy="15.6">    --in ${IN} --out ${OUT})</tspan></text>
<rect x="410.0" y="200.0" width="320.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="228.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Подвійна дія CMake:</tspan><tspan x="570.0" dy="15.6">1) Підставляє точний шлях до .exe</tspan><tspan x="570.0" dy="15.6">2) Автоматично додає schema_gen</tspan><tspan x="570.0" dy="15.6">   як залежність у графі робіт</tspan></text>
<line x1="750.0" y1="185.0" x2="810.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="780.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">OUTPUT</text>
<rect x="820.0" y="60.0" width="190.0" height="250.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="915.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Програма</text>
<rect x="835.0" y="110.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="915.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">add_executable(app</tspan><tspan x="915.0" dy="16.2">  main.cpp</tspan><tspan x="915.0" dy="16.2">  schema.cpp)</tspan></text>
<rect x="835.0" y="205.0" width="160.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="915.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">Чекає завершення</tspan><tspan x="915.0" dy="15.6">генерації</tspan><tspan x="915.0" dy="15.6">schema.cpp</tspan></text>
<rect x="50.0" y="335.0" width="960.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="357.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Чому не можна писати COMMAND ./schema_gen:</tspan><tspan x="530.0" dy="16.9">• На Windows потрібне розширення .exe, а в багатоконфігураційних генераторах шлях веде в Debug/ чи Release/;</tspan><tspan x="530.0" dy="16.9">• $&lt;TARGET_FILE:schema_gen&gt; розв'язує обидві проблеми й гарантує правильний порядок збірки в DAG.</tspan></text>
<rect x="50.0" y="420.0" width="960.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Граф залежностей: schema_gen (компіляція/лінкування)  →  виконання генератора  →  app (збірка зі згенерованим файлом)</tspan></text>
</svg>