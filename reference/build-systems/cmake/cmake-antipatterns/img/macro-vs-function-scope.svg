<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння областей видимості macro() та function()</text>
<text x="270.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">macro(): Текстова підстановка без скоупу</text>
<text x="810.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">function(): Ізольований фрейм стеку</text>
<rect x="50.0" y="75.0" width="440.0" height="360.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик macro(add_plugin name)</text>
<rect x="145.1" y="141.6" width="249.7" height="66.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Тіло макросу:</tspan><tspan x="270.0" dy="16.9">set(TEMP_VAR &quot;plugin_${name}&quot;)</tspan><tspan x="270.0" dy="16.9">if(${name} STREQUAL &quot;auth&quot;) ...</tspan></text>
<line x1="270.0" y1="230.0" x2="270.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Прямий запис у пам'ять викликача</text>
<rect x="92.4" y="305.6" width="355.2" height="78.8" rx="6" fill="#fff0ef" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Контекст викликача (батьківський скоуп):</tspan><tspan x="270.0" dy="15.6">• TEMP_VAR викликача БЕЗПОВОРОТНО ПЕРЕЗАПИСАНО!</tspan><tspan x="270.0" dy="15.6">• ${name} підставляється рядком до виконання if()</tspan><tspan x="270.0" dy="15.6">• Складно налагоджувати неявні побічні ефекти</tspan></text>
<rect x="590.0" y="75.0" width="440.0" height="360.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="810.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик function(add_plugin name)</text>
<rect x="666.6" y="141.6" width="286.8" height="66.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Тіло функції (локальний скоуп):</tspan><tspan x="810.0" dy="16.9">set(TEMP_VAR &quot;plugin_${name}&quot;)</tspan><tspan x="810.0" dy="16.9">set(OUT_RESULT &quot;ready&quot; PARENT_SCOPE)</tspan></text>
<line x1="810.0" y1="230.0" x2="810.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Повернення лише через PARENT_SCOPE</text>
<rect x="639.3" y="305.6" width="341.5" height="78.8" rx="6" fill="#f0faf2" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Контекст викликача (батьківський скоуп):</tspan><tspan x="810.0" dy="15.6">• Локальні змінні функції (TEMP_VAR) ЗНИЩЕНО</tspan><tspan x="810.0" dy="15.6">• Змінні викликача надійно захищені від колізій</tspan><tspan x="810.0" dy="15.6">• OUT_RESULT передано явно й контрольовано</tspan></text>
<rect x="50.0" y="460.0" width="980.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="481.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">macro() розгортається безпосередньо у місці виклику й мутує змінні викликача.</tspan><tspan x="540.0" dy="17.6">function() створює ізольовану область видимості: змінні всередині залишаються локальними,</tspan><tspan x="540.0" dy="17.6">а повернення результатів вимагає явної директиви PARENT_SCOPE.</tspan></text>
</svg>