<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія пакета Config Mode та імпортовані цілі</text>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова встановленого пакета та розгортання графа цілей</text>
<text x="270.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файли у lib/cmake/Foo/ на диску</text>
<rect x="60.0" y="96.0" width="420.0" height="58.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="121.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">FooConfigVersion.cmake</tspan><tspan x="270.0" dy="16.2">перевіряє сумісність запитаної версії з наявною</tspan></text>
<rect x="60.0" y="164.0" width="420.0" height="58.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">FooConfig.cmake</tspan><tspan x="270.0" dy="15.0">головна точка входу: шукає залежності через find_dependency</tspan></text>
<rect x="60.0" y="232.0" width="420.0" height="58.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">FooTargets.cmake</tspan><tspan x="270.0" dy="16.2">створює цілі: add_library(Foo::Core IMPORTED)</tspan></text>
<rect x="60.0" y="300.0" width="420.0" height="58.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">FooTargets-release.cmake</tspan><tspan x="270.0" dy="16.2">прописує IMPORTED_LOCATION_RELEASE = lib/libfoo.so</tspan></text>
<line x1="490.0" y1="230.0" x2="550.0" y2="230.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="520.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">завантаження</text>
<text x="780.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель імпортованих цілей у пам'яті</text>
<rect x="599.0" y="111.2" width="362.0" height="97.5" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="131.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Ціль  Foo::Core  (IMPORTED)</tspan><tspan x="780.0" dy="16.2">INTERFACE_INCLUDE_DIRECTORIES = &lt;prefix&gt;/include</tspan><tspan x="780.0" dy="16.2">IMPORTED_LOCATION = &lt;prefix&gt;/lib/libfoo_core.so</tspan><tspan x="780.0" dy="16.2">INTERFACE_COMPILE_DEFINITIONS = FOO_FAST_IO=1</tspan><tspan x="780.0" dy="16.2">INTERFACE_LINK_LIBRARIES = OpenSSL::Crypto</tspan></text>
<line x1="780.0" y1="236.0" x2="780.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="805.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тягне транзитивно</text>
<rect x="613.2" y="297.5" width="333.5" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Ціль  OpenSSL::Crypto  (IMPORTED)</tspan><tspan x="780.0" dy="16.2">INTERFACE_INCLUDE_DIRECTORIES = /usr/include</tspan><tspan x="780.0" dy="16.2">IMPORTED_LOCATION = /usr/lib/libcrypto.so</tspan></text>
<rect x="60.0" y="420.0" width="920.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="444.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Споживач пише лише target_link_libraries(app PRIVATE Foo::Core) — усі шляхи заголовків,</tspan><tspan x="520.0" dy="16.9">прапорці компіляції та транзитивні бібліотеки (OpenSSL) підтягуються автоматично.</tspan></text>
</svg>