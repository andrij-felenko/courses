<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл вимог вжитку між власною збіркою та інтерфейсом споживача</text>
<text x="540.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл властивостей цілі за ключовими словами</text>
<text x="540.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Куди команди target_* записують параметри збірки</text>
<rect x="50.0" y="95.0" width="300.0" height="370.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">PRIVATE</tspan><tspan x="200.0" dy="13.7"></tspan><tspan x="200.0" dy="13.7">Запис потрапляє лише у власні властивості цілі:</tspan><tspan x="200.0" dy="13.7">• INCLUDE_DIRECTORIES</tspan><tspan x="200.0" dy="13.7">• COMPILE_DEFINITIONS</tspan><tspan x="200.0" dy="13.7">• COMPILE_OPTIONS</tspan><tspan x="200.0" dy="13.7">• LINK_LIBRARIES</tspan><tspan x="200.0" dy="13.7"></tspan><tspan x="200.0" dy="13.7">Призначення:</tspan><tspan x="200.0" dy="13.7">Внутрішні заголовки (src/),</tspan><tspan x="200.0" dy="13.7">макроси реалізації,</tspan><tspan x="200.0" dy="13.7">прапорці компілятора,</tspan><tspan x="200.0" dy="13.7">закриті допоміжні бібліотеки.</tspan><tspan x="200.0" dy="13.7"></tspan><tspan x="200.0" dy="13.7">Споживачам НЕ передається.</tspan></text>
<rect x="390.0" y="95.0" width="300.0" height="370.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="194.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">PUBLIC</tspan><tspan x="540.0" dy="15.0"></tspan><tspan x="540.0" dy="15.0">Запис одночасно потрапляє в обидва списки:</tspan><tspan x="540.0" dy="15.0">• Власні (для своєї збірки)</tspan><tspan x="540.0" dy="15.0">• INTERFACE_* (для споживачів)</tspan><tspan x="540.0" dy="15.0"></tspan><tspan x="540.0" dy="15.0">Призначення:</tspan><tspan x="540.0" dy="15.0">Публічні заголовки (include/),</tspan><tspan x="540.0" dy="15.0">макровизначення конфігурації API,</tspan><tspan x="540.0" dy="15.0">бібліотеки, чиї типи є частиною</tspan><tspan x="540.0" dy="15.0">відкритого інтерфейсу.</tspan><tspan x="540.0" dy="15.0"></tspan><tspan x="540.0" dy="15.0">Потрібно і автору, і споживачу.</tspan></text>
<rect x="730.0" y="95.0" width="300.0" height="370.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="186.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">INTERFACE</tspan><tspan x="880.0" dy="15.0"></tspan><tspan x="880.0" dy="15.0">Запис потрапляє лише у властивості вжитку:</tspan><tspan x="880.0" dy="15.0">• INTERFACE_INCLUDE_DIRECTORIES</tspan><tspan x="880.0" dy="15.0">• INTERFACE_COMPILE_DEFINITIONS</tspan><tspan x="880.0" dy="15.0">• INTERFACE_COMPILE_FEATURES</tspan><tspan x="880.0" dy="15.0">• INTERFACE_LINK_LIBRARIES</tspan><tspan x="880.0" dy="15.0"></tspan><tspan x="880.0" dy="15.0">Призначення:</tspan><tspan x="880.0" dy="15.0">Header-only бібліотеки,</tspan><tspan x="880.0" dy="15.0">суто інтерфейсні прапорці мови,</tspan><tspan x="880.0" dy="15.0">пакети налаштувань компілятора.</tspan><tspan x="880.0" dy="15.0"></tspan><tspan x="880.0" dy="15.0">Сама ціль нічого не збирає.</tspan></text>
<rect x="50.0" y="485.0" width="980.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="513.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Ключове слово обирає цільову торбу властивостей: PRIVATE будує лише саму ціль;</tspan><tspan x="540.0" dy="16.9">INTERFACE наповнює інтерфейс для клієнтів; PUBLIC записує властивість в обидва списки.</tspan></text>
</svg>