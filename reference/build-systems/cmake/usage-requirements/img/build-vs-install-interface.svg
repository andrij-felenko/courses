<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення шляхів включення для етапів збірки та встановлення</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення шляхів: розробка в репозиторії проти встановленого пакета</text>
<text x="520.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Як генераторні вирази запобігають зашиванню локальних шляхів розробника в експорт</text>
<rect x="160.0" y="95.0" width="720.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">target_include_directories(mylib PUBLIC</tspan><tspan x="520.0" dy="16.9">  $&lt;BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include&gt;</tspan><tspan x="520.0" dy="16.9">  $&lt;INSTALL_INTERFACE:include&gt;</tspan><tspan x="520.0" dy="16.9">)</tspan></text>
<rect x="60.0" y="215.0" width="430.0" height="175.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Контекст 1: Збірка всередині проєкту (BUILD)</tspan><tspan x="275.0" dy="15.6"></tspan><tspan x="275.0" dy="15.6">Працює вираз: $&lt;BUILD_INTERFACE:...&gt;</tspan><tspan x="275.0" dy="15.6">Шлях до заголовків:</tspan><tspan x="275.0" dy="15.6">/home/user/project/src/mylib/include</tspan><tspan x="275.0" dy="15.6"></tspan><tspan x="275.0" dy="15.6">Тести та приклади проєкту бачать вихідний код</tspan></text>
<rect x="550.0" y="215.0" width="430.0" height="175.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="765.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Контекст 2: Встановлений пакет (INSTALL)</tspan><tspan x="765.0" dy="15.6"></tspan><tspan x="765.0" dy="15.6">Працює вираз: $&lt;INSTALL_INTERFACE:...&gt;</tspan><tspan x="765.0" dy="15.6">Шлях до заголовків:</tspan><tspan x="765.0" dy="15.6">&lt;prefix&gt;/include (наприклад /usr/local/include)</tspan><tspan x="765.0" dy="15.6"></tspan><tspan x="765.0" dy="15.6">Зовнішні споживачі знаходять заголовки в системі</tspan></text>
<line x1="380.0" y1="180.0" x2="275.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="180.0" x2="765.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="430.0" width="920.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Без розділення команда install(EXPORT) видасть фатальну помилку, захищаючи від поширення</tspan><tspan x="520.0" dy="16.9">жорстко закодованих шляхів машини розробника в поширюваний дистрибутив.</tspan></text>
</svg>