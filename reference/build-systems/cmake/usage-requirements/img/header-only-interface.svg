<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура та поширення вимог інтерфейсної бібліотеки</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерфейсна ціль (INTERFACE Library) у CMake</text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ціль без об'єктних файлів, що існує виключно як пакет вимог вжитку</text>
<rect x="350.0" y="100.0" width="300.0" height="135.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">add_library(json_parser INTERFACE)</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">INTERFACE_INCLUDE = include/</tspan><tspan x="500.0" dy="14.3">INTERFACE_FEATURES = cxx_std_20</tspan><tspan x="500.0" dy="14.3">(Джерел .cpp немає, бінарник не створюється)</tspan></text>
<rect x="90.0" y="290.0" width="360.0" height="120.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">add_executable(web_service ...)</tspan><tspan x="270.0" dy="15.6">target_link_libraries(web_service</tspan><tspan x="270.0" dy="15.6">  PRIVATE json_parser)</tspan><tspan x="270.0" dy="15.6"></tspan><tspan x="270.0" dy="15.6">Компілятор дістає: -Iinclude/ -std=c++20</tspan></text>
<rect x="550.0" y="290.0" width="360.0" height="120.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">add_library(client_sdk SHARED ...)</tspan><tspan x="730.0" dy="15.6">target_link_libraries(client_sdk</tspan><tspan x="730.0" dy="15.6">  PUBLIC json_parser)</tspan><tspan x="730.0" dy="15.6"></tspan><tspan x="730.0" dy="15.6">Компілятор дістає: -Iinclude/ -std=c++20</tspan><tspan x="730.0" dy="15.6">Експортує вимоги своїм споживачам</tspan></text>
<line x1="420.0" y1="235.0" x2="270.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="235.0" x2="730.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="435.0" width="880.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="462.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Інтерфейсна ціль надає спільні заголовки та прапорці мови без зайвого кроку лінкування бінарного файлу.</tspan></text>
</svg>