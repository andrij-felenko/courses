<line x1="660.0" y1="350.0" x2="740.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">лінкує</text>
<rect x="60.0" y="480.0" width="940.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="510.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">PRIVATE ізолює залежність: деталі реалізації math_core не протікають у споживача engine.</tspan><tspan x="530.0" dy="16.9">PUBLIC просуває вимоги вжитку далі по графу, роблячи типи math_core доступними в app.</tspan></text>
