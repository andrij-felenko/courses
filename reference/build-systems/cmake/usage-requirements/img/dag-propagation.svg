<rect x="740.0" y="100.0" width="260.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">app</tspan><tspan x="870.0" dy="15.6">(виконуваний файл)</tspan><tspan x="870.0" dy="15.6">Отримує: engine/</tspan><tspan x="870.0" dy="15.6">НЕ отримує: math/, USE_SIMD</tspan></text>
<line x1="320.0" y1="165.0" x2="400.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
