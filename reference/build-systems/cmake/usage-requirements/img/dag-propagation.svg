<text x="530.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">▼ Порівняння: що відбувається при PUBLIC-лінкуванні ▼</text>
