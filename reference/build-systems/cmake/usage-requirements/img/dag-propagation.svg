<rect x="400.0" y="285.0" width="260.0" height="130.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">engine</tspan><tspan x="530.0" dy="15.6">(лінкує math_core PUBLIC)</tspan><tspan x="530.0" dy="15.6">Має: math/, USE_SIMD</tspan><tspan x="530.0" dy="15.6">Експортує: engine/ + math/</tspan></text>
