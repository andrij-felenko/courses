<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поширення вимог вжитку через ланцюжки залежностей у графі</text>
<text x="530.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзитивність вимог вжитку в ланцюжку цілей</text>
<text x="530.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Поширення шляхів включення й макросів від джерела до фінальної програми</text>
<rect x="60.0" y="100.0" width="260.0" height="130.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">math_core</tspan><tspan x="190.0" dy="15.6">(бібліотека)</tspan><tspan x="190.0" dy="15.6">INTERFACE_INCLUDE = math/</tspan><tspan x="190.0" dy="15.6">INTERFACE_DEFS = USE_SIMD</tspan></text>
