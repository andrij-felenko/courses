<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 738" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="738" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мова CMakeLists: сім добудов замість одного проєкту</text>
<text x="530.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">кожен рядок — окрема добудова вже випущеної мови</text>
<line x1="250.0" y1="78.0" x2="250.0" y2="718.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="224.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">31 серпня 2000</text>
<circle cx="250.0" cy="108.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="76.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">оголошення в списку розсилки ITK: вхідний файл — набір ключових слів</tspan><tspan x="656.0" dy="16.9">SOURCE_FILES, LIBRARY, SUBDIRS. Ні змінних, ні умов, ні власних команд</tspan></text>
<text x="224.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2 січня 2001</text>
<circle cx="250.0" cy="204.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="172.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="200.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">cmIfCommand: умова стає ЗВИЧАЙНОЮ командою, а не синтаксисом —</tspan><tspan x="656.0" dy="16.9">її аргументи приходять уже готовими рядками</tspan></text>
<text x="224.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">13 серпня 2002</text>
<circle cx="250.0" cy="300.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="268.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">cmMacroCommand: макрос — підстановка тексту у вже наявний розбір,</tspan><tspan x="656.0" dy="16.9">без власної області значень</tspan></text>
<text x="224.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">грудень 2007 → 2.6</text>
<circle cx="250.0" cy="396.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="364.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">function() і PARENT_SCOPE: власна область з'являється</tspan><tspan x="656.0" dy="16.9">на сім років пізніше за макроси</tspan></text>
<text x="224.0" y="497.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2.6, травень 2008</text>
<circle cx="250.0" cy="492.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="460.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="488.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">політики CMP: кожна зміна поведінки дістає номер,</tspan><tspan x="656.0" dy="16.9">старе й нове співіснують у тому самому виконуваному файлі</tspan></text>
<text x="224.0" y="593.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">3.1, 2014</text>
<circle cx="250.0" cy="588.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="556.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="584.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">CMP0054: аргумент у лапках більше не розіменовується вдруге —</tspan><tspan x="656.0" dy="16.9">стару поведінку прибрати не можна, лише перемкнути</tspan></text>
<text x="224.0" y="689.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">4.0, 2025</text>
<circle cx="250.0" cy="684.0" r="7.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<rect x="276.0" y="652.0" width="760.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="656.0" y="680.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">сумісність із версіями нижче 3.5 прибрано: cmake_minimum_required(VERSION 3.4)</tspan><tspan x="656.0" dy="16.9">тепер помилка збірки, а не попередження</tspan></text>
</svg>