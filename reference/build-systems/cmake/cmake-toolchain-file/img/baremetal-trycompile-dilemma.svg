<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка компілятора під час project() для платформ без ОС (Bare-Metal)</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка компілятора під час project() для платформ без ОС (Bare-Metal)</text>
<rect x="96.1" y="47.5" width="347.8" height="65.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="68.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Стандартна перевірка CMake</tspan><tspan x="270.0" dy="16.2">try_compile() збирає тестовий виконуваний файл</tspan><tspan x="270.0" dy="16.2">arm-none-eabi-gcc test.c -o test.elf</tspan></text>
<line x1="270.0" y1="130.0" x2="270.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="92.4" y="190.0" width="355.2" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Збій на стадії лінкування (Linker Error)</tspan><tspan x="270.0" dy="15.6">• Немає системної бібліотеки (libc/libgloss)</tspan><tspan x="270.0" dy="15.6">• Відсутні системні виклики: _exit, _sbrk, _write</tspan><tspan x="270.0" dy="15.6">• Не задано карту пам'яті (-T linker_script.ld)</tspan><tspan x="270.0" dy="15.6">Помилка: 'The C compiler is not able to</tspan><tspan x="270.0" dy="15.6">compile a simple test program'</tspan></text>
<line x1="270.0" y1="315.0" x2="270.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="146.0" y="387.5" width="248.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Результат: АВАРІЙНА ЗУПИНКА</tspan><tspan x="270.0" dy="16.2">CMake зупиняє генерацію до того,</tspan><tspan x="270.0" dy="16.2">як прочитає решту CMakeLists.txt</tspan></text>
<line x1="520.0" y1="60.0" x2="520.0" y2="480.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="585.4" y="47.5" width="369.1" height="65.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="68.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Рішення у Toolchain File</tspan><tspan x="770.0" dy="16.2">set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)</tspan><tspan x="770.0" dy="16.2">Вказівка CMake тестувати компілятор без лінкера</tspan></text>
<line x1="770.0" y1="130.0" x2="770.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="582.2" y="197.8" width="375.7" height="94.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Перевірка через архіватор (Archiver)</tspan><tspan x="770.0" dy="15.6">1. Компіляція: arm-none-eabi-gcc -c test.c -o test.o</tspan><tspan x="770.0" dy="15.6">2. Архівація: arm-none-eabi-ar cr libtest.a test.o</tspan><tspan x="770.0" dy="15.6">Лінкер НЕ викликається!</tspan><tspan x="770.0" dy="15.6">Тест підтверджує працездатність компілятора</tspan></text>
<line x1="770.0" y1="315.0" x2="770.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="589.0" y="387.5" width="362.0" height="65.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Результат: УСПІШНА КОНФІГУРАЦІЯ</tspan><tspan x="770.0" dy="16.2">CMake фіксує тулчейн, а скрипт лінкера</tspan><tspan x="770.0" dy="16.2">та стартап-код підключаються вже в цілях проєкту</tspan></text>
</svg>