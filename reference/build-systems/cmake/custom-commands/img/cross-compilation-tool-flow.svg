<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодогенерація при крос-компіляції у CMake</text>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Архітектура кодогенерації при крос-компіляції (Host vs Target)</text>
<rect x="40.0" y="65.0" width="460.0" height="210.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">ХОСТ (Host Machine: x86_64 Linux/macOS/Windows)</tspan><tspan x="270.0" dy="15.6"></tspan><tspan x="270.0" dy="15.6">• Хостовий компілятор (Host GCC/Clang/MSVC)</tspan><tspan x="270.0" dy="15.6">• Збирає генератор: add_executable(codegen_tool ...)</tspan><tspan x="270.0" dy="15.6">• Бінарник codegen_tool має архітектуру x86_64</tspan><tspan x="270.0" dy="15.6">• Виконується на хості під час кроку збірки:</tspan><tspan x="270.0" dy="15.6">  COMMAND codegen_tool protocol.def</tspan><tspan x="270.0" dy="15.6">• Результат: згенеровані protocol.c та protocol.h</tspan></text>
<rect x="540.0" y="65.0" width="460.0" height="210.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ЦІЛЬОВА ПЛАТФОРМА (Target: ARM Cortex-M / AArch64)</tspan><tspan x="770.0" dy="15.6"></tspan><tspan x="770.0" dy="15.6">• Крос-компілятор (arm-none-eabi-gcc / aarch64-gcc)</tspan><tspan x="770.0" dy="15.6">• Читає згенеровані protocol.c + protocol.h</tspan><tspan x="770.0" dy="15.6">• Компілює у двійковий код цільової архітектури</tspan><tspan x="770.0" dy="15.6">• Лінкує з рештою компонентів у firmware.elf / app</tspan><tspan x="770.0" dy="15.6">• Запускається на мікроконтролері або цільовій платі</tspan></text>
<line x1="500.0" y1="170.0" x2="540.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">C/H</text>
<rect x="40.0" y="305.0" width="960.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="350.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ГОЛОВНА ПАСТКА КРОС-КОМПІЛЯЦІЇ:</tspan><tspan x="520.0" dy="15.6">Якщо при CMAKE_CROSSCOMPILING=TRUE зібрати генератор звичайним add_executable(codegen_tool ...),</tspan><tspan x="520.0" dy="15.6">CMake скомпілює його крос-компілятором під ARM. При спробі виконати COMMAND codegen_tool</tspan><tspan x="520.0" dy="15.6">хостова система поверне помилку 'Exec format error' — бінарник ARM не може виконуватися на x86_64!</tspan></text>
<rect x="40.0" y="460.0" width="960.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="478.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Три робочі стратегії вирішення:</tspan><tspan x="520.0" dy="15.6">1. Попередньо зібраний хост-інструмент + find_program() або IMPORTED-ціль</tspan><tspan x="520.0" dy="15.6">2. Двоетапна збірка (Superbuild) через ExternalProject_Add для хостових цілей</tspan><tspan x="520.0" dy="15.6">3. Окрема нативна конфігурація хоста з експортом цілей (export/import)</tspan></text>
</svg>