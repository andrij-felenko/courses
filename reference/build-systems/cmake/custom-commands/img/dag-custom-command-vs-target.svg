<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">add_custom_command проти add_custom_target у графі CMake</text>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Два способи виконання власних дій у графі збірки CMake</text>
<rect x="30.0" y="65.0" width="470.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">add_custom_command(OUTPUT ...)</tspan><tspan x="265.0" dy="15.6">Правило генерації файлу (ліниве, за мітками часу)</tspan></text>
<rect x="30.0" y="125.0" width="470.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">1. Вхідний файл (schema.dsl)</tspan><tspan x="265.0" dy="15.0">Джерело опису даних або протоколу</tspan></text>
<rect x="30.0" y="195.0" width="470.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">2. Перевірка актуальності в графі</tspan><tspan x="265.0" dy="15.0">mtime(schema.dsl) &gt; mtime(msg.cpp) ?</tspan></text>
<rect x="30.0" y="271.0" width="470.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="292.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">3. Виконання генератора (якщо застаріло)</tspan><tspan x="265.0" dy="15.0">generator_tool schema.dsl -&gt; msg.cpp, msg.h</tspan></text>
<rect x="30.0" y="343.0" width="470.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="364.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">4. Властивість GENERATED = 1 на файлі msg.cpp</tspan><tspan x="265.0" dy="15.0">Компілятор викликається для msg.cpp -&gt; msg.o</tspan></text>
<rect x="30.0" y="415.0" width="470.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">5. Фінальний артефакт (app)</tspan><tspan x="265.0" dy="15.0">Лінкування об'єктних файлів у бінарник</tspan></text>
<line x1="265.0" y1="173.0" x2="265.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="249.0" x2="265.0" y2="271.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="321.0" x2="265.0" y2="343.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="393.0" x2="265.0" y2="415.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="65.0" width="470.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">add_custom_target(Name ...)</tspan><tspan x="775.0" dy="15.6">Фіктивна ціль-дія (завжди вважається застарілою)</tspan></text>
<rect x="540.0" y="125.0" width="470.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">1. Іменована ціль (run_linter / run_codegen)</tspan><tspan x="775.0" dy="15.0">Не має прив'язаного дискового артефакту</tspan></text>
<rect x="540.0" y="195.0" width="470.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">2. Запуск на вимогу або через ALL</tspan><tspan x="775.0" dy="15.0">Завжди 'out-of-date' (немає перевірки mtime)</tspan></text>
<rect x="540.0" y="271.0" width="470.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="292.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">3. Виконання командного рядка</tspan><tspan x="775.0" dy="15.0">clippy/clang-tidy або безумовний скрипт</tspan></text>
<rect x="540.0" y="343.0" width="470.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="364.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">4. Не створює гарантованих вихідних вузлів</tspan><tspan x="775.0" dy="15.0">Не може автоматично передати .cpp цілям</tspan></text>
<rect x="540.0" y="415.0" width="470.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">5. Якщо примусово згенерує файл msg.cpp</tspan><tspan x="775.0" dy="15.0">Кожен запуск оновлює mtime -&gt; повна перезбірка!</tspan></text>
<line x1="775.0" y1="173.0" x2="775.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="249.0" x2="775.0" y2="271.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="321.0" x2="775.0" y2="343.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="393.0" x2="775.0" y2="415.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="485.0" width="960.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="515.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головне розмежування: add_custom_command додає правило генерації файлу у граф і спрацьовує</tspan><tspan x="520.0" dy="16.2">лише коли файл потрібен іншій цілі; add_custom_target створює точку входу для запуску дій.</tspan></text>
</svg>