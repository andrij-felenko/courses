<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження mtime при незмінному вмісті у configure_file</text>
<text x="520.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист інкрементальної збірки: збереження мітки часу (Early Cutoff)</text>
<rect x="170.0" y="89.5" width="700.0" height="51.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Повторна конфігурація CMake (зміна CMakeLists.txt або cmake --build .)</tspan><tspan x="520.0" dy="17.6">configure_file() генерує новий вміст у внутрішньому буфері</tspan></text>
<line x1="360.0" y1="160.0" x2="260.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="160.0" x2="780.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="241.6" width="380.0" height="66.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Вміст буфера == config.h на диску</tspan><tspan x="260.0" dy="16.9">Файл НЕ перезаписується</tspan><tspan x="260.0" dy="16.9">Мітка часу (mtime) НЕ змінюється</tspan></text>
<rect x="590.0" y="241.6" width="380.0" height="66.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Вміст буфера != config.h на диску</tspan><tspan x="780.0" dy="16.9">Файл перезаписується на диску</tspan><tspan x="780.0" dy="16.9">Мітка часу (mtime) оновлюється</tspan></text>
<line x1="260.0" y1="335.0" x2="260.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="335.0" x2="780.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="395.1" width="380.0" height="49.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Ninja/Make: mtime(config.h) &lt; mtime(main.o)</tspan><tspan x="260.0" dy="16.9">Компіляція ПРОПУСКАЄТЬСЯ (0.01с)</tspan></text>
<rect x="590.0" y="395.1" width="380.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Ninja/Make: mtime(config.h) &gt; mtime(main.o)</tspan><tspan x="780.0" dy="16.9">Перекомпілюються лише залежні .cpp</tspan></text>
<rect x="60.0" y="480.0" width="920.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Побайтове порівняння перед записом запобігає лавинній перекомпіляції всього проєкту</tspan><tspan x="520.0" dy="17.6">при кожній модифікації CMakeLists.txt або повторному прогоні генератора</tspan></text>
</svg>