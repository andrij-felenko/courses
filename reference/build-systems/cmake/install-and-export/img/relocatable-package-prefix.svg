<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обчислення релокованого префікса у Targets.cmake</text>
<text x="520.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Динамічне обчислення _IMPORT_PREFIX запобігає прив'язці до абсолютних шляхів хост-машини</text>
<rect x="40.0" y="75.0" width="960.0" height="180.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="101.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0"># Фрагмент згенерованого MyLibTargets.cmake:</tspan><tspan x="520.0" dy="15.0">get_filename_component(_IMPORT_PREFIX &quot;${CMAKE_CURRENT_LIST_FILE}&quot; PATH)</tspan><tspan x="520.0" dy="15.0">get_filename_component(_IMPORT_PREFIX &quot;${_IMPORT_PREFIX}&quot; PATH)  # вгору з MyLib/</tspan><tspan x="520.0" dy="15.0">get_filename_component(_IMPORT_PREFIX &quot;${_IMPORT_PREFIX}&quot; PATH)  # вгору з cmake/</tspan><tspan x="520.0" dy="15.0">get_filename_component(_IMPORT_PREFIX &quot;${_IMPORT_PREFIX}&quot; PATH)  # вгору з lib/ -&gt; корінь префікса!</tspan><tspan x="520.0" dy="15.0"></tspan><tspan x="520.0" dy="15.0">set_target_properties(MyLib::mylib PROPERTIES</tspan><tspan x="520.0" dy="15.0">  INTERFACE_INCLUDE_DIRECTORIES &quot;${_IMPORT_PREFIX}/include&quot;</tspan><tspan x="520.0" dy="15.0">  IMPORTED_LOCATION_RELEASE     &quot;${_IMPORT_PREFIX}/lib/libmylib.so&quot;</tspan><tspan x="520.0" dy="15.0">)</tspan></text>
<line x1="270.0" y1="255.0" x2="270.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="255.0" x2="750.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="290.0" width="460.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Розташування А: системний каталог /usr/local</tspan><tspan x="270.0" dy="15.0">• Файл: /usr/local/lib/cmake/MyLib/MyLibTargets.cmake</tspan><tspan x="270.0" dy="15.0">• Обчислений _IMPORT_PREFIX = /usr/local</tspan><tspan x="270.0" dy="15.0">• Заголовки: /usr/local/include</tspan><tspan x="270.0" dy="15.0">• Бібліотека: /usr/local/lib/libmylib.so</tspan></text>
<rect x="540.0" y="290.0" width="460.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Розташування Б: ізольований каталог /opt/custom/mylib-v1.2</tspan><tspan x="770.0" dy="15.0">• Файл: /opt/custom/mylib-v1.2/lib/cmake/MyLib/MyLibTargets.cmake</tspan><tspan x="770.0" dy="15.0">• Обчислений _IMPORT_PREFIX = /opt/custom/mylib-v1.2</tspan><tspan x="770.0" dy="15.0">• Заголовки: /opt/custom/mylib-v1.2/include</tspan><tspan x="770.0" dy="15.0">• Бібліотека: /opt/custom/mylib-v1.2/lib/libmylib.so</tspan></text>
<rect x="40.0" y="430.0" width="960.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="461.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Переміщення каталогу інсталяції не ламає бінарники та заголовки — всі шляхи рахуються відносно Targets.cmake</tspan></text>
</svg>