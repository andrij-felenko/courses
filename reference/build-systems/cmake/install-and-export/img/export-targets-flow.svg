<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр експорту та генерації пакета для find_package</text>
<text x="520.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність реєстрації цілей, створення конфігураційних файлів та лінкування клієнтом</text>
<rect x="40.0" y="75.0" width="280.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">1. add_library(mylib ...)</tspan><tspan x="180.0" dy="15.6">Оголошення цілі в проєкті:</tspan><tspan x="180.0" dy="15.6">• target_include_directories(...)</tspan><tspan x="180.0" dy="15.6">• target_link_libraries(...)</tspan></text>
<line x1="320.0" y1="125.0" x2="370.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="75.0" width="310.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">2. install(TARGETS mylib EXPORT MyLibTargets ...)</tspan><tspan x="525.0" dy="13.0">• Копіює бінарники в lib/ та bin/</tspan><tspan x="525.0" dy="13.0">• Реєструє ціль в експортному наборі</tspan></text>
<line x1="680.0" y1="125.0" x2="730.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="75.0" width="270.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">3. install(EXPORT MyLibTargets ...)</tspan><tspan x="865.0" dy="15.6">Генерує MyLibTargets.cmake:</tspan><tspan x="865.0" dy="15.6">• Створює ціль MyLib::mylib</tspan><tspan x="865.0" dy="15.6">• Записує властивості IMPORTED</tspan></text>
<line x1="865.0" y1="175.0" x2="865.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="215.0" width="310.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">4а. configure_package_config_file(...)</tspan><tspan x="195.0" dy="15.0">Генерує MyLibConfig.cmake:</tspan><tspan x="195.0" dy="15.0">• Макрос @PACKAGE_INIT@</tspan><tspan x="195.0" dy="15.0">• find_dependency(...) залежностей</tspan><tspan x="195.0" dy="15.0">• include(... MyLibTargets.cmake)</tspan></text>
<line x1="350.0" y1="270.0" x2="370.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="215.0" width="310.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="525.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">4б. write_basic_package_version_file(...)</tspan><tspan x="525.0" dy="15.0">Генерує MyLibConfigVersion.cmake:</tspan><tspan x="525.0" dy="15.0">• Перевірка сумісності версій</tspan><tspan x="525.0" dy="15.0">• SameMajorVersion / SameMinorVersion</tspan></text>
<line x1="680.0" y1="270.0" x2="730.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="215.0" width="270.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">4в. install(FILES ...)</tspan><tspan x="865.0" dy="15.0">Копіює Config та Version файли</tspan><tspan x="865.0" dy="15.0">у каталог lib/cmake/MyLib</tspan><tspan x="865.0" dy="15.0">поруч із Targets.cmake</tspan></text>
<line x1="520.0" y1="325.0" x2="520.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="365.0" width="960.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">5. Зовнішній проєкт-споживач у власному CMakeLists.txt</tspan><tspan x="520.0" dy="16.9">find_package(MyLib 1.2 REQUIRED CONFIG)  →  знаходить MyLibConfig.cmake</tspan><tspan x="520.0" dy="16.9">target_link_libraries(client_app PRIVATE MyLib::mylib)</tspan></text>
<rect x="40.0" y="455.0" width="960.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="484.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Результат: клієнтський проєкт отримує готову імпортовану ціль із транзитивними прапорцями та заголовками</tspan></text>
</svg>