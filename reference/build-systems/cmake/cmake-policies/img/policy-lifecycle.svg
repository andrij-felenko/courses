<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл політики CMake</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Життєвий цикл політики зворотньої сумісності (CMPxxxx)</text>
<rect x="40.0" y="75.0" width="215.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="147.5" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.5" dy="0.0">1. ВПРОВАДЖЕННЯ</tspan></text>
<rect x="40.0" y="125.0" width="215.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="147.5" y="205.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">Реліз CMake X.Y</tspan><tspan x="147.5" dy="14.3"></tspan><tspan x="147.5" dy="14.3">• Політика з'являється у ядрі</tspan><tspan x="147.5" dy="14.3">• Стан за замовчуванням: UNSET</tspan><tspan x="147.5" dy="14.3">• Працює стара поведінка (OLD)</tspan><tspan x="147.5" dy="14.3">• Виводиться авторське</tspan><tspan x="147.5" dy="14.3">  попередження (dev warning)</tspan></text>
<line x1="259.0" y1="190.0" x2="281.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="285.0" y="75.0" width="215.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="392.5" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.5" dy="0.0">2. АКТИВНИЙ СТАН</tspan></text>
<rect x="285.0" y="125.0" width="215.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="392.5" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.5" dy="0.0">Проєкт оновлює версію</tspan><tspan x="392.5" dy="15.6"></tspan><tspan x="392.5" dy="15.6">• cmake_minimum_required(X.Y)</tspan><tspan x="392.5" dy="15.6">• Політика стає NEW</tspan><tspan x="392.5" dy="15.6">• Активується нова поведінка</tspan><tspan x="392.5" dy="15.6">• Попередження відсутні</tspan><tspan x="392.5" dy="15.6">• Сучасний стандарт коду</tspan></text>
<line x1="504.0" y1="190.0" x2="526.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="75.0" width="215.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="637.5" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="637.5" dy="0.0">3. ЗАСТАРІВАННЯ</tspan></text>
<rect x="530.0" y="125.0" width="215.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">З плином версій (Deprecation)</tspan><tspan x="637.5" dy="15.6"></tspan><tspan x="637.5" dy="15.6">• Поведінка OLD визнається</tspan><tspan x="637.5" dy="15.6">  застарілою й шкідливою</tspan><tspan x="637.5" dy="15.6">• Явне встановлення OLD</tspan><tspan x="637.5" dy="15.6">  генерує deprecation warning</tspan><tspan x="637.5" dy="15.6">• Заклик оновити синтаксис</tspan></text>
<line x1="749.0" y1="190.0" x2="771.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="775.0" y="75.0" width="215.0" height="40.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="882.5" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.5" dy="0.0">4. ВИЛУЧЕННЯ</tspan></text>
<rect x="775.0" y="125.0" width="215.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="882.5" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="882.5" dy="0.0">Мажорний реліз (CMake 4.0+)</tspan><tspan x="882.5" dy="14.3"></tspan><tspan x="882.5" dy="14.3">• Підтримку OLD вилучено з коду</tspan><tspan x="882.5" dy="14.3">• Запит OLD викликає</tspan><tspan x="882.5" dy="14.3">  фатальну помилку конфігурації</tspan><tspan x="882.5" dy="14.3">• Діє виключно стан NEW</tspan></text>
<rect x="40.0" y="390.0" width="960.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="421.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">КЕРУВАННЯ СТАНОМ ПОЛІТИК У КОДІ:</tspan><tspan x="520.0" dy="16.2"></tspan><tspan x="520.0" dy="16.2">• cmake_minimum_required(VERSION 3.20) → встановлює всі політики до версії 3.20 у стан NEW</tspan><tspan x="520.0" dy="16.2">• cmake_policy(SET CMP0077 NEW) → точкове ввімкнення сучасної поведінки для конкретної політики</tspan><tspan x="520.0" dy="16.2">• cmake_policy(SET CMP0048 OLD) → тимчасове збереження старого режиму для сумісності з легасі-кодом</tspan></text>
</svg>