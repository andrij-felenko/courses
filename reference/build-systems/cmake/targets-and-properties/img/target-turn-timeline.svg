<rect x="280.0" y="130.0" width="240.0" height="120.0" rx="6" fill="#eaf5ec" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">CMake 2.8.11:</tspan><tspan x="400.0" dy="16.9">target_include_directories,</tspan><tspan x="400.0" dy="16.9">target_compile_definitions,</tspan><tspan x="400.0" dy="16.9">PUBLIC / PRIVATE / INTERFACE</tspan></text>
