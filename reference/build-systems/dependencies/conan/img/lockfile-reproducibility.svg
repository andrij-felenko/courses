<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фіксація графа залежностей через conan.lock</text>
<text x="510.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Захист від неконтрольованого дрейфу версій у розподілених командах та CI/CD</text>
<rect x="60.0" y="106.8" width="280.0" height="76.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Декларативні залежності:</tspan><tspan x="200.0" dy="15.0">zlib/[&gt;=1.2.11 &lt;2.0]</tspan><tspan x="200.0" dy="15.0">openssl/[&gt;=3.0 &lt;4.0]</tspan><tspan x="200.0" dy="15.0">fmt/[~10.2]</tspan></text>
<line x1="345.0" y1="145.0" x2="415.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">conan lock create</text>
<rect x="435.0" y="102.5" width="370.0" height="85.1" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Файл замка (conan.lock):</tspan><tspan x="620.0" dy="13.7">• zlib/1.3.1#rrev_a1b2 -&gt; pkg_id_634#prev_1</tspan><tspan x="620.0" dy="13.7">• openssl/3.2.0#rrev_c3d4 -&gt; pkg_id_89f#prev_2</tspan><tspan x="620.0" dy="13.7">• fmt/10.2.1#rrev_e5f6 -&gt; pkg_id_12a#prev_1</tspan><tspan x="620.0" dy="13.7">• Зафіксовані профілі (settings, options)</tspan></text>
<line x1="520.0" y1="215.0" x2="310.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="215.0" x2="760.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="328.1" width="360.0" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Робоча станція розробника:</tspan><tspan x="280.0" dy="14.3">conan install . --lockfile=conan.lock</tspan><tspan x="280.0" dy="14.3">Гарантовано отримує ті самі</tspan><tspan x="280.0" dy="14.3">ревізії та хеші пакетів</tspan></text>
<rect x="580.0" y="328.1" width="360.0" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Сервер збірки (CI/CD Pipeline):</tspan><tspan x="760.0" dy="14.3">conan install . --lockfile=conan.lock</tspan><tspan x="760.0" dy="14.3">Збірка на 100% повторювана,</tspan><tspan x="760.0" dy="14.3">не залежить від нових релізів у ConanCenter</tspan></text>
<rect x="30.0" y="454.2" width="960.0" height="31.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">conan.lock зберігається в системі контролю версій (git) разом із вихідним кодом проєкту</tspan></text>
</svg>