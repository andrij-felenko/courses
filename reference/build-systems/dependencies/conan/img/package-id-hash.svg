<rect x="486.7" y="176.8" width="216.6" height="76.4" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Хешування (SHA-1)</tspan><tspan x="595.0" dy="15.0">Нормалізація ключів та значень</tspan><tspan x="595.0" dy="15.0">Фільтрація за package_id_mode</tspan><tspan x="595.0" dy="15.0">Обчислення 40-символьного хешу</tspan></text>
<line x1="705.0" y1="215.0" x2="755.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="169.3" width="190.0" height="91.3" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="189.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">package_id (Хеш)</tspan><tspan x="865.0" dy="15.0">da39a3ee5e6b4b0d3255...</tspan><tspan x="865.0" dy="15.0"></tspan><tspan x="865.0" dy="15.0">Шлях у кеші пакета:</tspan><tspan x="865.0" dy="15.0">~/.conan2/p/pkg123/p/</tspan></text>
<rect x="45.0" y="417.4" width="910.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Особливий випадок (header-only бібліотеки):</tspan><tspan x="500.0" dy="14.3">У методі package_id() викликається self.info.clear() — хеш стає однаковим для всіх платформ та компіляторів</tspan></text>
</svg>