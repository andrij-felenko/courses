<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обчислення package_id у Conan 2.x</text>
<text x="500.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Детермінований відбиток бінарної сумісності артефакту</text>
<rect x="50.0" y="71.8" width="380.0" height="46.5" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Налаштування (settings)</tspan><tspan x="240.0" dy="15.0">os, arch, compiler, compiler.version, build_type</tspan></text>
<rect x="50.0" y="151.8" width="380.0" height="46.5" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">2. Опції рецепта (options)</tspan><tspan x="240.0" dy="15.0">shared=False, fPIC=True, with_ssl=True</tspan></text>
<rect x="50.0" y="231.8" width="380.0" height="46.5" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">3. Хеші залежностей (requires)</tspan><tspan x="240.0" dy="15.0">package_id(zlib), package_id(openssl) [minor_mode]</tspan></text>
<rect x="46.5" y="311.8" width="387.1" height="46.5" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="331.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">4. Ревізія рецепта (RREV)</tspan><tspan x="240.0" dy="15.0">хеш файлів рецепта та джерел (якщо recipe_revision_mode)</tspan></text>
<line x1="435.0" y1="95.0" x2="485.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
