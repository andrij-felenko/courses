<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RTSP: канал керування й канал медіа — різні канали</text>
<rect x="60.0" y="84.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">клієнт</tspan><tspan x="160.0" dy="18.2">rtspsrc</tspan></text>
<rect x="740.0" y="84.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">сервер</tspan><tspan x="840.0" dy="18.2">камера з RTSP</tspan></text>
<rect x="300.0" y="70.0" width="400.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">керувальний канал — TCP, порт 554</tspan><tspan x="500.0" dy="16.9">OPTIONS · DESCRIBE → SDP</tspan><tspan x="500.0" dy="16.9">SETUP (транспорт і порти) · PLAY · TEARDOWN</tspan></text>
<line x1="264.0" y1="108.0" x2="296.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="736.0" y1="150.0" x2="704.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="216.0" width="400.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="250.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">RTP — UDP, порт p</tspan></text>
<line x1="736.0" y1="246.0" x2="704.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="296.0" y1="246.0" x2="264.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="300.0" width="400.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">RTCP — UDP, порт p+1</tspan></text>
<line x1="736.0" y1="330.0" x2="704.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="264.0" y1="330.0" x2="296.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="396.0" width="880.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">UDP не проходить крізь NAT або фаєрвол — rtspsrc переходить на interleaved:</tspan><tspan x="500.0" dy="16.9">ті самі RTP-пакети йдуть усередині вже відкритого керувального TCP-з'єднання,</tspan><tspan x="500.0" dy="16.9">кожен із префіксом «$ номер каналу довжина»</tspan></text>
</svg>