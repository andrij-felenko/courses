<rect x="90.0" y="330.0" width="340.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">RTP-пакети за порядком,</tspan><tspan x="260.0" dy="16.9">видані рівномірно в часі</tspan></text>
