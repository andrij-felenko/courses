<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережеве джерело: чотири роботи, які треба зробити</text>
<rect x="90.0" y="70.0" width="340.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">датаграми UDP,</tspan><tspan x="260.0" dy="16.9">як їх віддало ядро</tspan></text>
