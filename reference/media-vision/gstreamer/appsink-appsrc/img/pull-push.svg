<text x="245.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="245.0" dy="0.0">ваш потік чекає, поки кадру немає;</tspan><tspan x="245.0" dy="15.6">конвеєр іде далі, поки черга не повна;</tspan><tspan x="245.0" dy="15.6">ваш код нічого не гальмує напряму</tspan></text>
