<rect x="545.0" y="115.0" width="180.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="144.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">потік передавання</tspan></text>
