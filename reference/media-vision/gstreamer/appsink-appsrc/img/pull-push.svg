<rect x="545.0" y="200.0" width="180.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="226.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">new_sample()</tspan><tspan x="635.0" dy="18.2">— ВАШ код</tspan></text>
<line x1="635.0" y1="264.0" x2="635.0" y2="293.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="297.0" width="180.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">далі по конвеєру</tspan></text>
<text x="735.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="735.0" dy="0.0">поки ви працюєте — конвеєр стоїть;</tspan><tspan x="735.0" dy="15.6">зайвого потоку й черги немає</tspan></text>
