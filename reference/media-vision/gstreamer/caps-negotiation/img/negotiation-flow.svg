<line x1="820.0" y1="87.5" x2="820.0" y2="552.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="325.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle"><tspan x="325.0" dy="0.0">1. CAPS-запит: що ти приймаєш?</tspan></text>
<line x1="172.0" y1="190.0" x2="478.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="655.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle"><tspan x="655.0" dy="0.0">2. той самий запит далі за течією</tspan></text>
<line x1="502.0" y1="252.0" x2="808.0" y2="252.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="655.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="655.0" dy="0.0">3. відповідь: множина форматів</tspan></text>
<line x1="808.0" y1="314.0" x2="502.0" y2="314.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="6,4"/>
<line x1="520.0" y1="314.0" x2="502.0" y2="314.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="325.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="325.0" dy="0.0">4. відповідь, звужена самим перетворювачем</tspan></text>
<line x1="478.0" y1="376.0" x2="172.0" y2="376.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="6,4"/>
<line x1="190.0" y1="376.0" x2="172.0" y2="376.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="325.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="325.0" dy="0.0">5. подія CAPS: обрано NV12 1920×1080</tspan></text>
<line x1="172.0" y1="452.0" x2="478.0" y2="452.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="655.0" y="499.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="655.0" dy="0.0">6. подія CAPS далі, а за нею буфери</tspan></text>
<line x1="502.0" y1="514.0" x2="808.0" y2="514.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">штрихова стрілка — відповідь на запит;  суцільна — те, що йде каналом даних</text>
<text x="30.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">проти течії питають, за течією оголошують рішення</text>
