<rect x="390.0" y="52.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">ПЕРЕТВОРЮВАЧ</tspan></text>
<line x1="490.0" y1="87.5" x2="490.0" y2="552.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
