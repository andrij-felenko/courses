<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий елемент, два різні сусіди</text>
<text x="395.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">A: далі приймач, якому байдуже</text>
<text x="775.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">B: далі вимога 480×640</text>
<text x="30.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">на sink-паді</text>
<rect x="210.0" y="88.0" width="370.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="115.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">зафіксовано 640×480</tspan></text>
<rect x="590.0" y="88.0" width="370.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="775.0" y="115.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">зафіксовано 640×480</tspan></text>
<text x="30.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">transform_caps</text>
<rect x="210.0" y="152.0" width="370.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">множина з іншого боку:</tspan><tspan x="395.0" dy="18.2">640×480  або  480×640</tspan><tspan x="395.0" dy="18.2">тотожність — першою</tspan></text>
<rect x="590.0" y="152.0" width="370.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="775.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">множина з іншого боку:</tspan><tspan x="775.0" dy="18.2">640×480  або  480×640</tspan><tspan x="775.0" dy="18.2">тотожність — першою</tspan></text>
<text x="30.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">перетин із сусідом</text>
<rect x="210.0" y="260.0" width="370.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">приймач бере будь-що:</tspan><tspan x="395.0" dy="18.2">лишились обидві</tspan><tspan x="395.0" dy="18.2">НЕ зафіксовано</tspan></text>
<rect x="590.0" y="260.0" width="370.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="775.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">приймач хоче портрет:</tspan><tspan x="775.0" dy="18.2">лишилась одна</tspan><tspan x="775.0" dy="18.2">уже зафіксовано</tspan></text>
<text x="30.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">fixate_caps</text>
<rect x="210.0" y="368.0" width="370.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">тримайся тотожності:</tspan><tspan x="395.0" dy="18.2">обрано 640×480</tspan></text>
<rect x="590.0" y="368.0" width="370.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="775.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">не викликається —</tspan><tspan x="775.0" dy="18.2">обирати нема з чого</tspan></text>
<text x="30.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">set_caps</text>
<rect x="210.0" y="454.0" width="370.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="395.0" y="483.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">640×480 → 640×480</tspan><tspan x="395.0" dy="18.2">наскрізний режим</tspan></text>
<rect x="590.0" y="454.0" width="370.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="775.0" y="483.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">640×480 → 480×640</tspan><tspan x="775.0" dy="18.2">поворот кожного кадру</tspan></text>
<text x="490.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">fixate_caps потрібен лише там, де після перетину лишилась свобода</text>
<text x="490.0" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">у сценарії A елемент договорився до того, що йому нема чого робити</text>
</svg>