<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один кадр з appsink: чотири виклики й чотири різні володіння</text>
<rect x="70.0" y="70.0" width="400.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">GstSample *s =</tspan><tspan x="270.0" dy="18.2">gst_app_sink_pull_sample (sink)</tspan></text>
<rect x="520.0" y="70.0" width="390.0" height="70.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">ВОЛОДІЄМО</tspan><tspan x="715.0" dy="16.9">наприкінці — gst_sample_unref (s)</tspan></text>
<line x1="270.0" y1="144.0" x2="270.0" y2="174.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="180.0" width="400.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">GstBuffer *b = gst_sample_get_buffer (s)</tspan><tspan x="270.0" dy="18.2">GstCaps   *c = gst_sample_get_caps (s)</tspan></text>
<rect x="520.0" y="180.0" width="390.0" height="78.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">ПОЗИЧЕНІ</tspan><tspan x="715.0" dy="16.9">живуть, поки живий s</tspan><tspan x="715.0" dy="16.9">свого unref не мають</tspan></text>
<line x1="270.0" y1="262.0" x2="270.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="298.0" width="400.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="337.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">gst_video_info_from_caps (&amp;info, c)</tspan></text>
<rect x="520.0" y="298.0" width="390.0" height="70.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">лише коли caps змінилися</tspan><tspan x="715.0" dy="16.9">розкладка з формату</tspan></text>
<line x1="270.0" y1="372.0" x2="270.0" y2="402.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="408.0" width="400.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="442.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">gst_video_frame_map (&amp;fr, &amp;info, b,</tspan><tspan x="270.0" dy="18.2">                     GST_MAP_READ)</tspan></text>
<rect x="520.0" y="408.0" width="390.0" height="78.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">справжні кроки з GstVideoMeta</tspan><tspan x="715.0" dy="16.9">кожна площина мапиться окремо</tspan></text>
<rect x="70.0" y="516.0" width="840.0" height="54.0" rx="6" fill="#e8f4ec" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="548.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Жодного байта кадру не переміщено: усі чотири виклики передають тільки права й адреси.</tspan></text>
</svg>