<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="545" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що саме переписали між 0.10 і 1.0</text>
<text x="250.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">0.10: байти всередині буфера</text>
<text x="750.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1.0: буфер посилається на пам'ять</text>
<rect x="50.0" y="66.0" width="400.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">GstBuffer</tspan><tspan x="250.0" dy="18.2">data → байти, size</tspan><tspan x="250.0" dy="18.2">malloc_data, free_func</tspan><tspan x="250.0" dy="18.2">caps, timestamp, parent</tspan></text>
<line x1="250.0" y1="220.0" x2="250.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="266.0" width="400.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="311.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">GstXvImageBuffer, GstGLBuffer, …</tspan><tspan x="250.0" dy="18.2">окремий підклас на кожен тип пам'яті</tspan></text>
<rect x="50.0" y="396.0" width="400.0" height="122.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="444.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Один суцільний блок.</tspan><tspan x="250.0" dy="16.9">Один підклас — або той, або інший.</tspan><tspan x="250.0" dy="16.9">Суббуфер тримає батька вказівником.</tspan></text>
<rect x="550.0" y="66.0" width="400.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">GstBuffer</tspan><tspan x="750.0" dy="18.2">PTS, DTS, тривалість, прапорці</tspan></text>
<line x1="645.0" y1="166.0" x2="645.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="855.0" y1="166.0" x2="855.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="266.0" width="190.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="645.0" y="303.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">GstMemory × N</tspan><tspan x="645.0" dy="16.9">свій лічильник</tspan><tspan x="645.0" dy="16.9">свій алокатор</tspan></text>
<rect x="760.0" y="266.0" width="190.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="303.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">GstMeta × N</tspan><tspan x="855.0" dy="16.9">GstVideoMeta,</tspan><tspan x="855.0" dy="16.9">обрізання, …</tspan></text>
<rect x="550.0" y="396.0" width="400.0" height="122.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="444.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Кілька окремих блоків.</tspan><tspan x="750.0" dy="16.9">Жодного підкласу — метадані складаються.</tspan><tspan x="750.0" dy="16.9">Алокатор підмінний: dmabuf, GL, драйвер.</tspan></text>
</svg>