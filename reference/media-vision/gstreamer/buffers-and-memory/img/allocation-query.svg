<rect x="90.0" y="262.0" width="780.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Споживач відповідає: «ось мій пул, розмір буфера 3 110 400 байтів,</tspan><tspan x="480.0" dy="18.2">крок рядка 2048, щонайменше 4 буфери, я розумію GstVideoMeta».</tspan><tspan x="480.0" dy="18.2">Джерело бере цей пул — і кадр від початку лежить там, де його покажуть.</tspan></text>
