<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно, у якому вказівник на кадр справді ваш</text>
<text x="24.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Ваш код</text>
<rect x="250.0" y="72.0" width="145.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="322.5" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">pull_sample</tspan></text>
<rect x="395.0" y="72.0" width="145.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="467.5" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="467.5" dy="0.0">frame_map</tspan></text>
<rect x="540.0" y="72.0" width="160.0" height="56.0" rx="6" fill="#e8f4ec" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">обхід рядків</tspan></text>
<rect x="700.0" y="72.0" width="130.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">frame_unmap</tspan></text>
<rect x="830.0" y="72.0" width="130.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="895.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">sample_unref</tspan></text>
<text x="24.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Пам'ять із пулу</text>
<rect x="250.0" y="182.0" width="710.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">байти кадру N</tspan></text>
<rect x="830.0" y="182.0" width="130.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="895.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">кадр N+1</tspan></text>
<line x1="830.0" y1="62.0" x2="830.0" y2="330.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="824.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">тут буфер лягає назад у пул</text>
<text x="24.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Збережений</text>
<text x="24.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">вказівник</text>
<line x1="560.0" y1="292.0" x2="950.0" y2="292.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="8 5"/>
<line x1="940.0" y1="292.0" x2="962.0" y2="292.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">адреса лишається дійсною — і після unmap, і після unref</text>
<rect x="60.0" y="356.0" width="900.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Дійсний вказівник ≠ ваші байти. Після unmap відображення знято, після unref буфер повернувся в пул —</tspan><tspan x="510.0" dy="18.2">і наступний кадр декодер пише в ті самі адреси. Читання не падає й нічого не повідомляє:</tspan><tspan x="510.0" dy="18.2">картинка просто «плутається» раз на кілька секунд, і шукати це доводиться тижнями.</tspan></text>
</svg>