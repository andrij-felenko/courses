<rect x="55.0" y="548.0" width="890.0" height="66.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="576.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">кеш — не істина: істина у файлах плагінів.</tspan><tspan x="500.0" dy="19.5">Змінився час або розмір файла — саме цей плагін перескановують заново.</tspan></text>
