<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 842" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="842" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях від файла .c до елемента: шість перевірок і шість мовчань</text>
<text x="301.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що мусить збігтися</text>
<text x="811.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">як воно мовчить, коли не збіглося</text>
<rect x="46.0" y="74.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">збірка: libgstmyfilter.so</tspan><tspan x="301.0" dy="18.2">три бібліотеки, PACKAGE визначено</tspan></text>
<rect x="606.0" y="74.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">'PACKAGE' undeclared —</tspan><tspan x="811.0" dy="18.2">єдина гучна помилка з шести</tspan></text>
<line x1="301.0" y1="171.0" x2="301.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="190.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">ім'я файла ↔ ім'я в GST_PLUGIN_DEFINE</tspan><tspan x="301.0" dy="18.2">символ gst_plugin_myfilter_get_desc</tspan></text>
<rect x="606.0" y="190.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">«is not a GStreamer plugin»:</tspan><tspan x="811.0" dy="18.2">точки входу не знайдено</tspan></text>
<line x1="301.0" y1="287.0" x2="301.0" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="306.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="348.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">файл лежить у GST_PLUGIN_PATH,</tspan><tspan x="301.0" dy="18.2">час або розмір змінилися</tspan></text>
<rect x="606.0" y="306.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="348.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">gst-inspect не бачить нічого</tspan><tspan x="811.0" dy="18.2">або показує стару копію</tspan></text>
<line x1="301.0" y1="403.0" x2="301.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="422.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="473.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">версія: major точно, minor ≤ ядра</tspan></text>
<rect x="606.0" y="422.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="464.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">«has incompatible version,</tspan><tspan x="811.0" dy="18.2">not loading» рівнем WARNING</tspan></text>
<line x1="301.0" y1="519.0" x2="301.0" y2="534.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="538.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="580.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">plugin_init → фабрика «myfilter»,</tspan><tspan x="301.0" dy="18.2">метадані й шаблони падів із класу</tspan></text>
<rect x="606.0" y="538.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="589.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">No such element or plugin</tspan></text>
<line x1="301.0" y1="635.0" x2="301.0" y2="650.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="46.0" y="654.0" width="510.0" height="94.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="301.0" y="696.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="301.0" dy="0.0">klass дав категорію,</tspan><tspan x="301.0" dy="18.2">caps шаблону перетнулися з потоком</tspan></text>
<rect x="606.0" y="654.0" width="410.0" height="94.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="811.0" y="696.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="811.0" dy="0.0">елемент є й працює на ім'я,</tspan><tspan x="811.0" dy="18.2">але автопідбір його не бере</tspan></text>
<rect x="46.0" y="774.0" width="970.0" height="48.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="531.0" y="803.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="531.0" dy="0.0">П'ять перевірок із шести не зупиняють запуск — вони просто не додають вашого елемента в реєстр.</tspan></text>
</svg>