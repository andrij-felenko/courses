<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1030" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="53.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">gst_init(), конвеєр, елементи</tspan></text>
<text x="490.0" y="66.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">нитки ще не запущено —</tspan><tspan x="490.0" dy="16.9">постити нікому й нічого</tspan></text>
<line x1="250.0" y1="88.5" x2="250.0" y2="117.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="123.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">gst_bus_add_watch()</tspan></text>
<text x="490.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">ДО першого set_state:</tspan><tspan x="490.0" dy="16.9">інакше ранні повідомлення нікому забрати</tspan></text>
<line x1="250.0" y1="158.5" x2="250.0" y2="187.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="193.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">set_state(PAUSED)</tspan></text>
<text x="490.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">розвідка: NO_PREROLL</tspan><tspan x="490.0" dy="16.9">означає живий конвеєр</tspan></text>
<line x1="250.0" y1="228.5" x2="250.0" y2="257.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="263.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">set_state(PLAYING)</tspan></text>
<text x="490.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">керування повертається одразу,</tspan><tspan x="490.0" dy="16.9">кадри йдуть у чужих нитках</tspan></text>
<line x1="250.0" y1="298.5" x2="250.0" y2="327.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="333.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">g_main_loop_run()</tspan></text>
<text x="490.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">уся програма живе тут:</tspan><tspan x="490.0" dy="16.9">робота — в обробнику шини</tspan></text>
<line x1="250.0" y1="368.5" x2="250.0" y2="389.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="395.1" width="400.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">g_main_loop_quit()</tspan><tspan x="250.0" dy="16.9">з обробника EOS або ERROR</tspan></text>
<text x="490.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">єдина дорога назовні —</tspan><tspan x="490.0" dy="16.9">через повідомлення</tspan></text>
<line x1="250.0" y1="446.9" x2="250.0" y2="467.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="473.5" width="400.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">set_state(NULL)</tspan></text>
<text x="490.0" y="486.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">шину скинуто: після цього рядка</tspan><tspan x="490.0" dy="16.9">вона вже нічого не віддасть</tspan></text>
<line x1="250.0" y1="508.5" x2="250.0" y2="529.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="535.0" width="400.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="556.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">remove_watch, unref bus,</tspan><tspan x="250.0" dy="16.9">unref pipeline</tspan></text>
<text x="490.0" y="556.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="490.0" dy="0.0">стеження тримає посилання —</tspan><tspan x="490.0" dy="16.9">знімаємо його першим</tspan></text>
</svg>