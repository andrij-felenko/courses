<text x="314.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">video/quicktime</text>
<line x1="570.0" y1="152.0" x2="722.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="646.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">video/x-h264</text>
<line x1="570.0" y1="192.0" x2="636.0" y2="226.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="650.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">пад створено, але не з'єднано</text>
<text x="58.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">суцільна стрілка — пади з'єднані; напис над нею — формат, на якому вони домовилися</text>
<text x="58.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">пунктир — пад існує, але його ніхто не підхопив: дані з цієї гілки нікуди не йдуть</text>
<text x="58.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">рядок під назвою — стан елемента, коли граф скидали на диск</text>
</svg>