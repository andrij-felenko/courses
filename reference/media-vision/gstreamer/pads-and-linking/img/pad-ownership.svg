<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими володіння в API падів</text>
<rect x="40.0" y="70.0" width="340.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">gst_pad_push(pad, buf)</tspan><tspan x="210.0" dy="18.2">gst_pad_push_event(pad, ev)</tspan></text>
<rect x="650.0" y="70.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">буфер уже не ваш —</tspan><tspan x="815.0" dy="18.2">звільнить той, хто прийняв</tspan></text>
<line x1="392.0" y1="115.0" x2="638.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="515.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">посилання ПЕРЕХОДИТЬ</text>
<rect x="40.0" y="195.0" width="340.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">gst_element_get_static_pad()</tspan><tspan x="210.0" dy="18.2">gst_pad_get_peer()</tspan></text>
<rect x="650.0" y="195.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">ваш обов'язок —</tspan><tspan x="815.0" dy="18.2">gst_object_unref()</tspan></text>
<line x1="392.0" y1="240.0" x2="638.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="515.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">повертає ВАМ +1 посилання</text>
<rect x="40.0" y="320.0" width="340.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">GST_PAD_PROBE_INFO_DATA(info)</tspan><tspan x="210.0" dy="18.2">у тілі проби</tspan></text>
<rect x="650.0" y="320.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">не звільняти; треба довше —</tspan><tspan x="815.0" dy="18.2">gst_buffer_ref()</tspan></text>
<line x1="392.0" y1="365.0" x2="638.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="515.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лише ПОЗИЧЕНО на час виклику</text>
</svg>