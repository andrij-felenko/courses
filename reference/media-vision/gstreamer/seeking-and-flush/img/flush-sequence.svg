<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемотування з очищенням: вісім дій у трьох напрямках</text>
<rect x="40.0" y="68.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="103.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle"><tspan x="135.0" dy="0.0">проти течії</tspan></text>
<rect x="258.0" y="68.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="458.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">seek-подія від застосунку</tspan></text>
<rect x="686.0" y="68.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="103.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">швидкість, позиція, прапорці; конвеєр віддає її приймачам</tspan></text>
<line x1="458.0" y1="131.0" x2="458.0" y2="144.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="145.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle"><tspan x="135.0" dy="0.0">проти течії</tspan></text>
<rect x="258.0" y="145.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="458.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">подія піднімається ланцюгом</tspan></text>
<rect x="686.0" y="145.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="179.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">від приймача вгору, доки хтось не візьметься — зазвичай демультиплексор</tspan></text>
<line x1="458.0" y1="208.0" x2="458.0" y2="221.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="222.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="257.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle"><tspan x="135.0" dy="0.0">за течією</tspan></text>
<rect x="258.0" y="222.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="458.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">FLUSH_START, позачергово</tspan></text>
<rect x="686.0" y="222.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">обганяє буфери; пади перестають приймати, черги порожніють</tspan></text>
<line x1="458.0" y1="285.0" x2="458.0" y2="298.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="299.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle"><tspan x="135.0" dy="0.0">за течією</tspan></text>
<rect x="258.0" y="299.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="458.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">чекання обриваються</tspan></text>
<rect x="686.0" y="299.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">приймач кидає сон на годиннику, заблоковані push повертаються</tspan></text>
<line x1="458.0" y1="362.0" x2="458.0" y2="375.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="376.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="135.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="135.0" dy="0.0">на місці</tspan></text>
<rect x="258.0" y="376.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="458.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">потік зупинено, позицію змінено</tspan></text>
<rect x="686.0" y="376.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="411.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">індекс дає байтове зміщення; тепер дорога вільна</tspan></text>
<line x1="458.0" y1="439.0" x2="458.0" y2="452.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="453.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="488.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="135.0" dy="0.0">за течією</tspan></text>
<rect x="258.0" y="453.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="458.0" y="489.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">FLUSH_STOP, серіалізовано</tspan></text>
<rect x="686.0" y="453.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="488.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">пади знову приймають, EOS знято, час програвання в нуль</tspan></text>
<line x1="458.0" y1="516.0" x2="458.0" y2="529.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="530.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="565.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="135.0" dy="0.0">за течією</tspan></text>
<rect x="258.0" y="530.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="458.0" y="566.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">новий SEGMENT і перші буфери</tspan></text>
<rect x="686.0" y="530.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="565.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">правило перекладу міток мусить прийти раніше за дані</tspan></text>
<line x1="458.0" y1="593.0" x2="458.0" y2="606.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="607.0" width="190.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="642.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="135.0" dy="0.0">на шину</tspan></text>
<rect x="258.0" y="607.0" width="400.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="458.0" y="643.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0.0">наповнення й ASYNC_DONE</tspan></text>
<rect x="686.0" y="607.0" width="474.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="923.0" y="641.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">приймач набирає перший кадр наново — аж тепер перемотування завершене</tspan></text>
</svg>