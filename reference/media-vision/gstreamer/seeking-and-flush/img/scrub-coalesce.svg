<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкрябання: одне перемотування в польоті, решта прохань зливаються</text>
<rect x="60.0" y="116.0" width="310.0" height="104.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="215.0" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle"><tspan x="215.0" dy="0.0">спокій</tspan><tspan x="215.0" dy="19.5">перемотування в польоті немає</tspan></text>
<rect x="490.0" y="116.0" width="310.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="645.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle"><tspan x="645.0" dy="0.0">у польоті</tspan><tspan x="645.0" dy="19.5">seek надіслано,</tspan><tspan x="645.0" dy="19.5">чекаємо на ASYNC_DONE</tspan></text>
<rect x="890.0" y="116.0" width="310.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1045.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle"><tspan x="1045.0" dy="0.0">у польоті + чекає</tspan><tspan x="1045.0" dy="19.5">під час польоту прийшло</tspan><tspan x="1045.0" dy="19.5">нове положення повзунка</tspan></text>
<line x1="378.0" y1="168.0" x2="482.0" y2="168.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle">рух повзунка → шлемо seek</text>
<line x1="808.0" y1="168.0" x2="882.0" y2="168.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="845.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle">ще рух → лише запам'ятали</text>
<rect x="60.0" y="288.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="295.0" dy="0.0">ASYNC_DONE, нового положення не було</tspan></text>
<line x1="536.0" y1="320.0" x2="574.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="582.0" y="288.0" width="618.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="891.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">повертаємося в «спокій»: конвеєр стоїть там, куди останнє прохання й вело</tspan></text>
<rect x="60.0" y="368.0" width="470.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="295.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle"><tspan x="295.0" dy="0.0">ASYNC_DONE, а положення змінилося</tspan></text>
<line x1="536.0" y1="400.0" x2="574.0" y2="400.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="582.0" y="368.0" width="618.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="891.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">шлемо seek на ОСТАННЄ значення й знову «у польоті»; проміжні гинуть непоказаними</tspan></text>
<rect x="60.0" y="452.0" width="1140.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="484.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle"><tspan x="630.0" dy="0.0">без злиття сорок рухів руки дають сорок перемотувань поспіль,</tspan><tspan x="630.0" dy="18.2">і кожне чесно чекає свого наповнення — картинка наздоганяє руку секундами</tspan></text>
</svg>