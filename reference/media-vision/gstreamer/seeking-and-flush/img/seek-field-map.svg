<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аргументи seek-події та поля GstSegment, у які вони лягають</text>
<text x="260.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">що передає застосунок</text>
<text x="935.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">куди це лягає в GstSegment</text>
<rect x="50.0" y="100.0" width="420.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">rate</tspan><tspan x="260.0" dy="18.2">gdouble; знак задає напрям</tspan></text>
<rect x="700.0" y="100.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="935.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">segment.rate</tspan><tspan x="935.0" dy="18.2">приймач ділить відстань на |rate|</tspan></text>
<line x1="476.0" y1="131.0" x2="694.0" y2="131.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="178.0" width="420.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">format</tspan><tspan x="260.0" dy="18.2">TIME, BYTES, DEFAULT, PERCENT…</tspan></text>
<rect x="700.0" y="178.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="935.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">segment.format</tspan><tspan x="935.0" dy="18.2">мусить збігтися з форматом сегмента</tspan></text>
<line x1="476.0" y1="209.0" x2="694.0" y2="209.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="256.0" width="420.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="282.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">flags</tspan><tspan x="260.0" dy="18.2">GstSeekFlags — бітова маска</tspan></text>
<rect x="700.0" y="256.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="935.0" y="282.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">segment.flags</tspan><tspan x="935.0" dy="18.2">переїжджають лише SEGMENT і TRICKMODE*</tspan></text>
<line x1="476.0" y1="287.0" x2="694.0" y2="287.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="334.0" width="420.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">start_type + start</tspan><tspan x="260.0" dy="18.2">SET — значення, END — від кінця, NONE — не чіпати</tspan></text>
<rect x="700.0" y="334.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="935.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">segment.start</tspan><tspan x="935.0" dy="18.2">NONE лишає те, що вже було</tspan></text>
<line x1="476.0" y1="365.0" x2="694.0" y2="365.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="412.0" width="420.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="438.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">stop_type + stop</tspan><tspan x="260.0" dy="18.2">те саме для кінця відрізка</tspan></text>
<rect x="700.0" y="412.0" width="470.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="935.0" y="438.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">segment.stop</tspan><tspan x="935.0" dy="18.2">−1 означає «до кінця потоку»</tspan></text>
<line x1="476.0" y1="443.0" x2="694.0" y2="443.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">решту полів сегмента не передають — їх рахує gst_segment_do_seek()</text>
<rect x="50.0" y="518.0" width="1120.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="551.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">base = 0, якщо стоїть FLUSH; інакше — накопичений час програвання</tspan><tspan x="610.0" dy="18.2">offset, position, time перераховуються від start і напрямку</tspan></text>
<text x="610.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">вихідний параметр update каже, чи змінилася позиція, чи сама лише швидкість</text>
</svg>