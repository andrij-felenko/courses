<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок старту: спершу годинник, потім спільний base_time</text>
<text x="20.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">машина A — майстер</text>
<text x="20.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">роздає час і base_time</text>
<rect x="190.0" y="150.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">gst_net_time_provider_new</tspan><tspan x="320.0" dy="15.6">UDP :5637 — час назовні</tspan></text>
<rect x="475.0" y="150.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">дочекався всіх підлеглих,</tspan><tspan x="605.0" dy="15.6">T = now + 1 с,</tspan><tspan x="605.0" dy="15.6">роздає T по TCP</tspan></text>
<rect x="760.0" y="150.0" width="220.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">set_base_time(T)</tspan><tspan x="870.0" dy="15.6">PAUSED → PLAYING</tspan></text>
<line x1="452.0" y1="188.0" x2="473.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="737.0" y1="188.0" x2="758.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="20.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">машина B — підлеглий</text>
<text x="20.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">бере час і base_time</text>
<rect x="190.0" y="330.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">gst_net_client_clock_new</tspan><tspan x="320.0" dy="15.6">wait_for_sync — блокує,</tspan><tspan x="320.0" dy="15.6">поки годинник не зійшовся</tspan></text>
<rect x="475.0" y="330.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">з'єднується з майстром</tspan><tspan x="605.0" dy="15.6">і читає T</tspan></text>
<rect x="760.0" y="330.0" width="220.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">set_base_time(T)</tspan><tspan x="870.0" dy="15.6">PAUSED → PLAYING</tspan></text>
<line x1="452.0" y1="368.0" x2="473.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="737.0" y1="368.0" x2="758.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
