<text x="345.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">«годинник зійшовся»</text>
<line x1="605.0" y1="228.0" x2="605.0" y2="328.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="622.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">T по TCP</text>
<line x1="190.0" y1="470.0" x2="1120.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час за спільним годинником →</text>
<line x1="870.0" y1="460.0" x2="870.0" y2="480.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="870.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обидва в PLAYING</text>
<line x1="1050.0" y1="122.0" x2="1050.0" y2="470.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6 5"/>
<line x1="1050.0" y1="458.0" x2="1050.0" y2="482.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="1038.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">T — спільний base_time</text>
<text x="1038.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">тут виходить перший кадр — на обох машинах</text>
<line x1="872.0" y1="505.0" x2="1048.0" y2="505.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="872.0" y1="498.0" x2="872.0" y2="512.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="1048.0" y1="498.0" x2="1048.0" y2="512.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="960.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">запас: споживач тримає перший кадр</text>
</svg>