<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шкали часу конвеєра й дві рівності, що їх зшивають</text>
<line x1="60.0" y1="130.0" x2="900.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="60.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">час годинника  (absolute_time)</text><text x="60.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">спільний лічильник наносекунд; не скидається й не починається з нуля</text>
<line x1="60.0" y1="290.0" x2="900.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="60.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">running_time</text><text x="60.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">скільки конвеєр пробув у PLAYING; нуль у мить запуску</text>
<line x1="60.0" y1="450.0" x2="900.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="60.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">мітка часу буфера  (PTS у сегменті)</text><text x="60.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">позиція всередині медіа; своя для кожного файлу й кожного seek</text>
