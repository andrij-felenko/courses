<text x="195.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">base_time = 1205.400 с</text>
<rect x="160.0" y="462.8" width="640.0" height="70.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="493.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">running_time = (PTS − segment.start) / |rate| + segment.base</tspan><tspan x="480.0" dy="19.5">час_показу_за_годинником = running_time + base_time</tspan></text>
