<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Старт конвеєра: одна відповідь із чотирьох, і для кожної свій хід</text>
<rect x="312.2" y="64.0" width="575.5" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ret = gst_element_set_state (pipeline, GST_STATE_PAUSED)</tspan></text>
<line x1="600.0" y1="100.0" x2="600.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<line x1="165.0" y1="125.0" x2="1035.0" y2="125.0" stroke="#333333" stroke-width="1.5"/>
<line x1="165.0" y1="125.0" x2="165.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="146.0" width="260.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">FAILURE</tspan></text>
<rect x="35.0" y="208.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">перехід зламався,</tspan><tspan x="165.0" dy="18.2">стан невизначений</tspan></text>
<rect x="35.0" y="298.0" width="260.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">вигребти шину —</tspan><tspan x="165.0" dy="18.2">там причина;</tspan><tspan x="165.0" dy="18.2">set_state(NULL)</tspan><tspan x="165.0" dy="18.2">і вихід</tspan></text>
<line x1="455.0" y1="125.0" x2="455.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325.0" y="146.0" width="260.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">NO_PREROLL</tspan></text>
<rect x="325.0" y="208.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">джерело живе —</tspan><tspan x="455.0" dy="18.2">наповнення не буде</tspan></text>
<rect x="325.0" y="298.0" width="260.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="455.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">одразу PLAYING,</tspan><tspan x="455.0" dy="18.2">не чекати нічого</tspan><tspan x="455.0" dy="18.2">(інакше — вічне</tspan><tspan x="455.0" dy="18.2">чекання)</tspan></text>
<line x1="745.0" y1="125.0" x2="745.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="615.0" y="146.0" width="260.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">ASYNC</tspan></text>
<rect x="615.0" y="208.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">наповнення почалося,</tspan><tspan x="745.0" dy="18.2">триває невідомо скільки</tspan></text>
<rect x="615.0" y="298.0" width="260.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">читати шину до</tspan><tspan x="745.0" dy="18.2">ASYNC_DONE від</tspan><tspan x="745.0" dy="18.2">самого конвеєра</tspan><tspan x="745.0" dy="18.2">або до ERROR</tspan></text>
<line x1="1035.0" y1="125.0" x2="1035.0" y2="144.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="905.0" y="146.0" width="260.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="1035.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1035.0" dy="0.0">SUCCESS</tspan></text>
<rect x="905.0" y="208.0" width="260.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1035.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">уже в PAUSED,</tspan><tspan x="1035.0" dy="18.2">чекати нема чого</tspan></text>
<rect x="905.0" y="298.0" width="260.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1035.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">одразу PLAYING</tspan></text>
<text x="600.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Чотири відповіді — чотири різні дії; злити їх в одне «вдалося чи ні» не можна</text>
</svg>