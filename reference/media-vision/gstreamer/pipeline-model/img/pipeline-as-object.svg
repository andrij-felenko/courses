<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що належить конвеєрові, а не окремому елементу</text>
<rect x="30.0" y="56.0" width="540.0" height="220.0" rx="10" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="300.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр — бін найвищого рівня</text>
<rect x="50.0" y="110.0" width="145.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="122.5" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="122.5" dy="0.0">джерело</tspan></text>
<rect x="222.0" y="110.0" width="145.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="294.5" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="294.5" dy="0.0">декодер</tspan></text>
<rect x="394.0" y="110.0" width="145.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="466.5" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="466.5" dy="0.0">стік</tspan></text>
<line x1="199.0" y1="137.0" x2="218.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="371.0" y1="137.0" x2="390.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">стан міняється для всієї групи разом,</tspan><tspan x="300.0" dy="15.6">знизу вгору: NULL → READY → PAUSED → PLAYING</tspan></text>
<text x="300.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вкладений бін виглядає ззовні як один елемент</text>
<rect x="673.2" y="73.4" width="163.6" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Годинник</tspan><tspan x="755.0" dy="15.6">один на весь конвеєр:</tspan><tspan x="755.0" dy="15.6">стоки міряють час ним</tspan></text>
<rect x="686.9" y="193.4" width="136.3" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="213.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Шина</tspan><tspan x="755.0" dy="15.6">черга повідомлень</tspan><tspan x="755.0" dy="15.6">від ниток обробки</tspan></text>
<rect x="690.3" y="318.4" width="129.4" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="755.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Нитка застосунку</tspan><tspan x="755.0" dy="15.6">читає шину тоді,</tspan><tspan x="755.0" dy="15.6">коли їй зручно</tspan></text>
<line x1="667.2" y1="105.0" x2="578.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="578.0" y1="225.0" x2="680.9" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="755.0" y1="262.6" x2="755.0" y2="312.4" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>