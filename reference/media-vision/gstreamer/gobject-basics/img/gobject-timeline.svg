<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія: об'єктна система від GTK до GStreamer 1.0</text>
<text x="125.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">коли</text>
<text x="475.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">GTK і GLib</text>
<text x="970.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">GStreamer</text>
<rect x="40.0" y="72.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">1996 — 1998</tspan></text>
<rect x="240.0" y="72.0" width="470.0" height="80.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">об'єктна система росте всередині GTK:</tspan><tspan x="475.0" dy="16.9">GtkObject, сигнали, типи під час роботи</tspan></text>
<rect x="40.0" y="164.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="208.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">січень 2000</tspan></text>
<rect x="740.0" y="164.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">перший gstobject.h:</tspan><tspan x="970.0" dy="16.9">структура починається з GtkObject,</tspan><tspan x="970.0" dy="16.9">а поряд — власний атомарний лічильник</tspan></text>
<line x1="125.0" y1="150.0" x2="125.0" y2="166.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="256.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="300.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">11 січня 2001</tspan></text>
<rect x="740.0" y="256.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">перший публічний випуск 0.1.0</tspan></text>
<line x1="125.0" y1="242.0" x2="125.0" y2="258.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="348.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="392.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">25 червня 2001</tspan></text>
<rect x="240.0" y="348.0" width="470.0" height="80.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">нова тип-система ще в розробці</tspan><tspan x="475.0" dy="16.9">(гілка GLib 2.0)</tspan></text>
<rect x="740.0" y="348.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">злиття гілки GOBJECT1: шар gobject2gtk</tspan><tspan x="970.0" dy="16.9">дає збірку і на GTK 1.2, і на нову GLib</tspan></text>
<line x1="125.0" y1="334.0" x2="125.0" y2="350.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="440.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="484.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">11 березня 2002</tspan></text>
<rect x="240.0" y="440.0" width="470.0" height="80.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">GTK+ 2.0: об'єктну систему винесено</tspan><tspan x="475.0" dy="16.9">з GTK у GLib окремим GObject</tspan></text>
<line x1="125.0" y1="426.0" x2="125.0" y2="442.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="532.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="576.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">27 лютого 2006</tspan></text>
<rect x="240.0" y="532.0" width="470.0" height="80.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="568.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">GLib 2.10: GInitiallyUnowned —</tspan><tspan x="475.0" dy="16.9">плавальне посилання приходить у GObject</tspan></text>
<rect x="740.0" y="532.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="568.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">своя реалізація плавального посилання</tspan><tspan x="970.0" dy="16.9">лишається ще на чотири роки</tspan></text>
<line x1="125.0" y1="518.0" x2="125.0" y2="534.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="624.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="668.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">7 грудня 2010</tspan></text>
<rect x="740.0" y="624.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="660.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">GstObject переведено на GInitiallyUnowned,</tspan><tspan x="970.0" dy="16.9">прапорець GST_FLOATING прибрано</tspan></text>
<line x1="125.0" y1="610.0" x2="125.0" y2="626.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="40.0" y="716.0" width="170.0" height="80.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="760.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">24 вересня 2012</tspan></text>
<rect x="740.0" y="716.0" width="460.0" height="80.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="752.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">випуск 1.0.0 — зміна доходить до тих,</tspan><tspan x="970.0" dy="16.9">хто пише конвеєри</tspan></text>
