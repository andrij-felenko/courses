<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що доступно інспекторові на кожному кроці до класу</text>
<text x="271.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">виклик</text>
<text x="816.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що після нього можна прочитати</text>
<rect x="56.0" y="84.0" width="430.0" height="92.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="271.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">gst_init ()</tspan></text>
<rect x="546.0" y="84.0" width="540.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="816.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="816.0" dy="0.0">реєстр у пам'яті: імена, ранги й категорії</tspan><tspan x="816.0" dy="18.2">усіх фабрик — код плагінів ще не в процесі</tspan></text>
<rect x="56.0" y="202.0" width="430.0" height="92.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="271.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">gst_element_factory_find (&quot;x264enc&quot;)</tspan></text>
<rect x="546.0" y="202.0" width="540.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="816.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="816.0" dy="0.0">фабрика: людська назва, автор, категорія,</tspan><tspan x="816.0" dy="18.2">шаблони падів у вигляді рядків</tspan></text>
<line x1="271.0" y1="179.0" x2="271.0" y2="199.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="320.0" width="430.0" height="92.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="271.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">gst_plugin_feature_load (…)</tspan></text>
<rect x="546.0" y="320.0" width="540.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="816.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="816.0" dy="0.0">файл плагіна завантажено в процес;</tspan><tspan x="816.0" dy="18.2">повертає ІНШИЙ об'єкт — беремо його</tspan></text>
