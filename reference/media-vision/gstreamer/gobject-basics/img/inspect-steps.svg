<rect x="546.0" y="438.0" width="540.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="816.0" y="488.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="816.0" dy="0.0">GType елемента — до завантаження тут був 0</tspan></text>
<line x1="271.0" y1="415.0" x2="271.0" y2="435.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
