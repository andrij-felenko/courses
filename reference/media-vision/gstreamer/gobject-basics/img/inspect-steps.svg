<rect x="546.0" y="556.0" width="540.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="816.0" y="597.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="816.0" dy="0.0">виконано class_init: властивості, сигнали</tspan><tspan x="816.0" dy="18.2">й шаблони падів з'явилися в таблиці типів</tspan></text>
<line x1="271.0" y1="533.0" x2="271.0" y2="553.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="56.0" y="682.0" width="1030.0" height="78.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="571.0" y="716.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">жодного елемента ще не створено — увесь опис лежить у класі, тому інспектор працює й з тими елементами,</tspan><tspan x="571.0" dy="19.5">які не вдалося б увімкнути: немає камери, немає ліцензії, немає вільного пристрою кодування</tspan></text>
