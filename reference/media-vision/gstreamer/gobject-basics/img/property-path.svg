<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 966" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="966" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від тексту до поля структури</text>
<rect x="70.0" y="60.0" width="640.0" height="86.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">bitrate=4096  — текст у рядку конвеєра</tspan></text>
<rect x="70.0" y="178.0" width="640.0" height="86.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="216.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">пошук опису на ім'я &quot;bitrate&quot;</tspan><tspan x="390.0" dy="19.5">вгору по ланцюгу класів</tspan></text>
<line x1="390.0" y1="150.0" x2="390.0" y2="174.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="296.0" width="640.0" height="86.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="334.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">опис знайдено: беззнакове ціле</tspan><tspan x="390.0" dy="19.5">межі 1 … 2048000, типове 2048</tspan></text>
<line x1="390.0" y1="268.0" x2="390.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="414.0" width="640.0" height="86.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">текст &quot;4096&quot; → GValue типу uint</tspan></text>
<line x1="390.0" y1="386.0" x2="390.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="532.0" width="640.0" height="86.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="570.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">звірка з межами опису</tspan><tspan x="390.0" dy="19.5">(вилізло за край — притиснути й попередити)</tspan></text>
<line x1="390.0" y1="504.0" x2="390.0" y2="528.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="650.0" width="640.0" height="86.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="698.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">клас-&gt;set_property (об'єкт, номер, GValue, опис)</tspan></text>
<line x1="390.0" y1="622.0" x2="390.0" y2="646.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="768.0" width="640.0" height="86.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="816.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">self-&gt;bitrate = 4096  — поле структури</tspan></text>
<line x1="390.0" y1="740.0" x2="390.0" y2="764.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="890.0" width="640.0" height="56.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="922.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ядро знає ім'я й опис — і жодного разу не торкається поля напряму</tspan></text>
</svg>