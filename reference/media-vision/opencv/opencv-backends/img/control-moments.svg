<text x="974.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">CAP_PROP_HW_ACCELERATION</text>
<text x="974.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="974.0" dy="0.0">вирішується наново</tspan><tspan x="974.0" dy="14.3">для кожного буфера —</tspan><tspan x="974.0" dy="14.3">і саме тут платять байтами</tspan></text>
<rect x="50.0" y="450.0" width="1044.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="572.0" y="476.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="572.0" dy="0.0">Важіль лівіше не обійти важелем правіше: чого немає у збірці, того не створять ані змінна середовища, ані виклик</tspan></text>
