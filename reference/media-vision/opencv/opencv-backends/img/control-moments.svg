<text x="170.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">WITH_CUDA · WITH_VA_INTEL</text>
<text x="170.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="170.0" dy="0.0">міняється лише перезбіркою:</tspan><tspan x="170.0" dy="14.3">на робочій машині</tspan><tspan x="170.0" dy="14.3">важіль недосяжний</tspan></text>
