<text x="974.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="974.0" dy="0.0">де лежать пікселі</tspan><tspan x="974.0" dy="15.6">саме цього кадру</tspan></text>
