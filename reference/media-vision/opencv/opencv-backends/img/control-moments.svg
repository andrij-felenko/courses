<text x="706.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">setUseOptimized()</text>
<text x="706.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="706.0" dy="0.0">діють з наступного виклику;</tspan><tspan x="706.0" dy="14.3">setUseOpenCL живе</tspan><tspan x="706.0" dy="14.3">окремо в кожному потоці</tspan></text>
