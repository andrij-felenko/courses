<text x="438.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="438.0" dy="0.0">читаються один раз,</tspan><tspan x="438.0" dy="14.3">при першому дотику:</tspan><tspan x="438.0" dy="14.3">putenv посеред роботи пізно</tspan></text>
