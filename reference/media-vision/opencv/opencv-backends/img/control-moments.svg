<rect x="318.0" y="124.0" width="240.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="438.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="438.0" dy="0.0">2 · Старт процесу</tspan><tspan x="438.0" dy="16.9">змінні середовища</tspan></text>
<text x="438.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="438.0" dy="0.0">який пристрій узяти</tspan><tspan x="438.0" dy="15.6">і що писати в кеш</tspan></text>
