<line x1="170.0" y1="92.0" x2="170.0" y2="108.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="50.0" y="124.0" width="240.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="170.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1 · Збірка бібліотеки</tspan><tspan x="170.0" dy="16.9">cmake</tspan></text>
<text x="170.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">чи є в бінарнику</tspan><tspan x="170.0" dy="15.6">код для цього шляху</tspan></text>
