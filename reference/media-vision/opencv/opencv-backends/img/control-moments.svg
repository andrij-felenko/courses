<text x="706.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="706.0" dy="0.0">увімкнути шлях, спитати</tspan><tspan x="706.0" dy="15.6">пристрій, закрити чергу</tspan></text>
<rect x="586.0" y="228.0" width="240.0" height="132.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
