<line x1="170.0" y1="150.0" x2="170.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="62.0" y="190.0" width="216.0" height="60.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
