<line x1="810.0" y1="250.0" x2="810.0" y2="292.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="292.0" width="200.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">пікселі GstBuffer</tspan></text>
<text x="810.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="810.0" dy="0.0">release() кличе твій deallocate() —</tspan><tspan x="810.0" dy="14.3">той відпускає буфер сам</tspan></text>
