<text x="490.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">release() не звільняє нічого —</tspan><tspan x="490.0" dy="14.3">буфер мусить пережити Mat</tspan></text>
<text x="810.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">3. Чужий буфер</tspan><tspan x="810.0" dy="16.9">і власний алокатор</tspan></text>
