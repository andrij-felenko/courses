<text x="170.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">звільняє release(),</tspan><tspan x="170.0" dy="14.3">коли лічильник упав до нуля</tspan></text>
<text x="490.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">2. Заголовок над</tspan><tspan x="490.0" dy="16.9">чужим буфером</tspan></text>
<rect x="420.0" y="106.0" width="140.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="132.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Mat</tspan></text>
<line x1="490.0" y1="150.0" x2="490.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="382.0" y="190.0" width="216.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="490.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">u = nullptr</tspan><tspan x="490.0" dy="15.6">лічильника нема</tspan></text>
<line x1="490.0" y1="250.0" x2="490.0" y2="292.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
