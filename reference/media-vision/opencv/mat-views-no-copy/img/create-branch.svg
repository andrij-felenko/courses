<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис у ROI: коли він доходить до батька</text>
<rect x="360.0" y="62.0" width="320.0" height="56.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.6"/><text x="520.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">функція викликає dst.create(size, type)</tspan></text>
<rect x="320.0" y="148.0" width="400.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="520.0" y="181.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">розмір і тип уже такі, як треба?</tspan></text>
<line x1="520.0" y1="118.0" x2="520.0" y2="146.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="320.0" y1="177.0" x2="230.0" y2="177.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="272.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<line x1="230.0" y1="177.0" x2="230.0" y2="236.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="238.0" width="340.0" height="66.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">create() нічого не робить:</tspan><tspan x="230.0" dy="16.9">буфер лишається тим самим</tspan></text>
<line x1="230.0" y1="304.0" x2="230.0" y2="348.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="350.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="230.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="230.0" dy="0.0">результат лягає ПРЯМО в пікселі батька</tspan><tspan x="230.0" dy="16.9">— саме цього ми й хотіли</tspan></text>
<line x1="720.0" y1="177.0" x2="812.0" y2="177.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="768.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<line x1="812.0" y1="177.0" x2="812.0" y2="236.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="640.0" y="238.0" width="340.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="810.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">create() виділяє новий блок</tspan><tspan x="810.0" dy="16.9">і перечіпляє на нього заголовок</tspan></text>
<line x1="812.0" y1="304.0" x2="812.0" y2="348.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="640.0" y="350.0" width="340.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="810.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="810.0" dy="0.0">у батька не потрапляє нічого,</tspan><tspan x="810.0" dy="16.9">а помилки ніхто не показав</tspan></text>
<rect x="230.0" y="440.0" width="580.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="520.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Мовчазна різниця: канал, глибина чи один зайвий піксель — і гілка інша.</tspan></text>
</svg>