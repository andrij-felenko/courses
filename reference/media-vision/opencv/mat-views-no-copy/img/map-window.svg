<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно, у якому заголовок над буфером конвеєра має сенс</text>
<rect x="70.0" y="76.0" width="430.0" height="44.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">sample = gst_app_sink_pull_sample()</tspan></text>
<rect x="70.0" y="130.0" width="430.0" height="44.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">buf = gst_buffer_ref(буфер із sample)</tspan></text>
<rect x="70.0" y="184.0" width="430.0" height="44.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">gst_sample_unref(sample)</tspan></text>
<rect x="70.0" y="238.0" width="430.0" height="44.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">buf = gst_buffer_make_writable(buf)</tspan></text>
<rect x="70.0" y="292.0" width="430.0" height="44.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/><text x="285.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">gst_video_frame_map(READ | WRITE)</tspan></text>
<rect x="70.0" y="346.0" width="430.0" height="44.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/><text x="285.0" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">cv::Mat над площиною — і вся робота</tspan></text>
<rect x="70.0" y="400.0" width="430.0" height="44.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/><text x="285.0" y="426.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">gst_video_frame_unmap()</tspan></text>
<rect x="70.0" y="454.0" width="430.0" height="44.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.2"/><text x="285.0" y="480.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">gst_app_src_push_buffer(buf)</tspan></text>
<text x="605.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">буфер наш</text>
<rect x="540.0" y="130.0" width="130.0" height="368.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="765.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">пікселі чинні</text>
<rect x="690.0" y="292.0" width="150.0" height="152.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/>
<rect x="690.0" y="450.0" width="150.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="765.0" y="478.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="765.0" dy="0.0">чужа пам'ять</tspan></text>
<rect x="870.0" y="190.0" width="210.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="975.0" y="227.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="975.0" dy="0.0">Заголовок, збережений</tspan><tspan x="975.0" dy="16.9">у члені класу, виходить</tspan><tspan x="975.0" dy="16.9">за нижній край зеленої</tspan><tspan x="975.0" dy="16.9">смуги — і показує вже</tspan><tspan x="975.0" dy="16.9">інший кадр із того</tspan><tspan x="975.0" dy="16.9">самого пулу.</tspan></text>
<line x1="868.0" y1="460.0" x2="846.0" y2="460.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="520.0" width="770.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="455.0" y="544.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Порядок не декоративний: доки живий sample, у буфера два власники — і запис у нього</tspan><tspan x="455.0" dy="16.9">коштуватиме копії; після unmap адреса лишається дійсною, а байти за нею вже чужі.</tspan></text>
</svg>