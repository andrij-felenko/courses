<line x1="300.0" y1="232.0" x2="300.0" y2="266.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="408.0" width="400.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="280.0" y="434.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="280.0" dy="0.0">cvSetImageROI(img, rect) міняє САМЕ зображення:</tspan><tspan x="280.0" dy="16.9">усі, хто тримає img, дістають нову ділянку</tspan></text>
<rect x="80.0" y="486.0" width="400.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="280.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="280.0" dy="0.0">друга ділянка одночасно — неможлива;</tspan><tspan x="280.0" dy="16.9">забутий cvResetImageROI — тиха помилка</tspan></text>
