<line x1="960.0" y1="182.0" x2="960.0" y2="252.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600.0" y="256.0" width="424.0" height="92.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.8"/>
<text x="812.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">один блок пікселів</tspan><tspan x="812.0" dy="17.6">лічильник посилань = 3</tspan></text>
<rect x="600.0" y="408.0" width="424.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="812.0" y="434.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="812.0" dy="0.0">frame(Rect(...)) повертає НОВЕ значення;</tspan><tspan x="812.0" dy="16.9">сам frame не змінюється й нічого не «вмикає»</tspan></text>
<rect x="600.0" y="486.0" width="424.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="812.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="812.0" dy="0.0">видів може бути скільки завгодно;</tspan><tspan x="812.0" dy="16.9">останній, хто пішов, звільняє блок</tspan></text>
