<text x="985.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зібране один раз, шаблонів немає</text>
<text x="985.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">switch (_src.kind())</text>
<text x="985.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">MAT → копія заголовка</text>
<text x="985.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">UMAT → відображення буфера</text>
<text x="985.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">STD_VECTOR → заголовок</text>
<text x="985.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">STD_BOOL_VECTOR → копія</text>
<rect x="846.0" y="388.0" width="278.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">тег поставив компілятор,</tspan><tspan x="985.0" dy="15.6">розбирає його бібліотека</tspan><tspan x="985.0" dy="15.6">під час роботи</tspan></text>
