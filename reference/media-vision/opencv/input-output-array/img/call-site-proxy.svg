<rect x="60.0" y="546.0" width="1060.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="579.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">InputArray — це typedef на const _InputArray&amp;: проксі народжується як тимчасовий об’єкт</tspan><tspan x="590.0" dy="16.9">на місці виклику, живе до кінця виразу і не володіє нічим — ані пікселями, ані вектором</tspan></text>
