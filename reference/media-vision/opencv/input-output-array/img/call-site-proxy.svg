<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один параметр приймає різні типи — і жоден із них не копіюється</text>
<text x="190.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">об’єкт того, хто викликає</text>
<text x="590.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тимчасовий проксі на стеку</text>
<text x="985.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">тіло функції в бібліотеці</text>
<rect x="60.0" y="118.0" width="264.0" height="78.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="192.0" y="161.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="192.0" dy="0.0">cv::Mat frame</tspan></text>
<line x1="330.0" y1="157.0" x2="424.0" y2="157.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="118.0" width="320.0" height="78.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="153.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">flags = MAT</tspan><tspan x="590.0" dy="15.6">obj = адреса об’єкта</tspan></text>
<rect x="60.0" y="222.0" width="264.0" height="78.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="192.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="192.0" dy="0.0">cv::UMat gpuFrame</tspan></text>
<line x1="330.0" y1="261.0" x2="424.0" y2="261.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="222.0" width="320.0" height="78.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">flags = UMAT</tspan><tspan x="590.0" dy="15.6">obj = адреса об’єкта</tspan></text>
<rect x="60.0" y="326.0" width="264.0" height="78.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="192.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="192.0" dy="0.0">std::vector&lt;Point2f&gt; pts</tspan></text>
