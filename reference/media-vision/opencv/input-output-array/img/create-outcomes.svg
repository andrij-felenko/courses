<rect x="52.0" y="528.0" width="1056.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Третій випадок — не помилка бібліотеки, а прямий наслідок правила: create міняє</tspan><tspan x="580.0" dy="16.9">сам об’єкт того, хто викликав, і виріз після перевиділення перестає бути вирізом.</tspan><tspan x="580.0" dy="16.9">Жодного попередження не буде — просто результат опиниться не там, де на нього чекають.</tspan></text>
