<rect x="898.0" y="392.0" width="260.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1028.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1028.0" dy="0.0">виняток під час роботи</tspan><tspan x="1028.0" dy="15.6">замість помилки компіляції</tspan></text>
