<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Питання одне — «якого типу цей аргумент?»; місце відповіді мінялося чотири рази</text>
<line x1="60.0" y1="300.0" x2="1240.0" y2="300.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="50.0" y="84.0" width="280.0" height="130.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1999–2006 · C-інтерфейс</tspan><tspan x="190.0" dy="16.9"></tspan><tspan x="190.0" dy="16.9">typedef void CvArr;</tspan><tspan x="190.0" dy="16.9">cvResize(const CvArr* src, ...)</tspan></text>
<line x1="190.0" y1="214.0" x2="190.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="190.0" cy="300.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="50.0" y="336.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">тег лежить у перших 4 байтах</tspan><tspan x="190.0" dy="16.9">самого об’єкта; функція його</tspan><tspan x="190.0" dy="16.9">читає й вгадує тип</tspan></text>
<rect x="50.0" y="452.0" width="280.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="479.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">чужий тип → падіння</tspan><tspan x="190.0" dy="16.9">під час роботи</tspan></text>
<rect x="350.0" y="84.0" width="280.0" height="130.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">2009 · OpenCV 2.0</tspan><tspan x="490.0" dy="16.9"></tspan><tspan x="490.0" dy="16.9">cv::Mat із лічильником</tspan><tspan x="490.0" dy="16.9">resize(const Mat&amp; src, Mat&amp; dst)</tspan></text>
<line x1="490.0" y1="214.0" x2="490.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="490.0" cy="300.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="350.0" y="336.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">тег не потрібен: тип знає</tspan><tspan x="490.0" dy="16.9">компілятор і перевіряє його</tspan><tspan x="490.0" dy="16.9">на місці виклику</tspan></text>
<rect x="350.0" y="452.0" width="280.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="479.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">зате тип мусить бути</tspan><tspan x="490.0" dy="16.9">рівно один</tspan></text>
<rect x="660.0" y="84.0" width="280.0" height="130.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">2011 · OpenCV 2.3</tspan><tspan x="800.0" dy="16.9"></tspan><tspan x="800.0" dy="16.9">class _InputArray</tspan><tspan x="800.0" dy="16.9">resize(InputArray, OutputArray)</tspan></text>
<line x1="800.0" y1="214.0" x2="800.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="800.0" cy="300.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="660.0" y="336.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">тег ставить компілятор</tspan><tspan x="800.0" dy="16.9">у поле flags тимчасового</tspan><tspan x="800.0" dy="16.9">проксі на стеку</tspan></text>
<rect x="660.0" y="452.0" width="280.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="479.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">чужий тип → програма</tspan><tspan x="800.0" dy="16.9">не збереться</tspan></text>
<rect x="970.0" y="84.0" width="280.0" height="130.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="1110.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">2015 · OpenCV 3.0</tspan><tspan x="1110.0" dy="16.9"></tspan><tspan x="1110.0" dy="16.9">вид UMAT + T-API</tspan></text>
<line x1="1110.0" y1="214.0" x2="1110.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<circle cx="1110.0" cy="300.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="970.0" y="336.0" width="280.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1110.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">новий контейнер — новий</tspan><tspan x="1110.0" dy="16.9">рядок у тому самому переліку</tspan><tspan x="1110.0" dy="16.9">видів</tspan></text>
<rect x="970.0" y="452.0" width="280.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="479.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">підписи функцій</tspan><tspan x="1110.0" dy="16.9">не змінилися</tspan></text>
</svg>