<text x="156.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2008</text>
<rect x="202.0" y="276.0" width="718.0" height="34.0" rx="6" fill="#f3eef7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="297.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Опіка переходить до Willow Garage (робототехніка)</tspan></text>
