<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 702" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="702" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто опікувався OpenCV: чверть століття зміни рук</text>
<line x1="178.0" y1="38.0" x2="178.0" y2="604.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="178.0" cy="73.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1999</text>
<rect x="202.0" y="56.0" width="718.0" height="34.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Intel відкриває проєкт: вільна бібліотека зору, щоб було чим</tspan></text>
<rect x="202.0" y="100.0" width="718.0" height="34.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">навантажити процесор (ініціатива Гарі Бредскі)</tspan></text>
<circle cx="178.0" cy="161.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2000</text>
<rect x="202.0" y="144.0" width="718.0" height="34.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Перша публічна альфа — на конференції CVPR</tspan></text>
<circle cx="178.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2001-2005</text>
<rect x="202.0" y="188.0" width="718.0" height="34.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">П'ять бет; бібліотека живе як внутрішня ініціатива</tspan></text>
<circle cx="178.0" cy="249.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2006</text>
<rect x="202.0" y="232.0" width="718.0" height="34.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Реліз 1.0: інтерфейс мовою C, IplImage</tspan></text>
