<text x="156.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2012</text>
<rect x="202.0" y="364.0" width="718.0" height="34.0" rx="6" fill="#eaf4ec" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="385.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Серпень: некомерційний фонд OpenCV.org; щоденну</tspan></text>
<rect x="202.0" y="408.0" width="718.0" height="34.0" rx="6" fill="#eaf4ec" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">розробку веде Itseez</tspan></text>
<circle cx="178.0" cy="469.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2013</text>
<rect x="202.0" y="452.0" width="718.0" height="34.0" rx="6" fill="#eaf4ec" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Вересень: заведено окремий репозиторій opencv_contrib</tspan></text>
<circle cx="178.0" cy="513.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2015</text>
<rect x="202.0" y="496.0" width="718.0" height="34.0" rx="6" fill="#eaf4ec" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="517.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Червень: реліз 3.0 — contrib окремо, UMat</tspan></text>
<circle cx="178.0" cy="557.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2016</text>
<rect x="202.0" y="540.0" width="718.0" height="34.0" rx="6" fill="#fdf1e7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="561.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Травень: Intel купує Itseez</tspan></text>
<circle cx="178.0" cy="601.0" r="6.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="156.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2020</text>
<rect x="202.0" y="584.0" width="718.0" height="34.0" rx="6" fill="#fdf1e7" stroke="#6b7280" stroke-width="1.5"/><text x="561.0" y="605.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">Жовтень: 4.5.0 виходить під ліцензією Apache 2</tspan></text>
<text x="480.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">Заливка = хто опікувався: Intel (1999-2008), Willow Garage (2008-2012),</tspan><tspan x="480.0" dy="15.6">фонд OpenCV.org разом з Itseez (2012-2016), Intel знову як власник Itseez (з 2016).</tspan></text>
