<rect x="40.0" y="155.0" width="210.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">джерела opencv_contrib</tspan></text>
<text x="145.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">те саме дерево</tspan><tspan x="145.0" dy="14.3">у всіх</tspan></text>
<line x1="258.0" y1="130.0" x2="316.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="324.0" y="62.0" width="300.0" height="232.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="474.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">крок конфігурації</text>
<text x="474.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="474.0" dy="0.0">BUILD_LIST=core,imgproc,videoio</tspan><tspan x="474.0" dy="18.6">OPENCV_EXTRA_MODULES_PATH=...</tspan><tspan x="474.0" dy="18.6">WITH_FFMPEG=ON</tspan><tspan x="474.0" dy="18.6">WITH_GSTREAMER=OFF</tspan><tspan x="474.0" dy="18.6">CPU_DISPATCH=AVX2,AVX512_SKX</tspan><tspan x="474.0" dy="18.6">BUILD_SHARED_LIBS=ON</tspan></text>
<text x="474.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="474.0" dy="0.0">звіт конфігурації —</tspan><tspan x="474.0" dy="14.3">єдина правда про бінарник</tspan></text>
<line x1="632.0" y1="130.0" x2="690.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="698.0" y="62.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="88.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">libopencv_core.so.413</tspan></text>
<rect x="698.0" y="116.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">заголовки opencv2/</tspan></text>
<rect x="698.0" y="170.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">OpenCVConfig.cmake</tspan></text>
<rect x="698.0" y="224.0" width="250.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">libopencv_videoio_ffmpeg.so</tspan><tspan x="823.0" dy="14.3">(плагін, якщо замовлено)</tspan></text>
<line x1="40.0" y1="380.0" x2="940.0" y2="380.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<rect x="40.0" y="410.0" width="330.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">той самий рядок у вашому коді:</tspan><tspan x="205.0" dy="15.6">VideoCapture(&quot;rtsp://cam/live&quot;)</tspan></text>
<line x1="378.0" y1="428.0" x2="448.0" y2="402.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="378.0" y1="452.0" x2="448.0" y2="494.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="456.0" y="372.0" width="484.0" height="58.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="698.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="698.0" dy="0.0">збірка з FFmpeg: потік відкрито,</tspan><tspan x="698.0" dy="15.6">кадр у cv::Mat</tspan></text>
<rect x="456.0" y="466.0" width="484.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="698.0" y="491.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="698.0" dy="0.0">збірка без нього: isOpened() == false,</tspan><tspan x="698.0" dy="15.6">жодного повідомлення</tspan></text>
<text x="490.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Номер версії однаковий в обох випадках — він не описує</tspan><tspan x="490.0" dy="15.6">ані набір модулів, ані набір бекендів вводу-виводу.</tspan></text>
