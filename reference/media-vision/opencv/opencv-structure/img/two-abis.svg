<rect x="55.0" y="258.0" width="250.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">алокатор і розкладка</tspan><tspan x="180.0" dy="15.6">cv::Mat версії 4.13</tspan></text>
<rect x="640.0" y="92.0" width="270.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">сторонній плагін</tspan></text>
<line x1="775.0" y1="142.0" x2="775.0" y2="182.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="188.0" width="270.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">libopencv_core.so.412</tspan></text>
<rect x="640.0" y="258.0" width="270.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="285.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">інший алокатор,</tspan><tspan x="775.0" dy="15.6">інша розкладка cv::Mat</tspan></text>
<line x1="312.0" y1="112.0" x2="632.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="132.0" width="288.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="474.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="474.0" dy="0.0">кадр cv::Mat передано в плагін</tspan></text>
<rect x="330.0" y="200.0" width="288.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="474.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="474.0" dy="0.0">деструктор Mat спрацював</tspan><tspan x="474.0" dy="15.6">у чужій версії:</tspan><tspan x="474.0" dy="15.6">чужий лічильник посилань,</tspan><tspan x="474.0" dy="15.6">чужий free()</tspan></text>
<rect x="55.0" y="344.0" width="855.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="482.5" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="482.5" dy="0.0">SONAME різні (413 і 412) — завантажувач тримає обидві бібліотеки; імена символів не конфліктують, а розкладка даних — так</tspan></text>
<text x="490.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Аварія стається не там, де причина: пам'ять уже зіпсовано,</tspan><tspan x="490.0" dy="15.6">а падіння покаже стек зовсім іншого виклику.</tspan></text>
