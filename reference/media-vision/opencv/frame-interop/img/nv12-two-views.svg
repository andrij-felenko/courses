<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">NV12: одна пам'ять, два способи назвати її матрицею</text>
<text x="200.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">як лежить у пам'яті</text>
<rect x="80.0" y="108.0" width="206.0" height="208.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="286.0" y="108.0" width="34.0" height="208.0" rx="6" fill="#f6ddd8" stroke="#c0392b" stroke-width="1.2"/>
<text x="183.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">площина Y</text>
<rect x="80.0" y="316.0" width="240.0" height="30.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порожнеча вирівнювання</text>
<rect x="80.0" y="346.0" width="206.0" height="106.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/>
<rect x="286.0" y="346.0" width="34.0" height="106.0" rx="6" fill="#f6ddd8" stroke="#c0392b" stroke-width="1.2"/>
<text x="183.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">площина UV</text>
<rect x="70.0" y="478.0" width="260.0" height="88.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="200.0" y="502.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">рожеве праворуч — доповнення</tspan><tspan x="200.0" dy="15.6">рядка до кроку;</tspan><tspan x="200.0" dy="15.6">сіре — зсув початку</tspan><tspan x="200.0" dy="15.6">другої площини</tspan></text>
<text x="745.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">як це описати заголовками Mat</text>
<rect x="400.0" y="104.0" width="690.0" height="150.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="2.0"/><text x="745.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">ДВА ЗАГОЛОВКИ: Mat над Y і Mat над UV</tspan><tspan x="745.0" dy="18.2">cvtColorTwoPlane(y, uv, bgr, COLOR_YUV2BGR_NV12)</tspan><tspan x="745.0" dy="18.2">Кожен заголовок несе власний покажчик і власний крок,</tspan><tspan x="745.0" dy="18.2">тож ані доповнення рядка, ані зсув другої площини</tspan><tspan x="745.0" dy="18.2">нічого не ламають.</tspan></text>
<rect x="400.0" y="288.0" width="690.0" height="176.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="745.0" y="335.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">ОДИН ВИСОКИЙ ЗАГОЛОВОК: Mat(H·3/2, W, CV_8UC1, база, крок)</tspan><tspan x="745.0" dy="18.2">cvtColor(yuv, bgr, COLOR_YUV2BGR_NV12)</tspan><tspan x="745.0" dy="18.2">Опис вважає, що UV — це просто продовження рядків Y.</tspan><tspan x="745.0" dy="18.2">Правда ЛИШЕ коли крок UV дорівнює кроку Y</tspan><tspan x="745.0" dy="18.2">І друга площина починається рівно там, де скінчилася перша.</tspan><tspan x="745.0" dy="18.2">Інакше замість кольору читається порожнеча вирівнювання.</tspan></text>
<rect x="400.0" y="496.0" width="690.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="745.0" y="531.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Апаратні буфери вирівнюють початок кожної площини окремо —</tspan><tspan x="745.0" dy="16.9">саме там високий заголовок і бреше найчастіше,</tspan><tspan x="745.0" dy="16.9">фарбуючи нижню частину кадру рівною кольоровою смугою.</tspan></text>
</svg>