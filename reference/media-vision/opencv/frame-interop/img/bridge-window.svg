<rect x="380.0" y="88.0" width="320.0" height="62.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="115.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">покажчики на площини дійсні —</tspan><tspan x="540.0" dy="16.9">тут і тільки тут живуть заголовки Mat</tspan></text>
<rect x="706.0" y="88.0" width="304.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="858.0" y="115.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="858.0" dy="0.0">пул віддає той самий буфер</tspan><tspan x="858.0" dy="16.9">наступному кадрові</tspan></text>
<rect x="90.0" y="176.0" width="274.0" height="58.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="227.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="227.0" dy="0.0">1 · синхронно</tspan><tspan x="227.0" dy="18.2">0 копій</tspan></text>
<rect x="380.0" y="176.0" width="320.0" height="58.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/><text x="540.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">уся обробка тут;</tspan><tspan x="540.0" dy="16.9">Mat помирає до unmap</tspan></text>
<rect x="90.0" y="262.0" width="274.0" height="58.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="227.0" y="286.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="227.0" dy="0.0">2 · clone()</tspan><tspan x="227.0" dy="18.2">+1 копія кадру</tspan></text>
<rect x="380.0" y="262.0" width="320.0" height="58.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.6"/><text x="540.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">у вікні лише clone()</tspan></text>
