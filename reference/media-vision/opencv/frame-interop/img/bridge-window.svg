<rect x="90.0" y="348.0" width="274.0" height="58.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/><text x="227.0" y="373.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6100" text-anchor="middle" font-weight="700"><tspan x="227.0" dy="0.0">3 · тримати GstSample</tspan><tspan x="227.0" dy="16.9">0 копій, −1 буфер із пулу</tspan></text>
<rect x="380.0" y="348.0" width="630.0" height="58.0" rx="6" fill="#fdf3dc" stroke="#b8860b" stroke-width="1.6"/><text x="695.0" y="373.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">вікно не закривається, доки тримаєш семпл:</tspan><tspan x="695.0" dy="16.9">буфер не повертається в пул</tspan></text>
<rect x="90.0" y="438.0" width="920.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="550.0" y="466.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Заголовок над чужим буфером мусить померти раніше за unmap: інакше або чесна копія, або притриманий буфер із пулу.</tspan></text>
