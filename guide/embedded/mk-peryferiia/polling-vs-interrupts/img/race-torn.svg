<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порвате читання: чому спільна змінна потребує захисту</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">16-бітне число на 8-бітному ядрі читається двома тактами — між ними влазить ISR</text>
<text x="150.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1) loop() читає старший байт</text>
<rect x="150.0" y="112.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="195.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">hi</text><text x="195.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">0x01</text>
<rect x="250.0" y="112.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="295.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">lo</text><text x="295.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">0xFF</text>
<text x="360.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">значення = 0x01FF (511)</text>
<text x="150.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2) тут спрацьовує ISR: turns++  →  0x01FF стає 0x0200</text>
<rect x="150.0" y="204.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="195.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">hi</text><text x="195.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0x02</text>
<rect x="250.0" y="204.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">lo</text><text x="295.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0x00</text>
<text x="360.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">у пам'яті вже 0x0200 (512)</text>
<text x="150.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3) loop() дочитує молодший байт — уже НОВИЙ</text>
<rect x="150.0" y="296.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="195.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">hi (стар.)</text><text x="195.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">0x01</text>
<rect x="250.0" y="296.0" width="90.0" height="40.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">lo (нов.)</text><text x="295.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0x00</text>
<rect x="535.0" y="296.2" width="230.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">склеїлось 0x0100 = 256</tspan><tspan x="650.0" dy="15.6">— НЕ 511 і НЕ 512</tspan></text>
<text x="650.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лік: читати під критичною секцією</text>
<text x="650.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(коротко заборонити переривання)</text>
</svg>