<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 402" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="402" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типові задачі на осі опитування ↔ переривання</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">де лягає кожна — і чому</text>
<line x1="90.0" y1="100.0" x2="850.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="90.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ОПИТУВАННЯ</text>
<text x="850.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">ПЕРЕРИВАННЯ</text>
<line x1="90" y1="100" x2="856" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="135.6" cy="100.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<line x1="135.6" y1="94.0" x2="135.6" y2="80.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="135.6" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Навігація меню</text>
<text x="135.6" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">спокійно — опитуванням</text>
<circle cx="318.0" cy="100.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<line x1="318.0" y1="106.0" x2="318.0" y2="124.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="318.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Кнопка під палець</text>
<text x="318.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">будь-як; усунути брязкіт</text>
<circle cx="470.0" cy="100.0" r="6.0" fill="#ffffff" stroke="#8a5a00" stroke-width="2.4"/>
<line x1="470.0" y1="94.0" x2="470.0" y2="80.0" stroke="#8a5a00" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="470.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle" font-weight="700">Читання давача 100 мс</text>
<text x="470.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">найкраще — апаратним таймером</text>
<circle cx="652.4" cy="100.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<line x1="652.4" y1="106.0" x2="652.4" y2="124.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="652.4" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Лічильник імпульсів</text>
<text x="652.4" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">інакше проґавиш між перевірками</text>
<circle cx="804.4" cy="100.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<line x1="804.4" y1="94.0" x2="804.4" y2="80.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="804.4" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Аварійний стоп</text>
<text x="804.4" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вмить + не можна проґавити</text>
<rect x="60.0" y="300.0" width="820.0" height="66.0" rx="10" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/>
<text x="470.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прийом по UART і енкодер — посередині: ГІБРИД</text>
<text x="470.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(залізо ловить перериванням у буфер, ви спокійно опитуєте буфер).</text>
</svg>