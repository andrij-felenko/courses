<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер: ISR кладе (head), loop бере (tail)</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">один виробник, один споживач — по одному індексу на кожного, без замка</text>
<circle cx="450.0" cy="139.0" r="22.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<circle cx="517.9" cy="167.1" r="22.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="517.9" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">1</text>
<circle cx="546.0" cy="235.0" r="22.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="546.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">2</text>
<circle cx="517.9" cy="302.9" r="22.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="517.9" y="307.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">3</text>
<circle cx="450.0" cy="331.0" r="22.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="450.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">4</text>
<circle cx="382.1" cy="302.9" r="22.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="382.1" y="307.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5</text>
<circle cx="354.0" cy="235.0" r="22.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="354.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">6</text>
<circle cx="382.1" cy="167.1" r="22.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="382.1" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">7</text>
<text x="550.4" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">head</text>
<text x="550.4" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">ISR пише сюди</text>
<line x1="550.4" y1="156.6" x2="522.1" y2="162.9" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.3" y="339.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">tail</text>
<text x="345.3" y="355.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">loop() читає</text>
<line x1="341.3" y1="333.7" x2="377.9" y2="307.1" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="100.0" width="200.0" height="70.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="130.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ISR (виробник)</text>
<text x="130.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пише buf[head],</text>
<text x="130.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">потім head++</text>
<rect x="670.0" y="100.0" width="200.0" height="70.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="770.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">loop() (споживач)</text>
<text x="770.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">читає buf[tail],</text>
<text x="770.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">потім tail++</text>
<rect x="60.0" y="372.0" width="780.0" height="46.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="450.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен індекс змінює ЛИШЕ свій власник → запис одного не рве іншого (порядок важливий).</text>
<text x="450.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Порожньо: head == tail. Повно: наступний head наздогнав tail (одна комірка — жертва).</text>
</svg>