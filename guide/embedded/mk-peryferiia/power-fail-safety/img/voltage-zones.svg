<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три зони напруги живлення: де чіп служить, де шкодить, де мовчить</text>
<text x="470.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Небезпечна не мертва зона, а сіра: чіп ще ввімкнений, але рахує неправильно</text>
<rect x="250.0" y="80.0" width="360.0" height="150.0" rx="0" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/>
<rect x="250.0" y="230.0" width="360.0" height="95.0" rx="0" fill="#fff3d6" stroke="#b9770e" stroke-width="1.8"/>
<rect x="250.0" y="325.0" width="360.0" height="110.0" rx="0" fill="#eceff2" stroke="#6b7280" stroke-width="1.6"/>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ЗОНА НОРМИ</text>
<text x="430.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">логіка коректна: пороги на місці,</text>
<text x="430.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">такти стабільні, запис надійний</text>
<text x="430.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">3.3 В  →  робочий діапазон</text>
<text x="430.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="middle" font-weight="700">СІРА ЗОНА — НЕБЕЗПЕЧНА</text>
<text x="430.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">пороги пливуть · такти затинаються</text>
<text x="430.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">запис у пам'ять може спотворитися</text>
<text x="430.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">МЕРТВА ЗОНА</text>
<text x="430.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чіп просто не працює (безпечно)</text>
<line x1="210.0" y1="435.0" x2="210.0" y2="74.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="196.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 196.0 257.5)">напруга живлення</text>
<line x1="610.0" y1="230.0" x2="680.0" y2="230.0" stroke="#b9770e" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="684.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="start" font-weight="700">вхід у сіру зону</text>
<line x1="610.0" y1="325.0" x2="680.0" y2="325.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="684.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">чіп гасне</text>
<text x="470.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Задача захисту — не дати пристрою лишатися в жовтій зоні «живим, але хворим».</text>
</svg>