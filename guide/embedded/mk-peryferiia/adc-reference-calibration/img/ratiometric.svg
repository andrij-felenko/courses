<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Раціометричне ввімкнення: спільна Vref скорочується</text>
<line x1="90.0" y1="70.0" x2="750.0" y2="70.0" stroke="#7c3aed" stroke-width="3.0"/>
<text x="420.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">одна шина Vref живить ОБОХ</text>
<line x1="230.0" y1="70.0" x2="230.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="213.7" y="134.5" width="32.5" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">R1</tspan></text>
<line x1="230.0" y1="172.0" x2="230.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="188.7" y="221.5" width="82.7" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">R2 (давач)</tspan></text>
<line x1="230.0" y1="259.0" x2="230.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="230.0" y1="300.0" x2="230.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="212.0" y1="310.0" x2="248.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="218.0" y1="315.0" x2="242.0" y2="315.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="224.0" y1="320.0" x2="236.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="230.0" y1="215.0" x2="480.0" y2="215.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="480.0" y1="215.0" x2="540.0" y2="215.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="355.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Vsig = Vref · R2/(R1+R2)</text>
<rect x="545.0" y="165.0" width="150.0" height="90.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">АЦП</text>
<text x="620.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">код = Vsig/Vref</text>
<text x="620.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">× макс</text>
<line x1="620.0" y1="70.0" x2="620.0" y2="165.0" stroke="#7c3aed" stroke-width="2.0"/>
<rect x="151.1" y="298.8" width="537.8" height="46.5" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="318.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">код = (Vref · R2/(R1+R2)) / Vref × макс  =  R2/(R1+R2) × макс  →  Vref випала.</tspan><tspan x="420.0" dy="15.0">Вимір залежить ЛИШЕ від відношення резисторів — точність Vref більше не важить.</tspan></text>
</svg>