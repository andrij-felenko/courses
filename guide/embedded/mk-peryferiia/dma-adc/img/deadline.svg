<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійний буфер як дедлайн: спорожнити раніше, ніж наповниться сусід</text>
<text x="70.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">DMA наповнює половину за t_half (рівно, апаратно)</text>
