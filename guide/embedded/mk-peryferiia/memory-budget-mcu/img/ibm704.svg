<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">IBM 704 (1954): світ, де народилося слово «bss»</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожне з 4096 слів пам'яті — на вагу золота, тож пам'ять рахували поштучно</text>
<rect x="60.0" y="90.0" width="360.0" height="250.0" rx="12" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вершина обчислень середини 1950-х</text>
<rect x="76.0" y="108.0" width="328.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">рахує на ЕЛЕКТРОННИХ ЛАМПАХ</tspan><tspan x="240.0" dy="14.3">транзистор у комп'ютерах щойно зароджувався</tspan></text>
<rect x="76.0" y="182.0" width="328.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">слово завдовжки 36 бітів</tspan><tspan x="240.0" dy="15.6">пам'ять мірялася словами, не байтами</tspan></text>
<rect x="76.0" y="256.0" width="328.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">уся пам'ять — лише 4096 слів</tspan><tspan x="240.0" dy="15.6">≈ 18 КБ на феритових осердях</tspan></text>
<rect x="500.0" y="130.0" width="320.0" height="170.0" rx="12" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="2.0"/>
<text x="660.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b3fa0" text-anchor="middle" font-weight="700">Сьогодні: один буфер у .bss</text>
<rect x="516.0" y="146.0" width="288.0" height="64.0" rx="6" fill="#ffffff" stroke="#7b3fa0" stroke-width="1.5"/><text x="660.0" y="174.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">uint8_t буфер[1024];</tspan><tspan x="660.0" dy="16.9">ви кладете його, не думаючи</tspan></text>
<rect x="516.0" y="222.0" width="288.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="249.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">1024 байти НЕ вмістилися б</tspan><tspan x="660.0" dy="15.6">у пам'ять 704 й наполовину</tspan></text>
<line x1="420.0" y1="300.0" x2="500.0" y2="260.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">та сама потреба — ощаджувати пам'ять</text>
</svg>