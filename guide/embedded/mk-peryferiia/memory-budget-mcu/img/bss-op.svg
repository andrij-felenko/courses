<rect x="80.0" y="350.0" width="740.0" height="44.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Symbol = ім'я-мітка ділянки · Block = суцільний блок слів.   Уся різниця між BSS і командою даних — чи кладемо в блок значення; це й є сьогоднішня межа між .bss і .data.</tspan></text>
