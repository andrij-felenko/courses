<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві пам'яті — два різні питання бюджету</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Flash тримає незмінне, RAM — усе, що живе під час роботи</text>
<rect x="110.0" y="90.0" width="300.0" height="290.0" rx="10" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/>
<text x="260.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">FLASH — нелетка, велика, повільніша</text>
<rect x="124.0" y="104.0" width="272.0" height="76.7" rx="6" fill="#e8eef9" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">.text</tspan><tspan x="260.0" dy="16.9">код програми</tspan></text>
<rect x="124.0" y="194.7" width="272.0" height="80.7" rx="6" fill="#e9f7ef" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">.rodata</tspan><tspan x="260.0" dy="16.9">сталі, рядки, таблиці</tspan></text>
<rect x="124.0" y="285.3" width="272.0" height="82.7" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">.data (копія)</tspan><tspan x="260.0" dy="15.6">початкові значення змінних</tspan></text>
<rect x="490.0" y="90.0" width="300.0" height="290.0" rx="10" fill="#fdf6e3" stroke="#333333" stroke-width="2.0"/>
<text x="640.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">RAM (SRAM) — летка, мала, швидка</text>
<rect x="504.0" y="324.0" width="272.0" height="44.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">.data + .bss — статичні змінні</tspan></text>
<text x="640.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">↑ купа росте вгору</text>
<text x="640.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">↓ стек росте вниз</text>
<rect x="504.0" y="102.0" width="272.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="121.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">стек (на старті — згори)</tspan></text>
<text x="640.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вільне місце</text>
<line x1="410.0" y1="331.7" x2="490.0" y2="346.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="289.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">старт: копія Flash→RAM</text>
<rect x="110.0" y="402.0" width="300.0" height="56.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Бюджет Flash = .text + .rodata + .data</tspan><tspan x="260.0" dy="15.6">рахують РАЗ — при лінкуванні</tspan></text>
<rect x="490.0" y="402.0" width="300.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Бюджет RAM = .data + .bss + купа + стек</tspan><tspan x="640.0" dy="14.3">і при лінкуванні, і ПІД ЧАС роботи</tspan></text>
</svg>