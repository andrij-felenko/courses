<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина graceful-згортання: від «не нашкодь» до «натисни тригер»</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порядок не випадковий — кожен крок вимикає менш термінову загрозу за попередній</text>
<rect x="90.0" y="90.0" width="780.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="106.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Безпечний стан виходів</text>
<text x="106.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">мотори стоп, нагрів off, клапан у безпеку — поки ще керуємо</text>
<line x1="480.0" y1="146.0" x2="480.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="160.0" width="780.0" height="56.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.8"/>
<text x="106.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="700">2. Зберегти критичний стан</text>
<text x="106.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">лічильники, незбережені дані → NVS/FRAM (як при power-fail)</text>
<line x1="480.0" y1="216.0" x2="480.0" y2="230.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="230.0" width="780.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="106.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">3. Згорнути зв'язок із світом</text>
<text x="106.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">закрити сокети, сказати «йду на reset» вузлам поруч</text>
<line x1="480.0" y1="286.0" x2="480.0" y2="300.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="300.0" width="780.0" height="56.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="106.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">4. Лишити слід</text>
<text x="106.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">причина reset + лічильник перезавантажень — щоб діагностувати потім</text>
<line x1="480.0" y1="356.0" x2="480.0" y2="370.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="370.0" width="780.0" height="56.0" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.8"/>
<text x="106.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b21b6" text-anchor="start" font-weight="700">5. Flush памʼяті й тригер</text>
<text x="106.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">DSB: дочекатись запис-буферів → esp_restart / NVIC_SystemReset</text>
<line x1="60.0" y1="96.0" x2="60.0" y2="426.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">терміновість ↓</text>
<rect x="68.2" y="432.0" width="823.5" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="480.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Спершу те, що шкодить фізично (виходи), тоді те, що губиться назавжди (стан), і лише наприкінці — сам reset.</tspan></text>
</svg>