<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жорсткий reset проти graceful: однакова мить, різний наслідок</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«пора перезавантажитись» — питання лише в тому, ЯК саме обірвати поточну роботу</text>
<rect x="40.0" y="104.0" width="200.0" height="24.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">ЖОРСТКИЙ RESET</tspan></text>
<line x1="70.0" y1="148.0" x2="880.0" y2="148.0" stroke="#d0d5dd" stroke-width="1.2"/>
<rect x="70.0" y="130.0" width="180.0" height="36.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="160.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">звичайна робота</text>
<line x1="250.0" y1="118.0" x2="250.0" y2="184.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="250.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">обрив</text>
<rect x="250.0" y="130.0" width="30.0" height="36.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<text x="345.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">≈ миттєво new boot</text>
<text x="310.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">✗ мотор лишився крутитись</text>
<text x="310.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">✗ лог недописаний — сміття у флеш</text>
<text x="310.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">✗ сокет завис, давач у дивному стані</text>
<rect x="40.0" y="294.0" width="200.0" height="24.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">GRACEFUL RESET</tspan></text>
<line x1="70.0" y1="338.0" x2="880.0" y2="338.0" stroke="#d0d5dd" stroke-width="1.2"/>
<rect x="70.0" y="320.0" width="180.0" height="36.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="160.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">звичайна робота</text>
<line x1="250.0" y1="308.0" x2="250.0" y2="374.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="250.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">рішення «reset»</text>
<rect x="260.0" y="320.0" width="96.0" height="36.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="308.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="308.0" dy="0.0">безпечний</tspan><tspan x="308.0" dy="12.3">стан</tspan></text>
<rect x="362.0" y="320.0" width="96.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">зберегти</tspan><tspan x="410.0" dy="12.3">стан</tspan></text>
<rect x="464.0" y="320.0" width="96.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="512.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="512.0" dy="0.0">закрити</tspan><tspan x="512.0" dy="12.3">зв'язок</tspan></text>
<rect x="566.0" y="320.0" width="96.0" height="36.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="614.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="614.0" dy="0.0">слід +</tspan><tspan x="614.0" dy="12.3">flush</tspan></text>
<rect x="668.0" y="320.0" width="30.0" height="36.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.2"/>
<text x="683.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">↻</text>
<text x="480.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">коротке, кероване вікно згортання — і лише тоді new boot</text>
<rect x="58.2" y="424.0" width="823.5" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Та сама подія. Жорсткий reset рубає посеред дії; graceful спершу впорядковано згортає те, що може нашкодити.</tspan></text>
</svg>