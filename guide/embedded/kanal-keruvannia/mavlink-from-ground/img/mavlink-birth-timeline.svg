<text x="660.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">мету вичерпано — а протокол житиме далі →</text>
<rect x="102.9" y="424.2" width="754.2" height="31.5" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">стандарт рідко проєктують як стандарт: він виростає з простого, вільного інструмента, що розв'язав спільний біль</tspan></text>
