<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймаємо лише СВІЙ ACK: фільтр за джерелом і командою</text>
<rect x="85.0" y="74.0" width="250.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ACK  src=(1,1)  cmd=400</tspan></text>
<text x="210.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">той борт, та команда — це наш</text>
<line x1="340.0" y1="90.0" x2="545.0" y2="90.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="85.0" y="140.0" width="250.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="210.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ACK  src=(1,1)  cmd=176</tspan></text>
<text x="210.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">той борт, ЧУЖА команда (режим)</text>
<line x1="340.0" y1="156.0" x2="545.0" y2="156.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="85.0" y="206.0" width="250.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="210.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ACK  src=(1,158) cmd=400</tspan></text>
<text x="210.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">камера (COMP 158), не автопілот</text>
<line x1="340.0" y1="222.0" x2="545.0" y2="222.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="85.0" y="272.0" width="250.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="210.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ACK  src=(2,1)  cmd=400</tspan></text>
<text x="210.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">інший борт у мережі (SYS 2)</text>
<line x1="340.0" y1="288.0" x2="545.0" y2="288.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="545.0" y="78.0" width="170.0" height="244.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="630.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">ФІЛЬТР</tspan><tspan x="630.0" dy="14.3">src.sys == target.sys</tspan><tspan x="630.0" dy="14.3">src.comp == target.comp</tspan><tspan x="630.0" dy="14.3">ack.command == sent</tspan></text>
<line x1="715.0" y1="200.0" x2="830.0" y2="200.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="815.0" y="176.2" width="110.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">обробити</tspan><tspan x="870.0" dy="15.6">результат</tspan></text>
<rect x="33.6" y="388.5" width="872.7" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="407.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">пастка: узяти ПЕРШИЙ-ліпший COMMAND_ACK — легко сплутати відповідь камери чи сусіднього апарата зі своєю; звіряй джерело І номер команди</tspan></text>
</svg>