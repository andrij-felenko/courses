<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Борт і земля — два світи, тому й різні мови</text>
<rect x="34.0" y="54.0" width="330.0" height="246.0" rx="10" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="199.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">БОРТ — прошивка (C / C++)</text>
<text x="52.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• жорсткий реальний час</text>
<text x="52.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• крихти пам'яті, без malloc</text>
<text x="52.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• немає ОС — код керує залізом</text>
<text x="52.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• точний контроль такту й байта</text>
<rect x="48.0" y="220.0" width="302.0" height="46.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="199.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміни → скомпілюй → проший → перевір</text>
<text x="199.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">цикл спроби — повільний</text>
<rect x="396.0" y="54.0" width="330.0" height="246.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="561.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗЕМЛЯ — скрипт (Python)</text>
<text x="414.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• звичайний ПК, ОС, багато пам'яті</text>
<text x="414.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• немає жорстких дедлайнів</text>
<text x="414.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• готові бібліотеки (pip)</text>
<text x="414.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• цінується швидкість написання</text>
<rect x="410.0" y="220.0" width="302.0" height="46.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="561.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">зміни → запусти</text>
<text x="561.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">цикл спроби — миттєвий</text>
</svg>