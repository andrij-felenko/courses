<rect x="300.0" y="175.0" width="150.0" height="100.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="375.0" y="213.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">МІКШЕР</tspan><tspan x="375.0" dy="15.6">розкладає за</tspan><tspan x="375.0" dy="15.6">геометрією апарата</tspan></text>
