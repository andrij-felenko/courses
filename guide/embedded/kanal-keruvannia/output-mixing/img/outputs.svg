<text x="450.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">для контролера мотори (через ESC) і серво — однакові пронумеровані «виходи»</text>
