<line x1="450.0" y1="225.0" x2="528.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="120.0" width="330.0" height="46.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
