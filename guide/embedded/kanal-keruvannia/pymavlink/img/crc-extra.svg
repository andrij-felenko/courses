<text x="390.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">інший опис (додали поле) →  CRC_EXTRA інший →  сума не зійшлась →  мовчки відкинуто</text>
