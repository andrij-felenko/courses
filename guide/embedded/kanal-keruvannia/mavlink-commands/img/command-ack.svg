<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Команда → обов'язкове підтвердження</text>
<rect x="75.0" y="123.0" width="150.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="144.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">твій код</tspan></text>
<rect x="535.0" y="123.0" width="150.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="144.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">апарат</tspan></text>
<line x1="230.0" y1="122.0" x2="530.0" y2="122.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">COMMAND_LONG: command=MAV_CMD_…, param1..7</text>
<line x1="530.0" y1="162.0" x2="230.0" y2="162.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">COMMAND_ACK: result = ?</text>
<rect x="40.0" y="235.0" width="225.0" height="56.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="152.5" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">ACCEPTED</tspan><tspan x="152.5" dy="15.0">виконано</tspan></text>
<rect x="275.0" y="235.0" width="225.0" height="56.0" rx="6" fill="#fef6e7" stroke="#e9d8a6" stroke-width="1.5"/><text x="387.5" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="387.5" dy="0.0">DENIED / TEMPORARILY_REJECTED</tspan><tspan x="387.5" dy="15.0">відмовлено — апарат не готовий</tspan></text>
<rect x="510.0" y="235.0" width="225.0" height="56.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="622.5" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">FAILED</tspan><tspan x="622.5" dy="15.0">почав, але не вдалося</tspan></text>
<text x="380.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ACK не прийшов → збільш confirmation і повтори ту саму команду</text>
</svg>