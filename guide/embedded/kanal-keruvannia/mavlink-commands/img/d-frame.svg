<text x="30.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">msgid — 24 біти (16 млн типів). Підпис є лише коли в incompat_flags виставлено біт 0x01. Хвіст нулів у payload обрізають.</text>
<text x="430.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">v2 додає два байти прапорців, розширює msgid з 1 до 3 байтів і дозволяє підпис — але тіло повідомлення й спосіб рахувати CRC ті самі. Старий парсер відрізняє версії</tspan><tspan x="430.0" dy="15.0">за першим байтом: 0xFE → v1, 0xFD → v2.</tspan></text>
