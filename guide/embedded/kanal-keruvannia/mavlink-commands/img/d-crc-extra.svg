<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC_EXTRA: підпис самого визначення повідомлення</text>
<rect x="60.0" y="70.0" width="300.0" height="92.0" rx="6" fill="#eef2fb" stroke="#c3cef0" stroke-width="1.5"/><text x="210.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Відправник (нова прошивка)</tspan><tspan x="210.0" dy="15.0">ATTITUDE {roll, pitch, yaw,</tspan><tspan x="210.0" dy="15.0"> rollspeed, pitchspeed, yawspeed}</tspan><tspan x="210.0" dy="15.0">CRC_EXTRA = 39</tspan></text>
<rect x="460.0" y="70.0" width="300.0" height="92.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="610.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Приймач (стара прошивка)</tspan><tspan x="610.0" dy="15.0">ATTITUDE {roll, pitch, yaw}</tspan><tspan x="610.0" dy="15.0"></tspan><tspan x="610.0" dy="15.0">CRC_EXTRA = 211</tspan></text>
<line x1="360.0" y1="116.0" x2="460.0" y2="116.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кадр із CRC, порахованим із 39</text>
<rect x="210.0" y="200.0" width="400.0" height="96.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="410.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">приймач бере той самий байтовий CRC кадру,</tspan><tspan x="410.0" dy="15.6">але додає в кінець СВІЙ CRC_EXTRA = 211,</tspan><tspan x="410.0" dy="15.6">а не 39 → підсумкові CRC не збігаються →</tspan><tspan x="410.0" dy="15.6">кадр відкинуто як «чуже» визначення.</tspan></text>
<text x="410.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">CRC_EXTRA — це хеш назви повідомлення й типів+імен усіх полів, вкарбований у контрольну суму. Розійшлися визначення на двох кінцях — кадр не пройде CRC, замість того щоб тихо</tspan><tspan x="410.0" dy="15.0">розкластися в сміття. Дешева перевірка сумісності «за вартість одного байта».</tspan></text>
</svg>