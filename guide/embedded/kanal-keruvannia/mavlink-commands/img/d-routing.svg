<text x="275.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">HEARTBEAT від кожного comp</text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Кожне повідомлення має адресу відправника (sysid/compid у заголовку) і — для команд — адресу отримувача (target_system/target_component у тілі). target=0 означає «всім». Маршрутизатор на</tspan><tspan x="410.0" dy="14.3">борту роздає кадр потрібному компонентові; тому команду камері й команду автопілоту не сплутати.</tspan></text>
