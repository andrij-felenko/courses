<rect x="520.0" y="110.0" width="120.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">камера</tspan><tspan x="580.0" dy="14.3">comp 100</tspan></text>
