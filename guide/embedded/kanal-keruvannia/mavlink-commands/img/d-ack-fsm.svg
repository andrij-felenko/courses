<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат відправника: команда → ACK</text>
<rect x="60.0" y="70.0" width="200.0" height="54.0" rx="6" fill="#eef2fb" stroke="#c3cef0" stroke-width="1.5"/><text x="160.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Надіслати кадр</tspan><tspan x="160.0" dy="15.0">(confirmation = № спроби)</tspan></text>
<rect x="60.0" y="170.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Чекати ACK</tspan><tspan x="160.0" dy="15.0">(таймер + читати потік)</tspan></text>
<line x1="160.0" y1="124.0" x2="160.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="197.0" x2="380.0" y2="197.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ACK, command збігся</text>
<rect x="380.0" y="170.0" width="180.0" height="54.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="470.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Який result?</tspan></text>
<rect x="620.0" y="70.0" width="210.0" height="54.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="725.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">ACCEPTED / DENIED /</tspan><tspan x="725.0" dy="13.7">UNSUPPORTED / FAILED</tspan><tspan x="725.0" dy="13.7">остаточно — вихід, віддати код</tspan></text>
<rect x="620.0" y="170.0" width="210.0" height="54.0" rx="6" fill="#fef6e7" stroke="#e9d8a6" stroke-width="1.5"/><text x="725.0" y="193.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">IN_PROGRESS</tspan><tspan x="725.0" dy="13.7">відсунути дедлайн, чекати далі</tspan></text>
<rect x="620.0" y="270.0" width="210.0" height="54.0" rx="6" fill="#fef6e7" stroke="#e9d8a6" stroke-width="1.5"/><text x="725.0" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">TEMPORARILY_REJECTED</tspan><tspan x="725.0" dy="13.7">зайнятий — коротка пауза, повтор</tspan></text>
<line x1="560.0" y1="190.0" x2="620.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="560.0" y1="197.0" x2="620.0" y2="197.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="560.0" y1="204.0" x2="620.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="120.0" y1="224.0" x2="120.0" y2="300.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="126.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">таймаут</text>
<rect x="60.0" y="300.0" width="200.0" height="54.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="160.0" y="331.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Спроб &lt; max_tries?</tspan></text>
<line x1="60.0" y1="314.0" x2="30.0" y2="314.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="30.0" y1="314.0" x2="30.0" y2="97.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="30.0" y1="97.0" x2="60.0" y2="97.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="24.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">так: confirmation+1</text>
<line x1="260.0" y1="327.0" x2="380.0" y2="327.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ні</text>
<rect x="380.0" y="300.0" width="180.0" height="54.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="470.0" y="323.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Здатися: −1 нагору</tspan><tspan x="470.0" dy="14.3">(лінк мертвий)</tspan></text>
<text x="430.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Дві опори коректності: ACK беруть лише той, у якого поле command збіглося з надісланим (інакше чужий ACK видасть себе за свій), і саму дію тримають ідемпотентною, щоб зайвий</tspan><tspan x="430.0" dy="14.3">повтор після загубленого ACK не виконав її вдруге.</tspan></text>
</svg>