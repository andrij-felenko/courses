<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Координата: float проти масштабованого int32</text>
<rect x="50.0" y="70.0" width="340.0" height="150.0" rx="6" fill="#fdecea" stroke="#e7b6b0" stroke-width="1.5"/><text x="220.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">COMMAND_LONG · float32</tspan><tspan x="220.0" dy="15.6"></tspan><tspan x="220.0" dy="15.6">50.4501° → зберігається як float</tspan><tspan x="220.0" dy="15.6">мантиса 24 біти ≈ 7 знач. цифр</tspan><tspan x="220.0" dy="15.6">крок біля 50° ≈ 0.0000038°</tspan><tspan x="220.0" dy="15.6">≈ 0.4 м похибки квантування</tspan><tspan x="220.0" dy="15.6">…а після арифметики — гірше</tspan></text>
<rect x="430.0" y="70.0" width="340.0" height="150.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="600.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">COMMAND_INT · int32 × 10⁷</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">50.4501° × 10⁷ = 504501000</tspan><tspan x="600.0" dy="15.6">ціле, влазить у int32 (±214°)</tspan><tspan x="600.0" dy="15.6">крок = 10⁻⁷° ≈ 1.1 см</tspan><tspan x="600.0" dy="15.6">точно й однаково скрізь на Землі</tspan><tspan x="600.0" dy="15.6">жодного дрейфу від float-арифметики</tspan></text>
<text x="410.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">float має сталу кількість значущих цифр, тож біля великих градусів абсолютний крок стає метрами. Масштабоване ціле фіксує крок у 10⁻⁷° по всій планеті — тому координатні команди й точки місій</tspan><tspan x="410.0" dy="15.0">шлють через *_INT, а не через float.</tspan></text>
</svg>