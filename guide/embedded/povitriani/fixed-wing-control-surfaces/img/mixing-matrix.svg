<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікшер — це множення на матрицю:  s = M · u</text>
<rect x="52.1" y="50.6" width="115.8" height="78.8" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="70.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Команди осей u</tspan><tspan x="110.0" dy="15.6">[ roll ]</tspan><tspan x="110.0" dy="15.6">[ pitch ]</tspan><tspan x="110.0" dy="15.6">[ yaw ]</tspan></text>
<text x="110.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">від контролера (−1…+1)</text>
<text x="240.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Звичайний літак</text>
<path d="M 256 113 q -8 0 -8 8 v 58 q 0 8 8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<path d="M 344 113 q 8 0 8 8 v 58 q 0 8 -8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="300.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1  0  0</text>
<text x="300.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0  1  0</text>
<text x="300.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0  0  1</text>
<line x1="360.0" y1="150.0" x2="420.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.7" y="119.3" width="98.7" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">ail  = roll</tspan><tspan x="490.0" dy="15.0">ele  = pitch</tspan><tspan x="490.0" dy="15.0">rud  = yaw</tspan></text>
<text x="300.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кожна вісь → своя поверхня (одинична M)</text>
<text x="240.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Елевони (крило)</text>
<path d="M 256 253 q -8 0 -8 8 v 38 q 0 8 8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<path d="M 344 253 q 8 0 8 8 v 38 q 0 8 -8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="300.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+1  +1   0</text>
<text x="300.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">-1  +1   0</text>
<line x1="360.0" y1="280.0" x2="420.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="417.7" y="256.8" width="144.5" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="276.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">left  = +roll+pitch</tspan><tspan x="490.0" dy="15.0">right = -roll+pitch</tspan></text>
<text x="300.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крен різними знаками, тангаж — спільно</text>
<text x="240.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">V-подібний хвіст</text>
<path d="M 256 373 q -8 0 -8 8 v 38 q 0 8 8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<path d="M 344 373 q 8 0 8 8 v 38 q 0 8 -8 8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="300.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0  +1  +1</text>
<text x="300.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0  +1  -1</text>
<line x1="360.0" y1="400.0" x2="420.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="421.0" y="376.8" width="138.0" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="396.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">left  = +pitch+yaw</tspan><tspan x="490.0" dy="15.0">right = +pitch-yaw</tspan></text>
<text x="300.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тангаж синхронно, курс різнойменно</text>
<rect x="73.7" y="442.9" width="612.5" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="461.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Геометрична плата V-хвоста: поверхня під кутом Γ (≈30°) віддає в тангаж лише cos Γ, у курс — sin Γ,</tspan><tspan x="380.0" dy="13.7">тож керморулі мусять ходити більше. Уся відмінність апаратів — у матриці M; контролер незмінний.</tspan></text>
</svg>