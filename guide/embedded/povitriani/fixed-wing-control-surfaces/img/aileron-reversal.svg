<rect x="48.8" y="392.9" width="642.4" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Момент скруту ∝ V², жорсткість крила — стала. На швидкості реверсу скрут віднімає стільки ж підйому,</tspan><tspan x="370.0" dy="13.7">скільки елерон додав; вище — більше: Cl_δa проходить нуль і міняє знак. Реверсом у коді це не виправити.</tspan></text>
