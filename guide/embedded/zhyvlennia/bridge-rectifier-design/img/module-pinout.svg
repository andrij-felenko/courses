<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Готовий міст: чотири виводи й значки на корпусі</text>
<rect x="90.0" y="90.0" width="200.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="190.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">готовий</text>
<text x="190.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">міст</text>
<path d="M90,90 L116,90 L90,116 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<line x1="115.0" y1="240.0" x2="115.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="115.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">~</text>
<line x1="165.0" y1="240.0" x2="165.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="165.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="215.0" y1="240.0" x2="215.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="215.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">~</text>
<line x1="265.0" y1="240.0" x2="265.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="265.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="190.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">позначки штампують на корпусі</text>
<text x="104.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">зрізаний кут / + поряд</text>
<rect x="428.9" y="81.2" width="262.2" height="97.5" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="101.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e6b3a" text-anchor="middle"><tspan x="560.0" dy="0.0">Як читати виводи:</tspan><tspan x="560.0" dy="16.2">•  два «~» — вхід змінної (байдуже</tspan><tspan x="560.0" dy="16.2">    який куди, полярності немає)</tspan><tspan x="560.0" dy="16.2">•  «+» і «−» — постійний вихід</tspan><tspan x="560.0" dy="16.2">•  ключ-кут / скіс позначає «+»</tspan></text>
<rect x="428.9" y="229.4" width="262.2" height="81.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a1f14" text-anchor="middle"><tspan x="560.0" dy="0.0">Пастка: переплутати «~» і «+/−».</tspan><tspan x="560.0" dy="16.2">Змінну — на пару «~»; вихід беруть</tspan><tspan x="560.0" dy="16.2">з «+»/«−». Подаси мережу на «+/−»</tspan><tspan x="560.0" dy="16.2">— міст у коротке, дим.</tspan></text>
</svg>