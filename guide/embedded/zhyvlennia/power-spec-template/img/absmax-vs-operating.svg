<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гранично-допустиме проти рекомендованого робочого</text>
<rect x="130.0" y="70.0" width="460.0" height="300.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Absolute Maximum Ratings</text>
<text x="360.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">за цим — миттєва або накопичена смерть</text>
<rect x="130.0" y="130.0" width="460.0" height="180.0" rx="8" fill="#fff7e6" stroke="#d68910" stroke-width="2.0"/>
<text x="360.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d68910" text-anchor="middle" font-weight="700">заборонена смуга</text>
<text x="360.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">живе, але поза специфікацією — без гарантій</text>
<rect x="130.0" y="190.0" width="460.0" height="60.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Recommended Operating</text>
<text x="360.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тут працює як у даташиті</text>
<circle cx="210.0" cy="220.0" r="7.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="210.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">точка ТЗ</text>
<line x1="210" y1="212" x2="210" y2="78" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="202.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">запас</text>
<text x="360.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ТЗ цілиться в зелену зону із запасом до червоної межі — не в саму межу</text>
</svg>