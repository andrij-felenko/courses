<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ранні системи максимумів: одне число — різний дозвіл</text>
<line x1="70.0" y1="113.0" x2="720.0" y2="113.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 4"/>
<text x="716.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">фізична стеля деталі (тут вона гине)</text>
<rect x="155.1" y="29.6" width="149.8" height="46.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="230.0" y="49.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">design-center</tspan><tspan x="230.0" dy="16.2">(пізніша система)</tspan></text>
<line x1="230.0" y1="113.0" x2="230.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="204" y1="245" x2="256" y2="245" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="230.0" cy="245.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="264.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">«300 В» = робоча</text>
<line x1="294" y1="113" x2="294" y2="245" stroke="#27ae60" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="300.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-style="italic">запас</text>
<text x="300.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-style="italic">у числі</text>
<text x="230.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">число = робоче;</text>
<text x="230.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">запас на ±10 % мережі</text>
<text x="230.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вже всередині — став як є</text>
<rect x="453.5" y="29.6" width="173.0" height="46.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="540.0" y="49.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">absolute</tspan><tspan x="540.0" dy="16.2">(найдавніша система)</tspan></text>
<line x1="540.0" y1="113.0" x2="540.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="514" y1="113" x2="566" y2="113" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="540.0" cy="113.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="574.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">«300 В»</text>
<circle cx="540.0" cy="270.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="506.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">робоча
точка</text>
<line x1="604" y1="113" x2="604" y2="270" stroke="#c0392b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="610.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">запас</text>
<text x="610.0" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-style="italic">рахує інженер</text>
<text x="540.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">число = гола стеля;</text>
<text x="540.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">весь запас на мережу</text>
<text x="540.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">конструктор накручує сам</text>
<text x="380.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">те саме довідкове «300 В» — у двох системах фізично різний дозвіл; звідси й дві колонки даташита</text>
</svg>