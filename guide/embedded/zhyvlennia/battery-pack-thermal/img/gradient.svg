<rect x="414.0" y="76.0" width="336.0" height="70.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="582.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">Тепло центральних комірок іде</tspan><tspan x="582.0" dy="13.7">крізь усю збірку; крайні</tspan><tspan x="582.0" dy="13.7">охолоджує повітря.</tspan></text>
<rect x="414.0" y="158.0" width="336.0" height="78.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="582.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">Найгарячіша старіє найшвидше:</tspan><tspan x="582.0" dy="13.7">росте її опір, а з ним нагрів.</tspan><tspan x="582.0" dy="13.7">Петля сама себе жене.</tspan></text>
<rect x="414.0" y="248.0" width="336.0" height="70.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/><text x="582.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">Послідовний пакет упирається</tspan><tspan x="582.0" dy="13.7">в найслабшу ланку — тож гине</tspan><tspan x="582.0" dy="13.7">весь, хоч решта ще бадьора.</tspan></text>
<rect x="70.0" y="338.0" width="640.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="390.0" y="355.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Мета охолодження — не лише холод, а РІВНІСТЬ: краще всі при 40°, ніж край 30° і центр 52°.</tspan></text>
