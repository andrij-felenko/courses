<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рахунок дерева: від листя вгору до кореня</text>
<rect x="60.0" y="46.0" width="140.0" height="48.0" rx="6" fill="#fff7e6" stroke="#d6a400" stroke-width="1.5"/><text x="130.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">MCU</tspan><tspan x="130.0" dy="15.6">80 мА @ 3.3 В</tspan></text>
<line x1="205.0" y1="70.0" x2="290.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="126.0" width="140.0" height="48.0" rx="6" fill="#fff7e6" stroke="#d6a400" stroke-width="1.5"/><text x="130.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Давачі</tspan><tspan x="130.0" dy="15.6">15 мА @ 3.3 В</tspan></text>
<line x1="205.0" y1="150.0" x2="290.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="206.0" width="140.0" height="48.0" rx="6" fill="#fff7e6" stroke="#d6a400" stroke-width="1.5"/><text x="130.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Flash</tspan><tspan x="130.0" dy="15.6">5 мА @ 3.3 В</tspan></text>
<line x1="205.0" y1="230.0" x2="290.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="295.0" y="116.0" width="150.0" height="68.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Σ навантаження</tspan><tspan x="370.0" dy="15.6">100 мА @ 3.3 В</tspan><tspan x="370.0" dy="15.6">P = 0.33 Вт</tspan></text>
<line x1="450.0" y1="150.0" x2="505.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="508.0" y="116.0" width="130.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="573.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="573.0" dy="0.0">BUCK</tspan><tspan x="573.0" dy="15.6">η = 90 %</tspan><tspan x="573.0" dy="15.6">додає втрати</tspan></text>
<line x1="640.0" y1="150.0" x2="690.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="693.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">до</text>
<text x="693.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">кореня</text>
<line x1="60.0" y1="290.0" x2="690.0" y2="290.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="70.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">На виході buck:  P_out = 3.3 В × 0.100 А = 0.33 Вт</text>
<text x="70.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">На вході buck:   P_in = 0.33 / 0.90 = 0.367 Вт</text>
<text x="70.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Струм від джерела (3.6 В): 0.367 / 3.6 = 0.102 А</text>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Попит росте знизу вгору; втрати множаться на кожному перетворювачі</text>
</svg>