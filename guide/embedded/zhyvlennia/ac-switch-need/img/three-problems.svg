<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три причини, чому звичайний транзистор не пасує мережі</text>
<rect x="40.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="130.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. полярність</tspan></text>
<rect x="35.0" y="138.2" width="190.0" height="59.6" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/><text x="130.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">синусоїда йде</tspan><tspan x="130.0" dy="14.3">в обидва боки →</tspan><tspan x="130.0" dy="14.3">блокувати обидва знаки</tspan></text>
<rect x="290.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/><text x="380.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. напруга</tspan></text>
<rect x="285.0" y="138.2" width="190.0" height="59.6" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/><text x="380.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">пік ±325 В проти</tspan><tspan x="380.0" dy="14.3">десятків вольт ключа →</tspan><tspan x="380.0" dy="14.3">запас до 600 В</tspan></text>
<rect x="540.0" y="61.5" width="180.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="630.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. ізоляція</tspan></text>
<rect x="535.0" y="138.2" width="190.0" height="59.6" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/><text x="630.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">логіка й мережа</tspan><tspan x="630.0" dy="14.3">мусять бути</tspan><tspan x="630.0" dy="14.3">гальванічно розділені</tspan></text>
<text x="380.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожна вимога окремо вже виводить за межі звичайного транзистора — разом вони задають клас силових приладів змінного струму</text>
</svg>