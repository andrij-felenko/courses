<text x="244.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(спільний)</text>
<circle cx="300.0" cy="158.0" r="32.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
