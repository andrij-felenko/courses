<text x="408.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">I_G (пуск)</text>
<text x="408.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">у базу Q2</text>
<rect x="100.0" y="400.0" width="400.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="300.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">KCL:  α₁·I_A + α₂·I_A + I_CO + I_G = I_A</tspan></text>
<text x="390.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">усе виведення — це KCL на одному вузлі: сума колекторних струмів обох транзисторів плюс витік і затвор дорівнює спільному I_A</text>
