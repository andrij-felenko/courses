<text x="450.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожен транзистор живить базу іншого: відкрився один — відкрив другий — той ще дужче відкрив перший; раз спалахнувши, защіпка тримається сама</text>
