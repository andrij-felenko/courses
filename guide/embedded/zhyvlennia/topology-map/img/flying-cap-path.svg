<text x="470.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">У buck постійний струм «безкоштовно» несе котушка, а конденсатор лише згладжує.</tspan><tspan x="470.0" dy="14.2">У SEPIC/Ćuk перекидний конденсатор — на самому шляху передачі, і весь перенос лягає на його змінний струм.</tspan></text>
