<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18.5 -10 918.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-18.5" y="-10" width="918.5" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RCC: котушка сама тактує себе — тому копійчаний</text>
<circle cx="300.0" cy="148.0" r="28.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="300.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="300.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Ключ ВІДКРИТО</text>
<text x="300.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">струм у первинній росте,</tspan><tspan x="300.0" dy="12.1">енергія тече в осердя</tspan></text>
<circle cx="420.0" cy="268.0" r="28.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="420.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<text x="460.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Допоміжний виток</text>
<text x="460.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="460.0" dy="0.0">наведена напруга ще дужче</tspan><tspan x="460.0" dy="12.1">відкриває ключ (додатн. ЗЗ)</tspan></text>
<circle cx="300.0" cy="388.0" r="28.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="300.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="300.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Осердя насичується</text>
<text x="300.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">струм більше не росте → ЗЗ</tspan><tspan x="300.0" dy="12.1">зникає → ключ ЗАКРИВАЄТЬСЯ</tspan></text>
<circle cx="180.0" cy="268.0" r="28.0" fill="#ffffff" stroke="#b8860b" stroke-width="2.4"/>
<text x="180.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b8860b" text-anchor="middle" font-weight="700">4</text>
<text x="140.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="end" font-weight="700">4. Скид у вихід + «дзвін»</text>
<text x="140.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end"><tspan x="140.0" dy="0.0">енергія летить у вихід; коли</tspan><tspan x="140.0" dy="12.1">струм спав до 0 — виток</tspan><tspan x="140.0" dy="12.1">дзвенить і знову відкриває ключ</tspan></text>
<path d="M 345.0 156.7 A 120 120 0 0 1 411.3 223.0" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 411.3 313.0 A 120 120 0 0 1 345.0 379.3" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 255.0 379.3 A 120 120 0 0 1 188.7 313.0" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 188.7 223.0 A 120 120 0 0 1 255.0 156.7" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">RCC</text>
<text x="300.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сам себе тактує</text>
<rect x="610.0" y="90.0" width="270.0" height="300.0" rx="10" fill="#faf3e0" stroke="#b8860b" stroke-width="1.6"/>
<text x="745.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">Чому RCC такий дешевий</text>
<line x1="630.0" y1="128.0" x2="860.0" y2="128.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="630.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="630.0" dy="0.0">• немає контролера — котушка сама</tspan><tspan x="630.0" dy="13.9">  вирішує, коли перемикати;</tspan><tspan x="630.0" dy="13.9"></tspan><tspan x="630.0" dy="13.9">• один ключ, один трансформатор,</tspan><tspan x="630.0" dy="13.9">  кілька копійчаних деталей;</tspan><tspan x="630.0" dy="13.9"></tspan><tspan x="630.0" dy="13.9">• частота «плаває» з навантаженням —</tspan><tspan x="630.0" dy="13.9">  для зарядки байдуже;</tspan><tspan x="630.0" dy="13.9"></tspan><tspan x="630.0" dy="13.9">• ізоляція й кратність — задарма,</tspan><tspan x="630.0" dy="13.9">  просто витками трансформатора.</tspan></text>
</svg>