<text x="470.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ćuk: котушка послідовна з кожним портом → гладко з обох боків (найтихіший), ціна — від'ємний вихід.</tspan><tspan x="470.0" dy="13.5">SEPIC: вхід гладкий, вихід рве діод. 4-ключовий: гладкий той бік, що зараз не перемикається;</tspan><tspan x="470.0" dy="13.5">перевагу «гладко з обох боків» він не має, зате вищий ККД (немає гарячого перекидного конденсатора).</tspan></text>
