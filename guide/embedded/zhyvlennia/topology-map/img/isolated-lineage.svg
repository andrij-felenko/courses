<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід ізольованих топологій: одна ідея крізь епохи</text>
<rect x="70.0" y="58.0" width="800.0" height="40.0" rx="10" fill="#fbf7ec" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="470.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна ідея: різко РВАТИ струм у котушці → сплеск напруги; трансформатор дає й розв'язку, й кратність витком</text>
<circle cx="90.0" cy="150.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="90.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1836</text>
<line x1="99.0" y1="150.0" x2="253.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="12.0" y="176.0" width="156.0" height="150.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="90.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Індукційна котушка</text>
<line x1="28.0" y1="208.0" x2="152.0" y2="208.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="90.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Каллан (Maynooth):</tspan><tspan x="90.0" dy="12.3">рвемо струм у первинній —</tspan><tspan x="90.0" dy="12.3">висока напруга у вторинній</tspan></text>
<circle cx="262.0" cy="150.0" r="7.0" fill="#b8860b" stroke="#b8860b" stroke-width="0.0"/>
<text x="262.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">1853</text>
<line x1="271.0" y1="150.0" x2="425.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="184.0" y="176.0" width="156.0" height="150.0" rx="8" fill="#faf3e0" stroke="#b8860b" stroke-width="1.8"/>
<text x="262.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">Конденсатор на розрив</text>
<line x1="200.0" y1="208.0" x2="324.0" y2="208.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="262.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">Фізо: C через переривач</tspan><tspan x="262.0" dy="12.3">рве струм ШВИДШЕ →</tspan><tspan x="262.0" dy="12.3">вищий сплеск, менша іскра</tspan></text>
<circle cx="434.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="434.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1910</text>
<line x1="443.0" y1="150.0" x2="597.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="356.0" y="176.0" width="156.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="434.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Запалювання Delco</text>
<line x1="372.0" y1="208.0" x2="496.0" y2="208.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="434.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="434.0" dy="0.0">Кеттерінг: котушка + контакти</tspan><tspan x="434.0" dy="12.3">+ конденсатор — по суті</tspan><tspan x="434.0" dy="12.3">flyback на механічних контактах</tspan></text>
<circle cx="606.0" cy="150.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="606.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1940-і</text>
<line x1="615.0" y1="150.0" x2="769.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="528.0" y="176.0" width="156.0" height="150.0" rx="8" fill="#e9f7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="606.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Блокінг-генератор</text>
<line x1="544.0" y1="208.0" x2="668.0" y2="208.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="606.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="606.0" dy="0.0">У розгортці ТБ: котушка сама</tspan><tspan x="606.0" dy="12.3">себе рве й перезапускає —</tspan><tspan x="606.0" dy="12.3">самозбудний, без зовн. такту</tspan></text>
<circle cx="778.0" cy="150.0" r="7.0" fill="#7d3cb5" stroke="#7d3cb5" stroke-width="0.0"/>
<text x="778.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3cb5" text-anchor="middle" font-weight="700">сьогодні</text>
<rect x="700.0" y="176.0" width="156.0" height="150.0" rx="8" fill="#f1e9f8" stroke="#7d3cb5" stroke-width="1.8"/>
<text x="778.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3cb5" text-anchor="middle" font-weight="700">RCC → flyback</text>
<line x1="716.0" y1="208.0" x2="840.0" y2="208.0" stroke="#dcdcdc" stroke-width="1.0"/>
<text x="778.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">«Дзвінкий» самозбудний RCC</tspan><tspan x="778.0" dy="12.3">живить дешеві зарядки &lt;150 Вт;</tspan><tspan x="778.0" dy="12.3">з контролером — сучасний flyback</tspan></text>
<line x1="90.0" y1="150.0" x2="778.0" y2="150.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="70.0" y="470.0" width="800.0" height="62.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Трансформатор робить дві роботи ОДНИМ осердям: розділяє кола бар'єром ізоляції</tspan><tspan x="470.0" dy="14.7">і множить напругу відношенням витків Nвтор/Nперв — тому мережеві зарядки саме ізольовані.</tspan></text>
</svg>