<text x="470.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">→ CHARGE PUMP (заряд-помпа, на конденсаторах)</text>
<rect x="60.0" y="452.0" width="820.0" height="56.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="470.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">boost не захищає власний вихід від КЗ: треба захист — послідовний роз'єднувач</text>
<text x="470.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">або SEPIC (рве постійний шлях). Для мережі ізоляція — не опція, а вимога безпеки.</text>
