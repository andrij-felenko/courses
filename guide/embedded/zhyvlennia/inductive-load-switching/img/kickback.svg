<rect x="175.5" y="116.2" width="108.9" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="230.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="230.0" dy="0.0">у полі сидить</tspan><tspan x="230.0" dy="15.6">W = ½·L·I²</tspan></text>
