<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що різкіше розмикання, то більше di/dt — і то вищий сплеск; уся енергія поля мусить кудись піти</text>
