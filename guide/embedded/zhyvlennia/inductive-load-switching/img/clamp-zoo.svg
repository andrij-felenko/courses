<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири способи приборкати індуктивний сплеск</text>
<rect x="40.0" y="64.0" width="200.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="140.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">гасний діод</tspan></text>
<rect x="40.0" y="124.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.2"/><text x="140.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Vкл ≈ V + 0.7</tspan></text>
<rect x="40.0" y="192.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.0"/><text x="140.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">найпростіше;</tspan><tspan x="140.0" dy="13.0">але гасить ПОВІЛЬНО</tspan><tspan x="140.0" dy="13.0">(струм тягнеться)</tspan></text>
<rect x="270.0" y="64.0" width="200.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="370.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">діод + Зенер / TVS</tspan></text>
<rect x="270.0" y="124.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.2"/><text x="370.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Vкл = V + Vz</tspan></text>
<rect x="270.0" y="192.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.0"/><text x="370.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">швидке гасіння;</tspan><tspan x="370.0" dy="13.0">фіксація вища, але</tspan><tspan x="370.0" dy="13.0">керована й безпечна</tspan></text>
<rect x="500.0" y="64.0" width="200.0" height="32.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/><text x="600.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">RC / RCD-снабер</tspan></text>
<rect x="500.0" y="124.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.2"/><text x="600.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">поглинає dV/dt</tspan></text>
<rect x="500.0" y="192.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.0"/><text x="600.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">гасить дзвін і викид;</tspan><tspan x="600.0" dy="13.0">треба підібрати R, C</tspan><tspan x="600.0" dy="13.0">під саме це коло</tspan></text>
<rect x="720.0" y="64.0" width="200.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="820.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">лавина MOSFET</tspan></text>
<rect x="720.0" y="124.0" width="200.0" height="32.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.2"/><text x="820.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Vкл = BVdss</tspan></text>
<rect x="720.0" y="192.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.0"/><text x="820.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">без зовнішніх деталей;</tspan><tspan x="820.0" dy="13.0">лише в межах E_AS</tspan><tspan x="820.0" dy="13.0">даного транзистора</tspan></text>
<line x1="80.0" y1="300.0" x2="860.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="140.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">повільне гасіння, низька Vкл</text>
<text x="830.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">швидке гасіння, вища Vкл</text>
<text x="470.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усі дають енергії поля безпечний шлях — різниця в тому, ЯК ШВИДКО її спалити й ДО ЯКОЇ напруги пустити сплеск</text>
</svg>