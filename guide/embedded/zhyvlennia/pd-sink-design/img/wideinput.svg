<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Широкий вхід замість точної вимоги напруги</text>
<text x="190.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Жорстка: треба РІВНО 12 В</text>
<rect x="40.0" y="120.0" width="300.0" height="54.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">USB-C → VBUS</tspan><tspan x="190.0" dy="14.3">просимо саме 12 В</tspan></text>
<rect x="40.0" y="206.0" width="300.0" height="54.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Навантаження 12 В</tspan><tspan x="190.0" dy="14.3">нема 12 В у меню → не вмикається</tspan></text>
<line x1="190.0" y1="174.0" x2="190.0" y2="204.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">прив'язана до тієї самої напруги</text>
<text x="550.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Гнучка: приймаємо що дали</text>
<rect x="400.0" y="120.0" width="300.0" height="54.0" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">USB-C → будь-який профіль 5–20 В</tspan><tspan x="550.0" dy="14.3">ловимо найвигідніший</tspan></text>
<rect x="400.0" y="206.0" width="300.0" height="54.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Buck-boost → рівні 12 В</tspan><tspan x="550.0" dy="14.3">оживає навіть від 5 В</tspan></text>
<line x1="550.0" y1="174.0" x2="550.0" y2="204.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="550.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">ціна — зайвий перетворювач</text>
