<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта вибору: тригер, контролер чи МК</text>
<rect x="30.0" y="70.0" width="200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Одна стала напруга,</tspan><tspan x="130.0" dy="14.3">без змін на ходу?</tspan></text>
<line x1="130.0" y1="132.0" x2="130.0" y2="158.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="160.0" width="200.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="185.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ТРИГЕР</tspan><tspan x="130.0" dy="14.3">просто · дешево · 0 коду</tspan></text>
<rect x="270.0" y="70.0" width="200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Міняти напругу</tspan><tspan x="370.0" dy="14.3">чи вести PPS під МК?</tspan></text>
<line x1="370.0" y1="132.0" x2="370.0" y2="158.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270.0" y="160.0" width="200.0" height="58.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/><text x="370.0" y="185.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">PD-КОНТРОЛЕР</tspan><tspan x="370.0" dy="14.3">гнучко · чип бере протокол</tspan></text>
<rect x="510.0" y="70.0" width="200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Без зайвого чипа,</tspan><tspan x="610.0" dy="14.3">повний контроль?</tspan></text>
<line x1="610.0" y1="132.0" x2="610.0" y2="158.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="510.0" y="160.0" width="200.0" height="58.0" rx="6" fill="#fbf7ec" stroke="#b8860b" stroke-width="2.0"/><text x="610.0" y="186.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">МК ЗІ СТЕКОМ</tspan><tspan x="610.0" dy="11.7">максимум волі · максимум праці</tspan></text>
<line x1="40.0" y1="250.0" x2="700.0" y2="250.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="370.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два залізні правила — незалежно від обраного шляху:</text>
<rect x="60.0" y="290.0" width="300.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1. Навантаження вмикати</tspan><tspan x="210.0" dy="13.0">лише за дійсним контрактом (power-good)</tspan></text>
<rect x="380.0" y="290.0" width="300.0" height="50.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="530.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">2. Пристрій має пережити</tspan><tspan x="530.0" dy="13.0">відкат у 5 В (урізано або чесно мовчить)</tspan></text>
</svg>