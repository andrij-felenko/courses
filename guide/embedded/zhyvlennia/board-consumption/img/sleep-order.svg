<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок засинання й пастка back-powering</text>
<rect x="68.0" y="90.0" width="128.0" height="96.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="132.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">1. приспати</tspan><tspan x="132.0" dy="15.6">периферію</tspan></text>
<text x="132.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">команда по шині:</tspan><tspan x="132.0" dy="11.7">sleep / power-down</tspan></text>
<line x1="199.0" y1="138.0" x2="217.0" y2="138.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="90.0" width="128.0" height="96.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="284.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="284.0" dy="0.0">2. опустити</tspan><tspan x="284.0" dy="15.6">сигнали</tspan></text>
<text x="284.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="284.0" dy="0.0">CS, лінії даних →</tspan><tspan x="284.0" dy="11.7">Hi-Z або 0</tspan></text>
<line x1="351.0" y1="138.0" x2="369.0" y2="138.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="372.0" y="90.0" width="128.0" height="96.0" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/>
<text x="436.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="436.0" dy="0.0">3. зняти</tspan><tspan x="436.0" dy="15.6">живлення гілки</tspan></text>
<text x="436.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="436.0" dy="0.0">load switch OFF:</tspan><tspan x="436.0" dy="11.7">гілка знеструмлена</tspan></text>
<line x1="503.0" y1="138.0" x2="521.0" y2="138.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="524.0" y="90.0" width="128.0" height="96.0" rx="8" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="2.0"/>
<text x="588.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700"><tspan x="588.0" dy="0.0">4. заснути</tspan></text>
<text x="588.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">hold + вибір</tspan><tspan x="588.0" dy="11.7">пробудження →</tspan><tspan x="588.0" dy="11.7">deep-sleep</tspan></text>
<text x="360.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">правильний порядок: приспати → опустити → знеструмити → заснути</text>
<rect x="68.0" y="282.0" width="584.0" height="116.0" rx="10" fill="#fff5f5" stroke="#c0392b" stroke-width="1.6"/>
<text x="360.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">пастка: зняли живлення, не опустивши сигнали</text>
<rect x="108.3" y="336.5" width="59.4" height="39.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="138.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="138.0" dy="0.0">ESP32</tspan><tspan x="138.0" dy="13.0">(живий)</tspan></text>
<rect x="504.4" y="336.5" width="115.2" height="39.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.6"/><text x="562.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="562.0" dy="0.0">давач</tspan><tspan x="562.0" dy="13.0">(живлення знято)</tspan></text>
<line x1="190.0" y1="348.0" x2="496.0" y2="348.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">лінія даних усе ще у «1» → струм тече крізь захисний діод давача</text>
<text x="360.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">«мертва» мікросхема живиться крізь власні входи — back-powering</text>
</svg>