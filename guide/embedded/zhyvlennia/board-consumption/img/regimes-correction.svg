<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Яка поправка вирішальна — залежить від скважності</text>
<rect x="60.0" y="70.0" width="198.0" height="230.0" rx="0" fill="#eaf4fb" stroke="none" stroke-width="0.0"/>
<text x="159.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">мала D</tspan><tspan x="159.0" dy="14.3">(пристрій майже</tspan><tspan x="159.0" dy="14.3">завжди спить)</tspan></text>
<rect x="112.5" y="156.2" width="93.0" height="57.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="159.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="159.0" dy="0.0">вирішує:</tspan><tspan x="159.0" dy="14.3">ПІДЛОГА</tspan><tspan x="159.0" dy="14.3">саморозряду</tspan></text>
<text x="159.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="159.0" dy="0.0">мітка, лічильник,</tspan><tspan x="159.0" dy="11.7">годинник на CR2032</tspan></text>
<rect x="258.0" y="70.0" width="198.0" height="230.0" rx="0" fill="#fef9e7" stroke="none" stroke-width="0.0"/>
<text x="357.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="357.0" dy="0.0">середня D</tspan><tspan x="357.0" dy="14.3">(сон + великі</tspan><tspan x="357.0" dy="14.3">піки радіо)</tspan></text>
<rect x="303.7" y="149.1" width="106.7" height="71.9" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.8"/><text x="357.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="357.0" dy="0.0">вирішують:</tspan><tspan x="357.0" dy="14.3">використання</tspan><tspan x="357.0" dy="14.3">ємності + тип</tspan><tspan x="357.0" dy="14.3">стабілізатора</tspan></text>
<text x="357.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="357.0" dy="0.0">давач із радіо</tspan><tspan x="357.0" dy="11.7">на батарейці</tspan></text>
<rect x="456.0" y="70.0" width="204.0" height="230.0" rx="0" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<text x="558.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="558.0" dy="0.0">велика D</tspan><tspan x="558.0" dy="14.3">(пристрій</tspan><tspan x="558.0" dy="14.3">переважно активний)</tspan></text>
<rect x="508.1" y="156.2" width="99.8" height="57.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="558.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="558.0" dy="0.0">вирішує:</tspan><tspan x="558.0" dy="14.3">ККД</tspan><tspan x="558.0" dy="14.3">перетворення</tspan></text>
<text x="558.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="558.0" dy="0.0">пристрій, що</tspan><tspan x="558.0" dy="11.7">працює, не спить</tspan></text>
<line x1="258.0" y1="70.0" x2="258.0" y2="300.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="456.0" y1="70.0" x2="456.0" y2="300.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="60.0" y1="318.0" x2="660.0" y2="318.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">D → 0  (спить)</text>
<text x="660.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">D → 1  (активний)</text>
<text x="360.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">скважність D = частка часу в активній фазі</text>
<text x="360.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна формула життя — але для кожного пристрою в ній «світиться» свій доданок</text>
</svg>