<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два домени пінів у сні: живий RTC і цифровий, що гасне</text>
<rect x="50.0" y="60.0" width="620.0" height="300.0" rx="12" fill="#fbfcfe" stroke="#333333" stroke-width="1.6"/>
<rect x="80.0" y="100.0" width="250.0" height="220.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="205.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">RTC-домен — ЖИВИЙ у сні</text>
<text x="205.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">живиться завжди-живою гілкою:</tspan><tspan x="205.0" dy="13.0">годинник, лічильник, RTC-піни</tspan></text>
<rect x="118.9" y="191.7" width="172.2" height="36.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="205.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">RTC-піни (0,2,4,12,13,14,15,</tspan><tspan x="205.0" dy="11.7">25,26,27,32–39)</tspan></text>
<rect x="138.1" y="246.0" width="133.8" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">тільки звідси —</tspan><tspan x="205.0" dy="13.0">джерело пробудження</tspan><tspan x="205.0" dy="13.0">(ext0/ext1)</tspan></text>
<rect x="390.0" y="100.0" width="250.0" height="220.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="515.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">цифровий домен — ГАСНЕ</text>
<text x="515.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">живлення знято на час сну:</tspan><tspan x="515.0" dy="13.0">рівень пінів «відпускається»</tspan></text>
<rect x="426.1" y="183.7" width="177.8" height="36.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="515.0" y="199.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">без hold: пін попливе →</tspan><tspan x="515.0" dy="11.7">стрибок струму від сну до сну</tspan></text>
<rect x="429.5" y="252.5" width="171.0" height="39.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="515.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">gpio_deep_sleep_hold_en()</tspan><tspan x="515.0" dy="13.0">примусово тримає рівень</tspan></text>
<line x1="360.0" y1="100.0" x2="360.0" y2="320.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="360.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">будити — з RTC-домену; критичні цифрові рівні — прибити hold, інакше «попливуть» у сні</text>
</svg>