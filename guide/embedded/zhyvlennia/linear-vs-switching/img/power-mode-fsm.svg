<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат живлення: RUN ↔ SLEEP через дзеркальні переходи</text>
<rect x="40.0" y="210.0" width="210.0" height="150.0" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
<text x="145.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">СТАН: RUN</text>
<text x="145.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">buck → повний PWM</tspan><tspan x="145.0" dy="15.6">усі шини живі</tspan><tspan x="145.0" dy="15.6">MCU живиться від buck</tspan><tspan x="145.0" dy="15.6">(ефективно)</tspan></text>
<rect x="610.0" y="210.0" width="210.0" height="150.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="715.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">СТАН: SLEEP</text>
<text x="715.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">buck → пропуск (PFM)</tspan><tspan x="715.0" dy="15.6">зайві шини вимкнені</tspan><tspan x="715.0" dy="15.6">MCU живиться від LDO</tspan><tspan x="715.0" dy="15.6">(тихо, мкА)</tspan></text>
<path d="M250 238 C 340 118, 520 118, 610 238" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="265.0" y="93.4" width="330.0" height="65.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">1. MCU → LDO (make-before-break)</tspan><tspan x="430.0" dy="15.6">2. шини OFF у зворотному порядку</tspan><tspan x="430.0" dy="15.6">3. buck → режим пропуску</tspan></text>
<text x="430.0" y="81.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вхід у сон</text>
<path d="M610 332 C 520 452, 340 452, 250 332" fill="none" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="250.0" y="413.4" width="360.0" height="65.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">1. buck → повний PWM</tspan><tspan x="430.0" dy="15.6">2. шини ON за порядком, КОЖНА чекає PGOOD</tspan><tspan x="430.0" dy="15.6">3. MCU → buck (останнім)</tspan></text>
<text x="430.0" y="502.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">прокидання</text>
<text x="430.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">MCU: на LDO — ПЕРШИМ у сон, на buck — ОСТАННІМ з нього; шини дзеркально; PGOOD вартує кожне вмикання</text>
</svg>