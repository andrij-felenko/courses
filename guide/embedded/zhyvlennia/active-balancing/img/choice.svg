<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибір: спершу пасив чи актив, тоді — чим</text>
<rect x="30.0" y="54.0" width="360.0" height="150.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="2.0"/>
<rect x="30.0" y="54.0" width="360.0" height="34" rx="6" fill="#6b7280" fill-opacity="0.15"/>
<text x="210.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Пасив вистачає</text>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">малий пакет, рідко циклює,</tspan><tspan x="210.0" dy="13.7">комірки з одної партії,</tspan><tspan x="210.0" dy="13.7">дрейф невеликий</tspan></text>
<line x1="46.0" y1="168.0" x2="374.0" y2="168.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="210.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">дешево, тихо; надлишок —</tspan><tspan x="210.0" dy="12.3">у тепло, лічені десятки мА</tspan></text>
<rect x="410.0" y="54.0" width="360.0" height="150.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="410.0" y="54.0" width="360.0" height="34" rx="6" fill="#27ae60" fill-opacity="0.15"/>
<text x="590.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Актив виправданий</text>
<text x="590.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">великий/довгий пакет,</tspan><tspan x="590.0" dy="13.7">дорогі комірки, жорсткий</tspan><tspan x="590.0" dy="13.7">бюджет енергії та часу</tspan></text>
<line x1="426.0" y1="168.0" x2="754.0" y2="168.0" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="590.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">переносить 1–5 А при &gt;90%;</tspan><tspan x="590.0" dy="12.3">дорожче й складніше</tspan></text>
<line x1="400.0" y1="208.0" x2="400.0" y2="234.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="412.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">якщо актив:</text>
<rect x="22.0" y="244.0" width="240.0" height="92.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="22.0" y="244.0" width="240.0" height="26" rx="6" fill="#c0392b" fill-opacity="0.15"/>
<text x="142.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Конденсатор</text>
<text x="142.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">дрейф малий, сусідній;</tspan><tspan x="142.0" dy="12.3">економія й простота</tspan></text>
<rect x="280.0" y="244.0" width="240.0" height="92.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="280.0" y="244.0" width="240.0" height="26" rx="6" fill="#2457d6" fill-opacity="0.15"/>
<text x="400.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Котушка</text>
<text x="400.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">треба швидше, керований</tspan><tspan x="400.0" dy="12.3">струм між сусідами</tspan></text>
<rect x="538.0" y="244.0" width="240.0" height="92.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="538.0" y="244.0" width="240.0" height="26" rx="6" fill="#27ae60" fill-opacity="0.15"/>
<text x="658.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Трансформатор</text>
<text x="658.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="658.0" dy="0.0">слабка комірка десь у пакеті;</tspan><tspan x="658.0" dy="12.3">треба ізоляція</tspan></text>
</svg>