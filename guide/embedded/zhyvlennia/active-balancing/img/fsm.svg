<rect x="60.0" y="392.0" width="700.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="409.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вимір повторюється щоперіоду; балансуємо лише коли є за що і поки тепло дозволяє; будь-яке вето монітора-захисту — миттєвий відкат у спокій.</tspan></text>
