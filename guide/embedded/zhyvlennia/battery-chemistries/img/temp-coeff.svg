<text x="40.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" transform="rotate(-90 40.0 195.0)">напруга комірки E</text>
