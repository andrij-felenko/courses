<text x="746.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="end">−0.08 мВ/К</text>
<text x="530.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">LiMn2O4</text>
<text x="746.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">−0.20 мВ/К</text>
<text x="530.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">LiCoO2</text>
<text x="746.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">−0.25 мВ/К</text>
<rect x="520.0" y="298.0" width="236.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="638.0" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">малий, але не нуль — тому</tspan><tspan x="638.0" dy="12.3">номінал «гуляє» з температурою</tspan></text>
