<text x="315.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стандарт 25°C</text>
<line x1="90.0" y1="154.5" x2="490.0" y2="226.5" stroke="#c0392b" stroke-width="2.8"/>
