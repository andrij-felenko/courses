<text x="96.0" y="162.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">трохи вища</text>
<circle cx="490.0" cy="226.5" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="484.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">спека: трохи нижча</text>
<text x="290.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">нахил малий: одиниці десятих мВ на градус</text>
<rect x="520.0" y="76.0" width="236.0" height="26.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/><text x="638.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="638.0" dy="0.0">Нахил = ентропія реакції</tspan></text>
<text x="638.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">dE/dT = ΔS / (n·F)</text>
<rect x="520.0" y="144.0" width="236.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="638.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">ΔS — зміна безладу реакції</tspan><tspan x="638.0" dy="12.3">(+ безлад → напруга росте з T,</tspan><tspan x="638.0" dy="12.3">− безлад → падає)</tspan></text>
<text x="526.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Реальні катоди (dE/dT):</text>
