<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться рівняння Нернста: три сходинки</text>
<rect x="40.0" y="60.0" width="226.0" height="300.0" rx="10" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.8"/>
<rect x="50.0" y="70.0" width="206.0" height="26.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/><text x="153.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="153.0" dy="0.0">1. Рушій реакції</tspan></text>
<rect x="288.0" y="60.0" width="226.0" height="300.0" rx="10" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.8"/>
<rect x="298.0" y="70.0" width="206.0" height="26.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/><text x="401.0" y="86.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="401.0" dy="0.0">2. Напруга = рушій / заряд</tspan></text>
<rect x="536.0" y="60.0" width="226.0" height="300.0" rx="10" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.8"/>
<rect x="546.0" y="70.0" width="206.0" height="26.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/><text x="649.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="649.0" dy="0.0">3. Рушій пливе з умовами</tspan></text>
<text x="153.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скільки корисної роботи</text>
<text x="153.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">віддасть реакція?</text>
<rect x="58.0" y="168.0" width="190.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="153.0" y="181.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">ΔG &lt; 0 → реакція йде</tspan><tspan x="153.0" dy="13.7">сама, віддає роботу</tspan></text>
<text x="153.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ΔG = ΔH − T·ΔS</text>
<rect x="58.0" y="250.0" width="190.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="153.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="153.0" dy="0.0">тепло реакції ΔH</tspan><tspan x="153.0" dy="12.3">мінус T × безлад ΔS</tspan><tspan x="153.0" dy="12.3">(звідси температура!)</tspan></text>
<text x="153.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">енергія на моль</text>
<text x="153.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(Дж/моль)</text>
<line x1="269.0" y1="210.0" x2="285.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="401.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ту роботу несуть</text>
<text x="401.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">n електронів заряду nF</text>
<text x="401.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">E = − ΔG / (n·F)</text>
<rect x="306.0" y="218.0" width="190.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="401.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="401.0" dy="0.0">робота / заряд = напруга</tspan><tspan x="401.0" dy="12.3">(як висота, з якої</tspan><tspan x="401.0" dy="12.3">падає заряд)</tspan></text>
<text x="401.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">n — електронів на реакцію</text>
<text x="401.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">F = 96485 Кл/моль</text>
<text x="401.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">вольти (В)</text>
<line x1="517.0" y1="210.0" x2="533.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="649.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ΔG залежить від того,</text>
<text x="649.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">скільки вже віддано:</text>
<rect x="552.0" y="166.0" width="194.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="649.0" y="182.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="649.0" dy="0.0">ΔG = ΔG° + RT·ln Q</tspan></text>
<text x="649.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">поділили на −nF:</text>
<rect x="550.0" y="232.0" width="198.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="649.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="649.0" dy="0.0">E = E° − (RT/nF)·ln Q</tspan></text>
<text x="649.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q = [продукти]/[реагенти]</text>
<text x="649.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">розряд → Q росте → E падає</text>
<text x="649.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">рівняння Нернста</text>
<rect x="40.0" y="380.0" width="722.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="401.0" y="397.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="401.0" dy="0.0">Напруга — не задане число, а вільна енергія реакції на одиницю перенесеного заряду.</tspan></text>
</svg>