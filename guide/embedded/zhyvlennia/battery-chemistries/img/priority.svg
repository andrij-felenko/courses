<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто винайшов нікель-залізний акумулятор</text>
<rect x="50.0" y="84.0" width="300.0" height="150.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Вальдемар Юнгнер</text>
<text x="200.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">патент NiFe — 1899</text>
<text x="200.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">першість за датою</text>
<text x="200.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">мала шведська фірма,</tspan><tspan x="200.0" dy="13.0">хронічний брак коштів</tspan></text>
<rect x="410.0" y="84.0" width="300.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Томас Едісон</text>
<text x="560.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">патент NiFe — 1901</text>
<text x="560.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">на ~2 роки пізніше</text>
<text x="560.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">капітал, юристи, слава —</tspan><tspan x="560.0" dy="13.0">виграв суд грошима</tspan></text>
<line x1="352.0" y1="150.0" x2="408.0" y2="150.0" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100.0" y="270.0" width="560.0" height="44.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="380.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">У світ пішла назва «батарея Едісона». Едісон реально вдосконалив NiFe,</tspan><tspan x="380.0" dy="13.7">але «винайшов першим» — історичний міф.</tspan></text>
</svg>