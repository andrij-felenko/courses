<rect x="149.4" y="320.2" width="421.3" height="59.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Вхід і вихід — це витік і стік того самого FET: мікросхема міряє</tspan><tspan x="360.0" dy="14.3">падіння на каналі (Vds) як напрям струму й прикидається діодом.</tspan><tspan x="360.0" dy="14.3">Різні виробники звуть ці виводи то IN/OUT, то ANODE/CATHODE</tspan></text>
