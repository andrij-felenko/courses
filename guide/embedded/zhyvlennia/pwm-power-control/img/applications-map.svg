  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Карта застосувань ШІМ: що, як і з якою частотою</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна ідея — керувати часткою часу — і десятки застосувань</text>
<rect x="60.0" y="96.0" width="840.0" height="52.0" rx="10" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="80.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Яскравість LED</text>
<text x="420.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шпаруватість = яскравість</text>
<text x="700.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">1–5 кГц, +гамма</text>
<rect x="60.0" y="156.0" width="840.0" height="52.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="80.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Швидкість мотора/вентилятора</text>
<text x="420.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шпаруватість = оберти</text>
<text x="700.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">&gt; 20 кГц (тихо), ключ+діод</text>
<rect x="60.0" y="216.0" width="840.0" height="52.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="80.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Сервопривід</text>
<text x="420.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ширина імпульсу = кут</text>
<text x="700.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">50 Гц, 1–2 мс</text>
<rect x="60.0" y="276.0" width="840.0" height="52.0" rx="10" fill="#fbfcff" stroke="#c0271e" stroke-width="1.6"/>
<text x="80.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Потужність нагрівача/лампи</text>
<text x="420.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шпаруватість = потужність</text>
<text x="700.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">низьк.: ключ; ~220 В: реле</text>
<rect x="60.0" y="336.0" width="840.0" height="52.0" rx="10" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="80.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="start" font-weight="bold" font-style="normal">Аналоговий рівень / звук</text>
<text x="420.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шпаруватість → напруга</text>
<text x="700.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ШІМ + RC-фільтр (§25.4)</text>
</svg>
