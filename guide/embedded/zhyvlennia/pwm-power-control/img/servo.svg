<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сервопривід: особлива ШІМ — ширина імпульсу = кут</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тут важить не «середнє», а ШИРИНА: 1 мс → 0°, 1.5 мс → 90°, 2 мс → 180°, період 20 мс</text>
<text x="80.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">1.0 мс →</text>
<text x="170.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">0°</text>
<polyline points="300.0,136.0 300.0,100.0 328.0,100.0 328.0,136.0 860.0,136.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="338.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">імпульс</text>
<text x="760.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">пауза до 20 мс</text>
<text x="80.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">1.5 мс →</text>
<text x="170.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">90° (центр)</text>
<polyline points="300.0,216.0 300.0,180.0 342.0,180.0 342.0,216.0 860.0,216.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="352.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">імпульс</text>
<text x="760.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">пауза до 20 мс</text>
<text x="80.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2.0 мс →</text>
<text x="170.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">180°</text>
<polyline points="300.0,296.0 300.0,260.0 356.0,260.0 356.0,296.0 860.0,296.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="366.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">імпульс</text>
<text x="760.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">пауза до 20 мс</text>
<rect x="150.0" y="330.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серво саме декодує ширину імпульсу в кут — це НЕ усереднення, а кодування значення шириною.</text>
<text x="480.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Період 50 Гц (20 мс) фіксований; міняється лише ширина 1…2 мс.</text>
</svg>
