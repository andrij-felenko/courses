<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Добуток площ: дві площі — дві різні задачі в одному числі</text>
<rect x="120.0" y="95.0" width="190.0" height="210.0" rx="4" fill="#e8e2d8" stroke="#1a1a1a" stroke-width="2.0"/><rect x="160.0" y="130.0" width="70.0" height="140.0" rx="3" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="195.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Wa</text><text x="195.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">вікно</text><rect x="250.0" y="130.0" width="50.0" height="140.0" rx="3" fill="#fde6e6" stroke="#c0392b" stroke-width="2.0"/><text x="275.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Ae</text><text x="275.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">потік</text><text x="215.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">розріз осердя</text><text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ap = Wa · Ae</text><rect x="413.9" y="129.6" width="172.2" height="70.8" rx="6" fill="#fde6e6" stroke="#c0392b" stroke-width="1.8"/><text x="500.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ae (переріз заліза):</tspan><tspan x="500.0" dy="16.9">тримає ПОТІК</tspan><tspan x="500.0" dy="16.9">→ не насититись</tspan></text><rect x="425.0" y="234.6" width="150.0" height="70.8" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.8"/><text x="500.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Wa (площа вікна):</tspan><tspan x="500.0" dy="16.9">тримає МІДЬ</tspan><tspan x="500.0" dy="16.9">→ обмотки влізуть</tspan></text><line x1="310.0" y1="165.0" x2="413.9" y2="165.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="310.0" y1="200.0" x2="425.0" y2="270.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4 4"/><text x="370.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Один множник бореться з насиченням, другий — з тіснотою; добуток ловить обидва</text>
</svg>