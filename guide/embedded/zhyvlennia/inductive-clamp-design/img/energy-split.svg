<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 809.75 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="809.75" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна й та сама енергія — два різні рейтинги</text>
<rect x="65.0" y="61.9" width="170.0" height="56.2" rx="6" fill="#fff8e1" stroke="#e0c068" stroke-width="1.5"/><text x="150.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Запас у полі</tspan><tspan x="150.0" dy="18.2">½·L·I²</tspan></text>
<line x1="150.0" y1="118.1" x2="150.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="60.0" x2="470.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="220.0" height="90.0" rx="6" fill="#eef3fe" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="229.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ОДИН імпульс:</tspan><tspan x="150.0" dy="11.7">кламп має лише пережити сплеск енергії (рейтинг по джоулях E_AS)</tspan></text>
<rect x="470.0" y="30.0" width="230.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="585.0" y="82.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">ПОВТОРНО (ШІМ):</tspan><tspan x="585.0" dy="11.7">середнє розсіяння = ½·L·I²·f_перем → діод/кламп має тримати СЕРЕДНЮ потужність, не лише пік</tspan></text>
<rect x="330.0" y="205.0" width="370.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="515.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Енергія завжди йде в тепло: на падінні клампу + на опорі обмотки. Питання лише — за який час і скільки разів за секунду.</tspan></text>
</svg>