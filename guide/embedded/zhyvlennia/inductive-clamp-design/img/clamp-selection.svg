<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимога до швидкості диктує кламп</text>
<rect x="173.1" y="45.0" width="353.8" height="38.0" rx="6" fill="#fff8e1" stroke="#e0c068" stroke-width="1.5"/><text x="350.0" y="68.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Як швидко навантаження має вимкнутися?</tspan></text>
<rect x="40.0" y="110.0" width="300.0" height="64.0" rx="6" fill="#fbfcfd" stroke="#dfe3e8" stroke-width="1.5"/><text x="190.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">байдуже (реле раз на хвилину)</tspan></text>
<rect x="400.0" y="110.0" width="270.0" height="64.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="535.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="535.0" dy="0.0">діод-кламп (0.7 В)</tspan><tspan x="535.0" dy="15.6">найдешевше, найповільніше</tspan></text>
<line x1="345.0" y1="142.0" x2="398.0" y2="142.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="188.0" width="300.0" height="64.0" rx="6" fill="#fbfcfd" stroke="#dfe3e8" stroke-width="1.5"/><text x="190.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">важливе (точне реле, клапан)</tspan></text>
<rect x="400.0" y="188.0" width="270.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="535.0" dy="0.0">діод + Зенер / TVS</tspan><tspan x="535.0" dy="15.6">кламп на 1.5…2× V_жив</tspan></text>
<line x1="345.0" y1="220.0" x2="398.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="266.0" width="300.0" height="64.0" rx="6" fill="#fbfcfd" stroke="#dfe3e8" stroke-width="1.5"/><text x="190.0" y="302.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">критичне (ШІМ-соленоїд, швидкий рух)</tspan></text>
<rect x="400.0" y="266.0" width="270.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="535.0" y="294.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="535.0" dy="0.0">лавинний MOSFET або TVS,</tspan><tspan x="535.0" dy="15.6">рахуй E_AS і середню P</tspan></text>
