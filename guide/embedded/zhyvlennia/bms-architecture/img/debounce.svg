<rect x="40.0" y="318.0" width="740.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="410.0" y="336.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Рубали б за першою одиницею — кожна голка на порозі давала б хибну аварію. Лічильник N однакових зчитувань поспіль глушить дребезг ціною малої затримки.</tspan></text>
