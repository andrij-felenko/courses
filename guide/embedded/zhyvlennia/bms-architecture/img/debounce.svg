<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дребезг порога: підтверджуй стан у часі, не за одним зчитуванням</text>
<text x="138.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end"><tspan x="138.0" dy="0.0">сире</tspan><tspan x="138.0" dy="13.0">зчитування</tspan></text>
<polyline points="150,110 180,110 180,110 211,110 211,110 242,110 242,76 272,76 272,110 302,110 302,76 333,76 333,76 364,76 364,110 394,110 394,76 424,76 424,76 455,76 455,76 486,76 486,76 516,76 516,76 546,76 546,76 577,76 577,76 608,76 608,76 638,76 638,76 668,76 668,76 699,76 699,76 730,76 730,76 760,76" fill="none" stroke="#c0392b" stroke-width="2.2"/>
