<rect x="50.0" y="344.0" width="720.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="410.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Через падіння на внутрішньому опорі комірок C1–C3 і C4–C6 виміряні за різного струму — порівнювати їхні напруги нечесно.</tspan><tspan x="410.0" dy="13.0">Звідси вимога: міряти весь стек майже одночасно (швидкий скан) або двома АЦП разом.</tspan></text>
