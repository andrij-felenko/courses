<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід керованої батареї: згори вниз і від простого до складного</text>
<text x="165.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">звідки спустилася технологія</text>
<rect x="40.0" y="80.0" width="250.0" height="96.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Аероспейс (з 1970-х)</text>
<text x="165.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">великі послідовні стеки;</tspan><tspan x="165.0" dy="12.3">спершу NiCd/NiH2, Li-ion</tspan><tspan x="165.0" dy="12.3">у космосі з 2001 (PROBA-1)</tspan></text>
<line x1="165.0" y1="176.0" x2="165.0" y2="194.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="194.0" width="250.0" height="96.0" rx="6" fill="#fff" stroke="#caa24a" stroke-width="2.0"/>
<text x="165.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">Електромобілі (1996→2008)</text>
<text x="165.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">EV1 — пакет із наглядом;</tspan><tspan x="165.0" dy="12.3">Roadster — нагляд за кожною</tspan><tspan x="165.0" dy="12.3">ланкою з 6831 комірок</tspan></text>
<line x1="165.0" y1="290.0" x2="165.0" y2="308.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="308.0" width="250.0" height="96.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<text x="165.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Побутова електроніка</text>
<text x="165.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">ноутбук, телефон, дрон,</tspan><tspan x="165.0" dy="12.3">повербанк — той самий</tspan><tspan x="165.0" dy="12.3">захист у мініатюрі</tspan></text>
<text x="165.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ціна помилки падає, обсяг — росте</text>
<text x="555.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">як ріс сам монітор</text>
<rect x="330.0" y="80.0" width="450.0" height="96.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="330.0" y="80.0" width="34" height="96.0" rx="6" fill="#2457d6" fill-opacity="0.14"/>
<text x="347.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="382.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Дискретний захист</text>
<text x="382.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="382.0" dy="0.0">купка транзисторів і компараторів;</tspan><tspan x="382.0" dy="12.3">стереже одну комірку, грубо</tspan></text>
<line x1="555.0" y1="176.0" x2="555.0" y2="194.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="194.0" width="450.0" height="96.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="330.0" y="194.0" width="34" height="96.0" rx="6" fill="#2457d6" fill-opacity="0.14"/>
<text x="347.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="382.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Захисний чип (AFE)</text>
<text x="382.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="382.0" dy="0.0">одна мікросхема на 1 комірку:</tspan><tspan x="382.0" dy="12.3">перезаряд / глибокий розряд / надструм</tspan><tspan x="382.0" dy="12.3">(Ricoh RS5VG, 1995; далі Seiko, Mitsumi)</tspan></text>
<line x1="555.0" y1="290.0" x2="555.0" y2="308.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="308.0" width="450.0" height="96.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="330.0" y="308.0" width="34" height="96.0" rx="6" fill="#27ae60" fill-opacity="0.14"/>
<text x="347.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<text x="382.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Стековий монітор</text>
<text x="382.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="382.0" dy="0.0">одна IC міряє 12 комірок диференційно;</tspan><tspan x="382.0" dy="12.3">ланцюжок крізь ізоляцію на весь стек</tspan><tspan x="382.0" dy="12.3">(Linear LTC6802, 2008)</tspan></text>
</svg>