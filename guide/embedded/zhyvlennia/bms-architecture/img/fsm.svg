<text x="140.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="140.0" dy="0.0">контактори</tspan><tspan x="140.0" dy="13.0">розімкнені</tspan></text>
