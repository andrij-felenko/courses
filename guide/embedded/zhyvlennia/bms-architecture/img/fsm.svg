<text x="680.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ON</text>
<text x="680.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="680.0" dy="0.0">головний</tspan><tspan x="680.0" dy="13.0">замкнений</tspan></text>
<line x1="215.0" y1="135.0" x2="335.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
