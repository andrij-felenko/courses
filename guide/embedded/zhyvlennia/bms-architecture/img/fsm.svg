<text x="275.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">замкни «−», передзаряд</text>
<line x1="485.0" y1="135.0" x2="605.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ΔU &lt; поріг</text>
<text x="545.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">замкни головний</text>
<path d="M680 96 C 580 43, 240 43, 140 96" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
