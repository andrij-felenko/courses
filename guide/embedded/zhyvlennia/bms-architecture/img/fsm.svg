<text x="95.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">лише</tspan><tspan x="95.0" dy="11.7">скидання</tspan></text>
