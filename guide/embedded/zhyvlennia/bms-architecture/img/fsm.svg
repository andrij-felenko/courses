<text x="410.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">будь-яка з двох ліній захисту · таймаут передзаряду · залиплий контактор · провал живлення</text>
