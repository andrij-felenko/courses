<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат BMS: OFF → PRECHARGE → ON, будь-яка біда → FAULT</text>
