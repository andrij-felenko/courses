<text x="410.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="410.0" dy="0.0">безпечний стан: усе розімкнено,</tspan><tspan x="410.0" dy="13.0">відмова зафіксована (latched)</tspan></text>
