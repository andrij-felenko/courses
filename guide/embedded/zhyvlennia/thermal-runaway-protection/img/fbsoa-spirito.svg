<rect x="92.0" y="400.0" width="600.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="392.0" y="414.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">Як ключ MOSFET живе по лінії сталої потужності.</tspan><tspan x="392.0" dy="12.3">Як лінійний елемент за великих Vds його тримає теплова нестійкість: реальні криві тривалості</tspan><tspan x="392.0" dy="12.3">пірнають під сталу потужність, і що довший імпульс (до DC), то нижче.</tspan><tspan x="392.0" dy="12.3">У даташиті це окремий графік «linear-mode SOA», а не звичний RDS(on)-режим.</tspan></text>
