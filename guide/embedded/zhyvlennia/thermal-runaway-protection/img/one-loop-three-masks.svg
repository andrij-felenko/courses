<line x1="381.7" y1="226.4" x2="346.3" y2="165.6" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="346.3" y1="134.4" x2="381.7" y2="73.6" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="378.6" y="42.2" width="62.8" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="410.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">нагрів</tspan></text>
<rect x="467.0" y="134.2" width="69.9" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="502.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="502.0" dy="0.0">струм ↑</tspan></text>
<rect x="357.2" y="226.2" width="105.6" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="410.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">потужність ↑</tspan></text>
<rect x="275.9" y="134.2" width="84.2" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="318.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="318.0" dy="0.0">ще нагрів</tspan></text>
<text x="410.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="410.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">знак петлі</text>
<rect x="532.0" y="116.0" width="196.0" height="64.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><text x="630.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Петля втікає, коли</tspan><tspan x="630.0" dy="13.0">підсилення за оберт ≥ 1.</tspan><tspan x="630.0" dy="13.0">Захист = тримати його &lt; 1</tspan><tspan x="630.0" dy="13.0">або розірвати петлю.</tspan></text>
<rect x="20.0" y="290.0" width="244.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="142.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Лінійний транзистор</text>
<line x1="36.0" y1="324.0" x2="248.0" y2="324.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="142.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">LDO, клас A, hot-swap:</tspan><tspan x="142.0" dy="13.2">Vbeↆ або низький Vgs.</tspan><tspan x="142.0" dy="13.2">Розрив: емітерний R,</tspan><tspan x="142.0" dy="13.2">теплова компенсація.</tspan></text>
<line x1="142.0" y1="276.0" x2="142.0" y2="288.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="288.0" y="290.0" width="244.0" height="150.0" rx="6" fill="#fdf6e3" stroke="#caa24a" stroke-width="1.9"/>
<text x="410.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">Паралельні ключі</text>
<line x1="304.0" y1="324.0" x2="516.0" y2="324.0" stroke="#caa24a" stroke-width="1.0"/>
<text x="410.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Спільна напруга керування:</tspan><tspan x="410.0" dy="13.2">«жадібний» загарбує струм.</tspan><tspan x="410.0" dy="13.2">Розрив: баластний R</tspan><tspan x="410.0" dy="13.2">у кожному емітері/витоку.</tspan></text>
<line x1="410.0" y1="276.0" x2="410.0" y2="288.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="556.0" y="290.0" width="244.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/>
<text x="678.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Комірка акумулятора</text>
<line x1="572.0" y1="324.0" x2="784.0" y2="324.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="678.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="678.0" dy="0.0">Дефект/прокол/перезаряд:</tspan><tspan x="678.0" dy="13.2">екзотерм. реакції з ~80–120°.</tspan><tspan x="678.0" dy="13.2">Петлю НЕ розірвати —</tspan><tspan x="678.0" dy="13.2">лише ловити й стримувати.</tspan></text>
<line x1="678.0" y1="276.0" x2="678.0" y2="288.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 3"/>
<rect x="20.0" y="452.0" width="780.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="410.0" y="469.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Дві маски ліворуч лікують схемотехнікою (розірвати петлю); праву — лише шарами захисту, бо тепло народжується всередині комірки.</tspan></text>
</svg>