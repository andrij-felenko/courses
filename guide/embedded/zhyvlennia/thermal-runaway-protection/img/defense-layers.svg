<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист шарами: кожен наступний рубіж ловить те, що пропустив попередній</text>
<rect x="60.0" y="70.0" width="700.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="90.0" cy="101.0" r="17.0" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<text x="90.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="124.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Прошивка: foldback</text>
<text x="124.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">зрізає струм за °C і dT/dt</text>
<text x="742.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">швидко, але гине з МК</text>
<line x1="410.0" y1="132.0" x2="410.0" y2="146.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="148.0" width="700.0" height="62.0" rx="6" fill="#fdf6e3" stroke="#caa24a" stroke-width="2.0"/>
<circle cx="90.0" cy="179.0" r="17.0" fill="#fff" stroke="#caa24a" stroke-width="2.0"/>
<text x="90.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#caa24a" text-anchor="middle" font-weight="700">2</text>
<text x="124.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Залізо: OTP-компаратор</text>
<text x="124.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">поріг у залізі рве затвор/драйв</text>
<text x="742.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="end" font-weight="700">працює, коли МК завис</text>
<line x1="410.0" y1="210.0" x2="410.0" y2="224.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="226.0" width="700.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="90.0" cy="257.0" r="17.0" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<text x="90.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="124.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Незалежний розрив</text>
<text x="124.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">запобіжник / eFuse / контактор</text>
<text x="742.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">остання електрична лінія</text>
<line x1="410.0" y1="288.0" x2="410.0" y2="302.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="304.0" width="700.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="90.0" cy="335.0" r="17.0" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<text x="90.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">4</text>
<text x="124.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Фізичне стримування</text>
<text x="124.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">зазори, бар'єри, відведення газів</text>
<text x="742.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">комірка згоріла — пакет цілий</text>
<line x1="34.0" y1="80.0" x2="34.0" y2="360.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="22" y="231" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" transform="rotate(-90 22 231)">що нижче — то незалежніше від прошивки →</text>
</svg>