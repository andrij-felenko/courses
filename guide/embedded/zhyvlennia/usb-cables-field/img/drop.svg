<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Падіння на дроті: 5 В виходять, 4.2 В доходять</text>
<rect x="50.0" y="96.0" width="124.0" height="80.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="112.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">зарядка</text>
<text x="112.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">5.0 В</text>
<line x1="174.0" y1="118.0" x2="600.0" y2="118.0" stroke="#b8860b" stroke-width="3.0"/>
<line x1="174.0" y1="152.0" x2="600.0" y2="152.0" stroke="#b8860b" stroke-width="3.0"/>
<rect x="348.0" y="100.0" width="78.0" height="36.0" rx="4" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/>
<text x="387.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">R кабелю</text>
<text x="387.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">R = 2×Rдроту + Rконтактів</text>
<line x1="232.0" y1="135.0" x2="296.0" y2="135.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="264.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">I →</text>
<rect x="600.0" y="96.0" width="134.0" height="80.0" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="667.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">пристрій</text>
<text x="667.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">4.2 В</text>
<rect x="110.0" y="224.0" width="540.0" height="104.0" rx="12" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ΔV = I × R   (закон Ома)</text>
<text x="380.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тонкий/довгий шнур при 3 А: ΔV ≈ 0.8 В → на пристрої 4.2 В (заряд гальмує)</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">та сама потужність вищою напругою (PD 9 В): струм менший → і падіння менше</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ось чому PD воліє підняти напругу, а не струм</text>
<rect x="60.0" y="348.0" width="640.0" height="36.0" rx="8" fill="#fbf7ec" stroke="#b8860b" stroke-width="1.4"/>
<text x="380.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Половину «не заряджає» в полі дає саме падіння на дешевому тонкому шнурі —</tspan><tspan x="380.0" dy="13.3">повний розрахунок є в 🧮-вставці про падіння на кабелі</tspan></text>
</svg>