<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому стеля кабелю — це струм: тепло росте як квадрат струму</text>
<text x="380.0" y="49.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втрата в кабелі P = I²·R (та сама потужність 60 Вт, R = 0.3 Ω)</text>
<line x1="120.0" y1="300.0" x2="700.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="120.0" y1="300.0" x2="120.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="112.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">втрата</text>
<text x="112.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">у міді</text>
<rect x="220.0" y="84.0" width="90.0" height="216.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="220" y="84" width="90" height="216" rx="4" fill="#c0392b" fill-opacity="0.18"/>
<text x="265.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">43.2 Вт</text>
<text x="265.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у тепло</text>
<text x="265.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 В</text>
<text x="265.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">I = 12.0 А</text>
<rect x="380.0" y="233.3" width="90.0" height="66.7" rx="4" fill="#b8860b" stroke="#b8860b" stroke-width="2.0"/>
<rect x="380" y="233" width="90" height="67" rx="4" fill="#b8860b" fill-opacity="0.18"/>
<text x="425.0" y="209.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">13.3 Вт</text>
<text x="425.0" y="225.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у тепло</text>
<text x="425.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">9 В</text>
<text x="425.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle">I = 6.7 А</text>
<rect x="540.0" y="286.5" width="90.0" height="13.5" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="540" y="286" width="90" height="13" rx="4" fill="#27ae60" fill-opacity="0.18"/>
<text x="585.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2.7 Вт</text>
<text x="585.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у тепло</text>
<text x="585.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">20 В</text>
<text x="585.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">I = 3.0 А</text>
<rect x="60.0" y="336.0" width="640.0" height="78.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм у чотири рази менший → тепло в ШІСТНАДЦЯТЬ разів менше (P ∝ I²)</text>
<text x="380.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Тонка жила має малу поверхню й швидко перегрівається — тому стеля кабелю задана саме СТРУМОМ (3 чи 5 А),</text>
<text x="380.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">а не потужністю. Підняти напругу — єдиний спосіб дати більше ват тим самим дротом, не спаливши його.</text>
</svg>