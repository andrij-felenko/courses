<text x="325.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle">VBUS</text>
<text x="325.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#b8860b" text-anchor="middle" font-weight="700">CC</text>
<text x="325.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle">GND</text>
<line x1="130.0" y1="128.0" x2="290.0" y2="128.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="130.0" y1="190.0" x2="290.0" y2="190.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="200.0" y1="128.0" x2="200.0" y2="158.0" stroke="#b8860b" stroke-width="2.0"/>
<rect x="176.0" y="156.0" width="48.0" height="18.0" rx="3" fill="#ffffff" stroke="#b8860b" stroke-width="1.6"/>
<text x="200.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">56 кΩ</text>
<line x1="200.0" y1="174.0" x2="200.0" y2="158.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="200.0" y1="174.0" x2="290.0" y2="160.0" stroke="#b8860b" stroke-width="2.0"/>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle">CC бачить 56 кΩ → «це кволий A-порт, тягни ≤ 500 мА/900 мА»</text>
<rect x="400.0" y="60.0" width="340.0" height="176.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="570.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Смертельний брак (кейс 2016)</text>
<rect x="420.0" y="108.0" width="70.0" height="96.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="455.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB-A</text>
<text x="455.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle">VBUS 5 В</text>
<text x="455.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle">GND</text>
<rect x="650.0" y="108.0" width="70.0" height="96.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="685.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB-C</text>
<text x="685.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle">VBUS</text>
<text x="685.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#2457d6" text-anchor="middle">GND</text>
<line x1="490.0" y1="128.0" x2="650.0" y2="190.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="490.0" y1="190.0" x2="650.0" y2="128.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="570.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle" font-weight="700">GND↔VBUS переставлено + 10 кΩ замість 56 кΩ</text>
<rect x="40.0" y="252.0" width="700.0" height="74.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="380.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що сталося: живлення подано в лінію землі пристрою — миттєвий зустрічний струм.</text>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">10 кΩ у плечі CC ще й брехав, що джерело дає 3 А, тож пристрій пробував тягнути втричі більше з кволого A-порту.</text>
<text x="380.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Підсумок: згоріли обидва USB-порти ноутбука, вбудований контролер і два PD-аналізатори тестувальника.</text>
<rect x="40.0" y="336.0" width="700.0" height="108.0" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Урок для власного пристрою</text>
<text x="60.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• CC-логіку (Rp від джерела, Rd у пристрої) довіряй мікросхемі-контролеру, не «двом резисторам навмання».</text>
<text x="60.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Не подавай VBUS, поки CC не підтвердив коректну орієнтацію й роль — це відсікає перевернуті/биті перехідники.</text>
<text x="60.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Захист від зворотної полярності на вході робить із «згорів» усього лиш «не заряджає».</text>
</svg>