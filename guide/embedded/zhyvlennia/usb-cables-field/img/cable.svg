<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що всередині USB-C кабелю — і чому вони такі різні</text>
<rect x="60.0" y="64.0" width="22.0" height="56.0" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="66.0" y="74.0" width="11.0" height="36.0" rx="0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<rect x="678.0" y="64.0" width="22.0" height="56.0" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="684.0" y="74.0" width="11.0" height="36.0" rx="0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<rect x="82.0" y="64.0" width="596.0" height="56.0" rx="12" fill="#fbfbf8" stroke="#6b7280" stroke-width="1.4"/>
<line x1="104.0" y1="78.0" x2="656.0" y2="78.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="104.0" y1="90.0" x2="656.0" y2="90.0" stroke="#b8860b" stroke-width="3.0"/>
<line x1="104.0" y1="102.0" x2="656.0" y2="102.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="104.0" y1="114.0" x2="656.0" y2="114.0" stroke="#27ae60" stroke-width="3.0"/>
<rect x="596.0" y="70.0" width="56.0" height="24.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="624.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">e-marker</text>
<line x1="70.0" y1="154.0" x2="100.0" y2="154.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="110.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">VBUS / GND — живлення; товщина дроту вирішує падіння</text>
<line x1="70.0" y1="180.0" x2="100.0" y2="180.0" stroke="#b8860b" stroke-width="3.0"/>
<text x="110.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">CC — орієнтація, роль, живить e-marker (VCONN)</text>
<line x1="70.0" y1="206.0" x2="100.0" y2="206.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="110.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">D+ / D− — дані USB 2.0</text>
<line x1="70.0" y1="232.0" x2="100.0" y2="232.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="110.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SS-пари — швидкі дані / відео (USB 3.x), є не в усіх</text>
<rect x="60.0" y="296.0" width="188.0" height="132.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="154.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">«тільки заряд»</text>
<line x1="76.0" y1="334.0" x2="232.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="154.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">лише VBUS/GND (іноді CC).</text>
<text x="154.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">даних нема — пристрій</text>
<text x="154.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">не домовиться по D+/D−</text>
<rect x="286.0" y="296.0" width="188.0" height="132.0" rx="10" fill="#fbf7ec" stroke="#b8860b" stroke-width="1.8"/>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">повний, 3 А</text>
<line x1="302.0" y1="334.0" x2="458.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="380.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">усі лінії, без e-marker.</text>
<text x="380.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">заряд і дані, але струм</text>
<text x="380.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">обмежать безпечними 3 А</text>
<rect x="512.0" y="296.0" width="188.0" height="132.0" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="606.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">5 А / EPR</text>
<line x1="528.0" y1="334.0" x2="684.0" y2="334.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="606.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">усі лінії + e-marker.</text>
<text x="606.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повний струм і висока</text>
<text x="606.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">напруга (потрібен чип)</text>
</svg>