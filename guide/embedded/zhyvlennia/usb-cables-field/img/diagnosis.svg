<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагностика «не заряджає» як інженерна задача</text>
<rect x="170.0" y="50.0" width="260.0" height="38.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="300.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Скарга: не заряджає / повільно</text>
<line x1="300.0" y1="88.0" x2="300.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<polygon points="300,115 415,150 300,185 185,150" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
<text x="300.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заряджає взагалі?</text>
<line x1="185.0" y1="150.0" x2="152.0" y2="150.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">ні</text>
<rect x="30.0" y="128.0" width="150.0" height="46.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="105.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">контакт / цілість</text>
<text x="105.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кабелю, роз'єм</text>
<line x1="300.0" y1="185.0" x2="300.0" y2="208.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="314.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">так, але мляво</text>
<rect x="170.0" y="208.0" width="260.0" height="44.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ВИМІРЯЙ VBUS на пристрої</text>
<text x="300.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">під навантаженням</text>
<line x1="300.0" y1="252.0" x2="300.0" y2="278.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<polygon points="300,280 420,318 300,356 180,318" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
<text x="300.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">VBUS просідає?</text>
<line x1="420.0" y1="318.0" x2="560.0" y2="318.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">так</text>
<rect x="560.0" y="294.0" width="180.0" height="50.0" rx="8" fill="#fbf7ec" stroke="#b8860b" stroke-width="2.0"/>
<text x="650.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">падіння на кабелі</text>
<text x="650.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">→ товщий/коротший шнур</text>
<line x1="300.0" y1="356.0" x2="300.0" y2="382.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="314.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ні (тримає, та струм малий)</text>
<polygon points="300,383 420,422 300,461 180,422" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
<text x="300.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переговори вдались?</text>
<text x="300.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CC / PD / BC1.2</text>
<line x1="420.0" y1="422.0" x2="560.0" y2="422.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ні</text>
<rect x="560.0" y="398.0" width="180.0" height="50.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="650.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">кабель без ліній / e-marker</text>
<text x="650.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чи джерело без профілю</text>
<line x1="300.0" y1="461.0" x2="300.0" y2="484.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="314.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<rect x="170.0" y="484.0" width="260.0" height="44.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="300.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">усе гаразд — це стеля</text>
<text x="300.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">цього блока/кабелю</text>
<rect x="50.0" y="534.0" width="660.0" height="18.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="380.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Не «магія», а перевірки по черзі: контакт → виміряй VBUS → просідання (кабель) → переговори</text>
</svg>