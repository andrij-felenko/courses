<rect x="60.0" y="316.0" width="660.0" height="92.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли міряти VBUS — три правила з фізики падіння</text>
<text x="80.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• тільки ПІД навантаженням — на холостому падіння нульове й діагноз завжди «все добре»;</text>
<text x="80.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• зачекай, поки струм устоїться — одразу після ввімкнення він дзвенить, і вимір бреше;</text>
<text x="80.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• усередни N відліків у вікні — один сирий відлік шумить сильніше за поріг рішення.</text>
