<text x="696.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">поріг brownout (напр. 3.4 В)</text>
<rect x="90" y="210" width="610" height="90" fill="#c0392b" fill-opacity="0.10"/>
<text x="395.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">нижче порога — пристрій падає / скидає заряд</text>
