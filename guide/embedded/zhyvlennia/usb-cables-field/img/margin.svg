<text x="98.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="start" font-weight="700">VBUS «на межі» — то вище, то нижче порога</text>
<text x="98.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">червоні точки = моменти «не зарядилось»</text>
<rect x="60.0" y="322.0" width="640.0" height="108.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Раз із трьох» = система стоїть упритул до порога, а вхід сам по собі гуляє:</text>
<text x="80.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• струм заряду міняється сам (батарея бере то більше, то менше) → падіння ΔV=I·R гуляє разом із ним;</text>
<text x="80.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• роз'єм нагрівся чи ворухнувся → опір контакту стрибнув → ще одне випадкове падіння;</text>
<text x="80.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• лік — не «знайти винного», а ВІДСУНУТИ від краю: товщий шнур, чистий роз'єм, нижчий поріг brownout.</text>
