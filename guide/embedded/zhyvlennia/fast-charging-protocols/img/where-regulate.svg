<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="770" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві філософії: гнати високу напругу — чи понизити її в самому адаптері</text>
<rect x="55.0" y="71.2" width="110.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Адаптер</tspan><tspan x="110.0" dy="15.6">9–20 В</tspan></text>
<line x1="175.0" y1="95.0" x2="520.0" y2="95.0" stroke="#27ae60" stroke-width="5.0"/><line x1="175.0" y1="113.0" x2="520.0" y2="113.0" stroke="#27ae60" stroke-width="5.0"/><text x="347.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">малий струм → кабель ХОЛОДНИЙ</text>
<rect x="525.0" y="65.2" width="150.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Пристрій:</tspan><tspan x="600.0" dy="14.3">перетворювач</tspan><tspan x="600.0" dy="14.3">9–20 В → у комірку</tspan></text>
<text x="385.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">тепло перетворення — у ПРИСТРОЇ (де тісно й нема куди його дівати)</text>
<rect x="55.0" y="157.0" width="110.0" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">QC, PD</tspan></text>
<line x1="40.0" y1="205.0" x2="730.0" y2="205.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<rect x="45.0" y="240.2" width="130.0" height="59.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Адаптер:</tspan><tspan x="110.0" dy="14.3">перетворювач</tspan><tspan x="110.0" dy="14.3">усередині</tspan></text>
<line x1="185.0" y1="270.0" x2="520.0" y2="270.0" stroke="#c0392b" stroke-width="5.0"/><line x1="185.0" y1="288.0" x2="520.0" y2="288.0" stroke="#c0392b" stroke-width="5.0"/><text x="352.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">великий струм → кабель ГРІЄТЬСЯ (товстий, з чипом)</text>
<rect x="545.0" y="240.2" width="130.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Пристрій:</tspan><tspan x="610.0" dy="14.3">майже прямо</tspan><tspan x="610.0" dy="14.3">у комірку</tspan></text>
<text x="385.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">тепло перетворення — у АДАПТЕРІ (великому, з власним радіатором)</text>
