<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="770" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дільник навпіл: висока напруга по кабелю, удвічі менший струм, учетверо менші втрати</text>
<rect x="35.0" y="138.4" width="120.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Адаптер</tspan><tspan x="95.0" dy="15.6">(PPS)</tspan><tspan x="95.0" dy="15.6">≈ 2·Vбат</tspan></text>
<line x1="160.0" y1="170.0" x2="360.0" y2="170.0" stroke="#27ae60" stroke-width="5.0"/>
<line x1="160.0" y1="186.0" x2="360.0" y2="186.0" stroke="#27ae60" stroke-width="5.0"/>
<text x="260.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">струм  I</text>
<text x="260.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">втрати  I²·R</text>
<rect x="370.0" y="138.4" width="140.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Дільник</tspan><tspan x="440.0" dy="15.6">навпіл  2:1</tspan><tspan x="440.0" dy="15.6">(charge pump)</tspan></text>
<line x1="515.0" y1="170.0" x2="600.0" y2="170.0" stroke="#c0392b" stroke-width="6.0"/>
<line x1="515.0" y1="186.0" x2="600.0" y2="186.0" stroke="#c0392b" stroke-width="6.0"/>
<text x="557.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2·I</text>
<text x="557.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">коротко</text>
<rect x="625.0" y="146.2" width="90.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="166.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Комірка</tspan><tspan x="670.0" dy="15.6">Vбат</tspan></text>
<rect x="150.0" y="250.0" width="470.0" height="54.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="385.0" y="273.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Та сама потужність до комірки, але по кабелю йде I, а не 2·I.</tspan><tspan x="385.0" dy="15.6">Половина струму → чверть втрат на кабелі (бо втрати ∝ струм²).</tspan></text>
</svg>