<text x="290.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">CV: струм спадає</text>
<text x="215.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">комірка бере багато лише на початку</text>
<text x="575.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди йде зайва потужність → у тепло</text>
<rect x="411.1" y="142.3" width="107.8" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="465.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">в адаптері</tspan><tspan x="465.0" dy="14.3">(перетворення)</tspan></text>
<rect x="527.0" y="142.3" width="96.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">на кабелі</tspan><tspan x="575.0" dy="14.3">I²·R</tspan></text>
<rect x="644.2" y="142.3" width="101.5" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="695.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">у комірці</tspan><tspan x="695.0" dy="14.3">(внутр. опір)</tspan></text>
<line x1="518.9" y1="165.0" x2="527.0" y2="165.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623.0" y1="165.0" x2="644.2" y2="165.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">удвічі більший струм → учетверо більше тепла</text>
<text x="575.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">одразу в усіх трьох місцях</text>
<text x="575.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">а гаряча комірка швидко старіє</text>
<text x="575.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">і стає небезпечною</text>
