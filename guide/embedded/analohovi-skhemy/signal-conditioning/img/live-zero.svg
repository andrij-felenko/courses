<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна логіка, дві доби: 3–15 psi → 4–20 мА</text>
<rect x="169.0" y="78.0" width="62.0" height="252.0" rx="6" fill="#eafaf0" stroke="#b9770e" stroke-width="1.8"/>
<rect x="169.0" y="330.0" width="62.0" height="58.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<line x1="169.0" y1="330.0" x2="231.0" y2="330.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="241.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">15 psi</text>
<text x="241.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">повна шкала</text>
<text x="241.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">3 psi</text>
<text x="241.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">живий нуль</text>
<text x="241.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">0 psi — трубка лопнула</text>
<text x="200.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пневматика (з 1930-х)</text>
<text x="200.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">робочий</tspan><tspan x="200.0" dy="13.8">діапазон</tspan><tspan x="200.0" dy="13.8">5 : 1</tspan></text>
<rect x="529.0" y="78.0" width="62.0" height="252.0" rx="6" fill="#eafaf0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="529.0" y="330.0" width="62.0" height="58.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<line x1="529.0" y1="330.0" x2="591.0" y2="330.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="601.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">20 мА</text>
<text x="601.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">повна шкала</text>
<text x="601.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4 мА</text>
<text x="601.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">живий нуль</text>
<text x="601.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">0 мА — обрив дроту</text>
<text x="560.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм (з 1950-х)</text>
<text x="560.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">робочий</tspan><tspan x="560.0" dy="13.8">діапазон</tspan><tspan x="560.0" dy="13.8">5 : 1</tspan></text>
<line x1="262" y1="204" x2="528" y2="204" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="395.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">та сама ідея</text>
<text x="395.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">живий нуль + 5:1</text>
<rect x="50.0" y="412.0" width="720.0" height="60.0" rx="6" fill="#fdf4f2" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="438.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Червона зона внизу — не «нуль шкали», а ВІДМОВА:</tspan><tspan x="410.0" dy="16.9">справний контур туди не заходить, тож один погляд відрізняє «нуль» від «зламалося».</tspan></text>
</svg>