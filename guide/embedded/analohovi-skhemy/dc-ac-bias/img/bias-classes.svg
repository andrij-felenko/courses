<rect x="20.0" y="284.0" width="780.0" height="44.0" rx="6" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вхід (сірий) усюди однаковий. Змінюємо тільки одне — рівень зміщення, тобто де стоїть поріг відсічки (зелений пунктир).</tspan><tspan x="410.0" dy="10.4">Опустиш поріг під сигнал — прилад відкритий завжди (клас A, чисто, але марнотратно). Піднімеш до середини — лише півперіод (клас B, удвічі ощадніше, треба другого в пару). Ще вище — лише вершечки (клас C, найощадніше, для радіопередавачів). Один параметр — уся родина класів.</tspan></text>
</svg>