<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один вузол — два погляди: ОП ставить робочу точку, сигнал гойдається довкола неї</text>
<rect x="60.0" y="60.0" width="280.0" height="60.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ПОГЛЯД ПО ПОСТІЙЦІ (DC)</tspan></text>
<text x="200.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">C_in, C_out, C_g — розрив</text>
<text x="200.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(конденсатор не пропускає DC)</text>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">«+» = Vref</text>
<text x="200.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">віртуальне коротке → «−» = Vref</text>
<text x="200.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вихід сидить на Vref ≈ Vcc/2</text>
<text x="200.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">підсилення по DC = ×1</text>
<line x1="360.0" y1="56.0" x2="360.0" y2="284.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="390.0" y="60.0" width="280.0" height="60.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ПОГЛЯД ПО ЗМІННІЙ (AC)</tspan></text>
<text x="530.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">C_in, C_out, C_g — коротке</text>
<text x="530.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(конденсатор для сигналу = дріт)</text>
<text x="530.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Vref «зникає» (це нерухомий рівень)</text>
<text x="530.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Rg тепер «на землі» через C_g</text>
<text x="530.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">підсилення сигналу = 1 + Rf/Rg</text>
<text x="530.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">схема = звичайний неінвертуючий</text>
</svg>