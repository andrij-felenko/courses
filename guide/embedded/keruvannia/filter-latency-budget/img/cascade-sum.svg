<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затримки ланок тракту додаються</text>
<rect x="60.0" y="115.0" width="150.0" height="70.0" rx="8" fill="#eef2f7" stroke="#333333" stroke-width="1.8"/>
<text x="135.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">медіана(3)</text>
<text x="135.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">≈ 1 відлік</text>
<text x="135.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1 мс</text>
<rect x="256.0" y="115.0" width="150.0" height="70.0" rx="8" fill="#eef2f7" stroke="#333333" stroke-width="1.8"/>
<text x="331.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">біквад-notch</text>
<text x="331.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">≈ 1 відлік</text>
<text x="331.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1 мс</text>
<rect x="452.0" y="115.0" width="150.0" height="70.0" rx="8" fill="#eef2f7" stroke="#333333" stroke-width="1.8"/>
<text x="527.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ковзне сер. N=21</text>
<text x="527.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(N−1)/2 = 10</text>
<text x="527.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">10 мс</text>
<line x1="20.0" y1="150.0" x2="54.0" y2="150.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="20.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">сирий</text>
<line x1="214.0" y1="150.0" x2="252.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="410.0" y1="150.0" x2="448.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="606.0" y1="150.0" x2="670.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="674.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">чистий</text>
<line x1="135.0" y1="193.0" x2="135.0" y2="282.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="527.0" y1="193.0" x2="527.0" y2="282.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="135.0" y1="282.0" x2="527.0" y2="282.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="136.2" y="288.5" width="507.6" height="39.0" rx="6" fill="#cdeccd" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">1 + 1 + 10 = 12 мс  —  повна групова затримка тракту</tspan></text>
<text x="390.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожна ланка окремо дрібна — разом легко пробʼють бюджет</text>
</svg>