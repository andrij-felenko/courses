<text x="866.7" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">−системна похибка</text>
<rect x="150.0" y="250.0" width="680.0" height="40.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="490.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чисте джерело → фільтр → рівні відліки → усереднення → калібрування = надійне число.</text>
<text x="490.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Пропустиш ланку — повернеться саме її біда.</text>
