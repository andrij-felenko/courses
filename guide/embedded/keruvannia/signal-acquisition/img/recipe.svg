<text x="678.3" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#7a4fb0" text-anchor="middle" font-weight="bold" font-style="normal">/ медіана</text>
<text x="678.3" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">−випадковий шум</text>
