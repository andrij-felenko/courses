<rect x="691.3" y="115.5" width="157.4" height="189.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Точка зламу —</tspan><tspan x="770.0" dy="16.9">частка «зіпсутих»,</tspan><tspan x="770.0" dy="16.9">що зриває оцінку:</tspan><tspan x="770.0" dy="16.9"></tspan><tspan x="770.0" dy="16.9">середнє: 0%</tspan><tspan x="770.0" dy="16.9">(1 викид → ∞)</tspan><tspan x="770.0" dy="16.9"></tspan><tspan x="770.0" dy="16.9">медіана: 50%</tspan><tspan x="770.0" dy="16.9">(тримає, поки</tspan><tspan x="770.0" dy="16.9">чесних більшість)</tspan></text>
<text x="450.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Медіана дивиться на ПОРЯДОК, тож розмір викиду їй байдужий; середнє додає його значення.</text>
