<ellipse cx="530.0" cy="150.0" rx="92" ry="34" fill="none" stroke="#c0392b" stroke-width="3"/><ellipse cx="530.0" cy="150.0" rx="66" ry="24" fill="none" stroke="#2457d6" stroke-width="3"/><ellipse cx="530.0" cy="150.0" rx="40" ry="15" fill="none" stroke="#27ae60" stroke-width="3"/><line x1="472.0" y1="208.0" x2="510.0" y2="208.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="588.0" y1="208.0" x2="550.0" y2="208.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="530.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">обидві осі крутять однаково</text><circle cx="530.0" cy="150.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="530.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">вісь на 90° — блокування</text>
