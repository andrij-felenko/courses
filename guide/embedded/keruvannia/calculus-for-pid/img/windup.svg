<text x="320.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегральне насичення (windup)</text>
<text x="320.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">причина — у накопичувачі, що ріс під час насичення:</text>
<text x="320.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Виконавчий орган уперся в межу, а I все накопичує — роздутий запас потім дає викид</text>
