<line x1="210.0" y1="250.0" x2="245.6" y2="161.9" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="251.6" y="159.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">вимір a_b</text>
<circle cx="210.0" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
