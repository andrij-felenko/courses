<text x="661.6" y="157.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">a_w</text>
<line x1="620.0" y1="250.0" x2="620.0" y2="158.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
