<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поворот вектора акселерометра у світові осі й віднімання тяжіння</text>
<line x1="210.0" y1="250.0" x2="312.0" y2="208.8" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
