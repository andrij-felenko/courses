<rect x="190.4" y="364.8" width="459.2" height="46.5" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/><text x="420.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">крихітна похибка q трохи криво повертає a_w → після − g лишається</tspan><tspan x="420.0" dy="15.0">фантомний горизонтальний залишок → його інтегрують у неіснуючий рух</tspan></text>
