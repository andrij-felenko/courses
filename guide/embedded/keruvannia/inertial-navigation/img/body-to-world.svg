<line x1="620.0" y1="250.0" x2="730.0" y2="250.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="620.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вгору (світ)</text>
<text x="736.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">північ</text>
