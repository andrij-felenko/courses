<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок інтегрування: спершу швидкість, тоді положення</text>
<rect x="40.0" y="60.0" width="340.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="210.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">semi-implicit Euler  ✓</tspan></text>
<rect x="40.0" y="128.0" width="340.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="210.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1)  vel += a · dt</tspan></text>
<line x1="210.0" y1="178.0" x2="210.0" y2="206.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="206.0" width="340.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="210.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">2)  pos += vel · dt</tspan></text>
<rect x="40.0" y="300.0" width="340.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">pos бере ВЖЕ оновлену vel:</tspan><tspan x="210.0" dy="16.2">крок узгоджений, енергія не</tspan><tspan x="210.0" dy="16.2">розбігається — стандарт для</tspan><tspan x="210.0" dy="16.2">навігації й фізики</tspan></text>
<rect x="440.0" y="60.0" width="340.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">explicit (forward) Euler  ✗</tspan></text>
<rect x="440.0" y="128.0" width="340.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="610.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1)  pos += vel · dt</tspan></text>
<line x1="610.0" y1="178.0" x2="610.0" y2="206.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="206.0" width="340.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="610.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">2)  vel += a · dt</tspan></text>
<rect x="440.0" y="300.0" width="340.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">pos бере СТАРУ vel (до кроку):</tspan><tspan x="610.0" dy="16.2">положення відстає на крок,</tspan><tspan x="610.0" dy="16.2">похибка накопичується</tspan><tspan x="610.0" dy="16.2">швидше — так НЕ роблять</tspan></text>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">та сама пара рядків — різний ПОРЯДОК. Спершу оновлюємо швидкість, тоді нею рухаємо положення.</text>
</svg>