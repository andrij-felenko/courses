<rect x="95.0" y="372.0" width="610.0" height="78.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="400.0" y="391.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Поточкова перевірка дивиться лише на вузли сітки (сині) — усі під стелею,</tspan><tspan x="400.0" dy="15.6">тож рапортує «вкладається». Але справжня крива (сіра) має вузький викид</tspan><tspan x="400.0" dy="15.6">між вузлами (червоний), що пробиває стелю. Між точками сітка сліпа:</tspan><tspan x="400.0" dy="15.6">густа сітка біля країв і за нулями — або перевірка з запасом.</tspan></text>
