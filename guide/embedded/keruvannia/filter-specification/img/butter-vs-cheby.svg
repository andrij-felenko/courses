<rect x="90.0" y="384.0" width="622.0" height="62.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="401.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="401.0" dy="0.0">За того самого порядку n Чебишов спадає крутіше: «дозволені брижі» в смузі</tspan><tspan x="401.0" dy="15.6">він перетворює на додаткову крутість зрізу. Тому до тієї самої стелі −As на ωs</tspan><tspan x="401.0" dy="15.6">він дотягується меншим n — cosh росте швидше за степінь, звідси формула через acosh.</tspan></text>
