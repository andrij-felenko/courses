<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Частотні методи перейшли з телефонних підсилювачів у наведення гармат</text>
<text x="195.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Bell Labs: телефон на тисячі км</text>
<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">MIT: наведення на ціль</text>
<line x1="390.0" y1="74.0" x2="390.0" y2="396.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 5"/>
<rect x="50.0" y="85.0" width="290.0" height="50.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="195.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсилювач спотворює голос</text><text x="195.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">десятки ламп на трасі → каша</text>
<rect x="50.0" y="160.0" width="290.0" height="50.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="195.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блек, 1927: від'ємний зв'язок</text><text x="195.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">віддати підсилення за чистоту</text>
<rect x="50.0" y="235.0" width="290.0" height="50.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="195.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найквіст, 1932: чи зірветься?</text><text x="195.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">крива в комплексній площині</text>
<rect x="50.0" y="310.0" width="290.0" height="50.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="195.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Боде, 1945: запас фази й підсил.</text><text x="195.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">діаграми підсилення й фази</text>
<line x1="195.0" y1="135.0" x2="195.0" y2="160.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="195.0" y1="210.0" x2="195.0" y2="235.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="195.0" y1="285.0" x2="195.0" y2="310.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="445.0" y="85.0" width="290.0" height="50.0" rx="7" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гармата мляво або розгойдується</text><text x="590.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ціль швидка, ціна — збитий літак</text>
<rect x="445.0" y="205.0" width="290.0" height="60.0" rx="7" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Голл, 1943 (таємно): частотний</tspan><tspan x="590.0" dy="14.4">погляд + ланка випередження</tspan></text>
<rect x="445.0" y="315.0" width="290.0" height="50.0" rx="7" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Браун і Кемпбелл, 1948</text><text x="590.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">lead/lag — у підручнику</text>
<line x1="590.0" y1="265.0" x2="590.0" y2="315.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="340.0" y1="260.0" x2="446.0" y2="235.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="340.0" y1="335.0" x2="446.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ті самі частотні</text>
<text x="390.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">інструменти →</text>
