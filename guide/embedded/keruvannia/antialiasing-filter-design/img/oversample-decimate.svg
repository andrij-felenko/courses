<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виграш: оцифровуй швидко, ріж круто в коді, проріджуй</text>
<rect x="56.6" y="86.5" width="122.8" height="67.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="118.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="118.0" dy="0.0">джерело</tspan><tspan x="118.0" dy="16.2">+ дешева</tspan><tspan x="118.0" dy="16.2">RC (1-й пор.)</tspan></text>
<rect x="278.0" y="86.5" width="84.0" height="67.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">АЦП</tspan><tspan x="320.0" dy="16.2">на M·fs</tspan><tspan x="320.0" dy="16.2">(швидко)</tspan></text>
<rect x="468.4" y="86.5" width="107.2" height="67.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="522.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="522.0" dy="0.0">цифровий</tspan><tspan x="522.0" dy="16.2">крутий ФНЧ</tspan><tspan x="522.0" dy="16.2">(зріз ≈ fp)</tspan></text>
<rect x="640.2" y="86.5" width="99.5" height="67.0" rx="6" fill="#fff8e1" stroke="#9a7d0a" stroke-width="1.5"/><text x="690.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">проріджу-</tspan><tspan x="690.0" dy="16.2">вання ÷M</tspan><tspan x="690.0" dy="16.2">→ вихід fs</tspan></text>
<line x1="182.4" y1="120.0" x2="275.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="365.0" y1="120.0" x2="465.4" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="578.6" y1="120.0" x2="637.2" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="80.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="700.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">частота →</text>
<line x1="154.4" y1="242.0" x2="154.4" y2="258.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="154.4" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">fp</text>
<line x1="228.8" y1="220.0" x2="228.8" y2="258.0" stroke="#9a7d0a" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="228.8" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7d0a" text-anchor="middle" font-weight="700">fs/2 (ціль)</text>
<line x1="650.4" y1="204.0" x2="650.4" y2="258.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="650.4" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">M·fs/2 (нова стіна)</text>
<rect x="154.4" y="232.0" width="496.0" height="18.0" fill="#f4d35e" opacity="0.30"/>
<path d="M 158.4 224.0 L 646.4 224.0" stroke="#9a7d0a" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="402.4" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7d0a" text-anchor="middle">тепер до стіни — океан місця: RC 1-го порядку встигає зрізати</text>
<rect x="80.0" y="290.0" width="620.0" height="150.0" rx="6" fill="#f7f9fb" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="342.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Ключ — НЕ робити круту аналогову стіну, а ВІДСУНУТИ її. Беремо відліки в M разів частіше (M = 4..256):</tspan><tspan x="390.0" dy="13.0">стіна Найквіста стрибає з fs/2 на M·fs/2, і між корисною смугою й нею лишається океан місця —</tspan><tspan x="390.0" dy="13.0">де навіть млява RC 1-го порядку встигає зрізати ВЧ-шум до безпечного. Усю круту роботу робить уже</tspan><tspan x="390.0" dy="13.0">ЦИФРОВИЙ фільтр (його легко зробити будь-яким крутим — він безкоштовний у залізі), а тоді сигнал</tspan><tspan x="390.0" dy="13.0">ПРОРІДЖУЮТЬ назад до потрібної fs. Бонус: усереднення M відліків додає ≈ log4(M) «чесних» біт.</tspan></text>
</svg>