<rect x="92.0" y="384.0" width="620.0" height="64.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="402.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="402.0" dy="0.0">Одна RC падає на 20 дБ за кожну ДЕКАДУ (×10) частоти за зрізом fc. Тож щоб дотиснути ВЧ-шум</tspan><tspan x="402.0" dy="14.3">на стіні fs/2 хоча б до −40 дБ (×100), стіна має бути на ДВІ декади вище зрізу: fs/2 ≈ 100·fc.</tspan><tspan x="402.0" dy="14.3">Якщо стіна ближче — однієї RC замало, потрібен вищий порядок АБО (краще) передискретизація.</tspan></text>
