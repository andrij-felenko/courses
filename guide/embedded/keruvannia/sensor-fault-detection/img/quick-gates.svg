<text x="242.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">ні</text>
<line x1="298.0" y1="138.0" x2="336.0" y2="138.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="336.0" y="104.0" width="144.0" height="68.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="408.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">швидкість</text>
<text x="408.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">|x−x₋₁| ≤ ΔMAX</text>
<text x="408.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">стрибок реальний?</text>
<line x1="408.0" y1="172.0" x2="408.0" y2="214.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="424.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">ні</text>
<line x1="480.0" y1="138.0" x2="518.0" y2="138.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="518.0" y="104.0" width="144.0" height="68.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
