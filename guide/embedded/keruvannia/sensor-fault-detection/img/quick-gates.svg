<text x="750.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вірю числу</text>
<rect x="170.0" y="224.0" width="560.0" height="40.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="450.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">будь-яке «ні» → давач під підозрою (прапор відмови)</text>
<text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">три перевірки, десяток рядків — ловлять найгрубіші відмови ще до решти тракту</text>
