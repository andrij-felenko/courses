<text x="606.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">ні</text>
<line x1="662.0" y1="138.0" x2="692.0" y2="138.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
