<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист FxLMS: три шари, три шкали часу</text>
<text x="360.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рубежі проти розгойдування — кожен на своїй шкалі часу</text>
<rect x="60.0" y="72.0" width="440.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="76.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Leakage (щотакту)</text>
<text x="76.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">слабка тяга коефіцієнтів до 0 — не дає дрейфувати в тиші</text>
<rect x="529.0" y="93.5" width="130.0" height="33.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="594.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="594.0" dy="0.0">ЗАПОБІГАЄ</tspan></text>
<rect x="60.0" y="197.0" width="440.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="76.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Клампінг (щотакту)</text>
<text x="76.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">жорстка стеля: значення за діапазоном тиснеться до краю, а не у тріск</text>
<rect x="529.0" y="218.5" width="130.0" height="33.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="594.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="594.0" dy="0.0">ЛОКАЛІЗУЄ</tspan></text>
<rect x="60.0" y="322.0" width="440.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="76.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Вотчдог (десятки мс)</text>
<text x="76.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">стало росте e[n] → скид фільтра + перевимір моделі S</text>
<rect x="529.0" y="343.5" width="130.0" height="33.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="594.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="594.0" dy="0.0">РЯТУЄ</tspan></text>
<line x1="60.0" y1="420.0" x2="660.0" y2="420.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="70.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">швидко (на відлік)</text>
<text x="650.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">повільно (десятки мс)</text>
<text x="360.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">запобігти  →  локалізувати  →  впіймати й відкотити</text>
</svg>