<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма біквада: чому в цілій арифметиці — пряма форма I</text>
<rect x="24.0" y="48.0" width="372.0" height="264.0" rx="6" fill="#f3faf5" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Пряма форма I</text>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4 комірки стану: x1 x2 y1 y2</text>
<circle cx="210.0" cy="150.0" r="20.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">Σ</text>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ОДНА точка підсумовування</text>
<line x1="110.0" y1="150.0" x2="228.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="90.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">b·x</text>
<line x1="310.0" y1="150.0" x2="192.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="330.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">−a·y</text>
<text x="210.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">усе множиться на ВХОДІ,</text>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">сумується РАЗ → 64-біт акум.,</text>
<text x="210.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">одне насичення на записі</text>
<text x="210.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">стан вузький → безпечний у Q31</text>
<rect x="424.0" y="48.0" width="372.0" height="264.0" rx="6" fill="#fdf2f1" stroke="#c0392b" stroke-width="1.8"/>
<text x="610.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Транспонована форма II</text>
<text x="610.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2 комірки стану: d1 d2</text>
<circle cx="534.0" cy="150.0" r="18.0" fill="#fde9e7" stroke="#c0392b" stroke-width="2.0"/>
<text x="534.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">d1</text>
<circle cx="684.0" cy="150.0" r="18.0" fill="#fde9e7" stroke="#c0392b" stroke-width="2.0"/>
<text x="684.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">d2</text>
<text x="610.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стан несе ЧАСТКОВІ суми</text>
<text x="610.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">ощадніша — 2 комірки замість 4,</text>
<text x="610.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">але стан має ВЕЛИКИЙ розмах,</text>
<text x="610.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">не влазить у Q31 без переповнення</text>
<text x="610.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">у CMSIS-DSP — лише float</text>
<text x="410.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">та сама передавальна функція — та в Q31 надійна лише DF1: один вузол суми, вузький стан</text>
</svg>