<text x="22.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">сирий відлік АЦП →</text>
<text x="798.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">→ чистий Q31</text>
<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">єдиний масштаб Q31 крізь увесь тракт; проміжні суми — у 64-бітному акумуляторі</text>
<text x="410.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">нелінійна медіана переповнення не боїться; обидва лінійні фільтри — бояться,</text>
<text x="410.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">а найгостріше боїться БІХ, бо його вихід вертається у власний вхід</text>
<text x="410.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">той самий ланцюжок, що в базовій темі, — тепер цілими числами на чипі без FPU</text>
