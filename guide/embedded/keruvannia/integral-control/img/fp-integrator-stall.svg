<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка: крихітний доданок тоне під молодшим бітом</text>
<rect x="44.0" y="58.0" width="330.0" height="236.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="209.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Наївно: масштабуємо доданок ОДРАЗУ</text>
<text x="209.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">inc = (e·Ki·Δt) &gt;&gt; 16</text>
<text x="74.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1 LSB накопичувача</text>
<rect x="74.0" y="150.0" width="40.0" height="26.0" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="94.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<text x="134.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">&gt;</text>
<rect x="160.0" y="158.0" width="40.0" height="10.0" rx="2" fill="#fbe4e1" stroke="#c0392b" stroke-width="1.2"/>
<text x="204.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">inc = 0.4  →  0</text>
<text x="209.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">доданок &lt; 1 → цілочислово стає 0</text>
<text x="209.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">накопичувач НЕ росте</text>
<text x="209.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зсув застигає — I мертвий за малих e</text>
<rect x="386.0" y="58.0" width="330.0" height="236.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="551.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: копимо БЕЗ зсуву</text>
<text x="551.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">I += e·Δt   (широкий, повний масштаб)</text>
<text x="551.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кожен крок додає повне e·Δt —</text>
<text x="551.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">молодші біти НЕ втрачаються</text>
<rect x="426.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="460.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="494.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="528.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="562.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<rect x="596.0" y="194.0" width="30.0" height="12.0" rx="2" fill="#d6f0e0" stroke="#27ae60" stroke-width="1.1"/>
<text x="551.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0.4 + 0.4 + 0.4 + …  →  накопичується</text>
<text x="551.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зсув робимо ЛИШЕ у вихід: (Ki·I) &gt;&gt; 16</text>
</svg>