<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому накопичувач мусить бути ширшим за все інше</text>
<text x="70.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">доданок за один такт:</text>
<rect x="70.0" y="74.0" width="96.0" height="40.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="118.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">e  (16 біт)</text><text x="118.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">помилка</text>
<text x="181.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle">×</text>
<rect x="196.0" y="74.0" width="116.0" height="40.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="254.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ki  (Q16)</text><text x="254.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">коефіцієнт</text>
<text x="327.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle">×</text>
<rect x="342.0" y="74.0" width="120.0" height="40.0" rx="5" fill="#fdf3e6" stroke="#b8791f" stroke-width="1.6"/><text x="402.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a5a12" text-anchor="middle" font-weight="700">Δt  (Q16, с)</text><text x="402.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крок часу</text>
<line x1="266.0" y1="136.0" x2="266.0" y2="164.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="278.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">розрядності складаються</text>
<rect x="150.0" y="172.0" width="420.0" height="44.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="360.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">e · Ki · Δt  →  до ~48 біт</text><text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">один доданок уже переростає 32 біти</text>
<line x1="266.0" y1="234.0" x2="266.0" y2="260.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="278.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">+ тисячі доданків за секунди</text>
<rect x="96.0" y="268.0" width="528.0" height="46.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="360.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">накопичувач I  —  64 біти (int64_t)</text>
<text x="360.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">у вихід повертаємо лише наприкінці: (Ki·I) зсунути назад і затиснути</text>
</svg>