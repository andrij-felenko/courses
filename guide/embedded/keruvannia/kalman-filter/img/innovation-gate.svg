<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист: ворота на викид + сторожа за нев'язкою</text>
<rect x="66.8" y="43.5" width="76.4" height="33.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="105.0" y="64.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">вимір z</tspan></text>
<rect x="30.0" y="110.0" width="150.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="105.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">нев'язка</tspan><tspan x="105.0" dy="15.6">y = z − x̂</tspan><tspan x="105.0" dy="15.6">розкид S = P + R</tspan></text>
<line x1="105.0" y1="78.0" x2="105.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<polygon points="105,184 195,230 105,276 15,230" fill="#fff7e6" stroke="#1a1a1a" stroke-width="2"/>
<text x="105.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">y² &lt; g²·S ?</tspan><tspan x="105.0" dy="15.0">(g ≈ 3 сигми)</tspan></text>
<line x1="105.0" y1="174.0" x2="105.0" y2="184.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="195.0" y1="230.0" x2="250.0" y2="230.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="222.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<rect x="250.0" y="198.0" width="230.0" height="64.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">КОРЕКЦІЯ</tspan><tspan x="365.0" dy="15.6">x̂ ← x̂ + K·y</tspan><tspan x="365.0" dy="15.6">P ← (1−K)·P</tspan></text>
<line x1="105.0" y1="276.0" x2="105.0" y2="312.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="135.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ні — викид</text>
<rect x="30.0" y="312.0" width="230.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">ПРОПУСТИТИ вимір</tspan><tspan x="145.0" dy="15.0">(корекції немає, лише</tspan><tspan x="145.0" dy="15.0">росте P далі)</tspan></text>
<rect x="250.0" y="290.0" width="450.0" height="78.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="475.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">СТОРОЖА РОЗХОДЖЕННЯ: стеж за нев'язкою y у часі.</tspan><tspan x="475.0" dy="15.0">y скаче навколо нуля → фільтр здоровий.</tspan><tspan x="475.0" dy="15.0">y стало в один бік або |y| росте → Q/R погані, фільтр повзе геть.</tspan></text>
</svg>