<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл Калмана: непевність дихає — росте, тоді спадає</text>
<rect x="255.0" y="36.0" width="210.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">СТАН</tspan><tspan x="360.0" dy="15.0">оцінка x̂ + непевність P</tspan></text>
<rect x="495.0" y="161.0" width="210.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ПЕРЕДБАЧ</tspan><tspan x="600.0" dy="15.0">x̂ ← модель(x̂)</tspan><tspan x="600.0" dy="15.0">P ← P + Q  (росте)</tspan></text>
<rect x="255.0" y="286.0" width="210.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">ВИМІР z</tspan><tspan x="360.0" dy="15.0">прийшов з давача</tspan><tspan x="360.0" dy="15.0">шум R</tspan></text>
<rect x="15.0" y="161.0" width="210.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ВИПРАВ</tspan><tspan x="120.0" dy="15.0">x̂ ← x̂ + K·(z − x̂)</tspan><tspan x="120.0" dy="15.0">P ← (1−K)·P  (спадає)</tspan></text>
<line x1="459.3" y1="90.3" x2="500.7" y2="174.7" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.7" y1="215.3" x2="459.3" y2="299.7" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="260.7" y1="299.7" x2="219.3" y2="215.3" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="219.3" y1="174.7" x2="260.7" y2="90.3" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">P росте</text>
<text x="175.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">P спадає</text>
