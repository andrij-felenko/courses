<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Друга змінна стану: онлайн-оцінка зсуву нуля (bias)</text>
<rect x="40.0" y="70.0" width="280.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ОДНА ЗМІННА</tspan><tspan x="180.0" dy="16.2"></tspan><tspan x="180.0" dy="16.2">x̂ — оцінка величини</tspan><tspan x="180.0" dy="16.2">P — її непевність</tspan><tspan x="180.0" dy="16.2"></tspan><tspan x="180.0" dy="16.2">сталий зсув давача</tspan><tspan x="180.0" dy="16.2">потрапляє ПРЯМО в x̂</tspan><tspan x="180.0" dy="16.2">→ оцінка зміщена</tspan></text>
<rect x="400.0" y="70.0" width="280.0" height="120.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ДВІ ЗМІННІ</tspan><tspan x="540.0" dy="16.2"></tspan><tspan x="540.0" dy="16.2">x̂ — оцінка величини</tspan><tspan x="540.0" dy="16.2">b̂ — оцінка зсуву нуля</tspan><tspan x="540.0" dy="16.2">P — матриця 2×2</tspan><tspan x="540.0" dy="16.2"></tspan><tspan x="540.0" dy="16.2">фільтр САМ ділить вимір</tspan><tspan x="540.0" dy="16.2">на сигнал і зсув</tspan></text>
<line x1="326.0" y1="130.0" x2="394.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">+b̂</text>
<text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">модель руху двох змінних за такт:</text>
<rect x="120.0" y="250.0" width="480.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">величина дрейфує:   x ← x          (+ шум процесу Qx — великий)</tspan><tspan x="360.0" dy="15.6">зсув майже сталий:  b ← b          (+ шум процесу Qb — крихітний)</tspan><tspan x="360.0" dy="15.6">вимір бачить суму:  z = (x + b) + шум R</tspan></text>
</svg>