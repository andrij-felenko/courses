<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місток C = Q/(1−G·Q): звідки (λ + θ) та інтегратор ПІ</text>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">місток:  класичний ПІ   C(s) = Q / ( 1 − G·Q )</text>
<rect x="130.0" y="58.0" width="460.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">G·Q  =  e^(−θs) / (λs + 1)</tspan></text>
<text x="360.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">раціональна частина об'єкта скоротилась проти оберненої моделі — лишились фільтр λ і затримка</text>
<rect x="130.0" y="142.0" width="460.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="360.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">1 − G·Q  =  (λs+1) − (1−θs)  =  (λ + θ)s</tspan></text>
<text x="360.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">e^(−θs) ≈ 1 − θs   (перший порядок)</text>
<text x="360.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">одиниці гасяться  →  у C(s) з'являється 1/s : інтегратор ПІ</text>
<text x="360.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">θs стає поряд із λs  →  спільний множник (λ + θ) у знаменнику Kp</text>
</svg>