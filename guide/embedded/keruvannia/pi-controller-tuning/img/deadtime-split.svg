<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чисту затримку обернути не можна — звідси (λ + θ) у формулі</text>
<rect x="135.0" y="68.0" width="210.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="240.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">K / (τs + 1)</text>
<text x="240.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">оборотна частина</text>
<text x="360.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">×</text>
<rect x="380.0" y="68.0" width="200.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="480.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">e^(−θs)</text>
<text x="480.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">чиста затримка — НЕ оборотна</text>
<line x1="480.0" y1="128.0" x2="480.0" y2="164.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="488.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">наближення 1-го порядку</text>
<rect x="60.0" y="184.0" width="600.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="360.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">e^(−θs)  ≈  1 / (θs + 1)      →      знаменник  λs + 1  +  θs  =  (λ + θ)s + 1</tspan></text>
<text x="360.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">затримку θ не можна скасувати — вона просто додається до λ у знаменнику Kp</text>
</svg>