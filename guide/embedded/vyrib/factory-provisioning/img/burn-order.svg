<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка неповернення: усе оборотне спершу, необоротне — останнім</text>
<line x1="60.0" y1="150.0" x2="800.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="798.0" y1="150.0" x2="820.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="808.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час</text>
<rect x="60.0" y="110.0" width="488.4" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<text x="304.2" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ОБОРОТНА ЗОНА — Flash перезаписуваний, усе можна перешити</text>
<rect x="548.4" y="110.0" width="251.6" height="34.0" rx="6" fill="#fff3d6" stroke="#b07a35" stroke-width="1.4"/>
<text x="674.2" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07a35" text-anchor="middle" font-weight="700">НЕОБОРОТНО</text>
<circle cx="119.2" cy="150.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="119.2" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="119.2" dy="0.0">прошити</tspan><tspan x="119.2" dy="12.0">образ</tspan></text>
<circle cx="237.6" cy="150.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="237.6" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="237.6" dy="0.0">записати</tspan><tspan x="237.6" dy="12.0">особистість</tspan></text>
<circle cx="356.0" cy="150.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="356.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="356.0" dy="0.0">звірити:</tspan><tspan x="356.0" dy="12.0">читання назад</tspan></text>
<circle cx="467.0" cy="150.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="467.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="467.0" dy="0.0">самотест</tspan><tspan x="467.0" dy="12.0">зелений?</tspan></text>
<circle cx="637.2" cy="150.0" r="7.0" fill="#fff3d6" stroke="#b07a35" stroke-width="2.0"/>
<text x="637.2" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b07a35" text-anchor="middle" font-weight="700"><tspan x="637.2" dy="0.0">ПРОПАЛИТИ</tspan><tspan x="637.2" dy="12.0">eFuse</tspan></text>
<circle cx="740.8" cy="150.0" r="7.0" fill="#eafaf1" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="740.8" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.8" dy="0.0">запис</tspan><tspan x="740.8" dy="12.0">у БД</tspan></text>
<rect x="60.0" y="250.0" width="740.0" height="106.0" rx="6" fill="#f4f6f8" stroke="#b07a35" stroke-width="1.6"/><text x="430.0" y="279.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">ЧОМУ такий порядок — це виведення, не смак. Пропалений eFuse НЕ ВІДКОТИШ: зіпсуєш біт, заллєш не той ключ,</tspan><tspan x="430.0" dy="13.7">увімкнеш захист зарано — плата або мертва, або назавжди зачинена. Тому необоротний крок ставлять ОСТАННІМ</tspan><tspan x="430.0" dy="13.7">і роблять ЛИШЕ після того, як усе оборотне вже підтверджено зчитуванням і самотестом. Помилку в оборотній зоні</tspan><tspan x="430.0" dy="13.7">виправляє перешивання; помилку в необоротній — уже НІЩО. Порядок кроків станції — страховка від необоротної</tspan><tspan x="430.0" dy="13.7">помилки, помноженої на тисячу плат.</tspan></text>
</svg>