<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де народжується секрет: ланцюг довіри й недовірений завод</text>
<text x="430.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Задум: приватний ключ народжується В ЧИПІ й НІКОЛИ його не покидає</text>
<rect x="56.0" y="150.0" width="176.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="144.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЧИП на платі</text>
<text x="144.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="144.0" dy="0.0">1. згенерувати пару</tspan><tspan x="144.0" dy="13.0">ключів усередині</tspan></text>
<text x="144.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">приват. ключ тут і помре</text>
<rect x="628.0" y="150.0" width="176.0" height="100.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="716.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЦС виробника (HSM)</text>
<text x="716.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="716.0" dy="0.0">3. підписати відкритий</tspan><tspan x="716.0" dy="13.0">ключ кореневим</tspan></text>
<text x="716.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">корінь довіри — у HSM</text>
<line x1="236.0" y1="176.0" x2="624.0" y2="176.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="430.0" dy="0.0">2. лише ВІДКРИТИЙ ключ (CSR) — назовні</tspan></text>
<line x1="624.0" y1="228.0" x2="236.0" y2="228.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="430.0" dy="0.0">4. СЕРТИФІКАТ (підписаний відкр. ключ) — назад у розділ даних</tspan></text>
<text x="430.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ЧОМУ приватний ключ не дають самому заводу-складачу (contract manufacturer)</text>
<rect x="56.0" y="314.0" width="372.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="242.0" y="341.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="242.0" dy="0.0">ЯКБИ ключ генерували НА ХОСТІ станції й заливали:</tspan><tspan x="242.0" dy="13.0">у мить заливання приватний ключ ІСНУЄ поза чипом —</tspan><tspan x="242.0" dy="13.0">у пам'яті станції, у файлі, у логах. Скомпрометований</tspan><tspan x="242.0" dy="13.0">завод → скомпрометовано КОЖЕН ключ, що там пройшов.</tspan><tspan x="242.0" dy="13.0">Це «вікно вразливості» транспортування секрету.</tspan></text>
<rect x="444.0" y="314.0" width="360.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="624.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="624.0" dy="0.0">ГЕНЕРАЦІЯ НА БОРТУ це вікно закриває:</tspan><tspan x="624.0" dy="13.0">приватний ключ ніколи не покидає кремній,</tspan><tspan x="624.0" dy="13.0">заводу нема чого вкрасти — він бачить лише</tspan><tspan x="624.0" dy="13.0">відкритий ключ. Там, де чип так не вміє,</tspan><tspan x="624.0" dy="13.0">ключ вливають із HSM/захищеного елемента,</tspan><tspan x="624.0" dy="13.0">а не з відкритого файлу на станції.</tspan></text>
</svg>