<rect x="70.0" y="314.0" width="680.0" height="34.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="334.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Ключ теми: серійник — не 'наступне число', а ЗАПИС у БД, що переходить станами під захистом транзакції.</tspan></text>
