<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Такт станції: із чого складається час на ОДНУ плату</text>
<rect x="60.0" y="92.0" width="88.8" height="54.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.8"/>
<text x="104.4" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="104.4" dy="0.0">завести</tspan><tspan x="104.4" dy="13.7">плату</tspan></text>
<text x="104.4" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 с</text>
<text x="104.4" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="104.4" dy="0.0">оператор кладе,</tspan><tspan x="104.4" dy="11.2">голки притискаються</tspan></text>
<rect x="148.8" y="92.0" width="355.2" height="54.0" rx="6" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="326.4" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="326.4" dy="0.0">прошити</tspan><tspan x="326.4" dy="13.7">образ</tspan></text>
<text x="326.4" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">12 с</text>
<text x="326.4" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="326.4" dy="0.0">вузьке місце —</tspan><tspan x="326.4" dy="11.2">росте з розміру .bin</tspan></text>
<rect x="504.0" y="92.0" width="59.2" height="54.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="533.6" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="533.6" dy="0.0">записати</tspan><tspan x="533.6" dy="13.7">особистість</tspan></text>
<text x="533.6" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 с</text>
<text x="533.6" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="533.6" dy="0.0">серійник, MAC,</tspan><tspan x="533.6" dy="11.2">калібр. у розділ</tspan></text>
<rect x="563.2" y="92.0" width="177.6" height="54.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="652.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="652.0" dy="0.0">звірити +</tspan><tspan x="652.0" dy="13.7">самотест</tspan></text>
<text x="652.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">6 с</text>
<text x="652.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="652.0" dy="0.0">прочитати назад,</tspan><tspan x="652.0" dy="11.2">дати платі стартувати</tspan></text>
<rect x="740.8" y="92.0" width="59.2" height="54.0" rx="6" fill="#fbfbfb" stroke="#b07a35" stroke-width="1.8"/>
<text x="770.4" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b07a35" text-anchor="middle" font-weight="700"><tspan x="770.4" dy="0.0">пропалити</tspan><tspan x="770.4" dy="13.7">eFuse</tspan></text>
<text x="770.4" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 с</text>
<text x="770.4" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="770.4" dy="0.0">необоротно,</tspan><tspan x="770.4" dy="11.2">в останню чергу</tspan></text>
<line x1="60.0" y1="76.0" x2="800.0" y2="76.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="60.0" y1="76.0" x2="60.0" y2="82.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="800.0" y1="76.0" x2="800.0" y2="82.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="430.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">такт ≈ 25 с на плату</text>
<rect x="60.0" y="300.0" width="233.3" height="96.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="176.7" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="176.7" dy="0.0">ПРОПУСКНА ЗДАТНІСТЬ</tspan><tspan x="176.7" dy="13.7">3600 с/год ÷ такт</tspan><tspan x="176.7" dy="13.7">= 3600 ÷ 25 ≈ 144</tspan><tspan x="176.7" dy="13.7">плати за годину</tspan><tspan x="176.7" dy="13.7">з ОДНІЄЇ голови</tspan></text>
<rect x="313.3" y="300.0" width="233.3" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="430.0" dy="0.0">ВУЗЬКЕ МІСЦЕ — прошивка.</tspan><tspan x="430.0" dy="13.7">Подвоївся розмір образу —</tspan><tspan x="430.0" dy="13.7">подвоївся найдовший</tspan><tspan x="430.0" dy="13.7">стовпчик, а з ним і такт.</tspan><tspan x="430.0" dy="13.7">Ось чому образ тиснуть.</tspan></text>
<rect x="566.7" y="300.0" width="233.3" height="96.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="683.3" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="683.3" dy="0.0">ПАРАЛЕЛЬ рятує: N голів</tspan><tspan x="683.3" dy="13.7">шиють N плат заразом,</tspan><tspan x="683.3" dy="13.7">такт той самий, а плат/год</tspan><tspan x="683.3" dy="13.7">× N. Тому станції</tspan><tspan x="683.3" dy="13.7">роблять багатоголовими.</tspan></text>
</svg>