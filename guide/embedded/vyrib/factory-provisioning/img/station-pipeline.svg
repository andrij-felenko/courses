<text x="410.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Проходить усі п'ять — плата готова до відвантаження; спіткнулась на будь-якому — у брак.</text>
