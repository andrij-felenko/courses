<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві станції просять номер одночасно — транзакція шикує їх у чергу</text>
<rect x="50.0" y="90.0" width="130.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="115.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Голова A</tspan></text>
<rect x="50.0" y="250.0" width="130.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="115.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Голова B</tspan></text>
<rect x="330.0" y="150.0" width="180.0" height="130.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="420.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">БАЗА ДАНИХ</text>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">транзакція = замок</text>
<rect x="346.0" y="212.0" width="148.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">поки A всередині —</tspan><tspan x="420.0" dy="13.0">B чекає (SQLITE_BUSY /</tspan><tspan x="420.0" dy="13.0">FOR UPDATE), не лізе</tspan></text>
<line x1="180.0" y1="115.0" x2="328.0" y2="180.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">дай номер</text>
<line x1="180.0" y1="275.0" x2="328.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">дай номер</text>
<rect x="550.0" y="120.0" width="240.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="670.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">A ← 42</tspan><tspan x="670.0" dy="14.3">(зайшла першою, взяла замок)</tspan></text>
<rect x="550.0" y="230.0" width="240.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="670.0" y="249.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">B ← 43</tspan><tspan x="670.0" dy="14.3">(дочекалась, взяла наступний)</tspan></text>
<line x1="510.0" y1="180.0" x2="548.0" y2="143.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="260.0" x2="548.0" y2="253.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="356.0" width="740.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="420.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Без транзакції обидві прочитали б 42 і зашили б 42 у ДВІ плати. Транзакція робить 'прочитати+збільшити' неподільним.</tspan></text>
</svg>