<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 508" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="508" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому «зашити, тоді збільшити лічильник» роздвоює номери</text>
<rect x="44.0" y="74.0" width="380.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="234.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="234.0" dy="0.0">інкремент ПІСЛЯ запису — роздвоює</tspan></text>
<rect x="476.0" y="74.0" width="380.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="666.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="666.0" dy="0.0">зарезервувати ПЕРЕД, підтвердити ПІСЛЯ</tspan></text>
<rect x="64.0" y="132.0" width="340.0" height="44.0" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.4"/><text x="234.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="234.0" dy="0.0">прочитати лічильник → 42</tspan></text>
