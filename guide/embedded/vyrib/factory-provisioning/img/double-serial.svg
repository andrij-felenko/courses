<line x1="234.0" y1="236.0" x2="234.0" y2="252.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="64.0" y="252.0" width="340.0" height="44.0" rx="6" fill="#fff3d6" stroke="#c0392b" stroke-width="1.4"/><text x="234.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="234.0" dy="0.0">⚡ збій живлення ТУТ</tspan></text>
