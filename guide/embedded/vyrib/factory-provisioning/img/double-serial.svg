<rect x="64.0" y="312.0" width="340.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="234.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="234.0" dy="0.0">лічильник ще 42 (не зріс)</tspan></text>
<line x1="234.0" y1="356.0" x2="234.0" y2="372.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
