<rect x="44.0" y="438.0" width="380.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="234.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="234.0" dy="0.0">БІДА: два вироби в полі з номером 42.</tspan><tspan x="234.0" dy="14.3">База бреше, який з них який.</tspan></text>
<rect x="476.0" y="438.0" width="380.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="666.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="666.0" dy="0.0">БЕЗПЕЧНО: гірше — дірка в нумерації.</tspan><tspan x="666.0" dy="14.3">Дублікатів немає НІКОЛИ.</tspan></text>
