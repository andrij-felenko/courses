<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Офлайн-станція без зв'язку з базою: видати їй БЛОК номерів наперед</text>
<rect x="300.0" y="70.0" width="220.0" height="70.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="410.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЦЕНТРАЛЬНА БАЗА</text>
<text x="410.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">єдиний реєстр усіх блоків</text>
<rect x="70.0" y="210.0" width="280.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="210.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Станція 1 (офлайн)</tspan></text>
<rect x="70.0" y="262.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="210.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="210.0" dy="0.0">блок 1000–1999  (1000 номерів наперед)</tspan></text>
<rect x="70.0" y="308.0" width="280.0" height="44.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">роздає зі свого блоку локально,</tspan><tspan x="210.0" dy="13.0">без запиту до бази щоразу</tspan></text>
<line x1="330.0" y1="140.0" x2="210.0" y2="208.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="210.0" width="280.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="610.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Станція 2 (офлайн)</tspan></text>
<rect x="470.0" y="262.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="610.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="610.0" dy="0.0">блок 2000–2999  (1000 номерів наперед)</tspan></text>
<rect x="470.0" y="308.0" width="280.0" height="44.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.0"/><text x="610.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">роздає зі свого блоку локально,</tspan><tspan x="610.0" dy="13.0">без запиту до бази щоразу</tspan></text>
<line x1="490.0" y1="140.0" x2="610.0" y2="208.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">видати блок</text>
<text x="450.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">видати блок</text>
<rect x="70.0" y="334.0" width="680.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="353.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">База ділить простір номерів на НЕПЕРЕСІЧНІ блоки. Блоки не перетинаються → станції ніколи не видадуть однаковий номер, навіть офлайн.</tspan></text>
</svg>