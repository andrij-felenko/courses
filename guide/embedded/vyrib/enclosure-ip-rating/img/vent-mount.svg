<rect x="177.0" y="160.0" width="8.0" height="70.0" rx="6" fill="#cfd8e3" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="114.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="114.0" dy="0.0">корпус</tspan><tspan x="114.0" dy="14.3">вента</tspan></text>
<rect x="193.0" y="192.0" width="34.0" height="6.0" rx="6" fill="#d8f5e3" stroke="#27ae60" stroke-width="2.0"/>
