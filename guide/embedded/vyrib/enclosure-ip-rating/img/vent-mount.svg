<text x="210.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">повітря ⇄ пара</text>
<circle cx="170.0" cy="173.0" r="9.0" fill="#cfe3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="170.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вода ✗</text>
<rect x="465.0" y="87.5" width="250.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">①  забиті пори</tspan></text>
<rect x="465.0" y="113.5" width="250.0" height="73.9" rx="6" fill="#fffdf3" stroke="#d9c27a" stroke-width="1.5"/><text x="590.0" y="132.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">мастило, фарба, бруд</tspan><tspan x="590.0" dy="14.3">сідають на плівку —</tspan><tspan x="590.0" dy="14.3">вент «оглух», дихати</tspan><tspan x="590.0" dy="14.3">нема чим</tspan></text>
<rect x="465.0" y="220.4" width="250.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="241.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">②  перетяг монтажу</tspan></text>
<rect x="465.0" y="246.4" width="250.0" height="73.9" rx="6" fill="#fffdf3" stroke="#d9c27a" stroke-width="1.5"/><text x="590.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">закрутив надто сильно —</tspan><tspan x="590.0" dy="14.3">мембрана тріснула або</tspan><tspan x="590.0" dy="14.3">фланець підвернувся,</tspan><tspan x="590.0" dy="14.3">IP пропав</tspan></text>
<rect x="465.0" y="353.3" width="250.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="374.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">③  замалий на об'єм</tspan></text>
<rect x="465.0" y="379.4" width="250.0" height="73.9" rx="6" fill="#fffdf3" stroke="#d9c27a" stroke-width="1.5"/><text x="590.0" y="398.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">великий корпус, крихітний</tspan><tspan x="590.0" dy="14.3">вент: не встигає зрівняти</tspan><tspan x="590.0" dy="14.3">тиск за швидку зміну —</tspan><tspan x="590.0" dy="14.3">помпа вертається</tspan></text>
