<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плата міряє й доповідає — джиг судить і протоколює</text>
<rect x="40.0" y="62.0" width="300.0" height="32.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="81.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Бік плати (DUT): лише міряє й повідомляє</tspan></text>
<rect x="480.0" y="62.0" width="300.0" height="32.0" rx="6" fill="#fbf7ee" stroke="#b07a35" stroke-width="1.5"/><text x="630.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b07a35" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Бік джига: лише судить і протоколює</tspan></text>
<rect x="40.0" y="110.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="1.3"/><text x="190.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="190.0" dy="0.0">старт (POST) — до головного циклу</tspan></text>
<line x1="190.0" y1="150.0" x2="190.0" y2="164.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="166.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#1a1a1a" stroke-width="1.3"/><text x="190.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. читає власні шини АЦП (Vref, 3.3/5 В)</tspan></text>
<line x1="190.0" y1="206.0" x2="190.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="222.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#1a1a1a" stroke-width="1.3"/><text x="190.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">2. ганяє GPIO-петлі: 1→1, 0→0</tspan></text>
<line x1="190.0" y1="262.0" x2="190.0" y2="276.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="278.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#1a1a1a" stroke-width="1.3"/><text x="190.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">3. опитує давачі: регістр WHO_AM_I</tspan></text>
<line x1="190.0" y1="318.0" x2="190.0" y2="332.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="334.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#1a1a1a" stroke-width="1.3"/><text x="190.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">зшиває рапорт + XOR-сума</tspan></text>
<line x1="190.0" y1="374.0" x2="190.0" y2="388.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="390.0" width="300.0" height="40.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="1.3"/><text x="190.0" y="413.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="190.0" dy="0.0">шле рядок $RPT;… по UART / SWD</tspan></text>
<rect x="480.0" y="110.0" width="300.0" height="40.0" rx="6" fill="#fdfaf3" stroke="#b07a35" stroke-width="1.3"/><text x="630.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07a35" text-anchor="middle"><tspan x="630.0" dy="0.0">чекає рядок із ТАЙМАУТОМ</tspan></text>
<line x1="630.0" y1="150.0" x2="630.0" y2="164.0" stroke="#b07a35" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="166.0" width="300.0" height="40.0" rx="6" fill="#fdfaf3" stroke="#1a1a1a" stroke-width="1.3"/><text x="630.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">перевіряє XOR-суму (цілий?)</tspan></text>
<line x1="630.0" y1="206.0" x2="630.0" y2="220.0" stroke="#b07a35" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="222.0" width="300.0" height="40.0" rx="6" fill="#fdfaf3" stroke="#1a1a1a" stroke-width="1.3"/><text x="630.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">звіряє поля з таблицею допусків</tspan></text>
<line x1="630.0" y1="262.0" x2="630.0" y2="276.0" stroke="#b07a35" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="278.0" width="300.0" height="40.0" rx="6" fill="#fdfaf3" stroke="#c0392b" stroke-width="1.3"/><text x="630.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="630.0" dy="0.0">вирок: ПРОЙШЛА / БРАК</tspan></text>
<line x1="630.0" y1="318.0" x2="630.0" y2="332.0" stroke="#b07a35" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="334.0" width="300.0" height="40.0" rx="6" fill="#fdfaf3" stroke="#1a1a1a" stroke-width="1.3"/><text x="630.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">запис у журнал за серійником SN</tspan></text>
<line x1="340.0" y1="410.0" x2="410.0" y2="410.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="410.0" y1="410.0" x2="410.0" y2="130.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="410.0" y1="130.0" x2="478.0" y2="130.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">рапорт</text>
<text x="410.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">$RPT;…</text>
<line x1="780.0" y1="130.0" x2="804.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<line x1="804.0" y1="130.0" x2="804.0" y2="410.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="812.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start"><tspan x="812.0" dy="0.0">нема</tspan><tspan x="812.0" dy="12.3">відповіді</tspan></text>
<line x1="804.0" y1="410.0" x2="782.0" y2="410.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480.0" y="390.0" width="300.0" height="46.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="630.0" dy="0.0">ТИША → ТАЙМАУТ: третій результат —</tspan><tspan x="630.0" dy="13.7">не прошилась / мертва плата</tspan></text>
