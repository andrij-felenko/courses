<text x="278.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">вісь обертання</text>
<text x="278.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">(припаяний кінець)</text>
<line x1="282.0" y1="364.0" x2="282.0" y2="430.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="270.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">F ≈ γ·p</text>
<text x="270.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">меніск тягне</text>
