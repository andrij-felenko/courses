<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три сита Бутройда: чи має ця деталь право бути окремою?</text>
<rect x="310.0" y="61.0" width="200.0" height="34.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/><text x="410.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Деталь-кандидат</tspan></text>
<rect x="40.0" y="156.0" width="240.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.7"/><text x="160.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Рухається відносно</tspan><tspan x="160.0" dy="16.9">сусідів?</tspan></text>
<line x1="410.0" y1="95.0" x2="160.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="290.0" y="156.0" width="240.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/><text x="410.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Інший матеріал чи</tspan><tspan x="410.0" dy="16.9">процес, ніж сусід?</tspan></text>
<line x1="410.0" y1="95.0" x2="410.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="540.0" y="156.0" width="240.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.7"/><text x="660.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Треба окремою для</tspan><tspan x="660.0" dy="16.9">складання / сервісу?</tspan></text>
<line x1="410.0" y1="95.0" x2="660.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="74.9" y="299.5" width="310.2" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="230.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">ТАК бодай на одне → деталь лишається</tspan></text>
<rect x="408.6" y="299.5" width="382.7" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="600.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">НІ на всі три → кандидат на злиття / усунення</tspan></text>
