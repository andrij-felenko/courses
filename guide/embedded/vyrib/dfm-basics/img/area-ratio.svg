<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому паста тримається за стінки: площа дна проти площі стінок апертури</text>
<rect x="120.0" y="130.0" width="90.0" height="70.0" rx="0" fill="#f6d9b8" stroke="#b07a35" stroke-width="1.5"/>
<polygon points="120,130 210,130 256,96 166,96" fill="#fbe8cf" stroke="#b07a35" stroke-width="1.5"/>
<polygon points="210,130 256,96 256,166 210,200" fill="#eccaa0" stroke="#b07a35" stroke-width="1.5"/>
<line x1="120.0" y1="214.0" x2="210.0" y2="214.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="165.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">W (ширина дна)</text>
<line x1="104.0" y1="130.0" x2="104.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="98.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">T</text>
<text x="98.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">товщина</text>
<line x1="268.0" y1="96.0" x2="268.0" y2="166.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="296.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">L (довжина</text>
<text x="296.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">углиб)</text>
<line x1="165.0" y1="244.0" x2="165.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="165.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">паста має вийти на площадку</text>
<line x1="116.0" y1="165.0" x2="142.0" y2="165.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="214.0" y1="165.0" x2="188.0" y2="165.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="165.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">стінки тримають пасту</text>
<rect x="470.0" y="96.0" width="320.0" height="66.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="630.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">AR = площа дна / площа стінок</tspan><tspan x="630.0" dy="16.9">= (L·W) / (2·(L+W)·T)</tspan></text>
<text x="630.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">виходить, коли дна більше за стінки:</text>
<line x1="490.0" y1="250.0" x2="770.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="490.0" y="240.0" width="91.0" height="20.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<rect x="581.0" y="240.0" width="189.0" height="20.0" rx="6" fill="#eafaf1" stroke="none" stroke-width="0.0"/>
<line x1="581.0" y1="234.0" x2="581.0" y2="266.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="581.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">AR = 0.66</text>
<line x1="490.0" y1="250.0" x2="490.0" y2="256.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="490.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.4</text>
<line x1="581.0" y1="250.0" x2="581.0" y2="256.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="700.0" y1="250.0" x2="700.0" y2="256.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="700.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="770.0" y1="250.0" x2="770.0" y2="256.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="770.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1.2</text>
<text x="494.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">паста лишається в трафареті</text>
<text x="766.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">паста чисто виходить</text>
<rect x="470.0" y="316.0" width="320.0" height="62.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.2"/><text x="630.0" y="343.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Дрібнішає апертура → стінок відносно більше →</tspan><tspan x="630.0" dy="14.3">AR падає. Ліки: тонший трафарет (менше T).</tspan></text>
</svg>