<rect x="70.0" y="388.0" width="680.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="410.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Резерв робить пилку квадратичною (~(λ·TI)²) — та лише до стелі β: спільна причина не ділиться навпіл.</tspan></text>
