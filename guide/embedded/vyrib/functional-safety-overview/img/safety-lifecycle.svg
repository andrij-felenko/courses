<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл безпеки: від небезпеки до перевірки — і що робить залізо при відмові</text>
<rect x="34.0" y="70.0" width="132.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.7"/><text x="100.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Небезпека</tspan><tspan x="100.0" dy="15.6">що може</tspan><tspan x="100.0" dy="15.6">поранити</tspan></text>
<line x1="168.0" y1="102.0" x2="182.0" y2="102.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="184.0" y="70.0" width="132.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.7"/><text x="250.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Оцінка ризику</tspan><tspan x="250.0" dy="14.3">SIL / ASIL:</tspan><tspan x="250.0" dy="14.3">наскільки суворо</tspan></text>
<line x1="318.0" y1="102.0" x2="332.0" y2="102.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="334.0" y="70.0" width="132.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#8a5a1f" stroke-width="1.7"/><text x="400.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Вимога безпеки</tspan><tspan x="400.0" dy="15.6">що система</tspan><tspan x="400.0" dy="15.6">мусить робити</tspan></text>
<line x1="468.0" y1="102.0" x2="482.0" y2="102.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="484.0" y="70.0" width="132.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.7"/><text x="550.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Реалізація</tspan><tspan x="550.0" dy="15.6">код, залізо,</tspan><tspan x="550.0" dy="15.6">резерв</tspan></text>
<line x1="618.0" y1="102.0" x2="632.0" y2="102.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="634.0" y="70.0" width="132.0" height="64.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.7"/><text x="700.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Доказ</tspan><tspan x="700.0" dy="15.6">тести, аналіз,</tspan><tspan x="700.0" dy="15.6">аудит</tspan></text>
<line x1="700.0" y1="134.0" x2="700.0" y2="160.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="100.0" y1="160.0" x2="700.0" y2="160.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="100.0" y1="160.0" x2="100.0" y2="134.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="400.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">змінив систему → цикл повторюється</text>
<rect x="95.0" y="225.1" width="170.0" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="180.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Робота</tspan><tspan x="180.0" dy="16.9">(усе справне)</tspan></text>
<rect x="473.1" y="225.1" width="253.7" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">БЕЗПЕЧНИЙ СТАН</tspan><tspan x="600.0" dy="16.9">(двигун стоп, гальмо, сигнал)</tspan></text>
<line x1="265.0" y1="250.0" x2="473.1" y2="250.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="369.1" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">виявив відмову — не приховуй, а йди у відомий безпечний стан</text>
<text x="369.1" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">watchdog · перевірка входів · резерв</text>
</svg>