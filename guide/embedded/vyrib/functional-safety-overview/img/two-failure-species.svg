<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два роди відмов: лише один має ймовірність</text>
<rect x="280.0" y="61.0" width="300.0" height="34.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.2"/><text x="430.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Відмова системи безпеки</tspan></text>
<line x1="430.0" y1="95.0" x2="430.0" y2="124.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="232.2" y1="124.0" x2="627.8" y2="124.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="232.2" y1="124.0" x2="232.2" y2="150.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="627.8" y1="124.0" x2="627.8" y2="150.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="117.2" y="149.1" width="230.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="232.2" y="170.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="232.2" dy="0.0">ВИПАДКОВА</tspan><tspan x="232.2" dy="16.9">відмова заліза</tspan></text>
<rect x="82.2" y="216.0" width="300.0" height="84.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.3"/><text x="232.2" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="232.2" dy="0.0">транзистор пробило · конденсатор висох ·</tspan><tspan x="232.2" dy="14.3">космічний промінь перевернув біт</tspan><tspan x="232.2" dy="14.3"></tspan><tspan x="232.2" dy="14.3">рідкісна, непередбачувана в часі,</tspan><tspan x="232.2" dy="14.3">але статистично рівна для мільйона копій</tspan></text>
<rect x="82.2" y="310.0" width="300.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="232.2" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="232.2" dy="0.0">→ має λ і ймовірність (PFD/PFH)</tspan><tspan x="232.2" dy="13.7">→ б'ється числом, резервом, діагностикою</tspan></text>
<rect x="512.8" y="149.1" width="230.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="627.8" y="170.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.8" dy="0.0">СИСТЕМАТИЧНА</tspan><tspan x="627.8" dy="16.9">відмова</tspan></text>
<rect x="477.8" y="216.0" width="300.0" height="84.0" rx="6" fill="#f7f9ff" stroke="#2457d6" stroke-width="1.3"/><text x="627.8" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.8" dy="0.0">хибна специфікація · «&gt;» замість «&gt;=» ·</tspan><tspan x="627.8" dy="14.3">компілятор викинув перевірку</tspan><tspan x="627.8" dy="14.3"></tspan><tspan x="627.8" dy="14.3">вже сидить у системі з народження,</tspan><tspan x="627.8" dy="14.3">спрацьовує ЩОРАЗУ однаково в усіх копіях</tspan></text>
<rect x="477.8" y="310.0" width="300.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="627.8" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.8" dy="0.0">→ ймовірності НЕ має (або є, або ні)</tspan><tspan x="627.8" dy="12.3">→ б'ється ЛИШЕ процесом: рецензування, тести</tspan></text>
<rect x="60.0" y="426.0" width="740.0" height="30.0" rx="6" fill="#fdf6ec" stroke="#8a5a1f" stroke-width="1.4"/><text x="430.0" y="444.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Різні природи → різні засоби → різні частини стандарту. Резерв двох каналів не рятує від тієї самої помилки в коді обох.</tspan></text>
</svg>