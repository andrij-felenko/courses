<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться число: терпимий ризик ÷ голий ризик = у скільки разів знизити</text>
<rect x="35.0" y="72.8" width="230.0" height="94.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="150.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Голий ризик</tspan><tspan x="150.0" dy="15.6">без захисту</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">1 небезпечна подія</tspan><tspan x="150.0" dy="15.6">на 10 років</tspan></text>
<rect x="295.0" y="72.8" width="230.0" height="94.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="410.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Терпимий ризик</tspan><tspan x="410.0" dy="15.6">(суспільна межа)</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">1 подія</tspan><tspan x="410.0" dy="15.6">на 10 000 років</tspan></text>
<rect x="575.0" y="72.8" width="210.0" height="94.4" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.2"/><text x="680.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Треба знизити</tspan><tspan x="680.0" dy="15.6">у RRF разів</tspan><tspan x="680.0" dy="15.6"></tspan><tspan x="680.0" dy="15.6">10 000 / 10</tspan><tspan x="680.0" dy="15.6">= 1000</tspan></text>
<line x1="265.0" y1="120.0" x2="295.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="525.0" y1="120.0" x2="575.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="64.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ділимо</text>
<line x1="680.0" y1="167.2" x2="680.0" y2="207.2" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="575.0" y="213.8" width="210.0" height="66.8" rx="6" fill="#fdf6ec" stroke="#8a5a1f" stroke-width="2.0"/><text x="680.0" y="234.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">PFD = 1 / RRF</tspan><tspan x="680.0" dy="16.9">= 1/1000 = 10⁻³</tspan><tspan x="680.0" dy="16.9">→ це SIL 2</tspan></text>
<rect x="70.0" y="334.0" width="680.0" height="34.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/><text x="410.0" y="354.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Кожна ×10 у терпимому ризику зсуває PFD на один порядок — тому щаблі SIL і йдуть десятками, а не як заманеться.</tspan></text>
<rect x="70.0" y="378.0" width="680.0" height="30.0" rx="6" fill="#fdf6ec" stroke="#c0392b" stroke-width="1.4"/><text x="410.0" y="396.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Число не з таблиці впало — воно РАХУЄТЬСЯ з того, наскільки суспільство терпить цю конкретну біду.</tspan></text>
</svg>