<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне речення 1944 р. → гора правил 2020-х: чому воно пережило 80 років</text>
<rect x="48.0" y="60.0" width="300.0" height="132.0" rx="9" fill="#fff4e0" stroke="#c9820f" stroke-width="1.6"/>
<text x="198.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c9820f" text-anchor="middle" font-weight="700">1944 · Чикаго</text>
<text x="198.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">конвенцію пишуть, поки</text>
<text x="198.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">V-1 падають на Лондон</text>
<rect x="106.0" y="136.0" width="40.0" height="12.0" rx="3" fill="#444a52" stroke="#22262b" stroke-width="1.2"/>
<line x1="146.0" y1="142.0" x2="162.0" y2="142.0" stroke="#22262b" stroke-width="2.0"/>
<text x="198.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c9820f" text-anchor="middle" font-style="italic">задача: не пустити їх у чуже небо</text>
<line x1="354.0" y1="126.0" x2="470.0" y2="126.0" stroke="#4a6fa5" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">80 років</text>
<rect x="472.0" y="60.0" width="300.0" height="132.0" rx="9" fill="#e8f1fb" stroke="#3f7ac0" stroke-width="1.6"/>
<text x="622.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3f7ac0" text-anchor="middle" font-weight="700">2020-ті · та сама стаття 8,</text>
<text x="622.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3f7ac0" text-anchor="middle" font-weight="700">лише конкретизована</text>
<text x="494.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">•  реєстрація оператора</text>
<text x="494.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">•  класи C0…C4 · CE</text>
<text x="494.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">•  Remote ID</text>
<text x="494.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">•  геозони · межа висоти</text>
<rect x="313.1" y="210.1" width="193.8" height="55.8" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.8"/><text x="410.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">стаття 8: «capable of being</tspan><tspan x="410.0" dy="13.7">flown without a pilot»</tspan><tspan x="410.0" dy="13.7">— властивість, не машина</tspan></text>
<text x="410.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">одне правило накриває всі три покоління</text>
<line x1="150.0" y1="312.0" x2="670.0" y2="312.0" stroke="#4a6fa5" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="150.0" cy="312.0" r="6.0" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="150.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">мішень</text>
<text x="150.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">1935</text>
<circle cx="410.0" cy="312.0" r="6.0" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="410.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">летюча бомба</text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">1944</text>
<circle cx="670.0" cy="312.0" r="6.0" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
<text x="670.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">квадрокоптер</text>
<text x="670.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">2025</text>
<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">право, що описує СУТЬ явища, а не тодішній зразок техніки, старіє повільно</text>
</svg>