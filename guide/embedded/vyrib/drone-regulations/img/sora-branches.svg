<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">SORA міряє ризик двома незалежними гілками — бо це дві різні фізики</text>
<text x="225.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c9820f" text-anchor="middle" font-weight="700">НАЗЕМНИЙ ризик: якщо впаде</text>
<rect x="51.0" y="92.5" width="156.0" height="39.0" rx="6" fill="#fff4e0" stroke="#c9820f" stroke-width="1.4"/><text x="129.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="129.0" dy="0.0">щільність людей</tspan><tspan x="129.0" dy="13.0">унизу (осіб/км²)</tspan></text>
<rect x="243.0" y="92.5" width="156.0" height="39.0" rx="6" fill="#fff4e0" stroke="#c9820f" stroke-width="1.4"/><text x="321.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">розмір і енергія</tspan><tspan x="321.0" dy="13.0">удару апарата</tspan></text>
<line x1="153.0" y1="136.0" x2="205.0" y2="176.0" stroke="#c9820f" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="297.0" y1="136.0" x2="245.0" y2="176.0" stroke="#c9820f" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="132.0" y="176.3" width="186.0" height="43.3" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.7"/><text x="225.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">клас наземного</tspan><tspan x="225.0" dy="14.3">ризику  GRC 1…10</tspan></text>
<line x1="225.0" y1="222.0" x2="225.0" y2="268.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="129.0" cy="245.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="129.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="129.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">заходи</text>
<text x="295.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">парашут, надійна</text>
<text x="295.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">термінація,</text>
<text x="295.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">вужчий буфер</text>
<rect x="137.0" y="271.9" width="176.0" height="40.1" rx="6" fill="#eaf6ee" stroke="#3f9d5a" stroke-width="1.6"/><text x="225.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">фінальний GRC</tspan><tspan x="225.0" dy="13.7">(нижчий = легше)</tspan></text>
<line x1="430.0" y1="60.0" x2="430.0" y2="330.0" stroke="#dde1e6" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="635.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3f7ac0" text-anchor="middle" font-weight="700">ПОВІТРЯНИЙ ризик: із чим зіткнеться</text>
<rect x="461.0" y="92.5" width="156.0" height="39.0" rx="6" fill="#e8f1fb" stroke="#3f7ac0" stroke-width="1.4"/><text x="539.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="539.0" dy="0.0">тип простору</tspan><tspan x="539.0" dy="13.0">(де летиш)</tspan></text>
<rect x="653.0" y="92.5" width="156.0" height="39.0" rx="6" fill="#e8f1fb" stroke="#3f7ac0" stroke-width="1.4"/><text x="731.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="731.0" dy="0.0">щільність</tspan><tspan x="731.0" dy="13.0">трафіку</tspan></text>
<line x1="563.0" y1="136.0" x2="615.0" y2="176.0" stroke="#3f7ac0" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="707.0" y1="136.0" x2="655.0" y2="176.0" stroke="#3f7ac0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="542.0" y="176.3" width="186.0" height="43.3" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.7"/><text x="635.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">клас повітряного</tspan><tspan x="635.0" dy="14.3">ризику  ARC a…d</tspan></text>
<line x1="635.0" y1="222.0" x2="635.0" y2="268.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="539.0" cy="245.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="539.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="539.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">заходи</text>
<text x="705.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">розділення</text>
<text x="705.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">висотами,</text>
<text x="705.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">координація</text>
<rect x="547.0" y="278.8" width="176.0" height="26.5" rx="6" fill="#eaf6ee" stroke="#3f9d5a" stroke-width="1.6"/><text x="635.0" y="295.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">залишковий ARC</tspan></text>
<line x1="225.0" y1="314.0" x2="360.0" y2="368.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="635.0" y1="314.0" x2="500.0" y2="368.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="235.0" y="378.8" width="390.0" height="34.5" rx="6" fill="#eef1f4" stroke="#4a6fa5" stroke-width="1.8"/><text x="430.0" y="400.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">матриця (GRC × ARC)  →  SAIL  I…VI</tspan></text>
<text x="430.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SAIL = потрібний рівень надійності операції: скільки й якої певності</text>
<text x="430.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">оператор мусить довести. Вищий GRC чи ARC → вищий SAIL → суворіші вимоги.</text>
</svg>