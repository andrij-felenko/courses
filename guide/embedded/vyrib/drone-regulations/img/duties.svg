<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реґуляція ділиться навпіл: виробник закриває своє в продукті й коді</text>
<rect x="60.0" y="66.0" width="330.0" height="226.0" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.8"/>
<text x="225.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4a6fa5" text-anchor="middle" font-weight="700">ти — виробник апарата</text>
<text x="225.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(закладаєш у залізо й прошивку)</text>
<text x="78.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  клас-мітка C0…C4 і CE на корпусі</text>
<text x="78.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  вбудований Remote ID: апарат сам</text>
<text x="78.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   мовить хто він і де він</text>
<text x="78.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  геозона: не пускати в заборонену зону</text>
<text x="78.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  паспорт/інструкція: маса, межі, клас</text>
<text x="225.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle" font-style="italic">усе це — ДО того, як апарат продано</text>
<line x1="398.0" y1="180.0" x2="448.0" y2="180.0" stroke="#c9820f" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="423.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c9820f" text-anchor="middle" font-style="italic">продаєш</text>
<rect x="468.0" y="66.0" width="272.0" height="226.0" rx="10" fill="#fff4e0" stroke="#c9820f" stroke-width="1.8"/>
<text x="604.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c9820f" text-anchor="middle" font-weight="700">оператор / пілот</text>
<text x="604.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(хто злетить у небо)</text>
<text x="484.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  реєстрація оператора → номер</text>
<text x="484.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   наносить на апарат</text>
<text x="484.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  іспит пілота (за категорією)</text>
<text x="484.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  де й коли летіти: висота,</text>
<text x="484.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   зони, візуальний контакт</text>
<text x="604.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c9820f" text-anchor="middle" font-style="italic">твій Remote ID мовить саме цей номер</text>
</svg>