<text x="480.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Модуль бере з апарата лише струм. Свою позицію знаходить сам — тому чіпляється на будь-що, але й не знає нічого, крім власного місця.</text>
