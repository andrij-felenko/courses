<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому 250 г: маса → швидкість → енергія → ймовірність травми</text>
<rect x="26.0" y="127.9" width="168.0" height="44.1" rx="6" fill="#fff4e0" stroke="#c9820f" stroke-width="1.7"/><text x="110.0" y="146.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">маса</tspan><tspan x="110.0" dy="13.7">m = 0.25 кг</tspan></text>
<rect x="236.0" y="121.1" width="168.0" height="57.8" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.7"/><text x="320.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">термінальна</tspan><tspan x="320.0" dy="13.7">швидкість</tspan><tspan x="320.0" dy="13.7">v ≈ 25.9 м/с</tspan></text>
<rect x="446.0" y="121.1" width="168.0" height="57.8" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.7"/><text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">енергія удару</tspan><tspan x="530.0" dy="13.7">E = ½mv²</tspan><tspan x="530.0" dy="13.7">≈ 84 Дж</tspan></text>
<rect x="646.0" y="121.1" width="168.0" height="57.8" rx="6" fill="#e8f1fb" stroke="#3f7ac0" stroke-width="1.7"/><text x="730.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">ймовірність</tspan><tspan x="730.0" dy="13.7">смерті</tspan><tspan x="730.0" dy="13.7">≈ 30%</tspan></text>
<line x1="196.0" y1="150.0" x2="234.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="215.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">√ маси</text>
<line x1="406.0" y1="150.0" x2="444.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="425.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">× v²</text>
<line x1="616.0" y1="150.0" x2="644.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="630.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">→ травма</text>
<text x="110.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вхід: те, що</text>
<text x="110.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">легко зважити</text>
<text x="320.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">рівновага ваги</text>
<text x="320.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">й опору повітря</text>
<text x="530.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">швидкість —</text>
<text x="530.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у квадраті</text>
<text x="730.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">80 Дж у голову</text>
<text x="730.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(мед. дані)</text>
<text x="410.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">поріг стоїть там, де ланцюжок виходить на межу «переживно / ні» — тому саме 250 г, а не 200 чи 300</text>
<text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">маса — лише перша ланка й грубий проксі; справжня небезпека — енергія на кінці ланцюжка</text>
</svg>