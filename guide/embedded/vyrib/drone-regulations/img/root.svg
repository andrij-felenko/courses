<text x="195.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">енергія удару росте з масою й висотою</text>
<text x="195.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тому межі саме за масою (250 г · 900 г · 4 · 25 кг)</text>
