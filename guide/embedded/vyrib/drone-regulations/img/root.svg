<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому небо регулюють: дві тверді причини, а не забаганка</text>
<text x="195.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c9820f" text-anchor="middle" font-weight="700">1. падає — б'є</text>
