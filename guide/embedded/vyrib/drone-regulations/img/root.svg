<text x="255.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c9820f" text-anchor="middle" font-style="italic">0.9 кг × висота</text>
<circle cx="195.0" cy="214.0" r="9.0" fill="#fff4e0" stroke="#c9820f" stroke-width="1.6"/>
