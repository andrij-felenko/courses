<text x="92.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle">ширина</text>
<line x1="114.0" y1="200.0" x2="146.0" y2="200.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="130.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">зазор</text>
<text x="140.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">типово ≥ 0.15 мм (6 mil)</text>
<text x="390.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">мінімальне свердло</text>
<circle cx="390.0" cy="144.0" r="34.0" fill="#b87333" stroke="#8a561f" stroke-width="1.4"/>
<circle cx="390.0" cy="144.0" r="14.0" fill="#ffffff" stroke="#8a561f" stroke-width="1.2"/>
<line x1="376.0" y1="144.0" x2="404.0" y2="144.0" stroke="#2457d6" stroke-width="1.4"/>
