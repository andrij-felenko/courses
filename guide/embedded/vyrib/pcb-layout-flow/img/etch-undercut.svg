<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізотропне травлення підгризає мідь — доріжка виходить вужчою</text>
<text x="180.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">малюнок: мідь під захистом</text>
<rect x="90.0" y="138.0" width="300.0" height="16.0" rx="1" fill="#d8c98a" stroke="#b8a55f" stroke-width="1.2"/>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#7a6a2a" text-anchor="middle">ізолятор (FR-4)</text>
<rect x="190.0" y="108.0" width="100.0" height="30.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.3"/>
<text x="240.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">мідь</text>
<rect x="190.0" y="98.0" width="100.0" height="10.0" rx="1" fill="#8e7cc3" stroke="#5b4a8f" stroke-width="1.1"/>
<text x="240.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#5b4a8f" text-anchor="middle">захист (резист)</text>
<line x1="190.0" y1="144.0" x2="290.0" y2="144.0" stroke="#4a6fa5" stroke-width="1.2"/>
<text x="240.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a6fa5" text-anchor="middle">ширина малюнка</text>
<line x1="240.0" y1="176.0" x2="240.0" y2="208.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">травник гризе у всі боки</text>
<text x="180.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">готово: трапеція, вужча зверху</text>
<rect x="90.0" y="310.0" width="300.0" height="16.0" rx="1" fill="#d8c98a" stroke="#b8a55f" stroke-width="1.2"/>
<polygon points="190.0,310.0 290.0,310.0 278.0,280.0 202.0,280.0" fill="#b87333" stroke="#8a561f" stroke-width="1.4"/>
<line x1="190.0" y1="280.0" x2="190.0" y2="310.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="290.0" y1="280.0" x2="290.0" y2="310.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="190.0" y1="272.0" x2="202.0" y2="272.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="186.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">підтрав u</text>
<line x1="290.0" y1="272.0" x2="278.0" y2="272.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="294.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">u</text>
<line x1="202.0" y1="334.0" x2="278.0" y2="334.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="240.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">готова ширина = малюнок − 2u</text>
<rect x="470.0" y="90.0" width="280.0" height="210.0" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="610.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">коефіцієнт травлення</text>
<text x="610.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">EF = t / u</text>
<text x="610.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">u = t / EF   (підтрав з боку)</text>
<line x1="490.0" y1="182.0" x2="730.0" y2="182.0" stroke="#c9cfd6" stroke-width="1.0"/>
<text x="610.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мідь 1oz: t ≈ 35 мкм, EF = 3</text>
<text x="610.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">u ≈ 11.7 мкм · 2u ≈ 23 мкм</text>
<text x="610.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мідь 2oz (70 мкм): 2u ≈ 47 мкм</text>
<text x="610.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">товща мідь → більший підтрав</text>
</svg>