<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Накопичений заряд — баланс припливу струму й стоку рекомбінації</text>
<rect x="275.0" y="96.0" width="170.0" height="196.0" rx="10" fill="#eef3fb" stroke="#2457d6" stroke-width="2.2"/>
<rect x="281.0" y="162.0" width="158.0" height="124.0" rx="6" fill="#cfe0f7" stroke="none" stroke-width="1.5"/>
<text x="360.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">Q = I_F·τ</text>
<text x="360.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запас заряду</text>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у базі</text>
<line x1="360.0" y1="46.0" x2="360.0" y2="94.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="276.4" y="20.5" width="167.1" height="27.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="38.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">приплив: струм i(t)</tspan></text>
<line x1="360.0" y1="294.0" x2="360.0" y2="334.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="264.3" y="338.5" width="191.3" height="27.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">стік: рекомбінація Q/τ</tspan></text>
<rect x="60.1" y="103.0" width="119.7" height="45.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="120.0" y="122.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">рівняння</tspan><tspan x="120.0" dy="16.9">неперервності:</tspan></text>
<rect x="32.5" y="183.5" width="175.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.5"/><text x="120.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">dQ/dt = i − Q/τ</tspan></text>
<rect x="542.1" y="117.0" width="119.7" height="45.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="602.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="602.0" dy="0.0">рівновага:</tspan><tspan x="602.0" dy="16.9">приплив = стік</tspan></text>
<rect x="524.5" y="192.9" width="155.0" height="50.2" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="602.0" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="602.0" dy="0.0">I_F = Q/τ</tspan><tspan x="602.0" dy="18.2">⇒ Q = I_F·τ</tspan></text>
