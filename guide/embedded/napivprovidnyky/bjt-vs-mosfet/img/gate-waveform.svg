<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що бачить затвор під час вмикання: три ділянки Qg</text>
<line x1="80.0" y1="330.0" x2="700.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="80.0" y1="330.0" x2="80.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M700.0 330.0 L692.0 326.0 L692.0 334.0 z" fill="#1a1a1a"/>
<path d="M80.0 80.0 L76.0 88.0 L84.0 88.0 z" fill="#1a1a1a"/>
<text x="700.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">заряд, накачаний у затвор (час)</text>
<text x="74.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Vgs</text>
<rect x="216.4" y="109.0" width="223.2" height="221.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<line x1="80.0" y1="255.0" x2="700.0" y2="255.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="696.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Vth (тут відкривається канал)</text>
<line x1="80.0" y1="200.0" x2="700.0" y2="200.0" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="696.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">плато Міллера</text>
<line x1="80.0" y1="115.0" x2="700.0" y2="115.0" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="696.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">Vdrv (повністю відкритий)</text>
<polyline points="80.0,330.0 216.4,200.0 439.6,200.0 563.6,115.0 700.0,115.0" fill="none" stroke="#2457d6" stroke-width="3"/>
<text x="328.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">тут Vds валиться — уся втрата тут</text>
<text x="148.2" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1) заряд Ciss</text>
<text x="328.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2) плато (Qgd)</text>
<text x="569.8" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3) добір</text>
<rect x="80.0" y="352.0" width="620.0" height="56.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Драйвер жене в затвор струм — Vgs росте. На плато Міллера ВЕСЬ струм іде на перезаряд Cgd,</tspan><tspan x="390.0" dy="13.0">поки стік валить напругу; Vgs завмирає. Що довше тут стоїмо — то більша втрата. Швидкість</tspan><tspan x="390.0" dy="13.0">проходу плато = Idrv / Cgd, тому головне число драйвера — пік СТРУМУ, а не напруга.</tspan></text>
</svg>