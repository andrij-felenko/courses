<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крутість gm на той самий струм: біполярний виграє</text>
<line x1="90.0" y1="330.0" x2="650.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="90.0" y1="330.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M650.0 330.0 L642.0 326.0 L642.0 334.0 z" fill="#1a1a1a"/>
<path d="M90.0 80.0 L86.0 88.0 L94.0 88.0 z" fill="#1a1a1a"/>
<text x="650.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">струм спокою I (лог)</text>
<text x="84.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">gm (лог)</text>
<line x1="90.0" y1="255.0" x2="650.0" y2="100.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="493.2" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">BJT:  gm = Ic / VT</text>
<line x1="90.0" y1="305.0" x2="650.0" y2="205.0" stroke="#2457d6" stroke-width="2.6"/>
<text x="482.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">MOSFET:  gm = √(2·k·Id)</text>
<line x1="398.0" y1="169.8" x2="398.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="5 4"/>
<text x="406.0" y="191.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">на тому самому струмі BJT дає більше підсилення</text>
<text x="408.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="408.0" dy="0.0">на тому самому струмі</tspan><tspan x="408.0" dy="13.0">BJT дає більший gm</tspan></text>
<rect x="90.0" y="356.0" width="560.0" height="46.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">BJT: нахил 1 — gm росте прямо з I, і множник 1/VT ≈ 40 В⁻¹ великий.</tspan><tspan x="370.0" dy="14.3">MOSFET (над порогом): нахил ½ — gm росте лише як √I, тож завжди нижчий.</tspan></text>
</svg>