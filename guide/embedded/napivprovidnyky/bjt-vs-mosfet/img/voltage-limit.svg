<text x="459.6" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">~кількасот В</text>
<rect x="90.0" y="348.0" width="560.0" height="58.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Що вища напруга, то товщий і менш легований дрейфовий шар — а його опір злітає як BV^2.5.</tspan><tspan x="370.0" dy="11.7">Тому на сотнях–тисячах вольтів звичайний MOSFET «згорає» в опорі; там сталий спад IGBT дешевший.</tspan><tspan x="370.0" dy="11.7">SiC/GaN і суперперехід зсувають межу праворуч — але сам закон лишається.</tspan></text>
