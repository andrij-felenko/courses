<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Область безпечної роботи (SOA): чотири стіни, а не одна</text>
<line x1="110.0" y1="400.0" x2="650.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="110.0" y1="400.0" x2="110.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="646.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Vce (лог.)</text>
<text x="102.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Ic (лог.)</text>
<line x1="110.0" y1="110.0" x2="260.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="116.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ic(max)</text>
<line x1="260.0" y1="110.0" x2="440.0" y2="230.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="290.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">P(max) = Vce·Ic</text>
<line x1="440.0" y1="230.0" x2="540.0" y2="345.0" stroke="#c0392b" stroke-width="2.8"/>
<text x="448.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">другий пробій</text>
<text x="448.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">(тільки в BJT!)</text>
<line x1="620.0" y1="400.0" x2="620.0" y2="310.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="614.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Vceo</text>
<line x1="540.0" y1="345.0" x2="620.0" y2="345.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,3"/>
<polygon points="110,400 110,110 440,230 540,345 620,310 620,400" fill="#27ae60" fill-opacity="0.07" stroke="none"/>
<text x="260.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНО</text>
<rect x="110.0" y="440.0" width="540.0" height="62.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Базова формула P=Vce·Ic — це лише ЗЕЛЕНА стіна. У BJT є ще ЧЕРВОНА, крутіша: другий</tspan><tspan x="380.0" dy="11.7">пробій. На високій Vce струм збирається у гарячу нитку-філамент і пропалює кристал</tspan><tspan x="380.0" dy="11.7">РАНІШЕ, ніж досягнуто P(max). Тому індуктивний зрив небезпечний удвічі: там і Vce, і Ic великі.</tspan></text>
</svg>