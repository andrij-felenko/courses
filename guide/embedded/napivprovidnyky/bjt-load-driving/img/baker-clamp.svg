<rect x="70.0" y="300.0" width="580.0" height="74.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="319.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Коли колектор намагається впасти нижче за базу (глибоке насичення), діод відкривається</tspan><tspan x="360.0" dy="14.3">й зливає ЗАЙВИЙ струм бази прямо в колектор. Транзистор застигає на межі насичення:</tspan><tspan x="360.0" dy="14.3">Vce ≈ 0.3…0.4 В замість 0.1 В — трохи більша грійка, зате майже НУЛЬ зайвого заряду,</tspan><tspan x="360.0" dy="14.3">тож «сховок» t_s зникає. У TTL-серії «S» це роблять діодом Шотткі прямо в кристалі.</tspan></text>
