<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що змінив транзистор: радіо з меблів — у кишеню</text>
<rect x="40.0" y="56.0" width="350.0" height="290.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="215.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лампове радіо (до 1954)</text>
<rect x="120.0" y="110.0" width="190.0" height="120.0" rx="6" fill="#6b4a2a" stroke="#3a2814" stroke-width="2"/>
<text x="215.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#f0e0c8" text-anchor="middle" font-weight="bold" font-style="normal">велика тумба</text>
<text x="215.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#d8c0a0" text-anchor="middle" font-weight="normal" font-style="normal">у вітальні</text>
<text x="215.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">гаряче (лампи), важке, дороге</text>
<text x="215.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">живлення від мережі</text>
<text x="215.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кілька годин від батарей</text>
<text x="215.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">★ слухає вся родина разом</text>
<rect x="430.0" y="56.0" width="350.0" height="290.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="605.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">транзисторне (Regency TR-1, 1954)</text>
<rect x="560.0" y="120.0" width="90.0" height="130.0" rx="8" fill="#1f3a6b" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="605.0" cy="165.0" r="26.0" fill="#cdd8f5" stroke="#16294d" stroke-width="1.6"/>
<text x="605.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">влізає в долоню / кишеню</text>
<text x="605.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">4 транзистори, 4 мА</text>
<text x="605.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">20–30 годин від батарейки</text>
<text x="605.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">★ музика з тобою всюди й сама</text>
<text x="410.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Персональне, портативне радіо народило молодіжну культуру 1960-х: рок-н-рол у кишені, а не в спільній вітальні.</text>
</svg>
