<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому широкозонний прилад на ту саму напругу тонший і менш опірний</text>
<rect x="70.0" y="90.0" width="240.0" height="210.0" rx="4" fill="#eef1f6" stroke="#9aa7b8" stroke-width="2.0"/><text x="190.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#9aa7b8" text-anchor="middle" font-weight="700">Si</text><text x="190.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa7b8" text-anchor="middle" font-weight="700">товстий слабколегований шар</text><polygon points="70.0,300.0 310.0,300.0 310.0,120.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="304.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">E_крит ≈ 0.3 МВ/см</text><text x="76.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">глибина шару</text>
<rect x="470.0" y="90.0" width="62.0" height="210.0" rx="4" fill="#eaf3ec" stroke="#c0392b" stroke-width="2.0"/><text x="501.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">SiC</text><text x="501.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">тонкий ~×10 шар</text><polygon points="470.0,300.0 532.0,300.0 532.0,120.0" fill="none" stroke="#c0392b" stroke-width="2.4"/><text x="526.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">E_крит ≈ 3 МВ/см</text><text x="476.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">глибина шару</text>
<text x="430.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">площа під полем = блокувальна напруга — однакова в обох</text>
<rect x="60.0" y="366.0" width="740.0" height="56.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="430.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">поле в шарі не сміє перейти критичне; у SiC/GaN воно ~×10 вище, тож шар роблять ~×10 тоншим,</text>
<text x="430.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">а легують ~×10 щільніше — а тонкий і дужче легований шар має радикально менший опір.</text>
</svg>