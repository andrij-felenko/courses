<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Організація NAND: сторінка читає-пише, блок стирає — і що з цього випливає</text>
<rect x="34.0" y="74.0" width="420.0" height="300.0" rx="10" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="46.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">кристал (die)</text>
<rect x="48.0" y="106.0" width="392.0" height="254.0" rx="8" fill="#f6f7fb" stroke="#6b7280" stroke-width="1.4"/>
<text x="60.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">блок — одиниця СТИРАННЯ (сотні КБ – МБ)</text>
<rect x="62.0" y="136.0" width="364.0" height="210.0" rx="6" fill="#eef0fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="80.0" y="152.0" width="328.0" height="22.0" rx="3" fill="#dfe6fb" stroke="#6b7280" stroke-width="1.0"/>
<text x="88.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сторінка 0 — писати/читати</text>
<rect x="80.0" y="182.0" width="328.0" height="22.0" rx="3" fill="#dfe6fb" stroke="#6b7280" stroke-width="1.0"/>
<text x="88.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сторінка 1 — писати/читати</text>
<rect x="80.0" y="212.0" width="328.0" height="22.0" rx="3" fill="#dfe6fb" stroke="#6b7280" stroke-width="1.0"/>
<text x="88.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сторінка 2 — писати/читати</text>
<rect x="80.0" y="242.0" width="328.0" height="22.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="88.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сторінка 3 — писати/читати</text>
<rect x="80.0" y="272.0" width="328.0" height="22.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="88.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сторінка 4 — писати/читати</text>
<rect x="80.0" y="302.0" width="328.0" height="22.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="88.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сторінка 5 — писати/читати</text>
<text x="244.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">заповнені ↑   ·   ще стерті (0xFF) ↓</text>
<text x="430.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="end">◀ пишуться</text>
<text x="430.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="end">по порядку</text>
<rect x="474.0" y="74.0" width="392.0" height="300.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">три зернистості — і залізне правило</text>
<rect x="494.0" y="138.0" width="26.0" height="26.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="507.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">R</text>
<text x="532.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ЧИТАННЯ</text>
<text x="532.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сторінка — найдрібніше, що можна дістати</text>
<rect x="494.0" y="194.0" width="26.0" height="26.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="507.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">W</text>
<text x="532.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ЗАПИС (program)</text>
<text x="532.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сторінка; лише 1→0; тільки в стерте; по порядку в блоці</text>
<rect x="494.0" y="250.0" width="26.0" height="26.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="507.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">E</text>
<text x="532.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">СТИРАННЯ (erase)</text>
<text x="532.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">цілий БЛОК одразу; 0→1 гуртом; сотні клітин-сторінок</text>
<text x="670.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">не можна стерти одну сторінку — лише весь блок разом.</text>
<text x="670.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">звідси й потреба переносити живі сторінки перед стиранням.</text>
<rect x="60.0" y="394.0" width="780.0" height="74.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">прихована пастка read-disturb: щоб прочитати одну сторінку, сусідні клітини в ланцюгу тримають відкритими.</text>
<text x="450.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожне таке відкриття потроху підкидає їм заряд; після сотень тисяч читань сусід може «перекинутися».</text>
<text x="450.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a18" text-anchor="middle" font-weight="700">тому контролер веде лік читань блока й вчасно переписує його на свіже місце — цього в NOR немає.</text>
<rect x="60.0" y="482.0" width="780.0" height="52.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">усе це — плата за щільність: дрібно дістати не можна, зате бітів дуже багато й дуже дешево.</text>
<text x="450.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">керувати цим вручну майже нереально — тому NAND майже завжди йде в парі з розумним контролером.</text>
</svg>