<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмір слота під сторінку EEPROM: 13 vs 16 байтів</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Слот, що перелазить межу сторінки, коштує ДВОХ внутрішніх циклів; слот-дільник сторінки — рівно одного</text>
<text x="163.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">слот 13 Б
(не дільник)</text>
<line x1="175.0" y1="116.0" x2="175.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="179.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сторінка 0 (32 Б)</text>
<line x1="567.5" y1="116.0" x2="567.5" y2="158.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="571.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сторінка 1 (32 Б)</text>
<line x1="960.0" y1="116.0" x2="960.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="175.0" y="120.0" width="159.5" height="34.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/>
<text x="254.7" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<rect x="334.5" y="120.0" width="159.5" height="34.0" rx="3" fill="#eaf7ee" stroke="#333333" stroke-width="1.4"/>
<text x="414.2" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
<rect x="493.9" y="120.0" width="159.5" height="34.0" rx="3" fill="#fff7e6" stroke="#c0392b" stroke-width="2.6"/>
<text x="573.6" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="573.6" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">↑ перелазить межу → 2 цикли</text>
<rect x="653.4" y="120.0" width="159.5" height="34.0" rx="3" fill="#f3e8fd" stroke="#333333" stroke-width="1.4"/>
<text x="733.1" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="175.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">13 не ділить 32 → слот №2 перелазить межу сторінки: його запис = 2 внутрішні цикли (подвійний знос, ширше вікно обриву)</text>
<text x="163.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">слот 16 Б
(дільник)</text>
<line x1="175.0" y1="296.0" x2="175.0" y2="338.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="179.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сторінка 0 (32 Б)</text>
<line x1="567.5" y1="296.0" x2="567.5" y2="338.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="571.5" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сторінка 1 (32 Б)</text>
<line x1="960.0" y1="296.0" x2="960.0" y2="338.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="175.0" y="300.0" width="196.2" height="34.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/>
<text x="273.1" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<rect x="371.2" y="300.0" width="196.2" height="34.0" rx="3" fill="#eaf7ee" stroke="#333333" stroke-width="1.4"/>
<text x="469.4" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
<rect x="567.5" y="300.0" width="196.2" height="34.0" rx="3" fill="#fff7e6" stroke="#333333" stroke-width="1.4"/>
<text x="665.6" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text>
<rect x="763.8" y="300.0" width="196.2" height="34.0" rx="3" fill="#f3e8fd" stroke="#333333" stroke-width="1.4"/>
<text x="861.9" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="175.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">16 = 32 / 2 → рівно 2 слоти на сторінку, жоден не перетинає межі: кожен запис = 1 цикл. Ціна — 3 байти набивки на слот</text>
<text x="500.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Правило: спершу дізнайся сторінку чипа з даташита, тоді підганяй слот (дільник сторінки) і обсяг кільця (ціле число сторінок).</text>
</svg>