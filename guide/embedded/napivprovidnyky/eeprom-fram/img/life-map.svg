<text x="490.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">10⁸</text>
<line x1="634.0" y1="400.0" x2="634.0" y2="406.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="634.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">10¹⁰</text>
<line x1="749.2" y1="400.0" x2="749.2" y2="406.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="749.2" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">10¹²</text>
<line x1="835.6" y1="400.0" x2="835.6" y2="406.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="835.6" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">10¹⁴</text>
<line x1="124.0" y1="346.0" x2="130.0" y2="346.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="118.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">1 рік</text>
<line x1="124.0" y1="256.0" x2="130.0" y2="256.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="118.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">10 років</text>
<line x1="124.0" y1="154.0" x2="130.0" y2="154.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="118.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">&gt;40 років</text>
<rect x="173.2" y="142.0" width="187.2" height="90.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="266.8" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">EEPROM</text>
<text x="266.8" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">10⁴–10⁶ циклів</text>
<text x="266.8" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">~10+ років (кімн.)</text>
<line x1="360.4" y1="187.0" x2="480.4" y2="187.0" stroke="#b9770e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.4" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">wear leveling</text>
<text x="420.4" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle">розмазує знос → далі вправо</text>
<rect x="706.0" y="214.0" width="144.0" height="90.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="778.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">FRAM</text>
<text x="778.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">10¹²–10¹⁴</text>
<text x="778.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">~10 років*</text>
<text x="778.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">*збереження FRAM НЕ безмежне</text>
<text x="778.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">деполяризація/imprint з часом</text>
<rect x="140.0" y="450.0" width="720.0" height="44.0" rx="6" fill="#fff7e6" stroke="#b9770e" stroke-width="1.4"/><text x="500.0" y="468.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">FRAM виграє по ЗНОСУ на порядки, але по ЗБЕРЕЖЕННЮ вони близькі (~роки):</tspan><tspan x="500.0" dy="15.6">«необмежений ресурс» не означає «вічне сховище» — це різні осі.</tspan></text>
</svg>