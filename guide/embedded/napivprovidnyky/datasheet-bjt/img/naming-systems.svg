<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві культури імен транзистора</text>
<rect x="40.0" y="56.0" width="320.0" height="268.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">JEDEC (США): 2N2222</text>
<text x="200.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ім'я = квиток у черзі реєстрації</text>
<text x="80.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">2N</text>
<text x="136.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="start" font-weight="700">2222</text>
<text x="58.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2N — це «транзистор»</text>
<text x="58.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2222 — просто № за порядком</text>
<rect x="109.2" y="235.1" width="181.6" height="57.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">саме ім'я не каже НІЧОГО</tspan><tspan x="200.0" dy="13.7">про матеріал, функцію, β —</tspan><tspan x="200.0" dy="13.7">усе лише в таблиці даташита</tspan></text>
<rect x="380.0" y="56.0" width="320.0" height="268.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/>
<text x="540.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Pro Electron (Європа): BC547C</text>
<text x="540.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ім'я = стиснутий рядок даташита</text>
<text x="410.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#b8860b" text-anchor="start" font-weight="700">B</text>
<text x="436.4" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="start" font-weight="700">C</text>
<text x="462.8" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="start" font-weight="700">547</text>
<text x="514.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700">C</text>
<text x="398.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="start" font-weight="700">• B → кремній (A = германій)</text>
<text x="398.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">• C → малопотужний малосигнальний</text>
<text x="398.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">• 547 → номер моделі</text>
<text x="398.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• C → клас підсилення: β ≥ 420</text>
<rect x="407.5" y="285.0" width="265.1" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="303.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">глянув на ім'я — уже знаєш тип і гарантію β</tspan></text>
</svg>