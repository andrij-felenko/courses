<rect x="445.0" y="91.1" width="230.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">+ мале падіння V_F (~0.2 В)</tspan><tspan x="560.0" dy="13.7">− великий зворотний витік</tspan><tspan x="560.0" dy="13.7">− ризик теплової втечі</tspan></text>
