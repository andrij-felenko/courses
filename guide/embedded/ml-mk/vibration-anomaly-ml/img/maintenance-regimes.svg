<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи вирішувати, коли обслуговувати</text>
<rect x="40.0" y="56.0" width="200.0" height="150.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="140.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">До поломки</text>
<text x="140.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">чекаємо, поки стане;</tspan><tspan x="140.0" dy="15.6">ремонт найдорожчий,</tspan><tspan x="140.0" dy="15.6">часто аварійний</tspan></text>
<rect x="260.0" y="56.0" width="200.0" height="150.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="360.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">За розкладом</text>
<text x="360.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">міняємо «про запас»</tspan><tspan x="360.0" dy="15.6">кожні N годин;</tspan><tspan x="360.0" dy="15.6">викидаємо ще живе</tspan></text>
<rect x="480.0" y="56.0" width="200.0" height="150.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="580.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">За станом</text>
<text x="580.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">слухаємо машину,</tspan><tspan x="580.0" dy="15.6">діємо саме тоді,</tspan><tspan x="580.0" dy="15.6">коли вона просить</tspan></text>
<text x="140.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">дорого і раптово</text>
<text x="360.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">надійно, але марнотратно</text>
<text x="580.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вчасно й ощадливо</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">ML на давачі вібрації робить можливим саме третій — прямо на машині, без сервера</text>
</svg>