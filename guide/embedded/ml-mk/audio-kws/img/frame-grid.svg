<text x="445.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 секунда звуку</text>
<rect x="70.0" y="116.0" width="22.5" height="16.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="100.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">вікно 30 мс</text>
