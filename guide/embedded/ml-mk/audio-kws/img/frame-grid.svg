<text x="115.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">крок 20 мс → сусіди перекриваються</text>
<rect x="100.0" y="164.0" width="22.5" height="16.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="115.0" y="188.0" width="22.5" height="16.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="100.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">…  і так 49 вікон до кінця секунди  …</text>
<rect x="290.5" y="249.5" width="418.9" height="37.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="500.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">N = ⌊(T − L) / H⌋ + 1 = ⌊(1000 − 30)/20⌋ + 1 = 49</tspan></text>
<text x="190.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кожен кадр → 40 мел-енергій</text>
<text x="130.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">стовпчик 1</text>
