<rect x="538.5" y="334.2" width="143.0" height="51.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="610.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">сирих відліків:</tspan><tspan x="610.0" dy="15.6">16 000 чисел / с</tspan></text>
<text x="760.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">стиснення ≈ 8×</text>
<line x1="689.5" y1="360.0" x2="726.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="758.7" y="334.2" width="202.6" height="51.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="860.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">ознак:</tspan><tspan x="860.0" dy="15.6">49 × 40 = 1960 чисел / с</tspan></text>
<text x="500.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вікно — компроміс: досить довге для частоти голосу, досить коротке проти розмазування переходу</text>
