<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як гра з тестом завищує бал: «поплилий репер»</text>
<text x="36.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">ЧЕСНО</text>
<text x="515.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не знає, куди гляне камера</text>
<rect x="230.0" y="110.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="319.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">рахує ВСЮ сцену</text>
<line x1="408.0" y1="142.0" x2="426.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="426.0" y="110.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="515.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">чистить буфер</text>
<line x1="604.0" y1="142.0" x2="622.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="622.0" y="110.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="711.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">малює як задумано</text>
<text x="36.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ПІД ТЕСТ</text>
<text x="515.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знає політ камери наперед</text>
<rect x="230.0" y="290.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="319.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">УПІЗНАВ тест</text>
<line x1="408.0" y1="322.0" x2="426.0" y2="322.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="426.0" y="290.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="515.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">буфер НЕ чистить</text>
<line x1="438.0" y1="322.0" x2="592.0" y2="322.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="604.0" y1="322.0" x2="622.0" y2="322.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="622.0" y="290.0" width="178.0" height="64.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="711.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">відрізав «невидиме»</text>
<line x1="634.0" y1="322.0" x2="788.0" y2="322.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="440.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">робота зникає → FPS росте, але це працює ЛИШЕ бо тест завжди однаковий</text>
<text x="440.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у реальній грі камерою керує гравець — відрізати наперед нічого не можна</text>
<text x="440.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вимір перестав бути «тим самим, що в інших» — реперна точка поплила</text>
</svg>