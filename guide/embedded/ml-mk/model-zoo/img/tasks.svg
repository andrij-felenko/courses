<text x="557.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="557.0" dy="0.0">маска по контуру</tspan><tspan x="557.0" dy="15.6">кожен піксель</tspan></text>
