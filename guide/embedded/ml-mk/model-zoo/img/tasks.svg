<text x="129.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">що в кадрі?</text>
<text x="129.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="129.0" dy="0.0">один ярлик</tspan><tspan x="129.0" dy="15.6">«людина 0.9»</tspan></text>
