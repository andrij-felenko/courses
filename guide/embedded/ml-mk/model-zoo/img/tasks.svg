<text x="771.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">та сама ціль у часі</text>
<text x="771.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="771.0" dy="0.0">ID + траєкторія</tspan><tspan x="771.0" dy="15.6">кадр за кадром</tspan></text>
<text x="450.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дешевше ◄———————————————————► дорожче (більше обчислень)</text>
<text x="450.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">для дрона, що цілиться, головна — ДЕТЕКЦІЯ: де об'єкт у кадрі</text>
