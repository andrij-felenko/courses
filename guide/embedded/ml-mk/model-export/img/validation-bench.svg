<text x="687.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="687.0" dy="0.0">макс |ref − lite|</tspan><tspan x="687.0" dy="14.3">середнє |ref − lite|</tspan><tspan x="687.0" dy="14.3">збіг класу-переможця</tspan><tspan x="687.0" dy="14.3">падіння точності</tspan></text>
