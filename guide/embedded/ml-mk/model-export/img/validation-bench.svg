<text x="410.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ловиться на столі, поки апарат ще не злетів — найдешевше місце спіймати тиху похибку.</text>
