<rect x="125.0" y="328.4" width="250.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">розбіжність ≤ поріг</tspan><tspan x="250.0" dy="15.6">і точність не впала</tspan><tspan x="250.0" dy="15.6">→ ПРОШИВАТИ</tspan></text>
