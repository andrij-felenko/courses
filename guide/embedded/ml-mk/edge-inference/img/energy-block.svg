<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інференс у профілі струму: латентність стає зарядом</text>
<line x1="70.0" y1="300.0" x2="670.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="670.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<text x="62.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">струм</text>
<line x1="70.0" y1="294.0" x2="160.0" y2="294.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="115.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">сон</text>
<rect x="160.0" y="230.0" width="60.0" height="70.0" fill="#6b7280" fill-opacity="0.30" stroke="#333333" stroke-width="1.6"/><text x="190.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">вимір</text>
<rect x="220.0" y="170.0" width="150.0" height="130.0" fill="#c0392b" fill-opacity="0.30" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ІНФЕРЕНС (Invoke)</text>
<text x="295.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">латентність =</text>
<text x="302.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ширина блоку</text>
<rect x="370.0" y="120.0" width="70.0" height="180.0" fill="#2457d6" fill-opacity="0.30" stroke="#2457d6" stroke-width="1.6"/><text x="405.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">радіо</text>
<line x1="440.0" y1="294.0" x2="670.0" y2="294.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="220.0" y1="170.0" x2="220.0" y2="314.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="285.0" y1="170.0" x2="285.0" y2="314.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="370.0" y1="330.0" x2="290.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">пришвидшив Invoke → вужче → менше заряду за цикл</text>
<text x="370.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Площа блоку інференсу (струм × латентність) лягає в заряд циклу — той самий, з якого рахують час життя батареї.</text>
