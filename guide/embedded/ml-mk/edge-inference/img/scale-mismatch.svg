<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масштаб входу: те саме фізичне число дає різний int8</text>
<rect x="35.0" y="58.4" width="150.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">кадр давача</tspan><tspan x="110.0" dy="15.6">0.65 g</tspan><tspan x="110.0" dy="15.6">(сире АЦП = 166)</tspan></text>
<text x="470.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО: масштаб моделі</text>
<rect x="285.0" y="67.3" width="150.0" height="45.3" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">scale = 0.0078</tspan><tspan x="360.0" dy="14.3">zero_point = −1</tspan></text>
<rect x="515.0" y="67.3" width="170.0" height="45.3" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">q = 0.65/0.0078 + (−1)</tspan><tspan x="600.0" dy="14.3">= 82  (int8)</tspan></text>
<line x1="185.0" y1="75.0" x2="285.0" y2="80.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="435.0" y1="90.0" x2="515.0" y2="90.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">модель бачить те, на чому вчилась → правильний клас</text>
<text x="470.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА: «просто сирий байт»</text>
<rect x="285.0" y="249.5" width="150.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">взяли АЦП як є</tspan></text>
<rect x="515.0" y="242.3" width="170.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">q = 166 → переповнення</tspan><tspan x="600.0" dy="14.3">int8 → −90  (сміття)</tspan></text>
<line x1="185.0" y1="105.0" x2="285.0" y2="255.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="435.0" y1="265.0" x2="515.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">те саме фізичне число — інший код → модель «бачить» інше</text>
</svg>