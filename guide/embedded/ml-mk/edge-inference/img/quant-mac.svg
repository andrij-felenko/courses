<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зелене — цілі множення-накопичення в int32 (дешево); червоне — самотній дробовий M.</text>
