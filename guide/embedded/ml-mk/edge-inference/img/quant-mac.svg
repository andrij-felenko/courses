<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна MAC: цілий кістяк у int32 + самотній дробовий множник</text>
<rect x="35.0" y="56.2" width="150.0" height="47.6" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">вхід q₁</tspan><tspan x="110.0" dy="15.6">сітка S₁, Z₁</tspan></text>
<rect x="35.0" y="151.2" width="150.0" height="47.6" rx="6" fill="#dbe6f7" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">вага q₂</tspan><tspan x="110.0" dy="15.6">сітка S₂, Z₂</tspan></text>
<rect x="230.0" y="50.0" width="320.0" height="200.0" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="390.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЦІЛИЙ КІСТЯК (за такт)</text>
<rect x="290.0" y="87.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">(q₁−Z₁)·(q₂−Z₂)</tspan><tspan x="390.0" dy="14.3">усе int8 → int</tspan></text>
<rect x="280.0" y="147.3" width="220.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Σ … + зсув(int32)</tspan><tspan x="390.0" dy="14.3">→ int32-акумулятор</tspan></text>
<rect x="590.0" y="98.4" width="160.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">× M = S₁S₂/S₃</tspan><tspan x="670.0" dy="15.6">(єдиний дріб)</tspan><tspan x="670.0" dy="15.6">→ int8-вихід q₃</tspan></text>
