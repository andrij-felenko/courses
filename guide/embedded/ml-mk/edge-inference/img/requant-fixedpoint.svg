<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переквантування: дробовий M = 2⁻ⁿ·M₀ двома цілими діями</text>
<rect x="200.0" y="53.5" width="360.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">дробовий M ∈ (0, 1)  —  відомий офлайн</tspan></text>
<rect x="190.0" y="123.5" width="380.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">нормуємо:  M = 2⁻ⁿ · M₀,   M₀ ∈ [0.5, 1)</tspan></text>
<line x1="380.0" y1="88.0" x2="380.0" y2="123.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="105.0" y="218.4" width="230.0" height="63.2" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">M₀ → ціле:</tspan><tspan x="220.0" dy="15.6">M₀_fixed ≈ M₀·2³¹</tspan><tspan x="220.0" dy="15.6">множ. ×, зсув &gt;&gt; 31</tspan></text>
<rect x="445.0" y="218.4" width="230.0" height="63.2" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">2⁻ⁿ → зсув:</tspan><tspan x="560.0" dy="15.6">арифметичний</tspan><tspan x="560.0" dy="15.6">&gt;&gt; n біт</tspan></text>
<line x1="320.0" y1="156.5" x2="220.0" y2="218.4" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="156.5" x2="560.0" y2="218.4" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Жодного float — лише цілі множення й зсуви.</text>
</svg>