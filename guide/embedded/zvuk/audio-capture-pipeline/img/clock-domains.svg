<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два тактові домени: залізо пише, код читає, кільце — місток</text>
<rect x="60.0" y="70.0" width="270.0" height="150.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="430.0" y="70.0" width="270.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="195.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">домен ЗАЛІЗА</text>
<text x="195.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">такт f_s, писар — DMA</text>
<text x="565.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">домен КОДУ</text>
<text x="565.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">задача-споживач, читач</text>
<text x="195.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">відлік → відлік → відлік</text>
<text x="195.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">паузи НЕМАЄ</text>
<text x="195.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">переповнить — старе затре</text>
<text x="565.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">забрав блок → обробив</text>
<text x="565.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">у ВЛАСНОМУ темпі</text>
<text x="565.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">спізнився — розрив у звуці</text>
<circle cx="380.0" cy="115.0" r="20.0" fill="#fff7e6" stroke="#8a5fb0" stroke-width="1.6"/>
<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700">A</text>
<circle cx="380.0" cy="145.0" r="20.0" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.6"/>
<text x="380.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700">B</text>
<circle cx="380.0" cy="175.0" r="20.0" fill="#fff7e6" stroke="#8a5fb0" stroke-width="1.6"/>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5fb0" text-anchor="middle" font-weight="700">C</text>
<text x="380.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700">кільце з M буферів</text>
<line x1="333.0" y1="115.0" x2="356.0" y2="115.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="404.0" y1="175.0" x2="427.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">пише</text>
<text x="415.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">читає</text>
<text x="380.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">умова без розривів:   T_обробки  ≤  T_блоку = N / f_s</text>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">спізнивсь на цей бюджет — DMA дожене читача → overrun (втрата даних)</text>
</svg>