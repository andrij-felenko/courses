<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два пороги проти дребезгу + утримання хвоста</text>
<rect x="105.0" y="119.5" width="150.0" height="61.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">ТИША</tspan></text>
<rect x="465.0" y="119.5" width="150.0" height="61.0" rx="6" fill="#d6f0df" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">МОВА</tspan></text>
<line x1="258.0" y1="120.0" x2="462.0" y2="120.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="281.2" y="79.0" width="157.6" height="26.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="360.0" dy="0.0">енергія &gt; ПОРІГ_ВГОРУ</tspan></text>
<line x1="462.0" y1="180.0" x2="258.0" y2="180.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="284.6" y="187.2" width="150.8" height="41.6" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="204.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="360.0" dy="0.0">енергія &lt; ПОРІГ_ВНИЗ</tspan><tspan x="360.0" dy="15.6">і хвіст вичерпано</tspan></text>
<path d="M 600 108 A 46 46 0 1 1 592 106" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="564.2" y="41.9" width="143.7" height="36.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="636.0" y="56.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="636.0" dy="0.0">нижче порогу, але</tspan><tspan x="636.0" dy="13.7">хвіст ще тримає → МОВА</tspan></text>
<rect x="50.0" y="262.0" width="620.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#d0d5db" stroke-width="1.5"/>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ПОРІГ_ВГОРУ вищий за ПОРІГ_ВНИЗ: між ними стан не міняється —</tspan><tspan x="360.0" dy="15.6">звук на межі не «тремтить». Хвіст (hangover) додає N тихих кадрів</tspan><tspan x="360.0" dy="15.6">перед виходом, щоб не рвати слово на паузах між складами.</tspan></text>
</svg>