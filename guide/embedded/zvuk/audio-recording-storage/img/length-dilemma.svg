<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дилема довжини WAV: заголовок першим, число останнім</text>
<text x="210.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спосіб 1 — повернутись і переписати</text>
<rect x="60.0" y="90.0" width="78.0" height="40.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.8"/>
<text x="99.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">заголовок</text>
<text x="99.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#b8860b" text-anchor="middle" font-weight="700">розмір = 0</text>
<rect x="138.0" y="90.0" width="222.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="249.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">звук — блок за блоком →</text>
<line x1="340.0" y1="134.0" x2="340.0" y2="152.0" stroke="#b8860b" stroke-width="1.6"/>
<line x1="340.0" y1="152.0" x2="99.0" y2="152.0" stroke="#b8860b" stroke-width="1.6"/>
<line x1="99.0" y1="152.0" x2="99.0" y2="134.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">seek на початок — вписати довжину</text>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">нулі спершу, наприкінці правимо 8 байт</text>
<text x="210.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спосіб 2 — рахувати наперед</text>
<rect x="60.0" y="230.0" width="78.0" height="40.0" rx="6" fill="#fff7e6" stroke="#27ae60" stroke-width="1.8"/>
<text x="99.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">заголовок</text>
<text x="99.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="middle" font-weight="700">розмір готовий</text>
<rect x="138.0" y="230.0" width="222.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="249.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">звук — блок за блоком →</text>
<text x="210.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">тривалість відома → заголовок правильний одразу</text>
<text x="360.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">довжина потрібна НА ПОЧАТКУ файлу, а відома лише В КІНЦІ</text>
</svg>