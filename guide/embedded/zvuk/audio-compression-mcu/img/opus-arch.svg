<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві половини Opus: SILK-передбачення й CELT-частоти в спільному кодері</text>
<rect x="40.0" y="175.0" width="92.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="86.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="86.0" dy="0.0">звук</tspan><tspan x="86.0" dy="14.3">з буфера</tspan></text>
<line x1="132.0" y1="200.0" x2="190.0" y2="110.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="132.0" y1="200.0" x2="190.0" y2="290.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190.0" y="78.0" width="250.0" height="64.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="315.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">SILK — мовна половина</tspan><tspan x="315.0" dy="13.0">лінійне передбачення (LPC 16)</tspan><tspan x="315.0" dy="13.0">+ передбачення тону (pitch)</tspan></text>
<text x="315.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">голос, вузька смуга</text>
<rect x="190.0" y="258.0" width="250.0" height="64.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.6"/><text x="315.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">CELT — музична половина</tspan><tspan x="315.0" dy="13.0">MDCT: розклад на частоти</tspan><tspan x="315.0" dy="13.0">+ психоакустика (маскування)</tspan></text>
<text x="315.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a5fb0" text-anchor="middle" font-style="italic">музика, широка смуга, мала затримка</text>
<line x1="315.0" y1="142.0" x2="315.0" y2="258.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="322.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">гібрид:</text>
<text x="322.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">обидві разом</text>
<line x1="440.0" y1="110.0" x2="500.0" y2="185.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440.0" y1="290.0" x2="500.0" y2="215.0" stroke="#8a5fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="500.0" y="168.0" width="150.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="575.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">діапазонний</tspan><tspan x="575.0" dy="13.0">(range) кодер</tspan><tspan x="575.0" dy="13.0">ентропійне пакування</tspan></text>
<line x1="650.0" y1="200.0" x2="675.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="675.0" y="175.0" width="92.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.7"/><text x="721.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="721.0" dy="0.0">кадри</tspan><tspan x="721.0" dy="14.3">Opus</tspan></text>
<text x="390.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">дві половини — передбачення для голосу й частоти для музики — зводяться в один ентропійний кодер</text>
</svg>