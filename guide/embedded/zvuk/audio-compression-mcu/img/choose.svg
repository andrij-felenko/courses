<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADPCM чи Opus: дешевизна проти якості на ту саму смугу</text>
<line x1="120.0" y1="300.0" x2="660.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="120.0" y1="300.0" x2="120.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">скільки коштує процесору  →</text>
<text x="108.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">дешево</text>
<text x="652.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">дорого</text>
<text x="80.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" transform="rotate(-90 80.0 185.0)">якість на ту саму смугу  →</text>
<circle cx="210.0" cy="230.0" r="12.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="160.0" y="142.0" width="190.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">ADPCM (IMA)</tspan><tspan x="255.0" dy="13.0">кілька зсувів на відлік</tspan><tspan x="255.0" dy="13.0">влазить у будь-який МК</tspan><tspan x="255.0" dy="13.0">якість — «телефонна»</tspan></text>
<line x1="210.0" y1="218.0" x2="220.0" y2="182.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="570.0" cy="130.0" r="12.0" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="2.0"/>
<rect x="410.0" y="160.0" width="210.0" height="74.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.5"/><text x="515.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Opus</tspan><tspan x="515.0" dy="13.0">повноцінний кодек, RAM/такт</tspan><tspan x="515.0" dy="13.0">багатий: голос і музика</tspan><tspan x="515.0" dy="13.0">чудова якість на низькій смузі</tspan></text>
<line x1="570.0" y1="142.0" x2="560.0" y2="160.0" stroke="#8a5fb0" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вибір не «краще/гірше», а що ти готовий віддати: такти й пам'ять — за якість на тій самій смузі</text>
</svg>