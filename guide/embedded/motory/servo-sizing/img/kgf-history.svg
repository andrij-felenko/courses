<line x1="740.0" y1="168.0" x2="740.0" y2="226.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="740.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кг·см виживає</text>
<text x="740.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">в RC-серво</text>
<rect x="250.0" y="392.0" width="360.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">точний місток між епохами:  1 кгс = 9.80665 Н</tspan></text>
