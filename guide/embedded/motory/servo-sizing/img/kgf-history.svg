<line x1="150.0" y1="110.0" x2="150.0" y2="152.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="150.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сила = вага,</text>
<text x="150.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">g залежить від місця</text>
