<line x1="360.0" y1="110.0" x2="360.0" y2="152.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="360.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3-тя CGPM фіксує</text>
