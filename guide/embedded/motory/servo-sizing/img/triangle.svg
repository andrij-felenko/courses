<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вимоги, що тягнуть у різні боки</text>
<path d="M 360.0 100.0 L 229.5 325.0 L 490.5 325.0 Z" fill="#f4f6f8" stroke="#333333" stroke-width="2"/>
<rect x="290.0" y="44.0" width="140.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="63.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">МОМЕНТ</tspan><tspan x="360.0" dy="15.6">перебороти потік</tspan></text>
<rect x="129.5" y="335.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="204.5" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.5" dy="0.0">ШВИДКІСТЬ</tspan><tspan x="204.5" dy="13.0">встигнути за командою</tspan></text>
<rect x="440.5" y="335.0" width="150.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="515.5" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.5" dy="0.0">МАСА й струм</tspan><tspan x="515.5" dy="16.9">бюджет апарата</tspan></text>
<text x="224.8" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">більше обох</text>
<text x="224.8" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">= важче</text>
<text x="495.2" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сильніше</text>
<text x="495.2" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">= ненажерливіше</text>
<text x="360.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">легше серво — поступається і моментом, і швидкістю</text>
<text x="360.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">вибір —</text>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">під задачу</text>
</svg>