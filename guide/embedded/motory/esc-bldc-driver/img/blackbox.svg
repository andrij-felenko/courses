<text x="410.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ESC бере просте число й товсту напругу — і сам вирішує, як перемикати фази, щоб мотор крутився.</text>
