<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Танкове змішування: газ і поворот у два борти</text>
<rect x="65.0" y="73.0" width="90.0" height="34.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">газ</tspan></text>
<rect x="65.0" y="133.0" width="90.0" height="34.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">поворот</tspan></text>
<circle cx="300.0" cy="90.0" r="22.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="300.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="300.0" cy="210.0" r="22.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="156.0" y1="90.0" x2="276.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="156.0" y1="96.0" x2="276.0" y2="204.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="156.0" y1="150.0" x2="276.0" y2="104.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="156.0" y1="156.0" x2="276.0" y2="194.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="334.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">left = газ + поворот</text>
<text x="334.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">right = газ − поворот</text>
<rect x="488.0" y="70.0" width="150.0" height="190.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="560.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">стиснути</text>
<text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">обидва разом,</text>
<text x="560.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">якщо пік &gt; MAX</text>
<line x1="504.0" y1="142.0" x2="622.0" y2="142.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="560.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">курс = різниця</text>
<text x="560.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">бортів →</text>
<text x="560.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">її бережемо,</text>
<text x="560.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">гучність тиснемо</text>
<line x1="324.0" y1="90.0" x2="486.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="324.0" y1="210.0" x2="486.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="59.8" y="332.0" width="600.3" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">обрізати ОДИН борт = змінити курс; тиснути ОБИДВА = зберегти курс, збавити хід</tspan></text>
</svg>