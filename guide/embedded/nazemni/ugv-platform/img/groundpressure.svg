<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тиск на ґрунт: пляма контакту й зсув у повороті</text>
<line x1="50.0" y1="250.0" x2="710.0" y2="250.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="190.0" cy="210.0" r="40.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="174.0" y1="250.0" x2="206.0" y2="250.0" stroke="#c0392b" stroke-width="6.0"/>
<text x="190.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">колесо</text>
<text x="190.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мала пляма</text>
<text x="190.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">високий тиск p = W/A</text>
<rect x="430.0" y="190.0" width="180.0" height="36.0" rx="18" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
