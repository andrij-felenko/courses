<line x1="436.0" y1="250.0" x2="604.0" y2="250.0" stroke="#27ae60" stroke-width="6.0"/>
<text x="520.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">гусениця</text>
<text x="520.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">довга пляма</text>
<text x="520.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">низький тиск — «пливе»</text>
<rect x="24.0" y="340.0" width="711.9" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">та сама вага W на більшу площу A → менший тиск; зате поворот змушує пляму ШКРЕБТИ ґрунт боком</tspan></text>
