<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затримка з'їдає запас по фазі: φ = ω·τ</text>
<line x1="110.0" y1="400.0" x2="840.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="400.0" x2="110.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="836.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">частота коливання  ω →</text>
<text x="92.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">фазове</text>
<text x="92.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">відставання φ ↑</text>
<line x1="110.0" y1="214.0" x2="840.0" y2="214.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="8 5"/>
<text x="836.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">запас по фазі PM (60°)</text>
<line x1="489.6" y1="400.0" x2="489.6" y2="100.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="489.6" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω_c</text>
<text x="489.6" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">робоча частота</text>
<line x1="110.0" y1="400.0" x2="722.3" y2="100.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="110.0" y1="400.0" x2="840.0" y2="221.2" stroke="#2457d6" stroke-width="2.4"/>
<circle cx="489.6" cy="214.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="233.4" y="118.8" width="191.1" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="329.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="329.0" dy="0.0">гранична затримка τ_max:</tspan><tspan x="329.0" dy="15.0">на ω_c дістає межу PM</tspan></text>
<rect x="586.7" y="286.8" width="127.0" height="46.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.2" y="306.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="650.2" dy="0.0">мала затримка:</tspan><tspan x="650.2" dy="15.0">запас лишається</tspan></text>
<rect x="0.6" y="463.5" width="938.8" height="33.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Межа розгойдування:  τ_max = PM / ω_c.  Важелі проти лагу: ↓τ,  ↓ω_c (веди повільніше),  або предиктивний дисплей.</tspan></text>
</svg>