<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінк гине з двох боків окремо — стережи обидва кінці</text>
<rect x="75.0" y="142.5" width="200.0" height="65.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ПУЛЬТ / GCS</tspan><tspan x="175.0" dy="16.2">сторож на DOWNLINK</tspan><tspan x="175.0" dy="16.2">(чи чую телеметрію?)</tspan></text>
<rect x="695.0" y="142.5" width="200.0" height="65.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="163.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">РОВЕР</tspan><tspan x="795.0" dy="16.2">сторож на UPLINK</tspan><tspan x="795.0" dy="16.2">(чи чую команди?)</tspan></text>
<line x1="280.0" y1="92.0" x2="690.0" y2="92.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="337.4" y="50.0" width="295.3" height="32.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">UPLINK ↑  команди + серцебиття пульта</tspan></text>
<line x1="690.0" y1="258.0" x2="280.0" y2="258.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="337.4" y="268.0" width="295.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="485.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">DOWNLINK ↓  телеметрія + відео ровера</tspan></text>
<rect x="92.5" y="401.6" width="795.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Найпідступніше: UPLINK живий, DOWNLINK мертвий — команди долітають, та оператор веде машину НАОСЛІП.</tspan><tspan x="490.0" dy="16.2">Тому ровер входить у failsafe і коли пульт перестав його ЧУТИ, не лише коли сам оглух.</tspan></text>
</svg>