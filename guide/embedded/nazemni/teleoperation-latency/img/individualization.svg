<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Телеавтомат 1898: човен слухає лише СВОГО — «як на власне ім'я»</text>
<rect x="690.0" y="182.5" width="230.0" height="65.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">ЧОВЕН-ТЕЛЕАВТОМАТ</tspan><tspan x="805.0" dy="16.2">приймач на СВОЇ періоди</tspan><tspan x="805.0" dy="16.2">(когерер + реле)</tspan></text>
<rect x="75.0" y="93.6" width="180.0" height="48.8" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">СВІЙ ОПЕРАТОР</tspan><tspan x="165.0" dy="16.2">ті самі періоди</tspan></text>
<line x1="259.0" y1="140.0" x2="682.0" y2="187.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="381.6" y="126.8" width="176.9" height="46.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">збіг → РЕЛЕ СПРАЦЮВАЛО</tspan><tspan x="470.0" dy="15.0">кермо / хід</tspan></text>
<rect x="54.2" y="297.6" width="221.5" height="48.8" rx="6" fill="#eef2f7" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ЧУЖИЙ ПЕРЕДАВАЧ</tspan><tspan x="165.0" dy="16.2">гроза, іскра, крик із залу</tspan></text>
<line x1="279.8" y1="300.0" x2="682.0" y2="243.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="363.7" y="266.8" width="212.5" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="286.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">інші періоди → РЕЛЕ МОВЧИТЬ</tspan><tspan x="470.0" dy="15.0">жодної дії</tspan></text>
<rect x="229.6" y="386.2" width="540.8" height="47.6" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Прапрадід сучасного failsafe: «не мій сигнал — нічого не роблю».</tspan><tspan x="500.0" dy="15.6">Телекерування народилося як питання ДОВІРИ до команди, а не швидкості.</tspan></text>
</svg>