<rect x="122.9" y="387.8" width="694.2" height="32.5" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="408.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Петля для ОЧЕЙ замикається без лагу: оператор веде фантом, реальність тягнеться слідом.</tspan></text>
