<rect x="722.6" y="207.8" width="174.9" height="44.5" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">рука → команда</tspan><tspan x="810.0" dy="15.0">(миттєво рухає фантом)</tspan></text>
