<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Телекерування — замкнена петля через дві радіолінії</text>
<rect x="90.0" y="175.7" width="150.0" height="68.6" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ОПЕРАТОР</tspan><tspan x="165.0" dy="17.6">очі + руки</tspan><tspan x="165.0" dy="17.6">(на землі)</tspan></text>
<rect x="690.0" y="175.7" width="150.0" height="68.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">РОВЕР</tspan><tspan x="765.0" dy="17.6">камера + колеса</tspan><tspan x="765.0" dy="17.6">(у полі)</tspan></text>
<line x1="235.0" y1="108.0" x2="695.0" y2="108.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="216.9" y="62.0" width="496.2" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="465.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">КЕРУВАННЯ ↑  стік → колеса   (мала затримка, часто, без ретраїв)</tspan></text>
<line x1="695.0" y1="312.0" x2="235.0" y2="312.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="250.4" y="326.0" width="429.2" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="465.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">ВІДЕО ↓  картина з камери → очі   (кодек + буфер → лаг)</tspan></text>
<text x="465.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">петля
дія → бачу → корегую</text>
<text x="465.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">затримка будь-де в колі
розхитує керування</text>
<rect x="80.2" y="383.8" width="779.5" height="32.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Відмінність від коптера: безпечний стан ровера — СТОЯТИ. Обрив ⇒ гальмуй і чекай; апарат не падає.</tspan></text>
</svg>