<rect x="60.0" y="374.0" width="760.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="400.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="440.0" dy="0.0">Читач бере слот із більшим seq, що проходить CRC. Новіший побитий → відкат на старіший ціле.</tspan><tspan x="440.0" dy="14.3">Єдину чинну копію ніколи не перезаписуємо → у пам'яті завжди є хоч одне ціле калібрування.</tspan></text>
