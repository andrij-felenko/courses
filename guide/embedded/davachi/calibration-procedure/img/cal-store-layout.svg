<text x="90.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">CRC покриває все ліворуч → ловить будь-яке псування байтів</text>
