<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув (offset) і нахил (gain): що ламає й що лагодить калібрування</text>
<line x1="70.0" y1="360.0" x2="70.0" y2="48.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="70.0" y1="360.0" x2="682.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">вихід давача</text>
<text x="678.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">справжня величина</text>
<line x1="70.0" y1="360.0" x2="670.0" y2="60.0" stroke="#27ae60" stroke-width="2.6"/>
<text x="666.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">ідеал: y = x</text>
<line x1="70.0" y1="306.0" x2="670.0" y2="120.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="676.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">реальна:</text>
<text x="676.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">y = k·x + b</text>
<line x1="70.0" y1="360.0" x2="70.0" y2="306.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="64.0" y1="306.0" x2="76.0" y2="306.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="82.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">offset b</text>
<line x1="538.0" y1="160.9" x2="538.0" y2="126.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="546.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">недобір нахилу</text>
<text x="546.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">→ малий gain</text>
<circle cx="160.0" cy="278.1" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="160.0" cy="315.0" r="6.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<line x1="160.0" y1="278.1" x2="160.0" y2="315.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="2,3"/>
<text x="160.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">опора low</text>
<circle cx="610.0" cy="138.6" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="610.0" cy="90.0" r="6.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<line x1="610.0" y1="138.6" x2="610.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="2,3"/>
<text x="610.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">опора high</text>
<text x="380.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дві опорні точки дають дві рівняння → з них однозначно k і b, що повертають реальну пряму на ідеал</text>
</svg>