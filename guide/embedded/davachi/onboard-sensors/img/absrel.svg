<text x="140" y="330" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">абсолютний → шум, але без дрейфу</text>
<polyline points="76,250 160,249 260,251 360,249 460,250 566,250" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.6" stroke-linejoin="round"/>
<text x="300" y="238" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">поєднання → і швидко, і без дрейфу</text>
<rect x="620" y="100" width="300" height="84" rx="11" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="770" y="126" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ВІДНОСНІ</text>
<text x="770" y="148" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">швидкі, але дрейфують</text>
<text x="770" y="170" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">IMU · барометр</text>
<rect x="620" y="200" width="300" height="84" rx="11" fill="#eff4ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="770" y="226" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">АБСОЛЮТНІ</text>
<text x="770" y="248" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">стабільні, але повільні/шумні</text>
<text x="770" y="270" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Consolas, monospace">GNSS · магнітометр</text>
<rect x="620" y="300" width="300" height="70" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="770" y="326" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЄДНАННЯ (Розділ 43/46)</text>
<text x="770" y="348" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">найкраще з обох світів</text>
<text x="480.0" y="458" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це — головний принцип усього бортового відчуття: швидке, що пливе, тримають повільним, що не пливе.</text>
