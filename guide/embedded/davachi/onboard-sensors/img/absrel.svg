  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Глибока вісь: відносні (швидкі, дрейфують) проти абсолютних (стабільні, повільні)</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поєднання бере швидкість одних і стабільність інших</text>
<rect x="50" y="88" width="540" height="300" rx="10" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="70" y1="380" x2="575" y2="380" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="575" y="374" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<line x1="70" y1="250" x2="568" y2="250" stroke="#0a8f3c" stroke-width="1.3" stroke-dasharray="6,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="74" y="244" font-size="10" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="normal">істинне значення</text>
