<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коефіцієнт чутливості: хто скільки важить</text>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">d = v·t/2: кожен вхід тисне на вихід із власною «вагою» — своїм коефіцієнтом</text>
<rect x="31.1" y="122.8" width="237.8" height="54.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">зсунь швидкість на Δv</tspan><tspan x="150.0" dy="15.0">→ відстань зсунеться на (t/2)·Δv</tspan></text>
<text x="150.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">∂d/∂v = t/2</text>
<rect x="451.1" y="122.8" width="237.8" height="54.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="570.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">зсунь час на Δt</tspan><tspan x="570.0" dy="15.0">→ відстань зсунеться на (v/2)·Δt</tspan></text>
<text x="570.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">∂d/∂t = v/2</text>
<text x="360.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">σ(d)² = (t/2)²·σ(v)² + (v/2)²·σ(t)²   — внесок кожного = (його коефіцієнт)²·(його σ)²</text>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ось чому 3 % розкиду у швидкості коштують 3 % відстані, а наносекунда таймера — майже нічого</text>
</svg>