<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 785.12 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="785.12" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадкові внески складають у квадратурі</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Незалежні розкиди частково гасяться — тож складають катети, не довжини</text>
<text x="120.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Проста сума (надто песимістично)</text>
<rect x="98.0" y="226.0" width="44.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
<text x="120.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">6</text>
<rect x="98.0" y="199.0" width="44.0" height="27.0" rx="6" fill="#dfe7fb" stroke="#2457d6" stroke-width="1.3"/>
<text x="120.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">+3</text>
<line x1="80.0" y1="280.0" x2="160.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="120.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">6 + 3 = 9 мм</text>
<line x1="470.0" y1="280.0" x2="524.0" y2="280.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="524.0" y1="280.0" x2="524.0" y2="253.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="470.0" y1="280.0" x2="524.0" y2="253.0" stroke="#c0392b" stroke-width="2.8"/>
<rect x="516.0" y="272.0" width="8.0" height="8.0" rx="0" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="497.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">6</text>
<text x="538.0" y="266.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3</text>
<text x="477.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">√(6²+3²)</text>
<text x="500.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Квадратура (чесно)</text>
<text x="480.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">= 6.7 мм — менше за 9, ближче до більшого внеску</text>
</svg>