<rect x="100.0" y="300.0" width="320.0" height="56.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/><text x="260.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">відстань:  f_R = (f_up + f_down) / 2</tspan><tspan x="260.0" dy="15.6">→ півсума прибирає Допплер</tspan></text>
<rect x="440.0" y="300.0" width="320.0" height="56.0" rx="6" fill="#f3eefb" stroke="#8e44ad" stroke-width="1.4"/><text x="600.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">швидкість:  f_D = (f_down − f_up) / 2</tspan><tspan x="600.0" dy="15.6">→ піврізниця прибирає дальність</tspan></text>
