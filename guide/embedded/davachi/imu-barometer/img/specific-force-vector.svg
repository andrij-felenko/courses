<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння акселерометра: f = a − g</text>
<text x="390.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">f = a − g  — акселерометр звітує про відхилення руху від вільного падіння</text>
<text x="120.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спокій</text>
<text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a = 0</text>
<polygon points="105.0,165.0 135.0,165.0 135.0,195.0 105.0,195.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="120.0" cy="180.0" r="4.5" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="120.0" y1="180.0" x2="120.0" y2="124.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="120.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f = −g</text>
<text x="120.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">+1g угору</text>
<text x="330.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вільне падіння</text>
<text x="330.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a = g</text>
<polygon points="315.0,165.0 345.0,165.0 345.0,195.0 315.0,195.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="330.0" cy="180.0" r="4.5" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="330.0" cy="180.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="330.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f = 0</text>
<text x="330.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">невагомість</text>
<text x="545.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бічний розгін</text>
<text x="545.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a ≠ 0 (убік)</text>
<polygon points="530.0,165.0 560.0,165.0 560.0,195.0 530.0,195.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="545.0" cy="180.0" r="4.5" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="545.0" y1="180.0" x2="545.0" y2="124.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="549.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">−g</text>
<line x1="545.0" y1="124.0" x2="511.0" y2="124.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="511.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">−a</text>
<line x1="545.0" y1="180.0" x2="511.0" y2="124.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="505.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">f</text>
<text x="545.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вектор нахилився →</text>
<text x="545.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">удаваний нахил</text>
</svg>