<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гравітація фіксує два кути з трьох — курс сліпий</text>
<text x="390.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Нахил міняє проєкцію g; поворот навколо вертикалі — ні</text>
<rect x="28.0" y="74.0" width="224.0" height="248.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Крен / тангаж — видно</text>
<polygon points="78.3,188.8 209.9,236.7 201.7,259.2 70.1,211.3" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<line x1="140.0" y1="160.0" x2="140.0" y2="294.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4,3"/>
<line x1="140.0" y1="224.0" x2="140.0" y2="294.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="152.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">g</text>
<text x="140.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">проєкція g змінилась</text>
<rect x="278.0" y="74.0" width="224.0" height="248.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="390.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Курс (yaw) — не видно</text>
<polygon points="353.5,171.6 441.9,233.5 416.7,269.6 328.2,207.6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<polygon points="435.1,243.3 444.1,261.9 423.6,259.7" fill="#2457d6" stroke="#2457d6" stroke-width="1.4"/>
<circle cx="390.0" cy="224.0" r="13.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="390.0" cy="224.0" r="3.0" fill="#27ae60" stroke="none" stroke-width="1.0"/>
<text x="390.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">g ⊙ — не змінюється</text>
<text x="390.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">для g нічого не сталось</text>
<rect x="528.0" y="74.0" width="224.0" height="248.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="640.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Курс дає магнітометр</text>
<circle cx="640.0" cy="224.0" r="58.0" fill="#fffdf5" stroke="#c0392b" stroke-width="1.6"/>
<text x="640.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пн</text>
<line x1="640.0" y1="260.0" x2="640.0" y2="188.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="640.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">по горизонтальному полю Землі</text>
</svg>