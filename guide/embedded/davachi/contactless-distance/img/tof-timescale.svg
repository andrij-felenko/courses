<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290">
<rect width="700" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="350.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Час польоту: звук дає мілісекунди, світло — наносекунди</text>
<rect x="60.0" y="70.0" width="26.0" height="40.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="73.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">давач</text>
<rect x="560.0" y="64.0" width="18.0" height="56.0" rx="0" fill="#eee" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="569.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ціль (1 м)</text>
<line x1="96.0" y1="84.0" x2="552.0" y2="84.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="320.0" y="76.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">імпульс →</text>
<line x1="552.0" y1="100.0" x2="96.0" y2="100.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="320.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">← відлуння</text>
<text x="70.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">звук (343 м/с):</text>
<rect x="230.0" y="166.0" width="360.0" height="18.0" rx="0" fill="#cfe0cf" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="410.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">t ≈ 5.83 мс</text>
<text x="70.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">світло (3·10⁸):</text>
<rect x="230.0" y="206.0" width="6.0" height="18.0" rx="0" fill="#cfd9f3" stroke="#1f47b5" stroke-width="1.2"/>
<text x="300.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">t ≈ 6.67 нс  (майже у 10⁶ разів швидше)</text>
<text x="350.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">повільний звук міряє простий таймер; швидке світло — наносекундна електроніка</text>
</svg>
