<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадратура: чому Δd/d = Δv/v ⊕ Δt/t, а не Δv/v + Δt/t</text>
<line x1="150.0" y1="360.0" x2="470.0" y2="360.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="150.0" y1="360.0" x2="150.0" y2="120.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="150.0" y1="360.0" x2="390.0" y2="360.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="270.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Δv/v  (швидкість)</text>
<line x1="390.0" y1="360.0" x2="390.0" y2="230.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="402.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Δt/t</text>
<text x="402.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">(час)</text>
<polyline points="374.0,360.0 374.0,344.0 390.0,344.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="368.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">⊥ незалежні</text>
<line x1="150.0" y1="360.0" x2="390.0" y2="230.0" stroke="#c0392b" stroke-width="3.2"/>
<text x="262.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">Δd/d = √((Δv/v)² + (Δt/t)²)</text>
<circle cx="390.0" cy="230.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="510.0" y="210.0" width="240.0" height="96.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.4"/><text x="630.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">квадрат ТИСНЕ малий доданок:</tspan><tspan x="630.0" dy="14.3">якщо Δt/t удвічі менша за Δv/v,</tspan><tspan x="630.0" dy="14.3">вона додає лише ~12 %,</tspan><tspan x="630.0" dy="14.3">а не 50 %. Головний доданок</tspan><tspan x="630.0" dy="14.3">майже й визначає підсумок.</tspan></text>
<text x="430.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">незалежні джерела = перпендикулярні катети; сумарна похибка — гіпотенуза, тому доданки додаються квадратами, а не прямо</text>
</svg>