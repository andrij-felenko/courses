<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Важіль v/2: та сама похибка часу — різна похибка відстані</text>
<text x="430.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">той самий квант часу  Δt = 1 мкс</text>
<rect x="385.0" y="84.0" width="90.0" height="26.0" rx="3" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="430.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Δt</text>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">звук  v ≈ 343 м/с</text>
<line x1="210.0" y1="116.0" x2="210.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="216.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">×v/2</text>
<rect x="164.0" y="320.0" width="92.0" height="20.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Δd ≈ 0.17 мм</text>
<text x="650.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">світло  v ≈ 3·10⁸ м/с</text>
<line x1="650.0" y1="116.0" x2="650.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="656.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">×v/2</text>
<rect x="604.0" y="140.0" width="92.0" height="200.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Δd ≈ 150 м</text>
<text x="430.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">однаковий Δt → похибка відстані більша в ~мільйон разів; ось чому світло вимагає в тисячі разів точнішого годинника</text>
</svg>