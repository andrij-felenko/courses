<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типова розпіновка: два піни-перемикачі — CSB і SDO</text>
<rect x="305.0" y="110.0" width="150.0" height="210.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="380.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">MEMS-</text>
<text x="380.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">барометр</text>
<line x1="271.0" y1="144.0" x2="305.0" y2="144.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="265.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">VDD</text>
<text x="265.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">живлення аналогу</text>
<line x1="271.0" y1="196.0" x2="305.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="265.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">VDDIO</text>
<text x="265.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">живлення шини</text>
<line x1="271.0" y1="248.0" x2="305.0" y2="248.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="265.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">GND</text>
<text x="265.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">спільна земля</text>
<line x1="455.0" y1="144.0" x2="489.0" y2="144.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="495.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">SCK</text>
<text x="495.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">такт (SCL для I2C)</text>
<line x1="455.0" y1="190.0" x2="489.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="495.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">SDI</text>
<text x="495.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">дані в (SDA для I2C)</text>
<line x1="455.0" y1="236.0" x2="489.0" y2="236.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="495.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">SDO</text>
<text x="495.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">дані назовні / адреса</text>
<line x1="455.0" y1="282.0" x2="489.0" y2="282.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="495.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">CSB</text>
<text x="495.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">вибір шини й чипа</text>
<rect x="60.0" y="336.0" width="320.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">РІШЕННЯ 1 — яка шина? Це визначає CSB:</tspan><tspan x="220.0" dy="14.3">CSB на живлення (тримати HIGH)  →  I2C</tspan><tspan x="220.0" dy="14.3">CSB смикає хост (chip-select)   →  SPI</tspan></text>
<rect x="400.0" y="336.0" width="300.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">РІШЕННЯ 2 — адреса на I2C? Її задає SDO:</tspan><tspan x="550.0" dy="14.3">SDO на землю     →  молодший біт 0</tspan><tspan x="550.0" dy="14.3">SDO на живлення  →  молодший біт 1</tspan></text>
</svg>