<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться dp = −ρ·g·dh: сили на тонкий шар повітря</text>
<rect x="175.0" y="70.0" width="150.0" height="300.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.2"/>
<text x="250.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стовп повітря</text>
<rect x="175.0" y="120.0" width="150.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="339.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">шар  dh</text>
<line x1="250.0" y1="296.0" x2="250.0" y2="254.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="250.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">тиск знизу  p · A  ↑</text>
<line x1="250.0" y1="74.0" x2="250.0" y2="116.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="250.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тиск зверху  (p+dp) · A  ↓</text>
<line x1="206.0" y1="167.0" x2="206.0" y2="207.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="200.0" dy="0.0">вага</tspan><tspan x="200.0" dy="14.3">ρ·A·dh·g</tspan></text>
<rect x="430.0" y="100.0" width="250.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="555.0" y="123.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Рівновага сил на шар:</tspan><tspan x="555.0" dy="15.6"></tspan><tspan x="555.0" dy="15.6">p·A  =  (p+dp)·A  +  ρ·A·dh·g</tspan><tspan x="555.0" dy="15.6"></tspan><tspan x="555.0" dy="15.6">звідси, скоротивши A:</tspan><tspan x="555.0" dy="15.6"></tspan><tspan x="555.0" dy="15.6">     dp  =  − ρ·g·dh</tspan><tspan x="555.0" dy="15.6"></tspan><tspan x="555.0" dy="15.6">Тиск падає (dp&lt;0) рівно на</tspan><tspan x="555.0" dy="15.6">вагу шару, що додався зверху.</tspan><tspan x="555.0" dy="15.6">Це — гідростатика, з якої</tspan><tspan x="555.0" dy="15.6">виростає вся формула висоти.</tspan></text>
</svg>