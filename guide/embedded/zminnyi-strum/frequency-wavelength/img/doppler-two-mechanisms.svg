<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">У звуку — дві РІЗНІ причини зсуву (тому й формули різні)</text>
<text x="60.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">A. їде ДЖЕРЕЛО</text>
<text x="60.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">гребені в повітрі реально стиснуті</text>
<line x1="120.0" y1="110.0" x2="120.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="175.0" y1="110.0" x2="175.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="224.0" y1="110.0" x2="224.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="267.0" y1="110.0" x2="267.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="304.0" y1="110.0" x2="304.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="336.0" y1="110.0" x2="336.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="363.0" y1="110.0" x2="363.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="386.0" y1="110.0" x2="386.0" y2="150.0" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="120.0" cy="130.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="398.0" y1="130.0" x2="440.0" y2="130.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="690.0" cy="130.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приймач стоїть</text>
<text x="300.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">λ коротшає у повітрі</text>
<text x="690.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="690.0" dy="0.0">чує вищу f, бо в повітря</tspan><tspan x="690.0" dy="14.3">прийшли коротші хвилі</tspan></text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">B. їде ПРИЙМАЧ</text>
<text x="60.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">гребені рівномірні, приймач налітає на них частіше</text>
<line x1="150.0" y1="280.0" x2="150.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="205.0" y1="280.0" x2="205.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
