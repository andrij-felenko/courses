<line x1="370.0" y1="280.0" x2="370.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="425.0" y1="280.0" x2="425.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="480.0" y1="280.0" x2="480.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="535.0" y1="280.0" x2="535.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="590.0" y1="280.0" x2="590.0" y2="320.0" stroke="#2457d6" stroke-width="2.2"/>
<circle cx="120.0" cy="300.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="120.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">джерело</tspan><tspan x="120.0" dy="13.7">стоїть</tspan></text>
<circle cx="690.0" cy="300.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="680.0" y1="300.0" x2="636.0" y2="300.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="700.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="700.0" dy="0.0">сам біжить назустріч —</tspan><tspan x="700.0" dy="14.3">минає гребені частіше</tspan></text>
<text x="375.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">λ у повітрі НЕ змінилась</text>
</svg>