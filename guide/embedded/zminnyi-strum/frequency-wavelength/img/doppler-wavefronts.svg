<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гребені — концентричні кола. Рух джерела зсуває їхні центри</text>
<text x="215.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">джерело стоїть</text>
<circle cx="215.0" cy="215.0" r="34.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="215.0" cy="215.0" r="68.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="215.0" cy="215.0" r="102.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="215.0" cy="215.0" r="136.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="215.0" cy="215.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="215.0" dy="0.0">λ однакова з усіх боків</tspan><tspan x="215.0" dy="15.6">→ f однакова скрізь</tspan></text>
<text x="660.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">джерело їде →</text>
<circle cx="560.0" cy="215.0" r="130.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="586.0" cy="215.0" r="98.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="612.0" cy="215.0" r="66.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="638.0" cy="215.0" r="34.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="638.0" cy="215.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="648.0" y1="215.0" x2="682.0" y2="215.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="760.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">попереду</text>
<text x="760.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="760.0" dy="0.0">коротша λ</tspan><tspan x="760.0" dy="14.3">вища f</tspan></text>
<text x="422.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">позаду</text>
<text x="422.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="422.0" dy="0.0">довша λ</tspan><tspan x="422.0" dy="14.3">нижча f</tspan></text>
<rect x="40.0" y="348.0" width="780.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="365.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Джерело не міняє швидкість хвилі — воно наздоганяє власні гребені:</tspan><tspan x="430.0" dy="15.6">попереду вони скупчуються, позаду відстають. Так рух стає зсувом частоти.</tspan></text>
</svg>