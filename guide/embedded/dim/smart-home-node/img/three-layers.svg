<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол як три шари з різним темпом і критичністю</text>
<rect x="180.0" y="70.0" width="360.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Звіт і команди  (MQTT)</text>
<text x="360.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">раз на секунди · терпить обриви</text>
<rect x="180.0" y="170.0" width="360.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Рішення  (автономне правило)</text>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">локально · мілісекунди · серце вузла</text>
<rect x="180.0" y="270.0" width="360.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="360.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знімання  (давач · виконавець)</text>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">торкається світу · найнадійніше</text>
<line x1="162.0" y1="164.0" x2="162.0" y2="350.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="154.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">усередині плати</text>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">☁ брокер / мережа</text>
<line x1="360.0" y1="56.0" x2="360.0" y2="70.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="416.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">обрив</text>
<line x1="352.0" y1="63.0" x2="368.0" y2="63.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="562.0" y1="138.0" x2="562.0" y2="276.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="572.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">спирається</text>
<text x="572.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">на нижні</text>
<text x="360.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">обрив угорі не спиняє нижні два шари</text>
</svg>