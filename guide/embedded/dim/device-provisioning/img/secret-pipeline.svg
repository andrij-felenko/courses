<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від сирого секрету до ключа сеансу: де входять PoP і nonce</text>
<rect x="80.0" y="52.0" width="500.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">сирий спільний секрет   s = X25519(k_свій, P_чужий)</tspan><tspan x="330.0" dy="16.2">32 байти — але з ухилом: НЕ рівномірний шум,</tspan><tspan x="330.0" dy="16.2">у молодших бітах лишається структура</tspan></text>
<rect x="555.0" y="150.0" width="290.0" height="46.0" rx="6" fill="#fff8e6" stroke="#8a6d0b" stroke-width="1.5"/><text x="700.0" y="169.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d0b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">PoP-секрет із наклейки</tspan><tspan x="700.0" dy="15.6">вплітається ОСЬ ТУТ</tspan></text>
<line x1="555.0" y1="173.0" x2="584.0" y2="190.0" stroke="#8a6d0b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="330.0" y1="120.0" x2="330.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="78.0" y="168.0" width="504.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="188.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">згладжування (KDF)</tspan><tspan x="330.0" dy="15.6">ESP-IDF security1:  K = SHA-256( s ⊕ SHA-256(PoP) )</tspan><tspan x="330.0" dy="15.6">загальний спосіб:  K = HKDF(s, salt, info)</tspan><tspan x="330.0" dy="15.6">— спершу витягти ентропію, тоді розтягти в ключ</tspan></text>
<line x1="330.0" y1="248.0" x2="330.0" y2="304.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120.0" y="304.0" width="420.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="330.0" y="326.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">ключ сеансу K — 256 бітів рівного шуму,</tspan><tspan x="330.0" dy="16.2">не вгадати, не відрізнити від випадкового</tspan></text>
<rect x="550.0" y="416.0" width="300.0" height="46.0" rx="6" fill="#fff4f0" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">одноразове число (nonce)</tspan><tspan x="700.0" dy="15.0">нове на КОЖЕН кадр — проти повторів</tspan></text>
<line x1="550.0" y1="439.0" x2="564.0" y2="454.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="330.0" y1="356.0" x2="330.0" y2="434.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="96.0" y="434.0" width="468.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="455.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">AES-GCM( ключ K, nonce, дані )</tspan><tspan x="330.0" dy="16.9">шифрує (конфіденційність) +</tspan><tspan x="330.0" dy="16.9">пломба-тег (цілісність) заразом</tspan></text>
</svg>