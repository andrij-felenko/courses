<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Home Assistant: від скрипта під лампу до стандарту</text>
<line x1="118.0" y1="82.0" x2="118.0" y2="428.0" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="118.0" cy="102.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<text x="94.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">2012</text>
<text x="144.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Особистий скрипт</text>
<text x="144.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Паулюс Схаутсен купує Philips Hue; у хабі — локальний</text>
<text x="144.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">API. Пише на Python скрипт, що вмикає лампи вдома.</text>
<circle cx="118.0" cy="206.0" r="9.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.5"/>
<text x="94.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">2013</text>
<text x="144.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Перший коміт на GitHub</text>
<text x="144.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">17 вересня — виклав Home Assistant у відкритий доступ,</text>
<text x="144.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">щоб код налаштовували без Python. Ліцензія Apache 2.0.</text>
<circle cx="118.0" cy="310.0" r="9.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.5"/>
<text x="94.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="end" font-weight="700">2018</text>
<text x="144.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Nabu Casa — сталість</text>
<text x="144.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Компанія на добровільну підписку: гроші на розробку є,</text>
<text x="144.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">локальне ядро лишається безкоштовним і без чужої хмари.</text>
<circle cx="118.0" cy="414.0" r="9.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
<text x="94.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">2024</text>
<text x="144.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">#1 проєкт на GitHub</text>
<text x="144.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">~21 000 дописувачів за рік — вершина Octoverse.</text>
<text x="144.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Open Home Foundation: «не продати, не купити».</text>
</svg>