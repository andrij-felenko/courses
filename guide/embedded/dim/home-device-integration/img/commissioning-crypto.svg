<circle cx="510.0" cy="334.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<line x1="690.0" y1="266.0" x2="690.0" y2="372.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="2 3"/>
