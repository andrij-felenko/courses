<text x="486.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="486.0" dy="0.0">друкує свій</tspan><tspan x="486.0" dy="14.3">Build-ID у лог</tspan></text>
