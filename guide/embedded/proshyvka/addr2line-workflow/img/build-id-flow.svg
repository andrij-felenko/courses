<text x="294.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">.note.gnu.build-id</text>
<text x="294.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="294.0" dy="0.0">секція в образі</tspan><tspan x="294.0" dy="14.3">(їде у Flash)</tspan></text>
