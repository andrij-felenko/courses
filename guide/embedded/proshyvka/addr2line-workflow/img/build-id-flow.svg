<text x="390.0" y="218.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Build ID: 4e9f2a1c8b3d5e7f…1a3c5e7f9b1d</text>
<text x="390.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Той самий 40-значний хеш — у логу з поля Й іменем файла в архіві.</text>
<text x="390.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Машина рахує його з коду — переплутати збірки руками неможливо.</text>
