<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">eFuse: кожен крок — двері, що замикаються за тобою</text>
<rect x="60.0" y="70.0" width="300.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Чистий чип</tspan></text>
<text x="374.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ще все можна: прошити, стерти, перепрошити будь-чим</text>
<line x1="210.0" y1="128.0" x2="210.0" y2="142.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="144.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="210.0" y="168.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Пропалено відбиток ключа</tspan><tspan x="210.0" dy="15.6">(BLOCK2)</tspan></text>
<text x="374.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">тепер чип прийме лише образ, підписаний ТВОЇМ ключем</text>
<line x1="210.0" y1="202.0" x2="210.0" y2="216.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="218.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="210.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Увімкнено Secure Boot</tspan><tspan x="210.0" dy="15.6">(ABS_DONE_1)</tspan></text>
<text x="374.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ROM відтепер перевіряє підпис; чужий код не запуститься</text>
<line x1="210.0" y1="276.0" x2="210.0" y2="290.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="292.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="210.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Release-режим шифрування</tspan><tspan x="210.0" dy="15.6">(DISABLE_DL_*)</tspan></text>
<text x="374.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">UART більше не зчитає й не зашифрує Flash; лише OTA</text>
<line x1="32.0" y1="76.0" x2="32.0" y2="342.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="2 6"/>
<text x="20.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">назад дороги нема</text>
</svg>