<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стратегії: розділити кристал чи винести в окремий чип</text>
<rect x="40.0" y="70.0" width="320.0" height="250.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">TrustZone — один процесор</text>
<rect x="60.0" y="114.0" width="280.0" height="78.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="200.0" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">НОРМАЛЬНИЙ світ</tspan><tspan x="200.0" dy="14.3">додаток, мережа, UI</tspan><tspan x="200.0" dy="14.3">(тут весь складний код)</tspan></text>
<line x1="60.0" y1="204.0" x2="340.0" y2="204.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="200.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">межа стереже біт NS на кожній транзакції</text>
<rect x="60.0" y="214.0" width="280.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="200.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">БЕЗПЕЧНИЙ світ</tspan><tspan x="200.0" dy="14.3">ключі, крипто</tspan><tspan x="200.0" dy="14.3">(малий, перевірений код)</tspan></text>
<text x="200.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">секрет не покидає кристал</text>
<rect x="420.0" y="70.0" width="320.0" height="250.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="580.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TPM — окрема мікросхема</text>
<rect x="440.0" y="114.0" width="280.0" height="70.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="580.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Головний процесор</tspan><tspan x="580.0" dy="14.3">уся система, будь-який код</tspan><tspan x="580.0" dy="14.3">(може бути зламаний)</tspan></text>
<line x1="580.0" y1="186.0" x2="580.0" y2="218.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="220.0" x2="580.0" y2="188.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="644.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">команди по шині</text>
<rect x="460.0" y="228.0" width="240.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="580.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">TPM</tspan><tspan x="580.0" dy="14.3">ключі всередині назавжди</tspan><tspan x="580.0" dy="14.3">рахує крипто за нас</tspan></text>
<text x="580.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">секрет фізично в іншому корпусі</text>
