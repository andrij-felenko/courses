<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робити, поки замок зайнятий</text>
<text x="195.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Спінлок: крутитися</text>
<rect x="70.0" y="80.0" width="250.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="195.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">ЯДРО зайняте</tspan><tspan x="195.0" dy="15.6">циклом перевірки</tspan></text>
<text x="195.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↻ вільно? ні. вільно? ні.</text>
<text x="195.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">такти йдуть у нікуди</text>
<rect x="70.0" y="235.0" width="250.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="195.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">+ прокинення миттєве</tspan><tspan x="195.0" dy="14.3">(нема перемикання)</tspan></text>
<text x="525.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Мʼютекс: заснути</text>
<rect x="400.0" y="80.0" width="250.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="525.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">ЯДРО віддане</tspan><tspan x="525.0" dy="15.6">планувальнику</tspan></text>
<text x="525.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">працює ІНША задача</text>
<text x="525.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">наша спить, такти не горять</text>
<rect x="400.0" y="235.0" width="250.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="525.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">− вхід і вихід коштують</tspan><tspan x="525.0" dy="14.3">перемикання контексту</tspan></text>
<text x="360.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">коротке очікування виграє спінлок; довге — мʼютекс</text>
</svg>