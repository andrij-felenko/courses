<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спінлок: другий чекає, крутячись на місці</text>
<rect x="287.6" y="121.0" width="124.7" height="57.9" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="350.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">СПІЛЬНІ ДАНІ</tspan><tspan x="350.0" dy="16.9">(замок)</tspan></text>
<rect x="84.4" y="125.2" width="111.3" height="49.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="140.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Нитка A</tspan><tspan x="140.0" dy="15.6">тримає замок</tspan></text>
<line x1="195.6" y1="150.0" x2="287.6" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="140.0" y="196.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">працює з ресурсом</text>
<rect x="496.9" y="125.2" width="126.2" height="49.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Нитка B</tspan><tspan x="560.0" dy="15.6">прийшла другою</tspan></text>
<line x1="496.9" y1="150.0" x2="412.4" y2="150.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="454.6" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">зайнято</text>
<circle cx="560.0" cy="245.0" r="30.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<line x1="590.0" y1="239.0" x2="590.0" y2="253.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">вільно?</tspan><tspan x="560.0" dy="13.0">ні.</tspan></text>
<text x="560.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">крутиться, палить такти</text>
<text x="350.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">поки A працює, B не засинає — вона марно крутиться, чекаючи звільнення</text>
</svg>