<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">маятник поглядів: чим тримати порядок — гілками чи тестами</text>
<path d="M 110 156 A 300 300 0 0 1 710 156" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
<circle cx="410.0" cy="96.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<path d="M 230 271 A 250 250 0 0 1 590 271" fill="none" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="410.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">напрям зсуву з 2010-х →</text>
<rect x="30.0" y="189.0" width="240.0" height="96.0" rx="12" fill="#f1ecf8" stroke="#7a5ea8" stroke-width="2.0"/>
<text x="150.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5ea8" text-anchor="middle" font-weight="700">«гілки передбачають усе»</text>
<text x="150.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">git-flow: багато довгих гілок</text>
<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">порядок — ручна дисципліна</text>
<text x="150.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">версійний реліз, латки в полі</text>
<rect x="550.0" y="189.0" width="240.0" height="96.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">«менше гілок, більше тестів»</text>
<text x="670.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">trunk-based / GitHub Flow</text>
<text x="670.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">порядок — автотести на коміт</text>
<text x="670.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">безперервне викочування</text>
<text x="410.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">обидва полюси живі: вибір диктує не мода, а природа того, що випускаєш</text>
</svg>