<text x="410.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">новий коміт «на гілці» = ярлик перестрибнув на нього; самі файли нікуди не копіюються</text>
