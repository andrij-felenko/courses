<text x="150.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">← найпростіше, найшвидше</text>
<rect x="300.0" y="70.0" width="220.0" height="210.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">GitHub Flow</text>
<text x="410.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">main + короткі гілки</text>
<line x1="324.0" y1="130.0" x2="496.0" y2="130.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="322.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• гілка на задачу, з PR</text>
<text x="322.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• злив → одразу деплой</text>
<text x="322.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• веб і сервіси</text>
<text x="410.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">проста середина</text>
<rect x="560.0" y="70.0" width="220.0" height="210.0" rx="12" fill="#f1ecf8" stroke="#7a5ea8" stroke-width="2.0"/>
<text x="670.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7a5ea8" text-anchor="middle" font-weight="700">git-flow</text>
<text x="670.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">багато довгих гілок</text>
<line x1="584.0" y1="130.0" x2="756.0" y2="130.0" stroke="#7a5ea8" stroke-width="1.0"/>
<text x="582.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• develop, release, hotfix</text>
<text x="582.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• версійні релізи (v1.4.2)</text>
<text x="582.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• кілька версій у полі</text>
<text x="670.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a5ea8" text-anchor="middle" font-weight="700">найбільше порядку →</text>
