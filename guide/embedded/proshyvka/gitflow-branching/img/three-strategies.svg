<line x1="64.0" y1="130.0" x2="236.0" y2="130.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="62.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• усі ллють у trunk щодня</text>
