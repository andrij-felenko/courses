<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">три осі ризику — і пастка одного числа</text>
<rect x="28.0" y="70.0" width="244.0" height="92.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">S — Тяжкість</text>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">наскільки боляче,</text>
<text x="150.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">якщо станеться</text>
<text x="150.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">1…10</text>
<rect x="298.0" y="70.0" width="244.0" height="92.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="420.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">O — Імовірність</text>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">як часто</text>
<text x="420.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">з'являється причина</text>
<text x="420.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1…10</text>
<rect x="568.0" y="70.0" width="244.0" height="92.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="690.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">D — Виявність</text>
<text x="690.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чи спіймаємо ВЧАСНО</text>
<text x="690.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">(10 = майже ні)</text>
<text x="690.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">1…10</text>
<rect x="40.0" y="214.0" width="760.0" height="150.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="420.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">пастка: RPN = S · O · D зводить три осі в одне число</text>
<rect x="70.0" y="256.0" width="340.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="240.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">відмова гальм, рідкісна, невидима</text>
<text x="240.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">S=10 · O=2 · D=9</text>
<text x="240.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">RPN = 180</text>
<text x="240.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">уб'є з одного разу</text>
<rect x="430.0" y="256.0" width="340.0" height="92.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="600.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">косметичний дефект, частий</text>
<text x="600.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">S=3 · O=6 · D=10</text>
<text x="600.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">RPN = 180</text>
<text x="600.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">дрібниця, лиш дратує</text>
<text x="420.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">однаковий RPN — протилежна небезпека; тому тяжкість важать ПЕРШОЮ, а не множать наосліп</text>
</svg>