<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">мовчання &gt; 50 мс → прапор «давач дохлий»</text>
