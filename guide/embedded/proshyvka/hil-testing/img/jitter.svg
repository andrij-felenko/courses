<line x1="40.0" y1="340.0" x2="740.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="390.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один спізнілий такт із тисячі × 240 000 тактів за політ = сотні зривів.</text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Тому лінк оцінюють по НАЙГІРШІЙ затримці, не по середній —</text>
<text x="390.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">і Wi-Fi заборонений за хвіст, а не за швидкість.</text>
