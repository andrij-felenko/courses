<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві конструкції HIL: хто дає команду «крок»</text>
<rect x="40.0" y="56.0" width="200.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="140.0" y="75.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">ВІЛЬНИЙ ХІД</tspan></text>
<line x1="60.0" y1="130.0" x2="620.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">годинник ПЛАТИ (власний кварц) веде час:</text>
<line x1="120.0" y1="123.0" x2="120.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="240.0" y1="123.0" x2="240.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="360.0" y1="123.0" x2="360.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="480.0" y1="123.0" x2="480.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="600.0" y1="123.0" x2="600.0" y2="137.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="120.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">крок кожні 2500 мкс — байдуже, чи є свіжий вимір</text>
<circle cx="430.0" cy="104.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<text x="444.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">вимір спізнивсь → крок на СТАРОМУ; кварц дрейфує</text>
<text x="660.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">лінк і дрейф</text>
<text x="660.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ПСУЮТЬ правильність</text>
<line x1="40.0" y1="200.0" x2="760.0" y2="200.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="40.0" y="216.0" width="200.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="140.0" y="235.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">LOCKSTEP</tspan></text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">годинник МОДЕЛІ (мітка T) веде час; плата його позичає:</text>
<rect x="70.0" y="274.0" width="150.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="145.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">модель:</tspan><tspan x="145.0" dy="13.0">стан на час T</tspan><tspan x="145.0" dy="13.0">+ вимір {…, t=T}</tspan></text>
<line x1="224.0" y1="300.0" x2="264.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="244.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вимір</text>
<rect x="268.0" y="274.0" width="150.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="343.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="343.0" dy="0.0">плата: бере T</tspan><tspan x="343.0" dy="13.0">за «зараз»,</tspan><tspan x="343.0" dy="13.0">ОДИН крок</tspan></text>
<line x1="422.0" y1="300.0" x2="462.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="442.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тяга</text>
<rect x="466.0" y="274.0" width="160.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="546.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="546.0" dy="0.0">модель: інтегрує</tspan><tspan x="546.0" dy="13.0">фізику T → T+Δt</tspan></text>
<line x1="546.0" y1="326.0" x2="546.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="546.0" y1="344.0" x2="145.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="145.0" y1="344.0" x2="145.0" y2="328.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="345.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">T ← T + Δt   (модельний час стоїть, поки котрась сторона чекає)</text>
<text x="650.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">лінк і дрейф</text>
<text x="650.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">НЕ впливають</text>
<text x="650.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">на правильність</text>
<line x1="40.0" y1="392.0" x2="760.0" y2="392.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="400.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вільний хід зберігає СПРАВЖНІЙ тайминг (ловить гонки), та чутливий до лінка й дрейфу.</text>
<text x="400.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Lockstep імунний до лінка й дрейфу (один годинник), але РОЗМИВАЄ реальний тайминг і йде повільніше.</text>
</svg>