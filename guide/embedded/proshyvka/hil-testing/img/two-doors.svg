<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди підсунути виміри справжній платі — дві двері</text>
<rect x="60.0" y="80.0" width="300.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="210.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Електрична двері</tspan></text>
<rect x="60.0" y="124.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="210.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">модель → сигнал на РЕАЛЬНІ ніжки й шини</tspan><tspan x="210.0" dy="14.3">(SPI/I²C/АЦП), як зі справжнього давача</tspan></text>
<rect x="60.0" y="172.0" width="140.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="130.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">весь стек</tspan><tspan x="130.0" dy="15.6">драйверів</tspan><tspan x="130.0" dy="15.6">працює</tspan></text>
<rect x="220.0" y="172.0" width="140.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="290.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">потрібна</tspan><tspan x="290.0" dy="15.6">інтерфейсна</tspan><tspan x="290.0" dy="15.6">плата, важко</tspan></text>
<text x="210.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+ найчесніше: чіп нічого не підозрює</text>
<text x="210.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">− найдорожче: залізо, що вдає давачі</text>
<rect x="400.0" y="80.0" width="300.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="550.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Програмна двері (HIL-повідомлення)</tspan></text>
<rect x="400.0" y="124.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="550.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">модель → HIL-повідомлення по USB/UART;</tspan><tspan x="550.0" dy="14.3">у коді шов бере вимір звідти, не з драйвера</tspan></text>
<rect x="400.0" y="172.0" width="140.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="470.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">просто:</tspan><tspan x="470.0" dy="15.6">лише дріт</tspan><tspan x="470.0" dy="15.6">даних</tspan></text>
<rect x="560.0" y="172.0" width="140.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="630.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">драйвери</tspan><tspan x="630.0" dy="15.6">давачів</tspan><tspan x="630.0" dy="15.6">обійдено</tspan></text>
<text x="550.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+ дешево, лиш кабель даних</text>
<text x="550.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">− не перевіряє сам стек драйверів</text>
<line x1="40.0" y1="306.0" x2="720.0" y2="306.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Та сама межа «логіка / залізо» (шов HAL), що й у піраміді тестів —</text>
<text x="380.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лише тепер по один бік шва СПРАВЖНІЙ чіп, а не процес на ПК.</text>
<text x="380.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Чим правіше ставиш двері (ближче до ніжок) — тим реалістичніше й дорожче.</text>
</svg>