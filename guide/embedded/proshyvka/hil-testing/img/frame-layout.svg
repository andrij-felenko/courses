<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два кадри lockstep-обміну: що саме летить дротом</text>
<rect x="40.0" y="66.0" width="260.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="170.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Кадр ДАВАЧІВ  (модель → плата)</tspan></text>
