<rect x="500.0" y="104.0" width="74.0" height="56.0" rx="4" fill="#eaf6ff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="537.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC-16</text>
<text x="537.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б</text>
<text x="40.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">усього 42 байти — фіксована довжина, тому приймач точно знає межу кадру</text>
<rect x="40.0" y="210.0" width="260.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="170.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Кадр АКТУАТОРІВ  (плата → модель)</tspan></text>
<rect x="40.0" y="248.0" width="70.0" height="56.0" rx="4" fill="#eafcf3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="75.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SYNC</text>
<text x="75.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б: 0xB5 0x62</text>
<rect x="110.0" y="248.0" width="60.0" height="56.0" rx="4" fill="#eafcf3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="140.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">seq</text>
<text x="140.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б: ЕХО seq</text>
<rect x="170.0" y="248.0" width="90.0" height="56.0" rx="4" fill="#eafcf3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="215.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">t_us</text>
<text x="215.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4 Б: ехо часу</text>
<rect x="260.0" y="248.0" width="150.0" height="56.0" rx="4" fill="#eafcf3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="335.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">thr[0..3]</text>
<text x="335.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16 Б: 4×float</text>
<rect x="410.0" y="248.0" width="74.0" height="56.0" rx="4" fill="#eafcf3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="447.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC-16</text>
<text x="447.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 Б</text>
<text x="40.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">усього 26 байтів — seq і t_us вертаються ЕХОМ: модель бачить, на який саме вимір це відповідь</text>
<line x1="40.0" y1="350.0" x2="820.0" y2="350.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожне поле має роботу, і без жодного протокол ламається:</text>
<text x="430.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">SYNC — знайти початок у потоці байтів · seq — зловити втрату/дубль · t_us — вести модельний час</text>
<text x="430.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CRC-16 — відкинути спотворений кадр раніше, ніж він зіб'є оцінку положення.</text>
<text x="430.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Фіксована довжина + SYNC + CRC = кадр або приймається цілим і правильним, або відкидається — третього нема.</text>
</svg>