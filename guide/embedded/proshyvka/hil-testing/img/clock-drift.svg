<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув двох годинників росте лінійно з часом місії</text>
<line x1="90.0" y1="320.0" x2="710.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="712.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час місії, с</text>
<line x1="90.0" y1="320.0" x2="90.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="82.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">накопичений зсув</text>
<line x1="90.0" y1="320.0" x2="700.0" y2="78.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="456.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">нахил = |ε_відн| = 100 ppm</text>
<text x="456.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(±50 ppm плата + ±50 ppm ПК)</text>
