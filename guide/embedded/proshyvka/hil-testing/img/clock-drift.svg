<text x="395.0" y="283.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ресинхронізація: пилкоподібне скидання тримає зсув під тактом</text>
<line x1="40.0" y1="358.0" x2="740.0" y2="358.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="390.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два незалежні кварци розходяться зі швидкістю |ε_плати| + |ε_ПК| — вдвічі за найгірший поодинокий.</text>
<text x="390.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Прибрати розбіжність повністю вільний хід не може — доки годинників два (це й робить lockstep).</text>
