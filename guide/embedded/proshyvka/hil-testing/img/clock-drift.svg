<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -10 804 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-16" y="-10" width="804" height="430" fill="#ffffff"/>
