<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 832 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="832" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пів століття HIL: як несправжній світ дійшов до справжнього заліза й повернувся в чип</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="752.0" y1="120.0" x2="780.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="778.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">час</text>
<circle cx="120.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<text x="120.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1929</text>
<circle cx="300.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<text x="300.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1940–70-ті</text>
<circle cx="470.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="470.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1989</text>
<circle cx="600.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="600.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1992 →</text>
<circle cx="720.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="720.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">нині</text>
<rect x="60.0" y="146.0" width="130.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="125.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Тренажер Лінка:</tspan><tspan x="125.0" dy="11.7">модельований світ —</tspan><tspan x="125.0" dy="11.7">ЛЮДИНІ (пілоту).</tspan><tspan x="125.0" dy="11.7">Ще не залізо в петлі.</tspan></text>
<rect x="210.0" y="146.0" width="170.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="295.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Аналогові стійки й столи</tspan><tspan x="295.0" dy="13.0">руху: модельований світ —</tspan><tspan x="295.0" dy="13.0">СПРАВЖНЬОМУ залізу</tspan><tspan x="295.0" dy="13.0">(ракети, літаки, HiMAT).</tspan></text>
<rect x="398.0" y="146.0" width="150.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="473.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="473.0" dy="0.0">dSPACE: перший</tspan><tspan x="473.0" dy="13.0">HIL-симулятор в АВТО.</tspan><tspan x="473.0" dy="13.0">Реальний час стає</tspan><tspan x="473.0" dy="13.0">товаром із дедлайном.</tspan></text>
<rect x="556.0" y="146.0" width="130.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="621.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="621.0" dy="0.0">DO-178 (авіа),</tspan><tspan x="621.0" dy="13.0">ISO 26262 (авто):</tspan><tspan x="621.0" dy="13.0">стенд стає ЗАКОНОМ,</tspan><tspan x="621.0" dy="13.0">а не зручністю.</tspan></text>
<rect x="694.0" y="146.0" width="118.0" height="90.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="753.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">У дронах зовнішній</tspan><tspan x="753.0" dy="11.7">HIL відступає:</tspan><tspan x="753.0" dy="11.7">lockstep (PX4),</tspan><tspan x="753.0" dy="11.7">симуляція на залізі</tspan><tspan x="753.0" dy="11.7">(ArduPilot).</tspan></text>
<line x1="40.0" y1="350.0" x2="780.0" y2="350.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="410.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колесо оберталося умовою «чи тягне цільове залізо модель САМО»:</text>
<text x="410.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спершу НІ → модель виносили назовні (стійка, потім ПК);</text>
<text x="410.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тепер малий чип тягне модель сам → у дронах вона вертається ВСЕРЕДИНУ чипа.</text>
<text x="410.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">У великій техніці модель усе ще надто важка — там повний електричний HIL непорушний і обов'язковий.</text>
</svg>