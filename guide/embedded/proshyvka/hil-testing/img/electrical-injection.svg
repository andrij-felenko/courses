<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електрична інжекція — чотири прийоми за типом давача</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">інтерфейсна плата завжди АКТИВНА: точніша й швидша за той пристрій, який удає</text>
<rect x="30.0" y="80.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="115.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">SPI / I²C</tspan><tspan x="115.0" dy="15.6">(давач ведений)</tspan></text>
<rect x="30.0" y="134.0" width="170.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="115.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">інтерфейс = SLAVE:</tspan><tspan x="115.0" dy="13.0">ловить такт майстра-DUT,</tspan><tspan x="115.0" dy="13.0">вчасно віддає байти</tspan><tspan x="115.0" dy="13.0">(мікросекундний дедлайн)</tspan></text>
<rect x="30.0" y="264.0" width="170.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="115.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">найскладніше:</tspan><tspan x="115.0" dy="13.0">свій МК/FPGA</tspan></text>
<rect x="230.0" y="80.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="315.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Аналог через АЦП</tspan></text>
<rect x="230.0" y="134.0" width="170.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="315.0" y="171.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">інтерфейс = ЦАП:</tspan><tspan x="315.0" dy="13.0">виставляє напругу на вхід.</tspan><tspan x="315.0" dy="13.0">Крок ЦАП мусить бути</tspan><tspan x="315.0" dy="13.0">ДРІБНІШИЙ за молодший</tspan><tspan x="315.0" dy="13.0">біт АЦП DUT</tspan></text>
<rect x="230.0" y="264.0" width="170.0" height="40.0" rx="6" fill="#fdf4e6" stroke="#27ae60" stroke-width="1.4"/><text x="315.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">13-біт ЦАП</tspan><tspan x="315.0" dy="13.0">для 12-біт АЦП</tspan></text>
<rect x="430.0" y="80.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="515.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">UART-GPS</tspan><tspan x="515.0" dy="15.6">(давач сам шле)</tspan></text>
<rect x="430.0" y="134.0" width="170.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="515.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">інтерфейс генерує кадри</tspan><tspan x="515.0" dy="11.7">(NMEA/двійкові) з модельними</tspan><tspan x="515.0" dy="11.7">координатами за розкладом</tspan><tspan x="515.0" dy="11.7">справжнього приймача</tspan></text>
<rect x="430.0" y="264.0" width="170.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="515.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">найлегше:</tspan><tspan x="515.0" dy="13.0">такт ловити не треба</tspan></text>
<rect x="630.0" y="80.0" width="170.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="715.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Керована периферія</tspan><tspan x="715.0" dy="15.6">(DUT сам веде)</tspan></text>
<rect x="630.0" y="134.0" width="170.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="715.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">інтерфейс = приймач:</tspan><tspan x="715.0" dy="13.0">ловить команди DUT як</tspan><tspan x="715.0" dy="13.0">виконавчий пристрій</tspan><tspan x="715.0" dy="13.0">і рапортує моделі</tspan></text>
<rect x="630.0" y="264.0" width="170.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="715.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">дзеркало</tspan><tspan x="715.0" dy="13.0">actuator readback</tspan></text>
<line x1="40.0" y1="336.0" x2="780.0" y2="336.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="410.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ось чому електрична двері дорога: інтерфейсна плата — це НАБІР емуляторів давачів,</text>
<text x="410.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожен зі своїм контролером, кожен точніший і швидший за оригінал, кожен під конкретну модель.</text>
<text x="410.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Правило спільне з ЦАП і зі зчитувачем ШІМ: хто дурить пристрій — мусить бути точнішим за нього.</text>
</svg>