<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різниця з SITL: там у петлі лише КОД (процес на ПК).</text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Тут справжні КОД і ПЛАТА — модель лише навколо. Заліза не прибрано, прибрано тільки світ.</text>
