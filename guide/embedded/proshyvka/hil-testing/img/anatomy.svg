<rect x="330.0" y="232.0" width="100.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="380.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">інтерфейс</tspan><tspan x="380.0" dy="10.4">(дроти, шини, АЦП/ЦАП)</tspan></text>
