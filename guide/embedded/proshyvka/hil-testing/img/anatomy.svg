<text x="180.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">У ПЕТЛІ — СПРАВЖНЄ</text>
