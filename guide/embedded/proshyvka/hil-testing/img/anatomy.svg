<text x="580.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">МОДЕЛЬ</text>
<line x1="500.0" y1="128.0" x2="262.0" y2="128.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
