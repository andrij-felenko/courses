<text x="336.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">стеля Flash — 256 КБ</text>
<text x="336.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Flash = .text + .data</text>
<text x="336.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">208 КБ ✓ під стелею</text>
<rect x="560.0" y="208.1" width="96.0" height="91.9" rx="0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.2"/><text x="608.0" y="258.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">.data 28</text>
<rect x="560.0" y="76.9" width="96.0" height="131.2" rx="0" fill="#8a6d1a" stroke="#1a1a1a" stroke-width="1.2"/><text x="608.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">.bss 40</text>
<rect x="556.0" y="90.0" width="104.0" height="210.0" rx="0" fill="none" stroke="#c0392b" stroke-width="1.4"/>
<line x1="550.0" y1="90.0" x2="666.0" y2="90.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="608.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">стеля RAM — 64 КБ</text>
<rect x="560.0" y="76.9" width="96.0" height="13.1" rx="0" fill="none" stroke="#c0392b" stroke-width="3.0"/>
<text x="668.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">+4 КБ</text>
<text x="608.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RAM = .data + .bss</text>
<text x="608.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">68 КБ ✗ пробила стелю</text>
<text x="410.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">.data лежить у Flash (початкові значення) і копіюється в RAM — тому рахується в обидва бюджети</text>
<text x="410.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">розмір розповзається тихо, за байтом на коміт; стеля ловить пробій там, де живої плати ще нема</text>
</svg>