<text x="72.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">змінні, обнулені</text>
<rect x="288.0" y="152.3" width="96.0" height="147.7" rx="0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/><text x="336.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">.text 180</text>
