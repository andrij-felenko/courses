<text x="360.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">будь-яка невдача — сюди</text>
<line x1="399.8" y1="196.0" x2="460.0" y2="292.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">звільняємо лише те, що встигли взяти, і в зворотному порядку — з одного, спільного виходу</text>
