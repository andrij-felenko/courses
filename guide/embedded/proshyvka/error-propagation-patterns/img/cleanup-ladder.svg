<rect x="320.2" y="180.0" width="79.5" height="32.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">cleanup:</tspan></text>
