<line x1="165.0" y1="184.0" x2="165.0" y2="208.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70.0" y="208.0" width="190.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="231.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">f = fopen()</tspan></text>
<line x1="165.0" y1="248.0" x2="165.0" y2="272.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70.0" y="272.0" width="190.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">// робота з усім</tspan></text>
<text x="165.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">захоплення — по черзі</text>
<rect x="460.0" y="272.0" width="190.0" height="40.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">fclose(f)</tspan></text>
<rect x="460.0" y="208.0" width="190.0" height="40.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="231.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">free(buf)</tspan></text>
<rect x="460.0" y="144.0" width="190.0" height="40.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">close(port)</tspan></text>
<rect x="460.0" y="80.0" width="190.0" height="40.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">return ret;</tspan></text>
<text x="555.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">звільнення — у зворотному порядку</text>
