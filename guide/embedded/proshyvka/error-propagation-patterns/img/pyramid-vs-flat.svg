<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піраміда вкладень проти ранніх повернень</text>
<text x="190.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Піраміда: перевіряємо успіх</text>
<text x="550.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сторожі: виходимо на невдачі</text>
<rect x="40.0" y="76.0" width="250.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="165.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">if open() == OK {</tspan></text>
<rect x="58.0" y="118.0" width="232.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="174.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="174.0" dy="0.0">  if read() == OK {</tspan></text>
<rect x="76.0" y="160.0" width="214.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="183.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">    if check() == OK {</tspan></text>
<rect x="94.0" y="202.0" width="196.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="192.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="192.0" dy="0.0">      робота;</tspan></text>
<text x="46.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="46.0" dy="0.0">корисна дія — найглибше праворуч;</tspan><tspan x="46.0" dy="13.0">кожна гілка else ще нижче</tspan></text>
<rect x="400.0" y="76.0" width="250.0" height="34.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.4"/><text x="525.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">if open()  != OK return err;</tspan></text>
<rect x="400.0" y="118.0" width="250.0" height="34.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.4"/><text x="525.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">if read()  != OK return err;</tspan></text>
<rect x="400.0" y="160.0" width="250.0" height="34.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.4"/><text x="525.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">if check() != OK return err;</tspan></text>
<rect x="400.0" y="202.0" width="250.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="525.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">робота;  // лишилась тут, зліва</tspan></text>
<text x="406.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="406.0" dy="0.0">невдача — і одразу геть;</tspan><tspan x="406.0" dy="13.0">щасливий шлях рівний, без сходів</tspan></text>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">та сама логіка: ліворуч вкладеність росте з кожною перевіркою, праворуч лишається пласкою</text>
</svg>