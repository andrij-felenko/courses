<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRP: один модуль — одна причина переписувати його</text>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">один модуль — три причини</text>
<rect x="125.0" y="210.0" width="170.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">sensor_task()</text>
<text x="210.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">читає + логує + шле</text>
<circle cx="80.0" cy="92.0" r="7.0" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="80.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">змінився протокол давача</text>
<line x1="80.0" y1="99.0" x2="143.0" y2="210.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="340.0" cy="92.0" r="7.0" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="340.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">змінився формат логу</text>
<line x1="340.0" y1="99.0" x2="277.0" y2="210.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="210.0" cy="110.0" r="7.0" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">змінився пакет по радіо</text>
<line x1="210.0" y1="117.0" x2="210.0" y2="210.0" stroke="#caa24a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">правка для одного</text>
<text x="210.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ризикує зламати інших</text>
<line x1="410.0" y1="50.0" x2="410.0" y2="360.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">три шматки — по одній</text>
<rect x="480.0" y="96.0" width="220.0" height="56.0" rx="9" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="590.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">sensor_read()</text>
<text x="590.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">причина: протокол давача</text>
<rect x="480.0" y="174.0" width="220.0" height="56.0" rx="9" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="590.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">log_format()</text>
<text x="590.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">причина: формат логу</text>
<rect x="480.0" y="252.0" width="220.0" height="56.0" rx="9" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="590.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">radio_pack()</text>
<text x="590.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">причина: пакет по радіо</text>
<text x="590.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">правка не виходить за свій шматок</text>
<text x="410.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«одна причина змінитися» = один замовник змін на модуль</text>
</svg>