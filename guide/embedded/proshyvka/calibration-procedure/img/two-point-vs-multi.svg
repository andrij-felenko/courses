<text x="380.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дві точки фіксують лише кінці — у середині лишається горб; більше опор (або підгонка кривою) тулять</text>
