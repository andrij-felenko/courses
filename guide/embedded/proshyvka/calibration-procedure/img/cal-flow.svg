<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процедура калібрування: від опорного еталона до коефіцієнтів у польоті</text>
<rect x="35.0" y="113.0" width="120.0" height="73.9" rx="6" fill="#fff8e1" stroke="#c79100" stroke-width="2.0"/><text x="95.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Умови:</tspan><tspan x="95.0" dy="14.3">температура,</tspan><tspan x="95.0" dy="14.3">живлення,</tspan><tspan x="95.0" dy="14.3">прогрів</tspan></text>
<rect x="210.0" y="120.2" width="120.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="270.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Подати відомий</tspan><tspan x="270.0" dy="14.3">еталон</tspan><tspan x="270.0" dy="14.3">(low і high)</tspan></text>
<rect x="384.8" y="120.2" width="120.3" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="445.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Зняти сирий код,</tspan><tspan x="445.0" dy="14.3">усереднити</tspan><tspan x="445.0" dy="14.3">N відліків</tspan></text>
<rect x="560.0" y="120.2" width="120.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="620.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Розв'язати</tspan><tspan x="620.0" dy="14.3">k і b</tspan><tspan x="620.0" dy="14.3">(або таблицю)</tspan></text>
<rect x="730.0" y="120.2" width="120.0" height="59.6" rx="6" fill="#e8eaf6" stroke="#2457d6" stroke-width="2.0"/><text x="790.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Записати</tspan><tspan x="790.0" dy="14.3">коефіцієнти</tspan><tspan x="790.0" dy="14.3">в NVS/EEPROM</tspan></text>
<line x1="155.0" y1="150.0" x2="210.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="150.0" x2="384.8" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="505.2" y1="150.0" x2="560.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="150.0" x2="730.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="30.0" y1="84.0" x2="710.0" y2="84.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="370.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">← один раз: на стенді / на виробництві →</text>
<line x1="790.0" y1="194.0" x2="790.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="253.1" width="180.0" height="73.9" rx="6" fill="#e8eaf6" stroke="#2457d6" stroke-width="2.0"/><text x="790.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">У кожному читанні:</tspan><tspan x="790.0" dy="14.3">сирий код → формула</tspan><tspan x="790.0" dy="14.3">→ величина у фіз.</tspan><tspan x="790.0" dy="14.3">одиницях</tspan></text>
<line x1="30.0" y1="250.0" x2="880.0" y2="250.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="200.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">↓ щоразу в роботі (рантайм) ↓</text>
<rect x="660.0" y="330.0" width="230.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="775.0" y="354.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="775.0" dy="0.0">value = (raw − b) / k</tspan><tspan x="775.0" dy="15.6">або інтерполяція таблиці</tspan></text>
<rect x="40.0" y="290.0" width="300.0" height="96.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">Калібрування = ЗМІРЯТИ похибку</tspan><tspan x="190.0" dy="14.3">відносно еталона.</tspan><tspan x="190.0" dy="14.3">Застосування корекції = окремий крок</tspan><tspan x="190.0" dy="14.3">(adjustment). Еталон має бути</tspan><tspan x="190.0" dy="14.3">точнішим за давач.</tspan></text>
</svg>