<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що під addr2line</text>
<rect x="305.4" y="52.0" width="109.3" height="36.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="2.0"/><text x="360.0" y="75.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">addr2line</tspan></text>
<line x1="360.0" y1="88.0" x2="360.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«дай символи й рядки»</text>
<rect x="150.0" y="122.0" width="420.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">BFD — бібліотека-абстракція форматів</text>
<text x="360.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">єдиний інтерфейс понад усіма форматами</text>
<line x1="360.0" y1="174.0" x2="153.0" y2="214.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="93.0" y="214.0" width="120.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="153.0" y="236.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ELF</text>
<text x="153.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">у ньому DWARF</text>
<line x1="360.0" y1="174.0" x2="291.0" y2="214.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="231.0" y="214.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/>
<text x="291.0" y="236.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">COFF</text>
<text x="291.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">інший формат</text>
<line x1="360.0" y1="174.0" x2="429.0" y2="214.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="369.0" y="214.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/>
<text x="429.0" y="236.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">a.out</text>
<text x="429.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">інший формат</text>
<line x1="360.0" y1="174.0" x2="567.0" y2="214.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="507.0" y="214.0" width="120.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/>
<text x="567.0" y="236.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">PE</text>
<text x="567.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">інший формат</text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">addr2line не читає формати сам — за нього це робить BFD; усередині ELF лежить DWARF.</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Тому той самий код обслуговує і ESP32, і чужу архітектуру — різницю проковтнула бібліотека.</text>
</svg>