<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр Remote Serial Protocol: $дані#контрольна-сума</text>
<rect x="60.0" y="90.0" width="34.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="77.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">$</text>
<rect x="94.0" y="90.0" width="200.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="194.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">m400d2010,4</text>
<rect x="294.0" y="90.0" width="34.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="311.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">#</text>
<rect x="328.0" y="90.0" width="56.0" height="52.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="356.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">a7</text>
<text x="77.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">старт</text>
<text x="194.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">команда + аргументи</text>
<text x="311.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кінець</text>
<text x="356.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">контр. сума</text>
<text x="60.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">приклад: m400d2010,4 — «прочитай 4 байти з адреси 0x400d2010»</text>
<text x="60.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">сервер відповідає '+' (кадр прийнято), тоді $&lt;байти&gt;#&lt;кс&gt;</text>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">кс = сума байтів даних mod 256 — простий текст по TCP</text>
<rect x="129.7" y="254.5" width="500.5" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="380.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="380.0" dy="0.0">Той самий протокол слухають OpenOCD, J-Link GDB Server, QEMU — GDB однаковий</tspan></text>
</svg>