<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="372" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один прийом, дві архітектури: що істотне, а що деталь ядра</text>
<rect x="30.0" y="52.0" width="372.0" height="300.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="216.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Xtensa (ESP32)</text>
<text x="216.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">адреса повернення</text>
<rect x="46.0" y="108.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="216.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">у вікнах регістрів →</tspan><tspan x="216.0" dy="13.0">треба WINDOWBASE/WINDOWSTART/PS</tspan></text>
<text x="216.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">клас і адреса помилки</text>
<rect x="46.0" y="166.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="216.0" y="186.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">EXCCAUSE (клас)  ·  EXCVADDR (адреса)</tspan></text>
<text x="216.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">хто робить дамп</text>
<rect x="46.0" y="224.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="216.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">ESP-IDF: обхід задач, запис у Flash, ELF —</tspan><tspan x="216.0" dy="13.0">відкриває GDB готовим</tspan></text>
<text x="216.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">розмотування</text>
<rect x="46.0" y="282.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="216.0" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">крихке: вікна + маскування CALLINC</tspan></text>
<rect x="418.0" y="52.0" width="372.0" height="300.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2.0"/>
<text x="604.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">ARM Cortex-M</text>
<text x="604.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">адреса повернення</text>
<rect x="434.0" y="108.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="604.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="604.0" dy="0.0">у стеку (LR збережено в пам'ять) →</tspan><tspan x="604.0" dy="13.0">ланцюг увесь у пам'яті</tspan></text>
<text x="604.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">клас і адреса помилки</text>
<rect x="434.0" y="166.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="604.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="604.0" dy="0.0">CFSR (клас)  ·  BFAR/MMFAR (адреса,</tspan><tspan x="604.0" dy="13.0">дійсна лише за бітом BFARVALID)</tspan></text>
<text x="604.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">хто робить дамп</text>
<rect x="434.0" y="224.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="604.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="604.0" dy="0.0">готового немає: HardFault_Handler</tspan><tspan x="604.0" dy="13.0">пишеш сам, зберігаєш у .noinit-RAM</tspan></text>
<text x="604.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">розмотування</text>
<rect x="434.0" y="282.0" width="340.0" height="34.0" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="604.0" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="604.0" dy="0.0">простіше: увесь ланцюг у стеку</tspan></text>
<text x="410.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">та сама абстракція — заморозити стан у мить смерті</text>
</svg>