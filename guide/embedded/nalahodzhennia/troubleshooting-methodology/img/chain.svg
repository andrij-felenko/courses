<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="356" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук несправності — ланцюг, пройдений назад</text>
<rect x="35.0" y="111.0" width="150.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Несправність</text>
<text x="110.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="110.0" dy="0.0">першопричина:</tspan><tspan x="110.0" dy="12.6">біт, дріт, рядок</tspan></text>
<rect x="285.0" y="111.0" width="150.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#b26a00" stroke-width="2.0"/>
<text x="360.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b26a00" text-anchor="middle" font-weight="700">Помилка</text>
<text x="360.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">стан став</tspan><tspan x="360.0" dy="12.6">хибним</tspan></text>
<rect x="535.0" y="111.0" width="150.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="610.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Відмова</text>
<text x="610.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">видима</tspan><tspan x="610.0" dy="12.6">дурня</tspan></text>
<line x1="185.0" y1="126.0" x2="285.0" y2="126.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="435.0" y1="126.0" x2="535.0" y2="126.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="235.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">визріває →</text>
<text x="485.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">визріває →</text>
<line x1="535.0" y1="206.0" x2="185.0" y2="206.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">пошук іде назад: від видимого до схованого</text>
<text x="610.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">◀ це на руках</text>
<text x="110.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">це шукаємо ▶</text>
<line x1="610.0" y1="189.0" x2="150.0" y2="267.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="400.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">наївний стрибок навмання → майже завжди в привида</text>
</svg>