<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">UART через міст проти вбудованого USB CDC</text>
<text x="60.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">UART: окремий міст, вузько — зате живе завжди</text>
<rect x="60.0" y="76.0" width="130.0" height="58.0" rx="6" fill="#1f1f1f" stroke="#27ae60" stroke-width="1.5"/>
<text x="125.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">чіп</text>
<text x="125.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7fd49a" text-anchor="middle">2 піни TX/RX</text>
<line x1="190.0" y1="105.0" x2="236.0" y2="105.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="236.0" y="76.0" width="110.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
<text x="291.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB↔UART</text>
<text x="291.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">міст</text>
<line x1="346.0" y1="105.0" x2="392.0" y2="105.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="392.0" y="84.0" width="92.0" height="42.0" rx="6" fill="#0c1c34" stroke="#27ae60" stroke-width="1.5"/>
<text x="438.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9db8f0" text-anchor="middle" font-weight="700">ПК</text>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">~11 КБ/с</text>
<text x="560.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">живий у аварії</text>
<text x="60.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">USB CDC: ширше й без моста — та вмирає зі стеком</text>
<rect x="60.0" y="200.0" width="180.0" height="64.0" rx="6" fill="#1f1f1f" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">чіп з вбудованим USB</text>
<rect x="76.0" y="232.0" width="148.0" height="24.0" rx="6" fill="#2a1414" stroke="#c0392b" stroke-width="1.1"/>
<text x="150.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e6a6a0" text-anchor="middle">USB-стек має піднятися</text>
<line x1="240.0" y1="232.0" x2="392.0" y2="232.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="316.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">один USB-кабель</text>
<rect x="392.0" y="210.0" width="92.0" height="44.0" rx="6" fill="#0c1c34" stroke="#c0392b" stroke-width="1.5"/>
<text x="438.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9db8f0" text-anchor="middle" font-weight="700">ПК</text>
<text x="560.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">МБ/с</text>
<text x="560.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">впав чіп — порт зник</text>
<text x="350.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">будні — USB (швидко, без моста); аварія й старт — лиши собі UART</text>
</svg>