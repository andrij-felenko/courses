<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок лічильника кулонів: ланцюг одиниць і два краї</text>
<rect x="50.0" y="60.0" width="400.0" height="40.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">code (0..4095)</tspan></text>
<text x="460.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">код АЦП</text>
<line x1="250.0" y1="100.0" x2="250.0" y2="114.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="114.0" width="400.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="250.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">V_adc [мкВ] = code·Vref/4095</tspan></text>
<text x="460.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">напруга на вході АЦП</text>
<line x1="250.0" y1="154.0" x2="250.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="168.0" width="400.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="250.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">V_shunt [нВ] = V_adc·1000 / GAIN</tspan></text>
<text x="460.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">спад на шунті (÷ підсилення CSA)</text>
<line x1="250.0" y1="208.0" x2="250.0" y2="222.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="222.0" width="400.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">I [нА] = V_shunt·1000 / R_мОм</tspan></text>
<text x="453.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">струм (закон Ома на шунті)</text>
<line x1="250.0" y1="262.0" x2="250.0" y2="276.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="276.0" width="400.0" height="40.0" rx="6" fill="#fff7e6" stroke="#c08000" stroke-width="1.8"/><text x="250.0" y="300.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">I -= offset_nA</tspan></text>
<text x="460.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">віднімання зсуву (калібр. нуля)</text>
<line x1="250.0" y1="316.0" x2="250.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="330.0" width="400.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">dQ [пКл] = I·Δt / 1000</tspan></text>
<text x="453.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">заряд за крок (сума Рімана)</text>
<line x1="250.0" y1="370.0" x2="250.0" y2="384.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="384.0" width="400.0" height="40.0" rx="6" fill="#e8eaf6" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">charge_pC += dQ   (int64)</tspan></text>
<text x="460.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">накопичення в 64-бітному лічильнику</text>
<rect x="560.0" y="216.0" width="250.0" height="96.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="685.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">КРАЙ 1 — дно</text>
<text x="685.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мкА за крок у грубих одиницях</text>
<text x="685.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(мА·год) округлюються в 0 →</text>
<text x="685.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">за годину сну назбирається НУЛЬ.</text>
<text x="685.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ліки: копити в пКл (дрібно).</text>
<rect x="560.0" y="324.0" width="250.0" height="96.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="685.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">КРАЙ 2 — стеля</text>
<text x="685.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V_adc·1000 ≈ 3.3·10⁹ &gt;</text>
<text x="685.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">INT32_MAX 2.1·10⁹ → переповнення</text>
<text x="685.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тихо псує проміжний добуток.</text>
<text x="685.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ліки: множ у int64, копи в int64.</text>
<text x="410.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дрібні одиниці (пКл) рятують дно; 64-бітні проміжки й лічильник рятують стелю</text>
</svg>