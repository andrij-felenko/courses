<line x1="116.0" y1="150.0" x2="168.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="150.0" x2="316.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="30.0" y1="210.0" x2="375.0" y2="210.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">спільна GND</text>
<circle cx="135.0" cy="140.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="135.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="135.0" cy="210.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="135.0" y="213.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="200.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Прилад — послідовно у розрив плюса.</text>
<text x="200.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Своє живлення — окремий USB до ПК.</text>
<rect x="420.0" y="50.0" width="390.0" height="268.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="615.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">source-meter mode</text>
<text x="615.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(прилад сам живить DUT)</text>
<rect x="512.0" y="132.0" width="116.0" height="60.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/><text x="570.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Профілювальник</tspan><tspan x="570.0" dy="14.3">3.3 В / source</tspan><tspan x="570.0" dy="14.3">+ вимір I</tspan></text>
<rect x="732.0" y="140.0" width="38.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="751.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="751.0" dy="0.0">DUT</tspan><tspan x="751.0" dy="14.3">VDD</tspan></text>
<line x1="632.0" y1="150.0" x2="726.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="210.0" x2="795.0" y2="210.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="615.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">спільна GND</text>
<line x1="570.0" y1="124.0" x2="570.0" y2="100.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="615.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">один USB до ПК: і джерело, і вимір</text>
<text x="615.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Один кабель — і живлення, і захоплення.</text>
<rect x="10.0" y="332.0" width="800.0" height="58.0" rx="7" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="410.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">НЕ вмикати в розрив після USB-роз'єму DevKit — USB-UART міст і LDO домішують своє споживання</text>
<text x="410.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вмикати в розрив батарейного живлення або в jumper розриву струму</text>
</svg>