<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два режими ввімкнення профілювальника</text>
<rect x="10.0" y="50.0" width="380.0" height="268.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ampere-meter mode</text>
<text x="200.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(розрив плюсового проводу)</text>
<rect x="40.0" y="140.0" width="72.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="76.0" y="158.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="76.0" dy="0.0">Джерело</tspan><tspan x="76.0" dy="15.6">живлення</tspan></text>
<rect x="174.0" y="132.0" width="72.0" height="60.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/><text x="210.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Профіль-</tspan><tspan x="210.0" dy="14.3">щик</tspan><tspan x="210.0" dy="14.3">IN+→OUT+</tspan></text>
