<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна ідея — два способи: маса й пружина проти активного контуру</text>
<rect x="40.0" y="70.0" width="350.0" height="230.0" rx="6" fill="#f7faf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="215.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Стедікам (1975): пасивно</text>
<rect x="65.0" y="110.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">велика рознесена МАСА → інерція не дає камері крутитись</tspan></text>
<rect x="65.0" y="152.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="172.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">ПРУЖИНА (плече) → несе вагу, гасить кроки</tspan></text>
<rect x="65.0" y="194.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">КАРДАН → розв'язує камеру від руки</tspan></text>
<text x="215.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ні живлення, ні гіроскопа, ні коду</text>
<text x="215.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ціна: вага й тренована рука оператора</text>
<rect x="470.0" y="70.0" width="350.0" height="230.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<text x="645.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Безколекторний підвіс (~2012): активно</text>
<rect x="495.0" y="110.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">IMU на камері → міряє кут у реальному часі</tspan></text>
<rect x="495.0" y="152.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="172.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">контролер (ПІД) → рахує, куди й наскільки</tspan></text>
<rect x="495.0" y="194.0" width="300.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="645.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">мотор ПРЯМОГО ПРИВОДУ → відкручує назустріч</tspan></text>
<text x="645.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">масу й пружину замінив контур керування</text>
<text x="645.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ціна: живлення моторів і точне налаштування</text>
<line x1="390.0" y1="185.0" x2="470.0" y2="185.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="430.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">та сама</text>
<text x="430.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">мета</text>
<text x="430.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">мета незмінна — камера нерухома, поки тіло рухається; змінився лише спосіб її тримати</text>
</svg>