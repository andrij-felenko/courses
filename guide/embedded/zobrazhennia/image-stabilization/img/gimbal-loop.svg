<circle cx="643.0" cy="126.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="643.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
