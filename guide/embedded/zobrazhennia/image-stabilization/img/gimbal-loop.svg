<line x1="652.0" y1="126.0" x2="666.0" y2="126.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="733.0" y1="150.0" x2="733.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="666.0" y="192.0" width="134.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="733.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="733.0" dy="0.0">мотор крену</tspan></text>
<line x1="666.0" y1="215.0" x2="618.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="192.0" width="148.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="544.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="544.0" dy="0.0">кут камери</tspan><tspan x="544.0" dy="14.3">(з її IMU)</tspan></text>
<line x1="544.0" y1="192.0" x2="544.0" y2="162.0" stroke="#333333" stroke-width="1.5"/>
<line x1="544.0" y1="162.0" x2="643.0" y2="162.0" stroke="#333333" stroke-width="1.5"/>
<line x1="643.0" y1="162.0" x2="643.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="635.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">збурення — кидок рами; керована величина — кут камери</text>
<text x="420.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">IMU сидить на КАМЕРІ, не на рамі: контур міряє й виправляє саме той бік, що знімає</text>
</svg>