<text x="175.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">мотор крену докрутив камеру ←</text>
<rect x="129.0" y="144.0" width="92.0" height="44.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="205.0" cy="166.0" r="11.0" fill="#fff" stroke="#27ae60" stroke-width="2.0"/>
<text x="159.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">камера</text>
<text x="175.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">рівна</text>
<rect x="131.0" y="148.0" width="18.0" height="12.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="140.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">IMU на камері</text>
<text x="635.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур, що це робить</text>
