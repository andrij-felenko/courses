<text x="605.2" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лют. 2004</text>
<text x="605.2" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c96a1b" text-anchor="middle" font-weight="700">39 компаній</text>
<rect x="498.2" y="174.0" width="214.0" height="70.0" rx="6" fill="#fbfcfe" stroke="#c96a1b" stroke-width="1.4"/><text x="605.2" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.2" dy="0.0">+Intel, Motorola в раду;</tspan><tspan x="605.2" dy="13.7">Samsung, Philips, Nvidia…</tspan><tspan x="605.2" dy="13.7">консенсус галузі</tspan></text>
