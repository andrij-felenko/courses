<text x="130.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кін. 2002</text>
<text x="130.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">OMAPI</text>
<rect x="23.0" y="174.0" width="214.0" height="70.0" rx="6" fill="#fbfcfe" stroke="#6b7280" stroke-width="1.4"/><text x="130.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ST + TI: перше зерно —</tspan><tspan x="130.0" dy="13.7">один інтерфейс до</tspan><tspan x="130.0" dy="13.7">процесора застосунків</tspan></text>
