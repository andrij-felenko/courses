<text x="367.6" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лип. 2003</text>
<text x="367.6" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">MIPI Alliance</text>
<rect x="260.6" y="174.0" width="214.0" height="70.0" rx="6" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.4"/><text x="367.6" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="367.6" dy="0.0">засновники: ST · TI ·</tspan><tspan x="367.6" dy="13.7">ARM · Nokia —</tspan><tspan x="367.6" dy="13.7">весь ланцюг за столом</tspan></text>
