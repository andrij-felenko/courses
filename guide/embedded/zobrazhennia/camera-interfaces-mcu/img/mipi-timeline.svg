<text x="850.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">CSI-2 v1.0</text>
<rect x="743.0" y="174.0" width="214.0" height="70.0" rx="6" fill="#fbfcfe" stroke="#27ae60" stroke-width="1.4"/><text x="850.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">камерна шина народилась —</tspan><tspan x="850.0" dy="13.7">багатошарова, поверх</tspan><tspan x="850.0" dy="13.7">фізичного D-PHY</tspan></text>
<rect x="130.0" y="386.0" width="720.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f7a46" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">рушій — не швидкість, а втома від фрагментації: спільна цегла однакового розміру вигідна всім</tspan></text>
