<rect x="60.0" y="498.0" width="860.0" height="46.0" rx="6" fill="#fbfcfe" stroke="#6b7280" stroke-width="1.4"/><text x="490.0" y="517.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">лінія спить у LP → сигнал SoT (старт) → спалах HS з пікселями → сигнал EoT (кінець) → знову LP.</tspan><tspan x="490.0" dy="15.0">Увімкнув, вистрілив, вимкнув — тому камера не гріється й не з'їдає батарею в спокої.</tspan></text>
