<text x="490.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">підсумок: зоопарк звівся не до одного, а до ДВОХ — DASH для всіх + HLS для Apple-світу</text>
