<text x="480.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">що менша затримка, то ближче «точка-точка»; що більше охоплення, то товщі буфери й сегменти</text>
