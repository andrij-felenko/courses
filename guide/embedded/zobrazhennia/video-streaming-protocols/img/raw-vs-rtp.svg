<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Голий UDP проти RTP: дві речі, що роблять потік</text>
<text x="470.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">UDP сам по собі: лише шматок байтів</text>
<rect x="120.0" y="88.0" width="150.0" height="52.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="195.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UDP-заголовок</text>
<rect x="270.0" y="88.0" width="550.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="545.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">шматок стисненого відео (байти)</text>
<text x="470.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приймач питає: котрий це шматок? раніше чи пізніше? коли показати? — невідомо</text>
<line x1="470.0" y1="184.0" x2="470.0" y2="218.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="482.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">RTP додає підпис над байтами</text>
<text x="470.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">RTP поверх UDP: номер + мітка часу + тип</text>
<rect x="120.0" y="252.0" width="90.0" height="56.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="165.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">UDP</tspan></text>
<rect x="210.0" y="252.0" width="120.0" height="56.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="270.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">SEQ</tspan><tspan x="270.0" dy="13.7">№ пакета</tspan></text>
<rect x="330.0" y="252.0" width="150.0" height="56.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="405.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">TIMESTAMP</tspan><tspan x="405.0" dy="13.7">коли показати</tspan></text>
<rect x="480.0" y="252.0" width="80.0" height="56.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="520.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">PT</tspan><tspan x="520.0" dy="13.7">кодек</tspan></text>
<rect x="560.0" y="252.0" width="260.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="690.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">той самий шматок відео</text>
<text x="470.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">номер → відновити порядок і помітити втрату · мітка часу → показати кадр у свій момент</text>
</svg>