<rect x="40.0" y="502.0" width="780.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="430.0" y="521.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">ECDHE входить РІВНО РАЗ (щабель 2). Довгостроковий ключ сервера в дерево НЕ вливається — він лише підписав транскрипт.</tspan><tspan x="430.0" dy="11.7">Що пізніший щабель — то повніший вплетений транскрипт (CH..SH → CH..SF → CH..CF). Тому старий запис не відмикається навіть викраденим ключем сервера.</tspan></text>
