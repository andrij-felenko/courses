<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рукостискання TLS 1.3: один оберт, тоді дешевий потік</text>
<rect x="24.0" y="50.0" width="150.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="99.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="99.0" dy="0.0">Пристрій</tspan></text>
<rect x="626.0" y="50.0" width="150.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="701.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="701.0" dy="0.0">Сервер</tspan></text>
<line x1="70.0" y1="90.0" x2="70.0" y2="320.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5"/>
<line x1="730.0" y1="90.0" x2="730.0" y2="320.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5"/>
<line x1="70.0" y1="120.0" x2="730.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ClientHello + відкрита частка</text>
<text x="400.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">«ось моя частка ECDHE, наперед»</text>
<line x1="730.0" y1="175.0" x2="70.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ServerHello + частка + СЕРТИФІКАТ + підпис</text>
<text x="400.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тут дорого на МК: RAM + CPU</text>
<text x="736.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">← сертифікат: кілька КБ RAM;</text>
<text x="736.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">   перевірка підпису: CPU</text>
<line x1="70.0" y1="240.0" x2="730.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Finished (з цього місця все шифроване)</text>
<text x="400.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">дані вже можна слати</text>
<line x1="40.0" y1="120.0" x2="40.0" y2="240.0" stroke="#2457d6" stroke-width="2.2"/>
<text x="26.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">один
оберт</text>
<rect x="60.0" y="290.0" width="680.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="314.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Після рукостискання — симетричний AEAD: шифрувати й перевіряти кожен пакет дешево. Дорога лише ПЕРША зустріч; тому її потім пропускають (відновлення сесії).</tspan></text>
</svg>