<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево ключів TLS 1.3: один секрет ECDHE → ціла родина</text>
<rect x="300.0" y="48.0" width="220.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="410.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Early Secret</tspan></text>
<text x="560.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">= HKDF-Extract(0, PSK|0)</text>
<rect x="40.0" y="108.0" width="150.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="115.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">секрет ECDHE</tspan><tspan x="115.0" dy="13.0">(з рукостискання)</tspan></text>
<line x1="192.0" y1="128.0" x2="298.0" y2="128.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="112.0" width="220.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="410.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Handshake Secret</tspan></text>
<text x="560.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">= HKDF-Extract(dHS, ECDHE)</text>
<rect x="300.0" y="176.0" width="220.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="410.0" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Master Secret</tspan></text>
<text x="560.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">= HKDF-Extract(dMS, 0)</text>
<line x1="410.0" y1="82.0" x2="410.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="146.0" x2="410.0" y2="176.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="129.0" x2="180.0" y2="250.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="520.0" y1="129.0" x2="640.0" y2="250.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="250.0" width="210.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="175.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">client_hs_traffic</tspan><tspan x="175.0" dy="12.3">шифр рукостискання →</tspan></text>
<rect x="540.0" y="250.0" width="210.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="645.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">server_hs_traffic</tspan><tspan x="645.0" dy="12.3">← шифр рукостискання</tspan></text>
<line x1="300.0" y1="193.0" x2="180.0" y2="330.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="520.0" y1="193.0" x2="640.0" y2="330.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="330.0" width="200.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="180.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">client_app_traffic</tspan><tspan x="180.0" dy="12.3">(ваші дані →)</tspan></text>
<rect x="540.0" y="330.0" width="200.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="640.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">server_app_traffic</tspan><tspan x="640.0" dy="12.3">(← ваші дані)</tspan></text>
<line x1="410.0" y1="210.0" x2="410.0" y2="330.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="315.0" y="330.0" width="190.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="410.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">resumption_secret</tspan><tspan x="410.0" dy="12.3">(майбутній квиток)</tspan></text>
<rect x="50.0" y="398.0" width="720.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="410.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Кожен щабель — HKDF-Extract (втягнути ентропію) + Derive-Secret (виростити ключ ролі).</tspan><tspan x="410.0" dy="13.7">Ключі РІЗНІ для рукостискання й даних, для клієнта й сервера, для квитка.</tspan><tspan x="410.0" dy="13.7">Витік одного не оголює інших — саме ця ізоляція й робить 1.3 міцнішим за 1.2.</tspan></text>
</svg>