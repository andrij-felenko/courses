<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від програмного розвʼязку Деккера до апаратної інструкції</text>
<rect x="40.0" y="64.0" width="290.0" height="210.0" rx="8" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="185.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деккер · ~1959 · суто програмно</text>
<rect x="60.0" y="86.0" width="120.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="120.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">прапорець</tspan><tspan x="120.0" dy="14.3">«хочу» A</tspan></text>
<rect x="190.0" y="86.0" width="120.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="250.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">прапорець</tspan><tspan x="250.0" dy="14.3">«хочу» B</tspan></text>
<rect x="95.0" y="150.0" width="180.0" height="44.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.6"/><text x="185.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">спільна змінна</tspan><tspan x="185.0" dy="14.3">«чия черга»</tspan></text>
<text x="185.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">лише читання/записи памʼяті</text>
<text x="185.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">коректно, але крихко й на 2 процеси</text>
<line x1="338.0" y1="169.0" x2="388.0" y2="169.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="363.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">залізо</text>
<rect x="396.0" y="64.0" width="284.0" height="210.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="538.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Прошивка сьогодні · апаратно</text>
<rect x="420.0" y="96.0" width="236.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="538.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="538.0" dy="0.0">одна неподільна</tspan><tspan x="538.0" dy="15.6">інструкція процесора</tspan></text>
<text x="538.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">«перевір і встанови»</text>
<text x="538.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(test-and-set)</text>
<text x="538.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">на ній тримається спінлок —</text>
<text x="538.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">дешево й надійно</text>
<text x="360.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Деккер довів, що впорядкувати МОЖНА; апаратура зробила це дешевим</text>
</svg>