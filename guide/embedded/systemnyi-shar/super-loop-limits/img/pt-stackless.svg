<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа stackless: локальні не переживають паузу</text>
<rect x="60.0" y="70.0" width="240.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перед WAIT: кадр стека живий</text>
<rect x="78.0" y="90.0" width="204.0" height="34.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">int sum = 0;</tspan></text>
<rect x="78.0" y="132.0" width="204.0" height="34.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">int i = 3;</tspan></text>
<rect x="78.0" y="174.0" width="204.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">адреса повернення</tspan></text>
<line x1="308.0" y1="145.0" x2="420.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="364.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">WAIT →</tspan><tspan x="364.0" dy="15.6">return</tspan></text>
<rect x="432.0" y="118.0" width="240.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="552.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">після return: кадр здувся</text>
<text x="552.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">sum, i — ЗНИКЛИ</text>
<text x="360.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">переживає лише те, що поза кадром: static або поле структури-протопотоку</text>
</svg>