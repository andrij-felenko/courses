<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протопотік: switch стрибає рівно туди, де ми спинилися</text>
<rect x="40.0" y="56.0" width="300.0" height="250.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="117.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">PT_BEGIN</tspan><tspan x="190.0" dy="16.9"></tspan><tspan x="190.0" dy="16.9">  LED = 1;</tspan><tspan x="190.0" dy="16.9">  WAIT 500 мс   ← пауза A</tspan><tspan x="190.0" dy="16.9"></tspan><tspan x="190.0" dy="16.9">  LED = 0;</tspan><tspan x="190.0" dy="16.9">  WAIT 500 мс   ← пауза B</tspan><tspan x="190.0" dy="16.9"></tspan><tspan x="190.0" dy="16.9">PT_END</tspan></text>
<text x="190.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як пишемо: згори вниз</text>
<rect x="400.0" y="56.0" width="280.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">switch (pt.line) {</tspan><tspan x="540.0" dy="16.9"> case 0:      → старт</tspan><tspan x="540.0" dy="16.9"> case A: goto після A</tspan><tspan x="540.0" dy="16.9"> case B: goto після B</tspan><tspan x="540.0" dy="16.9">}</tspan></text>
<text x="540.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">як виконує: стрибок за станом</text>
<line x1="340.0" y1="152.0" x2="400.0" y2="126.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="340.0" y1="206.0" x2="400.0" y2="166.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="370.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">pt.line = __LINE__</text>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перед кожною паузою запам'ятали рядок; наступний вхід — switch по ньому — і ми одразу за паузою</text>
</svg>