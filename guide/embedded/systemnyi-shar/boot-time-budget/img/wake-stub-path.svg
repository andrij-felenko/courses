<rect x="22.6" y="392.5" width="734.8" height="31.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Стаб дістає керування ще до завантажувача — і в більшості пробуджень вертає чіп у сон, оминувши весь дорогий старт</tspan></text>
