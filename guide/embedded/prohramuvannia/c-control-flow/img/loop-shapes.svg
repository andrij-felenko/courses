<line x1="600.0" y1="274.0" x2="600.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="510.0" y="334.0" width="180.0" height="66.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="600.0" dy="0.0">три частини поруч:</tspan><tspan x="600.0" dy="14.3">старт, перевірка, крок —</tspan><tspan x="600.0" dy="14.3">усе на очах</tspan></text>
