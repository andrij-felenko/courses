<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Змінна: ім'я, за яким ховається комірка пам'яті</text>
<rect x="40.0" y="58.0" width="300.0" height="40.0" rx="6" fill="#eef7ff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">uint8_t speed = 42;</tspan></text>
<text x="90.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тип</text>
<text x="200.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ім'я</text>
<text x="300.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">значення</text>
<line x1="200.0" y1="130.0" x2="470.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">показує на</text>
<rect x="470.0" y="150.0" width="60.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="500.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x20</text>
<rect x="530.0" y="150.0" width="60.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="560.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">42</text>
<text x="560.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x21</text>
<rect x="590.0" y="150.0" width="60.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="620.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x22</text>
<rect x="650.0" y="150.0" width="60.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="680.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x23</text>
<text x="590.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пам'ять (по одному байту в комірці)</text>
<text x="500.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">адреса комірки</text>
<rect x="101.8" y="275.1" width="516.5" height="49.9" rx="6" fill="#fffef2" stroke="#caa53d" stroke-width="1.5"/><text x="360.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ім'я speed — для нас; машина працює з адресою 0x21.</tspan><tspan x="360.0" dy="16.9">«= 42» означає «поклади 42 в цю комірку», а не «speed дорівнює 42».</tspan></text>
</svg>