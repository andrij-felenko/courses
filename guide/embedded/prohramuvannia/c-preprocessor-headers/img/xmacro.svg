<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один список — три узгоджені форми</text>
<rect x="45.0" y="198.1" width="210.0" height="73.9" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="150.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5cc7" text-anchor="middle"><tspan x="150.0" dy="0.0">CMD_TABLE(X)</tspan><tspan x="150.0" dy="14.3">  X(0x01, PING,   …)</tspan><tspan x="150.0" dy="14.3">  X(0x02, ARM,    …)</tspan><tspan x="150.0" dy="14.3">  X(0x03, DISARM, …)</tspan></text>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5cc7" text-anchor="middle" font-weight="700">єдине джерело</text>
<text x="150.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">додав рядок — оновило все</text>
<rect x="355.0" y="98.0" width="300.0" height="44.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="505.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="505.0" dy="0.0">#define X … CMD_##id = code</tspan></text>
<line x1="262.0" y1="235.0" x2="353.0" y2="120.0" stroke="#8a5cc7" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="355.0" y="213.0" width="300.0" height="44.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="505.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="505.0" dy="0.0">#define X … [CMD_##id] = name</tspan></text>
<line x1="262.0" y1="235.0" x2="353.0" y2="235.0" stroke="#8a5cc7" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="355.0" y="328.0" width="300.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="505.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="505.0" dy="0.0">#define X … [CMD_##id] = handler</tspan></text>
<line x1="262.0" y1="235.0" x2="353.0" y2="350.0" stroke="#8a5cc7" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="672.0" y="92.0" width="180.0" height="56.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="762.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">enum:</tspan><tspan x="762.0" dy="13.0">CMD_PING=0x01,</tspan><tspan x="762.0" dy="13.0">CMD_ARM=0x02, …</tspan></text>
<line x1="657.0" y1="120.0" x2="670.0" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="672.0" y="207.0" width="180.0" height="56.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="762.0" y="225.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">назви:</tspan><tspan x="762.0" dy="13.0">[CMD_PING]=&quot;PING&quot;,</tspan><tspan x="762.0" dy="13.0">…</tspan></text>
<line x1="657.0" y1="235.0" x2="670.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="672.0" y="322.0" width="180.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="762.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">обробники:</tspan><tspan x="762.0" dy="13.0">[CMD_PING]=handle_ping,</tspan><tspan x="762.0" dy="13.0">…</tspan></text>
<line x1="657.0" y1="350.0" x2="670.0" y2="350.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
