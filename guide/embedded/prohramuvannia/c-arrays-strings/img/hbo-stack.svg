<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому саме стек: поряд із буфером лежить адреса повернення</text>
<rect x="150.0" y="70.0" width="250.0" height="38.0" rx="4" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="275.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер[0]</text>
<rect x="150.0" y="108.0" width="250.0" height="38.0" rx="4" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="275.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер[1]</text>
<rect x="150.0" y="146.0" width="250.0" height="38.0" rx="4" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="275.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер[2]</text>
<rect x="150.0" y="184.0" width="250.0" height="38.0" rx="4" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="275.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер[3]</text>
<rect x="150.0" y="222.0" width="250.0" height="38.0" rx="4" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="275.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">… решта буфера</text>
<rect x="150.0" y="260.0" width="250.0" height="38.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="275.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">адреса повернення</text>
<line x1="136.0" y1="70.0" x2="136.0" y2="260.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="128.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">буфер</text>
<text x="500.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">запис</text>
<line x1="440.0" y1="100.0" x2="440.0" y2="284.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="530.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">лізе за межу</text>
<text x="530.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">буфера…</text>
<text x="535.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">…і затирає</text>
<text x="535.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">адресу повернення</text>
<rect x="30.0" y="286.0" width="660.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="301.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Функція, доробивши, стрибає за адресою повернення. Підмінив її — і керування піде,</tspan><tspan x="360.0" dy="15.0">куди захотів чужий, а не туди, звідки функцію викликали. Ось чому переповнення стеку — зброя.</tspan></text>
</svg>