<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне ім'я arr — але воно означає різне залежно від місця</text>
<rect x="60.0" y="74.0" width="285.0" height="250.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="202.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">під sizeof arr та &amp;arr</text>
<text x="202.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">arr = ВЕСЬ масив</text>
<rect x="92.5" y="154.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="114.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[0]</text>
<rect x="136.5" y="154.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="158.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[1]</text>
<rect x="180.5" y="154.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="202.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[2]</text>
<rect x="224.5" y="154.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="246.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[3]</text>
<rect x="268.5" y="154.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="290.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">[4]</text>
<line x1="92.5" y1="210.0" x2="312.5" y2="210.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="202.5" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">sizeof arr = 5 × sizeof елемента</text>
<text x="202.5" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тип &amp;arr — «покажчик на масив із 5»</text>
<rect x="375.0" y="74.0" width="285.0" height="250.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="517.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">будь-де інше (вираз, виклик)</text>
<text x="517.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">arr → &amp;arr[0]</text>
<rect x="435.0" y="164.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="457.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">[0]</text>
<rect x="479.0" y="164.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/>
<text x="501.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">[1]</text>
<rect x="523.0" y="164.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/>
<text x="545.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">[2]</text>
<rect x="567.0" y="164.0" width="44.0" height="40.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/>
<text x="589.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">[3]</text>
<line x1="557.5" y1="142.0" x2="457.0" y2="161.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="587.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">лишається сама адреса</text>
<text x="517.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">sizeof (покажчик) = 4 чи 8 байтів —</text>
<text x="517.5" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">розмір АДРЕСИ, не масиву!</text>
<rect x="40.0" y="344.0" width="640.0" height="42.0" rx="6" fill="#fff8e1" stroke="#e0a800" stroke-width="1.5"/><text x="360.0" y="361.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Виняток лише для sizeof, &amp;, та ініціалізації рядкового масиву літералом.</tspan><tspan x="360.0" dy="15.0">Скрізь інде ім'я масиву «розпадається» на адресу першого елемента — і довжина губиться.</tspan></text>
</svg>