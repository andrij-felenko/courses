<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як зник лічильник довжини: BCPL → B → C</text>
<line x1="60.0" y1="96.0" x2="680.0" y2="96.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="150.0" cy="96.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="150.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1967</text>
<text x="150.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">BCPL</text>
<text x="150.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мартін Річардс</text>
<text x="150.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">перша комірка —</tspan><tspan x="150.0" dy="14.4">число символів</tspan></text>
<circle cx="370.0" cy="96.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="370.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">~1969</text>
<text x="370.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="370.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кен Томпсон, PDP-7</text>
<text x="370.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">лічильник прибрано,</tspan><tspan x="370.0" dy="14.4">кінець — байт '*e'</tspan></text>
<circle cx="600.0" cy="96.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="600.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">~1971</text>
<text x="600.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<text x="600.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Денніс Рітчі, PDP-11</text>
<text x="600.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">той самий прийом,</tspan><tspan x="600.0" dy="14.4">кінець — байт '\0'</tspan></text>
<line x1="240.0" y1="96.0" x2="300.0" y2="96.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="96.0" x2="530.0" y2="96.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="244.0" width="660.0" height="42.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Причина в Рітчі прямим текстом: лічильник у 8–9-бітній комірці обмежував довжину рядка,</tspan><tspan x="360.0" dy="13.7">а тримати його було «менш зручно, ніж мати термінатор». Зручність одного дня — вада на пів століття.</tspan></text>
</svg>