<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині uart.o: секції та таблиця символів</text>
<text x="190.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5cc7" text-anchor="middle" font-weight="700">СЕКЦІЇ — машинний вміст</text>
<rect x="25.0" y="83.8" width="330.0" height="24.5" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="190.0" y="99.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">.text  —  код функцій (машинні інструкції)</tspan></text>
<rect x="25.0" y="127.8" width="330.0" height="24.5" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="190.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">.rodata  —  сталі: рядки, const-таблиці</tspan></text>
<rect x="25.0" y="171.8" width="330.0" height="24.5" rx="6" fill="#f3edfb" stroke="#8a5cc7" stroke-width="1.5"/><text x="190.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">.data  —  глобальні з ненульовим значенням</tspan></text>
<rect x="25.0" y="215.8" width="330.0" height="24.5" rx="6" fill="#efeafa" stroke="#8a5cc7" stroke-width="1.5"/><text x="190.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">.bss  —  глобальні-нулі: лише РОЗМІР, не вміст</tspan></text>
<text x="600.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ТАБЛИЦЯ СИМВОЛІВ</text>
<rect x="475.0" y="78.5" width="250.0" height="35.0" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="600.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle"><tspan x="600.0" dy="0.0">uart_send</tspan><tspan x="600.0" dy="13.0">DEFINED → .text +0x00</tspan></text>
<rect x="475.0" y="124.5" width="250.0" height="35.0" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="600.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle"><tspan x="600.0" dy="0.0">uart_init</tspan><tspan x="600.0" dy="13.0">DEFINED → .text +0x40</tspan></text>
<rect x="475.0" y="170.5" width="250.0" height="35.0" rx="6" fill="#e9f7f2" stroke="#0f8a6d" stroke-width="1.5"/><text x="600.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f8a6d" text-anchor="middle"><tspan x="600.0" dy="0.0">g_baud</tspan><tspan x="600.0" dy="13.0">DEFINED → .data +0x00</tspan></text>
<rect x="475.0" y="216.5" width="250.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="600.0" dy="0.0">gpio_set</tspan><tspan x="600.0" dy="13.0">UNDEFINED — чуже, дірка</tspan></text>
<rect x="475.0" y="262.5" width="250.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="600.0" dy="0.0">memcpy</tspan><tspan x="600.0" dy="13.0">UNDEFINED — з бібліотеки</tspan></text>
<text x="390.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">DEFINED — тіло тут, лінкер дасть адресу; UNDEFINED — тіло в іншому .o, лишається дірка</text>
</svg>