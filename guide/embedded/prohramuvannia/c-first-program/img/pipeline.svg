<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від тексту людини до чисел машини — і до результату</text>
<rect x="33.0" y="102.0" width="210.0" height="96.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="138.0" y="124.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9ec5ff" text-anchor="middle" font-weight="700">int main(void) {</text>
<text x="138.0" y="144.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9ec5ff" text-anchor="middle">  printf(&quot;Привіт&quot;);</text>
<text x="138.0" y="164.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9ec5ff" text-anchor="middle">  return 0;</text>
<text x="138.0" y="182.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#9ec5ff" text-anchor="middle" font-weight="700">}</text>
<text x="138.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вихідний код  hello.c</text>
<text x="138.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">текст для людини</text>
<rect x="321.0" y="119.9" width="150.0" height="60.2" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="2.0"/><text x="396.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="396.0" dy="0.0">КОМПІЛЯТОР</tspan><tspan x="396.0" dy="18.2">(gcc)</tspan></text>
<text x="396.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">перекладає текст → числа</text>
<line x1="249.0" y1="150.0" x2="315.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="525.0" y="102.0" width="210.0" height="96.0" rx="8" fill="#0f1b14" stroke="#0a120d" stroke-width="1.4"/>
<text x="630.0" y="122.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#7fe0a0" text-anchor="middle">01001000 10111111</text>
<text x="630.0" y="142.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#7fe0a0" text-anchor="middle">11101000 ...</text>
<text x="630.0" y="162.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6b7280" text-anchor="middle">LEA  rdi, [рядок]</text>
<text x="630.0" y="182.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#6b7280" text-anchor="middle">CALL puts</text>
<text x="630.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">машинний код  hello</text>
<text x="630.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">числа для процесора</text>
<line x1="477.0" y1="150.0" x2="519.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="630.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">процесор виконує →</text>
<rect x="525.0" y="232.0" width="210.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="630.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Привіт, світе!</tspan></text>
</svg>