<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="160.0" y="34.0" width="400.0" height="40.0" rx="6" fill="#fff6e6" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">f(a, b, c, d, e, g)</tspan></text>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">шість аргументів розкладаються так:</text>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">у регістрах (швидко)</text>
<rect x="130.0" y="136.0" width="140.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">r0 = a</tspan></text>
<rect x="130.0" y="174.0" width="140.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">r1 = b</tspan></text>
<rect x="130.0" y="212.0" width="140.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">r2 = c</tspan></text>
<rect x="130.0" y="250.0" width="140.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">r3 = d</tspan></text>
<text x="200.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перші чотири</text>
<text x="520.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">на стеку (повільніше)</text>
<rect x="450.0" y="136.0" width="140.0" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">e</tspan></text>
<rect x="450.0" y="174.0" width="140.0" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">g</tspan></text>
<text x="520.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">решта — в пам'ять</text>
<text x="520.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">і зчитати назад: зайві такти</text>
