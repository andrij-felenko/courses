<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотний струм: він тече петлею, і на швидкій цифрі — рівно під сигналом</text>
<rect x="65.0" y="96.0" width="300.0" height="104.0" rx="2" fill="#d8c98a" stroke="#b8a55f" stroke-width="1.1"/>
<rect x="65.0" y="88.0" width="300.0" height="8.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.0"/>
<rect x="65.0" y="200.0" width="300.0" height="10.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.0"/>
<line x1="85.0" y1="92.0" x2="345.0" y2="92.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал →</text>
<line x1="345.0" y1="205.0" x2="85.0" y2="205.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">зворотний струм — рівно під сигналом (мала петля)</text>
<rect x="415.0" y="96.0" width="300.0" height="104.0" rx="2" fill="#d8c98a" stroke="#b8a55f" stroke-width="1.1"/>
<rect x="415.0" y="88.0" width="300.0" height="8.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.0"/>
<rect x="415.0" y="200.0" width="135.0" height="10.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.0"/>
<rect x="580.0" y="200.0" width="135.0" height="10.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.0"/>
<text x="565.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">розрив землі</text>
<line x1="435.0" y1="92.0" x2="695.0" y2="92.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="565.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал →</text>
<path d="M 695.0 205.0 L 605.0 240.0 L 525.0 240.0 L 435.0 205.0" fill="none" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="565.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">мусить обійти → петля роздулася</text>
<text x="215.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">суцільна земля</text>
<text x="565.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">земля з розривом</text>
<line x1="390.0" y1="60.0" x2="390.0" y2="330.0" stroke="#d0d4d8" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="390.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">мала петля — мало випромінює й ловить; роздута петля — джерело завад і антена.</text>
<text x="390.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тому суцільний шар землі під сигналом — не розкіш, а керування зворотним струмом</text>
</svg>