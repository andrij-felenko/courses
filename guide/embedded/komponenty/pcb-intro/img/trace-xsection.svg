<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переріз доріжки: травлення робить не прямокутник, а трапецію</text>
<rect x="60.0" y="300.0" width="660.0" height="70.0" rx="3" fill="#d8c98a" stroke="#b8a55f" stroke-width="1.4"/>
<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a7a2f" text-anchor="middle">ізолятор (ламінат)</text>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ідеал у програмі</text>
<rect x="90.0" y="254.0" width="120.0" height="46.0" rx="1" fill="#b87333" stroke="#8a561f" stroke-width="1.4"/>
<line x1="90.0" y1="240.0" x2="210.0" y2="240.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">w</text>
<rect x="99.1" y="111.9" width="101.8" height="36.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="150.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">переріз = w × t</tspan><tspan x="150.0" dy="13.7">рівні стінки</tspan></text>
<text x="560.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a561f" text-anchor="middle" font-weight="700">реально після травлення</text>
<path d="M 495.0 300.0 L 625.0 300.0 L 602.0 254.0 L 518.0 254.0 Z" fill="#b87333" stroke="#8a561f" stroke-width="1.6"/>
<rect x="516.0" y="246.0" width="88.0" height="8.0" rx="1" fill="#1f7a4d" stroke="#155c3a" stroke-width="1.0"/>
<line x1="518.0" y1="232.0" x2="602.0" y2="232.0" stroke="#8a561f" stroke-width="1.0"/>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a561f" text-anchor="middle" font-style="italic">w_top (менша)</text>
<line x1="495.0" y1="316.0" x2="625.0" y2="316.0" stroke="#8a561f" stroke-width="1.0"/>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a561f" text-anchor="middle" font-style="italic">w_bot (як у файлі)</text>
<line x1="498.0" y1="262.0" x2="516.0" y2="262.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="478.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">підтрав</text>
<line x1="625.0" y1="300.0" x2="602.0" y2="254.0" stroke="#333" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="651.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">стінка</text>
<rect x="482.2" y="131.9" width="155.6" height="36.1" rx="6" fill="#ffffff" stroke="#b87333" stroke-width="1.1"/><text x="560.0" y="146.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">етч-фактор = t / підтрав</tspan><tspan x="560.0" dy="13.7">типово ≈ 3…4</tspan></text>
<text x="390.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">справжня мідь трохи вужча, ніж намальовано — це закладають у правила ширини для точних місць</text>
</svg>