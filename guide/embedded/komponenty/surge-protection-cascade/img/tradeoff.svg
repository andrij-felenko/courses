<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три захисники — три кути; верхній правий нікому не дається</text>
<line x1="110.0" y1="360.0" x2="660.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="360.0" x2="110.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="385.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">енергія, яку елемент стерпить  →</text>
<text x="38.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 38.0 215.0)">точність і швидкість затиску  →</text>
<circle cx="560.0" cy="320.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="560.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">GDT</text><text x="560.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кілоампери, але грубий і повільний</text>
<circle cx="360.0" cy="215.0" r="30.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/><text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">MOV</text><text x="360.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сотні ампер, середній</text>
<circle cx="180.0" cy="110.0" r="30.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/><text x="180.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">TVS</text><text x="180.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наносекунди, точно — та мало енергії</text>
<rect x="470.0" y="95.0" width="175.0" height="70.0" rx="8" fill="#fff7e6" stroke="#d9a441" stroke-width="1.6"/>
<rect x="470.0" y="95.0" width="175.0" height="70.0" rx="6" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/><text x="557.5" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle"><tspan x="557.5" dy="0.0">жоден один елемент</tspan><tspan x="557.5" dy="15.0">сюди не дістає</tspan></text>
<line x1="545.0" y1="165.0" x2="470.0" y2="230.0" stroke="#d9a441" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="165.0" x2="560.0" y2="285.0" stroke="#d9a441" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>