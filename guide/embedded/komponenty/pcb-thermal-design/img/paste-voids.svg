<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому пад ділять на квадрати: газ флюсу проти порожнин</text>
<text x="215.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Суцільне вікно пасти</text>
<rect x="90.0" y="180.0" width="250.0" height="34.0" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="215.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">корпус</text>
<rect x="90.0" y="220.0" width="250.0" height="30.0" rx="3" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.6"/>
<circle cx="215.0" cy="235.0" r="11.0" fill="#9aa0a6" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="255.0" cy="235.0" r="6.0" fill="#9aa0a6" stroke="#6b7280" stroke-width="1.2"/>
<line x1="215.0" y1="235.0" x2="215.0" y2="212.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">газ флюсу не встигає вийти →</text>
<text x="215.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">застигає порожниною (void)</text>
<rect x="90.0" y="250.0" width="250.0" height="12.0" rx="2" fill="#c8731f" stroke="#8a4f15" stroke-width="1.2"/>
<text x="565.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сітка квадратів (windowpane)</text>
<rect x="440.0" y="186.0" width="250.0" height="34.0" rx="4" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="565.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">корпус сів рівно</text>
<rect x="448.0" y="226.0" width="40.4" height="24.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.4"/>
<line x1="492.4" y1="228.0" x2="492.4" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="496.4" y="226.0" width="40.4" height="24.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.4"/>
<line x1="540.8" y1="228.0" x2="540.8" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="544.8" y="226.0" width="40.4" height="24.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.4"/>
<line x1="589.2" y1="228.0" x2="589.2" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="593.2" y="226.0" width="40.4" height="24.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.4"/>
<line x1="637.6" y1="228.0" x2="637.6" y2="206.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="641.6" y="226.0" width="40.4" height="24.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="1.4"/>
<text x="565.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">газ виходить проміжками →</text>
<text x="565.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">порожнин майже нема</text>
<rect x="440.0" y="250.0" width="250.0" height="12.0" rx="2" fill="#c8731f" stroke="#8a4f15" stroke-width="1.2"/>
<rect x="70.0" y="332.0" width="640.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Паста = кульки припою + флюс; при оплавленні флюс кипить і дає газ. Покриття пастою</tspan><tspan x="390.0" dy="15.6">роблять ~50–70 % площі квадратами: газ виходить, припою в міру, корпус не «спливає».</tspan><tspan x="390.0" dy="15.6">Норма порожнин під падом: ≤ 25 % (IPC-A-610); стеля надійності IPC-7093 — 50 %.</tspan></text>
</svg>