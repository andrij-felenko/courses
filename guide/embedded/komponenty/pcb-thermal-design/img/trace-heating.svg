<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доріжка живлення — це резистор: струм її гріє</text>
<text x="120.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вузька доріжка</text>
<rect x="90.0" y="95.0" width="420.0" height="14.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="2.0"/>
<line x1="96.0" y1="102.0" x2="504.0" y2="102.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
