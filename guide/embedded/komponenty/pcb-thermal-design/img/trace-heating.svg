<text x="540.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">перегрів</text>
<text x="120.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">широка доріжка, той самий струм</text>
<rect x="90.0" y="175.0" width="420.0" height="30.0" rx="2" fill="#f6e3cf" stroke="#c8731f" stroke-width="2.0"/>
<line x1="96.0" y1="190.0" x2="504.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="540.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">ледь тепла</text>
<rect x="90.0" y="240.0" width="540.0" height="44.0" rx="6" fill="#fff8ef" stroke="#c8731f" stroke-width="1.5"/>
<text x="360.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">P = I² · R     R = ρ · L / (товщина · ширина)</text>
<rect x="90.0" y="296.0" width="540.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ширша й товстіша мідь — менший опір R, менше тепла P при тому самому струмі.</tspan><tspan x="360.0" dy="14.3">Скільки саме треба — дають таблиці IPC (ширина під струм і допустимий перегрів).</tspan></text>
