<rect x="60.0" y="350.0" width="640.0" height="56.0" rx="6" fill="#fff8ef" stroke="#c8731f" stroke-width="1.5"/><text x="380.0" y="374.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Мідь проводить тепло у ~1000 разів краще за текстоліт (k ≈ 400 проти ≈ 0.3 Вт/(м·°C)).</tspan><tspan x="380.0" dy="15.0">Полігон працює як «дріт» для тепла: збирає його з паду й роздає повітрю з великої площі.</tspan></text>
