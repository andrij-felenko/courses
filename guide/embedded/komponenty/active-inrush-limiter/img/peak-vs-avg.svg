<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінійне наростання: пік рівно вдвічі за середню</text>
<line x1="110.0" y1="330.0" x2="670.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="110.0" y1="330.0" x2="110.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">час наростання  →</text>
<text x="40" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 40 210.0)">потужність у кристалі  →</text>
<text x="360.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінійне наростання: горб потужності — трикутник</text>
<polygon points="110.00,330.00 110.00,126.00 540.00,330.00" fill="#fdecea" stroke="none" opacity="0.75"/>
<line x1="110.0" y1="126.0" x2="540.0" y2="330.0" stroke="#c0392b" stroke-width="2.8"/>
<line x1="104.0" y1="126.0" x2="110.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">P_пік = C·U²/T</text>
<line x1="110.0" y1="228.0" x2="540.0" y2="228.0" stroke="#8a5a00" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="548.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="start">P_сер = ½·P_пік</text>
<text x="548.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">= C·U²/(2T)</text>
<text x="106.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">0</text>
<line x1="540.0" y1="330.0" x2="540.0" y2="336.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="540.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">T</text>
<rect x="221.8" y="146.0" width="168.0" height="36.0" rx="6" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/><text x="305.8" y="160.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a5a00" text-anchor="middle"><tspan x="305.8" dy="0.0">площа трикутника</tspan><tspan x="305.8" dy="13.7">= енергія ½·C·U²</tspan></text>
<text x="333.6" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">напруга на транзисторі спадає → горб гасне</text>
</svg>