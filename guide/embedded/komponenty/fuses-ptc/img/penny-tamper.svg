<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як людська кмітливість перемагала захист — і відповідь Type S</text>
<text x="440.0" y="53.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">цоколь Едісона брав запобіжник будь-якого номіналу — тож «вічно перегорає» лікували монеткою</text>
<line x1="440.0" y1="72.0" x2="440.0" y2="354.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="225.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Стара халепа: «монетка за запобіжником»</text>
<circle cx="225.0" cy="168.0" r="40.0" fill="#f0e2c0" stroke="#a98a00" stroke-width="2.5"/>
<circle cx="225.0" cy="168.0" r="27.0" fill="#d9b24a" stroke="#a98a00" stroke-width="1.8"/>
<text x="225.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7a5e12" text-anchor="middle" font-weight="bold" font-style="normal">1¢</text>
<text x="225.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">мідна монета замикає коло</text>
<text x="225.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">замість перегорілого запобіжника</text>
<text x="225.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ захисту НЕМА</text>
<text x="225.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">перевантаження → пожежа</text>
<text x="655.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Відповідь: цоколь Type S</text>
<circle cx="655.0" cy="168.0" r="40.0" fill="#e7f3ea" stroke="#1f8a3b" stroke-width="2.5"/>
<circle cx="655.0" cy="168.0" r="22.0" fill="#fff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="655.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2A</text>
<text x="655.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">різьба під ОДИН номінал</text>
<text x="655.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більший не вкрутиш; перехідник не вийняти</text>
<text x="655.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ пере-«жирнити» не можна</text>
<text x="655.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(NEC забороняє старий цоколь, 1940)</text>
</svg>
