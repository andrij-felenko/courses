<line x1="770.0" y1="260.0" x2="520.0" y2="260.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="520.0" y1="260.0" x2="520.0" y2="276.8" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="778.0" y="357.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">статус railing:
упер у край →
стопори інтеграл</text>
<text x="120.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">GPS зник → holdover:</text>
<text x="120.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">заморозити + екстраполювати вивчений дрейф</text>
