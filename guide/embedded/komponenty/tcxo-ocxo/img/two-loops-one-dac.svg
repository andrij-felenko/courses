<line x1="579.2" y1="120.0" x2="686.0" y2="198.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="569.3" y1="300.0" x2="686.0" y2="222.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="604.4" y="399.0" width="191.1" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="700.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">ЦАП → варикап → частота</tspan></text>
<line x1="700.0" y1="230.0" x2="700.0" y2="399.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
