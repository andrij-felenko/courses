<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прошивка: дві петлі керують однією напругою на варикапі</text>
<text x="410.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">швидка розімкнена (температура) + повільна замкнена (GPS) → сума в один ЦАП</text>
<rect x="77.2" y="96.8" width="85.5" height="46.5" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">термодавач</tspan><tspan x="120.0" dy="15.0">T, °C</tspan></text>
<rect x="247.7" y="96.8" width="144.5" height="46.5" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">поліном 3-го пор.</tspan><tspan x="320.0" dy="15.0">Горнер, фікс. точка</tspan></text>
<rect x="460.8" y="96.8" width="118.3" height="46.5" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">код бази</tspan><tspan x="520.0" dy="15.0">(центр + темп.)</tspan></text>
<line x1="162.8" y1="120.0" x2="247.7" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="392.3" y1="120.0" x2="460.8" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">feed-forward · швидко (32 Гц)</text>
<text x="220.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">знаємо наперед з калібрування</text>
<rect x="51.0" y="276.8" width="138.0" height="46.5" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">1PPS від GPS</tspan><tspan x="120.0" dy="15.0">(атомна прив'язка)</tspan></text>
<rect x="287.1" y="276.8" width="65.9" height="46.5" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">фазомір</tspan><tspan x="320.0" dy="15.0">Δφ, нс</tspan></text>
<rect x="470.7" y="276.8" width="98.7" height="46.5" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ПІ-регулятор</tspan><tspan x="520.0" dy="15.0">+ антивіндап</tspan></text>
<line x1="189.0" y1="300.0" x2="287.1" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="352.9" y1="300.0" x2="470.7" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">feedback · повільно (стала 10²–10³ с)</text>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">бачимо лише зовні — виправляємо старіння</text>
