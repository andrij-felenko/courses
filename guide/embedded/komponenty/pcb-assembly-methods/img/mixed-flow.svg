<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрут плати: спершу все SMD, потім THT</text>
<rect x="40.0" y="110.0" width="132.0" height="66.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="106.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Паста</text>
<text x="106.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">трафарет</tspan><tspan x="106.0" dy="12.3">на всі майданчики</tspan></text>
<line x1="176.0" y1="143.0" x2="196.0" y2="143.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="110.0" width="132.0" height="66.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="266.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Установка</text>
<text x="266.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="266.0" dy="0.0">деталі на пасту</tspan><tspan x="266.0" dy="12.3">(pick-and-place)</tspan></text>
<line x1="336.0" y1="143.0" x2="356.0" y2="143.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="110.0" width="132.0" height="66.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="426.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Піч</text>
<text x="426.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="426.0" dy="0.0">оплавлення —</tspan><tspan x="426.0" dy="12.3">уся плата за раз</tspan></text>
<text x="266.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ВСЕ SMD — оплавленням (гаряча піч)</text>
<line x1="426.0" y1="182.0" x2="426.0" y2="228.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="499.6" y="180.0" width="152.8" height="52.0" rx="6" fill="#f4f6f8" stroke="#e0a800" stroke-width="1.4"/><text x="576.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="576.0" dy="0.0">THT заходять ПІСЛЯ печі:</tspan><tspan x="576.0" dy="13.0">те, що не любить жар, —</tspan><tspan x="576.0" dy="13.0">не в духовку</tspan></text>
<rect x="360.0" y="240.0" width="132.0" height="66.0" rx="8" fill="#fef9e7" stroke="#caa700" stroke-width="1.8"/>
<text x="426.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. THT</text>
<text x="426.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="426.0" dy="0.0">роз'єми, клеми,</tspan><tspan x="426.0" dy="12.3">електроліти</tspan></text>
<line x1="496.0" y1="273.0" x2="552.0" y2="247.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="601.8" y="225.5" width="80.4" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="642.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="642.0" dy="0.0">хвилею —</tspan><tspan x="642.0" dy="13.0">велика серія</tspan></text>
<line x1="496.0" y1="273.0" x2="552.0" y2="299.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="593.2" y="285.5" width="97.5" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="642.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="642.0" dy="0.0">руками —</tspan><tspan x="642.0" dy="13.0">коли їх одиниці</tspan></text>
</svg>