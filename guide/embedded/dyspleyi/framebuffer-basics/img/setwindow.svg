<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">set_window(): дві 16-бітні межі → чотири байти, старший перший</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">приклад: x0=30 (0x001E), x1=69 (0x0045)</text>
<rect x="70.0" y="84.0" width="120.0" height="40.0" rx="6" fill="#eef4f8" stroke="#1f78b4" stroke-width="1.9"/>
<text x="130.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f78b4" text-anchor="middle" font-weight="700">CASET</text>
<text x="130.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x2A (команда)</text>
<line x1="190.0" y1="104.0" x2="220.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="84.0" width="118.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.7"/>
<text x="289.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b6b7a" text-anchor="middle" font-weight="700">0x00</text>
<text x="289.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">x0 старший</text>
<rect x="354.0" y="84.0" width="118.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1f78b4" stroke-width="1.7"/>
<text x="413.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f78b4" text-anchor="middle" font-weight="700">0x1E</text>
<text x="413.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">x0 молодший</text>
<rect x="478.0" y="84.0" width="118.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.7"/>
<text x="537.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b6b7a" text-anchor="middle" font-weight="700">0x00</text>
<text x="537.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">x1 старший</text>
<rect x="602.0" y="84.0" width="118.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1f78b4" stroke-width="1.7"/>
<text x="661.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f78b4" text-anchor="middle" font-weight="700">0x45</text>
<text x="661.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">x1 молодший</text>
<text x="380.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">чотири байти = дві координати по два байти, кожна СТАРШИМ уперед</text>
<rect x="227.1" y="205.6" width="305.9" height="56.8" rx="6" fill="#0d1b2a" stroke="#1f78b4" stroke-width="1.6"/><text x="380.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#eaf2ff" text-anchor="middle"><tspan x="380.0" dy="0.0">buf[0] = x0 &gt;&gt; 8;   buf[1] = x0 &amp; 0xFF;</tspan><tspan x="380.0" dy="16.2">buf[2] = x1 &gt;&gt; 8;   buf[3] = x1 &amp; 0xFF;</tspan></text>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">у коді set_window() пакує так (старший байт першим):</text>
<rect x="90.0" y="300.0" width="280.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1f78b4" stroke-width="1.7"/>
<text x="106.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f78b4" text-anchor="start" font-weight="700">RASET 0x2B</text>
<text x="106.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">так само 4 байти рядків y0,y1</text>
<rect x="390.0" y="300.0" width="280.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/>
<text x="406.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">RAMWR 0x2C</text>
<text x="406.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">далі лити потік RGB565</text>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переставиш старший↔молодший у будь-якій парі — вікно з'їде або обріжеться</text>
</svg>