<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стратегії під тісну пам'ять МК</text>
<rect x="60.0" y="66.0" width="300.0" height="250.0" rx="6" fill="#eef4f8" stroke="#1f78b4" stroke-width="2.0"/>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f78b4" text-anchor="middle" font-weight="700">повний кадр у RAM</text>
<rect x="120.0" y="110.0" width="180.0" height="110.0" rx="6" fill="#d6ecff" stroke="#1f78b4" stroke-width="1.6"/>
<text x="210.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">fb[W·H]</text>
<text x="210.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">малюй будь-де, будь-коли,</tspan><tspan x="210.0" dy="13.0">накладай шари — тоді одним</tspan><tspan x="210.0" dy="13.0">махом виштовхни на панель</tspan></text>
<text x="210.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ціна: 320×240×2 ≈ 150 КБ RAM</text>
<rect x="400.0" y="66.0" width="300.0" height="250.0" rx="6" fill="#fff8e6" stroke="#b9770e" stroke-width="2.0"/>
<text x="550.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">смуга → у GRAM панелі</text>
<rect x="460.0" y="108.0" width="180.0" height="20.0" rx="6" fill="#fff3e0" stroke="#b9770e" stroke-width="1.3"/>
<rect x="460.0" y="132.0" width="180.0" height="20.0" rx="6" fill="#ffe4a3" stroke="#b9770e" stroke-width="1.3"/>
<rect x="460.0" y="156.0" width="180.0" height="20.0" rx="6" fill="#fff3e0" stroke="#b9770e" stroke-width="1.3"/>
<text x="550.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">малий буфер на кілька рядків</text>
<text x="550.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">намалюй смугу — виштовхни —</tspan><tspan x="550.0" dy="13.0">повтори; або пиши прямо в GRAM</tspan><tspan x="550.0" dy="13.0">через вікно, зовсім без буфера</tspan></text>
<text x="550.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ціна: RAM у рази менше,</text>
<text x="550.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">але губиться довільний доступ</text>
</svg>