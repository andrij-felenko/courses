<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Малювання смугами: елемент на стику ріжеться й малюється двічі</text>
<text x="590.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">екран, поділений на 5 смуг</text>
<rect x="470.0" y="70.0" width="240.0" height="60.0" rx="0" fill="#fff3e0" stroke="#b9770e" stroke-width="1.3"/>
<text x="462.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">смуга 0</text>
<rect x="470.0" y="130.0" width="240.0" height="60.0" rx="0" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.3"/>
<text x="462.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">смуга 1</text>
<rect x="470.0" y="190.0" width="240.0" height="60.0" rx="0" fill="#fff3e0" stroke="#b9770e" stroke-width="1.3"/>
<text x="462.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">смуга 2</text>
<rect x="470.0" y="250.0" width="240.0" height="60.0" rx="0" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.3"/>
<text x="462.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">смуга 3</text>
<rect x="470.0" y="310.0" width="240.0" height="60.0" rx="0" fill="#fff3e0" stroke="#b9770e" stroke-width="1.3"/>
<text x="462.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">смуга 4</text>
<circle cx="590.0" cy="190.0" r="40.0" fill="none" stroke="#1f78b4" stroke-width="2.4"/>
<line x1="470.0" y1="190.0" x2="710.0" y2="190.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,4"/>
<text x="590.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f78b4" text-anchor="middle" font-weight="700">коло на стику смуг 1|2</text>
<text x="720.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">межа</text>
<rect x="50.0" y="80.0" width="380.0" height="300.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="240.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">як обробляється кожна смуга</text>
<text x="70.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">для кожної смуги s:</text>
<text x="70.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   clear(buf)               // малий буфер W×sh</text>
<text x="70.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   встав межі вікна: y0=s·sh … y1</text>
<text x="70.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   намалюй у buf усі елементи,</text>
<text x="70.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">      обрізавши їх до цієї смуги</text>
<text x="70.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   виштовхни buf у GRAM (RAMWR)</text>
<line x1="70.0" y1="312.0" x2="410.0" y2="312.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="240.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="240.0" dy="0.0">коло перетинає межу → його верхня дуга</tspan><tspan x="240.0" dy="13.2">малюється у смузі 1, нижня — у смузі 2:</tspan><tspan x="240.0" dy="13.2">двічі порахований, кожен раз обрізаний</tspan></text>
<text x="390.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ціна економії RAM — втрата довільного доступу: малюєш з оглядкою на поточну смугу</text>
</svg>