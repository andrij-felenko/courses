<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контролер прокидається не там, де потрібно</text>
<rect x="60.0" y="96.0" width="170.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="145.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">RESET</text>
<text x="145.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">регістри в дефолті</tspan><tspan x="145.0" dy="13.0">пам'ять — сміття</tspan></text>
<rect x="300.0" y="96.0" width="170.0" height="96.0" rx="6" fill="#fff8e6" stroke="#b9770e" stroke-width="2.0"/>
<text x="385.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">СОН</text>
<text x="385.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="385.0" dy="0.0">матриця знеструмлена</tspan><tspan x="385.0" dy="13.0">екран темний</tspan></text>
<rect x="540.0" y="96.0" width="170.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="625.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ЖИВИЙ</text>
<text x="625.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="625.0" dy="0.0">освіження йде</tspan><tspan x="625.0" dy="13.0">пікселі видно</tspan></text>
