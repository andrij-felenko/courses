<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="415.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">E-ink зблизька: чому повільно і чому «блимає» при оновленні</text>
<text x="415.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">частинка повзе в'язкою рідиною (звідси мілісекунди), а щоб прибрати привид — скидання</text>
<text x="210.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс сил на частинці</text>
<rect x="90.0" y="108.0" width="240.0" height="190.0" rx="8" fill="#f4fbff" stroke="#7fa9c4" stroke-width="1.6"/>
<circle cx="210.0" cy="210.0" r="20.0" fill="#2b2f33" stroke="#2b2f33" stroke-width="1.0"/>
<circle cx="220.0" cy="200.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="220.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="210.0" y1="186.0" x2="210.0" y2="136.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="218.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">F = qE (поле тягне)</text>
<line x1="210.0" y1="234.0" x2="210.0" y2="276.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="218.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">6πηr·v (в'язкість гальмує)</text>
<text x="210.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рівновага → стала швидкість v</text>
<text x="210.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">v = qE / (6πηr)   →   час ≈ d / v</text>
<text x="210.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">в'язке середовище → v мале → десятки–сотні мс</text>
<text x="620.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвиля оновлення пікселя</text>
<line x1="430.0" y1="250.0" x2="780.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="778.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">час →</text>
<line x1="430.0" y1="206.0" x2="430.0" y2="294.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="422.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">+V</text>
<text x="422.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">−V</text>
<line x1="430.0" y1="250.0" x2="780.0" y2="250.0" stroke="#e4e4e4" stroke-width="1.0"/>
<line x1="430.0" y1="214.0" x2="470.0" y2="214.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="470.0" y1="214.0" x2="470.0" y2="250.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="450.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">скид</text>
<line x1="470.0" y1="286.0" x2="510.0" y2="286.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="510.0" y1="286.0" x2="510.0" y2="250.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 2"/>
<line x1="510.0" y1="214.0" x2="550.0" y2="214.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="550.0" y1="214.0" x2="550.0" y2="250.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 2"/>
<line x1="550.0" y1="286.0" x2="590.0" y2="286.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="590.0" y1="286.0" x2="590.0" y2="250.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="570.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">→ білий/чорний блимає</text>
<line x1="590.0" y1="250.0" x2="640.0" y2="250.0" stroke="#6b7280" stroke-width="3.0"/>
<line x1="640.0" y1="250.0" x2="640.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="615.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">пауза</text>
<line x1="640.0" y1="286.0" x2="730.0" y2="286.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="730.0" y1="286.0" x2="730.0" y2="250.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="685.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">запис</text>
<text x="510.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">інверсії стирають привид</text>
<text x="620.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Тому повне оновлення «моргає» чорним/білим: інакше лишиться привид (ghosting).</text>
<text x="415.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Бістабільність — платня натурою: між кадрами струму 0, зате перемикання повільне і з ритуалом скидання.</text>
</svg>