<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Лампа світить завжди (звідси й споживання), а заслінка лише дозує, скільки пройде.</text>
<text x="390.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«Чорний» — це закрита заслінка, та трохи світла все одно протікає: чорний виходить сіруватим.</text>
