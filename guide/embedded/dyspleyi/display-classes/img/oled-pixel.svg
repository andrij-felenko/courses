<polyline points="520,290 560,287 600,274 640,244 690,190 745,150" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="6 4"/>
<text x="745.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">постарілий</text>
<text x="610.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">той самий код DATA → менший струм → тьмяніший і зсунутий колір</text>
<text x="400.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Тому в AMOLED навколо пікселя ставлять не 2, а 4–7 транзисторів — щоб виміряти й скомпенсувати дрейф.</text>
