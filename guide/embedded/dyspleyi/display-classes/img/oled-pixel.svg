<text x="150.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">T1 записав напругу в Cs → Cs тримає її на затворі T2 →</text>
<text x="150.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">T2 жене СТАЛИЙ струм крізь OLED увесь кадр.</text>
