<text x="400.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піксель AMOLED: транзистор задає СТРУМ, а не заслінку</text>
<text x="400.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">яскравість = струм крізь органіку; тому дрейф порога транзистора прямо псує колір</text>
