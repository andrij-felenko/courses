<text x="420.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди витратити 256 кодів: порівну по світлу чи порівну по оку</text>
<text x="420.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">око гостріше в тінях; лінійний крок там завеликий — проступають смуги (banding)</text>
