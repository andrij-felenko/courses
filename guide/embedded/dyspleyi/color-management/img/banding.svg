<text x="420.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Гама-кодування дарує тіням більше кодів — там, де око прискіпливіше. Те саме число біт, кращий вигляд.</text>
