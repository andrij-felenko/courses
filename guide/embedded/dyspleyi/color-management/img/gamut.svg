<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колірне охоплення: який шматок видимих кольорів панель узагалі вміє</text>
<text x="380.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вершини трикутника — три первинні кольори панелі; усе всередині вона може змішати</text>
<polygon points="206.1,410.0 176.4,344.0 166.5,278.0 173.1,212.0 199.5,152.6 249.0,113.0 298.5,136.1 331.5,179.0 354.6,228.5 367.8,284.6 374.4,337.4 367.8,383.6 331.5,403.4 282.0,410.0" fill="#eef1f4" stroke="#b8c2cb" stroke-width="1.4"/>
<text x="216.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усі видимі кольори</text>
<polygon points="361.2,350.6 249.0,212.0 199.5,390.2" fill="#7fa9c4" fill-opacity="0.18" stroke="#1a1a1a" stroke-width="2.4"/>
<polygon points="331.5,340.7 258.9,245.0 209.4,377.0" fill="#e08f86" fill-opacity="0.18" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 4"/>
<circle cx="361.2" cy="350.6" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="249.0" cy="212.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="199.5" cy="390.2" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<rect x="515.0" y="110.0" width="28.0" height="14.0" rx="2" fill="#7fa9c4" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="550.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">стандарт sRGB</text>
<rect x="515.0" y="138.0" width="28.0" height="14.0" rx="2" fill="#e08f86" stroke="#c0392b" stroke-width="1.4"/>
<text x="550.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">дешева панель</text>
<text x="515.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">Менший трикутник =</text>
<text x="515.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">панель не дотягує до</text>
<text x="515.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">насичених кольорів —</text>
<text x="515.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">вони виходять блякліші.</text>
<text x="380.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий код кольору на ширшій і вужчій панелі дасть різний відтінок — ось чому потрібен спільний еталон.</text>
</svg>