<text x="603.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="603.0" dy="0.0">далі наступні</tspan><tspan x="603.0" dy="10.1">рядки так само</tspan></text>
