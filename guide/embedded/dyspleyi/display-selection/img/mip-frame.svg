<text x="260.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="260.0" dy="0.0">номер рядка</tspan><tspan x="260.0" dy="10.1">(з 1)</tspan></text>
