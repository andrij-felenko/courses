<text x="706.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">0x0000</text>
<text x="706.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="706.0" dy="0.0">два нулі —</tspan><tspan x="706.0" dy="10.1">кінець кадру</tspan></text>
<line x1="648.0" y1="101.0" x2="652.0" y2="101.0" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="764.0" y="74.0" width="78.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#0e7c7b" stroke-width="1.8"/>
<text x="803.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0e7c7b" text-anchor="middle" font-weight="700">CS↓</text>
<text x="803.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="803.0" dy="0.0">SCS стає</tspan><tspan x="803.0" dy="10.1">НИЗЬКИМ</tspan></text>
<line x1="760.0" y1="101.0" x2="764.0" y2="101.0" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="40.0" y="190.0" width="780.0" height="44.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="430.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">CS активний ВИСОКИМ рівнем — навпаки до звичайного SPI</text>
<text x="430.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">тримати CS високим весь кадр і опустити наприкінці; забудеш опустити — панель не зафіксує запис</text>
<rect x="40.0" y="244.0" width="780.0" height="44.0" rx="6" fill="#fff8e6" stroke="#b9770e" stroke-width="1.5"/>
<text x="430.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Біти йдуть МОЛОДШИМ уперед (LSB-first)</text>
<text x="430.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">командний байт, адресу й пікселі шлють дзеркально до звичного MSB-first — або перевертай байти в коді</text>
<text x="430.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">весь кадр — це командний байт, тоді пари «адреса + рядок пікселів + нуль», і два нулі під кінець</text>
<text x="430.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">малюєш лише змінені рядки — решту не чіпаєш, і панель тримає їх сама</text>
