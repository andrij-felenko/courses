<text x="294.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="130.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="288.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="282.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="170.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="276.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="190.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="270.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="200.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">іони дрейфують і осідають на електроді</text>
<rect x="60.0" y="202.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.3"/><text x="200.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="200.0" dy="0.0">→ електрохімічний розклад,</tspan><tspan x="200.0" dy="13.0">залишкова поляризація, мертві пікселі</tspan></text>
<text x="580.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З інверсією COM</text>
<rect x="440.0" y="74.0" width="280.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="580.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">знак періодично перевертається</text>
<polyline points="460,150 490,150 490,120 550,120 550,150 610,150 610,120 670,120 670,150 700,150" fill="none" stroke="#27ae60" stroke-width="2.2"/>
<text x="580.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">середня напруга на РК = 0</text>
<rect x="440.0" y="202.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="580.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="580.0" dy="0.0">→ іони не встигають осісти,</tspan><tspan x="580.0" dy="13.0">рідкий кристал живе роками</tspan></text>
<text x="390.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи вмикати інверсію (вибирає вивід EXTMODE):</text>
<rect x="60.0" y="292.0" width="320.0" height="80.0" rx="6" fill="#e8f6f5" stroke="#0e7c7b" stroke-width="1.8"/>
<text x="220.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0e7c7b" text-anchor="middle" font-weight="700">апаратний  ·  EXTMODE = 1</text>
<text x="220.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="220.0" dy="0.0">окремий вивід EXTCOMIN;</tspan><tspan x="220.0" dy="11.2">мікроконтролер (чи RC/лічильник) смикає</tspan><tspan x="220.0" dy="11.2">його 1–60 Гц навіть без оновлень</tspan></text>
<rect x="400.0" y="292.0" width="320.0" height="80.0" rx="6" fill="#eef4f8" stroke="#1f78b4" stroke-width="1.8"/>
<text x="560.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f78b4" text-anchor="middle" font-weight="700">програмний  ·  EXTMODE = 0</text>
<text x="560.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">окремого виводу нема; біт інверсії</tspan><tspan x="560.0" dy="11.2">їде в командному байті кожного кадру —</tspan><tspan x="560.0" dy="11.2">треба слати кадр регулярно</tspan></text>
</svg>