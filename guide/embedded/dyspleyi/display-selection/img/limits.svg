<rect x="540.0" y="56.0" width="210.0" height="44.0" rx="6" fill="#eaf2f8" stroke="#1f78b4" stroke-width="2.0"/>
<text x="645.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f78b4" text-anchor="middle" font-weight="700">TFT-LCD</text>
<text x="35.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">мороз</text>
<rect x="40.0" y="120.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.3"/><text x="145.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle"><tspan x="145.0" dy="0.0">кольоровий не оживе &lt; 0 °C;</tspan><tspan x="145.0" dy="13.0">монохром — широкотемп.</tspan></text>
<rect x="290.0" y="120.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="395.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="395.0" dy="0.0">тримає холод</tspan><tspan x="395.0" dy="13.0">краще за LCD</tspan></text>
<rect x="540.0" y="120.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.3"/><text x="645.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="645.0" dy="0.0">вʼязкість росте —</tspan><tspan x="645.0" dy="13.0">картинка розмазується</tspan></text>
<text x="35.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">спека</text>
<rect x="40.0" y="210.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="145.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="145.0" dy="0.0">здебільшого</tspan><tspan x="145.0" dy="13.0">стерпно</tspan></text>
<rect x="290.0" y="210.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.3"/><text x="395.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="395.0" dy="0.0">крадe ресурс —</tspan><tspan x="395.0" dy="13.0">органіка старіє швидше</tspan></text>
<rect x="540.0" y="210.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.3"/><text x="645.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle"><tspan x="645.0" dy="0.0">падає контраст,</tspan><tspan x="645.0" dy="13.0">росте старіння</tspan></text>
<text x="28.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">роки статики</text>
<rect x="40.0" y="300.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="145.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="145.0" dy="0.0">ідеально —</tspan><tspan x="145.0" dy="13.0">статика для нього</tspan></text>
<rect x="290.0" y="300.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.3"/><text x="395.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="395.0" dy="0.0">вигоряння: диференційне</tspan><tspan x="395.0" dy="13.0">старіння пікселів</tspan></text>
<rect x="540.0" y="300.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="645.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="645.0" dy="0.0">статики не</tspan><tspan x="645.0" dy="13.0">боїться зовсім</tspan></text>
<text x="390.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">прилад для країв діапазону часто вимагає іншого класу, ніж той самий для кімнати</text>
</svg>