<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергія: живлення × вміст</text>
<text x="430.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">статичний вміст</text>
<text x="660.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">динамічний вміст</text>
<text x="180.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">батарея</text>
<text x="180.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">мережа</text>
<rect x="206.0" y="76.0" width="218.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.8"/>
<text x="315.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="middle" font-weight="700">e-ink</text>
<text x="315.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="315.0" dy="0.0">у спокої не їсть</tspan><tspan x="315.0" dy="11.9">нічого — тижні й місяці</tspan></text>
<rect x="436.0" y="76.0" width="218.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#7d3c98" stroke-width="1.8"/>
<text x="545.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">OLED, темна тема</text>
<text x="545.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="545.0" dy="0.0">світло лише там,</tspan><tspan x="545.0" dy="11.9">де треба</tspan></text>
<rect x="206.0" y="186.0" width="218.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="315.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">будь-що зручне</text>
<text x="315.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="315.0" dy="0.0">енергія не тисне</tspan></text>
<rect x="436.0" y="186.0" width="218.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="545.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">будь-що зручне</text>
<text x="545.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="545.0" dy="0.0">бери за іншими</tspan><tspan x="545.0" dy="11.9">критеріями</tspan></text>
<text x="360.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">найжорсткіший кут — батарея плюс статика: тут e-ink поза конкуренцією</text>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">важить не лише який екран, а й робочий цикл — яку частку часу він світить</text>
</svg>