<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один піксель MIP: біт памʼяті сидить під самою заслінкою</text>
<text x="190.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f78b4" text-anchor="middle" font-weight="700">звичайний TFT-піксель</text>
<rect x="60.0" y="78.0" width="260.0" height="210.0" rx="6" fill="#eef4f8" stroke="#1f78b4" stroke-width="1.8"/>
<rect x="80.0" y="100.0" width="220.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1f78b4" stroke-width="1.3"/><text x="190.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f78b4" text-anchor="middle"><tspan x="190.0" dy="0.0">транзистор доступу</tspan></text>
<rect x="80.0" y="150.0" width="220.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">конденсатор тримає</tspan><tspan x="190.0" dy="13.7">АНАЛОГОВУ напругу</tspan></text>
<text x="190.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">заряд стікає за мілісекунди</text>
<rect x="80.0" y="226.0" width="220.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="190.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">→ мусить оновлюватись</tspan><tspan x="190.0" dy="13.0">десятки разів на секунду</tspan></text>
<text x="560.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0e7c7b" text-anchor="middle" font-weight="700">піксель MIP</text>
<rect x="430.0" y="78.0" width="270.0" height="210.0" rx="6" fill="#e8f6f5" stroke="#0e7c7b" stroke-width="2.0"/>
<rect x="450.0" y="100.0" width="230.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#0e7c7b" stroke-width="1.3"/><text x="565.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0e7c7b" text-anchor="middle"><tspan x="565.0" dy="0.0">1-бітна комірка SRAM</tspan><tspan x="565.0" dy="13.7">(два інвертори-засувка)</tspan></text>
<rect x="450.0" y="154.0" width="230.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#0e7c7b" stroke-width="1.3"/><text x="565.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">біт тримає стан САМ,</tspan><tspan x="565.0" dy="13.7">поки є живлення</tspan></text>
<text x="565.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">нічого не стікає — нема що оновлювати</text>
<rect x="450.0" y="226.0" width="230.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="565.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="565.0" dy="0.0">→ картинка стоїть даром,</tspan><tspan x="565.0" dy="13.0">оновлення — лише коли хочеш</tspan></text>
<line x1="60.0" y1="306.0" x2="700.0" y2="306.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="380.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">над кожним пікселем — та сама відбивна РК-заслінка: біт лише каже їй «пропускати світло чи ні»</text>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">підсвітки немає — екран світиться відбитим навколишнім світлом, як папір</text>
</svg>