<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граничні умови автомата: де він збивається й як відновлюється</text>
<rect x="15.0" y="62.0" width="250.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">B5 62 всередині даних</tspan></text>
<rect x="15.0" y="112.0" width="250.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">у payload трапилась пара</tspan><tspan x="140.0" dy="15.0">B5 62 як звичайні байти</tspan></text>
<line x1="140.0" y1="182.0" x2="140.0" y2="208.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="15.0" y="210.0" width="250.0" height="90.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="140.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">довжина веде облік — автомат</tspan><tspan x="140.0" dy="13.7">у стані GET_PAYLOAD НЕ шукає</tspan><tspan x="140.0" dy="13.7">сигнатуру, лічить байти → не збивається</tspan></text>
<rect x="285.0" y="62.0" width="250.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">брехлива довжина</tspan></text>
<rect x="285.0" y="112.0" width="250.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">шум зіпсував поле length →</tspan><tspan x="410.0" dy="15.0">велетенське число (напр. 60000)</tspan></text>
<line x1="410.0" y1="182.0" x2="410.0" y2="208.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="285.0" y="210.0" width="250.0" height="90.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="410.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">перевірка len ≤ sizeof(buf):</tspan><tspan x="410.0" dy="15.0">не влазить → скидання у WAIT_B5,</tspan><tspan x="410.0" dy="15.0">чекаємо нову сигнатуру</tspan></text>
<rect x="555.0" y="62.0" width="250.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">пачку обірвано</tspan></text>
<rect x="555.0" y="112.0" width="250.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">модуль перезавантажився</tspan><tspan x="680.0" dy="15.0">посеред пакета — решта не прийде</tspan></text>
<line x1="680.0" y1="182.0" x2="680.0" y2="208.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="210.0" width="250.0" height="90.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="680.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">таймер міжбайтового простою:</tspan><tspan x="680.0" dy="15.0">мовчання &gt; T → скидання автомата,</tspan><tspan x="680.0" dy="15.0">щоб напівпакет не завис навічно</tspan></text>
<rect x="90.0" y="322.0" width="640.0" height="54.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/><text x="410.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Спільний принцип: автомат ніколи не довіряє потоку сліпо. Довжина обмежена стелею буфера,</tspan><tspan x="410.0" dy="14.3">контрольна сума відкидає биті пакети, а таймер рятує від вічного зависання на обірваній пачці.</tspan><tspan x="410.0" dy="14.3">Будь-який збій → детермінований відкат у пошук сигнатури, без витоків стану.</tspan></text>
</svg>