<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">GNSS-модуль: усе рахує сам, назовні — лише UART</text>
<circle cx="50.0" cy="70.0" r="7.0" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/>
<circle cx="95.0" cy="96.0" r="7.0" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/>
<circle cx="70.0" cy="70.0" r="7.0" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/>
<text x="80.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">супутники</text>
<line x1="80.0" y1="130.0" x2="118.0" y2="168.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="130.0" y="150.0" width="300.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="280.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">GNSS-модуль (u-blox NEO-M8/M9)</text>
<text x="280.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">антена + радіочастина</text>
<text x="280.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">власний процесор:</text>
<text x="280.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ефемериди · трилатерація · Δt</text>
<text x="280.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1–10 разів/с видає готове рішення</text>
<rect x="560.0" y="175.0" width="160.0" height="100.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.8"/>
<text x="640.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">мікроконтролер</text>
<text x="640.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(наша прошивка):</text>
<text x="640.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">РОЗБИРАЄ потік</text>
<line x1="434.0" y1="205.0" x2="556.0" y2="205.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="499.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">TX  готові дані</text>
<line x1="556.0" y1="245.0" x2="434.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="499.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">RX  налаштування</text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Усе до UART-виводу — не наше; наше починається на потоці байтів</text>
</svg>