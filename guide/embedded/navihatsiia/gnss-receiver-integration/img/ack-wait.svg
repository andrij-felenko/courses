<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надіслати CFG і дочекатися: ACK-очікування з таймаутом і ретраєм</text>
<rect x="310.0" y="116.0" width="260.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">шлю CFG-команду →</tspan><tspan x="440.0" dy="15.6">кручу приймання, ловлю ACK</tspan><tspan x="440.0" dy="15.6">на цей class/id (таймер тікає)</tspan></text>
<line x1="570.0" y1="140.0" x2="650.0" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="654.0" y="88.0" width="190.0" height="44.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.5"/><text x="749.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0.0">ACK-ACK →</tspan><tspan x="749.0" dy="15.6">крок ОК, далі</tspan></text>
<line x1="570.0" y1="160.0" x2="650.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="654.0" y="170.0" width="190.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="749.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0.0">ACK-NAK →</tspan><tspan x="749.0" dy="15.6">команда відкинута</tspan></text>
<line x1="310.0" y1="172.0" x2="226.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="36.0" y="190.0" width="200.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="136.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">таймаут (ACK не прийшов):</tspan><tspan x="136.0" dy="15.0">ретрай, поки спроб &lt; N</tspan></text>
<line x1="276.0" y1="190.0" x2="350.0" y2="170.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="136.0" y1="238.0" x2="136.0" y2="270.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="36.0" y="272.0" width="200.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="136.0" y="288.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">спроби вичерпано →</tspan><tspan x="136.0" dy="15.0">стоп у помилку модуля</tspan></text>
<rect x="90.0" y="334.0" width="700.0" height="44.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/><text x="440.0" y="352.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Причина, чому не можна слати наосліп: на 9600 бод старт-пакети легко губляться, а на неправильному</tspan><tspan x="440.0" dy="13.7">поколінні модуль відповість суцільним NAK. Підтвердження перетворює «сподіваюся, дійшло» на «знаю, що дійшло».</tspan></text>
</svg>