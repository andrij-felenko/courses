<text x="164.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2 · цикл: годуй автомат по байту</text>
<text x="164.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ubx_feed(byte) — неблокуючий; сума Флетчера копиться на льоту</text>
