<text x="164.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">fixType≥3 &amp; gnssFixOK &amp; numSV &amp; pDOP &amp; hAcc &amp; свіжість</text>
<line x1="410.0" y1="355.0" x2="410.0" y2="373.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
