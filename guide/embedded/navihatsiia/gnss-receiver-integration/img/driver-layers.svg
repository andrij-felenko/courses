<rect x="34.0" y="62.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="82.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.0" dy="0.0">СТАРТ:</tspan><tspan x="82.0" dy="13.0">конфіг по RX</tspan></text>
<text x="82.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MON-VER →</text>
