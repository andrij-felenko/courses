<text x="82.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">CFG-VALSET</text>
<text x="82.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">чекай ACK</text>
<line x1="130.0" y1="91.0" x2="148.0" y2="169.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен шар має одну відповідальність; збій на будь-якому не валить сусідні. Довіру дає лише шар 4.</text>
