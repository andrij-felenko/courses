<rect x="150.0" y="218.0" width="520.0" height="58.0" rx="6" fill="#eafaf1" stroke="#bfe6cf" stroke-width="1.8"/>
<text x="164.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3 · декодер NAV-PVT за зсувами</text>
<text x="164.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">memcpy кожного поля з буфера → без strict-aliasing і пакування</text>
<line x1="410.0" y1="277.0" x2="410.0" y2="295.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="296.0" width="520.0" height="58.0" rx="6" fill="#bfe6cf" stroke="#c0392b" stroke-width="1.8"/>
