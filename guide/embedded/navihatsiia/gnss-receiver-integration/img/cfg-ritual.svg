<rect x="39.0" y="300.0" width="130.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="104.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">ORDER-критично:</tspan><tspan x="104.0" dy="12.3">змінив швидкість —</tspan><tspan x="104.0" dy="12.3">перемкнись і сам</tspan></text>
<rect x="90.0" y="358.0" width="620.0" height="52.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.5"/><text x="400.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Кожна CFG-команда — не «вистрелив і забув»: модуль відповідає ACK-ACK на прийняту або ACK-NAK</tspan><tspan x="400.0" dy="13.7">на відкинуту. Драйвер чекає підтвердження з таймаутом і ретраєм; без ACK крок вважається невдалим.</tspan><tspan x="400.0" dy="13.7">Найтонше місце — зміна швидкості: після неї весь подальший діалог іде вже на новій швидкості.</tspan></text>
