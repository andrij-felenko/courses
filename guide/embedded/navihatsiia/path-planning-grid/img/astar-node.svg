<text x="480.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">з НАЙМЕНШИМ f</text>
<text x="480.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">= найперспективнішу</text>
<text x="370.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">g тягне назад до старту (обережність), h тягне вперед до цілі (жадібність); їхня сума f — розумний баланс</text>
