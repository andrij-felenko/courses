<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Корен і Боренштайн відреклися від власного улюбленого методу</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чотири вади, що випливають із самої ідеї «складати сили» (ICRA 1991)</text>
<rect x="17.0" y="118.0" width="168.0" height="134.0" rx="8" fill="#fff7f6" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="41.0" cy="140.0" r="13.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="41.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="111.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="111.0" dy="0.0">пастка в куті</tspan></text>
<text x="101.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="101.0" dy="0.0">у ввігнутій перешкоді сили</tspan><tspan x="101.0" dy="13.7">гасяться — апарат застигає</tspan></text>
<rect x="203.0" y="118.0" width="168.0" height="134.0" rx="8" fill="#fff7f6" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="227.0" cy="140.0" r="13.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="227.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="297.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="297.0" dy="0.0">тремтіння</tspan></text>
<text x="287.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">у вузькому проході кермо</tspan><tspan x="287.0" dy="13.7">сіпається зиґзаґом</tspan></text>
<rect x="389.0" y="118.0" width="168.0" height="134.0" rx="8" fill="#fff7f6" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="413.0" cy="140.0" r="13.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="413.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="483.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="483.0" dy="0.0">не проходить</tspan><tspan x="483.0" dy="16.2">у щілину</tspan></text>
<text x="473.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="473.0" dy="0.0">між близькими перешкодами</tspan><tspan x="473.0" dy="13.7">поштовх відкидає геть</tspan></text>
<rect x="575.0" y="118.0" width="168.0" height="134.0" rx="8" fill="#fff7f6" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="599.0" cy="140.0" r="13.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="599.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="669.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="669.0" dy="0.0">коливання</tspan></text>
<text x="659.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="659.0" dy="0.0">перед перешкодою в лоб сила</tspan><tspan x="659.0" dy="13.7">різко вмикається й гасне</tspan></text>
<text x="380.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жодна — не помилка коду; усі — прямий наслідок принципу. Тому знадобився інший принцип.</text>
</svg>