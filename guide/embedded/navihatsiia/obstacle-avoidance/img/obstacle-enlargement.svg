<text x="590.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">щілина &lt; 2R «затяглася» — точка туди не піде</text>
