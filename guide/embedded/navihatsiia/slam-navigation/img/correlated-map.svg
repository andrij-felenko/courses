<rect x="70.0" y="392.0" width="620.0" height="64.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Кожен орієнтир нанесено З ПОЛОЖЕННЯ робота — тож у всіх «зашита» одна</tspan><tspan x="380.0" dy="15.0">й та сама помилка його пози (зелені хмари знесені узгоджено, не врізнобій).</tspan><tspan x="380.0" dy="15.0">Виміряй один орієнтир точно — і ти оцінив спільну помилку: стискаються</tspan><tspan x="380.0" dy="15.0">хмари ВСІХ орієнтирів і самої пози. Це й робить карту єдиним цілим.</tspan></text>
