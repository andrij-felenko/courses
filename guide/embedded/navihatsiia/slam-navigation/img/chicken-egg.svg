<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта й положення замкнені одне на одне</text>
<rect x="145.2" y="143.8" width="139.6" height="62.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ПОЛОЖЕННЯ</tspan><tspan x="215.0" dy="19.5">(де я зараз)</tspan></text>
<rect x="465.9" y="143.8" width="158.2" height="62.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">КАРТА</tspan><tspan x="545.0" dy="19.5">(де орієнтири)</tspan></text>
<line x1="459.9" y1="149.0" x2="290.8" y2="149.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">маючи карту — знаю, де я</text>
<line x1="290.8" y1="201.0" x2="459.9" y2="201.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">знаючи, де я — наношу орієнтир</text>
<text x="380.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<line x1="215.0" y1="212.2" x2="227.7" y2="264.9" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="545.0" y1="212.2" x2="532.3" y2="264.9" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="197.7" y="270.9" width="364.5" height="58.2" rx="6" fill="#fff8e1" stroke="#9a7d0a" stroke-width="1.5"/><text x="380.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">SLAM: оцінюй ОБИДВА водночас —</tspan><tspan x="380.0" dy="18.2">одні дані правлять і карту, і положення</tspan></text>
<rect x="70.0" y="372.0" width="620.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="392.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Класична безвихідь: щоб скласти карту, треба точно знати своє положення;</tspan><tspan x="380.0" dy="15.6">щоб знати положення — треба вже мати карту з орієнтирами. Жодне не дано</tspan><tspan x="380.0" dy="15.6">першим. SLAM не розриває коло вибором «що раніше», а тримає обидві</tspan><tspan x="380.0" dy="15.6">невідомі в одній оцінці й уточнює їх спільно з кожним новим виміром.</tspan></text>
</svg>