<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінювач як частотний поділ праці між давачами</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">низькі частоти тримає акселерометр (абсолют), високі — гіроскоп (динаміка)</text>
<line x1="90.0" y1="300.0" x2="816.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="814.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">частота</text>
<line x1="430.0" y1="96.0" x2="430.0" y2="308.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="430.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">частота поділу  f_поділу ≈ (1−α)/(2π·α·Δt)</text>
<rect x="90.0" y="150.0" width="340.0" height="60.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="260.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">АКСЕЛЕРОМЕТР — низькі частоти</text>
<text x="260.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">абсолютний горизонт, не спливає</text>
<rect x="430.0" y="150.0" width="380.0" height="60.0" rx="9" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="620.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ГІРОСКОП — високі частоти</text>
<text x="620.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">чиста швидка динаміка маневру</text>
<text x="260.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тут акселерометр брудний:</text>
<text x="260.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вібрація, прискорення маневру</text>
<text x="620.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тут гіроскоп бреше:</text>
<text x="620.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дрейф інтеграла зміщення</text>
<rect x="150.0" y="366.0" width="600.0" height="58.0" rx="11" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/>
<text x="450.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ = α·(θ_попер + ω·Δt)  +  (1−α)·θ_акс</text>
<text x="450.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">гіро несе високі · акселерометр підрізає дрейф на низьких — сума без діри й задвоєння</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">α — не магічне число, а фізична межа довіри: зсунеш f_поділу — переділиш роботу між давачами.</text>
</svg>