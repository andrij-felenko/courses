<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому потрібен зворотний зв'язок: розімкнено проти замкнено</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">однакове збурення; ліворуч — команда наосліп, праворуч — вимір, порівняння, корекція</text>
<rect x="60.0" y="86.0" width="360.0" height="220.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">РОЗІМКНЕНО — без зворотного зв'язку</text>
<line x1="80.0" y1="296.0" x2="404.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="404.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час</text>
<line x1="80.0" y1="190.0" x2="408.0" y2="190.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="84.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">уставка 0°</text>
<polyline points="84,190 140,186 185,178 228,166 270,148 312,122 350,106 398,98" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
<text x="240.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кут утікає → апарат падає</text>
<rect x="470.0" y="86.0" width="360.0" height="220.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="650.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАМКНЕНО — зі зворотним зв'язком</text>
<line x1="490.0" y1="296.0" x2="814.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="814.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час</text>
<line x1="490.0" y1="190.0" x2="818.0" y2="190.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="494.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">уставка 0°</text>
<polyline points="492,190 520,150 546,138 576,158 614,178 656,188 706,191 824,190" fill="none" stroke="#27ae60" stroke-width="2.4" stroke-linejoin="round"/>
<text x="650.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">кут повертається до уставки</text>
<text x="440.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий поштовх: без зворотного зв'язку похибка накопичується, із ним — гаситься. Уся автономність тримається на цій лінії.</text>
</svg>