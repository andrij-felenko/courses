<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо окремий оцінювач: жоден давач сам не дає «стану»</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">сильне одного закриває слабке іншого; дещо не міряє ніхто — це оцінюють</text>
<rect x="40.0" y="81.0" width="310.0" height="58.0" rx="9" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="56.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Гіроскоп — кутова швидкість</text>
<text x="56.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">✗ кут із нього дрейфує</text>
<line x1="350.0" y1="110.0" x2="396.0" y2="240.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40.0" y="156.0" width="310.0" height="58.0" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="56.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Акселерометр — нахил (вниз)</text>
<text x="56.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">✗ трясеться від вібрації</text>
<line x1="350.0" y1="185.0" x2="396.0" y2="240.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40.0" y="231.0" width="310.0" height="58.0" rx="9" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="56.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Магнітометр — курс (північ)</text>
<text x="56.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">✗ плутає залізо й струми</text>
<line x1="350.0" y1="260.0" x2="396.0" y2="240.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="40.0" y="306.0" width="310.0" height="58.0" rx="9" fill="#ffffff" stroke="#d98a00" stroke-width="1.5"/>
<text x="56.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d98a00" text-anchor="start" font-weight="700">GNSS — положення, швидкість</text>
<text x="56.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">✗ повільний, не всюди</text>
<line x1="350.0" y1="335.0" x2="396.0" y2="240.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="400.0" y="120.0" width="150.0" height="240.0" rx="11" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="475.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">ОЦІНЮВАЧ</tspan><tspan x="475.0" dy="16.9">СТАНУ</tspan><tspan x="475.0" dy="16.9">(поєднання)</tspan></text>
<line x1="550.0" y1="240.0" x2="596.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="600.0" y="150.0" width="280.0" height="180.0" rx="11" fill="#eafaef" stroke="#27ae60" stroke-width="1.7"/>
<text x="618.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">СТАН (чистий, надійний):</text>
<text x="618.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">крен · тангаж · курс</text>
<text x="618.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">висота · положення · швидкість</text>
<text x="618.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+ те, чого не міряє жоден давач</text>
<text x="618.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">(напр. швидкість вітру) — оцінюється</text>
<text x="450.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Оцінювач — це не «згладжування»: він поєднує давачі й виводить навіть те, що напряму не вимірюється.</text>
</svg>