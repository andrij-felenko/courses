<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нульовий пункт — домівка: зсув номерів і ціль DO_JUMP</text>
<rect x="150.0" y="60.0" width="470.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="166.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">seq 0</text>
<text x="242.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">HOME (домівка)</text>
<text x="608.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">ставить автопілот сам</text>
<rect x="150.0" y="100.0" width="470.0" height="34.0" rx="6" fill="#eef3fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="166.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">seq 1</text>
<text x="242.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">NAV_TAKEOFF</text>
<text x="608.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">перша ТВОЯ команда</text>
<rect x="150.0" y="140.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="166.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">seq 2</text>
<text x="242.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">NAV_WAYPOINT</text>
<text x="608.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">початок ланки ← ціль DO_JUMP</text>
<rect x="150.0" y="180.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="166.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">seq 3</text>
<text x="242.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">NAV_WAYPOINT</text>
<rect x="150.0" y="220.0" width="470.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="166.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">seq 4</text>
<text x="242.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">DO_JUMP → 2</text>
<text x="608.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">стрибок на seq 2, не на 1!</text>
<rect x="150.0" y="260.0" width="470.0" height="34.0" rx="6" fill="#eef3fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="166.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">seq 5</text>
<text x="242.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">NAV_RETURN_TO_LAUNCH</text>
<text x="608.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">додому</text>
<path d="M 150 237 C 70 237, 70 157, 146 157" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="380.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">масив, що ти шлеш, нумерується з 0; але seq 0 на борту — це home, тож твоя перша команда стає seq 1</text>
</svg>