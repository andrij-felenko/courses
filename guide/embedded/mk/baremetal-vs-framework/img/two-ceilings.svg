<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стелі швидкості: обгортка знімається, шина лишається</text>
<line x1="150.0" y1="280.0" x2="150.0" y2="62.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">швидше →</text>
<line x1="150.0" y1="210.0" x2="700.0" y2="210.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="700.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">стеля APB ≈ 3–4 МГц</text>
<text x="164.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">фізична: регістр GPIO на шині 80 МГц</text>
<line x1="150.0" y1="250.0" x2="700.0" y2="250.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="700.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">digitalWrite: ще ×3 накладних</text>
<line x1="150.0" y1="78.0" x2="700.0" y2="78.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="2,4"/>
<text x="700.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-style="italic">ядро 240 МГц (недосяжно для ніжки на APB)</text>
<rect x="297.6" y="125.3" width="274.8" height="49.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="435.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">прибрати обгортку — здолати нижню стелю;</tspan><tspan x="435.0" dy="14.3">верхню (шину) вона не рухає</tspan></text>
</svg>