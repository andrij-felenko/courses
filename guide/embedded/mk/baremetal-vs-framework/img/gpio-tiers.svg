<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три поверхи швидкості GPIO на ESP32</text>
<text x="236.0" y="114.0" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="end">digitalWrite(2, HIGH)</text>
<rect x="250.0" y="96.0" width="117.6" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="260.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">обгортка над IDF · ~58 тактів на виклик</text>
<text x="236.0" y="180.0" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="end">REG_WRITE(W1TS, 1&lt;&lt;2)</text>
<rect x="250.0" y="162.0" width="231.0" height="34.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<text x="260.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="start" font-weight="700">прямий запис у регістр APB · стеля ~3–4 МГц</text>
<text x="236.0" y="246.0" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="end">dedic_gpio (CSR, S2/S3)</text>
<rect x="250.0" y="228.0" width="420.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="260.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">повз APB, прямо з ядра · десятки МГц</text>
<text x="380.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ключ не в «менше абстракцій», а в «інший механізм заліза»:</tspan><tspan x="380.0" dy="14.3">швидкість дає правильний шлях даних у чипі, а не відмова від обгортки</tspan></text>
</svg>