<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення маркерних ліній: GPIO чипа → цифровий порт приладу</text>
<rect x="60.0" y="110.0" width="200.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="160.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пристрій під тестом (DUT)</text>
<text x="160.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">МК / ESP32</text>
<text x="252.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">GPIO25</text>
<circle cx="260.0" cy="180.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="252.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">GPIO26</text>
<circle cx="260.0" cy="220.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="252.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">GPIO27</text>
<circle cx="260.0" cy="260.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="252.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">VDD (3.3 В)</text>
<circle cx="260.0" cy="300.0" r="3.4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="480.0" y="110.0" width="220.0" height="210.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="590.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профілювальник</text>
<text x="590.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">цифровий порт</text>
<text x="488.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IN0</text>
<circle cx="480.0" cy="180.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="488.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IN1</text>
<circle cx="480.0" cy="220.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="488.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IN2</text>
<circle cx="480.0" cy="260.0" r="3.4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="488.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Vref</text>
<circle cx="480.0" cy="300.0" r="3.4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<line x1="260.0" y1="180.0" x2="480.0" y2="180.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="260.0" y1="220.0" x2="480.0" y2="220.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="260.0" y1="260.0" x2="480.0" y2="260.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="260.0" y1="300.0" x2="480.0" y2="300.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="370.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Vref = живлення DUT → поріг входу = Vref/2</text>
<line x1="80.0" y1="320.0" x2="80.0" y2="360.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="680.0" y1="320.0" x2="680.0" y2="360.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="80.0" y1="360.0" x2="680.0" y2="360.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="380.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">спільна земля (GND)</text>
<rect x="55.8" y="389.8" width="648.4" height="30.5" rx="6" fill="#fdf6ec" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="408.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Три лінії несуть номер фази двійково; Vref беруть від живлення DUT, щоб поріг входу збігся з логікою чипа</tspan></text>
</svg>