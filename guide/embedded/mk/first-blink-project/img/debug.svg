<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">LED не блимає: де шукати</text>
<rect x="250.0" y="46.0" width="260.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="62.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Чи залилася прошивка?</tspan><tspan x="380.0" dy="15.6">(esptool: «Hash verified»)</tspan></text>
<line x1="320.0" y1="86.0" x2="200.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<rect x="60.0" y="122.0" width="280.0" height="48.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">проблема заливання, не коду:</tspan><tspan x="200.0" dy="14.3">порт, режим завантаження, кабель</tspan></text>
<line x1="440.0" y1="86.0" x2="560.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<rect x="430.0" y="122.0" width="280.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Той самий пін у коді й у залізі?</tspan></text>
<line x1="490.0" y1="162.0" x2="350.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<rect x="180.0" y="202.0" width="300.0" height="48.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">код пише в GPIO2, а LED на іншій ніжці —</tspan><tspan x="330.0" dy="14.3">або на платі взагалі немає LED</tspan></text>
<line x1="600.0" y1="162.0" x2="640.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<rect x="500.0" y="202.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Полярність і резистор?</tspan></text>
<line x1="620.0" y1="242.0" x2="620.0" y2="276.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="278.0" width="380.0" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">перевернутий LED (катод/анод), забутий чи завеликий</tspan><tspan x="550.0" dy="14.3">резистор, кепський контакт на макетці, згорілий LED</tspan></text>
</svg>