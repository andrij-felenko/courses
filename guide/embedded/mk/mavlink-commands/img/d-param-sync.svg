<text x="410.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Приймач заводить масив на count позицій. Прийшло 811 із 812 → у позиції 3 діра. Замість повторювати ВЕСЬ список, він шле точковий PARAM_REQUEST_READ (index = 3) —</tspan><tspan x="410.0" dy="15.0">і добирає лише пропущене. Так довгий список сходиться навіть на ненадійному лінку.</tspan></text>
