<rect x="532.5" y="162.3" width="165.0" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">ІНТЕРПРЕТУЄ граф</tspan><tspan x="615.0" dy="14.3">на чипі на льоту</tspan></text>
<line x1="615.0" y1="134.0" x2="615.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="272.0" width="340.0" height="32.0" rx="6" fill="#e8f1ff" stroke="#2457d6" stroke-width="2.0"/><text x="510.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">TFLite Micro — один рушій (трав. 2019)</tspan></text>
<line x1="405.0" y1="210.0" x2="440.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="615.0" y1="210.0" x2="580.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">основа — інтерпретатор Google; досвід Arm улився всередину</text>
<text x="390.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дві команди йшли до одного з різних боків — від заліза й від хмари — і зустрілися посередині.</text>
