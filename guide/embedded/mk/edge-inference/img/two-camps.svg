<rect x="50.0" y="162.3" width="180.0" height="45.3" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">інженер вписує</tspan><tspan x="140.0" dy="14.3">граф у C руками</tspan></text>
