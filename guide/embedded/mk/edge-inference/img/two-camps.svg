<line x1="140.0" y1="132.0" x2="140.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="140.0" y1="212.0" x2="140.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="258.0" y1="56.0" x2="258.0" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="510.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">2017 – 2019</text>
<rect x="322.5" y="86.2" width="165.0" height="47.6" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="1.5"/><text x="405.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Arm</tspan><tspan x="405.0" dy="15.6">uTensor (2017)</tspan></text>
<rect x="322.5" y="162.3" width="165.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="405.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">КОМПІЛЮЄ граф</tspan><tspan x="405.0" dy="14.3">у C++ наперед</tspan></text>
<line x1="405.0" y1="134.0" x2="405.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
