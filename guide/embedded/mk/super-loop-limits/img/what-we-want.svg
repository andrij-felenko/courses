<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чого ми хочемо: кожна справа — окрема проста програма</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">писати послідовно, ніби сама на машині, а перемикання довірити планувальникові</text>
<rect x="80.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="80.0" y="80.0" width="200.0" height="28.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Задача: блимати</tspan></text>
<text x="180.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">увімкни → чекай</tspan><tspan x="180.0" dy="13.7">вимкни → чекай</tspan></text>
<text x="180.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">з власними «чекай»</text>
<line x1="180.0" y1="190.0" x2="180.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="370.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="370.0" y="80.0" width="200.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Задача: давач</tspan></text>
<text x="470.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">читай → чекай</tspan><tspan x="470.0" dy="13.7">повтори</tspan></text>
<text x="470.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">з власними «чекай»</text>
<line x1="470.0" y1="190.0" x2="470.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="660.0" y="80.0" width="200.0" height="110.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.8"/>
<rect x="660.0" y="80.0" width="200.0" height="28.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="760.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Задача: зв'язок</tspan></text>
<text x="760.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">прийми → відповідж</tspan><tspan x="760.0" dy="13.7">чекай</tspan></text>
<text x="760.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">з власними «чекай»</text>
<line x1="760.0" y1="190.0" x2="760.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="173.6" y="259.0" width="592.9" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ПЛАНУВАЛЬНИК перемикає між задачами — кожна гадає, що володіє процесором сама</tspan></text>
<rect x="189.1" y="326.8" width="561.9" height="46.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Те, що колись дало багатьом людям ілюзію особистого комп'ютера (поділ часу),</tspan><tspan x="470.0" dy="15.0">тут дає нашим справам ілюзію особистого процесора — на одному чипі.</tspan></text>
</svg>