<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стелі завантаженості: скільки процесора можна віддати роботі</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна періодична робота — частка Cᵢ/Tᵢ; сума часток U = Σ Cᵢ/Tᵢ</text>
<line x1="150.0" y1="90.0" x2="150.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="138.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">U</text>
<line x1="144.0" y1="340.0" x2="150.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="138.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">0</text>
<line x1="144.0" y1="166.8" x2="150.0" y2="166.8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="138.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">ln2 ≈ 0.693</text>
<line x1="144.0" y1="90.0" x2="150.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="138.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1.0</text>
<rect x="150.0" y="166.8" width="560.0" height="173.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="430.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">тут устигає навіть RMS (і будь-хто розумніший)</text>
<rect x="150.0" y="90.0" width="560.0" height="76.8" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/>
<text x="430.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">EDF ще гарантовано встигає;</tspan><tspan x="430.0" dy="15.0">RMS — лише «якщо пощастить» з періодами</tspan></text>
<line x1="150.0" y1="90.0" x2="710.0" y2="90.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="722.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">U = 1 — фізична стеля</text>
<text x="722.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">(і точна межа EDF)</text>
<line x1="150.0" y1="166.8" x2="710.0" y2="166.8" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="7,5"/>
<text x="722.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">межа RMS: n(2^(1/n)−1)</text>
<text x="430.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">U &gt; 1 — не встигає ніхто (робота накопичується)</text>
<rect x="110.3" y="376.0" width="719.4" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">EDF викуповує всю смугу до фізичної стелі; фіксовані пріоритети гарантують лише до ln2 ≈ 69 %.</tspan></text>
</svg>