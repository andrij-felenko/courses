<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два ядра, спільна пам'ять і хто де сидить</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">радіо тримає одне ядро — тому «два» не завжди означає «удвічі вільніше»</text>
<rect x="70.0" y="92.0" width="340.0" height="150.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро 0 (PRO_CPU)</text>
<text x="240.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• стек Wi-Fi / Bluetooth</text>
<text x="240.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• службові задачі IDF</text>
<text x="240.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• переривання радіо</text>
<text x="240.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">радіо «з'їдає» помітну частку</text>
<rect x="510.0" y="92.0" width="340.0" height="150.0" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="680.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро 1 (APP_CPU)</text>
<text x="680.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• ваш app_main і задачі</text>
<text x="680.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• важкі обчислення</text>
<text x="680.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• вільніше під навантаження</text>
<text x="680.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">сюди «пінимо» гарячий код</text>
<rect x="70.0" y="286.0" width="780.0" height="56.0" rx="10" fill="#fbfbfb" stroke="#d8d8d8" stroke-width="1.8"/>
<text x="460.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільна внутрішня SRAM · спільна шина · спільні периферія й регістри</text>
<text x="460.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">обидва ядра бачать ту саму пам'ять — тому потрібні м'ютекси й критичні секції</text>
<line x1="240.0" y1="242.0" x2="240.0" y2="286.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="680.0" y1="242.0" x2="680.0" y2="286.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="150.0" y="366.0" width="620.0" height="46.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="460.0" y="385.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Одноядерні C3/C6 роблять те саме — але по черзі: радіо й ваш код</tspan><tspan x="460.0" dy="13.7">ділять ОДИН конвеєр, тож планувальник перемикає їх у часі.</tspan></text>
</svg>