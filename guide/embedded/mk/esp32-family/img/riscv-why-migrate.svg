<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що жене виробників до RISC-V</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чотири сили тягнуть в один бік — і одна осторога</text>
<rect x="70.0" y="80.0" width="540.0" height="70.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="98.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Ціна</text>
<text x="98.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">нуль роялті × мільярди штук</text>
<line x1="610.0" y1="115.0" x2="730.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="610.0" y1="115.0" x2="730.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="162.0" width="540.0" height="70.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="98.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Контроль</text>
<text x="98.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">кроїти й розширювати ISA під себе</text>
<line x1="610.0" y1="197.0" x2="730.0" y2="200.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="610.0" y1="197.0" x2="730.0" y2="200.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="244.0" width="540.0" height="70.0" rx="10" fill="#f3eede" stroke="#caa24a" stroke-width="1.8"/>
<text x="98.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="700">Незалежність</text>
<text x="98.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">не залежати від одного власника</text>
<line x1="610.0" y1="279.0" x2="730.0" y2="200.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="610.0" y1="279.0" x2="730.0" y2="200.0" stroke="#caa24a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="326.0" width="540.0" height="70.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="98.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Імпульс</text>
<text x="98.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">багато нових чипів, росте екосистема</text>
<line x1="610.0" y1="361.0" x2="730.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="610.0" y1="361.0" x2="730.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="800.0" cy="200.0" r="64.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.6"/>
<text x="800.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">RISC-V</text>
<text x="800.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відкрита ISA</text>
<text x="800.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">екосистема молодша</tspan><tspan x="800.0" dy="12.3">за ARM — поки що</tspan></text>
</svg>