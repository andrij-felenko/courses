<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три обличчя «малого мозку, що не спить»</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">той самий задум — стерегти давачі уві сні — у трьох поколіннях</text>
<rect x="50.0" y="88.0" width="270.0" height="268.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="185.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ULP FSM</text>
<text x="185.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32 · S2 · S3</text>
<line x1="80.0" y1="150.0" x2="290.0" y2="150.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="185.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• крихітний автомат</text>
<text x="185.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• асемблер / C-макроси</text>
<text x="185.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• 4 × 16-біт регістри</text>
<text x="185.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• I²C — лише бітбенгом</text>
<rect x="335.0" y="88.0" width="270.0" height="268.0" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="470.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ULP RISC-V</text>
<text x="470.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">S2 · S3</text>
<line x1="365.0" y1="150.0" x2="575.0" y2="150.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="470.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• справжнє RISC-V ядро</text>
<text x="470.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• звичайний C + GCC</text>
<text x="470.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• RV32IMC, множення/ділення</text>
<text x="470.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• є апаратний I²C</text>
<rect x="620.0" y="88.0" width="270.0" height="268.0" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="755.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">LP-ядро</text>
<text x="755.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">C6 · H2 · P4</text>
<line x1="650.0" y1="150.0" x2="860.0" y2="150.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="755.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• окреме RISC-V до ~20 МГц</text>
<text x="755.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• звичайний C</text>
<text x="755.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• власні переривання й шина</text>
<text x="755.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• стеки живлення нового рівня</text>
<line x1="320.0" y1="372.0" x2="620.0" y2="372.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="4,4"/>
<line x1="320.0" y1="372.0" x2="620.0" y2="372.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">від примітивного автомата — до повноцінного ядра</text>
</svg>