<rect x="150.0" y="318.0" width="620.0" height="66.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/><text x="460.0" y="347.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Для коду різниця майже непомітна: IDF і GCC компілюють під обидві.</tspan><tspan x="460.0" dy="13.7">Змінюється ISA всередині — не спосіб, у який ви пишете програму.</tspan></text>
