<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 474" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="474" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виконання кастомної команди через PCPI (PicoRV32)</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ядро пропонує невпізнану команду назовні; наш блок відповідає за такт</text>
<rect x="60.0" y="74.0" width="700.0" height="44.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="74.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Декодер ядра не впізнав опкод</text>
<text x="74.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">не кидає виняток одразу — пропонує команду назовні</text>
<rect x="60.0" y="138.0" width="700.0" height="44.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="74.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Ядро: pcpi_valid=1, виставляє insn / rs1 / rs2</text>
<text x="74.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">повний код команди й уже прочитані операнди — на шину PCPI</text>
<rect x="60.0" y="202.0" width="700.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="74.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="700">3. Наш блок звіряє opcode+funct3+funct7</text>
<text x="74.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">збіг -&gt; це наша команда; комбінаційно рахує popcount(rs1)</text>
<rect x="60.0" y="266.0" width="700.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="74.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="700">4. Блок: pcpi_rd=результат, pcpi_wr=1, pcpi_ready=1</text>
<text x="74.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">однотактна -&gt; готово ВЖЕ цього такту, pcpi_wait лишається 0</text>
<rect x="60.0" y="330.0" width="700.0" height="44.0" rx="6" fill="#eef0f4" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="74.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Ядро забрало rd і пішло далі — як після рідної команди</text>
<text x="74.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">результат у регістрі; конвеєр не помітив різниці</text>
<line x1="410.0" y1="118.0" x2="410.0" y2="138.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410.0" y1="182.0" x2="410.0" y2="202.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410.0" y1="246.0" x2="410.0" y2="266.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410.0" y1="310.0" x2="410.0" y2="330.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="398.0" width="700.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="410.0" y="417.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Таймаут: якщо за 16 тактів ЖОДЕН блок не підняв pcpi_ready —</tspan><tspan x="410.0" dy="14.3">команда вважається незаконною й летить виняток.</tspan><tspan x="410.0" dy="14.3">Багатотактний блок тримає pcpi_wait, щоб таймаут не спрацював завчасно.</tspan></text>
</svg>