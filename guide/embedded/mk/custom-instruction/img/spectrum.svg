<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="344" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи зробити операцію швидше</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кастомна інструкція — золота середина між «усе кодом» і «окремий блок на шині»</text>
<rect x="18.0" y="78.0" width="232.0" height="196.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<rect x="18.0" y="78.0" width="232.0" height="30.0" rx="6" fill="#2457d6" stroke="#333333" stroke-width="0.0"/>
<text x="134.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Суто програмно</text>
<text x="32.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">операція = багато</text>
<text x="32.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тактів ядра поспіль</text>
<text x="32.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="32.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">+ нуль заліза, гнучко</text>
<text x="32.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− повільно на гарячій</text>
<text x="32.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">  внутрішній петлі</text>
<rect x="274.0" y="78.0" width="232.0" height="196.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<rect x="274.0" y="78.0" width="232.0" height="30.0" rx="6" fill="#1f8a3b" stroke="#333333" stroke-width="0.0"/>
<text x="390.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Кастомна інструкція</text>
<text x="288.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">своя логіка ВСЕРЕДИНІ</text>
<text x="288.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">конвеєра ядра</text>
<text x="288.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="288.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">+ 1-2 такти, як рідна</text>
<text x="288.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">+ без шини й DMA</text>
<text x="288.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− треба міняти ядро</text>
<rect x="530.0" y="78.0" width="232.0" height="196.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="530.0" y="78.0" width="232.0" height="30.0" rx="6" fill="#c0392b" stroke="#333333" stroke-width="0.0"/>
<text x="646.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Окремий прискорювач</text>
<text x="544.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">блок на шині поряд</text>
<text x="544.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з ядром, свій інтерфейс</text>
<text x="544.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="544.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">+ величезний потік</text>
<text x="544.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− такти на шину туди-сюди</text>
<text x="544.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− складна синхронізація</text>
<line x1="18.0" y1="304.0" x2="762.0" y2="304.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="134.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">найдешевше залізо</text>
<text x="390.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700" font-style="italic">найщільніше з ядром</text>
<text x="646.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">найбільший потік</text>
</svg>