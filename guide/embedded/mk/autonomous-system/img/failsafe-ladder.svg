<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сходи деградації failsafe як машина станів</text>
<defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">що глибше б'є відмова (ближче до внутрішнього контуру) — то радикальніша реакція</text>
<rect x="96.0" y="96.0" width="300.0" height="74.0" rx="12" fill="#eafaef" stroke="#27ae60" stroke-width="1.9"/>
<text x="216.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#27ae60" text-anchor="middle" font-weight="700">AUTO</text>
<text x="216.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лети маршрутом</text>
<text x="416.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">▲ причина:</text>
<text x="416.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">усі давачі здорові</text>
<rect x="96.0" y="206.0" width="300.0" height="74.0" rx="12" fill="#eef6ff" stroke="#2457d6" stroke-width="1.9"/>
<text x="216.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">LOITER</text>
<text x="216.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">висни на місці</text>
<text x="416.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">▲ причина:</text>
<text x="416.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">втрачено GNSS — сліпа навігація</text>
<rect x="96.0" y="316.0" width="300.0" height="74.0" rx="12" fill="#fff5e6" stroke="#d98a00" stroke-width="1.9"/>
<text x="216.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#d98a00" text-anchor="middle" font-weight="700">RTL</text>
<text x="216.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вертайся додому</text>
<text x="416.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">▲ причина:</text>
<text x="416.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d98a00" text-anchor="start">низька батарея / нема зв'язку</text>
<rect x="96.0" y="426.0" width="300.0" height="74.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/>
<text x="216.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">LAND</text>
<text x="216.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">сідай тут і зараз</text>
<text x="416.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">▲ причина:</text>
<text x="416.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">критична батарея / RTL недосяжний</text>
<line x1="216.0" y1="170.0" x2="216.0" y2="203.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR)" stroke-linecap="round"/>
<line x1="216.0" y1="280.0" x2="216.0" y2="313.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR)" stroke-linecap="round"/>
<line x1="216.0" y1="390.0" x2="216.0" y2="423.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrR)" stroke-linecap="round"/>
<text x="80.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">деградація</text>
<text x="80.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(вниз — до</text>
<text x="80.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">безпеки)</text>
<rect x="690.0" y="236.0" width="200.0" height="108.0" rx="12" fill="#fbe9e7" stroke="#c0392b" stroke-width="2.4"/>
<text x="790.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">АВАРІЯ</text>
<text x="790.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">втрата орієнтації</text>
<text x="790.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">внутрішній контур</text>
<text x="790.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">осліп — гаси мотори</text>
<line x1="546.0" y1="133.0" x2="686.0" y2="290.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="546.0" y1="243.0" x2="686.0" y2="290.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="546.0" y1="353.0" x2="686.0" y2="290.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="546.0" y1="463.0" x2="686.0" y2="290.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="790.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">б'є з БУДЬ-ЯКОГО режиму</text>
<text x="490.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ключове: переходи ведуть ЛИШЕ до безпечнішого. Втрата зовнішньої ланки коштує режим; втрата внутрішньої — політ.</text>
</svg>