<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зонд керує ядром — не «слухає друк»</text>
<rect x="50.0" y="96.0" width="150.0" height="90.0" rx="6" fill="#f1fbf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="125.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ПК</text>
<text x="125.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">GDB</text>
<line x1="200.0" y1="141.0" x2="256.0" y2="141.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="228.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">USB</text>
<rect x="256.0" y="90.0" width="170.0" height="102.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="341.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">зонд</text>
<rect x="272.0" y="132.0" width="138.0" height="44.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="341.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">GDB-сервер</text>
<line x1="426.0" y1="141.0" x2="482.0" y2="141.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="454.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">JTAG/SWD</text>
<rect x="482.0" y="90.0" width="168.0" height="102.0" rx="6" fill="#0c1c34" stroke="#2457d6" stroke-width="2.0"/>
<text x="566.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9db8f0" text-anchor="middle" font-weight="700">чіп</text>
<text x="498.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a8e6c0" text-anchor="start">• спинити · крок</text>
<text x="498.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a8e6c0" text-anchor="start">• точки зупину</text>
<text x="498.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a8e6c0" text-anchor="start">• пам'ять, регістри</text>
<text x="350.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">усе наживо, без жодного print у коді — на відміну від USB-UART моста</text>
<text x="350.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усередині зонда — GDB-сервер, до якого під'єднується GDB на ПК</text>
</svg>