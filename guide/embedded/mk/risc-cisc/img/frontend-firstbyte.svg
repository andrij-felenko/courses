<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Перший байт» потоку: що фронтенд може зробити відразу</text>
<text x="40.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="700">RISC: перший байт — частина сталого 32-бітного слова</text>
<rect x="40.0" y="106.0" width="60.0" height="34.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="70.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="700">байт 0</text>
<rect x="106.0" y="106.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="136.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">байт 1</text>
<rect x="172.0" y="106.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="202.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">байт 2</text>
<rect x="238.0" y="106.0" width="60.0" height="34.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="268.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">байт 3</text>
<line x1="308.0" y1="123.0" x2="338.0" y2="123.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="348.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start">довжина відома одразу (4 б); поля на сталих бітах →</text>
<text x="348.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">опкод і номери регістрів вихоплюються ПАРАЛЕЛЬНО, за один крок.</text>
<line x1="30.0" y1="178.0" x2="790.0" y2="178.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="40.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="700">CISC: перший байт може бути будь-чим — розбір суворо послідовний</text>
<rect x="40.0" y="230.0" width="132.0" height="40.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="106.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">префікс?</text>
<text x="106.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">0..n байтів</text>
<line x1="172.0" y1="250.0" x2="180.0" y2="250.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180.0" y="230.0" width="132.0" height="40.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="246.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">опкод</text>
<text x="246.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">1..3 б</text>
<line x1="312.0" y1="250.0" x2="320.0" y2="250.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320.0" y="230.0" width="132.0" height="40.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="386.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ModR/M</text>
<text x="386.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">де операнди</text>
<line x1="452.0" y1="250.0" x2="460.0" y2="250.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460.0" y="230.0" width="132.0" height="40.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="526.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">SIB</text>
<text x="526.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">склад. адреса</text>
<line x1="592.0" y1="250.0" x2="600.0" y2="250.0" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600.0" y="230.0" width="132.0" height="40.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="666.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">зсув / imm</text>
<text x="666.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">0..8 б</text>
<text x="40.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start">довжину команди (а отже й де починається наступна) знаєш ЛИШЕ пройшовши весь ланцюг —</text>
<text x="40.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тому декодувати кілька команд за такт можна тільки спекулятивно, грубою силою.</text>
<text x="410.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий «перший байт»: у RISC він одразу все каже, у CISC — майже нічого без решти ланцюга.</text>
</svg>