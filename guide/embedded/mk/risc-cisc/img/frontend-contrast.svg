<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ті самі вузли, різна ціна: RISC-фронтенд проти CISC-фронтенду</text>
<rect x="30.0" y="66.0" width="372.0" height="30.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="216.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">RISC-фронтенд (сталої довжини)</text>
<rect x="438.0" y="66.0" width="372.0" height="30.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="624.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="700">CISC-фронтенд (змінної довжини)</text>
<text x="26.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Буфер вибірки</text>
<rect x="30.0" y="106.0" width="372.0" height="60.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/><text x="216.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">проста черга; наступна команда</tspan><tspan x="216.0" dy="13.0">завжди на сталому кроці (4 чи 2 б)</tspan></text>
<rect x="438.0" y="106.0" width="372.0" height="60.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/><text x="624.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">черга ≥ 15 б; треба вікно, бо межа</tspan><tspan x="624.0" dy="13.0">команди наперед невідома</tspan></text>
<text x="26.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Визначення довжини</text>
<rect x="30.0" y="174.0" width="372.0" height="60.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/><text x="216.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">БЕЗКОШТОВНО: усі команди рівні,</tspan><tspan x="216.0" dy="13.0">межа відома наперед</tspan></text>
<rect x="438.0" y="174.0" width="372.0" height="60.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/><text x="624.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">СПЕКУЛЯТИВНО: пробує довжину в</tspan><tspan x="624.0" dy="13.0">багатьох місцях, START/END-біти</tspan></text>
<text x="26.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Декодери</text>
<rect x="30.0" y="242.0" width="372.0" height="60.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/><text x="216.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">тверда логіка; поля на сталих бітах,</tspan><tspan x="216.0" dy="13.0">регістри читаються паралельно</tspan></text>
<rect x="438.0" y="242.0" width="372.0" height="60.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/><text x="624.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">розбір префіксів, ModR/M, SIB;</tspan><tspan x="624.0" dy="13.0">кілька декодерів (1 складний + прості)</tspan></text>
<text x="26.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Мікрокод / кеш µops</text>
<rect x="30.0" y="310.0" width="372.0" height="60.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/><text x="216.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="216.0" dy="0.0">здебільшого немає — кожна команда</tspan><tspan x="216.0" dy="13.0">іде прямо в бекенд</tspan></text>
<rect x="438.0" y="310.0" width="372.0" height="60.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/><text x="624.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">мікрокод-ROM на складні команди +</tspan><tspan x="624.0" dy="13.0">кеш µops, щоб обійти весь фронтенд</tspan></text>
<rect x="30.0" y="382.0" width="372.0" height="44.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="216.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700"><tspan x="216.0" dy="0.0">увесь фронтенд — жменька вентилів</tspan><tspan x="216.0" dy="13.0">(ціле ядро Cortex-M0 ≈ 12 000 вентилів)</tspan></text>
<rect x="438.0" y="382.0" width="372.0" height="44.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="624.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">лише фронтенд — сотні тисяч вентилів;</tspan><tspan x="624.0" dy="13.0">провідний споживач енергії та площі</tspan></text>
<text x="420.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">RISC несе цей вузол майже задарма; у CISC той самий вузол — найдорожча частина процесора.</text>
</svg>