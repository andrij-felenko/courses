<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один добуток — три множники, дві протилежні ставки</text>
<rect x="120.0" y="120.0" width="150.0" height="66.0" rx="8" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="195.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">N</text>
<text x="195.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="195.0" dy="0.0">команд</tspan><tspan x="195.0" dy="12.3">у програмі</tspan></text>
<text x="280.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">×</text>
<rect x="290.0" y="120.0" width="150.0" height="66.0" rx="8" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="365.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPI</text>
<text x="365.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="365.0" dy="0.0">тактів</tspan><tspan x="365.0" dy="12.3">на команду</tspan></text>
<text x="450.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">×</text>
<rect x="460.0" y="120.0" width="150.0" height="66.0" rx="8" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="535.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">T</text>
<text x="535.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="535.0" dy="0.0">тривалість</tspan><tspan x="535.0" dy="12.3">такту</tspan></text>
<text x="94.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">час =</text>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">CISC: тисну N (одна потужна команда замість п'яти)</text>
<line x1="195.0" y1="104.0" x2="195.0" y2="118.0" stroke="#1f47b5" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="365.0" y1="202.0" x2="365.0" y2="188.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="535.0" y1="202.0" x2="535.0" y2="188.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">RISC: тисну CPI і T (прості команди · просте швидке залізо)</text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CISC виграє один множник і платить двома; RISC — навпаки.</text>
<text x="380.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Хто переможе — вирішує, наскільки сильно кожен множник піддається.</text>
</svg>