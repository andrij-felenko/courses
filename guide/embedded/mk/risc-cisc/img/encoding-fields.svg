<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому декодування таке різне — усе в кодуванні команди</text>
<text x="60.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="700">RISC (RV32I), R-type — рівно 32 біти, поля на сталих місцях:</text>
<rect x="60.0" y="108.0" width="144.4" height="46.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="132.2" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">funct7</text>
<text x="132.2" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7 б</text>
<text x="132.2" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">31:25</text>
<rect x="204.4" y="108.0" width="103.1" height="46.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="255.9" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">rs2</text>
<text x="255.9" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5 б</text>
<text x="255.9" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">24:20</text>
<rect x="307.5" y="108.0" width="103.1" height="46.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="359.1" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">rs1</text>
<text x="359.1" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5 б</text>
<text x="359.1" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">19:15</text>
<rect x="410.6" y="108.0" width="61.9" height="46.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="441.6" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">funct3</text>
<text x="441.6" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 б</text>
<text x="441.6" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">14:12</text>
<rect x="472.5" y="108.0" width="103.1" height="46.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="524.1" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">rd</text>
<text x="524.1" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5 б</text>
<text x="524.1" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">11:7</text>
<rect x="575.6" y="108.0" width="144.4" height="46.0" rx="4" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="647.8" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">opcode</text>
<text x="647.8" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7 б</text>
<text x="647.8" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">6:0</text>
<text x="390.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-style="italic">номери регістрів (rd, rs1, rs2) — ЗАВЖДИ на тих самих бітах → читаються паралельно з розбором опкоду</text>
<text x="60.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="700">CISC (x86) — байтовий потік; довжину команди знаєш лише почавши розбирати:</text>
<rect x="60.0" y="266.0" width="60.0" height="34.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="90.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">89 D8</text>
<text x="90.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1f47b5" text-anchor="middle" font-weight="700">2 байт</text>
<text x="90.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">mov eax,ebx</text>
<rect x="134.0" y="266.0" width="90.0" height="34.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="179.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">01 04 8B</text>
<text x="179.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1f47b5" text-anchor="middle" font-weight="700">3 байт</text>
<text x="179.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">add [rbx+rcx*4],eax</text>
<rect x="238.0" y="266.0" width="210.0" height="34.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="343.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">48 8B 05 3A 27 01 00</text>
<text x="343.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1f47b5" text-anchor="middle" font-weight="700">7 байт</text>
<text x="343.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">mov rax,[rip+0x1273a]</text>
<text x="60.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-style="italic">межі команд плавають; поля залежать від префіксів і ModR/M — декодер мусить спершу частково розібрати команду.</text>
<text x="390.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Сталі поля → миттєве паралельне декодування. Плавні межі → послідовний розбір і вузьке місце.</text>
</svg>