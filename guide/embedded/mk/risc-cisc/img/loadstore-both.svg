<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один цикл  sum += a[i]  —  той самий візерунок у двох залізах</text>
<rect x="180.0" y="56.0" width="500.0" height="30.0" rx="8" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="280.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">завантаж (LD/LDR)</text>
<text x="436.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ порахуй у регістрах →</text>
<text x="598.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">збережи (ST/STR)</text>
<rect x="40.0" y="104.0" width="380.0" height="330.0" rx="10" fill="#fbf3ec" stroke="#b5641f" stroke-width="2.0"/>
<text x="230.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b5641f" text-anchor="middle" font-weight="700">AVR (8-біт) — тіло циклу</text>
<rect x="58.0" y="146.0" width="344.0" height="32.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="72.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ld   r24, Z+</text>
<text x="190.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; a[i] молодший байт → r24</text>
<rect x="58.0" y="186.0" width="344.0" height="32.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="72.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ld   r25, Z+</text>
<text x="190.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; a[i] старший байт → r25</text>
<rect x="58.0" y="226.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#b5641f" stroke-width="1.3"/>
<text x="72.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">add  r18, r24</text>
<text x="190.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; sum += a[i], молодший</text>
<rect x="58.0" y="266.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#b5641f" stroke-width="1.3"/>
<text x="72.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">adc  r19, r25</text>
<text x="190.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; +перенос, старший байт</text>
<rect x="58.0" y="306.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#b5641f" stroke-width="1.3"/>
<text x="72.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">sbiw r26, ...</text>
<text x="190.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; лічильник -= 1</text>
<rect x="58.0" y="346.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#b5641f" stroke-width="1.3"/>
<text x="72.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">brne .-...</text>
<text x="190.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; ще не 0 → назад у цикл</text>
<text x="230.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b5641f" text-anchor="middle" font-style="italic">16-біт = ПАРА регістрів; додавання у два кроки (add+adc)</text>
<rect x="440.0" y="104.0" width="380.0" height="330.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/>
<text x="630.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="700">ARM Thumb-2 — тіло циклу</text>
<rect x="458.0" y="146.0" width="344.0" height="32.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="472.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ldrh r3, [r1], #2</text>
<text x="618.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; a[i] у r3 (16-біт одразу)</text>
<rect x="458.0" y="186.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="472.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">add  r2, r2, r3</text>
<text x="618.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; sum += a[i], один крок</text>
<rect x="458.0" y="226.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="472.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">cmp  r1, r4</text>
<text x="618.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; дійшли кінця масиву?</text>
<rect x="458.0" y="266.0" width="344.0" height="32.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="472.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">bne  .-...</text>
<text x="618.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">; ні → назад у цикл</text>
<text x="630.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-style="italic">16-біт влазить у ОДИН 32-бітний регістр:</text>
<text x="630.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-style="italic">одне ldrh, одне add — коротший цикл</text>
<text x="430.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кістяк один (зелене): пам'ять чіпають лише LD/ST. Різна лише ширина регістра — звідси й різна к-сть команд.</text>
</svg>