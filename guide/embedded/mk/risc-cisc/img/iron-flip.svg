<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два випадки, де терези хиляться до CISC</text>
<rect x="30.0" y="66.0" width="340.0" height="210.0" rx="10" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="200.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. CPI·T зрівнялися (обидва конвеєрні, та сама частота)</text>
<text x="200.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тоді час ∝ N — лишається сам приріст команд</text>
<rect x="100.0" y="147.7" width="80.0" height="92.3" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/>
<text x="140.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">100</text>
<text x="140.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">CISC</text>
<rect x="220.0" y="120.0" width="80.0" height="120.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="260.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">130</text>
<text x="260.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">RISC</text>
<text x="200.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">виграє CISC (менший N)</text>
<rect x="410.0" y="66.0" width="340.0" height="210.0" rx="10" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="580.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Час з'їдає вибірка коду з повільної пам'яті</text>
<text x="580.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">важать байти коду N×розмір — щільніший CISC</text>
<rect x="480.0" y="170.8" width="80.0" height="69.2" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2.0"/>
<text x="520.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">300</text>
<text x="520.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">CISC</text>
<rect x="600.0" y="120.0" width="80.0" height="120.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="640.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">520</text>
<text x="640.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">RISC</text>
<text x="580.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">виграє CISC (щільніший код)</text>
<text x="390.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Урок: RISC перемагає не завжди — лише поки його виграш у CPI·T переважує приріст N.</text>
</svg>