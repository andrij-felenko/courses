<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клас «фронтенд декодування»: спільний ланцюг вузлів</text>
<rect x="40.0" y="150.0" width="128.0" height="72.0" rx="7" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="104.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">Буфер</tspan><tspan x="104.0" dy="15.0">вибірки</tspan></text>
<text x="104.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="104.0" dy="0.0">сирі байти</tspan><tspan x="104.0" dy="11.1">з кеша команд</tspan></text>
<rect x="194.0" y="150.0" width="128.0" height="72.0" rx="7" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="258.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">Визначення</tspan><tspan x="258.0" dy="15.0">довжини</tspan></text>
<text x="258.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="258.0" dy="0.0">де межі</tspan><tspan x="258.0" dy="11.1">команд</tspan></text>
<rect x="348.0" y="150.0" width="128.0" height="72.0" rx="7" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="412.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="412.0" dy="0.0">Декодери</tspan></text>
<text x="412.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="412.0" dy="0.0">команда →</tspan><tspan x="412.0" dy="11.1">µops</tspan></text>
<rect x="502.0" y="150.0" width="128.0" height="72.0" rx="7" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="566.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="566.0" dy="0.0">Черга / кеш</tspan><tspan x="566.0" dy="15.0">µops</tspan></text>
<text x="566.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="566.0" dy="0.0">згладити потік,</tspan><tspan x="566.0" dy="11.1">не декодувати двічі</tspan></text>
<text x="104.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">потік команд
у пам'яті</text>
<line x1="104.0" y1="128.0" x2="104.0" y2="148.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="168.0" y1="186.0" x2="194.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="322.0" y1="186.0" x2="348.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="476.0" y1="186.0" x2="502.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="186.0" x2="656.0" y2="186.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="681.7" y="163.9" width="104.6" height="44.1" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/><text x="734.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700"><tspan x="734.0" dy="0.0">виконавче</tspan><tspan x="734.0" dy="13.7">ядро (бекенд)</tspan></text>
<text x="410.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фронтенд перетворює сирі байти на готові до виконання внутрішні кроки (µops) — і подає їх бекенду.</text>
<text x="410.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Каркас той самий для будь-якого процесора; уся різниця RISC ↔ CISC — у тому, ЩО коштує кожен вузол.</text>
</svg>