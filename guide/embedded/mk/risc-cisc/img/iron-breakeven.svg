<text x="380.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RISC виграє ⟺ (виграш CPI·T)  &gt;  (приріст N). Тут 5.1 &gt; 1.3 — з великим запасом.</text>
