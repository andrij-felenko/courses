<text x="400.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ті самі прості кроки всередині: CISC дробить складне на них, RISC склеює дрібне в один.</text>
<text x="400.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Обидва сходяться до однієї внутрішньої одиниці роботи — перемогла не мова, а фізика простих кроків.</text>
