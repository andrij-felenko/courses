<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спостереження, що схилило терези</text>
<line x1="90.0" y1="250.0" x2="90.0" y2="62.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="90.0" y1="250.0" x2="510.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="72.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">як
часто</text>
<rect x="102.0" y="79.0" width="43.2" height="171.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<rect x="160.3" y="102.4" width="43.2" height="147.6" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<rect x="218.7" y="124.0" width="43.2" height="126.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<rect x="277.0" y="160.0" width="43.2" height="90.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<rect x="335.3" y="228.4" width="43.2" height="21.6" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.5"/>
<rect x="393.7" y="239.2" width="43.2" height="10.8" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.5"/>
<text x="189.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle">кілька простих — майже весь код</text>
<text x="387.8" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle">складні — рідкісні</text>
<rect x="530.3" y="108.3" width="159.5" height="95.3" rx="6" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="1.8"/><text x="610.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Викинь рідкісні</tspan><tspan x="610.0" dy="15.0">складні команди.</tspan><tspan x="610.0" dy="15.0">Лиши мало простих —</tspan><tspan x="610.0" dy="15.0">і зроби їх</tspan><tspan x="610.0" dy="15.0">блискавичними.</tspan></text>
<text x="610.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«оптимізуй типовий випадок»</text>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Складне хай складає компілятор — а залізо хай летить.</text>
</svg>