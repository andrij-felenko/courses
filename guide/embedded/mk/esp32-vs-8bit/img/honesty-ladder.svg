<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина чесного порівняння ядер</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що вище — то ближче до правди про швидкість на ТВОЇХ задачах</text>
<rect x="180.0" y="96.0" width="560.0" height="56.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Виміряти СВОЇ задачі</text>
<text x="200.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">твій код, твоя памʼять — найчесніше</text>
<rect x="180.0" y="166.0" width="560.0" height="56.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="200.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Профільний бенчмарк (CoreMark)</text>
<text x="200.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ближче до реальних задач, ніж Dhrystone</text>
<rect x="180.0" y="236.0" width="560.0" height="56.0" rx="10" fill="#eef0f5" stroke="#caa24a" stroke-width="2.0"/>
<text x="200.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="700">DMIPS / МГц</text>
<text x="200.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">враховує корисну роботу за такт</text>
<rect x="180.0" y="306.0" width="560.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Лише МГц</text>
<text x="200.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">оманливо: ігнорує архітектуру</text>
<line x1="140.0" y1="404.0" x2="140.0" y2="90.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="140.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">чесніше</text>
<text x="140.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">наївно</text>
<rect x="180.0" y="386.0" width="560.0" height="40.0" rx="8" fill="#eef0f2" stroke="#6b7280" stroke-width="1.2"/>
<text x="460.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">робота ≈ МГц × DMIPS/МГц — але жоден бенчмарк не замінить заміру власного коду</text>
</svg>