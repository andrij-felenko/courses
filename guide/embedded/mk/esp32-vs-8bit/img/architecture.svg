<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що нового було в 8051: булів процесор і банки регістрів</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">гарвардський поділ, бітові операції та швидкі банки — усе під керування, а не лічбу</text>
<rect x="50.0" y="76.0" width="760.0" height="360.0" rx="12" fill="#fbfcff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="72.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">Intel 8051 (1980)</text>
<rect x="110.0" y="132.0" width="200.0" height="88.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="210.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Ядро 8-біт</tspan><tspan x="210.0" dy="14.3">+ БУЛІВ ПРОЦЕСОР</tspan><tspan x="210.0" dy="14.3">17 бітових інструкцій</tspan></text>
<rect x="110.0" y="248.0" width="200.0" height="82.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">4 банки регістрів</tspan><tspan x="210.0" dy="14.3">× 8 — швидке</tspan><tspan x="210.0" dy="14.3">перемикання контексту</tspan></text>
<rect x="350.0" y="132.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="450.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Program ROM</tspan><tspan x="450.0" dy="14.3">4 КБ (Гарвард)</tspan></text>
<rect x="350.0" y="222.0" width="200.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="450.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Data RAM 128 Б</tspan><tspan x="450.0" dy="14.3">є бітово-адресовна зона</tspan></text>
<rect x="350.0" y="312.0" width="200.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="450.0" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">2× таймери 16-біт</tspan></text>
<rect x="590.0" y="132.0" width="200.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="690.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">UART</tspan><tspan x="690.0" dy="14.3">послідовний порт</tspan></text>
<rect x="590.0" y="222.0" width="200.0" height="70.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="690.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Контролер переривань</tspan></text>
<rect x="590.0" y="312.0" width="200.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="690.0" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Порти вводу-виводу</tspan></text>
<rect x="110.0" y="388.0" width="680.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="450.0" y="409.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Зелене — родзинка 8051: керувати окремими бітами так само легко, як байтами.</tspan></text>
