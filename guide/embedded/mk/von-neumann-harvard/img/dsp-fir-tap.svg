<text x="420.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">шина даних 1</text>
<rect x="600.0" y="284.2" width="180.0" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">пам'ять даних B</tspan></text>
