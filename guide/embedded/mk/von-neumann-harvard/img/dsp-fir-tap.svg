<rect x="330.0" y="284.2" width="180.0" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">пам'ять даних A</tspan></text>
<line x1="420.0" y1="282.0" x2="420.0" y2="116.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
