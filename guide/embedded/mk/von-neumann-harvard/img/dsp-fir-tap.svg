<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок фільтра DSP: команда + відлік + коефіцієнт — усі за один такт</text>
<rect x="280.0" y="65.0" width="280.0" height="49.9" rx="6" fill="#f3f6ff" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ядро DSP: один такт MAC</tspan><tspan x="420.0" dy="16.9">acc += x[k] · h[k]</tspan></text>
<rect x="60.0" y="284.2" width="180.0" height="31.5" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">пам'ять коду</tspan></text>
