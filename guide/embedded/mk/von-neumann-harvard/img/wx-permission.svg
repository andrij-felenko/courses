<text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна пам'ять дає гнучкість; заборона «писати й виконувати заразом» повертає захист роздільних просторів.</text>
