<text x="380.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крива не лінійна: до коліна запас великий, після — система «раптом» починає спізнюватися.</text>
<text x="380.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тому в жорсткому реальному часі тримають U далеко ліворуч від коліна, а не «під одиницею».</text>
