<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="466" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли вища ціна розробки окуповується</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">собівартість партії = разова розробка (NRE) + ціна_за_шт × кількість</text>
<line x1="92.0" y1="350.0" x2="92.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="92.0" y1="350.0" x2="682.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="82.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">сумарна</text>
<text x="82.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">вартість</text>
<text x="682.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">тираж, шт -&gt;</text>
<line x1="92.0" y1="333.2" x2="682.0" y2="131.6" stroke="#2457d6" stroke-width="2.4"/>
<line x1="92.0" y1="232.4" x2="682.0" y2="137.2" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="676.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">рішення A: дешева розробка,</text>
<text x="676.0" y="137.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end">дорожча одиниця (напр. МК+обв'язка)</text>
<text x="676.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="end" font-weight="700">рішення B: дорога розробка (NRE),</text>
<text x="676.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="end">дешевша одиниця на обсязі</text>
<line x1="650.9" y1="350.0" x2="650.9" y2="142.2" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="650.9" cy="142.2" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="650.9" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">точка беззбитковості</text>
<text x="650.9" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">цей тираж</text>
<text x="371.5" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">тут дешевше A</text>
<text x="666.5" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-style="italic">тут дешевше B</text>
<rect x="40.0" y="394.0" width="680.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="422.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Точка перетину = NRE_різниця / (ціна_за_шт_різниця). Малий тираж — розробку не розкласти, виграє простіше рішення; великий — виграє дешевша одиниця.</tspan></text>
</svg>