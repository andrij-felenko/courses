<text x="436.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">витіснення вищим ISR</text>
<rect x="504.0" y="92.0" width="81.6" height="34.0" rx="6" fill="#a2b4f0" stroke="#2457d6" stroke-width="1.3"/>
<text x="544.8" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">24</text>
<text x="544.8" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">позиція каналу в черзі</text>
<rect x="585.6" y="92.0" width="54.4" height="34.0" rx="6" fill="#8ea3ec" stroke="#2457d6" stroke-width="1.3"/>
