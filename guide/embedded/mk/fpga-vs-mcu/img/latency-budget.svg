<text x="327.2" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">синхронізатор + вентилі</text>
<rect x="40.0" y="290.0" width="680.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Числа МК — у тактах ядра (зразок Cortex-M, нульові wait-стани). Плаває не «трохи», а на десятки тактів — і саме це вбиває жорсткий таймінг.</tspan></text>
