<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="362" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точка беззбитковості як шкала рішення</text>
<text x="390.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порахував Q* — далі просто дивишся, з якого боку твій тираж</text>
<line x1="70.0" y1="120.0" x2="710.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="70.0" y1="120.0" x2="710.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">тираж Q -&gt;</text>
<text x="62.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<line x1="402.8" y1="74.0" x2="402.8" y2="134.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 3"/>
<circle cx="402.8" cy="120.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="402.8" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="402.8" dy="0.0">Q* = (NRE_B − NRE_A)</tspan><tspan x="402.8" dy="13.7">/ (ціна_A − ціна_B)</tspan></text>
<rect x="76.0" y="150.0" width="320.8" height="42.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.4"/><text x="236.4" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="236.4" dy="0.0">Q &lt; Q*: дешевше A</tspan><tspan x="236.4" dy="13.7">(розробку B не розкласти)</tspan></text>
<rect x="408.8" y="150.0" width="295.2" height="42.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.4"/><text x="556.4" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700"><tspan x="556.4" dy="0.0">Q &gt; Q*: дешевше B</tspan><tspan x="556.4" dy="13.7">(висока NRE окупилась дешевою одиницею)</tspan></text>
<text x="390.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Межовий випадок: точка виходить від'ємною</text>
<line x1="70.0" y1="270.0" x2="710.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="70.0" y1="270.0" x2="710.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="62.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<text x="710.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">тираж Q -&gt;</text>
<line x1="36.0" y1="240.0" x2="36.0" y2="280.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="3 3"/>
<circle cx="36.0" cy="270.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="36.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Q* &lt; 0</text>
<rect x="76.0" y="300.0" width="628.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="390.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Уся дійсна вісь Q ≥ 0 лежить по ОДИН бік точки: один варіант дорожчий</tspan><tspan x="390.0" dy="14.3">і по NRE, і по одиниці. Він програє на БУДЬ-ЯКОМУ тиражі — рахувати далі нема сенсу.</tspan></text>
</svg>