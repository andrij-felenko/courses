<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">За чим міряти канал виводу — п'ять осей</text>
<rect x="50.0" y="64.0" width="600.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="78.0" cy="84.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="78.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="104.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Час програми</text>
<text x="104.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">як сильно друк краде такти й зрушує тайминг</text>
<rect x="50.0" y="114.0" width="600.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="78.0" cy="134.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="78.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="104.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Пропускна спроможність</text>
<text x="104.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">скільки даних канал пропускає за секунду</text>
<rect x="50.0" y="164.0" width="600.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="78.0" cy="184.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="78.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<text x="104.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Живучість</text>
<text x="104.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">чи працює до main() і в мить аварії</text>
<rect x="50.0" y="214.0" width="600.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="78.0" cy="234.0" r="9.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<text x="78.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">4</text>
<text x="104.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Ціна в залізі</text>
<text x="104.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">піни, міст, окремий зонд</text>
<rect x="50.0" y="264.0" width="600.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="78.0" cy="284.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="78.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">5</text>
<text x="104.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Двобічність</text>
<text x="104.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">лише слухати чи й слати чипу команди</text>
<text x="350.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">жоден канал не виграє за всіма — вибрати канал = вибрати, чим пожертвувати</text>
</svg>