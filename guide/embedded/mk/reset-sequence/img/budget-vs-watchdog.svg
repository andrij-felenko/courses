<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Graceful — це best-effort поверх твердої гарантії watchdog</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">згортання обмежене бюджетом; якщо воно само зависне — сторож усе одно перезапустить</text>
<line x1="90.0" y1="150.0" x2="880.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="880.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">час →</text>
<line x1="90.0" y1="142.0" x2="90.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="90.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">рішення «reset»</text>
<rect x="90.0" y="124.0" width="340.0" height="26.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="260.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">бюджет згортання (мс)</text>
<line x1="430.0" y1="116.0" x2="430.0" y2="160.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="360.0" y1="150.0" x2="360.0" y2="196.0" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="360.0" cy="196.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="360.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">встигли → свій reset</text>
<text x="360.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(чисте, кероване згортання)</text>
<rect x="430.0" y="124.0" width="330.0" height="26.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.4"/>
<text x="595.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">запас</text>
<line x1="760.0" y1="110.0" x2="760.0" y2="210.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="760.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">дедлайн watchdog</text>
<text x="760.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">згортання зависло?</text>
<text x="760.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">сторож рубає однаково</text>
<text x="90.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Два рівні: graceful намагається (м'яко), watchdog гарантує (жорстко). Ніколи не лишай лише перший.</text>
<rect x="112.9" y="384.0" width="734.2" height="32.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="480.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Бюджет коротший за дедлайн сторожа: graceful має або встигнути, або поступитися жорсткому reset.</tspan></text>
</svg>