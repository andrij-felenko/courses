<rect x="145.0" y="196.0" width="470.0" height="50.0" rx="8" fill="#fff4e0" stroke="#1a1a1a" stroke-width="1.6"/><text x="159.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">LL</text><text x="601.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">тонкі обгортки 1-до-1 над бітами регістрів</text>
<rect x="145.0" y="262.0" width="470.0" height="50.0" rx="8" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.6"/><text x="159.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">CMSIS-регістри</text><text x="601.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">RCC-&gt;, GPIOA-&gt; : структури = адреси заліза</text>
