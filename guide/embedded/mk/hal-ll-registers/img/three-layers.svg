<rect x="145.0" y="64.0" width="470.0" height="50.0" rx="8" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.6"/><text x="159.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ваш код</text><text x="601.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="end">застосунок прошивки</text>
