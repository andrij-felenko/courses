<rect x="220.0" y="158.0" width="474.0" height="40.0" rx="6" fill="#fff4e0" stroke="#fff4e0" stroke-width="0.0"/><text x="457.0" y="181.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="457.0" dy="0.0">гаряча перерва · щільний цикл · обмежена Flash · потрібен тонкий контроль</tspan></text>
