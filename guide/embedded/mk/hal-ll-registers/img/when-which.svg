<rect x="220.0" y="86.0" width="474.0" height="40.0" rx="6" fill="#eef3ff" stroke="#eef3ff" stroke-width="0.0"/><text x="457.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="457.0" dy="0.0">за замовчуванням · ініціалізація · USB/Ethernet/SD · переносність між родинами</tspan></text>
