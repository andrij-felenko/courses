<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога до вейпойнта: чотири способи «знати, де я» без людини</text>
<line x1="40.0" y1="250.0" x2="780.0" y2="250.0" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="110.0" cy="250.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
<text x="110.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1914</text>
<text x="110.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Гіроавтопілот</tspan><tspan x="110.0" dy="16.2">Сперрі</tspan></text>
<line x1="110.0" y1="118.0" x2="110.0" y2="241.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="110.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="110.0" dy="0.0">тримає РІВЕНЬ,</tspan><tspan x="110.0" dy="14.3">але не знає, ДЕ він</tspan></text>
<circle cx="310.0" cy="250.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="310.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1940-50-ті</text>
<text x="310.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Інерціальна</tspan><tspan x="310.0" dy="16.2">навігація (INS)</tspan></text>
<line x1="310.0" y1="118.0" x2="310.0" y2="241.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="310.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">числить шлях сама —</tspan><tspan x="310.0" dy="14.3">але ДРЕЙФ росте з часом</tspan></text>
<circle cx="510.0" cy="250.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="510.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1950-ті →</text>
<text x="510.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">TERCOM:</tspan><tspan x="510.0" dy="16.2">прив'язка до рельєфу</tspan></text>
<line x1="510.0" y1="118.0" x2="510.0" y2="241.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="510.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">звіряє висоту з картою —</tspan><tspan x="510.0" dy="14.3">гасить дрейф над землею</tspan></text>
<circle cx="710.0" cy="250.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="710.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2000 →</text>
<text x="710.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">GNSS</tspan><tspan x="710.0" dy="16.2">(GPS і сузір'я)</tspan></text>
<line x1="710.0" y1="118.0" x2="710.0" y2="241.0" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="710.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="710.0" dy="0.0">точка на кулі стала</tspan><tspan x="710.0" dy="14.3">ВИМІРНОЮ — метри будь-де</tspan></text>
<path d="M 80 100 L 728 100" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">план із координат стає дедалі надійніше «літати»</text>
</svg>