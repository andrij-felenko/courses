<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто з ким говорить, коли ви прошиваєте чип</text>
<rect x="0.0" y="90.0" width="120.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ваш ПК</text>
<text x="60.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="60.0" dy="0.0">esptool</tspan><tspan x="60.0" dy="14.3">(Python)</tspan></text>
<rect x="190.0" y="90.0" width="120.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB↔UART</text>
<text x="250.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="250.0" dy="0.0">міст</tspan><tspan x="250.0" dy="14.3">на платі</tspan></text>
<rect x="380.0" y="90.0" width="120.0" height="80.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ROM у чипі</text>
<text x="440.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="440.0" dy="0.0">вшитий</tspan><tspan x="440.0" dy="14.3">завантажувач</tspan></text>
<rect x="570.0" y="90.0" width="120.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI-Flash</text>
<text x="630.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="630.0" dy="0.0">сама</tspan><tspan x="630.0" dy="14.3">пам'ять</tspan></text>
<line x1="124.0" y1="122.0" x2="186.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="186.0" y1="142.0" x2="124.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="314.0" y1="122.0" x2="376.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="376.0" y1="142.0" x2="314.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="504.0" y1="122.0" x2="566.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="566.0" y1="142.0" x2="504.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="155.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">USB-кабель</text>
<text x="345.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">UART (TX/RX)</text>
<text x="535.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">шина SPI</text>
<text x="380.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Униз — запис (write_flash), вгору — читання (read_flash). esptool сам не торкає Flash:</text>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">він лише шле байти завантажувачеві, а той уже пише в пам'ять по шині SPI.</text>
</svg>