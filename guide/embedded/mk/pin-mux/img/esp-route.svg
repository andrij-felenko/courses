<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32 GPIO matrix: connect_out_signal і connect_in_signal — окремі шляхи</text>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32: вихід і вхід — два окремі шляхи матриці</text>
<rect x="600.0" y="174.0" width="34.0" height="52.0" rx="6" fill="#fbf3e0" stroke="#8a6a1e" stroke-width="1.8"/>
<text x="617.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a1e" text-anchor="middle" font-weight="700">GPIO 17</text>
<line x1="634.0" y1="200.0" x2="670.0" y2="200.0" stroke="#8a6a1e" stroke-width="3.0"/>
<rect x="30.0" y="87.3" width="180.0" height="45.3" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">U1TXD_OUT_IDX</tspan><tspan x="120.0" dy="14.3">(вихід блоку)</tspan></text>
<rect x="235.0" y="87.3" width="240.0" height="45.3" rx="6" fill="#f3f6ff" stroke="#1a1a1a" stroke-width="1.5"/><text x="355.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">connect_out_signal</tspan><tspan x="355.0" dy="14.3">(реєстр виходу ніжки)</tspan></text>
<line x1="214.0" y1="110.0" x2="232.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="482.0" y1="124.0" x2="606.0" y2="182.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="235.0" y="267.4" width="240.0" height="45.3" rx="6" fill="#f3f6ff" stroke="#1a1a1a" stroke-width="1.5"/><text x="355.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">connect_in_signal</tspan><tspan x="355.0" dy="14.3">(вибір ніжки-джерела)</tspan></text>
<rect x="30.0" y="267.4" width="180.0" height="45.3" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">U1RXD_IN_IDX</tspan><tspan x="120.0" dy="14.3">(вхід блоку)</tspan></text>
<line x1="604.0" y1="218.0" x2="474.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="232.0" y1="290.0" x2="214.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">вихід →</text>
<text x="300.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">← вхід</text>
<text x="617.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">IO_MUX (швидкий SPI)
обходить матрицю</text>
<text x="410.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один сигнал = один дріт: вихід і вхід вмикають окремо. Дзеркальна пара inversion-прапорців живе в обох викликах.</text>
</svg>