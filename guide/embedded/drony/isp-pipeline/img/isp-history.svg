<rect x="40.0" y="355.0" width="880.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Наскрізне правило: щойно роботи стає забагато для універсального процесора, її віддають спеціалізованому залізу — спершу окремому, потім вбудованому ближче до даних.</tspan></text>
