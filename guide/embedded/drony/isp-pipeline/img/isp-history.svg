<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як обробка кадру перейшла з коду в залізо</text>
<rect x="40.0" y="58.0" width="285.0" height="232.0" rx="12" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="182.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1990-ті</text>
<rect x="54.0" y="96.0" width="257.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="182.5" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="182.5" dy="0.0">Код на процесорі / DSP</tspan></text>
<text x="182.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Конвеєр = програма</text>
<text x="182.5" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">≈1 секунда на кадр</text>
