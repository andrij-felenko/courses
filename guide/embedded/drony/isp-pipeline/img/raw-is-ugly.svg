<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сирий кадр негодящий — що лагодять перші стадії</text>
<rect x="40.0" y="52.0" width="180.0" height="200.0" rx="10" fill="#fff6f6" stroke="#2457d6" stroke-width="1.4"/>
<text x="130.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Темний п'єдестал</text>
<text x="130.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Навіть у пітьмі лічильник</tspan><tspan x="130.0" dy="14.9">дає не 0, а ~64. Усе фото</tspan><tspan x="130.0" dy="14.9">підняте — сіра поволока.</tspan></text>
<line x1="54.0" y1="196.0" x2="206.0" y2="196.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="52.0" y="208.0" width="156.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Чорний рівень: відняти</tspan></text>
<rect x="260.0" y="52.0" width="180.0" height="200.0" rx="10" fill="#fff6f6" stroke="#2457d6" stroke-width="1.4"/>
<text x="350.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Биті пікселі</text>
<text x="350.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Кілька комірок «залипли»</tspan><tspan x="350.0" dy="14.9">яскраві чи мертві —</tspan><tspan x="350.0" dy="14.9">кольорові цятки на кадрі.</tspan></text>
<line x1="274.0" y1="196.0" x2="426.0" y2="196.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="272.0" y="208.0" width="156.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Латка: взяти середнє сусідів</tspan></text>
<rect x="480.0" y="52.0" width="180.0" height="200.0" rx="10" fill="#fff6f6" stroke="#2457d6" stroke-width="1.4"/>
<text x="570.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Темні кути</text>
<text x="570.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Лінза пропускає в центр</tspan><tspan x="570.0" dy="14.9">більше світла, ніж у кути —</tspan><tspan x="570.0" dy="14.9">кадр темніє до країв.</tspan></text>
<line x1="494.0" y1="196.0" x2="646.0" y2="196.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="492.0" y="208.0" width="156.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Віньєтка: підняти краї</tspan></text>
<rect x="700.0" y="52.0" width="180.0" height="200.0" rx="10" fill="#fff6f6" stroke="#2457d6" stroke-width="1.4"/>
<text x="790.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Зелений відтінок</text>
<text x="790.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Матриця ловить більше</tspan><tspan x="790.0" dy="14.9">зеленого. Білий аркуш</tspan><tspan x="790.0" dy="14.9">виходить зеленавим.</tspan></text>
<line x1="714.0" y1="196.0" x2="866.0" y2="196.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="712.0" y="208.0" width="156.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Баланс білого: зрівняти</tspan></text>
</svg>