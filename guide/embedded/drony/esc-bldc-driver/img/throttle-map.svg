<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір команди DShot: одне число — три зони</text>
<rect x="60.0" y="110.0" width="3.0" height="64.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<line x1="61.5" y1="110.0" x2="61.5" y2="98.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="61.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0</text>
<text x="61.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">роззброєно</text>
<rect x="60.3" y="110.0" width="16.1" height="64.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<line x1="68.4" y1="110.0" x2="68.4" y2="72.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="68.4" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1…47</text>
<text x="68.4" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">службові</text>
<rect x="76.4" y="110.0" width="683.6" height="64.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="418.2" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">справжній газ</text>
<text x="418.2" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">48…2047</text>
<text x="418.2" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рівно 2000 кроків</text>
<text x="60.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="760.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">2047</text>
<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Службові команди (1…47) ESC слухає лише на зупиненому моторі — у польоті це завжди газ.</text>
<text x="410.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зсув на 48 лишає окрему зону під команди, не крадучи в газу дозволу біля нуля.</text>
</svg>