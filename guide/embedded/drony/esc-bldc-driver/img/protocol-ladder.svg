<rect x="117.0" y="334.2" width="625.9" height="51.6" rx="6" fill="#f7faf8" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Перші чотири — одна ідея (коротший аналоговий імпульс) на межі точності.</tspan><tspan x="430.0" dy="15.6">DShot — інша ідея: число їде бітами з контрольною сумою, тож стелі точності більше нема.</tspan></text>
