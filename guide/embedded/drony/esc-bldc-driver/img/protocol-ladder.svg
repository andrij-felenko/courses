<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сходи протоколів ESC: чотири кроки тиснули імпульс — п'ятий змінив саму ідею</text>
<line x1="50.0" y1="250.0" x2="810.0" y2="250.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Аналоговий імпульс: газ = тривалість</text>
<text x="50.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">коротшає рік за роком, але «де точно край» лишається на око — стеля точності</text>
