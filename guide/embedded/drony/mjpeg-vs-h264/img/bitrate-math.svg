<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки важить потік: піксельний потік ÷ стиск</text>
<rect x="60.0" y="70.0" width="250.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="185.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">СИРИЙ ПОТІК</tspan><tspan x="185.0" dy="16.9">1280 × 720</tspan><tspan x="185.0" dy="16.9">× 30 к/с</tspan><tspan x="185.0" dy="16.9">× 12 біт/піксель (YUV420)</tspan><tspan x="185.0" dy="16.9">= 331 Мбіт/с</tspan></text>
<line x1="320.0" y1="145.0" x2="380.0" y2="145.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="390.0" y="60.0" width="220.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="500.0" y="82.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">MJPEG</tspan><tspan x="500.0" dy="16.9">÷ 10</tspan><tspan x="500.0" dy="16.9">= 33 Мбіт/с</tspan></text>
<rect x="390.0" y="160.0" width="220.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">H.264</tspan><tspan x="500.0" dy="16.9">÷ 100</tspan><tspan x="500.0" dy="16.9">= 3.3 Мбіт/с</tspan></text>
<line x1="610.0" y1="95.0" x2="670.0" y2="95.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="195.0" x2="670.0" y2="195.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="60.0" width="200.0" height="70.0" rx="6" fill="#fff4e8" stroke="#c96a1b" stroke-width="1.6"/><text x="780.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Wi-Fi тягне</tspan><tspan x="780.0" dy="15.6">ледве-ледве</tspan></text>
<rect x="680.0" y="160.0" width="200.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="780.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">лізе навіть</tspan><tspan x="780.0" dy="15.6">у вузький радіоканал</tspan></text>
<rect x="120.0" y="300.0" width="680.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="460.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">бітрейт ≈ (ширина × висота × к/с × біт-на-піксель) ÷ коефіцієнт_стиску</tspan><tspan x="460.0" dy="15.6">менший коефіцієнт → більший файл, але простіше й стійкіше</tspan></text>
