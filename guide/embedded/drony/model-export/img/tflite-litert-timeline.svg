<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як .tflite відв'язувався від TensorFlow</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="150.0" y1="380.0" x2="150.0" y2="394.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="150.0" cy="92.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="136.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">2017</text>
<rect x="180.0" y="68.2" width="380.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">TFLite дебютує під TensorFlow.</tspan><tspan x="370.0" dy="14.3">Формат .tflite = FlatBuffer; читати</tspan><tspan x="370.0" dy="14.3">вмієш лише з TensorFlow.</tspan></text>
<circle cx="150.0" cy="197.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="136.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2020-2023</text>
<rect x="180.0" y="173.2" width="380.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="370.0" y="192.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Конвертери вчаться брати моделі</tspan><tspan x="370.0" dy="14.3">з PyTorch, JAX, Keras. Формат той</tspan><tspan x="370.0" dy="14.3">самий — а рамка вже не одна.</tspan></text>
<circle cx="150.0" cy="302.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="136.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">4 вер. 2024</text>
<rect x="180.0" y="278.2" width="380.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="297.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Перейменування на LiteRT (Lite</tspan><tspan x="370.0" dy="14.3">Runtime). Назва нарешті збіглася</tspan><tspan x="370.0" dy="14.3">з дійсністю: рушій багаторамковий.</tspan></text>
<circle cx="150.0" cy="392.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="136.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">після</text>
<rect x="180.0" y="368.2" width="380.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="387.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Розширення .tflite лишилось,</tspan><tspan x="370.0" dy="14.3">старі файли читаються, продакшн</tspan><tspan x="370.0" dy="14.3">не зламався. Змінилась вивіска.</tspan></text>
<text x="410.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Файл не змінився ні разу — змінювалося тільки те, ЗВІДКИ він міг прийти.</text>
</svg>