<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Гібрид на практиці: кожній задачі — свій рівень</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">польотний контролер (МК): керування + TinyML; бортовий комп'ютер: зір у реальному часі → MAVLink; хмара: навчання й аналіз</text>
<rect x="50" y="114" width="590" height="286" rx="12" fill="#f0fdf4" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="345" y="136" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">НА БОРТУ (реальний час, без мережі)</text>
<rect x="78" y="156" width="250" height="118" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="203" y="180" font-size="9.4" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛЬОТНИЙ КОНТРОЛЕР (МК)</text>
<text x="96" y="204" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• керування, стабілізація</text>
<text x="96" y="223" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• завжди-ввімкнений TinyML</text>
<text x="96" y="242" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (слово, жест)</text>
<rect x="362" y="156" width="250" height="118" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="487" y="180" font-size="9.4" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ КОМП'ЮТЕР</text>
<text x="380" y="204" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• детектор / трекінг у</text>
<text x="380" y="223" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  реальному часі</text>
<text x="380" y="242" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• кут → MAVLink контролеру</text>
<line x1="362" y1="256" x2="330" y2="256" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="345" y="300" font-size="7.6" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">кут (MAVLink)</text>
<text x="345" y="384" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">усе, від чого залежить політ — тут; працює й без зв'язку</text>
<rect x="686" y="168" width="224" height="150" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="6,4"/>
<text x="798" y="192" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ХМАРА / ЗЕМЛЯ</text>
<text x="798" y="208" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(поза польотним контуром)</text>
<text x="704" y="230" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• навчання моделей</text>
<text x="704" y="248" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• аналіз логів і відео</text>
<text x="704" y="266" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• побудова карт</text>
<text x="704" y="284" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">— не термінове, офлайн</text>
<line x1="642" y1="240" x2="682" y2="240" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="662" y="230" font-size="7" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">коли є</text>
<text x="662" y="256" font-size="7" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зв'язок</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Розклади задачі по рівнях: миттєве й критичне — на борту; важке й не термінове — у хмару. Так робить і дрон, і марсохід.</text>
</svg>
