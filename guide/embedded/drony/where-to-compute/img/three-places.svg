<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Три місця для обчислень</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">МК на польотному контролері (крихітний, миттєвий); бортовий комп'ютер (потужний); хмара (безмежна, та із затримкою і потрібен зв'язок)</text>
<rect x="50" y="118" width="280" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.9"/>
<rect x="50" y="118" width="280" height="36" rx="10" fill="#cc0000" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="190" y="141" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">МК (контролер)</text>
<text x="74" y="180" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">КБ · МГц · мВт</text>
<text x="74" y="206" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">миттєво, на борту</text>
<text x="74" y="232" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">TinyML: слово,</text>
<text x="74" y="258" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">жест, класифікація</text>
<text x="340" y="222" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<rect x="350" y="118" width="280" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<rect x="350" y="118" width="280" height="36" rx="10" fill="#d98a00" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="490" y="141" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ КОМП'ЮТЕР</text>
<text x="374" y="180" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ГБ · GPU / прискорювач</text>
<text x="374" y="206" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">мала затримка, на борту</text>
<text x="374" y="232" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">справжні CNN:</text>
<text x="374" y="258" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">детектор, трекінг</text>
<text x="640" y="222" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<rect x="650" y="118" width="280" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<rect x="650" y="118" width="280" height="36" rx="10" fill="#1f4ed8" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="790" y="141" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ХМАРА / ЗЕМЛЯ</text>
<text x="674" y="180" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">безмежна потужність</text>
<text x="674" y="206" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">та 100+ мс мережі</text>
<text x="674" y="232" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">потрібен зв'язок</text>
<text x="674" y="258" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">важке, навчання</text>
<line x1="80" y1="372" x2="880" y2="372" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="110" y="392" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">більше потужності →</text>
<text x="850" y="392" font-size="10" fill="#15803d" text-anchor="end" font-weight="bold" font-style="normal">← менша затримка, ← автономність</text>
<text x="480.0" y="414" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">що далі від апарата — то більше потужності, але більша затримка й менша автономність</text>
<text x="480.0" y="456" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Немає «найкращого» місця — є придатне під задачу. Ближче до апарата — швидше й автономніше, та слабше.</text>
</svg>
