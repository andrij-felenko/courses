  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що з чим торгуємо</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">потужність росте від МК до хмари — та разом росте затримка й падає автономність; вага й приватність теж важать</text>
<rect x="350" y="110" width="160" height="32" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="430" y="131" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">МК</text>
<rect x="530" y="110" width="160" height="32" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.3"/>
<text x="610" y="131" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">БОРТОВИЙ</text>
<rect x="710" y="110" width="160" height="32" rx="6" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="790" y="131" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ХМАРА</text>
