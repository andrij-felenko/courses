<rect x="350" y="152" width="160" height="40" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="430" y="177" font-size="9.2" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">мала</text>
<rect x="530" y="152" width="160" height="40" rx="6" fill="#fff5e6" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="610" y="177" font-size="9.2" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">велика</text>
<rect x="710" y="152" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="790" y="177" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">безмежна</text>
<text x="70" y="224" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">затримка</text>
<rect x="350" y="200" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="430" y="225" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">миттєва</text>
<rect x="530" y="200" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="610" y="225" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">низька (мс)</text>
<rect x="710" y="200" width="160" height="40" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="790" y="225" font-size="9.2" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">мережева (100+ мс)</text>
<text x="70" y="272" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">автономність</text>
<rect x="350" y="248" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="430" y="273" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">повна</text>
<rect x="530" y="248" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="610" y="273" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">повна</text>
<rect x="710" y="248" width="160" height="40" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="790" y="273" font-size="9.2" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">лише зі зв'язком</text>
<text x="70" y="320" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">вага / енергія</text>
