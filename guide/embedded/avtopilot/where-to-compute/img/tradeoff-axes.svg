<text x="430" y="321" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">дрібка</text>
<rect x="530" y="296" width="160" height="40" rx="6" fill="#fff5e6" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="610" y="321" font-size="9.2" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">вати + грами</text>
<rect x="710" y="296" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="790" y="321" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">поза бортом</text>
<text x="70" y="368" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">приватність</text>
<rect x="350" y="344" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="430" y="369" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">на борту</text>
<rect x="530" y="344" width="160" height="40" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="610" y="369" font-size="9.2" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">на борту</text>
<rect x="710" y="344" width="160" height="40" rx="6" fill="#fde2e2" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="790" y="369" font-size="9.2" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">дані йдуть геть</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Що далі від апарата — то потужніше, та дорожче за затримкою й автономністю. Обирай під вимоги задачі.</text>
