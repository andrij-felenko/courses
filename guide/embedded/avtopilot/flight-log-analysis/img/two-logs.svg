<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Один політ — два різні записи</text>
<rect x="381.4" y="77.5" width="177.1" height="37.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Автопілот у польоті</tspan></text>
<line x1="410.0" y1="110.0" x2="280.0" y2="168.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="125.0" y="181.5" width="230.0" height="37.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Бортовий лог  .bin</tspan></text>
<text x="240.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• пишеться на SD/флеш борту</text>
<text x="240.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• повна, «сира» частота (кГц)</text>
<text x="240.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• нічого не губиться</text>
<text x="240.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• читаємо ПІСЛЯ посадки</text>
<line x1="530.0" y1="110.0" x2="660.0" y2="168.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">по радіо, ~поки летимо</text>
<rect x="585.0" y="181.5" width="230.0" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Телеметрійний лог  .tlog</tspan></text>
<text x="700.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• пишеться на землі (станція)</text>
<text x="700.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• лише те, що влізло в канал</text>
<text x="700.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• рідше, дещо губиться</text>
<text x="700.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• бачимо наживо в польоті</text>
<text x="470.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розслідування падіння — це майже завжди бортовий .bin: у ньому є все й на повній частоті.</text>
<text x="470.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Телеметрійний .tlog зручний, коли борт не пережив падіння, а на землі щось таки записалося.</text>
</svg>