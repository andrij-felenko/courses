<rect x="81.9" y="391.4" width="816.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="490.0" y="410.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Аліасинг: реальна тряска 700 Гц при семплі 1 кГц з'явиться в спектрі як 300 Гц (700 → |1000−700| = 300).</tspan><tspan x="490.0" dy="14.3">Тому семплюють ШВИДКО (≥ вдвічі за найвищу цікаву частоту) і фільтрують ДО семплування — інакше привид не відрізниш від правди.</tspan></text>
