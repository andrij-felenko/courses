<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектор поля Землі F та його кути: схилення D і нахилення I</text>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">вид згори · горизонтальна площина</text>
<line x1="250.0" y1="180.0" x2="250.0" y2="460.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="110.0" y1="320.0" x2="390.0" y2="320.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="250.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">істинна Пн</text>
<text x="250.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пд</text>
<text x="412.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сх</text>
<text x="88.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зх</text>
<line x1="250.0" y1="320.0" x2="301.2" y2="204.9" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="313.2" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">H → магнітна Пн</text>
<path d="M250.0 260.0 A60.0 60.0 0 0 1 274.4 265.2" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="280.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">D — схилення</text>
<text x="720.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">вертикальний зріз · площина поля</text>
<line x1="640.0" y1="250.0" x2="890.0" y2="250.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="660.0" y1="230.0" x2="660.0" y2="460.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="894.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">горизонт</text>
<text x="652.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">вгору</text>
<line x1="660.0" y1="250.0" x2="766.2" y2="407.5" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="778.2" y="413.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">F — повне поле</text>
<line x1="766.2" y1="407.5" x2="766.2" y2="250.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="3,3"/>
<line x1="660.0" y1="250.0" x2="766.2" y2="250.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="713.1" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">H</text>
<text x="780.2" y="334.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Z</text>
<path d="M710.0 250.0 A50.0 50.0 0 0 1 688.0 291.5" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="724.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">I — нахилення</text>
<rect x="220.2" y="477.4" width="559.5" height="69.2" rx="6" fill="#f4f8f4" stroke="#27ae60" stroke-width="1.6"/><text x="500.0" y="500.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">WMM видає повний вектор F(широта, довгота, висота, дата).</tspan><tspan x="500.0" dy="15.6">Звідси H = F·cos I,  Z = F·sin I,  а D — кут H від істинної півночі.</tspan><tspan x="500.0" dy="15.6">Компас без поправки показує вздовж H (магнітна Пн); різницю D додає автопілот.</tspan></text>
</svg>