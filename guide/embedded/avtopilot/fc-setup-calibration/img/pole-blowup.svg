<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому схилення різко гуляє біля магнітного полюса</text>
<text x="255.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">середні широти</text>
<text x="255.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поле нахилене, H великий</text>
<circle cx="255.0" cy="260.0" r="120.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="255.0" y1="140.0" x2="255.0" y2="380.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="135.0" y1="260.0" x2="375.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="255.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">істинна Пн</text>
<line x1="255.0" y1="260.0" x2="284.7" y2="168.7" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="296.7" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">H</text>
<text x="255.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">H довгий → напрям чіткий → D певне</text>
<text x="745.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">приполюсна зона</text>
<text x="745.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поле майже прямовисне, I → 90°</text>
<circle cx="745.0" cy="260.0" r="120.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="745.0" y1="140.0" x2="745.0" y2="380.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="625.0" y1="260.0" x2="865.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="745.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">істинна Пн</text>
<line x1="745.0" y1="260.0" x2="722.4" y2="251.8" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="733.0" y2="239.2" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="747.1" y2="236.1" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="760.4" y2="241.6" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="768.6" y2="255.8" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="765.8" y2="272.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="745.0" y1="260.0" x2="724.2" y2="272.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="745.0" cy="260.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="745.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">H крихітний → напрям стрибає → D невизначене</text>
<line x1="500.0" y1="70.0" x2="500.0" y2="400.0" stroke="#dddddd" stroke-width="1.2"/>
<rect x="275.0" y="427.4" width="450.1" height="69.2" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/><text x="500.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">H = F·cos I.  Біля полюса I → 90°, тож cos I → 0 і H → 0.</tspan><tspan x="500.0" dy="15.6">Мала похибка вектора обертає крихітний H на десятки градусів —</tspan><tspan x="500.0" dy="15.6">тому в приполюсній зоні (H &lt; 2000 нТ) схилення WMM ненадійне.</tspan></text>
</svg>