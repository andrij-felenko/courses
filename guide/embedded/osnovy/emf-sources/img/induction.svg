<text x="540.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ℰ</text>
<rect x="150.0" y="143.0" width="50.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="175.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">N</text>
<rect x="200.0" y="143.0" width="50.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="225.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">S</text>
<line x1="260.0" y1="165.0" x2="350.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="305.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">рух</text>
<line x1="255.0" y1="135.0" x2="412.0" y2="135.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4,4"/>
<line x1="255.0" y1="165.0" x2="412.0" y2="165.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4,4"/>
<line x1="255.0" y1="195.0" x2="412.0" y2="195.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="325.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">магнітний потік Φ</text>
<rect x="250.0" y="287.5" width="200.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">ℰ = − N · ΔΦ / Δt</tspan></text>
<text x="350.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Доки магніт рухається — потік крізь витки змінюється, наводиться ЕРС (тим більша, чим швидша зміна й більше витків).</text>
<text x="350.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Нерухомий магніт потоку не міняє — ЕРС нема. Знак Ленца: наведений струм протидіє зміні.</text>
</svg>