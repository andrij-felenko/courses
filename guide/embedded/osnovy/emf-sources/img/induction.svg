<circle cx="430.0" cy="195.0" r="14.0" fill="none" stroke="#7a4ddb" stroke-width="3.0"/>
<circle cx="430.0" cy="225.0" r="14.0" fill="none" stroke="#7a4ddb" stroke-width="3.0"/>
<text x="430.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4ddb" text-anchor="middle" font-weight="700">котушка (N витків)</text>
<line x1="444.0" y1="105.0" x2="540.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="444.0" y1="225.0" x2="540.0" y2="225.0" stroke="#1a1a1a" stroke-width="2.0"/>
