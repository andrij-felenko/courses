<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електромагнітна індукція: зміна потоку крізь виток дає ЕРС</text>
<circle cx="430.0" cy="105.0" r="14.0" fill="none" stroke="#7a4ddb" stroke-width="3.0"/>
<circle cx="430.0" cy="135.0" r="14.0" fill="none" stroke="#7a4ddb" stroke-width="3.0"/>
