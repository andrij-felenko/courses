<line x1="90.0" y1="110.0" x2="90.0" y2="260.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="90.0" y1="260.0" x2="346.0" y2="260.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="84.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">енергія</text>
<line x1="90.0" y1="214.0" x2="340.0" y2="214.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 3"/>
