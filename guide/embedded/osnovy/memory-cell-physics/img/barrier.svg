<line x1="590.0" y1="214.0" x2="630.0" y2="214.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">тонкий кінчик</text>
<text x="620.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">сильне поле нахиляє стіну → e⁻ тунелює</text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Уся хитрість запису й стирання — зробити кінчик бар'єра достатньо тонким, щоб струм електронів потік.</text>
