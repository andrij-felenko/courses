<text x="210.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">поле відсутнє: e⁻ відскакує</text>
<rect x="430.0" y="60.0" width="360.0" height="240.0" rx="6" fill="#fcfcfd" stroke="#e6e6ea" stroke-width="1.4"/>
<text x="610.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">оксид під сильним полем</text>
<line x1="490.0" y1="110.0" x2="490.0" y2="260.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="490.0" y1="260.0" x2="746.0" y2="260.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="484.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">енергія</text>
<line x1="490.0" y1="214.0" x2="740.0" y2="214.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="742.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">рівень e⁻</text>
<path d="M 580.0 260.0 L 580.0 130.0 L 640.0 260.0 Z" fill="#eef0f4" stroke="#b9770e" stroke-width="1.8"/>
