<line x1="280.0" y1="266.0" x2="280.0" y2="278.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="320.0" y1="266.0" x2="320.0" y2="278.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="500.0" y="240.0" width="40.0" height="26.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<line x1="520.0" y1="224.0" x2="520.0" y2="240.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="509.0" y1="224.0" x2="531.0" y2="224.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="500.0" y1="266.0" x2="500.0" y2="278.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="540.0" y1="266.0" x2="540.0" y2="278.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="300.0" y1="224.0" x2="300.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="520.0" y1="224.0" x2="520.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="300.0" y1="224.0" x2="300.0" y2="120.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="520.0" y1="224.0" x2="520.0" y2="120.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="250.0" y1="253.0" x2="280.0" y2="253.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="540.0" y1="253.0" x2="570.0" y2="253.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="210.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">біт-лінія</text>
<text x="610.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">біт-лінія</text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">2 транзистори доступу пускають читання/запис лише обраної комірки</text>
<rect x="53.0" y="121.0" width="134.0" height="108.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Лише два стійкі</tspan><tspan x="120.0" dy="13.0">стани: Q=1,Q̄=0</tspan><tspan x="120.0" dy="13.0">або Q=0,Q̄=1.</tspan><tspan x="120.0" dy="13.0">Кожен інвертор</tspan><tspan x="120.0" dy="13.0">підживлює інший —</tspan><tspan x="120.0" dy="13.0">біт тримає сам себе,</tspan><tspan x="120.0" dy="13.0">доки є живлення.</tspan></text>
<rect x="621.6" y="121.0" width="156.8" height="108.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Ціна — 6 транзисторів:</tspan><tspan x="700.0" dy="13.0">4 на петлю + 2 доступ.</tspan><tspan x="700.0" dy="13.0">Комірка велика → SRAM</tspan><tspan x="700.0" dy="13.0">дорога й місткості мало.</tspan><tspan x="700.0" dy="13.0">Зате блискавична</tspan><tspan x="700.0" dy="13.0">(читати — лише глянути)</tspan><tspan x="700.0" dy="13.0">й без освіження.</tspan></text>
<text x="410.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«Статична» — бо стан тримається сам, без періодичного відновлення.</text>
<text x="410.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Місце SRAM: кеші процесора й мала швидка робоча пам'ять мікроконтролера.</text>
</svg>