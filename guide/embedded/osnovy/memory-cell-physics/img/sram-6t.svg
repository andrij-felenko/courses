<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRAM: біт тримає петля з двох інверторів</text>
<path d="M 320 150 L 320 200 L 372 175 Z" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
