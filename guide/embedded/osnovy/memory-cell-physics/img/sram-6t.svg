<text x="340.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">інвертор 1</text>
<text x="480.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">інвертор 2</text>
<line x1="381.0" y1="168.0" x2="446.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.0"/>
<polyline points="446,152 446,152" fill="none"/>
<line x1="381.0" y1="168.0" x2="444.0" y2="153.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="439.0" y1="182.0" x2="376.0" y2="198.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="412.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">вихід одного → вхід іншого</text>
<text x="298.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Q=1</text>
<text x="522.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Q̄=0</text>
<line x1="300.0" y1="120.0" x2="520.0" y2="120.0" stroke="#b9770e" stroke-width="2.4"/>
<text x="410.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">лінія слова (вибір комірки)</text>
<rect x="280.0" y="240.0" width="40.0" height="26.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
