<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Flash: керівний затвор бачить плавучий крізь ємнісний подільник</text>
<rect x="60.0" y="70.0" width="250.0" height="250.0" rx="6" fill="#fcfcfd" stroke="#e6e6ea" stroke-width="1.4"/>
<rect x="80.0" y="96.0" width="210.0" height="26.0" rx="6" fill="#dfe6f5" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="185.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">керівний затвор (VCG)</text>
<text x="315.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="start" font-weight="700">Cono</text>
<line x1="290.0" y1="128.0" x2="310.0" y2="128.0" stroke="#b9770e" stroke-width="1.4"/>
<rect x="80.0" y="150.0" width="210.0" height="28.0" rx="6" fill="#fff2cc" stroke="#b9770e" stroke-width="2.0"/>
<text x="185.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">ПЛАВУЧИЙ затвор (VFG)</text>
<text x="104.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="138.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="172.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="206.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="240.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="274.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="315.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Ctun</text>
<line x1="290.0" y1="191.0" x2="310.0" y2="191.0" stroke="#2457d6" stroke-width="1.4"/>
<rect x="80.0" y="206.0" width="210.0" height="12.0" rx="6" fill="#f3f5fd" stroke="#6b7280" stroke-width="1.0"/>
<rect x="80.0" y="224.0" width="210.0" height="26.0" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.3"/>
<text x="185.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">канал / підкладка</text>
<text x="185.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-style="italic">два конденсатори послідовно:</text>
<text x="185.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Cono згори, Ctun знизу — подільник напруги</text>
<rect x="300.0" y="70.0" width="510.0" height="250.0" rx="6" fill="#fff8e8" stroke="#b9770e" stroke-width="1.5"/><text x="555.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Плавучий затвор ні до чого не під'єднаний, тож напруга на ньому —</tspan><tspan x="555.0" dy="13.0">результат ЄМНІСНОГО ПОДІЛУ прикладеної VCG (як подільник з двох C):</tspan><tspan x="555.0" dy="13.0"></tspan><tspan x="555.0" dy="13.0">коефіцієнт зв'язку:   αG = Cono / (Cono + Ctun)</tspan><tspan x="555.0" dy="13.0">напруга плавучого:    VFG ≈ αG · VCG   +   Qfg / (Cono + Ctun)</tspan><tspan x="555.0" dy="13.0"></tspan><tspan x="555.0" dy="13.0">Замкнений заряд Qfg (від'ємний) зсуває поріг, який «бачить» керівний</tspan><tspan x="555.0" dy="13.0">затвор, рівно на:</tspan><tspan x="555.0" dy="13.0"></tspan><tspan x="555.0" dy="13.0">ΔVt = − Qfg / Cono          (більше електронів → вищий поріг → «0»)</tspan><tspan x="555.0" dy="13.0"></tspan><tspan x="555.0" dy="13.0">Тому: (1) великий αG треба, щоб помірна VCG створила сильне поле в оксиді;</tspan><tspan x="555.0" dy="13.0">(2) заряд читається просто як зсув порога — не чіпаючи самого заряду.</tspan></text>
<text x="420.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Уся арифметика Flash — це один ємнісний подільник: заряд у пастці додає сталий доданок до порога, а αG задає «важіль» керівного затвора.</text>
</svg>