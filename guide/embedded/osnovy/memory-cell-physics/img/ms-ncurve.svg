<rect x="609.0" y="90.2" width="102.1" height="239.6" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">N-крива: струм,</tspan><tspan x="660.0" dy="11.7">що треба</tspan><tspan x="660.0" dy="11.7">вприснути у</tspan><tspan x="660.0" dy="11.7">вузол, щоб</tspan><tspan x="660.0" dy="11.7">тримати його</tspan><tspan x="660.0" dy="11.7">на напрузі V.</tspan><tspan x="660.0" dy="11.7"></tspan><tspan x="660.0" dy="11.7">SVNM — ширина</tspan><tspan x="660.0" dy="11.7">між нулями:</tspan><tspan x="660.0" dy="11.7">макс. напруга</tspan><tspan x="660.0" dy="11.7">завади до зриву.</tspan><tspan x="660.0" dy="11.7"></tspan><tspan x="660.0" dy="11.7">SINM — висота</tspan><tspan x="660.0" dy="11.7">горба: макс.</tspan><tspan x="660.0" dy="11.7">струм завади.</tspan><tspan x="660.0" dy="11.7"></tspan><tspan x="660.0" dy="11.7">WTV/WTI —</tspan><tspan x="660.0" dy="11.7">ті самі міри</tspan><tspan x="660.0" dy="11.7">для запису.</tspan></text>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">N-крива міряє те саме, що метелик, але напряму в струмах: одна крива дає і читабельність (SVNM, SINM), і записуваність (WTV, WTI) — тому її й ставлять у сучасні вимірювальні структури на кристалі.</text>
