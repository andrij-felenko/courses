<text x="677.5" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle">спадає з r</text>
<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">У режимі читання нульовий вузол через відкритий транзистор доступу з'єднаний з високою біт-лінією; поділ між Rдост і Rтяг тримає його вище нуля — саме це підняття стискає лопать метелика.</text>
</svg>