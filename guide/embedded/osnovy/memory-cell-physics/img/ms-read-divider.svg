<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читання «0»: подільник напруги піднімає нульовий вузол</text>
<rect x="30.0" y="52.0" width="340.0" height="300.0" rx="6" fill="#fcfcfd" stroke="#e6e6ea" stroke-width="1.4"/>
<line x1="200.0" y1="70.0" x2="200.0" y2="100.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="200.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">біт-лінія ≈ Vdd</text>
<rect x="166.0" y="100.0" width="68.0" height="40.0" rx="6" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.8"/>
<text x="200.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Rдост</text>
<line x1="148.0" y1="120.0" x2="166.0" y2="120.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="144.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#27ae60" text-anchor="end">WL</text>
<line x1="200.0" y1="140.0" x2="200.0" y2="176.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="200.0" cy="158.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="212.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">вузол «0»: Vчит</text>
<rect x="166.0" y="176.0" width="68.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Rтяг</text>
<text x="160.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">«1» на</text>
<text x="160.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">затворі</text>
<line x1="200.0" y1="216.0" x2="200.0" y2="246.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="178.0" y1="246.0" x2="222.0" y2="246.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="186.0" y1="251.0" x2="214.0" y2="251.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="193.0" y1="256.0" x2="207.0" y2="256.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="200.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">земля (0 В)</text>
<text x="200.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle" font-style="italic">струм тече з біт-лінії крізь обидва опори в землю</text>
<text x="200.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle" font-style="italic">→ на середньому вузлі осідає Vчит &gt; 0</text>
<rect x="400.0" y="70.0" width="390.0" height="210.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Подільник (лінійне наближення):</tspan><tspan x="595.0" dy="14.3">  Vчит ≈ Vdd · Rтяг / (Rдост + Rтяг)</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Уведемо відношення комірки r = Rдост/Rтяг</tspan><tspan x="595.0" dy="14.3">  (r ≈ (W/L)тяг / (W/L)дост):</tspan><tspan x="595.0" dy="14.3">  Vчит ≈ Vdd / (1 + r)</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">r велике (широкий pull-down) → Vчит малий</tspan><tspan x="595.0" dy="14.3">  → лопать майже не тисне → SNM більший.</tspan><tspan x="595.0" dy="14.3">r ≈ 1 → Vчит ≈ Vdd/2 → лопать змикається.</tspan></text>
<line x1="430.0" y1="300.0" x2="430.0" y2="240.0" stroke="#6b7280" stroke-width="1.1"/>
<line x1="430.0" y1="300.0" x2="760.0" y2="300.0" stroke="#6b7280" stroke-width="1.1"/>
<text x="424.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">Vчит</text>
<text x="760.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">r</text>
