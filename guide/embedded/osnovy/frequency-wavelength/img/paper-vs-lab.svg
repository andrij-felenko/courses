<rect x="460.0" y="66.0" width="330.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">У ЛАБОРАТОРІЇ · Герц, 1888</tspan></text>
<rect x="519.2" y="112.4" width="211.5" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">λ зі стоячої хвилі (лінійка)</tspan><tspan x="625.0" dy="15.6">f з будови диполя</tspan><tspan x="625.0" dy="15.6">(обчислена)</tspan></text>
<line x1="625.0" y1="184.0" x2="625.0" y2="216.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
