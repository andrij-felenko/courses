<line x1="215.0" y1="334.0" x2="320.0" y2="358.8" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="625.0" y1="334.0" x2="520.0" y2="358.8" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="280.0" y="358.8" width="280.0" height="54.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="381.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">c ≈ 3 × 10⁸ м/с</tspan><tspan x="420.0" dy="19.5">(швидкість світла)</tspan></text>
<text x="420.0" y="435.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">два незалежні шляхи, жодної причини вести в одне місце — а привели</text>
