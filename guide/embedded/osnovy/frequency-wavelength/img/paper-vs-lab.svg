<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одну швидкість дістали двічі — і числа зійшлися</text>
<rect x="50.0" y="66.0" width="330.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">НА ПАПЕРІ · Максвелл, 1862</tspan></text>
<rect x="122.9" y="112.4" width="184.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">дві електричні сталі</tspan><tspan x="215.0" dy="15.6">ε₀ і μ₀</tspan><tspan x="215.0" dy="15.6">(з дослідів із зарядами)</tspan></text>
<line x1="215.0" y1="184.0" x2="215.0" y2="216.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
