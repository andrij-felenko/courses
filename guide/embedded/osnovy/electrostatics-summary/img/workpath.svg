<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота не залежить від шляху → існує потенціал</text>
<circle cx="120.0" cy="330.0" r="10.0" fill="#eef3ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="102.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">A</text>
<circle cx="610.0" cy="110.0" r="10.0" fill="#eef3ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="628.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">B</text>
<line x1="130.0" y1="324.0" x2="600.0" y2="118.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="375.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">шлях 1</text>
<path d="M 128 322 C 160 130 350 70 598 116" fill="none" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="240.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">шлях 2 (звивистий)</text>
<rect x="115.0" y="150.0" width="250.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Робота поля</tspan><tspan x="240.0" dy="16.9">W = q·(V_A − V_B)</tspan><tspan x="240.0" dy="16.9"></tspan><tspan x="240.0" dy="16.9">однакова обома шляхами.</tspan><tspan x="240.0" dy="16.9">Поле консервативне —</tspan><tspan x="240.0" dy="16.9">тож і зʼявляється</tspan><tspan x="240.0" dy="16.9">потенціал: число на</tspan><tspan x="240.0" dy="16.9">точку, а не на шлях.</tspan></text>
