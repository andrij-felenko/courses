<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складаємо систему по одному заряду з нескінченності</text>
<rect x="30.0" y="50.0" width="720.0" height="96.0" rx="6" fill="#fbfcfe" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="52.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">1-й заряд</text>
<text x="52.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">поля ще нема — приносимо ДАРОМ</text>
<text x="52.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">W₁ = 0</text>
<line x1="710.0" y1="72.0" x2="534.6" y2="84.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">з ∞</text>
<circle cx="518.6" cy="92.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="518.6" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="30.0" y="168.0" width="720.0" height="96.0" rx="6" fill="#fbfcfe" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="52.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">2-й заряд</text>
<text x="52.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">долає поле 1-го</text>
<text x="52.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">W₂ = k·Q²/r₁₂</text>
<circle cx="518.6" cy="210.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="518.6" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="710.0" y1="190.0" x2="617.4" y2="196.4" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">з ∞</text>
<circle cx="601.4" cy="204.4" r="13.0" fill="#f6eef0" stroke="#e0b4bc" stroke-width="1.5"/><text x="601.4" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#d99aa4" text-anchor="middle" font-weight="700">+</text>
<rect x="30.0" y="286.0" width="720.0" height="96.0" rx="6" fill="#fbfcfe" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="52.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">3-й заряд</text>
<text x="52.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">долає поле 1-го і 2-го</text>
<text x="52.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">W₃ = k·Q²/r₁₃ + k·Q²/r₂₃</text>
<circle cx="518.6" cy="328.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="518.6" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="601.4" cy="322.4" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="601.4" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="710.0" y1="308.0" x2="579.6" y2="348.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">з ∞</text>
<circle cx="563.6" cy="356.0" r="13.0" fill="#f6eef0" stroke="#e0b4bc" stroke-width="1.5"/><text x="563.6" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#d99aa4" text-anchor="middle" font-weight="700">+</text>
<rect x="30.0" y="412.0" width="720.0" height="44.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Повна енергія системи = сума всіх цих робіт:  W = W₁ + W₂ + W₃ = Σ (пар) = ½ Σ qᵢVᵢ</tspan></text>
</svg>