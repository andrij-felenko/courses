<rect x="380.0" y="353.2" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">1 В = 1 Дж / 1 Кл</tspan></text>
