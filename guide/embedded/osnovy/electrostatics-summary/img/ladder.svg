<rect x="60.0" y="424.0" width="300.0" height="46.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Енергія й сила</tspan></text>
<rect x="380.0" y="424.0" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">F = qE ,  W = qV</tspan></text>
