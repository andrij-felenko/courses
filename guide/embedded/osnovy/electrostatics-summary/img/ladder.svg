<rect x="60.0" y="70.0" width="300.0" height="46.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Заряд Q</tspan></text>
<rect x="380.0" y="70.0" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Кл — джерело всього</tspan></text>
<line x1="210.0" y1="116.0" x2="210.0" y2="138.8" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
