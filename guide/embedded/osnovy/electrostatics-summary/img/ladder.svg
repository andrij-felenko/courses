<rect x="380.0" y="140.8" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="169.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">F = k·Q₁Q₂ / r²</tspan></text>
<line x1="210.0" y1="186.8" x2="210.0" y2="209.6" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
