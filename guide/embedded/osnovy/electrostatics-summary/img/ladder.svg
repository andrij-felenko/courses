<rect x="380.0" y="282.4" width="340.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">V = W / q   →   V = k·Q / r</tspan></text>
<line x1="210.0" y1="328.4" x2="210.0" y2="351.2" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
