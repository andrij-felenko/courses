<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470">
<rect width="840" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="420.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Електростатика однією картою: як поняття випливають одне з одного</text>
<text x="420.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожна стрілка — питання, що вело далі</text>
<rect x="60.0" y="96.0" width="230.0" height="84.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<text x="175.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗАРЯД</text>
<text x="175.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дві ознаки: + і −</text>
<text x="175.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">квантований, зберігається</text>
<rect x="560.0" y="92.0" width="230.0" height="92.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<text x="675.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">СИЛА — Кулон</text>
<text x="675.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">F = k·q₁·q₂ / r²</text>
<text x="675.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">обернений квадрат</text>
<rect x="60.0" y="300.0" width="300.0" height="104.0" rx="10" fill="#eaf5ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="210.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛЕ  E</text>
<text x="210.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">посередник сили; F = qE</text>
<text x="210.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одиниця Н/Кл = В/м</text>
<text x="210.0" y="381.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«крутість» рельєфу</text>
<rect x="490.0" y="300.0" width="300.0" height="104.0" rx="10" fill="#f3eefb" stroke="#8a52c0" stroke-width="2"/>
<text x="640.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">ПОТЕНЦІАЛ V</text>
<text x="640.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">енергія на заряд: W = qV</text>
<text x="640.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ВОЛЬТ = Дж/Кл</text>
<text x="640.0" y="381.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«висота» рельєфу</text>
<line x1="292.0" y1="138.0" x2="556.0" y2="138.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="424.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">а наскільки сильно?</text>
<line x1="672.0" y1="186.0" x2="430.0" y2="296.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="610.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">що передає силу</text>
<text x="610.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крізь порожнечу?</text>
<line x1="364.0" y1="344.0" x2="486.0" y2="344.0" stroke="#8a52c0" stroke-width="2.6" marker-end="url(#aInk)"/>
<line x1="486.0" y1="360.0" x2="364.0" y2="360.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="425.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">поле ↔ потенціал</text>
<text x="425.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне явище</text>
<rect x="120.0" y="420.0" width="600.0" height="36.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="420.0" y="443.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе разом: заряд → змінює простір (поле / потенціал) → діє силою й енергією на інший заряд.</text>
</svg>
