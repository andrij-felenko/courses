<rect x="51.6" y="95.0" width="168.0" height="66.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="135.6" y="116.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.6" dy="0.0">Ньютон</tspan><tspan x="135.6" dy="15.6">дія на відстані —</tspan><tspan x="135.6" dy="15.6">«безглуздя», але як?</tspan></text>
