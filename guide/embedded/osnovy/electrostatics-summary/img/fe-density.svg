<text x="540.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ширший зазор — більше об'єму поля</text>
<text x="390.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">u = ½ ε₀ E²   [Дж/м³]  —  енергія РОЗЛИТА в полі, а не «в зарядах»</text>
<rect x="40.0" y="368.0" width="700.0" height="50.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Однакове E → однакова густина u; праворуч поле займає більший об'єм → запасено більше.</tspan><tspan x="390.0" dy="16.9">Приберіть заряди — поле щезне, і енергія разом із ним.</tspan></text>
