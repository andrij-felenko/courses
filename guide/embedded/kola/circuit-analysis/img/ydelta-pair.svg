<rect x="60.0" y="288.0" width="300.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">між 1 і 2: пряма сторона R₁₂</tspan><tspan x="210.0" dy="16.2">паралельно з обхідною R₂₃+R₃₁</tspan><tspan x="210.0" dy="16.2">R₁₂ ∥ (R₂₃ + R₃₁)</tspan></text>
