<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Прирівняй ці два вирази для кожної з трьох пар — і дістанеш систему на формули</text>
