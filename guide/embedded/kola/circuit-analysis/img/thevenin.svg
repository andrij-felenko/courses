<rect x="560.0" y="92.0" width="200.0" height="150.0" rx="6" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="660.0" y="124.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">V_th = напруга на</tspan><tspan x="660.0" dy="15.6">РОЗІМКНЕНИХ</tspan><tspan x="660.0" dy="15.6">затискачах</tspan><tspan x="660.0" dy="15.6"></tspan><tspan x="660.0" dy="15.6">R_th = опір із затискачів,</tspan><tspan x="660.0" dy="15.6">усі джерела вимкнено</tspan><tspan x="660.0" dy="15.6">(V→дріт, I→розрив)</tspan></text>
<text x="390.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Нортон — дуально: I_n = V_th/R_th паралельно з тим самим R_th</text>
<text x="390.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Максимум потужності в навантаженні — коли R_н = R_th (узгодження)</text>
