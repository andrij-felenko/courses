<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад системою: два контури, дві невідомі</text>
<rect x="50.0" y="60.0" width="330.0" height="200.0" rx="6" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="215.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Дано: V₁=10, V₂=6 В;</tspan><tspan x="215.0" dy="18.2">R₁=R₂=10 Ω, R₃=20 Ω</tspan><tspan x="215.0" dy="18.2"></tspan><tspan x="215.0" dy="18.2">A:  10 = 30·Iₐ − 20·I_b</tspan><tspan x="215.0" dy="18.2">B:   6 = 30·I_b − 20·Iₐ</tspan><tspan x="215.0" dy="18.2"></tspan><tspan x="215.0" dy="18.2">розв'язок системи:</tspan><tspan x="215.0" dy="18.2">Iₐ = 0.36 А,  I_b = 0.44 А</tspan></text>
<rect x="410.0" y="60.0" width="300.0" height="200.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">струм у R₃ (спільна гілка):</tspan><tspan x="560.0" dy="16.9">I₃ = Iₐ − I_b = −0.08 А</tspan><tspan x="560.0" dy="16.9">(тече знизу вгору)</tspan><tspan x="560.0" dy="16.9"></tspan><tspan x="560.0" dy="16.9">перевірка KVL, контур A:</tspan><tspan x="560.0" dy="16.9">30·0.36 − 20·0.44</tspan><tspan x="560.0" dy="16.9">= 10.8 − 8.8 = 10 В = V₁  ✓</tspan></text>
</svg>