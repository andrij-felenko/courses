<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симулятор як «нульова ітерація»: спіймати помилку до паяння</text>
<rect x="276.0" y="56.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#27ae60" stroke-width="2.4"/>
<text x="360.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1. Намалювати</text>
<text x="360.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перенести схему</tspan><tspan x="360.0" dy="14.4">з паперу у вікно</tspan></text>
<rect x="476.0" y="171.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#2457d6" stroke-width="2.4"/>
<text x="560.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">2. Запустити</text>
<text x="560.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">рушій розв'язує</tspan><tspan x="560.0" dy="14.4">рівняння Кірхгофа</tspan></text>
<rect x="276.0" y="286.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#e08030" stroke-width="2.4"/>
<text x="360.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e08030" text-anchor="middle" font-weight="700">3. Зміряти</text>
<text x="360.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">клік на елемент:</tspan><tspan x="360.0" dy="14.4">V, I, P миттєво</tspan></text>
<rect x="76.0" y="171.0" width="168.0" height="78.0" rx="11" fill="#f4f6f9" stroke="#c0392b" stroke-width="2.4"/>
<text x="160.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">4. Звірити</text>
<text x="160.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">збігається з ручним</tspan><tspan x="160.0" dy="14.4">розрахунком?</tspan></text>
<line x1="450.0" y1="118.0" x2="490.0" y2="165.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="490.0" y1="255.0" x2="450.0" y2="302.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="302.0" x2="230.0" y2="255.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="230.0" y1="165.0" x2="270.0" y2="118.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ціна помилки</text>
<text x="360.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">тут ≈ 0</text>
<text x="360.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(а на платі — час і деталі)</text>
<text x="360.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Цикл крутять, доки числа не зійдуться — і лише тоді беруться за паяльник</text>
</svg>