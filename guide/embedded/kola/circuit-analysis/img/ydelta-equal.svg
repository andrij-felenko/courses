<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Пара в Δ: R ∥ 2R = 2R/3.  Пара в Y: R/3 + R/3 = 2R/3.  Збігається ✓</text>
<text x="390.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Трикутник «жорсткіший» — щоб зірка була така сама, її промені втричі менші</text>
