<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контурний струм автоматично задовольняє закон струмів</text>
<line x1="380.0" y1="64.0" x2="380.0" y2="312.0" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="195.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контурний струм крізь вузол</text>
<circle cx="195.0" cy="180.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="90.0" y1="180.0" x2="180.0" y2="180.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="135.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Iₐ входить</text>
<line x1="210.0" y1="180.0" x2="300.0" y2="180.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="265.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Iₐ виходить</text>
<text x="195.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">те саме Iₐ → втікає = витікає</text>
<text x="195.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">→ закон струмів виконано сам собою</text>
<text x="195.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тож пишемо лише закон напруг по контурах</text>
<text x="575.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки рівнянь? Бери менше</text>
<rect x="440.0" y="116.0" width="290.0" height="170.0" rx="10" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="458.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• контурний метод: L = B−N+1 рівнянь</text>
<text x="458.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• вузловий метод: N−1 рівнянь</text>
<text x="458.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="458.0" dy="0.0">Бери той, де менше — для різних</tspan><tspan x="458.0" dy="14.3">кіл виграє різний метод.</tspan></text>
<text x="458.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="458.0" dy="0.0">Іронія: руками виграє контурний,</tspan><tspan x="458.0" dy="13.0">а машини беруть вузловий / MNA —</tspan><tspan x="458.0" dy="13.0">його легше скласти з netlist.</tspan></text>
</svg>