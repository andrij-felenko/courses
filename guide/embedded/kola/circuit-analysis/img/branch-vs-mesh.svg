<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Менше невідомих → менше рівнянь → швидший розв'язок руками</text>
