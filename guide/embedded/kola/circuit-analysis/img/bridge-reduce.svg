<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місток Вітстона: Y-Δ розчищає шлях згортанню</text>
<text x="120.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Місток не згортається</text>
<line x1="120.0" y1="110.0" x2="60.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="120.0" y1="110.0" x2="180.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="60.0" y1="180.0" x2="120.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="180.0" y1="180.0" x2="120.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="60.0" y1="180.0" x2="180.0" y2="180.0" stroke="#c0392b" stroke-width="2.4"/><circle cx="120.0" cy="110.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="60.0" cy="180.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="180.0" cy="180.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="120.0" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><text x="76.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₁</text><text x="164.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₂</text><text x="120.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">R₅</text><text x="76.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₃</text><text x="164.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₄</text><text x="120.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">T</text><text x="48.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">A</text><text x="192.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">B</text>
<text x="360.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Трикутник (R₁,R₂,R₅) → зірка</text>
<line x1="370.0" y1="110.0" x2="370.0" y2="165.0" stroke="#27ae60" stroke-width="2.6"/><line x1="310.0" y1="180.0" x2="370.0" y2="165.0" stroke="#27ae60" stroke-width="2.6"/><line x1="430.0" y1="180.0" x2="370.0" y2="165.0" stroke="#27ae60" stroke-width="2.6"/><line x1="310.0" y1="180.0" x2="370.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="430.0" y1="180.0" x2="370.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="370.0" cy="110.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="310.0" cy="180.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="430.0" cy="180.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="370.0" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><circle cx="370.0" cy="165.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/><text x="382.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">M</text><text x="380.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">R_T</text><text x="312.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">R_A</text><text x="428.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">R_B</text><text x="326.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₃</text><text x="414.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R₄</text>
<line x1="240.0" y1="180.0" x2="285.0" y2="180.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Тепер згортається</text>
<rect x="560.0" y="110.0" width="190.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">R_A+R₃ = 220 Ω</tspan><tspan x="655.0" dy="16.9">R_B+R₄ = 220 Ω</tspan><tspan x="655.0" dy="16.9">220 ∥ 220 = 110 Ω</tspan><tspan x="655.0" dy="16.9">R_екв = R_T + 110</tspan><tspan x="655.0" dy="16.9">     = 40 + 110 = 150 Ω</tspan><tspan x="655.0" dy="16.9">I = 10/150 = 66.7 мА</tspan></text>
<line x1="505.0" y1="180.0" x2="555.0" y2="180.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Y-Δ прибирає зчепленість → повертає послідовно-паралельні пари → згортання оживає</text>
</svg>