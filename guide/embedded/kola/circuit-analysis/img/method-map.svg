<text x="82.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Згортається (послід./парал.)?</text>
<text x="410.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">→ згортання + дільники</text>
<text x="708.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">найшвидше</text>
<rect x="60.0" y="114.0" width="660.0" height="40.0" rx="8" fill="#f4f6f8" stroke="#8e44ad" stroke-width="2.0"/>
<rect x="60.0" y="114.0" width="8.0" height="40.0" rx="0" fill="#8e44ad" stroke="#333333" stroke-width="0.0"/>
<text x="82.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Місток / зчеплені трикутники?</text>
<text x="410.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">→ спершу Y-Δ, тоді згортання</text>
<text x="708.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">оживляє згортання</text>
<rect x="60.0" y="162.0" width="660.0" height="40.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<rect x="60.0" y="162.0" width="8.0" height="40.0" rx="0" fill="#2457d6" stroke="#333333" stroke-width="0.0"/>
<text x="82.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Кілька джерел?</text>
<text x="410.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">→ накладання АБО система</text>
<text x="708.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">внесок кожного окремо</text>
<rect x="60.0" y="210.0" width="660.0" height="40.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<rect x="60.0" y="210.0" width="8.0" height="40.0" rx="0" fill="#c0392b" stroke="#333333" stroke-width="0.0"/>
<text x="82.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Одне навантаження, різні номінали?</text>
<text x="410.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">→ Тевенен / Нортон</text>
<text x="708.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">усе інше — 2 числа</text>
<rect x="60.0" y="258.0" width="660.0" height="40.0" rx="8" fill="#f4f6f8" stroke="#e08030" stroke-width="2.0"/>
<rect x="60.0" y="258.0" width="8.0" height="40.0" rx="0" fill="#e08030" stroke="#333333" stroke-width="0.0"/>
<text x="82.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Багато вузлів і гілок?</text>
<text x="410.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08030" text-anchor="start" font-weight="700">→ вузловий чи контурний</text>
<text x="708.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">бери, де менше невідомих</text>
<rect x="60.0" y="322.0" width="660.0" height="40.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">І ЗАВЖДИ наприкінці — три самоперевірки: одиниці · баланси Кірхгофа · порядок величин</text>
</svg>