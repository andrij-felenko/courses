<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один рецепт на всі схеми з від'ємним зв'язком</text>
<rect x="40.0" y="96.0" width="123.2" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><circle cx="101.6" cy="126.0" r="16.0" fill="#fff" stroke="#333333" stroke-width="2.0"/><text x="101.6" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">1</text><rect x="48.0" y="152.0" width="107.2" height="56.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="101.6" y="183.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="101.6" dy="0.0">Перевір зв'язок</tspan></text><rect x="46.0" y="212.0" width="111.2" height="80.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="101.6" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="101.6" dy="0.0">петля йде на «−» → правила діють</tspan></text><line x1="165.2" y1="201.0" x2="177.2" y2="201.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="179.2" y="96.0" width="123.2" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><circle cx="240.8" cy="126.0" r="16.0" fill="#fff" stroke="#333333" stroke-width="2.0"/><text x="240.8" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">2</text><rect x="187.2" y="152.0" width="107.2" height="56.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="240.8" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.8" dy="0.0">Постав V₋</tspan></text><rect x="185.2" y="212.0" width="111.2" height="80.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="240.8" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="240.8" dy="0.0">V₋ = V₊ (віртуальне коротке)</tspan></text><line x1="304.4" y1="201.0" x2="316.4" y2="201.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="318.4" y="96.0" width="123.2" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><circle cx="380.0" cy="126.0" r="16.0" fill="#fff" stroke="#333333" stroke-width="2.0"/><text x="380.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">3</text><rect x="326.4" y="152.0" width="107.2" height="56.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="380.0" y="183.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Признач струми</tspan></text><rect x="324.4" y="212.0" width="111.2" height="80.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="380.0" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">кожен резистор: I = ΔV / R</tspan></text><line x1="443.6" y1="201.0" x2="455.6" y2="201.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="457.6" y="96.0" width="123.2" height="210.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><circle cx="519.2" cy="126.0" r="16.0" fill="#fff" stroke="#27ae60" stroke-width="2.0"/><text x="519.2" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">4</text><rect x="465.6" y="152.0" width="107.2" height="56.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="519.2" y="183.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="519.2" dy="0.0">Один KCL у «−»</tspan></text><rect x="463.6" y="212.0" width="111.2" height="80.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="519.2" y="254.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="519.2" dy="0.0">Σ струмів = 0 (у вхід — нуль)</tspan></text><line x1="582.8" y1="201.0" x2="594.8" y2="201.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="596.8" y="96.0" width="123.2" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><circle cx="658.4" cy="126.0" r="16.0" fill="#fff" stroke="#333333" stroke-width="2.0"/><text x="658.4" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle" font-weight="700">5</text><rect x="604.8" y="152.0" width="107.2" height="56.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="658.4" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="658.4" dy="0.0">Розв'яжи</tspan></text><rect x="602.8" y="212.0" width="111.2" height="80.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="658.4" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="658.4" dy="0.0">один рядок → Vout</tspan></text>
<rect x="151.4" y="337.1" width="457.2" height="49.9" rx="6" fill="#fbf7e9" stroke="#caa83a" stroke-width="1.5"/><text x="380.0" y="358.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Жодних формул напам'ять: одне рівняння у вузлі «−»</tspan><tspan x="380.0" dy="16.9">розкриває інвертуючий, суматор, інтегратор — будь-яку схему</tspan></text>
