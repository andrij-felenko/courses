<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">L-ланка у два кроки: спершу опір, тоді реактивність</text>
<text x="105.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Навантаження</text>
<rect x="30.0" y="130.0" width="150.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">R = 200 Ω</tspan><tspan x="105.0" dy="18.2">X = 0</tspan></text>
<text x="315.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Після паралельної</text>
<rect x="240.0" y="130.0" width="150.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="315.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">R → 50 Ω</tspan><tspan x="315.0" dy="18.2">X = залишок</tspan></text>
<text x="525.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Після послідовної</text>
<rect x="450.0" y="130.0" width="150.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="525.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">R = 50 Ω</tspan><tspan x="525.0" dy="18.2">X = 0</tspan></text>
<line x1="186.0" y1="165.0" x2="234.0" y2="165.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="210.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">паралельний</text>
<text x="210.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">рухає R</text>
<line x1="396.0" y1="165.0" x2="444.0" y2="165.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="420.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">послідовний</text>
<text x="420.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">гасить X</text>
<text x="360.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">трансформація опору й гасіння залишку — дві окремі дії двох елементів</text>
</svg>