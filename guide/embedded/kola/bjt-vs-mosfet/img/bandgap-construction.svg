<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бандгап-опора: як VT·ln(N) вирівнює дрейф Vbe з температурою</text>
<line x1="90.0" y1="320.0" x2="610.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="90.0" y1="320.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M610.0 320.0 L602.0 316.0 L602.0 324.0 z" fill="#1a1a1a"/>
<path d="M90.0 80.0 L86.0 88.0 L94.0 88.0 z" fill="#1a1a1a"/>
<text x="610.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">температура T →</text>
<text x="84.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">напруга</text>
<line x1="90.0" y1="123.2" x2="610.0" y2="238.4" stroke="#c0392b" stroke-width="2.6"/>
<text x="173.2" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Vbe (CTAT): падає ≈ −2 мВ/°C</text>
<line x1="90.0" y1="296.0" x2="610.0" y2="180.8" stroke="#2457d6" stroke-width="2.6"/>
<text x="308.4" y="196.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">M·VT·ln(N) (PTAT): росте ≈ +2 мВ/°C</text>
<line x1="90.0" y1="99.2" x2="610.0" y2="99.2" stroke="#27ae60" stroke-width="3.0"/>
<text x="350.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">сума ≈ Eg/q ≈ 1.2 В  (пласка!)</text>
<line x1="412.4" y1="320.0" x2="412.4" y2="99.2" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<circle cx="412.4" cy="194.6" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="412.4" cy="224.6" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<circle cx="412.4" cy="99.2" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="418.4" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">+</text>
<rect x="90.0" y="344.0" width="560.0" height="60.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="365.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Vbe одного переходу спадає з T (доповнює абсолютну — CTAT). Різниця двох Vbe за струмів у N разів дає</tspan><tspan x="370.0" dy="11.7">ΔVbe = VT·ln(N), що РОСТЕ з T (пропорційна абсолютній — PTAT). Підбираєш множник M так, щоб нахили</tspan><tspan x="370.0" dy="11.7">погасилися: Vbe + M·VT·ln(N) ≈ Eg/q ≈ 1.2 В — стала, майже незалежна від температури.</tspan></text>
</svg>