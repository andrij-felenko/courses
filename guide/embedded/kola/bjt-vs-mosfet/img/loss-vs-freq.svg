<rect x="90.0" y="350.0" width="560.0" height="56.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Провідність не залежить від частоти — це поличка. Комутація росте прямо з f_sw. Сума має пологе</tspan><tspan x="370.0" dy="13.0">дно; практично беруть частоту трохи НИЖЧЕ перетину (де комутація ще менша за провідність) —</tspan><tspan x="370.0" dy="13.0">лишаючи запас на нагрів і розкид. Вища f_sw дає менші котушки/конденсатори, але гарячіший ключ.</tspan></text>
