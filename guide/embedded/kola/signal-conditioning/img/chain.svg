<text x="640.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="640.0" dy="0.0">шум +</tspan><tspan x="640.0" dy="12.4">антиаліасинг</tspan><tspan x="640.0" dy="12.4">перед АЦП</tspan></text>
