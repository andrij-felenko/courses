<rect x="70.0" y="232.0" width="800.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Порядок не випадковий: РОЗВ'ЯЗАТИ джерело → ПІДСИЛИТИ й поставити у вікно → ВІДФІЛЬТРУВАТИ перед АЦП.</tspan><tspan x="470.0" dy="17.6">Правило: підсилюй якомога РАНІШЕ, псуй (додавай свій шум) якомога ПІЗНІШЕ.</tspan></text>
