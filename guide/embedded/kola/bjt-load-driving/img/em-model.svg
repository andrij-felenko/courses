<text x="210.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">зворотне перенесення</text>
<rect x="90.0" y="372.0" width="600.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Кожен перехід — звичайний діод (I_F на Б–Е, I_R на Б–К). Але вони НЕ незалежні:</tspan><tspan x="390.0" dy="14.3">частка αF прямого струму «протікає» в колектор, частка αR зворотного — назад в емітер.</tspan><tspan x="390.0" dy="14.3">Це зв'язування двох діодів і робить транзистор транзистором, а не парою окремих діодів.</tspan></text>
</svg>