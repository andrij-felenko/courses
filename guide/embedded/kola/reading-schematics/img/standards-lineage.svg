<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід позначень і символів схеми</text>
<rect x="50.0" y="60.0" width="260.0" height="34.0" rx="6" fill="#eef2f9" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Як деталь звати   (refdes: R, C, U…)</tspan></text>
<rect x="50.0" y="120.0" width="260.0" height="56.0" rx="6" fill="#eef2f9" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">MIL-STD-16</tspan><tspan x="180.0" dy="15.6">військовий стандарт США, від 1950-х</tspan></text>
<rect x="50.0" y="228.0" width="260.0" height="56.0" rx="6" fill="#eef2f9" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">IEEE 200-1975</tspan><tspan x="180.0" dy="15.6">= ANSI Y32.16-1975</tspan><tspan x="180.0" dy="15.6">(згодом withdrawn)</tspan></text>
<line x1="180.0" y1="176.0" x2="180.0" y2="228.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="336.0" width="260.0" height="56.0" rx="6" fill="#e7f4ec" stroke="#27ae60" stroke-width="1.8"/><text x="180.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ASME Y14.44-2008</tspan><tspan x="180.0" dy="15.6">чинний</tspan></text>
<line x1="180.0" y1="284.0" x2="180.0" y2="336.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="60.0" width="260.0" height="34.0" rx="6" fill="#fdf1e7" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Яким значком малювати</tspan></text>
<rect x="410.0" y="120.0" width="260.0" height="78.0" rx="6" fill="#fdf1e7" stroke="#c0392b" stroke-width="1.8"/><text x="540.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">IEEE 315-1975</tspan><tspan x="540.0" dy="15.6">= ANSI Y32.2-1975</tspan><tspan x="540.0" dy="15.6">резистор — зигзаг</tspan><tspan x="540.0" dy="15.6">(США, Канада)</tspan></text>
<rect x="410.0" y="246.0" width="260.0" height="78.0" rx="6" fill="#eef2f9" stroke="#2457d6" stroke-width="1.8"/><text x="540.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">IEC 60617</tspan><tspan x="540.0" dy="15.6">(раніше IEC 617)</tspan><tspan x="540.0" dy="15.6">резистор — прямокутник</tspan><tspan x="540.0" dy="15.6">(Європа, міжнародний)</tspan></text>
<text x="540.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">співіснують і досі — та сама фізика,</text>
<text x="540.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два обриси; читач мусить знати обидва</text>
<line x1="360.0" y1="56.0" x2="360.0" y2="400.0" stroke="#d0d5dd" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="360.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Дві незалежні осі: ЛІВОРУЧ — як деталь звати (літера-клас), ПРАВОРУЧ — яким значком її малюють.</text>
</svg>