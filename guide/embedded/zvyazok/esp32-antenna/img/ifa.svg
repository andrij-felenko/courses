<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевернута-F антена (IFA): чому саме її ставлять на WROOM</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чвертьхвильовий провідник зігнуто над землею; точка живлення зсунута вздовж — це задає і резонанс, і опір</text>
<rect x="120.0" y="330.0" width="640.0" height="46.0" rx="0" fill="#eef1f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="440.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">площина землі модуля (дзеркало-противага)</text>
<line x1="220.0" y1="330.0" x2="220.0" y2="160.0" stroke="#1a1a1a" stroke-width="3.2"/>
<text x="212.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">коротке</text>
<text x="212.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">замикання</text>
<line x1="220.0" y1="160.0" x2="640.0" y2="160.0" stroke="#1a1a1a" stroke-width="3.2"/>
<circle cx="640.0" cy="160.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="650.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">вільний кінець</text>
<text x="430.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">випромінююче плече ≈ λ/4</text>
<line x1="300.0" y1="160.0" x2="300.0" y2="330.0" stroke="#2457d6" stroke-width="2.8"/>
<circle cx="300.0" cy="326.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="300.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="300.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">живлення (50 Ω)</text>
<text x="308.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">відведення</text>
<line x1="220.0" y1="120.0" x2="300.0" y2="120.0" stroke="#b9770e" stroke-width="1.6"/>
<line x1="220.0" y1="114.0" x2="220.0" y2="126.0" stroke="#b9770e" stroke-width="1.6"/>
<line x1="300.0" y1="114.0" x2="300.0" y2="126.0" stroke="#b9770e" stroke-width="1.6"/>
<text x="260.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">d</text>
<rect x="697.4" y="112.9" width="145.1" height="194.3" rx="6" fill="#f7faf7" stroke="#27ae60" stroke-width="1.6"/><text x="770.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Довжина плеча</tspan><tspan x="770.0" dy="14.3">→ задає резонанс</tspan><tspan x="770.0" dy="14.3">(де струм у вузлі).</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">Відстань d від</tspan><tspan x="770.0" dy="14.3">замикання до</tspan><tspan x="770.0" dy="14.3">живлення →</tspan><tspan x="770.0" dy="14.3">підганяє опір</tspan><tspan x="770.0" dy="14.3">входу під 50 Ω.</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">Висота над землею</tspan><tspan x="770.0" dy="14.3">→ смуга частот.</tspan></text>
</svg>