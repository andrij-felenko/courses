<rect x="221.6" y="307.1" width="496.8" height="61.8" rx="6" fill="#fcfcfc" stroke="#6b7280" stroke-width="1.3"/><text x="470.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">C1 і C2 тягнуть опір по колу реактивностей, L зсуває його по активній осі —</tspan><tspan x="470.0" dy="13.7">так точку (30+j10) підводять до центру 50 Ω. Значення підбирають під плату;</tspan><tspan x="470.0" dy="13.7">частину позицій часто лишають незапаяними (0 Ом-перемичка чи «не встановлено»).</tspan></text>
