<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна відстань d керує і виявленням, і виправленням</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кулі радіуса t навколо дозволених слів; виправлення бере половину відстані, виявлення — всю</text>
<line x1="250.0" y1="220.0" x2="570.0" y2="220.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="250.0" cy="220.0" r="74.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="570.0" cy="220.0" r="74.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="250.0" cy="220.0" r="6.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="250.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">слово A</text>
<circle cx="570.0" cy="220.0" r="6.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="570.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">слово B</text>
<line x1="250.0" y1="220.0" x2="324.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="287.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">t</text>
<text x="410.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">відстань d</text>
<circle cx="424.0" cy="220.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="424.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">e</text>
<rect x="142.3" y="326.8" width="295.3" height="46.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="290.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">виправлення: e ≤ t = ⌊(d−1)/2⌋</tspan><tspan x="290.0" dy="15.0">(точка в кулі → найближче слово правильне)</tspan></text>
<rect x="428.7" y="326.8" width="262.5" height="46.5" rx="6" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">виявлення: e ≤ d−1</tspan><tspan x="560.0" dy="15.0">(точка поза словом → видно, що хибне)</tspan></text>
</svg>