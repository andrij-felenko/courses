<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасний підхід: спершу сценарій, тоді LOS чи NLOS</text>
<rect x="13.0" y="70.0" width="175.0" height="86.0" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="2.0"/>
<text x="100.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="700">RMa</text>
<text x="100.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">село / поле</text>
<text x="100.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">веж видно далеко</text>
<rect x="206.0" y="70.0" width="175.0" height="86.0" rx="6" fill="#e6f0fb" stroke="#1565c0" stroke-width="2.0"/>
<text x="293.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1565c0" text-anchor="middle" font-weight="700">UMa</text>
<text x="293.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">місто, висока вежа</text>
<text x="293.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">над дахами</text>
<rect x="399.0" y="70.0" width="175.0" height="86.0" rx="6" fill="#fbe3df" stroke="#c0392b" stroke-width="2.0"/>
<text x="486.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">UMi</text>
<text x="486.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вулиця-каньйон</text>
<text x="486.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">низька вежа</text>
<rect x="592.0" y="70.0" width="175.0" height="86.0" rx="6" fill="#f1eafd" stroke="#7c3aed" stroke-width="2.0"/>
<text x="679.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="700">InH</text>
<text x="679.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">у приміщенні</text>
<text x="679.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">офіс / зал</text>
<text x="390.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен сценарій далі ділиться:</text>
<rect x="100.0" y="206.0" width="180.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="228.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#145a32" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">LOS — видимість пряма</tspan><tspan x="190.0" dy="13.7">м'який нахил, мала тінь σ</tspan></text>
<rect x="500.0" y="206.0" width="180.0" height="52.0" rx="6" fill="#fbe3df" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#7a1f14" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">NLOS — крізь перепони</tspan><tspan x="590.0" dy="11.1">крутіший нахил, велика тінь σ</tspan></text>
<rect x="80.0" y="300.0" width="620.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="327.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">L = A + B·lg(d) + C·lg(f)   +   X_σ   (випадкова «тінь», нормальна, σ дБ)</tspan></text>
<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Та сама арифметика дБ — плюс чесно дописаний розкид місць</text>
<text x="390.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Працює аж до 100 ГГц (mmWave) — туди, куди Hata не сягає</text>
</svg>