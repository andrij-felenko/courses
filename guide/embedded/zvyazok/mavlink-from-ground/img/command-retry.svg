<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повтор команди: таймаут, confirmation і небезпека дубля</text>
<text x="150.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">НАЗЕМНА СТАНЦІЯ</text>
<text x="810.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">БОРТ</text>
<line x1="150.0" y1="76.0" x2="150.0" y2="460.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="810.0" y1="76.0" x2="810.0" y2="460.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="150.0" y1="110.0" x2="810.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="164.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">COMMAND_LONG (arm), confirmation=0</text>
<text x="820.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">борт ВИКОНАВ arm</text>
<line x1="810.0" y1="150.0" x2="510.0" y2="162.0" stroke="#27ae60" stroke-width="2.0"/><text x="518.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✕ втрата</text><text x="796.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">COMMAND_ACK: ACCEPTED</text>
<line x1="150.0" y1="198.0" x2="196.0" y2="198.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,4"/>
<line x1="196.0" y1="198.0" x2="196.0" y2="232.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,4"/>
<line x1="196.0" y1="232.0" x2="150.0" y2="232.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="202.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">немає ACK за таймаут</text>
<line x1="150.0" y1="258.0" x2="810.0" y2="258.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="164.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">COMMAND_LONG (arm), confirmation=1</text>
<text x="820.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">той самий наказ →
повторно НЕ шкодить</text>
<line x1="810.0" y1="304.0" x2="150.0" y2="304.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="796.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">COMMAND_ACK: ACCEPTED</text>
<rect x="238.0" y="418.2" width="484.0" height="59.6" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="437.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">confirmation росте 0→1→2… — борт бачить, що це ДУБЛЬ того самого пострілу.</tspan><tspan x="480.0" dy="14.3">ідемпотентний наказ (arm) безпечно повторювати; неідемпотентний</tspan><tspan x="480.0" dy="14.3">борт розрізняє саме за цим полем</tspan></text>
</svg>