<text x="440.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Зелене — прийнято, червоне — втрачено, синє — переслано, сіре — викинуто. Вибір: простий приймач чи ощадний ефір.</text>
