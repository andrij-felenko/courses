<text x="568.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="568.5" dy="0.0">Go-Back-N і</tspan><tspan x="568.5" dy="13.8">Selective Repeat — у стандарт</tspan></text>
