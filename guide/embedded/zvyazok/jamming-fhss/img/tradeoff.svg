<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що платимо за стійкість до глушіння</text>
<rect x="40.0" y="64.0" width="280.0" height="52.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">+ Стійкість до завад</text>
<text x="340.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вузька завада псує лише частину —</text>
<text x="340.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">решта проходить</text>
<rect x="40.0" y="126.0" width="280.0" height="52.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="180.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">+ Скритність (LPI)</text>
<text x="340.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">сигнал нижчий за шум —</text>
<text x="340.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">важко виявити й підслухати</text>
<rect x="40.0" y="188.0" width="280.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="180.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">− Широка смуга</text>
<text x="340.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">займаємо в N разів більше спектра,</text>
<text x="340.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ніж потрібно для самих даних</text>
<rect x="40.0" y="250.0" width="280.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="180.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">− Складність і синхронізація</text>
<text x="340.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">приймач має знати код/розклад</text>
<text x="340.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">і точно зловити фазу та час</text>
</svg>