<text x="546.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">рання=пізня → тримаємось у центрі</text>
<rect x="110.0" y="366.0" width="500.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Схибив фазою більш ніж на пів-чипа — «свій» код уже не збирає сигнал, і виграш обробки зникає.</tspan></text>
