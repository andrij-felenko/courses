<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слідкувальна глушилка: гонка всередині кадру</text>
<text x="360.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">один кадр (стрибок сидить на одній частоті)</text>
<text x="70.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">секретний розклад</text>
<rect x="70.0" y="90.0" width="162.4" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<rect x="70.0" y="90.0" width="162.4" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="151.2" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="151.2" dy="0.0">глушилка</tspan><tspan x="151.2" dy="14.3">слухає й шукає</tspan></text>
<rect x="232.4" y="90.0" width="417.6" height="58.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="232.4" y="90.0" width="417.6" height="58.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="441.2" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="441.2" dy="0.0">кадр проходить чисто (вона встигає накрити лише хвіст)</tspan></text>
<rect x="580.4" y="90.0" width="69.6" height="58.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" opacity="0.55"/>
<text x="70.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">простий лічильник (передбачуваний)</text>
<rect x="70.0" y="200.0" width="580.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="70.0" y="200.0" width="580.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">глушилці не треба слухати — вона РАХУЄ твій канал наперед і б'є кадр цілком</tspan></text>
<line x1="70.0" y1="300.0" x2="650.0" y2="300.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="70.0" y1="300.0" x2="662.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="668.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">темп</text>
<rect x="103.8" y="326.2" width="512.5" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">важіль: швидші стрибки → коротший кадр → менше часу глушилці зреагувати;</tspan><tspan x="360.0" dy="15.6">ширша смуга → більше каналів-кандидатів, важче наздогнати</tspan></text>
</svg>