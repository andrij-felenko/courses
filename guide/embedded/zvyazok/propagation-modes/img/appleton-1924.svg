<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">1924: дві дороги однієї передачі видають висоту дзеркала</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">пряма хвиля вздовж землі + хвиля, що стрибнула від іоносфери — їхня різниця ходу й дає висоту</text>
<rect x="40.0" y="392.0" width="860.0" height="54.0" rx="0" fill="#eef3ec" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="470.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">поверхня Землі  ·  Борнмут → Оксфорд, ~120 км</text>
<line x1="120.0" y1="110.0" x2="820.0" y2="110.0" stroke="#2457d6" stroke-width="2.4" stroke-dasharray="9,7"/>
<text x="470.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">відбивний шар (~100 км угору)</text>
<line x1="170.0" y1="388.0" x2="170.0" y2="346.0" stroke="#b9770e" stroke-width="3.0"/>
<text x="170.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">передавач Бі-Бі-Сі</text>
<text x="170.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Борнмут, ~770 кГц</text>
<line x1="770.0" y1="388.0" x2="770.0" y2="346.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="770.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">приймач</text>
<text x="770.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Оксфорд</text>
<line x1="170.0" y1="346.0" x2="770.0" y2="346.0" stroke="#b9770e" stroke-width="2.6"/>
<text x="470.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">пряма дорога — вздовж землі (коротша)</text>
<path d="M 170,346 L 470,116 L 770,346" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="470.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">небесна дорога — стрибок угору й вниз (довша на Δ)</text>
<circle cx="770.0" cy="346.0" r="7.0" fill="#fff" stroke="#c0392b" stroke-width="2.0"/>
<text x="774.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">тут дві хвилі складаються</text>
<text x="774.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">то в лад, то в протифазу</text>
<rect x="86.2" y="157.4" width="187.6" height="85.1" rx="6" fill="#f3f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">повільно міняємо частоту →</tspan><tspan x="180.0" dy="13.7">різниця ходу Δ «протягує»</tspan><tspan x="180.0" dy="13.7">фазу → сигнал то гасне,</tspan><tspan x="180.0" dy="13.7">то оживає → з ритму</tspan><tspan x="180.0" dy="13.7">завмирань рахуємо Δ → висоту</tspan></text>
</svg>