<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія є — а зв'язку нема: зона Френеля</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">хвилі потрібна не сама пряма лінія, а вільний еліпсоїд-«тунель» довкола неї</text>
<line x1="110.0" y1="210.0" x2="110.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="110.0" cy="174.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="110.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<line x1="830.0" y1="210.0" x2="830.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="830.0" cy="174.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="830.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<ellipse cx="470.0" cy="174.0" rx="360.0" ry="78.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2" />
<line x1="110.0" y1="174.0" x2="830.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">перша зона Френеля — її треба тримати вільною (≥60 %)</text>
<text x="470.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пряма лінія видимості</text>
<rect x="484.0" y="192.0" width="52.0" height="120.0" rx="2" fill="#d9d9de" stroke="#6b7280" stroke-width="1.6"/>
<text x="510.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дах / дерево</text>
<text x="606.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">лінію не чіпає,</text>
<text x="606.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">але ріже зону —</text>
<text x="606.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал просідає</text>
</svg>