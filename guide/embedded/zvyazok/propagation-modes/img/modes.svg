<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири дороги, якими хвиля доходить від A до B</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">режим обирає не радіо, а частота: та сама антена на різних частотах «ходить» по-різному</text>
<path d="M 40,400.0 A 1600,1600 0 0 1 900,400.0 L 900,476 L 40,476 Z" fill="#f1efe9" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="470.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">поверхня Землі з кривиною — горб посередині затуляє пряму лінію</text>
<line x1="60.0" y1="92.0" x2="880.0" y2="92.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="8,7"/>
<text x="470.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">іоносфера — заряджений шар високо вгорі</text>
<line x1="150.0" y1="374.0" x2="150.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="150.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<line x1="790.0" y1="374.0" x2="790.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="790.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<path d="M 150,330 Q 270,108 470,98 Q 670,108 790,330" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="470.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">небесна хвиля — відбивається від іоносфери (тисячі км)</text>
<line x1="150.0" y1="330.0" x2="470.0" y2="168.0" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="470" cy="168" r="8" fill="#e8e8ec" stroke="#6b7280" stroke-width="1.5"/>
<line x1="470.0" y1="168.0" x2="790.0" y2="330.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="470.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тропосферне розсіяння — дрібка від завихрень повітря</text>
<line x1="150.0" y1="330.0" x2="790.0" y2="330.0" stroke="#27ae60" stroke-width="2.6"/>
<text x="482.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="470.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">пряма видимість — найкоротша, та горб її ріже</text>
<path d="M 154,366 Q 470,382 786,366" fill="none" stroke="#b9770e" stroke-width="2.6"/>
<text x="470.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">поверхнева хвиля — тулиться до землі, огинає горб</text>
</svg>