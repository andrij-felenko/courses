<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівнюй модуляції за Eb/N₀, а не за «сирим» SNR</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SNR ділить потужність на всю смугу; Eb/N₀ — енергію ОДНОГО біта на щільність шуму</text>
<rect x="44.0" y="84.0" width="400.0" height="286.0" rx="12" fill="#fbfdfb" stroke="#27ae60" stroke-width="2.0"/>
<text x="244.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">SNR = C / N</text>
<text x="244.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">потужність сигналу / шум у всій смузі</text>
<line x1="90.0" y1="300.0" x2="398.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="90.0" y1="300.0" x2="90.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="120.0" y="250.0" width="240.0" height="50.0" rx="3" fill="#27ae6022" stroke="#27ae60" stroke-width="1.6"/>
<text x="240.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">широка смуга: та сама енергія</text>
<text x="240.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">розмазана → SNR виглядає гірше</text>
<text x="244.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SNR залежить від смуги — нечесно</text>
<rect x="476.0" y="84.0" width="400.0" height="286.0" rx="12" fill="#fefafa" stroke="#2457d6" stroke-width="2.0"/>
<text x="676.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Eb / N₀</text>
<text x="676.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">енергія на біт / щільність шуму</text>
<rect x="516.0" y="160.0" width="320.0" height="46.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="676.0" y="187.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="676.0" dy="0.0">SNR = (Eb/N₀) · (Rb / B)</tspan></text>
<text x="676.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Rb — бітова швидкість, B — смуга</text>
<text x="676.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">менша швидкість Rb → нижчий потрібний SNR</text>
<text x="676.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">за тим самим Eb/N₀ на біт</text>
<text x="676.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Eb/N₀ від смуги НЕ залежить —</text>
<text x="676.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">чесна міра якості модуляції</text>
<text x="676.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">саме тому «повільніше = далі»</text>
</svg>