<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калькулятор бюджету: як тече розрахунок</text>
<text x="480.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">TX-сторона → EIRP з ОБРІЗАННЯМ стелею → мінус шлях; чутливість з фізики → запас → доступність</text>
<rect x="40.0" y="96.0" width="150.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">P_tx, G_tx</tspan><tspan x="115.0" dy="15.6">L_cable_tx</tspan></text>
<rect x="40.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">d, f</tspan><tspan x="115.0" dy="15.6">L_misc, G_rx</tspan></text>
<rect x="40.0" y="304.0" width="150.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="335.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">B, NF</tspan><tspan x="115.0" dy="15.6">SNR_min</tspan></text>
<text x="115.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">параметри радіо</text>
<rect x="250.0" y="96.0" width="210.0" height="84.0" rx="10" fill="#fff4e6" stroke="#b9770e" stroke-width="2.4"/>
<text x="355.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">EIRP = P_tx − L + G_tx</text>
<text x="355.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">ОБРІЗАТИ до стелі регіону:</text>
<text x="355.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ETSI +20 · FCC +36 дБм</text>
<rect x="250.0" y="214.0" width="210.0" height="60.0" rx="6" fill="#fbfdfb" stroke="#27ae60" stroke-width="1.5"/><text x="355.0" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">− FSPL(d,f) − L_misc</tspan><tspan x="355.0" dy="15.0">+ G_rx − L_cable_rx</tspan></text>
<rect x="250.0" y="308.0" width="210.0" height="60.0" rx="6" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.5"/><text x="355.0" y="334.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">S_rx = −174 + 10logB</tspan><tspan x="355.0" dy="15.0">+ NF + SNR_min</tspan></text>
<line x1="190.0" y1="131.0" x2="250.0" y2="126.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="190.0" y1="235.0" x2="250.0" y2="234.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="190.0" y1="339.0" x2="250.0" y2="328.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="150.0" width="170.0" height="70.0" rx="10" fill="#eef7ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="625.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">P_rx</text>
<text x="625.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на вході приймача</text>
<line x1="460.0" y1="138.0" x2="540.0" y2="174.0" stroke="#b9770e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="244.0" x2="540.0" y2="196.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="300.0" width="170.0" height="60.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="625.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">запас = P_rx − S_rx</text>
<text x="625.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">скільки дБ над порогом</text>
<line x1="625.0" y1="220.0" x2="605.0" y2="300.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="338.0" x2="540.0" y2="340.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="300.0" width="160.0" height="60.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="850.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">доступність</text>
<text x="850.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 − 10^(−M/10)</text>
<line x1="710.0" y1="330.0" x2="770.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Обрізання EIRP до легальної стелі — блок, якого нема в наївних калькуляторах; запас перекладаємо у % часу, коли лінія жива.</text>
</svg>