<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доступна шумова потужність: чому R скорочується</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">джерело шуму з внутрішнім R віддає максимум у РІВНЕ навантаження R — і R зникає</text>
<rect x="60.0" y="100.0" width="360.0" height="300.0" rx="12" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="150.0" cy="200.0" r="26.0" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">U</text>
<text x="150.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">шум</text>
<rect x="134.0" y="100.0" width="32.0" height="46.0" rx="3" fill="#fff4e6" stroke="#b9770e" stroke-width="1.8"/>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">R</text>
<text x="106.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутр.</text>
<rect x="304.0" y="100.0" width="32.0" height="46.0" rx="3" fill="#eafbf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="320.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">R</text>
<text x="372.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">наван-</text>
<text x="372.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">таження</text>
<line x1="150.0" y1="174.0" x2="150.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="150.0" y1="100.0" x2="320.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="320.0" y1="100.0" x2="320.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="150.0" y1="226.0" x2="150.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="150.0" y1="260.0" x2="320.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="320.0" y1="146.0" x2="320.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="560.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">одну потужність — двома мовами</text>
<rect x="470.0" y="140.0" width="360.0" height="46.0" rx="6" fill="#fff9f0" stroke="#b9770e" stroke-width="1.5"/><text x="650.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">закон Ома:  P_наван = ⟨U²⟩ / (4R)</tspan></text>
<text x="560.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«4» = два опори послідовно, у квадраті</text>
<rect x="470.0" y="222.0" width="360.0" height="46.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="249.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">термодинаміка:  P_наван = k·T·B</tspan></text>
<text x="560.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">рівновага двох рівних резисторів</text>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">⟨U²⟩ / (4R)  =  k·T·B</text>
<text x="560.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">⇓  домножити на 4R</text>
<rect x="470.0" y="372.0" width="360.0" height="46.0" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">⟨U²⟩ = 4·k·T·R·B     N_дост = k·T·B</tspan></text>
<text x="450.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Витягуєш максимум потужності — і R зникає: доступний шум залежить лише від T і смуги B.</text>
</svg>