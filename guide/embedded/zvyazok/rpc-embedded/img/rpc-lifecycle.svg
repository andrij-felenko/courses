<text x="715.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-style="italic">виконав (мотор +10)</text>
<line x1="697.0" y1="360.0" x2="440.0" y2="369.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="448.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="673.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">відповідь ID=9</text>
<text x="165.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">⏱ таймаут</text>
<line x1="183.0" y1="402.0" x2="697.0" y2="420.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="207.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">повтор ID=9</text>
<text x="715.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">БЕЗ кешу — виконає +10 ще раз!</text>
<text x="715.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-style="italic">із кешем ID=9 — лише повторить стару відповідь</text>
<text x="440.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Локальний виклик не губиться й не виконується двічі. Віддалений — губиться; рятують ID + памʼять про вже виконане.</text>
