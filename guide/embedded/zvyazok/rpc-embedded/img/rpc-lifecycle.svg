<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного виклику — і три біди, яких у локальної функції немає</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ID звʼязує запит із відповіддю; таймер ловить втрату; але загублена відповідь → повторне виконання</text>
<text x="175.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">клієнт</text>
<text x="705.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сервер</text>
<line x1="175.0" y1="90.0" x2="175.0" y2="464.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="3,4"/>
<line x1="705.0" y1="90.0" x2="705.0" y2="464.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="3,4"/>
<line x1="183.0" y1="104.0" x2="697.0" y2="122.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
