<text x="165.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">⏱ таймаут</text>
<line x1="171.0" y1="204.0" x2="171.0" y2="234.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="2,3"/>
