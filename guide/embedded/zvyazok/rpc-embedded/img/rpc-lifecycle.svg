<text x="715.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-style="italic">виконав: adc[3]=512</text>
<line x1="697.0" y1="138.0" x2="183.0" y2="156.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="673.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">відповідь ID=7  →512</text>
<text x="165.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-style="italic">ID збігся → це МОЯ відповідь</text>
<line x1="183.0" y1="200.0" x2="440.0" y2="209.0" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="5,4"/>
