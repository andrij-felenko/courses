<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний шлях виклику крізь усі шари RPC</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожен шар закриває свою біду: CRC — спотворення, межа — побитий номер, кеш — повтор, таймаут — мовчання</text>
<text x="210.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">КЛІЄНТ</text>
<text x="690.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СЕРВЕР</text>
<rect x="60.0" y="100.0" width="300.0" height="44.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">прикладний код: val = read_sensor(3)</text>
<text x="210.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">звичайний виклик</text>
<line x1="210.0" y1="144.0" x2="210.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="160.0" width="300.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.7"/>
<text x="210.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">заглушка: маршалінг у packed-структуру</text>
<text x="210.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">присвоєння полів</text>
<line x1="210.0" y1="204.0" x2="210.0" y2="220.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="220.0" width="300.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.7"/>
<text x="210.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC-16 над {id, func, arg}</text>
<text x="210.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">доказ цілості</text>
<line x1="210.0" y1="264.0" x2="210.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="280.0" width="300.0" height="44.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="210.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">неблокувальний автомат: кадр + таймер</text>
<text x="210.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">не морозить систему</text>
<rect x="540.0" y="100.0" width="300.0" height="44.0" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="690.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">приймач-автомат: збирає кадр із потоку</text>
<text x="690.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">байт за байтом</text>
<line x1="690.0" y1="144.0" x2="690.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="160.0" width="300.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/>
<text x="690.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">звірка CRC</text>
<text x="690.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">битий → мовчки геть</text>
<line x1="690.0" y1="204.0" x2="690.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="220.0" width="300.0" height="44.0" rx="5" fill="#fff4f0" stroke="#c0392b" stroke-width="1.7"/>
<text x="690.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">кеш за ID</text>
<text x="690.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">повтор → стара відповідь</text>
<line x1="690.0" y1="264.0" x2="690.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="280.0" width="300.0" height="44.0" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="690.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">диспетчер: межа таблиці → обробник</text>
<text x="690.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">func ≥ N → помилка</text>
<line x1="360.0" y1="122.0" x2="540.0" y2="122.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">кадр запиту</text>
<line x1="540.0" y1="302.0" x2="360.0" y2="302.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">кадр відповіді (той самий ID)</text>
<text x="450.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Шість шарів — один обмін. Виклик розтягнутий у часі, але система не зупиняється; кожна біда дроту має свій лік.</text>
</svg>