<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доплер бере лише радіальну складову швидкості</text>
<circle cx="380.0" cy="320.0" r="9.0" fill="#e4f4ea" stroke="#27ae60" stroke-width="2.0"/>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">наземна станція (приймач)</text>
<line x1="80.0" y1="110.0" x2="680.0" y2="110.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="80.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">траєкторія апарата (стала висота, стала швидкість v)</text>
<circle cx="170.0" cy="110.0" r="7.0" fill="#fbe7e4" stroke="#c0392b" stroke-width="2.0"/>
<line x1="380.0" y1="320.0" x2="170.0" y2="110.0" stroke="#b8bec6" stroke-width="1.1"/>
<line x1="170.0" y1="110.0" x2="248.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="209.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">v</text>
<line x1="170.0" y1="110.0" x2="209.0" y2="149.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="203.5" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">v_рад</text>
<text x="170.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">наближення: θ малий</text>
<text x="170.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">cos θ ≈ 1 → повний зсув</text>
<circle cx="380.0" cy="110.0" r="7.0" fill="#e6ecfb" stroke="#2457d6" stroke-width="2.0"/>
<line x1="380.0" y1="320.0" x2="380.0" y2="110.0" stroke="#b8bec6" stroke-width="1.1"/>
<line x1="380.0" y1="110.0" x2="458.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="419.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">v</text>
<rect x="381.0" y="111.0" width="12" height="12" fill="none" stroke="#2457d6" stroke-width="1.2"/>
<text x="476.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">точно над головою (θ=90°)</text>
<text x="476.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">cos θ = 0 → зсуву немає</text>
<rect x="90.0" y="244.0" width="580.0" height="30.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">у формулу входить v·cos θ — складова вздовж променя на приймача; поперечний рух частоти не зсуває</tspan></text>
</svg>