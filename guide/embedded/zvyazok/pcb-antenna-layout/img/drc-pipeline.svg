<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Keep-out як перевірка: від зони до коду виходу</text>
<text x="480.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">перше збіжне правило виграє, тож виняток для живлення стоїть ПЕРЕД загальною забороною</text>
<rect x="40.0" y="90.0" width="200.0" height="96.0" rx="6" fill="#f6ecd6" stroke="#b9770e" stroke-width="1.6"/><text x="140.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">ЗОНА ANT_KEEPOUT</tspan><tspan x="140.0" dy="14.3">(іменована геометрія)</tspan><tspan x="140.0" dy="14.3">+ клас кіл RF_FEED</tspan><tspan x="140.0" dy="14.3">на живильній лінії</tspan></text>
<line x1="240.0" y1="138.0" x2="286.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила (згори вниз)</text>
<rect x="290.0" y="92.0" width="200.0" height="56.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.6"/><text x="390.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">1) ДОЗВІЛ: RF_FEED</tspan><tspan x="390.0" dy="13.4">у зоні — пропустити</tspan></text>
<rect x="290.0" y="156.0" width="200.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="390.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">2) ЗАБОРОНА: будь-яка</tspan><tspan x="390.0" dy="13.4">мідь у зоні (всі шари)</tspan></text>
<text x="390.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">перше збіжне виграє</text>
<line x1="490.0" y1="138.0" x2="536.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="92.0" width="200.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="640.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">kicad-cli pcb drc</tspan><tspan x="640.0" dy="13.3">--format json</tspan><tspan x="640.0" dy="13.3">--exit-code-violations</tspan><tspan x="640.0" dy="13.3">→ drc.json + код</tspan></text>
<line x1="740.0" y1="138.0" x2="786.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="92.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="865.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">брама на C</tspan><tspan x="865.0" dy="13.7">розбирає звіт</tspan><tspan x="865.0" dy="13.7">по полях</tspan></text>
<line x1="865.0" y1="188.0" x2="865.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="865.0" y1="250.0" x2="650.0" y2="244.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="865.0" y1="250.0" x2="860.0" y2="244.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="560.0" y="250.0" width="180.0" height="50.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">код 0 → ЗБІРКА ЙДЕ</tspan></text>
<rect x="770.0" y="250.0" width="180.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="860.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">код ≠0 → ЗБІРКУ СПИНЕНО</tspan></text>
<text x="650.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">міді в зоні немає</text>
<text x="860.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">мідь у зоні (часто внутр. земля)</text>
<text x="480.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">перевірка топології стає частиною збірки — невідворотною, як компіляція</text>
</svg>