<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">До RTP — вавилон форматів; після — один спільний заголовок</text>
<text x="470.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Кожен інструмент MBone ліпив СВІЙ заголовок поверх UDP</text>
<rect x="85.0" y="95.9" width="150.0" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">свій лічильник</tspan><tspan x="160.0" dy="13.7">своя мітка часу</tspan></text>
<text x="160.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">vat (звук)</text>
<rect x="395.0" y="95.9" width="150.0" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">інакший лічильник</tspan><tspan x="470.0" dy="13.7">інакша мітка</tspan></text>
<text x="470.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">nv (відео)</text>
<rect x="705.0" y="95.9" width="150.0" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="780.0" dy="0.0">ще третій</tspan><tspan x="780.0" dy="13.7">формат полів</tspan></text>
<text x="780.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">vic (відео)</text>
<text x="470.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">✗ не розуміють одне одного: ні шлюзу, ні спільного плеєра ✗</text>
<line x1="470.0" y1="194.0" x2="470.0" y2="234.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="484.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">AVT-група IETF: під сподом потрібні ТІ САМІ три поля → винести в один</text>
<text x="470.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">RTP (RFC 1889, 1996 → RFC 3550, 2003): один заголовок на всіх</text>
<rect x="120.0" y="276.0" width="90.0" height="58.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/>
<text x="165.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">UDP</tspan></text>
<rect x="210.0" y="276.0" width="165.0" height="58.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="292.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="292.5" dy="0.0">SEQ</tspan><tspan x="292.5" dy="12.3">номер: порядок,</tspan><tspan x="292.5" dy="12.3">втрата</tspan></text>
<rect x="375.0" y="276.0" width="175.0" height="58.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="462.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="462.5" dy="0.0">TIMESTAMP</tspan><tspan x="462.5" dy="12.3">мітка: коли</tspan><tspan x="462.5" dy="12.3">показати</tspan></text>
<rect x="550.0" y="276.0" width="95.0" height="58.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="597.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">PT</tspan><tspan x="597.5" dy="12.3">який</tspan><tspan x="597.5" dy="12.3">кодек</tspan></text>
<rect x="645.0" y="276.0" width="175.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="732.5" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="732.5" dy="0.0">будь-який</tspan><tspan x="732.5" dy="13.7">кодек</tspan></text>
<text x="470.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">три поля незмінні — навантаження будь-яке: vat, H.264, Opus, JPEG…  тепер усі шлюзи й плеєри розуміють один одного</text>
</svg>