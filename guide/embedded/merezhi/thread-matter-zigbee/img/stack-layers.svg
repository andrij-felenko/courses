<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23.46 -10 783.46 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-23.46" y="-10" width="783.46" height="480" fill="#ffffff"/>
