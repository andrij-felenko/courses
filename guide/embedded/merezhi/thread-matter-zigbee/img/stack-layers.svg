<text x="380.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2.4 ГГц · 250 кбіт/с · ощадливе · CSMA/CA</text>
