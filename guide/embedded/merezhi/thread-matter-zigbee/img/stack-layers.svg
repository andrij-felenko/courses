<text x="170.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Cluster Library / Dotdot</text>
<line x1="56.0" y1="232.0" x2="56.0" y2="380.0" stroke="#b8860b" stroke-width="2.2"/>
<text x="40.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="end" font-weight="700"><tspan x="40.0" dy="0.0">Zigbee:</tspan><tspan x="40.0" dy="12.3">уся будівля</tspan><tspan x="40.0" dy="12.3">від одного</tspan></text>
<rect x="360.0" y="348.0" width="330.0" height="32.0" rx="6" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="525.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">6LoWPAN — стиск IPv6-заголовків у тісний кадр</text>
<rect x="360.0" y="284.0" width="330.0" height="60.0" rx="6" fill="#e6ecfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="525.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережа Thread  —  IPv6-сітка</text>
<text x="525.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кожен вузол = справжня IP-адреса · без єдиної точки відмови</text>
<line x1="348.0" y1="284.0" x2="348.0" y2="380.0" stroke="#2457d6" stroke-width="2.2"/>
<text x="334.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end" font-weight="700"><tspan x="334.0" dy="0.0">Thread:</tspan><tspan x="334.0" dy="12.3">нижні</tspan><tspan x="334.0" dy="12.3">поверхи</tspan></text>
<rect x="360.0" y="196.0" width="330.0" height="76.0" rx="6" fill="#e4f4ea" stroke="#27ae60" stroke-width="2.2"/>
<text x="525.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Matter  —  спільна прикладна МОВА (дах)</text>
<text x="525.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">єдині типи пристроїв і дії для ВСІХ виробників</text>
<text x="525.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">їде поверх Thread · Wi-Fi · Ethernet  (BLE — для знайомства)</text>
<line x1="440.0" y1="272.0" x2="440.0" y2="282.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="272.0" x2="610.0" y2="282.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="70.0" width="620.0" height="50.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="380.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Не три суперники, а різні ПОВЕРХИ. Zigbee надбудовує все сам (острів, не на IP).</tspan><tspan x="380.0" dy="14.3">Thread будує IP-мережу без даху; Matter — спільний дах-мова, що лягає на Thread (і на Wi-Fi).</tspan></text>
</svg>