<rect x="34.0" y="372.0" width="692.0" height="44.0" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="380.0" y="390.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Біг туди-сюди прямою вилянкою, обрамлений почерговими дугами вліво-вправо, виглядає збоку як ЗИГЗАГ —</tspan><tspan x="380.0" dy="13.7">звідси й ім'я Zigbee: звістка йде далеко не криком, а ПЕРЕКАЗОМ, точнісінько як пакет сіткою сусід-сусідові.</tspan></text>
