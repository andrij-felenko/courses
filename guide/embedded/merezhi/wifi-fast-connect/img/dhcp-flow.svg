<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">DHCP: повний цикл проти перевірки збереженої адреси</text>
<text x="190.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">холодний старт</text>
<rect x="70.0" y="96.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">DISCOVER  (хто роздає?)</tspan></text>
<line x1="190.0" y1="136.0" x2="190.0" y2="152.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70.0" y="152.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">OFFER  (ось адреса)</tspan></text>
<line x1="190.0" y1="192.0" x2="190.0" y2="208.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70.0" y="208.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">REQUEST  (беру її)</tspan></text>
<line x1="190.0" y1="248.0" x2="190.0" y2="264.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="70.0" y="264.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">ACK  (твоя)</tspan></text>
<text x="190.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чотири такти, два широкомовні</text>
<text x="590.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">INIT-REBOOT (адреса в кеші)</text>
<rect x="470.0" y="96.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">REQUEST  (підтвердь 192.168.1.42)</tspan></text>
<line x1="590.0" y1="136.0" x2="590.0" y2="152.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="470.0" y="152.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">ACK  (твоя)</tspan></text>
<text x="590.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два такти; NAK → впасти на повний цикл</text>
<rect x="113.5" y="363.4" width="552.9" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Маючи торішню адресу, клієнт одразу шле REQUEST з нею (server-id порожній, ciaddr 0).</tspan><tspan x="390.0" dy="14.3">Сервер підтверджує — або шле NAK, і тоді повний цикл</tspan></text>
</svg>