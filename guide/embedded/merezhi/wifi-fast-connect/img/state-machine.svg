<rect x="131.6" y="498.2" width="596.8" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="517.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">ПАСТКА: esp_wifi_deinit() між сеансами вбиває PMKSA-кеш у RAM.</tspan><tspan x="430.0" dy="14.3">Канал та IP переживуть (вони в NVS), а живий PMK — НІ: handshake знову платить повну PBKDF2.</tspan><tspan x="430.0" dy="14.3">Хочеш зберегти PMK — не зривай стек: modem-sleep / light-sleep замість deinit.</tspan></text>
