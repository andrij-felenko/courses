<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізний захист: незалежні шари ПЕРЕМНОЖУЮТЬ залишкові ймовірності</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дані від давача до контролера проходять чотири рубежі; перемежування тримає їх незалежними</text>
<rect x="90.0" y="92.0" width="470.0" height="62.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="106.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Flash-комірка</text>
<text x="106.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">BCH проти поодиноких біт-фліпів</text>
<text x="546.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">пропускає q₁</text>
<text x="578.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a3da8" text-anchor="start" font-weight="700">⇄ перемежування (клей незалежності)</text>
<line x1="120.0" y1="154.0" x2="120.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="170.0" width="470.0" height="62.0" rx="8" fill="#ffffff" stroke="#7a3da8" stroke-width="2.0"/>
<text x="106.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a3da8" text-anchor="start" font-weight="700">радіоканал</text>
<text x="106.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Рід–Соломон проти пакетів і завмирань</text>
<text x="546.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">пропускає q₂</text>
<line x1="120.0" y1="232.0" x2="120.0" y2="248.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="248.0" width="470.0" height="62.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="106.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">кадр на шині</text>
<text x="106.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">CRC проти всього, що прорвалось</text>
<text x="546.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">пропускає q₃</text>
<line x1="120.0" y1="310.0" x2="120.0" y2="326.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="326.0" width="470.0" height="62.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<text x="106.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="700">заголовок пакета</text>
<text x="106.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">контрольна сума: груба перевірка структури</text>
<text x="546.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">пропускає q₄</text>
<rect x="81.8" y="410.0" width="656.4" height="36.0" rx="6" fill="#eef7f1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="432.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">разом пропускає  q = q₁ · q₂ · q₃ · q₄   ←  добуток, недосяжний жодному коду поодинці</tspan></text>
</svg>