<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коди складаються в шари, а не змагаються</text>
<text x="380.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожен шар ловить те, що пропустив попередній; разом дають надійність, недосяжну поодинці</text>
<rect x="70.0" y="86.0" width="620.0" height="56.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="88.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">байт у пам'яті / комірці</text>
<text x="88.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ловить: поодинокі біт-фліпи в RAM і Flash</text>
<rect x="494.8" y="98.0" width="183.2" height="32.0" rx="7" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="586.4" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ECC  (Геммінг / BCH)</text>
<rect x="70.0" y="156.0" width="620.0" height="56.0" rx="8" fill="#ffffff" stroke="#7a3da8" stroke-width="2.0"/>
<text x="88.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">символи на носії / в радіоканалі</text>
<text x="88.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ловить: пакети, завмирання, подряпини</text>
<rect x="510.9" y="168.0" width="167.1" height="32.0" rx="7" fill="#fbfbfb" stroke="#7a3da8" stroke-width="1.6"/>
<text x="594.5" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a3da8" text-anchor="middle" font-weight="700">Рід–Соломон  (FEC)</text>
<rect x="70.0" y="226.0" width="620.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="88.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">кадр на шині / у протоколі</text>
<text x="88.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ловить: усе, що проскочило крізь канал</text>
<rect x="631.8" y="238.0" width="46.2" height="32.0" rx="7" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.6"/>
<text x="654.9" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CRC</text>
<rect x="70.0" y="296.0" width="620.0" height="56.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<text x="88.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">логічний пакет (заголовок + дані)</text>
<text x="88.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ловить: груба перевірка структури, дешево</text>
<rect x="398.1" y="308.0" width="279.9" height="32.0" rx="7" fill="#fbfbfb" stroke="#caa24a" stroke-width="1.6"/>
<text x="538.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="700">контрольна сума / парність полів</text>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Кожен рівень бере загрозу, проти якої найсильніший, і прикриває слабкість сусіда.</text>
</svg>