<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому вбудований RPC не виділяє памʼять динамічно</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">malloc/free під кадри фрагментують купу; сталі буфери — ні</text>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">динамічне виділення (malloc/free)</text>
<text x="640.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">сталі буфери фіксованого розміру</text>
<rect x="60.0" y="120.0" width="360.0" height="46.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="60.0" y="120.0" width="43.2" height="46.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="128.4" y="120.0" width="36.0" height="46.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="186.0" y="120.0" width="50.4" height="46.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="265.2" y="120.0" width="39.6" height="46.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="322.8" y="120.0" width="46.8" height="46.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="240.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">дрібні дірки між блоками: вільного багато, суцільного — нема</text>
<rect x="60.0" y="206.0" width="360.0" height="30.0" rx="4" fill="#fff4f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="240.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">malloc(кадр) → NULL  (після днів роботи)</text>
<rect x="460.0" y="120.0" width="360.0" height="46.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<rect x="460.0" y="120.0" width="64.8" height="46.0" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="492.4" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">буфер</text>
<rect x="524.8" y="120.0" width="64.8" height="46.0" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="557.2" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">буфер</text>
<rect x="589.6" y="120.0" width="57.6" height="46.0" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="618.4" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">буфер</text>
<text x="640.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">виділено на старті, не рухаються — вільне суцільне</text>
<rect x="460.0" y="206.0" width="360.0" height="30.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="640.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">кадр завжди має куди лягти</text>
<text x="440.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Та сама причина, чому весь код RPC тримає буфери статичними: на МК без віртуальної памʼяті дірки не зникають.</text>
</svg>