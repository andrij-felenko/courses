<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки беруться гігабіти: три ручки, що перемножуються</text>
<rect x="50.0" y="130.0" width="230.0" height="150.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="165.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ширша смуга</text>
<text x="165.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">20 → 320 МГц</text>
<text x="165.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">більше герців —</tspan><tspan x="165.0" dy="13.1">більше символів за час</tspan></text>
<text x="293.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="700">×</text>
<rect x="310.0" y="130.0" width="230.0" height="150.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="425.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">більше потоків</text>
<text x="425.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 → 8 (MIMO)</text>
<text x="425.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="425.0" dy="0.0">кілька незалежних</tspan><tspan x="425.0" dy="13.1">просторових каналів</tspan></text>
<text x="553.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="700">×</text>
<rect x="570.0" y="130.0" width="230.0" height="150.0" rx="10" fill="#fdf0e6" stroke="#c07a2e" stroke-width="2.0"/>
<text x="685.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c07a2e" text-anchor="middle" font-weight="700">щільніша QAM</text>
<text x="685.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">BPSK → 4096-QAM</text>
<text x="685.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="685.0" dy="0.0">більше бітів</tspan><tspan x="685.0" dy="13.1">у кожному символі</tspan></text>
<text x="460.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">= пікова швидкість лінка</text>
<text x="460.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="460.0" dy="0.0">кожне покоління крутить ці самі три ручки далі;</tspan><tspan x="460.0" dy="14.3">усі три множники незалежні — тому й перемножуються</tspan></text>
