<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три угоди, без яких шина не працює</text>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожна дротова шина плати — це власна відповідь на ці самі три питання</text>
<rect x="24.0" y="66.0" width="224.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="136.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · Де межа біта?</text>
<rect x="36.0" y="102.0" width="200.0" height="42.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="136.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="136.0" dy="0.0">коли рівень — це «1»,</tspan><tspan x="136.0" dy="13.0">а коли просто тиша</tspan></text>
<line x1="42.0" y1="152.0" x2="230.0" y2="152.0" stroke="#dddddd" stroke-width="1.0"/>
<text x="46.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">UART</text>
<text x="98.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">домовлена швидкість</text>
<text x="46.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">I2C</text>
<text x="98.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">спільний такт SCL</text>
<text x="46.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SPI</text>
<text x="98.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">спільний такт SCLK</text>
<rect x="268.0" y="66.0" width="224.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · Хто веде?</text>
<rect x="280.0" y="102.0" width="200.0" height="42.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">хто саме штовхає лінію,</tspan><tspan x="380.0" dy="13.0">щоб не штовхали двоє</tspan></text>
<line x1="286.0" y1="152.0" x2="474.0" y2="152.0" stroke="#dddddd" stroke-width="1.0"/>
<text x="290.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">UART</text>
<text x="342.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">кожен свій дріт</text>
<text x="290.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">I2C</text>
<text x="342.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ведучий + арбітраж</text>
<text x="290.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SPI</text>
<text x="342.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ведучий смикає CS</text>
<rect x="512.0" y="66.0" width="224.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="624.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · До кого мова?</text>
<rect x="524.0" y="102.0" width="200.0" height="42.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="624.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="624.0" dy="0.0">як із багатьох відгукнувся</tspan><tspan x="624.0" dy="13.0">саме потрібний</tspan></text>
<line x1="530.0" y1="152.0" x2="718.0" y2="152.0" stroke="#dddddd" stroke-width="1.0"/>
<text x="534.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">UART</text>
<text x="586.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">нема — точка-точка</text>
<text x="534.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">I2C</text>
<text x="586.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">адреса в кадрі</text>
<text x="534.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">SPI</text>
<text x="586.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">окрема лінія CS</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">усі шини курсу відповідають на ці три однаково за суттю, різно за виконанням</text>
</svg>