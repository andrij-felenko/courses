<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить процесор під час звуку: цикл проти DMA</text>
<rect x="70.0" y="70.0" width="240.0" height="130.0" rx="6" fill="#f3dede" stroke="#c0392b" stroke-width="1.6"/><text x="190.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Без DMA (Covox-стиль):</tspan><tspan x="190.0" dy="14.3">CPU у циклі</tspan><tspan x="190.0" dy="14.3">байт → порт → чекати</tspan><tspan x="190.0" dy="14.3">~8% часу зайнято</tspan></text>
<rect x="410.0" y="70.0" width="240.0" height="130.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="530.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">З DMA (Sound Blaster):</tspan><tspan x="530.0" dy="14.3">контролер краде 1 цикл</tspan><tspan x="530.0" dy="14.3">на байт; CPU вільний,</tspan><tspan x="530.0" dy="14.3">ISR лише на кінці буфера</tspan></text>
<line x1="318.0" y1="135.0" x2="402.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">затрати CPU падають із ~8% до часток відсотка</text>
</svg>