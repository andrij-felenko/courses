<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна пам'ять, два майстри: хто перший у SRAM</text>
<rect x="90.0" y="60.0" width="180.0" height="56.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="180.0" y="84.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">ядро (CPU)</tspan><tspan x="180.0" dy="14.3">читає код і дані</tspan></text>
<rect x="450.0" y="60.0" width="180.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="540.0" y="84.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">DMA-контролер</tspan><tspan x="540.0" dy="14.3">жене блок у шину</tspan></text>
<rect x="250.0" y="160.0" width="220.0" height="54.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.9"/>
<text x="360.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">матриця шин (арбітр)</text>
<rect x="280.0" y="258.0" width="160.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="360.0" y="277.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">SRAM</tspan><tspan x="360.0" dy="14.3">(один порт)</tspan></text>
<line x1="180.0" y1="116.0" x2="290.0" y2="158.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="540.0" y1="116.0" x2="430.0" y2="158.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="360.0" y1="216.0" x2="360.0" y2="256.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">обидва хочуть SRAM в той самий такт</text>
<text x="360.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">переможець іде в пам'ять, той хто програв — чекає такт; так DMA й ядро крадуть цикли одне в одного</text>
</svg>