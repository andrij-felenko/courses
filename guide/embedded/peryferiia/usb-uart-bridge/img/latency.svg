<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому «швидкий» USB не означає миттєвий байт</text>
<line x1="60.0" y1="110.0" x2="700.0" y2="110.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="90.0" y1="102.0" x2="90.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="90.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 мс</text>
<line x1="185.0" y1="102.0" x2="185.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="185.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 мс</text>
<line x1="280.0" y1="102.0" x2="280.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="280.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2 мс</text>
<line x1="375.0" y1="102.0" x2="375.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="375.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 мс</text>
<line x1="470.0" y1="102.0" x2="470.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="470.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 мс</text>
<line x1="565.0" y1="102.0" x2="565.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="565.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5 мс</text>
<line x1="660.0" y1="102.0" x2="660.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="660.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">6 мс</text>
<text x="380.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">хост опитує пристрій кадрами по 1 мс</text>
<circle cx="120.0" cy="110.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="120.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">байт готовий</text>
<line x1="120.0" y1="148.0" x2="185.0" y2="148.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="155.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">чекає ≤ 1 мс</text>
<rect x="136.6" y="182.3" width="486.8" height="71.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Пропускна здатність USB величезна, але байти він возить пачками раз на ~1 мс.</tspan><tspan x="380.0" dy="13.7">Одинокий байт може почекати майже мілісекунду до відправлення.</tspan><tspan x="380.0" dy="13.7">Тому в команді-відповіді важлива не «швидкість USB», а ця затримка пакування —</tspan><tspan x="380.0" dy="13.7">і вона ж робить точні паузи між байтами на боці ПК ненадійними.</tspan></text>
</svg>