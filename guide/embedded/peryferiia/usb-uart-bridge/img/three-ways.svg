<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи дати пристрою USB-порт для зв'язку</text>
<rect x="20.0" y="56.0" width="232.0" height="196.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<rect x="30.0" y="66.0" width="212.0" height="34.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="136.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">окрема мікросхема-міст</tspan></text>
<line x1="38.0" y1="104.0" x2="234.0" y2="104.0" stroke="#2457d6" stroke-width="1.1"/>
<text x="38.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• FT232, CP2102, CH340 …</text>
<text x="38.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• МК має лише UART</text>
<text x="38.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• міст робить весь USB</text>
<text x="38.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• +1 чіп на платі</text>
<line x1="38.0" y1="214.0" x2="234.0" y2="214.0" stroke="#dddddd" stroke-width="1.0"/>
<rect x="32.0" y="222.0" width="208.0" height="26.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="136.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="136.0" dy="0.0">класика: МК простий, USB — на мості</tspan></text>
<rect x="264.0" y="56.0" width="232.0" height="196.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<rect x="274.0" y="66.0" width="212.0" height="34.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="380.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">USB прямо в мікроконтролері</tspan></text>
<line x1="282.0" y1="104.0" x2="478.0" y2="104.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="282.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• МК має USB-блок</text>
<text x="282.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• клас CDC у прошивці</text>
<text x="282.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• віртуальний COM-порт</text>
<text x="282.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 0 зайвих чіпів</text>
<line x1="282.0" y1="214.0" x2="478.0" y2="214.0" stroke="#dddddd" stroke-width="1.0"/>
<rect x="276.0" y="222.0" width="208.0" height="26.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="380.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">сучасно: міст не потрібен зовсім</tspan></text>
<rect x="508.0" y="56.0" width="232.0" height="196.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="518.0" y="66.0" width="212.0" height="34.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="624.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">готовий модуль / кабель</tspan></text>
<line x1="526.0" y1="104.0" x2="722.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.1"/>
<text x="526.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• USB-UART «свисток»</text>
<text x="526.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• плата налагодження</text>
<text x="526.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• для столу й макета</text>
<text x="526.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• не для серійної плати</text>
<line x1="526.0" y1="214.0" x2="722.0" y2="214.0" stroke="#dddddd" stroke-width="1.0"/>
<rect x="520.0" y="222.0" width="208.0" height="26.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="624.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="624.0" dy="0.0">найшвидше для проби й діагностики</tspan></text>
</svg>