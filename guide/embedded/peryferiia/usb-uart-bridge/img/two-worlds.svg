<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні мови — і місток між ними</text>
<rect x="28.0" y="64.0" width="200.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="128.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПК — USB-хост</text>
<line x1="46.0" y1="100.0" x2="210.0" y2="100.0" stroke="#2457d6" stroke-width="1.1"/>
<text x="46.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• пакети, кадри 1 мс</text>
<text x="46.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• хост опитує пристрій</text>
<text x="46.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• адреси, кінцеві точки</text>
<text x="46.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• диференційна пара D+/D−</text>
<rect x="532.0" y="64.0" width="200.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/>
<text x="632.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">МК — UART</text>
<line x1="550.0" y1="100.0" x2="714.0" y2="100.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="550.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• потік байтів, без пакетів</text>
<text x="550.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• обидва шлють, коли хочуть</text>
<text x="550.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• немає адрес — точка-точка</text>
<text x="550.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• дві лінії TX і RX</text>
<rect x="300.0" y="96.0" width="160.0" height="86.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="380.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">перетворювач</text>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB ↔ UART</text>
<text x="380.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">перекладач</text>
<line x1="228.0" y1="139.0" x2="300.0" y2="139.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="139.0" x2="532.0" y2="139.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">обидва боки не розуміють один одного напряму: один говорить пакетами USB,</text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">другий — рівним потоком байтів. Перетворювач перекладає в обидва боки в реальному часі.</text>
</svg>