<line x1="300.0" y1="182.0" x2="122.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">TX → RX</text>
<text x="380.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">RX ← TX</text>
<line x1="122.0" y1="212.0" x2="678.0" y2="212.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">спільна земля — обов'язково</text>
<rect x="169.5" y="253.9" width="421.0" height="44.1" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.3"/><text x="380.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Дві часті помилки: з'єднати TX↔TX (тиша) і забути спільну землю.</tspan><tspan x="380.0" dy="13.7">Міст 5 В, а МК 3.3 В → на лінії RX МК потрібен перетворювач рівнів.</tspan></text>
