<text x="610.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(3.3 В логіка)</text>
<text x="680.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">RX</text>
<text x="680.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">TX</text>
<text x="680.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">GND</text>
<line x1="120.0" y1="152.0" x2="300.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="300.0" y1="152.0" x2="460.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="460.0" y1="182.0" x2="638.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="638.0" y1="152.0" x2="460.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.0"/>
