<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="274" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер на боці ПК: вбудований чи свій</text>
<rect x="28.0" y="56.0" width="330.0" height="180.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="193.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d7a44" text-anchor="middle" font-weight="700">клас CDC-ACM (стандарт USB)</text>
<line x1="48.0" y1="94.0" x2="338.0" y2="94.0" stroke="#27ae60" stroke-width="1.1"/>
<text x="48.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• пристрій каже «я серійний порт»</text>
<text x="48.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• драйвер уже є у Windows / macOS / Linux</text>
<text x="48.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• вставив — і одразу новий COM-порт</text>
<text x="48.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• нічого не встановлювати</text>
<text x="193.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">шлях найменшого тертя</text>
<rect x="402.0" y="56.0" width="330.0" height="180.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/>
<text x="567.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">власний клас (FTDI, Prolific)</text>
<line x1="422.0" y1="94.0" x2="712.0" y2="94.0" stroke="#c0392b" stroke-width="1.1"/>
<text x="422.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• пристрій нестандартний для ОС</text>
<text x="422.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• потрібен драйвер виробника</text>
<text x="422.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• версія, підпис, сумісність ОС</text>
<text x="422.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• є чим керувати тонко (швидкості, GPIO)</text>
<text x="567.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">більше можливостей, але й більше клопоту</text>
</svg>