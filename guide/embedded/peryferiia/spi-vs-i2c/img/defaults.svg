<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замовчування під типову задачу</text>
<rect x="24.0" y="58.0" width="712.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="44.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">дрібний давач, мало ніжок</text>
<line x1="360.0" y1="76.0" x2="392.0" y2="76.0" stroke="#b9770e" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="404.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">I2C</text>
<rect x="24.0" y="100.0" width="712.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="44.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">швидкий дисплей / SD / флеш</text>
<line x1="360.0" y1="118.0" x2="392.0" y2="118.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="404.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">SPI</text>
<rect x="24.0" y="142.0" width="712.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="44.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">зв'язок із модулем, ПК, GPS, радіо</text>
<line x1="360.0" y1="160.0" x2="392.0" y2="160.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="404.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">UART</text>
<rect x="24.0" y="184.0" width="712.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="44.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">і давачі, і дисплей на платі</text>
<line x1="360.0" y1="202.0" x2="392.0" y2="202.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="404.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">I2C + SPI разом</text>
<rect x="24.0" y="226.0" width="712.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="44.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">метри або кабель із завадами</text>
<line x1="360.0" y1="244.0" x2="392.0" y2="244.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="404.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ні те, ні те → диференційна шина</text>
<text x="380.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">правила покривають майже все; головне вміння — зважити критерії, а не завчити рядок</text>
