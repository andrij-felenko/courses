<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір підтяжки: вікно між «надто сильним» і «надто слабким»</text>
<line x1="70.0" y1="150.0" x2="690.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="690.0" y1="150.0" x2="704.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="696.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">більший Rp →</text>
<text x="66.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">← менший Rp</text>
<rect x="70.0" y="124.0" width="186.0" height="52.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<rect x="256.0" y="124.0" width="223.2" height="52.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="479.2" y="124.0" width="210.8" height="52.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<text x="163.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">надто сильна</text>
<text x="367.6" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">робоче вікно</text>
<text x="584.6" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">надто слабка</text>
<line x1="256.0" y1="110.0" x2="256.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="479.2" y1="110.0" x2="479.2" y2="190.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="220.0" y="70.0" width="72.1" height="32.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="256.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="256.0" dy="0.0">Rp(min)</tspan></text>
<rect x="443.2" y="70.0" width="72.1" height="32.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="479.2" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="479.2" dy="0.0">Rp(max)</tspan></text>
<text x="163.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="163.0" dy="0.0">ключу важко</tspan><tspan x="163.0" dy="13.1">стягнути лінію в 0:</tspan><tspan x="163.0" dy="13.1">багато струму,</tspan><tspan x="163.0" dy="13.1">«нуль» не дотискається</tspan></text>
<text x="367.6" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="367.6" dy="0.0">і «нуль» чіткий,</tspan><tspan x="367.6" dy="13.1">і фронт устигає</tspan><tspan x="367.6" dy="13.1">до порогу —</tspan><tspan x="367.6" dy="13.1">обидві умови разом</tspan></text>
<text x="584.6" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="584.6" dy="0.0">фронт «вгору»</tspan><tspan x="584.6" dy="13.1">розтягується RC,</tspan><tspan x="584.6" dy="13.1">не встигає за тактом:</tspan><tspan x="584.6" dy="13.1">біти змазуються</tspan></text>
</svg>