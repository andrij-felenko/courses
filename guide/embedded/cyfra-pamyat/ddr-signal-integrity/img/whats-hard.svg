<rect x="356.8" y="166.5" width="106.4" height="47.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="410.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">DDR-шина</tspan></text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна шина — чотири біди разом; тому DDR несе цілий арсенал вбудованих прийомів</text>
