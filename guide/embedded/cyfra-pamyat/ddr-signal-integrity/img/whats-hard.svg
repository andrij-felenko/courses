<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому DDR — найважчий випадок цілісності сигналу</text>
<rect x="98.6" y="72.3" width="142.8" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="170.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">багато ліній разом</tspan><tspan x="170.0" dy="14.3">(8·n біт DQ)</tspan></text>
<text x="170.0" y="133.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">стрибок землі,</tspan><tspan x="170.0" dy="11.7">перехресна наводка</tspan></text>
<rect x="582.0" y="72.3" width="135.9" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">двонапрямлена</tspan><tspan x="650.0" dy="14.3">(читання й запис)</tspan></text>
<text x="650.0" y="133.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">термінацію треба</tspan><tspan x="650.0" dy="11.7">вмикати/вимикати</tspan></text>
<rect x="119.1" y="267.4" width="101.8" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="170.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">крутий фронт</tspan><tspan x="170.0" dy="14.3">(сотні пс)</tspan></text>
<text x="170.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">відбиття від кожного</tspan><tspan x="170.0" dy="11.7">розгалуження</tspan></text>
<rect x="551.3" y="267.4" width="197.3" height="45.3" rx="6" fill="#efefef" stroke="#6b7280" stroke-width="1.8"/><text x="650.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">строб іде з даними</tspan><tspan x="650.0" dy="14.3">(DQS, без спільного такту)</tspan></text>
<text x="650.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">перекоси ліній</tspan><tspan x="650.0" dy="11.7">з'їдають вікно</tspan></text>
