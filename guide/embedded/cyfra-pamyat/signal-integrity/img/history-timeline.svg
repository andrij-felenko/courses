<text x="217.3" y="212.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="217.3" dy="0.0">H. Nyquist формалізує</tspan><tspan x="217.3" dy="10.9">спотворення й умову без</tspan><tspan x="217.3" dy="10.9">міжсимвольної завади</tspan><tspan x="217.3" dy="10.9">— фундамент, не око</tspan></text>
