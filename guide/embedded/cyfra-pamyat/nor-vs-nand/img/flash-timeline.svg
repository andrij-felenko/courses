<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження флеші: глухий кут EPROM/EEPROM → розвилка CHE/FN → NOR і NAND</text>
<rect x="30.0" y="62.0" width="250.0" height="300.0" rx="10" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="155.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">до флеші: глухий кут</text>
<rect x="48.0" y="104.0" width="214.0" height="110.0" rx="8" fill="#eef0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="155.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">EPROM</text>
<text x="155.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дешева, однотранзисторна,</text>
<text x="155.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">але стирати — тільки</text>
<text x="155.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ультрафіолетом, вийнявши чип</text>
<text x="155.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">→ не оновиш у пристрої</text>
<rect x="48.0" y="228.0" width="214.0" height="120.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="155.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">EEPROM</text>
<text x="155.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">стирати можна електрикою,</text>
<text x="155.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">побайтово — зручно,</text>
<text x="155.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">але ДВА транзистори на комірку</text>
<text x="155.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ вдвічі дорожче за біт,</text>
<text x="155.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">не масштабується</text>
<text x="300.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">рішення:</text>
<text x="300.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">1 комірка</text>
<text x="300.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">= 1 транзистор</text>
<line x1="282.0" y1="250.0" x2="320.0" y2="250.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="320.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">▶</text>
<line x1="400.0" y1="84.0" x2="400.0" y2="350.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="400.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">час</text>
<circle cx="400.0" cy="110.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="440.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1980</text>
<text x="440.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">патент: однотранзисторна комірка</text>
<text x="440.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start" font-style="italic">ІДЕЯ на папері (Масуока)</text>
<circle cx="400.0" cy="170.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<line x1="393.0" y1="170.0" x2="366.0" y2="170.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="360.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">IEDM 1984</text>
<text x="360.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">презентація NOR</text>
<text x="360.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end" font-style="italic">гарячі електрони (CHE) → паралельно</text>
<circle cx="400.0" cy="238.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<line x1="393.0" y1="238.0" x2="366.0" y2="238.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="360.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">1988</text>
<text x="360.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">перший комерційний NOR-чип</text>
<text x="360.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end" font-style="italic">його вивела на ринок Intel</text>
<circle cx="400.0" cy="300.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<line x1="407.0" y1="300.0" x2="434.0" y2="300.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="440.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">IEDM 1987</text>
<text x="440.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">презентація щільної NAND</text>
<text x="440.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start" font-style="italic">тунелювання (FN) → в низку · 4-Мбіт</text>
<circle cx="400.0" cy="348.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<line x1="407.0" y1="348.0" x2="434.0" y2="348.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="440.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">~1989</text>
<text x="440.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">комерційна NAND</text>
<text x="440.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start" font-style="italic">серійний чип від Toshiba</text>
<text x="250.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">◀ NOR (для коду)</text>
<text x="550.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">NAND (для даних) ▶</text>
<rect x="60.0" y="388.0" width="780.0" height="76.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">розвилка вросла у фізику: спосіб ЗАКИНУТИ заряд визначив топологію, а та — рід флеші.</text>
<text x="450.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">гарячі електрони потребують великого струму → комірки нарізно (NOR); тунелювання майже без струму → в низку (NAND).</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6a18" text-anchor="middle" font-weight="700">різниця струму — близько 100 000 – 1 000 000 разів; звідси й уся несумісність двох топологій.</text>
<rect x="60.0" y="478.0" width="780.0" height="52.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">три різні досягнення — три різні дати: ІДЕЯ (патент) · ПРЕЗЕНТАЦІЯ (IEDM) · ПРОДУКТ (ринок).</text>
<text x="450.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">винайшли флеш у Toshiba (Масуока з командою); першу NOR на ринок вивела Intel — це різні заслуги різних людей.</text>
</svg>