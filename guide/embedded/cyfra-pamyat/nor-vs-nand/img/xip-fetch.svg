<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для коду важить затримка випадкового читання, для даних — пропускна здатність</text>
<text x="450.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">процесор на КОЖЕН крок вибирає інструкцію за (часто випадковою) адресою</text>
<rect x="300.0" y="76.0" width="96.0" height="40.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="348.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вибірка</text>
<line x1="396.0" y1="96.0" x2="410.0" y2="96.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="410.0" y="76.0" width="96.0" height="40.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="458.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">декод</text>
<line x1="506.0" y1="96.0" x2="520.0" y2="96.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="520.0" y="76.0" width="96.0" height="40.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="568.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">виконання</text>
<text x="348.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">адреса стрибає за лічильником команд — доступ РІДКО послідовний</text>
<text x="60.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">NOR</text><text x="60.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">затримка випадкового читання — десятки наносекунд</text><rect x="250.0" y="188.0" width="120.0" height="30.0" rx="4" fill="#eef0fd" stroke="#2457d6" stroke-width="1.4"/><text x="310.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">адреса→слово</text><text x="384.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">→ слово готове одразу: виконуй прямо з неї (XIP)</text>
<text x="60.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">NAND</text><text x="60.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">латентність доступу до сторінки — десятки МІКРОсекунд</text><rect x="250.0" y="258.0" width="150.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="325.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">адреса сторінки</text><rect x="406.0" y="258.0" width="170.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="491.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">чекати завантаження сторінки</text><rect x="582.0" y="258.0" width="90.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="627.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">потік байтів</text><text x="686.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700"></text>
<text x="250.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">→ поки сторінка не в буфері, жодного слова; тисячі тактів простою на кожну випадкову адресу</text>
<rect x="60.0" y="336.0" width="780.0" height="76.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">для коду важить НЕ пропускна здатність, а затримка ВИПАДКОВОГО читання — скільки чекати одне слово.</text>
<text x="450.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">NOR дає слово за десятки нс → процесор годується прямо з неї. NAND змушує спершу підняти сторінку в RAM.</text>
<text x="450.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6a18" text-anchor="middle" font-weight="700">тому «NAND-система» тримає крихітний завантажувач у NOR-подібній пам'яті — інакше нема звідки взяти першу команду.</text>
<rect x="60.0" y="426.0" width="780.0" height="54.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">а для масових даних важить ПРОПУСКНА здатність і ціна за біт — і тут перемагає NAND зі своїми сторінками.</text>
<text x="450.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">великий блок вигідно лити суцільним потоком; випадковий доступ до окремого байта тут майже не потрібен.</text>
</svg>