<rect x="60.0" y="286.0" width="780.0" height="66.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">головна несиметрія: запис уміє тільки опускати біти 1 → 0.</text>
<text x="450.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">підняти біт 0 → 1 поодинці не можна — це робить лише стирання, цілим блоком.</text>
<rect x="60.0" y="366.0" width="780.0" height="92.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">звідси й асиметрія часу: читання — наносекунди-мікросекунди;</text>
<text x="450.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">запис сторінки — частки мілісекунди; стирання блока — десятки-сотні мілісекунд.</text>
<text x="450.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">читати дешево, стирати дорого — це й визначає, як таким чипом користуються.</text>
<text x="450.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">точні числа — за даташитом конкретного чипа; тут важать порядки.</text>
