<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога до спільної відповіді про скидання</text>
<line x1="70.0" y1="150.0" x2="830.0" y2="150.0" stroke="#8a8a8a" stroke-width="2.2"/>
<path d="M830.0 150.0 l-10 6 l0 -12 z" fill="#8a8a8a"/>
<circle cx="85.2" cy="150.0" r="7.0" fill="#fff" stroke="#c0392b" stroke-width="2.6"/>
<line x1="85.2" y1="142.0" x2="85.2" y2="124.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="85.2" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1960–70-ті</text>
<text x="85.2" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Епоха стандартних комірок:</text>
<text x="85.2" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">асинхронний CLR — норма ASIC</text>
<circle cx="298.0" cy="150.0" r="7.0" fill="#fff" stroke="#2457d6" stroke-width="2.6"/>
<line x1="298.0" y1="158.0" x2="298.0" y2="176.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="298.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1980-ті</text>
<text x="298.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">FPGA виходять у світ:</text>
<text x="298.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">асинхронний вхід — дефіцит у матриці</text>
<circle cx="488.0" cy="150.0" r="7.0" fill="#fff" stroke="#b8860b" stroke-width="2.6"/>
<line x1="488.0" y1="142.0" x2="488.0" y2="124.0" stroke="#b8860b" stroke-width="1.4"/>
<text x="488.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">1990-ті</text>
<text x="488.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">DFT/scan дозріває:</text>
<text x="488.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">автомат тесту вимагає керованого reset</text>
<circle cx="662.8" cy="150.0" r="7.0" fill="#fff" stroke="#27ae60" stroke-width="2.6"/>
<line x1="662.8" y1="158.0" x2="662.8" y2="176.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="662.8" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2002, SNUG SJ</text>
<text x="662.8" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Каммінгс і Міллз:</text>
<text x="662.8" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">«I am so confused!» — кристалізують консенсус</text>
<circle cx="799.6" cy="150.0" r="7.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="799.6" y1="142.0" x2="799.6" y2="124.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="799.6" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2003 →</text>
<text x="799.6" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">«Part Deux» (з Ґолсоном)</text>
<text x="799.6" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">і дефолти інструментів синтезу</text>
</svg>