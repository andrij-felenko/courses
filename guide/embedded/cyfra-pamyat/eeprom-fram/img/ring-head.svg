<rect x="640.0" y="130.0" width="330.0" height="300.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="805.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">При старті (wl_mount):</tspan><tspan x="805.0" dy="15.6"></tspan><tspan x="805.0" dy="15.6">1) обійти ВСІ слоти</tspan><tspan x="805.0" dy="15.6">2) перерахувати crc кожного;</tspan><tspan x="805.0" dy="15.6">   не збіглась → слот недійсний</tspan><tspan x="805.0" dy="15.6">   (недописаний / вигорілий)</tspan><tspan x="805.0" dy="15.6">3) серед ДІЙСНИХ узяти той,</tspan><tspan x="805.0" dy="15.6">   де послідовність найбільша</tspan><tspan x="805.0" dy="15.6">   → це і є голова кільця</tspan><tspan x="805.0" dy="15.6"></tspan><tspan x="805.0" dy="15.6">Жодного стану в EEPROM,</tspan><tspan x="805.0" dy="15.6">крім самих слотів: голова</tspan><tspan x="805.0" dy="15.6">відновлюється з даних щоразу.</tspan><tspan x="805.0" dy="15.6">Новий запис ляже в слот</tspan><tspan x="805.0" dy="15.6">за головою (тут — слот 4).</tspan></text>
<text x="500.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Позиція в масиві нічого не значить (кільце циклічне) — «останній» визначає лише максимум монотонної послідовності.</text>
