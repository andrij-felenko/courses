<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Шинна передача байта — мікросекунди; а сам запис у комірку — окремий повільний цикл, поки чип «зайнятий»</text>
