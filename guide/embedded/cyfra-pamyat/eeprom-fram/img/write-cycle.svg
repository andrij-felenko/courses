<rect x="90.0" y="338.0" width="820.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="500.0" y="360.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">У FRAM цієї довгої частини НЕМА взагалі: перемикання диполів завершується за час самої шинної</tspan><tspan x="500.0" dy="15.6">передачі, тож «зайнятого» стану не буває, чекати нічого — запис такий самий швидкий, як читання.</tspan></text>
