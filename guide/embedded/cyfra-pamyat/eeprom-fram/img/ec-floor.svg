<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Ec не можна робити скільки завгодно малим</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Внутрішні поля — деполяризувальне E_dep та imprint E_imp — нікуди не діваються; коерцитивне поле мусить лишатися більшим за них</text>
<line x1="70.0" y1="300.0" x2="610.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="475.0" x2="340.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="616.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">E</text>
<text x="350.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">P</text>
<path d="M 90.0 423.0 C 354.5 423.0, 465.0 381.0, 465.0 282.0 S 550.0 177.0, 590.0 177.0" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<path d="M 590.0 177.0 C 405.5 177.0, 295.0 219.0, 295.0 318.0 S 130.0 423.0, 90.0 423.0" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<path d="M 90.0 423.0 C 314.5 423.0, 425.0 381.0, 425.0 282.0 S 550.0 177.0, 590.0 177.0" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="3,4"/>
<path d="M 590.0 177.0 C 365.5 177.0, 255.0 219.0, 255.0 318.0 S 130.0 423.0, 90.0 423.0" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="3,4"/>
<line x1="465.0" y1="300.0" x2="465.0" y2="294.0" stroke="#b9770e" stroke-width="1.2"/>
<text x="465.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">+Ec</text>
<line x1="295.0" y1="300.0" x2="295.0" y2="306.0" stroke="#b9770e" stroke-width="1.2"/>
<text x="295.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">−Ec</text>
<line x1="340.0" y1="156.0" x2="380.0" y2="156.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="360.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">E_imp</text>
<text x="400.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">(петля з'їхала)</text>
<text x="94.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">ідеальна (пунктир)</text>
<text x="640.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Три сили тиснуть на Ec знизу:</text>
<rect x="640.0" y="132.0" width="320.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">1) Деполяризувальне поле</tspan><tspan x="800.0" dy="14.3">E_dep = −Pr / (ε₀·ε)</tspan><tspan x="800.0" dy="14.3">тягне диполі назад у нуль — тобто розряджає біт</tspan></text>
<rect x="640.0" y="224.0" width="320.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="253.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">2) Imprint E_imp</tspan><tspan x="800.0" dy="13.0">заряди-пастки зсувають петлю по E;</tspan><tspan x="800.0" dy="13.0">один стан стає «улюбленим» — інший не дописується</tspan></text>
<rect x="640.0" y="316.0" width="320.0" height="78.0" rx="6" fill="#fff7e6" stroke="#b9770e" stroke-width="1.5"/><text x="800.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">3) Теплові поштовхи (kT)</tspan><tspan x="800.0" dy="14.3">з часом перекидають диполі через бар'єр,</tspan><tspan x="800.0" dy="14.3">а бар'єр тим нижчий, чим менше Ec</tspan></text>
<rect x="80.0" y="430.0" width="840.0" height="78.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="466.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Робоче поле запису мусить упевнено долати Ec, а сам Ec — з запасом перекривати суму внутрішніх полів:  E_write  &gt;  Ec  &gt;  E_dep + E_imp.</tspan><tspan x="500.0" dy="10.4">Зробити Ec крихітним — означає, що деполяризація й imprint самі перекинуть біт: запис легшає, але дані не тримаються. Тому Ec має свою ПІДЛОГУ, і живлення запису мусить бути достатнім, щоб її подолати.</tspan></text>
</svg>