<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнал читання: заряд перемикання Q = 2·Pr·A стає напругою на біт-лінії</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Перекид стану міняє поляризацію на ΔP = 2·Pr; цей заряд висипається на ємність біт-лінії й дає крихітний стрибок напруги</text>
<line x1="70.0" y1="250.0" x2="280.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="66.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">P=0</text>
<rect x="110.0" y="162.0" width="46.0" height="88.0" rx="3" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="133.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+Pr</text>
<text x="133.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">«1»</text>
<rect x="200.0" y="250.0" width="46.0" height="88.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="223.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">−Pr</text>
<text x="223.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«0»</text>
<line x1="268.0" y1="162.0" x2="268.0" y2="338.0" stroke="#b9770e" stroke-width="1.6"/>
<line x1="262.0" y1="162.0" x2="268.0" y2="162.0" stroke="#b9770e" stroke-width="1.6"/>
<line x1="262.0" y1="338.0" x2="268.0" y2="338.0" stroke="#b9770e" stroke-width="1.6"/>
<text x="276.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">ΔP = 2·Pr</text>
<text x="130.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">різниця двох станів —</text>
<text x="130.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ось що можна виміряти</text>
<rect x="420.0" y="150.0" width="210.0" height="66.0" rx="6" fill="#fff7e6" stroke="#b9770e" stroke-width="1.6"/><text x="525.0" y="179.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">заряд, що перетече:</tspan><tspan x="525.0" dy="16.9">Q = ΔP · A = 2·Pr·A</tspan></text>
<line x1="340.0" y1="250.0" x2="414.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="150.0" width="220.0" height="92.0" rx="8" fill="#fbfbfd" stroke="#2457d6" stroke-width="1.8"/>
<text x="810.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">висипається на C_біт</text>
<text x="810.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ΔV = Q / C_біт</text>
<text x="810.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">= 2·Pr·A / C_біт</text>
<line x1="635.0" y1="185.0" x2="694.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="300.0" width="400.0" height="168.0" rx="8" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.4"/>
<text x="290.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Числа (типовий FRAM-конденсатор)</text>
<text x="110.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Pr ≈ 20 мкКл/см²  =  2·10⁻⁵ Кл/см²</text>
<text x="110.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">A ≈ 1 мкм² = 10⁻⁸ см²</text>
<text x="110.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Q = 2·Pr·A ≈ 4·10⁻¹³ Кл = 0.4 пКл</text>
<text x="110.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">C_біт ≈ 200 фФ  →  ΔV ≈ 2 мВ</text>
<text x="290.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2 мВ — це вже близько до шуму підсилювача!</text>
<rect x="520.0" y="300.0" width="400.0" height="168.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="720.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чому це — підлога розміру комірки</text>
<text x="540.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">A ↓ (менша комірка) → Q ↓ → ΔV ↓</text>
<text x="540.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">але C_біт майже не меншає</text>
<text x="540.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(її задає довжина металевої лінії)</text>
<text x="540.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔV мусить лишатися &gt; шуму: ΔV ≳ 100 мВ·…</text>
<text x="540.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ є найменша A, нижче якої біт не</text>
<text x="540.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   відрізнити від шуму. Pr — головна</text>
<text x="540.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   ручка, що цю підлогу піднімає.</text>
</svg>