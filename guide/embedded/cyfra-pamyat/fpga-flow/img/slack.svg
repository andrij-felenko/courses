<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статичний аналіз таймінгу: слек одного шляху</text>
<line x1="70.0" y1="150.0" x2="630.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="630.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-style="italic">час, нс</text>
<line x1="70.0" y1="150.0" x2="70.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="70.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">0: старт такту</text>
<line x1="536.7" y1="150.0" x2="536.7" y2="142.0" stroke="#6b7280" stroke-width="1.8"/>
<text x="536.7" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">10.0: край такту</text>
<line x1="518.0" y1="150.0" x2="518.0" y2="142.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="518.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">9.6: край − t_su</text>
<line x1="443.3" y1="150.0" x2="443.3" y2="158.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="443.3" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">8.0: дані тут</text>
<path d="M 70.0 150.0 Q 256.7 96.0 443.3 150.0" fill="none" stroke="#27ae60" stroke-width="2.2"/>
<text x="256.7" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">прибуття даних: T_cq + логіка + дріт = 8.0</text>
<line x1="443.3" y1="196.0" x2="518.0" y2="196.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="443.3" y1="190.0" x2="443.3" y2="202.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="518.0" y1="190.0" x2="518.0" y2="202.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="480.7" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">слек = 9.6 − 8.0 = +1.6 нс</text>
<text x="480.7" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">додатний → встигаємо; від'ємний → зрив</text>
<rect x="141.7" y="284.0" width="436.6" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">слек = (край такту − t_su) − (T_cq + t_логіки + t_дроту)</tspan></text>
</svg>