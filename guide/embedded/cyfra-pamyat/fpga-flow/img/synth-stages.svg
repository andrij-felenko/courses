<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтез — три стадії: розбір, RTL-оптимізація, відображення в LUT</text>
<rect x="26.0" y="130.0" width="150.0" height="90.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/>
<text x="101.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">розбір</text>
<text x="101.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="101.0" dy="0.0">текст HDL →</tspan><tspan x="101.0" dy="13.0">дерево, RTL-граф</tspan></text>
<rect x="210.0" y="130.0" width="150.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="285.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">RTL-оптимізація</text>
<text x="285.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">згорнути сталі,</tspan><tspan x="285.0" dy="13.0">викинути мертве,</tspan><tspan x="285.0" dy="13.0">спільні підвирази</tspan></text>
<line x1="176.0" y1="175.0" x2="208.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="394.0" y="130.0" width="150.0" height="90.0" rx="6" fill="#fdf6e3" stroke="#b9770e" stroke-width="1.9"/>
<text x="469.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">відображення</text>
<text x="469.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="469.0" dy="0.0">покрити граф</tspan><tspan x="469.0" dy="13.0">таблицями LUT-k</tspan><tspan x="469.0" dy="13.0">(covering)</tspan></text>
<line x1="360.0" y1="175.0" x2="392.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="544.0" y1="175.0" x2="576.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="569.2" y="152.3" width="149.6" height="45.3" rx="6" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.9"/><text x="644.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="644.0" dy="0.0">нетліст</tspan><tspan x="644.0" dy="14.3">із LUT-k і тригерів</tspan></text>
<text x="469.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тут форма схеми стрибком міняється:</text>
<text x="469.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вентилі зникають, лишаються цеглинки кристала</text>
<line x1="26.0" y1="104.0" x2="544.0" y2="104.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="285.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">усе це відповідає на «ЩО будувати» — про «де на кристалі» ще ні слова</text>
</svg>