<text x="542.0" y="171.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">стала пропускна</text>
<circle cx="606.0" cy="362.0" r="7.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/><text x="606.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">МК: одне ядро</text><text x="606.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">1 смуга, висока частота</text>
<circle cx="294.0" cy="134.0" r="7.0" fill="#1f8a3b" stroke="#ffffff" stroke-width="1.5"/><text x="294.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">FPGA</text><text x="294.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">багато смуг, скромна частота</text>
<circle cx="522.0" cy="320.0" r="7.0" fill="#8a5a1f" stroke="#ffffff" stroke-width="1.5"/><text x="522.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a1f" text-anchor="middle" font-weight="700">DSP / жорстка периферія</text><text x="522.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">кілька спец-смуг, швидко</text>
<rect x="40.0" y="420.0" width="680.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="450.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Одне ядро тисне лише правий важіль (частоту) — і впирається в стелю Амдала: послідовну частину роботи не розігнати додаванням смуг.</tspan></text>
</svg>