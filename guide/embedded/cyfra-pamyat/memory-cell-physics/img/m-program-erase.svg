<text x="410.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Читання заряду не торкається — лише дивиться, відкривається транзистор чи ні; тому швидке й безмежне.</text>
<text x="410.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">А запис і стирання щоразу ПРОТЯГУЮТЬ заряд крізь оксид — і цей прохід не безкоштовний.</text>
