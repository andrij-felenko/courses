<text x="420.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Один плавучий затвор кодує не «є/нема заряду», а КІЛЬКА рівнів заряду — стільки бітів, скільки рівнів розрізнить датчик.</text>
<text x="420.0" y="406.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Більше рівнів на комірці → дешевше за біт, але зазори вужчі: менше стійкість, менше циклів, повільніше.</text>
