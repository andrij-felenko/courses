<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фатальні ножиці: чому дрібніша комірка — вразливіша</text>
<line x1="90.0" y1="330.0" x2="770.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="90.0" y1="330.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">покоління пам'яті  →  дедалі дрібніша комірка</text>
<text x="74.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">заряд</text>
<text x="74.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на вузлі</text>
<line x1="130.0" y1="150.0" x2="710.0" y2="150.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="130.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="310.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="490.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="670.0" cy="150.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="147.3" y="93.9" width="265.4" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="280.0" dy="0.0">заряд від однієї частинки — СТАЛИЙ</tspan><tspan x="280.0" dy="13.7">(його диктує ядерна фізика, не техпроцес)</tspan></text>
<polyline points="130,175 310,235 490,285 670,315" fill="none" stroke="#2457d6" stroke-width="3"/>
<circle cx="130.0" cy="175.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="310.0" cy="235.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="490.0" cy="285.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="670.0" cy="315.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="393.3" y="326.9" width="253.4" height="44.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="520.0" dy="0.0">критичний заряд Q_crit — ПАДАЄ</tspan><tspan x="520.0" dy="13.7">(менша C, нижча V → менший поріг зриву)</tspan></text>
<line x1="490.0" y1="150.0" x2="490.0" y2="285.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="670.0" y1="150.0" x2="670.0" y2="315.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="615.3" y="76.7" width="117.5" height="66.6" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="674.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="674.0" dy="0.0">тут заряд частинки</tspan><tspan x="674.0" dy="12.3">вже ≈ увесь біт —</tspan><tspan x="674.0" dy="12.3">один постріл</tspan><tspan x="674.0" dy="12.3">перекидає його</tspan></text>
<text x="420.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Заряд, який несе частинка, з роками не меншає; критичний заряд комірки — меншає щокрок. Криві сходяться — і те, що колись біт витримував, тепер його перекидає.</text>
</svg>