<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні гілки, один перекинутий біт</text>
<rect x="70.0" y="61.1" width="280.0" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="210.0" dy="0.0">уран/торій</tspan><tspan x="210.0" dy="13.7">у КОРПУСІ мікросхеми</tspan><tspan x="210.0" dy="13.7">(домішки, частки на млн)</tspan></text>
<rect x="70.0" y="152.9" width="280.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">α-частинка летить</tspan><tspan x="210.0" dy="13.7">у кристал зсередини</tspan></text>
<line x1="210.0" y1="112.0" x2="210.0" y2="152.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мей і Вудс, Intel</text>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">IRPS 1978 — термін «soft error»</text>
<rect x="500.0" y="61.1" width="300.0" height="57.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="650.0" dy="0.0">космічний протон б'є</tspan><tspan x="650.0" dy="13.7">ядро атома в АТМОСФЕРІ</tspan><tspan x="650.0" dy="13.7">→ злива вторинних частинок</tspan></text>
<rect x="500.0" y="152.9" width="300.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">нейтрон досягає землі,</tspan><tspan x="650.0" dy="13.7">вибиває уламок з ядра Si</tspan></text>
<line x1="650.0" y1="112.0" x2="650.0" y2="152.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціґлер і Ленфорд, IBM/Yale</text>
<text x="650.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Science 1979 — гілка космосу</text>
<rect x="150.0" y="304.0" width="560.0" height="32.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="324.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">хмара пар «електрон–дірка» на вузлі  →  перекинутий біт (SEU)</tspan></text>
<line x1="210.0" y1="262.0" x2="280.0" y2="305.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="650.0" y1="262.0" x2="580.0" y2="305.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Два різні джерела, майже одна дата — і той самий кінцевий механізм: заряджений слід у кремнії збирається на вузлі й перекидає біт.</text>
</svg>