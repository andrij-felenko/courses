<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перегони «менше деталей на біт»: 6 → 3 → 1 транзистор</text>
<circle cx="160.0" cy="95.0" r="34.0" fill="#efefef" stroke="#6b7280" stroke-width="2.4"/>
<text x="160.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">6T</text>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRAM-засувка</text>
<rect x="65.0" y="165.0" width="190.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="160.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">тримає біт сама,</tspan><tspan x="160.0" dy="13.0">швидка, не тече —</tspan><tspan x="160.0" dy="13.0">та велика й дорога</tspan><tspan x="160.0" dy="13.0">(сьогодні: кеш)</tspan></text>
<line x1="260.0" y1="95.0" x2="352.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="390.0" cy="95.0" r="34.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="390.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">3T</text>
<text x="390.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">комірка Honeywell</text>
<rect x="295.0" y="165.0" width="190.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="390.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">компроміс: заряд</tspan><tspan x="390.0" dy="13.0">на затворі, читання</tspan><tspan x="390.0" dy="13.0">неруйнівне —</tspan><tspan x="390.0" dy="13.0">Intel 1103</tspan></text>
<line x1="490.0" y1="95.0" x2="582.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="620.0" cy="95.0" r="34.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="620.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">1T1C</text>
<text x="620.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">комірка Деннарда</text>
<rect x="525.0" y="165.0" width="190.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="620.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ключ + конденсатор,</tspan><tspan x="620.0" dy="13.0">найщільніша й</tspan><tspan x="620.0" dy="13.0">найдешевша —</tspan><tspan x="620.0" dy="13.0">ціною регенерації</tspan></text>
<text x="390.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">менше транзисторів на біт → більше бітів на кристал → дешевший біт; тому 1T і перемогла</text>
</svg>