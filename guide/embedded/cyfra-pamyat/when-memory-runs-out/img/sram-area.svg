<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">дві навхрест-зчеплені засувки</tspan><tspan x="150.0" dy="11.7">(4T) + два ключі доступу (2T)</tspan></text>
