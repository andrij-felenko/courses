<text x="436.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="436.0" dy="0.0">кожен транзистор — площа кремнію,</tspan><tspan x="436.0" dy="13.0">а площа — гроші; тому SRAM дають скупо</tspan></text>
