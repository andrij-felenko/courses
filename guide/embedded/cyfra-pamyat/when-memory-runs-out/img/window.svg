<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зовнішня RAM: велика на позір, вузька фізично</text>
<rect x="60.0" y="150.0" width="110.0" height="70.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="115.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">CPU</tspan><tspan x="115.0" dy="16.9">ядро</tspan></text>
<rect x="230.0" y="140.0" width="130.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="295.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">КЕШ</tspan><tspan x="295.0" dy="15.6">маленький,</tspan><tspan x="295.0" dy="15.6">швидкий</tspan></text>
<line x1="170.0" y1="185.0" x2="228.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="199.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">адреса</text>
<line x1="360.0" y1="185.0" x2="500.0" y2="185.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="430.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вузька шина</text>
<text x="430.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SPI/QSPI, такти</text>
<rect x="500.0" y="110.0" width="260.0" height="150.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="630.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">зовнішня PSRAM</tspan><tspan x="630.0" dy="15.6">(8 МБ)</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">велика й дешева,</tspan><tspan x="630.0" dy="15.6">АЛЕ фізично далеко</tspan></text>
<rect x="230.0" y="270.0" width="250.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="355.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">ПОПАДАННЯ в кеш → відповідь миттєва</tspan><tspan x="355.0" dy="13.0">(дані вже поруч із CPU)</tspan></text>
<rect x="500.0" y="270.0" width="260.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">ПРОМАХ → довга дорога по шині</tspan><tspan x="630.0" dy="13.0">(десятки тактів очікування)</tspan></text>
<text x="410.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">зовнішня RAM у адресному просторі виглядає як поличка, та фізично це вузьке вікно крізь кеш</text>
</svg>