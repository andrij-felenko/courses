<text x="198.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">заряд стікає в лінію</text>
<rect x="120.0" y="168.0" width="140.0" height="40.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">підсилювач</tspan><tspan x="190.0" dy="13.0">«чує» 1</tspan></text>
<line x1="190.0" y1="210.0" x2="190.0" y2="246.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="198.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">негайно дозаписати</text>
