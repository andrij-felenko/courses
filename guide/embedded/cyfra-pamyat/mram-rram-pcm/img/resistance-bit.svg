<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна ідея трьох нових пам'ятей: біт — це ОПІР комірки</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Flash і DRAM кодують біт ЗАРЯДОМ; MRAM, RRAM і PCM кодують його СТАНОМ ОПОРУ — і читають, міряючи струм</text>
<rect x="40.0" y="95.0" width="410.0" height="290.0" rx="8" fill="#fbfbfb" stroke="#dddddd" stroke-width="1.4"/>
<text x="245.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Старий спосіб: біт = ЗАРЯД</text>
<text x="245.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Flash — у плавучому затворі, DRAM — на конденсаторі)</text>
<rect x="80.0" y="175.0" width="150.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="125.0" cy="207.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="125.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="155.0" cy="200.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="155.0" y="202.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="185.0" cy="210.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="185.0" y="212.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="137.0" cy="234.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="137.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="173.0" cy="230.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="173.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="155.0" cy="220.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="155.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="155.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">є заряд → «0»</text>
<rect x="260.0" y="175.0" width="150.0" height="95.0" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4"/>
<text x="335.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(порожньо)</text>
<text x="335.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">нема заряду → «1»</text>
<text x="245.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">крихкий: заряд стікає, тоне в шумі,</text>
<text x="245.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">комірку треба заряджати крізь ізолятор</text>
<text x="245.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(звідси знос і повільний запис)</text>
<rect x="550.0" y="95.0" width="410.0" height="290.0" rx="8" fill="#f3faf5" stroke="#27ae60" stroke-width="1.6"/>
<text x="755.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Новий спосіб: біт = ОПІР</text>
<text x="755.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(MRAM, RRAM, PCM — стан самої речовини комірки)</text>
<rect x="590.0" y="175.0" width="150.0" height="95.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/>
<line x1="600.0" y1="222.0" x2="730.0" y2="222.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="610.0" y1="222.0" x2="720.0" y2="222.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="665.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">струм тече</text>
<text x="665.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">низький опір → «1»</text>
<rect x="770.0" y="175.0" width="150.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<line x1="780.0" y1="222.0" x2="845.0" y2="222.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="852.0" y1="214.0" x2="868.0" y2="230.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="852.0" y1="230.0" x2="868.0" y2="214.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="845.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">майже не тече</text>
<text x="845.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">високий опір → «0»</text>
<text x="755.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">стан тримає сама речовина (магніт, місток,</text>
<text x="755.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">фаза кристала) — стоїть без живлення й роками</text>
<text x="755.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">читати — лише пустити крізь комірку слабкий струм</text>
<text x="500.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Читання однакове для всіх трьох: пропусти крихітний струм і зміряй — тече вільно чи ні. Різниця лише в тому, ЩО саме створює два рівні опору.</text>
</svg>