<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи зробити «низький опір» і «високий опір»</text>
<text x="510.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">MRAM — напрямком магніту; RRAM — містком атомних дефектів; PCM — впорядкованістю самих атомів</text>
