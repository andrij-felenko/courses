<text x="510.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Усі три дають два чіткі рівні опору — лиш фізика різна: магнетизм, рух атомних дефектів, плавлення-кристалізація.</text>
