<rect x="700.0" y="370.0" width="210.0" height="50.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">CDC (Debezium) / Outbox</tspan><tspan x="805.0" dy="14.3">• Нуль подвійного запису</tspan><tspan x="805.0" dy="14.3">• Подійна інвалідація</tspan></text>
