<rect x="280.0" y="180.0" width="240.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="203.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">2. Яка частота змін даних</tspan><tspan x="400.0" dy="15.6">і вимоги до латентності?</tspan></text>
