<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево прийняття рішень для вибору стратегії свіжості даних</text>
<rect x="320.0" y="15.0" width="400.0" height="36.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="37.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Дерево прийняття рішень: Стратегія когерентності</tspan></text>
