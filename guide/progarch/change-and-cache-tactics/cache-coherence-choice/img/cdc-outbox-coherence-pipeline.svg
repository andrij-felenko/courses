<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1084.74 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1084.74" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр інвалідації кешу через Change Data Capture (CDC)</text>
<rect x="320.0" y="20.0" width="400.0" height="36.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="43.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Подійно-орієнтована когерентність та CDC</tspan></text>
<rect x="40.0" y="80.0" width="140.0" height="70.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Сервіс-Власник</tspan><tspan x="110.0" dy="16.9">(Write Path)</tspan></text>
<rect x="40.0" y="200.0" width="140.0" height="70.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Первинна БД</tspan><tspan x="110.0" dy="13.0">(PostgreSQL / MySQL)</tspan></text>
<line x1="110.0" y1="150.0" x2="110.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="115.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">1. ACID Commit</text>
<rect x="250.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="325.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Журнал WAL /</tspan><tspan x="325.0" dy="15.6">Binlog</tspan></text>
<rect x="470.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="545.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">CDC Engine</tspan><tspan x="545.0" dy="16.9">(Debezium)</tspan></text>
<line x1="180.0" y1="235.0" x2="250.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="235.0" x2="470.0" y2="235.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle">2. Read WAL</text>
<rect x="690.0" y="140.0" width="120.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="750.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Шина Подій</tspan><tspan x="750.0" dy="15.6">(Apache Kafka /</tspan><tspan x="750.0" dy="15.6">RabbitMQ)</tspan></text>
<line x1="620.0" y1="235.0" x2="690.0" y2="235.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="655.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3. Publish Event</text>
<rect x="870.0" y="80.0" width="130.0" height="65.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="935.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Сервіс Б</tspan><tspan x="935.0" dy="16.9">(Споживач)</tspan></text>
<rect x="870.0" y="240.0" width="130.0" height="65.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="935.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Локальний / L2</tspan><tspan x="935.0" dy="16.9">Кеш Б</tspan></text>
<line x1="810.0" y1="170.0" x2="870.0" y2="115.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="835.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4. Event</text>
<line x1="935.0" y1="145.0" x2="935.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="940.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">5. Evict / Invalidate</text>
<rect x="40.0" y="310.0" width="960.0" height="70.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">✨ ПЕРЕВАГИ CDC (CHANGE DATA CAPTURE):</tspan><tspan x="520.0" dy="15.6">• Атомарність гарантована БД: запис у WAL неможливо оминути чи зламати аварією сервісу.</tspan><tspan x="520.0" dy="15.6">• Нульове часове зчеплення: сервіс-власник не знає про існування кешів споживачів.</tspan><tspan x="520.0" dy="15.6">• Повна усуненість проблеми подвійного запису в прикладному коді.</tspan></text>
</svg>