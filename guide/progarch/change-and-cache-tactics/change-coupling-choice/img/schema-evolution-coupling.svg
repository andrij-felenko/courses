<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка системи при відкаті: REST проти подій</text>
<rect x="290.0" y="30.0" width="400.0" height="36.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="490.0" y="53.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Поведінка системи при відкаті (Rollback)</tspan></text>
<rect x="50.0" y="85.0" width="880.0" height="120.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0"></tspan></text>
<rect x="70.0" y="95.0" width="480.0" height="25.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Синхронний REST / gRPC при відкаті Сервісу Б з v2 на v1:</tspan></text>
<rect x="70.0" y="125.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. Сервіс Б відкочено до v1</tspan><tspan x="195.0" dy="15.6">через виявлений баг</tspan></text>
<line x1="320.0" y1="157.0" x2="365.0" y2="157.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.0" y="125.0" width="260.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">2. Запити від Сервісу А (v2)</tspan><tspan x="495.0" dy="15.6">негайно відхиляються (500/400)</tspan></text>
<line x1="625.0" y1="157.0" x2="670.0" y2="157.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="125.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">3. Аварійний відкат Сервісу А</tspan><tspan x="790.0" dy="15.6">або вимикання фіч-прапорця</tspan></text>
<rect x="50.0" y="225.0" width="880.0" height="130.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0"></tspan></text>
<rect x="70.0" y="235.0" width="480.0" height="25.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Асинхронний Pub/Sub / Outbox при відкаті Сервісу Б з v2 на v1:</tspan></text>
<rect x="70.0" y="265.0" width="250.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. Сервіс Б відкочено до v1;</tspan><tspan x="195.0" dy="15.6">Споживач переводиться на DLQ</tspan><tspan x="195.0" dy="15.6">або зупиняє зсув (offset)</tspan></text>
<line x1="320.0" y1="302.0" x2="365.0" y2="302.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.0" y="265.0" width="260.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">2. Сервіс А (v2) працює беззупинно,</tspan><tspan x="495.0" dy="15.6">продовжуючи писати в Outbox/Log</tspan></text>
<line x1="625.0" y1="302.0" x2="670.0" y2="302.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="265.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">3. Після фиксу Б v2.1,</tspan><tspan x="790.0" dy="15.6">події вичитуються з черги.</tspan><tspan x="790.0" dy="15.6">Нуль втрачених даних!</tspan></text>
</svg>