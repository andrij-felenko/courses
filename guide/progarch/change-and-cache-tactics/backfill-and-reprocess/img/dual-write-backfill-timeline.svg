<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази Dual-Write Backfill та вирішення конфліктів із живим трафіком</text>
<rect x="25.0" y="40.0" width="215.0" height="130.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="132.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Expand &amp; Dual-Write</text>
<text x="132.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Живий трафік пише у v1 і v2</text>
<line x1="35.0" y1="120.0" x2="230.0" y2="120.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="132.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нові записи отримують обидві версії</text>
<line x1="240.0" y1="105.0" x2="258.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="258.0" y="40.0" width="215.0" height="130.0" rx="8" fill="#fff3cd" stroke="#c0392b" stroke-width="1.8"/>
<text x="365.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Backfill (Історія)</text>
<text x="365.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фоновий worker заповнює v2</text>
<line x1="268.0" y1="120.0" x2="463.0" y2="120.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="365.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тільки для WHERE v2 IS NULL</text>
<line x1="473.0" y1="105.0" x2="491.0" y2="105.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="491.0" y="40.0" width="215.0" height="130.0" rx="8" fill="#e8f4f8" stroke="#1b6ec2" stroke-width="1.8"/>
<text x="598.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b6ec2" text-anchor="middle" font-weight="700">3. Shadow Validation</text>
<text x="598.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння v1 та v2 в фоні</text>
<line x1="501.0" y1="120.0" x2="696.0" y2="120.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="598.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Темне читання (Diff Engine)</text>
<line x1="706.0" y1="105.0" x2="724.0" y2="105.0" stroke="#1b6ec2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="724.0" y="40.0" width="215.0" height="130.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="831.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Contract &amp; Cleanup</text>
<text x="831.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикання читання на v2</text>
<line x1="734.0" y1="120.0" x2="929.0" y2="120.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="831.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Видалення v1 та Dual-Write</text>
<rect x="25.0" y="200.0" width="910.0" height="210.0" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
<text x="480.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка запобігання перезапису живого трафіку фоновим бекфілом</text>
<rect x="55.0" y="245.0" width="410.0" height="145.0" rx="6" fill="#ffffff" stroke="#1b6ec2" stroke-width="1.2"/>
<text x="260.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b6ec2" text-anchor="middle" font-weight="700">Потік 1: Активний OLTP трафік (Dual-Write)</text>
<text x="75.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Користувач створює/оновлює запис</text>
<text x="75.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Код пише `v1_val` та обчислений `v2_val`</text>
<text x="75.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Встановлює `updated_at = NOW()` та `v2_status = 'READY'`</text>
<text x="75.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Вищий пріоритет: свіжі дані не перекриваються бекфілом</text>
<rect x="495.0" y="245.0" width="410.0" height="145.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="700.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Потік 2: Фоновий Backfill Worker</text>
<text x="515.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Вибирає історичний чанк `WHERE v2_val IS NULL`</text>
<text x="515.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Обчислює `v2_val` для давнього запису</text>
<text x="515.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. UPDATE `... WHERE id = X AND v2_val IS NULL`</text>
<text x="515.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Атомарна умова `IS NULL` відкидає конфліктний перезапис</text>
</svg>