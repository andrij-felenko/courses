<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл зворотної міграції Expand-Contract</text>
<rect x="280.0" y="35.0" width="480.0" height="38.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Життєвий цикл зворотної міграції Expand-Contract</tspan></text>
<rect x="40.0" y="90.0" width="300.0" height="330.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0"></tspan></text>
<rect x="55.0" y="105.0" width="270.0" height="32.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Фаза 1: Expand (Розширення)</tspan></text>
<rect x="60.0" y="150.0" width="260.0" height="110.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">• Схема: DDL додає nullable нове поле</tspan><tspan x="190.0" dy="13.0">• Код v1: працює зі старим полем</tspan><tspan x="190.0" dy="13.0">• Код v2: пише в обоє полів (Dual-write)</tspan><tspan x="190.0" dy="13.0">• Стан сумісності: 100%</tspan></text>
<rect x="60.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#e7f6ec" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">✅ БЕЗПЕЧНИЙ ВІДКАТ</tspan><tspan x="190.0" dy="15.6">Просто відкочуємо код v2 -&gt; v1.</tspan><tspan x="190.0" dy="15.6">База залишається повністю сумісною.</tspan></text>
<rect x="60.0" y="355.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Статус: Зворотна зміна</tspan></text>
<rect x="370.0" y="90.0" width="300.0" height="330.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="2.0"/><text x="520.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0"></tspan></text>
<rect x="385.0" y="105.0" width="270.0" height="32.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="520.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Фаза 2: Backfill (Фоновий перенос)</tspan></text>
<rect x="390.0" y="150.0" width="260.0" height="110.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">• Перенос історичних даних батчами</tspan><tspan x="520.0" dy="14.3">• Тригер/View дублює нові записи</tspan><tspan x="520.0" dy="14.3">• Обидва коди (v1 та v2) працездатні</tspan><tspan x="520.0" dy="14.3">• Перевірка повноти переносу</tspan></text>
<rect x="390.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="520.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="520.0" dy="0.0">⚡ ВІДКАТ З КОМПЕНСАЦІЄЮ</tspan><tspan x="520.0" dy="15.6">Код v1 читає старе поле.</tspan><tspan x="520.0" dy="15.6">Потрібен компенсаційний тригер.</tspan></text>
<rect x="390.0" y="355.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Статус: Контрольований відкат</tspan></text>
<rect x="700.0" y="90.0" width="300.0" height="330.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="850.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0"></tspan></text>
<rect x="715.0" y="105.0" width="270.0" height="32.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="850.0" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Фаза 3: Contract (Згортання)</tspan></text>
<rect x="720.0" y="150.0" width="260.0" height="110.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="850.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">• Видалення старого поля / тригера</tspan><tspan x="850.0" dy="15.6">• Виконується ЛИШЕ після 100% v2</tspan><tspan x="850.0" dy="15.6">• Старий код v1 повністю виведено</tspan><tspan x="850.0" dy="15.6">• Повна очистка legacy</tspan></text>
<rect x="720.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="850.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="850.0" dy="0.0">⛔ ТОЧКА НЕПОВЕРНЕННЯ</tspan><tspan x="850.0" dy="15.6">Відкат схеми більше неможливий.</tspan><tspan x="850.0" dy="15.6">Тільки Forward-Fix або бекап.</tspan></text>
<rect x="720.0" y="355.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Статус: Незворотний крок</tspan></text>
<line x1="340.0" y1="250.0" x2="370.0" y2="250.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="670.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
