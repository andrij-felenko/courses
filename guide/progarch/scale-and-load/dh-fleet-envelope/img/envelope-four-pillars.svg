<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фізичні виміри розрахунку ємності флоту з 200k пристроїв</text>
<rect x="40.0" y="40.0" width="960.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="67.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Флот Digital Homes: 200 000 активних хабів · 30 с інтервал телеметрії</tspan></text>
<rect x="40.0" y="110.0" width="225.0" height="270.0" rx="6" fill="#eef2f6" stroke="#b8bfc8" stroke-width="1.5"/><text x="152.5" y="198.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">1. Мережева смуга</tspan><tspan x="152.5" dy="16.9"></tspan><tspan x="152.5" dy="16.9">• 6 667 msg/s baseline</tspan><tspan x="152.5" dy="16.9">• 20 000 msg/s peak (3x)</tspan><tspan x="152.5" dy="16.9">• Пакет: 500B + 100B framing</tspan><tspan x="152.5" dy="16.9">• Смуга: 96 Mbps peak</tspan><tspan x="152.5" dy="16.9">• Пакетний темп: 20k pps</tspan></text>
<rect x="40.0" y="390.0" width="225.0" height="36.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="152.5" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.5" dy="0.0">Ліміт: NGINX / L4 LB</tspan></text>
<rect x="285.0" y="110.0" width="225.0" height="270.0" rx="6" fill="#eef2f6" stroke="#b8bfc8" stroke-width="1.5"/><text x="397.5" y="198.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="397.5" dy="0.0">2. Оперативна пам'ять</tspan><tspan x="397.5" dy="16.9"></tspan><tspan x="397.5" dy="16.9">• 200 000 TCP-сокетів</tspan><tspan x="397.5" dy="16.9">• Kernel socket: 16 KB/сокет</tspan><tspan x="397.5" dy="16.9">• Gateway state: 32 KB/сесія</tspan><tspan x="397.5" dy="16.9">• Разом: ~9.6 GB RAM</tspan><tspan x="397.5" dy="16.9">• Буфер шторму: +6.4 GB</tspan></text>
<rect x="285.0" y="390.0" width="225.0" height="36.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="397.5" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="397.5" dy="0.0">Ліміт: 16 GB Node RAM</tspan></text>
<rect x="530.0" y="110.0" width="225.0" height="270.0" rx="6" fill="#eef2f6" stroke="#b8bfc8" stroke-width="1.5"/><text x="642.5" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">3. Обчислення (CPU)</tspan><tspan x="642.5" dy="15.6"></tspan><tspan x="642.5" dy="15.6">• TLS crypto: 0.5 ms/handshake</tspan><tspan x="642.5" dy="15.6">• Deserialization: 5 µs/msg</tspan><tspan x="642.5" dy="15.6">• Steady state: ~0.1 core</tspan><tspan x="642.5" dy="15.6">• Reconnect storm (1.6k/s):</tspan><tspan x="642.5" dy="15.6">  ~0.9 CPU cores crypto</tspan></text>
<rect x="530.0" y="390.0" width="225.0" height="36.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="642.5" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.5" dy="0.0">Ліміт: Crypto Offload</tspan></text>
<rect x="775.0" y="110.0" width="225.0" height="270.0" rx="6" fill="#eef2f6" stroke="#b8bfc8" stroke-width="1.5"/><text x="887.5" y="198.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.5" dy="0.0">4. Дискова система</tspan><tspan x="887.5" dy="16.9"></tspan><tspan x="887.5" dy="16.9">• Сирі записи: 20 000 IOPS</tspan><tspan x="887.5" dy="16.9">• Батчинг (100 ms flush):</tspan><tspan x="887.5" dy="16.9">  10 записів/с по 1 MB</tspan><tspan x="887.5" dy="16.9">• Throughput: 10 MB/s WAL</tspan><tspan x="887.5" dy="16.9">• Збереження 30d: ~8.6 TB</tspan></text>
<rect x="775.0" y="390.0" width="225.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="887.5" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.5" dy="0.0">Ліміт: NVMe Sequential WAL</tspan></text>
</svg>