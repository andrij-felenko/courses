<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення 20 000 поодиноких записів на 10 послідовних блоків дискового WAL</text>
<rect x="40.0" y="60.0" width="240.0" height="260.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="143.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Вхідні події телеметрії</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">20 000 msg/s peak</tspan><tspan x="160.0" dy="16.9">500 B / повідомлення</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">Несинхронізовані</tspan><tspan x="160.0" dy="16.9">потоки від 200k хабів</tspan></text>
<line x1="280.0" y1="190.0" x2="340.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.0" y="155.0" width="50.0" height="24.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">20k IOPS</tspan></text>
<rect x="340.0" y="60.0" width="320.0" height="260.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="500.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ring Buffer / In-Memory Batcher</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">• Накопичення за 100 ms вікно</tspan><tspan x="500.0" dy="16.9">• Агрегація у блок 1 MB</tspan><tspan x="500.0" dy="16.9">• Сортування за пристроєм</tspan><tspan x="500.0" dy="16.9">• Zero-allocation memory pool</tspan></text>
<line x1="660.0" y1="190.0" x2="720.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="662.0" y="155.0" width="56.0" height="24.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">10 flush/s</tspan></text>
<rect x="720.0" y="60.0" width="260.0" height="260.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Дисковий масив (WAL SSD)</tspan><tspan x="850.0" dy="16.9"></tspan><tspan x="850.0" dy="16.9">• 10 послідовних записів/с</tspan><tspan x="850.0" dy="16.9">• 10 MB/s throughput</tspan><tspan x="850.0" dy="16.9">• 10 IOPS замість 20 000!</tspan><tspan x="850.0" dy="16.9">• Захист накопичувача від зносу</tspan></text>
