<text x="35.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">L7 Балансування (gRPC / HTTP/2 рівень): Рівномірний розподіл</text>
<text x="35.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Envoy L7 демультиплексує HTTP/2 фрейми й розподіляє окремі RPC виклики між усіма подами.</text>
