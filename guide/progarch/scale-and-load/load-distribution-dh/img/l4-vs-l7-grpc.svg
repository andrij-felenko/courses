<rect x="718.7" y="148.4" width="122.6" height="63.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="780.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Ingest Pod 2</tspan><tspan x="780.0" dy="15.6">0% навантаження</tspan><tspan x="780.0" dy="15.6">(Простій)</tspan></text>
