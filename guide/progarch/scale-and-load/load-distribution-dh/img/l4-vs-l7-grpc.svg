<text x="35.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">L4 Балансування (TCP рівень): Перевантаження одного вузла</text>
<text x="35.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Одне TCP з'єднання містить всі gRPC стрими. L4 бачить лише сокет і відправляє все на Вузол 1.</text>
<rect x="72.1" y="108.4" width="115.8" height="63.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Хаб DH</tspan><tspan x="130.0" dy="15.6">(1 TCP сокет</tspan><tspan x="130.0" dy="15.6">3 gRPC стрими)</tspan></text>
<rect x="338.2" y="108.4" width="163.6" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">L4 Балансувальник</tspan><tspan x="420.0" dy="15.6">(IPVS / Maglev / TCP)</tspan><tspan x="420.0" dy="15.6">Бачить лише IP/Port</tspan></text>
