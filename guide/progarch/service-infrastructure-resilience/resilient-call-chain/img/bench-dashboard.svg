<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 412" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="412" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що друкує стенд: до і після</text>
<rect x="150.0" y="46.0" width="15.0" height="15.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="174.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">наївно — повтор на кожному рівні</text>
<rect x="520.0" y="46.0" width="15.0" height="15.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="544.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">дисципліна — 1 рівень + бюджет + запобіжник + дедлайн</text>
<line x1="510.0" y1="84.0" x2="510.0" y2="248.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="40.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Викликів на дно (лічильник C)</text><rect x="50.0" y="124.0" width="300.0" height="32.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="58.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">наївно</text><text x="358.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">≈ 52 000</text><rect x="50.0" y="172.0" width="42.1" height="32.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="100.1" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">≈ 7 300</text><text x="60.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ ×7 менше</text>
<text x="540.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">p99 наскрізної затримки</text><rect x="550.0" y="124.0" width="300.0" height="32.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="558.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">наївно</text><text x="858.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">≈ 8 100 мс</text><rect x="550.0" y="172.0" width="18.0" height="32.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="576.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">≈ 320 мс</text><text x="560.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ ×25 менше — і в межах дедлайну 1000 мс</text>
<rect x="160.0" y="268.0" width="700.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="510.0" y="291.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Один «приречений» клік у наївному ланцюзі  =  3·3·3 = 27 ударів по C</tspan></text>
<text x="510.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">Числа злегка гуляють від насіння — але порядок саме такий:</tspan><tspan x="510.0" dy="16.2">шторм множить виклики й роздуває хвіст, дисципліна кладе обидва додолу</tspan></text>
</svg>