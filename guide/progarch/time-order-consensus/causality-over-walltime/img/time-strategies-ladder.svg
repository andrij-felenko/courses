<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина стратегій часу: від дешевої брехні до дорогої правди</text>
<line x1="96.0" y1="150.0" x2="96.0" y2="520.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="80" y="335" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 80 335)">надійніший фізичний порядок · дорожче</text>
<rect x="150.0" y="90.0" width="300.0" height="44.0" rx="6" fill="#f0f0f2" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">стратегія часу</tspan></text>
<rect x="450.0" y="90.0" width="380.0" height="44.0" rx="6" fill="#f0f0f2" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">що дає</tspan></text>
<rect x="830.0" y="90.0" width="360.0" height="44.0" rx="6" fill="#f0f0f2" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">чим платиш</tspan></text>
<rect x="150.0" y="150.0" width="300.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Настінний час</tspan></text>
<rect x="450.0" y="150.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">показати людині; дешево</tspan></text>
<rect x="830.0" y="150.0" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">БРЕШЕ про порядок між машинами</tspan></text>
<rect x="150.0" y="224.0" width="300.0" height="62.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Годинник Лампорта</tspan></text>
<rect x="450.0" y="224.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">повний порядок, згідний із причинністю</tspan></text>
<rect x="830.0" y="224.0" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">не бачить, що дві події конкурентні</tspan></text>
<rect x="150.0" y="298.0" width="300.0" height="62.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Векторний годинник</tspan></text>
<rect x="450.0" y="298.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">точно: причинне чи конкурентне</tspan></text>
<rect x="830.0" y="298.0" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">росте з числом акторів</tspan></text>
<rect x="150.0" y="372.0" width="300.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="407.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">HLC (гібридний)</tspan></text>
<rect x="450.0" y="372.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="407.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">виглядає як фізичний час І тримає причинність</tspan></text>
<rect x="830.0" y="372.0" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="407.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">майже задарма; не істинний фізичний</tspan></text>
<rect x="150.0" y="446.0" width="300.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="481.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">TrueTime (Spanner)</tspan></text>
<rect x="450.0" y="446.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="481.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">справжній фізичний порядок, вузька невизначеність</tspan></text>
<rect x="830.0" y="446.0" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="481.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">атомні годинники + очікування на коміті</tspan></text>
<text x="610.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фізичний порядок між машинами не безкоштовний — його докуповують рівно там і стільки, скільки треба. Решту впорядковують причинністю.</text>
</svg>