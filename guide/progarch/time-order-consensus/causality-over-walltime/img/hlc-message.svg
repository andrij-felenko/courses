<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причинність через кордон машини: max підтягує відсталий приймач</text>
<text x="70.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Вузол A</text>
<text x="70.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">годинник = 20</text>
<text x="70.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Вузол B</text>
<text x="70.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">годинник ВІДСТАЄ = 17</text>
<line x1="334.0" y1="150.0" x2="606.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="334.0" y1="330.0" x2="806.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="626.0" y1="160.0" x2="812.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">повідомлення</text>
<circle cx="320.0" cy="150.0" r="10.0" fill="#dfe9fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="320.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">локальна подія</tspan><tspan x="320.0" dy="16.2">20·0</tspan></text>
<circle cx="620.0" cy="150.0" r="10.0" fill="#dfe9fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">надсилає</tspan><tspan x="620.0" dy="16.2">20·0</tspan></text>
<circle cx="320.0" cy="330.0" r="10.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="320.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">мала подія</tspan><tspan x="320.0" dy="16.2">l = 16</tspan></text>
<circle cx="820.0" cy="330.0" r="10.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="820.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">отримує</tspan><tspan x="820.0" dy="16.2">20·1</tspan></text>
<rect x="210.0" y="441.6" width="780.0" height="66.8" rx="6" fill="#fff8e6" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="462.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">На прийомі:  l = max( l_B = 16 ,  l_отр = 20 ,  pt_B = 17 ) = 20</tspan><tspan x="600.0" dy="16.9">l збіглося з отриманим  →  c = c_отр + 1 = 1</tspan><tspan x="600.0" dy="16.9">мітка отримання  20·1   &gt;   мітка відправлення  20·0</tspan></text>
</svg>