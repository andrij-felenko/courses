<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Виграє останній за годинником» тихо губить запис</text>
<text x="590.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві правки сцени «вечір»:  A о 20:00:10 (годинник +4с → штамп 14),  B о 20:00:12 (штамп 12)</text>
<text x="590.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">B справді пізніша за A на дві секунди</text>
<text x="96.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Вирішує за ШТАМПОМ ЧАСУ  (last-write-wins)</text>
<line x1="668.0" y1="210.0" x2="837.0" y2="210.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="280.0" y="176.6" width="380.0" height="66.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="197.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">порівнює штампи:</tspan><tspan x="470.0" dy="16.9">14  проти  12</tspan><tspan x="470.0" dy="16.9">→ лишає A (14 більше)</tspan></text>
<rect x="845.0" y="174.8" width="230.0" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="960.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">результат: стан A</tspan><tspan x="960.0" dy="18.2">справжню зміну B</tspan><tspan x="960.0" dy="18.2">ВИКИНУТО — БРЕХНЯ</tspan></text>
<line x1="70.0" y1="320.0" x2="1110.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="96.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Вирішує за ПРИЧИННІСТЮ</text>
<line x1="668.0" y1="430.0" x2="837.0" y2="430.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="280.0" y="396.6" width="380.0" height="66.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">версія одного господаря</tspan><tspan x="470.0" dy="16.9">або векторний годинник:</tspan><tspan x="470.0" dy="16.9">бачить, що новіше / конкурентне</tspan></text>
<rect x="832.8" y="394.8" width="254.4" height="70.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="960.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">результат: правильний стан</tspan><tspan x="960.0" dy="18.2">конкурентні — обидві,</tspan><tspan x="960.0" dy="18.2">а не тихий програш — ПРАВДА</tspan></text>
<text x="590.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вхід однаковий — різне лише правило рішення. Штамп двох годинників бреше про порядок; причинний порядок — ні.</text>
</svg>