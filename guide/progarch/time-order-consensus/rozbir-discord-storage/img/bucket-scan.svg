<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спадний скан відер: назад у часі, поки не набрано N або не досягнуто дна</text>
<rect x="250.0" y="52.0" width="18.0" height="18.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="276.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">зібрано</text>
<rect x="430.0" y="52.0" width="18.0" height="18.0" rx="3" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/>
<text x="456.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">порожнє → пропуск (кеш)</text>
<rect x="740.0" y="52.0" width="18.0" height="18.0" rx="3" fill="#ffffff" stroke="#cdd4da" stroke-width="1.6"/>
<text x="766.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">не скановано (стоп раніше)</text>
<text x="600.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">скан назад у часі — новіші відра першими</text>
<line x1="1114.0" y1="150.0" x2="246.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="233.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">дно</text>
<rect x="224.0" y="196.0" width="18.0" height="118.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="233.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">channel_id</text>
<text x="324.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">відро 48</text>
<rect x="250.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#ffffff" stroke="#cdd4da" stroke-width="1.6"/><text x="324.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="324.0" dy="0.0">не</tspan><tspan x="324.0" dy="16.9">скановано</tspan></text>
<text x="482.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">відро 49</text>
<rect x="408.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#ffffff" stroke="#cdd4da" stroke-width="1.6"/><text x="482.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="482.0" dy="0.0">не</tspan><tspan x="482.0" dy="16.9">скановано</tspan></text>
<text x="640.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">відро 50</text>
<rect x="566.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.6"/><text x="640.0" y="242.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">приклад тут</tspan><tspan x="640.0" dy="16.9">+35 → 50 = N</tspan><tspan x="640.0" dy="16.9">СТОП</tspan></text>
<text x="798.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">відро 51</text>
<rect x="724.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="798.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="798.0" dy="0.0">порожнє</tspan><tspan x="798.0" dy="16.9">пропущено</tspan></text>
<text x="956.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">відро 52</text>
<rect x="882.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="956.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="956.0" dy="0.0">12 повідомл.</tspan><tspan x="956.0" dy="16.9">зібрано</tspan></text>
<text x="1114.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d68910" text-anchor="middle" font-weight="700">відро 53</text>
<rect x="1040.0" y="196.0" width="148.0" height="118.0" rx="6" fill="#fdf2e0" stroke="#d68910" stroke-width="2.6"/><text x="1114.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1114.0" dy="0.0">3 повідомл.</tspan><tspan x="1114.0" dy="16.9">старт (before)</tspan></text>
<text x="600.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">набрано:  3 (відро 53)  +  12 (52)  +  пропуск (51)  +  35 (50)  =  50 = N</text>
<text x="600.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Хода: від відра курсора «before» ліворуч; порожнє відро 51 пропущене з кешу; на відрі 50 набрано N — і скан спинився, не дійшовши до дна.</text>
<text x="600.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Два запобіжники від нескінченного скану: дно = відро створення каналу (channel_id теж Snowflake) і пам'ять про порожні відра.</text>
</svg>