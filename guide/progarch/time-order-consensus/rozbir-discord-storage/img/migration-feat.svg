<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переливання трильйонів: власний rust-мігратор — дні, не місяці</text>
<line x1="250.0" y1="74.0" x2="250.0" y2="236.0" stroke="#c9d0d8" stroke-width="1.6"/>
<rect x="250.0" y="92.0" width="630.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="60.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="60.0" dy="0.0">стандартний</tspan><tspan x="60.0" dy="16.2">інструмент</tspan></text>
<text x="565.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 3 місяці (~90 діб) — лише ОЦІНКА</text>
<rect x="250.0" y="176.0" width="63.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="60.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="60.0" dy="0.0">власний</tspan><tspan x="60.0" dy="16.2">rust-мігратор</tspan></text>
<text x="329.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">9 днів — фактично</text>
<text x="329.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">×10 швидше</text>
<rect x="55.0" y="272.0" width="470.0" height="76.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="290.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">3.2 млн / с</text><text x="290.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пікова швидкість переливу</text>
<rect x="535.0" y="272.0" width="470.0" height="76.0" rx="8" fill="#fdf2e0" stroke="#d68910" stroke-width="1.7"/><text x="770.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#d68910" text-anchor="middle" font-weight="700">подвійний запис</text><text x="770.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">у стару й нову базу — для звірки</text>
<rect x="55.0" y="360.0" width="470.0" height="76.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="290.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">177 → 72</text><text x="290.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вузли після переходу</text>
<rect x="535.0" y="360.0" width="470.0" height="76.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="770.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">40–125 → 15 мс</text><text x="770.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">p99 читання історії</text>
<text x="530.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">rust-каркас сервісів даних розширили в мігратор «за пообіддя» — і три оцінені місяці стиснулися в дев'ять днів</text>
</svg>