<rect x="60.0" y="90.0" width="940.0" height="170.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="80.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">Телеметрія</text><text x="80.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">потік із пристроїв</text><line x1="340.0" y1="106.0" x2="340.0" y2="244.0" stroke="#e5e7eb" stroke-width="1.2"/><line x1="600.0" y1="106.0" x2="600.0" y2="244.0" stroke="#e5e7eb" stroke-width="1.2"/><line x1="820.0" y1="106.0" x2="820.0" y2="244.0" stroke="#e5e7eb" stroke-width="1.2"/><text x="360.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">~52 ТБ/рік</text><text x="360.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">~33 000 записів/с</text><rect x="612.0" y="142.0" width="190.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="707.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.0" dy="0.0">НЕ ВЛАЗИТЬ</tspan></text><rect x="612.0" y="186.0" width="190.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="707.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.0" dy="0.0">НЕ ВСТИГАЄ (запис)</tspan></text><rect x="832.0" y="144.0" width="150.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="907.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="907.0" dy="0.0">→ розбити</tspan><tspan x="907.0" dy="15.0">за home_id</tspan><tspan x="907.0" dy="15.0">(доми незалежні</tspan><tspan x="907.0" dy="15.0">→ дешево)</tspan></text>
