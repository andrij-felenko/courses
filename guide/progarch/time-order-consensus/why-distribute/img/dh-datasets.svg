<rect x="60.0" y="478.0" width="940.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="530.0" y="499.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">розподіляй набір даних, що вперся в стіну, — не всю систему</tspan></text>
