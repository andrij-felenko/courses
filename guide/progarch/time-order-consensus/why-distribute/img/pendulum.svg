<text x="104.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">1976 · Tandem NonStop — shared-nothing заради відмовостійкості</text>
<circle cx="92.0" cy="496.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="104.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">1983 · Teradata (DBC/1012) — перша комерційна shared-nothing БД</text>
<circle cx="92.0" cy="522.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="104.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">1986 · Stonebraker: «The Case for Shared Nothing» — названо й на щит</text>
<circle cx="92.0" cy="548.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="104.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2003–06 · Google: GFS · MapReduce · Bigtable — «розподілити все» = мрія</text>
<circle cx="92.0" cy="574.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="104.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2009–10 · NoSQL-мітап · «MongoDB is web scale» — масштаб як бейдж</text>
<circle cx="662.0" cy="470.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="674.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2015 · «Monolith First» (Fowler) · «Boring Technology» (McKinley)</text>
<circle cx="662.0" cy="496.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="674.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2017 · «You Are Not Google» (Oz Nova / Ozan Onay) — метод UNPHAT</text>
<circle cx="662.0" cy="522.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="674.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2023 · «Just Use Postgres for Everything» (Schmidt) — згорнути стек</text>
<rect x="70.0" y="632.0" width="1080.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="610.0" y="653.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">щоразу тяглися до розбиття як до бейджа — перш ніж сила змусила; і щоразу верталися до правила: спершу назви силу числом</tspan></text>
