<line x1="885.0" y1="132.0" x2="1065.0" y2="238.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="885.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3 з 5 підтвердили = ЖИВА більшість → рішення ухвалено</text>
<text x="885.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">раунд туди-й-назад на КОЖНЕ рішення</text>
<text x="885.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">нема більшості живих → рішення не ухвалюється</text>
<text x="885.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">додав вузлів → кворум БІЛЬШИЙ, не швидший</text>
<text x="590.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">Кожен щабель угору — ще один раунд до більшості й ще одна причина стати недоступним.</text>
