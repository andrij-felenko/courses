<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина координації: скільки згоди справді треба</text>
<rect x="310.0" y="125.0" width="560.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Щабель 2 · Консенсус — згода про ПОРЯДОК</tspan><tspan x="590.0" dy="16.9">один узгоджений лог · лідер · конфіг · замок · «рівно один»</tspan></text>
<rect x="310.0" y="265.1" width="560.0" height="49.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Щабель 1 · Кворум — згода про ЗНАЧЕННЯ</tspan><tspan x="590.0" dy="16.9">W + R &gt; N · лідера нема · розбіжність зводимо пізніше</tspan></text>
<rect x="277.8" y="405.1" width="624.5" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Щабель 0 · Ніякої координації — незалежні шарди</tspan><tspan x="590.0" dy="16.9">розклад за ключем · запит живе на одному вузлі · вузли не ждуть одне одного</tspan></text>
<line x1="590.0" y1="405.0" x2="590.0" y2="317.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="265.0" x2="590.0" y2="177.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
