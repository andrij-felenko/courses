<text x="590.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">Дефолт — найнижчий щабель, що ще коректний; нагору лізь, лише коли задача змусить.</text>
