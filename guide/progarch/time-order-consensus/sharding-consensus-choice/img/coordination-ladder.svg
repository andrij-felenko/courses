<text x="1108.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">↑ ціна рішення</text>
<text x="1108.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">↑ ризик простою</text>
<text x="1108.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">↑ складність</text>
<line x1="150.0" y1="122.0" x2="150.0" y2="460.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="80.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">УНИЗ:</text>
