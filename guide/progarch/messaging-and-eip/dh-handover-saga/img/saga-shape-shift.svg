<rect x="648.0" y="244.0" width="512.0" height="70.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.6"/><text x="904.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="904.0" dy="0.0">семантична дія в іншому сервісі:</tspan><tspan x="904.0" dy="17.6">«поверни кошти», «звільни резерв»</tspan></text>
