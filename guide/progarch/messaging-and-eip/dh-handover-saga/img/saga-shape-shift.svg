<rect x="60.0" y="244.0" width="512.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="316.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="316.0" dy="0.0">сама транзакція БД —</tspan><tspan x="316.0" dy="17.6">зустрічний запис у тій самій базі</tspan></text>
<rect x="60.0" y="356.0" width="512.0" height="88.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="316.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="316.0" dy="0.0">віддати замки, підняти конкурентність;</tspan><tspan x="316.0" dy="17.6">усі кроки зворотні за замовчуванням</tspan></text>
