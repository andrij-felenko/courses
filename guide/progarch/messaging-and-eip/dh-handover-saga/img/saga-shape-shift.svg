<rect x="150.0" y="556.0" width="360.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="330.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">класика 1987:</tspan><tspan x="330.0" dy="17.6">усі кроки компенсовні</tspan></text>
