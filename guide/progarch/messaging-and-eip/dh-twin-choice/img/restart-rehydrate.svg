<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рестарт: складне відновлення проти регідратації</text>
<text x="40.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">чистий актор — правда в пам'яті (складне відновлення):</text>
<rect x="60.0" y="108.0" width="180.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">актор у RAM</tspan><tspan x="150.0" dy="16.2">version 7</tspan></text>
<rect x="288.0" y="108.0" width="132.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="354.0" y="140.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="354.0" dy="0.0">⚡ крах</tspan><tspan x="354.0" dy="15.6">RAM зникла</tspan></text>
<rect x="468.0" y="108.0" width="200.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="568.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="568.0" dy="0.0">знімок v5 на диску</tspan></text>
<rect x="716.0" y="108.0" width="240.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="836.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="836.0" dy="0.0">+ переграти хвіст</tspan><tspan x="836.0" dy="16.2">подій e6, e7</tspan></text>
<rect x="1004.0" y="108.0" width="150.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1079.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1079.0" dy="0.0">version 7</tspan></text>
<line x1="240.0" y1="144.0" x2="288.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="144.0" x2="468.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="668.0" y1="144.0" x2="716.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="956.0" y1="144.0" x2="1004.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="607.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">вікно втрати між знімками</text>
<text x="40.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">композиція — актор-координатор, правда у шарді (відновлення = один store.get):</text>
<rect x="60.0" y="308.0" width="180.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">актор-кеш</tspan><tspan x="150.0" dy="16.2">(будь-який стан)</tspan></text>
<rect x="288.0" y="308.0" width="132.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="354.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="354.0" dy="0.0">⚡ крах</tspan><tspan x="354.0" dy="15.6">сесія зникла</tspan></text>
<rect x="468.0" y="308.0" width="260.0" height="72.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="598.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">store.get(home_id)</tspan><tspan x="598.0" dy="16.2">один рух</tspan></text>
<rect x="776.0" y="308.0" width="260.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="906.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="906.0" dy="0.0">свіжий актор</tspan><tspan x="906.0" dy="16.2">version 7</tspan></text>
<line x1="240.0" y1="344.0" x2="288.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="344.0" x2="468.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="728.0" y1="344.0" x2="776.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="410.0" x2="1160.0" y2="410.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
<text x="600.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Той самий крах — дві ціни. Актор як джерело правди воскресає зі знімка плюс перегравання (і має вікно втрати).</tspan><tspan x="600.0" dy="16.2">Актор-координатор просто перечитує рядок: стан ніколи не був у ньому, тож «відновлювати» нема чого.</tspan></text>
</svg>