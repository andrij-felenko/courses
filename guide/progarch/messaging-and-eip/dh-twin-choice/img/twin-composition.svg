<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Твін — не одне сховище, а три ролі даних</text>
<rect x="330.0" y="140.0" width="300.0" height="116.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">АКТОР-ШАР З'ЄДНАНЬ</tspan><tspan x="480.0" dy="16.9">жива сесія під'єднаного дому</tspan><tspan x="480.0" dy="16.9">гарячий шлях · read-your-writes</tspan><tspan x="480.0" dy="16.9">кеш+координатор над рядком БД</tspan></text>
<text x="480.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тільки доми «на зв'язку»</text>
<rect x="720.0" y="140.0" width="340.0" height="116.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="2.4"/><text x="890.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ШАРДОВАНА БД</tspan><tspan x="890.0" dy="16.9">рядок твіна на home_id · УСІ доми</tspan><tspan x="890.0" dy="16.9">довговічне джерело правди</tspan><tspan x="890.0" dy="16.9">переживає рестарт вузла</tspan></text>
<text x="890.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">джерело правди</text>
<rect x="720.0" y="410.0" width="340.0" height="110.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="890.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ЖУРНАЛ АУДИТУ</tspan><tspan x="890.0" dy="16.9">замки й доступ · append-only</tspan><tspan x="890.0" dy="16.9">«хто й коли відмикав»</tspan><tspan x="890.0" dy="16.9">вузька скибка, де історія = продукт</tspan></text>
<rect x="70.0" y="150.0" width="210.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">команда «замкни двері»</tspan><tspan x="175.0" dy="15.6">+ тепле читання</tspan><tspan x="175.0" dy="15.6">«покажи мій дім»</tspan></text>
<rect x="70.0" y="300.0" width="210.0" height="70.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">холодне читання</tspan><tspan x="175.0" dy="15.6">дім не на зв'язку</tspan></text>
<rect x="70.0" y="440.0" width="210.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">«хто відмикав</tspan><tspan x="175.0" dy="15.6">о 3:00?» — підтримка</tspan></text>
<line x1="280.0" y1="188.0" x2="330.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="176.0" x2="720.0" y2="176.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="675.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пише рядок</text>
<line x1="470.0" y1="256.0" x2="762.0" y2="408.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="560.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">дописує</text>
<text x="560.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">подію замка</text>
<line x1="280.0" y1="332.0" x2="720.0" y2="246.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">по ключу home_id, повз актор</text>
<line x1="280.0" y1="470.0" x2="720.0" y2="462.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="70.0" y1="542.0" x2="1150.0" y2="542.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
<text x="610.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Не «один варіант на все»: гарячий стан — в актора, довговічна правда — у шард БД, а сама історія «що коли ставалось» — у вузький журнал.</text>
</svg>