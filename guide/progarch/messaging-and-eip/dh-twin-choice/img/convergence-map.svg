<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три індустрії, один кістяк: та сама трійця ролей даних</text>
<rect x="280.0" y="58.0" width="320.0" height="60.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="2.2"/><text x="440.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">ДОВГОВІЧНЕ СХОВИЩЕ</tspan><tspan x="440.0" dy="17.6">= джерело правди</tspan></text>
<rect x="616.0" y="58.0" width="320.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/><text x="776.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="776.0" dy="0.0">ГАРЯЧИЙ АКТОР-ШАР</tspan><tspan x="776.0" dy="17.6">над сховищем — не правда</tspan></text>
<rect x="952.0" y="58.0" width="320.0" height="60.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="2.2"/><text x="1112.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1112.0" dy="0.0">ІСТОРІЯ / АУДИТ</tspan><tspan x="1112.0" dy="17.6">окремим потоком</tspan></text>
<rect x="40.0" y="140.0" width="224.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="152.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">Хмарний IoT</tspan><tspan x="152.0" dy="16.9">(AWS · Azure)</tspan></text>
<rect x="40.0" y="258.0" width="224.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="152.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">Ігровий бекенд</tspan><tspan x="152.0" dy="16.9">(Orleans · Halo)</tspan></text>
<rect x="40.0" y="376.0" width="224.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="152.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">Чат реального часу</tspan><tspan x="152.0" dy="16.9">(Discord)</tspan></text>
<rect x="280.0" y="140.0" width="320.0" height="108.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">device shadow (AWS)</tspan><tspan x="440.0" dy="15.6">device twin (Azure)</tspan><tspan x="440.0" dy="15.6">JSON, читаний і офлайн</tspan></text>
<rect x="616.0" y="140.0" width="320.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">тонка, керована службою</tspan><tspan x="776.0" dy="15.6">(сесія пристрою — MQTT)</tspan></text>
<rect x="952.0" y="140.0" width="320.0" height="108.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1112.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1112.0" dy="0.0">телеметрія → окремий потік</tspan><tspan x="1112.0" dy="15.6">(Timestream · Event Hubs)</tspan></text>
<rect x="280.0" y="258.0" width="320.0" height="108.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">storage provider → БД</tspan><tspan x="440.0" dy="15.6">стан грейна персиститься</tspan></text>
<rect x="616.0" y="258.0" width="320.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">grain: одна активація на ключ</tspan><tspan x="776.0" dy="15.6">гідрується з БД, правди не тримає</tspan></text>
<rect x="952.0" y="258.0" width="320.0" height="108.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1112.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1112.0" dy="0.0">журнал подій — окрема опція,</tspan><tspan x="1112.0" dy="15.6">не основа (Halo: стан у сховищі)</tspan></text>
<rect x="280.0" y="376.0" width="320.0" height="108.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">ScyllaDB · розділ (channel_id, bucket)</tspan><tspan x="440.0" dy="15.6">Snowflake — хронологія</tspan></text>
<rect x="616.0" y="376.0" width="320.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">GenServer: сесія-на-з'єднання</tspan><tspan x="776.0" dy="15.6">+ процес гільдії (жива, в пам'яті)</tspan></text>
<rect x="952.0" y="376.0" width="320.0" height="108.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1112.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1112.0" dy="0.0">audit log сервера окремо</tspan><tspan x="1112.0" dy="15.6">+ Rust-шар проти гарячих розділів</tspan></text>
<line x1="40.0" y1="512.0" x2="1272.0" y2="512.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
<text x="656.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жодна не веде весь стан журналом подій. Жодна не тримає весь стан лише в акторах.</text>
<text x="656.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Правда — у сховищі; актор — лише гарячий шлях; історія — окремим логом.</text>
</svg>