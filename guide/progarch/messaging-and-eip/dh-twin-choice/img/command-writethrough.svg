<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Командний шлях: координатор пише наскрізь у джерело правди</text>
<rect x="60.0" y="205.0" width="200.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="240.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">сесія А (власник)</tspan><tspan x="160.0" dy="16.9">«замкни двері»</tspan><tspan x="160.0" dy="16.9">замок entrance</tspan></text>
<rect x="350.0" y="175.0" width="340.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ЖИВА СЕСІЯ ДОМУ · актор</tspan><tspan x="520.0" dy="16.9">кеш-координатор, НЕ джерело правди</tspan><tspan x="520.0" dy="16.9">стан у пам'яті: version 6 → 7</tspan><tspan x="520.0" dy="16.9">пошта серіалізує команди</tspan></text>
<text x="520.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дім home42 на зв'язку</text>
<rect x="780.0" y="95.0" width="440.0" height="130.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="2.4"/><text x="1000.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ШАРДОВАНА БД · ДЖЕРЕЛО ПРАВДИ</tspan><tspan x="1000.0" dy="16.9">рядок на home_id · переживає рестарт</tspan><tspan x="1000.0" dy="16.9">put_cas(expected=6) → version=7</tspan></text>
<text x="1000.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">тут правда</text>
<rect x="780.0" y="375.0" width="440.0" height="120.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1000.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ЖУРНАЛ АУДИТУ · append-only</tspan><tspan x="1000.0" dy="16.9">append «Locked entrance · by A»</tspan><tspan x="1000.0" dy="16.9">вузька скибка: замки й доступ</tspan></text>
<line x1="260.0" y1="240.0" x2="350.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="305.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">① команда</text>
<line x1="690.0" y1="220.0" x2="780.0" y2="165.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="730.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">② пише у шард</text>
<line x1="690.0" y1="285.0" x2="780.0" y2="400.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="612.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">③ дописує подію</text>
<line x1="350.0" y1="285.0" x2="260.0" y2="285.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="305.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">④ ack (аж тепер)</text>
<line x1="60.0" y1="520.0" x2="1220.0" y2="520.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
<text x="640.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Актор веде кеш, але правду кладе В ШАРД (крок ②) ще ДО ack. Тому read-your-writes:</tspan><tspan x="640.0" dy="16.9">щойно ④ повернувся — довговічний рядок уже несе version 7; і тепле, і холодне читання це побачать.</tspan></text>
</svg>