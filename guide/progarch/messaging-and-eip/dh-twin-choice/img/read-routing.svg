<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три читання твіна — три різні шляхи</text>
<rect x="50.0" y="95.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ТЕПЛЕ</tspan><tspan x="180.0" dy="16.2">«покажи мій дім»</tspan><tspan x="180.0" dy="16.2">дім на зв'язку</tspan></text>
<rect x="50.0" y="220.0" width="260.0" height="80.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">ХОЛОДНЕ</tspan><tspan x="180.0" dy="16.2">«покажи мій дім»</tspan><tspan x="180.0" dy="16.2">дім спить (офлайн)</tspan></text>
<rect x="50.0" y="400.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ІСТОРІЯ</tspan><tspan x="180.0" dy="16.2">«хто відмикав о 3:00?»</tspan></text>
<rect x="430.0" y="145.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="580.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">РЕЄСТР СЕСІЙ</tspan><tspan x="580.0" dy="16.2">дім на зв'язку?</tspan><tspan x="580.0" dy="16.2">(жива сесія існує?)</tspan></text>
<rect x="870.0" y="80.0" width="400.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1070.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">АКТОР · жива сесія</tspan><tspan x="1070.0" dy="16.2">snapshot із пам'яті → version 7</tspan><tspan x="1070.0" dy="16.2">read-your-writes</tspan></text>
<rect x="870.0" y="235.0" width="400.0" height="96.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1070.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">ШАРДОВАНА БД</tspan><tspan x="1070.0" dy="16.2">get(home_id) — точково по ключу</tspan><tspan x="1070.0" dy="16.2">повз актор, дешеве читання</tspan></text>
<rect x="870.0" y="400.0" width="400.0" height="96.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1070.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">ЖУРНАЛ АУДИТУ</tspan><tspan x="1070.0" dy="16.2">read(home_id, 02:00–04:00)</tspan><tspan x="1070.0" dy="16.2">стрічка подій, не поточний стан</tspan></text>
<line x1="310.0" y1="135.0" x2="430.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="260.0" x2="430.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730.0" y1="175.0" x2="870.0" y2="128.0" stroke="#27ae60" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="730.0" y1="215.0" x2="870.0" y2="283.0" stroke="#2457d6" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="800.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">жива сесія → актор</text>
<text x="800.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">нема сесії → шард</text>
<line x1="310.0" y1="440.0" x2="870.0" y2="448.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="585.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">прямо в журнал — повз актор і повз поточний стан</text>
<line x1="60.0" y1="516.0" x2="1260.0" y2="516.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,5"/>
<text x="660.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Одне слово «читання» — три шляхи. Гаряче → в актор (read-your-writes); холодне → прямо в шард по ключу;</tspan><tspan x="660.0" dy="15.6">історія → у журнал. Розвилку теплого й холодного робить реєстр сесій: дім на зв'язку чи спить.</tspan></text>
</svg>