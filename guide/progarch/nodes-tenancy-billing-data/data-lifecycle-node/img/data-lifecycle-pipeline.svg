<rect x="560.0" y="50.0" width="220.0" height="150.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Cold Tier (1-7 років)</tspan><tspan x="670.0" dy="15.6"></tspan><tspan x="670.0" dy="15.6">• S3 / Apache Parquet</tspan><tspan x="670.0" dy="15.6">• Колонкове стиснення (ZSTD)</tspan><tspan x="670.0" dy="15.6">• Запити через DuckDB/Athena</tspan><tspan x="670.0" dy="15.6">• Відповідність регуляторам</tspan></text>
