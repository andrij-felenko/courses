<rect x="70.0" y="295.0" width="280.0" height="75.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Асинхронний оркестратор:</tspan><tspan x="210.0" dy="14.3">Оцінка TTL та регламентів</tspan></text>
<rect x="390.0" y="295.0" width="300.0" height="75.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Опитування Outbox / WAL:</tspan><tspan x="540.0" dy="14.3">Синхронізація Search &amp; Cache</tspan></text>
