<rect x="820.0" y="50.0" width="220.0" height="150.0" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/><text x="930.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Erasure / Shredded</tspan><tspan x="930.0" dy="15.6"></tspan><tspan x="930.0" dy="15.6">• Вилучення ключів KMS</tspan><tspan x="930.0" dy="15.6">• Знищення фізичних файлів</tspan><tspan x="930.0" dy="15.6">• Очищення знімків</tspan><tspan x="930.0" dy="15.6">• GDPR Compliance</tspan></text>
