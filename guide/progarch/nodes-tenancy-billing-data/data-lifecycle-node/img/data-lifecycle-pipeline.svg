<rect x="300.0" y="50.0" width="220.0" height="150.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="410.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Warm Tier (90-365 днів)</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">• Від'єднані партиції</tspan><tspan x="410.0" dy="15.6">• Read-Only доступ</tspan><tspan x="410.0" dy="15.6">• 0 впливу на гарячі індекси</tspan><tspan x="410.0" dy="15.6">• Дешевше сховище</tspan></text>
