<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатошаровий конвеєр життєвого циклу даних</text>
<rect x="40.0" y="50.0" width="220.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2980b9" stroke-width="1.5"/><text x="150.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Hot Tier (0-90 днів)</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">• PostgreSQL / Partitioned</tspan><tspan x="150.0" dy="15.6">• Оптимізовано під OLTP</tspan><tspan x="150.0" dy="15.6">• Часткові індекси</tspan><tspan x="150.0" dy="15.6">• Швидкі NVMe SSD</tspan></text>
