<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічне знищення даних (Crypto-Shredding)</text>
<rect x="370.0" y="30.0" width="300.0" height="65.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="520.0" y="58.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">KMS (Key Management System)</tspan><tspan x="520.0" dy="16.9">Ключ орендаря / користувача K_user</tspan></text>
<rect x="720.0" y="30.0" width="280.0" height="65.0" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/><text x="860.0" y="58.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Запит GDPR Article 17:</tspan><tspan x="860.0" dy="15.6">Видалення ключа K_user!</tspan></text>
<line x1="720.0" y1="62.0" x2="670.0" y2="62.0" stroke="#e74c3c" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="98.0" width="500.0" height="26.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Дані зашифровані за допомогою K_user в усіх шарах системи:</tspan></text>
<rect x="40.0" y="175.0" width="280.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2980b9" stroke-width="1.5"/><text x="180.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Гаряча база OLTP</tspan><tspan x="180.0" dy="15.6"></tspan><tspan x="180.0" dy="15.6">Зашифроване поле PII:</tspan><tspan x="180.0" dy="15.6">0x8f4a2b9... (Ciphertext)</tspan></text>
<rect x="380.0" y="175.0" width="280.0" height="120.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Архівні бакапи &amp; S3</tspan><tspan x="520.0" dy="15.6"></tspan><tspan x="520.0" dy="15.6">Незмінні файли Parquet:</tspan><tspan x="520.0" dy="15.6">E(PII, K_user)</tspan></text>
<rect x="720.0" y="175.0" width="280.0" height="120.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Журнали й аудит-логи</tspan><tspan x="860.0" dy="15.6"></tspan><tspan x="860.0" dy="15.6">Історія транзакцій:</tspan><tspan x="860.0" dy="15.6">E(User_Metadata, K_user)</tspan></text>
<line x1="430.0" y1="130.0" x2="180.0" y2="175.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="130.0" x2="520.0" y2="175.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="130.0" x2="860.0" y2="175.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="960.0" height="90.0" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/><text x="520.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Після видалення K_user з KMS зашифровані блоки перетворюються на математичний шум.</tspan><tspan x="520.0" dy="15.6">Бакапи не потрібно перезаписувати — GDPR дотримується миттєво без порушення цілісності ledgers!</tspan></text>
</svg>