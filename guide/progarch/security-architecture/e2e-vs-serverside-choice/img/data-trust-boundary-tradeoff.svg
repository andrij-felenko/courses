<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі довіри: Server-Side Encryption проти End-to-End Encryption</text>
<rect x="520.0" y="32.0" width="400.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="50.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">1. Server-Side Encryption (SSE) — Хмара бачить відкритий текст</tspan></text>
<rect x="100.0" y="100.0" width="140.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Клієнт</tspan><tspan x="170.0" dy="16.9">(App)</tspan></text>
<line x1="170.0" y1="100.0" x2="260.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TLS</text>
<line x1="260.0" y1="50.0" x2="260.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="260.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Межа хмари</text>
<rect x="370.0" y="100.0" width="180.0" height="70.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="460.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Сервер / RAM</tspan><tspan x="460.0" dy="15.6">[Відкритий текст]</tspan><tspan x="460.0" dy="15.6">AI · Пошук · Логи</tspan></text>
<rect x="600.0" y="100.0" width="130.0" height="50.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="665.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">KMS</tspan><tspan x="665.0" dy="15.6">(KEK/DEK)</tspan></text>
<line x1="460.0" y1="100.0" x2="535.0" y2="100.0" stroke="#333333" stroke-width="1.5"/>
<line x1="460.0" y1="115.0" x2="780.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="870.0" y="100.0" width="150.0" height="60.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="945.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="945.0" dy="0.0">База даних</tspan><tspan x="945.0" dy="13.0">[Зашифровано на диску]</tspan></text>
<text x="520.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Захищає від украдених дисків/дампів. Але зламаний сервер або інсайдер бачить відкритий текст.</text>
<line x1="40.0" y1="210.0" x2="1000.0" y2="210.0" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="520.0" y="235.0" width="400.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">2. End-to-End Encryption (E2E) — Сервер бачить лише непрозорий шифротекст</tspan></text>
<rect x="100.0" y="330.0" width="150.0" height="75.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="357.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Клієнт A / Пристрій</tspan><tspan x="175.0" dy="14.3">Ключ K у RAM</tspan><tspan x="175.0" dy="14.3">[Шифрує E2E]</tspan></text>
<line x1="175.0" y1="330.0" x2="360.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шифротекст (E2E)</text>
<rect x="480.0" y="330.0" width="210.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="585.0" y="353.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">Сервер Хмари</tspan><tspan x="585.0" dy="15.6">[ОСЛІПЛЕНИЙ]</tspan><tspan x="585.0" dy="15.6">Тільки маршрутизація</tspan><tspan x="585.0" dy="15.6">Пошук і AI НЕ працюють!</tspan></text>
<line x1="585.0" y1="330.0" x2="790.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шифротекст (E2E)</text>
<rect x="870.0" y="330.0" width="150.0" height="75.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="945.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="945.0" dy="0.0">Клієнт B / Приймач</tspan><tspan x="945.0" dy="15.6">Ключ K у RAM</tspan><tspan x="945.0" dy="15.6">[Розшифровує E2E]</tspan></text>
<text x="520.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сервер повністю осліплений. Zero-Trust приватність, але фічі аналітики та пошуку на сервері мертві.</text>
</svg>