<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія авторизації: взаємодія PEP, PDP, PIP та PAP</text>
<rect x="40.0" y="170.0" width="140.0" height="60.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Клієнт</tspan><tspan x="110.0" dy="16.9">(Запит до API)</tspan></text>
<line x1="180.0" y1="200.0" x2="250.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1. HTTP/RPC</text>
<rect x="250.0" y="140.0" width="180.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">PEP</tspan><tspan x="340.0" dy="13.0">(Policy Enforcement Point)</tspan><tspan x="340.0" dy="13.0"></tspan><tspan x="340.0" dy="13.0">Шлюз / Мідлвер</tspan></text>
<line x1="430.0" y1="200.0" x2="800.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="615.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4. Якщо ALLOW -&gt; Виконання сервісу</text>
<line x1="340.0" y1="260.0" x2="340.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2. Check(S, A, R)</text>
<line x1="380.0" y1="320.0" x2="380.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">3. Allow / Deny</text>
<rect x="260.0" y="320.0" width="240.0" height="90.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="380.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">PDP</tspan><tspan x="380.0" dy="14.3">(Policy Decision Point)</tspan><tspan x="380.0" dy="14.3">Рушій перевірки політик / графа</tspan></text>
<rect x="640.0" y="320.0" width="240.0" height="90.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">PIP</tspan><tspan x="760.0" dy="15.6">(Policy Information Point)</tspan><tspan x="760.0" dy="15.6">База даних / Джерело атрибутів</tspan></text>
<line x1="500.0" y1="365.0" x2="640.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Запит стосунків /</text>
<text x="570.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">атрибутів</text>
<rect x="520.0" y="40.0" width="240.0" height="80.0" rx="6" fill="#eef2f6" stroke="#708090" stroke-width="1.5"/><text x="640.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">PAP</tspan><tspan x="640.0" dy="15.6">(Policy Administration Point)</tspan><tspan x="640.0" dy="15.6">Збереження політик та кортежів</tspan></text>
<line x1="550.0" y1="120.0" x2="430.0" y2="320.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="530.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Публікація політик</text>
<rect x="800.0" y="170.0" width="160.0" height="60.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Захищений</tspan><tspan x="880.0" dy="16.9">Ресурс / Сервіс</tspan></text>
</svg>