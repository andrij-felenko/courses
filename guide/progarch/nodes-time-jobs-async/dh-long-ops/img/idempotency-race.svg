<text x="640.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">UNIQUE(idempotency_key) пропускає першого й тримає другого, поки перший не закомітить; тоді другий дістає 0 рядків і читає ту саму op-42. Один намір — одна операція — один рендер.</text>
