<rect x="1025.0" y="150.6" width="210.0" height="48.8" rx="6" fill="#fff4e6" stroke="#c0392b" stroke-width="1.5"/><text x="1130.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1130.0" dy="0.0">БРОКЕР</tspan><tspan x="1130.0" dy="16.2">поставити задачу</tspan></text>
