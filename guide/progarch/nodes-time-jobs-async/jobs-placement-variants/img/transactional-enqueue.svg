<rect x="165.0" y="183.8" width="330.0" height="32.5" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="204.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">записати кліп  (бізнес-факт)</tspan></text>
<rect x="165.0" y="251.8" width="330.0" height="32.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">поставити задачу  (INSERT у jobs)</tspan></text>
<rect x="140.0" y="375.5" width="380.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="396.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">COMMIT разом  або  ROLLBACK разом</tspan></text>
<text x="330.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">задачу неможливо ні загубити,</tspan><tspan x="330.0" dy="16.2">ні лишити фактом-сиротою</tspan></text>
