<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різні функції — той самий архітектурний рух</text>
<rect x="70.0" y="94.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">надіслати лист-вітання</tspan></text>
<rect x="70.0" y="179.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">стиснути план дому</tspan></text>
<rect x="70.0" y="264.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">нічний звіт про енергію</tspan></text>
<rect x="70.0" y="349.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">розкотити прошивку</tspan></text>
<rect x="70.0" y="434.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">застосувати сцену</tspan></text>
<rect x="70.0" y="519.0" width="280.0" height="52.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="210.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">перерахувати статистику</tspan></text>
<text x="210.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">різні домени</text>
<line x1="356.0" y1="120.0" x2="549.0" y2="302.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="356.0" y1="205.0" x2="549.0" y2="315.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="356.0" y1="290.0" x2="549.0" y2="328.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="356.0" y1="375.0" x2="549.0" y2="341.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="356.0" y1="460.0" x2="549.0" y2="354.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="356.0" y1="545.0" x2="549.0" y2="367.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="555.0" y="310.1" width="270.0" height="49.9" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="2.0"/><text x="690.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">МЕЖА ЗАПИТУ</tspan><tspan x="690.0" dy="16.9">записати намір → 202 «прийнято»</tspan></text>
<text x="690.0" y="381.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">межу робота перетинає щоразу</text>
<line x1="831.0" y1="335.0" x2="934.0" y2="335.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="940.0" y="301.6" width="280.0" height="66.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="1080.0" y="322.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1080.0" dy="0.0">ВОРКЕР</tspan><tspan x="1080.0" dy="16.9">виконує роботу поза запитом</tspan><tspan x="1080.0" dy="16.9">час не тисне · переживе запит</tspan></text>
<text x="630.0" y="664.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Функції з різних доменів, а рух ідентичний — тому це один клас рішень, а не шість окремих трюків.</text>
