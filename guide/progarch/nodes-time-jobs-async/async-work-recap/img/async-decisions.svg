<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість осей рішення, щойно впізнав форму</text>
<rect x="70.0" y="130.1" width="520.0" height="49.9" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.9"/><text x="330.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">1 · ТРИГЕР</tspan><tspan x="330.0" dy="16.9">зараз / за розкладом (cron) / на подію</tspan></text>
<rect x="650.0" y="130.1" width="520.0" height="49.9" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.9"/><text x="910.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">2 · ДЕ ЖИВЕ ЧЕРГА</tspan><tspan x="910.0" dy="16.9">таблиця в БД / Redis / брокер</tspan></text>
<rect x="70.0" y="320.1" width="520.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="330.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">3 · РЕЗУЛЬТАТ НАЗАД</tspan><tspan x="330.0" dy="16.9">поллінг / колбек / вебхук</tspan></text>
<rect x="650.0" y="320.1" width="520.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="910.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">4 · ГАРАНТІЯ + КЛЮЧ</tspan><tspan x="910.0" dy="16.9">at-least-once → дедуп за ключем ідемпотентності</tspan></text>
<rect x="70.0" y="510.1" width="520.0" height="49.9" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.9"/><text x="330.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">5 · ВІДМОВА</tspan><tspan x="330.0" dy="16.9">повтор+відступ → мертва черга; багатоетапне → сага</tspan></text>
<rect x="650.0" y="510.1" width="520.0" height="49.9" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.9"/><text x="910.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">6 · ЧАС</tspan><tspan x="910.0" dy="16.9">монотонний (тривалість) / настінний (розклад); як зберегти</tspan></text>
<text x="630.0" y="648.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Не шість нових винаходів на кожну функцію — шість відповідей на той самий бланк.</text>
</svg>