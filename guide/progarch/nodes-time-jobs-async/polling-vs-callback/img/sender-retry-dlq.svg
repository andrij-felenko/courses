<text x="610.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вікно wᵢ = min(cap, base·2ᶦ) росте вдвічі; пауза = random(0, wᵢ) — повний джитер.</text>
<text x="610.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">4xx (крім 429) обриває повтори одразу — повторення його не полагодить; id той самий на КОЖЕН POST, тож дубль приймач дедупне.</text>
<text x="610.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Повний джитер (AWS, Marc Brooker): пауза рівномірна в усьому вікні — відправники не б'ють синхронно.</text>
