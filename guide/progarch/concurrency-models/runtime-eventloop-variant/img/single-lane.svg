<rect x="60.0" y="286.0" width="410.0" height="60.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Норма: попрацював коротко → await → звільнив смугу.</tspan></text>
<rect x="500.0" y="286.0" width="400.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Ціна: один виклик не віддає смугу — і всі сусіди мерзнуть.</tspan></text>
