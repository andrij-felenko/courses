<text x="450.0" y="644.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">комірки виділено наперед і перевикористано — нуль виділень, нуль пауз збирача сміття</text>
