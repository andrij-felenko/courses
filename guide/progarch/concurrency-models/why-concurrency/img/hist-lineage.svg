<rect x="414.0" y="108.0" width="262.0" height="104.0" rx="8" fill="#e3f7ec" stroke="#0e7d4b" stroke-width="1.8"/><text x="545.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0e7d4b" text-anchor="middle" font-weight="700">Гоар</text><text x="545.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">CSP: процеси, що спілкуються</text><text x="545.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">алгебра структури — як</tspan><tspan x="545.0" dy="14.4">незалежні процеси</tspan><tspan x="545.0" dy="14.4">складаються й шлють вісті</tspan></text><line x1="545.0" y1="212.0" x2="545.0" y2="241.0" stroke="#0e7d4b" stroke-width="1.2" stroke-dasharray="3,4"/><circle cx="545.0" cy="250.0" r="8.0" fill="#0e7d4b" stroke="#0e7d4b" stroke-width="2.0"/><text x="545.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0e7d4b" text-anchor="middle" font-weight="700">1978</text>
