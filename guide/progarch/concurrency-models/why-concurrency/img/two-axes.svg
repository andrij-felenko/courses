<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конкурентність і паралелізм — дві незалежні осі</text>
<text x="470.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">→ горизонталь — ПАРАЛЕЛІЗМ (виконання): зліва «ні, одне ядро», справа «так, багато ядер»</text>
<text x="470.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">↓ вертикаль — КОНКУРЕНТНІСТЬ (структура): згори «так, незалежні задачі», знизу «ні, одна задача»</text>
<rect x="95.0" y="108.0" width="360.0" height="200.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="275.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Конкурентно, НЕ паралельно</text><text x="275.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(незалежні задачі · одне ядро)</text><text x="275.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Багато задач перемежаються на</tspan><tspan x="275.0" dy="16.0">одному ядрі — заповнюють</tspan><tspan x="275.0" dy="16.0">чекання одне одного.</tspan><tspan x="275.0" dy="16.0"></tspan><tspan x="275.0" dy="16.0">Цикл подій тримає тисячі</tspan><tspan x="275.0" dy="16.0">з'єднань на 1 ядрі.</tspan></text>
<rect x="475.0" y="108.0" width="360.0" height="200.0" rx="6" fill="#e3f7ec" stroke="#0e7d4b" stroke-width="1.8"/><text x="655.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0e7d4b" text-anchor="middle" font-weight="700">Конкурентно І паралельно</text><text x="655.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(незалежні задачі · багато ядер)</text><text x="655.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Та сама структура лягає на</tspan><tspan x="655.0" dy="16.0">кілька ядер — задачі біжать</tspan><tspan x="655.0" dy="16.0">водночас.</tspan><tspan x="655.0" dy="16.0"></tspan><tspan x="655.0" dy="16.0">І структура, і швидкість —</tspan><tspan x="655.0" dy="16.0">разом.</tspan></text>
<rect x="95.0" y="328.0" width="360.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="275.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Послідовно</text><text x="275.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(одна задача · одне ядро)</text><text x="275.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Одна річ за раз.</tspan><tspan x="275.0" dy="16.0"></tspan><tspan x="275.0" dy="16.0">Простий скрипт, що рахує</tspan><tspan x="275.0" dy="16.0">крок за кроком, без жодної</tspan><tspan x="275.0" dy="16.0">паралельності й без</tspan><tspan x="275.0" dy="16.0">перемежання.</tspan></text>
<rect x="475.0" y="328.0" width="360.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="655.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Паралельно, але НЕ конкурентно</text><text x="655.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(одна задача · багато ядер)</text><text x="655.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Одну задачу ріжуть на</tspan><tspan x="655.0" dy="16.0">однакові шматки по ядрах.</tspan><tspan x="655.0" dy="16.0"></tspan><tspan x="655.0" dy="16.0">Паралельна сума одного</tspan><tspan x="655.0" dy="16.0">величезного масиву чисел.</tspan></text>
</svg>