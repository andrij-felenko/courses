<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що лікує вузьке місце: конкурентність чи паралелізм</text>
<line x1="490.0" y1="52.0" x2="490.0" y2="432.0" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="4,6"/>
<text x="250.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">I/O-BOUND — вузьке місце: ЧЕКАННЯ</text>
<text x="730.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">CPU-BOUND — вузьке місце: ЛІЧБА</text>
<text x="70.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час однієї задачі:</text>
<rect x="70.0" y="100.0" width="60.0" height="40.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">лічба</text>
<rect x="130.0" y="100.0" width="300.0" height="40.0" rx="4" fill="#eef1f6" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="280.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чекання (мережа / диск / інша служба)</text>
<text x="550.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час однієї задачі:</text>
<rect x="550.0" y="100.0" width="360.0" height="40.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="730.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">суцільна лічба — ядро не простоює</text>
<rect x="70.0" y="174.0" width="360.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Конкурентність — навіть на 1 ядрі:</tspan><tspan x="250.0" dy="16.9">заповни чекання чужою роботою</tspan></text>
<rect x="70.0" y="244.0" width="360.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Більше ядер — майже дарма:</tspan><tspan x="250.0" dy="15.6">вони чекали б так само, лише разом</tspan></text>
<rect x="550.0" y="174.0" width="360.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="730.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Паралелізм — реальні ядра</tspan><tspan x="730.0" dy="16.9">рахують водночас</tspan></text>
<rect x="550.0" y="244.0" width="360.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Конкурентність сама — 0 виграшу:</tspan><tspan x="730.0" dy="15.6">одне ядро лиш ділиться між лічбою</tspan></text>
<rect x="70.0" y="344.0" width="360.0" height="70.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Digital Homes тут:</tspan><tspan x="250.0" dy="15.6">опитування 30 пристроїв, віддача</tspan><tspan x="250.0" dy="15.6">дашборда, дзвінки в хмару</tspan></text>
<rect x="550.0" y="344.0" width="360.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Digital Homes тут:</tspan><tspan x="730.0" dy="15.6">правила по річній історії,</tspan><tspan x="730.0" dy="15.6">аналітика й стиснення логів</tspan></text>
</svg>