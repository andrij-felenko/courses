<rect x="95.0" y="384.0" width="795.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="492.5" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="492.5" dy="0.0">Поки з'єднання спить, ядро вільне — потік не з'їдає такти; зате стек висить у RAM увесь час.</tspan><tspan x="492.5" dy="16.9">Сам потік ще й прив'язаний до з'єднання. Тому море сплячих з'єднань марнує пам'ять, а не такти.</tspan></text>
