<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 648" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="648" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен інструмент — під свою форму координації</text>
<text x="560.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Ліворуч — форма межі. Праворуч — інструмент, чия сила під цю форму.</text>
<rect x="40.0" y="82.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">спільний змінний стан у процесі,</tspan><tspan x="320.0" dy="16.9">суперечок мало</tspan></text>
<line x1="606.0" y1="115.0" x2="756.0" y2="115.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="82.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Замки ·</tspan><tspan x="920.0" dy="16.9">спільна пам'ять</tspan></text>
<rect x="40.0" y="170.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">гарячий шлях, один писар,</tspan><tspan x="320.0" dy="16.9">суперечка коштує дорого</tspan></text>
<line x1="606.0" y1="203.0" x2="756.0" y2="203.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="170.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Без замків</tspan><tspan x="920.0" dy="16.9">(Disruptor)</tspan></text>
<rect x="40.0" y="258.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">багато сутностей зі станом,</tspan><tspan x="320.0" dy="16.9">треба ізоляція збою</tspan></text>
<line x1="606.0" y1="291.0" x2="756.0" y2="291.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="258.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Актори ·</tspan><tspan x="920.0" dy="16.9">скриньки</tspan></text>
<rect x="40.0" y="346.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">стадії передають роботу,</tspan><tspan x="320.0" dy="16.9">нічого не ділять</tspan></text>
<line x1="606.0" y1="379.0" x2="756.0" y2="379.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="346.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Канали · CSP</tspan></text>
<rect x="40.0" y="434.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="463.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">тисячі очікувань вводу-виводу,</tspan><tspan x="320.0" dy="16.9">CPU на кожне — копійки</tspan></text>
<line x1="606.0" y1="467.0" x2="756.0" y2="467.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="434.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="463.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Цикл подій ·</tspan><tspan x="920.0" dy="16.9">async</tspan></text>
<rect x="40.0" y="522.0" width="560.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="551.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">CPU-робота, ділиться за ключем,</tspan><tspan x="320.0" dy="16.9">без крос-ядерної синхронізації</tspan></text>
<line x1="606.0" y1="555.0" x2="756.0" y2="555.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="760.0" y="522.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="551.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Пул /</tspan><tspan x="920.0" dy="16.9">потік-на-ядро</tspan></text>
<text x="560.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Вибирай не модель, а форму: прочитав форму межі — і вона сама назвала інструмент.</text>
</svg>