<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міграція — це розмін, а не сходинка вгору</text>
<line x1="265.0" y1="92.0" x2="815.0" y2="72.0" stroke="#1a1a1a" stroke-width="4.0"/>
<circle cx="265.0" cy="92.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="815.0" cy="72.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M540 82 L520 116 L560 116 z" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Розмін, а не апгрейд</text>
<line x1="265.0" y1="92.0" x2="265.0" y2="158.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="815.0" y1="72.0" x2="815.0" y2="158.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="40.0" y="160.0" width="450.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7a231a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Що ВІДДАЄШ — реляційне дає задарма</tspan></text>
<rect x="40.0" y="224.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#d98b83" stroke-width="1.8"/><text x="265.0" y="257.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Транзакції ACID — усе або нічого</tspan></text>
<rect x="40.0" y="294.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#d98b83" stroke-width="1.8"/><text x="265.0" y="327.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">З'єднання — дані без дублів</tspan></text>
<rect x="40.0" y="364.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#d98b83" stroke-width="1.8"/><text x="265.0" y="397.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Запити наздогад — спитати незаплановане</tspan></text>
<rect x="40.0" y="434.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#d98b83" stroke-width="1.8"/><text x="265.0" y="467.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Зрілі інструменти — бекапи, ORM, моніторинг</tspan></text>
<rect x="590.0" y="160.0" width="450.0" height="48.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1c6b3a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Що ВИГРАЄШ — лише для однієї задачі</tspan></text>
<rect x="590.0" y="224.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#8fce9f" stroke-width="1.4"/><text x="815.0" y="257.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Запис розкидається по вузлах</tspan></text>
<rect x="590.0" y="294.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#8fce9f" stroke-width="1.4"/><text x="815.0" y="327.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Модель лягає на форму доступу</tspan></text>
<rect x="590.0" y="364.0" width="450.0" height="58.0" rx="6" fill="#ffffff" stroke="#8fce9f" stroke-width="1.4"/><text x="815.0" y="397.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Дешеве зберігання й видалення за строком</tspan></text>
<text x="815.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вужча обіцянка</text>
<rect x="140.0" y="500.0" width="800.0" height="42.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="525.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">За замовчуванням ліва шалька важча — тому тягар доказу на тому, хто хоче піти</tspan></text>
</svg>