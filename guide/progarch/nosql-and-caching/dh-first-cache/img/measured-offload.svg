<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виміряно стендом · лог: 30 000 домів · полінг 5 с · вікно 600 с</text>
<text x="90.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">без кешу</text>
<text x="90.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">усі звернення — до бази</text>
<rect x="250.0" y="98.0" width="600.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="864.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">6 000 читань/с у базу</text>
<text x="1030.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">×1</text>
<text x="90.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">TTL 30 с</text>
<text x="90.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">влучність 83 %</text>
<rect x="250.0" y="176.0" width="100.0" height="30.0" rx="6" fill="#fdf0dd" stroke="#b06d0a" stroke-width="1.6"/>
<text x="364.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">1 000 читань/с у базу</text>
<text x="1030.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">×6</text>
<text x="90.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">TTL 5 хв</text>
<text x="90.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">влучність 98 %</text>
