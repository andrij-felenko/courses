<text x="1030.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">×60</text>
<rect x="90.0" y="336.0" width="980.0" height="80.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Довший TTL — менше промахів: 6 000/с → 1 000 (×6) при 30 с і → 100 (×60) при 5 хв. Кешуємо лише реєстр, тож щедрий строк безпечний — а живий стан весь час іде повз кеш і лишається свіжим. Числа не вгадані: їх дав прогін синтетичного логу.</tspan></text>
