<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм проведення сесії Pre-Mortem</text>
<rect x="20.0" y="60.0" width="180.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="110.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1565c0" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. ГІПОТЕЗА</tspan><tspan x="110.0" dy="11.7"></tspan><tspan x="110.0" dy="11.7">Формулювання One-Way Door рішення</tspan></text>
<rect x="220.0" y="60.0" width="180.0" height="140.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="310.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">2. КАТАСТРОФА</tspan><tspan x="310.0" dy="11.7"></tspan><tspan x="310.0" dy="11.7">«Уявімо, що минув 1 рік і система впала»</tspan></text>
<rect x="420.0" y="60.0" width="180.0" height="140.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="510.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e08a1e" text-anchor="middle"><tspan x="510.0" dy="0.0">3. СПИСОК ПРИЧИН</tspan><tspan x="510.0" dy="11.7"></tspan><tspan x="510.0" dy="11.7">Мовчазне виписування прихованих ризиків</tspan></text>
<rect x="620.0" y="60.0" width="180.0" height="140.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="710.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7b1fa2" text-anchor="middle"><tspan x="710.0" dy="0.0">4. РАНЖУВАННЯ</tspan><tspan x="710.0" dy="11.7"></tspan><tspan x="710.0" dy="11.7">Матриця ймовірності та важкості відмови</tspan></text>
<rect x="820.0" y="60.0" width="180.0" height="140.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="910.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">5. ЗМІНА ДИЗАЙНУ</tspan><tspan x="910.0" dy="11.7"></tspan><tspan x="910.0" dy="11.7">Перетворення у Two-Way Door або захист</tspan></text>
<line x1="200.0" y1="130.0" x2="220.0" y2="130.0" stroke="#1c2b36" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="130.0" x2="420.0" y2="130.0" stroke="#1c2b36" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="130.0" x2="620.0" y2="130.0" stroke="#1c2b36" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="800.0" y1="130.0" x2="820.0" y2="130.0" stroke="#1c2b36" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="240.0" width="980.0" height="80.0" rx="6" fill="#eef2f6" stroke="#1c2b36" stroke-width="1.5"/><text x="510.0" y="283.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c2b36" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Результат сесії: Виявлення прихованих загрожень до інвестування ресурсів та заміна засліплення авторитетом на факт-базований аналіз</tspan></text>
