<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять правил компасу щоденних рішень архітектора</text>
<rect x="370.0" y="170.0" width="280.0" height="100.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="510.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">КОМПАС РІШЕНЬ</tspan><tspan x="510.0" dy="16.9"></tspan><tspan x="510.0" dy="16.9">Швидка триада дій архітектора</tspan><tspan x="510.0" dy="16.9">у ситуації невизначеності</tspan></text>
<rect x="40.0" y="40.0" width="280.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="180.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="180.0" dy="0.0">1. ЗВОРОТНІСТЬ (Reversibility)</tspan><tspan x="180.0" dy="14.3"></tspan><tspan x="180.0" dy="14.3">Односторонні двері? → Уповільнись.</tspan><tspan x="180.0" dy="14.3">Двосторонні? → Делегуй негайно.</tspan></text>
<line x1="320.0" y1="90.0" x2="410.0" y2="170.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="40.0" width="280.0" height="100.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="840.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="840.0" dy="0.0">2. YAGNI (Default to NO)</tspan><tspan x="840.0" dy="14.3"></tspan><tspan x="840.0" dy="14.3">Чи потрібна ця складність зараз?</tspan><tspan x="840.0" dy="14.3">Ні → Не будуй, збережи простір.</tspan></text>
<line x1="700.0" y1="90.0" x2="610.0" y2="170.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="300.0" width="280.0" height="100.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="180.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle"><tspan x="180.0" dy="0.0">3. НУДНА ТЕХНОЛОГІЯ</tspan><tspan x="180.0" dy="14.3"></tspan><tspan x="180.0" dy="14.3">Є вільний інноваційний жетон?</tspan><tspan x="180.0" dy="14.3">Ні → Бери PostgreSQL / C++ / Go.</tspan></text>
<line x1="320.0" y1="350.0" x2="410.0" y2="270.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="300.0" width="280.0" height="100.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="840.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="840.0" dy="0.0">4. PRE-MORTEM AUDIT</tspan><tspan x="840.0" dy="14.3"></tspan><tspan x="840.0" dy="14.3">ЩО зламає цю систему через рік?</tspan><tspan x="840.0" dy="14.3">Проведи 30-хв сесію до коду.</tspan></text>
<line x1="700.0" y1="350.0" x2="610.0" y2="270.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="20.0" width="280.0" height="75.0" rx="6" fill="#eef2f6" stroke="#1c2b36" stroke-width="1.5"/><text x="510.0" y="47.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c2b36" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">5. MEASURE FIRST</tspan><tspan x="510.0" dy="14.3"></tspan><tspan x="510.0" dy="14.3">Є виміряні метрики? Ні → Не оптимізуй.</tspan></text>
<line x1="510.0" y1="95.0" x2="510.0" y2="170.0" stroke="#1c2b36" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>