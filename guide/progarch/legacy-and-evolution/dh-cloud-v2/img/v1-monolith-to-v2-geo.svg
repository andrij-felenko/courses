<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури v1 Моноліт та v2 Гео-розподілена хмара Digital Homes</text>
<rect x="20.0" y="20.0" width="480.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40.0" y="35.0" width="440.0" height="30.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="260.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">v1: Монолітна спадщина (Single DC Frankfurt)</tspan></text>
<rect x="50.0" y="85.0" width="440.0" height="60.0" rx="6" fill="#eef2f6" stroke="#1e293b" stroke-width="1.5"/><text x="270.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="270.0" dy="0.0">Клієнти (1.2M хабів / 4.5M застосунків)</tspan><tspan x="270.0" dy="14.3">MQTT / REST безпосередньо в DC</tspan></text>
<line x1="270.0" y1="145.0" x2="270.0" y2="175.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="175.0" width="440.0" height="70.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="270.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="270.0" dy="0.0">Платформений моноліт v1</tspan><tspan x="270.0" dy="14.3">(Twin B + Auth + Automation + Notif)</tspan><tspan x="270.0" dy="14.3">Синхронний доступ до єдиної БД</tspan></text>
<line x1="270.0" y1="245.0" x2="270.0" y2="285.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="285.0" width="210.0" height="80.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="155.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle"><tspan x="155.0" dy="0.0">PostgreSQL Monolith</tspan><tspan x="155.0" dy="14.3">(P99 &gt; 850 мс)</tspan><tspan x="155.0" dy="14.3">Спільні таблиці стану</tspan></text>
<rect x="280.0" y="285.0" width="210.0" height="80.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="385.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle"><tspan x="385.0" dy="0.0">Shared Redis Cluster</tspan><tspan x="385.0" dy="14.3">(Каскадна інвалідація)</tspan><tspan x="385.0" dy="14.3">Thundering Herd ризик</tspan></text>
<rect x="50.0" y="395.0" width="440.0" height="85.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="270.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="270.0" dy="0.0">Проблеми v1:</tspan><tspan x="270.0" dy="14.3">• Single Point of Failure (один DC)</tspan><tspan x="270.0" dy="14.3">• Неможливість технічного вікна (SLO 99.99%)</tspan><tspan x="270.0" dy="14.3">• Висока затримка запису під вечірнім піком</tspan></text>
<rect x="540.0" y="20.0" width="480.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="560.0" y="35.0" width="440.0" height="30.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="780.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">v2: Гео-розподілена хмара (Strangler Pattern)</tspan></text>
<rect x="570.0" y="85.0" width="420.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="780.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="780.0" dy="0.0">Edge Fleet Routers (Multi-Region)</tspan><tspan x="780.0" dy="14.3">Близькі регіональні кінцеві точки</tspan></text>
<line x1="780.0" y1="140.0" x2="780.0" y2="165.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="165.0" width="420.0" height="55.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="780.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle"><tspan x="780.0" dy="0.0">Strangler API Gateway &amp; Feature Flags</tspan><tspan x="780.0" dy="14.3">Маршрутизація трафіку (v1 ↔ v2)</tspan></text>
<line x1="680.0" y1="220.0" x2="680.0" y2="255.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="880.0" y1="220.0" x2="880.0" y2="255.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="255.0" width="200.0" height="75.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="670.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="670.0" dy="0.0">Device Twin v2 (CQRS)</tspan><tspan x="670.0" dy="14.3">Kafka Outbox +</tspan><tspan x="670.0" dy="14.3">Sharded Event Store</tspan></text>
<rect x="790.0" y="255.0" width="200.0" height="75.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="890.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="890.0" dy="0.0">Доменні мікросервіси</tspan><tspan x="890.0" dy="14.3">(Notif / Analytics /</tspan><tspan x="890.0" dy="14.3">Automation Engine)</tspan></text>
<rect x="570.0" y="350.0" width="420.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="780.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="780.0" dy="0.0">CI/CD Fitness Guard &amp; ArchUnit</tspan><tspan x="780.0" dy="14.3">Автоматичний контроль ерозії шарів і схем</tspan></text>
<rect x="570.0" y="425.0" width="420.0" height="55.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="780.0" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="780.0" dy="0.0">Переваги v2: Zero-downtime, ізоляція збоїв,</tspan><tspan x="780.0" dy="14.3">гео-локальна латентність P99 &lt; 45 мс</tspan></text>
</svg>