<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вектори дослідницької археології чужої системи</text>
<rect x="380.0" y="200.0" width="240.0" height="100.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Мапа домену й безпечна сітка</tspan><tspan x="500.0" dy="15.6"></tspan><tspan x="500.0" dy="15.6">(C4 + Трейси + Hotspot Map)</tspan></text>
<rect x="50.0" y="40.0" width="260.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="180.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Згори (Top-Down)</tspan><tspan x="180.0" dy="15.6"></tspan><tspan x="180.0" dy="15.6">• Зовнішній трафік &amp; Ingress</tspan><tspan x="180.0" dy="15.6">• Точки входу API / MQTT / Webhook</tspan><tspan x="180.0" dy="15.6">• Реконструкція C4 (L1/L2)</tspan></text>
<line x1="310.0" y1="95.0" x2="420.0" y2="200.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="690.0" y="40.0" width="260.0" height="110.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="820.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle"><tspan x="820.0" dy="0.0">2. Знизу (Bottom-Up)</tspan><tspan x="820.0" dy="15.6"></tspan><tspan x="820.0" dy="15.6">• Телеметрія &amp; Trace-ідентифікатори</tspan><tspan x="820.0" dy="15.6">• Схеми БД &amp; обсяги таблиць</tspan><tspan x="820.0" dy="15.6">• Пошук швів (Seams) і херек-тестів</tspan></text>
<line x1="690.0" y1="95.0" x2="580.0" y2="200.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="340.0" width="260.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="500.0" y="372.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Збоку (Side-Channel)</tspan><tspan x="500.0" dy="13.0"></tspan><tspan x="500.0" dy="13.0">• Git Forensics (Churn × Complexity)</tspan><tspan x="500.0" dy="13.0">• Авторство комітів &amp; Закон Конвея</tspan><tspan x="500.0" dy="13.0">• Реконструкція ADR (чому так збудовано)</tspan></text>
<line x1="500.0" y1="340.0" x2="500.0" y2="300.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="250.0" height="80.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="175.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Результат: Керована еволюція</tspan><tspan x="175.0" dy="15.6"></tspan><tspan x="175.0" dy="15.6">(замість панічного rewrite)</tspan></text>
<line x1="380.0" y1="250.0" x2="300.0" y2="250.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>