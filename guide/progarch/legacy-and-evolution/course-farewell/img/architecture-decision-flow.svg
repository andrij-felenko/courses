<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік прийняття значущих інженерних рішень</text>
<rect x="30.0" y="50.0" width="210.0" height="130.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="135.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Оцінка ризиків</tspan><tspan x="135.0" dy="15.6"></tspan><tspan x="135.0" dy="15.6">• Pre-mortem аналіз</tspan><tspan x="135.0" dy="15.6">• Матриця ймовірності</tspan><tspan x="135.0" dy="15.6">• Потенційний вплив</tspan></text>
<rect x="280.0" y="50.0" width="210.0" height="130.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="385.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="385.0" dy="0.0">2. Класифікація дверей</tspan><tspan x="385.0" dy="15.6"></tspan><tspan x="385.0" dy="15.6">• One-way door (консенсус)</tspan><tspan x="385.0" dy="15.6">• Two-way door (делегування)</tspan><tspan x="385.0" dy="15.6">• Ціна зворотного відкату</tspan></text>
<rect x="530.0" y="50.0" width="210.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="635.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle"><tspan x="635.0" dy="0.0">3. Купівля інформації</tspan><tspan x="635.0" dy="15.6"></tspan><tspan x="635.0" dy="15.6">• Timeboxed Spike</tspan><tspan x="635.0" dy="15.6">• Walking Skeleton</tspan><tspan x="635.0" dy="15.6">• Зняття ключових плям</tspan></text>
<rect x="780.0" y="50.0" width="210.0" height="130.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="885.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">4. Фіксація у ADR</tspan><tspan x="885.0" dy="15.6"></tspan><tspan x="885.0" dy="15.6">• Контекст і альтернативи</tspan><tspan x="885.0" dy="15.6">• Вибране рішення</tspan><tspan x="885.0" dy="15.6">• Явні наслідки й борг</tspan></text>
