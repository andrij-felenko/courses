<line x1="740.0" y1="115.0" x2="780.0" y2="115.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="230.0" width="460.0" height="140.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="260.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle"><tspan x="260.0" dy="0.0">АВТОМАТИЗОВАНИЙ КОНТРОЛЬ (CI)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Архітектурні тести (ArchUnit / dependency-cruiser)</tspan><tspan x="260.0" dy="15.6">• Перевірка меж шарів коду та заборона зациклень</tspan><tspan x="260.0" dy="15.6">• Захист від невпинної архітектурної ерозії</tspan></text>
<rect x="530.0" y="230.0" width="460.0" height="140.0" rx="6" fill="#eef2f6" stroke="#263238" stroke-width="1.5"/><text x="760.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#263238" text-anchor="middle"><tspan x="760.0" dy="0.0">ОПЕРАЦІЙНА РЕТРОСПЕКТИВА</tspan><tspan x="760.0" dy="15.6"></tspan><tspan x="760.0" dy="15.6">• Перевірка припущень проти real-world метрик</tspan><tspan x="760.0" dy="15.6">• Регулярний огляд ризик-реєстру та SLO</tspan><tspan x="760.0" dy="15.6">• Вчасне проведення деприкейшину й рефакторингу</tspan></text>
