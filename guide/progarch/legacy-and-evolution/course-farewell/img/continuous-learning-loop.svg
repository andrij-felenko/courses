<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Петля неперервного навчання та інженерної чесності</text>
<rect x="50.0" y="40.0" width="420.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="260.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">1. Спостереження продакшину (Observability)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Телеметрія (метрики, логи, трейси)</tspan><tspan x="260.0" dy="15.6">• Вимірювання SLO та бюджету помилок</tspan><tspan x="260.0" dy="15.6">• Реальний профіль навантаження й затримок</tspan></text>
<rect x="550.0" y="40.0" width="420.0" height="130.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="760.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">2. Аналіз інцидентів та фактів (Honesty)</tspan><tspan x="760.0" dy="15.6"></tspan><tspan x="760.0" dy="15.6">• Беззаперечні факти замість припущень</tspan><tspan x="760.0" dy="15.6">• Blameless Post-Mortem ретроспектива</tspan><tspan x="760.0" dy="15.6">• Виявлення хибних початкових гіпотез</tspan></text>
<rect x="550.0" y="230.0" width="420.0" height="130.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="760.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">3. Адаптація та Рефакторинг (Evolution)</tspan><tspan x="760.0" dy="15.6"></tspan><tspan x="760.0" dy="15.6">• Виділення нових швів (Seams)</tspan><tspan x="760.0" dy="15.6">• Покроковий Strangler Fig або BBA</tspan><tspan x="760.0" dy="15.6">• Зменшення когнітивного навантаження</tspan></text>
<rect x="50.0" y="230.0" width="420.0" height="130.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="260.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">4. Оновлення драйверів і ADR (Feedback)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6">• Коригування якісних атрибутів</tspan><tspan x="260.0" dy="15.6">• Запис нових обмежень у журнал ADR</tspan><tspan x="260.0" dy="15.6">• Перегляд соціотехнічної топології</tspan></text>
<line x1="470.0" y1="105.0" x2="550.0" y2="105.0" stroke="#1565c0" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="760.0" y1="170.0" x2="760.0" y2="230.0" stroke="#e08a1e" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="295.0" x2="470.0" y2="295.0" stroke="#2e7d32" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="260.0" y1="230.0" x2="260.0" y2="170.0" stroke="#7b1fa2" stroke-width="3.0" marker-end="url(#arrow)"/>
</svg>