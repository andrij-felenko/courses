<rect x="145.6" y="298.4" width="238.9" height="63.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="265.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Wallet Balance &amp; Reserves</tspan><tspan x="265.0" dy="15.6">Strict Row Locking / Pessimistic</tspan><tspan x="265.0" dy="15.6">Zero Overdraft Invariant</tspan></text>
<rect x="142.1" y="406.2" width="245.7" height="47.6" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.4"/><text x="265.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Transactional Outbox Table</tspan><tspan x="265.0" dy="15.6">Атомарний запис події у тій же БД</tspan></text>
<rect x="612.1" y="186.2" width="245.7" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="735.0" y="206.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Event Bus (Kafka Cluster)</tspan><tspan x="735.0" dy="15.6">Partitioned Topic / At-Least-Once</tspan></text>
<rect x="622.4" y="298.4" width="225.2" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="735.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Catalog &amp; Search Read-Models</tspan><tspan x="735.0" dy="15.6">OpenSearch Index / Redis Cache</tspan><tspan x="735.0" dy="15.6">Eventual Lag &lt; 500ms</tspan></text>
