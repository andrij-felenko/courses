(Асинхронний мост)</text>
<text x="500.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фінансове ядро вимагає строгої ACID-консистентності; вітрина й аналітика працюють через асинхронні події</text>
