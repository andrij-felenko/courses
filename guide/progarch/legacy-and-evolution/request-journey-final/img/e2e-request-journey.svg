<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізний потік запиту Відчинити двері</text>
<text x="530.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Наскрізний потік команди «Відчинити замок» у платформі Digital Homes</text>
<text x="530.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">від дотику на екрані смартфона до повороту ригеля та push-сповіщення родині</text>
<rect x="61.6" y="100.6" width="156.8" height="78.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="140.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Мобільний клієнт</tspan><tspan x="140.0" dy="15.6">Мобільний застосунок</tspan><tspan x="140.0" dy="15.6">HTTPS / TLS 1.3</tspan><tspan x="140.0" dy="15.6">JWT token + Trace ID</tspan></text>
<rect x="298.2" y="100.6" width="163.6" height="78.8" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.6"/><text x="380.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2. Периметр та LB</tspan><tspan x="380.0" dy="15.6">GeoDNS · Anycast IP</tspan><tspan x="380.0" dy="15.6">Envoy TLS Termination</tspan><tspan x="380.0" dy="15.6">eBPF L4/L7 Balancing</tspan></text>
<rect x="534.8" y="100.6" width="170.5" height="78.8" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.6"/><text x="620.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">3. Шлюз та Auth</tspan><tspan x="620.0" dy="15.6">API Gateway</tspan><tspan x="620.0" dy="15.6">WAF · Token Bucket</tspan><tspan x="620.0" dy="15.6">OAuth2 JWT · OPA Authz</tspan></text>
<rect x="771.3" y="100.6" width="177.3" height="78.8" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.6"/><text x="860.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">4. Доменне ядро</tspan><tspan x="860.0" dy="15.6">SmartLockService</tspan><tspan x="860.0" dy="15.6">Aggregate DeviceTwin</tspan><tspan x="860.0" dy="15.6">desired.lock = UNLOCKED</tspan></text>
<rect x="785.0" y="320.6" width="150.0" height="78.8" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.6"/><text x="860.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">5. Outbox &amp; DB</tspan><tspan x="860.0" dy="15.6">PostgreSQL ACID TX</tspan><tspan x="860.0" dy="15.6">Device Twin update</tspan><tspan x="860.0" dy="15.6">Outbox Event insert</tspan></text>
<rect x="541.6" y="320.6" width="156.8" height="78.8" rx="6" fill="#fff8e7" stroke="#333333" stroke-width="1.6"/><text x="620.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">6. Шина та CDC</tspan><tspan x="620.0" dy="15.6">CDC / Debezium WAL</tspan><tspan x="620.0" dy="15.6">Kafka Event Bus</tspan><tspan x="620.0" dy="15.6">`home.commands.lock`</tspan></text>
<rect x="294.8" y="320.6" width="170.5" height="78.8" rx="6" fill="#fff8e7" stroke="#333333" stroke-width="1.6"/><text x="380.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">7. MQTT брокер</tspan><tspan x="380.0" dy="15.6">IoT MQTT Hub</tspan><tspan x="380.0" dy="15.6">mTLS Persistent Socket</tspan><tspan x="380.0" dy="15.6">QoS 1 Command Publish</tspan></text>
