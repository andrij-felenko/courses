<rect x="236.9" y="536.2" width="526.2" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="500.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">9. Зворотний потік &amp; Telemetry</tspan><tspan x="500.0" dy="15.6">Ingestion -&gt; Redis Twin Sync -&gt; OpenTelemetry Collector -&gt; FCM / APNs Push</tspan></text>
