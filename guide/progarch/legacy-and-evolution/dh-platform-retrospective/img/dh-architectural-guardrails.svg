<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система захисту від ерозії через фітнес-функції</text>
<rect x="40.0" y="50.0" width="200.0" height="110.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Git Push / PR</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">Зміна коду або контрактів</tspan></text>
<rect x="290.0" y="50.0" width="210.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="395.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1565c0" text-anchor="middle"><tspan x="395.0" dy="0.0">2. Статичні фітнес-функції</tspan><tspan x="395.0" dy="11.7"></tspan><tspan x="395.0" dy="11.7">Перевірка залежностей контекстів (tree-sitter)</tspan></text>
<rect x="550.0" y="50.0" width="210.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="655.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7b1fa2" text-anchor="middle"><tspan x="655.0" dy="0.0">3. Контрактні фітнес-функції</tspan><tspan x="655.0" dy="13.0"></tspan><tspan x="655.0" dy="13.0">Зворотна сумісність Proto/OpenAPI</tspan></text>
<rect x="800.0" y="50.0" width="180.0" height="110.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="890.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle"><tspan x="890.0" dy="0.0">4. Динамічний load-test</tspan><tspan x="890.0" dy="11.7"></tspan><tspan x="890.0" dy="11.7">Перевірка latencies p99 &lt; 100ms</tspan></text>
<line x1="240.0" y1="105.0" x2="290.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="105.0" x2="550.0" y2="105.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="760.0" y1="105.0" x2="800.0" y2="105.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="220.0" width="690.0" height="160.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="635.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle"><tspan x="635.0" dy="0.0">Результат роботи заслонів CI/CD:</tspan><tspan x="635.0" dy="15.6"></tspan><tspan x="635.0" dy="15.6">• Блокування незаконних зв'язків між сервісами (наприклад: Telemetry → Billing DB)</tspan><tspan x="635.0" dy="15.6">• Попередження про злам зворотної сумісності бінарного протоколу</tspan><tspan x="635.0" dy="15.6">• Автоматичний відкат деплою при виявленні витоку пам'яті чи перевищенні латентності</tspan><tspan x="635.0" dy="15.6"></tspan><tspan x="635.0" dy="15.6">Результат: Нуль архітектурної ерозії протягом 2 років після впровадження</tspan></text>
<line x1="890.0" y1="160.0" x2="890.0" y2="220.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>