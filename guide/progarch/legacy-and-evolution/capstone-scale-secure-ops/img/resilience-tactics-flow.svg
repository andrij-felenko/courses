<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжок тактик стійкості під навантаженням</text>
<rect x="40.0" y="40.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="140.0" y="63.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Вхідний потік трафіку</tspan><tspan x="140.0" dy="15.6">(Пікове навантаження</tspan><tspan x="140.0" dy="15.6">50,000 RPS)</tspan></text>
<line x1="240.0" y1="75.0" x2="290.0" y2="75.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="30.0" width="210.0" height="90.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="395.0" y="50.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Адаптивний лимитер</tspan><tspan x="395.0" dy="14.3">(Little's Law &amp; CoDel)</tspan><tspan x="395.0" dy="14.3"></tspan><tspan x="395.0" dy="14.3">Динамічний ліміт inflight</tspan><tspan x="395.0" dy="14.3">Затримка черги &lt; 20 мс</tspan></text>
<line x1="395.0" y1="120.0" x2="395.0" y2="160.0" stroke="#c62828" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="160.0" width="170.0" height="50.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="395.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="395.0" dy="0.0">429 Too Many Requests</tspan><tspan x="395.0" dy="14.3">(Shedding Tier 2)</tspan></text>
<line x1="500.0" y1="75.0" x2="550.0" y2="75.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="550.0" y="30.0" width="210.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="655.0" y="43.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Селектор пріоритетів</tspan><tspan x="655.0" dy="14.3">(Brownout Mode)</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">Tier 0: Замки / Платежі ✓</tspan><tspan x="655.0" dy="14.3">Tier 1: Статус UI ✓</tspan><tspan x="655.0" dy="14.3">Tier 2: Аналітика (Shed)</tspan></text>
<line x1="760.0" y1="75.0" x2="810.0" y2="75.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="810.0" y="30.0" width="150.0" height="90.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="885.0" y="59.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">Ізольований Bulkhead</tspan><tspan x="885.0" dy="13.0"></tspan><tspan x="885.0" dy="13.0">Воркери Tier 0</tspan><tspan x="885.0" dy="13.0">(Окремий пуп сокетів)</tspan></text>
<rect x="40.0" y="260.0" width="920.0" height="120.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="306.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Шар асинхронної обробки подій та захисту від отруйних пакетів (Poison Messages)</tspan></text>
<rect x="70.0" y="300.0" width="240.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="190.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="190.0" dy="0.0">Асинхронний Event Log</tspan><tspan x="190.0" dy="14.3">(Kafka / NATS JetStream)</tspan></text>
<line x1="310.0" y1="330.0" x2="360.0" y2="330.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="360.0" y="300.0" width="250.0" height="60.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="485.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle"><tspan x="485.0" dy="0.0">Ретрай з експоненційним</tspan><tspan x="485.0" dy="14.3">зсувом та джиттером (Jitter)</tspan></text>
<line x1="610.0" y1="330.0" x2="660.0" y2="330.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="300.0" width="260.0" height="60.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="790.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Dead Letter Queue (DLQ)</tspan><tspan x="790.0" dy="14.3">(Ізоляція збійних пакетів</tspan><tspan x="790.0" dy="14.3">після 3 спроб)</tspan></text>
</svg>