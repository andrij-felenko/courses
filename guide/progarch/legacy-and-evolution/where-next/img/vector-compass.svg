<rect x="40.0" y="330.0" width="270.0" height="110.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="175.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle"><tspan x="175.0" dy="0.0">4. Соціотехнічний DDD</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• Strategic DDD &amp; Event Storming</tspan><tspan x="175.0" dy="14.3">• Inverse Conway Maneuver</tspan><tspan x="175.0" dy="14.3">• Team Topologies &amp; Context Maps</tspan></text>
<line x1="310.0" y1="385.0" x2="370.0" y2="310.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="330.0" width="270.0" height="110.0" rx="6" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="845.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="845.0" dy="0.0">5. Домени-профілі &amp; Спеціалізація</tspan><tspan x="845.0" dy="14.3"></tspan><tspan x="845.0" dy="14.3">• Low-Latency Fintech / Game Engines</tspan><tspan x="845.0" dy="14.3">• ML/AI Platforms &amp; Big Data</tspan><tspan x="845.0" dy="14.3">• Embedded, RTOS &amp; Edge Systems</tspan></text>
