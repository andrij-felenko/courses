<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компас п'яти векторів інженерного росту</text>
<rect x="370.0" y="210.0" width="280.0" height="100.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="510.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">ФУНДАМЕНТ PROGARCH</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">• Інженерне судження &amp; Смак</tspan><tspan x="510.0" dy="15.6">• Межі, контракти, атрибути якості</tspan><tspan x="510.0" dy="15.6">• Керування еволюцією та боргом</tspan></text>
<rect x="370.0" y="30.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#1565c0" stroke-width="1.5"/><text x="510.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle"><tspan x="510.0" dy="0.0">1. Розподілені системи &amp; Консенсус</tspan><tspan x="510.0" dy="14.3"></tspan><tspan x="510.0" dy="14.3">• CAP/PACELC, Jepsen-тестування</tspan><tspan x="510.0" dy="14.3">• Raft, Paxos, CRDT, векторні годинники</tspan><tspan x="510.0" dy="14.3">• Асинхронність та часткові відмови</tspan></text>
<line x1="510.0" y1="140.0" x2="510.0" y2="210.0" stroke="#1565c0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="90.0" width="270.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#7b1fa2" stroke-width="1.5"/><text x="175.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle"><tspan x="175.0" dy="0.0">2. Формальна верифікація</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• TLA+, Alloy, Dafny</tspan><tspan x="175.0" dy="14.3">• Доведення інваріантів до коду</tspan><tspan x="175.0" dy="14.3">• Пошук race conditions &amp; deadlocks</tspan></text>
<line x1="310.0" y1="145.0" x2="370.0" y2="220.0" stroke="#7b1fa2" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="90.0" width="270.0" height="110.0" rx="6" fill="#e7f6ec" stroke="#2e7d32" stroke-width="1.5"/><text x="845.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="845.0" dy="0.0">3. FinOps &amp; Хмарна економіка</tspan><tspan x="845.0" dy="14.3"></tspan><tspan x="845.0" dy="14.3">• Unit Economics (Cost per User)</tspan><tspan x="845.0" dy="14.3">• Cost-Aware Architecture &amp; Tiering</tspan><tspan x="845.0" dy="14.3">• Spot-інстанси та Cross-AZ оверхед</tspan></text>
