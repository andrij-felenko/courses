<rect x="540.0" y="30.0" width="380.0" height="40.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">ЗБАЛАНСОВАНІ ПОТОКОВІ КОМАНДИ</tspan></text>
<rect x="540.0" y="80.0" width="380.0" height="70.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Команда 1: Core Smart Home &amp; Twin</tspan><tspan x="730.0" dy="15.6">• Межа: лише пристрої та дзеркало стану</tspan><tspan x="730.0" dy="15.6">• Оптимальний контекст під 5-7 осіб</tspan></text>
<rect x="540.0" y="160.0" width="380.0" height="65.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Команда 2: Automation Engine</tspan><tspan x="730.0" dy="15.6">• Межа: двигун обробки правил та сценаріїв</tspan><tspan x="730.0" dy="15.6">• Висока фокусність на латентності правил</tspan></text>
<rect x="540.0" y="235.0" width="380.0" height="55.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Команда 3: Video &amp; Media</tspan><tspan x="730.0" dy="15.6">• Межа: HLS, WebRTC, медіа-канали</tspan></text>
<rect x="40.0" y="310.0" width="880.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Правило: Розмір Bounded Context обмежений когнітивним навантаженням однієї потокової команди.</tspan><tspan x="480.0" dy="15.6">Перевищення навантаження — сигнал розбити контекст або виділити платформну службу.</tspan></text>
