<rect x="40.0" y="30.0" width="420.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ПЕРЕВАНТАЖЕНА КОМАНДА (Cognitive Overload)</tspan></text>
<rect x="40.0" y="80.0" width="420.0" height="210.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Команда «Супер-Ядро» (1 команда = 5 контекстів):</tspan><tspan x="250.0" dy="15.6"></tspan><tspan x="250.0" dy="15.6">• Device Control Model</tspan><tspan x="250.0" dy="15.6">• State Twin Reconciliation</tspan><tspan x="250.0" dy="15.6">• Automation Engine &amp; Rules</tspan><tspan x="250.0" dy="15.6">• Video Streaming &amp; HLS</tspan><tspan x="250.0" dy="15.6">• Billing &amp; Subscriptions</tspan><tspan x="250.0" dy="15.6"></tspan><tspan x="250.0" dy="15.6">Наслідок: поверхневі рев'ю, високий час перемикання,</tspan><tspan x="250.0" dy="15.6">вузькі місця у знаннях, сповільнення розгортань.</tspan></text>
