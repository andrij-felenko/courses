<text x="50.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Самообслуговування через CLI / API / Portal</text>
<text x="50.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Опціональність: дорога за замовчуванням зручна</text>
<text x="50.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Право на вихід у 'оффроуд' з власною відповідальністю</text>
<text x="50.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Висока швидкість релізів (хвилини замість днів)</text>
<text x="50.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Платформа як внутрішній продукт з володінням</text>
<rect x="415.0" y="70.0" width="350.0" height="290.0" rx="6" fill="#fffafb" stroke="#e11d48" stroke-width="1.5"/>
<text x="590.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">Обов'язковий шлагбаум (Tollgate)</text>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Бюрократичне узгодження через ручні тікети</text>
<text x="430.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Примусовість: заборона будь-яких власних рішень</text>
<text x="430.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Жорсткі некоректні абстракції без виходів</text>
<text x="430.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Затримка релізів та накопичення черг передачі</text>
<text x="430.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Платформа як адміністративний контроль</text>
