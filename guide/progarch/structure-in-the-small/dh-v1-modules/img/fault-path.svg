<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збій крізь шар: залізна поломка стає доменним «не вірю», а рішення — спокоєм</text>
<line x1="205.6" y1="120.0" x2="332.4" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="465.6" y1="120.0" x2="585.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="733.0" y1="120.0" x2="829.8" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">переклад</text>
<text x="526.3" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">доменне слово</text>
<text x="782.4" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рішення</text>
<line x1="890.0" y1="144.9" x2="890.0" y2="198.1" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.7" y="200.1" width="138.6" height="49.9" rx="6" fill="#e8f8ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">безпечний спокій</tspan><tspan x="890.0" dy="16.9">грілка off</tspan></text>
<rect x="80.0" y="285.0" width="860.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">v0: доменного «не вірю» не було — сліпа довіра, і мертвий давач тихо ламав рішення (R2)</tspan></text>
<rect x="74.4" y="95.0" width="131.1" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">залізо: таймаут</tspan><tspan x="140.0" dy="16.9">або CRC=NO</tspan></text>
<rect x="334.4" y="95.0" width="131.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">драйвер давача:</tspan><tspan x="400.0" dy="16.9">перекладає збій</tspan></text>
<rect x="587.0" y="95.0" width="146.0" height="49.9" rx="6" fill="#eef4ff" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Reading(ok=false)</tspan><tspan x="660.0" dy="16.9">«числу не вірю»</tspan></text>
<rect x="831.8" y="95.0" width="116.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">decide:</tspan><tspan x="890.0" dy="16.9">not ok → IDLE</tspan></text>
</svg>