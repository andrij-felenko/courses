<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка «обидва бачать новий ключ» і атомарний вибір власника</text>
<text x="110.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Наївно: «перевір, тоді дій» — гонка між інстансами</text>
<rect x="110.0" y="92.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="260.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">A: EXISTS(group)? → нема</tspan></text>
<rect x="110.0" y="146.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="260.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">B: EXISTS(group)? → нема</tspan></text>
<text x="258.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(обидва читають t₀ — ще порожньо)</text>
<line x1="414.0" y1="114.0" x2="470.0" y2="114.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="414.0" y1="168.0" x2="470.0" y2="168.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="474.0" y="92.0" width="360.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="654.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="654.0" dy="0.0">A: створює буфер + озброює таймер</tspan></text>
<rect x="474.0" y="146.0" width="360.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="654.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="654.0" dy="0.0">B: створює буфер + озброює таймер</tspan></text>
<line x1="838.0" y1="114.0" x2="894.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="838.0" y1="168.0" x2="894.0" y2="152.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="898.0" y="108.0" width="300.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1048.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1048.0" dy="0.0">2 таймери → 2 дайджести</tspan><tspan x="1048.0" dy="16.9">на ту саму групу</tspan></text>
<line x1="90.0" y1="250.0" x2="1130.0" y2="250.0" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="6,5"/>
<text x="110.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Атомарно: RPUSH повертає нову довжину — власник обирається сам</text>
<rect x="110.0" y="318.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="260.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">A: RPUSH group → 1</tspan></text>
<rect x="110.0" y="372.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="260.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">B: RPUSH group → 2</tspan></text>
<line x1="414.0" y1="340.0" x2="470.0" y2="340.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="414.0" y1="394.0" x2="470.0" y2="394.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="474.0" y="318.0" width="360.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="654.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="654.0" dy="0.0">A: «1» → ВЛАСНИК, озброює таймер</tspan></text>
<rect x="474.0" y="372.0" width="360.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="654.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="654.0" dy="0.0">B: «2» → лише додав у буфер</tspan></text>
<line x1="838.0" y1="340.0" x2="894.0" y2="356.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="838.0" y1="394.0" x2="894.0" y2="378.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="898.0" y="344.0" width="300.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="1048.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1048.0" dy="0.0">1 таймер → 1 дайджест</tspan></text>
<rect x="120.0" y="452.0" width="980.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="610.0" y="487.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Вибір власника таймера має бути АТОМАРНИМ у спільному сховищі — інакше N інстансів дадуть N дайджестів на ту саму групу.</tspan></text>
</svg>