<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан фільтрів живе у спільному сховищі, не в пам'яті інстанса</text>
<rect x="90.0" y="66.0" width="470.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="325.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Інстанс A (Gate)</tspan><tspan x="325.0" dy="16.9">у пам'яті процесу — ЛИШЕ таймер</tspan><tspan x="325.0" dy="16.9">озброєної групи (time.AfterFunc);</tspan><tspan x="325.0" dy="16.9">усе інше — у спільному сховищі</tspan></text>
<rect x="680.0" y="66.0" width="470.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="915.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">Інстанс B (Gate)</tspan><tspan x="915.0" dy="16.9">той самий код, той самий стан;</tspan><tspan x="915.0" dy="16.9">читає й пише ТЕ САМЕ сховище —</tspan><tspan x="915.0" dy="16.9">бо фільтрує СПІЛЬНИЙ потік</tspan></text>
<line x1="325.0" y1="166.0" x2="400.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="915.0" y1="166.0" x2="840.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">читають і пишуть спільний стан</text>
<rect x="90.0" y="250.0" width="1060.0" height="320.0" rx="10" fill="#f9fafb" stroke="#2457d6" stroke-width="2.0"/>
<text x="620.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Спільне сховище (Redis) — єдине джерело правди для стану фільтрів</text>
<rect x="112.0" y="302.0" width="1016.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="620.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Дедуп — SET dk NX EX ttl · dk = hash(отримувач + подія + канал) · nil ⇒ дубль, тихо кинути</tspan></text>
<rect x="112.0" y="368.0" width="1016.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="620.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Буфер злиття — RPUSH group item (TTL ≈ 2·W) · відповідь «1» ⇒ ти власник → лише ти озброюєш таймер</tspan></text>
<rect x="112.0" y="434.0" width="1016.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="620.0" y="466.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Відро жетонів — tb:user:channel = {tokens, last} · дозрів рахуємо через TIME сховища (спільний годинник)</tspan></text>
<rect x="112.0" y="500.0" width="1016.0" height="56.0" rx="6" fill="#fff7e6" stroke="#b7791f" stroke-width="1.6"/><text x="620.0" y="532.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Тихі години — часовий пояс КОРИСТУВАЧА (настінний місцевий), не UTC сервера</tspan></text>
<rect x="120.0" y="600.0" width="1000.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="620.0" y="634.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Тримати цей стан у пам'яті процесу — кожен інстанс фільтрує НАОСЛІП лише свій шматок трафіку: бурі й дублі просочуються між інстансами.</tspan></text>
</svg>