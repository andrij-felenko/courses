<rect x="60.0" y="440.0" width="940.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="530.0" y="466.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Сплеск до b поспіль дозволено; надовго темп не більший за r. Leaky bucket — рідший брат: випускає рівно по краплі, згладжуючи навіть сплеск.</tspan></text>
