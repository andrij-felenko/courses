<line x1="602.0" y1="250.0" x2="700.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="704.0" y="226.0" width="300.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="854.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="854.0" dy="0.0">є жетон → пропустити</tspan><tspan x="854.0" dy="16.9">(списати 1)</tspan></text>
