<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія вихідного вузла: шість шарів захисту та стійкості</text>
<rect x="32.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="120.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1. Outbox БД</tspan><tspan x="120.0" dy="15.6">Атомарний запис</tspan><tspan x="120.0" dy="15.6">наміру з подією</tspan></text>
<line x1="211.5" y1="320.0" x2="238.5" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="242.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.5"/><text x="330.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">2. Диспетчер</tspan><tspan x="330.0" dy="15.6">Генерування id &amp;</tspan><tspan x="330.0" dy="15.6">dedup-ключів</tspan></text>
<line x1="421.5" y1="320.0" x2="448.5" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="452.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">3. Політики</tspan><tspan x="540.0" dy="15.6">Преференси, підписка,</tspan><tspan x="540.0" dy="15.6">тихі години</tspan></text>
<line x1="631.5" y1="320.0" x2="658.5" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="662.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.5"/><text x="750.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">4. Throttler</tspan><tspan x="750.0" dy="15.6">Token bucket, темп</tspan><tspan x="750.0" dy="15.6">та бюджети</tspan></text>
<line x1="841.5" y1="320.0" x2="868.5" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="872.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="960.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">5. Транспорт</tspan><tspan x="960.0" dy="15.6">Circuit Breaker,</tspan><tspan x="960.0" dy="15.6">retry з jitter</tspan></text>
<line x1="1051.5" y1="320.0" x2="1078.5" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1082.5" y="265.0" width="175.0" height="110.0" rx="6" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.5"/><text x="1170.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">6. DLQ &amp; Лог</tspan><tspan x="1170.0" dy="15.6">Мертва черга,</tspan><tspan x="1170.0" dy="15.6">алерт і аудит</tspan></text>
<text x="120.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Усуває dual-write
проблему</text>
<text x="330.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Гарантує ідемпотентність
отримувача</text>
<text x="540.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перевіряє право й
бажання чути</text>
<text x="750.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Захищає від шторму
й перевитрат</text>
<text x="960.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ізолює падіння
зовнішнього API</text>
<text x="1170.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зберігає отруйні
повідомлення</text>
<text x="660.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Жодна вихідна доставка не торкається мережі напросту: потік іде крізь усі 6 шарів по черзі.</text>
</svg>