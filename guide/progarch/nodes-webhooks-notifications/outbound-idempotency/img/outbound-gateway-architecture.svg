<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура вихідного шлюзу</text>
<text x="520.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура вихідного шлюзу: від локальної БД до зовнішнього API</text>
<line x1="300.0" y1="175.0" x2="360.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="670.0" y1="175.0" x2="740.0" y2="175.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="40.0" y="120.0" width="260.0" height="110.0" rx="6" fill="#dfe9fb" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Доменний сервіс (DH)</tspan><tspan x="170.0" dy="15.6">1. Відкрити DB Tx</tspan><tspan x="170.0" dy="15.6">2. Зберегти замовлення</tspan><tspan x="170.0" dy="15.6">3. Створити Outbox-подію</tspan><tspan x="170.0" dy="15.6">+ deterministic idempotency_key</tspan></text>
<rect x="360.0" y="120.0" width="310.0" height="110.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="515.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Outbound Gateway Worker</tspan><tspan x="515.0" dy="15.6">1. Прочитати Outbox</tspan><tspan x="515.0" dy="15.6">2. HTTP POST з Idempotency-Key</tspan><tspan x="515.0" dy="15.6">3. Обробка таймаутів / 5xx</tspan><tspan x="515.0" dy="15.6">4. Авто-повтор (Exponential Backoff)</tspan></text>
<rect x="740.0" y="120.0" width="250.0" height="110.0" rx="6" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Зовнішнє API (Stripe/Push)</tspan><tspan x="865.0" dy="15.6">1. Перевірка Idempotency-Key</tspan><tspan x="865.0" dy="15.6">2. Виконання або Replay</tspan><tspan x="865.0" dy="15.6">3. Повернення 200 OK</tspan></text>
<rect x="80.0" y="310.0" width="400.0" height="75.0" rx="6" fill="#f0f0f2" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Локальна межа консистентності:</tspan><tspan x="280.0" dy="15.6">Запис стану і дедуп-ключа атомарний з БД</tspan></text>
<rect x="560.0" y="310.0" width="400.0" height="75.0" rx="6" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Мережева межа стійкості:</tspan><tspan x="760.0" dy="15.6">Безпечний ретрай при збоях мережі без дублів</tspan></text>
</svg>