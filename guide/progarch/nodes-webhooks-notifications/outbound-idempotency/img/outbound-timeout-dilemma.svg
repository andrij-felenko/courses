<rect x="760.0" y="100.0" width="220.0" height="70.0" rx="6" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">Провайдер (Stripe)</tspan><tspan x="870.0" dy="18.2">Обробка платежу</tspan></text>
