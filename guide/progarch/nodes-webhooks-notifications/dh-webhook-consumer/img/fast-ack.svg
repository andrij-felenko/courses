<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підтверди швидко: інлайн-шторм проти тонкого приймача</text>
<line x1="780.0" y1="96.0" x2="780.0" y2="452.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6,6"/>
<text x="780.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">провайдер чекає ≤ 5 с, тоді вважає невдачею й повторює</text>
<text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ОБРОБКА</text>
<text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ІНЛАЙН</text>
<line x1="300.0" y1="118.0" x2="300.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">POST</text>
<rect x="300.0" y="158.0" width="768.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="314.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">база + твін + пуш — 8 с</text>
<line x1="780.0" y1="196.0" x2="818.4" y2="224.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="818.4" y="230.0" width="289.6" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="830.4" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">повтор → та сама робота ВДРУГЕ</text>
<rect x="995.0" y="153.6" width="250.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="1120.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1120.0" dy="0.0">подвійна робота,</tspan><tspan x="1120.0" dy="16.2">шторм повторів</tspan></text>
<line x1="90.0" y1="300.0" x2="1190.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,6"/>
<text x="140.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ТОНКИЙ</text>
<text x="140.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ПРИЙМАЧ</text>
<line x1="300.0" y1="340.0" x2="300.0" y2="372.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">POST</text>
<rect x="300.0" y="380.0" width="26.0" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="340.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">перевір + у чергу ≈ 50 мс</text>
<text x="340.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">→ ACK 200 задовго до порога</text>
<rect x="588.0" y="432.0" width="288.0" height="26.0" rx="6" fill="#e6eefb" stroke="#2457d6" stroke-width="1.5"/>
<text x="600.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">обробка — у черзі, свій темп</text>
<text x="640.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Поки робота сидить усередині відповіді, повільна база штовхає провайдера на повтор, а повтор — на нову важку роботу. Швидкий ACK ріже це коло.</text>
</svg>