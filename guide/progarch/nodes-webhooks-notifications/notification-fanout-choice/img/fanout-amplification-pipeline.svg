<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="525.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибух розмноження подій (Fan-out amplification) при масовій розсилці</text>
<rect x="40.0" y="160.0" width="210.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="145.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">ДЖЕРЕЛО ПОДІЇ</tspan><tspan x="145.0" dy="16.9"></tspan><tspan x="145.0" dy="16.9">1 оголошення ОСББ:</tspan><tspan x="145.0" dy="16.9">«Аварія водопроводу»</tspan><tspan x="145.0" dy="16.9">(1 сира подія)</tspan></text>
<line x1="252.0" y1="220.0" x2="310.0" y2="220.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="315.0" y="120.0" width="260.0" height="200.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="445.0" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">FAN-OUT ROUTER</tspan><tspan x="445.0" dy="16.9"></tspan><tspan x="445.0" dy="16.9">Обчислення аудиторії:</tspan><tspan x="445.0" dy="16.9">12 000 квартир</tspan><tspan x="445.0" dy="16.9">× 2.5 мешканця</tspan><tspan x="445.0" dy="16.9">= 30 000 підписників!</tspan><tspan x="445.0" dy="16.9">Множник: 30 000×</tspan></text>
<line x1="577.0" y1="220.0" x2="635.0" y2="220.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="606.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">30 000 задач</text>
<rect x="640.0" y="100.0" width="360.0" height="240.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="820.0" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">ВАСЛІДОК НАЇВНОГО ON-WRITE:</tspan><tspan x="820.0" dy="16.9"></tspan><tspan x="820.0" dy="16.9">• 30 000 записів у таблицю inboxes</tspan><tspan x="820.0" dy="16.9">• 30 000 HTTP-запитів до APNs / FCM</tspan><tspan x="820.0" dy="16.9">• Черга задач розпухає до гігабайтів</tspan><tspan x="820.0" dy="16.9">• CPU 100%, Redis OOM-killer</tspan><tspan x="820.0" dy="16.9">• Затримка критичних сигналів дому!</tspan></text>
<rect x="60.0" y="380.0" width="930.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="525.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Захист від вибуху: розбиття на пакетні батчі (chunking), throttling та перехід на On-Read для мас</tspan></text>
