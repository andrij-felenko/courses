<rect x="346.0" y="302.0" width="288.0" height="56.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.4"/><text x="490.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">чутлива точка:</tspan><tspan x="490.0" dy="14.3">що перемикає вибір</tspan></text>
<rect x="652.0" y="302.0" width="288.0" height="56.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.4"/><text x="796.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="796.0" dy="0.0">зворотність:</tspan><tspan x="796.0" dy="14.3">чи є дешевий хід назад</tspan></text>
<line x1="490.0" y1="360.0" x2="490.0" y2="382.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="313.3" y="389.2" width="353.4" height="53.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="490.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Вибір — не вердикт, а рамка критеріїв</tspan><tspan x="490.0" dy="15.6">де кожен варіант виграє  →  часто композиція</tspan></text>
