<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Здешеви зміну — і рішення покидає «архітектуру»</text>
<text x="450.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">еволюційні міграції схеми</tspan><tspan x="450.0" dy="16.9">(Прамод Садалаге):</tspan><tspan x="450.0" dy="16.9">зміна стає дешевою</tspan></text>
<line x1="248.6" y1="196.0" x2="651.4" y2="196.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="101.4" y="168.5" width="147.1" height="55.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="175.0" y="191.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">схема бази даних</tspan><tspan x="175.0" dy="17.6">важко змінити</tspan></text>
<rect x="651.4" y="168.5" width="147.1" height="55.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="725.0" y="191.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">схема бази даних</tspan><tspan x="725.0" dy="17.6">легко змінити</tspan></text>
<text x="175.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">⇒ архітектурне рішення</text>
<text x="725.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">⇒ вже не архітектурне</text>
<text x="450.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вартість зміни — не властивість теми: її можна знизити, і тема покидає архітектуру</text>
</svg>