<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що зелений тест латентності не бачить</text>
<rect x="70.0" y="118.0" width="64.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="102.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="102.0" dy="0.0">step()</tspan><tspan x="102.0" dy="13.0">≈0.02 мс</tspan></text>
<rect x="752.0" y="118.0" width="64.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="784.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="784.0" dy="0.0">step()</tspan><tspan x="784.0" dy="13.0">≈0.02 мс</tspan></text>
<rect x="138.0" y="126.0" width="610.0" height="48.0" rx="6" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="443.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">пауза 30 000 мс між читаннями — цього тест НЕ міряє</text>
<circle cx="300.0" cy="100.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="300.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">подія (клац вимикача)</text>
<line x1="300.0" y1="108.0" x2="300.0" y2="124.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="784.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">оброблено аж тут</text>
<line x1="784.0" y1="205.0" x2="784.0" y2="186.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зелений тест бачить лише крок рішення; 30 с очікування — його сліпа пляма.</text>
</svg>