<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві осі листка: важливість ловить мету, складність — де архітектура</text>
<rect x="155.0" y="90.0" width="285.0" height="170.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="297.5" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Вийде саме собою.</tspan><tspan x="297.5" dy="16.9">Структура дає це легко —</tspan><tspan x="297.5" dy="16.9">не гнути будову задля цього.</tspan></text>
<rect x="440.0" y="90.0" width="285.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="582.5" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="582.5" dy="0.0">(В, В) — ДРАЙВЕРИ</tspan><tspan x="582.5" dy="16.9">сюди йде вся увага:</tspan><tspan x="582.5" dy="16.9">тут вирішується доля системи</tspan></text>
<rect x="155.0" y="260.0" width="285.0" height="170.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="297.5" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="297.5" dy="0.0">Шум.</tspan><tspan x="297.5" dy="16.9">Не витрачати на це</tspan><tspan x="297.5" dy="16.9">дорогу ранню увагу.</tspan></text>
<rect x="440.0" y="260.0" width="285.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="582.5" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Важко, та не болить.</tspan><tspan x="582.5" dy="16.9">Можна програти —</tspan><tspan x="582.5" dy="16.9">переробка дешева.</tspan></text>
<line x1="138.0" y1="430.0" x2="138.0" y2="86.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="58.0" y="260.0" transform="rotate(-90 58.0 260.0)" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">важливість для успіху</text>
<text x="126.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">В</text>
<text x="126.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Н</text>
<line x1="151.0" y1="452.0" x2="725.0" y2="452.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">складність / ризик для структури</text>
<text x="161.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Н</text>
<text x="719.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">В</text>
</svg>