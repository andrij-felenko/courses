<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація якісного драйвера у бюджет помилок</text>
<rect x="40.0" y="50.0" width="210.0" height="40.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">1. Якісний драйвер</tspan></text>
<rect x="40.0" y="100.0" width="210.0" height="260.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="145.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Сценарій SEI:</tspan><tspan x="145.0" dy="13.0"></tspan><tspan x="145.0" dy="13.0">• Стимул: команда «відчинити»</tspan><tspan x="145.0" dy="13.0">• Джерело: мобільний застосунок</tspan><tspan x="145.0" dy="13.0">• Середовище: нормальне</tspan><tspan x="145.0" dy="13.0">• Відповідь: замок відчинено</tspan><tspan x="145.0" dy="13.0">• Міра: ≤ 500 мс у 99.9% спроб</tspan></text>
<line x1="260.0" y1="230.0" x2="290.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="50.0" width="210.0" height="40.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="405.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">2. Індикатор (SLI)</tspan></text>
<rect x="300.0" y="100.0" width="210.0" height="260.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="405.0" y="171.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Формула SLI:</tspan><tspan x="405.0" dy="15.6"></tspan><tspan x="405.0" dy="15.6">SLI = Good / Total</tspan><tspan x="405.0" dy="15.6"></tspan><tspan x="405.0" dy="15.6">• Good: HTTP 200 AND</tspan><tspan x="405.0" dy="15.6">  latency ≤ 500 ms</tspan><tspan x="405.0" dy="15.6">• Total: усі валідні</tspan><tspan x="405.0" dy="15.6">  виклики lock_service</tspan><tspan x="405.0" dy="15.6">• Точка виміру: API Gateway</tspan></text>
<line x1="520.0" y1="230.0" x2="550.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="50.0" width="210.0" height="40.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="665.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">3. Ціль (SLO)</tspan></text>
<rect x="560.0" y="100.0" width="210.0" height="260.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Угода SLO:</tspan><tspan x="665.0" dy="15.6"></tspan><tspan x="665.0" dy="15.6">• SLO = 99.9%</tspan><tspan x="665.0" dy="15.6">• Вікно: 30 днів (скользяче)</tspan><tspan x="665.0" dy="15.6">• Траєкторія: не менше</tspan><tspan x="665.0" dy="15.6">  99.9% вдало виконаних</tspan><tspan x="665.0" dy="15.6">  команд за місяць</tspan></text>
<line x1="780.0" y1="230.0" x2="810.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="50.0" width="180.0" height="40.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="910.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">4. Бюджет помилок</tspan></text>
<rect x="820.0" y="100.0" width="180.0" height="260.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="910.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Error Budget:</tspan><tspan x="910.0" dy="14.3"></tspan><tspan x="910.0" dy="14.3">• Бюджет = 100% − SLO</tspan><tspan x="910.0" dy="14.3">  = 0.1%</tspan><tspan x="910.0" dy="14.3">• Дозволений збій:</tspan><tspan x="910.0" dy="14.3">  ~43.2 хвилини / місяць</tspan><tspan x="910.0" dy="14.3">• Арбітр релізів:</tspan><tspan x="910.0" dy="14.3">  Dev vs Ops</tspan></text>
<rect x="40.0" y="375.0" width="960.0" height="35.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Безперервний ланцюг: Бізнес-мета  →  Подієвий вимір  →  Статистична ціль  →  Ресурс ризику</tspan></text>
