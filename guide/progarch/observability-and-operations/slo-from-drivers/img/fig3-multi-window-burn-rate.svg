<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатовіконна логіка детекції Burn Rate</text>
<rect x="40.0" y="60.0" width="430.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="164.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0"></tspan></text>
<text x="255.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Довге вікно (1 година) — Точність (Precision)</text>
<rect x="60.0" y="110.0" width="390.0" height="130.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">• Оцінює обсяг втраченого бюджету</tspan><tspan x="255.0" dy="15.6">• Вимога: втрачено ≥ 2% бюджету за 1 годину</tspan><tspan x="255.0" dy="15.6">• Захищає від хибних тривог на мікро-сп сплесках</tspan><tspan x="255.0" dy="15.6">• Помилка: повільно реагує на початок інциденту</tspan></text>
<rect x="570.0" y="60.0" width="430.0" height="200.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="785.0" y="164.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0"></tspan></text>
<text x="785.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e08a1e" text-anchor="middle" font-weight="700">Коротке вікно (5 хвилин) — Свіжість (Recency)</text>
<rect x="590.0" y="110.0" width="390.0" height="130.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="785.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">• Оцінює поточний стан системи прямо зараз</tspan><tspan x="785.0" dy="15.6">• Вимога: burn rate становить ≥ 14.4x за 5 хвилин</tspan><tspan x="785.0" dy="15.6">• Гарантує, що аварія триває прямо зараз</tspan><tspan x="785.0" dy="15.6">• Захищає від алертів після того, як збій вщух</tspan></text>
<circle cx="500.0" cy="160.0" r="32.0" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="500.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">AND</text>
<line x1="470.0" y1="160.0" x2="468.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="532.0" y1="160.0" x2="568.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="192.0" x2="500.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="285.0" width="360.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Критичний алерт (PagerDuty / On-Call)</tspan><tspan x="500.0" dy="13.0"></tspan><tspan x="500.0" dy="13.0">Burn Rate = 14.4x (2% бюджету за годину + збій триває)</tspan></text>
<rect x="40.0" y="385.0" width="960.0" height="40.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Багатовіконний аналіз (Multi-Window Multi-Burn-Rate) виключає хибні тривоги при коротких сплесках та мовчки згаслих інцидентах.</tspan></text>
