<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві межі: хто ти? (автентифікація) і що тобі можна? (авторизація)</text>
<line x1="129.9" y1="182.0" x2="280.1" y2="182.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="419.9" y1="182.0" x2="642.1" y2="182.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="781.9" y1="182.0" x2="1040.1" y2="182.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="531.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">суб'єкт: Оля, справжня</text>
<text x="911.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">право є</text>
<line x1="350.0" y1="209.2" x2="350.0" y2="338.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="336.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">нема / хибний доказ</text>
<line x1="712.0" y1="219.0" x2="712.0" y2="338.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="698.0" y="282.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">права бракує</text>
<rect x="54.1" y="155.9" width="75.9" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="92.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="92.0" dy="0.0">запит</tspan><tspan x="92.0" dy="18.2">від Олі</tspan></text>
<rect x="280.1" y="154.8" width="139.7" height="54.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.9"/><text x="350.0" y="177.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Автентифікація</tspan><tspan x="350.0" dy="19.5">«хто ти?»</tspan></text>
<rect x="642.1" y="145.0" width="139.7" height="74.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.9"/><text x="712.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">Авторизація</tspan><tspan x="712.0" dy="19.5">«чи можна тобі</tspan><tspan x="712.0" dy="19.5">саме це?»</tspan></text>
<rect x="1040.1" y="155.9" width="83.8" height="52.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="1082.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1082.0" dy="0.0">дію</tspan><tspan x="1082.0" dy="18.2">виконано</tspan></text>
<rect x="277.0" y="347.1" width="146.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">401 Unauthorized</tspan><tspan x="350.0" dy="16.9">«не знаю, хто ти»</tspan></text>
<rect x="646.4" y="347.1" width="131.1" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="712.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">403 Forbidden</tspan><tspan x="712.0" dy="16.9">«знаю — але ні»</tspan></text>
<text x="590.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пройти першу межу — ще не пройти другу; кожна ламається своїм кодом.</text>
</svg>