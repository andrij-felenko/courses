<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Новий ворог»: несвіже „можна&quot; по відкликанні — і як zookie його закриває</text>
<text x="56.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Без маркера свіжості</text>
<rect x="56.0" y="96.0" width="210.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="161.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="161.0" dy="0.0">t₁ · відкликали</tspan><tspan x="161.0" dy="16.2">Богдана</tspan></text>
<line x1="272.0" y1="130.0" x2="306.0" y2="130.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="312.0" y="96.0" width="210.0" height="68.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.6"/><text x="417.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">t₂ · перевірка читає</tspan><tspan x="417.0" dy="16.2">несвіжий знімок</tspan></text>
<line x1="528.0" y1="130.0" x2="562.0" y2="130.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="568.0" y="96.0" width="210.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="673.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="673.0" dy="0.0">allow — доступ</tspan><tspan x="673.0" dy="16.2">не зник</tspan></text>
<line x1="784.0" y1="130.0" x2="818.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="824.0" y="104.0" width="150.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="899.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="899.0" dy="0.0">→ «НОВИЙ</tspan><tspan x="899.0" dy="15.6">ВОРОГ»</tspan></text>
<text x="56.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Із zookie (обмежена свіжість)</text>
<rect x="56.0" y="226.0" width="210.0" height="68.0" rx="6" fill="#fbf1dc" stroke="#6b7280" stroke-width="1.6"/><text x="161.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="161.0" dy="0.0">збереження контенту</tspan><tspan x="161.0" dy="16.2">видає zookie@t</tspan></text>
<line x1="272.0" y1="260.0" x2="306.0" y2="260.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="312.0" y="226.0" width="210.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="417.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="417.0" dy="0.0">перевірка несе zookie:</tspan><tspan x="417.0" dy="16.2">знімок ≥ t</tspan></text>
<line x1="528.0" y1="260.0" x2="562.0" y2="260.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="568.0" y="226.0" width="210.0" height="68.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="673.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="673.0" dy="0.0">deny — відкликання</tspan><tspan x="673.0" dy="16.2">видно</tspan></text>
<line x1="784.0" y1="260.0" x2="818.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="824.0" y="234.0" width="150.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="899.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="899.0" dy="0.0">→ вікно</tspan><tspan x="899.0" dy="15.6">закрите</tspan></text>
<rect x="56.0" y="318.0" width="918.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="515.0" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">знімок ≥ zookie.час   ⇒   усе, що сталося до видачі zookie (і відкликання теж), вже в цьому знімку</tspan></text>
<rect x="56.0" y="386.0" width="452.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="282.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">несвіже «не можна» по ВИДАЧІ</tspan><tspan x="282.0" dy="15.6">= незручність: почекав і повторив</tspan></text>
<rect x="522.0" y="386.0" width="452.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="748.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">несвіже «можна» по ВІДКЛИКАННІ</tspan><tspan x="748.0" dy="15.6">= діра: відкликаний ще відчиняє двері</tspan></text>
</svg>