<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві брами — дві різні атаки: жодна не зайва</text>
<text x="360.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брама 1 · край (груба, без об'єкта)</text>
<text x="714.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брама 2 · сервіс (тонка, з об'єктом)</text>
<rect x="24.0" y="98.0" width="200.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="124.0" y="129.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">Гість</tspan><tspan x="124.0" dy="15.6">тисне «відчинити»</tspan></text>
<line x1="228.0" y1="132.0" x2="250.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="92.0" width="300.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="400.0" y="128.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">роль «гість» не несе</tspan><tspan x="400.0" dy="15.6">скоупу команд пристроям</tspan></text>
<text x="400.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ СТОП → 403 на краю</text>
<rect x="604.0" y="98.0" width="300.0" height="66.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/><text x="754.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="754.0" dy="0.0">Брама 2 навіть</tspan><tspan x="754.0" dy="15.6">не знадобилась</tspan></text>
<rect x="958.0" y="102.0" width="198.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="1057.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">чужого</tspan><tspan x="1057.0" dy="15.0">нічого не сталося</tspan></text>
<line x1="24.0" y1="250.0" x2="1156.0" y2="250.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 5"/>
<rect x="24.0" y="300.0" width="200.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="124.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">Мешканець дому 7</tspan><tspan x="124.0" dy="15.6">просить замок #99</tspan><tspan x="124.0" dy="15.6">(дім Марти)</tspan></text>
<line x1="228.0" y1="344.0" x2="250.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="300.0" width="300.0" height="88.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="400.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">він МЕШКАНЕЦЬ зі скоупом —</tspan><tspan x="400.0" dy="15.6">об'єкта Брама 1 не бачить</tspan></text>
<text x="400.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ пропущено далі</text>
<line x1="556.0" y1="344.0" x2="604.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="604.0" y="300.0" width="300.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="754.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="754.0" dy="0.0">замок #99 належить дому Марти,</tspan><tspan x="754.0" dy="15.6">а не дому 7 — не збіглося</tspan></text>
<text x="754.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ СТОП → 403 у сервісі</text>
<rect x="958.0" y="304.0" width="198.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="1057.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1057.0" dy="0.0">IDOR спіймано:</tspan><tspan x="1057.0" dy="15.0">чужий замок</tspan><tspan x="1057.0" dy="15.0">лишився замкнений</tspan></text>
<text x="590.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Брама 1 ловить «не той КЛАС дії»; Брама 2 — «ЧУЖИЙ об'єкт».</tspan><tspan x="590.0" dy="15.0">Кожна ловить те, чого інша структурно не може, — тому їх дві, а не одна.</tspan></text>
</svg>