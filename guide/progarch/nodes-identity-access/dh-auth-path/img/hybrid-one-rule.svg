<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гібрид DH: одне джерело правила, дві точки застосування</text>
<rect x="300.0" y="62.0" width="460.0" height="92.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="530.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">ПРАВИЛО — одне джерело</tspan><tspan x="530.0" dy="16.9">член дому + роль ∈ {власник, мешканець} → unlock</tspan></text>
<text x="530.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">один погляд · без дрейфу копій · один аудит</tspan><tspan x="530.0" dy="15.0">«хто взагалі може відчиняти?» — одна відповідь</tspan></text>
<line x1="420.0" y1="200.0" x2="300.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="200.0" x2="760.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="96.0" y="254.0" width="372.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="282.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">Брама 1 · край (шлюз)</tspan><tspan x="282.0" dy="16.2"></tspan><tspan x="282.0" dy="16.2">застосовує ОБ'ЄКТО-НЕЗАЛЕЖНУ частину:</tspan><tspan x="282.0" dy="16.2">клас дії, скоуп ролі</tspan><tspan x="282.0" dy="16.2">— дешево, до входу в сервіс</tspan></text>
<rect x="592.0" y="254.0" width="372.0" height="128.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="778.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">Брама 2 · сервіс пристроїв</tspan><tspan x="778.0" dy="16.2"></tspan><tspan x="778.0" dy="16.2">застосовує ОБ'ЄКТНУ частину:</tspan><tspan x="778.0" dy="16.2">«цей замок — у ТВОЄМУ домі?»</tspan><tspan x="778.0" dy="16.2">— поруч із даними, з об'єктом у руках</tspan></text>
<text x="530.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Гібрид: єдине правило (як у Варіанті Б) + локальна об'єктна перевірка (як у Варіанті А).</tspan><tspan x="530.0" dy="15.0">Правило одне — точок застосування дві.</tspan></text>
</svg>