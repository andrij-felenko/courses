<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 588" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="588" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири способи сказати сервісу «хто це» — переживає лише один</text>
<rect x="20.0" y="52.0" width="270.0" height="48.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Спосіб сказати «хто»</tspan></text>
<rect x="298.0" y="52.0" width="250.0" height="48.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/><text x="423.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="423.0" dy="0.0">Що перетинає межу</tspan></text>
<rect x="556.0" y="52.0" width="470.0" height="48.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/><text x="791.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="791.0" dy="0.0">Чим ламається</tspan></text>
<rect x="1034.0" y="52.0" width="226.0" height="48.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.2"/><text x="1147.0" y="80.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1147.0" dy="0.0">Вердикт</tspan></text>
<rect x="20.0" y="108.0" width="270.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="155.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Переслати сирий</tspan><tspan x="155.0" dy="15.6">клієнтський токен</tspan></text>
<rect x="298.0" y="108.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="423.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">клієнтський JWT</tspan><tspan x="423.0" dy="15.6">(як є)</tspan></text>
<rect x="556.0" y="108.0" width="470.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="791.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">сервіс розбирає ЧУЖИЙ токен: тягне більше влади,</tspan><tspan x="791.0" dy="15.6">ніж треба для цього стрибка, і чіпляє кожен</tspan><tspan x="791.0" dy="15.6">сервіс до формату токена</tspan></text>
<rect x="1034.0" y="108.0" width="226.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1147.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1147.0" dy="0.0">✗ надлишок</tspan><tspan x="1147.0" dy="15.6">і зчеплення</tspan></text>
<rect x="20.0" y="214.0" width="270.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="155.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Простий заголовок</tspan><tspan x="155.0" dy="15.6">X-User-Id: bohdan</tspan></text>
<rect x="298.0" y="214.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="423.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">рядок «bohdan»</tspan><tspan x="423.0" dy="15.6">(без підпису)</tspan></text>
<rect x="556.0" y="214.0" width="470.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="791.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">будь-хто, хто дотягнувся до сервісу напряму,</tspan><tspan x="791.0" dy="15.6">ставить свій заголовок — і стає ким завгодно</tspan></text>
<rect x="1034.0" y="214.0" width="226.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1147.0" y="268.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1147.0" dy="0.0">✗ підробний</tspan></text>
<rect x="20.0" y="320.0" width="270.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="155.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">«Дійшло крізь шлюз»</tspan><tspan x="155.0" dy="15.6">(довіра за місцем</tspan><tspan x="155.0" dy="15.6">у мережі)</tspan></text>
<rect x="298.0" y="320.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="423.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">нічого —</tspan><tspan x="423.0" dy="15.6">сама адреса</tspan><tspan x="423.0" dy="15.6">джерела</tspan></text>
<rect x="556.0" y="320.0" width="470.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="791.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">заплутаний заступник: усе, що дотяглося напряму</tspan><tspan x="791.0" dy="15.6">(SSRF, сусідній сервіс, збій мережі), сервіс</tspan><tspan x="791.0" dy="15.6">обслуговує від чийого завгодно імені</tspan></text>
<rect x="1034.0" y="320.0" width="226.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1147.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1147.0" dy="0.0">✗ заплутаний</tspan><tspan x="1147.0" dy="15.6">заступник</tspan></text>
<rect x="20.0" y="426.0" width="270.0" height="100.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="155.0" y="472.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Підписане внутрішнє</tspan><tspan x="155.0" dy="15.6">засвідчення</tspan></text>
<rect x="298.0" y="426.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="423.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="423.0" dy="0.0">свіжий внутр. токен:</tspan><tspan x="423.0" dy="15.6">підпис шлюзу ·</tspan><tspan x="423.0" dy="15.6">aud=devices · TTL≈10 с</tspan></text>
<rect x="556.0" y="426.0" width="470.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="791.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">перевіряється підписом; вузьке (лише сервіс</tspan><tspan x="791.0" dy="15.6">пристроїв); короткоживе — підробити, розтягнути</tspan><tspan x="791.0" dy="15.6">чи переграти нізвідки</tspan></text>
<rect x="1034.0" y="426.0" width="226.0" height="100.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="1147.0" y="480.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1147.0" dy="0.0">✓ засвідчено</tspan></text>
<text x="640.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Три верхні способи кажуть «хто» так, що сервіс отримує зайве або вірить непідписаному.</tspan><tspan x="640.0" dy="15.0">Лише засвідчення підписом шлюзу перетинає межу так, що його не підробити й не розтягнути.</tspan></text>
</svg>