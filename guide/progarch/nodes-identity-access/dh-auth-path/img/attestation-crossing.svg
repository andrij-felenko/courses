<line x1="575.0" y1="250.0" x2="695.0" y2="250.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="650.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">суб'єкт, засвідчений хмарою</text>
