<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа хмари: доведений суб'єкт перетинає її засвідченням, а не сирим токеном</text>
<rect x="15.0" y="185.0" width="120.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="75.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="75.0" dy="0.0">телефон</tspan><tspan x="75.0" dy="13.7">Богдана</tspan><tspan x="75.0" dy="13.7">access-токен</tspan><tspan x="75.0" dy="13.7">(підпис клієнта)</tspan></text>
<line x1="139.0" y1="250.0" x2="165.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
