<rect x="722.0" y="124.0" width="356.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Прийняти засвідчення</tspan><tspan x="900.0" dy="14.3">перевірити підписом ШЛЮЗУ → суб'єкт</tspan><tspan x="900.0" dy="14.3">(сирий клієнтський токен НЕ читаємо)</tspan></text>
<line x1="900.0" y1="204.0" x2="900.0" y2="224.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="722.0" y="226.0" width="356.0" height="66.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Завантажити об'єкт</tspan><tspan x="900.0" dy="15.0">замок #42 → homeId = 7</tspan></text>
<line x1="900.0" y1="292.0" x2="900.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="722.0" y="314.0" width="356.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="900.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Тонка ОБ'ЄКТНА перевірка (PDP)</tspan><tspan x="900.0" dy="14.3">can(суб'єкт, unlock, замок#42)</tspan><tspan x="900.0" dy="14.3">чужий дім → 403</tspan></text>
<text x="900.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="900.0" dy="0.0">на руках і суб'єкт, і об'єкт —</tspan><tspan x="900.0" dy="14.3">тут IDOR нікуди сховатися</tspan></text>
<line x1="1100.0" y1="250.0" x2="1126.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1130.0" y="205.0" width="150.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1205.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1205.0" dy="0.0">дозволено</tspan><tspan x="1205.0" dy="14.3">→ хаб</tspan><tspan x="1205.0" dy="14.3">→ замок</tspan><tspan x="1205.0" dy="14.3">відчинено</tspan></text>
<text x="650.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Крізь межу йде СВІЖЕ внутрішнє засвідчення (підпис шлюзу · aud=devices · TTL≈10 с), не сирий клієнтський токен.</tspan><tspan x="650.0" dy="14.3">Сервіс вірить особі, засвідченій хмарою, — а не «місцю, звідки прийшов запит».</tspan></text>
