<text x="370.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брама 1 · шлюз (край хмари)</text>
<rect x="192.0" y="124.0" width="356.0" height="78.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Автентифікація</tspan><tspan x="370.0" dy="15.0">verifyAccessToken(token)</tspan><tspan x="370.0" dy="15.0">підпис локально → суб'єкт, інакше 401</tspan></text>
<line x1="370.0" y1="202.0" x2="370.0" y2="222.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="192.0" y="224.0" width="356.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="370.0" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Груба авторизація (скоуп)</tspan><tspan x="370.0" dy="15.0">токен несе device:command?</tspan><tspan x="370.0" dy="15.0">гість (лише device:view) → 403</tspan></text>
<line x1="370.0" y1="304.0" x2="370.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="192.0" y="322.0" width="356.0" height="72.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="370.0" y="354.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Карбує внутрішнє засвідчення</tspan><tspan x="370.0" dy="14.3">підпис ключем ШЛЮЗУ · aud=devices · TTL≈10 с</tspan></text>
<text x="370.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="370.0" dy="0.0">на руках лише токен —</tspan><tspan x="370.0" dy="14.3">об'єкта тут ще не видно</tspan></text>
<line x1="610.0" y1="70.0" x2="610.0" y2="222.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
