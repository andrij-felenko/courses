<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як зробити невидиме читання видимим</text>
<line x1="340.0" y1="325.0" x2="380.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<line x1="680.0" y1="240.0" x2="720.0" y2="155.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<rect x="40.0" y="250.0" width="300.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">① Рахувати ВІДДАНЕ</text><text x="190.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">бачу: лише що сам віддав</tspan><tspan x="190.0" dy="17.6">tempC поїхав усім підряд</tspan><tspan x="190.0" dy="17.6">→ лічильник не занулиться</tspan></text>
<rect x="380.0" y="165.0" width="300.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="530.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">② Когорта за особою</text><text x="530.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">бачу: версію клієнта</tspan><tspan x="530.0" dy="17.6">до-temperature версія читає</tspan><tspan x="530.0" dy="17.6">→ натяк, ще не доказ</tspan></text>
<rect x="720.0" y="80.0" width="300.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="870.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">③ Явний вибір полів</text><text x="870.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">бачу: ?fields= у запиті</tspan><tspan x="870.0" dy="17.6">назвав tempC → читає</tspan><tspan x="870.0" dy="17.6">→ доказ у самому запиті</tspan></text>
<line x1="70.0" y1="440.0" x2="990.0" y2="440.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="70.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">здогад</text>
<text x="990.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">доказ</text>
<text x="530.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сила сигналу: чим вище сходинка, тим ближче «читання» до того, що сервер справді бачить</text>
</svg>