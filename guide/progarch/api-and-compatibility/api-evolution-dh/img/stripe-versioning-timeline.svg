<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двадцять років обіцянки не ламати нічого</text>
<line x1="90.0" y1="150.0" x2="1010.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2011</text>
<text x="150.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">Публічний запуск.</tspan><tspan x="150.0" dy="15.6">Версії-дати</tspan><tspan x="150.0" dy="15.6">замість v1 / v2 / v3</tspan></text>
<circle cx="410.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2011 → 2017</text>
<text x="410.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">≈ 100 ламких</tspan><tspan x="410.0" dy="15.6">оновлень — і жодне</tspan><tspan x="410.0" dy="15.6">не зламало старих</tspan></text>
<circle cx="690.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="690.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 серп. 2017</text>
<text x="690.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="690.0" dy="0.0">Brandur Leach друкує</tspan><tspan x="690.0" dy="15.6">механізм: одна правда,</tspan><tspan x="690.0" dy="15.6">ланцюг перекладачів</tspan></text>
<circle cx="970.0" cy="150.0" r="9.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<text x="970.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2024-09-30</text>
<text x="970.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">acacia: імена дерев,</tspan><tspan x="970.0" dy="15.6">піврічні релізи,</tspan><tspan x="970.0" dy="15.6">та сама обіцянка</tspan></text>
</svg>