<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна межа крізь систему: що змінюєш вільно — і що вже обіцяв чужим</text>
<rect x="40.0" y="64.0" width="470.0" height="452.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="570.0" y="64.0" width="470.0" height="452.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="540.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">межа публікації</text>
<line x1="540.0" y1="66.0" x2="540.0" y2="512.0" stroke="#1a1a1a" stroke-width="2.4" stroke-dasharray="2,7"/>
<text x="275.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">НЕ ОПУБЛІКОВАНЕ</text>
<text x="275.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="275.0" dy="0.0">обидві сторони — твій код:</tspan><tspan x="275.0" dy="15.6">зміну оновиш разом, в один коміт</tspan></text>
<text x="66.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  внутрішній gRPC: реєстр ⇄ автоматизація</text>
<text x="66.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  схема бази даних</text>
<text x="66.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  значення конфігу: порт, період, лог-рівень</text>
<text x="66.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  нутрощі помилки: stack, SQL, шлях</text>
<text x="66.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  правило decide(), склад ядра</text>
<text x="275.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">рефактор і перейменування — безпечно</text>
<text x="805.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">ОПУБЛІКОВАНЕ</text>
<text x="805.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="805.0" dy="0.0">чужі сперлися — не відкличеш;</tspan><tspan x="805.0" dy="15.6">живе, поки живий найповільніший клієнт</tspan></text>
<text x="590.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  публічний REST-DTO v1: temperature{value,unit}, at</text>
<text x="590.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  формат ідентифікатора пристрою (device-id)</text>
<text x="590.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  топік телеметрії  dh/home/{id}/{dev}/reading</text>
<text x="590.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  конверт помилки + стабільні коди</text>
<text x="590.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">•  контракт розширення: DevicePort, payload вебхука</text>
<text x="805.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">будь-яка зміна форми — злам або нова версія</text>
</svg>