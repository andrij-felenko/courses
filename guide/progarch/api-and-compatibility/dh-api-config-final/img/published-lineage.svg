<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід межі: від власності коду — до закону Гайрама</text>
<rect x="30.0" y="66.0" width="950.0" height="452.0" rx="10" fill="#eef7f0" stroke="#cfe6d8" stroke-width="1.2"/>
<rect x="30.0" y="536.0" width="950.0" height="176.0" rx="10" fill="#fdecea" stroke="#f2cfca" stroke-width="1.2"/>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700" font-style="italic">Внесок Фаулера — ДЕ проходить межа: питання координації, а не видимості</text>
<text x="210.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">Механізм Гайрама — ЩО по той бік межі: спостережне стає чиєюсь опорою</text>
<line x1="170.0" y1="150.0" x2="170.0" y2="692.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="147.0" width="762.0" height="56.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.3"/><text x="586.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">Суперечка про власність коду (XP). Сильне володіння → внутрішній</tspan><tspan x="586.0" dy="16.9">інтерфейс стає «опублікованим»: не перейменуєш, поки власник виклику не оновить свій бік.</tspan></text>
<text x="150.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">кін. 1990-х</text>
<circle cx="170.0" cy="175.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="205.0" y="257.0" width="762.0" height="56.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.3"/><text x="586.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">«Refactoring» (Мартін Фаулер) уводить термін published interface:</tspan><tspan x="586.0" dy="16.9">рефактор-інструмент перейменовує вільно лише в межах ОДНІЄЇ кодової бази.</tspan></text>
<text x="150.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1999</text>
<circle cx="170.0" cy="285.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="205.0" y="367.0" width="762.0" height="56.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.3"/><text x="586.0" y="391.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">IEEE Software 19(2), с. 18–19 — «Public versus Published»:</tspan><tspan x="586.0" dy="16.9">важить не видимість (public/private), а межа координації (published).</tspan></text>
<text x="150.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2002</text>
<circle cx="170.0" cy="395.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="205.0" y="460.0" width="762.0" height="56.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.3"/><text x="586.0" y="484.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">bliki «PublishedInterface» — стисле канонічне означення:</tspan><tspan x="586.0" dy="16.9">інтерфейс, «ужитий поза кодовою базою, де його визначено».</tspan></text>
<text x="150.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">2003</text>
<circle cx="170.0" cy="488.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="205.0" y="602.0" width="762.0" height="56.0" rx="6" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.3"/><text x="586.0" y="626.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="586.0" dy="0.0">Закон Гайрама (Гайрам Райт; назвав Тайтус Вінтерс, «SE at Google»):</tspan><tspan x="586.0" dy="16.9">спостережне стає опорою. Стоїть НА межі Фаулера — не заміняє її.</tspan></text>
<text x="150.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">~2012 → 2020</text>
<circle cx="170.0" cy="630.0" r="7.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
</svg>