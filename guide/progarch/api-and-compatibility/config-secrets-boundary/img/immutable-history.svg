<text x="530.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Секрет у C2 лишається живим — за SHA, у форках, у вічному журналі подій.</text>
<text x="530.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">git rm / rebase / force-push воюють із рядком; шкода вже на іншому рівні.</text>
