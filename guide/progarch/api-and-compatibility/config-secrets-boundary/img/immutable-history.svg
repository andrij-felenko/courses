<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">«Прибрати» — це додати НОВИЙ коміт (C4); старий (C2) нікуди не зникає.</text>
