<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама система, три дози — і два способи їх схибити</text>
<text x="120.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Частина</text>
<text x="420.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Помилкова доза</text>
<text x="845.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Правильна доза</text>
<rect x="30.0" y="78.0" width="180.0" height="124.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="2.4"/><text x="120.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ЯДРО</tspan><tspan x="120.0" dy="16.9">автоматика</tspan><tspan x="120.0" dy="16.9">сценаріїв</tspan></text>
<rect x="230.0" y="78.0" width="380.0" height="124.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="420.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">недобір → грудка багна:</tspan><tspan x="420.0" dy="16.9">if status == 3 по сервісах,</tspan><tspan x="420.0" dy="16.9">інваріант не стереже ніхто</tspan></text>
<rect x="640.0" y="78.0" width="410.0" height="124.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="2.0"/><text x="845.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">багатий агрегат:</tspan><tspan x="845.0" dy="16.9">інваріант в одному місці,</tspan><tspan x="845.0" dy="16.9">усе через корінь, мова предмета</tspan></text>
<rect x="30.0" y="212.0" width="180.0" height="124.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/><text x="120.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ДОПОМІЖНЕ</tspan><tspan x="120.0" dy="16.9">реєстр</tspan><tspan x="120.0" dy="16.9">пристроїв</tspan></text>
<rect x="230.0" y="212.0" width="380.0" height="124.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="420.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">надмір → анемічна церемонія:</tspan><tspan x="420.0" dy="16.9">порожні «агрегати», фабрики,</tspan><tspan x="420.0" dy="16.9">хендлери — ні над чим</tspan></text>
<rect x="640.0" y="212.0" width="410.0" height="124.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.0"/><text x="845.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">DTO + тонкий сервіс:</tspan><tspan x="845.0" dy="16.9">названі типи —</tspan><tspan x="845.0" dy="16.9">і по всьому</tspan></text>
<rect x="30.0" y="346.0" width="180.0" height="124.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/><text x="120.0" y="395.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ЗАГАЛЬНЕ</tspan><tspan x="120.0" dy="16.9">сповіщення</tspan><tspan x="120.0" dy="16.9">й пошта</tspan></text>
<rect x="230.0" y="346.0" width="380.0" height="124.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="420.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">надмір → моделювати домен там,</tspan><tspan x="420.0" dy="16.9">де береться готове</tspan></text>
<rect x="640.0" y="346.0" width="410.0" height="124.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="845.0" y="395.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">тонкий адаптер</tspan><tspan x="845.0" dy="16.9">до готової бібліотеки:</tspan><tspan x="845.0" dy="16.9">нуль DDD</tspan></text>
</svg>