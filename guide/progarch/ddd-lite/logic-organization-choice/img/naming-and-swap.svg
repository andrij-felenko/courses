<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народилися назви — і як трійка змінила склад</text>
<text x="250.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Що назвав Фаулер</tspan><tspan x="250.0" dy="18.2">PoEAA · листопад 2002</tspan></text>
<text x="830.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Трійка, якою вчать сьогодні</text>
<rect x="138.0" y="127.0" width="224.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Transaction Script</tspan><tspan x="250.0" dy="16.9">(логіка — процедура)</tspan></text>
<rect x="138.0" y="263.1" width="224.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Domain Model</tspan><tspan x="250.0" dy="16.9">(дані + поведінка разом)</tspan></text>
<rect x="138.0" y="393.1" width="224.0" height="49.9" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="414.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="250.0" dy="0.0">Table Module</tspan><tspan x="250.0" dy="16.9">(об'єкт на всю таблицю)</tspan></text>
<rect x="708.0" y="135.5" width="244.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="830.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Сценарій-транзакція</tspan></text>
<rect x="708.0" y="263.1" width="244.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Багата модель</tspan><tspan x="830.0" dy="16.9">(Еванс, DDD · серпень 2003)</tspan></text>
<rect x="708.0" y="393.1" width="244.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="414.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Анемічна модель</tspan><tspan x="830.0" dy="16.9">(есей · 25 листопада 2003)</tspan></text>
<line x1="362.0" y1="152.0" x2="708.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама — просто укр. назва</text>
<line x1="362.0" y1="288.0" x2="708.0" y2="288.0" stroke="#27ae60" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="540.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Еванс дав їй глибину:</text>
<text x="540.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">мова, сутності, агрегати</text>
<text x="540.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="540.0" dy="0.0">(без відповідника:</tspan><tspan x="540.0" dy="15.6">місце звільнилось, зайняла інша)</tspan></text>
<line x1="250.0" y1="450.9" x2="250.0" y2="494.9" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="250.0" dy="0.0">тьмяніє й випадає з трійки</tspan><tspan x="250.0" dy="14.3">(артефакт ери .NET DataSet)</tspan></text>
<text x="830.0" y="462.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">новий патерн-засторога</text>
<line x1="952.0" y1="152.0" x2="986.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="952.0" y1="418.0" x2="986.0" y2="418.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="986.0" y1="152.0" x2="986.0" y2="418.0" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="986.0" cy="288.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="986.0" y1="288.0" x2="998.0" y2="288.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="1004.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1004.0" dy="0.0">Той самий «окремо».</tspan><tspan x="1004.0" dy="16.1">Фаулер сам зв'язав:</tspan><tspan x="1004.0" dy="16.1">анемічна модель —</tspan><tspan x="1004.0" dy="16.1">«по суті Transaction</tspan><tspan x="1004.0" dy="16.1">Script» (лист. 2003)</tspan></text>
</svg>