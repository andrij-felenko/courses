<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язка: чи є між об'єктами межа процесу</text>
<rect x="362.3" y="41.9" width="115.5" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="63.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Два об'єкти</tspan><tspan x="420.0" dy="18.2">говорять</tspan></text>
<line x1="420.0" y1="100.0" x2="420.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="134.0" width="240.0" height="52.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="420.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Вони в одному процесі?</tspan></text>
<line x1="392.0" y1="188.0" x2="235.0" y2="298.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<line x1="448.0" y1="188.0" x2="620.0" y2="298.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="528.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Ні — світ поставив межу</text>
<rect x="110.0" y="300.0" width="250.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Лишай дрібнозернистим —</tspan><tspan x="235.0" dy="16.9">виклики дарові, межі нема</tspan></text>
<rect x="490.0" y="300.0" width="260.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Перетинай рідко і грубо —</tspan><tspan x="620.0" dy="16.9">один виклик, пакунок-DTO</tspan></text>
<rect x="240.0" y="432.0" width="360.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/><text x="420.0" y="463.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">За замовчуванням — не розподіляй</tspan></text>
</svg>