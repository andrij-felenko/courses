<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Товстий інтерфейс сам виробляє порушення LSP</text>
<line x1="266.5" y1="178.0" x2="371.1" y2="178.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="568.9" y1="178.0" x2="669.8" y2="178.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="83.5" y="136.2" width="183.0" height="83.7" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Товстий IDevice</tspan><tspan x="175.0" dy="16.9"> </tspan><tspan x="175.0" dy="16.9">read() · turnOn()</tspan><tspan x="175.0" dy="16.9">lock() · startStream()</tspan></text>
<rect x="371.1" y="136.2" width="197.8" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Датчик температури</tspan><tspan x="470.0" dy="16.9">мусить реалізувати</tspan><tspan x="470.0" dy="16.9">turnOn / lock / stream —</tspan><tspan x="470.0" dy="16.9">яких він не вміє</tspan></text>
<rect x="669.8" y="136.2" width="190.4" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">throw «не підтримую»</tspan><tspan x="765.0" dy="16.9">або порожнє тіло →</tspan><tspan x="765.0" dy="16.9">клієнт, що довірився</tspan><tspan x="765.0" dy="16.9">IDevice, дістає сюрприз</tspan></text>
<text x="175.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ISP ✗ — усе в одному типі</text>
<text x="470.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вимушена нечесність</text>
<text x="765.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">LSP ✗ — підстановка небезпечна</text>
<rect x="70.0" y="330.0" width="800.0" height="70.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="470.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Товстий інтерфейс — це фабрика порушень LSP: коли тип обіцяє більше, ніж реалізатор здатен чесно виконати,</tspan><tspan x="470.0" dy="15.6">кожному реалізатору лишається або брехати порожнім тілом, або падати винятком — і те, і те ламає підстановку.</tspan></text>
</svg>