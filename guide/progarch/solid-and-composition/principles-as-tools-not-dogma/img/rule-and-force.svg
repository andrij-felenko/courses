<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило — стиснута сила; догма — правило без сили</text>
<text x="480.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ІНСТРУМЕНТ — правило тримається за силу</text>
<rect x="70.0" y="86.0" width="320.0" height="94.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">СИЛА (джерело)</tspan><tspan x="230.0" dy="16.9">продубльоване знання</tspan><tspan x="230.0" dy="16.9">з часом розходиться</tspan></text>
<rect x="570.0" y="86.0" width="320.0" height="94.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="129.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">ПРАВИЛО (кеш)</tspan><tspan x="730.0" dy="16.9">«Не повторюйся» (DRY)</tspan></text>
<text x="479.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стискається в</text>
<line x1="392.0" y1="112.0" x2="566.0" y2="112.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="566.0" y1="150.0" x2="392.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="479.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вказує назад на силу</text>
<line x1="60.0" y1="214.0" x2="900.0" y2="214.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="480.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДОГМА — те саме правило, а сили під ним нема</text>
<rect x="90.0" y="286.0" width="300.0" height="84.0" rx="6" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="96.0" y1="292.0" x2="384.0" y2="364.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="384.0" y1="292.0" x2="96.0" y2="364.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="240.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">місце сили порожнє</text>
<rect x="570.0" y="286.0" width="300.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">ПРАВИЛО</tspan><tspan x="720.0" dy="16.9">все одно застосоване</tspan></text>
<text x="480.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">«усунь дублювання!»</text>
<line x1="566.0" y1="328.0" x2="392.0" y2="328.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="480.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Верх: правило й сила тримаються разом — це інструмент. Низ: правило без сили — карго.</text>
</svg>