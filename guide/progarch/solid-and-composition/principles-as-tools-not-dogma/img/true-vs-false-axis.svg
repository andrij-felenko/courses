<rect x="690.0" y="300.0" width="240.0" height="74.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="810.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">dangerLevel(zone)</tspan><tspan x="810.0" dy="16.9">одна формула —</tspan><tspan x="810.0" dy="16.9">бізнес міняє як одне</tspan></text>
