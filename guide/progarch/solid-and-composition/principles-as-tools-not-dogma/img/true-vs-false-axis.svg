<text x="810.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">тричі → правило трьох спрацювало по суті</text>
<text x="540.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Зливай не те, що на око схоже (рядок), а те, за чим одна сила (формула небезпеки).</text>
