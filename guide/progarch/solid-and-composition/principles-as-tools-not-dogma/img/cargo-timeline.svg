<text x="590.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Рухи 1885–1930-х старші за війну; вантаж 1942-го лише «підтвердив» їх — термін (1945) і метафора (1974) прийшли пізніше.</text>
