<rect x="480.0" y="60.0" width="390.0" height="250.0" rx="12" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.6"/>
<rect x="45.0" y="74.0" width="400.0" height="42.0" rx="6" fill="#fef7e6" stroke="#b8860b" stroke-width="1.5"/><text x="245.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d0b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Розділити МОЖНА — але відкриється вікно</tspan></text>
<rect x="492.0" y="74.0" width="366.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Розділити НЕМОЖЛИВО — значення створює сама дія</tspan></text>
<rect x="48.0" y="128.0" width="394.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="245.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">«дістати-й-вилучити» — dequeue()</text>
<text x="245.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">повертає: вилучений елемент</text>
<rect x="48.0" y="214.0" width="394.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="245.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">«атомарний лічильник» — allocate()</text>
<text x="245.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">повертає: унікальний номер</text>
<rect x="498.0" y="150.0" width="354.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="675.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">«створити-й-повернути id»</text>
<text x="675.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">createDevice() → свіжий id</text>
<text x="675.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">до вставки id не існує</text>
<rect x="221.4" y="327.5" width="457.2" height="33.0" rx="6" fill="#eef7ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">спільне: повернене — прямий продукт дії, а не побічний звіт</tspan></text>
