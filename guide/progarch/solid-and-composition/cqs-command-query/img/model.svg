<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один метод — або міняє стан, або відповідає, не обоє</text>
<rect x="330.0" y="108.0" width="160.0" height="96.0" rx="10" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="410.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">СТАН</tspan><tspan x="410.0" dy="19.5">об'єкта</tspan></text>
<rect x="60.0" y="126.0" width="200.0" height="84.0" rx="9" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="160.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">КОМАНДА</text>
<text x="160.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">append(reading)</text>
<line x1="264.0" y1="168.0" x2="324.0" y2="151.2" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="295.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">пише</text>
<rect x="93.9" y="230.0" width="132.3" height="28.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="160.0" dy="0.0">повертає ∅ (void)</tspan></text>
<rect x="560.0" y="126.0" width="200.0" height="84.0" rx="9" fill="#eef2fb" stroke="#2457d6" stroke-width="1.9"/>
<text x="660.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАПИТ</text>
<text x="660.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">average()</text>
<line x1="496.0" y1="151.2" x2="556.0" y2="168.0" stroke="#2457d6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="525.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">лише читає</text>
<rect x="593.9" y="230.0" width="132.3" height="28.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="660.0" dy="0.0">повертає значення</tspan></text>
<text x="410.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">чіпає стан лише команда (ліворуч) — тому запит (праворуч) завжди каже правду</text>
</svg>