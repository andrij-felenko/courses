<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контракт-тест — ворота: чесний дублер проходить, «мовчазний» ловиться</text>
<rect x="400.0" y="116.0" width="200.0" height="244.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/><text x="500.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">КОНТРАКТ</tspan><tspan x="500.0" dy="18.2">Notifier</tspan><tspan x="500.0" dy="18.2">———</tspan><tspan x="500.0" dy="18.2">після send(m):</tspan><tspan x="500.0" dy="18.2">m є у стоці</tspan><tspan x="500.0" dy="18.2">доставки</tspan></text>
<rect x="48.0" y="112.0" width="250.0" height="60.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="173.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="173.0" dy="0.0">RecordingNotifier</tspan><tspan x="173.0" dy="15.6">сток = масив прийнятих</tspan></text>
<rect x="48.0" y="212.0" width="250.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="173.0" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="173.0" dy="0.0">SmsNotifier</tspan><tspan x="173.0" dy="15.6">сток = вихідні Twilio</tspan></text>
<rect x="48.0" y="312.0" width="250.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="173.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="173.0" dy="0.0">SilentNotifier</tspan><tspan x="173.0" dy="15.6">вдає, нічого не шле</tspan></text>
<line x1="300.0" y1="142.0" x2="398.0" y2="176.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="242.0" x2="398.0" y2="236.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="342.0" x2="398.0" y2="300.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="150.0" width="252.0" height="92.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="826.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">проходить →</tspan><tspan x="826.0" dy="15.6">підставляється всюди,</tspan><tspan x="826.0" dy="15.6">де стоїть Notifier</tspan></text>
<line x1="602.0" y1="200.0" x2="698.0" y2="196.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="300.0" width="252.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="826.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">сток порожній —</tspan><tspan x="826.0" dy="15.6">контракт не виконано,</tspan><tspan x="826.0" dy="15.6">до Notifier не пускають</tspan></text>
<line x1="602.0" y1="300.0" x2="698.0" y2="330.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">той самий контракт-тест женуть на КОЖНУ реалізацію Notifier</text>
</svg>