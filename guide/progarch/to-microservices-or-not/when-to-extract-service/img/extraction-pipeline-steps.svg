<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покроковий конвеєр безпечного виділення сервісу</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири етапи безпечного виділення сервісу</text>
<rect x="30.0" y="110.0" width="200.0" height="150.0" rx="8" fill="#eef2fb" stroke="#333333" stroke-width="1.8"/>
<text x="130.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Модуль у моноліті</text>
<text x="130.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чистий мовний інтерфейс</text>
<text x="130.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">та приватні класи</text>
<line x1="235.0" y1="180.0" x2="265.0" y2="180.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270.0" y="110.0" width="200.0" height="150.0" rx="8" fill="#eef2fb" stroke="#333333" stroke-width="1.8"/>
<text x="370.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Асинхронні події</text>
<text x="370.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Асинхронний Outbox pattern</text>
<text x="370.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">замість прямого виклику</text>
<line x1="475.0" y1="180.0" x2="505.0" y2="180.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="110.0" width="200.0" height="150.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="610.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Розділення даних</text>
<text x="610.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Окремі схеми/БД,</text>
<text x="610.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приватний доступ</text>
<line x1="715.0" y1="180.0" x2="745.0" y2="180.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="750.0" y="110.0" width="200.0" height="150.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="850.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Фізичний виніс</text>
<text x="850.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Процес за gRPC/HTTP</text>
<text x="850.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">із проксі (Strangler Fig)</text>
<rect x="50.0" y="310.0" width="900.0" height="90.0" rx="8" fill="#f7f8fa" stroke="#333333" stroke-width="1.2"/>
<text x="500.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">⚠️ Ключове правило безпечного виділення</text>
<text x="500.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Якщо шов між модулями в моноліті не брудний — виносити в мережу НЕ МОЖНА. Спочатку робимо чистий модуль і розділяємо дані, і лише наприкінці ставить мережу.</text>
</svg>