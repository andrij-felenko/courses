<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фази покрокової міграції від моноліта до мікросервісу</text>
<rect x="60.0" y="100.0" width="240.0" height="320.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="180.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Модульний моноліт</text>
<line x1="75.0" y1="148.0" x2="285.0" y2="148.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="76.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дев'ять модулів в 1 деплої</text>
<text x="76.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямі виклики в пам'яті</text>
<text x="76.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Спільна реляційна БД</text>
<text x="76.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Межі модулів зафіксовані</text>
<line x1="305.0" y1="260.0" x2="335.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="100.0" width="240.0" height="320.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="460.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Шви та ізоляція</text>
<line x1="355.0" y1="148.0" x2="565.0" y2="148.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="356.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Branch by Abstraction в коді</text>
<text x="356.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Логічні схеми в БД (PostgreSQL)</text>
<text x="356.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прибрано cross-domain JOINs</text>
<text x="356.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Доступ лише через інтерфейси</text>
<line x1="585.0" y1="260.0" x2="615.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="100.0" width="240.0" height="320.0" rx="8" fill="#fff8e6" stroke="#d97706" stroke-width="2.0"/>
<text x="740.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Strangler &amp; Canary</text>
<line x1="635.0" y1="148.0" x2="845.0" y2="148.0" stroke="#d97706" stroke-width="1.2"/>
<text x="636.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• API Gateway рутить 5% → 100%</text>
<text x="636.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Dual Write / CDC синхронізація</text>
<text x="636.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Shadow Reads для звірки</text>
<text x="636.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Старий модуль слугує fallback</text>
<line x1="865.0" y1="260.0" x2="895.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="900.0" y="100.0" width="240.0" height="320.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="1020.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Автономний сервіс</text>
<line x1="915.0" y1="148.0" x2="1125.0" y2="148.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="916.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сервіс розгорнуто автономно</text>
<text x="916.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Власна ізольована БД</text>
<text x="916.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Старий код вирізано з моноліта</text>
<text x="916.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Нуль прямих зв'язків</text>
<rect x="175.0" y="454.0" width="850.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Ключовий принцип: кожна фаза зворотна, а перехід між ними відбувається без зупинки системи (Zero Downtime)</tspan></text>
</svg>