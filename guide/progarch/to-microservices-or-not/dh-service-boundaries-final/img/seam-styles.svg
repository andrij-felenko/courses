<text x="38.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">Клієнт → шлюз → ядро</tspan></text>
<rect x="500.0" y="110.2" width="190.0" height="31.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="595.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">синхронно</tspan></text>
<text x="732.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">людина натиснула й дивиться на екран</tspan></text>
<text x="1012.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">ланцюг доступності</tspan></text>
<line x1="26.0" y1="160.0" x2="1180.0" y2="160.0" stroke="#eef0f3" stroke-width="1.0"/>
<text x="38.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">Ядро → телеметрія</tspan></text>
<rect x="500.0" y="178.2" width="190.0" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/><text x="595.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">асинхронно · подія</tspan></text>
<text x="732.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">факт летить сам, ядро не чекає запису</tspan></text>
<text x="1012.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">зрештою узгоджене</tspan></text>
