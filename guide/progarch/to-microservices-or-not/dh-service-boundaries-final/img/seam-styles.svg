<rect x="500.0" y="246.2" width="190.0" height="31.5" rx="6" fill="#eef2fb" stroke="#c77d0a" stroke-width="1.8"/><text x="595.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">синхронно, але терпить</tspan></text>
<text x="732.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">екран хоче зараз — та проживе без виміру</tspan></text>
<text x="1012.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">таймаут + запас</tspan></text>
<line x1="26.0" y1="296.0" x2="1180.0" y2="296.0" stroke="#eef0f3" stroke-width="1.0"/>
<text x="38.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">Ядро ⇄ хаб у домі</tspan></text>
<rect x="499.8" y="314.2" width="190.4" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/><text x="595.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">команда вниз · подія вгору</tspan></text>
<text x="732.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">у домі буває поганий Wi-Fi</tspan></text>
<text x="1012.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">ретрай + ідемпотентність</tspan></text>
<line x1="26.0" y1="364.0" x2="1180.0" y2="364.0" stroke="#eef0f3" stroke-width="1.0"/>
<text x="38.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">Білінг → платіжний провайдер</tspan></text>
<rect x="500.0" y="382.2" width="190.0" height="31.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="595.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">синхронно за ACL</tspan></text>
<text x="732.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">треба тверде «так / ні» від чужого</tspan></text>
<text x="1012.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">чужа мова за стіною</tspan></text>
<line x1="26.0" y1="432.0" x2="1180.0" y2="432.0" stroke="#eef0f3" stroke-width="1.0"/>
<text x="38.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700"><tspan x="38.0" dy="0.0">Сповіщення → пуш</tspan></text>
<rect x="493.2" y="450.2" width="203.5" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/><text x="595.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">асинхронно · вистрелив-забув</tspan></text>
<text x="732.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="732.0" dy="0.0">доставку листа не блокуємо командою</tspan></text>
<text x="1012.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="1012.0" dy="0.0">ACL на вихід</tspan></text>
<text x="600.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Стиль обирають на КОЖЕН шов окремо — тому DH виходить мішаний: синхронний там, де людина чекає, асинхронний там, де факт може летіти сам.</text>
