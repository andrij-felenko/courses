<rect x="232.3" y="377.1" width="205.4" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">модульний моноліт</tspan><tspan x="335.0" dy="16.9">чисті межі, один процес</tspan></text>
<rect x="580.9" y="377.1" width="168.2" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">моноліт-клубок</tspan><tspan x="665.0" dy="16.9">без меж, один процес</tspan></text>
<rect x="240.4" y="172.1" width="189.3" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="335.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">мікросервіси</tspan><tspan x="335.0" dy="16.9">чисті межі, по мережі</tspan></text>
<rect x="566.3" y="172.1" width="197.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">РОЗПОДІЛЕНИЙ МОНОЛІТ</tspan><tspan x="665.0" dy="16.9">мережа + усе зчеплення</tspan></text>
<text x="335.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">← низьке зчеплення</text>
