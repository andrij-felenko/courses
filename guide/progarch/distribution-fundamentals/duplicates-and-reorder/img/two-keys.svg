<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві болячки — два різні ключі</text>
<rect x="235.0" y="74.0" width="380.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">ДУБЛЬ</tspan></text>
<rect x="635.0" y="74.0" width="380.0" height="46.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="825.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">ПЕРЕУПОРЯДКУВАННЯ</tspan></text>
<text x="210.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">що це</text>
<rect x="235.0" y="146.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">те саме оновлення двічі</tspan></text>
<rect x="635.0" y="146.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">два різні оновлення не по черзі</tspan></text>
<text x="210.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">чим упізнати</text>
<rect x="235.0" y="226.0" width="380.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">ідентифікатор (тотожність):</tspan><tspan x="425.0" dy="16.9">«чи бачив я це?»</tspan></text>
<rect x="635.0" y="226.0" width="380.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">номер версії (старшинство):</tspan><tspan x="825.0" dy="16.9">«котре з двох новіше?»</tspan></text>
<text x="210.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">приклад шкоди</text>
<rect x="235.0" y="340.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">дію виконано двічі</tspan></text>
<rect x="635.0" y="340.0" width="380.0" height="62.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">свіже значення затерто старим</tspan></text>
<rect x="235.0" y="428.0" width="780.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="461.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Вартовий версії закриває ОБИДВІ — якщо застосування ідемпотентне за версією</tspan></text>
</svg>