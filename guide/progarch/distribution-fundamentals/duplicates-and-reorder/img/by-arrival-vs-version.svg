<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">За прибуттям → брехня;  за версією → правда</text>
<text x="570.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прибуло однаково в обидві доріжки:  спершу B (v6, 23°),  тоді A (v5, 21°)</text>
<text x="70.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Трактує за ПРИБУТТЯМ</text>
<line x1="456.0" y1="190.0" x2="484.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="796.0" y1="190.0" x2="859.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="165.1" width="300.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">прийшов B v6</tspan><tspan x="300.0" dy="16.9">→ став 23°</tspan></text>
<rect x="490.0" y="165.1" width="300.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">прийшов A v5</tspan><tspan x="640.0" dy="16.9">→ став 21°  (останній!)</tspan></text>
<rect x="865.0" y="163.9" width="210.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="970.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">кінець: 21°</tspan><tspan x="970.0" dy="18.2">БРЕХНЯ</tspan></text>
<line x1="60.0" y1="300.0" x2="1080.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="70.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Вартовий ВЕРСІЇ</text>
<line x1="456.0" y1="410.0" x2="484.0" y2="410.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="796.0" y1="410.0" x2="859.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="385.1" width="300.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">прийшов B v6</tspan><tspan x="300.0" dy="16.9">→ став 23°,  межа = 6</tspan></text>
<rect x="490.0" y="385.1" width="300.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">прийшов A v5:</tspan><tspan x="640.0" dy="16.9">5 ≤ 6 → відкинуто</tspan></text>
<rect x="865.0" y="383.9" width="210.0" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="970.0" y="405.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">кінець: 23°</tspan><tspan x="970.0" dy="18.2">ПРАВДА</tspan></text>
<text x="570.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Прибуття однакові — різне лише правило рішення. Номер версії відкидає відсталий пакет; мить прибуття — ні.</text>
</svg>