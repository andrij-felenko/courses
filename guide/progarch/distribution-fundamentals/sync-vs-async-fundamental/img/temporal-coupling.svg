<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зчеплення в часі: синхронно проти асинхронно</text>
<text x="600.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">СИНХРОННО — викликач тримає взаємодію відкритою, доки отримувач не відповість</text>
<line x1="150.0" y1="268.0" x2="330.0" y2="268.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="540.0" y1="268.0" x2="720.0" y2="268.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<text x="96.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<text x="96.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">викликач</text>
<text x="96.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="96.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">отримувач</text>
<rect x="330.0" y="132.0" width="210.0" height="172.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<rect x="330.0" y="132.0" width="210.0" height="172.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<text x="435.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">обидва живі в той самий час</text>
<rect x="150.0" y="149.0" width="100.0" height="38.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">працює</tspan></text>
<rect x="250.0" y="149.0" width="310.0" height="38.0" rx="6" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.5"/><text x="405.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">заблоковано — чекає на B</tspan></text>
<rect x="560.0" y="149.0" width="160.0" height="38.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="640.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">продовжує</tspan></text>
<rect x="330.0" y="249.0" width="210.0" height="38.0" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.5"/><text x="435.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">обробляє запит</tspan></text>
<line x1="252.0" y1="187.0" x2="330.0" y2="249.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="262.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">запит</text>
<line x1="540.0" y1="249.0" x2="560.0" y2="187.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="566.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">відповідь</text>
<text x="600.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Активні вікна A і B ПЕРЕКРИВАЮТЬСЯ — сторони мусять жити одночасно. Впаде B — стоїть і A.</text>
<line x1="70.0" y1="384.0" x2="1130.0" y2="384.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="600.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">АСИНХРОННО — викликач віддає повідомлення посередникові й одразу йде далі</text>
<line x1="150.0" y1="626.0" x2="510.0" y2="626.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<text x="96.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<text x="96.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">викликач</text>
<text x="96.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="96.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">отримувач</text>
<rect x="150.0" y="481.0" width="100.0" height="38.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">працює</tspan></text>
<rect x="250.0" y="481.0" width="470.0" height="38.0" rx="6" fill="#dfe9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="485.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="485.0" dy="0.0">продовжує одразу — не чекає на B</tspan></text>
<rect x="510.0" y="607.0" width="210.0" height="38.0" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.5"/><text x="615.0" y="629.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">обробляє, коли доступна (пізніше)</tspan></text>
<rect x="295.0" y="539.2" width="210.0" height="47.6" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.6"/><text x="400.0" y="559.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">черга</tspan><tspan x="400.0" dy="15.6">тримає повідомлення</tspan></text>
<line x1="252.0" y1="519.0" x2="372.0" y2="548.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="258.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кладе</text>
<line x1="430.0" y1="578.0" x2="512.0" y2="607.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="480.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">витягує пізніше</text>
<line x1="252.0" y1="519.0" x2="252.0" y2="656.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="510.0" y1="607.0" x2="510.0" y2="656.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="381.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Δt — сторони не зустрічаються; черга перекриває розрив</text>
<text x="600.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Активні вікна НЕ перекриваються. A виживає, навіть якщо B лежить, — повідомлення чекає в черзі.</text>
</svg>