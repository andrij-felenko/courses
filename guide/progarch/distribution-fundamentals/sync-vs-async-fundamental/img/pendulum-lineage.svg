<text x="720.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Поле уваги галузі хитається туди-сюди — обидва зчеплення існують завжди, модним стає то одне, то інше.</text>
<text x="720.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоразу маятник вертав, бо різницю локального й віддаленого сховати надовго не вдавалося.</text>
