<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де й коли зринає помилка</text>
<text x="600.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">СИНХРОННО — помилка приходить у ТІЙ САМІЙ відповіді, поки викликач чекає</text>
<rect x="75.0" y="144.2" width="110.0" height="47.6" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.8"/><text x="130.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">App</tspan><tspan x="130.0" dy="15.6">POST /lock</tspan></text>
<rect x="205.0" y="151.0" width="405.0" height="34.0" rx="6" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.5"/><text x="407.5" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="407.5" dy="0.0">заблоковано — чекає на весь ланцюг (хмара→хаб→замок)</tspan></text>
<line x1="610.0" y1="168.0" x2="668.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="655.0" y="144.2" width="230.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">504 timeout · 502 offline</tspan><tspan x="770.0" dy="15.6">state: unknown</tspan></text>
<text x="600.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="600.0" dy="0.0">Помилка — НЕГАЙНА і в обличчя викликачеві.</tspan><tspan x="600.0" dy="15.6">Але хаб офлайн → команду нема куди подіти → ВОНА ВТРАЧЕНА.</tspan></text>
<line x1="60.0" y1="288.0" x2="1140.0" y2="288.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="600.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">АСИНХРОННО — 202 одразу; збій осідає збоку й спливає ПІЗНІШЕ</text>
<rect x="65.0" y="384.2" width="110.0" height="47.6" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.8"/><text x="120.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">App</tspan><tspan x="120.0" dy="15.6">POST /lock</tspan></text>
<line x1="178.0" y1="408.0" x2="250.0" y2="408.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="255.0" y="392.0" width="150.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">202 {commandId}</tspan></text>
<text x="330.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">негайно — App вільний</text>
<line x1="408.0" y1="408.0" x2="486.0" y2="408.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="560.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">згодом, окремим шляхом</text>
<rect x="495.0" y="392.0" width="250.0" height="32.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.6"/><text x="620.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">черга → споживач → hub.send</tspan></text>
<line x1="748.0" y1="408.0" x2="812.0" y2="408.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="835.0" y="384.2" width="210.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">МЕРТВА ЧЕРГА</tspan><tspan x="940.0" dy="15.6">(після N невдач)</tspan></text>
<line x1="620.0" y1="434.0" x2="620.0" y2="486.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="470.0" y="489.4" width="300.0" height="45.3" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.4"/><text x="620.0" y="508.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">App: GET /commands/{id}</tspan><tspan x="620.0" dy="14.3">бачить «failed» лише коли спитає</tspan></text>
<text x="600.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Ніхто не заблокований — але про збій мусить спитати хтось: поллінг, монітор або людина біля мертвої черги.</text>
</svg>