<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1360" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя асинхронної команди «зачинити»: 202 зараз — кінцевий стан згодом</text>
<rect x="105.0" y="275.1" width="250.0" height="49.9" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="2.0"/><text x="230.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">ACCEPTED</tspan><tspan x="230.0" dy="16.9">прийнято · лежить у черзі</tspan></text>
<rect x="555.0" y="275.1" width="250.0" height="49.9" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="2.0"/><text x="680.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">PROCESSING</tspan><tspan x="680.0" dy="16.9">споживач узяв команду</tspan></text>
<rect x="1015.0" y="275.1" width="250.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="1140.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1140.0" dy="0.0">DONE</tspan><tspan x="1140.0" dy="16.9">зачинено ✓ · твін оновлено</tspan></text>
<line x1="360.0" y1="300.0" x2="550.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="810.0" y1="300.0" x2="1010.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="104.0" y="87.3" width="252.0" height="45.3" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">POST /homes/:id/lock</tspan><tspan x="230.0" dy="14.3">хмара кладе в чергу → 202 {commandId}</tspan></text>
<line x1="230.0" y1="132.7" x2="230.0" y2="274.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="152.2" width="300.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="455.0" y="171.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">споживач тягне з черги</tspan><tspan x="455.0" dy="14.3">⚠ at-least-once: той самий id</tspan><tspan x="455.0" dy="14.3">може прийти двічі → дедуп-ворота</tspan></text>
<line x1="455.0" y1="211.8" x2="455.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="770.0" y="105.3" width="280.0" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="910.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">hub.send(lock) → «locked»</tspan><tspan x="910.0" dy="14.3">кінцевий стан → у ТВІН</tspan></text>
<line x1="910.0" y1="150.7" x2="910.0" y2="288.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680.0" y1="326.0" x2="680.0" y2="428.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="720.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="720.0" dy="0.0">не позначили «done» →</tspan><tspan x="720.0" dy="14.3">повтор; після N спроб —</tspan><tspan x="720.0" dy="14.3">у мертву чергу</tspan></text>
<rect x="510.0" y="430.4" width="340.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="680.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">FAILED</tspan><tspan x="680.0" dy="15.6">помилка N разів → МЕРТВА ЧЕРГА</tspan><tspan x="680.0" dy="15.6">(людина розбере згодом)</tspan></text>
<rect x="90.0" y="572.2" width="1180.0" height="47.6" rx="6" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.6"/><text x="680.0" y="592.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Застосунок одразу після 202 показує «в обробці», опитує GET /commands/{id} (або слухає твін)</tspan><tspan x="680.0" dy="15.6">і міняє на «зачинено» ЛИШЕ коли стан = done — доти дім у кінцевій узгодженості.</tspan></text>
</svg>