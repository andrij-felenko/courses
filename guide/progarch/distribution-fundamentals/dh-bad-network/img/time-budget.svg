<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет часу скорочується всередину</text>
<rect x="70.0" y="100.0" width="840.0" height="50.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Телефон: чекає 10 с</tspan></text>
<rect x="742.0" y="172.0" width="168.0" height="50.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.3"/>
<text x="826.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+2 с собі на відповідь</text>
<rect x="70.0" y="172.0" width="672.0" height="50.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="406.0" y="201.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="406.0" dy="0.0">Хмара дає хабові 8 с</tspan></text>
<rect x="490.0" y="244.0" width="252.0" height="50.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.3"/>
<text x="616.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+3 с на повтор і відповідь</text>
<rect x="70.0" y="244.0" width="420.0" height="50.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Хаб дає замкові 5 с</tspan></text>
<rect x="238.0" y="316.0" width="252.0" height="50.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.3"/>
<text x="364.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запас на ще одну спробу</text>
<rect x="70.0" y="316.0" width="168.0" height="50.0" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="154.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="154.0" dy="0.0">Замок: ~2 с</tspan></text>
<line x1="45.0" y1="108.0" x2="45.0" y2="350.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">глибше</text>
<text x="500.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Дедлайн не сталий — він тоншає всередину: кожен шар віддає нижчому менше, ніж має, лишаючи запас на власну відповідь і повтор.</text>
</svg>