<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка двох повторів на одному ключі</text>
<line x1="575.0" y1="100.0" x2="575.0" y2="620.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7,7"/>
<text x="305.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">НАЇВНО — get, тоді put: між ними діра</text>
<rect x="100.0" y="139.8" width="410.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="305.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">① R1: get(7f3) → порожньо</tspan></text>
<rect x="100.0" y="221.6" width="410.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="305.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">② R2: get(7f3) → теж порожньо</tspan><tspan x="305.0" dy="16.2">(put від R1 ще не настав)</tspan></text>
<rect x="100.0" y="319.8" width="410.0" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">③ R1: execute ▶  замок крутиться</tspan></text>
<rect x="100.0" y="409.8" width="410.0" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="430.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">④ R2: execute ▶  замок крутиться ЗНОВУ</tspan></text>
<line x1="305.0" y1="186.0" x2="305.0" y2="216.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="305.0" y1="276.0" x2="305.0" y2="306.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="305.0" y1="366.0" x2="305.0" y2="396.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="305.0" y1="456.0" x2="305.0" y2="522.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="100.0" y="531.0" width="410.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="305.0" y="552.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">двері відчинились ДВІЧІ</tspan></text>
<text x="835.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАМОК НА КЛЮЧ — reserve, тоді execute</text>
<rect x="620.0" y="139.8" width="430.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="835.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">① R1: reserve(7f3) → виграв</tspan></text>
<rect x="620.0" y="229.8" width="430.0" height="32.5" rx="6" fill="#dfe9fb" stroke="#2457d6" stroke-width="1.5"/><text x="835.0" y="250.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">② R2: reserve(7f3) → зайнято, чекаю</tspan></text>
<rect x="620.0" y="319.8" width="430.0" height="32.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">③ R1: execute ▶ → зберіг 7f3</tspan></text>
<rect x="620.0" y="401.6" width="430.0" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">④ R2: ← той самий результат</tspan><tspan x="835.0" dy="16.2">(не виконує)</tspan></text>
<line x1="835.0" y1="186.0" x2="835.0" y2="216.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="835.0" y1="276.0" x2="835.0" y2="306.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="835.0" y1="366.0" x2="835.0" y2="396.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="835.0" y1="456.0" x2="835.0" y2="522.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="620.0" y="531.0" width="430.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="835.0" y="552.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="835.0" dy="0.0">виконання ОДНЕ</tspan></text>
<text x="580.0" y="648.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Гонка живе в проміжку між «прочитав» і «записав» — навіть в одному потоці, бо execute — це await, на якому вклинюється конкурент.</text>
</svg>