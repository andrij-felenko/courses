<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найнижче підтвердження завжди лишається без відповіді</text>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерал A</text>
<text x="470.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерал B</text>
<line x1="150.0" y1="85.0" x2="150.0" y2="392.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,6"/>
<line x1="470.0" y1="85.0" x2="470.0" y2="392.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,6"/>
<text x="310.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«б'ємо на світанку»</text>
<line x1="154.0" y1="128.0" x2="466.0" y2="128.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«згоден»</text>
<line x1="466.0" y1="183.0" x2="154.0" y2="183.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«отримав „згоден“»</text>
<line x1="154.0" y1="238.0" x2="466.0" y2="238.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«отримав, що ти отримав»</text>
<line x1="466.0" y1="293.0" x2="154.0" y2="293.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">⋮</text>
<text x="310.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">«отримав, що ти отримав, що я…»</text>
<line x1="154.0" y1="372.0" x2="448.0" y2="372.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="449.0" y1="363.0" x2="467.0" y2="381.0" stroke="#c0392b" stroke-width="2.4"/><line x1="449.0" y1="381.0" x2="467.0" y2="363.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="310.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">останній лист лишається без відповіді —</tspan><tspan x="310.0" dy="15.6">відправник не знає, чи він дійшов</tspan></text>
<rect x="662.0" y="96.0" width="300.0" height="350.0" rx="12" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="812.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Чому гаранта не буває</text>
<line x1="682.0" y1="136.0" x2="942.0" y2="136.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="680.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Хай є НАЙкоротший</text>
<text x="680.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">протокол-гарант.</text>
<text x="680.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Його останнє повідомлення m</text>
<text x="680.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">могло б загубитись —</text>
<text x="680.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">отже, підсумок не залежить</text>
<text x="680.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">від того, дійшло m чи ні.</text>
<text x="680.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Значить, m зайве.</text>
<text x="680.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Викинь m → протокол коротший,</text>
<text x="680.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">але теж гарант.</text>
<text x="680.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Суперечність!</text>
<text x="812.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">⇒ скінченного гаранта НЕМА</text>
</svg>