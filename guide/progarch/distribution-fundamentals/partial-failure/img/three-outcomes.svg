<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три правди за однією тишею — і що з цим робити</text>
<rect x="360.0" y="50.0" width="260.0" height="44.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.8"/><text x="490.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Виклик не відповів — таймаут</tspan></text>
<line x1="455.0" y1="96.0" x2="195.0" y2="126.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="96.0" x2="490.0" y2="126.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="525.0" y1="96.0" x2="795.0" y2="126.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="128.0" width="260.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="185.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Запит не дійшов</tspan><tspan x="185.0" dy="15.6">нічого не сталося</tspan></text>
<text x="185.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">повтор безпечний</text>
<rect x="360.0" y="128.0" width="260.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="490.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Виконалось,</tspan><tspan x="490.0" dy="15.6">підтвердження зникло</tspan><tspan x="490.0" dy="15.6">ефект уже стався</tspan></text>
<text x="490.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">повтор ЗАДВОЇТЬ</text>
<rect x="665.0" y="128.0" width="260.0" height="66.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.6"/><text x="795.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Ще летить,</tspan><tspan x="795.0" dy="15.6">повільний</tspan><tspan x="795.0" dy="15.6">ефект, можливо, попереду</tspan></text>
<text x="795.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">повтор → гонка</text>
<line x1="185.0" y1="228.0" x2="300.0" y2="274.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="490.0" y1="228.0" x2="490.0" y2="274.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="795.0" y1="228.0" x2="680.0" y2="274.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="240.0" y="276.0" width="500.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="490.0" y="299.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Розрізнити зсередини не можна —</tspan><tspan x="490.0" dy="18.2">зроби так, щоб було БАЙДУЖЕ, що сталося</tspan></text>
<line x1="490.0" y1="332.0" x2="490.0" y2="356.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="165.0" y="360.0" width="170.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="250.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">таймаут</tspan></text>
<rect x="405.0" y="360.0" width="190.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="500.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ідемпотентність</tspan></text>
<rect x="660.0" y="360.0" width="180.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="750.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">звірка стану</tspan></text>
</svg>