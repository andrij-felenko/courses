<rect x="754.0" y="118.0" width="156.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="832.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="832.0" dy="0.0">Хмара</tspan><tspan x="832.0" dy="16.9">впала</tspan></text>
<rect x="550.0" y="214.0" width="156.0" height="64.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.8"/><text x="628.0" y="242.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">Твін</tspan><tspan x="628.0" dy="16.9">лаг</tspan></text>
<rect x="754.0" y="214.0" width="156.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="832.0" y="242.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="832.0" dy="0.0">Вендор</tspan><tspan x="832.0" dy="16.9">мовчить</tspan></text>
<text x="730.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">частковий стан: дехто живий, дехто ні —</tspan><tspan x="730.0" dy="15.6">ОДНОЧАСНО</tspan></text>
