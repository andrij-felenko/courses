<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 604" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="604" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Kill процесу — це НЕ відмова живлення (дві різні межі летючості)</text>
<text x="215.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">буфер застосунку</text>
<text x="615.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">кеш ОС</text>
<text x="1015.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">диск (носій)</text>
<text x="28.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">FULL</text>
<rect x="102.0" y="163.0" width="226.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="215.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">коміт вийшов</tspan><tspan x="215.0" dy="15.6">з памʼяті процеса</tspan></text>
<rect x="502.0" y="163.0" width="226.0" height="74.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.7"/><text x="615.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">проходить кеш</tspan><tspan x="615.0" dy="15.6">і йде далі</tspan></text>
<rect x="902.0" y="163.0" width="226.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="1015.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">НА ДИСКУ</tspan><tspan x="1015.0" dy="15.6">fsync на КОЖЕН коміт</tspan></text>
<line x1="328.0" y1="200.0" x2="502.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="728.0" y1="200.0" x2="902.0" y2="200.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="28.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">NORMAL</text>
<rect x="102.0" y="355.0" width="226.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="215.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">коміт вийшов</tspan><tspan x="215.0" dy="15.6">з памʼяті процеса</tspan></text>
<rect x="502.0" y="355.0" width="226.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="615.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">СПИНИВСЯ тут</tspan><tspan x="615.0" dy="15.6">без fsync на комітах</tspan></text>
<rect x="902.0" y="355.0" width="226.0" height="74.0" rx="6" fill="#f7f9fb" stroke="#c9ced4" stroke-width="1.7"/><text x="1015.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">лише на контрольній</tspan><tspan x="1015.0" dy="15.6">точці (не на комітах)</tspan></text>
<line x1="328.0" y1="392.0" x2="502.0" y2="392.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="728.0" y1="392.0" x2="902.0" y2="392.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="7 6"/>
<line x1="415.0" y1="128.0" x2="415.0" y2="470.0" stroke="#1a1a1a" stroke-width="2.4" stroke-dasharray="3 5"/>
<line x1="815.0" y1="128.0" x2="815.0" y2="470.0" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="3 5"/>
<text x="415.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">kill процесу</text>
<text x="815.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">відмова живлення</text>
<rect x="210.0" y="490.0" width="410.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="415.0" y="513.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">процес мертвий, а кеш ОС живий →</tspan><tspan x="415.0" dy="15.6">закомічене ЦІЛЕ в ОБОХ профілях</tspan><tspan x="415.0" dy="15.6">(тому kill не бачить різниці FULL/NORMAL)</tspan></text>
<rect x="665.0" y="490.0" width="360.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="845.0" y="513.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">кеш ОС СТЕРТО →</tspan><tspan x="845.0" dy="15.6">NORMAL губить свіжий хвіст,</tspan><tspan x="845.0" dy="15.6">FULL уже на диску — цілий</tspan></text>
</svg>