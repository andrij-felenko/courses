<rect x="564.0" y="226.0" width="236.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="682.0" y="281.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">батч-коміт</tspan><tspan x="682.0" dy="16.2">+ synchronous=NORMAL</tspan></text>
<rect x="814.0" y="226.0" width="416.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="1022.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.0" dy="0.0">закомічені рядки цілі,</tspan><tspan x="1022.0" dy="16.2">губимо лише незакомічений хвіст;</tspan><tspan x="1022.0" dy="16.2">база не пошкоджена</tspan></text>
<rect x="30.0" y="352.0" width="214.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="137.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Бюджет нагріву</tspan><tspan x="137.0" dy="16.2">інваріант під натовпом</tspan></text>
<rect x="258.0" y="352.0" width="292.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="404.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="404.0" dy="0.0">8 процесів разом</tspan><tspan x="404.0" dy="16.2">бʼють один бюджет</tspan></text>
<rect x="564.0" y="352.0" width="236.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="682.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">UPDATE … WHERE</tspan><tspan x="682.0" dy="16.2">+ busy_timeout</tspan></text>
<rect x="814.0" y="352.0" width="416.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="1022.0" y="399.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.0" dy="0.0">heat_left НІКОЛИ &lt; 0,</tspan><tspan x="1022.0" dy="16.2">сума списань точна</tspan><tspan x="1022.0" dy="16.2">(вартовий серіалізує писарів)</tspan></text>
