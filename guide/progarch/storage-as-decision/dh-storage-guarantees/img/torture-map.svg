<rect x="30.0" y="100.0" width="214.0" height="118.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.9"/><text x="137.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">Реєстр  ·  FULL</tspan><tspan x="137.0" dy="16.2">дім · пристрої · поріг</tspan></text>
<rect x="258.0" y="100.0" width="292.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="404.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="404.0" dy="0.0">kill посеред транзакції,</tspan><tspan x="404.0" dy="16.2">ще ДО COMMIT</tspan></text>
<rect x="564.0" y="100.0" width="236.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="682.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">BEGIN … COMMIT</tspan><tspan x="682.0" dy="16.2">+ synchronous=FULL</tspan></text>
<rect x="814.0" y="100.0" width="416.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.0"/><text x="1022.0" y="147.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1022.0" dy="0.0">дім або цілком старий, або цілком новий —</tspan><tspan x="1022.0" dy="16.2">ніколи піврозібраний;</tspan><tspan x="1022.0" dy="16.2">закомічений переживе й відмову живлення</tspan></text>
