<rect x="564.0" y="46.0" width="236.0" height="44.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="682.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="682.0" dy="0.0">Важіль</tspan></text>
