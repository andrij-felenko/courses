<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найбільша присутність у світі — найменша команда</text>
<rect x="40.0" y="60.0" width="576.0" height="42.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="328.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">Найпоширеніша база на Землі</tspan></text>
<rect x="40.0" y="110.0" width="576.0" height="118.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="328.0" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">у кожному телефоні · браузері · ОС</tspan><tspan x="328.0" dy="19.5">у Airbus A350, авто, телевізорах</tspan><tspan x="328.0" dy="19.5">&gt; 1 трильйон живих баз</tspan></text>
<rect x="40.0" y="236.0" width="576.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="328.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="328.0" dy="0.0">«ужитку більше, ніж усіх інших</tspan><tspan x="328.0" dy="18.9">баз даних разом узятих»</tspan></text>
<rect x="648.0" y="60.0" width="372.0" height="42.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="834.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="834.0" dy="0.0">Хто це тримає</tspan></text>
<rect x="648.0" y="110.0" width="372.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="834.0" y="136.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="834.0" dy="0.0">троє людей</tspan><tspan x="834.0" dy="18.2">сторонніх латок не беруть</tspan></text>
<rect x="648.0" y="180.0" width="372.0" height="130.0" rx="6" fill="#fdf3e0" stroke="#d08a2e" stroke-width="2.0"/><text x="834.0" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="834.0" dy="0.0">суспільне надбання</tspan><tspan x="834.0" dy="18.2">(public domain)</tspan><tspan x="834.0" dy="18.2"></tspan><tspan x="834.0" dy="18.2">нічия власність ·</tspan><tspan x="834.0" dy="18.2">жодної ліцензії</tspan></text>
<rect x="40.0" y="336.0" width="980.0" height="112.0" rx="6" fill="#fbfbe8" stroke="#c9b458" stroke-width="2.0"/><text x="530.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Найсерйозніше сховище на Землі — найнудніше:</tspan><tspan x="530.0" dy="18.2">передбачуване, вивірене до останньої гілки (100% MC/DC, DO-178B), нічого не просить.</tspan><tspan x="530.0" dy="18.2">Всюдисущість здобуло нудне, а не екзотичне. Спершу профіль — тоді рушій.</tspan></text>
</svg>