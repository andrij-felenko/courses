<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 588" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="588" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма задачі диктує інструмент — але всі вони віддають рішення сховищу</text>
<rect x="30.0" y="48.0" width="300.0" height="40.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Форма задачі</tspan></text>
<rect x="340.0" y="48.0" width="340.0" height="40.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Інструмент у сховищі</tspan></text>
<rect x="690.0" y="48.0" width="340.0" height="40.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Ціна / коли брати</tspan></text>
<rect x="30.0" y="96.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="180.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Лічильник із межею</tspan><tspan x="180.0" dy="16.2">(−1 до нуля, +1 до стелі)</tspan></text>
<rect x="340.0" y="96.0" width="340.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="510.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Атомний UPDATE … WHERE guard</tspan><tspan x="510.0" dy="16.2">(перевірка й зміна — один оператор)</tspan></text>
<rect x="690.0" y="96.0" width="340.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="860.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">Дефолт. Найпростіше —</tspan><tspan x="860.0" dy="16.2">бери це першим</tspan></text>
<rect x="30.0" y="180.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="180.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Заявка на унікальне</tspan><tspan x="180.0" dy="16.2">(місце, імʼя, пристрій)</tspan></text>
<rect x="340.0" y="180.0" width="340.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="510.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">UNIQUE-обмеження + INSERT</tspan><tspan x="510.0" dy="16.2">(індекс стає суддею)</tspan></text>
<rect x="690.0" y="180.0" width="340.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="860.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">БД сама відхиляє дубль</tspan><tspan x="860.0" dy="16.2">помилкою унікальності</tspan></text>
<rect x="30.0" y="264.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="180.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Прочитати → складна</tspan><tspan x="180.0" dy="16.2">логіка → записати, ексклюзивно</tspan></text>
<rect x="340.0" y="264.0" width="340.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="510.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">SELECT … FOR UPDATE</tspan><tspan x="510.0" dy="16.2">(песимістичний замок рядка)</tspan></text>
<rect x="690.0" y="264.0" width="340.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="860.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">Один писар за раз;</tspan><tspan x="860.0" dy="16.2">стережись дедлоку</tspan></text>
<rect x="30.0" y="348.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="180.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Довге редагування,</tspan><tspan x="180.0" dy="16.2">рідкі конфлікти</tspan></text>
<rect x="340.0" y="348.0" width="340.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="510.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Колонка version</tspan><tspan x="510.0" dy="16.2">(оптимістичне блокування)</tspan></text>
<rect x="690.0" y="348.0" width="340.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="860.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">Без замків; зайва</tspan><tspan x="860.0" dy="16.2">робота при повторі</tspan></text>
<rect x="30.0" y="432.0" width="300.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="180.0" y="467.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Інваріант на кілька рядків;</tspan><tspan x="180.0" dy="16.2">зловити будь-яку аномалію</tspan></text>
<rect x="340.0" y="432.0" width="340.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="510.0" y="467.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">SERIALIZABLE + повтор</tspan><tspan x="510.0" dy="16.2">(БД ловить конфлікт сама)</tspan></text>
<rect x="690.0" y="432.0" width="340.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.5"/><text x="860.0" y="467.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">Повтори під</tspan><tspan x="860.0" dy="16.2">навантаженням (40001)</tspan></text>
<rect x="30.0" y="522.0" width="1000.0" height="48.0" rx="6" fill="#fbfbe8" stroke="#c9b458" stroke-width="1.8"/><text x="530.0" y="550.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Спільне в усіх рядках: рішення переносять У СХОВИЩЕ — воно, а не застосунок, стає суддею інваріанта в мить запису.</tspan></text>
</svg>