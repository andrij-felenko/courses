<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Digital Homes: один застосунок — два профілі</text>
<line x1="500.0" y1="66.0" x2="500.0" y2="400.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="120.0" y="78.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Телеметрія сенсорів</tspan></text>
<text x="150.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="150.0" dy="0.0">• потік вставок, дописування</tspan><tspan x="150.0" dy="19.5">• рідко оновлюють</tspan><tspan x="150.0" dy="19.5">• читають діапазоном за часом</tspan></text>
<line x1="270.0" y1="250.0" x2="270.0" y2="292.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="128.0" y="296.0" width="284.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">LSM (журнальне)</tspan><tspan x="270.0" dy="18.2">наливає потік вставок</tspan></text>
<rect x="580.0" y="78.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Реєстр і конфіг</tspan></text>
<text x="610.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="610.0" dy="0.0">• точкові пошуки</tspan><tspan x="610.0" dy="19.5">• транзакційні правки (ACID)</tspan><tspan x="610.0" dy="19.5">• малий, має бути свіжим</tspan></text>
<line x1="730.0" y1="250.0" x2="730.0" y2="292.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="588.0" y="296.0" width="284.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">B-дерево (реляційне)</tspan><tspan x="730.0" dy="18.2">точні швидкі читання</tspan></text>
<text x="500.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">два профілі — два рушії; це не суперечність</text>
</svg>