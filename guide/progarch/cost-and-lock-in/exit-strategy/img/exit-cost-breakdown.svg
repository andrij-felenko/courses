<text x="75.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">конвертація форматів, ETL-пайплайни</text>
<rect x="460.0" y="80.0" width="360.0" height="75.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="475.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Code &amp; API Refactoring</text>
<text x="475.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Переписування SDK, заміна API,</text>
<text x="475.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">адаптація ORM та моделей запитів</text>
<rect x="60.0" y="185.0" width="360.0" height="75.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="75.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">3. Ops &amp; Infrastructure</text>
<text x="75.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Перенавчання команди, новий IaC,</text>
<text x="75.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">налаштування CI/CD та спостережуваності</text>
<rect x="460.0" y="185.0" width="360.0" height="75.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="475.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Dual-Running &amp; Opportunity</text>
<text x="475.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Паралельне утримання двох систем,</text>
<text x="475.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ризик виклику та затримка фіч</text>
<rect x="60.0" y="310.0" width="760.0" height="110.0" rx="8" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула повного евакуаційного бюджету:</text>
<text x="440.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Total Exit Cost = C_egress + C_rewrite + C_ops + C_dual_run + C_opportunity</text>
<text x="440.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо Total Exit Cost перевищує економію від міграції за 3 роки — міграція збиткова</text>
</svg>