<rect x="0.0" y="0.0" width="880.0" height="460.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія евакуаційного бюджету (Exit Cost)</text>
