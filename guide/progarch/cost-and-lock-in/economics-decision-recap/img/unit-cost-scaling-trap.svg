<text x="890.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#111827" text-anchor="end">Кількість активних користувачів / трафік (N)</text>
<text x="90.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#111827" text-anchor="start">Вартість інфраструктури на 1 користувача ($ / Unit)</text>
