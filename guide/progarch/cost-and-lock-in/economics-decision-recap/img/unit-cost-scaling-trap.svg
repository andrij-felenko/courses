<rect x="150.0" y="220.0" width="240.0" height="55.0" rx="6" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="270.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Зона прибутку (Gross Margin &gt; 0):</tspan><tspan x="270.0" dy="14.3">ARPU перевищує витрати</tspan></text>
<rect x="710.0" y="220.0" width="160.0" height="55.0" rx="6" fill="#fdecea" stroke="#b91c1c" stroke-width="1.5"/><text x="790.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Зона збитків:</tspan><tspan x="790.0" dy="14.3">Від'ємна маржа</tspan></text>
