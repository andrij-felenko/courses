<text x="860.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="end" font-weight="700">Дохід на користувача (ARPU = $1.50)</text>
<path d="M 80 320 Q 400 310 880 300" fill="none" stroke="#1e40af" stroke-width="3"/>
<text x="860.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="end" font-weight="700">Ефективний Unit Cost: O(1) / O(log N)</text>
