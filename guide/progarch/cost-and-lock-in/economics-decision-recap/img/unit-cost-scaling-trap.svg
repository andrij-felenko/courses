<text x="810.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="end" font-weight="700">Пастка архітектури: Unit Cost O(N)</text>
