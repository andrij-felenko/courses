<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл та чотири цінники архітектурного рішення</text>
<rect x="40.0" y="60.0" width="410.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#1e40af" stroke-width="1.5"/><text x="245.0" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. CapEx — Вартість побудови (Build Cost)</tspan><tspan x="245.0" dy="16.9">• Проєктування та прототипування</tspan><tspan x="245.0" dy="16.9">• Написання первинного коду й тестів</tspan><tspan x="245.0" dy="16.9">• Навчання команди та первинне налаштування</tspan><tspan x="245.0" dy="16.9">• Час до виходу на ринок (Time-to-Market)</tspan></text>
<rect x="510.0" y="60.0" width="410.0" height="140.0" rx="6" fill="#fdf0dd" stroke="#e08a1e" stroke-width="1.5"/><text x="715.0" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">2. OpEx — Вартість володіння (Run Cost)</tspan><tspan x="715.0" dy="16.9">• Рахунки за хмару (vCPU, RAM, Storage, Egress)</tspan><tspan x="715.0" dy="16.9">• Ліцензії SaaS/PaaS сервісів</tspan><tspan x="715.0" dy="16.9">• Оперативне навантаження на чергових (On-call)</tspan><tspan x="715.0" dy="16.9">• Технічне обслуговування й інциденти</tspan></text>
<rect x="40.0" y="245.0" width="410.0" height="140.0" rx="6" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="245.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">3. Change Cost — Вартість зміни (Evolution Cost)</tspan><tspan x="245.0" dy="16.9">• Когнітивне навантаження кодової бази</tspan><tspan x="245.0" dy="16.9">• Складність безпечного рефакторингу</tspan><tspan x="245.0" dy="16.9">• Ризик ламання суміжних систем при змінах</tspan><tspan x="245.0" dy="16.9">• Вартість додавання нових вимог</tspan></text>
<rect x="510.0" y="245.0" width="410.0" height="140.0" rx="6" fill="#fdecea" stroke="#b91c1c" stroke-width="1.5"/><text x="715.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">4. Exit Cost — Вартість виходу (Lock-in Cost)</tspan><tspan x="715.0" dy="16.9">• Переписування протекших абстракцій</tspan><tspan x="715.0" dy="16.9">• Egress-мито за виведення даних із хмари</tspan><tspan x="715.0" dy="16.9">• Заміна пропрацевих API й інфраструктури</tspan><tspan x="715.0" dy="16.9">• Ризик банкрутства або зміни умов вендора</tspan></text>
<line x1="450.0" y1="130.0" x2="510.0" y2="130.0" stroke="#111827" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="240.0" y1="200.0" x2="240.0" y2="245.0" stroke="#111827" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="715.0" y1="200.0" x2="715.0" y2="245.0" stroke="#111827" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="510.0" y1="315.0" x2="450.0" y2="315.0" stroke="#111827" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>