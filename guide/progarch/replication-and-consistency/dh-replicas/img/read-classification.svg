<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкол читань: «чи мусить побачити свій свіжий запис?»</text>
<rect x="430.0" y="62.0" width="300.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">читання про дім</tspan></text>
<line x1="540.0" y1="112.0" x2="300.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="620.0" y1="112.0" x2="860.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="150.0" x2="580.0" y2="476.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="70.0" y="158.0" width="400.0" height="52.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="188.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">На ЛІДЕРА · read-your-writes</tspan></text>
<text x="270.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">• стан пристрою одразу</tspan><tspan x="270.0" dy="21.0">  після власної зміни</tspan><tspan x="270.0" dy="21.0">• стан замка — безпека</tspan></text>
<text x="270.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">вузька, дорога купа</text>
<rect x="70.0" y="374.0" width="400.0" height="92.0" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ЛІДЕР · липке-після-запису:</tspan><tspan x="270.0" dy="16.9">свіже — лише короткий час</tspan><tspan x="270.0" dy="16.9">і лише самому писареві</tspan></text>
<rect x="690.0" y="158.0" width="400.0" height="52.0" rx="6" fill="#fdf0dd" stroke="#b06d0a" stroke-width="1.5"/><text x="890.0" y="188.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">На ФОЛОВЕРИ · лаг стерпний</tspan></text>
<text x="890.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">• телеметрія, графіки, історія</tspan><tspan x="890.0" dy="21.0">• лічильники й агрегати</tspan><tspan x="890.0" dy="21.0">• реєстр (ще й кешований)</tspan><tspan x="890.0" dy="21.0">• стан ЧУЖОГО дому</tspan></text>
<text x="890.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">широка, дешева купа — тримає масштаб</text>
<rect x="690.0" y="384.0" width="400.0" height="82.0" rx="6" fill="#fdf0dd" stroke="#b06d0a" stroke-width="1.5"/><text x="890.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">ФОЛОВЕРИ · сесія → та сама копія</tspan><tspan x="890.0" dy="16.9">(монотонні читання: час не йде назад)</tspan></text>
<rect x="70.0" y="502.0" width="1020.0" height="66.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Не «сильно скрізь», а поіменно. Ліва купа — тільки те, де власний свіжий запис чи безпека вимагають лідера.</tspan><tspan x="580.0" dy="16.9">Права — усе, що терпить кілька секунд минулого, і саме вона через фоловери розвантажує лідера.</tspan></text>
</svg>