<rect x="28.0" y="496.0" width="1158.0" height="56.0" rx="6" fill="#eef2f6" stroke="#6b7280" stroke-width="1.5"/><text x="607.0" y="520.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Запис «off» живий на лідері з t0, але перечитування о +300 мс попало на фоловер, що догнав лідера лише о +Δ.</tspan><tspan x="607.0" dy="16.9">Читання пішло в минуле твіна й показало ON, старший за дію користувача. Баг живе рівно у вікні лагу.</tspan></text>
