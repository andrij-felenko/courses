<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 512" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="512" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонка відкликання: чому шлях доступу мусить бути строгим</text>
<line x1="320.0" y1="100.0" x2="320.0" y2="410.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<line x1="560.0" y1="100.0" x2="560.0" y2="410.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<rect x="185.0" y="72.0" width="270.0" height="38.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="320.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">T0: власник відкликає доступ</tspan></text>
<rect x="425.0" y="72.0" width="270.0" height="38.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="560.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">T1: підрядник тягне двері</tspan></text>
<rect x="320.0" y="331.0" width="480.0" height="48.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.0"/>
<text x="420.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">репліка ще каже «дозволено»</text>
<line x1="800.0" y1="331.0" x2="800.0" y2="395.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="806.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">T2: репліка</text>
<text x="806.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">наздогнала</text>
<line x1="190.0" y1="205.0" x2="720.0" y2="205.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="70.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Строгий</text>
<text x="70.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">шлях</text>
<circle cx="560.0" cy="205.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="582.0" y="175.0" width="190.0" height="60.0" rx="6" fill="#ffffff" stroke="#d5d8dc" stroke-width="1.5"/><text x="677.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="677.0" dy="0.0">звіряється з авторитетом</tspan><tspan x="677.0" dy="15.6">(лідер / кворум):</tspan><tspan x="677.0" dy="15.6">бачить відкликання</tspan></text>
<rect x="830.0" y="178.9" width="160.0" height="52.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="910.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e7a45" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">ВІДМОВА</tspan><tspan x="910.0" dy="18.2">(безпечно)</tspan></text>
<line x1="190.0" y1="355.0" x2="720.0" y2="355.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="70.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Зрештою:</text>
<text x="70.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">застаріла</text>
<text x="70.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">репліка</text>
<circle cx="560.0" cy="355.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<rect x="582.0" y="389.0" width="200.0" height="46.0" rx="6" fill="#ffffff" stroke="#f0cfca" stroke-width="1.5"/><text x="682.0" y="408.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="682.0" dy="0.0">читає ближчу репліку:</tspan><tspan x="682.0" dy="15.6">ще «дозволено»</tspan></text>
<rect x="830.0" y="328.9" width="160.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="350.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">ДВЕРІ</tspan><tspan x="910.0" dy="18.2">ВІДЧИНЯЮТЬСЯ</tspan></text>
<rect x="70.0" y="452.0" width="920.0" height="40.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="530.0" y="475.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">Той самий момент, дві дороги читання. Строгий шлях звіряється з авторитетом і відмовляє; читання застарілої репліки впускає відкликаного — тому шлях доступу тримаємо строгим.</tspan></text>
</svg>