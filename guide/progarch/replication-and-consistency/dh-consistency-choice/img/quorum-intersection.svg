<svg xmlns="http://www.w3.org/2000/svg" viewBox="-66.25 -10 1212.5 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-66.25" y="-10" width="1212.5" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетин кворумів: чому строге читання ловить відкликання</text>
<rect x="70.0" y="48.0" width="940.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="71.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">N = 3 копії  ·  W = 2 (запис)  ·  R = 2 (читання)   →   R + W = 4 &gt; 3   →   кожен кворум читання перетинає кожен кворум запису</tspan></text>
<rect x="435.0" y="178.0" width="210.0" height="182.0" rx="8" fill="#eafaf1" stroke="#eafaf1" stroke-width="1.0"/>
