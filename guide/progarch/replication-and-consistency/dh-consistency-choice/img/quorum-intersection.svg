<text x="540.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">grant …:pidryadnyk</text>
<text x="540.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">grant = false</text>
<rect x="480.0" y="303.8" width="120.0" height="32.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a45" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">v2 · свіже</tspan></text>
<rect x="725.0" y="210.0" width="210.0" height="130.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="830.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">E · край (біля дверей)</text>
<text x="830.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">grant …:pidryadnyk</text>
<text x="830.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">grant = true</text>
