<text x="685.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e7a45" text-anchor="middle" font-weight="700">кворум читання R=2  (навмисне без лідера)</text>
<rect x="145.0" y="424.0" width="790.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e7a45" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Строге читання {B, E}:  max(v2, v1) = v2 = false  →  ВІДМОВА (безпечно)</tspan></text>
<rect x="145.0" y="478.0" width="790.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Зрештою, лише E:  v1 = true  →  ВІДЧИНЯЄ (відкликаного впущено)</tspan></text>
<rect x="70.0" y="540.0" width="940.0" height="56.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="540.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="540.0" dy="0.0">Будь-які R копій перетинають будь-які W (Gifford, 1979): у наборі {B, E} копія B несе відкликання v2, тож строге читання ловить його навіть без лідера. Версії кажуть, котра копія свіжа. Одну ж застарілу копію E, прочитану наодинці, ніщо не поправить — вона впускає.</tspan></text>
</svg>