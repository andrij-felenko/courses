<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий обхід: наказ падає — важелі тримають</text>
<rect x="60.0" y="44.0" width="820.0" height="40.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.3"/><text x="470.0" y="68.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">DH: панель-сквад хоче писати SQL прямо в Postgres — в обхід інтерфейсу TelemetryStore</tspan></text>
<text x="240.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НАКАЗ</text>
<rect x="60.0" y="128.0" width="360.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="240.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">«Заборонено. Ходіть</tspan><tspan x="240.0" dy="16.9">через інтерфейс.»</tspan></text>
<line x1="240.0" y1="200.0" x2="240.0" y2="236.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="238.0" width="360.0" height="78.0" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.6"/><text x="240.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">цього разу послухались —</tspan><tspan x="240.0" dy="15.6">за тиждень прямий SQL повернувся,</tspan><tspan x="240.0" dy="15.6">тепер тихцем</tspan></text>
<text x="240.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">✗  правило живе, поки ти дивишся</text>
<line x1="470.0" y1="104.0" x2="470.0" y2="420.0" stroke="#dfe3e8" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="700.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ВПЛИВ</text>
<rect x="520.0" y="128.0" width="360.0" height="56.0" rx="8" fill="#fff6e0" stroke="#b8862f" stroke-width="1.7"/>
<text x="532.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8862f" text-anchor="start" font-weight="700">Слухаю</text>
<text x="532.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">їм пекти звіт до пʼятниці; інтерфейс — зайвий гак</text>
<rect x="520.0" y="194.0" width="360.0" height="56.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/>
<text x="532.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Валюта</text>
<text x="532.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">«зʼїдемо з Postgres — упаде ТВІЙ звіт, о 2-й ночі»</text>
<rect x="520.0" y="260.0" width="360.0" height="56.0" rx="8" fill="#e6f5f2" stroke="#2f9e8f" stroke-width="1.7"/>
<text x="532.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2f9e8f" text-anchor="start" font-weight="700">Мощу дорогу</text>
<text x="532.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">додаю energyByPeriod() у TelemetryStore — прямий SQL не потрібен</text>
<rect x="520.0" y="326.0" width="360.0" height="56.0" rx="8" fill="#f3edfb" stroke="#7a4ea8" stroke-width="1.7"/>
<text x="532.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4ea8" text-anchor="start" font-weight="700">Механізм</text>
<text x="532.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">перевірка валить білд на import «pg» поза storage/</text>
<text x="700.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓  тримається без тебе — і для всіх однаково</text>
</svg>