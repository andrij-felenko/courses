<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкат межі фазами: стіни першого дня не буває</text>
<rect x="34.0" y="56.0" width="212.0" height="34.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.8"/><text x="140.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1 · Тихо</tspan></text>
<rect x="34.0" y="100.0" width="212.0" height="128.0" rx="6" fill="#fbfbfc" stroke="#e3e6ea" stroke-width="1.3"/><text x="140.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">перевірка рахує</tspan><tspan x="140.0" dy="16.2">й пише в лог —</tspan><tspan x="140.0" dy="16.2">у білд не лізе</tspan></text>
<rect x="34.0" y="242.0" width="212.0" height="40.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.7"/><text x="140.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">білд не чіпаємо</tspan></text>
<rect x="270.0" y="56.0" width="212.0" height="34.0" rx="6" fill="#fff6e0" stroke="#b8862f" stroke-width="1.8"/><text x="376.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="376.0" dy="0.0">2 · Попередження</tspan></text>
<rect x="270.0" y="100.0" width="212.0" height="128.0" rx="6" fill="#fbfbfc" stroke="#e3e6ea" stroke-width="1.3"/><text x="376.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">друкує список,</tspan><tspan x="376.0" dy="16.2">мощену дорогу,</tspan><tspan x="376.0" dy="16.2">лінк на ADR</tspan></text>
<rect x="270.0" y="242.0" width="212.0" height="40.0" rx="6" fill="#e9f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="376.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="376.0" dy="0.0">білд ЗЕЛЕНИЙ</tspan></text>
<rect x="506.0" y="56.0" width="212.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="612.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">3 · Заморозка</tspan></text>
<rect x="506.0" y="100.0" width="212.0" height="128.0" rx="6" fill="#fbfbfc" stroke="#e3e6ea" stroke-width="1.3"/><text x="612.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">наявні — у базі;</tspan><tspan x="612.0" dy="16.2">ворота лише на</tspan><tspan x="612.0" dy="16.2">НОВИЙ обхід</tspan></text>
<rect x="506.0" y="242.0" width="212.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="612.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">червоний на нове</tspan></text>
<rect x="742.0" y="56.0" width="212.0" height="34.0" rx="6" fill="#e9f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="848.0" y="77.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="848.0" dy="0.0">4 · Чистий гейт</tspan></text>
<rect x="742.0" y="100.0" width="212.0" height="128.0" rx="6" fill="#fbfbfc" stroke="#e3e6ea" stroke-width="1.3"/><text x="848.0" y="152.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="848.0" dy="0.0">база осушена —</tspan><tspan x="848.0" dy="16.2">будь-який обхід</tspan><tspan x="848.0" dy="16.2">червоний, для всіх</tspan></text>
<rect x="742.0" y="242.0" width="212.0" height="40.0" rx="6" fill="#e9f6ee" stroke="#27ae60" stroke-width="1.7"/><text x="848.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="848.0" dy="0.0">повний гейт</tspan></text>
<line x1="34.0" y1="308.0" x2="954.0" y2="308.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">фази розгортання — зліва направо, кожна дозріваліша за попередню</text>
</svg>