<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що вважали архітектурою: зсув 1992 → 2005</text>
<line x1="450.0" y1="50.0" x2="450.0" y2="408.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="225.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1992 · Перрі й Вульф</text>
<text x="675.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2004–2005 · Бош і Янсен</text>
<rect x="155.7" y="110.0" width="138.6" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="225.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">СТРУКТУРА</tspan><tspan x="225.0" dy="16.9">елементи · форма</tspan></text>
<line x1="225.0" y1="163.0" x2="225.0" y2="222.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 5"/>
<rect x="144.6" y="225.1" width="160.8" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="225.0" dy="0.0">обґрунтування</tspan><tspan x="225.0" dy="16.9">«чому» — третя нога</tspan></text>
<text x="225.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="225.0" dy="0.0">«Чому» назвали — та лишили примітивом.</tspan><tspan x="225.0" dy="16.2">Втратив його → дрейф і ерозія.</tspan></text>
<rect x="583.5" y="110.0" width="183.0" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">НАБІР РІШЕНЬ</tspan><tspan x="675.0" dy="16.9">перша-класний артефакт</tspan></text>
<line x1="675.0" y1="163.0" x2="675.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="598.3" y="225.1" width="153.4" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="675.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="675.0" dy="0.0">структура</tspan><tspan x="675.0" dy="16.9">= лише слід рішень</tspan></text>
<text x="675.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="675.0" dy="0.0">Рішення — тіло архітектури.</tspan><tspan x="675.0" dy="16.2">Не спіймав одразу → випаровується.</tspan></text>
</svg>