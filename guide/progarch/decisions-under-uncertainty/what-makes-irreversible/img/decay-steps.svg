<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотність спадає не рівно, а сходинками</text>
<line x1="90.0" y1="360.0" x2="800.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="360.0" x2="90.0" y2="60.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="96.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вартість відкату</text>
<text x="794.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час · накопичене →</text>
<polyline points="100,350 200,340 300,318 300,250 400,238 470,224 470,162 560,150 620,140 620,86 700,78 760,72" fill="none" stroke="#2457d6" stroke-width="3"/>
<text x="112.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">сходинки — переступи межі досяжності:</text>
<text x="112.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">① перший зовнішній споживач</text>
<text x="112.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">② перша сусідня команда</text>
<text x="112.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">③ перший відвантажений пристрій</text>
<circle cx="283.0" cy="284.0" r="10.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="283.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">①</text>
<circle cx="452.0" cy="193.0" r="10.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="452.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">②</text>
<circle cx="602.0" cy="113.0" r="10.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="602.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">③</text>
<line x1="268.0" y1="322.0" x2="268.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="268.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">останній відповідальний момент</text>
<text x="268.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">далі двері грюкають сходинками</text>
<text x="190.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15703b" text-anchor="middle">двобічні — дешево</text>
<text x="690.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">однобічні — за сходинками</text>
</svg>