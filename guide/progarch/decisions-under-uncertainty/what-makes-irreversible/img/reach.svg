<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незворотність = наскільки далеко сягнуло рішення</text>
<line x1="40.0" y1="432.0" x2="40.0" y2="66.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">важче</text>
<rect x="54.0" y="60.0" width="660.0" height="376.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="384.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">розгорнуте у світ, видалене — вороття вже нема</text>
<rect x="110.0" y="104.0" width="548.0" height="332.0" rx="10" fill="#fef3e2" stroke="#d98324" stroke-width="1.8"/>
<text x="384.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a8631a" text-anchor="middle">публічні контракти — вже поза твоєю владою</text>
<rect x="163.0" y="148.0" width="442.0" height="288.0" rx="10" fill="#fbf6e0" stroke="#b8a51e" stroke-width="1.8"/>
<text x="384.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a7b12" text-anchor="middle">інші команди — потрібне узгодження, не коміт</text>
<rect x="215.0" y="192.0" width="338.0" height="244.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="384.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">накопичені дані — тяжіння, жива міграція</text>
<rect x="332.7" y="322.1" width="102.6" height="51.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="384.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="384.0" dy="0.0">твій код</tspan><tspan x="384.0" dy="16.9">(рефактор)</tspan></text>
<text x="384.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">від осереддя назовні: більше накопичено й далі від одноосібної влади — дорожчий відкат</text>
</svg>