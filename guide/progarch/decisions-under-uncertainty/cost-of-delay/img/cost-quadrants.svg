<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робити: вартість помилки × вартість зволікання</text>
<text x="388.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПОМИЛКА ДЕШЕВА</text>
<text x="388.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(рішення легко відкотити)</text>
<text x="680.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА ДОРОГА</text>
<text x="680.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(відкотити важко чи незворотно)</text>
<text x="120.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗВОЛІКАННЯ</text>
<text x="120.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДОРОГЕ</text>
<text x="120.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(команда чекає,</text>
<text x="120.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">цінність тече)</text>
<text x="120.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЗВОЛІКАННЯ</text>
<text x="120.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ДЕШЕВЕ</text>
<text x="120.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(ніщо не блокує)</text>
<rect x="250.0" y="96.0" width="276.0" height="176.0" rx="12" fill="#fbfcfd" stroke="#2457d6" stroke-width="2.2"/>
<text x="388.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Вирішуй ШВИДКО</text>
<text x="388.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">двобічні двері, але час пече</text>
<line x1="270.0" y1="162.0" x2="506.0" y2="162.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="266.0" y="174.0" width="244.0" height="80.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="388.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">обери й рухайся; помилишся — відкотиш дешево</tspan></text>
<rect x="542.0" y="96.0" width="276.0" height="176.0" rx="12" fill="#fbfcfd" stroke="#c0392b" stroke-width="2.2"/>
<text x="680.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ЗМІНИ ГРУ</text>
<text x="680.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не можна ні чекати, ні схибити</text>
<line x1="562.0" y1="162.0" x2="798.0" y2="162.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="558.0" y="174.0" width="244.0" height="80.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="680.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">здешеви помилку (інтерфейс, зворотний крок)</tspan><tspan x="680.0" dy="10.4">або зволікання (walking skeleton) — і повернись</tspan></text>
<rect x="250.0" y="288.0" width="276.0" height="176.0" rx="12" fill="#fbfcfd" stroke="#6b7280" stroke-width="2.2"/>
<text x="388.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Не думай довго</text>
<text x="388.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дрібниця в обидва боки</text>
<line x1="270.0" y1="354.0" x2="506.0" y2="354.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="266.0" y="366.0" width="244.0" height="80.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="388.0" y="408.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">кинь монетку, лиши на потім; нарада коштує більше</tspan></text>
<rect x="542.0" y="288.0" width="276.0" height="176.0" rx="12" fill="#fbfcfd" stroke="#27ae60" stroke-width="2.2"/>
<text x="680.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">КУПУЙ ІНФОРМАЦІЮ</text>
<text x="680.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дорого схибити, але ніщо не пече</text>
<line x1="562.0" y1="354.0" x2="798.0" y2="354.0" stroke="#dfe4e9" stroke-width="1.2"/>
<rect x="558.0" y="366.0" width="244.0" height="80.0" rx="6" fill="#ffffff" stroke="#eef1f4" stroke-width="1.5"/><text x="680.0" y="403.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">тягни до останнього відповідального моменту,</tspan><tspan x="680.0" dy="11.7">роби спайк, збирай факти</tspan></text>
<rect x="250.0" y="482.0" width="568.0" height="48.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="534.0" y="508.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">Найдорожча помилка архітектора — сплутати клітинки: місяцями обговорювати те, що дешево відкотити (лівий верх), і похапцем ставити незворотну ставку (правий низ).</tspan></text>
</svg>