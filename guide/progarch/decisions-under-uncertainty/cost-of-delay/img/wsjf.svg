<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга рішень: сортуй за CoD на одиницю тривалості (WSJF)</text>
<rect x="60.0" y="78.0" width="250.0" height="118.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="185.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ТЕЛЕМЕТРІЯ</text>
<text x="185.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">CoD 4000 €/тиж · 2 тиж</text>
<line x1="78.0" y1="152.0" x2="292.0" y2="152.0" stroke="#dfe4e9" stroke-width="1.2"/>
<text x="185.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">WSJF = 4000 / 2 = 2000</text>
<rect x="325.0" y="78.0" width="250.0" height="118.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="450.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">АВТЕНТИФІКАЦІЯ</text>
<text x="450.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">CoD 1500 €/тиж · 1 тиж</text>
<line x1="343.0" y1="152.0" x2="557.0" y2="152.0" stroke="#dfe4e9" stroke-width="1.2"/>
<text x="450.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">WSJF = 1500 / 1 = 1500</text>
<rect x="590.0" y="78.0" width="250.0" height="118.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="715.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">БІЛІНГ</text>
<text x="715.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">CoD 6000 €/тиж · 6 тиж</text>
<line x1="608.0" y1="152.0" x2="822.0" y2="152.0" stroke="#dfe4e9" stroke-width="1.2"/>
<text x="715.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">WSJF = 6000 / 6 = 1000</text>
<text x="90.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Сумарна вартість зволікання за весь розбір черги (та сама робота, різний порядок):</text>
<line x1="380.0" y1="292.0" x2="380.0" y2="410.0" stroke="#c8ced6" stroke-width="1.4"/>
<text x="364.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">порядок WSJF: 2000 → 1500 → 1000</text>
<rect x="380.0" y="289.0" width="347.3" height="46.0" rx="5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="739.3" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">66 500 €</text>
<text x="364.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">спершу найбільша CoD: білінг першим</text>
<rect x="380.0" y="361.0" width="425.6" height="46.0" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="817.6" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">81 500 €</text>
<rect x="90.0" y="452.0" width="720.0" height="44.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="450.0" y="476.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вирішує не найбільша CoD, а CoD на одиницю тривалості. Білінг найдорожчий у зволіканні, та такий довгий, що пропускає вперед двох коротших — і сумарна втрата падає на 15 000 €.</tspan></text>
</svg>