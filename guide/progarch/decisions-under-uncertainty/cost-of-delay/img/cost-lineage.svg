<line x1="690.0" y1="339.0" x2="690.0" y2="390.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="690.0" y1="480.0" x2="690.0" y2="503.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="505.0" width="680.0" height="62.0" rx="6" fill="#fff8e8" stroke="#c9a93b" stroke-width="1.5"/><text x="460.0" y="532.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Дві ціни на одній шкалі:</tspan><tspan x="460.0" dy="16.9">вартість зволікання (за тиждень) × цінність інформації (за розвідку)</tspan></text>
