<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки, що дали ціну зволіканню й знанню</text>
<text x="250.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ТЕОРІЯ РІШЕНЬ</text>
<text x="250.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціна знання</text>
<text x="690.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">РОЗРОБКА ПРОДУКТУ</text>
<text x="690.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціна зволікання</text>
<rect x="85.0" y="108.0" width="330.0" height="96.0" rx="6" fill="#eef3fe" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Рональд Говард · Стенфорд, 1966</tspan><tspan x="250.0" dy="16.9">«Цінність інформації»: скільки</tspan><tspan x="250.0" dy="16.9">розумно платити за розвідку —</tspan><tspan x="250.0" dy="16.9">і тут-таки «аналіз рішень»</tspan></text>
<line x1="250.0" y1="210.0" x2="250.0" y2="494.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,6"/>
<line x1="250.0" y1="494.0" x2="250.0" y2="503.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="120.0" width="340.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Дон Райнертсен · McKinsey, 1983</tspan><tspan x="690.0" dy="16.9">Уперше число під запізненням:</tspan><tspan x="690.0" dy="16.9">пів року ≈ мінус третина прибутку</tspan></text>
<rect x="520.0" y="255.0" width="340.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Managing the Design Factory · 1997</tspan><tspan x="690.0" dy="16.9">Продукт — фабрика з чергами;</tspan><tspan x="690.0" dy="16.9">зволікання стає важелем</tspan></text>
<rect x="520.0" y="390.0" width="340.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Principles of Product Dev Flow, 2009</tspan><tspan x="690.0" dy="16.9">«Квантуй лише одне — квантуй</tspan><tspan x="690.0" dy="16.9">вартість зволікання»; 85% не знають</tspan></text>
