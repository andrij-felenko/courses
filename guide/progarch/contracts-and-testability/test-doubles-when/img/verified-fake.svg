<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірений фейк: контракт тримає підробку чесною</text>
<rect x="320.0" y="74.0" width="320.0" height="66.0" rx="6" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="480.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">один контрактний набір</text>
<text x="480.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тих самих перевірок для обох</text>
<line x1="430.0" y1="142.0" x2="230.0" y2="204.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="530.0" y1="142.0" x2="730.0" y2="204.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="210.0" width="300.0" height="92.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">фейк — у пам'яті</text>
<text x="230.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">швидкий, у тесті</text>
<text x="230.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">МУСИТЬ пройти набір</text>
<rect x="580.0" y="210.0" width="300.0" height="92.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="730.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">справжнє — адаптер</text>
<text x="730.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">повільне, у бою</text>
<text x="730.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">МУСИТЬ пройти набір</text>
<rect x="210.0" y="336.0" width="540.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">обидва шанують той самий контракт → фейк не дрейфує</text>
<text x="480.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">без спільного набору фейк тихо розходиться з боєм — і зелений тест бреше</text>
</svg>