<text x="500.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(робочий артефакт — один файл)</text>
<rect x="360.0" y="118.0" width="280.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="500.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">СИНТАКСИС — типи й підписи</text>
