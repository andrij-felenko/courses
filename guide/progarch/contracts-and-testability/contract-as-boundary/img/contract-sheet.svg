<text x="827.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="827.0" dy="0.0">спирається ЛИШЕ</tspan><tspan x="827.0" dy="15.0">на ці обіцянки</tspan></text>
