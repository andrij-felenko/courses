<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="402" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить борг рішенням, а не аварією</text>
<rect x="24.0" y="46.0" width="208.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="128.0" y="65.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="128.0" dy="0.0">Властивість</tspan><tspan x="128.0" dy="16.9">боргу</tspan></text>
<rect x="244.0" y="46.0" width="306.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="397.0" y="65.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="397.0" dy="0.0">Рішення</tspan><tspan x="397.0" dy="16.9">(керований борг)</tspan></text>
<rect x="562.0" y="46.0" width="316.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="65.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Аварія</tspan><tspan x="720.0" dy="16.9">(некерований борг)</tspan></text>
<rect x="24.0" y="98.0" width="208.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="128.0" y="135.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="128.0" dy="0.0">Названо?</tspan></text>
<rect x="244.0" y="98.0" width="306.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="397.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">записано в журнал —</tspan><tspan x="397.0" dy="15.6">борг видно й можна зважити</tspan></text>
<rect x="562.0" y="98.0" width="316.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">ніхто не записав —</tspan><tspan x="720.0" dy="15.6">борг тихо стає ерозією</tspan></text>
<rect x="24.0" y="170.0" width="208.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="128.0" y="207.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="128.0" dy="0.0">Обмежено?</tspan></text>
<rect x="244.0" y="170.0" width="306.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="397.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">увесь борг за одним швом —</tspan><tspan x="397.0" dy="15.6">відсоток в одному місці</tspan></text>
<rect x="562.0" y="170.0" width="316.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">розмазано по коду —</tspan><tspan x="720.0" dy="15.6">відсоток капає скрізь</tspan></text>
<rect x="24.0" y="242.0" width="208.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="128.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="128.0" dy="0.0">Має строк?</tspan></text>
<rect x="244.0" y="242.0" width="306.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="397.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">тригер погашення:</tspan><tspan x="397.0" dy="15.6">настане умова — гасимо</tspan></text>
<rect x="562.0" y="242.0" width="316.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">строку немає —</tspan><tspan x="720.0" dy="15.6">«тимчасове» живе роками</tspan></text>
<rect x="24.0" y="314.0" width="208.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="128.0" y="351.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="128.0" dy="0.0">Погашуваний?</tspan></text>
<rect x="244.0" y="314.0" width="306.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="397.0" y="343.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">тести тримають поведінку —</tspan><tspan x="397.0" dy="15.6">відкотити дешево</tspan></text>
<rect x="562.0" y="314.0" width="316.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="343.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">коду без тестів не чіпають —</tspan><tspan x="720.0" dy="15.6">борг не віддати</tspan></text>
</svg>