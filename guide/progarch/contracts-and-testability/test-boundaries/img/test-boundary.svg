<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень тесту — це радіус кола навколо справжнього коду</text>
<rect x="250.0" y="120.0" width="520.0" height="330.0" rx="6" fill="#fdf3ea" stroke="#c0392b" stroke-width="2.4"/>
<text x="262.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">НАСКРІЗНИЙ (E2E)</text>
<rect x="315.0" y="178.0" width="390.0" height="214.0" rx="6" fill="#eef2f6" stroke="#2457d6" stroke-width="2.2"/>
<text x="327.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ІНТЕГРАЦІЙНИЙ</text>
<rect x="390.0" y="232.0" width="240.0" height="104.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="402.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">МОДУЛЬНИЙ</text>
<text x="510.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">decide()</text>
<text x="510.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+ справжній адаптер давача, справжня БД</text>
<text x="510.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">+ весь хаб, справжня розетка, реальний HTTP</text>
<text x="28.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="28.0" dy="0.0">ближче до центра —</tspan><tspan x="28.0" dy="15.5">менше справжнього коду:</tspan><tspan x="28.0" dy="15.5">швидко, точно вказує</tspan><tspan x="28.0" dy="15.5">на винуватця; але тест</tspan><tspan x="28.0" dy="15.5">спирається на припущення</tspan><tspan x="28.0" dy="15.5">про сусідів (дублери)</tspan></text>
<text x="792.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="792.0" dy="0.0">далі від центра —</tspan><tspan x="792.0" dy="15.5">більше справжнього коду:</tspan><tspan x="792.0" dy="15.5">більше певності в системі;</tspan><tspan x="792.0" dy="15.5">але повільніше, крихкіше</tspan><tspan x="792.0" dy="15.5">й гірше локалізує збій</tspan></text>
<line x1="510.0" y1="486.0" x2="330.0" y2="486.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="486.0" x2="690.0" y2="486.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="322.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">менше справжнього</text>
<text x="698.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">більше справжнього</text>
</svg>