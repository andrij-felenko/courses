<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири колони ілюзії віртуальної пам'яті</text>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири колони ілюзії віртуальної пам'яті</text>
<rect x="36.0" y="75.0" width="220.0" height="560.0" rx="8" fill="#ffffff" stroke="#2b5c92" stroke-width="1.6"/>
<rect x="44.0" y="85.0" width="204.0" height="52.0" rx="6" fill="#2b5c92" stroke="#333333" stroke-width="1.5"/><text x="146.0" y="107.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="146.0" dy="0.0">1. Простір і ділянки</tspan><tspan x="146.0" dy="16.9">(Ядро: mm_struct, VMA)</tspan></text>
<text x="146.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">Карта намірів процесу</text>
<rect x="48.0" y="171.0" width="196.0" height="38.0" rx="4" fill="#eef4fb" stroke="#ccd4dc" stroke-width="1.0"/><text x="146.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">Стек (r/w)</tspan></text>
<rect x="48.0" y="217.0" width="196.0" height="38.0" rx="4" fill="#eef4fb" stroke="#ccd4dc" stroke-width="1.0"/><text x="146.0" y="239.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">mmap / бібліотеки (r-x, r--)</tspan></text>
<rect x="48.0" y="263.0" width="196.0" height="38.0" rx="4" fill="#eef4fb" stroke="#ccd4dc" stroke-width="1.0"/><text x="146.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">Купа / brk (r/w)</tspan></text>
<rect x="48.0" y="309.0" width="196.0" height="38.0" rx="4" fill="#eef4fb" stroke="#ccd4dc" stroke-width="1.0"/><text x="146.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">Сегменти ELF (код r-x, дані r/w)</tspan></text>
<rect x="48.0" y="355.0" width="196.0" height="46.0" rx="4" fill="#fdeeec" stroke="#ccd4dc" stroke-width="1.0"/><text x="146.0" y="374.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">Дірки між ділянками</tspan><tspan x="146.0" dy="15.6">(неіснуюча пам'ять)</tspan></text>
<rect x="44.0" y="525.0" width="204.0" height="100.0" rx="4" fill="#f4f6f8" stroke="#d0d6dc" stroke-width="0.8"/><text x="146.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="146.0" dy="0.0">Описує, що процесові</tspan><tspan x="146.0" dy="14.3">ДОЗВОЛЕНО робити.</tspan><tspan x="146.0" dy="14.3">Пам'яті під ділянки може</tspan><tspan x="146.0" dy="14.3">ще не бути взагалі.</tspan></text>
<line x1="258.0" y1="315.0" x2="280.0" y2="315.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="282.0" y="75.0" width="220.0" height="560.0" rx="8" fill="#ffffff" stroke="#8d6b14" stroke-width="1.6"/>
<rect x="290.0" y="85.0" width="204.0" height="52.0" rx="6" fill="#8d6b14" stroke="#333333" stroke-width="1.5"/><text x="392.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">2. Багаторівнева таблиця</tspan><tspan x="392.0" dy="15.6">(Дерево PGD..PTE)</tspan></text>
<text x="392.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">Розріджений перекладач</text>
<rect x="294.0" y="171.0" width="196.0" height="38.0" rx="4" fill="#fef9e7" stroke="#ccd4dc" stroke-width="1.0"/><text x="392.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">CR3 (корінь у DRAM)</tspan></text>
<rect x="294.0" y="217.0" width="196.0" height="38.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="392.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">PGD (512 записів)</tspan></text>
<rect x="294.0" y="263.0" width="196.0" height="38.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="392.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">PUD (512 записів)</tspan></text>
<rect x="294.0" y="309.0" width="196.0" height="38.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="392.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">PMD (512 записів)</tspan></text>
<rect x="294.0" y="355.0" width="196.0" height="38.0" rx="4" fill="#eafaf0" stroke="#ccd4dc" stroke-width="1.0"/><text x="392.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">PTE (номер кадру + біти P/W/U)</tspan></text>
<rect x="290.0" y="525.0" width="204.0" height="100.0" rx="4" fill="#f4f6f8" stroke="#d0d6dc" stroke-width="0.8"/><text x="392.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="392.0" dy="0.0">Перекладає віртуальну</tspan><tspan x="392.0" dy="14.3">сторінку у фізичний кадр.</tspan><tspan x="392.0" dy="14.3">Порожні гілки дерева</tspan><tspan x="392.0" dy="14.3">не займають RAM.</tspan></text>
<line x1="504.0" y1="315.0" x2="526.0" y2="315.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="528.0" y="75.0" width="220.0" height="560.0" rx="8" fill="#ffffff" stroke="#1b7a42" stroke-width="1.6"/>
<rect x="536.0" y="85.0" width="204.0" height="52.0" rx="6" fill="#1b7a42" stroke="#333333" stroke-width="1.5"/><text x="638.0" y="107.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="638.0" dy="0.0">3. Апаратний MMU + TLB</tspan><tspan x="638.0" dy="16.9">(Процесор: Fast Path)</tspan></text>
<text x="638.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">Миттєвий виконавець</text>
<rect x="540.0" y="171.0" width="196.0" height="46.0" rx="4" fill="#eafaf0" stroke="#ccd4dc" stroke-width="1.0"/><text x="638.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">L1 / L2 TLB кеш</tspan><tspan x="638.0" dy="15.6">(трансляція за 1 такт)</tspan></text>
<rect x="540.0" y="225.0" width="196.0" height="46.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="638.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">MMU Page Walker</tspan><tspan x="638.0" dy="15.6">(апаратний обхід дерева)</tspan></text>
<rect x="540.0" y="279.0" width="196.0" height="46.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="638.0" y="298.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">Контроль прав</tspan><tspan x="638.0" dy="15.6">(User/Supervisor, W, NX)</tspan></text>
<rect x="540.0" y="333.0" width="196.0" height="46.0" rx="4" fill="#fdeeec" stroke="#ccd4dc" stroke-width="1.0"/><text x="638.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">Виняток #PF (Vector 14)</tspan><tspan x="638.0" dy="15.6">(якщо P=0 або порушення)</tspan></text>
<rect x="536.0" y="525.0" width="204.0" height="100.0" rx="4" fill="#f4f6f8" stroke="#d0d6dc" stroke-width="0.8"/><text x="638.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="638.0" dy="0.0">Виконує переклад апаратно</tspan><tspan x="638.0" dy="14.3">на кожному зверненні.</tspan><tspan x="638.0" dy="14.3">На TLB Hit не чіпає</tspan><tspan x="638.0" dy="14.3">шину пам'яті.</tspan></text>
<line x1="750.0" y1="315.0" x2="772.0" y2="315.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="774.0" y="75.0" width="220.0" height="560.0" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<rect x="782.0" y="85.0" width="204.0" height="52.0" rx="6" fill="#4a5568" stroke="#333333" stroke-width="1.5"/><text x="884.0" y="107.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="884.0" dy="0.0">4. Фізичні кадри</tspan><tspan x="884.0" dy="16.9">(DRAM: 4 КіБ рамки)</tspan></text>
<text x="884.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">Справжнє сховище</text>
<rect x="786.0" y="171.0" width="196.0" height="38.0" rx="4" fill="#f0f4ea" stroke="#ccd4dc" stroke-width="1.0"/><text x="884.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">Кадр А (анонімні дані)</tspan></text>
<rect x="786.0" y="217.0" width="196.0" height="38.0" rx="4" fill="#eafaf0" stroke="#ccd4dc" stroke-width="1.0"/><text x="884.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">Кадр Б (спільний код libc)</tspan></text>
<rect x="786.0" y="263.0" width="196.0" height="38.0" rx="4" fill="#f2f6fd" stroke="#ccd4dc" stroke-width="1.0"/><text x="884.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">Кадр В (кеш файлу / disk)</tspan></text>
<rect x="786.0" y="309.0" width="196.0" height="38.0" rx="4" fill="#fef9e7" stroke="#ccd4dc" stroke-width="1.0"/><text x="884.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">Кадр Г (zeroed page / COW)</tspan></text>
<rect x="786.0" y="355.0" width="196.0" height="38.0" rx="4" fill="#f8f9fa" stroke="#ccd4dc" stroke-width="1.0"/><text x="884.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">Вільні кадри (Buddy Allocator)</tspan></text>
<rect x="782.0" y="525.0" width="204.0" height="100.0" rx="4" fill="#f4f6f8" stroke="#d0d6dc" stroke-width="0.8"/><text x="884.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="884.0" dy="0.0">Фізичні мікросхеми DRAM</tspan><tspan x="884.0" dy="14.3">порізані на кадри 4 КіБ.</tspan><tspan x="884.0" dy="14.3">Сусідні віртуальні сторінки</tspan><tspan x="884.0" dy="14.3">розкидані хаотично.</tspan></text>
</svg>