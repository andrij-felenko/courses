<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари метрик пам'яті: від віртуальної карти до вартості звільнення</text>
<rect x="40.0" y="60.0" width="250.0" height="340.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="165.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віртуальний простір (VSZ / VIRT)</text>
<text x="165.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дозволені діапазони адрес (VMA)</text>
<rect x="55.0" y="120.0" width="220.0" height="50.0" rx="6" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Арени алокатора (по 64 МіБ)</tspan><tspan x="165.0" dy="14.3">Стеки потоків (по 8 МіБ)</tspan></text>
<rect x="55.0" y="180.0" width="220.0" height="50.0" rx="6" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Сторожові сторінки PROT_NONE</tspan><tspan x="165.0" dy="14.3">Розріджені відображення mmap</tspan></text>
<rect x="55.0" y="240.0" width="220.0" height="50.0" rx="6" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Тіньова пам'ять (ASan/санітайзери)</tspan><tspan x="165.0" dy="13.0">Незаселені сторінки в карті</tspan></text>
<rect x="55.0" y="300.0" width="220.0" height="85.0" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Заселена пам'ять (RSS / RES)</text>
<text x="165.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сторінки з чинним записом у PTE</text>
<text x="165.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фізично присутні в RAM кадри</text>
<line x1="295.0" y1="342.0" x2="335.0" y2="342.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="345.0" y="60.0" width="260.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="475.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розкладка RSS: PSS і USS</text>
<text x="475.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Поділ за винятковістю володіння</text>
<rect x="360.0" y="120.0" width="230.0" height="95.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="475.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">Спільні кадри (Shared / PSS)</text>
<text x="475.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Код libc, виконуваний бінарник</text>
<text x="475.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Спільна пам'ять, fork COW до запису</text>
<text x="475.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">У PSS входить як: 1/N кадру</text>
<rect x="360.0" y="230.0" width="230.0" height="155.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="475.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Виняткова пам'ять (USS)</text>
<text x="475.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кадри, де mapcount == 1 (лише цей процес)</text>
<rect x="370.0" y="285.0" width="210.0" height="42.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="475.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Private_Clean (файловий код/mmap)</tspan><tspan x="475.0" dy="13.0">Звільнення: миттєве (диск є)</tspan></text>
<rect x="370.0" y="335.0" width="210.0" height="42.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="475.0" y="353.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Private_Dirty (купа, стек, анонімні)</tspan><tspan x="475.0" dy="11.7">Звільнення: лише через своп/смерть</tspan></text>
<line x1="610.0" y1="356.0" x2="645.0" y2="356.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="655.0" y="60.0" width="190.0" height="340.0" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="750.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="700">Системний контекст</text>
<text x="750.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пам'ять поза RSS процесів</text>
<rect x="665.0" y="120.0" width="170.0" height="55.0" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="750.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Кеш сторінок (Page Cache)</tspan><tspan x="750.0" dy="13.0">Чисті сторінки файлів</tspan><tspan x="750.0" dy="13.0">(MemAvailable)</tspan></text>
<rect x="665.0" y="185.0" width="170.0" height="55.0" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="750.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Своп (Swap / zram)</tspan><tspan x="750.0" dy="13.0">Анонімні сторінки на диску</tspan><tspan x="750.0" dy="13.0">(не входить у RSS)</tspan></text>
<rect x="665.0" y="250.0" width="170.0" height="65.0" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="750.0" y="266.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Пам'ять ядра:</tspan><tspan x="750.0" dy="13.0">SReclaimable (dentry/inode)</tspan><tspan x="750.0" dy="13.0">SUnreclaim + PageTables</tspan><tspan x="750.0" dy="13.0">Стеки ядра + сокети</tspan></text>
<rect x="665.0" y="325.0" width="170.0" height="60.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Реальна ціна OOM:</tspan><tspan x="750.0" dy="13.0">Звільняється лише:</tspan><tspan x="750.0" dy="13.0">USS + PageTables + Swap</tspan><tspan x="750.0" dy="13.0">(НЕ повний RSS!)</tspan></text>
</svg>