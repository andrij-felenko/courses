<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала вільної пам'яті: водяні знаки, kswapd, прямий відбір і PSI</text>
<rect x="60.0" y="65.0" width="260.0" height="320.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала вільної RAM (Zone)</text>
<rect x="75.0" y="105.0" width="230.0" height="55.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="190.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зона спокою (&gt; high)</text>
<text x="190.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Виділення миттєве, kswapd спить</text>
<line x1="50.0" y1="160.0" x2="320.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="45.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">high</text>
<rect x="75.0" y="165.0" width="230.0" height="65.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">Фоновий відбір (low .. high)</text>
<text x="190.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">kswapd прокидається й чистить кеш</text>
<text x="190.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Затримка процесів: 0 мкс</text>
<line x1="50.0" y1="230.0" x2="320.0" y2="230.0" stroke="#ca8a04" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="45.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="end" font-weight="700">low</text>
<rect x="75.0" y="235.0" width="230.0" height="75.0" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<text x="190.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">Прямий відбір (min .. low)</text>
<text x="190.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">direct reclaim: процес чистить сам собі</text>
<text x="190.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Стрибок затримок allocstall!</text>
<line x1="50.0" y1="310.0" x2="320.0" y2="310.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="45.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">min</text>
<rect x="75.0" y="315.0" width="230.0" height="55.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Резерв ядра / OOM (&lt; min)</text>
<text x="190.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Пам'ять вичерпано → OOM Killer</text>
<rect x="360.0" y="65.0" width="480.0" height="320.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="600.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що видно в метриках і лічильниках ядра</text>
<rect x="380.0" y="110.0" width="440.0" height="75.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="600.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">/proc/vmstat: темп і характер відбору</tspan><tspan x="600.0" dy="14.3">• pgscan_kswapd / pgsteal_kswapd — фонова чистка (норма)</tspan><tspan x="600.0" dy="14.3">• pgscan_direct / pgsteal_direct — прямий відбір (критично)</tspan><tspan x="600.0" dy="14.3">• allocstall_normal — кількість потоків, що застрягли у виділенні</tspan></text>
<rect x="380.0" y="195.0" width="440.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="217.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">/proc/pressure/memory (PSI): справжня ціна затримки</tspan><tspan x="600.0" dy="14.3">some avg10=... — частка часу, коли ПРИНАЙМНІ ОДИН потік</tspan><tspan x="600.0" dy="14.3">стоїть в очікуванні пам'яті (прямий відбір, читання свопу/коду)</tspan><tspan x="600.0" dy="14.3">full avg10=... — частка часу, коли ВСІ активні потоки</tspan><tspan x="600.0" dy="14.3">заблоковані на пам'яті (пробуксовування, непродуктивність 100%)</tspan></text>
<rect x="380.0" y="300.0" width="440.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Поріг втручання наглядачів (systemd-oomd / earlyoom):</tspan><tspan x="600.0" dy="14.3">Реагують не на free=0, а на PSI some &gt; 25% або full &gt; 10%:</tspan><tspan x="600.0" dy="14.3">жертву вбивають завчасно, поки ядро ще не заклякло намертво.</tspan></text>
</svg>