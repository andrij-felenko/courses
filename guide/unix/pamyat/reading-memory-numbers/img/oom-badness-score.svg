<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математика OOM-score: парадокс бази, поправка adj та ізоляція cgroups</text>
<rect x="40.0" y="60.0" width="380.0" height="345.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Глобальний OOM (традиційна модель)</text>
<text x="230.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Формула oom_badness = RSS + Swap + PageTables</text>
<rect x="55.0" y="120.0" width="350.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="230.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Служба PostgreSQL (1 процес)</text>
<text x="230.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RSS = 6 ГіБ (1 572 864 стор.) · PageTables = 12 МіБ</text>
<text x="230.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">oom_score_adj = 0  →  Бал badness = 1 575 936</text>
<text x="230.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ВИРОК: OOM-killer вбиває базу! (найбільший бал)</text>
<rect x="55.0" y="215.0" width="350.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="230.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збірка make -j32 (32 процеси cc1)</text>
<text x="230.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кожен cc1: RSS = 350 МіБ (89 600 стор.)</text>
<text x="230.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сумарно: 11.2 ГіБ пам'яті з'їдено збіркою!</text>
<text x="230.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Бал кожного cc1 = 89 856  →  Усі cc1 виживають!</text>
<rect x="55.0" y="310.0" width="350.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Поправка oom_score_adj для бази:</tspan><tspan x="230.0" dy="13.0">Виставляємо postgres oom_score_adj = -800:</tspan><tspan x="230.0" dy="13.0">поправка = -800 · (totalpages/1000) = -3 355 200 сторінок.</tspan><tspan x="230.0" dy="13.0">Бал badness стає від'ємним (-1.7M) → база захищена!</tspan></text>
<rect x="460.0" y="60.0" width="380.0" height="345.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">cgroups v2: облік і OOM на рівні групи</text>
<text x="650.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Межа memory.max та прапорець memory.oom.group</text>
<rect x="475.0" y="120.0" width="350.0" height="125.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="650.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">Контрольна група: build.slice</text>
<text x="650.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">memory.max = 8 ГіБ · memory.current = 8.1 ГіБ</text>
<text x="650.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">memory.oom.group = 1 (вбити всю групу разом)</text>
<text x="650.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Прямий відбір і OOM локалізовані всередині build.slice</text>
<text x="650.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. Усі 32 cc1 гинуть разом, база postgres НЕ зачеплена!</text>
<rect x="475.0" y="255.0" width="350.0" height="135.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="650.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Чому cgroups v2 вирішує проблему назавжди:</tspan><tspan x="650.0" dy="13.0">• Чесний облік: кожен кадр належить рівно одній групі</tspan><tspan x="650.0" dy="13.0">• Включає кеш сторінок, dentry/inode і пам'ять ядра</tspan><tspan x="650.0" dy="13.0">• memory.events (oom, oom_kill) фіксує точні події</tspan><tspan x="650.0" dy="13.0">• Захищає сусідні служби без ручного підбору oom_score_adj</tspan></text>
</svg>