<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне отримання пакета: кільцевий буфер RX, DMA та цикл NAPI</text>
<rect x="40.0" y="65.0" width="340.0" height="625.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережевий адаптер (NIC)</text>
<rect x="60.0" y="115.0" width="300.0" height="60.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="210.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Фізичний кабель / Оптика (PHY)</tspan><tspan x="210.0" dy="13.0">Кадри надходять зі швидкістю лінії (Line Rate)</tspan></text>
<rect x="60.0" y="185.0" width="300.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="210.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">RX FIFO та MAC-контролер</tspan><tspan x="210.0" dy="14.3">Перевірка CRC (FCS), фільтрація MAC-адрес,</tspan><tspan x="210.0" dy="14.3">розподіл черг через RSS</tspan></text>
<rect x="60.0" y="260.0" width="300.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="210.0" y="303.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Кільце дескрипторів RX (RX Ring)</tspan><tspan x="210.0" dy="14.3">• Head: позиція запису заліза</tspan><tspan x="210.0" dy="14.3">• Tail: межа виділених буферів</tspan><tspan x="210.0" dy="14.3">• Дескриптор містить фізичну адресу RAM,</tspan><tspan x="210.0" dy="14.3">  довжину кадру та прапорці контрольної суми</tspan><tspan x="210.0" dy="14.3">• Залізо перевіряє L3/L4 Checksum Offload</tspan></text>
<rect x="60.0" y="420.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="210.0" y="465.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Контролер переривань (MSI-X)</tspan><tspan x="210.0" dy="15.6">1. Запис кадру в RAM через PCIe DMA</tspan><tspan x="210.0" dy="15.6">2. Генерація переривання MSI-X на CPU</tspan><tspan x="210.0" dy="15.6">3. Тимчасове маскування ліній переривання</tspan></text>
<rect x="60.0" y="560.0" width="300.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="612.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Апаратний DMA Master</tspan><tspan x="210.0" dy="11.7">Прямий запис пакета в пам'ять хоста без участі процесора</tspan></text>
<rect x="420.0" y="65.0" width="380.0" height="625.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="610.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оперативна пам'ять хоста (RAM)</text>
<rect x="440.0" y="115.0" width="340.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="610.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Буфери DMA (dma_alloc_coherent)</tspan><tspan x="610.0" dy="13.0">Виділені сторінки пам'яті для прямого доступу адаптера.</tspan><tspan x="610.0" dy="13.0">Фізичні адреси передані в дескриптори RX Ring.</tspan></text>
<rect x="440.0" y="190.0" width="340.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="610.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Кадр Ethernet у буфері DMA</tspan><tspan x="610.0" dy="14.3">[ MAC Заголовок | IP Заголовок | TCP/UDP | Дані ]</tspan><tspan x="610.0" dy="14.3">Пакет лежить у пам'яті до того, як процесор починає</tspan><tspan x="610.0" dy="14.3">його опрацювання.</tspan></text>
<rect x="440.0" y="285.0" width="340.0" height="140.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="610.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Аллокація struct sk_buff (SKB)</tspan><tspan x="610.0" dy="15.6">Драйвер виділяє метаструктуру sk_buff або</tspan><tspan x="610.0" dy="15.6">використовує механізм Page Pool:</tspan><tspan x="610.0" dy="15.6">• skb-&gt;head, skb-&gt;data, skb-&gt;tail, skb-&gt;end</tspan><tspan x="610.0" dy="15.6">• Прив'язка до мережевого пристрою net_device</tspan><tspan x="610.0" dy="15.6">• Встановлення протоколу через eth_type_trans()</tspan></text>
<rect x="440.0" y="435.0" width="340.0" height="235.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="610.0" y="523.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Оновлення кільця RX та поповнення буферів</tspan><tspan x="610.0" dy="13.0">Після того як skb сформовано:</tspan><tspan x="610.0" dy="13.0">1. Драйвер виділяє новий вільний буфер пам'яті</tspan><tspan x="610.0" dy="13.0">2. Записує новий DMA-дескриптор у кільце RX</tspan><tspan x="610.0" dy="13.0">3. Зсуває покажчик Tail у регістрі адаптера (Doorbell)</tspan><tspan x="610.0" dy="13.0">4. Адаптер знову готовий приймати нові кадри</tspan></text>
<rect x="840.0" y="65.0" width="360.0" height="625.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="1020.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро та процесор (CPU SoftIRQ)</text>
<rect x="860.0" y="115.0" width="320.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="1020.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">1. Апаратне переривання (HardIRQ)</tspan><tspan x="1020.0" dy="14.3">• Обробник драйвера вимикає переривання черги</tspan><tspan x="1020.0" dy="14.3">• Викликає napi_schedule(&amp;adapter-&gt;napi)</tspan><tspan x="1020.0" dy="14.3">• Додає napi_struct до poll_list поточного CPU</tspan></text>
<rect x="860.0" y="205.0" width="320.0" height="75.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="1020.0" y="224.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">2. Активація м'якого переривання</tspan><tspan x="1020.0" dy="14.3">• raise_softirq_irqoff(NET_RX_SOFTIRQ)</tspan><tspan x="1020.0" dy="14.3">• Апаратний обробник завершує роботу (&lt; 1 мкс)</tspan><tspan x="1020.0" dy="14.3">• CPU планує виконання функції net_rx_action()</tspan></text>
<rect x="860.0" y="290.0" width="320.0" height="135.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="1020.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">3. Цикл опитування NAPI (napi-&gt;poll())</tspan><tspan x="1020.0" dy="11.7">• net_rx_action() викликає функцію опитування</tspan><tspan x="1020.0" dy="11.7">• Опрацювання пакетів партіями до вичерпання budget (300)</tspan><tspan x="1020.0" dy="11.7">• Передача в стек: napi_gro_receive(skb)</tspan><tspan x="1020.0" dy="11.7">• Запобігання блокуванню CPU іншими задачами</tspan></text>
<rect x="860.0" y="435.0" width="320.0" height="235.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="1020.0" y="520.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">4. Завершення опитування NAPI</tspan><tspan x="1020.0" dy="11.7">• Якщо черга порожня (пакетів &lt; budget):</tspan><tspan x="1020.0" dy="11.7">  napi_complete_done() -&gt; вилучення з poll_list -&gt;</tspan><tspan x="1020.0" dy="11.7">  увімкнення апаратних переривань адаптера</tspan><tspan x="1020.0" dy="11.7">• Якщо черга не порожня (ліміт budget вичерпано):</tspan><tspan x="1020.0" dy="11.7">  napi лишається в списку, SoftIRQ поступається CPU,</tspan><tspan x="1020.0" dy="11.7">  лічильник time_squeeze у softnet_stat інкрементується</tspan></text>
<line x1="380.0" y1="200.0" x2="420.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="800.0" y1="200.0" x2="840.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="840.0" y1="400.0" x2="800.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>