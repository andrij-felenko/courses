<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізний шлях вхідного пакета крізь ядро Linux (Ingress Pipeline)</text>
<rect x="140.0" y="65.0" width="960.0" height="78.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="160.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Апаратний рівень (NIC &amp; DMA)</text>
<rect x="160.0" y="97.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Адаптер отримує кадр з лінії -&gt; перевіряє FCS -&gt; здійснює DMA запис у системну RAM -&gt; генерує переривання MSI-X.</tspan></text>
<line x1="620.0" y1="143.0" x2="620.0" y2="157.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="157.0" width="960.0" height="78.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Ранній фільтр XDP (eXpress Data Path)</text>
<rect x="160.0" y="189.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Драйвер запускає eBPF програму XDP ДО виділення sk_buff:</tspan><tspan x="620.0" dy="14.3">• XDP_DROP (миттєве скидання) • XDP_TX (зворотне відбиття) • XDP_REDIRECT (AF_XDP) • XDP_PASS.</tspan></text>
<line x1="620.0" y1="235.0" x2="620.0" y2="249.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="249.0" width="960.0" height="78.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Драйвер і NAPI Poll (SoftIRQ)</text>
<rect x="160.0" y="281.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="305.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Обробник HardIRQ маскує переривання і викликає napi_schedule(). У SoftIRQ net_rx_action() опитує кільце RX пакетами до вичерпання budget.</tspan></text>
<line x1="620.0" y1="327.0" x2="620.0" y2="341.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="341.0" width="960.0" height="78.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Агрегація GRO та вхід у стек (__netif_receive_skb_core)</text>
<rect x="160.0" y="373.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="397.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Generic Receive Offload склеює TCP сегменти -&gt; AF_PACKET (tcpdump/pcap) перехоплює копію -&gt; TC Ingress (clsact / eBPF фільтри та політики).</tspan></text>
<line x1="620.0" y1="419.0" x2="620.0" y2="433.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="433.0" width="960.0" height="78.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Netfilter PREROUTING та маршрутизація FIB</text>
<rect x="160.0" y="465.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="489.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ip_rcv() валідує IP заголовок -&gt; Netfilter Hook PREROUTING (conntrack, mangle, nat) -&gt; Пошук маршруту у FIB (fib_lookup()): локальна доставка чи форвардинг.</tspan></text>
<line x1="620.0" y1="511.0" x2="620.0" y2="525.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="525.0" width="960.0" height="78.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">6. Netfilter INPUT та демультиплексування L4</text>
<rect x="160.0" y="557.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="581.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ip_local_deliver() збирає IP фрагменти (defrag) -&gt; Netfilter Hook INPUT (таблиця filter) -&gt; виклик обробника протоколу inet_protos[protocol] (tcp_v4_rcv / udp_rcv).</tspan></text>
<line x1="620.0" y1="603.0" x2="620.0" y2="617.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="617.0" width="960.0" height="78.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="642.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">7. Транспортний рівень L4 (TCP / UDP State Machine)</text>
<rect x="160.0" y="649.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="673.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Пошук struct sock у хеш-таблиці inet_hashinfo за 4-tuple -&gt; перевірка контрольної суми, Sequence/ACK, ковзного вікна -&gt; генерація ACK -&gt; черга sk_receive_queue.</tspan></text>
<line x1="620.0" y1="695.0" x2="620.0" y2="709.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="709.0" width="960.0" height="78.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">8. Пробудження процесу та системний виклик read()</text>
<rect x="160.0" y="741.0" width="920.0" height="42.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="765.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">sk-&gt;sk_data_ready() сповіщає чергу sk_wq -&gt; пробудження epoll_wait() -&gt; процес викликає recv() / read() -&gt; копіювання даних у буфер процесу (copy_to_user()).</tspan></text>
</svg>