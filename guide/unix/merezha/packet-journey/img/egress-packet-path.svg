<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотний шлях пакета: передача з процесу в мережевий дріт (TX Egress)</text>
<rect x="80.0" y="70.0" width="1080.0" height="108.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 1: Системний виклик користувача</text>
<rect x="105.0" y="104.0" width="1030.0" height="64.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="124.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">write(fd, buf, len) / sendmsg()</tspan><tspan x="620.0" dy="15.6">Процес передає буфер у сокет. Ядро виділяє пам'ять під struct sk_buff з урахуванням квоти сокета wmem_alloc.</tspan><tspan x="620.0" dy="15.6">Дані копіюються з простору користувача в лінійні або сторінкові буфери ядра через copy_from_user().</tspan></text>
<line x1="620.0" y1="178.0" x2="620.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="196.0" width="1080.0" height="108.0" rx="8" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 2: Транспортний рівень L4 (TCP Segmentation &amp; Congestion)</text>
<rect x="105.0" y="230.0" width="1030.0" height="64.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="250.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">tcp_sendmsg() / tcp_write_xmit()</tspan><tspan x="620.0" dy="15.6">Формування TCP заголовка: порти, номери послідовності (SEQ), прапорці (PSH, ACK). Врахування алгоритмів керування</tspan><tspan x="620.0" dy="15.6">перевантаженням (BBR, CUBIC), ковзного вікна відправника, таймера повторної передачі (RTO) та алгоритму Nagle.</tspan></text>
<line x1="620.0" y1="304.0" x2="620.0" y2="322.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="322.0" width="1080.0" height="108.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 3: Мережевий рівень L3 та Netfilter OUTPUT</text>
<rect x="105.0" y="356.0" width="1030.0" height="64.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ip_queue_xmit() -&gt; NF_INET_LOCAL_OUT -&gt; Пошук маршруту -&gt; NF_INET_POST_ROUTING</tspan><tspan x="620.0" dy="15.6">Побудова IPv4 заголовка (Src/Dst IP, TTL, Checksum). Проходження хука OUTPUT, вибір вихідного інтерфейсу у FIB,</tspan><tspan x="620.0" dy="15.6">проходження хука POSTROUTING (трансляція SNAT / MASQUERADE) та резолюція L2 адреси через ARP/сусідів (Neighbor Table).</tspan></text>
<line x1="620.0" y1="430.0" x2="620.0" y2="448.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="448.0" width="1080.0" height="108.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 4: Диспетчеризація черг трафіку L2 (TC &amp; Qdisc)</text>
<rect x="105.0" y="482.0" width="1030.0" height="64.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="502.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">dev_queue_xmit() -&gt; __dev_xmit_skb() -&gt; qdisc_run()</tspan><tspan x="620.0" dy="15.6">Пакет потрапляє в чергу планувальника інтерфейсу (Qdisc: fq, cake, pfifo_fast). eBPF фільтри на TC Egress можуть змінити</tspan><tspan x="620.0" dy="15.6">або перенаправити пакет. Планувальник сортує пакети згідно з пріоритетами, квотами пропускної здатності або FQ-лімітами.</tspan></text>
<line x1="620.0" y1="556.0" x2="620.0" y2="574.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="574.0" width="1080.0" height="108.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 5: Драйвер, кільце TX Ring та відправка залізом</text>
<rect x="105.0" y="608.0" width="1030.0" height="64.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="620.0" y="628.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ndo_start_xmit() -&gt; DMA Mapping -&gt; PCI Doorbell -&gt; PHY Wire</tspan><tspan x="620.0" dy="15.6">Драйвер відображає skb у фізичну пам'ять (dma_map_single), заповнює дескриптор у кільці TX Ring і смикає Doorbell регістр.</tspan><tspan x="620.0" dy="15.6">Адаптер вичитує дані через DMA, додає L2 Preamble/FCS і відправляє в лінію. Завершення генерує TX IRQ / NET_TX_SOFTIRQ для звільнення skb.</tspan></text>
</svg>