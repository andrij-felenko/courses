<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів життєвого циклу процесу в Linux</text>
<text x="590.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний автомат станів процесу в ядрі Linux</text>
<rect x="40.0" y="70.0" width="260.0" height="110.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="170.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. НАРОДЖЕННЯ</tspan><tspan x="170.0" dy="15.6">fork() / clone3()</tspan><tspan x="170.0" dy="15.6">alloc_task_struct(), alloc_pid()</tspan><tspan x="170.0" dy="15.6">дублювання mm (COW) та дескрипторів</tspan></text>
<rect x="360.0" y="65.0" width="420.0" height="120.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="570.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">2. СТАН TASK_RUNNING (R)</tspan><tspan x="570.0" dy="16.2">Черга планувальника CFS / EEVDF</tspan><tspan x="570.0" dy="16.2">• Стоїть у черзі готових (чекає на ядро ЦП)</tspan><tspan x="570.0" dy="16.2">• Виконує інструкції на процесорі (user/kernel)</tspan></text>
<rect x="840.0" y="70.0" width="300.0" height="110.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/><text x="990.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">TASK_STOPPED / TRACED (T / t)</tspan><tspan x="990.0" dy="15.6">Зупинено сигналами керування (SIGSTOP)</tspan><tspan x="990.0" dy="15.6">або ptrace (налагодження/strace)</tspan><tspan x="990.0" dy="15.6">Відновлення: сигнал SIGCONT</tspan></text>
<rect x="40.0" y="260.0" width="330.0" height="125.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="303.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">TASK_INTERRUPTIBLE (S)</tspan><tspan x="205.0" dy="15.6">Сон у wait queue (сокет, канал, таймер)</tspan><tspan x="205.0" dy="15.6">Прокидається від надходження даних</tspan><tspan x="205.0" dy="15.6">або доставки сигналу (wake_up)</tspan></text>
<rect x="410.0" y="260.0" width="330.0" height="125.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="575.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">TASK_UNINTERRUPTIBLE (D)</tspan><tspan x="575.0" dy="14.3">Сон на апаратному I/O (диск, сторінковий збій)</tspan><tspan x="575.0" dy="14.3">Ігнорує звичайні сигнали заради цілісності</tspan><tspan x="575.0" dy="14.3">TASK_KILLABLE: реагує лише на SIGKILL</tspan></text>
<rect x="780.0" y="260.0" width="360.0" height="125.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="960.0" y="303.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">3. ЗАВЕРШЕННЯ: do_exit() (PF_EXITING)</tspan><tspan x="960.0" dy="15.6">exit_group() або смертельний сигнал</tspan><tspan x="960.0" dy="15.6">• exit_mm(): звільнення адресного простору</tspan><tspan x="960.0" dy="15.6">• exit_files(): закриття дескрипторів та сокетів</tspan></text>
<rect x="180.0" y="460.0" width="400.0" height="120.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="380.0" y="500.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">4. СТАН ЗОМБІ: EXIT_ZOMBIE (Z)</tspan><tspan x="380.0" dy="15.6">Усі ресурси пам'яті й дескрипторів звільнено.</tspan><tspan x="380.0" dy="15.6">Лишилися: task_struct, PID, exit_code, rusage.</tspan><tspan x="380.0" dy="15.6">Батькові надіслано сигнал SIGCHLD.</tspan></text>
<rect x="640.0" y="460.0" width="400.0" height="120.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="840.0" y="500.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">5. ПРИБИРАННЯ: release_task()</tspan><tspan x="840.0" dy="15.6">Батько викликає waitpid() / waitid().</tspan><tspan x="840.0" dy="15.6">• Статус і лічильники rusage скопійовано батькові.</tspan><tspan x="840.0" dy="15.6">• PID повернуто в пул, task_struct звільнено RCU.</tspan></text>
<line x1="300.0" y1="125.0" x2="360.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wake_up</text>
<line x1="780.0" y1="110.0" x2="840.0" y2="110.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="840.0" y1="135.0" x2="780.0" y2="135.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">SIGSTOP</text>
<text x="810.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">SIGCONT</text>
<line x1="420.0" y1="185.0" x2="230.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="260.0" x2="450.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wait / wake</text>
<line x1="550.0" y1="185.0" x2="550.0" y2="260.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="260.0" x2="590.0" y2="185.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d4ac0d" text-anchor="middle">I/O запит/готово</text>
<line x1="720.0" y1="185.0" x2="880.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="840.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">exit_group()</text>
<line x1="880.0" y1="385.0" x2="460.0" y2="460.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="690.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">exit_notify()</text>
<line x1="580.0" y1="520.0" x2="640.0" y2="520.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">waitpid()</text>
<rect x="40.0" y="640.0" width="1100.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="590.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">КЛЮЧОВИЙ ПРИНЦИП РОЗДІЛЕННЯ ВІДПОВІДАЛЬНОСТІ:</tspan><tspan x="590.0" dy="16.2">• Кроки 1–3 виконує САМ ПРОЦЕС у контексті ядра (звільняє пам'ять, закриває файли, надсилає SIGCHLD).</tspan><tspan x="590.0" dy="16.2">• Крок 4 (EXIT_ZOMBIE) — стан очікування батька, коли процесу вже немає, але його дескриптор ще не знищено.</tspan><tspan x="590.0" dy="16.2">• Крок 5 виконує БАТЬКІВСЬКИЙ ПРОЦЕС через waitpid(): забирає результат і дає ядру команду остаточно стерти task_struct.</tspan></text>
</svg>