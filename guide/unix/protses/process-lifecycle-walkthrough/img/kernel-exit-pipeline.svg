<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність звільнення ресурсів у do_exit()</text>
<text x="590.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр демонтажу ресурсів у функції ядра do_exit()</text>
<rect x="40.0" y="95.0" width="340.0" height="150.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. PF_EXITING — Встановлення прапорця</tspan><tspan x="210.0" dy="15.6">current-&gt;flags |= PF_EXITING</tspan><tspan x="210.0" dy="15.6">Заборона створення нових потоків,</tspan><tspan x="210.0" dy="15.6">блокування доставки нових сигналів</tspan></text>
<rect x="420.0" y="95.0" width="340.0" height="150.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="590.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">2. exit_mm() — Демонтаж пам'яті</tspan><tspan x="590.0" dy="15.6">Звільнення таблиць сторінок MMU,</tspan><tspan x="590.0" dy="15.6">анулювання анонімних VMA та стеків,</tspan><tspan x="590.0" dy="15.6">кадри пам'яті повертаються ядру</tspan></text>
<rect x="800.0" y="95.0" width="340.0" height="150.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="970.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">3. exit_files() — Закриття дескрипторів</tspan><tspan x="970.0" dy="15.6">Зменшення refcount у files_struct,</tspan><tspan x="970.0" dy="15.6">закриття сокетів (TCP FIN/RST),</tspan><tspan x="970.0" dy="15.6">надсилання EOF у канали (pipes)</tspan></text>
<rect x="40.0" y="335.0" width="340.0" height="150.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.6"/><text x="210.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">4. exit_fs() / sem — Файлова система й замки</tspan><tspan x="210.0" dy="15.6">Відв'язування кореня та cwd (fs_struct),</tspan><tspan x="210.0" dy="15.6">відкат операцій SysV IPC (semundo),</tspan><tspan x="210.0" dy="15.6">скидання блокувань flock/fcntl</tspan></text>
<rect x="420.0" y="335.0" width="340.0" height="150.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.6"/><text x="590.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">5. forget_original_parent() — Перепідпорядкування</tspan><tspan x="590.0" dy="14.3">Обхід усіх дочірніх процесів,</tspan><tspan x="590.0" dy="14.3">перевірка субреперів у дереві предків,</tspan><tspan x="590.0" dy="14.3">перепризначення сиріт на новий reaper</tspan></text>
<rect x="800.0" y="335.0" width="340.0" height="150.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="970.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">6. exit_notify() — Сповіщення та зомбі</tspan><tspan x="970.0" dy="15.6">Встановлення стану EXIT_ZOMBIE,</tspan><tspan x="970.0" dy="15.6">відправка сигналу SIGCHLD батькові,</tspan><tspan x="970.0" dy="15.6">виклик schedule() — задача вибуває з ЦП</tspan></text>
<line x1="380.0" y1="170.0" x2="420.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="170.0" x2="800.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="245.0" x2="970.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="310.0" x2="210.0" y2="310.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="310.0" x2="210.0" y2="335.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="410.0" x2="420.0" y2="410.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="410.0" x2="800.0" y2="410.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="540.0" width="1060.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="612.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">ПІДСУМОК: СТАН ЗОМБІ (EXIT_ZOMBIE) ТА ЧАС ЖИТТЯ РЕСУРСІВ</tspan><tspan x="590.0" dy="16.9"></tspan><tspan x="590.0" dy="16.9">• ЗВІЛЬНЕНО ПОВНІСТЮ: фізичну пам'ять, таблиці сторінок, файлові дескриптори, мережеві сокети, каталоги.</tspan><tspan x="590.0" dy="16.9">• ЗБЕРЕЖЕНО В task_struct: номер PID, статус виходу (exit_code), лічильники витраченого часу (rusage), зв'язок із батьком.</tspan><tspan x="590.0" dy="16.9">• НАСТУПНИЙ КРОК: виклик waitpid() батьківським процесом переносить exit_code і викликає release_task().</tspan><tspan x="590.0" dy="16.9">  Лише після release_task() дескриптор task_struct звільняється через RCU, а PID повертається в пул системи.</tspan></text>
</svg>