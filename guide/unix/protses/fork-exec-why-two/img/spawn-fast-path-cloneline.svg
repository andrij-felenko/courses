<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Ціна створення процесу: fork() (COW) проти оптимізованого posix_spawn()</text>
<rect x="30.0" y="60.0" width="435.0" height="375.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="106.8" y="74.0" width="280.4" height="32.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="247.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Стандартний fork() + execve() (COW)</tspan></text>
<rect x="112.8" y="122.5" width="268.5" height="35.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="247.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.0" dy="0.0">1. Батьківський процес (наприклад, 32 ГБ RSS)</tspan><tspan x="247.0" dy="13.0">Таблиці сторінок займають ~64 МБ пам'яті.</tspan></text>
<rect x="115.6" y="186.0" width="262.8" height="48.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="247.0" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.0" dy="0.0">2. fork(): Дублювання таблиць сторінок</tspan><tspan x="247.0" dy="13.0">Ядро копіює всі PTE, маркує Read-Only (COW).</tspan><tspan x="247.0" dy="13.0">Витрачається CPU-час та пам'ять ядра.</tspan></text>
<rect x="95.7" y="267.5" width="302.7" height="35.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="247.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.0" dy="0.0">3. Вікно дитини: мінімальний запис</tspan><tspan x="247.0" dy="13.0">Кожен запис викликає Page Fault і копіювання 4 КіБ.</tspan></text>
<rect x="112.8" y="331.0" width="268.5" height="48.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="247.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.0" dy="0.0">4. execve(): Знищення таблиць сторінок</tspan><tspan x="247.0" dy="13.0">Усі скопійовані таблиці сторінок викидаються!</tspan><tspan x="247.0" dy="13.0">Ядро будує чистий адресний простір з нуля.</tspan></text>
<rect x="495.0" y="60.0" width="435.0" height="375.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="542.0" y="74.0" width="339.9" height="32.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="712.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Оптимізований posix_spawn() (Linux / glibc)</tspan></text>
<rect x="583.5" y="122.5" width="257.1" height="35.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="712.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">1. Батьківський процес (32 ГБ RSS)</tspan><tspan x="712.0" dy="13.0">Таблиці сторінок залишаються недоторканими.</tspan></text>
<rect x="583.5" y="186.0" width="257.1" height="48.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="712.0" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">2. clone(CLONE_VM | CLONE_VFORK)</tspan><tspan x="712.0" dy="13.0">Батько чекає, дитина ділить пам'ять батька.</tspan><tspan x="712.0" dy="13.0">Таблиці сторінок НЕ дублюються взагалі!</tspan></text>
<rect x="555.0" y="261.0" width="314.1" height="48.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="712.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">3. Виконання дій з окремого стека</tspan><tspan x="712.0" dy="13.0">glibc виділяє маленький тимчасовий стек (64 КіБ).</tspan><tspan x="712.0" dy="13.0">Виконуються file_actions без псування пам'яті батька.</tspan></text>
<rect x="583.5" y="331.0" width="257.1" height="48.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="712.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">4. execve(): Новий процес оживає</tspan><tspan x="712.0" dy="13.0">Ядро завантажує образ нової програми.</tspan><tspan x="712.0" dy="13.0">Батько розблоковується. Нуль копіювань PTE!</tspan></text>
</svg>