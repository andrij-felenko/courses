<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево діагностики затримок процесу</text>
<rect x="340.0" y="20.0" width="400.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="540.0" y="46.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Симптом: процес виконує операцію занадто довго</tspan></text>
<line x1="540.0" y1="64.0" x2="270.0" y2="100.0" stroke="#333333" stroke-width="1.8"/>
<line x1="540.0" y1="64.0" x2="810.0" y2="100.0" stroke="#333333" stroke-width="1.8"/>
<rect x="90.0" y="100.0" width="360.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="270.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Високий %CPU (CPU-bound вузьке місце)</tspan></text>
<line x1="270.0" y1="144.0" x2="170.0" y2="175.0" stroke="#27ae60" stroke-width="1.4"/>
<line x1="270.0" y1="144.0" x2="370.0" y2="175.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="40.0" y="175.0" width="200.0" height="160.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="140.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">%usr переважає</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">Причина:</tspan><tspan x="140.0" dy="13.0">• Неефективний алгоритм</tspan><tspan x="140.0" dy="13.0">• Гарячі математичні цикли</tspan><tspan x="140.0" dy="13.0">• Парсинг / десеріалізація</tspan><tspan x="140.0" dy="13.0">• Промахи L3 кеша</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">Інструменти:</tspan><tspan x="140.0" dy="13.0">perf top, perf record -g</tspan></text>
<rect x="260.0" y="175.0" width="200.0" height="160.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">%sys переважає</tspan><tspan x="360.0" dy="13.0"></tspan><tspan x="360.0" dy="13.0">Причина:</tspan><tspan x="360.0" dy="13.0">• Занадто часті системні виклики</tspan><tspan x="360.0" dy="13.0">• Помилки сторінок (minflt)</tspan><tspan x="360.0" dy="13.0">• Копіювання буферів сокетів</tspan><tspan x="360.0" dy="13.0">• Втрати на перемиканні задач</tspan><tspan x="360.0" dy="13.0"></tspan><tspan x="360.0" dy="13.0">Інструменти:</tspan><tspan x="360.0" dy="13.0">strace -c, perf trace</tspan></text>
<rect x="630.0" y="100.0" width="360.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="810.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">Низький %CPU (Off-CPU вузьке місце)</tspan></text>
<line x1="810.0" y1="144.0" x2="580.0" y2="175.0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="810.0" y1="144.0" x2="760.0" y2="175.0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="810.0" y1="144.0" x2="940.0" y2="175.0" stroke="#c0392b" stroke-width="1.4"/>
<rect x="490.0" y="175.0" width="170.0" height="160.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="575.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Черга планувальника</tspan><tspan x="575.0" dy="13.0">(r у vmstat &gt; ядер)</tspan><tspan x="575.0" dy="13.0"></tspan><tspan x="575.0" dy="13.0">Причина:</tspan><tspan x="575.0" dy="13.0">• Конкуренція за ядра</tspan><tspan x="575.0" dy="13.0">• Низький nice / пріоритет</tspan><tspan x="575.0" dy="13.0">• Ліміт cgroups (cpu.max)</tspan><tspan x="575.0" dy="13.0"></tspan><tspan x="575.0" dy="13.0">Інструменти:</tspan><tspan x="575.0" dy="13.0">pidstat -w, /proc/pressure</tspan></text>
<rect x="675.0" y="175.0" width="170.0" height="160.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="760.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">I/O Wait</tspan><tspan x="760.0" dy="13.0">(стан D, %wa високий)</tspan><tspan x="760.0" dy="13.0"></tspan><tspan x="760.0" dy="13.0">Причина:</tspan><tspan x="760.0" dy="13.0">• Повільний диск / SSD</tspan><tspan x="760.0" dy="13.0">• Major page faults (диск)</tspan><tspan x="760.0" dy="13.0">• Своп через брак пам'яті</tspan><tspan x="760.0" dy="13.0"></tspan><tspan x="760.0" dy="13.0">Інструменти:</tspan><tspan x="760.0" dy="13.0">iostat -xz 1, pidstat -d</tspan></text>
<rect x="860.0" y="175.0" width="180.0" height="160.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="950.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Блокування / Сон</tspan><tspan x="950.0" dy="11.7">(стан S, CPU = 0%)</tspan><tspan x="950.0" dy="11.7"></tspan><tspan x="950.0" dy="11.7">Причина:</tspan><tspan x="950.0" dy="11.7">• Конфлікти м'ютексів / futex</tspan><tspan x="950.0" dy="11.7">• Очікування мережевої відповіді</tspan><tspan x="950.0" dy="11.7">• sleep() / таймери пулу</tspan><tspan x="950.0" dy="11.7"></tspan><tspan x="950.0" dy="11.7">Інструменти:</tspan><tspan x="950.0" dy="11.7">offcputime, pstack, gdb</tspan></text>
<rect x="40.0" y="365.0" width="1000.0" height="225.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="540.0" y="438.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ПРАКТИЧНИЙ АЛГОРИТМ ПОШУКУ ПРИЧИНИ ГАЛЬМУВАННЯ:</tspan><tspan x="540.0" dy="14.3"></tspan><tspan x="540.0" dy="14.3">Крок 1. Загальний стан системи: `vmstat 1` → дивимося на стовпчики `r` (черга задач), `b` (заблоковані на I/O), `us`, `sy`, `wa`.</tspan><tspan x="540.0" dy="14.3">Крок 2. Звуження до процесу: `pidstat -u -r -d -w -p &lt;PID&gt; 1` → вимірюємо %usr, %system, minflt/s, majflt/s, kB_rd/s, cswch/s.</tspan><tspan x="540.0" dy="14.3">Крок 3. Перевірка затримки ядра: читаємо `/proc/&lt;PID&gt;/schedstat` та `/proc/pressure/cpu` → чи не простоює задача в черзі планувальника.</tspan><tspan x="540.0" dy="14.3">Крок 4. Якщо On-CPU переважає: будуємо флеймграф за допомогою `perf record -F 99 -g -p &lt;PID&gt; -- sleep 10` → локалізуємо повільну функцію.</tspan><tspan x="540.0" dy="14.3">Крок 5. Якщо Off-CPU переважає: запускаємо `offcputime-bpfcc -p &lt;PID&gt; 10` або `perf sched record` → знаходимо стек виклику, де задача засинає.</tspan></text>
</svg>