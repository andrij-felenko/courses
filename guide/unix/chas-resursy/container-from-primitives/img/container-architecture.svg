<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="50.0" width="530.0" height="590.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="305.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уявлення користувача («віртуальна машина»)</text>
<rect x="70.0" y="115.0" width="470.0" height="70.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="305.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Ілюзія окремої ОС:</tspan><tspan x="305.0" dy="16.9">власна файлова система, ізольована мережа, свій PID 1</tspan></text>
<rect x="85.0" y="210.0" width="440.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">Процес застосунку (PID 1 усередині)</tspan><tspan x="305.0" dy="18.2">Виконує код, слухає локальний порт 8080</tspan></text>
<rect x="85.0" y="305.0" width="440.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="305.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Приватний кореневий каталог (/)</tspan><tspan x="305.0" dy="16.9">/bin, /lib, /etc/nginx/nginx.conf</tspan></text>
<rect x="85.0" y="388.0" width="440.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="305.0" y="416.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Віртуальний мережевий інтерфейс</tspan><tspan x="305.0" dy="16.9">eth0: 10.0.2.15/24, власна таблиця маршрутів</tspan></text>
<rect x="85.0" y="470.0" width="440.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="305.0" y="501.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Приватні псевдофайлові системи</tspan><tspan x="305.0" dy="16.9">/proc (видно лише PID 1), /sys, /dev/null</tspan></text>
<rect x="85.0" y="560.0" width="440.0" height="65.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="305.0" y="588.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Обмеження пам'яті та CPU (уявний гіпервізор)</tspan><tspan x="305.0" dy="16.9">«Виділено 512 MB RAM і 1 ядро vCPU»</tspan></text>
<rect x="630.0" y="50.0" width="570.0" height="590.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="915.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реальність у ядрі Linux (спільне монолітне ядро)</text>
<rect x="660.0" y="115.0" width="510.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="915.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">Жодного гіпервізора та окремого ядра немає:</tspan><tspan x="915.0" dy="16.9">звичайний процес task_struct із набором обмежувальних вказівників</tspan></text>
<rect x="675.0" y="205.0" width="500.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="925.0" y="238.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="925.0" dy="0.0">task_struct (справжній PID 4192 на хості)</tspan><tspan x="925.0" dy="18.2">Виконує нативні інструкції на спільному процесорі</tspan></text>
<rect x="675.0" y="298.0" width="500.0" height="72.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="925.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">struct nsproxy *nsproxy</tspan><tspan x="925.0" dy="16.9">Вказівники на структури mnt_ns, pid_ns, net_ns, uts_ns, ipc_ns</tspan></text>
<rect x="675.0" y="388.0" width="500.0" height="72.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="925.0" y="420.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">struct cgroup *cgroups (cgroup v2)</tspan><tspan x="925.0" dy="16.9">Облік: memory.max (512M), cpu.max (100000 100000), pids.max (64)</tspan></text>
<rect x="675.0" y="478.0" width="500.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="925.0" y="508.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">struct seccomp_filter (BPF-фільтр викликів)</tspan><tspan x="925.0" dy="15.6">Перехоплює заборонені системні виклики (reboot, kexec, init_module)</tspan></text>
<rect x="675.0" y="562.0" width="500.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="925.0" y="592.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Спільні апаратні ресурси ядра</tspan><tspan x="925.0" dy="16.9">Єдиний планувальник CFS/EEVDF, драйвери заліза, кеш сторінок VFS</tspan></text>
</svg>