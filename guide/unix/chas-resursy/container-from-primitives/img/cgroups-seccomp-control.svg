<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневий захист вузла: квотування ресурсів та фільтрація викликів</text>
<rect x="40.0" y="70.0" width="570.0" height="570.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="325.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. cgroups v2: Квотування ресурсів (скільки)</text>
<rect x="65.0" y="135.0" width="520.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="325.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Підсистема ядра для обліку та обмеження споживання фізичних ресурсів.</tspan><tspan x="325.0" dy="16.2">Запобігає виснаженню пам'яті (OOM) та блокуванню процесора хоста.</tspan></text>
<rect x="65.0" y="215.0" width="520.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="325.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Контролер пам'яті (memory.max, memory.high)</tspan><tspan x="325.0" dy="11.7">memory.max = 536870912 (512 MB hard limit). Перевищення викликає OOM Killer усередині групи.</tspan><tspan x="325.0" dy="11.7">memory.high = 419430400 (400 MB soft limit). Примусове витіснення сторінок у фоні.</tspan></text>
<rect x="65.0" y="315.0" width="520.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="325.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Контролер процесора (cpu.max, cpu.weight)</tspan><tspan x="325.0" dy="14.3">cpu.max = 20000 100000 (квота 20 мс на кожні 100 мс періоду = 20% від 1 ядра).</tspan><tspan x="325.0" dy="14.3">cpu.weight = 100 (пропорційна вага процесу при конкуренції з іншими групами).</tspan></text>
<rect x="65.0" y="415.0" width="520.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="325.0" y="444.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Контролер процесів (pids.max)</tspan><tspan x="325.0" dy="14.3">pids.max = 64 (максимальна кількість задач у групі).</tspan><tspan x="325.0" dy="14.3">Повний захист від атак типу fork-bomb, які вичерпують таблицю процесів ядра.</tspan></text>
<rect x="65.0" y="510.0" width="520.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="325.0" y="540.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Контролер вводу-виводу (io.max, io.weight)</tspan><tspan x="325.0" dy="13.0">io.max = 8:0 rbps=10485760 wbps=10485760 (ліміт швидкості читання/запису 10 MB/s).</tspan><tspan x="325.0" dy="13.0">Захист від блокування спільних дисків хоста інтенсивними операціями вводу-виводу.</tspan></text>
<rect x="650.0" y="70.0" width="570.0" height="570.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="935.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. seccomp-BPF: Фільтрація викликів (що дозволено)</text>
<rect x="675.0" y="135.0" width="520.0" height="65.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="935.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Інтерцептор системних викликів на вході в ядро.</tspan><tspan x="935.0" dy="13.7">Перевіряє номер виклику та аргументи через BPF-інструкції до виконання коду ядра.</tspan></text>
<rect x="675.0" y="215.0" width="520.0" height="85.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="935.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0)</tspan><tspan x="935.0" dy="13.0">Обов'язковий прапорець перед завантаженням BPF-фільтра без root.</tspan><tspan x="935.0" dy="13.0">Забороняє дочірнім процесам підвищувати привілеї через біти setuid/setgid на файлах.</tspan></text>
<rect x="675.0" y="315.0" width="520.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="935.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Дозволені системні виклики (SECCOMP_RET_ALLOW)</tspan><tspan x="935.0" dy="13.0">Безпечні операції: read, write, openat, close, epoll_wait, nanosleep, futex, mmap, brk.</tspan><tspan x="935.0" dy="13.0">Формують білий список, достатній для звичайної роботи серверних програм.</tspan></text>
<rect x="675.0" y="415.0" width="520.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="935.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Заборонені системні виклики (SECCOMP_RET_ERRNO(EPERM))</tspan><tspan x="935.0" dy="13.0">Небезпечні для хоста: reboot, kexec_load, init_module, finit_module, sysfs, swapon.</tspan><tspan x="935.0" dy="13.0">Ядро повертає помилку Operation not permitted без виконання коду драйвера.</tspan></text>
<rect x="675.0" y="510.0" width="520.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="935.0" y="537.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">Критичні порушення (SECCOMP_RET_KILL_PROCESS)</tspan><tspan x="935.0" dy="14.3">Спроби втручання в інші процеси (ptrace, process_vm_writev) або атаки на ядро.</tspan><tspan x="935.0" dy="14.3">Ядро негайно завершує контейнер сигналом SIGSYS.</tspan></text>
</svg>