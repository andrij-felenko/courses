<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="210.0" y="14.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="510.0" y="37.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Низхідний маршрут локалізації проблеми (Top-Down Workflow)</tspan></text>
<text x="510.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Від загального стану ОС до конкретного системного виклику або інструкції процесора</text>
<rect x="50.0" y="85.0" width="50.0" height="86.0" rx="6" fill="#2980b9" stroke="#2980b9" stroke-width="1.5"/><text x="75.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">L1</tspan></text>
<rect x="110.0" y="85.0" width="860.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2980b9" stroke-width="1.5"/><text x="540.0" y="110.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">1. Системний скринінг (System-Wide Triage)</tspan><tspan x="540.0" dy="14.3">Мета: Визначити вузький ресурсний домен</tspan><tspan x="540.0" dy="14.3">Інструменти: top, vmstat 1, iostat -xz 1, sar, PSI (/proc/pressure)</tspan><tspan x="540.0" dy="14.3">Критерій: Сплеск черги r &gt; nproc, блокування b &gt; 0, %util &gt; 90%, PSI avg10 &gt; 10%</tspan></text>
<line x1="510.0" y1="171.0" x2="510.0" y2="193.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="193.0" width="50.0" height="86.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/><text x="75.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">L2</tspan></text>
<rect x="110.0" y="193.0" width="860.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">2. Ізоляція процесу (Process Introspection)</tspan><tspan x="540.0" dy="14.3">Мета: Знайти винний PID та розібрати його паспорт</tspan><tspan x="540.0" dy="14.3">Інструменти: pidstat -u -r -d -w, /proc/[pid]/{status,stat,wchan,stack,fd}</tspan><tspan x="540.0" dy="14.3">Критерій: Співвідношення %usr/%sys, cswch проти nvcswch, функція wchan</tspan></text>
<line x1="510.0" y1="279.0" x2="510.0" y2="301.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="301.0" width="50.0" height="86.0" rx="6" fill="#d4ac0d" stroke="#d4ac0d" stroke-width="1.5"/><text x="75.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">L3</tspan></text>
<rect x="110.0" y="301.0" width="860.0" height="86.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="540.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">3. Трасування межі з ядром (Boundary Tracing)</tspan><tspan x="540.0" dy="14.3">Мета: Перехопити системні виклики та відкриті ресурси</tspan><tspan x="540.0" dy="14.3">Інструменти: strace -c -T -p [PID], perf trace, lsof -p [PID], ss -tpie</tspan><tspan x="540.0" dy="14.3">Критерій: Завислі syscalls (futex, read, epoll_wait), помилки ETIMEDOUT / EACCES</tspan></text>
<line x1="510.0" y1="387.0" x2="510.0" y2="409.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="409.0" width="50.0" height="86.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="75.0" y="457.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">L4</tspan></text>
<rect x="110.0" y="409.0" width="860.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="434.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">4. Глибоке профілювання (Deep Profiling &amp; eBPF)</tspan><tspan x="540.0" dy="14.3">Мета: Локалізувати гарячий стек або причину тривалого сну</tspan><tspan x="540.0" dy="14.3">Інструменти: perf record (On-CPU), offcputime / bpftrace (Off-CPU), flamegraph</tspan><tspan x="540.0" dy="14.3">Критерій: Вершина флеймграфа, точки перемикання контексту sched_switch</tspan></text>
</svg>