<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="210.0" y="14.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="510.0" y="36.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Паспорт процесу в /proc/[pid]/: неінвазивна діагностика без зупинки</tspan></text>
<text x="510.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Зчитування структур ядра task_struct без накладних витрат ptrace</text>
<rect x="380.0" y="93.0" width="260.0" height="44.0" rx="6" fill="#2c3e50" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">/proc/[pid]/</tspan><tspan x="510.0" dy="16.9">(task_struct у пам'яті ядра)</tspan></text>
<line x1="510.0" y1="137.0" x2="190.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="185.0" width="280.0" height="145.0" rx="6" fill="#eaf0fd" stroke="#2980b9" stroke-width="1.4"/><text x="190.0" y="225.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">/proc/[pid]/status</tspan><tspan x="190.0" dy="11.7"></tspan><tspan x="190.0" dy="11.7">Стан процесу та перемикання:</tspan><tspan x="190.0" dy="11.7">• State: R (running), S (sleeping), D (disk wait)</tspan><tspan x="190.0" dy="11.7">• Threads: кількість ниток у групі задач</tspan><tspan x="190.0" dy="11.7">• voluntary_ctxt_switches: добровільний сон</tspan><tspan x="190.0" dy="11.7">• nonvoluntary_ctxt_switches: витіснення CPU</tspan></text>
<line x1="510.0" y1="137.0" x2="510.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="365.0" y="185.0" width="290.0" height="145.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="510.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">/proc/[pid]/wchan та stack</tspan><tspan x="510.0" dy="13.0"></tspan><tspan x="510.0" dy="13.0">Сплячий стек та канал ядра:</tspan><tspan x="510.0" dy="13.0">• wchan: назва функції сну (futex_wait, epoll)</tspan><tspan x="510.0" dy="13.0">• stack: повний стек ядра сплячого потоку</tspan><tspan x="510.0" dy="13.0">  (дозволяє бачити точку очікування</tspan><tspan x="510.0" dy="13.0">   без підключення GDB чи зупинки коду)</tspan></text>
<line x1="510.0" y1="137.0" x2="830.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="690.0" y="185.0" width="280.0" height="145.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="830.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">/proc/[pid]/stat</tspan><tspan x="830.0" dy="13.0"></tspan><tspan x="830.0" dy="13.0">Метрики часу та пам'яті:</tspan><tspan x="830.0" dy="13.0">• utime / stime: тактів у user / system mode</tspan><tspan x="830.0" dy="13.0">• minflt / majflt: незначні / значні збої RAM</tspan><tspan x="830.0" dy="13.0">• priority / nice: пріоритети планувальника</tspan><tspan x="830.0" dy="13.0">• vsize / rss: розміри пам'яті процесу</tspan></text>
<line x1="510.0" y1="137.0" x2="320.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150.0" y="360.0" width="340.0" height="145.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/><text x="320.0" y="403.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">/proc/[pid]/fd/ та fdinfo/</tspan><tspan x="320.0" dy="13.0"></tspan><tspan x="320.0" dy="13.0">Дескриптори та позиції:</tspan><tspan x="320.0" dy="13.0">• fd/*: символьні посилання на відкриті файли/сокети</tspan><tspan x="320.0" dy="13.0">• fdinfo/*: поточна позиція pos, прапорці flags,</tspan><tspan x="320.0" dy="13.0">  події epoll та налаштування дескриптора</tspan></text>
<line x1="510.0" y1="137.0" x2="700.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="360.0" width="340.0" height="145.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.4"/><text x="700.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">/proc/[pid]/smaps_rollup</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">Реальне використання пам'яті:</tspan><tspan x="700.0" dy="14.3">• PSS (Proportional Set Size): чесна пам'ять</tspan><tspan x="700.0" dy="14.3">• RssAnon / RssFile: анонімний vs файловий кеш</tspan><tspan x="700.0" dy="14.3">• Referenced: сторінки, що реально читаються</tspan></text>
</svg>