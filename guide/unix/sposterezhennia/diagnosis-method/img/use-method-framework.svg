<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="15.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="37.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Методологія USE: тріада перевірки апаратних та системних ресурсів</tspan></text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Для кожного фізичного або віртуального ресурсу перевіряються три ортогональні виміри</text>
<rect x="30.0" y="66.0" width="230.0" height="22.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Системні ресурси</tspan></text>
<rect x="30.0" y="90.0" width="230.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="120.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Процесор (CPU)</tspan><tspan x="145.0" dy="14.3">Ядра, планувальник, черги runqueue</tspan></text>
<line x1="260.0" y1="124.0" x2="285.0" y2="124.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="168.0" width="230.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="198.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Пам'ять (RAM)</tspan><tspan x="145.0" dy="14.3">Фізичні сторінки, Swap, алокатори</tspan></text>
<line x1="260.0" y1="202.0" x2="285.0" y2="202.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="246.0" width="230.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Дисковий I/O</tspan><tspan x="145.0" dy="14.3">Блокові пристрої, NVMe/SATA, VFS</tspan></text>
<line x1="260.0" y1="280.0" x2="285.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="324.0" width="230.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="354.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Мережа (Network)</tspan><tspan x="145.0" dy="14.3">Інтерфейси, черги qdisc, сокети</tspan></text>
<line x1="260.0" y1="358.0" x2="285.0" y2="358.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="402.0" width="230.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Ресурси ядра</tspan><tspan x="145.0" dy="14.3">Таблиця дескрипторів, futex, IPC</tspan></text>
<line x1="260.0" y1="436.0" x2="285.0" y2="436.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="295.0" y="66.0" width="220.0" height="22.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="405.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Utilization</tspan></text>
<rect x="295.0" y="90.0" width="220.0" height="250.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="405.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Utilization (Утилізація)</tspan><tspan x="405.0" dy="14.3"></tspan><tspan x="405.0" dy="14.3">Частка часу або місткості,</tspan><tspan x="405.0" dy="14.3">протягом якої ресурс зайнятий</tspan><tspan x="405.0" dy="14.3">корисною роботою</tspan><tspan x="405.0" dy="14.3"></tspan><tspan x="405.0" dy="14.3">Метрики:</tspan><tspan x="405.0" dy="14.3">• %usr + %sys у mpstat</tspan><tspan x="405.0" dy="14.3">• %util у iostat</tspan><tspan x="405.0" dy="14.3">• Used RAM у free</tspan><tspan x="405.0" dy="14.3">• Throughput (B/s)</tspan></text>
<rect x="527.0" y="66.0" width="220.0" height="22.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="637.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="637.0" dy="0.0">Saturation</tspan></text>
<rect x="527.0" y="90.0" width="220.0" height="250.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="637.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">Saturation (Насичення)</tspan><tspan x="637.0" dy="14.3"></tspan><tspan x="637.0" dy="14.3">Обсяг відкладеної роботи,</tspan><tspan x="637.0" dy="14.3">яка стоїть у черзі через брак</tspan><tspan x="637.0" dy="14.3">пропускної здатності</tspan><tspan x="637.0" dy="14.3"></tspan><tspan x="637.0" dy="14.3">Метрики:</tspan><tspan x="637.0" dy="14.3">• runqueue (r) у vmstat</tspan><tspan x="637.0" dy="14.3">• aqu-sz у iostat</tspan><tspan x="637.0" dy="14.3">• si/so (свопінг)</tspan><tspan x="637.0" dy="14.3">• PSI pressure (avg10)</tspan></text>
<rect x="759.0" y="66.0" width="220.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="869.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="869.0" dy="0.0">Errors</tspan></text>
<rect x="759.0" y="90.0" width="220.0" height="250.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="869.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="869.0" dy="0.0">Errors (Помилки)</tspan><tspan x="869.0" dy="14.3"></tspan><tspan x="869.0" dy="14.3">Кількість збоїв, відкинутих</tspan><tspan x="869.0" dy="14.3">запитів, ретрансмітів чи</tspan><tspan x="869.0" dy="14.3">апаратних переривань</tspan><tspan x="869.0" dy="14.3"></tspan><tspan x="869.0" dy="14.3">Метрики:</tspan><tspan x="869.0" dy="14.3">• majflt у pidstat</tspan><tspan x="869.0" dy="14.3">• dropped/overruns у ip</tspan><tspan x="869.0" dy="14.3">• I/O errors у dmesg</tspan><tspan x="869.0" dy="14.3">• TCP retransmits</tspan></text>
<rect x="295.0" y="360.0" width="684.0" height="155.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.2"/>
<text x="637.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зіставлення з методом RED для прикладних сервісів</text>
<rect x="307.0" y="396.0" width="212.0" height="105.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.4"/><text x="413.0" y="430.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">Rate (Частота)</tspan><tspan x="413.0" dy="14.3"></tspan><tspan x="413.0" dy="14.3">Кількість запитів на секунду</tspan><tspan x="413.0" dy="14.3">(RPS / QPS застосунку)</tspan></text>
<rect x="531.0" y="396.0" width="212.0" height="105.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="637.0" y="430.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">Errors (Помилки)</tspan><tspan x="637.0" dy="14.3"></tspan><tspan x="637.0" dy="14.3">Кількість невдалих відповідей</tspan><tspan x="637.0" dy="14.3">(HTTP 5xx, failed RPC)</tspan></text>
<rect x="755.0" y="396.0" width="212.0" height="105.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.4"/><text x="861.0" y="430.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="861.0" dy="0.0">Duration (Тривалість)</tspan><tspan x="861.0" dy="14.3"></tspan><tspan x="861.0" dy="14.3">Гістограма латентності відгуку</tspan><tspan x="861.0" dy="14.3">(квантилі p50, p95, p99)</tspan></text>
</svg>