<line x1="610.0" y1="92.0" x2="610.0" y2="515.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="778.6" y="52.5" width="142.8" height="31.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="850.0" y="71.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Ядро: Канал (Pipe)</tspan></text>
<line x1="850.0" y1="92.0" x2="850.0" y2="515.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="130.0" y1="115.0" x2="850.0" y2="115.0" stroke="#2563eb" stroke-width="1.4"/>
<rect x="317.7" y="96.4" width="344.5" height="17.2" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="490.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">pipe2(&amp;pfd, O_CLOEXEC) → виділення кільцевого буфера 64 КіБ</tspan></text>
<line x1="130.0" y1="145.0" x2="370.0" y2="145.0" stroke="#2563eb" stroke-width="1.4"/>
<rect x="172.6" y="126.4" width="154.8" height="17.2" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle"><tspan x="250.0" dy="0.0">fork() → Дитина 1 (PID 2001)</tspan></text>
<line x1="130.0" y1="175.0" x2="610.0" y2="175.0" stroke="#2563eb" stroke-width="1.4"/>
<rect x="292.6" y="156.4" width="154.8" height="17.2" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle"><tspan x="370.0" dy="0.0">fork() → Дитина 2 (PID 2002)</tspan></text>
<line x1="130.0" y1="205.0" x2="610.0" y2="205.0" stroke="#7e22ce" stroke-width="1.4"/>
<rect x="209.1" y="186.4" width="321.7" height="17.2" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="370.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">setpgid(2001, 2001) + setpgid(2002, 2001) [єдина група]</tspan></text>
<rect x="-32.0" y="225.2" width="324.1" height="19.5" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="238.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="130.0" dy="0.0">tcsetpgrp(tty, 2001) → передача переднього плану термінала</tspan></text>
<line x1="370.0" y1="265.0" x2="850.0" y2="265.0" stroke="#0d9488" stroke-width="1.4"/>
<rect x="474.9" y="246.4" width="270.2" height="17.2" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="610.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle"><tspan x="610.0" dy="0.0">dup2(pfd[1], 1) → write(1, data) [потоковий запис]</tspan></text>
<line x1="610.0" y1="295.0" x2="850.0" y2="295.0" stroke="#7e22ce" stroke-width="1.4"/>
<rect x="589.7" y="276.4" width="280.7" height="17.2" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="730.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle"><tspan x="730.0" dy="0.0">dup2(pfd[0], 0) → read(0, buf) [потокове зчитування]</tspan></text>
<rect x="659.5" y="320.2" width="381.1" height="19.5" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="850.0" y="333.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">⚡ Backpressure: якщо буфер 64 КіБ заповнено, write() блокується</tspan></text>
<rect x="446.0" y="360.2" width="328.1" height="19.5" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="610.0" y="373.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">head прочитав 2 рядки і робить exit(0) [закриття FD 0]</tspan></text>
<line x1="850.0" y1="405.0" x2="370.0" y2="405.0" stroke="#dc2626" stroke-width="1.4"/>
<rect x="429.2" y="386.4" width="361.6" height="17.2" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="610.0" y="398.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">⚡ Дитина 1 робить черговий write() → ядро шле SIGPIPE (-EPIPE)</tspan></text>
<rect x="232.3" y="430.2" width="275.3" height="19.5" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="370.0" y="443.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle"><tspan x="370.0" dy="0.0">Дитина 1 гине від SIGPIPE (статус 128 + 13 = 141)</tspan></text>
<line x1="130.0" y1="475.0" x2="610.0" y2="475.0" stroke="#2563eb" stroke-width="1.4"/>
<rect x="197.7" y="456.4" width="344.5" height="17.2" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="468.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">waitpid(-2001, &amp;st, 0) → збір кодів виходу, pipefail аналіз</tspan></text>
<rect x="-45.8" y="495.2" width="351.6" height="19.5" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="508.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">tcsetpgrp(tty, shell_pgid) → повернення термінала оболонці</tspan></text>
