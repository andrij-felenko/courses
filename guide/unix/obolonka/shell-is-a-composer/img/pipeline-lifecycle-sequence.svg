<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55.8 -10 1106.4 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-55.8" y="-10" width="1106.4" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Повна хронологія конвеєра: налаштування, потокова передача та завершення</text>
<rect x="65.4" y="52.5" width="129.1" height="31.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="130.0" y="71.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Оболонка (Shell)</tspan></text>
<line x1="130.0" y1="92.0" x2="130.0" y2="515.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="308.9" y="52.5" width="122.3" height="31.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="370.0" y="71.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Дитина 1 (grep)</tspan></text>
<line x1="370.0" y1="92.0" x2="370.0" y2="515.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
