<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сім фаз розкриття командного рядка в оболонці</text>
<rect x="260.0" y="20.0" width="540.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="530.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Вхідний командний рядок: сирий потік символів від користувача</tspan></text>
<line x1="530.0" y1="62.0" x2="530.0" y2="95.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="95.0" width="450.0" height="60.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">1. Розкриття фігурних дужок (Brace Expansion)</tspan><tspan x="265.0" dy="14.3">Генерація текстових комбінацій: a{1,2}b → a1b a2b</tspan><tspan x="265.0" dy="14.3">(виконується ДО будь-яких перевірок змінних і файлів)</tspan></text>
<rect x="530.0" y="95.0" width="490.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="775.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Властивість: суто синтаксичний генератор рядків.</tspan><tspan x="775.0" dy="14.3">Не знає про змінні чи файли; створює нові токени для конвеєра.</tspan></text>
<line x1="265.0" y1="155.0" x2="265.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="450.0" height="55.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">2. Розкриття тильди (Tilde Expansion)</tspan><tspan x="265.0" dy="14.3">Заміна префікса ~ на $HOME або домашній каталог користувача</tspan><tspan x="265.0" dy="14.3">~ → /home/user, ~alice → /home/alice</tspan></text>
<rect x="530.0" y="180.0" width="490.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="775.0" y="211.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Властивість: замінює префікс на початку слова або після «:» у PATH.</tspan></text>
<line x1="265.0" y1="235.0" x2="265.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="450.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="265.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">3. Потрійна підстановка в один прохід (зліва направо)</tspan><tspan x="265.0" dy="14.3">• Параметри та змінні: $VAR, ${VAR:-default}</tspan><tspan x="265.0" dy="14.3">• Підстановка команд: $(command) або `command`</tspan><tspan x="265.0" dy="14.3">• Арифметичні вирази: $((x + 2 * y))</tspan></text>
<rect x="530.0" y="260.0" width="490.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="775.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Критичний момент: підстановки генерують новий текст.</tspan><tspan x="775.0" dy="14.3">Саме цей згенерований текст (якщо він НЕ в лапках) підлягає</tspan><tspan x="775.0" dy="14.3">наступному розбиттю на слова (Word Splitting).</tspan></text>
<line x1="265.0" y1="335.0" x2="265.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="360.0" width="450.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="265.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">4. Поділ на слова (Word Splitting за IFS)</tspan><tspan x="265.0" dy="11.7">Сканування результатів фази 3 на символи з $IFS (пробіл, TAB, LF)</tspan><tspan x="265.0" dy="11.7">⚠️ Відбувається ТІЛЬКИ для результатів підстановок без подвійних лапок!</tspan></text>
<rect x="530.0" y="360.0" width="490.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="775.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Головне джерело помилок: рядок «My Photo.jpg» без лапок</tspan><tspan x="775.0" dy="14.3">розривається на два незалежні аргументи «My» та «Photo.jpg».</tspan></text>
<line x1="265.0" y1="425.0" x2="265.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="450.0" width="450.0" height="55.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="474.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">5. Розгортання імен файлів (Filename Expansion / Globbing)</tspan><tspan x="265.0" dy="13.0">Зіставлення незахищених масок *, ?, [...] з файлами на диску через VFS</tspan></text>
<rect x="530.0" y="450.0" width="490.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="775.0" y="481.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Властивість: якщо збігів немає, за стандартом POSIX маска лишається як є.</tspan></text>
<line x1="265.0" y1="505.0" x2="265.0" y2="530.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="530.0" width="450.0" height="55.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="554.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">6. Видалення лапок (Quote Removal)</tspan><tspan x="265.0" dy="13.0">Вилучення синтаксичних лапок (', &quot;, \), які захищали текст на фазах 4 і 5</tspan></text>
<rect x="530.0" y="530.0" width="490.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Підсумок: сформовано чистий масив char *argv[] для execve(2).</tspan><tspan x="775.0" dy="14.3">Ядро Linux отримує готові відокремлені аргументи без лапок.</tspan></text>
</svg>