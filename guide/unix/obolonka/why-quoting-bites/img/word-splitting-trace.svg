<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння розкриття змінної з пробілом у лапках та без лапок</text>
<rect x="200.0" y="20.0" width="640.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="43.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Походження пастки: шлях змінної FILE=&quot;My Photo.jpg&quot;</tspan></text>
<rect x="40.0" y="75.0" width="460.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">НЕБЕЗПЕЧНО: rm $FILE (без лапок)</tspan></text>
<line x1="270.0" y1="115.0" x2="270.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="140.0" width="460.0" height="50.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Фаза 3 (Parameter Expansion):</tspan><tspan x="270.0" dy="14.3">Змінна $FILE розгортається в текст: rm My Photo.jpg</tspan></text>
<line x1="270.0" y1="190.0" x2="270.0" y2="215.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="215.0" width="460.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Фаза 4 (Word Splitting за IFS=' \t\n'):</tspan><tspan x="270.0" dy="14.3">Оболонка бачить незахищений пробіл у згенерованому тексті</tspan><tspan x="270.0" dy="14.3">→ Створює ДВА окремі токени: [&quot;My&quot;] та [&quot;Photo.jpg&quot;]!</tspan></text>
<line x1="270.0" y1="280.0" x2="270.0" y2="305.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="305.0" width="460.0" height="50.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="270.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Фаза 5 та 6 (Globbing &amp; Quote Removal):</tspan><tspan x="270.0" dy="14.3">Токени «My» та «Photo.jpg» не є масками й лишаються без змін.</tspan></text>
<line x1="270.0" y1="355.0" x2="270.0" y2="380.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="380.0" width="460.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="402.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Підсумок системного виклику execve(&quot;/bin/rm&quot;, argv, ...):</tspan><tspan x="270.0" dy="13.0">argv[0] = &quot;rm&quot;</tspan><tspan x="270.0" dy="13.0">argv[1] = &quot;My&quot;</tspan><tspan x="270.0" dy="13.0">argv[2] = &quot;Photo.jpg&quot;</tspan><tspan x="270.0" dy="13.0">💥 Катастрофа: rm намагається видалити два неіснуючі файли!</tspan></text>
<rect x="540.0" y="75.0" width="460.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="770.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">ПРАВИЛЬНО: rm &quot;$FILE&quot; (у подвійних лапках)</tspan></text>
<line x1="770.0" y1="115.0" x2="770.0" y2="140.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="140.0" width="460.0" height="50.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="770.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Фаза 3 (Parameter Expansion):</tspan><tspan x="770.0" dy="13.0">Змінна $FILE розгортається всередині захищеного блоку: rm &quot;My Photo.jpg&quot;</tspan></text>
<line x1="770.0" y1="190.0" x2="770.0" y2="215.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="215.0" width="460.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Фаза 4 (Word Splitting):</tspan><tspan x="770.0" dy="13.0">ЗАБЛОКОВАНО подвійними лапками!</tspan><tspan x="770.0" dy="13.0">Пробіл розглядається як буквальний символ даних, а не роздільник слів.</tspan></text>
<line x1="770.0" y1="280.0" x2="770.0" y2="305.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="305.0" width="460.0" height="50.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="770.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Фаза 6 (Quote Removal):</tspan><tspan x="770.0" dy="14.3">Оболонка знімає захисні лапки. Рядок лишається єдиним токеном.</tspan></text>
<line x1="770.0" y1="355.0" x2="770.0" y2="380.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="380.0" width="460.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="770.0" y="402.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Підсумок системного виклику execve(&quot;/bin/rm&quot;, argv, ...):</tspan><tspan x="770.0" dy="13.0">argv[0] = &quot;rm&quot;</tspan><tspan x="770.0" dy="13.0">argv[1] = &quot;My Photo.jpg&quot;</tspan><tspan x="770.0" dy="13.0"></tspan><tspan x="770.0" dy="13.0">✓ Успіх: програма rm отримує рівно один аргумент із пробілом.</tspan></text>
</svg>