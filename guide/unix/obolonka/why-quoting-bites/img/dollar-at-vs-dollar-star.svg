<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння розгортання векторних параметрів</text>
<rect x="180.0" y="20.0" width="680.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="43.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Позиційні параметри: вхід $1=&quot;a b&quot;, $2=&quot;c&quot;, $3=&quot;d e&quot;</tspan></text>
<rect x="40.0" y="75.0" width="460.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="270.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Конструкція &quot;$@&quot; (у лапках)</tspan></text>
<rect x="40.0" y="111.0" width="290.0" height="140.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="185.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Розкривається як: &quot;$1&quot; &quot;$2&quot; &quot;$3&quot;</tspan><tspan x="185.0" dy="13.0">• Ідеально зберігає межі кожного елемента</tspan><tspan x="185.0" dy="13.0">• Не розбиває пробіли всередині параметрів</tspan><tspan x="185.0" dy="13.0">• Не залежить від змінної IFS</tspan><tspan x="185.0" dy="13.0">• Генерує N окремих слів (за кількістю $#)</tspan></text>
<rect x="340.0" y="111.0" width="160.0" height="140.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Результат execve:</tspan><tspan x="420.0" dy="12.3"></tspan><tspan x="420.0" dy="12.3">argv[1] = &quot;a b&quot;</tspan><tspan x="420.0" dy="12.3">argv[2] = &quot;c&quot;</tspan><tspan x="420.0" dy="12.3">argv[3] = &quot;d e&quot;</tspan><tspan x="420.0" dy="12.3"></tspan><tspan x="420.0" dy="12.3">(Всього 3 аргументи)</tspan></text>
<rect x="540.0" y="75.0" width="460.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Конструкція &quot;$*&quot; (у лапках)</tspan></text>
<rect x="540.0" y="111.0" width="290.0" height="140.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.2"/><text x="685.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Розкривається як: &quot;$1c$2c$3&quot; (де c — перший символ IFS)</tspan><tspan x="685.0" dy="11.7">• Склеює всі параметри в ОДИН суцільний рядок</tspan><tspan x="685.0" dy="11.7">• При дефолтному IFS склеює через пробіл</tspan><tspan x="685.0" dy="11.7">• Знищує початкові межі масиву</tspan><tspan x="685.0" dy="11.7">• Генерує РІВНО 1 аргумент</tspan></text>
<rect x="840.0" y="111.0" width="160.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="920.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Результат execve:</tspan><tspan x="920.0" dy="12.3"></tspan><tspan x="920.0" dy="12.3">argv[1] = &quot;a b c d e&quot;</tspan><tspan x="920.0" dy="12.3"></tspan><tspan x="920.0" dy="12.3">(Всього 1 аргумент)</tspan></text>
<rect x="40.0" y="295.0" width="460.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Конструкція $@ (без лапок)</tspan></text>
<rect x="40.0" y="331.0" width="290.0" height="140.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="185.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Розкривається у потік слів, після чого підлягає Word Splitting за IFS</tspan><tspan x="185.0" dy="11.7">• Пробіли всередині «a b» розривають параметр на «a» та «b»</tspan><tspan x="185.0" dy="11.7">• Межі елементів втрачено</tspan><tspan x="185.0" dy="11.7">• Підлягає випадковому глобінгу, якщо в тексті є * чи ?</tspan></text>
<rect x="340.0" y="331.0" width="160.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Результат execve:</tspan><tspan x="420.0" dy="12.3"></tspan><tspan x="420.0" dy="12.3">argv[1] = &quot;a&quot;</tspan><tspan x="420.0" dy="12.3">argv[2] = &quot;b&quot;</tspan><tspan x="420.0" dy="12.3">argv[3] = &quot;c&quot;</tspan><tspan x="420.0" dy="12.3">argv[4] = &quot;d&quot;</tspan><tspan x="420.0" dy="12.3">argv[5] = &quot;e&quot;</tspan><tspan x="420.0" dy="12.3">(Всього 5 аргументів)</tspan></text>
<rect x="540.0" y="295.0" width="460.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Конструкція $* (без лапок)</tspan></text>
<rect x="540.0" y="331.0" width="290.0" height="140.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="685.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Поводиться аналогічно $@ без лапок:</tspan><tspan x="685.0" dy="11.7">• Спершу підставляє параметри, потім ділить на слова по IFS</tspan><tspan x="685.0" dy="11.7">• Пробіли всередині аргументів руйнують початковий масив</tspan><tspan x="685.0" dy="11.7">• Ніколи не використовуйте для передачі аргументів!</tspan></text>
<rect x="840.0" y="331.0" width="160.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Результат execve:</tspan><tspan x="920.0" dy="12.3"></tspan><tspan x="920.0" dy="12.3">argv[1] = &quot;a&quot;</tspan><tspan x="920.0" dy="12.3">argv[2] = &quot;b&quot;</tspan><tspan x="920.0" dy="12.3">argv[3] = &quot;c&quot;</tspan><tspan x="920.0" dy="12.3">argv[4] = &quot;d&quot;</tspan><tspan x="920.0" dy="12.3">argv[5] = &quot;e&quot;</tspan><tspan x="920.0" dy="12.3">(Всього 5 аргументів)</tspan></text>
</svg>