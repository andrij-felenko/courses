<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">ВІД AGETTY ДО ОБОЛОНКИ: СТВОРЕННЯ СЕАНСУ ТА АВТЕНТИФІКАЦІЯ</text>
<rect x="30.0" y="55.0" width="275.0" height="435.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="167.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">1. AGETTY ТА TTY НОДА</text>
<rect x="45.0" y="95.0" width="245.0" height="60.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="167.5" y="110.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">systemd-getty-generator</tspan><tspan x="167.5" dy="11.7">Динамічно створює юніт</tspan><tspan x="167.5" dy="11.7">getty@tty1.service</tspan><tspan x="167.5" dy="11.7">при відкритті консолі</tspan></text>
<rect x="45.0" y="165.0" width="245.0" height="75.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="167.5" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Відкриття /dev/tty1</tspan><tspan x="167.5" dy="11.7">Системний виклик open()</tspan><tspan x="167.5" dy="11.7">Налаштування termios:</tspan><tspan x="167.5" dy="11.7">- Baud rate (38400)</tspan><tspan x="167.5" dy="11.7">- ICRNL (переклад CR у NL)</tspan><tspan x="167.5" dy="11.7">- ECHO (відображення вводу)</tspan></text>
<rect x="45.0" y="250.0" width="245.0" height="65.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="167.5" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Вивід запрошення</tspan><tspan x="167.5" dy="11.7">Зчитування /etc/issue</tspan><tspan x="167.5" dy="11.7">Вивід на екран рядка:</tspan><tspan x="167.5" dy="11.7">'Ubuntu 24.04 LTS'</tspan><tspan x="167.5" dy="11.7">'hostname login: '</tspan></text>
<rect x="45.0" y="325.0" width="245.0" height="75.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="167.5" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">Зчитування імені</tspan><tspan x="167.5" dy="11.7">Користувач вводить логін</tspan><tspan x="167.5" dy="11.7">agetty очищає буфер</tspan><tspan x="167.5" dy="11.7">і викликає через execve:</tspan><tspan x="167.5" dy="11.7">/bin/login username</tspan></text>
<rect x="45.0" y="410.0" width="245.0" height="65.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="167.5" y="439.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Результат фази 1:</tspan><tspan x="167.5" dy="11.7">Процес agetty передає TTY дескриптор програмі login</tspan></text>
<line x1="305.0" y1="270.0" x2="335.0" y2="270.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="335.0" y="55.0" width="290.0" height="435.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="480.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">2. КОНВЕЄР PAM ТА LOGIND</text>
<rect x="350.0" y="95.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="480.0" y="110.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Стек /etc/pam.d/login</tspan><tspan x="480.0" dy="11.7">Послідовний запуск модулів</tspan><tspan x="480.0" dy="11.7">auth, account, password,</tspan><tspan x="480.0" dy="11.7">session</tspan></text>
<rect x="350.0" y="165.0" width="260.0" height="75.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="480.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">pam_unix.so (auth)</tspan><tspan x="480.0" dy="11.7">Запит пароля користувача</tspan><tspan x="480.0" dy="11.7">(прихований ввід без echo)</tspan><tspan x="480.0" dy="11.7">Обчислення SHA-512 / yescrypt</tspan><tspan x="480.0" dy="11.7">Звірка з /etc/shadow</tspan></text>
<rect x="350.0" y="250.0" width="260.0" height="65.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">pam_systemd.so (session)</tspan><tspan x="480.0" dy="11.7">Реєстрація у systemd-logind</tspan><tspan x="480.0" dy="11.7">через D-Bus метод:</tspan><tspan x="480.0" dy="11.7">CreateSession()</tspan></text>
<rect x="350.0" y="325.0" width="260.0" height="75.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="480.0" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Виділення ресурсів сесії</tspan><tspan x="480.0" dy="11.7">logind створює cgroup:</tspan><tspan x="480.0" dy="11.7">user-1000.slice/session-1.scope</tspan><tspan x="480.0" dy="11.7">Монтує /run/user/1000 (tmpfs)</tspan><tspan x="480.0" dy="11.7">Призначає права на seat0</tspan></text>
<rect x="350.0" y="410.0" width="260.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="433.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Результат фази 2:</tspan><tspan x="480.0" dy="11.7">Користувача автентифіковано,</tspan><tspan x="480.0" dy="11.7">сеанс зареєстровано в ядрі</tspan></text>
<line x1="625.0" y1="270.0" x2="655.0" y2="270.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="655.0" y="55.0" width="275.0" height="435.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="792.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">3. ІНТЕРАКТИВНИЙ SHELL</text>
<rect x="670.0" y="95.0" width="245.0" height="60.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="792.5" y="110.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Зниження привілеїв</tspan><tspan x="792.5" dy="11.7">login отримує дані з /etc/passwd:</tspan><tspan x="792.5" dy="11.7">UID=1000, GID=1000</tspan><tspan x="792.5" dy="11.7">setgid(1000) -&gt; initgroups()</tspan></text>
<rect x="670.0" y="165.0" width="245.0" height="75.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="792.5" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Зміна ідентифікатора</tspan><tspan x="792.5" dy="11.7">setuid(1000)</tspan><tspan x="792.5" dy="11.7">Процес остаточно втрачає</tspan><tspan x="792.5" dy="11.7">права суперкористувача root</tspan><tspan x="792.5" dy="11.7">і стає звичайним користувачем</tspan></text>
<rect x="670.0" y="250.0" width="245.0" height="65.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="792.5" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="792.5" dy="0.0">Змінні середовища</tspan><tspan x="792.5" dy="11.7">HOME=/home/user</tspan><tspan x="792.5" dy="11.7">USER=user</tspan><tspan x="792.5" dy="11.7">SHELL=/bin/bash</tspan><tspan x="792.5" dy="11.7">PATH=/usr/bin:...</tspan></text>
<rect x="670.0" y="325.0" width="245.0" height="75.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="792.5" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="792.5" dy="0.0">Перехід у домашній каталог</tspan><tspan x="792.5" dy="11.7">chdir('/home/user')</tspan><tspan x="792.5" dy="11.7">Виклик системної функції:</tspan><tspan x="792.5" dy="11.7">execve('/bin/bash', ['-bash'], envp)</tspan><tspan x="792.5" dy="11.7">Мінус означає 'login shell'</tspan></text>
<rect x="670.0" y="410.0" width="245.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="792.5" y="433.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="792.5" dy="0.0">Результат фази 3:</tspan><tspan x="792.5" dy="11.7">Користувач бачить запрошення:</tspan><tspan x="792.5" dy="11.7">'user@host:~$ ' — система готова!</tspan></text>
</svg>