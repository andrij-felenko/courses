<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="840.0" height="160.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="40.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПРОСТІР ЯДРА: ПІДСИСТЕМА KOBJECT ТА СОКЕТ NETLINK</text>
<rect x="40.0" y="55.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="225.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">kobject_uevent_env(kobj, KOBJ_ADD, env)</tspan><tspan x="225.0" dy="13.0">Збирає буфер змінних kobj_uevent_env:</tspan><tspan x="225.0" dy="13.0">  ACTION=add</tspan><tspan x="225.0" dy="13.0">  DEVPATH=/devices/pci0000:00/.../usb1/1-1</tspan><tspan x="225.0" dy="13.0">  SUBSYSTEM=usb</tspan><tspan x="225.0" dy="13.0">  MODALIAS=usb:v0403p6001...</tspan></text>
<line x1="410.0" y1="102.0" x2="470.0" y2="102.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="55.0" width="370.0" height="95.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="655.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Ядерний сокет Netlink:</tspan><tspan x="655.0" dy="13.0">netlink_broadcast(uevent_sock, skb, 0, 1, GFP_KERNEL)</tspan><tspan x="655.0" dy="13.0">Передає сформований sk_buff у черги сокетів</tspan><tspan x="655.0" dy="13.0">усіх процесів, підписаних на групу 1</tspan></text>
<line x1="655.0" y1="180.0" x2="655.0" y2="230.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="225.0" y1="180.0" x2="225.0" y2="230.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="440.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Межа ядра / Системний виклик recvmsg(fd, &amp;msg, 0)</text>
<rect x="20.0" y="230.0" width="840.0" height="270.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="40.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ПРОСТІР КОРИСТУВАЧА: ПІДПИСНИКИ НА NETLINK_KOBJECT_UEVENT (Група 1)</text>
<rect x="40.0" y="270.0" width="370.0" height="110.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="225.0" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Головний демон: systemd-udevd</tspan><tspan x="225.0" dy="13.0">socket(AF_NETLINK, SOCK_RAW, 15)</tspan><tspan x="225.0" dy="13.0">bind(fd, {nl_family=AF_NETLINK, nl_groups=1})</tspan><tspan x="225.0" dy="13.0">Читає пакунок, парсить рядки 'KEY=VALUE\0'</tspan><tspan x="225.0" dy="13.0">Створює подію udev_event і передає worker'у</tspan></text>
<rect x="470.0" y="270.0" width="370.0" height="110.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="655.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Утиліти моніторингу (udevadm / власні програми)</tspan><tspan x="655.0" dy="13.0">udevadm monitor --environment</tspan><tspan x="655.0" dy="13.0">Отримує точну копію сирого пакета з ядра</tspan><tspan x="655.0" dy="13.0">Виводить у термінал весь набір змінних оточення</tspan></text>
<line x1="225.0" y1="380.0" x2="225.0" y2="410.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="655.0" y1="380.0" x2="655.0" y2="410.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="410.0" width="370.0" height="75.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="225.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Конвеєр обробки systemd-udevd:</tspan><tspan x="225.0" dy="14.3">Виконання правил -&gt; Завантаження модулів -&gt;</tspan><tspan x="225.0" dy="14.3">Налаштування /dev -&gt; Симлінки -&gt; udev db</tspan></text>
<rect x="470.0" y="410.0" width="370.0" height="75.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="655.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Відображення події в реальному часі:</tspan><tspan x="655.0" dy="14.3">Діагностика під'єднання пристроїв,</tspan><tspan x="655.0" dy="14.3">автоматизація скриптів налагодження</tspan></text>
</svg>