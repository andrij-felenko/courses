<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="840.0" height="110.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1. АПАРАТНІ ІДЕНТИФІКАТОРИ З ДЕСКРИПТОРІВ USB (Дескриптор пристрою та інтерфейсу)</text>
<rect x="40.0" y="55.0" width="255.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="167.5" y="67.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">Дескриптор пристрою:</tspan><tspan x="167.5" dy="14.3">idVendor = 0x0403 (FTDI)</tspan><tspan x="167.5" dy="14.3">idProduct = 0x6001 (FT232R)</tspan><tspan x="167.5" dy="14.3">bcdDevice = 0x0600</tspan></text>
<rect x="310.0" y="55.0" width="265.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="442.5" y="67.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="442.5" dy="0.0">Класи пристрою:</tspan><tspan x="442.5" dy="14.3">bDeviceClass = 0x00</tspan><tspan x="442.5" dy="14.3">bDeviceSubClass = 0x00</tspan><tspan x="442.5" dy="14.3">bDeviceProtocol = 0x00</tspan></text>
<rect x="590.0" y="55.0" width="255.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="717.5" y="67.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">Дескриптор інтерфейсу:</tspan><tspan x="717.5" dy="14.3">bInterfaceClass = 0xFF (Vendor)</tspan><tspan x="717.5" dy="14.3">bInterfaceSubClass = 0xFF</tspan><tspan x="717.5" dy="14.3">bInterfaceProtocol = 0xFF</tspan></text>
<line x1="440.0" y1="130.0" x2="440.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="170.0" width="840.0" height="105.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="40.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. СИНТЕЗ РЯДКА MODALIAS У ЯДРІ (Макрос usb_make_modalias)</text>
<rect x="40.0" y="205.0" width="800.0" height="55.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">MODALIAS = &quot;usb:v0403p6001d0600dc00dsc00dp00icFFiscFFipFFin00&quot;</tspan><tspan x="440.0" dy="13.0">Синтаксис: v[VID] p[PID] d[REV] dc[Клас] dsc[Підклас] dp[Протокол] ic[КласIF] isc[ПідкласIF] ip[ПротоколIF] in[НомерIF]</tspan></text>
<line x1="440.0" y1="275.0" x2="440.0" y2="315.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="315.0" width="840.0" height="205.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="40.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3. ЗІСТАВЛЕННЯ ТА ЗАВАНТАЖЕННЯ ДРАЙВЕРА (libkmod / modules.alias)</text>
<rect x="40.0" y="350.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="230.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Таблиця ідентифікаторів у C-коді драйвера:</tspan><tspan x="230.0" dy="13.0">static const struct usb_device_id id_table[] = {</tspan><tspan x="230.0" dy="13.0">    { USB_DEVICE(0x0403, 0x6001) }, ...</tspan><tspan x="230.0" dy="13.0">};</tspan><tspan x="230.0" dy="13.0">MODULE_DEVICE_TABLE(usb, id_table);</tspan></text>
<line x1="420.0" y1="387.0" x2="470.0" y2="387.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="350.0" width="370.0" height="75.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="655.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Генерація depmod при складанні ядра:</tspan><tspan x="655.0" dy="13.0">/lib/modules/$(uname -r)/modules.alias:</tspan><tspan x="655.0" dy="13.0">alias usb:v0403p6001d*dc*dsc*dp*ic*isc*ip*in* ftdi_sio</tspan></text>
<line x1="655.0" y1="425.0" x2="655.0" y2="445.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="230.0" y1="425.0" x2="230.0" y2="445.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="445.0" width="380.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="230.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">systemd-udevd викликає libkmod:</tspan><tspan x="230.0" dy="14.3">Знаходить модуль ftdi_sio за шаблоном alias</tspan><tspan x="230.0" dy="14.3">Завантажує модуль у ядро (finit_module)</tspan></text>
<rect x="470.0" y="445.0" width="370.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="655.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Ядерна шина usb_bus_type:</tspan><tspan x="655.0" dy="14.3">Викликає match() -&gt; знаходить збіг -&gt; probe()</tspan><tspan x="655.0" dy="14.3">Драйвер бере контроль над кінцевими точками</tspan></text>
</svg>