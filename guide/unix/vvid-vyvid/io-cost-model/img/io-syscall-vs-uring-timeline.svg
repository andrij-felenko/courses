<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="900.0" height="190.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">СИНХРОННИЙ ПІДХІД: 1 СИСТЕМНИЙ ВИКЛИК НА КОЖНУ ПОРЦІЮ (READ/WRITE)</text>
<rect x="50.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="112.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="112.5" dy="0.0">Виклик read()</tspan><tspan x="112.5" dy="13.0">Ring 3 → Ring 0</tspan></text>
<line x1="175.0" y1="95.0" x2="200.0" y2="95.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="262.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Перехід у ядро</tspan><tspan x="262.5" dy="13.0">Збереження reg/CR3</tspan></text>
<line x1="325.0" y1="95.0" x2="350.0" y2="95.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="350.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="412.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">Копія даних</tspan><tspan x="412.5" dy="13.0">copy_to_user()</tspan></text>
<line x1="475.0" y1="95.0" x2="500.0" y2="95.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="562.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="562.5" dy="0.0">Вихід у Ring 3</tspan><tspan x="562.5" dy="13.0">Відновлення reg</tspan></text>
<line x1="625.0" y1="95.0" x2="650.0" y2="95.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="650.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="712.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Виклик write()</tspan><tspan x="712.5" dy="13.0">Ring 3 → Ring 0</tspan></text>
<line x1="775.0" y1="95.0" x2="800.0" y2="95.0" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="800.0" y="65.0" width="125.0" height="60.0" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="862.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="862.5" dy="0.0">Копія в sk_buff</tspan><tspan x="862.5" dy="13.0">copy_from_user()</tspan></text>
<rect x="50.0" y="140.0" width="860.0" height="55.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Ціна: N системних викликів + 2·N перемикань контексту + промахи кешу процесора при копіюванні.</tspan><tspan x="480.0" dy="14.3">Процесор витрачає до 60% тактів на службові переходи між кільцями захисту (Ring 3 ↔ Ring 0).</tspan></text>
<rect x="30.0" y="230.0" width="900.0" height="210.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="480.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">АСИНХРОННИЙ IO_URING: СПІЛЬНІ КІЛЬЦЯ ТА ПАКЕТУВАННЯ (ZERO-OVERHEAD)</text>
<rect x="50.0" y="275.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="165.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Запис у чергу SQ (Ring 3)</tspan><tspan x="165.0" dy="13.0">Програма формує 64 SQE</tspan><tspan x="165.0" dy="13.0">в спільній пам'яті (RAM)</tspan></text>
<line x1="280.0" y1="307.0" x2="340.0" y2="307.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="275.0" width="260.0" height="65.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Одноразовий io_uring_enter</tspan><tspan x="470.0" dy="13.0">(Або 0 викликів у режимі SQPOLL)</tspan><tspan x="470.0" dy="13.0">Ядро бере всю пачку SQE одразу</tspan></text>
<line x1="600.0" y1="307.0" x2="660.0" y2="307.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="275.0" width="250.0" height="65.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="785.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">3. Збір подій з кільця CQ</tspan><tspan x="785.0" dy="13.0">Програма читає готові CQE</tspan><tspan x="785.0" dy="13.0">без жодного системного виклику</tspan></text>
<rect x="50.0" y="360.0" width="860.0" height="65.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="480.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Виграш: Амортизація накладних витрат. 1 системний виклик на сотні операцій (або нуль при SQPOLL).</tspan><tspan x="480.0" dy="14.3">Відсутність копіювання буферів при IORING_REGISTER_BUFFERS. Процесор повністю зайнятий корисною роботою.</tspan></text>
</svg>