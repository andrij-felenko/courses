<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">ТРАНЗАКЦІЙНА ДОВГОВІЧНІСТЬ: WAL, БАР'ЄР СИНХРОНІЗАЦІЇ ТА ЧЕКПОІНТ</text>
<rect x="30.0" y="60.0" width="425.0" height="415.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="242.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">ШВИДКИЙ ТРАВНИЙ ШЛЯХ (WAL HOT PATH)</text>
<rect x="50.0" y="105.0" width="385.0" height="48.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="242.5" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">1. Буфер транзакції в пам'яті процесу</tspan><tspan x="242.5" dy="14.3">Формування запису: LSN + CRC32 + Зміни даних</tspan></text>
<line x1="242.0" y1="153.0" x2="242.0" y2="175.0" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="175.0" width="385.0" height="48.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="242.5" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">2. Послідовне дописування у файл WAL</tspan><tspan x="242.5" dy="14.3">write() або pwrite() у хвіст логу</tspan></text>
<line x1="242.0" y1="223.0" x2="242.0" y2="245.0" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="245.0" width="385.0" height="52.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="242.5" y="261.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="242.5" dy="0.0">3. Бар'єр довговічності: fdatasync(wal_fd)</tspan><tspan x="242.5" dy="13.0">Або груповий коміт (Group Commit 50 транзакцій)</tspan><tspan x="242.5" dy="13.0">Команда Flush / FUA до накопичувача</tspan></text>
<line x1="242.0" y1="297.0" x2="242.0" y2="320.0" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="320.0" width="385.0" height="45.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="242.5" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="242.5" dy="0.0">4. Відповідь клієнту: Commit OK / 200 OK</tspan><tspan x="242.5" dy="14.3">Транзакція гарантовано збережена на флеші</tspan></text>
<line x1="242.0" y1="365.0" x2="242.0" y2="390.0" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="390.0" width="385.0" height="70.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="242.5" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">5. Стан після раптової втрати живлення:</tspan><tspan x="242.5" dy="13.0">• Усі зафіксовані в WAL транзакції відтворюються (Replay)</tspan><tspan x="242.5" dy="13.0">• Пошкоджений хвіст (Torn Write) відкидається за CRC32</tspan><tspan x="242.5" dy="13.0">• Жодної втрати підтверджених даних!</tspan></text>
<rect x="480.0" y="60.0" width="450.0" height="415.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="705.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">АСИНХРОННИЙ ЧЕКПОІНТ (CHECKPOINTING)</text>
<rect x="505.0" y="105.0" width="400.0" height="52.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="705.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">А. Зміна сторінок таблиць у пам'яті (Buffer Pool)</tspan><tspan x="705.0" dy="13.0">B-Tree / LSM MemTable модифікуються в RAM</tspan><tspan x="705.0" dy="13.0">(Сторінки стають брудними)</tspan></text>
<line x1="705.0" y1="157.0" x2="705.0" y2="185.0" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="185.0" width="400.0" height="52.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="705.0" y="201.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Б. Фоновий потік витіснення (Checkpoint Thread)</tspan><tspan x="705.0" dy="13.0">Впорядкований запис брудних сторінок</tspan><tspan x="705.0" dy="13.0">у головні файли бази даних (.db / .sst)</tspan></text>
<line x1="705.0" y1="237.0" x2="705.0" y2="265.0" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="265.0" width="400.0" height="48.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="705.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">В. fsync(db_fd) для головного файлу</tspan><tspan x="705.0" dy="13.0">Фіксація сторінок на фізичному носії</tspan></text>
<line x1="705.0" y1="313.0" x2="705.0" y2="340.0" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="340.0" width="400.0" height="52.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="705.0" y="356.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">Г. Безпечне зрізання журналу (Truncate WAL)</tspan><tspan x="705.0" dy="13.0">Старі сегменти WAL видаляються,</tspan><tspan x="705.0" dy="13.0">бо дані вже живуть у головному сховищі</tspan></text>
<line x1="705.0" y1="392.0" x2="705.0" y2="415.0" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="415.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="705.0" y="434.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Чому чекпоінт не гальмує запити:</tspan><tspan x="705.0" dy="13.0">Виконується у фоні, оминаючи гарячий тракт коміту</tspan></text>
</svg>