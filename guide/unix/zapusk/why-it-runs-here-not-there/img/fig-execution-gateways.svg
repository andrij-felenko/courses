<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="920.0" height="500.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">П'ять бар'єрів виконання: де ламається переносимість бінарника</text>
<rect x="35.0" y="70.0" width="160.0" height="240.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.8"/>
<text x="115.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1. Ядро (execve)</text>
<line x1="45.0" y1="108.0" x2="185.0" y2="108.0" stroke="#2563eb" stroke-width="1.0"/>
<text x="115.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Що виконується:</text>
<text x="115.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Перевірка заголовка ELF,</text>
<text x="115.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">розпізнавання PT_INTERP</text>
<line x1="50.0" y1="200.0" x2="180.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="115.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Типова помилка:</text>
<text x="115.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Збій архітектури (ENOEXEC)</text>
<text x="115.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">або брак /lib64/ld.so (ENOENT)</text>
<line x1="198.0" y1="190.0" x2="214.0" y2="190.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="217.0" y="70.0" width="160.0" height="240.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="297.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">2. Завантажувач ld.so</text>
<line x1="227.0" y1="108.0" x2="367.0" y2="108.0" stroke="#7e22ce" stroke-width="1.0"/>
<text x="297.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Що виконується:</text>
<text x="297.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Ініціалізація пам'яті,</text>
<text x="297.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">пошук DT_NEEDED залежностей</text>
<line x1="232.0" y1="200.0" x2="362.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="297.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Типова помилка:</text>
<text x="297.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">cannot open shared object:</text>
<text x="297.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">немає бібліотеки чи хибний шлях</text>
<line x1="380.0" y1="190.0" x2="396.0" y2="190.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="399.0" y="70.0" width="160.0" height="240.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="479.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">3. Символи та ABI</text>
<line x1="409.0" y1="108.0" x2="549.0" y2="108.0" stroke="#dc2626" stroke-width="1.0"/>
<text x="479.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Що виконується:</text>
<text x="479.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Перевірка .gnu.version_r</text>
<text x="479.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">та розв'язання GOT/PLT</text>
<line x1="414.0" y1="200.0" x2="544.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="479.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Типова помилка:</text>
<text x="479.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">version GLIBC_2.34 not found</text>
<text x="479.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">або undefined symbol</text>
<line x1="562.0" y1="190.0" x2="578.0" y2="190.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="581.0" y="70.0" width="160.0" height="240.0" rx="8" fill="#fff6e5" stroke="#d97706" stroke-width="1.8"/>
<text x="661.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">4. C-Runtime (libc)</text>
<line x1="591.0" y1="108.0" x2="731.0" y2="108.0" stroke="#d97706" stroke-width="1.0"/>
<text x="661.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Що виконується:</text>
<text x="661.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Ініціалізація C-бібліотеки,</text>
<text x="661.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">потоки, пам'ять, NSS</text>
<line x1="596.0" y1="200.0" x2="726.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="661.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Типова помилка:</text>
<text x="661.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Розбіжність glibc проти musl,</text>
<text x="661.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">крах внутрішніх структур</text>
<line x1="744.0" y1="190.0" x2="760.0" y2="190.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="763.0" y="70.0" width="160.0" height="240.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.8"/>
<text x="843.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">5. Оточення процесу</text>
<line x1="773.0" y1="108.0" x2="913.0" y2="108.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="843.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Що виконується:</text>
<text x="843.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Конструктори .init_array,</text>
<text x="843.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">локалі, PATH, дескриптори</text>
<line x1="778.0" y1="200.0" x2="908.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="843.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Типова помилка:</text>
<text x="843.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Збій setlocale(LC_ALL),</text>
<text x="843.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">не знайдено утиліту в PATH</text>
<rect x="35.0" y="340.0" width="870.0" height="140.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Результат: виконання функції main() передається тільки після подолання всіх п'яти бар'єрів</text>
<text x="180.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Вхід: execve(&quot;./app&quot;, argv, envp)</text>
<line x1="295.0" y1="396.0" x2="360.0" y2="396.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Конвеєр завантаження та зв'язування</text>
<line x1="580.0" y1="396.0" x2="645.0" y2="396.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Вихід: передача керування в main()</text>
<text x="470.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Якщо хоча б один бар'єр не пройдено — процес негайно аварійно завершується до виконання першого рядка коду програми.</text>
<text x="470.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Діагностика: file -&gt; readelf -l/-d/-V -&gt; ldd / LD_TRACE_LOADED_OBJECTS -&gt; LD_DEBUG=libs,symbols</text>
</svg>