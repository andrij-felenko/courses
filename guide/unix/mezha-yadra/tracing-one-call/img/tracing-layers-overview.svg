<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="840.0" height="160.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ПРОСТІР КОРИСТУВАЧА (User Space / Ring 3)</text>
<rect x="20.0" y="190.0" width="840.0" height="410.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="33.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПРОСТІР ЯДРА (Kernel Space / Ring 0)</text>
<rect x="20.0" y="610.0" width="840.0" height="55.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="40.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">АПАРАТНИЙ РІВЕНЬ (Hardware / UART / Memory)</text>
<rect x="50.0" y="55.0" width="340.0" height="44.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="220.0" y="73.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">1. Застосунок: write(1, &quot;hello\n&quot;, 6)</tspan><tspan x="220.0" dy="14.3">Виклик функції C / C++</tspan></text>
<line x1="220.0" y1="99.0" x2="220.0" y2="115.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="115.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="220.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">2. glibc: обгортка системного виклику</tspan><tspan x="220.0" dy="14.3">%rax=1, %rdi=1, %rsi=buf, %rdx=6 -&gt; syscall</tspan></text>
<line x1="220.0" y1="170.0" x2="220.0" y2="225.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">syscall (пастка CPU)</text>
<rect x="50.0" y="225.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="220.0" y="252.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">3. Точка входу: entry_SYSCALL_64</tspan><tspan x="220.0" dy="11.7">swapgs -&gt; стек ядра -&gt; збереження pt_regs -&gt; do_syscall_64()</tspan></text>
<line x1="220.0" y1="285.0" x2="220.0" y2="305.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="305.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="220.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">4. Диспетчер викликів ядра</tspan><tspan x="220.0" dy="14.3">sys_call_table[1] -&gt; ksys_write(1, buf, 6)</tspan><tspan x="220.0" dy="14.3">fget_light() -&gt; пошук struct file за fd=1</tspan></text>
<line x1="220.0" y1="365.0" x2="220.0" y2="385.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="385.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="220.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">5. Шар VFS: vfs_write()</tspan><tspan x="220.0" dy="14.3">Перевірка прав доступу, rw_verify_area()</tspan><tspan x="220.0" dy="14.3">file-&gt;f_op-&gt;write_iter() (вибір драйвера)</tspan></text>
<line x1="220.0" y1="445.0" x2="220.0" y2="465.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="465.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="220.0" y="486.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">6. Дисципліна лінії TTY: n_tty_write()</tspan><tspan x="220.0" dy="11.7">Обробка символів, transl OPOST/ONLCR ('\n' -&gt; '\r\n')</tspan><tspan x="220.0" dy="11.7">copy_from_user(kbuf, ubuf, 6) зі SMAP</tspan></text>
<line x1="220.0" y1="525.0" x2="220.0" y2="545.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="545.0" width="340.0" height="48.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="220.0" y="565.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">7. Драйвер пристрою: uart_write() / 8250</tspan><tspan x="220.0" dy="14.3">Запис байтів у кільцевий буфер драйвера порта</tspan></text>
<line x1="220.0" y1="593.0" x2="220.0" y2="620.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="620.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="220.0" y="636.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">8. Контролер UART: запис у FIFO передавача</tspan><tspan x="220.0" dy="11.7">Апаратний зсувний регістр відправляє біти по дроту TX</tspan></text>
<line x1="390.0" y1="638.0" x2="490.0" y2="638.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">готово (6 Б)</text>
<rect x="490.0" y="545.0" width="340.0" height="48.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="660.0" y="565.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Драйвер підтверджує передачу</tspan><tspan x="660.0" dy="14.3">Повернення кількості записаних байтів: ret = 6</tspan></text>
<line x1="660.0" y1="545.0" x2="660.0" y2="525.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="465.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="660.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">VFS оновлює стан</tspan><tspan x="660.0" dy="14.3">Оновлення f_pos, mtime/ctime для файлів,</tspan><tspan x="660.0" dy="14.3">звільнення посилання на struct file (fdput)</tspan></text>
<line x1="660.0" y1="465.0" x2="660.0" y2="365.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="305.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="660.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Підготовка виходу з ядра: syscall_exit_work</tspan><tspan x="660.0" dy="13.0">Перевірка сигналів, перепланування (need_resched),</tspan><tspan x="660.0" dy="13.0">pt_regs-&gt;rax = 6 (або -errno)</tspan></text>
<line x1="660.0" y1="305.0" x2="660.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="225.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="660.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Повернення в Ring 3: sysretq</tspan><tspan x="660.0" dy="14.3">Відновлення RIP &lt;- RCX, RFLAGS &lt;- R11,</tspan><tspan x="660.0" dy="14.3">відновлення стека користувача RSP</tspan></text>
<line x1="660.0" y1="225.0" x2="660.0" y2="170.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="715.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">sysretq (вихід у Ring 3)</text>
<rect x="490.0" y="115.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">glibc: перевірка %rax</tspan><tspan x="660.0" dy="13.0">Якщо rax in [-4095..-1] -&gt; errno = -rax, ret = -1</tspan><tspan x="660.0" dy="13.0">Інакше -&gt; повернення 6 без змін</tspan></text>
<line x1="660.0" y1="115.0" x2="660.0" y2="99.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="55.0" width="340.0" height="44.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="73.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Застосунок продовжує виконання</tspan><tspan x="660.0" dy="14.3">Отримано результат 6, наступний рядок коду</tspan></text>
</svg>