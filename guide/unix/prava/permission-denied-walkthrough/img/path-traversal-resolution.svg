<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покомпонентний розбір шляху та перевірка біта x на каталогах</text>
<rect x="250.0" y="20.0" width="500.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="500.0" y="38.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Шлях запиту: /var/log/app/service.log</tspan><tspan x="500.0" dy="16.9">(Покомпонентний обхід VFS link_path_walk)</tspan></text>
<rect x="40.0" y="90.0" width="160.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">1. Каталог '/'</tspan><tspan x="120.0" dy="13.0">(root inode)</tspan><tspan x="120.0" dy="13.0"></tspan><tspan x="120.0" dy="13.0">Власник: root:root</tspan><tspan x="120.0" dy="13.0">Права: drwxr-xr-x (0755)</tspan><tspan x="120.0" dy="13.0"></tspan><tspan x="120.0" dy="13.0">Потрібно: +x (пошук)</tspan><tspan x="120.0" dy="13.0">Результат: OK</tspan></text>
<line x1="200.0" y1="150.0" x2="240.0" y2="150.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="240.0" y="90.0" width="160.0" height="120.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="320.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">2. Каталог 'var'</tspan><tspan x="320.0" dy="13.0">(inode /var)</tspan><tspan x="320.0" dy="13.0"></tspan><tspan x="320.0" dy="13.0">Власник: root:root</tspan><tspan x="320.0" dy="13.0">Права: drwxr-xr-x (0755)</tspan><tspan x="320.0" dy="13.0"></tspan><tspan x="320.0" dy="13.0">Потрібно: +x (пошук)</tspan><tspan x="320.0" dy="13.0">Результат: OK</tspan></text>
<line x1="400.0" y1="150.0" x2="440.0" y2="150.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="440.0" y="90.0" width="220.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="550.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">3. Каталог 'log'</tspan><tspan x="550.0" dy="13.0">(inode /var/log/app)</tspan><tspan x="550.0" dy="13.0"></tspan><tspan x="550.0" dy="13.0">Власник: app-admin:adm</tspan><tspan x="550.0" dy="13.0">Права: drwxr-x--- (0750)</tspan><tspan x="550.0" dy="13.0"></tspan><tspan x="550.0" dy="13.0">Процес: uid=1001 (www-data)</tspan><tspan x="550.0" dy="13.0">Потрібно: +x (пошук)</tspan><tspan x="550.0" dy="13.0">Результат: ВІДМОВА!</tspan></text>
<line x1="550.0" y1="230.0" x2="550.0" y2="280.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="410.0" y="280.0" width="280.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="550.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">ЯДРО ПЕРЕРИВАЄ ОБХІД: EACCES</tspan><tspan x="550.0" dy="13.0"></tspan><tspan x="550.0" dy="13.0">Брак біта виконання (+x) на проміжному</tspan><tspan x="550.0" dy="13.0">каталозі блокує будь-який вхід у піддерево</tspan></text>
<line x1="660.0" y1="150.0" x2="740.0" y2="150.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="740.0" y="90.0" width="220.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="850.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">4. Файл 'service.log'</tspan><tspan x="850.0" dy="13.0">(inode service.log)</tspan><tspan x="850.0" dy="13.0"></tspan><tspan x="850.0" dy="13.0">Власник: www-data:www-data</tspan><tspan x="850.0" dy="13.0">Права: -rwxrwxrwx (0777)</tspan><tspan x="850.0" dy="13.0"></tspan><tspan x="850.0" dy="13.0">СТАН: НЕ ДОСЯГНУТО!</tspan><tspan x="850.0" dy="13.0">(0777 не рятує від збою вище)</tspan></text>
<rect x="40.0" y="370.0" width="920.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="500.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ПРИНЦИП ПРОХОДЖЕННЯ ШЛЯХУ В КАТАЛОГАХ:</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">• Біт читання (+r) на каталозі дозволяє лише читати список імен (getdents64, вивід ls без атрибутів).</tspan><tspan x="500.0" dy="14.3">• Біт виконання (+x) на каталозі дозволяє пошук (lookup), перетин каталогу та доступ до inode об'єктів усередині.</tspan><tspan x="500.0" dy="14.3">• Якщо на будь-якому каталозі шляху бракує +x, ядро повертає EACCES незалежно від прав на сам цільовий файл.</tspan><tspan x="500.0" dy="14.3">• Для читання чи відкриття файлу за точним шляхом біт +r на каталогах НЕ потрібен — достатньо лише +x.</tspan></text>
</svg>