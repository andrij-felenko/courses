<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність безпечного скидання прав мережевого демона</text>
<rect x="40.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Старт із UID 0</text>
<rect x="50.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="123.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="123.0" dy="0.0">Процес запускається під root:</tspan><tspan x="123.0" dy="11.7">читає конф /etc, відкриває сокет на порту 80/443,</tspan><tspan x="123.0" dy="11.7">створює дескриптори логів.</tspan></text>
<line x1="223.0" y1="190.0" x2="237.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="330.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Налаштування Caps</text>
<rect x="250.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="330.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">prctl(PR_SET_KEEPCAPS, 1)</tspan><tspan x="330.0" dy="11.7">Вмикає прапорець збереження</tspan><tspan x="330.0" dy="11.7">Permitted capabilities при скиданні UID.</tspan></text>
<line x1="423.0" y1="190.0" x2="437.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="530.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Очищення груп</text>
<rect x="450.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="530.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">setgroups(0, NULL)</tspan><tspan x="530.0" dy="11.7">initgroups(user, gid)</tspan><tspan x="530.0" dy="11.7">Скидає додаткові групи root;</tspan><tspan x="530.0" dy="11.7">ОБОВ'ЯЗКОВО до скидання UID!</tspan></text>
<line x1="623.0" y1="190.0" x2="637.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="730.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Скидання GID та UID</text>
<rect x="650.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="730.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">setresgid(gid, gid, gid)</tspan><tspan x="730.0" dy="11.7">setresuid(uid, uid, uid)</tspan><tspan x="730.0" dy="11.7">Атомарно встановлює Real, Effective</tspan><tspan x="730.0" dy="11.7">та Saved ID у непривілейовані.</tspan></text>
<line x1="823.0" y1="190.0" x2="837.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="840.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="930.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Фіксація Caps</text>
<rect x="850.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#eaf6ef" stroke="none" stroke-width="1.5"/><text x="930.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">cap_set_proc(desired_caps)</tspan><tspan x="930.0" dy="11.7">Скидає непотрібні права (CAP_SYS_ADMIN);</tspan><tspan x="930.0" dy="11.7">залишає лише CAP_NET_BIND_SERVICE.</tspan></text>
<line x1="1023.0" y1="190.0" x2="1037.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1040.0" y="75.0" width="180.0" height="230.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="1130.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">6. Seccomp-BPF</text>
<rect x="1050.0" y="117.0" width="160.0" height="178.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="1.5"/><text x="1130.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">prctl(PR_SET_NO_NEW_PRIVS, 1)</tspan><tspan x="1130.0" dy="11.7">seccomp(SECCOMP_SET_MODE_FILTER)</tspan><tspan x="1130.0" dy="11.7">Забороняє повернення прав і обмежує syscalls.</tspan></text>
<rect x="50.0" y="330.0" width="1160.0" height="360.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="630.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Критичні пастки та інваріанти скидання привілеїв</text>
<rect x="70.0" y="385.0" width="1120.0" height="64.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">• Порушення порядку викликів:</text>
<rect x="90.0" y="413.0" width="1080.0" height="32.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="630.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Якщо викликати setresuid() до setgroups(), процес втрачає привілей CAP_SETGID і не може скинути групи суперкористувача. Зловмисник отримує доступ до файлів з GID 0 (root/wheel).</tspan></text>
<rect x="70.0" y="459.0" width="1120.0" height="64.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="481.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">• Використання застарілого setuid():</text>
<rect x="90.0" y="487.0" width="1080.0" height="32.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="630.0" y="506.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Класичний setuid() у разі помилки або в setuid-бінарниках може змінити лише Effective UID, залишаючи Saved UID = 0. Це дозволяє повернути root через повторний виклик seteuid(0).</tspan></text>
<rect x="70.0" y="533.0" width="1120.0" height="64.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">• Очищення Capabilities ядром:</text>
<rect x="90.0" y="561.0" width="1080.0" height="32.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="630.0" y="580.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">При переході UID 0 -&gt; non-zero ядро Linux за замовчуванням обнуляє всі маски Capabilities. Без prctl(PR_SET_KEEPCAPS, 1) процес втрачає право прив'язки до привілейованих портів.</tspan></text>
<rect x="70.0" y="607.0" width="1120.0" height="64.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.0"/>
<text x="90.0" y="629.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">• Відсутність PR_SET_NO_NEW_PRIVS:</text>
<rect x="90.0" y="635.0" width="1080.0" height="32.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="630.0" y="654.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Без встановлення цього прапорця непривілейований процес не може завантажити Seccomp-BPF фільтр, або залишається вразливим до виконання setuid-програм із підвищенням прав.</tspan></text>
</svg>