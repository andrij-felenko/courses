<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ЯТИФАЗНИЙ ПРОТОКОЛ ШТАТНОГО ВИМИКАННЯ СЕРВІСУ</text>
<rect x="40.0" y="70.0" width="180.0" height="180.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="130.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ФАЗА 1</text>
<text x="130.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнал зупинки</text>
<text x="130.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">SIGTERM / SIGINT</tspan><tspan x="130.0" dy="14.3">Перевід стану в STOPPING</tspan><tspan x="130.0" dy="14.3">Збереження причини</tspan><tspan x="130.0" dy="14.3">Асинхронний перехід</tspan></text>
<line x1="224.0" y1="160.0" x2="252.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="256.0" y="70.0" width="180.0" height="180.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.8"/>
<text x="346.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4ac0d" text-anchor="middle" font-weight="700">ФАЗА 2</text>
<text x="346.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупинка входу</text>
<text x="346.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="346.0" dy="0.0">close(listen_fd)</tspan><tspan x="346.0" dy="14.3">Від'єднання від балансера</tspan><tspan x="346.0" dy="14.3">Healthcheck -&gt; 503</tspan><tspan x="346.0" dy="14.3">Відхилення нових запитів</tspan></text>
<line x1="440.0" y1="160.0" x2="468.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="472.0" y="70.0" width="180.0" height="180.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="562.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ФАЗА 3</text>
<text x="562.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дренування робіт</text>
<text x="562.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Доопрацювання in-flight</tspan><tspan x="562.0" dy="14.3">HTTP/2 GOAWAY фрейм</tspan><tspan x="562.0" dy="14.3">Connection: close</tspan><tspan x="562.0" dy="14.3">Завершення транзакцій</tspan></text>
<line x1="656.0" y1="160.0" x2="684.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="688.0" y="70.0" width="180.0" height="180.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/>
<text x="778.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ФАЗА 4</text>
<text x="778.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупинка потоків</text>
<text x="778.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">stop_token / eventfd</tspan><tspan x="778.0" dy="14.3">Пробудження фону</tspan><tspan x="778.0" dy="14.3">pthread_join() / waitpid</tspan><tspan x="778.0" dy="14.3">Збір дочірніх процесів</tspan></text>
<line x1="872.0" y1="160.0" x2="900.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="904.0" y="70.0" width="140.0" height="180.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="974.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ФАЗА 5</text>
<text x="974.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Очищення</text>
<text x="974.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="974.0" dy="0.0">fflush() / fsync()</tspan><tspan x="974.0" dy="14.3">flock(LOCK_UN)</tspan><tspan x="974.0" dy="14.3">unlink(pidfile)</tspan><tspan x="974.0" dy="14.3">exit(0)</tspan></text>
<rect x="40.0" y="276.0" width="1004.0" height="250.0" rx="8" fill="#fbfcff" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельний таймер безпеки (Watchdog vs SIGKILL)</text>
<rect x="70.0" y="328.0" width="430.0" height="172.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="285.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ШТАТНИЙ СЦЕНАРІЙ (Успіх)</text>
<text x="285.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">1. Усі клієнти отримали коректні відповіді на запити</tspan><tspan x="285.0" dy="15.5">2. Журнали скинуто на диск без обриву байтів</tspan><tspan x="285.0" dy="15.5">3. Відкриті з'єднання закриті чотиристороннім FIN-обміном</tspan><tspan x="285.0" dy="15.5">4. Процес повертає ядру код 0 до вичерпання ліміту часу</tspan></text>
<rect x="540.0" y="328.0" width="470.0" height="172.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="775.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЕСКАЛАЦІЯ ПРИ ЗАВИСАННІ (Таймаут)</text>
<text x="775.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">1. Завислий клієнт або заблокований м'ютекс гальмують вихід</tspan><tspan x="775.0" dy="15.5">2. Внутрішній таймер (timerfd) перериває затяжне дренування</tspan><tspan x="775.0" dy="15.5">3. Друк аварійного дампу пам'яті / стеку завислих потоків</tspan><tspan x="775.0" dy="15.5">4. Якщо процес не виходить сам — оркестратор надсилає SIGKILL</tspan></text>
</svg>