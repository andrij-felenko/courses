<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">МІСТ МІЖ СИГНАЛОМ ЯДРА ТА ГОЛОВНИМ ЦИКЛОМ ПОДІЙ</text>
<rect x="40.0" y="66.0" width="310.0" height="500.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="195.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Атомарний прапорець</text>
<text x="195.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пастка блокуючого сну</text>
<rect x="56.0" y="134.0" width="278.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="195.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Обробник сигналу:</tspan><tspan x="195.0" dy="14.3">static volatile sig_atomic_t g_quit = 1;</tspan><tspan x="195.0" dy="14.3">(async-signal-safe запис прапорця)</tspan></text>
<line x1="195.0" y1="230.0" x2="195.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="56.0" y="266.0" width="278.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="195.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Головний потік:</tspan><tspan x="195.0" dy="14.3">while (!g_quit) {</tspan><tspan x="195.0" dy="14.3">    epoll_wait(epfd, evs, 64, -1);</tspan><tspan x="195.0" dy="14.3">    // СПИТЬ У ВИКЛИКУ!</tspan><tspan x="195.0" dy="14.3">}</tspan></text>
<rect x="56.0" y="400.0" width="278.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">ДЕФЕКТ: сигнал приходить,</tspan><tspan x="195.0" dy="14.3">коли потік спить в epoll_wait.</tspan><tspan x="195.0" dy="14.3">Якщо прапорець виставлено,</tspan><tspan x="195.0" dy="14.3">але нових дескрипторів немає —</tspan><tspan x="195.0" dy="14.3">потік не прокинеться і зависне</tspan><tspan x="195.0" dy="14.3">до зовнішньої мережевої події!</tspan></text>
<rect x="385.0" y="66.0" width="310.0" height="500.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="540.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Self-Pipe Trick</text>
<text x="540.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Портативний стандарт POSIX</text>
<rect x="401.0" y="134.0" width="278.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="540.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Обробник сигналу:</tspan><tspan x="540.0" dy="14.3">write(g_pipe_write_fd, &quot;x&quot;, 1);</tspan><tspan x="540.0" dy="14.3">(виклик write є безпечним</tspan><tspan x="540.0" dy="14.3">в обробнику сигналу)</tspan></text>
<line x1="540.0" y1="230.0" x2="540.0" y2="260.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="401.0" y="266.0" width="278.0" height="120.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="540.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Головний потік в epoll:</tspan><tspan x="540.0" dy="13.0">1. epoll_wait прокидається на pipe_read_fd</tspan><tspan x="540.0" dy="13.0">2. read(pipe_read_fd, buf, 1)</tspan><tspan x="540.0" dy="13.0">3. Запуск штатного вимикання</tspan></text>
<rect x="401.0" y="400.0" width="278.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="443.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ПЕРЕВАГИ:</tspan><tspan x="540.0" dy="14.3">- Миттєве пробудження epoll</tspan><tspan x="540.0" dy="14.3">- Код вимикання виконується</tspan><tspan x="540.0" dy="14.3">  у безпечному просторі користувача</tspan><tspan x="540.0" dy="14.3">- Повна підтримка heap, locks, C++</tspan><tspan x="540.0" dy="14.3">- Працює на Linux, BSD, macOS</tspan></text>
<rect x="730.0" y="66.0" width="310.0" height="500.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="885.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. signalfd / Сигнальний потік</text>
<text x="885.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ідіоматичний підхід Linux</text>
<rect x="746.0" y="134.0" width="278.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="885.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Блокування сигналів:</tspan><tspan x="885.0" dy="13.0">pthread_sigmask(SIG_BLOCK, &amp;mask, NULL);</tspan><tspan x="885.0" dy="13.0">int sfd = signalfd(-1, &amp;mask, SFD_NONBLOCK);</tspan></text>
<line x1="885.0" y1="230.0" x2="885.0" y2="260.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="746.0" y="266.0" width="278.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="885.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Дескриптор в epoll:</tspan><tspan x="885.0" dy="14.3">1. sfd додається до epoll_ctl()</tspan><tspan x="885.0" dy="14.3">2. Сигнал приходить як read-подія</tspan><tspan x="885.0" dy="14.3">3. read(sfd, &amp;siginfo, sizeof(siginfo))</tspan></text>
<rect x="746.0" y="400.0" width="278.0" height="150.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="452.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">ІДЕАЛЬНА БЕЗПЕКА:</tspan><tspan x="885.0" dy="13.0">- Жодного обробника сигналів</tspan><tspan x="885.0" dy="13.0">- Нуль ризиків асинхронної реентрабельності</tspan><tspan x="885.0" dy="13.0">- Сигнал — це звичайний потік байтів</tspan><tspan x="885.0" dy="13.0">- Повні метадані (PID відправника, UID)</tspan></text>
</svg>