<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЧАСОВА ШКАЛА ЕСКАЛАЦІЇ ДЕДЛАЙНІВ ВИМИКАННЯ</text>
<line x1="80.0" y1="140.0" x2="1000.0" y2="140.0" stroke="#333333" stroke-width="3.0"/>
<line x1="990.0" y1="140.0" x2="1010.0" y2="140.0" stroke="#333333" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1020.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час t</text>
<circle cx="120.0" cy="140.0" r="8.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="120.0" y1="90.0" x2="120.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
<rect x="45.0" y="50.0" width="150.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="65.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">t = 0 c</tspan><tspan x="120.0" dy="14.3">SIGTERM / SIGINT</tspan></text>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початок зупинки</text>
<text x="120.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Закриття listen_fd</text>
<circle cx="360.0" cy="140.0" r="8.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<line x1="360.0" y1="90.0" x2="360.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<rect x="280.0" y="50.0" width="160.0" height="38.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="66.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">t = 2.4 c (Штатний вихід)</tspan><tspan x="360.0" dy="11.7">exit(0)</tspan></text>
<text x="360.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Дренування завершено</text>
<text x="360.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Всі з'єднання закриті</text>
<circle cx="640.0" cy="140.0" r="8.0" fill="#d4ac0d" stroke="#333333" stroke-width="1.5"/>
<line x1="640.0" y1="90.0" x2="640.0" y2="130.0" stroke="#d4ac0d" stroke-width="1.8" stroke-dasharray="4,3"/>
<rect x="560.0" y="50.0" width="160.0" height="38.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="640.0" y="66.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d4ac0d" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">t = 15 c (Поріг тривоги)</tspan><tspan x="640.0" dy="11.7">Warning / Thread Dump</tspan></text>
<text x="640.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d4ac0d" text-anchor="middle" font-weight="700">Виявлено завислі задачі</text>
<text x="640.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Логування активних fd</text>
<circle cx="820.0" cy="140.0" r="8.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="820.0" y1="90.0" x2="820.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
<rect x="735.0" y="50.0" width="170.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="66.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">t = 25 c (Внутрішній ліміт)</tspan><tspan x="820.0" dy="11.7">Самозавершення _exit(1)</tspan></text>
<text x="820.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Watchdog timeout</text>
<text x="820.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Екстрене скидання стану</text>
<circle cx="960.0" cy="140.0" r="8.0" fill="#7b1113" stroke="#333333" stroke-width="1.5"/>
<line x1="960.0" y1="90.0" x2="960.0" y2="130.0" stroke="#7b1113" stroke-width="1.8" stroke-dasharray="4,3"/>
<rect x="880.0" y="50.0" width="160.0" height="38.0" rx="6" fill="#fdecea" stroke="#7b1113" stroke-width="1.5"/><text x="960.0" y="66.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7b1113" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">t = 30 c (Жорсткий ліміт)</tspan><tspan x="960.0" dy="11.7">Невідворотний SIGKILL</tspan></text>
<text x="960.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1113" text-anchor="middle" font-weight="700">Примусове вбивство</text>
<text x="960.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">systemd / Kubernetes</text>
<rect x="60.0" y="230.0" width="440.0" height="230.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="280.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЗОНА БЕЗПЕКИ ТА ШТАТНОГО ДРЕНУВАННЯ</text>
<text x="280.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">• Процес зупиняє прийом нових запитів негайно після SIGTERM</tspan><tspan x="280.0" dy="16.1">• Клієнтам надається вікно на завершення передачі даних</tspan><tspan x="280.0" dy="16.1">• У 99.9% випадків процес самостійно виходить за 0.5 - 3 секунди</tspan><tspan x="280.0" dy="16.1">• Жодних обірваних транзакцій чи пошкоджених файлів</tspan><tspan x="280.0" dy="16.1">• Балансувальник навантаження плавно перемикає трафік</tspan></text>
<rect x="540.0" y="230.0" width="480.0" height="230.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="780.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗОНА РИЗИКУ ТА ЗАХИСНОЇ ЕСКАЛАЦІЇ</text>
<text x="780.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">• Зависання трапляється через deadlock, повільний I/O або витік</tspan><tspan x="780.0" dy="16.1">• Внутрішній таймер (t = 25 c) ПОВИНЕН спрацювати ДО SIGKILL (t = 30 c)</tspan><tspan x="780.0" dy="16.1">• Це дає шанс зафіксувати причину зависання у логах ядра/сервісу</tspan><tspan x="780.0" dy="16.1">• Зовнішній SIGKILL знищує процес миттєво без виклику коду очищення,</tspan><tspan x="780.0" dy="16.1">  залишаючи сміття на диску та скидаючи з'єднання пакетом TCP RST</tspan></text>
</svg>